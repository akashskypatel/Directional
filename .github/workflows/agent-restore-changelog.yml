name: Agent Restore Protected Changelog

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/restore-changelog.txt

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout current branch with history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Restore exact pre-accident protected changelog
        shell: bash
        run: |
          set -Eeuo pipefail
          protected_ref=48f09b1c555299229b5cfc0793767fa8d4d5e936
          expected_blob=e8642e95a0c5429c3f795dff5acf40fe09bda5cf
          git cat-file -e "$protected_ref^{commit}"
          actual_blob=$(git rev-parse "$protected_ref:.agents/Directional/CHANGELOG.md")
          test "$actual_blob" = "$expected_blob"
          git checkout "$protected_ref" -- .agents/Directional/CHANGELOG.md
          restored_blob=$(git hash-object .agents/Directional/CHANGELOG.md)
          test "$restored_blob" = "$expected_blob"
          git diff --check -- .agents/Directional/CHANGELOG.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f .agents/Directional/CHANGELOG.md
          git commit -m 'docs(surface-cell): restore exact protected changelog history'
          git push origin "HEAD:$GITHUB_REF_NAME"
