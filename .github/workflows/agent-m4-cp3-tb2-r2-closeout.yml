name: Agent M4 CP3 TB2 R2 Closeout Apply

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m4-cp3-tb2-r2-closeout.txt

permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

concurrency:
  group: agent-m4-cp3-tb2-r2-closeout-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/agent-m4-cp3-tb2-r2-closeout.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m4-cp3-tb2-r2-closeout-r2
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  apply:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1UHDc-l2YlCPZfKUmnzTPLIug4wQaeUVX
      patch_sha256: e534103b268c120054ccf6acbf89e75743ef09255e25677aad0f793c1a248bc4
      base_sha: 1bfecc580c41f7ffa2bcdc4b48f9fe143e46a894
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: "docs: record M4-CP3-TB2-R2 green execution and hand off review"
    secrets: inherit
