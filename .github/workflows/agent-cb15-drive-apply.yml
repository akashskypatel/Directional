name: M3 CP4c3 CB15 Drive Apply

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/cb15-drive-apply/**

permissions:
  contents: write
  id-token: write

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/agent-cb15-drive-apply.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  apply:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1BLF0KoWvmaXNF1S-qDboh8PaRClNWawG
      patch_sha256: 39b9dcfc873ce00373566a6cec4cc41c753c24e145c09a55ddf0b375593d0a81
      base_sha: ab0501de362c3518f1f040015f19b64c179aa007
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: "M3-CP4c-3-CB15: fix GlobalTopologyArc test construction"
    secrets: inherit
