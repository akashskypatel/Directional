name: M3 CP4c3 CB15 Drive Apply

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/cb15-drive-apply/**

permissions:
  contents: write
  id-token: write

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/agent-cb15-drive-apply.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  apply:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1i2QRHc3qjqfP6-dYeOcNiVPo7yLu1WyP
      patch_sha256: 7ffc94777f4f47d7b877a62b4fa1faef400f52c1c56c8a1770699d3c709f66d5
      base_sha: a2fd98eaa015ff5872890bb1945cf4e9e9493615
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: "M3-CP4c-3-CB15: close Code+Build and freeze TB13"
    secrets: inherit
