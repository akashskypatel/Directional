name: M3 CP4c3 CB15 Drive Apply

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/cb15-drive-apply/**

permissions:
  contents: write
  id-token: write

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/agent-cb15-drive-apply.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  apply:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1WPWo0xL7VBBnUaBj7cYM47E-XfD513ih
      patch_sha256: 63f4c2d3aa00d95b2810082337691697a619ec1493dc730d7c696be722b679ab
      base_sha: 66d1440369d7160074b354923f7f36445d5c67e1
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: M3-CP4c-3-CB15: rank vertex trace rays by exact wedge geometry
    secrets: inherit
