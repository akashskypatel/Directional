name: Agent CB39 Exact Source Snapshot Caller

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/cb39-source-snapshot-20260906.txt

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: agent-cb39-source-snapshot
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/agent-cb39-source-snapshot-caller.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  snapshot:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-source-snapshot.yml
    with:
      source_ref: 0b4e41b2f9208beeeb0a42202c9219ebc18e5e70
      artifact_prefix: agent-source-snapshot-cb39
      retention_days: 7
    secrets: inherit
