name: TB38 Independent Review History Verification

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/review-history/tb38-rev-20261025.txt

permissions:
  contents: read
  actions: read

concurrency:
  group: tb38-review-history-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/tb38-review-history-20261025.yml
      source_ref: ${{ github.sha }}

  history:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Initialize independent review log
        shell: bash
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/tb38-review-history.log"
          : > "$log"
          {
            echo "repository=${GITHUB_REPOSITORY}"
            echo "event_sha=${GITHUB_SHA}"
            echo "workflow=${GITHUB_WORKFLOW}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } | tee -a "$log"
      - name: Checkout full authentic repository history
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          submodules: false
          lfs: false
          persist-credentials: false
      - name: Execute history-sensitive read-only checks
        shell: bash
        run: |
          set -uo pipefail
          log="${RUNNER_TEMP}/tb38-review-history.log"
          out="${RUNNER_TEMP}/tb38-review-history-result"
          mkdir -p "$out"
          set +e
          {
            echo "source_sha=$(git rev-parse HEAD)"
            echo "history_shallow=$(git rev-parse --is-shallow-repository)"
            echo "rewrite_base=$(git rev-parse 8b7299b43^{commit})"
            echo "rewrite_is_ancestor=$(git merge-base --is-ancestor 8b7299b43 HEAD; echo $?)"
            echo "source_is_ancestor=$(git merge-base --is-ancestor 038ae7fd7c290731c28225d2693a3e13866e325a HEAD; echo $?)"
            echo "git_status_before=$(git status --porcelain | wc -l)"
          } | tee -a "$log" > "$out/authority.txt"
          python3 .agents/Directional/tools/review_check.py authority 038ae7fd7c290731c28225d2693a3e13866e325a > "$out/authority-check.txt" 2>&1
          a=$?
          python3 .agents/Directional/tools/review_check.py boundary > "$out/boundary.txt" 2>&1
          b=$?
          python3 .agents/Directional/tools/review_check.py ledgers --base 8b7299b43 > "$out/ledgers.txt" 2>&1
          c=$?
          echo "authority_exit=$a" | tee -a "$log" "$out/exits.txt"
          echo "boundary_exit=$b" | tee -a "$log" "$out/exits.txt"
          echo "ledgers_exit=$c" | tee -a "$log" "$out/exits.txt"
          git status --porcelain > "$out/git-status-after.txt"
          echo "status_after_lines=$(wc -l < "$out/git-status-after.txt")" | tee -a "$log" "$out/exits.txt"
          ( cd "$out"; find . -type f ! -name SHA256SUMS -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > SHA256SUMS )
          cat "$out/exits.txt" | tee -a "$log"
          for f in authority-check boundary ledgers; do tail -n 8 "$out/${f}.txt" | tee -a "$log"; done
          if [[ "$a" -ne 0 || "$b" -ne 0 || "$c" -ne 0 || -s "$out/git-status-after.txt" ]]; then exit 1; fi
      - name: Upload history result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tb38-history-result-${{ github.run_id }}
          path: ${{ runner.temp }}/tb38-review-history-result/
          if-no-files-found: error
          retention-days: 14
      - name: Upload diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tb38-history-log-${{ github.run_id }}
          path: ${{ runner.temp }}/tb38-review-history.log
          if-no-files-found: error
          retention-days: 14

  mailbox:
    if: ${{ always() }}
    needs: [history]
    permissions:
      actions: read
      contents: write
    uses: ./.github/workflows/workflow-mailbox-publisher.yml
    with:
      mailbox_branch: workflow-mailbox
      workflow_key: m6-cp3-tb38-review-history
      source_sha: ${{ github.sha }}
      source_ref: ${{ github.ref }}
      result: ${{ needs.history.result }}
      summary: TB38 Review real-history authority boundary and ledgers verification.
