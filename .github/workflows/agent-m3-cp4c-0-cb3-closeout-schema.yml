name: Agent M3 CP4c 0 CB3 Closeout Schema Validation

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m3-cp4c-0-cb3-closeout-schema/run.txt

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: agent-m3-cp4c-0-cb3-closeout-schema-${{ github.ref }}
  cancel-in-progress: false

jobs:
  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m3-cp4c-0-cb3-closeout-schema
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  validate-self:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/agent-m3-cp4c-0-cb3-closeout-schema.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  validate-apply:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/agent-m3-cp4c-0-cb3-closeout-apply.yml
      source_ref: ${{ github.sha }}
    secrets: inherit
