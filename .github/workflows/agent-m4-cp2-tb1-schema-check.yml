name: M4 CP2 TB1 Workflow Schema Check

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m4-cp2-tb1-schema-check/trigger.txt

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: m4-cp2-tb1-schema-check-${{ github.ref }}
  cancel-in-progress: false

jobs:
  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m4-cp2-tb1-schema-check
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  validate-self:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/agent-m4-cp2-tb1-schema-check.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  validate-exec-draft:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .agents/Directional/turn-payloads/m4-cp2-tb1-exec-draft.yml
      source_ref: ${{ github.sha }}
    secrets: inherit
