name: M4 CP3 Amended Review Source Snapshot

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m4-cp3-amended-review-source-snapshot-20260911.txt

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: agent-m4-cp3-amended-review-source-snapshot-${{ github.ref }}
  cancel-in-progress: false

jobs:
  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m4-cp3-amended-review-source-snapshot
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/agent-m4-cp3-amended-review-source-snapshot.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  snapshot:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-source-snapshot.yml
    with:
      source_ref: 2a3dcd3cbfd4a862262f76efc10fbce975b7c154
      artifact_prefix: m4-cp3-amended-review-source
    secrets: inherit
