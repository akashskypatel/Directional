name: M3 CP4c3 CB19 Package 87

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m3-cp4c3-cb19-package87.txt

permissions:
  contents: write
  actions: read
  issues: write
  pull-requests: write

concurrency:
  group: m3-cp4c3-cb19-package87
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/m3-cp4c3-cb19-package87.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m3-cp4c3-cb19-package87
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  package:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Initialize package log
        shell: bash
        run: |
          set -euo pipefail
          : > "$RUNNER_TEMP/package87.log"
          printf '%s\n' \
            "workflow=$GITHUB_WORKFLOW" \
            "run_id=$GITHUB_RUN_ID" \
            'compile_run=33761967427' \
            'compile_artifact_id=9895999746' \
            'source_sha=bf971a6c9ad55e9c06c58f9fc73e9112808e5a1e' \
            'selected_gate=NONE' \
            'gate_execution_authorized=false' \
            'runtimeExecution=false' \
            'packageRepair=false' | tee -a "$RUNNER_TEMP/package87.log"

      - name: Verify immutable compile artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee -a "$RUNNER_TEMP/package87.log") 2>&1
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/9895999746" > "$RUNNER_TEMP/compile-artifact.json"
          test "$(jq -r '.workflow_run.id' "$RUNNER_TEMP/compile-artifact.json")" = 33761967427
          test "$(jq -r '.name' "$RUNNER_TEMP/compile-artifact.json")" = 'm3-cp4c3-cb19-compile-result-33761967427'
          test "$(jq -r '.digest' "$RUNNER_TEMP/compile-artifact.json")" = 'sha256:71b268f187b39ce547648c27543913e8fdef0bb1087eaaeca0d2948ce020c990'
          test "$(jq -r '.expired' "$RUNNER_TEMP/compile-artifact.json")" = false
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/9895999746/zip" > "$RUNNER_TEMP/compile-result.zip"
          rm -rf "$RUNNER_TEMP/raw" && mkdir -p "$RUNNER_TEMP/raw"
          unzip -q "$RUNNER_TEMP/compile-result.zip" -d "$RUNNER_TEMP/raw"

      - name: Build immutable package 87
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee -a "$RUNNER_TEMP/package87.log") 2>&1
          raw="$RUNNER_TEMP/raw"
          source_sha=bf971a6c9ad55e9c06c58f9fc73e9112808e5a1e
          test "$(cat "$raw/metadata/source-commit.txt")" = "$source_sha"
          (cd "$raw" && sha256sum -c SHA256SUMS)
          grep -qx 'runtimeExecution=false' "$raw/metadata/command-boundary.txt"
          grep -qx 'turnBoundary=Code+Build-only' "$raw/metadata/command-boundary.txt"
          grep -qx 'exactArithmeticBackend=GMP' "$raw/metadata/command-boundary.txt"
          grep -qi gmpxx "$raw/metadata/gmp-evidence.txt"
          grep -qi gmp "$raw/metadata/gmp-evidence.txt"
          test "$(cat "$raw/metadata/build-exit-code.txt")" = 0
          test "$(cat "$raw/metadata/preflight-exit-code.txt")" = 0
          for status in "$raw"/metadata/source-status-*.txt; do test ! -s "$status"; done
          expected='directional_core directional_pipeline directional_surface_cell_authority_kernel_tests directional_surface_cell_producer_tests directional_surface_cell_completion_tests directional_surface_cell_validation_tests directional_compiled_api_tests directional_benchmarks'
          test "$(tr '\n' ' ' < "$raw/metadata/compiled-targets.txt" | sed 's/ $//')" = "$expected"
          for exe in directional_surface_cell_authority_kernel_tests directional_surface_cell_producer_tests directional_surface_cell_completion_tests directional_surface_cell_validation_tests directional_compiled_api_tests directional_benchmarks; do test -x "$raw/bin/$exe"; done

          source_archive="$raw/source/source-$source_sha.tar.gz"
          src="$RUNNER_TEMP/source-tree"
          rm -rf "$src" && mkdir -p "$src"
          tar -xzf "$source_archive" -C "$src"
          s365="$src/.agents/Directional/Architecture_M3_CP4c2_Required_Green_Selector_365.txt"
          test "$(sha256sum "$s365" | awk '{print $1}')" = 6b5b6555d39c250c24cbf3faeafdeca93b4b11379118a29583253e6cfc14b8a1
          test "$(wc -l < "$s365" | tr -d ' ')" = 365
          for spec in \
            '380 1a95d32852507441c10c0c81154a595ebc367fe4137143ec9290d85d852a0e4e' \
            '381 af667aae37dc6c2342c8f084b4c7ff97719798d76bce5cbb34163afecdd38d90' \
            '382 f30d5d5625682d928a4878e0139e6b04c9e9082f58e8a545c49c8a350d665a1a'; do
            set -- $spec
            f="$src/.agents/Directional/Architecture_M3_CP4c3_Required_Green_Selector_$1.txt"
            test "$(sha256sum "$f" | awk '{print $1}')" = "$2"
            test "$(wc -l < "$f" | tr -d ' ')" = "$1"
          done
          s380="$src/.agents/Directional/Architecture_M3_CP4c3_Required_Green_Selector_380.txt"
          s381="$src/.agents/Directional/Architecture_M3_CP4c3_Required_Green_Selector_381.txt"
          s382="$src/.agents/Directional/Architecture_M3_CP4c3_Required_Green_Selector_382.txt"
          head -n 365 "$s382" | cmp - "$s365"
          head -n 380 "$s382" | cmp - "$s380"
          head -n 381 "$s382" | cmp - "$s381"

          out="$RUNNER_TEMP/package87"
          rm -rf "$out" && mkdir -p "$out/package87/test-data/benchmarks"
          cp -a "$raw/bin" "$raw/lib" "$raw/metadata" "$raw/source" "$out/package87/"
          cp -a "$src/benchmarks/fixtures" "$out/package87/test-data/benchmarks/fixtures"
          fixture_count="$(find "$out/package87/test-data/benchmarks/fixtures" -type f | wc -l | tr -d ' ')"
          test "$fixture_count" = 27
          printf '%s\n' \
            'package=87' \
            "source_commit=$source_sha" \
            'fixture_count=27' \
            'fixture_authority=package-relative' \
            'selector=382' \
            'selector_sha256=f30d5d5625682d928a4878e0139e6b04c9e9082f58e8a545c49c8a350d665a1a' \
            'accepted_selector_365_sha256=6b5b6555d39c250c24cbf3faeafdeca93b4b11379118a29583253e6cfc14b8a1' \
            'selected_gate=NONE' \
            'gate_execution_authorized=false' \
            'non_gating_diagnostic_identity=GlobalTopologyPlan.MechanicalWitnessStageReachabilityIsObservable' \
            'runtimeExecution=false' \
            'packageRepair=false' > "$out/package87/metadata/fixture-package-contract.txt"
          printf '%s\n' \
            'runtimeExecution=false' \
            'turnBoundary=Code+Build-only' \
            'exactArithmeticBackend=GMP' \
            'modePreservingEnvelope=true' \
            'semanticContracts=compiled-not-executed' > "$out/package87/metadata/package-envelope.txt"
          (cd "$out/package87" && find . -type f ! -name SHA256SUMS -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > SHA256SUMS && sha256sum -c SHA256SUMS)
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner -czf "$out/package87.tar.gz" -C "$out" package87
          sha256sum "$out/package87.tar.gz" > "$out/package87.sha256"
          sha256sum "$source_archive" > "$out/source-archive.sha256"
          printf '%s\n' 'runtimeExecution=false' 'packageRepair=false' 'No Directional binary was executed while packaging.' > "$out/package87-boundary.txt"
          echo "fixture_count=$fixture_count"
          echo "package87_sha256=$(awk '{print $1}' "$out/package87.sha256")"
          echo "source_archive_sha256=$(awk '{print $1}' "$out/source-archive.sha256")"
          echo 'runtimeExecution=false'

      - name: Upload package 87
        uses: actions/upload-artifact@v4
        with:
          name: m3-cp4c3-cb19-package87
          path: |
            ${{ runner.temp }}/package87/package87.tar.gz
            ${{ runner.temp }}/package87/package87.sha256
            ${{ runner.temp }}/package87/source-archive.sha256
            ${{ runner.temp }}/package87/package87-boundary.txt
          if-no-files-found: error
          retention-days: 14

      - name: Upload package log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-cp4c3-cb19-package87-log-${{ github.run_id }}
          path: ${{ runner.temp }}/package87.log
          if-no-files-found: error
          retention-days: 14
