    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m4-cp-scale-cb23-apply-20260918.txt

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

concurrency:
  group: m4-cp-scale-cb23-apply
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/m4-cp-scale-cb23-apply.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m4-cp-scale-cb23-apply
      commit_run_file: false
    secrets: inherit

  apply:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1-N0aghgQ1NXslClUZ5waSNi5p4dz-C5Z
      patch_sha256: ebaca5c8d29ed92293bc942a0fc80f99b009040dc28275863d192593b52ef11b
      base_sha: 8a49910bb31334cc26e056fb100ca24f2be8bd0b
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: M4-CP-SCALE-CB23 implement source-boundary global cycle authority
    secrets: inherit
