name: Agent Reusable Run Observer

on:
  workflow_call:
    inputs:
      pr_number:
        required: false
        type: number
        default: 0
      report_branch:
        required: false
        type: string
        default: ""
      commit_run_file:
        required: false
        type: boolean
        default: false
      label:
        required: false
        type: string
        default: agent-workflow
    secrets:
      GH_TOKEN:
        required: false

jobs:
  pr-comment:
    if: ${{ inputs.pr_number > 0 }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Report run ID on PR
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
          TOKEN_SOURCE: ${{ secrets.GH_TOKEN != '' && 'GH_TOKEN-secret' || 'github-token' }}
          PR_NUMBER: ${{ inputs.pr_number }}
          REPORT_LABEL: ${{ inputs.label }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
            --method POST \
            --field "body=[agent-run] ${REPORT_LABEL}: run_id=${RUN_ID}; event=${EVENT_NAME}; event_sha=${EVENT_SHA}; url=${RUN_URL}; token_source=${TOKEN_SOURCE}"

  branch-file:
    if: ${{ inputs.commit_run_file && inputs.report_branch != '' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout exact event commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN || github.token }}

      - name: Commit temporary run observation file
        env:
          TOKEN_SOURCE: ${{ secrets.GH_TOKEN != '' && 'GH_TOKEN-secret' || 'github-token' }}
          REPORT_LABEL: ${{ inputs.label }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SHA: ${{ github.sha }}
          REPORT_BRANCH: ${{ inputs.report_branch }}
        shell: bash
        run: |
          set -euo pipefail
          remote_sha="$(git ls-remote origin "refs/heads/${REPORT_BRANCH}" | cut -f1)"
          test -n "$remote_sha"
          test "$remote_sha" = "$EVENT_SHA"
          path=".agents/workflow-observation/run-${RUN_ID}.txt"
          mkdir -p "$(dirname "$path")"
          printf '%s\n' \
            "run_id=${RUN_ID}" \
            "run_url=${RUN_URL}" \
            "event=${EVENT_NAME}" \
            "event_sha=${EVENT_SHA}" \
            "branch=${REPORT_BRANCH}" \
            "label=${REPORT_LABEL}" \
            "token_source=${TOKEN_SOURCE}" > "$path"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$path"
          git commit -m "ci: report workflow run ${RUN_ID}"
          git push origin "HEAD:${REPORT_BRANCH}"
