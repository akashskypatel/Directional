name: Agent Reusable Run Observer

on:
  workflow_call:
    inputs:
      pr_number:
        required: false
        type: number
        default: 0
      report_branch:
        required: false
        type: string
        default: ""
      commit_run_file:
        required: false
        type: boolean
        default: false
      label:
        required: false
        type: string
        default: agent-workflow
      trim_stale_comments:
        description: Delete stale github-actions[bot] PR comments before posting the current run observation.
        required: false
        type: boolean
        default: true
    secrets:
      GH_TOKEN:
        required: false

jobs:
  pr-comment:
    if: ${{ inputs.pr_number > 0 }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Initialize diagnostic log
        shell: bash
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/agent-run-observer-pr-comment.log"
          : > "$log"
          {
            echo "workflow=${GITHUB_WORKFLOW}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "event=${GITHUB_EVENT_NAME}"
            echo "event_sha=${GITHUB_SHA}"
            echo "repository=${GITHUB_REPOSITORY}"
            echo "pr_number=${{ inputs.pr_number }}"
            echo "label=${{ inputs.label }}"
            echo "trim_stale_comments=${{ inputs.trim_stale_comments }}"
            echo "started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } | tee -a "$log"

      - name: Delete stale GitHub Actions bot PR comments
        id: trim
        if: ${{ inputs.trim_stale_comments }}
        continue-on-error: true
        uses: maheshrayas/action-pr-comment-delete@v3.0
        with:
          github_token: ${{ github.token }}
          org: ${{ github.repository_owner }}
          repo: ${{ github.event.repository.name }}
          user: github-actions[bot]
          issue: ${{ inputs.pr_number }}

      - name: Record stale-comment trim outcome
        if: always()
        env:
          TRIM_OUTCOME: ${{ steps.trim.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/agent-run-observer-pr-comment.log"
          {
            echo "trim_outcome=${TRIM_OUTCOME:-skipped}"
            echo "trim_target_user=github-actions[bot]"
          } | tee -a "$log"

      - name: Report run ID on PR
        env:
          GH_TOKEN: ${{ github.token }}
          TOKEN_SOURCE: github-token
          PR_NUMBER: ${{ inputs.pr_number }}
          REPORT_LABEL: ${{ inputs.label }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/agent-run-observer-pr-comment.log"
          exec > >(tee -a "$log") 2>&1
          trap 'status=$?; echo "pr_comment_exit=${status}"' EXIT
          gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
            --method POST \
            --field "body=[agent-run] ${REPORT_LABEL}: run_id=${RUN_ID}; event=${EVENT_NAME}; event_sha=${EVENT_SHA}; url=${RUN_URL}; token_source=${TOKEN_SOURCE}"

      - name: Record final PR observer status
        if: always()
        shell: bash
        run: |
          set +e
          log="${RUNNER_TEMP}/agent-run-observer-pr-comment.log"
          {
            echo "final_job_status=${{ job.status }}"
            echo "finished_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } | tee -a "$log"

      - name: Upload PR observer diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-run-observer-pr-comment-log-${{ github.run_id }}
          path: ${{ runner.temp }}/agent-run-observer-pr-comment.log
          if-no-files-found: error
          retention-days: 7

  branch-file:
    if: ${{ inputs.commit_run_file && inputs.report_branch != '' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Initialize diagnostic log
        shell: bash
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/agent-run-observer-branch-file.log"
          : > "$log"
          {
            echo "workflow=${GITHUB_WORKFLOW}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "event=${GITHUB_EVENT_NAME}"
            echo "event_sha=${GITHUB_SHA}"
            echo "repository=${GITHUB_REPOSITORY}"
            echo "report_branch=${{ inputs.report_branch }}"
            echo "started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } | tee -a "$log"

      - name: Checkout exact event commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN || github.token }}

      - name: Commit temporary run observation file
        env:
          TOKEN_SOURCE: ${{ secrets.GH_TOKEN != '' && 'GH_TOKEN-secret' || 'github-token' }}
          REPORT_LABEL: ${{ inputs.label }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SHA: ${{ github.sha }}
          REPORT_BRANCH: ${{ inputs.report_branch }}
        shell: bash
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/agent-run-observer-branch-file.log"
          exec > >(tee -a "$log") 2>&1
          trap 'status=$?; echo "branch_file_exit=${status}"' EXIT
          remote_sha="$(git ls-remote origin "refs/heads/${REPORT_BRANCH}" | cut -f1)"
          test -n "$remote_sha"
          test "$remote_sha" = "$EVENT_SHA"
          path=".agents/workflow-observation/run-${RUN_ID}.txt"
          mkdir -p "$(dirname "$path")"
          printf '%s\n' \
            "run_id=${RUN_ID}" \
            "run_url=${RUN_URL}" \
            "event=${EVENT_NAME}" \
            "event_sha=${EVENT_SHA}" \
            "branch=${REPORT_BRANCH}" \
            "label=${REPORT_LABEL}" \
            "token_source=${TOKEN_SOURCE}" > "$path"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$path"
          git commit -m "ci: report workflow run ${RUN_ID}"
          git push origin "HEAD:${REPORT_BRANCH}"

      - name: Record final branch observer status
        if: always()
        shell: bash
        run: |
          set +e
          log="${RUNNER_TEMP}/agent-run-observer-branch-file.log"
          {
            echo "final_job_status=${{ job.status }}"
            echo "final_sha=$(git rev-parse HEAD 2>/dev/null || echo unavailable)"
            git status --short 2>&1 || true
            echo "finished_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } | tee -a "$log"

      - name: Upload branch observer diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-run-observer-branch-file-log-${{ github.run_id }}
          path: ${{ runner.temp }}/agent-run-observer-branch-file.log
          if-no-files-found: error
          retention-days: 7
