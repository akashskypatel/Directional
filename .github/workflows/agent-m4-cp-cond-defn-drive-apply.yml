name: Agent M4 CP COND DEFN Drive Apply

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/patch/m4-cp-cond-defn/**

permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/agent-m4-cp-cond-defn-drive-apply.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m4-cp-cond-defn-drive-apply
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  apply:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 19JiD9HSlPiPPLgNj8XeMUwdeXgtMKEsP
      patch_sha256: f1f20656789414c59c6e3f63427a3b59b57d0d6b912c02efc763bae9018b3d46
      base_sha: ee89687cacc109308265ccaccd161f382f25c1fb
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: docs: freeze M4 CP-COND definition
    secrets: inherit
