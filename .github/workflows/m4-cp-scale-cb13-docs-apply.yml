name: M4 CP SCALE CB13 Docs Apply

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m4-cp-scale-cb13-docs-apply-20260917.txt

permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

concurrency:
  group: m4-cp-scale-cb13-docs-apply
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/m4-cp-scale-cb13-docs-apply.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m4-cp-scale-cb13-docs-apply
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  apply:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1OAnqJcBNgt8rfHvgk-nS3TfyME5UR1fd
      patch_sha256: 40c70d7223700676e1298f38fdc875103b12c1481c166c3419c8d8cdb7cd72fd
      base_sha: d65ea2071990a443750ca7d84a43b63630fbdad4
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: "docs: close M4 CP-SCALE CB13 and hand off TB12"
    secrets: inherit
