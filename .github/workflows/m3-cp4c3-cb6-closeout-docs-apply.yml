name: M3 CP4c3 CB6 Closeout Docs Apply

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m3-cp4c3-cb6-closeout-docs-20260831.txt

permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

concurrency:
  group: m3-cp4c3-cb6-closeout-docs
  cancel-in-progress: false

jobs:
  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m3-cp4c3-cb6-closeout-docs
      commit_run_file: false
    secrets: inherit

  validate-caller:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/m3-cp4c3-cb6-closeout-docs-apply.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  apply:
    needs: validate-caller
    if: ${{ needs.validate-caller.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1yjUHcdW-NP2vBGlcxdPYbaFu1SwCqMis
      patch_sha256: 48eb0cb7f597843d47347be095c3ecda4cf250ad8e4982164ba2dfaee112b3af
      base_sha: d8a1c733c8f85b6bc8729a7efce7be13fc53f961
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: "docs: close M3-CP4c-3-CB6 and freeze TB5 plan"
    secrets: inherit
