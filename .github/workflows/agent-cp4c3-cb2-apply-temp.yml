name: Agent CP4c3 CB2 Apply

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/cp4c3-cb2-apply/run.txt

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

concurrency:
  group: agent-cp4c3-cb2-apply
  cancel-in-progress: false

jobs:
  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: cp4c3-cb2-apply
      commit_run_file: false
    secrets: inherit

  validate_caller:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/agent-cp4c3-cb2-apply-temp.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  apply:
    needs: validate_caller
    if: ${{ needs.validate_caller.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1pynFuo9ghwCfJvmUtvPK5pE0TzeUKNCe
      patch_sha256: 2ac36d8b615008d59a69aa0beb908a6bc93b65f0ceb3869459f9af7ddb644b07
      base_sha: d260f6a9c0bc60946b1c4d30ed77f9e838552ab6
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: 'feat: implement M3-CP4c-3 Amendment 15 transport cut'
      retention_days: 14
    secrets: inherit
