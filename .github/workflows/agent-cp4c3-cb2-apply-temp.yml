name: Agent CP4c3 CB2 Apply

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/cp4c3-cb2-apply/run.txt

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

concurrency:
  group: agent-cp4c3-cb2-apply
  cancel-in-progress: false

jobs:
  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: cp4c3-cb2-apply
      commit_run_file: false
    secrets: inherit

  validate_caller:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/agent-cp4c3-cb2-apply-temp.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  apply:
    needs: validate_caller
    if: ${{ needs.validate_caller.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1m3jgrVQyOyvMzhiXFzs-EpX5dPTz9qjT
      patch_sha256: ba1abaaa3649682950adb7c9b81ae4fb3ff02eb6578e138ed5ff53803d2f3042
      base_sha: 4250f1bf87f2aca21a8a72bdf20d2b5d47b9a719
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: 'fix: initialize CP4c3 CB2 transport diagnostics'
      retention_days: 14
    secrets: inherit
