    with:
      workflow_path: .github/workflows/m6-cp1-cb6-a6-drive-apply.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
