name: M5 CP3 CB18 Docs Patch Apply

on:
  push:
    branches: [agent/surface_cell_quad/p5-recover-bridge-healing]
    paths: [.agents/connector-triggers/m5-cp3-cb18-docs-apply.txt]

permissions:
  actions: read
  contents: write
  id-token: write
  issues: write
  pull-requests: write

concurrency:
  group: m5-cp3-cb18-docs-apply-${{ github.ref }}
  cancel-in-progress: false

jobs:
  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m5-cp3-cb18-docs-apply
      commit_run_file: false
      trim_stale_comments: false
    secrets: inherit

  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/m5-cp3-cb18-docs-apply.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  apply:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1Fc2GSFisMsouC6TzOuS2uQbtFtueiPMO
      patch_sha256: e3f23c87d2535426846a580d1fc22b0fae818099a3e41afa2b2b33ef022f35b6
      base_sha: 7696b366bf6aa8e836f2bda6763f42a5c4898b54
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: 'M5-CP3-CB18: close control-plane correction'
      retention_days: 7
    secrets: inherit
