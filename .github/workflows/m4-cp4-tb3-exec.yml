name: M4 CP4 TB3 EXEC

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m4-cp4-tb3-exec-20260919.txt

permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: m4-cp4-tb3-exec-${{ github.ref }}
  cancel-in-progress: false

jobs:
  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m4-cp4-tb3-exec
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/m4-cp4-tb3-exec.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  execute:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Initialize diagnostic log
        shell: bash
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/m4-cp4-tb3-exec-workflow.log"
          : > "$log"
          {
            echo "workflow=${GITHUB_WORKFLOW}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "event=${GITHUB_EVENT_NAME}"
            echo "event_sha=${GITHUB_SHA}"
            echo "ref=${GITHUB_REF}"
            echo "turn=M4-CP4-TB3-EXEC"
            echo "turnBoundary=Test+Benchmark-artifact-only"
            echo "benchmarkExecutionCount=0"
            echo "started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } | tee -a "$log"

      - name: Checkout orchestration authority
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          submodules: false
          lfs: false
          token: ${{ secrets.GH_TOKEN || github.token }}

      - name: Verify immutable harness authority
        shell: bash
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/m4-cp4-tb3-exec-workflow.log"
          exec > >(tee -a "$log") 2>&1
          harness=".agents/Directional/turn-payloads/m4-cp4-tb3-exec-harness.sh"
          test -f "$harness"
          test "$(sha256sum "$harness" | awk '{print $1}')" = '5848a8d40d9bcf747d0a5cbba5436b0c6af12aa4768416333e7991dc328034a5'
          test "$(stat -c '%a' "$harness")" = '755'
          bash -n "$harness"
          if grep -En '(^|[^A-Za-z])timeout([^A-Za-z]|$)|timeout-minutes' "$harness"; then
            echo 'elapsed-time watchdog token found in TB3 harness' >&2
            exit 2
          fi
          echo "harness_sha256=$(sha256sum "$harness" | awk '{print $1}')"
          echo 'harness_syntax=pass'
          echo 'repository_timeout_watchdog=absent'
          git status --short

      - name: Execute immutable selector430 gate
        id: gate
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
        shell: bash
        run: |
          set -uo pipefail
          log="${RUNNER_TEMP}/m4-cp4-tb3-exec-workflow.log"
          harness=".agents/Directional/turn-payloads/m4-cp4-tb3-exec-harness.sh"
          set +e
          "$harness" 2>&1 | tee -a "$log"
          rc=${PIPESTATUS[0]}
          set -e
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          echo "tb3_harness_exit=$rc" | tee -a "$log"

      - name: Record final source status
        if: always()
        shell: bash
        run: |
          set +e
          log="${RUNNER_TEMP}/m4-cp4-tb3-exec-workflow.log"
          {
            echo "gate_step_outcome=${{ steps.gate.outcome }}"
            echo "gate_exit_code=${{ steps.gate.outputs.exit_code }}"
            echo "final_source_sha=$(git rev-parse HEAD 2>/dev/null || echo unavailable)"
            git status --short 2>&1 || true
            echo "finished_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } | tee -a "$log"

      - name: Upload TB3 result evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m4-cp4-tb3-exec-result-${{ github.run_id }}
          path: ${{ runner.temp }}/m4-cp4-tb3-exec-result
          if-no-files-found: error
          retention-days: 7

      - name: Upload TB3 diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m4-cp4-tb3-exec-log-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/m4-cp4-tb3-exec.log
            ${{ runner.temp }}/m4-cp4-tb3-exec-workflow.log
          if-no-files-found: error
          retention-days: 7

      - name: Propagate orchestration failure
        if: always()
        shell: bash
        run: |
          rc='${{ steps.gate.outputs.exit_code }}'
          test -n "$rc"
          if [[ "$rc" != '0' ]]; then
            echo "TB3 harness reported orchestration failure: exit=$rc" >&2
            exit "$rc"
          fi
          echo 'TB3 execution completed with orchestration-valid evidence; semantic disposition is deferred to Review.'
