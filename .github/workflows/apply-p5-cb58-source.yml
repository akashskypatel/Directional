name: Apply P5 CB58 Source Materialization

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - '.agents/Directional/p5-cb58-source.patch.gz.b64'

permissions:
  contents: write

jobs:
  materialize-source:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact working branch
        uses: actions/checkout@v4
        with:
          ref: agent/surface_cell_quad/p5-recover-bridge-healing
          fetch-depth: 1
          submodules: false

      - name: Apply source-only patch
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode .agents/Directional/p5-cb58-source.patch.gz.b64 |
            gzip --decompress > /tmp/p5-cb58-source.patch
          if grep -qE '^diff -ruN .*\.github/workflows/' /tmp/p5-cb58-source.patch; then
            echo 'Source materialization patch must not modify workflows.' >&2
            exit 1
          fi
          git apply --check /tmp/p5-cb58-source.patch
          git apply /tmp/p5-cb58-source.patch
          git diff --check

      - name: Commit materialized source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CMakeLists.txt include src tests
          git commit -m 'feat(surface-cells): bound P5 frontier memory and batching [skip ci]'
          git push origin HEAD:agent/surface_cell_quad/p5-recover-bridge-healing
