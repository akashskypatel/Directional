name: M4 CP1 CB3 WIP Apply

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m4-cp1-cb3-wip-apply-20260910.txt

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

concurrency:
  group: m4-cp1-cb3-wip-apply-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/m4-cp1-cb3-wip-apply.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m4-cp1-cb3-wip-apply
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  apply:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1BFK6AjTY-xxk3B7LIe3izPLV_gbbrcyz
      patch_sha256: '5cf618918eeedd85bc028de40ada33357f531de1c6bfbdd2b71537ac15cd75ff'
      base_sha: 2a098fbc044eec722168764f949a68f44cae0261
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: 'feat: implement M4 CP1 exact conformity schedule'
      retention_days: 14
    secrets: inherit
