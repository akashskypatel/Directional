name: Agent CB35 Compile

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/compile/cb35-20260905.txt

permissions:
  contents: write
  actions: write
  issues: write
  pull-requests: write

concurrency:
  group: agent-cb35-compile-temp
  cancel-in-progress: false

jobs:
  validate-caller:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/agent-cb35-compile-temp.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      commit_run_file: false
      label: m3-cp4c3-cb35-compile
    secrets: inherit

  compile:
    needs: validate-caller
    if: ${{ needs.validate-caller.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-compile-reusable.yml
    with:
      source_sha: ab86747bdfdb94c7c383bf5d2893ced4207eb555
      artifact_prefix: m3-cp4c3-cb35
    secrets: inherit
