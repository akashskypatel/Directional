name: M4 CP4 CB4 Drive Apply

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m4-cp4-cb4/drive-apply.txt

permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

concurrency:
  group: m4-cp4-cb4-drive-apply
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/m4-cp4-cb4-drive-apply.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m4-cp4-cb4-drive-apply
      commit_run_file: false
      trim_stale_comments: false
    secrets: inherit

  apply:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1zbBCSp7qVRWYgkmkbr42s6c3DgFXMYEB
      patch_sha256: '9b816ba1b2e722116ba6c56911bb378a36b444e4ba314db8a5e79db3d07b1b10'
      base_sha: ade03e08258edec729fe09407180d2e833b20dba
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: 'M4-CP4-CB4: correct focused test authority'
      retention_days: 14
    secrets: inherit
