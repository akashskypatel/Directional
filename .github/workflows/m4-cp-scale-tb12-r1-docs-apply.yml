    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/m4-cp-scale-tb12-r1-docs-apply.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m4-cp-scale-tb12-r1-docs-apply
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  apply:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1DDFNExZGb_cOKIRpNYEgX-yryR2XRsQz
      patch_sha256: 'a38078e2bffe80b3a4dd8786bc1da363dc8af933c6c10d7f0fdbe6aa22068850'
      base_sha: c2a1a0a54eed05ab71df2e7cf3a76bd089b87121
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: 'docs: record M4 CP-SCALE TB12 R1 semantic red'
      retention_days: 7
    secrets: inherit
