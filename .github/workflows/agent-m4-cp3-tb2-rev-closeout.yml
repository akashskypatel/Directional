name: Agent M4 CP3 TB2 REV Closeout

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m4-cp3-tb2-rev-closeout.txt

permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

concurrency:
  group: agent-m4-cp3-tb2-rev-closeout
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/agent-m4-cp3-tb2-rev-closeout.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m4-cp3-tb2-rev-closeout
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  apply:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 122MwOc90YaVa3rZI2NfFgCNw2_vcQapo
      patch_sha256: f601625ced023c96f1a835f58eb460407cfd2309c7ad1a802e63ce5af5da2192
      base_sha: 981ce365410688ee342ea3b798e4ceaff26cb024
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: "M4-CP3-TB2-REV: reject vacuous row400 proof and freeze TB2 planning"
    secrets: inherit
