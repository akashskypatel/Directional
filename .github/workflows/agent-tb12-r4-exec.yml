name: M4 CP SCALE TB12 R4 EXEC

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/tb12-r4-exec/M4-CP-SCALE-TB12-R4-EXEC.txt

permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: write

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/agent-tb12-r4-exec.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: tb12-r4-exec
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  execute:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact execution control
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Execute immutable TB12-R4 gates
        id: execute_r4
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: python3 .agents/Directional/turn-payloads/tb12-r4-exec.py
      - name: Upload TB12-R4 result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m4-cp-scale-tb12-r4-result-${{ github.run_id }}
          path: ${{ runner.temp }}/M4-CP-SCALE-TB12-R4-EXEC-result
          if-no-files-found: error
          retention-days: 7
      - name: Upload TB12-R4 log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m4-cp-scale-tb12-r4-log-${{ github.run_id }}
          path: ${{ runner.temp }}/M4-CP-SCALE-TB12-R4-EXEC.log
          if-no-files-found: error
          retention-days: 7
      - name: Fail on orchestration error
        if: always() && steps.execute_r4.outcome == 'failure'
        shell: bash
        run: exit 1
