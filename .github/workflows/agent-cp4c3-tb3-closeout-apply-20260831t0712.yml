name: M3 CP4c3 TB3 Closeout Apply

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/cp4c3-tb3-closeout-apply-20260831t0712.txt

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

concurrency:
  group: m3-cp4c3-tb3-closeout-apply-20260831t0712
  cancel-in-progress: false

jobs:
  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: cp4c3-tb3-closeout-apply
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  validate-caller:
