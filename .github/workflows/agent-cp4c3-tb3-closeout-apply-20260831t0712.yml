    secrets: inherit

  apply:
    needs: validate-caller
    if: ${{ needs.validate-caller.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 13f49vl0Rs-JamLitjuLCdfDdGYStkH_9
      patch_sha256: dcea012f0864a4a0212af1188d52056e3e77c336a7d3e3850a2a51ff5121a110
      base_sha: 3689773a684245f9c973dd1089b4c0edfcbeeef7
