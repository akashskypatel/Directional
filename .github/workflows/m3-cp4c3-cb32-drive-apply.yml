name: M3 CP4c3 CB32 Drive Apply

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m3-cp4c3-cb32-drive-apply-20260905.txt

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

concurrency:
  group: m3-cp4c3-cb32-drive-apply
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/m3-cp4c3-cb32-drive-apply.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: cb32-drive-apply
      commit_run_file: false
    secrets: inherit

  apply:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1eG0TV3WOyhHvF-sLzFhGwB0nHDC3dcPy
      patch_sha256: 8e363a2189727dfd55f96a31caa75ead3107031708a2cda696aa056e2ce498fb
      base_sha: 76289afffd3ce1d1a29faabdb4450c94830e9cb6
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: 'feat: publish CP4c3 CB32 cross-partition arc census'
    secrets: inherit
