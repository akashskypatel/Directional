name: g4-canonical-transition-test-authority-code-build

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - '.agents/connector-triggers/g4-canonical-transition-test-authority-code-build'

permissions:
  contents: read
  actions: read

concurrency:
  group: g4-canonical-transition-test-authority-code-build-${{ github.ref }}
  cancel-in-progress: false

env:
  LOG_DIR: /tmp/g4-canonical-transition-test-authority-code-build-logs
  ACTIVITY_LOG: /tmp/g4-canonical-transition-test-authority-code-build-logs/activity.log
  IMPLEMENTATION_COMMIT: de5261c7185aef71807b0b4140c8f023a44874fd
  ENTERING_BRANCH_HEAD: 2703f2f94e77afa4c7ed397200ddd456413c7125
  ENTERING_RUNTIME_ARTIFACT: '9028103772'

jobs:
  code-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Initialize unconditional activity log
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$LOG_DIR"
          finish() {
            rc=$?
            trap - EXIT
            {
              echo "step=initialize"
              echo "exit_code=$rc"
              echo "finished_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            } >> "$ACTIVITY_LOG"
            exit "$rc"
          }
          trap finish EXIT
          {
            echo "turn=G4 canonical transition test authority Code+Build"
            echo "run_id=$GITHUB_RUN_ID"
            echo "run_attempt=$GITHUB_RUN_ATTEMPT"
            echo "event=$GITHUB_EVENT_NAME"
            echo "event_sha=$GITHUB_SHA"
            echo "event_ref=$GITHUB_REF"
            echo "repository=$GITHUB_REPOSITORY"
            echo "runner_os=$RUNNER_OS"
            echo "runner_temp=$RUNNER_TEMP"
            echo "implementation_commit=$IMPLEMENTATION_COMMIT"
            echo "entering_branch_head=$ENTERING_BRANCH_HEAD"
            echo "entering_runtime_artifact=$ENTERING_RUNTIME_ARTIFACT"
            echo "runtimeExecution=false"
            echo "reviewPolicy=never"
            echo "allowed=verify exact source, configure, compile/link seven approved targets, package/checksum"
            echo "prohibited=tests, benchmarks, generated Directional binaries, ctest/discovery, CLI, GUI, help/list/version/custom-input execution"
            echo "started_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } | tee "$ACTIVITY_LOG"

      - name: Checkout exact working branch
        uses: actions/checkout@v4
        with:
          ref: agent/surface_cell_quad/p5-recover-bridge-healing
          fetch-depth: 50
          submodules: false

      - name: Verify exact implementation and allowlist
        shell: bash
        run: |
          set -Eeuo pipefail
          exec > >(tee -a "$ACTIVITY_LOG") 2>&1
          finish() {
            rc=$?
            trap - EXIT
            echo "step=verify-source exit_code=$rc finished_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            exit "$rc"
          }
          trap finish EXIT

          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$IMPLEMENTATION_COMMIT" "$GITHUB_SHA"
          test -z "$(git status --porcelain=v1)"

          mapfile -t changed < <(
            git diff --name-only "$ENTERING_BRANCH_HEAD" "$IMPLEMENTATION_COMMIT" |
              LC_ALL=C sort
          )
          expected_changed=(
            tests/SurfaceCellTransitionQuotientTests.cpp
            tests/SurfaceCellsPhase10Tests.cpp
          )
          printf 'implementation_changed=%s\n' "${changed[*]}"
          test "${#changed[@]}" -eq "${#expected_changed[@]}"
          for i in "${!expected_changed[@]}"; do
            test "${changed[$i]}" = "${expected_changed[$i]}"
          done

          mapfile -t event_overlay < <(
            git diff --name-only "$IMPLEMENTATION_COMMIT" "$GITHUB_SHA" |
              LC_ALL=C sort
          )
          expected_overlay=(
            .agents/connector-triggers/g4-canonical-transition-test-authority-code-build
            .github/workflows/g4-canonical-transition-test-authority-code-build.yml
          )
          printf 'event_overlay=%s\n' "${event_overlay[*]}"
          test "${#event_overlay[@]}" -eq "${#expected_overlay[@]}"
          for i in "${!expected_overlay[@]}"; do
            test "${event_overlay[$i]}" = "${expected_overlay[$i]}"
          done

          check_blob() {
            local path="$1" expected="$2"
            local actual
            actual=$(git hash-object "$path")
            echo "source_blob $path=$actual"
            test "$actual" = "$expected"
          }
          check_blob include/directional/geometry/SurfaceCellTracing.h b87e37676a980162e7ef3ac1fa9d954ce2199ad2
          check_blob src/geometry/SurfaceCellTracing.cpp 4809e66bb6e797001ffc22b3f2da6d3613cfdef0
          check_blob src/pipeline/RemeshPipeline.cpp 0a55429fc83d429ae2176ce3bbaac573682c48eb
          check_blob tests/SurfaceCellTransitionQuotientTests.cpp 42111d1de51baa6cca85171aeab339813cae3b50
          check_blob tests/SurfaceCellsPhase10Tests.cpp 552a3d98ec8f9280b960fb9bbff9a1c7596a0778
          check_blob cmake/DirectionalTests.cmake e82e3088e11f215f030b58be7fb6531a5dbaa99a
          git diff --exit-code "$IMPLEMENTATION_COMMIT" -- "${expected_changed[@]}"
          echo "BUILD_COMMIT=$GITHUB_SHA" >> "$GITHUB_ENV"

      - name: Install compile prerequisites
        shell: bash
        run: |
          set -Eeuo pipefail
          exec > >(tee -a "$ACTIVITY_LOG") 2>&1
          finish() {
            rc=$?
            trap - EXIT
            echo "step=install-prerequisites exit_code=$rc finished_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            exit "$rc"
          }
          trap finish EXIT
          sudo apt-get update
          sudo apt-get install -y ninja-build libgmp-dev xz-utils time

      - name: Fetch shallow submodules
        shell: bash
        run: |
          set -Eeuo pipefail
          exec > >(tee -a "$ACTIVITY_LOG") 2>&1
          finish() {
            rc=$?
            trap - EXIT
            echo "step=fetch-submodules exit_code=$rc finished_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            exit "$rc"
          }
          trap finish EXIT
          git submodule update --init --depth 1
          git submodule status | tee "$LOG_DIR/submodules.txt"

      - name: Configure Release static compile-only build
        shell: bash
        run: |
          set -Eeuo pipefail
          exec > >(tee -a "$ACTIVITY_LOG") 2>&1
          finish() {
            rc=$?
            trap - EXIT
            echo "step=configure exit_code=$rc finished_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            exit "$rc"
          }
          trap finish EXIT
          {
            echo "implementation_commit=$IMPLEMENTATION_COMMIT"
            echo "build_commit=$BUILD_COMMIT"
            echo "compile_head=$(git rev-parse HEAD)"
            git --version
            bash --version | head -n 1
            cmake --version
            c++ --version
            ninja --version
          } | tee "$LOG_DIR/toolchain.txt"
          test "$(git rev-parse HEAD)" = "$BUILD_COMMIT"
          cmake -S . -B agent-build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DCMAKE_GTEST_DISCOVER_TESTS_DISCOVERY_MODE=PRE_TEST -DBUILD_SHARED_LIBS=OFF -DBUILD_TUTORIALS=OFF -DBUILD_PYTHON=OFF -DDIRECTIONAL_BUILD_CLI=OFF -DDIRECTIONAL_BUILD_GUI=OFF -DDIRECTIONAL_BUILD_BENCHMARKS=ON -DDIRECTIONAL_BUILD_TESTS=ON -DDIRECTIONAL_BUILD_HISTORICAL_TESTS=OFF -DDIRECTIONAL_BUILD_LEGACY_INTEGRATION_TESTS=OFF -DDIRECTIONAL_BUILD_OPTIONAL_GUIDANCE_TESTS=OFF -DDIRECTIONAL_ENABLE_GMP=ON -DDIRECTIONAL_ENABLE_PARDISO=OFF -DDIRECTIONAL_ENABLE_CUDSS=OFF -DDIRECTIONAL_ENABLE_SUITESPARSE=OFF 2>&1 | tee "$LOG_DIR/configure.log"

      - name: Compile seven approved targets only
        shell: bash
        run: |
          set -Eeuo pipefail
          exec > >(tee -a "$ACTIVITY_LOG") 2>&1
          finish() {
            rc=$?
            trap - EXIT
            {
              echo "step=compile exit_code=$rc finished_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
              echo "git_status_begin"
              git status --short --branch || true
              echo "git_status_end"
              echo "disk_usage_begin"
              df -h . || true
              echo "disk_usage_end"
            } >> "$ACTIVITY_LOG"
            exit "$rc"
          }
          trap finish EXIT
          test "$(git rev-parse HEAD)" = "$BUILD_COMMIT"
          /usr/bin/time -v -o "$LOG_DIR/build-resources.txt" \
            cmake --build agent-build --parallel 2 --target \
              directional_core \
              directional_pipeline \
              directional_compiled_api_tests \
              directional_surface_cell_producer_tests \
              directional_surface_cell_completion_tests \
              directional_surface_cell_validation_tests \
              directional_benchmarks \
            2>&1 | tee "$LOG_DIR/build.log"
          cat "$LOG_DIR/build-resources.txt"
          echo "compile_only_gate=passed"
          echo "approved_target_count=7"
          echo "runtimeExecution=false"

      - name: Package immutable compile artifact
        shell: bash
        run: |
          set -Eeuo pipefail
          exec > >(tee -a "$ACTIVITY_LOG") 2>&1
          finish() {
            rc=$?
            trap - EXIT
            echo "step=package exit_code=$rc finished_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            exit "$rc"
          }
          trap finish EXIT
          artifact_root="$GITHUB_WORKSPACE/g4-canonical-transition-test-authority-code-build-artifact"
          rm -rf "$artifact_root"
          mkdir -p "$artifact_root"/{bin,lib,test-data/benchmarks,logs,metadata,source}
          cp agent-build/directional_benchmarks "$artifact_root/bin/"
          cp agent-build/directional_compiled_api_tests "$artifact_root/bin/"
          cp agent-build/directional_surface_cell_producer_tests "$artifact_root/bin/"
          cp agent-build/directional_surface_cell_completion_tests "$artifact_root/bin/"
          cp agent-build/directional_surface_cell_validation_tests "$artifact_root/bin/"
          cp agent-build/libdirectional_core.a "$artifact_root/lib/"
          cp agent-build/libdirectional_pipeline.a "$artifact_root/lib/"
          test "$(find "$artifact_root/bin" -maxdepth 1 -type f | wc -l)" -eq 5
          test "$(find "$artifact_root/lib" -maxdepth 1 -type f | wc -l)" -eq 2

          test "$(find benchmarks/fixtures -type f | wc -l)" -eq 27
          cp -a benchmarks/fixtures "$artifact_root/test-data/benchmarks/"
          cp "$ACTIVITY_LOG" "$LOG_DIR/configure.log" "$LOG_DIR/build.log" \
            "$LOG_DIR/build-resources.txt" "$LOG_DIR/toolchain.txt" \
            "$LOG_DIR/submodules.txt" "$artifact_root/logs/"
          cp agent-build/compile_commands.json "$artifact_root/source/"

          changed_paths=(
            tests/SurfaceCellTransitionQuotientTests.cpp
            tests/SurfaceCellsPhase10Tests.cpp
          )
          git diff --full-index --binary "$ENTERING_BRANCH_HEAD" \
            "$IMPLEMENTATION_COMMIT" -- "${changed_paths[@]}" > \
            "$artifact_root/source/g4-canonical-transition-test-authority.patch"
          git archive --format=tar "$IMPLEMENTATION_COMMIT" | xz -T0 > \
            "$artifact_root/source/directional-g4-canonical-transition-test-authority-source-no-deps.tar.xz"

          cat > "$artifact_root/metadata/source-authority.json" <<EOF
          {
            "eventCommit": "$GITHUB_SHA",
            "implementationCommit": "$IMPLEMENTATION_COMMIT",
            "buildCommit": "$BUILD_COMMIT",
            "enteringRuntimeArtifact": $ENTERING_RUNTIME_ARTIFACT,
            "enteringBranchHead": "$ENTERING_BRANCH_HEAD",
            "runtimeExecution": false,
            "reviewPolicy": "never"
          }
          EOF
          cat > "$artifact_root/metadata/build-authority.json" <<'EOF'
          {
            "configuration": "Release",
            "generator": "Ninja",
            "buildSharedLibs": false,
            "gtestDiscoveryMode": "PRE_TEST",
            "approvedTargets": [
              "directional_core",
              "directional_pipeline",
              "directional_compiled_api_tests",
              "directional_surface_cell_producer_tests",
              "directional_surface_cell_completion_tests",
              "directional_surface_cell_validation_tests",
              "directional_benchmarks"
            ],
            "runtimeExecution": false
          }
          EOF
          cat > "$artifact_root/metadata/command-boundary.txt" <<'EOF'
          G4 canonical transition test authority Code + Build only.
          Executed: exact source verification, Release/static/Ninja PRE_TEST configuration, compile/link seven approved targets, package/checksum.
          Not executed: generated Directional binaries, tests, benchmarks, ctest/discovery, CLI, GUI, help/list/version/custom-input commands.
          EOF
          git ls-tree -r "$IMPLEMENTATION_COMMIT" -- \
            include/directional/geometry/SurfaceCellTracing.h \
            src/geometry/SurfaceCellTracing.cpp \
            src/pipeline/RemeshPipeline.cpp \
            tests/SurfaceCellTransitionQuotientTests.cpp \
            tests/SurfaceCellsPhase10Tests.cpp \
            cmake/DirectionalTests.cmake > \
            "$artifact_root/metadata/final-blobs.txt"
          git submodule status > "$artifact_root/metadata/submodules.txt"
          find benchmarks/fixtures -type f | LC_ALL=C sort > \
            "$artifact_root/metadata/fixture-files.txt"
          test "$(wc -l < "$artifact_root/metadata/fixture-files.txt")" -eq 27
          (cd "$artifact_root" && \
            find . -type f ! -name SHA256SUMS -print0 | LC_ALL=C sort -z | \
              xargs -0 sha256sum > SHA256SUMS)
          sha256sum "$artifact_root/SHA256SUMS" | tee "$LOG_DIR/artifact-checksum.txt"
          echo "manifest_entries=$(wc -l < "$artifact_root/SHA256SUMS")"

      - name: Upload immutable compile artifact
        id: compile_upload
        uses: actions/upload-artifact@v4
        with:
          name: g4-canonical-transition-test-authority-code-build
          path: g4-canonical-transition-test-authority-code-build-artifact
          if-no-files-found: error
          retention-days: 14

      - name: Record compile artifact identity
        shell: bash
        run: |
          set -Eeuo pipefail
          exec > >(tee -a "$ACTIVITY_LOG") 2>&1
          finish() {
            rc=$?
            trap - EXIT
            echo "step=record-artifact exit_code=$rc finished_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            exit "$rc"
          }
          trap finish EXIT
          echo "artifact_id=${{ steps.compile_upload.outputs.artifact-id }}"
          echo "artifact_url=${{ steps.compile_upload.outputs.artifact-url }}"
          echo "artifact_digest=${{ steps.compile_upload.outputs.artifact-digest }}"
          echo "runtimeExecution=false"

      - name: Upload detailed activity log always
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g4-canonical-transition-test-authority-code-build-logs
          path: /tmp/g4-canonical-transition-test-authority-code-build-logs
          if-no-files-found: error
          retention-days: 14
