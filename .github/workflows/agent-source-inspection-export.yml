name: Agent Source Inspection Export

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/source-inspection-export.txt

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Initialize persistent activity log
        shell: bash
        run: |
          set -euo pipefail
          : > "$RUNNER_TEMP/activity.log"
          printf '%s\n' \
            "event_sha=$GITHUB_SHA" \
            "ref=$GITHUB_REF" \
            'purpose=source-inspection-only' \
            'runtimeExecution=false' | tee -a "$RUNNER_TEMP/activity.log"

      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          submodules: false

      - name: Package inspection source
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee -a "$RUNNER_TEMP/activity.log") 2>&1
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git status --porcelain=v1
          tar -czf "$RUNNER_TEMP/source-inspection.tar.gz" \
            CMakeLists.txt include src tests \
            .agents/Directional/Architecture_M1_Single_Authority_Cutover_Code_Build_Plan.md \
            .agents/Directional/Architecture_Redesign_and_M1_RA_Independent_Review_Report.md
          sha256sum "$RUNNER_TEMP/source-inspection.tar.gz"
          echo 'runtimeExecution=false'

      - name: Upload source inspection archive
        uses: actions/upload-artifact@v4
        with:
          name: source-inspection-${{ github.run_id }}
          path: ${{ runner.temp }}/source-inspection.tar.gz
          if-no-files-found: error
          retention-days: 1

      - name: Upload persistent activity log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-inspection-log-${{ github.run_id }}
          path: ${{ runner.temp }}/activity.log
          if-no-files-found: error
          retention-days: 1
