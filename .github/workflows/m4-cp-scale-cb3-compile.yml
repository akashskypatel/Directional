name: M4 CP SCALE CB3 Compile

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m4-cp-scale-cb3-compile-20260914.txt

permissions:
  contents: write
  actions: write
  issues: write
  pull-requests: write

concurrency:
  group: m4-cp-scale-cb3-compile
  cancel-in-progress: false

jobs:
  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m4-cp-scale-cb3-compile
      commit_run_file: false
    secrets: inherit

  validate-caller:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/m4-cp-scale-cb3-compile.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  changed-owner-preflight:
    needs: validate-caller
    if: ${{ needs.validate-caller.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-compile-reusable.yml
    with:
      source_sha: ba6e204d9daef39bfc6c168b659fc1b94f2b5b9b
      targets: directional_surface_cell_producer_tests
      artifact_prefix: m4-cp-scale-cb3-preflight
    secrets: inherit

  authoritative-package:
    needs: changed-owner-preflight
    uses: ./.github/workflows/agent-compile-reusable.yml
    with:
      source_sha: ba6e204d9daef39bfc6c168b659fc1b94f2b5b9b
      targets: directional_core directional_pipeline directional_surface_cell_authority_kernel_tests directional_surface_cell_producer_tests directional_surface_cell_completion_tests directional_surface_cell_validation_tests directional_compiled_api_tests directional_benchmarks
      artifact_prefix: m4-cp-scale-cb3-package
    secrets: inherit
