name: M3 CP4c3 CB52 Exact Bootstrap

on:
  push:
    branches: [agent/surface_cell_quad/p5-recover-bridge-healing]
    paths: [.agents/connector-triggers/cb52-original-trace/cb52-original-trace-20260909.txt]

permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: write

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/m3-cp4c3-cb52-exact-bootstrap.yml
      source_ref: ${{ github.sha }}
    secrets: inherit
  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m3-cp4c3-cb52-original-trace
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit
  localize:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          submodules: false
          lfs: false
      - name: Trace original harness line numbers during immutable preflight
        env:
          GH_TOKEN: ${{ github.token }}
          TURN_ID: M3-CP4c-3-CB52
          ARTIFACT_ID: '10112532452'
          EXPECTED_ARTIFACT_NAME: m3-cp4c3-cb51-package111-result-34372482691
          EXPECTED_PROVIDER_DIGEST: sha256:62ae325186ef31d2936e1a797c55cef43f8aef62449b33a26e29cb1ecd9185da
          EXPECTED_ZIP_SHA256: 62ae325186ef31d2936e1a797c55cef43f8aef62449b33a26e29cb1ecd9185da
          EXPECTED_SOURCE_SHA: 4f0663ef3468996abce6f59109f1c67f5be5f604
          SELECTOR_RELATIVE_PATH: .agents/Directional/Architecture_M3_CP4c3_Required_Green_Selector_409.txt
          EXPECTED_SELECTOR_COUNT: '409'
          EXPECTED_SELECTOR_SHA256: eea6d8c2bbc8e9247deb4bfbbe6763042c76002d1894dd62e35f80262403b53e
          ACCEPTED_PREFIX_COUNT: '365'
          EXPECTED_HARNESS_SHA256: aaadab351c0ba28a39c87aff1948f83ab0c4c71520662177e5cdf6fd08b30ed3
        shell: bash
        run: |
          set -u -o pipefail
          harness=.agents/Directional/tools/m3_cp4c3_artifact_only_harness.sh
          trace="$RUNNER_TEMP/cb52-original-line-trace.log"
          envfile="$RUNNER_TEMP/cb52-bash-env.sh"
          actual="$(sha256sum "$harness" | awk '{print $1}')"
          echo "harness_sha256=$actual"
          test "$actual" = "$EXPECTED_HARNESS_SHA256"
          cat > "$envfile" <<'EOF'
          exec 9>>"$RUNNER_TEMP/cb52-original-line-trace.log"
          trap 'printf "%s:%s\n" "${BASH_SOURCE[0]}" "$LINENO" >&9' DEBUG
          set -T
          EOF
          : > "$trace"
          set +e
          BASH_ENV="$envfile" bash "$harness" --preflight-only
          rc=$?
          set -e
          echo "original_harness_exit=$rc" | tee -a "$trace"
          exit "$rc"
      - name: Upload original-harness trace and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-cp4c3-cb52-original-trace-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/cb52-original-line-trace.log
            ${{ runner.temp }}/M3-CP4c-3-CB52.log
            ${{ runner.temp }}/M3-CP4c-3-CB52-result
          if-no-files-found: warn
          retention-days: 7
