name: M3 CP4c3 CB52 Final Preflight Proof

on:
  push:
    branches: [agent/surface_cell_quad/p5-recover-bridge-healing]
    paths: [.agents/connector-triggers/cb52-final-preflight/cb52-final-preflight-20260909.txt]

permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: m3-cp4c3-cb52-final-preflight
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/m3-cp4c3-cb52-exact-bootstrap.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m3-cp4c3-cb52-final-preflight
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  preflight:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Initialize caller evidence
        shell: bash
        run: |
          set -euo pipefail
          : > "$RUNNER_TEMP/cb52-final-preflight-caller.log"
          printf '%s\n' 'turn=M3-CP4c-3-CB52' 'mode=preflight-only' 'runtimeExecution=false' \
            | tee -a "$RUNNER_TEMP/cb52-final-preflight-caller.log"

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          submodules: false
          lfs: false

      - name: Execute original generic harness preflight and capture exit
        env:
          GH_TOKEN: ${{ github.token }}
          TURN_ID: M3-CP4c-3-CB52-FINAL
          ARTIFACT_ID: '10112532452'
          EXPECTED_ARTIFACT_NAME: m3-cp4c3-cb51-package111-result-34372482691
          EXPECTED_PROVIDER_DIGEST: sha256:62ae325186ef31d2936e1a797c55cef43f8aef62449b33a26e29cb1ecd9185da
          EXPECTED_ZIP_SHA256: 62ae325186ef31d2936e1a797c55cef43f8aef62449b33a26e29cb1ecd9185da
          EXPECTED_SOURCE_SHA: 4f0663ef3468996abce6f59109f1c67f5be5f604
          SELECTOR_RELATIVE_PATH: .agents/Directional/Architecture_M3_CP4c3_Required_Green_Selector_409.txt
          EXPECTED_SELECTOR_COUNT: '409'
          EXPECTED_SELECTOR_SHA256: eea6d8c2bbc8e9247deb4bfbbe6763042c76002d1894dd62e35f80262403b53e
          ACCEPTED_PREFIX_COUNT: '365'
          EXPECTED_HARNESS_SHA256: aaadab351c0ba28a39c87aff1948f83ab0c4c71520662177e5cdf6fd08b30ed3
        shell: bash
        run: |
          set -u -o pipefail
          caller="$RUNNER_TEMP/cb52-final-preflight-caller.log"
          harness=.agents/Directional/tools/m3_cp4c3_artifact_only_harness.sh
          actual="$(sha256sum "$harness" | awk '{print $1}')"
          echo "harness_sha256=$actual" | tee -a "$caller"
          if [[ "$actual" != "$EXPECTED_HARNESS_SHA256" ]]; then
            echo 'harness_digest_match=false' | tee -a "$caller"
            echo 72 > "$RUNNER_TEMP/cb52-final-preflight-exit.txt"
            exit 72
          fi
          echo 'harness_digest_match=true' | tee -a "$caller"
          bash -n "$harness"
          echo 'bash_n=true' | tee -a "$caller"
          bash "$harness" --preflight-only
          rc=$?
          echo "$rc" > "$RUNNER_TEMP/cb52-final-preflight-exit.txt"
          echo "harness_exit=$rc" | tee -a "$caller"
          exit "$rc"

      - name: Verify successful runtime-free boundary
        if: always()
        shell: bash
        run: |
          set -u -o pipefail
          caller="$RUNNER_TEMP/cb52-final-preflight-caller.log"
          boundary="$RUNNER_TEMP/M3-CP4c-3-CB52-FINAL-result/execution-boundary.txt"
          rc=0
          test -f "$boundary" || rc=73
          if [[ "$rc" -eq 0 ]]; then
            for token in \
              'script_exit=0' 'mode=--preflight-only' 'runtime_started=false' 'runtime_completed=false' \
              'preflight_completed=true' 'execution_view_verified=true' 'orchestration_failure=false' \
              'selection_integrity=true' 'timeout_count=0' 'benchmark_execution=false' \
              'configure_execution=false' 'compile_execution=false' 'relink_execution=false' \
              'generated_discovery=false' 'package_repair=false' 'mode_repair=false' \
              'source_test_fixture_selector_mutation=false'; do
              grep -Fxq "$token" "$boundary" || { echo "missing_boundary_token=$token" | tee -a "$caller"; rc=74; break; }
            done
          fi
          echo "boundary_verification_exit=$rc" | tee -a "$caller"
          echo "$rc" > "$RUNNER_TEMP/cb52-final-boundary-exit.txt"
          exit "$rc"

      - name: Upload immutable preflight result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-cp4c3-cb52-final-preflight-result-${{ github.run_id }}
          path: ${{ runner.temp }}/M3-CP4c-3-CB52-FINAL-result
          if-no-files-found: error
          retention-days: 7

      - name: Upload caller and harness logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-cp4c3-cb52-final-preflight-log-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/cb52-final-preflight-caller.log
            ${{ runner.temp }}/cb52-final-preflight-exit.txt
            ${{ runner.temp }}/cb52-final-boundary-exit.txt
            ${{ runner.temp }}/M3-CP4c-3-CB52-FINAL.log
          if-no-files-found: error
          retention-days: 7
