name: M3 CP4c3 CB52 Exact Bootstrap

on:
  push:
    branches: [agent/surface_cell_quad/p5-recover-bridge-healing]
    paths: [.agents/connector-triggers/cb52-exact-bootstrap-4/cb52-exact-bootstrap-4-20260909.txt]

permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: write

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/m3-cp4c3-cb52-exact-bootstrap.yml
      source_ref: ${{ github.sha }}
    secrets: inherit
  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m3-cp4c3-cb52-exact-bootstrap-4
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit
  localize:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          submodules: false
          lfs: false
      - name: Execute instrumented immutable preflight only
        env:
          GH_TOKEN: ${{ github.token }}
          TURN_ID: M3-CP4c-3-CB52-LOCALIZE4
          ARTIFACT_ID: '10112532452'
          EXPECTED_ARTIFACT_NAME: m3-cp4c3-cb51-package111-result-34372482691
          EXPECTED_PROVIDER_DIGEST: sha256:62ae325186ef31d2936e1a797c55cef43f8aef62449b33a26e29cb1ecd9185da
          EXPECTED_ZIP_SHA256: 62ae325186ef31d2936e1a797c55cef43f8aef62449b33a26e29cb1ecd9185da
          EXPECTED_SOURCE_SHA: 4f0663ef3468996abce6f59109f1c67f5be5f604
          SELECTOR_RELATIVE_PATH: .agents/Directional/Architecture_M3_CP4c3_Required_Green_Selector_409.txt
          EXPECTED_SELECTOR_COUNT: '409'
          EXPECTED_SELECTOR_SHA256: eea6d8c2bbc8e9247deb4bfbbe6763042c76002d1894dd62e35f80262403b53e
          ACCEPTED_PREFIX_COUNT: '365'
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/exact-bootstrap-4.log"
          src=.agents/Directional/tools/m3_cp4c3_artifact_only_harness.sh
          dst="$RUNNER_TEMP/instrumented-preflight.sh"
          python3 - "$src" "$dst" <<'PY'
          from pathlib import Path
          import sys
          src, dst = map(Path, sys.argv[1:])
          lines = src.read_text().splitlines()
          markers = {145:'environment',151:'artifact-metadata-curl',153:'artifact-metadata-parse',155:'artifact-authority-compare',161:'artifact-zip-curl',163:'zip-digest',166:'artifact-authority-file',168:'unzip',170:'root-manifest',173:'build-metadata',179:'gmp-evidence',196:'executables',198:'package-census',201:'source-extract',210:'selector-authority',211:'source-census',261:'identity-map',266:'identity-map-verify',275:'execution-view-census',277:'preflight-flags',291:'postflight-function-defined'}
          out=[]
          for n,line in enumerate(lines[:297],1):
              out.append(line)
              if n in markers:
                  out.append(f"echo CB52_PREFLIGHT_AFTER={markers[n]}")
          dst.write_text('\n'.join(out)+'\n')
          PY
          bash -n "$dst"
          if bash "$dst" --preflight-only >"$out" 2>&1; then rc=0; else rc=$?; fi
          cat "$out"
          echo "instrumented_exit=$rc"
          exit "$rc"
      - name: Upload localization log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-cp4c3-cb52-exact-bootstrap-4-log-${{ github.run_id }}
          path: ${{ runner.temp }}/exact-bootstrap-4.log
          if-no-files-found: error
          retention-days: 7
