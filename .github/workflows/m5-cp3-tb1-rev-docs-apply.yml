name: M5 CP3 TB1 Review Docs Drive Apply

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m5-cp3-tb1-rev-docs-apply.txt

permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

concurrency:
  group: m5-cp3-tb1-rev-docs-apply
  cancel-in-progress: false

jobs:
  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m5-cp3-tb1-rev-docs-apply
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/m5-cp3-tb1-rev-docs-apply.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  apply:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1Wsdc7HeXS3qLOMq-UpN8o3PD583nfnbG
      patch_sha256: ce1b66eecc8a8ccb56158b823bb47a1de923eb883b4cb996c2613f980d96b6ff
      base_sha: 8ab04882412a9f13463b4a5884043863e07526ea
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: "docs: close M5-CP3-TB1 review and freeze R1 execution"
      retention_days: 7
    secrets: inherit
