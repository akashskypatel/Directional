name: Agent M3 CP4c2 R5 EXEC

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/r5-exec/M3-CP4c-2-TB-X2-R5-EXEC.txt

permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: agent-m3-cp4c2-r5-exec
  cancel-in-progress: false

jobs:
  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      report_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_run_file: false
      label: M3-CP4c-2-TB-X2-R5-EXEC
      trim_stale_comments: true
    secrets: inherit

  execute:
    runs-on: ubuntu-24.04
    steps:
      - name: Initialize diagnostic log
        shell: bash
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/r5-exec.log"
          : > "$log"
          {
            echo "workflow=${GITHUB_WORKFLOW}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "event=${GITHUB_EVENT_NAME}"
            echo "event_sha=${GITHUB_SHA}"
            echo "repository=${GITHUB_REPOSITORY}"
            echo "turn=M3-CP4c-2-TB-X2-R5-EXEC"
            echo "turnBoundary=Test+Benchmark/TB-EXEC"
            echo "runtimeExecution=true"
            echo "benchmarkExecution=false"
            echo "started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } | tee -a "$log"

      - name: Checkout exact control trigger commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Verify control payload and execute frozen R5 plan
        id: execute
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/r5-exec.log"
          exec > >(tee -a "$log") 2>&1
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          for part in 0 1 2; do
            test -f ".agents/Directional/turn-payloads/M3-CP4c-2-TB-X2-R5-EXEC.part${part}"
          done
          cat .agents/Directional/turn-payloads/M3-CP4c-2-TB-X2-R5-EXEC.part{0,1,2} > "${RUNNER_TEMP}/r5-exec.sh"
          bash "${RUNNER_TEMP}/r5-exec.sh"

      - name: Upload R5 raw result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-cp4c2-r5-exec-result-${{ github.run_id }}
          path: ${{ runner.temp }}/r5-exec-result
          if-no-files-found: error
          retention-days: 7

      - name: Record final job status
        if: always()
        shell: bash
        run: |
          set +e
          log="${RUNNER_TEMP}/r5-exec.log"
          {
            echo "execute_step_outcome=${{ steps.execute.outcome }}"
            echo "final_job_status=${{ job.status }}"
            echo "finished_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } | tee -a "$log"

      - name: Upload R5 diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-cp4c2-r5-exec-log-${{ github.run_id }}
          path: ${{ runner.temp }}/r5-exec.log
          if-no-files-found: error
          retention-days: 7

      - name: Fail on orchestration error
        if: always() && steps.execute.outcome != 'success'
        shell: bash
        run: |
          echo 'R5 EXEC orchestration failed; semantic red is reported in the result artifact and does not reach this step.' >&2
          exit 1
