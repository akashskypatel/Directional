name: Agent M3 CP4c-0b CB1 S2-S6 Precompile

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m3-cp4c0b-cb1-s2s6-precompile/run.txt

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: agent-m3-cp4c0b-cb1-s2s6-precompile
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/agent-m3-cp4c0b-cb1-s2s6-precompile.yml
    secrets: inherit

  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m3-cp4c0b-cb1-s2s6-precompile
      commit_run_file: false
    secrets: inherit

  precompile:
    needs: validate
    uses: ./.github/workflows/agent-compile-reusable.yml
    with:
      source_sha: 737f93be10a73db950e2a7f823b96ffb0d59cf4d
      targets: directional_surface_cell_producer_tests
      artifact_prefix: m3-cp4c0b-cb1-s2s6-precompile
    secrets: inherit
