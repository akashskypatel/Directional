name: M4 CP SCALE CB17 Closeout Drive Apply

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/cb17-closeout-drive-apply.txt

permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

concurrency:
  group: m4-cp-scale-cb17-closeout-drive-apply
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/m4-cp-scale-cb17-closeout-drive-apply.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: M4-CP-SCALE-CB17-closeout-drive-apply
      commit_run_file: false
    secrets: inherit

  apply:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1l74mmKiuuTgVL18y5WVkAeIenm3zM2Uu
      patch_sha256: 79f5f29c517e7f08937a6ce8efeaebacd4cb6a5ffaa665cd77d7516b1e385015
      base_sha: 3fe658a25bc6fa34be130b232d9bfbb168271837
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: "M4-CP-SCALE-CB17: publish closeout and TB12-R4 handoff"
    secrets: inherit
