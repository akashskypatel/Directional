name: Agent M4 CP3 TB5 Review Apply

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/drive-apply/m4-cp3-tb5-review/**

permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

concurrency:
  group: agent-m4-cp3-tb5-review-apply-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/agent-m4-cp3-tb5-review-apply.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m4-cp3-tb5-review-apply
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  apply:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1i6ps8f3rUz2Hsj4Gl6E4zwFGz0ngZwfG
      patch_sha256: 8b7c9fa4eda23fbea43db5c4ca6cdb7460f44b2e0aec45836d0ca66cebdf0ef7
      base_sha: 4e86a7ff59a79f24d77099274d11e17a81681db9
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: 'docs: adjudicate M4-CP3-TB5 and freeze CB8'
      retention_days: 7
    secrets: inherit
