name: M1k Closeout Docs

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/Directional/connector-triggers/m1k-closeout-docs.txt

permissions:
  contents: write

jobs:
  update-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/surface_cell_quad/p5-recover-bridge-healing
          fetch-depth: 2
      - name: Update live status sections non-destructively
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p m1k-closeout-docs-logs
          exec > >(tee -a m1k-closeout-docs-logs/activity.log) 2>&1
          python .agents/Directional/turn-payloads/m1k-closeout.py
          git diff --check
          printf '[closeout] changed paths:\n'
          git diff --name-only
          expected=$(printf '%s\n' TODO MILESTONE_G_TODO.md .agents/Directional/Future_Chat_Session_Handoff.md | sort)
          actual=$(git diff --name-only | sort)
          if [[ "$actual" != "$expected" ]]; then
            echo "unexpected durable-doc scope"
            exit 41
          fi
          git config user.name "OpenAI Agent"
          git config user.email "noreply@openai.com"
          git add TODO MILESTONE_G_TODO.md .agents/Directional/Future_Chat_Session_Handoff.md
          git commit -m "docs: hand off M1k immutable runtime validation"
          git push origin HEAD:agent/surface_cell_quad/p5-recover-bridge-healing
      - name: Upload detailed closeout logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m1k-closeout-docs-logs
          path: m1k-closeout-docs-logs
          if-no-files-found: warn
          retention-days: 14
