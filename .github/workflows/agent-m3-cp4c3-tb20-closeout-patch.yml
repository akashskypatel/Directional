name: Agent M3 CP4c3 TB20 Closeout Patch

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/patch/m3-cp4c3-tb20-closeout.txt

permissions:
  actions: read
  contents: write
  id-token: write

concurrency:
  group: agent-m3-cp4c3-tb20-closeout-patch
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/agent-m3-cp4c3-tb20-closeout-patch.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  apply:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1vOSoHjUwPdKVlsnGdIAIfvbAgk_arX2-
      patch_sha256: 83c1e705d863dff6a19d988daa5dc600114fffc0a8c427e0815a5026eb095c0c
      base_sha: f124f74c86554b50fd4c4bb4d70dd712ec19d131
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: 'docs: close M3 CP4c3 TB20 artifact-only turn'
      retention_days: 14
    secrets: inherit
