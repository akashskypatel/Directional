name: Agent M3 CP4c2 R5 EXEC Schema Validation

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/r5-exec-schema/M3-CP4c-2-TB-X2-R5-EXEC.txt

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: agent-m3-cp4c2-r5-exec-schema
  cancel-in-progress: false

jobs:
  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      report_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_run_file: false
      label: M3-CP4c-2-TB-X2-R5-EXEC-schema
      trim_stale_comments: true
    secrets: inherit

  validate-self:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/agent-temp-r5-exec-schema.yml
      source_ref: ${{ github.sha }}
      retention_days: 7
    secrets: inherit

  validate-workload:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .agents/Directional/turn-payloads/M3-CP4c-2-TB-X2-R5-EXEC.workflow.yml
      source_ref: ${{ github.sha }}
      retention_days: 7
    secrets: inherit
