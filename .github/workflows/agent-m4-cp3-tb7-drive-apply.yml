name: Agent M4 CP3 TB7 Drive Apply

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/drive/m4-cp3-tb7/**

permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

concurrency:
  group: agent-m4-cp3-tb7-drive-apply-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/agent-m4-cp3-tb7-drive-apply.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m4-cp3-tb7-drive-apply
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  apply:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1XI-cGgbF0q39TlmUNCVcblUPvWnQgtpM
      patch_sha256: 955fca880e338aeb3ec50d56c7d3ac8016ceb6b1eadf87c8e4dd4acdc73484c9
      base_sha: a5f351b05d85675d46c0bfdfbd35a0b00077005c
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: "docs: close M4-CP3-TB7-EXEC at first cumulative RED"
      retention_days: 7
    secrets: inherit
