name: Agent Gate 1 Uniform Phase-Front Code Build

on:
  push:
    branches: [agent/surface_cell_quad/p5-recover-bridge-healing]
    paths: [.github/workflows/agent-g1-uniform-phase-front-build.yml]

permissions:
  contents: write

concurrency:
  group: surface-cell-g1-phase-front-build-${{ github.ref }}
  cancel-in-progress: true

env:
  BRANCH: agent/surface_cell_quad/p5-recover-bridge-healing
  PAYLOAD: .agents/Directional/turn-payloads/g1-uniform-phase-front.patch.gz.b64
  BUILD_DIR: build/agent-g1-phase-front-release
  ARTIFACT_DIR: artifact
  LOG_DIR: /tmp/g1-phase-front-build-logs
  LOG: /tmp/g1-phase-front-build-logs/activity.log

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Initialize compile-only activity log
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$LOG_DIR"
          {
            echo 'Gate 1 uniform phase-front compile-only Code + Build turn'
            echo "run_id=$GITHUB_RUN_ID"
            echo "event_sha=$GITHUB_SHA"
            echo "ref=$GITHUB_REF"
            echo "started_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } | tee "$LOG"

      - name: Checkout exact event and recursive submodules
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 50
          submodules: recursive
          persist-credentials: true

      - name: Apply authoritative Gate 1 implementation and push source checkpoint
        shell: bash
        run: |
          set -Eeuo pipefail
          exec > >(tee -a "$LOG") 2>&1
          set -x

          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -f "$PAYLOAD"
          test -z "$(git status --porcelain=v1)"

          base64 --decode "$PAYLOAD" | gzip --decompress > /tmp/g1-uniform-phase-front.patch
          sha256sum "$PAYLOAD" /tmp/g1-uniform-phase-front.patch | tee /tmp/payload-sha256.txt
          git apply --check /tmp/g1-uniform-phase-front.patch
          git apply /tmp/g1-uniform-phase-front.patch

          git diff --name-only | sort > /tmp/changed-files.txt
          cat > /tmp/expected-files.txt <<'FILES'
          include/directional/geometry/SurfaceArrangement.h
          include/directional/geometry/SurfaceCellTracing.h
          src/geometry/SurfaceArrangement.cpp
          src/geometry/SurfaceCellTracing.cpp
          src/pipeline/RemeshPipeline.cpp
          FILES
          diff -u /tmp/expected-files.txt /tmp/changed-files.txt

          git diff --check
          git config user.name 'Directional Gate Agent'
          git config user.email 'directional-gate-agent@users.noreply.github.com'
          git add -- $(cat /tmp/expected-files.txt)
          git commit -m 'feat(surface-cells): add Gate 1 uniform phase front'
          source_commit=$(git rev-parse HEAD)
          echo "SOURCE_COMMIT=$source_commit" >> "$GITHUB_ENV"
          echo "$source_commit" | tee /tmp/source-commit.txt
          git push origin "HEAD:$BRANCH"
          test -z "$(git status --porcelain=v1)"

          git submodule status --recursive | tee /tmp/submodules.txt
          test "$(git submodule status --recursive | wc -l)" -eq 9

          git rev-parse "$source_commit:CMakeLists.txt" > /tmp/cmake-root-blob.txt
          git rev-parse "$source_commit:cmake/DirectionalTests.cmake" > /tmp/test-cmake-blob.txt
          git rev-parse "$source_commit:tests/SurfaceCellDesignAcceptanceTests.cpp" > /tmp/acceptance-test-blob.txt
          git rev-parse "$source_commit:tests/TESTING_STRATEGY.md" > /tmp/testing-strategy-blob.txt
          git rev-parse "$source_commit:.agents/Directional/Future_Chat_Session_Handoff.md" > /tmp/handoff-blob.txt
          git rev-parse "$source_commit:include/directional/geometry/SurfaceCellTracing.h" > /tmp/tracing-header-blob.txt
          git rev-parse "$source_commit:src/geometry/SurfaceCellTracing.cpp" > /tmp/tracing-source-blob.txt
          git rev-parse "$source_commit:include/directional/geometry/SurfaceArrangement.h" > /tmp/arrangement-header-blob.txt
          git rev-parse "$source_commit:src/geometry/SurfaceArrangement.cpp" > /tmp/arrangement-source-blob.txt
          git rev-parse "$source_commit:src/pipeline/RemeshPipeline.cpp" > /tmp/pipeline-source-blob.txt

          cmake --version
          ninja --version
          c++ --version

      - name: Configure and compile exact approved targets
        shell: bash
        run: |
          set -Eeuo pipefail
          exec > >(tee -a "$LOG") 2>&1
          finish() {
            rc=$?
            trap - EXIT
            set +x
            echo "build_exit_code=$rc"
            echo "build_finished_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git status --short --branch || true
            df -h . || true
            du -sh "$BUILD_DIR" "$ARTIFACT_DIR" 2>/dev/null || true
            exit "$rc"
          }
          trap finish EXIT
          set -x

          test -n "$SOURCE_COMMIT"
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          rm -rf "$BUILD_DIR" "$ARTIFACT_DIR"
          mkdir -p "$BUILD_DIR" "$ARTIFACT_DIR"/{bin,lib,logs,metadata,source}

          cmake -S . -B "$BUILD_DIR" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            '-DCMAKE_CXX_FLAGS_RELEASE=-O2 -DNDEBUG' \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DCMAKE_GTEST_DISCOVER_TESTS_DISCOVERY_MODE=PRE_TEST \
            -DBUILD_SHARED_LIBS=OFF \
            -DBUILD_TUTORIALS=OFF \
            -DBUILD_PYTHON=OFF \
            -DDIRECTIONAL_BUILD_CLI=OFF \
            -DDIRECTIONAL_BUILD_GUI=OFF \
            -DDIRECTIONAL_BUILD_BENCHMARKS=ON \
            -DDIRECTIONAL_BUILD_TESTS=ON \
            -DDIRECTIONAL_BUILD_HISTORICAL_TESTS=OFF \
            -DDIRECTIONAL_BUILD_LEGACY_INTEGRATION_TESTS=OFF \
            -DDIRECTIONAL_BUILD_OPTIONAL_GUIDANCE_TESTS=OFF \
            -DDIRECTIONAL_ENABLE_GMP=OFF \
            -DDIRECTIONAL_ENABLE_PARDISO=OFF \
            -DDIRECTIONAL_ENABLE_CUDSS=OFF \
            -DDIRECTIONAL_ENABLE_SUITESPARSE=OFF \
            2>&1 | tee "$BUILD_DIR/configure.log"

          cmake --build "$BUILD_DIR" --target \
            directional_core \
            directional_pipeline \
            directional_compiled_api_tests \
            directional_surface_cell_producer_tests \
            directional_surface_cell_completion_tests \
            directional_surface_cell_validation_tests \
            directional_benchmarks \
            -j 4 2>&1 | tee "$BUILD_DIR/build.log"

          ! grep -E -- '--gtest_list_tests|--gtest_filter|Running main\(\)|\[==========\]|BM_' "$BUILD_DIR/build.log"

          for target in \
            directional_compiled_api_tests \
            directional_surface_cell_producer_tests \
            directional_surface_cell_completion_tests \
            directional_surface_cell_validation_tests \
            directional_benchmarks; do
            target_path=$(find "$BUILD_DIR" -type f -name "$target" -perm -111 | head -1)
            test -n "$target_path"
            cp "$target_path" "$ARTIFACT_DIR/bin/"
          done

          find "$BUILD_DIR" -maxdepth 4 -type f \
            \( -name libdirectional_core.a -o -name libdirectional_pipeline.a \) \
            -exec cp {} "$ARTIFACT_DIR/lib/" \;
          test -f "$ARTIFACT_DIR/lib/libdirectional_core.a"
          test -f "$ARTIFACT_DIR/lib/libdirectional_pipeline.a"

          test -d "$BUILD_DIR/test-data/benchmarks/fixtures"
          mkdir -p "$ARTIFACT_DIR/bin/test-data/benchmarks"
          cp -a "$BUILD_DIR/test-data/benchmarks/fixtures" \
            "$ARTIFACT_DIR/bin/test-data/benchmarks/"
          fixture_count=$(find "$ARTIFACT_DIR/bin/test-data/benchmarks/fixtures" -type f | wc -l)
          echo "$fixture_count" > /tmp/fixture-count.txt
          test "$fixture_count" -eq 26

          cp "$BUILD_DIR/configure.log" "$BUILD_DIR/build.log" "$LOG" \
            "$ARTIFACT_DIR/logs/"
          cp /tmp/submodules.txt \
            /tmp/payload-sha256.txt \
            /tmp/changed-files.txt \
            /tmp/fixture-count.txt \
            /tmp/cmake-root-blob.txt \
            /tmp/test-cmake-blob.txt \
            /tmp/acceptance-test-blob.txt \
            /tmp/testing-strategy-blob.txt \
            /tmp/handoff-blob.txt \
            /tmp/tracing-header-blob.txt \
            /tmp/tracing-source-blob.txt \
            /tmp/arrangement-header-blob.txt \
            /tmp/arrangement-source-blob.txt \
            /tmp/pipeline-source-blob.txt \
            "$ARTIFACT_DIR/metadata/"
          git status --porcelain=v1 --untracked-files=no \
            > "$ARTIFACT_DIR/metadata/source-status.txt"
          test ! -s "$ARTIFACT_DIR/metadata/source-status.txt"

          printf '%s\n' "$SOURCE_COMMIT" > "$ARTIFACT_DIR/SOURCE_COMMIT"
          printf '%s\n' "$GITHUB_SHA" > "$ARTIFACT_DIR/WORKFLOW_EVENT_COMMIT"
          printf '%s\n' \
            'No test, benchmark, custom input, help/list/discovery command, CLI, GUI, or generated project binary was executed.' \
            > "$ARTIFACT_DIR/metadata/EXECUTION_POLICY.txt"

          git archive --format=tar.gz \
            --output="$ARTIFACT_DIR/source/directional-source-$SOURCE_COMMIT.tar.gz" \
            "$SOURCE_COMMIT"
          cp "$BUILD_DIR/compile_commands.json" "$ARTIFACT_DIR/metadata/"

          cat > "$ARTIFACT_DIR/metadata/build-summary.json" <<JSON
          {"turn":"g1-uniform-phase-front-code-build","workflow_run":"$GITHUB_RUN_ID","workflow_event_commit":"$GITHUB_SHA","source_commit":"$SOURCE_COMMIT","active_gate":"G1 uniform phase-front plane","configuration":"Release -O2 -DNDEBUG, static","targets":["directional_core","directional_pipeline","directional_compiled_api_tests","directional_surface_cell_producer_tests","directional_surface_cell_completion_tests","directional_surface_cell_validation_tests","directional_benchmarks"],"gtest_discovery_mode":"PRE_TEST","fixture_count":$fixture_count,"tests_executed":false,"benchmarks_executed":false,"project_binary_executed":false}
          JSON

          (
            cd "$ARTIFACT_DIR"
            find . -type f ! -name SHA256SUMS -print0 \
              | sort -z | xargs -0 sha256sum > SHA256SUMS
            sha256sum -c SHA256SUMS
          )

      - name: Upload compile artifact
        uses: actions/upload-artifact@v4
        with:
          name: surface-cell-g1-uniform-phase-front-linux-release
          path: artifact
          if-no-files-found: error
          retention-days: 30
          compression-level: 6

      - name: Always upload detailed workflow logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surface-cell-g1-uniform-phase-front-build-logs-${{ github.run_id }}
          path: /tmp/g1-phase-front-build-logs
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
