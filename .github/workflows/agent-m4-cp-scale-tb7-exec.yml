name: Agent M4 CP SCALE TB7 Artifact-Only Execution

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m4-cp-scale-tb7-exec.txt

permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: agent-m4-cp-scale-tb7-exec-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/agent-m4-cp-scale-tb7-exec.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m4-cp-scale-tb7-exec
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  execute:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    runs-on: ubuntu-24.04
    env:
      CANDIDATE_ARTIFACT_ID: "10425344367"
      CANDIDATE_PROVIDER_SHA256: 1e29c9f3348b2e153d563c7e94acdaea52be8f16f6520fa8603fa084bba734bc
      SEMANTIC_SOURCE_SHA: 01b1124af094044e32d6887ff0615881333d12ce
      SOURCE_ARCHIVE_SHA256: 32dadccc50a33a40e24f3f47f412203bd4b8f64fe8c87a72f066328c8f49fbb2
      PACKAGE_MANIFEST_SHA256: 9d91ff51fce9133b25c970eeab68e9a30ec7c449498ad387497e4fc74834d144
      SELECTOR_SHA256: e0e0f394faae536ac257ec5409653a34755a8afe0ca437562eb44c9895790e0b
      PREFIX424_SHA256: f202a1720c0a5288471d04836402b8432eb6f4f788da68a12e70dacb875466ca
      ROW425_IDENTITY: M4CPScaleS3.ExactTraversalStateRepeatPublishesLimitCycleTermination
    steps:
      - name: Initialize diagnostic log and blocked result
        shell: bash
        run: |
          set -euo pipefail
          : > "${RUNNER_TEMP}/m4-cp-scale-tb7-exec.log"
          mkdir -p "${RUNNER_TEMP}/tb7-result"
          printf '%s\n' 'status=BLOCKED_PRE_RUNTIME' 'runtimeStarted=false' 'runtimeCompleted=false' > "${RUNNER_TEMP}/tb7-result/final-status.txt"

      - name: Checkout exact orchestration source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Execute immutable selector425 gate
        id: runtime
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: bash .agents/Directional/turn-payloads/m4-cp-scale-tb7-exec.sh

      - name: Record final runtime job status
        if: always()
        shell: bash
        run: |
          set +e
          {
            echo "runtime_step_outcome=${{ steps.runtime.outcome }}"
            echo "final_job_status_before_enforcement=${{ job.status }}"
            echo "finished_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } | tee -a "${RUNNER_TEMP}/m4-cp-scale-tb7-exec.log"

      - name: Upload TB7 result artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m4-cp-scale-tb7-result-${{ github.run_id }}
          path: ${{ runner.temp }}/tb7-result
          if-no-files-found: error
          retention-days: 7

      - name: Upload TB7 diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m4-cp-scale-tb7-log-${{ github.run_id }}
          path: ${{ runner.temp }}/m4-cp-scale-tb7-exec.log
          if-no-files-found: error
          retention-days: 7

      - name: Enforce mechanical gate outcome
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f "${RUNNER_TEMP}/tb7-result/final-status.txt"
          grep -Fx 'status=MECHANICALLY_GREEN' "${RUNNER_TEMP}/tb7-result/final-status.txt"
          grep -Fx 'runtimeCompleted=true' "${RUNNER_TEMP}/tb7-result/final-status.txt"
