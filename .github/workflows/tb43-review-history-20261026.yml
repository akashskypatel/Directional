name: TB43 Review Authentic History Boundary

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/tb43-review-history-20261026.txt

permissions:
  actions: read
  contents: write

concurrency:
  group: tb43-review-history-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/tb43-review-history-20261026.yml
      source_ref: ${{ github.sha }}

  boundary:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Initialize diagnostic log
        shell: bash
        run: |
          set -euo pipefail
          : > "${RUNNER_TEMP}/tb43-review-history.log"
          echo "event_sha=${GITHUB_SHA}" | tee -a "${RUNNER_TEMP}/tb43-review-history.log"
          echo "event_ref=${GITHUB_REF}" | tee -a "${RUNNER_TEMP}/tb43-review-history.log"
      - name: Checkout exact event with authentic full Git history
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Execute review boundary and immutable source check
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee -a "${RUNNER_TEMP}/tb43-review-history.log") 2>&1
          trap 'status=$?; echo "review_gate_exit=${status}"' EXIT
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "$(git rev-parse refs/remotes/origin/${GITHUB_REF_NAME})" = "${GITHUB_SHA}"
          git checkout -B tb43-review-check "${GITHUB_SHA}"
          git branch --set-upstream-to="origin/${GITHUB_REF_NAME}" tb43-review-check
          git status -sb
          git status --porcelain | grep . && { echo 'unexpected working tree mutation'; exit 2; } || true
          python3 .agents/Directional/tools/review_check.py boundary
          if git diff --name-only d354d6ae95afc73df968fc5cc4ee69fe5b7de451 HEAD -- src include tests benchmarks CMakeLists.txt cmake | grep .; then
            echo 'frozen semantic code changed'; exit 3
          fi
          echo 'semantic source to HEAD code surfaces clean'
          test -z "$(git status --porcelain)"
          git status -sb
          echo 'ALL REVIEW HISTORY CHECKS PASSED'
      - name: Upload independent history evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tb43-review-history-${{ github.run_id }}
          path: ${{ runner.temp }}/tb43-review-history.log
          if-no-files-found: error
          retention-days: 14

  mailbox:
    if: ${{ always() }}
    needs: [validate, boundary]
    uses: ./.github/workflows/workflow-mailbox-publisher.yml
    with:
      mailbox_branch: workflow-mailbox
      workflow_key: m6-cp3-tb43-rev-history
      source_sha: ${{ github.sha }}
      source_ref: ${{ github.ref }}
      result: ${{ needs.boundary.result }}
      summary: Independent authentic-git review boundary and semantic source check.
