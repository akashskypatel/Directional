name: TB87 Reaudit Static Review Check
on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/review-boundary/tb87-reaudit-20261108.txt
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Initialize evidence
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "event_sha=${GITHUB_SHA}" "started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" > "${RUNNER_TEMP}/tb87-reaudit-check.log"
      - name: Checkout full authentic Git history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false
          persist-credentials: false
      - name: Static boundary and append-only ledger verification
        shell: bash
        run: |
          set -euo pipefail
          { python3 .agents/Directional/tools/review_check.py boundary; python3 .agents/Directional/tools/review_check.py ledgers --base 8b7299b43; } 2>&1 | tee -a "${RUNNER_TEMP}/tb87-reaudit-check.log"
      - name: Upload result log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tb87-reaudit-static-check-${{ github.run_id }}
          path: ${{ runner.temp }}/tb87-reaudit-check.log
          if-no-files-found: error
          retention-days: 14
  mailbox:
    if: ${{ always() }}
    needs: [verify]
    permissions:
      actions: read
      contents: write
    uses: ./.github/workflows/workflow-mailbox-publisher.yml
    with:
      mailbox_branch: workflow-mailbox
      workflow_key: tb87-reaudit-static-check
      source_sha: ${{ github.sha }}
      source_ref: ${{ github.ref }}
      result: ${{ needs.verify.result }}
      summary: TB87 substantive independent re-audit static boundary and ledgers
