name: Agent Build Surface Cell P5 R2E Package Fix

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .github/workflows/agent-build-p5-r2e-package-fix.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: agent-surface-cell-p5-r2e-package-fix-${{ github.ref }}
  cancel-in-progress: true

env:
  ACTIVE_BRANCH: agent/surface_cell_quad/p5-recover-bridge-healing
  BUILD_DIR: build/agent-p5-r2e-release
  PACKAGE_DIR: artifact
  LOG_DIR: /tmp/p5-r2e-package-fix-workflow-logs
  ACTIVITY_LOG: /tmp/p5-r2e-package-fix-workflow-logs/p5-r2e-package-fix-compile-activity.log
  IMPLEMENTATION_SHA: f5afd014cced8205d485bea4f1470725e1fd8be1
  REVIEWED_PATCH_SHA256: 3ca1d3b940989e1fbda9e0f8f4b0b8c5971643575550ff9e34501e219651d628
  APPLIED_DIFF_SHA256: abf671a365ab97ba3075962528bcf76b71901f6dc06a7d0b877499561c89814e

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Initialize persistent workflow log
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${LOG_DIR}"
          {
            echo "P5-R2E corrected package-manifest compile-only build"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "run_attempt=${GITHUB_RUN_ATTEMPT}"
            echo "event_sha=${GITHUB_SHA}"
            echo "implementation_sha=${IMPLEMENTATION_SHA}"
            echo "started_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } | tee "${ACTIVITY_LOG}"

      - name: Checkout exact event commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 3
          submodules: false
          persist-credentials: true

      - name: Compile unchanged R2E source and package corrected manifest
        id: compile
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "${LOG_DIR}"
          exec > >(tee -a "${ACTIVITY_LOG}") 2>&1
          PS4='+ ${BASH_SOURCE}:${LINENO}: '
          finish() {
            rc=$?
            trap - EXIT
            set +x
            {
              echo "compile_step_exit_code=${rc}"
              echo "compile_step_finished_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
              echo "final_git_status_begin"
              git status --short --branch || true
              echo "final_git_status_end"
              df -h . || true
              du -sh "${BUILD_DIR}" "${PACKAGE_DIR}" 2>/dev/null || true
            } | tee -a "${ACTIVITY_LOG}"
            exit "${rc}"
          }
          trap finish EXIT
          set -x

          event_sha=$(git rev-parse HEAD)
          test "${event_sha}" = "${GITHUB_SHA}"
          test "$(git rev-parse HEAD^)" = "${IMPLEMENTATION_SHA}"
          remote_sha=$(git ls-remote origin "refs/heads/${ACTIVE_BRANCH}" | cut -f1)
          test "${event_sha}" = "${remote_sha}"
          git status --porcelain=v1 > /tmp/pre-clean-status.txt
          test ! -s /tmp/pre-clean-status.txt

          git config user.name directional-build-agent
          git config user.email directional-build-agent@users.noreply.github.com
          rm -f .github/workflows/agent-build-p5-r2e-package-fix.yml
          git add -u
          git diff --cached --check
          git commit -m 'ci: finalize P5-R2E package manifest [skip ci]'
          git push origin "HEAD:${ACTIVE_BRANCH}"

          source_sha=$(git rev-parse HEAD)
          remote_sha=$(git ls-remote origin "refs/heads/${ACTIVE_BRANCH}" | cut -f1)
          test "${source_sha}" = "${remote_sha}"
          test "$(git rev-parse HEAD^)" = "${event_sha}"
          printf '%s\n' "${source_sha}" > /tmp/source-commit.txt
          printf '%s\n' "${event_sha}" > /tmp/workflow-event-commit.txt
          printf '%s\n' "${IMPLEMENTATION_SHA}" > /tmp/implementation-commit.txt
          printf '%s\n' "${REVIEWED_PATCH_SHA256}" > /tmp/reviewed-patch-sha256.txt
          printf '%s\n' "${APPLIED_DIFF_SHA256}" > /tmp/applied-commit-diff-sha256.txt

          git submodule sync --recursive
          git submodule update --init --recursive --depth 1 --jobs 4
          git submodule status --recursive | tee /tmp/submodule-status.txt
          test "$(wc -l < /tmp/submodule-status.txt)" -eq 9
          git diff --check
          git status --porcelain=v1 > /tmp/source-status.txt
          test ! -s /tmp/source-status.txt
          find .github/workflows -maxdepth 1 -type f -printf '%P\n' | sort \
            > /tmp/source-workflows.txt
          test "$(wc -l < /tmp/source-workflows.txt)" -eq 1
          grep -Fx 'agent-source-snapshot.yml' /tmp/source-workflows.txt
          find .agents/Directional/patches -type f 2>/dev/null | sort \
            > /tmp/source-payloads.txt || true
          test ! -s /tmp/source-payloads.txt

          rm -rf "${BUILD_DIR}" "${PACKAGE_DIR}"
          mkdir -p "${BUILD_DIR}" "${PACKAGE_DIR}/bin" "${PACKAGE_DIR}/lib" \
            "${PACKAGE_DIR}/source" "${PACKAGE_DIR}/logs"
          cmake -S . -B "${BUILD_DIR}" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_FLAGS_RELEASE='-O2 -DNDEBUG' \
            -DBUILD_SHARED_LIBS=OFF \
            -DDIRECTIONAL_BUILD_TESTS=ON \
            -DDIRECTIONAL_BUILD_BENCHMARKS=ON \
            -DDIRECTIONAL_BUILD_CLI=OFF \
            -DDIRECTIONAL_BUILD_GUI=OFF \
            -DDIRECTIONAL_ENABLE_GMP=OFF \
            -DDIRECTIONAL_ENABLE_PARDISO=OFF \
            -DDIRECTIONAL_ENABLE_CUDSS=OFF \
            -DDIRECTIONAL_ENABLE_SUITESPARSE=OFF \
            |& tee "${BUILD_DIR}/configure.log"
          cmake --build "${BUILD_DIR}" \
            --target directional_core directional_pipeline directional_phase1_tests directional_benchmarks \
            -j 4 |& tee "${BUILD_DIR}/build.log"

          test -f "${BUILD_DIR}/libdirectional_core.a"
          test -f "${BUILD_DIR}/libdirectional_pipeline.a"
          test -x "${BUILD_DIR}/directional_phase1_tests"
          test -x "${BUILD_DIR}/directional_benchmarks"
          fixture_root="${BUILD_DIR}/test-data/benchmarks/fixtures"
          find "${fixture_root}" -type f | sort | tee /tmp/fixture-files.txt
          test "$(wc -l < /tmp/fixture-files.txt)" -eq 26
          git status --porcelain=v1 > /tmp/source-status.txt
          test ! -s /tmp/source-status.txt

          cp "${BUILD_DIR}/directional_phase1_tests" "${PACKAGE_DIR}/bin/"
          cp "${BUILD_DIR}/directional_benchmarks" "${PACKAGE_DIR}/bin/"
          cp -a "${BUILD_DIR}/test-data" "${PACKAGE_DIR}/bin/"
          cp "${BUILD_DIR}/libdirectional_core.a" "${PACKAGE_DIR}/lib/"
          cp "${BUILD_DIR}/libdirectional_pipeline.a" "${PACKAGE_DIR}/lib/"
          git archive --format=tar.gz --output="${PACKAGE_DIR}/source/source.tar.gz" HEAD
          cp /tmp/source-commit.txt /tmp/workflow-event-commit.txt \
            /tmp/implementation-commit.txt /tmp/reviewed-patch-sha256.txt \
            /tmp/applied-commit-diff-sha256.txt /tmp/source-status.txt \
            /tmp/submodule-status.txt /tmp/fixture-files.txt \
            /tmp/source-workflows.txt /tmp/source-payloads.txt "${PACKAGE_DIR}/"
          cp "${BUILD_DIR}/configure.log" "${BUILD_DIR}/build.log" \
            "${ACTIVITY_LOG}" "${PACKAGE_DIR}/logs/"
          sha256sum "${PACKAGE_DIR}/bin/directional_phase1_tests" \
            "${PACKAGE_DIR}/bin/directional_benchmarks" \
            "${PACKAGE_DIR}/lib/libdirectional_core.a" \
            "${PACKAGE_DIR}/lib/libdirectional_pipeline.a" \
            | tee "${PACKAGE_DIR}/built-targets.sha256"
          find "${PACKAGE_DIR}" -type f ! -name files.sha256 -print0 \
            | sort -z | xargs -0 sha256sum > /tmp/files.sha256
          mv /tmp/files.sha256 "${PACKAGE_DIR}/files.sha256"
          sha256sum -c "${PACKAGE_DIR}/files.sha256"

      - name: Upload corrected compiled checkpoint
        if: steps.compile.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: surface-cell-p5-r2e-corrected-github-source-linux-release
          path: artifact
          if-no-files-found: error
          retention-days: 14
          compression-level: 6

      - name: Always upload detailed workflow logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surface-cell-p5-r2e-package-fix-workflow-logs-${{ github.run_id }}
          path: /tmp/p5-r2e-package-fix-workflow-logs
          if-no-files-found: error
          retention-days: 30
