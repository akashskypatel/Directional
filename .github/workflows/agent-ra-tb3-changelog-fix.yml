name: Agent R-A Retry 3 Changelog Correction

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/ra-tb3-changelog-fix.txt

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/surface_cell_quad/p5-recover-bridge-healing
          fetch-depth: 1
      - name: Correct packaged inventory count in historical CB entry
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.agents/Directional/CHANGELOG.md')
          s = p.read_text()
          old = 'Regenerated R-A inventory: **19 paths / 59 probes / 245 matches**'
          new = 'Regenerated R-A inventory: **19 paths / 59 probes / 261 matches**'
          if s.count(old) != 1:
              raise SystemExit(f'expected one stale count, found {s.count(old)}')
          p.write_text(s.replace(old, new, 1))
          PY
          git diff --check
          git config user.name 'Directional Agent'
          git config user.email 'directional-agent@users.noreply.github.com'
          git add -f .agents/Directional/CHANGELOG.md
          git commit -m 'docs: correct RA-CB inventory count'
          git push origin HEAD:agent/surface_cell_quad/p5-recover-bridge-healing
