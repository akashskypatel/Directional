name: m1c-field-transition-immutable-runtime

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m1c-field-transition-immutable-runtime

permissions:
  contents: read
  actions: read

concurrency:
  group: m1c-field-transition-immutable-runtime-${{ github.ref }}
  cancel-in-progress: false

jobs:
  artifact-runtime:
    name: ${{ matrix.case }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - case: BunnyRandom
            filter: UniformPhaseFront/SurfaceCellDesignAcceptance.ProducesDirectSourceAuthoritativePureQuadOutput/BunnyRandom
            timeout_seconds: 90
          - case: Vase
            filter: UniformPhaseFront/SurfaceCellDesignAcceptance.ProducesDirectSourceAuthoritativePureQuadOutput/Vase
            timeout_seconds: 60
    env:
      BUILD_RUN_ID: '31334345368'
      ARTIFACT_ID: '9043971772'
      EXPECTED_ZIP_SHA256: dde120c94be222dc93aeebb08f7a674882c5f8011ede62ec420209b0e0f4fd85
      EXPECTED_MANIFEST_SHA256: d9a4bdfe5b160095a6cf4949c57e54d726d36f745ff0a6580e9080d5319d495d
      EXPECTED_IMPLEMENTATION: e139fca885538e310dc47ed7ba531517603d92cf
      EXPECTED_BUILD_EVENT: ebda31859a18005844f81274393211991361cbbb
      EXPECTED_PRODUCER_SHA256: 9608ec2a0fc8eec52e4ceb61df53c0aae5670f9834b358a08e390ac9bb93fbdd

    steps:
      - name: Initialize unconditional activity log
        shell: bash
        run: |
          set -Eeuo pipefail
          log_dir="$RUNNER_TEMP/m1c-runtime-${{ matrix.case }}-logs"
          evidence_dir="$RUNNER_TEMP/m1c-runtime-${{ matrix.case }}-evidence"
          mkdir -p "$log_dir" "$evidence_dir"
          activity="$log_dir/activity.log"
          {
            echo "turn=M1c immutable Test+Benchmark Bunny/Vase comparison"
            echo "case=${{ matrix.case }}"
            echo "filter=${{ matrix.filter }}"
            echo "timeout_seconds=${{ matrix.timeout_seconds }}"
            echo "repository=$GITHUB_REPOSITORY"
            echo "event_sha=$GITHUB_SHA"
            echo "build_run_id=$BUILD_RUN_ID"
            echo "artifact_id=$ARTIFACT_ID"
            echo "runtimeExecution=true"
            echo "configure=false"
            echo "compile=false"
            echo "relink=false"
            echo "sourceEdit=false"
            echo "fixtureContentEdit=false"
            echo "started_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } | tee "$activity"
          echo "LOG_DIR=$log_dir" >> "$GITHUB_ENV"
          echo "ACTIVITY_LOG=$activity" >> "$GITHUB_ENV"
          echo "EVIDENCE_DIR=$evidence_dir" >> "$GITHUB_ENV"

      - name: Download and verify exact immutable artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          exec > >(tee -a "$ACTIVITY_LOG") 2>&1
          finish() {
            rc=$?
            trap - EXIT
            echo "step=preflight exit_code=$rc finished_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            exit "$rc"
          }
          trap finish EXIT

          work="$RUNNER_TEMP/m1c-runtime-${{ matrix.case }}"
          rm -rf "$work"
          mkdir -p "$work/package"

          metadata_json="$work/artifact-metadata.json"
          curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID" \
            -o "$metadata_json"
          python3 - "$metadata_json" <<'PY'
          import json, os, sys
          data=json.load(open(sys.argv[1]))
          assert data['id'] == int(os.environ['ARTIFACT_ID']), data
          assert data['workflow_run']['id'] == int(os.environ['BUILD_RUN_ID']), data
          assert data['digest'] == 'sha256:' + os.environ['EXPECTED_ZIP_SHA256'], data.get('digest')
          assert not data['expired'], data
          print('github_artifact_digest=' + data['digest'])
          PY

          curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" \
            -o "$work/artifact.zip"
          echo "$EXPECTED_ZIP_SHA256  $work/artifact.zip" | sha256sum -c -

          python3 - "$work/artifact.zip" <<'PY'
          import pathlib, sys, zipfile
          z=zipfile.ZipFile(sys.argv[1])
          bad=[]
          for name in z.namelist():
              p=pathlib.PurePosixPath(name)
              if p.is_absolute() or '..' in p.parts:
                  bad.append(name)
          assert not bad, bad
          print(f'zip_entries={len(z.namelist())}')
          PY
          unzip -q "$work/artifact.zip" -d "$work/package"
          cd "$work/package"

          test "$(sha256sum SHA256SUMS | awk '{print $1}')" = "$EXPECTED_MANIFEST_SHA256"
          test "$(wc -l < SHA256SUMS)" -eq 54
          sha256sum -c SHA256SUMS | tee "$EVIDENCE_DIR/package-checksums.txt"

          python3 - <<'PY'
          import json, os
          data=json.load(open('metadata/build-authority.json'))
          assert data['implementationCommit'] == os.environ['EXPECTED_IMPLEMENTATION'], data
          assert data['buildEventCommit'] == os.environ['EXPECTED_BUILD_EVENT'], data
          assert data['workflowRun'] == os.environ['BUILD_RUN_ID'], data
          assert data['runtimeExecution'] is False, data
          assert data['m1cFocusedStaticTestCount'] == 6, data
          assert data['m1bFocusedStaticTestCount'] == 6, data
          assert data['authorityKernelStaticTestCount'] == 14, data
          assert data['oracleStaticTestCount'] == 29, data
          print('build_authority=verified')
          PY

          producer_sha="$(sha256sum bin/directional_surface_cell_producer_tests | awk '{print $1}')"
          test "$producer_sha" = "$EXPECTED_PRODUCER_SHA256"
          echo "producer_sha256=$producer_sha" | tee "$EVIDENCE_DIR/preflight.txt"
          echo "artifact_sha256=$EXPECTED_ZIP_SHA256" >> "$EVIDENCE_DIR/preflight.txt"
          echo "manifest_sha256=$EXPECTED_MANIFEST_SHA256" >> "$EVIDENCE_DIR/preflight.txt"
          echo "regular_files=$(find . -type f | wc -l)" >> "$EVIDENCE_DIR/preflight.txt"
          echo "fixture_files=$(find test-data/benchmarks/fixtures -type f | wc -l)" >> "$EVIDENCE_DIR/preflight.txt"
          test "$(find . -type f | wc -l)" -eq 55
          test "$(find test-data/benchmarks/fixtures -type f | wc -l)" -eq 27

          chmod +x bin/directional_surface_cell_producer_tests
          ln -s ../test-data bin/test-data
          echo "WORK_DIR=$work" >> "$GITHUB_ENV"

      - name: Run exact existing production case under guard
        shell: bash
        run: |
          set -Eeuo pipefail
          exec > >(tee -a "$ACTIVITY_LOG") 2>&1
          cd "$WORK_DIR/package/bin"
          filter='${{ matrix.filter }}'
          printf '%s\n' "$filter" > "$EVIDENCE_DIR/filter.txt"
          set +e
          /usr/bin/time -f 'elapsed=%e maxrss_kb=%M exit=%x' -o "$EVIDENCE_DIR/time.txt" \
            timeout '${{ matrix.timeout_seconds }}s' ./directional_surface_cell_producer_tests \
              --gtest_filter="$filter" \
              > "$EVIDENCE_DIR/stdout.txt" 2> "$EVIDENCE_DIR/stderr.txt"
          rc=$?
          set -e
          echo "$rc" > "$EVIDENCE_DIR/return-code.txt"
          selected="$( (grep -Eo 'Running [0-9]+ test' "$EVIDENCE_DIR/stdout.txt" || true) | head -1 | awk '{print $2}')"
          echo "${selected:-0}" > "$EVIDENCE_DIR/selected-count.txt"
          cat "$EVIDENCE_DIR/stdout.txt"
          cat "$EVIDENCE_DIR/stderr.txt" >&2
          cat "$EVIDENCE_DIR/time.txt"
          echo "runtime_return_code=$rc selected_count=${selected:-0}" | tee -a "$ACTIVITY_LOG"
          test "${selected:-0}" -eq 1

      - name: Postflight immutable package content
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          exec > >(tee -a "$ACTIVITY_LOG") 2>&1
          if [ -n "${WORK_DIR:-}" ] && [ -d "$WORK_DIR/package" ]; then
            cd "$WORK_DIR/package"
            test "$(sha256sum SHA256SUMS | awk '{print $1}')" = "$EXPECTED_MANIFEST_SHA256"
            sha256sum -c SHA256SUMS > "$EVIDENCE_DIR/postflight-checksums.txt"
            test "$(grep -c ': OK$' "$EVIDENCE_DIR/postflight-checksums.txt")" -eq 54
            producer_sha="$(sha256sum bin/directional_surface_cell_producer_tests | awk '{print $1}')"
            test "$producer_sha" = "$EXPECTED_PRODUCER_SHA256"
            test "$(sha256sum "$WORK_DIR/artifact.zip" | awk '{print $1}')" = "$EXPECTED_ZIP_SHA256"
            echo "postflight=immutable-content-verified" | tee "$EVIDENCE_DIR/postflight.txt"
          else
            echo "postflight=skipped-preflight-did-not-complete" | tee "$EVIDENCE_DIR/postflight.txt"
          fi
          echo "finished_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)" | tee -a "$ACTIVITY_LOG"

      - name: Upload runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m1c-${{ matrix.case }}-runtime-evidence
          path: ${{ env.EVIDENCE_DIR }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 6

      - name: Upload detailed activity log always
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m1c-${{ matrix.case }}-runtime-logs
          path: ${{ env.LOG_DIR }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 6
