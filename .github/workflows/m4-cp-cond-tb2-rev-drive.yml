name: M4 CP-COND TB2 REV Drive Closeout

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m4-cp-cond-tb2-rev-drive/execute.txt

permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

concurrency:
  group: m4-cp-cond-tb2-rev-drive-${{ github.ref }}
  cancel-in-progress: false

jobs:
  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m4-cp-cond-tb2-rev-drive
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  apply-drive-patch:
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1Gf4aMtFQIBJCsoqy85GkFvyPm4gP1GaD
      patch_sha256: 'f3d01b96b810b456da150c578d6813892279b486a8c72af3a62c8be78e8cca23'
      base_sha: 0a367003d05b51123e6252578860b33f50a0ec8e
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: 'docs: correct current M4 CP-COND TODO status'
      retention_days: 14
    secrets: inherit
