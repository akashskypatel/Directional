name: M4 CP-COND TB2 REV Drive Closeout

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m4-cp-cond-tb2-rev-drive/execute.txt

permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

concurrency:
  group: m4-cp-cond-tb2-rev-drive-${{ github.ref }}
  cancel-in-progress: false

jobs:
  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m4-cp-cond-tb2-rev-drive
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  apply-drive-patch:
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 13noYD4mjnzwThBjh5PxW9k_akHwuZXwf
      patch_sha256: 'ac15f316fe9c4c095184ddef3031169fc9c140830beda981c656d1446d33856c'
      base_sha: 69e06392a06fda3fdedbd3eaf7c7061737472272
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: 'docs: review M4-CP-COND TB2 and freeze CB3'
      retention_days: 14
    secrets: inherit
