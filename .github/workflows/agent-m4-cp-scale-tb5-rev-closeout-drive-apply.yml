name: Agent M4 CP SCALE TB5 REV Closeout Drive Apply

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m4-cp-scale-tb5-rev-closeout-drive-apply/trigger.txt

permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

concurrency:
  group: agent-m4-cp-scale-tb5-rev-closeout-drive-apply
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/agent-m4-cp-scale-tb5-rev-closeout-drive-apply.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m4-cp-scale-tb5-rev-closeout-drive-apply
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  apply:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1uuKgajkawlxpoubXcZkVXZVIJ_IED6jz
      patch_sha256: acdc09e10411a8151f5a9f552d73b36d31c3d2931e22de448788dab48fe818cc
      base_sha: 5ea774538567db82058067826e48b3ffc1fd97f2
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: docs: close M4-CP-SCALE-TB5 review and plan CB7
    secrets: inherit
