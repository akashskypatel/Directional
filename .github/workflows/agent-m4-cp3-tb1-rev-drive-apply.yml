    with:
      workflow_path: .github/workflows/agent-m4-cp3-tb1-rev-drive-apply.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  apply:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1GpJmDOCBF_LbnBgccIWfkI4G-Xf_BtQH
      patch_sha256: '2bd766f5108a90e94c0603ace3118532e979179b8ad074f54d445fd53b23afea'
      base_sha: 3ec69ffeb88f6378ca8a7a680ef8f3a7e4be64f4
