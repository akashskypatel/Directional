name: M4 CP-COND CB2 Closeout Drive Apply

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m4-cp-cond-cb2-closeout-drive.txt

permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

concurrency:
  group: m4-cp-cond-cb2-closeout-drive-${{ github.ref }}
  cancel-in-progress: false

jobs:
  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m4-cp-cond-cb2-closeout-drive
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  apply-drive-patch:
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1LvhffFmKZ89he7Gi1Y4pOvdO048G51_8
      patch_sha256: 'dd32588c62e11ed3f80b545e32861971a162681cd0cd4d14290dab97a0eeb5e3'
      base_sha: 36fdb3209341b24aaf0feb604ab6a3c6a38aec2a
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: 'docs: close M4-CP-COND-CB2 and freeze TB2 execution'
      retention_days: 14
    secrets: inherit
