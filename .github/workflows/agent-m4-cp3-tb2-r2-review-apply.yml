name: Agent M4 CP3 TB2 R2 Review Apply

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m4-cp3-tb2-r2-review-apply.txt

permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

concurrency:
  group: agent-m4-cp3-tb2-r2-review-apply-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/agent-m4-cp3-tb2-r2-review-apply.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m4-cp3-tb2-r2-review-apply
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  apply:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1qvcuz9EFOsBQQZ-ipZkl8GMtbAppmX1N
      patch_sha256: a0cec033d1c8d77b8408d31f5a7826592380a6d5554998938c9a3a60fd0c8846
      base_sha: a4227d090f93d5c28056d68a9237d3a63bca083a
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: "docs: accept M4-CP3-TB2-R2 evidence and freeze CB5"
    secrets: inherit
