name: Agent M3 CP4c0 TB-R6 Closeout Patch Apply

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m3-cp4c0-tb-r6-closeout-apply.txt

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

concurrency:
  group: agent-m3-cp4c0-tb-r6-closeout-apply
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/agent-m3-cp4c0-tb-r6-closeout-apply.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m3-cp4c0-tb-r6-closeout-apply
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  apply:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1Y8vbVC3COeCDeTe7D0IvyP62wkb_4Xbx
      patch_sha256: 2ee3b354ab99bc7a4580ad135281cc4de0a6e62f9fedf21747c2875138ad791a
      base_sha: 86d8b15c4e14d85723ad81280334bc8ccbc703c2
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: "docs: close M3 CP4c-0 TB-R6"
    secrets: inherit
