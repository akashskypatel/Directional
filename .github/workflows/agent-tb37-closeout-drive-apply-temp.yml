name: Agent TB37 Closeout Drive Apply

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/tb37-closeout-drive-apply.txt

permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

concurrency:
  group: agent-tb37-closeout-drive-apply
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/agent-tb37-closeout-drive-apply-temp.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: tb37-closeout-drive-apply
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  apply:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1l5JQAmn7WA-E2u_B93kA7AOeotO_oCBG
      patch_sha256: eb738ad3deb1311cbfa0999ee689eb4725932ae6954a1bce4dae1c21c2756a62
      base_sha: 2b6287240d84ae9f7d8fa1f093835c9886831abb
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: docs: close M3-CP4c-3 TB37 artifact-only EXEC
      retention_days: 14
    secrets: inherit
