name: Agent TB39 Exact Source Snapshot

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/source-snapshot/tb39-b56c742d.json

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: agent-tb39-source-snapshot
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/agent-tb39-source-snapshot.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: tb39-source-snapshot
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  snapshot:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-source-snapshot.yml
    with:
      source_ref: b56c742db960070b73aecb0e651520fd53cb43e3
      artifact_prefix: tb39-source-snapshot
      retention_days: 7
    secrets: inherit
