name: Agent Delete Accidental CB48 Branch

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/delete-accidental-cb48-branch-20260908.txt

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: agent-delete-accidental-cb48-branch
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/agent-delete-accidental-cb48-branch.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: cb48-accidental-branch-cleanup
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  delete_branch:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Initialize diagnostic log
        shell: bash
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/agent-delete-accidental-cb48-branch.log"
          : > "$log"
          printf '%s\n' "workflow=${GITHUB_WORKFLOW}" "run_id=${GITHUB_RUN_ID}" "event_sha=${GITHUB_SHA}" "runtimeExecution=false" | tee -a "$log"

      - name: Verify and delete accidental branch
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
          EXPECTED_SHA: 966b06bfe2ffe7cc4ec6127cc4a24b861eaadadf
          REF_NAME: __invalid_never_use__
        shell: bash
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/agent-delete-accidental-cb48-branch.log"
          exec > >(tee -a "$log") 2>&1
          actual="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${REF_NAME}" --jq '.object.sha')"
          echo "ref=${REF_NAME}; actual_sha=${actual}; expected_sha=${EXPECTED_SHA}"
          test "$actual" = "$EXPECTED_SHA"
          gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${REF_NAME}"
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${REF_NAME}" >/dev/null 2>&1; then
            echo "accidental branch still exists" >&2
            exit 2
          fi
          echo "branch_deleted=true"

      - name: Upload diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-delete-accidental-cb48-branch-log-${{ github.run_id }}
          path: ${{ runner.temp }}/agent-delete-accidental-cb48-branch.log
          if-no-files-found: error
          retention-days: 7
