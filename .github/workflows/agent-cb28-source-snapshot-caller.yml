name: Agent CB28 Source Snapshot Caller

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/source-snapshot-cb28/**

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/agent-cb28-source-snapshot-caller.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  snapshot:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-source-snapshot.yml
    with:
      source_ref: 2ec2a978001be478d99e0730005fae5d379e974b
      artifact_prefix: m3-cp4c3-cb28-source
      retention_days: 7
    secrets: inherit
