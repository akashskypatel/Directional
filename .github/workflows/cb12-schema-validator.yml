name: CB12 Prepublication Schema Validation

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/cb12-schema-validate.txt

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: directional-cb12-schema-validate
  cancel-in-progress: false

jobs:
  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: cb12-schema-validate
      commit_run_file: false
      trim_stale_comments: false
    secrets: inherit

  validate-self:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/cb12-schema-validator.yml
      retention_days: 7
    secrets: inherit

  validate-candidate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .agents/Directional/turn-payloads/cb12-drive-apply-candidate.yml
      retention_days: 7
    secrets: inherit
