name: Agent CP4c3 TB2 Re-execution R4

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/cp4c3-tb2-exec-r4/run.txt

permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: agent-cp4c3-tb2-exec-r4-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate_caller:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/agent-cp4c3-tb2-exec-r4-temp.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: cp4c3-tb2-exec-r4
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  execute:
    needs: validate_caller
    if: ${{ needs.validate_caller.outputs.valid == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout orchestration control only
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          token: ${{ secrets.GH_TOKEN || github.token }}

      - name: Execute immutable selector package
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_PACKAGE_SHA256: 4265079b78af1a95300eebdaa5f2b2643030aa1ad2f51b70f904d88b16de7fe5
          EXPECTED_SOURCE_SHA256: c7cd8b4bbba2d3b374da7c7f18e27c0e688ffe7679c261b644c6fffbf34426b1
          EXPECTED_SELECTOR_SHA256: b47c269851fad1384b5dc9baaf674b3d4ad80ec6c2b40f7f8eda2055c6f44834
          EXPECTED_MAPPING_SHA256: f73ea05bb146a7e4a71329b5bd4344898c7fc643094be4858ea8a17ab075d740
        shell: bash
        run: |
          set -u -o pipefail
          log="${RUNNER_TEMP}/cp4c3-tb2-exec-r4.log"
          out="${RUNNER_TEMP}/tb2-r4-result"
          pkg="${RUNNER_TEMP}/package70"
          src="${RUNNER_TEMP}/package70-source"
          zip="${RUNNER_TEMP}/package70.zip"
          mapping="${RUNNER_TEMP}/selector-targets.tsv"
          rm -rf "$out" "$pkg" "$src" "$zip" "$mapping"
          mkdir -p "$out/logs" "$pkg" "$src"
          : > "$log"
          gate_exit=3
          phase=preflight
          trap 'rc=$?; printf "%s\n" status=ORCHESTRATION_RED gate_exit=3 "phase=$phase" "orchestration_exit=$rc" > "$out/status.txt"; echo 3 > "$RUNNER_TEMP/gate-exit-code"; exit 0' ERR
          set -e

          printf '%s\n' \
            "workflow=${GITHUB_WORKFLOW}" \
            "run_id=${GITHUB_RUN_ID}" \
            "event_sha=${GITHUB_SHA}" \
            "semantic_source=005512f20ed56edc793f4d6505f3d2b4c2999c71" \
            "package_artifact=9744461475" \
            "selector_count=373" \
            "target_mapping=15-static-source-verified-ordinal-ranges" \
            "generatedDiscovery=false" \
            "benchmarkExecution=false" | tee -a "$log"

          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/9744461475/zip" > "$zip"
          echo "${EXPECTED_PACKAGE_SHA256}  ${zip}" | sha256sum -c -
          unzip -q "$zip" -d "$pkg"
          (cd "$pkg" && sha256sum -c SHA256SUMS)
          test "$(wc -l < "$pkg/SHA256SUMS" | tr -d ' ')" = 55
          test "$(cat "$pkg/metadata/source-commit.txt")" = 005512f20ed56edc793f4d6505f3d2b4c2999c71
          grep -Fx exactArithmeticBackend=GMP "$pkg/metadata/command-boundary.txt"
          grep -Fx semanticBinariesUnchanged=true "$pkg/metadata/command-boundary.txt"
          grep -q libgmpxx "$pkg/metadata/gmp-evidence.txt"
          grep -q libgmp "$pkg/metadata/gmp-evidence.txt"
          for status_file in "$pkg"/metadata/source-status-*.txt; do test ! -s "$status_file"; done
          test -f "$pkg/test-data/benchmarks/fixtures/milestone_g_manifest.json"
          test -f "$pkg/test-data/benchmarks/fixtures/milestone-g/mechanical_feature.obj"
          test -f "$pkg/test-data/benchmarks/fixtures/milestone-g/sphere_prescribed.obj"

          archive="$(find "$pkg/source" -maxdepth 1 -type f -name 'source-*.tar.gz' -print -quit)"
          test -n "$archive"
          echo "${EXPECTED_SOURCE_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "$archive" -C "$src"
          selector="$src/.agents/Directional/Architecture_M3_CP4c3_Required_Green_Selector_373.txt"
          echo "${EXPECTED_SELECTOR_SHA256}  ${selector}" | sha256sum -c -
          test "$(wc -l < "$selector" | tr -d ' ')" = 373
          test "$(sort -u "$selector" | wc -l | tr -d ' ')" = 373

          awk '
            NR >= 1   && NR <= 17  { target="directional_surface_cell_producer_tests" }
            NR >= 18  && NR <= 28  { target="directional_surface_cell_authority_kernel_tests" }
            NR >= 29  && NR <= 40  { target="directional_surface_cell_completion_tests" }
            NR >= 41  && NR <= 46  { target="directional_surface_cell_producer_tests" }
            NR >= 47  && NR <= 104 { target="directional_surface_cell_completion_tests" }
            NR >= 105 && NR <= 112 { target="directional_surface_cell_validation_tests" }
            NR == 113               { target="directional_surface_cell_completion_tests" }
            NR >= 114 && NR <= 154 { target="directional_surface_cell_producer_tests" }
            NR >= 155 && NR <= 173 { target="directional_surface_cell_authority_kernel_tests" }
            NR >= 174 && NR <= 207 { target="directional_surface_cell_producer_tests" }
            NR == 208               { target="directional_surface_cell_completion_tests" }
            NR >= 209 && NR <= 257 { target="directional_surface_cell_producer_tests" }
            NR >= 258 && NR <= 260 { target="directional_surface_cell_completion_tests" }
            NR >= 261 && NR <= 293 { target="directional_surface_cell_validation_tests" }
            NR >= 294 && NR <= 373 { target="directional_surface_cell_producer_tests" }
            { print NR "\t" target "\t" $0 }
          ' "$selector" > "$mapping"
          echo "${EXPECTED_MAPPING_SHA256}  ${mapping}" | sha256sum -c -
          test "$(wc -l < "$mapping" | tr -d ' ')" = 373
          test "$(awk -F '\t' '$2=="directional_surface_cell_producer_tests"{n++} END{print n+0}' "$mapping")" = 227
          test "$(awk -F '\t' '$2=="directional_surface_cell_authority_kernel_tests"{n++} END{print n+0}' "$mapping")" = 30
          test "$(awk -F '\t' '$2=="directional_surface_cell_completion_tests"{n++} END{print n+0}' "$mapping")" = 75
          test "$(awk -F '\t' '$2=="directional_surface_cell_validation_tests"{n++} END{print n+0}' "$mapping")" = 41
          for exe in producer authority_kernel completion validation; do
            test "$(stat -c %a "$pkg/bin/directional_surface_cell_${exe}_tests")" = 755
          done

          sha256sum "$zip" > "$out/package-before.sha256"
          sha256sum "$archive" > "$out/source-before.sha256"
          sha256sum "$selector" > "$out/selector-before.sha256"
          sha256sum "$mapping" > "$out/mapping-before.sha256"
          cp "$mapping" "$out/derived-mapping.tsv"
          printf '%s\n' preflight=PASS fixtureRootSiblingPackage=true generatedDiscovery=false benchmarkExecution=false > "$out/preflight.txt"

          set +e
          trap - ERR
          phase=runtime
          gate_exit=0
          status=GREEN
          first_red_ordinal=0
          first_red_identity=""
          first_red_selected=0
          first_red_exit=0
          result="$out/result.tsv"
          : > "$result"
          while IFS=$'\t' read -r ordinal target identity; do
            test_log="$(printf '%s/logs/%03d.log' "$out" "$ordinal")"
            echo "[$ordinal/373] $identity ($target)" | tee -a "$log"
            (cd "$pkg" && "$pkg/bin/$target" "--gtest_filter=$identity") >"$test_log" 2>&1
            rc=$?
            selected="$(grep -c '^\[ RUN      \]' "$test_log" || true)"
            printf '%s\t%s\t%s\t%s\t%s\n' "$ordinal" "$target" "$identity" "$rc" "$selected" >> "$result"
            if [[ "$selected" != 1 ]]; then
              status=ORCHESTRATION_RED; gate_exit=3
              first_red_ordinal="$ordinal"; first_red_identity="$identity"; first_red_selected="$selected"; first_red_exit="$rc"
              break
            fi
            if [[ "$rc" != 0 ]]; then
              status=SEMANTIC_RED; gate_exit=2
              first_red_ordinal="$ordinal"; first_red_identity="$identity"; first_red_selected="$selected"; first_red_exit="$rc"
              break
            fi
          done < "$mapping"
          executed="$(wc -l < "$result" | tr -d ' ')"
          passed="$(awk -F '\t' '$4==0 && $5==1{n++} END{print n+0}' "$result")"
          if [[ "$gate_exit" == 0 && ( "$executed" != 373 || "$passed" != 373 ) ]]; then status=ORCHESTRATION_RED; gate_exit=3; fi
          printf '%s\n' "status=$status" "gate_exit=$gate_exit" "executed=$executed" "passed=$passed" "first_red_ordinal=$first_red_ordinal" "first_red_identity=$first_red_identity" "first_red_selected=$first_red_selected" "first_red_exit=$first_red_exit" > "$out/status.txt"
          echo "$gate_exit" > "$RUNNER_TEMP/gate-exit-code"

          phase=postflight
          set -e
          trap 'rc=$?; printf "%s\n" postflight=FAIL "postflight_exit=$rc" >> "$out/postflight.txt"; echo 3 > "$RUNNER_TEMP/gate-exit-code"; exit 0' ERR
          (cd "$pkg" && sha256sum -c SHA256SUMS)
          sha256sum "$zip" > "$out/package-after.sha256"
          sha256sum "$archive" > "$out/source-after.sha256"
          sha256sum "$selector" > "$out/selector-after.sha256"
          sha256sum "$mapping" > "$out/mapping-after.sha256"
          diff -u "$out/package-before.sha256" "$out/package-after.sha256"
          diff -u "$out/source-before.sha256" "$out/source-after.sha256"
          diff -u "$out/selector-before.sha256" "$out/selector-after.sha256"
          diff -u "$out/mapping-before.sha256" "$out/mapping-after.sha256"
          printf '%s\n' postflight=PASS packageMutation=false sourceMutation=false selectorMutation=false mappingMutation=false compileExecution=false relinkExecution=false repairExecution=false generatedDiscovery=false benchmarkExecution=false > "$out/postflight.txt"

      - name: Upload TB2 R4 result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-cp4c3-tb2-r4-result-${{ github.run_id }}
          path: ${{ runner.temp }}/tb2-r4-result
          if-no-files-found: error
          retention-days: 7

      - name: Upload TB2 R4 log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-cp4c3-tb2-r4-log-${{ github.run_id }}
          path: ${{ runner.temp }}/cp4c3-tb2-exec-r4.log
          if-no-files-found: error
          retention-days: 7

      - name: Propagate gate status
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f "$RUNNER_TEMP/gate-exit-code" || exit 4
          exit "$(cat "$RUNNER_TEMP/gate-exit-code")"
