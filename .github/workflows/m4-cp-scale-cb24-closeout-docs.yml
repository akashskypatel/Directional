name: M4 CP SCALE CB24 Closeout Docs

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m4-cp-scale-cb24-closeout-docs-20260918.txt

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/m4-cp-scale-cb24-closeout-docs.yml
    secrets: inherit

  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      commit_run_file: false
      label: m4-cp-scale-cb24-closeout-docs
    secrets: inherit

  closeout:
    needs: validate
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact event source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Update large durable closeout records
        shell: bash
        env:
          TARGET_BRANCH: agent/surface_cell_quad/p5-recover-bridge-healing
        run: |
          set -euo pipefail
          remote_sha="$(git ls-remote origin "refs/heads/${TARGET_BRANCH}" | cut -f1)"
          test "${remote_sha}" = "${GITHUB_SHA}"
          python - <<'PY'
          from pathlib import Path

          tracker = Path(".agents/Directional/Regression_Root_Cause_Tracker.md")
          text = tracker.read_text(encoding="utf-8")
          lines = text.splitlines()
          prefix = "- `M4-CP-SCALE-TB12-R10-REV-OBS-01` — "
          replacement = "- `M4-CP-SCALE-TB12-R10-REV-OBS-01` — **OPEN / NON-DEFECT / PUBLICATION LEG COMPLETE / FRESH CUMULATIVE RUNTIME + REVIEW PENDING**. **Root cause:** S5 was focused-accepted outside selector426, so focused acceptance cannot count as cumulative required-green credit. **CB24 evidence:** selector427 is now published as exact selector426 bytes plus row427 `M4CPScaleS5.GenusTwoProducedWitnessReachesA3WithVerifiedTopology`, SHA-256 `f9c88380135a14d20492e215758cce35cab78ffe167b09fe5267d5ba2beae86f`, owners **30/281/75/41**; compile/package artifact `10565723112` is GREEN with `runtimeExecution=false`. **Remaining falsifier:** TB13 executes fresh **427/427 PASS** with exact immutable postflight and Review independently accepts it. **Owner:** `M4-CP-SCALE-TB13-EXEC -> M4-CP-SCALE-TB13-REV`. **Prohibited:** counting CB24 compile or R10 focused S5 as cumulative runtime credit, changing selector426 prefix, or mutating product/test/fixture semantics in the publication chain."
          hits = [i for i, line in enumerate(lines) if line.startswith(prefix)]
          if hits != [7]:
              raise SystemExit(f"unexpected tracker observation locations: {hits}")
          lines[hits[0]] = replacement
          tracker.write_text("\n".join(lines) + "\n", encoding="utf-8")

          changelog = Path(".agents/Directional/CHANGELOG.md")
          text = changelog.read_text(encoding="utf-8")
          heading = "## 2026-09-18 — `M4-CP-SCALE-CB24`: selector427 published exactly; GMP compile/package GREEN; TB13 next"
          if heading not in text:
              entry = """## 2026-09-18 — `M4-CP-SCALE-CB24`: selector427 published exactly; GMP compile/package GREEN; TB13 next

          CB24 completes the publication-only leg authorized by R10 Review. `Architecture_M4_CP_SCALE_CB24_Required_Green_Selector_427.txt` is exact selector426 plus `M4CPScaleS5.GenusTwoProducedWitnessReachesA3WithVerifiedTopology`: **427 LF rows**, SHA-256 `f9c88380135a14d20492e215758cce35cab78ffe167b09fe5267d5ba2beae86f`, exact first426 `41f4d559211375c11c8d1f8c9ccde2581db75819d9409366e8f2695b008b5114`, owners **30/281/75/41**. Product/test/fixture/benchmark/CMake semantics and selector426 remain unchanged.

          Mandatory compile run/job `35391181281 / 105749651674` succeeds on exact publication source `6fe075f7d9397a561fe50b79517b4f714fb9eeef` across all eight standard targets under GMPXX+GMP. Candidate artifact `10565723112` hashes to `96e9e900e67777f31fbbf97d05efc44ed8c944d9f2bc031a5826e47602ea7bfa`; packaged source archive `3b6b587efadf3b83082b11e5f7a9e1c06b5c8f1ce0671d82db707ffc7fac3bfd`; package manifest **28/28**, six executable modes `0755`, clean source receipts, `runtimeExecution=false`. No generated Directional runtime/test/benchmark/discovery/CLI executed.

          Accepted runtime authority remains R10 package `10560828304` / selector426 **426/426**; CB24 supplies candidate build authority only. Stable accounting remains **49 / 14 / 35**, debt **5**. `M4-CP-SCALE-TB12-R10-REV-OBS-01` publication leg is complete; fresh cumulative runtime + Review remain. Exact next is immutable artifact-only `M4-CP-SCALE-TB13-EXEC` on artifact `10565723112`, then mandatory `M4-CP-SCALE-TB13-REV`.

          """
              marker = "## 2026-"
              idx = text.find(marker)
              if idx < 0:
                  raise SystemExit("changelog insertion marker missing")
              text = text[:idx] + entry + text[idx:]
              changelog.write_text(text, encoding="utf-8")
          PY
          changed="$(git diff --name-only)"
          test "$changed" = $'.agents/Directional/CHANGELOG.md\n.agents/Directional/Regression_Root_Cause_Tracker.md'
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .agents/Directional/CHANGELOG.md .agents/Directional/Regression_Root_Cause_Tracker.md
          git commit -m "M4-CP-SCALE-CB24: close durable large records"
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}"
