name: Agent P5 Resume Exact Source Snapshot

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/source-snapshot-exact/p5-resume-20260902.txt

permissions:
  contents: read
  actions: read
  pull-requests: write

jobs:
  workflow-schema-validation:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/agent-p5-resume-source-snapshot.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  source-snapshot:
    needs: workflow-schema-validation
    if: needs.workflow-schema-validation.outputs.valid == 'true'
    uses: ./.github/workflows/agent-source-snapshot.yml
    with:
      source_ref: f1c94358b8551614bee8bb76265e1c9a51c7aea3
    secrets: inherit
