name: M5 CP3 R16 Review Docs Apply

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m5-cp3-r16-review-docs-apply/trigger.txt

permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

concurrency:
  group: m5-cp3-r16-review-docs-apply-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/m5-cp3-r16-review-docs-apply.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m5-cp3-r16-review-docs-apply
      commit_run_file: false
    secrets: inherit

  apply:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1GpV2IQbqkusBbNES9-kZJV6DYP3Gwy4Q
      patch_sha256: 77cf2a22800a7cf89cfac0424c24f2ce05d771f094905b623b3f213445a99b17
      base_sha: 5d973169ca23824e8ec1530a2d28e2c32163df22
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: 'docs: accept M5 CP3 R16 review'
    secrets: inherit
