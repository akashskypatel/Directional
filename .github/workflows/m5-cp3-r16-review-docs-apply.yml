name: M5 CP3 R16 Review Docs Apply

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m5-cp3-r16-review-docs-apply/trigger.txt

permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

concurrency:
  group: m5-cp3-r16-review-docs-apply-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/m5-cp3-r16-review-docs-apply.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m5-cp3-r16-review-docs-apply
      commit_run_file: false
    secrets: inherit

  apply:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1agMOaq7AfuBuYQfg3OjwmgW11z9h1Jqp
      patch_sha256: 0995eb718c0764ff21b5ac8559ee24e787774940e437a8fec74478abb1568493
      base_sha: 9af25bb4e198a53d3f4bb05bc352873adc90cdd6
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: 'docs: approve M5 CP3 R16 and precommit selector448'
    secrets: inherit
