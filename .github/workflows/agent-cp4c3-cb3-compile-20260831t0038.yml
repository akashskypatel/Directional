name: M3 CP4c3 CB3 Compile

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/cp4c3-cb3-compile-20260831t0038.txt

permissions:
  contents: write
  actions: write
  issues: write
  pull-requests: write

concurrency:
  group: m3-cp4c3-cb3-compile-20260831t0038
  cancel-in-progress: false

jobs:
  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: cp4c3-cb3-compile
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  validate-caller:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/agent-cp4c3-cb3-compile-20260831t0038.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  compile:
    needs: validate-caller
    if: ${{ needs.validate-caller.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-compile-reusable.yml
    with:
      source_sha: 93ed2ff50ddad96c9a6aa93f327b3e4d9d93a9b4
      targets: directional_core directional_pipeline directional_surface_cell_authority_kernel_tests directional_surface_cell_producer_tests directional_surface_cell_completion_tests directional_surface_cell_validation_tests directional_compiled_api_tests directional_benchmarks
      artifact_prefix: m3-cp4c3-package71-raw
    secrets: inherit

  package-fixtures:
    needs: compile
    runs-on: ubuntu-24.04
    steps:
      - name: Initialize package log
        shell: bash
        run: |
          set -euo pipefail
          : > "$RUNNER_TEMP/package-fixtures.log"
          printf '%s\n' \
            "workflow=$GITHUB_WORKFLOW" \
            "run_id=$GITHUB_RUN_ID" \
            "event_sha=$GITHUB_SHA" \
            'source_sha=93ed2ff50ddad96c9a6aa93f327b3e4d9d93a9b4' \
            'turnBoundary=Code+Build-only' \
            'runtimeExecution=false' | tee -a "$RUNNER_TEMP/package-fixtures.log"

      - name: Checkout exact evidence source
        uses: actions/checkout@v4
        with:
          ref: 93ed2ff50ddad96c9a6aa93f327b3e4d9d93a9b4
          fetch-depth: 1
          submodules: false

      - name: Download raw compile package
        uses: actions/download-artifact@v4
        with:
          name: m3-cp4c3-package71-raw-result-${{ github.run_id }}
          path: ${{ runner.temp }}/package71

      - name: Add package-relative fixture authority
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee -a "$RUNNER_TEMP/package-fixtures.log") 2>&1
          PKG="$RUNNER_TEMP/package71"
          SOURCE_SHA="$(git rev-parse HEAD)"
          test "$SOURCE_SHA" = 93ed2ff50ddad96c9a6aa93f327b3e4d9d93a9b4
          test "$(cat "$PKG/metadata/source-commit.txt")" = "$SOURCE_SHA"
          (cd "$PKG" && sha256sum -c SHA256SUMS)
          find "$PKG/bin" -maxdepth 1 -type f -print0 | sort -z | xargs -0 sha256sum > "$RUNNER_TEMP/binary-sha-before.txt"
          rm -rf "$PKG/test-data"
          mkdir -p "$PKG/test-data/benchmarks"
          cp -a benchmarks/fixtures "$PKG/test-data/benchmarks/fixtures"
          test -f "$PKG/test-data/benchmarks/fixtures/milestone-g/mechanical_feature.obj"
          test -f "$PKG/test-data/benchmarks/fixtures/milestone-g/sphere_prescribed.obj"
          fixture_count="$(find "$PKG/test-data/benchmarks/fixtures" -type f | wc -l | tr -d ' ')"
          test "$fixture_count" -gt 0
          cat > "$PKG/metadata/fixture-package-contract.txt" <<EOF
          fixtureAuthority=package-relative
          fixtureRoot=test-data/benchmarks/fixtures
          fixtureFileCount=$fixture_count
          compileTimeAbsoluteSourceFallback=false
          sourceSha=$SOURCE_SHA
          runtimeExecution=false
          EOF
          find "$PKG/bin" -maxdepth 1 -type f -print0 | sort -z | xargs -0 sha256sum > "$RUNNER_TEMP/binary-sha-after.txt"
          diff -u "$RUNNER_TEMP/binary-sha-before.txt" "$RUNNER_TEMP/binary-sha-after.txt"
          rm -f "$PKG/SHA256SUMS"
          (cd "$PKG" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          (cd "$PKG" && sha256sum -c SHA256SUMS)
          printf '%s\n' \
            "fixture_file_count=$fixture_count" \
            'package_fixture_contract=pass' \
            'binary_bytes_unchanged=pass' \
            'runtimeExecution=false'

      - name: Upload immutable package 71
        uses: actions/upload-artifact@v4
        with:
          name: m3-cp4c3-package71-result-${{ github.run_id }}
          path: ${{ runner.temp }}/package71
          if-no-files-found: error
          retention-days: 7

      - name: Upload package log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-cp4c3-package71-fixture-log-${{ github.run_id }}
          path: ${{ runner.temp }}/package-fixtures.log
          if-no-files-found: error
          retention-days: 7
