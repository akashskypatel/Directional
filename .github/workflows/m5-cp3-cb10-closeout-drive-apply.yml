name: M5 CP3 CB10 Closeout Drive Apply

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m5-cp3-cb10-closeout-drive-apply/**

permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/m5-cp3-cb10-closeout-drive-apply.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m5-cp3-cb10-closeout-drive-apply
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  apply:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1iRSY6Ta4_Gcguvcmj84W2YXY-RGEw3qE
      patch_sha256: 22f0dabc3dc990532eda0a5e4fec6b54551c4ad224842d90f9edfaf8126d32a7
      base_sha: 995ffe67cdd34c7cbd17279c2390f9ea29b04f81
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: "docs: close M5-CP3-CB10 and plan R9"
    secrets: inherit
