name: Agent R-A Retry 3 CB Apply

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/ra-tb3-cb-apply.txt

permissions:
  contents: write

concurrency:
  group: agent-ra-tb3-cb-apply-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TESTED_SOURCE: 555109796188b318c788ef5777f622705ee0aa94
      PATCH_SHA256: 45e580253589442b19926d4a7db00d0dc5d216d8278d517c0f486477cf4aa434

    steps:
      - name: Initialize persistent activity log
        shell: bash
        run: |
          set -euo pipefail
          : > "$RUNNER_TEMP/activity.log"
          printf '%s\n' \
            'task=R-A-TB3-CB-01-through-CB-03 bounded source/test correction' \
            "event_sha=$GITHUB_SHA" \
            "ref=$GITHUB_REF" \
            "tested_source=$TESTED_SOURCE" \
            "patch_sha256=$PATCH_SHA256" \
            'turnBoundary=Code+Build-only' \
            'generatedRuntimeExecution=false' | tee -a "$RUNNER_TEMP/activity.log"

      - name: Checkout trigger head
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify base, apply patch, regenerate static inventory, and commit
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee -a "$RUNNER_TEMP/activity.log") 2>&1
          trap 'rc=$?; printf "step_exit=%s\n" "$rc"; git status --porcelain=v1 || true; exit "$rc"' EXIT

          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git fetch --no-tags --depth=1 origin "$TESTED_SOURCE"

          semantic_paths=(
            src/pipeline/RemeshPipeline.cpp
            tests/SurfaceCellsPhase10Tests.cpp
            .agents/Directional/R_A_Closure_Inventory.py
            .agents/Directional/R_A_Closure_Inventory_Report.md
          )
          git diff --quiet "$TESTED_SOURCE" -- "${semantic_paths[@]}"
          echo 'semantic_base_matches_tested_source=PASS'

          payload_parts=(
            .agents/Directional/turn-payloads/ra_tb3_cb_plain.part00
            .agents/Directional/turn-payloads/ra_tb3_cb_plain.part01
            .agents/Directional/turn-payloads/ra_tb3_cb_plain.part02a
            .agents/Directional/turn-payloads/ra_tb3_cb_plain.part02b
            .agents/Directional/turn-payloads/ra_tb3_cb_plain.part03
            .agents/Directional/turn-payloads/ra_tb3_cb_plain.part04a
            .agents/Directional/turn-payloads/ra_tb3_cb_plain.part04b
            .agents/Directional/turn-payloads/ra_tb3_cb_plain.part04c
            .agents/Directional/turn-payloads/ra_tb3_cb_plain.part05
          )
          expected_part_hashes=(
            9a41ade8fa87f0beb4efb85ea13f41f8eadef56a9bd47ad81556a587181c5a8c
            185ddab09a7c7ac0c4322f699cdcc3728845ebca841a77629bb19cbb50e606e6
            f4413a077e7daea6194c173e6669e8f1c00122cc1cb839768728cd80a4c79670
            82f2df6fb2d251d8033ced24ffa0a94f340a7078863ad74668c13c1caada316b
            77e310b1c59d5994ce5bcaff292626541db3556b2305f4fa37ee484ec35ac3d5
            23522886cbd1f0040fec2829061e96998b16a4b1826b81d2e48f34d643782174
            aa3597703cbf3feacbe0d2537e81792bdfe29d9948297db25e1dc980284ee365
            c159a953ffb008e96660f007bdd1c45cf04a277b4daf8589d5bb5a58c7142573
            958389bd875ca09f120fdbfd1ce76ba76960724a23b1d6f9c7d0d00086d95b18
          )
          for index in "${!payload_parts[@]}"; do
            printf '%s  %s\n' "${expected_part_hashes[$index]}" "${payload_parts[$index]}" | sha256sum -c -
          done
          cat "${payload_parts[@]}" > "$RUNNER_TEMP/ra-tb3-cb.patch"
          printf '%s  %s\n' "$PATCH_SHA256" "$RUNNER_TEMP/ra-tb3-cb.patch" | sha256sum -c -
          ! grep -q '^+++ b/.github/workflows/' "$RUNNER_TEMP/ra-tb3-cb.patch"

          git apply --check "$RUNNER_TEMP/ra-tb3-cb.patch"
          git apply "$RUNNER_TEMP/ra-tb3-cb.patch"
          git diff --check
          test "$(git diff --name-only | sort)" = "$(printf '%s\n' .agents/Directional/R_A_Closure_Inventory.py src/pipeline/RemeshPipeline.cpp tests/SurfaceCellsPhase10Tests.cpp | sort)"

          python3 .agents/Directional/R_A_Closure_Inventory.py \
            --root . --output .agents/Directional/R_A_Closure_Inventory_Report.md \
            | tee "$RUNNER_TEMP/R_A_Closure_Inventory.stdout.txt"
          grep -q 'Affected path count: \*\*19\*\*' .agents/Directional/R_A_Closure_Inventory_Report.md
          grep -q 'Probe count: \*\*60\*\*' .agents/Directional/R_A_Closure_Inventory_Report.md
          grep -q 'Probe match count: \*\*270\*\*' .agents/Directional/R_A_Closure_Inventory_Report.md
          grep -q 'Unexpected raw-projection leaves: \*\*0\*\*' .agents/Directional/R_A_Closure_Inventory_Report.md
          grep -q 'Unexpected face-count leaves: \*\*0\*\*' .agents/Directional/R_A_Closure_Inventory_Report.md
          grep -q 'Unexpected pipeline stitchIdentity assignments: \*\*0\*\*' .agents/Directional/R_A_Closure_Inventory_Report.md
          grep -q 'Stitch-kind classifier self-test failures: \*\*0\*\*' .agents/Directional/R_A_Closure_Inventory_Report.md
          grep -q 'Final static inventory: \*\*PASS\*\*' .agents/Directional/R_A_Closure_Inventory_Report.md
          echo 'static_inventory=19_paths_60_probes_270_matches_PASS'
          git diff --check
          test "$(git diff --name-only | sort)" = "$(printf '%s\n' "${semantic_paths[@]}" | sort)"

          git diff -- "${semantic_paths[@]}" > "$RUNNER_TEMP/applied-semantic.patch"
          git status --porcelain=v1 > "$RUNNER_TEMP/status-before-commit.txt"
          git config user.name 'Directional Agent'
          git config user.email 'directional-agent@users.noreply.github.com'
          git add src/pipeline/RemeshPipeline.cpp tests/SurfaceCellsPhase10Tests.cpp
          git add -f .agents/Directional/R_A_Closure_Inventory.py .agents/Directional/R_A_Closure_Inventory_Report.md
          test -z "$(git diff --name-only)"
          git diff --cached --check
          test "$(git diff --cached --name-only | sort)" = "$(printf '%s\n' "${semantic_paths[@]}" | sort)"
          git commit -m 'fix: close R-A retry 3 CB findings'
          git rev-parse HEAD | tee "$RUNNER_TEMP/implementation.txt"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          git status --porcelain=v1 | tee "$RUNNER_TEMP/status-after-push.txt"
          test ! -s "$RUNNER_TEMP/status-after-push.txt"
          printf '%s\n' 'generated_runtime_execution=false' 'tests_executed=false' 'benchmarks_executed=false' 'discovery_executed=false' > "$RUNNER_TEMP/command-boundary.txt"

      - name: Upload apply result evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ra-tb3-cb-apply-result-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/implementation.txt
            ${{ runner.temp }}/applied-semantic.patch
            ${{ runner.temp }}/R_A_Closure_Inventory.stdout.txt
            ${{ runner.temp }}/status-before-commit.txt
            ${{ runner.temp }}/status-after-push.txt
            ${{ runner.temp }}/command-boundary.txt
          if-no-files-found: error
          retention-days: 7

      - name: Upload diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ra-tb3-cb-apply-log-${{ github.run_id }}
          path: ${{ runner.temp }}/activity.log
          if-no-files-found: error
          retention-days: 7
