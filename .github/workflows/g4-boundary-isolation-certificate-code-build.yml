name: g4-boundary-isolation-certificate-code-build

on:
  push:
    paths:
      - '.agents/connector-triggers/g4-boundary-isolation-certificate-code-build'

permissions:
  contents: write
  actions: read

concurrency:
  group: g4-boundary-isolation-certificate-code-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  code-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      LOG_DIR: /tmp/g4-boundary-isolation-certificate-logs
    steps:
      - name: Initialize unconditional activity log
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$LOG_DIR"
          {
            echo "turn=G4 boundary and isolation transport certificate Code+Build"
            echo "event_sha=$GITHUB_SHA"
            echo "event_ref=$GITHUB_REF"
            echo "entering_reviewed_artifact=9024549134"
            echo "entering_branch_head=63a65cd9ee938212b2e6e9ddb8f1081cbe44e6a3"
            echo "validated_implementation=7f486632b154a303789df6c4dd44f602c8c71281"
            echo "runtimeExecution=false"
            echo "reviewPolicy=never"
            echo "transport=three verified raw unified-patch parts"
            echo "allowed=verify/apply exact allowlisted patch, commit/push source, configure, compile/link seven approved targets, package/checksum"
            echo "prohibited=tests, benchmarks, generated Directional binaries, ctest/discovery, CLI, GUI, help/list/custom-input execution"
          } | tee "$LOG_DIR/activity.log"

      - name: Checkout exact working branch
        uses: actions/checkout@v4
        with:
          ref: agent/surface_cell_quad/p5-recover-bridge-healing
          fetch-depth: 50
          submodules: false

      - name: Verify and apply boundary-certificate patch
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee -a "$LOG_DIR/activity.log") 2>&1
          echo "checkout_sha=$(git rev-parse HEAD)"
          git status --short

          raw_parts=(
            .agents/Directional/turn-payloads/g4-boundary-isolation-certificate.patch.part-0000
            .agents/Directional/turn-payloads/g4-boundary-isolation-certificate.patch.part-0001
            .agents/Directional/turn-payloads/g4-boundary-isolation-certificate.patch.part-0002
          )
          expected_blobs=(
            968dbf6ee0d8be946df5d86fdd5fb2ad1a6fcb8e
            e7ba9e589859f2d2e9b333c7d6d851bcf6e7a88f
            ceb1e35ae553d2e075353f5560f36c16cdc39520
          )
          expected_sha256=(
            c6b7083a9a0111e0289016fda56bf236100f6389e4807e39dfa946d0aa48d9ef
            cd6fa2858aa12dbb74e57eb8da5d5d47fd65c61f34692089191dce5f854f7f69
            20bbf537e6de2d1ce6207d5f090c9c3c3e100ecb33c7f413b42ef14ffca85a84
          )
          for i in "${!raw_parts[@]}"; do
            part="${raw_parts[$i]}"
            test -f "$part"
            actual_blob=$(git hash-object "$part")
            actual_sha=$(sha256sum "$part" | awk '{print $1}')
            echo "part[$i]=$part blob=$actual_blob sha256=$actual_sha"
            test "$actual_blob" = "${expected_blobs[$i]}"
            test "$actual_sha" = "${expected_sha256[$i]}"
          done

          check_blob() {
            local path="$1" expected="$2"
            local actual
            actual=$(git hash-object "$path")
            echo "input_blob $path=$actual"
            test "$actual" = "$expected"
          }
          check_blob cmake/DirectionalTests.cmake 9846b5d25e2bec16b77c2f4f658552cc9c4ded82
          check_blob include/directional/geometry/SurfaceCellTracing.h 9db8d397bc69bd19773be2e6a63265c5d7e85048
          check_blob src/geometry/SurfaceCellTracing.cpp 1c1677cefe1fb6ee85f3edcd838175271ab6313c
          check_blob src/pipeline/RemeshPipeline.cpp 682580d3655fa3777099fd9aff494fc74b605c0e
          check_blob tests/SurfaceCellsPhase10Tests.cpp 8d60fe2a3da619a5ea5dc7c36e17c9af3d53f543
          test ! -e tests/SurfaceCellTransitionQuotientTests.cpp

          cat "${raw_parts[@]}" > /tmp/g4-boundary-isolation-certificate.patch
          PATCH_SHA256=$(sha256sum /tmp/g4-boundary-isolation-certificate.patch | awk '{print $1}')
          echo "patch_sha256=$PATCH_SHA256"
          test "$PATCH_SHA256" = "b93f420d7f9c8139663f8ff573613eeb23dd3c30073ff76c8b563c537fd07f10"
          if grep -q '^+++ b/.github/workflows/' /tmp/g4-boundary-isolation-certificate.patch; then
            echo "patch attempts to modify workflow files" >&2
            exit 1
          fi

          git apply --check /tmp/g4-boundary-isolation-certificate.patch
          git apply --index /tmp/g4-boundary-isolation-certificate.patch
          git diff --cached --check
          mapfile -t changed < <(git diff --cached --name-only | sort)
          printf 'changed=%s\n' "${changed[*]}"
          test "${#changed[@]}" -eq 6
          expected_changed=(
            cmake/DirectionalTests.cmake
            include/directional/geometry/SurfaceCellTracing.h
            src/geometry/SurfaceCellTracing.cpp
            src/pipeline/RemeshPipeline.cpp
            tests/SurfaceCellTransitionQuotientTests.cpp
            tests/SurfaceCellsPhase10Tests.cpp
          )
          for i in "${!expected_changed[@]}"; do
            test "${changed[$i]}" = "${expected_changed[$i]}"
          done

          check_output_blob() {
            local path="$1" expected="$2"
            local actual
            actual=$(git hash-object "$path")
            echo "output_blob $path=$actual"
            test "$actual" = "$expected"
          }
          check_output_blob cmake/DirectionalTests.cmake e82e3088e11f215f030b58be7fb6531a5dbaa99a
          check_output_blob include/directional/geometry/SurfaceCellTracing.h 663b3fc4f944c7136ebceffb9bd0b3e7db16d16b
          check_output_blob src/geometry/SurfaceCellTracing.cpp 877fcef94eaf60a9dae8a1aa01e69d03c2826431
          check_output_blob src/pipeline/RemeshPipeline.cpp 8281bbae78ac723004aefe257eaabac70c5f107d
          check_output_blob tests/SurfaceCellTransitionQuotientTests.cpp c545264e2bb1f012a94c4772bd93c8004aa4fb4b
          check_output_blob tests/SurfaceCellsPhase10Tests.cpp d34b5f097cf39ac72f060616a37d360e382af168

          git config user.name 'directional-agent'
          git config user.email 'directional-agent@users.noreply.github.com'
          git commit -m 'feat(surface-cells): certify boundary and isolation transport'
          IMPLEMENTATION_COMMIT=$(git rev-parse HEAD)
          echo "IMPLEMENTATION_COMMIT=$IMPLEMENTATION_COMMIT" >> "$GITHUB_ENV"
          echo "PATCH_SHA256=$PATCH_SHA256" >> "$GITHUB_ENV"
          echo "implementation_commit=$IMPLEMENTATION_COMMIT"

          git rm "${raw_parts[@]}"
          git commit -m 'chore(agent): remove boundary-certificate payloads'
          BUILD_COMMIT=$(git rev-parse HEAD)
          echo "BUILD_COMMIT=$BUILD_COMMIT" >> "$GITHUB_ENV"
          echo "build_commit=$BUILD_COMMIT"
          git push origin HEAD:agent/surface_cell_quad/p5-recover-bridge-healing
          test "$(git rev-parse HEAD)" = "$BUILD_COMMIT"
          git status --short

      - name: Install compile prerequisites
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee -a "$LOG_DIR/activity.log") 2>&1
          sudo apt-get update
          sudo apt-get install -y ninja-build libgmp-dev xz-utils

      - name: Fetch shallow submodules
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee -a "$LOG_DIR/activity.log") 2>&1
          git submodule update --init --depth 1
          git submodule status | tee "$LOG_DIR/submodules.txt"

      - name: Configure Release static compile-only build
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee -a "$LOG_DIR/activity.log") 2>&1
          {
            echo "implementation_commit=$IMPLEMENTATION_COMMIT"
            echo "build_commit=$BUILD_COMMIT"
            echo "compile_head=$(git rev-parse HEAD)"
            cmake --version
            c++ --version
            ninja --version
          } | tee "$LOG_DIR/toolchain.txt"
          test "$(git rev-parse HEAD)" = "$BUILD_COMMIT"
          cmake -S . -B agent-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DCMAKE_GTEST_DISCOVER_TESTS_DISCOVERY_MODE=PRE_TEST \
            -DBUILD_SHARED_LIBS=OFF \
            -DBUILD_TUTORIALS=OFF \
            -DBUILD_PYTHON=OFF \
            -DDIRECTIONAL_BUILD_CLI=OFF \
            -DDIRECTIONAL_BUILD_GUI=OFF \
            -DDIRECTIONAL_BUILD_BENCHMARKS=ON \
            -DDIRECTIONAL_BUILD_TESTS=ON \
            -DDIRECTIONAL_BUILD_HISTORICAL_TESTS=OFF \
            -DDIRECTIONAL_BUILD_LEGACY_INTEGRATION_TESTS=OFF \
            -DDIRECTIONAL_BUILD_OPTIONAL_GUIDANCE_TESTS=OFF \
            -DDIRECTIONAL_ENABLE_GMP=ON \
            -DDIRECTIONAL_ENABLE_PARDISO=OFF \
            -DDIRECTIONAL_ENABLE_CUDSS=OFF \
            -DDIRECTIONAL_ENABLE_SUITESPARSE=OFF \
            2>&1 | tee "$LOG_DIR/configure.log"

      - name: Compile seven approved targets only
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee -a "$LOG_DIR/activity.log") 2>&1
          test "$(git rev-parse HEAD)" = "$BUILD_COMMIT"
          cmake --build agent-build --parallel 2 --target \
            directional_core \
            directional_pipeline \
            directional_compiled_api_tests \
            directional_surface_cell_producer_tests \
            directional_surface_cell_completion_tests \
            directional_surface_cell_validation_tests \
            directional_benchmarks \
            2>&1 | tee "$LOG_DIR/build.log"
          echo "compile_only_gate=passed" | tee -a "$LOG_DIR/activity.log"
          echo "runtimeExecution=false" | tee -a "$LOG_DIR/activity.log"
          echo "final_source_status_begin" | tee -a "$LOG_DIR/activity.log"
          git status --short | tee -a "$LOG_DIR/activity.log"
          echo "final_source_status_end" | tee -a "$LOG_DIR/activity.log"

      - name: Package immutable compile artifact
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee -a "$LOG_DIR/activity.log") 2>&1
          artifact_root="$GITHUB_WORKSPACE/g4-boundary-isolation-certificate-code-build-artifact"
          rm -rf "$artifact_root"
          mkdir -p "$artifact_root"/{bin,lib,test-data/benchmarks,logs,metadata,source}
          cp agent-build/directional_benchmarks "$artifact_root/bin/"
          cp agent-build/directional_compiled_api_tests "$artifact_root/bin/"
          cp agent-build/directional_surface_cell_producer_tests "$artifact_root/bin/"
          cp agent-build/directional_surface_cell_completion_tests "$artifact_root/bin/"
          cp agent-build/directional_surface_cell_validation_tests "$artifact_root/bin/"
          cp agent-build/libdirectional_core.a "$artifact_root/lib/"
          cp agent-build/libdirectional_pipeline.a "$artifact_root/lib/"
          cp -a benchmarks/fixtures "$artifact_root/test-data/benchmarks/"
          cp "$LOG_DIR/activity.log" "$LOG_DIR/configure.log" \
             "$LOG_DIR/build.log" "$LOG_DIR/toolchain.txt" \
             "$LOG_DIR/submodules.txt" "$artifact_root/logs/"
          cp agent-build/compile_commands.json "$artifact_root/source/"

          changed_paths=(
            cmake/DirectionalTests.cmake
            include/directional/geometry/SurfaceCellTracing.h
            src/geometry/SurfaceCellTracing.cpp
            src/pipeline/RemeshPipeline.cpp
            tests/SurfaceCellTransitionQuotientTests.cpp
            tests/SurfaceCellsPhase10Tests.cpp
          )
          git show "$IMPLEMENTATION_COMMIT" --format=fuller --stat --patch -- \
            "${changed_paths[@]}" > "$artifact_root/source/g4-boundary-isolation-certificate.patch"
          tar --exclude=.git --exclude=external --exclude=agent-build \
              --exclude=g4-boundary-isolation-certificate-code-build-artifact \
              --exclude=.github/workflows/g4-boundary-isolation-certificate-code-build.yml \
              --exclude=.agents/connector-triggers/g4-boundary-isolation-certificate-code-build \
              --exclude='.agents/Directional/turn-payloads/g4-boundary-isolation-certificate.patch.part-*' \
              -cJf "$artifact_root/source/directional-g4-boundary-isolation-certificate-source-no-deps.tar.xz" .

          cat > "$artifact_root/metadata/source-authority.json" <<EOF
          {
            "eventCommit": "$GITHUB_SHA",
            "implementationCommit": "$IMPLEMENTATION_COMMIT",
            "buildCommit": "$BUILD_COMMIT",
            "enteringReviewedArtifact": 9024549134,
            "enteringBranchHead": "63a65cd9ee938212b2e6e9ddb8f1081cbe44e6a3",
            "validatedImplementation": "7f486632b154a303789df6c4dd44f602c8c71281",
            "decodedPatchSha256": "$PATCH_SHA256",
            "runtimeExecution": false,
            "reviewPolicy": "never"
          }
          EOF
          cat > "$artifact_root/metadata/build-authority.json" <<'EOF'
          {"configuration":"Release","generator":"Ninja","buildSharedLibs":false,"gtestDiscoveryMode":"PRE_TEST","approvedTargets":7,"runtimeExecution":false}
          EOF
          cat > "$artifact_root/metadata/command-boundary.txt" <<'EOF'
          G4 boundary and isolation transport certificate Code + Build only.
          Executed: verified allowlisted source/test/CMake patch application, exact source commit/push, configure, compile/link seven approved targets, package/checksum.
          Not executed: generated Directional binaries, tests, benchmarks, ctest/discovery, CLI, GUI, help/list/custom-input commands.
          EOF
          git ls-tree -r "$IMPLEMENTATION_COMMIT" -- "${changed_paths[@]}" \
            > "$artifact_root/metadata/final-blobs.txt"
          git submodule status > "$artifact_root/metadata/submodules.txt"
          find benchmarks/fixtures -type f | sort > "$artifact_root/metadata/fixture-files.txt"
          (cd "$artifact_root" && find . -type f ! -name SHA256SUMS -print0 | sort -z | \
            xargs -0 sha256sum > SHA256SUMS)
          sha256sum "$artifact_root/SHA256SUMS" | tee "$LOG_DIR/artifact-checksum.txt"

      - name: Upload immutable compile artifact
        uses: actions/upload-artifact@v4
        with:
          name: g4-boundary-isolation-certificate-code-build
          path: g4-boundary-isolation-certificate-code-build-artifact
          if-no-files-found: error
          retention-days: 14

      - name: Upload detailed activity log always
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g4-boundary-isolation-certificate-code-build-logs
          path: /tmp/g4-boundary-isolation-certificate-logs
          if-no-files-found: error
          retention-days: 14
