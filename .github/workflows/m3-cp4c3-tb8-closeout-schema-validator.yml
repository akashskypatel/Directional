name: Agent M3 CP4c3 TB8 Closeout Schema Validation

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m3-cp4c3-tb8-closeout-schema-validation.txt

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m3-cp4c3-tb8-closeout-schema-validation
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .agents/Directional/turn-payloads/M3_CP4c3_TB8_closeout_drive_candidate.yml
      source_ref: ${{ github.sha }}
    secrets: inherit
