name: Agent P5 CB83 FlowRep source edit

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .github/workflows/agent-p5-cb83-flowrep-edit.yml

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  edit:
    runs-on: ubuntu-latest
    steps:
      - name: Record edit start
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          gh api repos/${{ github.repository }}/issues/8/comments \
            -f body="P5-CB83 FlowRep source-edit run ${RUN_ID} started for ${EVENT_SHA}. This workflow edits source only and executes no project binary, test, benchmark, help/list, discovery, or custom mesh command."

      - uses: actions/checkout@v4
        with:
          ref: agent/surface_cell_quad/p5-recover-bridge-healing
          fetch-depth: 1
          submodules: false

      - name: Apply stale-reference fix
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/geometry/FlowRepStrands.cpp")
          text = path.read_text()

          old = """  for (const OpenEndpoint &endpoint : openEndpoints) {
            FlowRepArc &source =
                result.arcs[static_cast<std::size_t>(endpoint.arcId)];"""
          new = """  for (const OpenEndpoint &endpoint : openEndpoints) {
            const int sourceArcId = endpoint.arcId;
            FlowRepArc &source =
                result.arcs[static_cast<std::size_t>(sourceArcId)];"""
          if text.count(old) != 1:
              raise RuntimeError(f"source-reference anchor count={text.count(old)}")
          text = text.replace(old, new, 1)

          old = """    ++result.resolvedEndpoints;
            record_diagnostic(
                endpoint, source, family, sign, &trace,
                hasTerminalTraceArc ? &terminalTraceArc : nullptr,
                hasLastRepresentableTraceArc ? &lastRepresentableTraceArc : nullptr,
                terminalFeatureRailOwnership, supportTraceId,
                hasCommittedNetworkIntersection ? &committedNetworkIntersection
                                                : nullptr,
                skippedDegenerateSegments,
                reachedIntrinsicNode ? FlowRepEndpointResolution::IntrinsicNode
                                     : FlowRepEndpointResolution::SegmentIntersection);"""
          new = """    ++result.resolvedEndpoints;
            // Generated connector insertion can reallocate result.arcs. Reacquire
            // the source by stable arc identity before recording committed evidence.
            const FlowRepArc &committedSource =
                result.arcs[static_cast<std::size_t>(sourceArcId)];
            record_diagnostic(
                endpoint, committedSource, family, sign, &trace,
                hasTerminalTraceArc ? &terminalTraceArc : nullptr,
                hasLastRepresentableTraceArc ? &lastRepresentableTraceArc : nullptr,
                terminalFeatureRailOwnership, supportTraceId,
                hasCommittedNetworkIntersection ? &committedNetworkIntersection
                                                : nullptr,
                skippedDegenerateSegments,
                reachedIntrinsicNode ? FlowRepEndpointResolution::IntrinsicNode
                                     : FlowRepEndpointResolution::SegmentIntersection);"""
          if text.count(old) != 1:
              raise RuntimeError(f"diagnostic anchor count={text.count(old)}")
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Commit source change
        run: |
          git config user.name "directional-agent"
          git config user.email "directional-agent@users.noreply.github.com"
          git add src/geometry/FlowRepStrands.cpp
          git commit -m "fix(flowrep): reacquire source after connector growth"
          git push origin HEAD:agent/surface_cell_quad/p5-recover-bridge-healing

      - name: Record edit result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          JOB_STATUS: ${{ job.status }}
        run: |
          gh api repos/${{ github.repository }}/issues/8/comments \
            -f body="P5-CB83 FlowRep source-edit run ${RUN_ID} finished ${JOB_STATUS}. No project binary, test, benchmark, help/list, discovery, or custom mesh command executed."
