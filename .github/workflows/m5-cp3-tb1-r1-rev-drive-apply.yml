name: M5 CP3 TB1 R1 Review Closeout Patch Apply

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m5-cp3-tb1-r1-rev-drive-apply.txt

permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

concurrency:
  group: m5-cp3-tb1-r1-rev-drive-apply-${{ github.ref }}
  cancel-in-progress: false

jobs:
  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m5-cp3-tb1-r1-rev-drive-apply
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/m5-cp3-tb1-r1-rev-drive-apply.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  apply:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 11O9G2XRYLf9iAzcFo4KwnYly_zCgUnU2
      patch_sha256: 1aa3e41760d3722eb1c03573422cbe4bab4e38f9cc3e6884b82f15e325a334e4
      base_sha: 36ac4859193b6fb217f9f50aae21f28cb5da54fa
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: docs: complete M5-CP3-TB1-R1 independent review
      retention_days: 7
    secrets: inherit
