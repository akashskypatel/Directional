name: m1g-test-closeout-docs

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - '.agents/connector-triggers/m1g-test-closeout-docs'

permissions:
  contents: write

concurrency:
  group: m1g-test-closeout-docs
  cancel-in-progress: false

jobs:
  closeout:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      LOG_DIR: /tmp/m1g-doc-closeout
    steps:
      - name: Initialize persistent activity log
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$LOG_DIR"
          printf '%s\n' \
            'turn=M1g Test+Benchmark documentation closeout' \
            "run_id=$GITHUB_RUN_ID" \
            "event_sha=$GITHUB_SHA" \
            "ref=$GITHUB_REF" \
            'source_edit=false' 'test_edit=false' 'build_edit=false' \
            "started_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            | tee "$LOG_DIR/activity.log"

      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: agent/surface_cell_quad/p5-recover-bridge-healing
          fetch-depth: 1

      - name: Update durable current authority
        shell: bash
        run: |
          set -Eeuo pipefail
          log="$LOG_DIR/activity.log"
          exec > >(tee -a "$log") 2>&1
          trap 'rc=$?; echo "step=update-docs exit_code=$rc"; exit $rc' EXIT
          python3 <<'PY'
          from pathlib import Path

          def read(path):
              return Path(path).read_text(encoding='utf-8')

          def write(path, text):
              Path(path).write_text(text, encoding='utf-8')

          def replace_required(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'missing required replacement: {label}')
              return text.replace(old, new)

          def replace_section(text, start_heading, next_heading, replacement, label):
              start = text.find(start_heading)
              if start < 0:
                  raise SystemExit(f'missing section start: {label}')
              end = text.find(next_heading, start + len(start_heading))
              if end < 0:
                  raise SystemExit(f'missing section end: {label}')
              return text[:start] + replacement.rstrip() + '\n\n' + text[end:]

          report = '.agents/Directional/Architecture_M1g_Periodic_Holonomy_Route_Transport_Consumer_Artifact_Only_Test_Benchmark_Report.md'
          next_plan = '.agents/Directional/Architecture_M1h_Phase_Front_Field_Chart_Consumer_Code_Build_Plan.md'
          old_report_name = 'Architecture_M1g_Periodic_Holonomy_Route_Transport_Consumer_Code_Build_Report.md'
          old_plan_name = 'Architecture_M1g_Periodic_Holonomy_Route_Transport_Consumer_Artifact_Only_Test_Benchmark_Plan.md'
          new_report_name = Path(report).name
          new_plan_name = Path(next_plan).name
          for required in (report, next_plan):
              if not Path(required).is_file():
                  raise SystemExit(f'missing new authority file: {required}')

          # Handoff: replace only current M1g/M1h authority sections; retain historical sections.
