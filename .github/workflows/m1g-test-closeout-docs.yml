name: m1g-test-closeout-docs

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - '.agents/connector-triggers/m1g-test-closeout-docs'

permissions:
  contents: write

concurrency:
  group: m1g-test-closeout-docs
  cancel-in-progress: false

jobs:
  closeout:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      LOG_DIR: /tmp/m1g-doc-closeout

    steps:
      - name: Initialize persistent activity log
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$LOG_DIR"
          printf '%s\n' \
            'turn=M1g Test+Benchmark documentation closeout' \
            "run_id=$GITHUB_RUN_ID" \
            "event_sha=$GITHUB_SHA" \
            "ref=$GITHUB_REF" \
            'source_edit=false' \
            'test_edit=false' \
            'build_edit=false' \
            "started_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            | tee "$LOG_DIR/activity.log"

      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: agent/surface_cell_quad/p5-recover-bridge-healing
          fetch-depth: 1

      - name: Update durable current authority
        shell: bash
        run: |
          set -Eeuo pipefail
          log="$LOG_DIR/activity.log"
          exec > >(tee -a "$log") 2>&1
          trap 'rc=$?; echo "step=update-docs exit_code=$rc"; exit $rc' EXIT
          python3 .agents/Directional/turn-payloads/m1g-test-closeout-docs.py
          git diff --check
          git status --short
          git diff -- TODO MILESTONE_G_TODO.md .agents/Directional > "$LOG_DIR/docs.patch"
          echo "changed_files=$(git status --short | wc -l)"

      - name: Commit and push documentation closeout
        shell: bash
        run: |
          set -Eeuo pipefail
          log="$LOG_DIR/activity.log"
          exec > >(tee -a "$log") 2>&1
          trap 'rc=$?; echo "step=commit exit_code=$rc"; exit $rc' EXIT
          test -z "$(git status --short -- src include tests cmake CMakeLists.txt 2>/dev/null || true)"
          git config user.name 'OpenAI Directional Agent'
          git config user.email 'directional-agent@users.noreply.github.com'
          git add -u -- TODO MILESTONE_G_TODO.md .agents/Directional
          git diff --cached --check
          git commit -m 'docs: close M1g immutable runtime turn'
          git push origin HEAD:agent/surface_cell_quad/p5-recover-bridge-healing
          echo "committed=$(git rev-parse HEAD)"
          echo "finished_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"

      - name: Upload detailed activity log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m1g-test-closeout-docs-logs
          path: /tmp/m1g-doc-closeout/activity.log
          if-no-files-found: error
          retention-days: 14

      - name: Upload documentation patch evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m1g-test-closeout-docs-evidence
          path: /tmp/m1g-doc-closeout/docs.patch
          if-no-files-found: error
          retention-days: 14
