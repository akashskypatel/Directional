name: M3 CP4c3 TB42 EXEC

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/tb42-exec/trigger.txt

permissions:
  contents: write
  actions: read
  issues: write
  pull-requests: write

concurrency:
  group: m3-cp4c3-tb42-exec
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/agent-tb42-exec.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m3-cp4c3-tb42-exec
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  execute:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Initialize persistent control log
        shell: bash
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/m3-cp4c3-tb42-exec-control.log"
          : > "$log"
          {
            echo "workflow=${GITHUB_WORKFLOW}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "event=${GITHUB_EVENT_NAME}"
            echo "event_sha=${GITHUB_SHA}"
            echo "repository=${GITHUB_REPOSITORY}"
            echo "runner_os=${RUNNER_OS}"
            echo "turn=M3-CP4c-3-TB42-EXEC"
            echo "semantic_source=5dacce6019ea34316c48743f3033d2bb5c26281a"
            echo "artifact_id=10070788592"
            echo "runtime_execution=artifact-only"
            echo "started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } | tee -a "$log"

      - name: Checkout exact semantic source for frozen harness authority
        uses: actions/checkout@v4
        with:
          ref: 5dacce6019ea34316c48743f3033d2bb5c26281a
          fetch-depth: 1
          submodules: false
          lfs: false

      - name: Verify frozen harness and selector prefix authority
        shell: bash
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/m3-cp4c3-tb42-exec-control.log"
          exec > >(tee -a "$log") 2>&1
          harness=.agents/Directional/tools/m3_cp4c3_artifact_only_harness.sh
          s408=.agents/Directional/Architecture_M3_CP4c3_Required_Green_Selector_408.txt
          s409=.agents/Directional/Architecture_M3_CP4c3_Required_Green_Selector_409.txt
          test "$(sha256sum "$harness" | awk '{print $1}')" = aaadab351c0ba28a39c87aff1948f83ab0c4c71520662177e5cdf6fd08b30ed3
          test "$(sha256sum "$s408" | awk '{print $1}')" = 2a742ba92dba744425fccaf81d5cc7a57885cbff37c779d525218fcd70500af6
          test "$(sha256sum "$s409" | awk '{print $1}')" = eea6d8c2bbc8e9247deb4bfbbe6763042c76002d1894dd62e35f80262403b53e
          python3 - "$s408" "$s409" <<'PY'
          import pathlib, sys
          a=[x.strip() for x in pathlib.Path(sys.argv[1]).read_text().splitlines() if x.strip()]
          b=[x.strip() for x in pathlib.Path(sys.argv[2]).read_text().splitlines() if x.strip()]
          assert len(a)==408 and len(b)==409 and b[:408]==a
          print('selector408_prefix_of_409=true')
          PY
          echo "harness_and_selector_authority=PASS"

      - name: Execute immutable artifact-only selector409
        id: runtime
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          TURN_ID: M3-CP4c-3-TB42-EXEC
          ARTIFACT_ID: '10070788592'
          EXPECTED_ARTIFACT_NAME: directional-m3-cp4c3-cb47-result-34262805758
          EXPECTED_PROVIDER_DIGEST: sha256:f3a936866dc0bc0a81ed7d6d06380836e98e5c32806ac5a8680cf4a0ab393114
          EXPECTED_ZIP_SHA256: f3a936866dc0bc0a81ed7d6d06380836e98e5c32806ac5a8680cf4a0ab393114
          EXPECTED_SOURCE_SHA: 5dacce6019ea34316c48743f3033d2bb5c26281a
          SELECTOR_RELATIVE_PATH: .agents/Directional/Architecture_M3_CP4c3_Required_Green_Selector_409.txt
          EXPECTED_SELECTOR_COUNT: '409'
          EXPECTED_SELECTOR_SHA256: eea6d8c2bbc8e9247deb4bfbbe6763042c76002d1894dd62e35f80262403b53e
          ACCEPTED_PREFIX_COUNT: '365'
        shell: bash
        run: |
          set -euo pipefail
          .agents/Directional/tools/m3_cp4c3_artifact_only_harness.sh --execute

      - name: Preserve frozen gate and EC7 measurement rows
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          control="${RUNNER_TEMP}/m3-cp4c3-tb42-exec-control.log"
          result="${RUNNER_TEMP}/M3-CP4c-3-TB42-EXEC-result"
          exec > >(tee -a "$control") 2>&1
          mkdir -p "$result"
          if [[ ! -f "$result/ledger.tsv" ]]; then
            echo "ledger_absent=true" > "$result/frozen-gate-status.txt"
            exit 0
          fi
          python3 - "$result/ledger.tsv" "$result/frozen-gate-status.txt" <<'PY'
          import csv, pathlib, sys
          rows={int(r['ordinal']):r for r in csv.DictReader(open(sys.argv[1]), delimiter='\t')}
          accepted=[n for n in range(1,366) if rows[n]['result']!='PASS']
          protected=[311,314,356,357,312,315,409,404,408]
          red=[n for n,r in rows.items() if r['result']=='RED']
          lines=[f'accepted_prefix_pass={365-len(accepted)}/365', f'accepted_prefix_red={accepted}', f'red_ordinals={red}']
          for n in protected: lines.append(f'ordinal_{n}={rows[n]["result"]}')
          pathlib.Path(sys.argv[2]).write_text('\n'.join(lines)+'\n')
          PY
          : > "$result/ec7-measurements.txt"
          for n in 390 393 406 407; do
            raw="$result/raw/ordinal-$(printf '%03d' "$n").log"
            echo "=== ordinal $n ===" >> "$result/ec7-measurements.txt"
            if [[ -f "$raw" ]]; then
              grep -E 'unlabeledFaceCount=|frontierPartitionComponentCount=|ownerConsistencyRowCount=|regionFrontierLocator=|regionFrontierLocatorSurvivedGuard=|regionFrontierFailureSourceFaceInPartition=|regionFrontierFailureRegionSourceFaceCount=|regionFrontierFailureRegionSourceFacesInPartitionCount=|regionFrontierComponentCount=' "$raw" >> "$result/ec7-measurements.txt" || true
            else
              echo 'raw_log_absent=true' >> "$result/ec7-measurements.txt"
            fi
          done
          sha256sum "$result/frozen-gate-status.txt" "$result/ec7-measurements.txt" > "$result/tb42-exec-derived.sha256"
          cat "$result/frozen-gate-status.txt"
          cat "$result/ec7-measurements.txt"

      - name: Record final control status
        if: always()
        env:
          RUNTIME_OUTCOME: ${{ steps.runtime.outcome }}
        shell: bash
        run: |
          set +e
          log="${RUNNER_TEMP}/m3-cp4c3-tb42-exec-control.log"
          result="${RUNNER_TEMP}/M3-CP4c-3-TB42-EXEC-result"
          {
            echo "runtime_step_outcome=${RUNTIME_OUTCOME}"
            if [[ -f "$result/execution-boundary.txt" ]]; then cat "$result/execution-boundary.txt"; fi
            echo "finished_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } | tee -a "$log"

      - name: Upload TB42 EXEC result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-cp4c3-tb42-exec-result-${{ github.run_id }}
          path: ${{ runner.temp }}/M3-CP4c-3-TB42-EXEC-result
          if-no-files-found: error
          retention-days: 7

      - name: Upload TB42 EXEC logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-cp4c3-tb42-exec-log-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/M3-CP4c-3-TB42-EXEC.log
            ${{ runner.temp }}/m3-cp4c3-tb42-exec-control.log
          if-no-files-found: error
          retention-days: 7

      - name: Fail on orchestration-invalid harness outcome
        if: always() && steps.runtime.outcome != 'success'
        shell: bash
        run: |
          echo "TB42 artifact-only harness failed orchestration or integrity checks." >&2
          exit 1
