name: M6 CP2 CB1 verifier stop docs apply

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m6-cp2-cb1-verifier-stop-docs-apply.txt

permissions:
  actions: read
  contents: write
  id-token: write

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/m6-cp2-cb1-verifier-stop-docs-apply.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  apply:
    needs: validate
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1jjVWbJFn4TlGY8w6FoZMljNlXzLN-mWH
      patch_sha256: 56ce5e95facc96d096b5e4d7da977340ae3580ffea9d8ee8af7c0577d37de20f
      base_sha: 8bc1f52b22c1c429e8b5afdd8e3eb1fee67fc886
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: "docs: record M6 CP2 verifier RA-28a stop"
    secrets: inherit

  mailbox:
    if: ${{ always() }}
    needs: [validate, apply]
    permissions:
      actions: read
      contents: write
    uses: ./.github/workflows/workflow-mailbox-publisher.yml
    with:
      workflow_key: m6-cp2-cb1-verifier-stop-docs
      source_sha: ${{ github.sha }}
      source_ref: ${{ github.ref }}
      result: ${{ needs.apply.result }}
      summary: "M6 CP2 verifier RA-28a section 7 stop documentation patch."
