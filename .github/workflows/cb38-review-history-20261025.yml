name: CB38 Review History Verification
on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/review-history/cb38-rev-20261025.txt
permissions:
  contents: read
  actions: read
concurrency:
  group: cb38-review-history-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/cb38-review-history-20261025.yml
      source_ref: ${{ github.sha }}
  history:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Initialize persistent activity log
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/cb38-review-history"
          echo "sha=${GITHUB_SHA}" | tee "${RUNNER_TEMP}/cb38-review-history/log.txt"
      - name: Checkout authentic repository history
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          submodules: false
          lfs: false
          persist-credentials: false
      - name: Execute source authority and review checks
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "source_sha=$(git rev-parse HEAD)"
            echo "history_shallow=$(git rev-parse --is-shallow-repository)"
            python3 .agents/Directional/tools/review_check.py authority 41f39ba920eace2dad7b36d2b26c8073ce740239
            python3 .agents/Directional/tools/review_check.py boundary
            python3 .agents/Directional/tools/review_check.py ledgers --base 8b7299b43
            git status -sb
          } 2>&1 | tee "${RUNNER_TEMP}/cb38-review-history/checks.txt"
      - name: Upload history evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cb38-review-history-${{ github.run_id }}
          path: ${{ runner.temp }}/cb38-review-history/checks.txt
          if-no-files-found: error
      - name: Upload separate diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cb38-review-history-log-${{ github.run_id }}
          path: ${{ runner.temp }}/cb38-review-history/log.txt
          if-no-files-found: error
  mailbox:
    if: ${{ always() }}
    needs: [history]
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/workflow-mailbox-publisher.yml
    with:
      mailbox_branch: workflow-mailbox
      workflow_key: m6-cp3-cb38-review-history
      source_sha: ${{ github.sha }}
      source_ref: ${{ github.ref }}
      result: ${{ needs.history.result }}
      summary: Independent CB38 review history verification.
