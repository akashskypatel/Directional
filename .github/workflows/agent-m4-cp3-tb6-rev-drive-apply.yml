name: M4 CP3 TB6 REV Drive Apply

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m4-cp3-tb6-rev-drive-apply.txt

permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

concurrency:
  group: m4-cp3-tb6-rev-drive-apply-${{ github.ref }}
  cancel-in-progress: false

jobs:
  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m4-cp3-tb6-rev-drive-apply
      commit_run_file: false
    secrets: inherit

  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/agent-m4-cp3-tb6-rev-drive-apply.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  apply:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1TCWMaNv4256vIMyuPh0cPEDsgCvt3kP9
      patch_sha256: '538a20f4fd8dae2a6e2c8c9b6c71b5bec7a9292b4f5191498ca87445bdc36d7e'
      base_sha: 8da9bd6dd6184870045b30c349c54848e61f9d21
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: 'review: adjudicate M4-CP3-TB6 and freeze CB9'
    secrets: inherit
