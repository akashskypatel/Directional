name: M5 CP1 TB1 R2 Review Drive Patch

on:
  push:
    branches: [agent/surface_cell_quad/p5-recover-bridge-healing]
    paths: [.agents/connector-triggers/m5-cp1-tb1-r2-rev-drive-apply-20260920.txt]

permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

concurrency:
  group: m5-cp1-tb1-r2-rev-drive-${{ github.ref }}
  cancel-in-progress: false

jobs:
  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m5-cp1-tb1-r2-rev-drive
      commit_run_file: false
      trim_stale_comments: false
    secrets: inherit

  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/m5-cp1-tb1-r2-rev-drive-apply.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  apply:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1fQqDwe81KFeMMJojtIcCSrPNtpOEEtZa
      patch_sha256: '071aeeb8cd400ac79dfaee5aafb90f1cee1b9115421b966b9cc77f6cbe9c0803'
      base_sha: 3841e71aac0fa881a78af114b16a7ad0b3ce206f
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: 'docs(m5-cp1): adjudicate R2 row6 witness authority'
      retention_days: 7
    secrets: inherit
