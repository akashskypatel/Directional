name: M5 CP3 TB1 R11 Artifact-Only Test Benchmark

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m5-cp3-tb1-r11-exec.txt

permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: m5-cp3-tb1-r11-exec-${{ github.ref }}
  cancel-in-progress: false

jobs:
  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m5-cp3-tb1-r11-exec
      commit_run_file: false
      trim_stale_comments: false
    secrets: inherit

  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/m5-cp3-tb1-r11-exec.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  runtime:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      DRIVER_TEMPLATE: .agents/Directional/turn-payloads/m5_cp3_tb1_r11_exec.py.in
      DRIVER_BASENAME: m5_cp3_tb1_r11_exec.py
      TURN_ID: M5-CP3-TB1-R11-EXEC
    steps:
      - name: Initialize persistent diagnostic log
        shell: bash
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/${TURN_ID}.log"
          : > "$log"
          {
            echo "workflow=$GITHUB_WORKFLOW"
            echo "run_id=$GITHUB_RUN_ID"
            echo "event=$GITHUB_EVENT_NAME"
            echo "event_sha=$GITHUB_SHA"
            echo "ref=$GITHUB_REF"
            echo "repository=$GITHUB_REPOSITORY"
            echo "runner_os=$RUNNER_OS"
            echo "turn_boundary=Test+Benchmark-only"
            echo "started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } | tee -a "$log"

      - name: Checkout orchestration authority
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          submodules: false
          lfs: false

      - name: Materialize and verify frozen runtime driver
        shell: bash
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/${TURN_ID}.log"
          exec > >(tee -a "$log") 2>&1
          test -f "$DRIVER_TEMPLATE"
          test -f .agents/Directional/tools/write_orchestration_payload.py
          driver="${RUNNER_TEMP}/${DRIVER_BASENAME}"
          env_file="${RUNNER_TEMP}/m5-cp3-tb1-r11-sha.env"
          printf '%s\n' 'CANDIDATE_SHA256=faf4def9e6823f718e56091876bb97047f5e91a8bfb561ca40d91d70d2af61ce' 'ROOT_MANIFEST_SHA256=352f7553e2f0dc627ada385d78327bcb93d4f3b66125f4faf540d6965a1c2c33' 'SOURCE_ARCHIVE_SHA256=506e9d75976802f7045b95344ef8cc0ff1e4d39b8343bdaddaa009a58e04a673' 'ROUTING_SHA256=352c8cfc9c9b89cf0d532c8e0836339a31ba35fd6e854a781721cbc76f02afce' 'IDENTITY_MAP_SHA256=7a92e7a3b8a69466423c4a0d2ad5ece2dcd4912f04eeb99e1f32fa70b4a5cf6c' 'SELECTOR_SHA256=1c4128500cb2f70f3bf00b85aadc44363ab89fdab906bf4aa7b140a4955a9db6' 'PREFIX427_SHA256=f9c88380135a14d20492e215758cce35cab78ffe167b09fe5267d5ba2beae86f' > "$env_file"
          source "$env_file"
          python3 .agents/Directional/tools/write_orchestration_payload.py --template "$DRIVER_TEMPLATE" --output "$driver" --sha256 "candidate=$CANDIDATE_SHA256" --sha256 "root_manifest=$ROOT_MANIFEST_SHA256" --sha256 "source_archive=$SOURCE_ARCHIVE_SHA256" --sha256 "routing=$ROUTING_SHA256" --sha256 "identity_map=$IDENTITY_MAP_SHA256" --sha256 "selector=$SELECTOR_SHA256" --sha256 "prefix427=$PREFIX427_SHA256"
          python3 - "$driver" <<'PY'
          import pathlib, sys
          path = pathlib.Path(sys.argv[1])
          compile(path.read_text(encoding='utf-8'), str(path), 'exec')
          PY
          echo "DRIVER_PATH=$driver" >> "$GITHUB_ENV"
          receipt="${RUNNER_TEMP}/${TURN_ID}-driver-authority.txt"
          {
            echo "template_path=$DRIVER_TEMPLATE"
            echo "template_sha256=$(sha256sum "$DRIVER_TEMPLATE" | awk '{print $1}')"
            echo "writer_sha256=$(sha256sum .agents/Directional/tools/write_orchestration_payload.py | awk '{print $1}')"
            echo "rendered_driver_sha256=$(sha256sum "$driver" | awk '{print $1}')"
            cat "$env_file"
          } > "$receipt"
          cat "$receipt"
          git status --short

      - name: Execute frozen artifact-only plan
        id: gate
        shell: bash
        run: |
          set +e
          log="${RUNNER_TEMP}/${TURN_ID}.log"
          exec > >(tee -a "$log") 2>&1
          python3 "$DRIVER_PATH"
          status=$?
          result="${RUNNER_TEMP}/${TURN_ID}-result"
          authority="${RUNNER_TEMP}/${TURN_ID}-driver-authority.txt"
          finalization_status=0
          if [ -d "$result" ] && [ -f "$authority" ]; then
            cp "$authority" "$result/driver-authority.txt" || finalization_status=$?
            if [ "$finalization_status" -eq 0 ]; then
              (
                set -euo pipefail
                cd "$result"
                find . -type f ! -name SHA256SUMS -print0 \
                  | LC_ALL=C sort -z \
                  | xargs -0 sha256sum > SHA256SUMS.new
                mv SHA256SUMS.new SHA256SUMS
                sha256sum -c SHA256SUMS
                manifest_rows="$(grep -cve '^$' SHA256SUMS)"
                actual_non_manifest="$(find . -type f ! -name SHA256SUMS | wc -l | tr -d ' ')"
                echo "result_manifest_rows=$manifest_rows"
                echo "result_non_manifest_files=$actual_non_manifest"
                test "$manifest_rows" = "$actual_non_manifest"
              ) || finalization_status=$?
            fi
          else
            echo "result finalization inputs missing: result=$result authority=$authority" >&2
            finalization_status=92
          fi
          if [ "$finalization_status" -ne 0 ]; then
            echo "result_finalization_exit=$finalization_status" >&2
            status=$finalization_status
          fi
          echo "driver_exit=$status"
          echo "driver_exit=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload runtime result evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: directional-m5-cp3-tb1-r11-result-${{ github.run_id }}
          path: ${{ runner.temp }}/M5-CP3-TB1-R11-EXEC-result
          if-no-files-found: error
          retention-days: 7

      - name: Record final runtime status
        if: always()
        shell: bash
        run: |
          set +e
          log="${RUNNER_TEMP}/${TURN_ID}.log"
          {
            echo "driver_exit=${{ steps.gate.outputs.driver_exit }}"
            echo "final_job_status=${{ job.status }}"
            echo "finished_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } | tee -a "$log"

      - name: Upload diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: directional-m5-cp3-tb1-r11-log-${{ github.run_id }}
          path: ${{ runner.temp }}/M5-CP3-TB1-R11-EXEC.log
          if-no-files-found: error
          retention-days: 7

      - name: Fail closed on orchestration failure
        if: always()
        shell: bash
        run: test "${{ steps.gate.outputs.driver_exit }}" = "0"
