name: Agent M3 CP4c Consolidation Apply

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/google-drive/m3-cp4c-consolidation-apply-20260902-1820.txt

permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

concurrency:
  group: agent-m3-cp4c-consolidation-apply
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/agent-m3-cp4c-consolidation-apply.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m3-cp4c-consolidation-apply
      commit_run_file: false
    secrets: inherit

  apply:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1EyTfOxuOMT0p1nj_qFFvnZjosNJmvWNH
      patch_sha256: 307d892018ade12d75f7678814f783c3a4d24babbe507ac57b3e08cb948933a3
      base_sha: 166a1a9ea3b74260d1ebcd76b4192f79e74ae87b
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: "docs: consolidate historical M3 CP4c records"
      retention_days: 7
    secrets: inherit
