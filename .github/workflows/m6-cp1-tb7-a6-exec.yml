name: M6 CP1 TB7 A6 Artifact Only

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m6-cp1-tb7-a6-exec-20261003.txt

permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: m6-cp1-tb7-a6-exec-${{ github.ref }}
  cancel-in-progress: false

jobs:
  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m6-cp1-tb7-a6-exec
      commit_run_file: false
      trim_stale_comments: false
    secrets: inherit

  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/m6-cp1-tb7-a6-exec.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  runtime:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
      TURN_ID: M6-CP1-TB7-A6-EXEC
      HARNESS_PATH: .agents/Directional/turn-payloads/m6_cp1_tb7_a6_artifact_only_harness.sh
      EXPECTED_HARNESS_SHA256: ffa74cfc0000d503cc1dec5c64c43c39664eac112777fbdc7fc58ef50b0054d3
    steps:
      - name: Checkout exact control source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          token: ${{ secrets.GH_TOKEN || github.token }}

      - name: Verify frozen artifact-only harness
        shell: bash
        run: |
          set -euo pipefail
          test -f "$HARNESS_PATH"
          actual="$(sha256sum "$HARNESS_PATH" | awk '{print $1}')"
          test "$actual" = "$EXPECTED_HARNESS_SHA256"
          bash -n "$HARNESS_PATH"

      - name: Execute immutable 460-process gate
        id: gate
        shell: bash
        run: |
          set +e
          bash "$HARNESS_PATH" --execute
          status=$?
          set -e
          echo "harness_exit=${status}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload result evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m6-cp1-tb7-a6-result-${{ github.run_id }}
          path: ${{ runner.temp }}/M6-CP1-TB7-A6-EXEC-result
          if-no-files-found: error
          retention-days: 7

      - name: Upload diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m6-cp1-tb7-a6-log-${{ github.run_id }}
          path: ${{ runner.temp }}/M6-CP1-TB7-A6-EXEC.log
          if-no-files-found: error
          retention-days: 7

      - name: Fail closed on orchestration failure
        if: always()
        shell: bash
        run: test "${{ steps.gate.outputs.harness_exit }}" = "0"
