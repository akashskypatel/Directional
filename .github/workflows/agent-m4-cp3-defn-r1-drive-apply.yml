name: Agent M4 CP3 DEFN R1 Docs Apply

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m4-cp3-defn-r1-drive-apply/trigger.txt

permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

concurrency:
  group: agent-m4-cp3-defn-r1-drive-apply-${{ github.ref }}
  cancel-in-progress: false

jobs:
  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      report_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_run_file: false
      label: m4-cp3-defn-r1-drive-apply
    secrets: inherit

  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/agent-m4-cp3-defn-r1-drive-apply.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  apply:
    needs: validate
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1ziYoOt2lbpGx-Un7o9pvR0pMNjAOyVa4
      patch_sha256: 3708c372dc811df17bdf2dab366fc5023b428b4ade1ec4d2b22970516895287a
      base_sha: 7e90e48b0e267d312fd5c92f900c248042e4bdd9
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: "docs: freeze M4 CP3 DEFN R1 parity contract"
      retention_days: 14
    secrets: inherit
