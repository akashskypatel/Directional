name: m1j-code-build-closeout

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - '.agents/connector-triggers/m1j-code-build-closeout'

permissions:
  contents: write

concurrency:
  group: m1j-code-build-closeout
  cancel-in-progress: false

jobs:
  closeout:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Initialize persistent activity log
        shell: bash
        run: |
          set -Eeuo pipefail
          LOG="$RUNNER_TEMP/m1j-code-build-closeout.log"
          printf '%s\n' \
            'turn=M1j Code+Build durable closeout' \
            "event_sha=$GITHUB_SHA" \
            'runtimeExecution=false' 'testExecution=false' 'benchmarkExecution=false' \
            'ctestExecution=false' 'cliExecution=false' 'fuzzerExecution=false' \
            'customInputExecution=false' > "$LOG"

      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: agent/surface_cell_quad/p5-recover-bridge-healing
          fetch-depth: 120
          submodules: false

      - name: Apply surgical durable status updates
        shell: bash
        run: |
          set -Eeuo pipefail
          LOG="$RUNNER_TEMP/m1j-code-build-closeout.log"
          exec > >(tee -a "$LOG") 2>&1
          trap 'rc=$?; echo "apply_final_rc=$rc"; git status --short || true; exit $rc' EXIT
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 .agents/Directional/turn-payloads/m1j-code-build-closeout.py
          git diff --check
          mapfile -t changed < <(git diff --name-only | LC_ALL=C sort)
          printf 'changed files:\n%s\n' "${changed[*]}"
          expected=(
            .agents/Directional/Future_Chat_Session_Handoff.md
            .agents/Directional/REORIENTATION_PLAN.md
            .agents/Directional/Regression_Root_Cause_Tracker.md
            MILESTONE_G_TODO.md
            TODO
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | LC_ALL=C sort)
          test "${#changed[@]}" -eq "${#expected_sorted[@]}"
          for i in "${!expected_sorted[@]}"; do
            test "${changed[$i]}" = "${expected_sorted[$i]}"
          done
          grep -F 'M1j Phase-Front Edge Source-Scope Consumer — immutable Artifact-Only Test + Benchmark only' .agents/Directional/Future_Chat_Session_Handoff.md >/dev/null
          grep -F '9076217893 / 9076218338' .agents/Directional/Future_Chat_Session_Handoff.md >/dev/null
          grep -F 'M1j edge source-scope Code + Build complete and immutable runtime pending' TODO >/dev/null
          git diff --stat

      - name: Commit and push durable closeout
        shell: bash
        run: |
          set -Eeuo pipefail
          LOG="$RUNNER_TEMP/m1j-code-build-closeout.log"
          exec > >(tee -a "$LOG") 2>&1
          git config user.name 'OpenAI Directional Agent'
          git config user.email 'directional-agent@users.noreply.github.com'
          git add -f -- \
            .agents/Directional/Future_Chat_Session_Handoff.md \
            .agents/Directional/REORIENTATION_PLAN.md \
            .agents/Directional/Regression_Root_Cause_Tracker.md
          git add -- MILESTONE_G_TODO.md TODO
          git diff --cached --check
          git diff --cached --name-status
          git commit -m 'docs: record M1j Code+Build and runtime handoff'
          git push origin HEAD:agent/surface_cell_quad/p5-recover-bridge-healing
          echo "pushed_commit=$(git rev-parse HEAD)"

      - name: Upload dedicated diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m1j-code-build-closeout-logs
          path: ${{ runner.temp }}/m1j-code-build-closeout.log
          if-no-files-found: error
          retention-days: 14
