name: TB87 Review Static Boundary Check

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/review-boundary/tb87-review-20261108.txt

permissions:
  contents: read
  actions: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Initialize diagnostic log
        shell: bash
        run: |
          set -euo pipefail
          : > "${RUNNER_TEMP}/tb87-review-boundary.log"
          printf 'event_sha=%s\\nstarted_at=%s\\n' "${GITHUB_SHA}" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" | tee -a "${RUNNER_TEMP}/tb87-review-boundary.log"
      - name: Checkout full authentic Git history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false
          persist-credentials: false
      - name: Run static review boundary and ledger checks
        shell: bash
        run: |
          set -euo pipefail
          { python3 .agents/Directional/tools/review_check.py boundary; python3 .agents/Directional/tools/review_check.py ledgers --base 8b7299b43; } 2>&1 | tee -a "${RUNNER_TEMP}/tb87-review-boundary.log"
      - name: Upload static review diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tb87-review-boundary-log-${{ github.run_id }}
          path: ${{ runner.temp }}/tb87-review-boundary.log
          if-no-files-found: error
          retention-days: 14

  mailbox:
    if: ${{ always() }}
    needs: [verify]
    permissions:
      actions: read
      contents: write
    uses: ./.github/workflows/workflow-mailbox-publisher.yml
    with:
      mailbox_branch: workflow-mailbox
      workflow_key: m6-cp3-tb87-rev-boundary
      source_sha: ${{ github.sha }}
      source_ref: ${{ github.ref }}
      result: ${{ needs.verify.result }}
      summary: TB87 independent review static boundary and ledger verification.
