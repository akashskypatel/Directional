name: M4 CP SCALE TB12 R4 Review Drive Apply

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/tb12-r4-rev-drive-apply.txt

permissions:
  actions: read
  contents: write
  id-token: write
  issues: write
  pull-requests: write

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/m4-cp-scale-tb12-r4-rev-drive-apply.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: tb12-r4-rev-drive-apply
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  apply:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1LoquEQXR0bdSNH2-zLkGQ76-0x0UqMWA
      patch_sha256: fd31405bd3fb4725e9691c00dba533353d94de85c2f4e9011e74b149524e728d
      base_sha: fad9e3ed5399135e36ddb6623b47111c6ee92aa7
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: M4-CP-SCALE-TB12-R4-REV closeout
      retention_days: 7
    secrets: inherit
