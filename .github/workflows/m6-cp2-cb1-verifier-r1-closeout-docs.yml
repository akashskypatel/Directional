name: M6 CP2 CB1 Verifier R1 Closeout Docs

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m6-cp2-cb1-verifier-r1-closeout-docs.txt

permissions:
  actions: read
  contents: write
  id-token: write

concurrency:
  group: m6-cp2-cb1-verifier-r1-closeout-docs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/m6-cp2-cb1-verifier-r1-closeout-docs.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  apply:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1xUGefIFa3noyrx0ICtGowQijQhLD3H4E
      patch_sha256: 4694251b9f7ea1b0642a26428e0a9034a7b7a8efb1b19e4b6c9da34f87c8c38e
      base_sha: f5900a1dc24fcad5efca83de42b6e0a2b5f545dc
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: "M6 CP2: close verifier Code + Build turn"
    secrets: inherit

  mailbox:
    if: ${{ always() }}
    needs: [validate, apply]
    permissions:
      actions: read
      contents: write
    uses: ./.github/workflows/workflow-mailbox-publisher.yml
    with:
      workflow_key: m6-cp2-cb1-verifier-r1-closeout-docs
      source_sha: ${{ github.sha }}
      source_ref: ${{ github.ref }}
      result: ${{ needs.apply.result }}
      summary: M6-CP2-CB1-VERIFIER-R1 durable closeout documentation application.
