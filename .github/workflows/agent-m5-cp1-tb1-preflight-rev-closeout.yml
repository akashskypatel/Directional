name: M5 CP1 TB1 Preflight Review Closeout

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m5-cp1-tb1-preflight-rev-closeout.txt

permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

concurrency:
  group: m5-cp1-tb1-preflight-rev-closeout-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/agent-m5-cp1-tb1-preflight-rev-closeout.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m5-cp1-tb1-preflight-rev-closeout
      commit_run_file: false
      trim_stale_comments: false
    secrets: inherit

  apply:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1Fmm76bex655C5Hix-4na2C5JQbg6l3Ta
      patch_sha256: 593dfbadd4bfb245f8f08c0d7b39dec29e41575a5395830bfcae9970d77d8052
      base_sha: 79fcc7d75ace06fb431d2271e8f0feb3359b2562
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: "docs: complete M5 CP1 TB1 preflight review"
    secrets: inherit
