name: Agent M6 CP1 CB2 Drive Apply

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/drive-patch/M6-CP1-CB2.txt

permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

concurrency:
  group: agent-m6-cp1-cb2-drive-apply-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/agent-m6-cp1-cb2-drive-apply.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m6-cp1-cb2-drive-apply
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  apply:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1EIeqrtrhM2wCR53Y3u3wlR3w5ZMP8Q3X
      patch_sha256: d87318e9c528c5b0c274ea950b1ef64d5f61b76c8d6aae1e720e6d9ee27052c8
      base_sha: 598de1d7befe130d8d9e43b19df1f0d06c2d12fc
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: "M6-CP1-CB2: materialize corner sheet range"
      retention_days: 7
    secrets: inherit
