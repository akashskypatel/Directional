name: M4 CP3 CB3 Drive Apply

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m4-cp3-cb3-drive-apply/trigger.txt

permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

concurrency:
  group: m4-cp3-cb3-drive-apply
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/m4-cp3-cb3-drive-apply.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m4-cp3-cb3-drive-apply
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  apply:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1IBsyRfqRE4zUdrrcrValYWcQ39x9TxZK
      patch_sha256: e2ca8228625bf4f77471a81acf2aa6585b9c92a89ab8718ce9e6669eda195ec1
      base_sha: 28666c8470899143706b70b00e42faa5b0411bc9
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: 'test: recover M4 CP3 baseline authority coverage'
      retention_days: 14
    secrets: inherit
