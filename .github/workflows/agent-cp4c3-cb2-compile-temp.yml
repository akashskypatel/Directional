name: Agent CP4c3 CB2 Compile

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/cp4c3-cb2-compile/run.txt

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: write

concurrency:
  group: agent-cp4c3-cb2-compile
  cancel-in-progress: false

jobs:
  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: cp4c3-cb2-compile
      commit_run_file: false
    secrets: inherit

  validate_caller:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/agent-cp4c3-cb2-compile-temp.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  compile:
    needs: validate_caller
    if: ${{ needs.validate_caller.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-compile-reusable.yml
    with:
      source_sha: 4250f1bf87f2aca21a8a72bdf20d2b5d47b9a719
      artifact_prefix: m3-cp4c3-cb2
    secrets: inherit
