name: m1a-authority-kernel-code-build

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - '.agents/connector-triggers/m1a-authority-kernel-code-build'

permissions:
  contents: read
  actions: read

concurrency:
  group: m1a-authority-kernel-code-build-${{ github.ref }}
  cancel-in-progress: false

env:
  LOG_DIR: /tmp/m1a-authority-kernel-code-build-logs
  ACTIVITY_LOG: /tmp/m1a-authority-kernel-code-build-logs/activity.log
  ENTERING_BRANCH_HEAD: 9f1d3ebd91403252e990f785c3521588197b4fd4
  IMPLEMENTATION_COMMIT: 8cd2e73fabf9ecbb9b771fb29db91973e1dca3a7
  ACCEPTED_T1_ARTIFACT: '9041289209'

jobs:
  code-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Initialize unconditional activity log
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$LOG_DIR"
          finish() {
            rc=$?
            trap - EXIT
            {
              echo "step=initialize"
              echo "exit_code=$rc"
              echo "finished_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            } >> "$ACTIVITY_LOG"
            exit "$rc"
          }
          trap finish EXIT
          {
            echo "turn=M1a Authority Kernel Core Code+Build"
            echo "run_id=$GITHUB_RUN_ID"
            echo "run_attempt=$GITHUB_RUN_ATTEMPT"
            echo "event=$GITHUB_EVENT_NAME"
            echo "event_sha=$GITHUB_SHA"
            echo "event_ref=$GITHUB_REF"
            echo "repository=$GITHUB_REPOSITORY"
            echo "runner_os=$RUNNER_OS"
            echo "implementation_commit=$IMPLEMENTATION_COMMIT"
            echo "entering_branch_head=$ENTERING_BRANCH_HEAD"
            echo "accepted_t1_artifact=$ACCEPTED_T1_ARTIFACT"
            echo "runtimeExecution=false"
            echo "reviewPolicy=never"
            echo "allowed=static source verification, configure, compile/link approved targets, static test-name manifests, immutable packaging/checksum"
            echo "prohibited=generated Directional binary execution, gtest discovery/tests, benchmarks, ctest, CLI/GUI/help/version, fuzzers, custom input"
            echo "started_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } | tee "$ACTIVITY_LOG"

      - name: Checkout exact working branch
        uses: actions/checkout@v4
        with:
          ref: agent/surface_cell_quad/p5-recover-bridge-healing
          fetch-depth: 80
          submodules: false

      - name: Verify exact M1a implementation boundary
        shell: bash
        run: |
          set -Eeuo pipefail
          exec > >(tee -a "$ACTIVITY_LOG") 2>&1
          finish() {
            rc=$?
            trap - EXIT
            echo "step=verify-source exit_code=$rc finished_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            exit "$rc"
          }
          trap finish EXIT

          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$ENTERING_BRANCH_HEAD" "$IMPLEMENTATION_COMMIT"
          git merge-base --is-ancestor "$IMPLEMENTATION_COMMIT" "$GITHUB_SHA"
          test -z "$(git status --porcelain=v1)"

          mapfile -t changed < <(git diff --name-only "$ENTERING_BRANCH_HEAD" "$IMPLEMENTATION_COMMIT" | LC_ALL=C sort)
          expected_changed=(
            cmake/DirectionalTests.cmake
            include/directional/authority/AuthorityIds.h
            include/directional/authority/CanonicalRoute.h
            include/directional/authority/GridAutomorphism.h
            include/directional/authority/LegacyAuthorityAdapters.h
            include/directional/authority/SourceSupport.h
            src/authority/AuthorityKernel.cpp
            tests/SurfaceCellAuthorityKernelTests.cpp
          )
          printf 'implementation_changed=%s\n' "${changed[*]}"
          test "${#changed[@]}" -eq "${#expected_changed[@]}"
          for i in "${!expected_changed[@]}"; do
            test "${changed[$i]}" = "${expected_changed[$i]}"
          done

          mapfile -t overlay < <(git diff --name-only "$IMPLEMENTATION_COMMIT" "$GITHUB_SHA" | LC_ALL=C sort)
          expected_overlay=(
            .agents/connector-triggers/m1a-authority-kernel-code-build
            .github/workflows/m1a-authority-kernel-code-build.yml
          )
          printf 'event_overlay=%s\n' "${overlay[*]}"
          test "${#overlay[@]}" -eq "${#expected_overlay[@]}"
          for i in "${!expected_overlay[@]}"; do
            test "${overlay[$i]}" = "${expected_overlay[$i]}"
          done

          # Production behavior authority remains byte-identical across M1a.
          git diff --quiet "$ENTERING_BRANCH_HEAD" "$IMPLEMENTATION_COMMIT" -- \
            CMakeLists.txt \
            include/directional/geometry \
            include/directional/pipeline \
            include/directional/validation \
            src/geometry \
            src/meshing \
            src/pipeline \
            src/validation \
            src/bench \
            benchmarks/fixtures \
            tests/SurfaceCellDesignAcceptanceTests.cpp \
            tests/SurfaceCellProductOracleTests.cpp \
            tests/support/SurfaceCellProductOracle.cpp \
            tests/support/SurfaceCellProductOracle.h

          test "$(grep -c '^TEST(SurfaceCellAuthorityKernel,' tests/SurfaceCellAuthorityKernelTests.cpp)" -eq 14
          test "$(grep -c '^TEST(' tests/SurfaceCellProductOracleTests.cpp)" -eq 29
          grep -q 'contract-required;authority-kernel' cmake/DirectionalTests.cmake
          grep -q 'contract-required;oracle-mutation' cmake/DirectionalTests.cmake
          grep -q 'src/authority/AuthorityKernel.cpp' cmake/DirectionalTests.cmake
          ! grep -RIn --include='*.h' --include='*.cpp' \
            'SourceAuthoritativeMeshValidator\|evaluate_benchmark_quality\|benchmark_output_semantic_hash\|benchmark_output_structural_hash' \
            include/directional/authority src/authority tests/SurfaceCellAuthorityKernelTests.cpp

          {
            echo "implementation_commit=$IMPLEMENTATION_COMMIT"
            echo "event_commit=$GITHUB_SHA"
            echo "runtimeExecution=false"
            echo "authority_test_count=14"
            echo "oracle_test_count=29"
          } > "$LOG_DIR/static-authority.txt"

      - name: Install compile prerequisites
        shell: bash
        run: |
          set -Eeuo pipefail
          exec > >(tee -a "$ACTIVITY_LOG") 2>&1
          finish() {
            rc=$?
            trap - EXIT
            echo "step=install-prerequisites exit_code=$rc finished_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            exit "$rc"
          }
          trap finish EXIT
          sudo apt-get update
          sudo apt-get install -y ninja-build libgmp-dev xz-utils time

      - name: Fetch shallow submodules
        shell: bash
        run: |
          set -Eeuo pipefail
          exec > >(tee -a "$ACTIVITY_LOG") 2>&1
          finish() {
            rc=$?
            trap - EXIT
            echo "step=fetch-submodules exit_code=$rc finished_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            exit "$rc"
          }
          trap finish EXIT
          git submodule sync --recursive
          git -c protocol.version=2 submodule update --init --recursive --depth 1 --recommend-shallow
          git submodule status --recursive | tee "$LOG_DIR/submodules.txt"

      - name: Configure Release static compile-only build
        shell: bash
        run: |
          set -Eeuo pipefail
          exec > >(tee -a "$ACTIVITY_LOG") 2>&1
          finish() {
            rc=$?
            trap - EXIT
            echo "step=configure exit_code=$rc finished_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            exit "$rc"
          }
          trap finish EXIT
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DDIRECTIONAL_ENABLE_GMP=ON \
            -DDIRECTIONAL_ENABLE_PARDISO=OFF \
            -DDIRECTIONAL_ENABLE_CUDSS=OFF \
            -DDIRECTIONAL_ENABLE_SUITESPARSE=OFF \
            -DDIRECTIONAL_BUILD_TESTS=ON \
            -DDIRECTIONAL_BUILD_BENCHMARKS=ON \
            -DDIRECTIONAL_BUILD_CLI=OFF \
            -DDIRECTIONAL_BUILD_GUI=OFF \
            -DBUILD_PYTHON=OFF \
            -DBUILD_TUTORIALS=OFF \
            -DCMAKE_GTEST_DISCOVER_TESTS_DISCOVERY_MODE=PRE_TEST \
            2>&1 | tee "$LOG_DIR/configure.log"

      - name: Compile approved targets only
        shell: bash
        run: |
          set -Eeuo pipefail
          exec > >(tee -a "$ACTIVITY_LOG") 2>&1
          finish() {
            rc=$?
            trap - EXIT
            echo "step=compile exit_code=$rc finished_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            exit "$rc"
          }
          trap finish EXIT
          /usr/bin/time -v -o "$LOG_DIR/build-resources.txt" \
            cmake --build build --parallel 2 --target \
              directional_core \
              directional_pipeline \
              directional_compiled_api_tests \
              directional_surface_cell_producer_tests \
              directional_surface_cell_oracle_tests \
              directional_surface_cell_authority_kernel_tests \
              directional_surface_cell_completion_tests \
              directional_surface_cell_validation_tests \
              directional_benchmarks \
            2>&1 | tee "$LOG_DIR/build.log"

      - name: Package immutable compile artifact
        shell: bash
        run: |
          set -Eeuo pipefail
          exec > >(tee -a "$ACTIVITY_LOG") 2>&1
          finish() {
            rc=$?
            trap - EXIT
            echo "step=package exit_code=$rc finished_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            exit "$rc"
          }
          trap finish EXIT

          pkg="$RUNNER_TEMP/m1a-authority-kernel-code-build"
          rm -rf "$pkg"
          mkdir -p "$pkg/bin" "$pkg/lib" "$pkg/logs" "$pkg/metadata" "$pkg/source" "$pkg/test-data/benchmarks"

          for exe in \
            directional_compiled_api_tests \
            directional_surface_cell_producer_tests \
            directional_surface_cell_oracle_tests \
            directional_surface_cell_authority_kernel_tests \
            directional_surface_cell_completion_tests \
            directional_surface_cell_validation_tests \
            directional_benchmarks; do
            test -x "build/$exe"
            cp "build/$exe" "$pkg/bin/$exe"
          done
          cp build/libdirectional_core.a "$pkg/lib/"
          cp build/libdirectional_pipeline.a "$pkg/lib/"
          cp -a benchmarks/fixtures "$pkg/test-data/benchmarks/fixtures"
          cp "$LOG_DIR"/* "$pkg/logs/"
          cp build/compile_commands.json "$pkg/source/compile_commands.json"

          git diff --binary "$ENTERING_BRANCH_HEAD" "$IMPLEMENTATION_COMMIT" > "$pkg/source/m1a-authority-kernel.patch"
          git archive --format=tar "$IMPLEMENTATION_COMMIT" | xz -T0 -6 > "$pkg/source/directional-m1a-authority-kernel-source-no-deps.tar.xz"

          python3 - <<'PY' > "$pkg/metadata/authority-kernel-test-names.txt"
          import pathlib, re
          text = pathlib.Path('tests/SurfaceCellAuthorityKernelTests.cpp').read_text()
          names = [f'{a.strip()}.{b.strip()}' for a,b in re.findall(r'TEST\(\s*([^,]+),\s*([^)]+)\)', text)]
          if len(names) != 14 or len(set(names)) != 14:
              raise SystemExit(f'authority test manifest count mismatch: {len(names)}')
          print('\n'.join(names))
          PY

          python3 - <<'PY' > "$pkg/metadata/oracle-test-names.txt"
          import pathlib, re
          text = pathlib.Path('tests/SurfaceCellProductOracleTests.cpp').read_text()
          names = [f'{a.strip()}.{b.strip()}' for a,b in re.findall(r'TEST\(\s*([^,]+),\s*([^)]+)\)', text)]
          if len(names) != 29 or len(set(names)) != 29:
              raise SystemExit(f'oracle test manifest count mismatch: {len(names)}')
          print('\n'.join(names))
          PY

          cat > "$pkg/metadata/build-authority.json" <<EOF
          {
            "turn": "M1a Authority Kernel Core Code+Build",
            "enteringBranchHead": "$ENTERING_BRANCH_HEAD",
            "implementationCommit": "$IMPLEMENTATION_COMMIT",
            "buildEventCommit": "$GITHUB_SHA",
            "workflowRun": "$GITHUB_RUN_ID",
            "workflowAttempt": "$GITHUB_RUN_ATTEMPT",
            "configuration": "Release/static/Ninja",
            "gtestDiscoveryMode": "PRE_TEST",
            "runtimeExecution": false,
            "authorityKernelStaticTestCount": 14,
            "oracleStaticTestCount": 29,
            "acceptedT1Artifact": "$ACCEPTED_T1_ARTIFACT"
          }
          EOF

          cat > "$pkg/metadata/command-boundary.txt" <<EOF
          runtimeExecution=false
          configured=true
          compiled=true
          generatedDirectionalBinaryExecuted=false
          gtestDiscoveryExecuted=false
          testExecuted=false
          benchmarkExecuted=false
          ctestExecuted=false
          cliGuiHelpVersionExecuted=false
          fuzzerExecuted=false
          customInputExecuted=false
          EOF

          {
            echo "implementation_commit=$IMPLEMENTATION_COMMIT"
            echo "build_event_commit=$GITHUB_SHA"
            echo "entering_branch_head=$ENTERING_BRANCH_HEAD"
            echo "cmake_blob=$(git rev-parse "$IMPLEMENTATION_COMMIT:cmake/DirectionalTests.cmake")"
            echo "authority_ids_blob=$(git rev-parse "$IMPLEMENTATION_COMMIT:include/directional/authority/AuthorityIds.h")"
            echo "source_support_blob=$(git rev-parse "$IMPLEMENTATION_COMMIT:include/directional/authority/SourceSupport.h")"
            echo "grid_automorphism_blob=$(git rev-parse "$IMPLEMENTATION_COMMIT:include/directional/authority/GridAutomorphism.h")"
            echo "canonical_route_blob=$(git rev-parse "$IMPLEMENTATION_COMMIT:include/directional/authority/CanonicalRoute.h")"
            echo "legacy_adapters_blob=$(git rev-parse "$IMPLEMENTATION_COMMIT:include/directional/authority/LegacyAuthorityAdapters.h")"
            echo "authority_cpp_blob=$(git rev-parse "$IMPLEMENTATION_COMMIT:src/authority/AuthorityKernel.cpp")"
            echo "authority_tests_blob=$(git rev-parse "$IMPLEMENTATION_COMMIT:tests/SurfaceCellAuthorityKernelTests.cpp")"
            echo "t1_oracle_tests_blob=$(git rev-parse "$IMPLEMENTATION_COMMIT:tests/SurfaceCellProductOracleTests.cpp")"
            echo "t1_oracle_support_cpp_blob=$(git rev-parse "$IMPLEMENTATION_COMMIT:tests/support/SurfaceCellProductOracle.cpp")"
            echo "t1_direct_acceptance_blob=$(git rev-parse "$IMPLEMENTATION_COMMIT:tests/SurfaceCellDesignAcceptanceTests.cpp")"
          } > "$pkg/metadata/source-blobs.txt"

          git submodule status --recursive > "$pkg/metadata/submodules.txt"
          {
            cmake --version | head -1
            ninja --version
            c++ --version | head -1
            uname -a
          } > "$pkg/metadata/toolchain.txt"
          find benchmarks/fixtures -type f -printf '%P\n' | LC_ALL=C sort > "$pkg/metadata/fixture-files.txt"

          find "$pkg" -type f ! -name SHA256SUMS -print0 | LC_ALL=C sort -z | \
            while IFS= read -r -d '' f; do
              rel="${f#"$pkg"/}"
              sum=$(sha256sum "$f" | awk '{print $1}')
              printf '%s  %s\n' "$sum" "$rel"
            done > "$pkg/SHA256SUMS"

          echo "manifest_entries=$(wc -l < "$pkg/SHA256SUMS")"
          sha256sum "$pkg/SHA256SUMS"
          find "$pkg" -type f | wc -l
          file "$pkg/bin/"* "$pkg/lib/"*

      - name: Upload immutable compile artifact
        uses: actions/upload-artifact@v4
        with:
          name: m1a-authority-kernel-code-build
          path: ${{ runner.temp }}/m1a-authority-kernel-code-build
          if-no-files-found: error
          retention-days: 14

      - name: Upload detailed activity log always
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m1a-authority-kernel-code-build-logs
          path: /tmp/m1a-authority-kernel-code-build-logs
          if-no-files-found: error
          retention-days: 14
