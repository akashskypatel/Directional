name: Agent M3 CP4c-0b T5 Schema Validate

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m3-cp4c0b-t5-schema-validate/run.txt

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: agent-m3-cp4c0b-t5-schema-validate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m3-cp4c0b-t5-schema-validate
      commit_run_file: false
    secrets: inherit

  validate-self-draft:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .agents/Directional/turn-payloads/m3-cp4c0b-t5-schema-validate.yml
      retention_days: 7
    secrets: inherit

  validate-exec-draft:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .agents/Directional/turn-payloads/m3-cp4c0b-t5-exec.yml
      retention_days: 7
    secrets: inherit
