name: Agent Source Snapshot Resume 20260906

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/source-snapshot/cb41-exact-20260907-1040.txt

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: agent-source-snapshot-cb41-exact-20260907
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/agent-source-snapshot-resume-20260906.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  snapshot:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-source-snapshot.yml
    with:
      source_ref: f0c56e4e6f6c33d2e266e575234d57b569562719
      artifact_prefix: cb41-exact-source-snapshot
      retention_days: 7
    secrets: inherit

  observe:
    needs: snapshot
    if: ${{ always() }}
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: source-snapshot-cb41-exact-20260907
      commit_run_file: false
      trim_stale_comments: false
    secrets: inherit
