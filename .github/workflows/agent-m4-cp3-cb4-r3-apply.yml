name: Agent M4 CP3 CB4 R3 Apply

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m4-cp3-cb4-r3-apply.txt

permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

concurrency:
  group: agent-m4-cp3-cb4-r3-apply
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/agent-m4-cp3-cb4-r3-apply.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m4-cp3-cb4-r3-apply
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  apply:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1FHW7wQhPU35iy_DFLunIQK4OtIX6KZ8R
      patch_sha256: '5fe9f584c081d461d5c8a93569d97147b9c36480b60ee9c300410a03d3eafb38'
      base_sha: 463bcb9ab35f7b9941e03199c8ca0818b20db84c
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: 'fix: remap terminal contact barycentrics for vertex-ray ranking'
    secrets: inherit
