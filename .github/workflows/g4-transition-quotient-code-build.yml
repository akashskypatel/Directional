name: g4-transition-quotient-code-build

on:
  push:
    paths:
      - '.agents/connector-triggers/g4-transition-quotient-code-build'

permissions:
  contents: write
  actions: read

concurrency:
  group: g4-transition-quotient-code-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  code-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      LOG_DIR: /tmp/g4-transition-quotient-logs
    steps:
      - name: Initialize unconditional activity log
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$LOG_DIR"
          {
            echo "turn=G4 transition-quotient materialization Code+Build"
            echo "event_sha=$GITHUB_SHA"
            echo "event_ref=$GITHUB_REF"
            echo "entering_reviewed_artifact=9022061741"
            echo "entering_branch_head=33a2d09f457e48471dcd3df81735a43d32d97d23"
            echo "runtimeExecution=false"
            echo "reviewPolicy=never"
            echo "transport=four verified raw unified-patch parts"
            echo "allowed=verify/apply source patch, commit/push exact source, configure, compile/link seven approved targets, package/checksum"
            echo "prohibited=tests, benchmarks, generated Directional binaries, ctest/discovery, CLI, GUI, help/list/custom-input execution"
          } | tee "$LOG_DIR/activity.log"

      - name: Checkout exact working branch
        uses: actions/checkout@v4
        with:
          ref: agent/surface_cell_quad/p5-recover-bridge-healing
          fetch-depth: 50
          submodules: false

      - name: Verify and apply transition-quotient patch
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee -a "$LOG_DIR/activity.log") 2>&1
          echo "checkout_sha=$(git rev-parse HEAD)"
          git status --short

          raw_parts=(
            .agents/Directional/turn-payloads/g4-transition-quotient.raw.part00.patch
            .agents/Directional/turn-payloads/g4-transition-quotient.raw.part01.patch
            .agents/Directional/turn-payloads/g4-transition-quotient.raw.part02.patch
            .agents/Directional/turn-payloads/g4-transition-quotient.raw.part03.patch
          )
          expected_blobs=(
            608d1b954553f0cd4164cd9691b505cdf2f93390
            9adb075b147a8afc783f527777a564aad32882c5
            b73d99031e0ea2455def74f3321ddf6654d6fde7
            a140de0b7508a131a29e6ad3a34e4021c2a7c614
          )
          expected_sha256=(
            591db9a604a03b5b8028c9646abf228f084770c04443f3a3c6dc4d93b686aaeb
            b183596a9094fa25d061c3fe24bdbeb835dccff57e8576940d45ac3a444ff967
            7898064321e32a2a7f8235dc6a363943555202fed24705feda1ec16a4db767ac
            958c67791a293198a5212d0409425ba2af40130ce7f14059b172016644103519
          )
          for i in "${!raw_parts[@]}"; do
            part="${raw_parts[$i]}"
            test -f "$part"
            actual_blob=$(git hash-object "$part")
            actual_sha=$(sha256sum "$part" | awk '{print $1}')
            echo "part[$i]=$part blob=$actual_blob sha256=$actual_sha"
            test "$actual_blob" = "${expected_blobs[$i]}"
            test "$actual_sha" = "${expected_sha256[$i]}"
          done

          check_blob() {
            local path="$1" expected="$2"
            local actual
            actual=$(git hash-object "$path")
            echo "input_blob $path=$actual"
            test "$actual" = "$expected"
          }
          check_blob include/directional/diagnostics/RemeshDiagnostics.h ba33d8396bd26f8190f8d552aafd9c950e9a3842
          check_blob include/directional/geometry/PureQuadCompletion.h b69e5aa90873c9582554a11bdefcb908766fb84a
          check_blob include/directional/geometry/SurfaceCellTracing.h e966a9ab9dc33f23de9cecb3fd9b61ddd75fde7f
          check_blob include/directional/pipeline/RemeshPipeline.h 26022688cec17e064e862a672123ded1e6a558b0
          check_blob src/bench/BenchmarkQuality.cpp 224280310bddc96f80672d3e8a3e98888f584400
          check_blob src/bench/BenchmarkQuality.h 9f773f83e2dda7f7afa4f63ba0f4369cef24a909
          check_blob src/bench/DirectionalBenchmark.cpp ba3eb47bfe9f3f78ce1dcbab32bfb3a773658cfc
          check_blob src/geometry/SurfaceCellTracing.cpp b3f0ea3b82cf64f3a2ba312f9622172c64bc3e83
          check_blob src/pipeline/RemeshPipeline.cpp 97a20e41338b616d6bb5cafaa5f3d3851c52c583
          check_blob tests/MilestoneGP27Tests.cpp f55062b48b2c75e02ff7e3788558ad27bf113f93
          check_blob tests/SurfaceCellsPhase10Tests.cpp 441ba7fe2066355ce2a2239380f45029ea139346

          cat "${raw_parts[@]}" > /tmp/g4-transition-quotient.patch
          PATCH_SHA256=$(sha256sum /tmp/g4-transition-quotient.patch | awk '{print $1}')
          echo "patch_sha256=$PATCH_SHA256"
          test "$PATCH_SHA256" = "bf297294431183f9eda53d80b8ce174c33471fd96f2a9ccb446beba407915172"
          if grep -q '^+++ b/.github/workflows/' /tmp/g4-transition-quotient.patch; then
            echo "patch attempts to modify workflow files" >&2
            exit 1
          fi

          git apply --check /tmp/g4-transition-quotient.patch
          git apply /tmp/g4-transition-quotient.patch
          git diff --check
          mapfile -t changed < <(git diff --name-only | sort)
          printf 'changed=%s\n' "${changed[*]}"
          test "${#changed[@]}" -eq 11
          expected_changed=(
            include/directional/diagnostics/RemeshDiagnostics.h
            include/directional/geometry/PureQuadCompletion.h
            include/directional/geometry/SurfaceCellTracing.h
            include/directional/pipeline/RemeshPipeline.h
            src/bench/BenchmarkQuality.cpp
            src/bench/BenchmarkQuality.h
            src/bench/DirectionalBenchmark.cpp
            src/geometry/SurfaceCellTracing.cpp
            src/pipeline/RemeshPipeline.cpp
            tests/MilestoneGP27Tests.cpp
            tests/SurfaceCellsPhase10Tests.cpp
          )
          for i in "${!expected_changed[@]}"; do
            test "${changed[$i]}" = "${expected_changed[$i]}"
          done

          check_output_blob() {
            local path="$1" expected="$2"
            local actual
            actual=$(git hash-object "$path")
            echo "output_blob $path=$actual"
            test "$actual" = "$expected"
          }
          check_output_blob include/directional/diagnostics/RemeshDiagnostics.h aa4d4d6f88233179943110f444827802fbaa376d
          check_output_blob include/directional/geometry/PureQuadCompletion.h 33544710da7855249ebad98451ec527273c63c72
          check_output_blob include/directional/geometry/SurfaceCellTracing.h 9db8d397bc69bd19773be2e6a63265c5d7e85048
          check_output_blob include/directional/pipeline/RemeshPipeline.h 7af540b2fc97e1ebcb504c0623b913b72466ddf4
          check_output_blob src/bench/BenchmarkQuality.cpp c26650ec81e764f24d30f3b1ac791c3a05c4fbf7
          check_output_blob src/bench/BenchmarkQuality.h 39beaa8b0e3ee17a4696c12de5af0a4be0b85045
          check_output_blob src/bench/DirectionalBenchmark.cpp 29ab26405c1a361e23a7ab5422b3b25820435f39
          check_output_blob src/geometry/SurfaceCellTracing.cpp 1c1677cefe1fb6ee85f3edcd838175271ab6313c
          check_output_blob src/pipeline/RemeshPipeline.cpp 682580d3655fa3777099fd9aff494fc74b605c0e
          check_output_blob tests/MilestoneGP27Tests.cpp 82b53ddd06b68b4b12a622b513ac38470b4e1513
          check_output_blob tests/SurfaceCellsPhase10Tests.cpp 8d60fe2a3da619a5ea5dc7c36e17c9af3d53f543

          git config user.name 'directional-agent'
          git config user.email 'directional-agent@users.noreply.github.com'
          git add "${expected_changed[@]}"
          git commit -m 'feat(surface-cells): materialize explicit front quotient'
          IMPLEMENTATION_COMMIT=$(git rev-parse HEAD)
          echo "IMPLEMENTATION_COMMIT=$IMPLEMENTATION_COMMIT" >> "$GITHUB_ENV"
          echo "PATCH_SHA256=$PATCH_SHA256" >> "$GITHUB_ENV"
          echo "implementation_commit=$IMPLEMENTATION_COMMIT"

          git rm "${raw_parts[@]}"
          git commit -m 'chore(agent): remove transition-quotient payloads'
          BUILD_COMMIT=$(git rev-parse HEAD)
          echo "BUILD_COMMIT=$BUILD_COMMIT" >> "$GITHUB_ENV"
          echo "build_commit=$BUILD_COMMIT"
          git push origin HEAD:agent/surface_cell_quad/p5-recover-bridge-healing
          test "$(git rev-parse HEAD)" = "$BUILD_COMMIT"
          git status --short

      - name: Install compile prerequisites
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee -a "$LOG_DIR/activity.log") 2>&1
          sudo apt-get update
          sudo apt-get install -y ninja-build libgmp-dev xz-utils

      - name: Fetch shallow submodules
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee -a "$LOG_DIR/activity.log") 2>&1
          git submodule update --init --depth 1
          git submodule status | tee "$LOG_DIR/submodules.txt"

      - name: Configure Release static compile-only build
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee -a "$LOG_DIR/activity.log") 2>&1
          {
            echo "implementation_commit=$IMPLEMENTATION_COMMIT"
            echo "build_commit=$BUILD_COMMIT"
            echo "compile_head=$(git rev-parse HEAD)"
            cmake --version
            c++ --version
            ninja --version
          } | tee "$LOG_DIR/toolchain.txt"
          test "$(git rev-parse HEAD)" = "$BUILD_COMMIT"
          cmake -S . -B agent-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DCMAKE_GTEST_DISCOVER_TESTS_DISCOVERY_MODE=PRE_TEST \
            -DBUILD_SHARED_LIBS=OFF \
            -DBUILD_TUTORIALS=OFF \
            -DBUILD_PYTHON=OFF \
            -DDIRECTIONAL_BUILD_CLI=OFF \
            -DDIRECTIONAL_BUILD_GUI=OFF \
            -DDIRECTIONAL_BUILD_BENCHMARKS=ON \
            -DDIRECTIONAL_BUILD_TESTS=ON \
            -DDIRECTIONAL_BUILD_HISTORICAL_TESTS=OFF \
            -DDIRECTIONAL_BUILD_LEGACY_INTEGRATION_TESTS=OFF \
            -DDIRECTIONAL_BUILD_OPTIONAL_GUIDANCE_TESTS=OFF \
            -DDIRECTIONAL_ENABLE_GMP=ON \
            -DDIRECTIONAL_ENABLE_PARDISO=OFF \
            -DDIRECTIONAL_ENABLE_CUDSS=OFF \
            -DDIRECTIONAL_ENABLE_SUITESPARSE=OFF \
            2>&1 | tee "$LOG_DIR/configure.log"

      - name: Compile seven approved targets only
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee -a "$LOG_DIR/activity.log") 2>&1
          test "$(git rev-parse HEAD)" = "$BUILD_COMMIT"
          cmake --build agent-build --parallel 2 --target \
            directional_core \
            directional_pipeline \
            directional_compiled_api_tests \
            directional_surface_cell_producer_tests \
            directional_surface_cell_completion_tests \
            directional_surface_cell_validation_tests \
            directional_benchmarks \
            2>&1 | tee "$LOG_DIR/build.log"
          echo "compile_only_gate=passed" | tee -a "$LOG_DIR/activity.log"
          echo "runtimeExecution=false" | tee -a "$LOG_DIR/activity.log"
          echo "final_source_status_begin" | tee -a "$LOG_DIR/activity.log"
          git status --short | tee -a "$LOG_DIR/activity.log"
          echo "final_source_status_end" | tee -a "$LOG_DIR/activity.log"

      - name: Package immutable compile artifact
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee -a "$LOG_DIR/activity.log") 2>&1
          root="$GITHUB_WORKSPACE/g4-transition-quotient-code-build-artifact"
          rm -rf "$root"
          mkdir -p "$root"/{bin,lib,test-data/benchmarks,logs,metadata,source}
          cp agent-build/directional_benchmarks "$root/bin/"
          cp agent-build/directional_compiled_api_tests "$root/bin/"
          cp agent-build/directional_surface_cell_producer_tests "$root/bin/"
          cp agent-build/directional_surface_cell_completion_tests "$root/bin/"
          cp agent-build/directional_surface_cell_validation_tests "$root/bin/"
          cp agent-build/libdirectional_core.a "$root/lib/"
          cp agent-build/libdirectional_pipeline.a "$root/lib/"
          cp -a benchmarks/fixtures "$root/test-data/benchmarks/"
          cp "$LOG_DIR/activity.log" "$LOG_DIR/configure.log" \
             "$LOG_DIR/build.log" "$LOG_DIR/toolchain.txt" \
             "$LOG_DIR/submodules.txt" "$root/logs/"
          cp agent-build/compile_commands.json "$root/source/"

          changed_paths=(
            include/directional/diagnostics/RemeshDiagnostics.h
            include/directional/geometry/PureQuadCompletion.h
            include/directional/geometry/SurfaceCellTracing.h
            include/directional/pipeline/RemeshPipeline.h
            src/bench/BenchmarkQuality.cpp
            src/bench/BenchmarkQuality.h
            src/bench/DirectionalBenchmark.cpp
            src/geometry/SurfaceCellTracing.cpp
            src/pipeline/RemeshPipeline.cpp
            tests/MilestoneGP27Tests.cpp
            tests/SurfaceCellsPhase10Tests.cpp
          )
          git show "$IMPLEMENTATION_COMMIT" --format=fuller --stat --patch -- \
            "${changed_paths[@]}" > "$root/source/g4-transition-quotient.patch"
          tar --exclude=.git --exclude=external --exclude=agent-build \
              --exclude=g4-transition-quotient-code-build-artifact \
              --exclude=.github/workflows/g4-transition-quotient-code-build.yml \
              --exclude=.agents/connector-triggers/g4-transition-quotient-code-build \
              -cJf "$root/source/directional-g4-transition-quotient-source-no-deps.tar.xz" .

          cat > "$root/metadata/source-authority.json" <<EOF
          {
            "eventCommit": "$GITHUB_SHA",
            "implementationCommit": "$IMPLEMENTATION_COMMIT",
            "buildCommit": "$BUILD_COMMIT",
            "enteringReviewedArtifact": 9022061741,
            "enteringBranchHead": "33a2d09f457e48471dcd3df81735a43d32d97d23",
            "decodedPatchSha256": "$PATCH_SHA256",
            "runtimeExecution": false,
            "reviewPolicy": "never"
          }
          EOF
          cat > "$root/metadata/build-authority.json" <<'EOF'
          {"configuration":"Release","generator":"Ninja","buildSharedLibs":false,"gtestDiscoveryMode":"PRE_TEST","approvedTargets":7,"runtimeExecution":false}
          EOF
          cat > "$root/metadata/command-boundary.txt" <<'EOF'
          G4 transition-quotient Code + Build only.
          Executed: verified source/test/diagnostic patch application, exact source commit/push, configure, compile/link seven approved targets, package/checksum.
          Not executed: generated Directional binaries, tests, benchmarks, ctest/discovery, CLI, GUI, help/list/custom-input commands.
          EOF
          git ls-tree -r "$IMPLEMENTATION_COMMIT" -- "${changed_paths[@]}" \
            > "$root/metadata/final-blobs.txt"
          git submodule status > "$root/metadata/submodules.txt"
          find benchmarks/fixtures -type f | sort > "$root/metadata/fixture-files.txt"
          (cd "$root" && find . -type f ! -name SHA256SUMS -print0 | sort -z | \
            xargs -0 sha256sum > SHA256SUMS)
          sha256sum "$root/SHA256SUMS" | tee "$LOG_DIR/artifact-checksum.txt"

      - name: Upload immutable compile artifact
        uses: actions/upload-artifact@v4
        with:
          name: g4-transition-quotient-code-build
          path: g4-transition-quotient-code-build-artifact
          if-no-files-found: error
          retention-days: 14

      - name: Upload detailed activity log always
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g4-transition-quotient-code-build-logs
          path: /tmp/g4-transition-quotient-logs
          if-no-files-found: error
          retention-days: 14
