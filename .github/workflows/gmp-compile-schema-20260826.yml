name: Validate GMP Compile Workflow Draft

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/gmp-compile-schema-20260826.txt

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: gmp-compile-schema-20260826
  cancel-in-progress: false

jobs:
  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: gmp-compile-schema
      commit_run_file: false
    secrets: inherit

  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/agent-compile-reusable.yml
    secrets: inherit
