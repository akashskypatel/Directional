name: CB34 WIP Patch Apply

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/google-drive/m3-cp4c3-cb34-wip.txt

permissions:
  contents: write
  id-token: write

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/agent-cb34-wip-apply.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  apply:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1bVcrfc-nHoiSN_y2qkqegJlGLyusba3G
      patch_sha256: d0542df1761a04f6271f6057fcfeeb35c24f03ecd9d2adc1107ad58949c2aa77
      base_sha: b1276f36004b1e6676cbdf46763626b7ba3ce4a7
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: "wip: preserve CB34 separating-arc correction"
      retention_days: 14
    secrets: inherit
