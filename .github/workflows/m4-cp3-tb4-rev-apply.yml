name: M4 CP3 TB4 Review Apply

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m4-cp3-tb4-rev-apply-20260912.txt

permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

concurrency:
  group: m4-cp3-tb4-rev-apply
  cancel-in-progress: false

jobs:
  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m4-cp3-tb4-rev-apply
      commit_run_file: false
    secrets: inherit

  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/m4-cp3-tb4-rev-apply.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  apply:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1Tcch5S5XMPLuvEy7Br0zm98SS43EUDBs
      patch_sha256: '80160d60d39ef8ce5c8cc61a9a32acef2c9b286300ef159c3feb839c532bc170'
      base_sha: dc65e2e5f1383f62e8294ce8561486df4f9d0ab7
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: 'docs: close M4 CP3 TB4 review and freeze CB7'
      retention_days: 7
    secrets: inherit
