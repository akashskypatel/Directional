name: M3 CP4c3 CB50 Drive Apply

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/drive-apply/cb50.txt

permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

concurrency:
  group: m3-cp4c3-cb50-drive-apply
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/agent-cb50-drive-apply.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m3-cp4c3-cb50-drive-apply
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  apply:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1CaN5aA75DAnFDXqUzmDQcLmPUk0TV0h9
      patch_sha256: bd6d5281bb07ac41076d740fe38a0beb8c5243c71f3078752a5317cfa9789b40
      base_sha: 6d3dfd11c5073875494c5431e64f734bf942cb5c
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: 'docs: close CB50 and freeze TB45 artifact-only plan'
      retention_days: 14
    secrets: inherit
