name: Agent M5 CP3 CB9 Drive Apply

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m5-cp3-cb9-drive-apply/run.txt

permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

concurrency:
  group: agent-m5-cp3-cb9-drive-apply
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/agent-m5-cp3-cb9-drive-apply.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m5-cp3-cb9-drive-apply
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  apply:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 164HaSaDqzRpJW8KbPWCi4pY6I2ziRwRz
      patch_sha256: 6c3aadd6e83ba227eeaa0d534b23dfa94eb57d4e07ed47cbdef5c7b0105aa33e
      base_sha: 55adf8d1a8a1ee0b3acd5835efa21c2e06c8a3ef
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: "M5-CP3-CB9: repair produced witness authority"
    secrets: inherit
