name: M3 CP4c0 TB-R3 Workflow Schema Validation
on:
  push:
    branches: [agent/surface_cell_quad/p5-recover-bridge-healing]
    paths: [.agents/connector-triggers/m3-cp4c0-tb-r3-schema.txt]
permissions:
  contents: write
  issues: write
  pull-requests: write
concurrency:
  group: m3-cp4c0-tb-r3-schema-${{ github.ref }}
  cancel-in-progress: false
jobs:
  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m3-cp4c0-tb-r3-schema
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit
  validate-self:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/agent-m3-cp4c0-tb-r3-schema.yml
      source_ref: ${{ github.sha }}
    secrets: inherit
  validate-tb:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/agent-m3-cp4c0-tb-r3.yml
      source_ref: ${{ github.sha }}
    secrets: inherit
  validate-closeout:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/agent-m3-cp4c0-tb-r3-closeout-apply.yml
      source_ref: ${{ github.sha }}
    secrets: inherit
