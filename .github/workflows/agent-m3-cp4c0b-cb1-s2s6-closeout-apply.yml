name: Agent M3 CP4c-0b CB1 S2-S6 Closeout Apply

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m3-cp4c0b-cb1-s2s6-closeout-apply/run.txt

permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/agent-m3-cp4c0b-cb1-s2s6-closeout-apply.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m3-cp4c0b-cb1-s2s6-closeout-apply
      trim_stale_comments: true
    secrets: inherit

  apply:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1O2QdkAj2KSrRKzBdsbEmliFMddFgAUkk
      patch_sha256: d7f342164537cbebd64846d7ed3d8554f001117ca90e53d26ed0c4b1176470a9
      base_sha: fce3fe5624c308bc17aabe2e64dbbaf7547b8305
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: "docs: close out M3-CP4c-0b CB1 S2-S6"
      retention_days: 14
    secrets: inherit
