name: Agent M5 DEFN Patch Apply

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/google-drive/M5-DEFN.txt

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

concurrency:
  group: agent-m5-defn-patch-apply
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/agent-m5-defn-patch-apply.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m5-defn-patch-apply
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  apply:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1m-YYxep86C4Azc-xlJ9dNm5h-6B7t-Lx
      patch_sha256: 87dfda683e2158966284821c2c8e591ca55dfddcfc876ee2234ccef012c682d2
      base_sha: 1cef1133ecfe59eeeee220b37a907301f9315dc7
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: "docs: freeze M5 definitions"
      retention_days: 14
    secrets: inherit
