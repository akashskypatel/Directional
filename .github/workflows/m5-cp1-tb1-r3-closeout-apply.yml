      workflow_path: .github/workflows/m5-cp1-tb1-r3-closeout-apply.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  apply:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1ckQUlcCiZJlTNCFA9RNsRadaFwQy4lFs
      patch_sha256: 9c470ee9a6076ddecf415f08aa443852cbd55d0b446ea590f6600e3052f01420
