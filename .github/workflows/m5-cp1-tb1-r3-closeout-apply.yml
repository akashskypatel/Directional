    paths: [.agents/connector-triggers/m5-cp1-tb1-r3-closeout-apply-20260920.txt]

permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

concurrency:
  group: m5-cp1-tb1-r3-closeout-apply-${{ github.ref }}
  cancel-in-progress: false

jobs:
