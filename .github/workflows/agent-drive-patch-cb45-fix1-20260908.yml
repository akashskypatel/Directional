name: Agent Drive Patch CB45 Fix1 20260908

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/drive-patch/cb45-compile-fix1-20260908.txt

permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

concurrency:
  group: agent-drive-patch-cb45-fix1-20260908
  cancel-in-progress: false

jobs:
  validate-caller:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/agent-drive-patch-cb45-fix1-20260908.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: cb45-drive-patch-fix1
      commit_run_file: false
      trim_stale_comments: false
    secrets: inherit

  apply:
    needs: validate-caller
    if: ${{ needs.validate-caller.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1vVB579C5dOznEZ-bEQZARGpV5sZ_BcUd
      patch_sha256: 3ba3a975c563d9568067b5ea344e7cc3b49033c39f20ae69213a9d4f7e240187
      base_sha: e03c29a42c4528013476292333a84c6af1d6aff4
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: 'M3-CP4c-3-CB45: repair region certificate formatter'
    secrets: inherit
