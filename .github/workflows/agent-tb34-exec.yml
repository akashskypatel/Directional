name: Agent TB34 Artifact-Only EXEC

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/tb34-exec-20260906.txt

permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: agent-tb34-exec
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/agent-tb34-exec.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: tb34-exec
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  execute:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    steps:
      - name: Initialize persistent TB34 log
        shell: bash
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/M3-CP4c-3-TB34-EXEC-workflow.log"
          : > "$log"
          {
            echo "workflow=${GITHUB_WORKFLOW}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "event=${GITHUB_EVENT_NAME}"
            echo "event_sha=${GITHUB_SHA}"
            echo "ref=${GITHUB_REF}"
            echo "repository=${GITHUB_REPOSITORY}"
            echo "runner_os=${RUNNER_OS}"
            echo "turn=M3-CP4c-3-TB34-EXEC"
            echo "artifact_id=9997560649"
            echo "expected_source=7711b9c2c20d284823911aa4ca067bd33244f4e6"
            echo "runtime_boundary=Test+Benchmark-artifact-only"
            echo "benchmark_execution=prohibited"
            echo "started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            uname -a
            python3 --version
            unzip -v | head -n 1
            tar --version | head -n 1
          } | tee -a "$log"

      - name: Materialize and verify packaged harness
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_ARTIFACT_NAME: m3-cp4c3-cb39-result-34061111130
          EXPECTED_PROVIDER_DIGEST: sha256:9a71fe17b789c94f70580116b822b3949dabecda7bf1d736afef10a1e6a9c3d2
          EXPECTED_ZIP_SHA256: 9a71fe17b789c94f70580116b822b3949dabecda7bf1d736afef10a1e6a9c3d2
          EXPECTED_SOURCE_ARCHIVE_SHA256: c0005445a764dda63a2fa2c6c30e512f26aabe84f944f23cde078046b4bf0fc7
          EXPECTED_HARNESS_SHA256: aaadab351c0ba28a39c87aff1948f83ab0c4c71520662177e5cdf6fd08b30ed3
        shell: bash
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/M3-CP4c-3-TB34-EXEC-workflow.log"
          exec > >(tee -a "$log") 2>&1
          trap 'status=$?; echo "bootstrap_exit=${status}"' EXIT
          root="${RUNNER_TEMP}/tb34-bootstrap"
          pkg="${root}/package"
          source="${root}/source"
          zip="${root}/artifact-9997560649.zip"
          rm -rf "$root"
          mkdir -p "$pkg" "$source"
          artifact_json="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9997560649")"
          provider_digest="$(printf '%s' "$artifact_json" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("digest", ""))')"
          artifact_name="$(printf '%s' "$artifact_json" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("name", ""))')"
          test "$provider_digest" = "$EXPECTED_PROVIDER_DIGEST"
          test "$artifact_name" = "$EXPECTED_ARTIFACT_NAME"
          curl -L --fail --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9997560649/zip" \
            -o "$zip"
          printf '%s  %s\n' "$EXPECTED_ZIP_SHA256" "$zip" | sha256sum -c -
          unzip -q "$zip" -d "$pkg"
          (cd "$pkg" && sha256sum -c SHA256SUMS)
          source_archive="$pkg/source/source-7711b9c2c20d284823911aa4ca067bd33244f4e6.tar.gz"
          printf '%s  %s\n' "$EXPECTED_SOURCE_ARCHIVE_SHA256" "$source_archive" | sha256sum -c -
          tar -xzf "$source_archive" -C "$source"
          harness="$source/.agents/Directional/tools/m3_cp4c3_artifact_only_harness.sh"
          printf '%s  %s\n' "$EXPECTED_HARNESS_SHA256" "$harness" | sha256sum -c -
          test "$(stat -c '%a' "$harness")" = 775
          echo "packaged_harness=$harness"
          echo "packaged_harness_sha256=$(sha256sum "$harness" | awk '{print $1}')"

      - name: Execute immutable selector 409 through packaged harness
        env:
          GH_TOKEN: ${{ github.token }}
          TURN_ID: M3-CP4c-3-TB34-EXEC
          ARTIFACT_ID: "9997560649"
          EXPECTED_ARTIFACT_NAME: m3-cp4c3-cb39-result-34061111130
          EXPECTED_PROVIDER_DIGEST: sha256:9a71fe17b789c94f70580116b822b3949dabecda7bf1d736afef10a1e6a9c3d2
          EXPECTED_ZIP_SHA256: 9a71fe17b789c94f70580116b822b3949dabecda7bf1d736afef10a1e6a9c3d2
          EXPECTED_SOURCE_SHA: 7711b9c2c20d284823911aa4ca067bd33244f4e6
          SELECTOR_RELATIVE_PATH: .agents/Directional/Architecture_M3_CP4c3_Required_Green_Selector_409.txt
          EXPECTED_SELECTOR_COUNT: "409"
          EXPECTED_SELECTOR_SHA256: eea6d8c2bbc8e9247deb4bfbbe6763042c76002d1894dd62e35f80262403b53e
          ACCEPTED_PREFIX_COUNT: "365"
        shell: bash
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/M3-CP4c-3-TB34-EXEC-workflow.log"
          exec > >(tee -a "$log") 2>&1
          trap 'status=$?; echo "harness_exit=${status}"' EXIT
          cd "${RUNNER_TEMP}/tb34-bootstrap/source"
          bash .agents/Directional/tools/m3_cp4c3_artifact_only_harness.sh --execute

      - name: Record final workflow source status
        if: always()
        shell: bash
        run: |
          set +e
          log="${RUNNER_TEMP}/M3-CP4c-3-TB34-EXEC-workflow.log"
          {
            echo "final_job_status=${{ job.status }}"
            echo "event_sha=${GITHUB_SHA}"
            echo "runtime_source_sha=7711b9c2c20d284823911aa4ca067bd33244f4e6"
            echo "configure_execution=false"
            echo "compile_execution=false"
            echo "relink_execution=false"
            echo "benchmark_execution=false"
            echo "package_repair=false"
            echo "finished_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } | tee -a "$log"

      - name: Upload TB34 result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-cp4c3-tb34-exec-result-${{ github.run_id }}
          path: ${{ runner.temp }}/M3-CP4c-3-TB34-EXEC-result
          if-no-files-found: error
          retention-days: 14

      - name: Upload persistent TB34 workflow log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-cp4c3-tb34-exec-log-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/M3-CP4c-3-TB34-EXEC.log
            ${{ runner.temp }}/M3-CP4c-3-TB34-EXEC-workflow.log
          if-no-files-found: error
          retention-days: 14
