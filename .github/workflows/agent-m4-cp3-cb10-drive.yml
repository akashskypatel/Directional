name: Agent M4 CP3 CB10 Drive Apply

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/drive/m4-cp3-cb10-code.txt

permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/agent-m4-cp3-cb10-drive.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m4-cp3-cb10-drive
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  apply:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1c3kD1yJizYZDVe54vC1QXmGRssTNGgQ7
      patch_sha256: e70a522016c77fda177d821fd64f8da62ac2f393de88d38d806ed05262e575a9
      base_sha: 5ede97218103bb3e3cdb70a7b36f6c527d134db0
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: "test: restore hard-rail fixture production authority"
    secrets: inherit
