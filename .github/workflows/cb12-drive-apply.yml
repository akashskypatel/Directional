      pr_number: 8
      label: cb12-drive-apply
      commit_run_file: false
      trim_stale_comments: false
    secrets: inherit

  apply:
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1ZXC8qVKXvHRFYbaXjt18rSM8B-b6I255
      patch_sha256: 67049c0d4569c2406bad74ab1861f4b1bbc7d078ab5991e23a083fd69e6dd257
      base_sha: 73dd62c81bd4d13bf0fb9bca2d5682c7157d589e
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: "M3-CP4c-3-CB12: repair BarrierAbsorbed termination ownership"
      retention_days: 14
    secrets: inherit
