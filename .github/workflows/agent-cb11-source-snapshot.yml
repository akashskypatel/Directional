name: M3 CP4c3 CB11 Package 79

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m3-cp4c3-cb11-package79.txt

permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: m3-cp4c3-cb11-package79
  cancel-in-progress: false

jobs:
  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m3-cp4c3-cb11-package79
      commit_run_file: false
      trim_stale_comments: false
    secrets: inherit

  validate-caller:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/agent-cb11-source-snapshot.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  package:
    needs: validate-caller
    if: ${{ needs.validate-caller.outputs.valid == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Initialize persistent activity log
        shell: bash
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/m3-cp4c3-cb11-package79.log"
          : > "$log"
          {
            echo "workflow=${GITHUB_WORKFLOW}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "event=${GITHUB_EVENT_NAME}"
            echo "event_sha=${GITHUB_SHA}"
            echo "source_sha=803300698289e0d0f629eaa878add1aebc7193c1"
            echo "compile_artifact_id=9825961944"
            echo "runtimeExecution=false"
            echo "started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } | tee -a "$log"

      - name: Download and verify exact compile artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/m3-cp4c3-cb11-package79.log"
          exec > >(tee -a "$log") 2>&1
          work="${RUNNER_TEMP}/m3-cp4c3-cb11-package79"
          mkdir -p "$work/raw"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/9825961944/zip" > "$work/raw.zip"
          echo "d3e8a50d880e4f8f5179718b7c91288a50b6755e8ec0d6d94e29c3da1ead3b99  $work/raw.zip" | sha256sum -c -
          unzip -q "$work/raw.zip" -d "$work/raw"
          test "$(cat "$work/raw/metadata/source-commit.txt")" = "803300698289e0d0f629eaa878add1aebc7193c1"
          grep -qx 'runtimeExecution=false' "$work/raw/metadata/command-boundary.txt"
          grep -qx 'exactArithmeticBackend=GMP' "$work/raw/metadata/command-boundary.txt"
          grep -q 'libgmpxx.so' "$work/raw/metadata/gmp-evidence.txt"
          grep -q 'libgmp.so' "$work/raw/metadata/gmp-evidence.txt"
          test "$(cat "$work/raw/metadata/preflight-exit-code.txt")" = 0
          test "$(cat "$work/raw/metadata/build-exit-code.txt")" = 0
          test ! -s "$work/raw/metadata/source-status-final.txt"
          (cd "$work/raw" && sha256sum -c SHA256SUMS)

      - name: Build and verify mode-preserving package 79
        shell: bash
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/m3-cp4c3-cb11-package79.log"
          exec > >(tee -a "$log") 2>&1
          work="${RUNNER_TEMP}/m3-cp4c3-cb11-package79"
          pkg="$work/package79"
          mkdir -p "$pkg" "$work/source-tree" "$pkg/test-data/benchmarks"
          cp -a "$work/raw/bin" "$work/raw/lib" "$work/raw/metadata" "$work/raw/source" "$pkg/"
          source_archive="$(find "$work/raw/source" -maxdepth 1 -type f -name 'source-*.tar.gz' -print -quit)"
          test -n "$source_archive"
          tar -xzf "$source_archive" -C "$work/source-tree" \
            benchmarks/fixtures \
            .agents/Directional/Architecture_M3_CP4c3_Required_Green_Selector_373.txt \
            .agents/Directional/Architecture_M3_CP4c3_Required_Green_Selector_374.txt \
            .agents/Directional/Architecture_M3_CP4c3_Required_Green_Selector_375.txt \
            .agents/Directional/Architecture_M3_CP4c3_Required_Green_Selector_376.txt
          echo "b47c269851fad1384b5dc9baaf674b3d4ad80ec6c2b40f7f8eda2055c6f44834  $work/source-tree/.agents/Directional/Architecture_M3_CP4c3_Required_Green_Selector_373.txt" | sha256sum -c -
          echo "d496ce96b3776269cda8086a0a2173ce9a1f9967d81b2a80866266155c503c4f  $work/source-tree/.agents/Directional/Architecture_M3_CP4c3_Required_Green_Selector_374.txt" | sha256sum -c -
          echo "aa7b22bb265f321fad6f85128e572e0251dc5f60d68856ca7ec4323006a8f3a0  $work/source-tree/.agents/Directional/Architecture_M3_CP4c3_Required_Green_Selector_375.txt" | sha256sum -c -
          echo "6ab2d9fad0327e00bb2f782741afffe8a0ae08c08df8adbdf9accc6234bfa5e8  $work/source-tree/.agents/Directional/Architecture_M3_CP4c3_Required_Green_Selector_376.txt" | sha256sum -c -
          test "$(wc -l < "$work/source-tree/.agents/Directional/Architecture_M3_CP4c3_Required_Green_Selector_373.txt" | tr -d ' ')" = 373
          test "$(wc -l < "$work/source-tree/.agents/Directional/Architecture_M3_CP4c3_Required_Green_Selector_374.txt" | tr -d ' ')" = 374
          test "$(wc -l < "$work/source-tree/.agents/Directional/Architecture_M3_CP4c3_Required_Green_Selector_375.txt" | tr -d ' ')" = 375
          test "$(wc -l < "$work/source-tree/.agents/Directional/Architecture_M3_CP4c3_Required_Green_Selector_376.txt" | tr -d ' ')" = 376
          cmp -s "$work/source-tree/.agents/Directional/Architecture_M3_CP4c3_Required_Green_Selector_373.txt" <(head -n 373 "$work/source-tree/.agents/Directional/Architecture_M3_CP4c3_Required_Green_Selector_374.txt")
          cmp -s "$work/source-tree/.agents/Directional/Architecture_M3_CP4c3_Required_Green_Selector_374.txt" <(head -n 374 "$work/source-tree/.agents/Directional/Architecture_M3_CP4c3_Required_Green_Selector_375.txt")
          cmp -s "$work/source-tree/.agents/Directional/Architecture_M3_CP4c3_Required_Green_Selector_375.txt" <(head -n 375 "$work/source-tree/.agents/Directional/Architecture_M3_CP4c3_Required_Green_Selector_376.txt")
          cp -a "$work/source-tree/benchmarks/fixtures" "$pkg/test-data/benchmarks/"
          fixture_count="$(find "$pkg/test-data/benchmarks/fixtures" -type f | wc -l | tr -d ' ')"
          test "$fixture_count" = 27
          cat > "$pkg/metadata/fixture-package-contract.txt" <<'EOF'
          package=79
          source_commit=803300698289e0d0f629eaa878add1aebc7193c1
          fixture_count=27
          fixture_authority=package-relative
          selector=376
          selector_sha256=6ab2d9fad0327e00bb2f782741afffe8a0ae08c08df8adbdf9accc6234bfa5e8
          frozen_selector_374_sha256=d496ce96b3776269cda8086a0a2173ce9a1f9967d81b2a80866266155c503c4f
          frozen_selector_375_sha256=aa7b22bb265f321fad6f85128e572e0251dc5f60d68856ca7ec4323006a8f3a0
          diagnostic_identity_376=ResolvedBranchCorrection.NetworkTerminalOwnershipConditionsSurviveProductionFailureProjection
          runtimeExecution=false
          packageRepair=false
          EOF
          cat > "$pkg/metadata/package-envelope.txt" <<'EOF'
          runtimeExecution=false
          turnBoundary=Code+Build-only
          exactArithmeticBackend=GMP
          modePreservingEnvelope=true
          semanticContracts=compiled-not-executed
          EOF
          rm -f "$pkg/SHA256SUMS"
          (cd "$pkg" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          (cd "$pkg" && sha256sum -c SHA256SUMS)
          for exe in "$pkg"/bin/directional_*; do test -x "$exe"; done
          test "$(find "$pkg/bin" -maxdepth 1 -type f -name 'directional_*' | wc -l | tr -d ' ')" = 6
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner -czf "$work/package79.tar.gz" -C "$work" package79
          sha256sum "$work/package79.tar.gz" > "$work/package79.sha256"
          sha256sum "$source_archive" > "$work/source-archive.sha256"
          cat > "$work/package79-boundary.txt" <<'EOF'
          runtimeExecution=false
          packageRepair=false
          No Directional binary was executed while packaging.
          EOF
          mkdir -p "$work/verify"
          tar -xzf "$work/package79.tar.gz" -C "$work/verify"
          (cd "$work/verify/package79" && sha256sum -c SHA256SUMS)
          for exe in "$work/verify/package79"/bin/directional_*; do test -x "$exe"; done
          echo "fixture_count=$fixture_count"
          cat "$work/package79.sha256"
          cat "$work/source-archive.sha256"

      - name: Upload package 79
        uses: actions/upload-artifact@v4
        with:
          name: m3-cp4c3-package79-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/m3-cp4c3-cb11-package79/package79.tar.gz
            ${{ runner.temp }}/m3-cp4c3-cb11-package79/package79.sha256
            ${{ runner.temp }}/m3-cp4c3-cb11-package79/source-archive.sha256
            ${{ runner.temp }}/m3-cp4c3-cb11-package79/package79-boundary.txt
          if-no-files-found: error
          retention-days: 14

      - name: Upload persistent activity log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-cp4c3-package79-log-${{ github.run_id }}
          path: ${{ runner.temp }}/m3-cp4c3-cb11-package79.log
          if-no-files-found: error
          retention-days: 14
