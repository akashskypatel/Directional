name: Agent CB11 Source Snapshot Caller

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/cb11-source-snapshot-20260901.txt

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: agent-cb11-source-snapshot
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/agent-cb11-source-snapshot.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: cb11-source-snapshot
      commit_run_file: false
      trim_stale_comments: false
    secrets: inherit

  snapshot:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-source-snapshot.yml
    with:
      source_ref: 1ad5d2191c65cd1af7443559a6446236ec499ecd
      artifact_prefix: cb11-source-snapshot
      retention_days: 7
    secrets: inherit
