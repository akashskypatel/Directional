name: Agent M3 CP4c 3 CB21 Source Snapshot Caller

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m3-cp4c-3-cb21-source-snapshot.txt

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: agent-m3-cp4c-3-cb21-source-snapshot
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/agent-m3-cp4c-3-cb21-source-snapshot-caller.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m3-cp4c-3-cb21-source-snapshot
      commit_run_file: false
    secrets: inherit

  snapshot:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-source-snapshot.yml
    with:
      source_ref: 5d89d14ddea61862879d6569a4c00eb2e0711196
      artifact_prefix: m3-cp4c-3-cb21-source
    secrets: inherit
