name: M5 CP3 TB1 R12 Review Closeout Apply

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m5-cp3-tb1-r12-rev-closeout-apply.txt

permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

concurrency:
  group: m5-cp3-tb1-r12-rev-closeout-apply-${{ github.ref }}
  cancel-in-progress: false

jobs:
  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m5-cp3-tb1-r12-rev-closeout-apply
      commit_run_file: false
      trim_stale_comments: false
    secrets: inherit

  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/m5-cp3-tb1-r12-rev-closeout-apply.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  apply:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1IUgeHwQxEueonlFomEWO0L3c_koOvzRC
      patch_sha256: f228e6e8fd4bb211193987f38c0868533ce0c60e2806c3e4f1f0e5f812cb48ff
      base_sha: b036ea648c1085de7a237c5903869e02eb7d08c2
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: "docs: close out M5 CP3 TB1 R12 review"
    secrets: inherit
