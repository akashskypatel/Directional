name: M6 CP1 TB2 Review Docs Apply

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/drive-apply/m6-cp1-tb2-rev-docs-20260924.txt

permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

concurrency:
  group: m6-cp1-tb2-rev-docs-apply
  cancel-in-progress: false

jobs:
  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m6-cp1-tb2-rev-docs-apply
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/m6-cp1-tb2-rev-docs-apply.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  apply:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 19Gvh75mmTk9F4akqQftpz0t1hzI_JPuP
      patch_sha256: '36f62efd88ed919344b75c5f8e485d0760316bace11ddebe7d4ba579852bd1a5'
      base_sha: 6a1c3a53e1cc9ece9c0dd08e2630da60fceca645
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: 'docs: close M6-CP1-TB2-REV'
      retention_days: 14
    secrets: inherit
