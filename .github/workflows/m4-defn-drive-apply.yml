name: M4 DEFN Drive Apply

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m4-defn-drive/m4-defn-drive-20260909.txt

permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

concurrency:
  group: m4-defn-drive-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/m4-defn-drive-apply.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m4-defn-drive
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  apply:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1bZ8hcA6GkXp2SCWolZ9g_zVGpEequebM
      patch_sha256: 'e7f52c89cadce2131eb57e6fa10e99d29fdb16da5093f068cf4f375a282005de'
      base_sha: 60670e53f55355146b224e01850ba75526c727cb
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: 'M4-DEFN: freeze global conformity definitions and CP1 Code+Build plan'
      retention_days: 14
    secrets: inherit
