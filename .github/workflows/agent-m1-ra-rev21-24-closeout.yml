name: Agent M1 R-A REV-21-24 Closeout

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m1-ra-rev21-24-closeout.txt

permissions:
  contents: write

concurrency:
  group: agent-m1-ra-rev21-24-closeout-${{ github.ref }}
  cancel-in-progress: false

jobs:
  closeout:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Initialize persistent activity log
        shell: bash
        run: |
          set -euo pipefail
          : > "$RUNNER_TEMP/activity.log"
          printf '%s\n' \
            'task=R-A REV-21 coverage and REV-22 through REV-24 Code + Build closeout' \
            "event_sha=$GITHUB_SHA" \
            "ref=$GITHUB_REF" \
            'controlPlaneOnly=true' \
            'runtimeExecution=false' | tee -a "$RUNNER_TEMP/activity.log"

      - name: Checkout exact trigger authority
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          submodules: false

      - name: Update durable closeout state
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee -a "$RUNNER_TEMP/activity.log") 2>&1
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 - <<'PY'
          from pathlib import Path

          SOURCE='9d88d0e47cfc039e5399ebee334290b1eeae792b'
          RUN='31634075824'; JOB='94239861945'
          RESULT='9156381103'; RESULT_SHA='f75021d0e7dc3462fafd0460c4d93f51d508dfa8bed4621c1c641c758d94b8c3'
          LOG='9156381524'; LOG_SHA='761562ef59092d163bf94b50e37ef94875f1e25da3f9b4da3eb7e9ccdcc915c2'

          def load(path): return Path(path).read_text(encoding='utf-8')
          def save(path, text):
              text='\n'.join(line.rstrip() for line in text.splitlines())+'\n'
              Path(path).write_text(text, encoding='utf-8')

          # TODO: close Code + Build/static work only; keep runtime R-A gate open.
          path='TODO.md'; s=load(path)
          replacements={
            '  - [ ] R-A-REV-21 contract completion: add authority-only source-row permutation rejection and consistently permuted matrix-plus-authority acceptance.': f'  - [x] R-A-REV-21 contract completion: authority-only source-row permutation rejects and consistently permuted matrix-plus-authority accepts at Code + Build source `{SOURCE}`; runtime execution remains pending.',
            '  - [ ] R-A-REV-22: make final merged-product validation strict and usable by carrying globally remapped boundary, feature, chart, output-face, hard-edge, and provenance authority; add boundary-bearing positive/tamper contracts.': f'  - [x] R-A-REV-22 Code + Build: final merged-product validation carries independent globally remapped boundary, feature, chart, output-face, hard-edge, and provenance authority with strict gates; boundary/feature tamper and strict-oracle positive contracts compile at `{SOURCE}`.',
            '  - [ ] R-A-REV-23: rebuild aggregate stitch identities through the canonical completion constructor, derive kind from authoritative patch structure, and prove generated-interior lineages remain resolvable/re-stitchable.': f'  - [x] R-A-REV-23 Code + Build: aggregate stitch identity is rebuilt through the completion-owned canonical constructor, stale kind is ignored, the duplicate pipeline schema is absent, and generated-interior re-stitch contracts compile at `{SOURCE}`.',
            '  - [ ] R-A-REV-24: require non-null exact-matching source authority at direct source-authoritative validator entry regardless of optional gates; add direct fail-closed contracts.': f'  - [x] R-A-REV-24 Code + Build: direct source-authoritative validation requires non-null exact-matching `SourceTopologyRegions` before reporting authority use; null/foreign-authority negatives compile at `{SOURCE}`.',
            '  - [ ] Rerun the complete retained R-A inventory through REV-24 with checked paths, commands/patterns, match counts, and allowed leaves.': '  - [x] Reproduce the complete retained R-A inventory through REV-24: `R_A_Closure_Inventory.py` generated `R_A_Closure_Inventory_Report.md` with 17 checked paths, 38 probes, 164 probe matches, 22/22 classified raw-projection leaves, 2/2 classified face-count leaves, zero unexpected leaves, and final static PASS.',
            '  - [ ] Produce one fresh focused compile-only package, then run a separate immutable artifact-only cadence gate. Artifacts `9153147035 / 9153147459` are superseded as a runtime task.': f'  - [x] Produce and verify one fresh focused compile-only package from `{SOURCE}`: run/job `{RUN} / {JOB}`, artifacts `{RESULT} / {LOG}`, Release/static/Ninja/PRE_TEST **118/118**, manifest **25/25**, five empty source-status snapshots, `runtimeExecution=false`.\n  - [ ] Run the separate immutable artifact-only cadence gate on that exact fresh package; no rebuild or source changes.'
          }
          for old,new in replacements.items():
              if old not in s: raise SystemExit(f'TODO target missing: {old[:80]}')
              s=s.replace(old,new,1)
          save(path,s)

          # Active Code + Build plan: prepend closure checkpoint and advance required sequence.
          path='.agents/Directional/Architecture_M1_Single_Authority_Cutover_Code_Build_Plan.md'; s=load(path)
          old='**Current status:** overall R-A remains rejected/open after independent review of `0580c5c8d7e4b12a41eefb0197f3660a0c7a8fca`; REV-18-through-REV-21 are retained only as bounded compile progress; REV-22-through-REV-24 and the missing REV-21 contracts are the next Code + Build work'
          new=f'**Current status:** REV-21 contract completion and REV-22-through-REV-24 are Code + Build complete / compile-valid at `{SOURCE}`; the complete R-A inventory through REV-24 is reproducibly PASS; overall R-A remains open pending the separate immutable artifact-only runtime cadence gate'
          if old not in s: raise SystemExit('plan status target missing')
          s=s.replace(old,new,1)
          s=s.replace('**Latest review-remediation implementation/compile source:** `0580c5c8d7e4b12a41eefb0197f3660a0c7a8fca`', f'**Latest review-remediation implementation/compile source:** `{SOURCE}`',1)
          marker='## 0D. 2026-08-12 independent R-A closure review after REV-18 through REV-21 — rejected\n'
          section=f'''## 0E. 2026-08-12 REV-21 coverage and REV-22 through REV-24 Code + Build closure\n\nExact clean implementation/test source: `{SOURCE}`. This closes the review findings at the Code + Build/static-contract boundary only; overall R-A is not runtime-accepted until the separate artifact-only cadence gate passes.\n\n- **REV-21 contract completion:** added the authority-only row-permutation mismatch negative and the consistently permuted source-matrix-plus-authority positive.\n- **REV-22:** the final aggregate oracle now receives independently retained/remapped boundary loops/edges, feature rails, hard-feature edges, vertex-chart authority, output-quad source-face authority, and provenance, with boundary/feature/local-sheet strict gates enabled. Boundary/feature tamper contracts and a valid boundary-bearing strict-oracle witness compile.\n- **REV-23:** deleted the aggregate pipeline's second stitch-key constructor. Post-remap identities are rebuilt through `pure_quad_detail::canonical_lineage_stitch_identity`, which derives boundary/interior kind from authoritative patch structure; stale-kind and post-publication generated-interior re-stitch contracts compile.\n- **REV-24:** direct `validate_source_authoritative_surface_mesh` requires non-null exact-matching `SourceTopologyRegions` at entry and sets `sourceAuthorityUsed` only after that proof. Direct null and same-extent foreign-authority negatives compile even with optional gates disabled.\n- **Complete closure inventory reproduced:** `.agents/Directional/R_A_Closure_Inventory.py --root .` generated `R_A_Closure_Inventory_Report.md` covering 17 affected paths and REV-01 through REV-24. Result: **38 probes / 164 probe matches**, raw projection leaves **22 allowed / 0 unexpected**, `complete_for_face_count` leaves **2 allowed / 0 unexpected**, final static inventory **PASS**.\n- **Fresh focused compile:** run/job `{RUN} / {JOB}` compiled and linked Release/static/Ninja/PRE_TEST **118/118** from exact source `{SOURCE}`, exit `0`. Result artifact `{RESULT}`, SHA-256 `{RESULT_SHA}`; log artifact `{LOG}`, SHA-256 `{LOG_SHA}`.\n- Independent package inspection verified **26** regular files, self-excluding manifest **25/25**, zero manifest self references, five empty source-status snapshots, exact source archive, dependency revisions, `semanticContracts=compiled-not-executed`, and `runtimeExecution=false`. ccache recorded **84/108 hits (77.78%)** and pruned the branch to two compatible cache entries.\n\nThe mandatory next cadence is artifact-only Test + Benchmark execution of this exact fresh package with no rebuild. Do not mark R-A complete from compile/static evidence alone.\n\n'''
          if marker not in s: raise SystemExit('plan section marker missing')
          s=s.replace(marker,section+marker,1)
          old_seq='''### Required execution sequence\n\n1. Run one **Code + Build only** turn for REV-22, REV-23, REV-24, and the missing REV-21 permutation-pair contracts. Execute no generated runtime.\n2. Rerun the complete retained R-A closure inventory through REV-24. Record checked paths, exact commands/patterns, match counts, and every allowed leaf; a conclusion-only audit is a failure.\n3. Produce one fresh focused Release/static/Ninja/PRE_TEST package for the corrected exact source with clean provenance and a verified self-excluding manifest.\n4. Run a separate immutable artifact-only Test + Benchmark cadence turn against that fresh package. Do not reuse artifacts `9153147035 / 9153147459`.\n5. Mark R-A complete only if the static inventory and all focused semantic contracts pass.\n6. Continue R-B through R-G, then create and immutably validate one fresh full M1 package. No historical or partial package is an acceptance candidate.'''
          new_seq=f'''### Required execution sequence\n\n1. Preserve exact Code + Build source `{SOURCE}` and focused artifacts `{RESULT} / {LOG}`.\n2. Run a separate immutable artifact-only Test + Benchmark cadence turn against that package with **no rebuild**. Verify exact source, outer artifact digests, self-excluding **25/25** manifest, dependency revisions, command boundary, and five empty source-status snapshots before executing any packaged binary.\n3. Execute the focused REV-21-through-REV-24 semantic contracts plus adjacent retained R-A authority/rollback/optimizer contracts; a zero-selected filter is orchestration failure.\n4. Mark R-A complete only if the reproduced static inventory remains clean and every required focused runtime contract passes organically.\n5. Continue R-B through R-G, then create and immutably validate one fresh full M1 package. No historical or partial package is an acceptance candidate.'''
          if old_seq not in s: raise SystemExit('plan sequence target missing')
          s=s.replace(old_seq,new_seq,1)
          save(path,s)

          # Handoff: advance exact next turn and live status.
          path='.agents/Directional/Future_Chat_Session_Handoff.md'; s=load(path)
          start=s.index('## Mandatory next turn\n'); end=s.index('\n## Current authority\n',start)
          next_turn=f'''## Mandatory next turn\n\nRun one **artifact-only Test + Benchmark cadence turn** against the fresh REV-21-through-REV-24 focused compile package. Do not rebuild or change implementation, test, benchmark, build, fixture, or inventory source.\n\nRepository: `akashskypatel/Directional`\nBranch: `agent/surface_cell_quad/p5-recover-bridge-healing`\nPR: #8 remains open, draft, and unmerged\nExact compile-valid implementation/test source: `{SOURCE}`\nCompile run/job: `{RUN} / {JOB}`\nResult artifact: `{RESULT}`, SHA-256 `{RESULT_SHA}`\nLog artifact: `{LOG}`, SHA-256 `{LOG_SHA}`\n\nBefore executing any packaged binary, verify:\n\n1. exact source `{SOURCE}` and its packaged source archive;\n2. outer artifact digests and recursive self-excluding manifest **25/25** with zero self references;\n3. all five source-status snapshots are empty;\n4. dependency revisions, Release/static/Ninja/PRE_TEST build metadata, build exit `0`, and `runtimeExecution=false`;\n5. packaged `R_A_Closure_Inventory_Report.md` corresponds to source `{SOURCE}` and reports 17 affected paths, 38 probes, 164 probe matches, 22/22 allowed raw-projection leaves, 2/2 allowed face-count leaves, zero unexpected leaves, and final static PASS.\n\nThen execute focused semantic contracts for:\n\n- REV-21 authority-only row-permutation rejection and consistently paired matrix-plus-authority permutation acceptance;\n- REV-22 boundary-bearing final strict oracle plus missing/tampered boundary and feature authority rejection;\n- REV-23 canonical aggregate stitch identity, stale-kind rejection/rebuild, and generated-interior post-publication re-stitch;\n- REV-24 direct null and same-extent foreign source-authority rejection with optional gates disabled;\n- adjacent retained R-A transactional rollback, owner/certificate, optimizer/final-validator authority, and zero-publication contracts needed to detect regressions from this correction package.\n\nClassify every failure from immutable runtime evidence. Do not rebuild, weaken validation, restore aliases/fallbacks, or alter fixtures to synthesize green output. Mark R-A complete only if the full focused runtime gate passes organically; otherwise record precise corrective work for the next Code + Build turn.\n\nThe retained full `Architecture_M1_Single_Authority_Cutover_Artifact_Only_Test_Benchmark_Plan.md` remains dormant until one fresh complete R-A-through-R-G package exists. Do not implement M3, M4, M7, or Pipeline A during this cadence turn.\n'''
          s=s[:start]+next_turn+s[end:]
          status_start=s.index('### R-A closure status\n'); status_end=s.index('\n## Standing product state\n',status_start)
          status=f'''### R-A closure status\n\n- Overall R-A remains **open / not runtime-accepted**.\n- Exact Code + Build source is `{SOURCE}`. REV-21 contract completion and REV-22-through-REV-24 are **Code + Build complete / compile-valid**.\n- REV-21 now contains both required permutation-pair contracts.\n- REV-22 carries independent globally remapped boundary/feature/chart/output-face/hard-edge/provenance authority into the strict final merged-product oracle.\n- REV-23 uses the completion-owned canonical stitch constructor; the duplicate aggregate pipeline schema is absent and stale-kind/re-stitch contracts compile.\n- REV-24 requires non-null exact-matching typed source authority at direct validator entry and contains direct null/foreign-authority negatives.\n- Complete reproducible R-A inventory through REV-24 is generated and static-PASS: **17 paths, 38 probes, 164 matches, 22 allowed raw-projection leaves, 2 allowed face-count leaves, zero unexpected leaves**.\n- Fresh compile-only evidence is run/job `{RUN} / {JOB}` with artifacts `{RESULT} / {LOG}`: Release/static/Ninja/PRE_TEST **118/118**, build exit `0`, self-excluding manifest **25/25**, five empty source-status snapshots, `runtimeExecution=false`.\n- No new semantic contract has executed yet. M1l `bd140cff4572412e6f4ecd70a6ce0fe85310932c` remains immutable runtime authority and regression totals remain **34 events / 14 categories / 20 recurrences**.\n'''
          s=s[:status_start]+status+s[status_end:]
          save(path,s)

          # Changelog: durable completed Code + Build evidence only.
          path='.agents/Directional/CHANGELOG.md'; s=load(path)
          marker='## [Unreleased]\n\n'
          entry=f'''## [Unreleased]\n\n### Fixed — R-A-REV-21 coverage and R-A-REV-22 through R-A-REV-24\n\n- Closed the missing REV-21 Code + Build test intent with an authority-only source-row permutation mismatch negative and a consistently permuted source-matrix-plus-authority positive.\n- Closed REV-22 at the Code + Build boundary: final aggregate validation retains and globally remaps independent boundary, feature-rail, hard-feature, vertex-chart, output-face, and provenance authority and runs the strict boundary/feature/local-sheet oracle instead of a weakened aggregate validator.\n- Closed REV-23 at the Code + Build boundary: removed the pipeline-owned duplicate aggregate stitch-key schema and rebuilds post-remap keys through the completion-owned canonical constructor; stale-kind and generated-interior post-publication re-stitch contracts compile.\n- Closed REV-24 at the Code + Build boundary: direct source-authoritative validation rejects null or same-extent foreign `SourceTopologyRegions` before optional gates and reports `sourceAuthorityUsed` only after exact source-topology proof.\n\n### Validation — complete R-A inventory and fresh focused compile\n\n- Exact clean implementation/test source: `{SOURCE}`. `.agents/Directional/R_A_Closure_Inventory.py --root .` generated the retained `R_A_Closure_Inventory_Report.md` through REV-24 with **17 affected paths, 38 probes, 164 probe matches, 22 allowed/0 unexpected raw-projection leaves, 2 allowed/0 unexpected face-count leaves, final static PASS**.\n- Focused compile run/job `{RUN} / {JOB}` completed Release/static/Ninja/PRE_TEST **118/118**, build exit `0`. Result artifact `{RESULT}`, SHA-256 `{RESULT_SHA}`; log artifact `{LOG}`, SHA-256 `{LOG_SHA}`.\n- Independent artifact inspection verified **26** regular files, self-excluding manifest **25/25**, zero self references, five empty source-status snapshots, exact source archive and dependency revisions, `semanticContracts=compiled-not-executed`, and `runtimeExecution=false`. ccache recorded **84/108 hits (77.78%)** and retained the newest two compatible caches.\n- This closes the requested implementation/static/compile findings only. Overall R-A remains open until the separate immutable artifact-only focused runtime contracts pass. M1l remains immutable runtime authority; regression totals remain **34 / 14 / 20**.\n\n'''
          if marker not in s: raise SystemExit('changelog marker missing')
          s=s.replace(marker,entry,1)
          save(path,s)
          PY

          git diff --check
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' \
            .agents/Directional/Architecture_M1_Single_Authority_Cutover_Code_Build_Plan.md \
            .agents/Directional/CHANGELOG.md \
            .agents/Directional/Future_Chat_Session_Handoff.md \
            TODO.md | sort)"
          printf 'changed_documents=\n%s\n' "$changed"
          test "$changed" = "$expected"
          grep -q '38 probes' .agents/Directional/Future_Chat_Session_Handoff.md
          grep -q 'final static inventory: \*\*PASS\*\*' .agents/Directional/R_A_Closure_Inventory_Report.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add TODO.md
          git add -f \
            .agents/Directional/Architecture_M1_Single_Authority_Cutover_Code_Build_Plan.md \
            .agents/Directional/CHANGELOG.md \
            .agents/Directional/Future_Chat_Session_Handoff.md
          git commit -m "docs: close REV-21 through REV-24 Code Build checkpoint"
          CLOSEOUT_SHA="$(git rev-parse HEAD)"
          echo "closeout_sha=$CLOSEOUT_SHA"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          git status --porcelain=v1 | tee "$RUNNER_TEMP/source-status-final.txt"
          test ! -s "$RUNNER_TEMP/source-status-final.txt"
          echo 'runtimeExecution=false'

      - name: Upload persistent activity log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m1-ra-rev21-24-closeout-log-${{ github.run_id }}
          path: ${{ runner.temp }}/activity.log
          if-no-files-found: error
          retention-days: 7
