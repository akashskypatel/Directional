name: M6 CP2 TB1 Verifier R2 Review Drive Apply

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m6-cp2-tb1-verifier-r2-rev-drive-apply.txt

permissions:
  actions: read
  contents: write
  id-token: write

concurrency:
  group: m6-cp2-tb1-verifier-r2-rev-drive-apply
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/m6-cp2-tb1-verifier-r2-rev-drive-apply.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  apply:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1xp4on1dXcH2GCQ6mgD6ciFGEDopk_FOF
      patch_sha256: 989b343f9ce32b6d65d6dc2239320a4fdc2119cb0aa4c1d5658e6e2c96590ae5
      base_sha: b26f19d934dd67e6eae26166200b923a86879e14
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: "M6 CP2 verifier R2 independent Review closeout"
    secrets: inherit

  mailbox:
    if: ${{ always() }}
    needs: [apply]
    uses: ./.github/workflows/workflow-mailbox-publisher.yml
    with:
      workflow_key: m6-cp2-tb1-verifier-r2-rev-drive-apply
      source_sha: ${{ github.sha }}
      source_ref: ${{ github.ref }}
      result: ${{ needs.apply.result }}
      summary: Apply M6 CP2 verifier R2 independent Review records.
