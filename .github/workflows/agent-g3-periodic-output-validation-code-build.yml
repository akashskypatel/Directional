name: Agent G3 Periodic Output Validation Code Build

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/g3-periodic-output-validation-code-build-20260807.txt

permissions:
  contents: write

concurrency:
  group: agent-g3-periodic-output-validation-code-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      WORK_BRANCH: agent/surface_cell_quad/p5-recover-bridge-healing
      PAYLOAD: .agents/Directional/turn-payloads/g3-periodic-output-validation.patch
      PATCH_SHA256: 74dc044caf0f05c108a1b2dc062927bc5a4bbfac6fb34584d20010f5d2d6fe9e
    steps:
      - name: Initialize activity log
        shell: bash
        run: |
          set -euo pipefail
          LOG_FILE="$RUNNER_TEMP/g3-periodic-output-validation-code-build.log"
          echo "LOG_FILE=$LOG_FILE" >> "$GITHUB_ENV"
          {
            echo "task=G3 periodic output validation Code + Build"
            echo "event_sha=$GITHUB_SHA"
            echo "ref=$GITHUB_REF"
            date -u +"utc=%Y-%m-%dT%H:%M:%SZ"
          } > "$LOG_FILE"

      - name: Checkout bounded source
        uses: actions/checkout@v4
        with:
          ref: agent/surface_cell_quad/p5-recover-bridge-healing
          fetch-depth: 1
          submodules: false

      - name: Apply verified G3 output-validation patch
        shell: bash
        run: |
          set -euo pipefail
          trap 'status=$?; echo "apply_exit=$status" | tee -a "$LOG_FILE"; exit $status' EXIT
          exec > >(tee -a "$LOG_FILE") 2>&1
          echo "checkout_sha=$(git rev-parse HEAD)"
          test "$(git hash-object src/geometry/SurfaceCellTracing.cpp)" = "b1a2c6d4051cc17b79e342170285d69552cad16d"
          test "$(git hash-object tests/SurfaceCellsPhase10Tests.cpp)" = "bccd6abf3e31b8096c471c515b1949d08dcfde59"
          echo "$PATCH_SHA256  $PAYLOAD" | sha256sum -c -
          if grep -qE '^diff --git a/\.github/workflows/' "$PAYLOAD"; then
            echo "payload illegally modifies workflow files" >&2
            exit 1
          fi
          git apply --check "$PAYLOAD"
          git apply "$PAYLOAD"
          git diff --check
          test "$(git hash-object src/geometry/SurfaceCellTracing.cpp)" = "9df9a9759c761293fef1278f97b82fbb0aee0600"
          test "$(git hash-object tests/SurfaceCellsPhase10Tests.cpp)" = "c9dcbe9f67ba239c061ddb295f40c9b82ebafb49"
          git diff --stat
          git config user.name directional-agent
          git config user.email directional-agent@users.noreply.github.com
          git add src/geometry/SurfaceCellTracing.cpp tests/SurfaceCellsPhase10Tests.cpp
          git commit -m "fix(surface-cells): preserve periodic source strips"
          SOURCE_COMMIT=$(git rev-parse HEAD)
          echo "SOURCE_COMMIT=$SOURCE_COMMIT" >> "$GITHUB_ENV"
          git push origin HEAD:"$WORK_BRANCH"
          echo "source_commit=$SOURCE_COMMIT"
          echo "surface_cell_tracing_blob=$(git hash-object src/geometry/SurfaceCellTracing.cpp)"
          echo "phase10_tests_blob=$(git hash-object tests/SurfaceCellsPhase10Tests.cpp)"

      - name: Install compile dependencies
        shell: bash
        run: |
          set -euo pipefail
          trap 'status=$?; echo "dependency_exit=$status" | tee -a "$LOG_FILE"; exit $status' EXIT
          exec > >(tee -a "$LOG_FILE") 2>&1
          sudo apt-get update
          sudo apt-get install -y ninja-build libgmp-dev

      - name: Initialize shallow submodules
        shell: bash
        run: |
          set -euo pipefail
          trap 'status=$?; echo "submodule_exit=$status" | tee -a "$LOG_FILE"; exit $status' EXIT
          exec > >(tee -a "$LOG_FILE") 2>&1
          git submodule update --init --depth 1
          git submodule status

      - name: Configure compile-only build
        shell: bash
        run: |
          set -euo pipefail
          trap 'status=$?; echo "configure_exit=$status" | tee -a "$LOG_FILE"; exit $status' EXIT
          exec > >(tee -a "$LOG_FILE") 2>&1
          mkdir -p agent-build-logs
          {
            echo "source_commit=$SOURCE_COMMIT"
            cmake --version
            c++ --version
            ninja --version
          } | tee agent-build-logs/toolchain.txt
          cmake -S . -B agent-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DCMAKE_GTEST_DISCOVER_TESTS_DISCOVERY_MODE=PRE_TEST \
            -DBUILD_SHARED_LIBS=OFF \
            -DBUILD_TUTORIALS=OFF \
            -DBUILD_PYTHON=OFF \
            -DDIRECTIONAL_BUILD_CLI=OFF \
            -DDIRECTIONAL_BUILD_GUI=OFF \
            -DDIRECTIONAL_BUILD_BENCHMARKS=ON \
            -DDIRECTIONAL_BUILD_TESTS=ON \
            -DDIRECTIONAL_BUILD_HISTORICAL_TESTS=OFF \
            -DDIRECTIONAL_BUILD_LEGACY_INTEGRATION_TESTS=OFF \
            -DDIRECTIONAL_BUILD_OPTIONAL_GUIDANCE_TESTS=OFF \
            -DDIRECTIONAL_ENABLE_GMP=ON \
            -DDIRECTIONAL_ENABLE_PARDISO=OFF \
            -DDIRECTIONAL_ENABLE_CUDSS=OFF \
            -DDIRECTIONAL_ENABLE_SUITESPARSE=OFF \
            2>&1 | tee agent-build-logs/configure.log

      - name: Compile approved targets only
        shell: bash
        run: |
          set -euo pipefail
          trap 'status=$?; echo "build_exit=$status" | tee -a "$LOG_FILE"; exit $status' EXIT
          exec > >(tee -a "$LOG_FILE") 2>&1
          cmake --build agent-build --parallel 2 --target \
            directional_core \
            directional_pipeline \
            directional_compiled_api_tests \
            directional_surface_cell_producer_tests \
            directional_surface_cell_completion_tests \
            directional_surface_cell_validation_tests \
            directional_benchmarks \
            2>&1 | tee agent-build-logs/build.log
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Package immutable build artifact
        shell: bash
        run: |
          set -euo pipefail
          trap 'status=$?; echo "package_exit=$status" | tee -a "$LOG_FILE"; exit $status' EXIT
          exec > >(tee -a "$LOG_FILE") 2>&1
          root="$GITHUB_WORKSPACE/g3-periodic-output-validation-code-build-artifact"
          rm -rf "$root"
          mkdir -p "$root"/{bin,lib,test-data/benchmarks,logs,metadata,source}
          cp agent-build/directional_benchmarks "$root/bin/"
          cp agent-build/directional_compiled_api_tests "$root/bin/"
          cp agent-build/directional_surface_cell_producer_tests "$root/bin/"
          cp agent-build/directional_surface_cell_completion_tests "$root/bin/"
          cp agent-build/directional_surface_cell_validation_tests "$root/bin/"
          cp agent-build/libdirectional_core.a "$root/lib/"
          cp agent-build/libdirectional_pipeline.a "$root/lib/"
          cp -a benchmarks/fixtures "$root/test-data/benchmarks/"
          cp agent-build-logs/configure.log agent-build-logs/build.log agent-build-logs/toolchain.txt "$root/logs/"
          cp agent-build/compile_commands.json "$root/source/"
          cp "$PAYLOAD" "$root/source/g3-periodic-output-validation.patch"
          tar --exclude=.git --exclude=external --exclude=agent-build \
              --exclude=g3-periodic-output-validation-code-build-artifact \
              -cJf "$root/source/directional-g3-periodic-output-validation-source-no-deps.tar.xz" .
          cat > "$root/metadata/source-authority.json" <<EOF
          {
            "sourceCommit": "$SOURCE_COMMIT",
            "patchSha256": "$PATCH_SHA256",
            "changedFileBlobs": {
              "src/geometry/SurfaceCellTracing.cpp": "$(git hash-object src/geometry/SurfaceCellTracing.cpp)",
              "tests/SurfaceCellsPhase10Tests.cpp": "$(git hash-object tests/SurfaceCellsPhase10Tests.cpp)"
            }
          }
          EOF
          cat > "$root/metadata/command-boundary.txt" <<'EOF'
          Code + Build turn only.
          Allowed: apply exact verified source/test patch, configure, compile/link approved targets, packaging/checksums.
          Prohibited and not executed: generated project binaries, tests, benchmarks, ctest discovery, CLI, GUI, help, list.
          EOF
          cat > "$root/metadata/build-authority.json" <<'EOF'
          {"configuration":"Release","generator":"Ninja","buildSharedLibs":false,"gtestDiscoveryMode":"PRE_TEST","approvedTargets":7,"runtimeExecution":false}
          EOF
          cat > "$root/README.md" <<EOF
          # Gate 3 Periodic Output Validation Code + Build Artifact

          Source commit: $SOURCE_COMMIT
          Compile-only artifact; no generated project binary was executed.
          EOF
          (cd "$root" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          echo "artifact_files=$(wc -l < "$root/SHA256SUMS")"
          test "$(wc -l < "$root/SHA256SUMS")" -ge 40

      - name: Record final repository state
        if: always()
        shell: bash
        run: |
          set +e
          {
            echo "final_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "final_head=$(git rev-parse HEAD 2>/dev/null)"
            git status --short 2>&1
          } | tee -a "$LOG_FILE"

      - name: Upload detailed activity log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g3-periodic-output-validation-code-build-logs
          path: ${{ env.LOG_FILE }}
          if-no-files-found: error
          retention-days: 14

      - name: Upload build artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: g3-periodic-output-validation-code-build
          path: g3-periodic-output-validation-code-build-artifact
          if-no-files-found: error
          retention-days: 14
          compression-level: 6
