name: M5 CP3 TB1 R7 Evidence Finalize

on:
  push:
    branches: [agent/surface_cell_quad/p5-recover-bridge-healing]
    paths: [.agents/connector-triggers/m5-cp3-tb1-r7-evidence-finalize.txt]

permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: m5-cp3-tb1-r7-evidence-finalize-${{ github.ref }}
  cancel-in-progress: false

jobs:
  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m5-cp3-tb1-r7-evidence-finalize
      commit_run_file: false
      trim_stale_comments: false
    secrets: inherit

  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/m5-cp3-tb1-r7-evidence-finalize.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  finalize:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN_ID: "35628318067"
      SOURCE_JOB_ID: "106428116133"
      SOURCE_ARTIFACT_ID: "10653532089"
      SOURCE_ARTIFACT_SHA256: "30f90ab0dce7fc289ade9fd1d079652c61913e663060559e91c1f5975868d33a"
    steps:
      - name: Initialize diagnostic log
        shell: bash
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/M5-CP3-TB1-R7-EVIDENCE-FINALIZE.log"
          : > "$log"
          printf '%s\n' "workflow=$GITHUB_WORKFLOW" "run_id=$GITHUB_RUN_ID" "event=$GITHUB_EVENT_NAME" "event_sha=$GITHUB_SHA" "source_run_id=$SOURCE_RUN_ID" "source_job_id=$SOURCE_JOB_ID" "source_artifact_id=$SOURCE_ARTIFACT_ID" "runtimeExecution=false" "evidenceFinalizationOnly=true" "started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" | tee -a "$log"

      - name: Checkout orchestration authority
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          submodules: false
          lfs: false

      - name: Download and verify original R7 runtime result
        shell: bash
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/M5-CP3-TB1-R7-EVIDENCE-FINALIZE.log"
          exec > >(tee -a "$log") 2>&1
          headers=(-H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28")
          zip="${RUNNER_TEMP}/r7-runtime-result.zip"
          meta="$(curl --fail --silent --show-error "${headers[@]}" "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$SOURCE_ARTIFACT_ID")"
          test "$(jq -r '.digest' <<<"$meta")" = "sha256:$SOURCE_ARTIFACT_SHA256"
          curl -L --fail --silent --show-error "${headers[@]}" "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$SOURCE_ARTIFACT_ID/zip" -o "$zip"
          test "$(sha256sum "$zip" | awk '{print $1}')" = "$SOURCE_ARTIFACT_SHA256"
          result="${RUNNER_TEMP}/M5-CP3-TB1-R7-EXEC-result"
          mkdir -p "$result"
          unzip -q "$zip" -d "$result"
          echo "RESULT_DIR=$result" >> "$GITHUB_ENV"
          echo "source_artifact_provider_digest=sha256:$SOURCE_ARTIFACT_SHA256"
          echo "source_artifact_download_sha256=$(sha256sum "$zip" | awk '{print $1}')"

      - name: Verify runtime evidence and finalize complete self-manifest
        shell: bash
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/M5-CP3-TB1-R7-EVIDENCE-FINALIZE.log"
          exec > >(tee -a "$log") 2>&1
          result="$RESULT_DIR"
          original_manifest_sha="$(sha256sum "$result/SHA256SUMS" | awk '{print $1}')"
          original_manifest_rows="$(wc -l < "$result/SHA256SUMS" | tr -d ' ')"
          test "$original_manifest_sha" = "fe0708c206deab2d75bba69f6614ce2018fcf2c77f1cd76c1277fb1fa483e824"
          test "$original_manifest_rows" = "911"
          (cd "$result" && sha256sum -c SHA256SUMS)

          python3 - "$result" <<'PY'
          import csv,hashlib,pathlib,re,sys
          r=pathlib.Path(sys.argv[1])
          def sha(p):
              h=hashlib.sha256()
              with open(p,'rb') as f:
                  for c in iter(lambda:f.read(1024*1024),b''): h.update(c)
              return h.hexdigest()
          listed=[]
          for line in (r/'SHA256SUMS').read_text().splitlines():
              if line.strip(): listed.append(line.split('  ',1)[1])
          actual=sorted(p.relative_to(r).as_posix() for p in r.rglob('*') if p.is_file() and p.name!='SHA256SUMS')
          missing=sorted(set(actual)-set(listed)); extra=sorted(set(listed)-set(actual))
          if missing!=['driver-authority.txt'] or extra:
              raise SystemExit(f'original manifest incompleteness differs from diagnosed defect: missing={missing} extra={extra}')

          expected={
            'mechanism':(9,9,[]),
            'focused':(1,1,[]),
            'produced':(6,3,[4,5,6]),
            'selector':(430,430,[]),
          }
          ledgers={}
          for name,(total,passes,reds) in expected.items():
              rows=list(csv.DictReader((r/f'{name}-ledger.tsv').open(),delimiter='\t'))
              ledgers[name]=rows
              if len(rows)!=total: raise SystemExit(f'{name} rows={len(rows)}')
              if any(x['selected']!='1' or x['skipped']!='0' for x in rows):
                  raise SystemExit(f'{name} exact-one/zero-skip failure')
              got_pass=sum(x['result']=='PASS' for x in rows)
              got_red=[int(x['ordinal']) for x in rows if x['result']!='PASS']
              if got_pass!=passes or got_red!=reds:
                  raise SystemExit(f'{name} vector pass={got_pass} red={got_red}')
              for x in rows:
                  raw=r/'raw'/name/f"ordinal-{int(x['ordinal']):03d}.log"
                  if not raw.is_file() or sha(raw)!=x['raw_sha256']:
                      raise SystemExit(f'{name} raw digest mismatch ordinal={x["ordinal"]}')

          summary=(r/'semantic-summary.txt').read_text()
          required=[
            'mechanism_total=9','mechanism_pass=9','mechanism_red_ordinals=[]',
            'focused_total=1','focused_pass=1','focused_red_ordinals=[]',
            'produced_total=6','produced_pass=3','produced_red_ordinals=[4, 5, 6]',
            'selector_total=430','selector_pass=430','selector_red_ordinals=[]',
            'planned_processes=446','benchmark_execution=0']
          if any(x not in summary.splitlines() for x in required):
              raise SystemExit('semantic summary mismatch')

          boundary=dict(line.split('=',1) for line in (r/'execution-boundary.txt').read_text().splitlines() if '=' in line)
          if boundary.get('preflight_completed')!='true' or boundary.get('runtime_started')!='true' or boundary.get('runtime_completed')!='true' or boundary.get('orchestration_failure')!='false':
              raise SystemExit(f'runtime boundary mismatch: {boundary}')
          for k in ('benchmark_execution','configure_execution','compile_execution','relink_execution','generated_discovery','package_repair','mode_repair','source_test_fixture_selector_mutation'):
              if boundary.get(k)!='0': raise SystemExit(f'prohibited counter {k}={boundary.get(k)}')

          imm=dict(line.split('=',1) for line in (r/'immutability.txt').read_text().splitlines() if '=' in line)
          expected_imm={'package_census_equal':'true','source_census_equal':'true','execution_view_census_equal':'true','manifest_after':'28/28','selector_unchanged':'true','routing_map_unchanged':'true'}
          if any(imm.get(k)!=v for k,v in expected_imm.items()): raise SystemExit(f'immutability mismatch: {imm}')

          if sum(x.endswith(': OK') for x in (r/'candidate-manifest-check.txt').read_text().splitlines())!=28: raise SystemExit('candidate preflight manifest not 28/28')
          if sum(x.endswith(': OK') for x in (r/'candidate-manifest-check-after.txt').read_text().splitlines())!=28: raise SystemExit('candidate postflight manifest not 28/28')
          cand=(r/'candidate-artifact-authority.txt').read_text()
          if 'artifact_id=10651055588' not in cand or 'sha256:376f61120b4a71dd9747daae8c248fe766bbf899faac0e2f336fc97e57acda96' not in cand: raise SystemExit('candidate authority mismatch')
          routing=(r/'routing-artifact-authority.txt').read_text()
          if 'artifact_id=10592987234' not in routing or 'sha256:352c8cfc9c9b89cf0d532c8e0836339a31ba35fd6e854a781721cbc76f02afce' not in routing: raise SystemExit('routing authority mismatch')
          driver=(r/'driver-authority.txt').read_text()
          for token in (
              'historical_template_commit=1bc3ebcbd90997a9c4503ea2d2b7918556475b2a',
              'historical_template_sha256=752deb7e8d5d879047f1d4619fdb3c564e93e6d3d2e68b8affb9f19a47b997a3',
              'r7_template_sha256=d6c294e80ebf33b5f60b7c0fdde56d4403cd38766bac00fd2fb81f383a0d3bc8',
              'writer_sha256=d8b7d77d7425c02de4327aae47ac20614e1fbc36afe1c66b3af9d1d3a8128995',
              'rendered_driver_sha256=3dcf1c105ce3205195d7784bc72dc5efd633c8da5dc5885cc6bc685cb07135c9'):
              if token not in driver.splitlines(): raise SystemExit(f'driver authority missing {token}')

          allowed=['PeriodicGeneratorRouteUnavailable','PeriodicActionCorrespondenceMismatch','PeriodicHolonomyZeroTranslation','PeriodicHolonomyMissingGeneratorRoute','PeriodicHolonomyMissingCutRoute','PeriodicHolonomyInvalidRelationIdentity','PeriodicHolonomyMismatch']
          out=['ordinal\tidentity\tresult\ttyped_failure_reason\tclassification\traw_sha256\n']
          generator_unavailable=0
          for row in ledgers['produced']:
              raw_path=r/'raw'/'produced'/f"ordinal-{int(row['ordinal']):03d}.log"
              raw=raw_path.read_text(errors='replace')
              hits=[x for x in allowed if re.search(r'(?<![A-Za-z0-9_])'+re.escape(x)+r'(?![A-Za-z0-9_])',raw)]
              if 'PeriodicGeneratorRouteUnavailable' in hits: generator_unavailable+=1
              if row['result']=='PASS':
                  reason='-'; classification='PASS'
                  if hits: raise SystemExit(f'PASS row has typed failure token ordinal={row["ordinal"]}: {hits}')
              elif len(hits)==1:
                  reason=hits[0]; classification='TypedFailureReason'
              elif len(hits)==0:
                  reason='-'; classification='GTestAssertionFailureWithoutTypedReason'
              else:
                  raise SystemExit(f'ambiguous typed reasons ordinal={row["ordinal"]}: {hits}')
              out.append(f"{row['ordinal']}\t{row['identity']}\t{row['result']}\t{reason}\t{classification}\t{row['raw_sha256']}\n")
          if generator_unavailable!=0: raise SystemExit(f'primary falsifier failed: PeriodicGeneratorRouteUnavailable rows={generator_unavailable}')
          (r/'produced-failure-evidence.tsv').write_text(''.join(out))

          sel=ledgers['selector']
          rows=['identity\tordinal\tresult\traw_sha256\n']
          for ordinal in (191,192,247,408):
              x=sel[ordinal-1]
              if int(x['ordinal'])!=ordinal or x['result']!='PASS': raise SystemExit(f'protected selector row not PASS ordinal={ordinal}')
              rows.append(f"{x['identity']}\t{x['ordinal']}\t{x['result']}\t{x['raw_sha256']}\n")
          (r/'protected-selector-audit.tsv').write_text(''.join(rows))
          (r/'primary-falsifier.txt').write_text('produced_periodic_generator_route_unavailable_count=0\nprimary_falsifier_pass=true\n')
          PY

          cp "$result/SHA256SUMS" "$result/SHA256SUMS.runtime-original"
          cat > "$result/runtime-result-authority.txt" <<EOF
          source_run_id=$SOURCE_RUN_ID
          source_job_id=$SOURCE_JOB_ID
          source_artifact_id=$SOURCE_ARTIFACT_ID
          source_artifact_provider_digest=sha256:$SOURCE_ARTIFACT_SHA256
          source_artifact_download_sha256=$SOURCE_ARTIFACT_SHA256
          original_self_manifest_rows=$original_manifest_rows
          original_self_manifest_sha256=$original_manifest_sha
          diagnosed_manifest_omission=driver-authority.txt
          EOF
          cat > "$result/evidence-finalization-boundary.txt" <<EOF
          runtimeExecution=false
          evidenceFinalizationOnly=true
          candidateMutation=false
          runtimeRerun=false
          sourceRun=$SOURCE_RUN_ID
          sourceJob=$SOURCE_JOB_ID
          finalizedAt=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          EOF
          python3 - "$result" <<'PY'
          import hashlib,pathlib,sys
          r=pathlib.Path(sys.argv[1]); target=r/'SHA256SUMS'; rows=[]
          for p in sorted(r.rglob('*')):
              if p.is_file() and p!=target:
                  h=hashlib.sha256(p.read_bytes()).hexdigest()
                  rows.append(f'{h}  {p.relative_to(r).as_posix()}\n')
          target.write_text(''.join(rows))
          PY
          (cd "$result" && sha256sum -c SHA256SUMS)
          echo "final_self_manifest_rows=$(wc -l < "$result/SHA256SUMS" | tr -d ' ')"
          echo "final_self_manifest_sha256=$(sha256sum "$result/SHA256SUMS" | awk '{print $1}')"

      - name: Upload finalized R7 result evidence
        uses: actions/upload-artifact@v4
        with:
          name: directional-m5-cp3-tb1-r7-finalized-result-${{ github.run_id }}
          path: ${{ env.RESULT_DIR }}
          if-no-files-found: error
          retention-days: 7

      - name: Record final status
        if: always()
        shell: bash
        run: |
          set +e
          log="${RUNNER_TEMP}/M5-CP3-TB1-R7-EVIDENCE-FINALIZE.log"
          printf '%s\n' "final_job_status=${{ job.status }}" "runtimeExecution=false" "evidenceFinalizationOnly=true" "finished_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" | tee -a "$log"

      - name: Upload diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: directional-m5-cp3-tb1-r7-evidence-finalize-log-${{ github.run_id }}
          path: ${{ runner.temp }}/M5-CP3-TB1-R7-EVIDENCE-FINALIZE.log
          if-no-files-found: error
          retention-days: 7
