name: M6 CP1 CB12 Close R1 Patch Apply

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m6-cp1-cb12-close-r1-patch-apply.txt

permissions:
  actions: read
  contents: write
  id-token: write

concurrency:
  group: m6-cp1-cb12-close-r1-patch-apply-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/m6-cp1-cb12-close-r1-patch-apply.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  apply:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1Ny81rUagEl0Uz9jlVq084RbA-HXxw7t3
      patch_sha256: c3b6fa1ae618803897b1db623db91b9f3969c8221e6b2895d63d22f82e6bce00
      base_sha: 24f8db391284d5731ec7a2c67a26c56e9cfc0294
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: "M6-CP1-CB12-CLOSE-R1: implement C1-C4 closeout"
    secrets: inherit

  mailbox:
    if: ${{ always() }}
    needs: [apply]
    permissions:
      actions: read
      contents: write
    uses: ./.github/workflows/workflow-mailbox-publisher.yml
    with:
      workflow_key: m6-cp1-cb12-close-r1-patch-apply
      source_sha: ${{ github.sha }}
      source_ref: ${{ github.ref }}
      result: ${{ needs.apply.result }}
      summary: Apply the verified M6-CP1-CB12-CLOSE-R1 C1-C4 patch from Google Drive.
