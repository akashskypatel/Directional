name: M5 CP1 CB2 Canonical Executor Patch Apply

on:
  push:
    branches: [agent/surface_cell_quad/p5-recover-bridge-healing]
    paths: [.agents/connector-triggers/m5-cp1-cb2-apply-20260920.txt]

permissions:
  actions: read
  contents: write
  id-token: write
  issues: write
  pull-requests: write

jobs:
  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m5-cp1-cb2-apply
      commit_run_file: false
      trim_stale_comments: false
    secrets: inherit

  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/m5-cp1-cb2-apply.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  apply:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: "1GNerKBMuUF-Wnd1A6SGErMX0ANaXPqx7"
      patch_sha256: "deacc5da3b4621c1999a3afc66d7429298acebf092be0bc22cab61d361109dc7"
      base_sha: "7b6b488af828594d776d9550a77924819235fe0c"
      target_branch: "agent/surface_cell_quad/p5-recover-bridge-healing"
      commit_message: "control(m5-cp1): install canonical R2 executor"
      retention_days: 7
    secrets: inherit
