name: CB35 Independent Review Historical Boundary

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m6-cp3-cb35-review-history-20261024.txt

permissions:
  actions: read
  contents: write

concurrency:
  group: cb35-review-history-boundary
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/m6-cp3-cb35-review-history-20261024.yml
      source_ref: ${{ github.sha }}

  boundary:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout actual committed history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Independently verify review boundary
        shell: bash
        run: |
          set -uo pipefail
          log="${RUNNER_TEMP}/cb35-review-boundary.log"
          {
            echo "event_sha=${GITHUB_SHA}"
            echo "head_sha=$(git rev-parse HEAD)"
            git status -sb
            echo "history_base=$(git rev-parse 8b7299b43)"
            python3 .agents/Directional/tools/review_check.py boundary
          } > "$log" 2>&1
          cat "$log"
          if grep -q '  \[FAIL\]' "$log"; then exit 1; fi
          grep -q 'ALL CHECKS PASSED' "$log" || exit 1
      - name: Archive immutable evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cb35-review-boundary-${{ github.run_id }}
          path: ${{ runner.temp }}/cb35-review-boundary.log
          if-no-files-found: error
          retention-days: 14

  mailbox:
    if: ${{ always() }}
    needs: [validate, boundary]
    uses: ./.github/workflows/workflow-mailbox-publisher.yml
    with:
      mailbox_branch: workflow-mailbox
      workflow_key: cb35-review-history-boundary
      source_sha: ${{ github.sha }}
      source_ref: ${{ github.ref }}
      result: ${{ needs.boundary.result }}
      summary: CB35 independent Review boundary on real committed Git history.
