    secrets: inherit

  apply:
    needs: validate-caller
    if: ${{ needs.validate-caller.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1Ys1OFKj6-NQOoFU1bF_vLJp6co3ab1s4
      patch_sha256: bad66ff204bd2992468aab7b3fa8235ec1d1464a23ed5761cd6887c6a71456fd
      base_sha: 93ed2ff50ddad96c9a6aa93f327b3e4d9d93a9b4
