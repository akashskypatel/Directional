name: M6 CP2 CB2 Documentation Apply

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m6-cp2-cb2-docs-apply.txt

permissions:
  actions: read
  contents: write
  id-token: write

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/m6-cp2-cb2-docs-apply.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  apply:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1O4ttMeJr2vKPio4iPnRLqSMl5rDOMI5I
      patch_sha256: 49633986db247916af1f49e5c226cb9f58dc3872e228e9b79253538ac90c3d82
      base_sha: 5ce3132ec01748eff5b15f82be07a1abe2bd1af6
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: "docs: close M6 CP2 CB2 coverage"
    secrets: inherit

  mailbox:
    if: ${{ always() }}
    needs: [validate, apply]
    uses: ./.github/workflows/workflow-mailbox-publisher.yml
    with:
      workflow_key: m6-cp2-cb2-docs-apply
      source_sha: ${{ github.sha }}
      source_ref: ${{ github.ref }}
      result: ${{ needs.apply.result }}
      summary: M6 CP2 CB2 coverage documentation closeout.
