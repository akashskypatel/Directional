name: M3 CP4c0 TB-R4 Artifact-Only Gate

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m3-cp4c0-tb-r4/run.txt

permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: m3-cp4c0-tb-r4-${{ github.ref }}
  cancel-in-progress: false

jobs:
  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m3-cp4c0-tb-r4
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  test-benchmark:
    runs-on: ubuntu-24.04
    env:
      PACKAGE_ARTIFACT_ID: "9591540182"
      PACKAGE_SHA256: 8a93b553df337bc8ad952e6a5b348a3eaac8b2304b50c1402f5184a8ce4c561f
      SEMANTIC_SOURCE_SHA: de291a17d5e9bfb6f54918660320ecfa1d521be4
      SOURCE_ARCHIVE_SHA256: 6077902a83b88d1ef839ab6d2bc285050f0c059511a71c9125b0324383d69a32
      SELECTOR_SHA256: d588cae09067de6914aa1cb917716b11bae01e9f3b45910dbe0faa7d0c7a8116
      SELECTOR_316_SHA256: 601ce2b6a4aa2b0cda971e06e9378ebccba5fa75a9b416407447f7ed3600193c
      SELECTOR_328_SHA256: cf93622ea8807b26037d2fb6305adf721a23724bc519886c455e98c49c5f3600
      F3_A: ResolvedBranchCorrection.NetworkDiagnosticsContainNoControlCharactersForAnyCode
      F3_B: ResolvedBranchCorrection.TracingPathNeverPublishesSeedIdentityAsFailureLocus
      G5_IDENTITY: ResolvedBranchCorrection.PrescribedSphereA2aOutcomeIsAlwaysPublishedNonGating
      T1_IDENTITY: ResolvedBranchContinuation.PositionChoosesSmallerExactExitAndFlipsAcrossCrossover
    steps:
      - name: Initialize persistent activity log
        shell: bash
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/m3-cp4c0-tb-r4-activity.log"
          : > "$log"
          {
            echo "workflow=${GITHUB_WORKFLOW}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "event=${GITHUB_EVENT_NAME}"
            echo "event_sha=${GITHUB_SHA}"
            echo "ref=${GITHUB_REF}"
            echo "repository=${GITHUB_REPOSITORY}"
            echo "semantic_source_sha=${SEMANTIC_SOURCE_SHA}"
            echo "package_artifact_id=${PACKAGE_ARTIFACT_ID}"
            echo "turnBoundary=Test+Benchmark-artifact-only"
            echo "configure=false"
            echo "compile=false"
            echo "relink=false"
            echo "repair=false"
            echo "generatedDiscovery=false"
            echo "performanceBenchmark=false"
            echo "started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } | tee -a "$log"

      - name: Download and verify immutable package
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/m3-cp4c0-tb-r4-activity.log"
          exec > >(tee -a "$log") 2>&1
          trap 'status=$?; echo "preflight_exit=${status}"' EXIT

          package_zip="${RUNNER_TEMP}/m3-cp4c0-cb4-package.zip"
          package_dir="${RUNNER_TEMP}/m3-cp4c0-cb4-package"
          result_dir="${RUNNER_TEMP}/m3-cp4c0-tb-r4-result"
          rm -rf "$package_dir" "$result_dir"
          mkdir -p "$package_dir" "$result_dir/identity-results" "$result_dir/supplementals"

          gh api --method GET "repos/${GITHUB_REPOSITORY}/actions/artifacts/${PACKAGE_ARTIFACT_ID}/zip" > "$package_zip"
          package_sha="$(sha256sum "$package_zip" | awk '{print $1}')"
          echo "package_zip_sha256=${package_sha}"
          test "$package_sha" = "$PACKAGE_SHA256"

          unzip -q "$package_zip" -d "$package_dir"
          (
            cd "$package_dir"
            sha256sum -c SHA256SUMS | tee "$result_dir/manifest-pre.txt"
          )
          manifest_pass="$(grep -c ': OK$' "$result_dir/manifest-pre.txt")"
          test "$manifest_pass" -eq 27
          test "$(cat "$package_dir/metadata/source-commit.txt")" = "$SEMANTIC_SOURCE_SHA"
          grep -Fx 'runtimeExecution=false' "$package_dir/metadata/command-boundary.txt"
          grep -Fx 'turnBoundary=Code+Build-only' "$package_dir/metadata/command-boundary.txt"
          for status_file in "$package_dir"/metadata/source-status-*.txt; do
            test ! -s "$status_file"
          done

          source_archive="$package_dir/source/source-${SEMANTIC_SOURCE_SHA}.tar.gz"
          source_archive_sha="$(sha256sum "$source_archive" | awk '{print $1}')"
          echo "source_archive_sha256=${source_archive_sha}"
          test "$source_archive_sha" = "$SOURCE_ARCHIVE_SHA256"

          # The test binary was compiled with DIRECTIONAL_TEST_SOURCE_DIR equal to
          # the standard Actions workspace. Materialize only the immutable packaged
          # source archive there; this is not a repository checkout or repair.
          find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
          tar -xzf "$source_archive" -C "$GITHUB_WORKSPACE"

          selector="$GITHUB_WORKSPACE/.agents/Directional/Architecture_M3_CP4c0_Required_Green_Selector.txt"
          test -f "$selector"
          test "$(grep -cve '^$' "$selector")" -eq 338
          test "$(grep -ve '^$' "$selector" | sort -u | wc -l | tr -d ' ')" -eq 338
          test "$(sha256sum "$selector" | awk '{print $1}')" = "$SELECTOR_SHA256"
          test "$(head -n 316 "$selector" | sha256sum | awk '{print $1}')" = "$SELECTOR_316_SHA256"
          test "$(head -n 328 "$selector" | sha256sum | awk '{print $1}')" = "$SELECTOR_328_SHA256"

          # Static routing only: derive TEST identities from the source files owned
          # by packaged CMake test targets. No generated binary discovery is run.
          python3 - "$GITHUB_WORKSPACE" "$selector" "$result_dir/route.tsv" <<'PY'
          from pathlib import Path
          import collections, re, sys
          root = Path(sys.argv[1])
          selector = Path(sys.argv[2])
          output = Path(sys.argv[3])
          cmake = (root / "cmake/DirectionalTests.cmake").read_text()
          producer_match = re.search(
              r"set\(DIRECTIONAL_SURFACE_CELL_PRODUCER_TEST_SOURCES\s*(.*?)\)",
              cmake, re.S)
          if producer_match is None:
              raise SystemExit("producer source set missing")
          producer_sources = re.findall(
              r"(?:tests|src/bench)/[^\s\)]+\.cpp", producer_match.group(1))
          target_sources = {
              "directional_surface_cell_producer_tests": producer_sources,
              "directional_surface_cell_authority_kernel_tests": [
                  "tests/FieldTransportAtlasTests.cpp",
                  "tests/SurfaceCellAuthorityKernelTests.cpp",
              ],
              "directional_surface_cell_completion_tests": [
                  "tests/FlowRepStrandsPhase15Tests.cpp",
                  "tests/PatchDescriptorMilestoneETests.cpp",
                  "tests/PureQuadCompletionPhase18Tests.cpp",
                  "tests/SurfaceArrangementRowIdentityTests.cpp",
                  "tests/SurfaceComplexSimplificationPhase17Tests.cpp",
              ],
              "directional_surface_cell_validation_tests": [
                  "tests/SourceAuthoritativeMeshValidatorPhase22Tests.cpp",
                  "tests/SurfaceMeshOptimizerPhase19Tests.cpp",
                  "tests/SurfaceMeshOptimizerPhase20Tests.cpp",
                  "tests/SurfaceMeshOptimizerPhase21Tests.cpp",
                  "tests/SurfaceMeshOptimizerPhase22Tests.cpp",
              ],
              "directional_compiled_api_tests": ["tests/CompiledLibraryTests.cpp"],
          }
          pattern = re.compile(
              r"\bTEST(?:_F|_P)?\s*\(\s*([A-Za-z_][A-Za-z0-9_]*)\s*,\s*([A-Za-z_][A-Za-z0-9_]*)\s*\)",
              re.S)
          owners = collections.defaultdict(set)
          for target, paths in target_sources.items():
              for rel in paths:
                  text = (root / rel).read_text(errors="replace")
                  for suite, name in pattern.findall(text):
                      owners[f"{suite}.{name}"].add(target)
          identities = [line.strip() for line in selector.read_text().splitlines()
                        if line.strip()]
          rows = []
          for ordinal, identity in enumerate(identities, 1):
              candidates = owners.get(identity, set())
              if len(candidates) != 1:
                  raise SystemExit(
                      f"static route failure ordinal={ordinal} identity={identity} owners={sorted(candidates)}")
              rows.append(f"{ordinal}\t{identity}\t{next(iter(candidates))}")
          for identity in (
              "ResolvedBranchCorrection.NetworkDiagnosticsContainNoControlCharactersForAnyCode",
              "ResolvedBranchCorrection.TracingPathNeverPublishesSeedIdentityAsFailureLocus",
              "ResolvedBranchCorrection.PrescribedSphereA2aOutcomeIsAlwaysPublishedNonGating",
          ):
              if owners.get(identity) != {"directional_surface_cell_producer_tests"}:
                  raise SystemExit(f"supplemental route failure identity={identity} owners={sorted(owners.get(identity, set()))}")
          output.write_text("\n".join(rows) + "\n")
          counts = collections.Counter(row.rsplit("\t", 1)[1] for row in rows)
          print("static_route_count=338")
          for target in sorted(counts):
              print(f"static_route_{target}={counts[target]}")
          PY

          for target in directional_surface_cell_producer_tests \
                        directional_surface_cell_authority_kernel_tests \
                        directional_surface_cell_completion_tests \
                        directional_surface_cell_validation_tests; do
            test -x "$package_dir/bin/$target"
          done

          (
            cd "$package_dir"
            find . -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > "$result_dir/package-files-pre.sha256"
          )
          (
            cd "$GITHUB_WORKSPACE"
            find . -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > "$result_dir/source-files-pre.sha256"
            find benchmarks/fixtures -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > "$result_dir/fixtures-pre.sha256"
          )
          sha256sum "$selector" > "$result_dir/selector-pre.sha256"
          sha256sum "$package_dir/bin/directional_surface_cell_producer_tests" > "$result_dir/producer-executable-pre.sha256"

          printf '%s\n' \
            "package_zip=$package_zip" \
            "package_dir=$package_dir" \
            "result_dir=$result_dir" \
            "selector=$selector" > "${RUNNER_TEMP}/tb-r4-paths.env"
          echo "preflight=PASS"

      - name: Execute frozen 338 gate, F3, G5, and creditable Q8 evaluation
        shell: bash
        run: |
          set -uo pipefail
          log="${RUNNER_TEMP}/m3-cp4c0-tb-r4-activity.log"
          exec > >(tee -a "$log") 2>&1
          source "${RUNNER_TEMP}/tb-r4-paths.env"
          ledger="$result_dir/gate-ledger.tsv"
          f3ledger="$result_dir/f3-ledger.tsv"
          : > "$ledger"
          : > "$f3ledger"
          printf 'ordinal\tidentity\ttarget\texit_code\tselected\tfailures\terrors\telapsed_ms\tcrediting\tstatus\n' >> "$ledger"
          printf 'identity\texit_code\tselected\tfailures\terrors\telapsed_ms\tstatus\n' >> "$f3ledger"

          first_red=0
          passed=0
          orchestration_errors=0
          prefix316_passed=0
          prefix328_passed=0

          while IFS=$'\t' read -r ordinal identity target; do
            case_log="$result_dir/identity-results/$(printf '%03d' "$ordinal").log"
            case_json="$result_dir/identity-results/$(printf '%03d' "$ordinal").json"
            start_ms="$(date +%s%3N)"
            set +e
            "$package_dir/bin/$target" \
              --gtest_color=no \
              --gtest_filter="$identity" \
              --gtest_output="json:$case_json" 2>&1 \
              | tee "$case_log" | tee -a "$log"
            rc=${PIPESTATUS[0]}
            set -e
            end_ms="$(date +%s%3N)"
            elapsed_ms=$((end_ms - start_ms))
            selected=0
            failures=0
            errors=0
            if [ -f "$case_json" ]; then
              selected="$(jq -r '.tests // 0' "$case_json" 2>/dev/null || echo 0)"
              failures="$(jq -r '.failures // 0' "$case_json" 2>/dev/null || echo 0)"
              errors="$(jq -r '.errors // 0' "$case_json" 2>/dev/null || echo 0)"
            fi
            status=RED
            if [ "$selected" -ne 1 ]; then
              status=ORCHESTRATION_RED
              orchestration_errors=$((orchestration_errors + 1))
            elif [ "$rc" -eq 0 ] && [ "$failures" -eq 0 ] && [ "$errors" -eq 0 ]; then
              status=PASS
              passed=$((passed + 1))
              if [ "$ordinal" -le 316 ]; then prefix316_passed=$((prefix316_passed + 1)); fi
              if [ "$ordinal" -le 328 ]; then prefix328_passed=$((prefix328_passed + 1)); fi
            fi
            if [ "$status" != PASS ] && [ "$first_red" -eq 0 ]; then first_red="$ordinal"; fi
            crediting=true
            if [ "$first_red" -ne 0 ] && [ "$ordinal" -gt "$first_red" ]; then crediting=false; fi
            printf '%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\n' \
              "$ordinal" "$identity" "$target" "$rc" "$selected" "$failures" "$errors" \
              "$elapsed_ms" "$crediting" "$status" >> "$ledger"
            echo "gate_identity ordinal=$ordinal status=$status crediting=$crediting identity=$identity"
          done < "$result_dir/route.tsv"

          gate_status=RED
          if [ "$orchestration_errors" -gt 0 ]; then
            gate_status=ORCHESTRATION_RED
          elif [ "$passed" -eq 338 ]; then
            gate_status=PASS
          fi

          f3_passed=0
          for identity in "$F3_A" "$F3_B"; do
            safe="$(echo "$identity" | tr '.:' '__')"
            case_log="$result_dir/supplementals/${safe}.log"
            case_json="$result_dir/supplementals/${safe}.json"
            start_ms="$(date +%s%3N)"
            set +e
            "$package_dir/bin/directional_surface_cell_producer_tests" \
              --gtest_color=no \
              --gtest_filter="$identity" \
              --gtest_output="json:$case_json" 2>&1 \
              | tee "$case_log" | tee -a "$log"
            rc=${PIPESTATUS[0]}
            set -e
            end_ms="$(date +%s%3N)"
            elapsed_ms=$((end_ms - start_ms))
            selected=0; failures=0; errors=0
            if [ -f "$case_json" ]; then
              selected="$(jq -r '.tests // 0' "$case_json" 2>/dev/null || echo 0)"
              failures="$(jq -r '.failures // 0' "$case_json" 2>/dev/null || echo 0)"
              errors="$(jq -r '.errors // 0' "$case_json" 2>/dev/null || echo 0)"
            fi
            status=RED
            if [ "$selected" -ne 1 ]; then
              status=ORCHESTRATION_RED
              orchestration_errors=$((orchestration_errors + 1))
            elif [ "$rc" -eq 0 ] && [ "$failures" -eq 0 ] && [ "$errors" -eq 0 ]; then
              status=PASS
              f3_passed=$((f3_passed + 1))
            fi
            printf '%s\t%s\t%s\t%s\t%s\t%s\t%s\n' \
              "$identity" "$rc" "$selected" "$failures" "$errors" "$elapsed_ms" "$status" >> "$f3ledger"
            echo "f3_identity status=$status identity=$identity"
          done

          g5_log="$result_dir/g5.log"
          g5_json="$result_dir/g5.json"
          start_ms="$(date +%s%3N)"
          set +e
          "$package_dir/bin/directional_surface_cell_producer_tests" \
            --gtest_color=no \
            --gtest_filter="$G5_IDENTITY" \
            --gtest_output="json:$g5_json" 2>&1 \
            | tee "$g5_log" | tee -a "$log"
          g5_rc=${PIPESTATUS[0]}
          set -e
          end_ms="$(date +%s%3N)"
          g5_elapsed_ms=$((end_ms - start_ms))
          g5_selected=0; g5_failures=0; g5_errors=0
          if [ -f "$g5_json" ]; then
            g5_selected="$(jq -r '.tests // 0' "$g5_json" 2>/dev/null || echo 0)"
            g5_failures="$(jq -r '.failures // 0' "$g5_json" 2>/dev/null || echo 0)"
            g5_errors="$(jq -r '.errors // 0' "$g5_json" 2>/dev/null || echo 0)"
          fi
          g5_status=RED
          if [ "$g5_selected" -ne 1 ]; then
            g5_status=ORCHESTRATION_RED
            orchestration_errors=$((orchestration_errors + 1))
          elif [ "$g5_rc" -eq 0 ] && [ "$g5_failures" -eq 0 ] && [ "$g5_errors" -eq 0 ]; then
            g5_status=PASS
          fi
          g5_output="$(grep 'm3Cp4c0G5' "$g5_log" | tail -n 1 || true)"
          if [ -z "$g5_output" ]; then
            g5_status=ORCHESTRATION_RED
            orchestration_errors=$((orchestration_errors + 1))
          fi
          printf '%s\n' "$g5_output" > "$result_dir/g5-outcome.txt"
          printf 'identity=%s\ncredit=none\nowningMeasure=G5\nexit_code=%s\nselected=%s\nfailures=%s\nerrors=%s\nelapsed_ms=%s\nstatus=%s\n' \
            "$G5_IDENTITY" "$g5_rc" "$g5_selected" "$g5_failures" "$g5_errors" "$g5_elapsed_ms" "$g5_status" \
            > "$result_dir/g5-summary.txt"
          echo "g5_status=$g5_status"
          echo "g5_output=$g5_output"

          q8_creditable=false
          q8_status=NOT_RUN
          q8_reason='precondition_not_green'
          if [ "$gate_status" = PASS ] && [ "$f3_passed" -eq 2 ] && [ "$orchestration_errors" -eq 0 ]; then
            q8_creditable=true
            q8_status=RED
            q8_reason='sphere_network_not_published'
            if [[ "$g5_output" == *';fieldAlignedCurveNetwork=true;'* ]]; then
              trace_count="$(printf '%s\n' "$g5_output" | sed -n 's/.*;traceCount=\([0-9][0-9]*\).*/\1/p')"
              intersection_count="$(printf '%s\n' "$g5_output" | sed -n 's/.*TraceIntersection=\([0-9][0-9]*\).*/\1/p')"
              t1_status="$(awk -F '\t' -v id="$T1_IDENTITY" '$2==id {print $10}' "$ledger")"
              if [ "$trace_count" = 24 ] && [ -n "$intersection_count" ] && \
                 [ "$intersection_count" -gt 0 ] && [ "$t1_status" = PASS ]; then
                q8_status=PASS
                q8_reason='all_frozen_criteria_satisfied;torus_mechanical_carried_unchanged'
              elif [ "$trace_count" != 24 ]; then
                q8_reason="sphere_trace_count_${trace_count:-missing}_expected_24"
              elif [ -z "$intersection_count" ] || [ "$intersection_count" -eq 0 ]; then
                q8_reason='sphere_terminal_trace_intersection_missing'
              else
                q8_reason='frozen_crossover_identity_not_green'
              fi
            fi
          fi
          printf 'creditable=%s\nstatus=%s\nreason=%s\ncriterion1_prefix316=%s/316\ncriterion5=carried-unchanged-not-rerun\n' \
            "$q8_creditable" "$q8_status" "$q8_reason" "$prefix316_passed" > "$result_dir/q8.txt"

          printf '%s\n' \
            "gate_status=$gate_status" \
            "required=338" \
            "executed=338" \
            "passed=$passed" \
            "first_red_ordinal=$first_red" \
            "prefix316_passed=$prefix316_passed" \
            "prefix328_passed=$prefix328_passed" \
            "f3_executed=2" \
            "f3_passed=$f3_passed" \
            "g5_status=$g5_status" \
            "q8_creditable=$q8_creditable" \
            "q8_status=$q8_status" \
            "q8_reason=$q8_reason" \
            "orchestration_errors=$orchestration_errors" \
            "fresh_processes=341" > "$result_dir/runtime-summary.env"

      - name: Verify post-runtime immutability and write result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/m3-cp4c0-tb-r4-activity.log"
          exec > >(tee -a "$log") 2>&1
          if [ ! -f "${RUNNER_TEMP}/tb-r4-paths.env" ]; then
            echo "postflight=NOT_AVAILABLE_PREFLIGHT_FAILED"
            exit 0
          fi
          source "${RUNNER_TEMP}/tb-r4-paths.env"
          source "$result_dir/runtime-summary.env"

          (
            cd "$package_dir"
            sha256sum -c SHA256SUMS | tee "$result_dir/manifest-post.txt"
            find . -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > "$result_dir/package-files-post.sha256"
          )
          (
            cd "$GITHUB_WORKSPACE"
            find . -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > "$result_dir/source-files-post.sha256"
            find benchmarks/fixtures -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > "$result_dir/fixtures-post.sha256"
          )
          sha256sum "$selector" > "$result_dir/selector-post.sha256"
          sha256sum "$package_dir/bin/directional_surface_cell_producer_tests" > "$result_dir/producer-executable-post.sha256"

          cmp "$result_dir/package-files-pre.sha256" "$result_dir/package-files-post.sha256"
          cmp "$result_dir/source-files-pre.sha256" "$result_dir/source-files-post.sha256"
          cmp "$result_dir/fixtures-pre.sha256" "$result_dir/fixtures-post.sha256"
          cmp "$result_dir/selector-pre.sha256" "$result_dir/selector-post.sha256"
          cmp "$result_dir/producer-executable-pre.sha256" "$result_dir/producer-executable-post.sha256"
          test "$(sha256sum "$package_zip" | awk '{print $1}')" = "$PACKAGE_SHA256"

          first_red_identity='none'
          if [ "$first_red" -gt 0 ]; then
            first_red_identity="$(awk -F '\t' -v n="$first_red" 'NR>1 && $1==n {print $2}' "$result_dir/gate-ledger.tsv")"
          fi
          g5_output="$(cat "$result_dir/g5-outcome.txt")"

          jq -n \
            --arg turn "M3-CP4c-0-TB-R4" \
            --arg semanticSource "$SEMANTIC_SOURCE_SHA" \
            --arg workflowControlSha "$GITHUB_SHA" \
            --arg runId "$GITHUB_RUN_ID" \
            --arg packageArtifactId "$PACKAGE_ARTIFACT_ID" \
            --arg packageSha256 "$PACKAGE_SHA256" \
            --arg sourceArchiveSha256 "$SOURCE_ARCHIVE_SHA256" \
            --arg selectorSha256 "$SELECTOR_SHA256" \
            --arg selector316Sha256 "$SELECTOR_316_SHA256" \
            --arg selector328Sha256 "$SELECTOR_328_SHA256" \
            --arg gate "$gate_status" \
            --arg firstRedIdentity "$first_red_identity" \
            --arg g5Outcome "$g5_output" \
            --arg q8Status "$q8_status" \
            --arg q8Reason "$q8_reason" \
            --argjson required 338 \
            --argjson executed 338 \
            --argjson passed "$passed" \
            --argjson firstRedOrdinal "$first_red" \
            --argjson prefix316Passed "$prefix316_passed" \
            --argjson prefix328Passed "$prefix328_passed" \
            --argjson f3Executed 2 \
            --argjson f3Passed "$f3_passed" \
            --argjson orchestrationErrors "$orchestration_errors" \
            --argjson q8Creditable "$q8_creditable" \
            '{
              turn: $turn,
              semanticSource: $semanticSource,
              workflowControlSha: $workflowControlSha,
              runId: ($runId|tonumber),
              packageArtifactId: ($packageArtifactId|tonumber),
              packageSha256: $packageSha256,
              sourceArchiveSha256: $sourceArchiveSha256,
              selector: {required:$required, executed:$executed, passed:$passed, sha256:$selectorSha256,
                         first316Sha256:$selector316Sha256, first328Sha256:$selector328Sha256,
                         prefix316Passed:$prefix316Passed, prefix328Passed:$prefix328Passed,
                         firstRedOrdinal:$firstRedOrdinal, firstRedIdentity:$firstRedIdentity, gate:$gate},
              supplementalF3: {executed:$f3Executed, passed:$f3Passed},
              g5: {credit:"none", owningMeasure:"G5", outcome:$g5Outcome},
              q8: {creditable:$q8Creditable, status:$q8Status, reason:$q8Reason},
              orchestrationErrors:$orchestrationErrors,
              packageMutation:false, sourceMutation:false, testMutation:false, fixtureMutation:false,
              selectorMutation:false, configure:false, compile:false, relink:false, repair:false,
              generatedDiscovery:false, performanceBenchmark:false,
              postflight:"PASS"
            }' > "$result_dir/result.json"

          echo "postflight=PASS"
          cat "$result_dir/result.json"
          echo "finished_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"

      - name: Upload TB-R4 result evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-cp4c0-tb-r4-result-${{ github.run_id }}
          path: ${{ runner.temp }}/m3-cp4c0-tb-r4-result
          if-no-files-found: error
          retention-days: 7

      - name: Upload TB-R4 diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-cp4c0-tb-r4-log-${{ github.run_id }}
