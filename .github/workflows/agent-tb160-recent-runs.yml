name: TB160 Temporary Run Discovery

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/recent-runs/tb160-20261122-0337.txt

permissions:
  actions: read
  contents: write

jobs:
  validate:
    permissions:
      contents: read
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/agent-tb160-recent-runs.yml
      source_ref: ${{ github.sha }}

  inventory:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-recent-workflow-runs-reusable.yml
    with:
      per_page: 100
      max_pages: 2
      branch: agent/surface_cell_quad/p5-recover-bridge-healing
      event: push
      created: '2026-11-22'
      retention_days: 7
    secrets: inherit

  mailbox:
    if: ${{ always() }}
    needs: [inventory]
    permissions:
      actions: read
      contents: write
    uses: ./.github/workflows/workflow-mailbox-publisher.yml
    with:
      mailbox_branch: workflow-mailbox
      workflow_key: m6-cp3-tb160-run-discovery
      source_sha: ${{ github.sha }}
      source_ref: ${{ github.ref }}
      result: ${{ needs.inventory.result }}
      summary: One-time TB160 cancelled-or-pending dispatcher census inventory.
