name: M3 CP4c0 R10 Closeout Docs Apply

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m3-cp4c0-r10-closeout/run.txt

permissions:
  actions: read
  contents: write
  id-token: write
  issues: write
  pull-requests: write

concurrency:
  group: m3-cp4c0-r10-closeout-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/agent-m3-cp4c0-r10-closeout-apply.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m3-cp4c0-r10-closeout
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  apply:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1mdqukH7gK3-PuEjm7myPcdWUHoE1y3NQ
      patch_sha256: 9671d4a41ee82e7e73f4e6f5b4d533ecc1df6d16573aa328d831201a56857f44
      base_sha: eac5c736bf54fb5b2e1065e0071fb63d7fdc9f3f
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: 'docs: close CB-R10 and focused TB-R10 GMP correction'
      retention_days: 7
    secrets: inherit
