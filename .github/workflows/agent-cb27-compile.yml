name: Agent CB27 Compile

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/cb27-compile/**

permissions:
  contents: write
  actions: write
  issues: write
  pull-requests: write

concurrency:
  group: cb27-compile-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/agent-cb27-compile.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: cb27-compile
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  compile:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-compile-reusable.yml
    with:
      source_sha: 30d52522045588b8f970524e999cc34907533eb9
      targets: directional_core directional_pipeline directional_surface_cell_authority_kernel_tests directional_surface_cell_producer_tests directional_surface_cell_completion_tests directional_surface_cell_validation_tests directional_compiled_api_tests directional_benchmarks
      artifact_prefix: m3-cp4c3-cb27-compile
    secrets: inherit
