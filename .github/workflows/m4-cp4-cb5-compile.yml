name: M4 CP4 CB5 Compile

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m4-cp4-cb5/validate-compile-caller.txt
      - .agents/connector-triggers/m4-cp4-cb5/compile.txt

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: m4-cp4-cb5-compile-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/m4-cp4-cb5-compile.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m4-cp4-cb5-compile
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  compile:
    needs: validate
    if: "${{ startsWith(github.event.head_commit.message, 'M4-CP4-CB5: compile') && needs.validate.outputs.valid == 'true' }}"
    uses: ./.github/workflows/agent-compile-reusable.yml
    with:
      source_sha: 4e9ff5003c8dd165dd614c25dd95f0308403719b
      targets: directional_surface_cell_completion_tests directional_surface_cell_authority_kernel_tests
      artifact_prefix: m4-cp4-cb5-compile
