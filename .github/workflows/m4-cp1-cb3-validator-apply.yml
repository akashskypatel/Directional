name: M4 CP1 CB3 Validator Apply

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m4-cp1-cb3-validator-apply-20260910.txt

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

concurrency:
  group: m4-cp1-cb3-validator-apply-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/m4-cp1-cb3-validator-apply.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m4-cp1-cb3-validator-apply
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  apply:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1pcWQKHuf9OhnJdpRKZjNvQuevc8MxqdO
      patch_sha256: 'b424aec8a7b6a78e8e7928a80bccf1d91c4bd6365e8c20fa3031639fdc5f135d'
      base_sha: 80ef37d29aa2e9dcdde44b72b5efbc7a046fa146
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: 'fix: harden M4 CP1 independent conformity validation'
      retention_days: 14
    secrets: inherit
