name: Agent TB43 REV Drive Apply

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/drive-apply/tb43-rev-closeout-20260908.txt

permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

concurrency:
  group: agent-tb43-rev-drive-apply
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/agent-tb43-rev-drive-apply.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: tb43-rev-drive-apply
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  apply:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' && contains(github.event.head_commit.message, '[apply]') }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1MoTdVc0Od5WdVxeLQfzRiFiGc57zi_ay
      patch_sha256: cc9182b79dacfdd142c440e891bb8bc6ab9290f02b0c7e3a0eb862d0cd39b4c5
      base_sha: 1cdceef7d4c76bd8af20d682a52051efe6f7cfca
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: "docs: adjudicate TB43 and freeze CB49"
    secrets: inherit
