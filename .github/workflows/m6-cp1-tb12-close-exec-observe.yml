name: M6 CP1 TB12 Close Exec Observe

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m6-cp1-tb12-close-exec-observe.txt

permissions:
  actions: read
  contents: write

concurrency:
  group: m6-cp1-tb12-close-exec-observe-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/m6-cp1-tb12-close-exec-observe.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  validate_runtime:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/m6-cp1-tb12-close-exec.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  observe:
    needs: [validate, validate_runtime]
    if: ${{ needs.validate.outputs.valid == 'true' && needs.validate_runtime.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-recent-workflow-runs-reusable.yml
    with:
      per_page: 100
      max_pages: 1
      branch: agent/surface_cell_quad/p5-recover-bridge-healing
      event: push
      created: ">=2026-10-05"
    secrets: inherit

  mailbox:
    if: ${{ always() }}
    needs: [observe]
    uses: ./.github/workflows/workflow-mailbox-publisher.yml
    with:
      workflow_key: m6-cp1-tb12-close-exec-observe
      source_sha: ${{ github.sha }}
      source_ref: ${{ github.ref }}
      result: ${{ needs.observe.result }}
      summary: Observe current branch Actions runs for active M6-CP1-TB12-CLOSE-EXEC without retriggering it.
