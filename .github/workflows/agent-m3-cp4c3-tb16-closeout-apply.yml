      pr_number: 8
      label: m3-cp4c3-tb16-closeout-apply
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  apply:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 12vBFlItPqtlWIuTnUJuXneVaRLkmI6z3
      patch_sha256: bf06c54c3e512b219d1f600ece6d271cc1df3105538447d66bf482b73cb948be
