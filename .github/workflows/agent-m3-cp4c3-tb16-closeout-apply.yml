      - .agents/connector-triggers/google-drive/m3-cp4c3-tb16-closeout-apply-20260903.txt

permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

concurrency:
  group: agent-m3-cp4c3-tb16-closeout-apply
  cancel-in-progress: false

jobs:
