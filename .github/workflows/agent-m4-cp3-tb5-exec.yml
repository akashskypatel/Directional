name: Agent M4 CP3 TB5 EXEC

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/tb/m4-cp3-tb5/**

permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: agent-m4-cp3-tb5-exec-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/agent-m4-cp3-tb5-exec.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m4-cp3-tb5-exec
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  execute:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      TURN_ID: M4-CP3-TB5-EXEC
      ARTIFACT_ID: '10293750596'
      EXPECTED_ARTIFACT_NAME: m4-cp3-cb7-result-34678708800
      EXPECTED_PROVIDER_DIGEST: sha256:f95decac9b059bcc7c7b341ecda1e95e8a5b0028211eaa7f902144a196c60831
      EXPECTED_ZIP_SHA256: f95decac9b059bcc7c7b341ecda1e95e8a5b0028211eaa7f902144a196c60831
    steps:
      - name: Initialize diagnostic log
        shell: bash
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/m4-cp3-tb5-exec-workflow.log"
          : > "$log"
          {
            echo "workflow=${GITHUB_WORKFLOW}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "event=${GITHUB_EVENT_NAME}"
            echo "event_sha=${GITHUB_SHA}"
            echo "repository=${GITHUB_REPOSITORY}"
            echo "runner_os=${RUNNER_OS}"
            echo "turn_id=${TURN_ID}"
            echo "artifact_id=${ARTIFACT_ID}"
            echo "started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } | tee -a "$log"

      - name: Checkout exact execution control source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          submodules: false
          lfs: false

      - name: Execute frozen artifact-only TB5 gate
        id: exec
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set +e
          harness=".agents/Directional/turn-payloads/m4-cp3-tb5-exec-harness.sh"
          test -f "$harness" || exit 91
          chmod +x "$harness"
          "$harness"
          status=$?
          echo "exit_code=${status}" >> "$GITHUB_OUTPUT"
          echo "harness_exit=${status}" | tee -a "${RUNNER_TEMP}/m4-cp3-tb5-exec-workflow.log"
          exit 0

      - name: Upload TB5 result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m4-cp3-tb5-result-${{ github.run_id }}
          path: ${{ runner.temp }}/M4-CP3-TB5-EXEC-result
          if-no-files-found: error
          retention-days: 7

      - name: Upload TB5 diagnostic log
        if: always()
        shell: bash
        run: |
          set +e
          cp "${RUNNER_TEMP}/M4-CP3-TB5-EXEC.log" "${RUNNER_TEMP}/m4-cp3-tb5-harness.log" 2>/dev/null || true
          {
            echo "harness_exit=${{ steps.exec.outputs.exit_code }}"
            echo "final_job_status=${{ job.status }}"
            echo "finished_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } | tee -a "${RUNNER_TEMP}/m4-cp3-tb5-exec-workflow.log"

      - name: Upload workflow and harness logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m4-cp3-tb5-log-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/m4-cp3-tb5-exec-workflow.log
            ${{ runner.temp }}/m4-cp3-tb5-harness.log
          if-no-files-found: warn
          retention-days: 7

      - name: Propagate TB5 execution status
        if: always()
        shell: bash
        run: |
          code='${{ steps.exec.outputs.exit_code }}'
          test -n "$code" || exit 92
          exit "$code"
