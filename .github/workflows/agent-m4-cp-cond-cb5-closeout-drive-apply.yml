name: Agent M4 CP-COND CB5 Closeout Drive Apply

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m4-cp-cond-cb5-closeout-drive-apply-20260913.txt

permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

concurrency:
  group: agent-m4-cp-cond-cb5-closeout-drive-apply-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/agent-m4-cp-cond-cb5-closeout-drive-apply.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m4-cp-cond-cb5-closeout-drive-apply
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  apply-drive-patch:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 14jMKcalFifZtbPVGGO50aR7E-yKN-tXU
      patch_sha256: '86c6b7494038c553232a697d9fbd5f9af3a79a786154611ca5fa8f8b5cec45bf'
      base_sha: 37285b545c110a95996a05a112ac5ac6e44332e5
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: 'docs: close M4-CP-COND-CB5 and freeze TB5'
      retention_days: 14
    secrets: inherit
