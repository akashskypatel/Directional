name: M5 CP3 CB17 Drive Apply

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m5-cp3-cb17-drive-apply.txt

permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

concurrency:
  group: m5-cp3-cb17-drive-apply
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/m5-cp3-cb17-drive-apply.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m5-cp3-cb17-drive-apply
      commit_run_file: false
    secrets: inherit

  apply:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1dzTFmnxSNzHKXiAvQRPeHubVZxO2Od9Y
      patch_sha256: 13cbee5aef8de0eb2d16520c7d2186a469779bdd10d4236f20a8578a5c17cb82
      base_sha: bc6d10e52b25bb99b653be8a2512ba9ed3963a0d
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: 'M5-CP3-CB17: apply relation-frame gauge cutover'
      retention_days: 14
    secrets: inherit
