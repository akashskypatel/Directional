name: M3 CP4c3 CB52 Preflight

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/cb52-preflight/cb52-preflight-20260909.txt

permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: m3-cp4c3-cb52-preflight
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/m3-cp4c3-cb52-preflight.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m3-cp4c3-cb52-preflight
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  preflight:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Initialize persistent log
        shell: bash
        run: |
          set -euo pipefail
          : > "$RUNNER_TEMP/cb52-preflight-workflow.log"
          printf '%s\n' 'turn=M3-CP4c-3-CB52' 'runtimeExecution=false' | tee -a "$RUNNER_TEMP/cb52-preflight-workflow.log"

      - name: Checkout control source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          submodules: false
          lfs: false

      - name: Probe bootstrap and run immutable preflight
        env:
          GH_TOKEN: ${{ github.token }}
          TURN_ID: M3-CP4c-3-CB52
          ARTIFACT_ID: '10112532452'
          EXPECTED_ARTIFACT_NAME: m3-cp4c3-cb51-package111-result-34372482691
          EXPECTED_PROVIDER_DIGEST: sha256:62ae325186ef31d2936e1a797c55cef43f8aef62449b33a26e29cb1ecd9185da
          EXPECTED_ZIP_SHA256: 62ae325186ef31d2936e1a797c55cef43f8aef62449b33a26e29cb1ecd9185da
          EXPECTED_SOURCE_SHA: 4f0663ef3468996abce6f59109f1c67f5be5f604
          SELECTOR_RELATIVE_PATH: .agents/Directional/Architecture_M3_CP4c3_Required_Green_Selector_409.txt
          EXPECTED_SELECTOR_COUNT: '409'
          EXPECTED_SELECTOR_SHA256: eea6d8c2bbc8e9247deb4bfbbe6763042c76002d1894dd62e35f80262403b53e
          ACCEPTED_PREFIX_COUNT: '365'
          EXPECTED_HARNESS_SHA256: aaadab351c0ba28a39c87eff1948f83ab0c4c71520662177e5cdf6fd08b30ed3
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/cb52-preflight-workflow.log"
          exec > >(tee -a "$log") 2>&1
          required=(GITHUB_REPOSITORY GITHUB_RUN_ID GH_TOKEN TURN_ID ARTIFACT_ID EXPECTED_ARTIFACT_NAME EXPECTED_PROVIDER_DIGEST EXPECTED_ZIP_SHA256 EXPECTED_SOURCE_SHA SELECTOR_RELATIVE_PATH EXPECTED_SELECTOR_COUNT EXPECTED_SELECTOR_SHA256 ACCEPTED_PREFIX_COUNT RUNNER_TEMP)
          for name in "${required[@]}"; do
            [[ -v "$name" && -n "${!name}" ]] || { echo "presence_${name}=no"; exit 70; }
            echo "presence_${name}=yes"
          done
          [[ -d "$RUNNER_TEMP" && -w "$RUNNER_TEMP" ]] || { echo 'runner_temp_writable=no'; exit 71; }
          echo 'runner_temp_writable=yes'
          safe_turn="$(printf '%s' "$TURN_ID" | tr -c 'A-Za-z0-9._-' '-')"
          mkdir -p "$RUNNER_TEMP/$safe_turn"
          test -w "$RUNNER_TEMP/$safe_turn"
          echo 'safe_turn_path_writable=yes'
          harness=.agents/Directional/tools/m3_cp4c3_artifact_only_harness.sh
          bash -n "$harness"
          actual="$(sha256sum "$harness" | awk '{print $1}')"
          echo "harness_sha256=$actual"
          [[ "$actual" == "$EXPECTED_HARNESS_SHA256" ]]
          if bash "$harness" --preflight-only; then rc=0; else rc=$?; fi
          echo "harness_exit=$rc"
          echo "$rc" > "$RUNNER_TEMP/cb52-preflight-exit.txt"
          exit "$rc"

      - name: Verify runtime-free boundary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          boundary="$RUNNER_TEMP/M3-CP4c-3-CB52-result/execution-boundary.txt"
          test -f "$boundary"
          grep -Fxq 'script_exit=0' "$boundary"
          grep -Fxq 'mode=--preflight-only' "$boundary"
          grep -Fxq 'runtime_started=false' "$boundary"
          grep -Fxq 'runtime_completed=false' "$boundary"
          grep -Fxq 'preflight_completed=true' "$boundary"
          grep -Fxq 'execution_view_verified=true' "$boundary"
          grep -Fxq 'orchestration_failure=false' "$boundary"
          grep -Fxq 'benchmark_execution=false' "$boundary"
          grep -Fxq 'configure_execution=false' "$boundary"
          grep -Fxq 'compile_execution=false' "$boundary"
          grep -Fxq 'relink_execution=false' "$boundary"
          grep -Fxq 'generated_discovery=false' "$boundary"
          grep -Fxq 'package_repair=false' "$boundary"
          grep -Fxq 'mode_repair=false' "$boundary"
          grep -Fxq 'source_test_fixture_selector_mutation=false' "$boundary"

      - name: Upload preflight result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-cp4c3-cb52-preflight-result-${{ github.run_id }}
          path: ${{ runner.temp }}/M3-CP4c-3-CB52-result
          if-no-files-found: error
          retention-days: 7

      - name: Upload persistent logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-cp4c3-cb52-preflight-log-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/M3-CP4c-3-CB52.log
            ${{ runner.temp }}/cb52-preflight-workflow.log
            ${{ runner.temp }}/cb52-preflight-exit.txt
          if-no-files-found: error
          retention-days: 7
