name: P13 Vase Review Authentic History Verification
on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/vase-review-history-20261101.txt
permissions:
  actions: read
  contents: write
concurrency:
  group: p13-vase-review-history-20261101
  cancel-in-progress: false
jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/agent-vase-review-history-20261101.yml
      source_ref: ${{ github.sha }}
  verify-history:
    needs: [validate]
    if: ${{ needs.validate.outputs.valid == 'true' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout authentic complete repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Run mandatory Review history checks
        shell: bash
        run: |
          set -uo pipefail
          log="${RUNNER_TEMP}/p13-vase-review-history.txt"
          {
            echo "event_sha=${GITHUB_SHA}"
            echo "checked_out=$(git rev-parse HEAD)"
            echo "shallow=$(git rev-parse --is-shallow-repository)"
            echo '--- boundary ---'
            python3 .agents/Directional/tools/review_check.py boundary
            b=$?
            echo "boundary_exit=${b}"
            echo '--- ledgers ---'
            python3 .agents/Directional/tools/review_check.py ledgers
            l=$?
            echo "ledgers_exit=${l}"
            echo '--- branch sync (runner detached HEAD expected) ---'
            git status -sb
            echo '--- source drift ---'
            git diff --name-only 0d3f6a67fdd35d96ab5c4c1350e6b8de90a16725 HEAD -- src include tests benchmarks CMakeLists.txt cmake
            echo "review_pass=$((b == 0 && l == 0))"
            test "$b" = 0 && test "$l" = 0
          } 2>&1 | tee "$log"
      - name: Upload history check report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p13-vase-review-history-${{ github.run_id }}
          path: ${{ runner.temp }}/p13-vase-review-history.txt
          if-no-files-found: error
          retention-days: 14
  mailbox:
    if: ${{ always() }}
    needs: [verify-history]
    uses: ./.github/workflows/workflow-mailbox-publisher.yml
    with:
      mailbox_branch: workflow-mailbox
      workflow_key: p13-vase-review-history
      source_sha: ${{ github.sha }}
      source_ref: ${{ github.ref }}
      result: ${{ needs.verify-history.result }}
      summary: Authentic Git history Review boundary and ledger verification; no Directional runtime.
