name: Agent R-A TB2 CB01-04 Docs

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/ra-tb2-cb-01-04-docs-20260812.txt

permissions:
  contents: write

concurrency:
  group: agent-ra-tb2-cb-01-04-docs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply-docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Initialize persistent activity log
        shell: bash
        run: |
          set -euo pipefail
          : > "$RUNNER_TEMP/activity.log"
          printf '%s\n' \
            "workflow=$GITHUB_WORKFLOW" \
            "run_id=$GITHUB_RUN_ID" \
            "event=$GITHUB_EVENT_NAME" \
            "ref=$GITHUB_REF" \
            'turnBoundary=Code+Build-documentation-closeout' \
            'runtimeExecution=false' \
            'task=apply durable R-A-TB2-CB-01 through CB-04 closeout documentation' \
            | tee -a "$RUNNER_TEMP/activity.log"

      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/surface_cell_quad/p5-recover-bridge-healing
          fetch-depth: 0

      - name: Verify authority and apply documentation patch
        shell: bash
        env:
          COMPILED_SOURCE_SHA: f6514a0f8496bd18aacfceb419e2e5ae5b3b6fae
          DOC_BASE_SHA: 7acce62bea52d8970d2eb056f2df63f3962d3696
          PATCH_SHA256: 5efc248a3c3e67ba3f5f75ce7092de9573b4ee321363b7a19a6fc2750f9769d8
        run: |
          set -euo pipefail
          exec > >(tee -a "$RUNNER_TEMP/activity.log") 2>&1
          trap 'rc=$?; echo "exit_code=$rc"; git status --porcelain=v1 || true; exit $rc' EXIT

          git merge-base --is-ancestor "$DOC_BASE_SHA" HEAD
          git diff --exit-code "$COMPILED_SOURCE_SHA"..HEAD -- \
            src include tests CMakeLists.txt cmake

          base64 -d .agents/Directional/turn-payloads/ra-tb2-cb-01-04-docs/patch.gz.b64 \
            > "$RUNNER_TEMP/patch.gz"
          gzip -dc "$RUNNER_TEMP/patch.gz" > "$RUNNER_TEMP/patch.diff"
          echo "$PATCH_SHA256  $RUNNER_TEMP/patch.diff" | sha256sum -c -
          if grep -Eq '^diff --git a/\.github/workflows/' "$RUNNER_TEMP/patch.diff"; then
            echo 'patch_contains_workflow_change=true'
            exit 1
          fi
          git apply --check "$RUNNER_TEMP/patch.diff"
          git apply "$RUNNER_TEMP/patch.diff"
          git diff --check

          git diff --name-only | sort > "$RUNNER_TEMP/changed-files.txt"
          cat > "$RUNNER_TEMP/expected-files.txt" <<'EOF'
          .agents/Directional/Architecture_M1_Single_Authority_Cutover_Code_Build_Plan.md
          .agents/Directional/CHANGELOG.md
          .agents/Directional/Future_Chat_Session_Handoff.md
          TODO.md
          EOF
          sort -o "$RUNNER_TEMP/expected-files.txt" "$RUNNER_TEMP/expected-files.txt"
          diff -u "$RUNNER_TEMP/expected-files.txt" "$RUNNER_TEMP/changed-files.txt"

          git config user.name 'Directional Agent'
          git config user.email 'directional-agent@users.noreply.github.com'
          git add TODO.md
          git add -f \
            .agents/Directional/Architecture_M1_Single_Authority_Cutover_Code_Build_Plan.md \
            .agents/Directional/CHANGELOG.md \
            .agents/Directional/Future_Chat_Session_Handoff.md
          git commit -m 'docs: close R-A retry2 Code Build turn'
          HANDOFF_SHA="$(git rev-parse HEAD)"
          printf '%s\n' \
            "handoff_commit=$HANDOFF_SHA" \
            "evidence_commit=$COMPILED_SOURCE_SHA" \
            'runtimeExecution=false' \
            > "$RUNNER_TEMP/result.txt"
          git push origin HEAD:agent/surface_cell_quad/p5-recover-bridge-healing
          git status --porcelain=v1 | tee "$RUNNER_TEMP/source-status-final.txt"
          test ! -s "$RUNNER_TEMP/source-status-final.txt"

      - name: Upload documentation result
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ra-tb2-cb-01-04-docs-result-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/result.txt
            ${{ runner.temp }}/changed-files.txt
            ${{ runner.temp }}/source-status-final.txt
          if-no-files-found: error
          retention-days: 7

      - name: Upload persistent activity log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ra-tb2-cb-01-04-docs-log-${{ github.run_id }}
          path: ${{ runner.temp }}/activity.log
          if-no-files-found: error
          retention-days: 7
