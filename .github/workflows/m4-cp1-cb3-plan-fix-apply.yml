name: M4 CP1 CB3 Plan Compile Fix Apply

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m4-cp1-cb3-plan-fix-apply-20260910.txt

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

concurrency:
  group: m4-cp1-cb3-plan-fix-apply-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/m4-cp1-cb3-plan-fix-apply.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m4-cp1-cb3-plan-fix-apply
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  apply:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1gcq-h__o3yhgiLF05GFU9YDaTU35M7TV
      patch_sha256: '61d1108e88a902e37b714ab6423ef3212aa9994e19b40e73849eca386e5cc765'
      base_sha: 05008f7ef6d54769464024301fd7baa9e2c04697
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: 'fix: resolve GlobalConformityPlan compile blockers'
      retention_days: 14
    secrets: inherit
