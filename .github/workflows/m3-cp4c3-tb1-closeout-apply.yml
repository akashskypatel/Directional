name: M3 CP4c3 TB1 Closeout Apply
on:
  push:
    branches: [agent/surface_cell_quad/p5-recover-bridge-healing]
    paths: [.agents/connector-triggers/m3-cp4c3-tb1-closeout-apply.txt]
permissions:
  actions: read
  contents: write
  id-token: write
  issues: write
  pull-requests: write
jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/m3-cp4c3-tb1-closeout-apply.yml
      source_ref: ${{ github.sha }}
    secrets: inherit
  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with: {pr_number: 8, label: m3-cp4c3-tb1-closeout-apply, commit_run_file: false}
    secrets: inherit
  apply:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 18Sb9pNaByH0SZqNPenb-HrXYy82iVY0a
      patch_sha256: 1862f5497497970275c6ac27bc2ec9a91d1ae3da8e4d23914a3eb244448da8a9
      base_sha: ac274d9a690d0309688cb897e9594b2717f6b43e
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: 'docs: close M3-CP4c-3-TB1 artifact-only evidence'
      retention_days: 7
    secrets: inherit
