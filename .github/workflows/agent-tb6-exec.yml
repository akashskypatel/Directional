name: Agent M4 CP SCALE TB6 Artifact-Only Execution

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/tb6-exec.txt

permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: agent-m4-cp-scale-tb6-exec-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/agent-tb6-exec.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m4-cp-scale-tb6-exec
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  execute:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CANDIDATE_ARTIFACT_ID: "10418328122"
      CANDIDATE_ARTIFACT_NAME: m4-cp-scale-cb7-result-35022869891
      CANDIDATE_PROVIDER_SHA256: a9f33bce6029022495fccbc4680da9bdd25cf41aa5cc733b2c04335e156ac16e
      SEMANTIC_SOURCE_SHA: 153047c3f92e9b9b784e11eaee1ede2de5628470
      SOURCE_ARCHIVE_SHA256: 703dcc22f18ed565b623ef4eb43e117cd8acfd5d982ed0bde111d5cfdd56e0ff
      PACKAGE_MANIFEST_SHA256: d5e2e620f3e5a9e78f4b646be95f872dd78ab8cbee7fe726156abf8249d6d5ad
      SELECTOR_SHA256: f202a1720c0a5288471d04836402b8432eb6f4f788da68a12e70dacb875466ca
      SELECTOR423_PREFIX_SHA256: 4e67e4dc6528a71e8399cd55dce6af4c6143e2502102e421b62a8eb712d89343
      FOCUSED_IDENTITY: M4CPScaleS3.ExactTraversalStateRepeatPublishesLimitCycleTermination
      FOCUSED_RECEIPT: m4CpScaleS3;exactRepeat=LimitCycleTermination;differentExactEntry=Advanced;loadBearingTamperCount=4;combinatorialRecurrence=TraceCombinatorialRecurrenceExceeded;stepBudget=TraceStepBudgetExhausted
    steps:
      - name: Initialize diagnostic log
        shell: bash
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/m4-cp-scale-tb6-exec.log"
          : > "$log"
          mkdir -p "${RUNNER_TEMP}/tb6-result"
          printf '%s\n' 'status=BLOCKED_PRE_RUNTIME' 'runtimeStarted=false' > "${RUNNER_TEMP}/tb6-result/final-status.txt"
          {
            echo "workflow=${GITHUB_WORKFLOW}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "event=${GITHUB_EVENT_NAME}"
            echo "event_sha=${GITHUB_SHA}"
            echo "ref=${GITHUB_REF}"
            echo "repository=${GITHUB_REPOSITORY}"
            echo "candidate_artifact_id=${CANDIDATE_ARTIFACT_ID}"
            echo "candidate_artifact_name=${CANDIDATE_ARTIFACT_NAME}"
            echo "candidate_provider_sha256=${CANDIDATE_PROVIDER_SHA256}"
            echo "semantic_source_sha=${SEMANTIC_SOURCE_SHA}"
            echo "selector_sha256=${SELECTOR_SHA256}"
            echo "runtime_boundary=Test+Benchmark runtime-only"
            echo "started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } | tee -a "$log"

      - name: Verify immutable artifact metadata
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/m4-cp-scale-tb6-exec.log"
          exec > >(tee -a "$log") 2>&1
          out="${RUNNER_TEMP}/tb6-evidence"
          mkdir -p "$out/preflight"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${CANDIDATE_ARTIFACT_ID}" > "$out/artifact-metadata.json"
          jq -e --argjson id "$CANDIDATE_ARTIFACT_ID" '.id == $id' "$out/artifact-metadata.json" >/dev/null
          jq -e --arg name "$CANDIDATE_ARTIFACT_NAME" '.name == $name' "$out/artifact-metadata.json" >/dev/null
          jq -e --arg digest "sha256:${CANDIDATE_PROVIDER_SHA256}" '.digest == $digest' "$out/artifact-metadata.json" >/dev/null
          jq -e '.expired == false' "$out/artifact-metadata.json" >/dev/null
          cat "$out/artifact-metadata.json"
          candidate_zip="${RUNNER_TEMP}/candidate-artifact.zip"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${CANDIDATE_ARTIFACT_ID}/zip" > "$candidate_zip"
          test "$(sha256sum "$candidate_zip" | awk '{print $1}')" = "$CANDIDATE_PROVIDER_SHA256"
          rm -rf "${RUNNER_TEMP}/immutable-package"
          mkdir -p "${RUNNER_TEMP}/immutable-package"
          unzip -q "$candidate_zip" -d "${RUNNER_TEMP}/immutable-package"
          echo "candidate_zip_sha256=$(sha256sum "$candidate_zip" | awk '{print $1}')"

      - name: Execute focused S3 gate and selector424
        id: runtime
        shell: bash
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/m4-cp-scale-tb6-exec.log"
          exec > >(tee -a "$log") 2>&1
          package="${RUNNER_TEMP}/immutable-package"
          evidence="${RUNNER_TEMP}/tb6-evidence"
          source_root="${RUNNER_TEMP}/semantic-source"
          execution="${RUNNER_TEMP}/execution-view"
          raw="$evidence/raw"
          resources="$evidence/resources"
          mkdir -p "$evidence/preflight" "$evidence/postflight" "$raw/focused" "$raw/selector" "$resources/focused" "$resources/selector"

          census_tree() {
            local root="$1" out="$2"
            python3 - "$root" "$out" <<'PY'
          import hashlib, os, pathlib, stat, sys
          root=pathlib.Path(sys.argv[1])
          out=pathlib.Path(sys.argv[2])
          rows=[]
          for p in sorted([root, *root.rglob('*')], key=lambda x: str(x.relative_to(root)) if x != root else ''):
              rel='.' if p == root else p.relative_to(root).as_posix()
              st=p.lstat()
              mode=f"{stat.S_IMODE(st.st_mode):04o}"
              if p.is_dir():
                  rows.append((rel,'directory',mode,str(st.st_size),'-','-'))
              elif p.is_file():
                  h=hashlib.sha256()
                  with p.open('rb') as f:
                      for chunk in iter(lambda:f.read(1024*1024),b''): h.update(chunk)
                  rows.append((rel,'file',mode,str(st.st_size),h.hexdigest(),'-'))
              elif p.is_symlink():
                  rows.append((rel,'symlink',mode,str(st.st_size),'-',os.readlink(p)))
          out.write_text('\n'.join('\t'.join(r) for r in rows)+'\n')
          PY
          }

          parse_gtest() {
            python3 - "$1" <<'PY'
          import re, sys
          text=open(sys.argv[1],errors='replace').read()
          def n(p):
              m=re.search(p,text,re.M)
              return int(m.group(1)) if m else 0
          print(n(r'^\[=+\]\s+Running\s+(\d+)\s+test'))
          print(n(r'^\[\s*PASSED\s*\]\s+(\d+)\s+test'))
          print(n(r'^\[\s*SKIPPED\s*\]\s+(\d+)\s+test'))
          PY
          }

          echo "=== immutable package preflight ==="
          test -f "$package/SHA256SUMS"
          test "$(sha256sum "$package/SHA256SUMS" | awk '{print $1}')" = "$PACKAGE_MANIFEST_SHA256"
          test "$(wc -l < "$package/SHA256SUMS" | tr -d ' ')" = "28"
          (cd "$package" && sha256sum -c SHA256SUMS) | tee "$evidence/preflight/package-sha256-check.txt"
          census_tree "$package" "$evidence/package-census-before.tsv"

          test "$(cat "$package/metadata/source-commit.txt")" = "$SEMANTIC_SOURCE_SHA"
          test "$(cat "$package/metadata/build-exit-code.txt")" = "0"
          test "$(cat "$package/metadata/preflight-exit-code.txt")" = "0"
          for f in "$package"/metadata/source-status-*.txt; do test ! -s "$f"; done
          grep -Fx 'runtimeExecution=false' "$package/metadata/command-boundary.txt"
          grep -Fx 'turnBoundary=Code+Build-only' "$package/metadata/command-boundary.txt"
          grep -Fx 'exactArithmeticBackend=GMP' "$package/metadata/command-boundary.txt"
          grep -Fx 'manifestExcludesSelf=true' "$package/metadata/command-boundary.txt"
          grep -F 'libgmpxx' "$package/metadata/gmp-evidence.txt"
          grep -F 'libgmp.so' "$package/metadata/gmp-evidence.txt"

          source_archive="$package/source/source-${SEMANTIC_SOURCE_SHA}.tar.gz"
          test -f "$source_archive"
          test "$(sha256sum "$source_archive" | awk '{print $1}')" = "$SOURCE_ARCHIVE_SHA256"
          rm -rf "$source_root"
          mkdir -p "$source_root"
          tar -xzf "$source_archive" -C "$source_root"
          census_tree "$source_root" "$evidence/source-census-before.tsv"

          selector="$source_root/.agents/Directional/Architecture_M4_CP_SCALE_CB6_Required_Green_Selector_424.txt"
          test -f "$selector"
          test "$(sha256sum "$selector" | awk '{print $1}')" = "$SELECTOR_SHA256"
          test "$(grep -cve '^[[:space:]]*$' "$selector")" = "424"
          test "$(grep -ve '^[[:space:]]*$' "$selector" | sort -u | wc -l | tr -d ' ')" = "424"
          test "$(head -n 423 "$selector" | sha256sum | awk '{print $1}')" = "$SELECTOR423_PREFIX_SHA256"
          test "$(tail -n 1 "$selector")" = 'M4CPScaleS2.VertexStarCertifiedFilterMatchesIndependentExactOracle'
          if grep -Fxq "$FOCUSED_IDENTITY" "$selector"; then
            echo "focused S3 identity must remain outside selector424" >&2
            exit 20
          fi
          printf '%s\n' \
            "artifact_id=${CANDIDATE_ARTIFACT_ID}" \
            "artifact_name=${CANDIDATE_ARTIFACT_NAME}" \
            "provider_zip_sha256=${CANDIDATE_PROVIDER_SHA256}" \
            "semantic_source=${SEMANTIC_SOURCE_SHA}" \
            "source_archive_sha256=${SOURCE_ARCHIVE_SHA256}" \
            "package_manifest_sha256=${PACKAGE_MANIFEST_SHA256}" \
            "package_manifest_entries=28" \
            "selector_rows=424" \
            "selector_sha256=${SELECTOR_SHA256}" \
            "selector423_prefix_sha256=${SELECTOR423_PREFIX_SHA256}" \
            "focused_identity=${FOCUSED_IDENTITY}" \
            "runtimeExecution_before_tb=false" > "$evidence/immutable-input.txt"

          python3 - "$source_root" "$selector" "$evidence/selector424-owner-map.tsv" "$FOCUSED_IDENTITY" <<'PY'
          import collections, pathlib, re, sys
          source=pathlib.Path(sys.argv[1]); selector=pathlib.Path(sys.argv[2]); out=pathlib.Path(sys.argv[3]); focused=sys.argv[4]
          cm=(source/'cmake/DirectionalTests.cmake').read_text()
          owners={}
          m=re.search(r'set\(DIRECTIONAL_SURFACE_CELL_PRODUCER_TEST_SOURCES\s+(.*?)\)', cm, re.S)
          if not m: raise SystemExit('producer source list missing')
          for f in re.findall(r'(?m)^\s*(tests/[^\s\)]+\.cpp)\s*$',m.group(1)):
              owners[f]=('producer','directional_surface_cell_producer_tests')
          targets={
            'directional_surface_cell_authority_kernel_tests':'authority-kernel',
            'directional_surface_cell_completion_tests':'completion',
            'directional_surface_cell_validation_tests':'validation',
          }
          for target,owner in targets.items():
              mm=re.search(r'add_executable\(\s*'+re.escape(target)+r'\s+(.*?)\)',cm,re.S)
              if not mm: raise SystemExit(f'target source list missing: {target}')
              for f in re.findall(r'(?m)^\s*(tests/[^\s\)]+\.cpp)\s*$',mm.group(1)):
                  owners[f]=(owner,target)
          pat=re.compile(r'\bTEST(?:_F|_P)?\s*\(\s*([A-Za-z_][A-Za-z0-9_]*)\s*,\s*([A-Za-z_][A-Za-z0-9_]*)\s*\)',re.S)
          index=collections.defaultdict(list)
          for f,(owner,binary) in owners.items():
              p=source/f
              for suite,test in pat.findall(p.read_text(errors='replace')):
                  index[f'{suite}.{test}'].append((owner,binary,f))
          identities=[x.strip() for x in selector.read_text().splitlines() if x.strip()]
          lines=['ordinal\tidentity\towner\tbinary\tsource_definition']
          census=collections.Counter()
          for ordinal,identity in enumerate(identities,1):
              defs=index.get(identity,[])
              if len(defs)!=1: raise SystemExit(f'identity definition count {len(defs)}: {identity}')
              owner,binary,f=defs[0]; census[owner]+=1
              lines.append(f'{ordinal}\t{identity}\t{owner}\t{binary}\t{f}')
          if [census['authority-kernel'],census['producer'],census['completion'],census['validation']] != [30,278,75,41]:
              raise SystemExit(f'owner census mismatch: {census}')
          defs=index.get(focused,[])
          if len(defs)!=1 or defs[0][0] != 'producer' or defs[0][1] != 'directional_surface_cell_producer_tests':
              raise SystemExit(f'focused ownership mismatch: {defs}')
          out.write_text('\n'.join(lines)+'\n')
          pathlib.Path(str(out)+'.focused').write_text(f'{focused}\t{defs[0][0]}\t{defs[0][1]}\t{defs[0][2]}\n')
          PY
          cp "$evidence/selector424-owner-map.tsv" "$evidence/selector424-predeclared.tsv"
          mv "$evidence/selector424-owner-map.tsv.focused" "$evidence/focused-owner.tsv"
          awk -F '\t' 'NR>1 {c[$3]++} END {printf "authority-kernel=%d\nproducer=%d\ncompletion=%d\nvalidation=%d\n",c["authority-kernel"],c["producer"],c["completion"],c["validation"]}' "$evidence/selector424-owner-map.tsv" | tee "$evidence/owner-census.txt"

          for b in directional_surface_cell_authority_kernel_tests directional_surface_cell_producer_tests directional_surface_cell_completion_tests directional_surface_cell_validation_tests; do
            p="$package/bin/$b"
            test -f "$p"
            test -x "$p"
            mode="$(stat -c '%a' "$p")"
            test "$mode" = "755"
            ldd "$p" > "$evidence/preflight/ldd-${b}.txt"
            ! grep -Fq 'not found' "$evidence/preflight/ldd-${b}.txt"
          done
          grep -F 'libgmpxx.so' "$evidence/preflight/ldd-directional_surface_cell_producer_tests.txt"
          grep -F 'libgmp.so' "$evidence/preflight/ldd-directional_surface_cell_producer_tests.txt"

          rm -rf "$execution"
          mkdir -p "$execution"
          cp -a "$package/bin" "$execution/bin"
          cp -a "$package/lib" "$execution/lib"
          mkdir -p "$execution/test-data/benchmarks"
          cp -a "$source_root/benchmarks/fixtures" "$execution/test-data/benchmarks/fixtures"
          census_tree "$source_root/benchmarks/fixtures" "$evidence/source-fixtures-census.tsv"
          census_tree "$execution/test-data/benchmarks/fixtures" "$evidence/execution-fixtures-census.tsv"
          cmp "$evidence/source-fixtures-census.tsv" "$evidence/execution-fixtures-census.tsv"
          census_tree "$execution" "$evidence/execution-view-before.tsv"

          printf '%s\n' \
            'configureExecution=false' \
            'compileExecution=false' \
            'relinkExecution=false' \
            'repairExecution=false' \
            'generatedDiscovery=false' \
            'mutationExecution=false' \
            'benchmarkExecution=false' > "$evidence/execution-prohibitions.txt"

          run_one() {
            local ordinal="$1" identity="$2" owner="$3" binary="$4" source_definition="$5" kind="$6"
            local stem stdout stderr timefile started ended elapsed exit_code selected passed skipped result
            if [[ "$kind" == "focused" ]]; then
              stem="focused/s3"
            else
              stem="selector/ordinal-$(printf '%03d' "$ordinal")"
            fi
            stdout="$raw/${stem}.stdout.txt"
            stderr="$raw/${stem}.stderr.txt"
            timefile="$resources/${stem}.time.txt"
            mkdir -p "$(dirname "$stdout")" "$(dirname "$timefile")"
            started="$(date +%s%3N)"
            set +e
            /usr/bin/time -v -o "$timefile" timeout --signal=TERM --kill-after=10s 180s \
              "$execution/bin/$binary" --gtest_filter="$identity" --gtest_color=no >"$stdout" 2>"$stderr"
            exit_code=$?
            set -e
            ended="$(date +%s%3N)"
            elapsed=$((ended-started))
            mapfile -t counts < <(parse_gtest "$stdout")
            selected="${counts[0]:-0}"; passed="${counts[1]:-0}"; skipped="${counts[2]:-0}"
            result=RED
            if [[ "$exit_code" -eq 124 ]]; then
              result=TIMEOUT
            elif [[ "$exit_code" -ge 128 ]]; then
              result=CRASH
            elif [[ "$exit_code" -eq 0 && "$selected" -eq 1 && "$passed" -eq 1 && "$skipped" -eq 0 ]]; then
              result=PASS
            elif [[ "$selected" -ne 1 ]]; then
              result=SELECTION_MISMATCH
            elif [[ "$skipped" -ne 0 ]]; then
              result=SKIP
            fi
            printf '%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\n' \
              "$ordinal" "$identity" "$owner" "$binary" "$source_definition" "$exit_code" "$selected" "$passed" "$skipped" "$elapsed" "$result" "${stdout#$evidence/}" "${stderr#$evidence/}"
          }

          echo "=== focused S3 runtime: exactly one process ==="
          printf 'ordinal\tidentity\towner\tbinary\tsource_definition\texit\tselected\tpassed\tskipped\telapsed_ms\tresult\tstdout\tstderr\n' > "$evidence/focused-process-ledger.tsv"
          focused_source="$(cut -f4 "$evidence/focused-owner.tsv")"
          focused_line="$(run_one 1 "$FOCUSED_IDENTITY" producer directional_surface_cell_producer_tests "$focused_source" focused)"
          printf '%s\n' "$focused_line" >> "$evidence/focused-process-ledger.tsv"
          focused_result="$(printf '%s\n' "$focused_line" | cut -f11)"
          if [[ "$focused_result" == PASS ]] && ! grep -Fqx "$FOCUSED_RECEIPT" "$raw/focused/s3.stdout.txt"; then
            focused_result=RECEIPT_MISMATCH
            python3 - "$evidence/focused-process-ledger.tsv" <<'PY'
          import pathlib,sys
          p=pathlib.Path(sys.argv[1]); lines=p.read_text().splitlines(); cols=lines[1].split('\t'); cols[10]='RECEIPT_MISMATCH'; lines[1]='\t'.join(cols); p.write_text('\n'.join(lines)+'\n')
          PY
          fi
          printf 'focused_result=%s\nfocused_receipt_match=%s\n' "$focused_result" "$([[ "$focused_result" == PASS ]] && echo true || echo false)" > "$evidence/focused-summary.txt"

          echo "=== selector424 runtime: 424 fresh exact-filter processes in file order ==="
          printf 'ordinal\tidentity\towner\tbinary\tsource_definition\texit\tselected\tpassed\tskipped\telapsed_ms\tresult\tstdout\tstderr\n' > "$evidence/selector424-process-ledger.tsv"
          while IFS=$'\t' read -r ordinal identity owner binary source_definition; do
            [[ "$ordinal" == ordinal ]] && continue
            line="$(run_one "$ordinal" "$identity" "$owner" "$binary" "$source_definition" selector)"
            printf '%s\n' "$line" >> "$evidence/selector424-process-ledger.tsv"
            printf '[TB6 selector %s/424] %s %s\n' "$ordinal" "$(printf '%s\n' "$line" | cut -f11)" "$identity"
          done < "$evidence/selector424-owner-map.tsv"

          python3 - "$evidence/selector424-process-ledger.tsv" "$evidence/selector424-summary.txt" <<'PY'
          import collections,csv,pathlib,sys
          rows=list(csv.DictReader(open(sys.argv[1]),delimiter='\t'))
          result=collections.Counter(r['result'] for r in rows)
          owner=collections.Counter(r['owner'] for r in rows if r['result']=='PASS')
          passn=result['PASS']; executed=len(rows)
          red=executed-passn
          text='\n'.join([
            f'executed={executed}',f'pass={passn}',f'red={red}',
            f'skip={result["SKIP"]}',f'crash={result["CRASH"]}',f'timeout={result["TIMEOUT"]}',
            f'selectionMismatch={result["SELECTION_MISMATCH"]}',f'unexecuted={424-executed}',
            f'authorityKernelPassed={owner["authority-kernel"]}',f'producerPassed={owner["producer"]}',
            f'completionPassed={owner["completion"]}',f'validationPassed={owner["validation"]}',
          ])+'\n'
          pathlib.Path(sys.argv[2]).write_text(text)
          PY
          cat "$evidence/selector424-summary.txt"

          echo "=== immutable postflight ==="
          (cd "$package" && sha256sum -c SHA256SUMS) | tee "$evidence/postflight/package-sha256-check.txt"
          test "$(sha256sum "$package/SHA256SUMS" | awk '{print $1}')" = "$PACKAGE_MANIFEST_SHA256"
          test "$(sha256sum "$source_archive" | awk '{print $1}')" = "$SOURCE_ARCHIVE_SHA256"
          test "$(sha256sum "$selector" | awk '{print $1}')" = "$SELECTOR_SHA256"
          census_tree "$package" "$evidence/package-census-after.tsv"
          census_tree "$source_root" "$evidence/source-census-after.tsv"
          census_tree "$execution" "$evidence/execution-view-after.tsv"
          cmp "$evidence/package-census-before.tsv" "$evidence/package-census-after.tsv"
          cmp "$evidence/source-census-before.tsv" "$evidence/source-census-after.tsv"
          cmp "$evidence/execution-view-before.tsv" "$evidence/execution-view-after.tsv"
          printf '%s\n' \
            'package_census_equal=true' \
            'source_census_equal=true' \
            'execution_view_census_equal=true' \
            'package_manifest_verified=true' \
            "selector_sha256=${SELECTOR_SHA256}" > "$evidence/postflight-immutability.txt"

          selector_pass="$(awk -F= '$1=="pass"{print $2}' "$evidence/selector424-summary.txt")"
          selector_executed="$(awk -F= '$1=="executed"{print $2}' "$evidence/selector424-summary.txt")"
          status=RED
          if [[ "$focused_result" == PASS && "$selector_pass" == 424 && "$selector_executed" == 424 ]]; then status=GREEN; fi
          printf '%s\n' \
            "status=${status}" \
            "focused=${focused_result}" \
            "selector424=${selector_pass}/424" \
            'runtime_processes_expected=425' \
            "runtime_processes_actual=$((selector_executed+1))" \
            'postflightComplete=true' \
            'runtimeStarted=true' \
            'runtimeCompleted=true' > "$evidence/final-status.txt"
          cat "$evidence/final-status.txt"

          echo "=== evidence manifest/package ==="
          (cd "$evidence" && find . -type f ! -name SHA256SUMS -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > SHA256SUMS)
          result_dir="${RUNNER_TEMP}/tb6-result"
          rm -rf "$result_dir"; mkdir -p "$result_dir"
          (cd "$evidence" && zip -q -r "$result_dir/Directional__M4-CP-SCALE-TB6-EXEC__evidence.zip" .)
          cp "$evidence/final-status.txt" "$result_dir/final-status.txt"
          cp "$evidence/selector424-summary.txt" "$result_dir/selector424-summary.txt"
          cp "$evidence/focused-summary.txt" "$result_dir/focused-summary.txt"
          sha256sum "$result_dir/Directional__M4-CP-SCALE-TB6-EXEC__evidence.zip" > "$result_dir/evidence.zip.sha256"
          echo "runtime_step_status=${status}" >> "$GITHUB_OUTPUT"

      - name: Record final runtime job status
        if: always()
        shell: bash
        run: |
          set +e
          log="${RUNNER_TEMP}/m4-cp-scale-tb6-exec.log"
          {
            echo "runtime_step_outcome=${{ steps.runtime.outcome }}"
            echo "runtime_semantic_status=${{ steps.runtime.outputs.runtime_step_status }}"
            echo "final_job_status_before_enforcement=${{ job.status }}"
            echo "finished_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } | tee -a "$log"

      - name: Upload TB6 result artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m4-cp-scale-tb6-result-${{ github.run_id }}
          path: ${{ runner.temp }}/tb6-result
          if-no-files-found: error
          retention-days: 7

      - name: Upload TB6 diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m4-cp-scale-tb6-log-${{ github.run_id }}
          path: ${{ runner.temp }}/m4-cp-scale-tb6-exec.log
          if-no-files-found: error
