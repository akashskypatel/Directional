name: M5 CP3 CB2 Patch Apply

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m5-cp3-cb2-patch-apply.txt

permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

concurrency:
  group: m5-cp3-cb2-patch-apply
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/m5-cp3-cb2-patch-apply.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m5-cp3-cb2-patch-apply
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  apply:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1EMnOXGYrOZRz_D0kgnhTIhOW-_-PWhyx
      patch_sha256: e005256f420331078500d13b078bb536c2bef4b24640c7f6e3d52e0c1ccf3f2d
      base_sha: c8009a978fb414e0281799c9e09fb30f8701ac8e
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: "M5 CP3: promote same-region A3 cuts to periodic relations"
    secrets: inherit
