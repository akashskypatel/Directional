name: M5 CP4 CB1 Apply Focused Witness Patch

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m5-cp4-cb1-apply-20260923.txt

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

concurrency:
  group: m5-cp4-cb1-apply
  cancel-in-progress: false

jobs:
  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m5-cp4-cb1-apply
      commit_run_file: false
    secrets: inherit

  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/m5-cp4-cb1-apply.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  apply:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1y2y2oXPJxmz4kDmf4JkqGLQXsnIgMWqv
      patch_sha256: a7a93b0d9a03d5e8d29c505f2638f0dde8891a10697644533b4bd292ff34414b
      base_sha: 0ca68c9689b165db34eb0b52ccce89263afb7499
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: "test: add M5 CP4 multi-isolation quotient witness"
    secrets: inherit
