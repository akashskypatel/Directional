name: P5 CB31 Drive Patch Apply

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/p5-cb31-drive-apply-20260904.txt

permissions:
  contents: write
  id-token: write
  actions: read
  issues: write
  pull-requests: write

jobs:
  validate-caller:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/p5-cb31-drive-apply.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: cb31-drive-apply
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  apply:
    needs: validate-caller
    if: ${{ needs.validate-caller.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1qIWwe-rD0Kp8KnqnW0NdzusaHAcE_AX8
      patch_sha256: ad151f3d476cd896d90b27fdec363bffde5839aed1ea34a6e64916c3708f3a9d
      base_sha: eb13ac893f033899757b6c96c65f12ef16ec7548
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: "M3-CP4c-3-CB31: publish partition diagnostics"
    secrets: inherit
