name: M4 CP4 TB2 R2 Closeout Apply

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m4-cp4-tb2-r2/apply-closeout.txt

permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

concurrency:
  group: m4-cp4-tb2-r2-closeout-apply
  cancel-in-progress: false

jobs:
  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m4-cp4-tb2-r2-closeout-apply
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/m4-cp4-tb2-r2-closeout-apply.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  apply:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1_jD02YTGzr5gy0MW7IourwD1pM0naA6U
      patch_sha256: ca61790bb7bc0bcd09250b231969e8c5c90e17a8dd530066b8d47eaf8eaaf5e7
      base_sha: 49bcc7ad4b31ccfa025702beb6cf731d3605e711
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: "M4-CP4-TB2-R2-REV: close reviewed evidence and freeze DEFN-R2"
      retention_days: 7
    secrets: inherit
