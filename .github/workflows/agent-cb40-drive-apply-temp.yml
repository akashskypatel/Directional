name: Agent CB40 Drive Apply Temp

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/cb40-drive-apply.txt

permissions:
  actions: read
  contents: write
  id-token: write
  issues: write
  pull-requests: write

concurrency:
  group: agent-cb40-drive-apply-temp
  cancel-in-progress: false

jobs:
  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: cb40-drive-apply
      commit_run_file: false
    secrets: inherit

  validate-caller:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/agent-cb40-drive-apply-temp.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  apply:
    needs: validate-caller
    if: ${{ needs.validate-caller.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1woQ-oUDCUNOHDTOMy2HETnQjiics0QQI
      patch_sha256: f62c9df4d61449ccc9e9d965489ebba301bf17debc916dd20cfd035a0ab57ca3
      base_sha: 48cfd3ba5e832d5bab58455fcc76a3f18b8aa42b
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: "fix: restore single boundary-walk rejection"
      retention_days: 14
    secrets: inherit
