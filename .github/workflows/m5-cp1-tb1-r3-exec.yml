name: M5 CP1 TB1 R3 Artifact-Only Test Benchmark

on:
  push:
    branches: [agent/surface_cell_quad/p5-recover-bridge-healing]
    paths: [.agents/connector-triggers/m5-cp1-tb1-r3-exec-20260920.txt]

permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: m5-cp1-tb1-r3-exec-${{ github.ref }}
  cancel-in-progress: false

jobs:
  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m5-cp1-tb1-r3-exec
      commit_run_file: false
      trim_stale_comments: false
    secrets: inherit

  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/m5-cp1-tb1-r3-exec.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  runtime:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
      TURN_ID: M5-CP1-TB1-R3-EXEC
      SOURCE_HARNESS: .agents/Directional/tools/m5_cp1_tb1_r2_artifact_only_harness.sh
      GENERATED_HARNESS: ${{ runner.temp }}/m5_cp1_tb1_r3_artifact_only_harness.sh
      EXPECTED_SOURCE_HARNESS_SHA256: 'b706d03adde7d7d3daacb6ac46c4cb35468a40e162d7fb9d1617d4e562d37302'
      EXPECTED_GENERATED_HARNESS_SHA256: '55b451366039673f383d4d8636ba84744c828381493597bf9e24fb92e455788c'
    steps:
      - name: Checkout canonical executor source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          token: ${{ secrets.GH_TOKEN || github.token }}

      - name: Materialize and verify R3 harness
        shell: bash
        run: |
          set -euo pipefail
          test -f "$SOURCE_HARNESS"
          source_sha="$(sha256sum "$SOURCE_HARNESS" | awk '{print $1}')"
          test "$source_sha" = "$EXPECTED_SOURCE_HARNESS_SHA256"
          python3 - "$SOURCE_HARNESS" "$GENERATED_HARNESS" <<'PY'
          from pathlib import Path
          import sys
          source = Path(sys.argv[1]).read_text()
          replacements = {
              "CANDIDATE_ARTIFACT_ID=10595705100": "CANDIDATE_ARTIFACT_ID=10600353027",
              "EXPECTED_SOURCE_SHA='b98f461b9a392cc182891a81c0a84b0b01dfbb45'": "EXPECTED_SOURCE_SHA='8a86710dd33d7b6cb9a077aef738577e4075b5f7'",
              "EXPECTED_CANDIDATE_ZIP_SHA256='fdc4046630c6f48b2bc76aad74ebc07b443a024fc9cfd76507bae515eb8668ea'": "EXPECTED_CANDIDATE_ZIP_SHA256='cdc0cb798e6b117727ddde0dbfa5008d2a8140c709eeafb0af66872c5c7ae6b0'",
              "EXPECTED_ROOT_MANIFEST_SHA256='8330461b8c5e489059e2ec320cb2e2d5243d6ef36dc01b667b5cefc09f609a3d'": "EXPECTED_ROOT_MANIFEST_SHA256='242b323811a9960a89c723ab04da17cf39449c8d42d2f97947f75f405c6347ff'",
              "EXPECTED_SOURCE_ARCHIVE_SHA256='4f51257db12ae24363a45ddfa62778200e9ac0a8ef4ce2b585c8c606350d78b9'": "EXPECTED_SOURCE_ARCHIVE_SHA256='594dad05c7078c0c5b2e03486f408ca6621e2c36875873fa045803245497352d'",
          }
          for old, new in replacements.items():
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"expected one replacement source for {old!r}; found {count}")
              source = source.replace(old, new)
          Path(sys.argv[2]).write_text(source)
          PY
          generated_sha="$(sha256sum "$GENERATED_HARNESS" | awk '{print $1}')"
          test "$generated_sha" = "$EXPECTED_GENERATED_HARNESS_SHA256"
          bash -n "$GENERATED_HARNESS"
          printf 'source_harness_sha256=%s\ngenerated_harness_sha256=%s\n' "$source_sha" "$generated_sha"

      - name: Execute immutable artifact-only gate
        id: gate
        shell: bash
        run: |
          set +e
          bash "$GENERATED_HARNESS" --execute
          status=$?
          set -e
          echo "harness_exit=${status}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload result evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: directional-m5-cp1-tb1-r3-result-${{ github.run_id }}
          path: ${{ runner.temp }}/M5-CP1-TB1-R3-EXEC-result
          if-no-files-found: error
          retention-days: 7

      - name: Upload diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: directional-m5-cp1-tb1-r3-log-${{ github.run_id }}
          path: ${{ runner.temp }}/M5-CP1-TB1-R3-EXEC.log
          if-no-files-found: error
          retention-days: 7

      - name: Fail closed on orchestration failure
        if: always()
        shell: bash
        run: test "${{ steps.gate.outputs.harness_exit }}" = "0"
