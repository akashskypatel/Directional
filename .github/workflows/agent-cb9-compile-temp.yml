name: Agent CB9 Authoritative Compile

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/cb9-compile/**

permissions:
  contents: write
  actions: write
  issues: write
  pull-requests: write

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/agent-cb9-compile-temp.yml

  compile:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-compile-reusable.yml
    with:
      source_sha: e5d6ed76cfb4e0dc21e39aa8d3fc5de98fd5595a
      targets: directional_core directional_pipeline directional_surface_cell_producer_tests
      artifact_prefix: m3-cp4c3-cb9-compile
    secrets: inherit

  observe:
    needs: [validate, compile]
    if: ${{ always() }}
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: M3-CP4c-3-CB9-compile
      trim_stale_comments: true
    secrets: inherit
