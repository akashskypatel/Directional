name: Agent CB9 Workflow Draft Validator

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/cb9-package-workflow-validation/**

permissions:
  contents: write
  actions: write
  issues: write
  pull-requests: write

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .agents/Directional/turn-payloads/m3-cp4c3-cb9-package76.yml

  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: M3-CP4c-3-CB9-package76-workflow-validation
      trim_stale_comments: true
    secrets: inherit
