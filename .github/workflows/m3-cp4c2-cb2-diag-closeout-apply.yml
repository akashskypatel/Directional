name: M3 CP4c2 CB2 DIAG Closeout Apply

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m3-cp4c2-cb2-diag-closeout-apply/**

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

concurrency:
  group: m3-cp4c2-cb2-diag-closeout-apply-${{ github.ref }}
  cancel-in-progress: false

jobs:
  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m3-cp4c2-cb2-diag-closeout-apply
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/m3-cp4c2-cb2-diag-closeout-apply.yml
    secrets: inherit

  apply:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1SuqH6ZG5JVsOn_694-clqE62BTJ6G_yt
      patch_sha256: e6a623fb40c3cad144197f7b9ee5426ac21d94baf6bd6b4220f47bde2e0d9756
      base_sha: 232ac459b13657529e064272a75c5583770a5963
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: "M3-CP4c-2-CB2-DIAG: closeout and plan TB-X2-R2"
      retention_days: 14
    secrets: inherit
