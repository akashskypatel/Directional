name: M6 CP3 CB1 Entry Closeout Docs

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m6-cp3-cb1-entry-closeout-docs.txt

permissions:
  actions: read
  contents: write
  id-token: write

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/m6-cp3-cb1-entry-closeout-docs.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  apply:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1FqEMqAS-uvtbKh5Q3x5Tn06oP0q-_0jj
      patch_sha256: '31389e5a3781815ee1b7d08b0db3eca3db83c9e507d31e0746e808e394e0eb61'
      base_sha: 912760f1ffc785676f5d50717177b1cd8be69234
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: 'M6-CP3-CB1-ENTRY: close Code + Build turn'
      retention_days: 14
    secrets: inherit

  mailbox:
    if: ${{ always() }}
    needs: [validate, apply]
    permissions:
      actions: read
      contents: write
    uses: ./.github/workflows/workflow-mailbox-publisher.yml
    with:
      workflow_key: m6-cp3-cb1-entry-closeout-docs
      source_sha: ${{ github.sha }}
      source_ref: ${{ github.ref }}
      result: ${{ needs.apply.result }}
      summary: M6-CP3-CB1-ENTRY durable documentation closeout.
