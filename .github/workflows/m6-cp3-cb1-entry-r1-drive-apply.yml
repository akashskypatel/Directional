name: M6 CP3 CB1 Entry R1 Drive Apply

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m6-cp3-cb1-entry-r1-drive-apply.txt

permissions:
  actions: read
  contents: write
  id-token: write

concurrency:
  group: m6-cp3-cb1-entry-r1-drive-apply
  cancel-in-progress: false

jobs:
  validate:
    permissions:
      contents: read
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/m6-cp3-cb1-entry-r1-drive-apply.yml
      source_ref: ${{ github.sha }}

  apply:
    needs: validate
    if: needs.validate.outputs.valid == 'true'
    permissions:
      contents: write
      id-token: write
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 18a7y5tTEBhVgzFfYBumQ5KgGZSxWz7SC
      patch_sha256: "925be14071546c4a19b274191bf003c8f2c4aa5b0caeac01fd9b334e62e29972"
      base_sha: 637eb6f217a839ec1f9a6d9871a45b67089736e7
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: "M6 CP3 CB1 entry R1 recovery"
      retention_days: 14
    secrets: inherit

  mailbox:
    if: ${{ always() }}
    needs: [validate, apply]
    permissions:
      actions: read
      contents: write
    uses: ./.github/workflows/workflow-mailbox-publisher.yml
    with:
      workflow_key: m6-cp3-cb1-entry-r1-drive-apply
      source_sha: ${{ github.sha }}
      source_ref: ${{ github.ref }}
      result: ${{ needs.apply.result != 'skipped' && needs.apply.result || needs.validate.result }}
      summary: >-
        M6 CP3 CB1 entry R1 Drive apply only;
        validate=${{ needs.validate.result }} apply=${{ needs.apply.result }};
        source_sha is control/event authority only;
        recover semantic applied_commit_sha from agent-google-drive-patch-result artifact.
