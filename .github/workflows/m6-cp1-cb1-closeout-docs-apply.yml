name: M6 CP1 CB1 Closeout Docs Apply

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m6-cp1-cb1-closeout-docs-apply-20260924.txt

permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

concurrency:
  group: m6-cp1-cb1-closeout-docs-apply
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/m6-cp1-cb1-closeout-docs-apply.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m6-cp1-cb1-closeout-docs-apply
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  apply:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1QxgLh_wMl5EdMLuLgfu0OptPQG0eEnVk
      patch_sha256: 243e1d96cb0d1752751e662da810d77062ec8cf3fac327be947744b22050020c
      base_sha: fc518374aac806d3e39a6257e5e78782c0fccb99
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: 'M6-CP1-CB1: close out A5 candidate and freeze TB1 plan'
    secrets: inherit
