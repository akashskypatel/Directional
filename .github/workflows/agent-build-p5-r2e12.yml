name: Agent Build Surface Cell P5 R2E12

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .github/workflows/agent-build-p5-r2e12.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: surface-cell-p5-r2e12-${{ github.ref }}
  cancel-in-progress: false

env:
  BRANCH: agent/surface_cell_quad/p5-recover-bridge-healing
  PATCH_B64: 
  PATCH_SHA256: 9df5bfcb8da63a336f30c3c6a2a37f4e1803db6cb3b8f619cd9b1f99044320b8
  PRE_CPP: 22f607ec6d2326edceb8264240b22b5a46da3083
  PRE_HEADER: b9ed2d969b7de2d4df9639d53ff2e9b35e3475d8
  PRE_PHASE16: e58bceda098f7768b8a7203cca00564f82a7d831
  PRE_MILESTONE_D: 015a9f02354a91ca07d0e0c6bf6b2632055436ae
  POST_CPP: 3c1855ebaa6a67b1be09956a90906fc269056146
  POST_HEADER: b9ed2d969b7de2d4df9639d53ff2e9b35e3475d8
  POST_PHASE16: e58bceda098f7768b8a7203cca00564f82a7d831
  POST_MILESTONE_D: 015a9f02354a91ca07d0e0c6bf6b2632055436ae
  BUILD_DIR: build/agent-p5-r2e12-release
  PACKAGE_DIR: artifact
  LOG_DIR: /tmp/p5-r2e12-logs
  LOG: /tmp/p5-r2e12-logs/activity.log

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Initialize persistent activity log
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$LOG_DIR"
          {
            echo 'P5-R2E12 compile-only build'
            echo "run_id=$GITHUB_RUN_ID"
            echo "event_sha=$GITHUB_SHA"
            echo "ref=$GITHUB_REF"
            echo "runner_os=$RUNNER_OS"
            echo "started_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } | tee "$LOG"

      - name: Checkout exact event commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 8
          submodules: false
          persist-credentials: true

      - name: Apply authoritative exterior-pair patch and compile approved targets
        shell: bash
        run: |
          set -Eeuo pipefail
          exec > >(tee -a "$LOG") 2>&1
          finish() {
            rc=$?
            trap - EXIT
            set +x
            echo "exit_code=$rc"
            echo "finished_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo 'git_status_begin'
            git status --short --branch || true
            echo 'git_status_end'
            df -h . || true
            du -sh "$BUILD_DIR" "$PACKAGE_DIR" 2>/dev/null || true
            exit "$rc"
          }
          trap finish EXIT
          set -x

          event_sha=$(git rev-parse HEAD)
          test "$event_sha" = "$GITHUB_SHA"
          test "$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)" = "$event_sha"
          test -z "$(git status --porcelain=v1)"

          git --version
          cmake --version
          ninja --version
          c++ --version
          python3 --version

          test "$(git hash-object src/geometry/SurfaceArrangement.cpp)" = "$PRE_CPP"
          test "$(git hash-object include/directional/geometry/SurfaceArrangement.h)" = "$PRE_HEADER"
          test "$(git hash-object tests/SurfaceArrangementPhase16Tests.cpp)" = "$PRE_PHASE16"
          test "$(git hash-object tests/MilestoneDClosureTests.cpp)" = "$PRE_MILESTONE_D"

          printf '%s' "$PATCH_B64" | base64 -d > /tmp/p5-r2e12.patch
          test "$(sha256sum /tmp/p5-r2e12.patch | awk '{print $1}')" = "$PATCH_SHA256"
          git apply --check /tmp/p5-r2e12.patch
          git apply /tmp/p5-r2e12.patch
          git diff --check
          git diff --name-only | sort > /tmp/changed.txt
          diff -u <(printf '%s\n' src/geometry/SurfaceArrangement.cpp) /tmp/changed.txt
          test "$(git hash-object src/geometry/SurfaceArrangement.cpp)" = "$POST_CPP"
          test "$(git hash-object include/directional/geometry/SurfaceArrangement.h)" = "$POST_HEADER"
          test "$(git hash-object tests/SurfaceArrangementPhase16Tests.cpp)" = "$POST_PHASE16"
          test "$(git hash-object tests/MilestoneDClosureTests.cpp)" = "$POST_MILESTONE_D"

          git rm -f .github/workflows/agent-build-p5-r2e12.yml
          git add src/geometry/SurfaceArrangement.cpp
          git diff --cached --check
          git config user.name directional-build-agent
          git config user.email directional-build-agent@users.noreply.github.com
          git commit -m 'P5-R2E12: add normalized authoritative exterior pair [skip ci]'
          git push origin "HEAD:$BRANCH"

          source_sha=$(git rev-parse HEAD)
          test "$(git rev-parse HEAD^)" = "$event_sha"
          test "$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)" = "$source_sha"
          test "$(git hash-object src/geometry/SurfaceArrangement.cpp)" = "$POST_CPP"
          test "$(git hash-object include/directional/geometry/SurfaceArrangement.h)" = "$POST_HEADER"
          test "$(git hash-object tests/SurfaceArrangementPhase16Tests.cpp)" = "$POST_PHASE16"
          test "$(git hash-object tests/MilestoneDClosureTests.cpp)" = "$POST_MILESTONE_D"
          test ! -e .github/workflows/agent-build-p5-r2e12.yml

          git submodule sync --recursive
          git submodule update --init --recursive --depth 1 --jobs 4
          git submodule status --recursive | tee /tmp/submodules.txt
          test "$(wc -l < /tmp/submodules.txt)" -eq 9
          git status --porcelain=v1 | tee /tmp/source-status.txt
          test ! -s /tmp/source-status.txt

          rm -rf "$BUILD_DIR" "$PACKAGE_DIR"
          mkdir -p "$BUILD_DIR" "$PACKAGE_DIR"/{bin,lib,logs,metadata,source}
          cmake -S . -B "$BUILD_DIR" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            '-DCMAKE_CXX_FLAGS_RELEASE=-O2 -DNDEBUG' \
            -DBUILD_SHARED_LIBS=OFF \
            -DDIRECTIONAL_BUILD_TESTS=ON \
            -DDIRECTIONAL_BUILD_BENCHMARKS=ON \
            -DDIRECTIONAL_BUILD_CLI=OFF \
            -DDIRECTIONAL_BUILD_GUI=OFF \
            -DDIRECTIONAL_ENABLE_GMP=OFF \
            -DDIRECTIONAL_ENABLE_PARDISO=OFF \
            -DDIRECTIONAL_ENABLE_CUDSS=OFF \
            -DDIRECTIONAL_ENABLE_SUITESPARSE=OFF \
            2>&1 | tee "$BUILD_DIR/configure.log"
          cmake --build "$BUILD_DIR" --target \
            directional_core directional_pipeline \
            directional_phase1_tests directional_benchmarks \
            -j 4 2>&1 | tee "$BUILD_DIR/build.log"

          test_bin=$(find "$BUILD_DIR" -type f -name directional_phase1_tests -perm -111 | head -1)
          bench_bin=$(find "$BUILD_DIR" -type f -name directional_benchmarks -perm -111 | head -1)
          test -n "$test_bin" && test -n "$bench_bin"
          cp "$test_bin" "$bench_bin" "$PACKAGE_DIR/bin/"
          find "$BUILD_DIR" -maxdepth 3 -type f \
            \( -name libdirectional_core.a -o -name libdirectional_pipeline.a \) \
            -exec cp '{}' "$PACKAGE_DIR/lib/" ';'
          test -f "$PACKAGE_DIR/lib/libdirectional_core.a"
          test -f "$PACKAGE_DIR/lib/libdirectional_pipeline.a"

          cp "$BUILD_DIR/configure.log" "$BUILD_DIR/build.log" "$LOG" "$PACKAGE_DIR/logs/"
          cp /tmp/submodules.txt /tmp/source-status.txt "$PACKAGE_DIR/metadata/"
          printf '%s\n' "$source_sha" > "$PACKAGE_DIR/SOURCE_COMMIT"
          printf '%s\n' "$event_sha" > "$PACKAGE_DIR/WORKFLOW_EVENT_COMMIT"
          printf '%s\n' "$POST_CPP" > "$PACKAGE_DIR/metadata/source-arrangement-blob.txt"
          printf '%s\n' "$POST_HEADER" > "$PACKAGE_DIR/metadata/header-blob.txt"
          printf '%s\n' "$POST_PHASE16" > "$PACKAGE_DIR/metadata/phase16-test-blob.txt"
          printf '%s\n' "$POST_MILESTONE_D" > "$PACKAGE_DIR/metadata/milestone-d-test-blob.txt"
          printf '%s\n' "$PATCH_SHA256" > "$PACKAGE_DIR/metadata/patch-sha256.txt"
          printf '%s\n' 'No test, benchmark, custom input, help/list/discovery command, CLI, GUI, or generated project binary was executed.' > "$PACKAGE_DIR/metadata/EXECUTION_POLICY.txt"
          tar --exclude=.git --exclude=external --exclude="$BUILD_DIR" --exclude="$PACKAGE_DIR" \
            -czf "$PACKAGE_DIR/source/directional-source-$source_sha.tar.gz" .
          cat > "$PACKAGE_DIR/metadata/build-summary.json" <<JSON
          {"turn":"P5-R2E12","workflow_run_id":$GITHUB_RUN_ID,"workflow_event_commit":"$event_sha","source_commit":"$source_sha","configuration":"Release -O2 -DNDEBUG","targets":["directional_core","directional_pipeline","directional_phase1_tests","directional_benchmarks"],"tests_executed":false,"benchmarks_executed":false,"project_binary_executed":false}
          JSON
          sha256sum "$PACKAGE_DIR/bin/"* "$PACKAGE_DIR/lib/"* > "$PACKAGE_DIR/metadata/target-sha256.txt"
          find "$PACKAGE_DIR" -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > "$PACKAGE_DIR/SHA256SUMS"
          sha256sum -c "$PACKAGE_DIR/SHA256SUMS"

      - name: Upload compiled checkpoint
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: surface-cell-p5-r2e12-github-source-linux-release
          path: artifact
          if-no-files-found: error
          retention-days: 14

      - name: Always upload detailed workflow logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surface-cell-p5-r2e12-workflow-logs-${{ github.run_id }}
          path: /tmp/p5-r2e12-logs
          if-no-files-found: error
          retention-days: 30
