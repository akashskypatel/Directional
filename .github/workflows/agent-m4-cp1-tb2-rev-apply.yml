name: Agent M4 CP1 TB2 Review Apply

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m4-cp1-tb2-rev-apply.txt

permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

concurrency:
  group: agent-m4-cp1-tb2-rev-apply-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/agent-m4-cp1-tb2-rev-apply.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m4-cp1-tb2-rev-apply
      commit_run_file: false
    secrets: inherit

  apply:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1gUBh7NK1zwJFf99-1RWK3_VhQ4q5IjGN
      patch_sha256: 008db445b96a1a33d208e0a263a4328486bd9b064c2dc66db5828ecd51bc8293
      base_sha: c033621357b51236f99c04a798f2dd16aa91b772
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: 'docs(agent): close M4-CP1 TB2 review and authorize same-agent review/defn'
      retention_days: 14
    secrets: inherit
