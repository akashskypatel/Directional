name: M6 CP3 TB1 Entry Resolver Closeout
on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m6-cp3-tb1-entry-exec-resolver-closeout.txt
permissions:
  actions: read
  contents: write
  id-token: write
jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/m6-cp3-tb1-entry-exec-resolver-closeout.yml
      source_ref: ${{ github.sha }}
    secrets: inherit
  apply:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1wPA5tPYtusbSq7uYVL5zD9oYkvbjFQv6
      patch_sha256: '1ea13f50254bcecd49b97a5c27231365eb8663b07d88e4ec1fe036588c3a3e4d'
      base_sha: e9b6a128ca5b42ae286194362474ab8ec905abe2
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: 'M6-CP3-TB1-ENTRY-EXEC: finalize retired-document resolver'
      retention_days: 14
    secrets: inherit
  mailbox:
    if: ${{ always() }}
    needs: [validate, apply]
    permissions:
      actions: read
      contents: write
    uses: ./.github/workflows/workflow-mailbox-publisher.yml
    with:
      workflow_key: m6-cp3-tb1-entry-exec-resolver-closeout
      source_sha: ${{ github.sha }}
      source_ref: ${{ github.ref }}
      result: ${{ needs.apply.result }}
      summary: M6-CP3-TB1-ENTRY-EXEC retired-document resolver closeout.
