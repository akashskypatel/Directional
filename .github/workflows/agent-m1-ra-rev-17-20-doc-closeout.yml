name: Agent M1 R-A REV-17-20 Doc Closeout

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m1-ra-rev-17-20-doc-closeout.txt

permissions:
  contents: write

jobs:
  closeout:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Initialize persistent activity log
        shell: bash
        run: |
          set -euo pipefail
          : > "$RUNNER_TEMP/activity.log"
          printf '%s\n' \
            'task=M1 R-A-REV-17 and R-A-REV-20 durable closeout' \
            "event_sha=$GITHUB_SHA" \
            "ref=$GITHUB_REF" \
            'controlPlaneOnly=true' \
            'runtimeExecution=false' | tee -a "$RUNNER_TEMP/activity.log"

      - name: Checkout exact trigger authority
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          submodules: false

      - name: Apply durable-document closeout and remove orchestration
        shell: bash
        run: |
          set -euo pipefail
          LOG="$RUNNER_TEMP/activity.log"
          exec > >(tee -a "$LOG") 2>&1
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          PAYLOAD=.agents/Directional/turn-payloads/m1-ra-rev-17-20-doc-closeout.patch.gz.b64
          test "$(sha256sum "$PAYLOAD" | cut -d' ' -f1)" = "b6bba9bbd58f8e5755cd4c017af1faee7da2bec600920162159e5373744ffc40"
          base64 --decode "$PAYLOAD" | gzip -d > "$RUNNER_TEMP/doc-closeout.patch"
          test "$(sha256sum "$RUNNER_TEMP/doc-closeout.patch" | cut -d' ' -f1)" = "6c56efb2ea6f869c745c0ac5c27cab77c267b54d79dee4b10265848cad0e0ffb"
          git apply --check "$RUNNER_TEMP/doc-closeout.patch"
          git apply "$RUNNER_TEMP/doc-closeout.patch"
          git diff --check
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' \
            .agents/Directional/Architecture_M1_Single_Authority_Cutover_Code_Build_Plan.md \
            .agents/Directional/CHANGELOG.md \
            .agents/Directional/Future_Chat_Session_Handoff.md \
            TODO.md | sort)"
          printf 'changed_documents=\n%s\n' "$changed"
          test "$changed" = "$expected"

          git rm -- \
            .github/workflows/agent-m1-ra-rev-17-20-doc-closeout.yml \
            .agents/connector-triggers/m1-ra-rev-17-20-doc-closeout.txt \
            "$PAYLOAD"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          printf '%s\n' "$changed" | xargs git add --
          git commit -m "docs: record REV-17 and REV-20 partial checkpoint"
          DOC_SHA="$(git rev-parse HEAD)"
          echo "doc_sha=$DOC_SHA"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          git status --porcelain=v1 | tee "$RUNNER_TEMP/source-status-final.txt"
          test ! -s "$RUNNER_TEMP/source-status-final.txt"
          echo 'runtimeExecution=false'
          echo 'No generated Directional binary, discovery, test, benchmark, ctest, CLI, fuzzer, or custom input was executed.'

      - name: Upload persistent activity log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m1-ra-rev-17-20-doc-closeout-log-${{ github.run_id }}
          path: ${{ runner.temp }}/activity.log
          if-no-files-found: error
          retention-days: 7
