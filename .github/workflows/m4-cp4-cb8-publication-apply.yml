name: M4 CP4 CB8 Publication Apply

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m4-cp4-cb8-publication-apply-20260919.txt

permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

concurrency:
  group: m4-cp4-cb8-publication-apply-agent-surface-cell-quad
  cancel-in-progress: false

jobs:
  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m4-cp4-cb8-publication-apply
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/m4-cp4-cb8-publication-apply.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  apply:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1XXrXgxa_IqjOfMiUEcpk6zHZ2Ww-R9h2
      patch_sha256: '7b0a630c348217ed9adedf572557056a25459d5ba128fde2008561ef2b7e95dc'
      base_sha: 3624b0fe0f3e9b627746aa40a01d7cbc55af3f4b
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: 'M4-CP4-CB8: publish selector430 gate'
    secrets: inherit
