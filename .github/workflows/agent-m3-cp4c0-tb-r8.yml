name: M3 CP4c0 TB-R8 Artifact-Only Gate

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m3-cp4c0-tb-r8/run.txt

permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: m3-cp4c0-tb-r8-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/agent-m3-cp4c0-tb-r8.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m3-cp4c0-tb-r8
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  test-benchmark:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Initialize persistent activity log
        shell: bash
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/m3-cp4c0-tb-r8-activity.log"
          : > "$log"
          printf '%s\n' "workflow=$GITHUB_WORKFLOW" "run_id=$GITHUB_RUN_ID" "event=$GITHUB_EVENT_NAME" \
            "event_sha=$GITHUB_SHA" "ref=$GITHUB_REF" "repository=$GITHUB_REPOSITORY" \
            'turnBoundary=Test+Benchmark-artifact-only/TB-EXEC' 'configure=false' 'compile=false' \
            'relink=false' 'repair=false' 'generatedDiscovery=false' 'performanceBenchmark=false' \
            'permissionRepairAttempted=false' 'fullSuiteTimeout=none' \
            "started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" | tee -a "$log"

      - name: Checkout exact control source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          token: ${{ secrets.GH_TOKEN || github.token }}

      - name: Verify immutable TB-R8 control payload
        shell: bash
        run: |
          set -euo pipefail
          payload='.agents/Directional/turn-payloads/m3-cp4c0-tb-r8.py'
          test "$(sha256sum "$payload" | awk '{print $1}')" = 'e35dc2700b083fdbd62f9e825f845a5e619a3a8a27aa4176238d2e3227107c4c'
          cp "$payload" "${RUNNER_TEMP}/m3-cp4c0-tb-r8.py"
          test "$(sha256sum "${RUNNER_TEMP}/m3-cp4c0-tb-r8.py" | awk '{print $1}')" = 'e35dc2700b083fdbd62f9e825f845a5e619a3a8a27aa4176238d2e3227107c4c'
          python3 -m py_compile "${RUNNER_TEMP}/m3-cp4c0-tb-r8.py"

      - name: Execute immutable artifact-only TB-R8 plan
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -uo pipefail
          log="${RUNNER_TEMP}/m3-cp4c0-tb-r8-activity.log"
          exec > >(tee -a "$log") 2>&1
          python3 "${RUNNER_TEMP}/m3-cp4c0-tb-r8.py"

      - name: Record final control status
        if: always()
        shell: bash
        run: |
          set +e
          printf '%s\n' "final_job_status=${{ job.status }}" "finished_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            | tee -a "${RUNNER_TEMP}/m3-cp4c0-tb-r8-activity.log"

      - name: Upload TB-R8 result evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-cp4c0-tb-r8-result-${{ github.run_id }}
          path: ${{ runner.temp }}/m3-cp4c0-tb-r8-result
          if-no-files-found: error
          retention-days: 7

      - name: Upload TB-R8 diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-cp4c0-tb-r8-log-${{ github.run_id }}
          path: ${{ runner.temp }}/m3-cp4c0-tb-r8-activity.log
          if-no-files-found: error
          retention-days: 7
