name: Agent TB38 Artifact-Only EXEC

on:
  push:
    branches: [agent/surface_cell_quad/p5-recover-bridge-healing]
    paths: [.agents/connector-triggers/tb38-exec.txt]

permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: agent-tb38-exec
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/agent-tb38-exec-temp.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: tb38-exec
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  execute:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      TURN_ID: M3-CP4c-3-TB38-EXEC
      ARTIFACT_ID: "10034608071"
      EXPECTED_ARTIFACT_NAME: m3-cp4c3-cb43-result-34167182718
      EXPECTED_PROVIDER_DIGEST: sha256:426622beb03208d2e6b0cc77479942a92f2aca9967e3bf6251f5034ac533008e
      EXPECTED_ZIP_SHA256: 426622beb03208d2e6b0cc77479942a92f2aca9967e3bf6251f5034ac533008e
      EXPECTED_SOURCE_SHA: 2fcde465b1de2e42a348d224f5165ce8b87e4fbe
      EXPECTED_SOURCE_ARCHIVE_SHA256: 1d4c59d8482ffc240f93119ea04e57541930241a73ff3bb8bdd4154f40fe5a28
      EXPECTED_HARNESS_SHA256: aaadab351c0ba28a39c87aff1948f83ab0c4c71520662177e5cdf6fd08b30ed3
      EXPECTED_TEST_SOURCE_SHA256: 913752b8e869b310e2bcb4d0b81a06c4231acdf0470db4427952958de7b3583b
      SELECTOR_RELATIVE_PATH: .agents/Directional/Architecture_M3_CP4c3_Required_Green_Selector_409.txt
      EXPECTED_SELECTOR_COUNT: "409"
      EXPECTED_SELECTOR_SHA256: eea6d8c2bbc8e9247deb4bfbbe6763042c76002d1894dd62e35f80262403b53e
      EXPECTED_SELECTOR_PREFIX_SHA256: 2a742ba92dba744425fccaf81d5cc7a57885cbff37c779d525218fcd70500af6
      ACCEPTED_PREFIX_COUNT: "365"
      EXPECTED_MEASUREMENT_SCRIPT_SHA256: 4c374177bd762ad4946273cbfa46ffd51bd2859eece59edc6c7bf689bfeca553
    steps:
      - name: Initialize persistent TB38 log
        shell: bash
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/M3-CP4c-3-TB38-EXEC-workflow.log"
          : > "$log"
          {
            echo "workflow=${GITHUB_WORKFLOW}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "event=${GITHUB_EVENT_NAME}"
            echo "event_sha=${GITHUB_SHA}"
            echo "ref=${GITHUB_REF}"
            echo "repository=${GITHUB_REPOSITORY}"
            echo "runner_os=${RUNNER_OS}"
            echo "turn=${TURN_ID}"
            echo "artifact_id=${ARTIFACT_ID}"
            echo "expected_source=${EXPECTED_SOURCE_SHA}"
            echo "runtime_boundary=Test+Benchmark-artifact-only"
            echo "benchmark_execution=prohibited"
            echo "started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            uname -a
            python3 --version
          } | tee -a "$log"

      - name: Materialize and verify packaged harness
        shell: bash
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/M3-CP4c-3-TB38-EXEC-workflow.log"
          exec > >(tee -a "$log") 2>&1
          trap 'status=$?; echo "bootstrap_exit=${status}"' EXIT
          root="${RUNNER_TEMP}/tb38-bootstrap"
          pkg="${root}/package"
          source="${root}/source"
          zip="${root}/artifact-${ARTIFACT_ID}.zip"
          rm -rf "$root"
          mkdir -p "$pkg" "$source"
          artifact_json="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}")"
          provider_digest="$(printf '%s' "$artifact_json" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("digest", ""))')"
          artifact_name="$(printf '%s' "$artifact_json" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("name", ""))')"
          test "$provider_digest" = "$EXPECTED_PROVIDER_DIGEST"
          test "$artifact_name" = "$EXPECTED_ARTIFACT_NAME"
          curl -L --fail --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
            -o "$zip"
          printf '%s  %s\n' "$EXPECTED_ZIP_SHA256" "$zip" | sha256sum -c -
          unzip -q "$zip" -d "$pkg"
          (cd "$pkg" && sha256sum -c SHA256SUMS)
          test "$(cat "$pkg/metadata/source-commit.txt")" = "$EXPECTED_SOURCE_SHA"
          source_archive="$pkg/source/source-${EXPECTED_SOURCE_SHA}.tar.gz"
          printf '%s  %s\n' "$EXPECTED_SOURCE_ARCHIVE_SHA256" "$source_archive" | sha256sum -c -
          tar -xzf "$source_archive" -C "$source"
          harness="$source/.agents/Directional/tools/m3_cp4c3_artifact_only_harness.sh"
          selector="$source/$SELECTOR_RELATIVE_PATH"
          test_source="$source/tests/FieldAlignedCurveNetworkTests.cpp"
          printf '%s  %s\n' "$EXPECTED_HARNESS_SHA256" "$harness" | sha256sum -c -
          printf '%s  %s\n' "$EXPECTED_TEST_SOURCE_SHA256" "$test_source" | sha256sum -c -
          test "$(grep -cve '^[[:space:]]*$' "$selector")" = "$EXPECTED_SELECTOR_COUNT"
          printf '%s  %s\n' "$EXPECTED_SELECTOR_SHA256" "$selector" | sha256sum -c -
          test "$(head -n 408 "$selector" | sha256sum | awk '{print $1}')" = "$EXPECTED_SELECTOR_PREFIX_SHA256"
          echo "bootstrap_authority_verified=true"

      - name: Execute immutable selector 409 through packaged harness
        shell: bash
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/M3-CP4c-3-TB38-EXEC-workflow.log"
          exec > >(tee -a "$log") 2>&1
          trap 'status=$?; echo "harness_exit=${status}"' EXIT
          cd "${RUNNER_TEMP}/tb38-bootstrap/source"
          bash .agents/Directional/tools/m3_cp4c3_artifact_only_harness.sh --execute

      - name: Checkout exact control payload
        if: always()
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          submodules: false

      - name: Record frozen TB38 measurement checks
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          script=".agents/Directional/turn-payloads/tb38_measurement_checks.py"
          test "$(sha256sum "$script" | awk '{print $1}')" = "$EXPECTED_MEASUREMENT_SCRIPT_SHA256"
          python3 "$script" "${RUNNER_TEMP}/M3-CP4c-3-TB38-EXEC-result"

      - name: Record final workflow source status
        if: always()
        shell: bash
        run: |
          set +e
          log="${RUNNER_TEMP}/M3-CP4c-3-TB38-EXEC-workflow.log"
          {
            echo "final_job_status=${{ job.status }}"
            echo "event_sha=${GITHUB_SHA}"
            echo "runtime_source_sha=${EXPECTED_SOURCE_SHA}"
            echo "configure_execution=false"
            echo "compile_execution=false"
            echo "relink_execution=false"
            echo "benchmark_execution=false"
            echo "package_repair=false"
            echo "finished_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } | tee -a "$log"

      - name: Upload TB38 result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-cp4c3-tb38-exec-result-${{ github.run_id }}
          path: ${{ runner.temp }}/M3-CP4c-3-TB38-EXEC-result
          if-no-files-found: error
          retention-days: 14

      - name: Upload persistent TB38 workflow log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-cp4c3-tb38-exec-log-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/M3-CP4c-3-TB38-EXEC.log
            ${{ runner.temp }}/M3-CP4c-3-TB38-EXEC-workflow.log
          if-no-files-found: error
          retention-days: 14
