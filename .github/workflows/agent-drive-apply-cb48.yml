name: Agent Drive Apply CB48

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/drive-apply-cb48-20260908.txt

permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

concurrency:
  group: agent-drive-apply-cb48
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/agent-drive-apply-cb48.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: cb48-drive-apply
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  apply:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1gdZ9hZzSQ6ydHgQIPUT7LgPSjBB2AB-R
      patch_sha256: 91ebd35b8b583ea2cbbf6eb24f028e88c4aa7b65c8d0399013391272cbd5cec1
      base_sha: 62a4bf49d0d41f9ea4b1c2690ff938f10d167348
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: "M3-CP4c-3-CB48: implement Part XII domain-owned evidence"
      retention_days: 14
    secrets: inherit
