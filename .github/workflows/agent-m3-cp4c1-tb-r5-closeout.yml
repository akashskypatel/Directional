name: M3 CP4c1 TB-R5 Closeout

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m3-cp4c1-tb-r5-closeout/apply.txt

permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

concurrency:
  group: m3-cp4c1-tb-r5-closeout
  cancel-in-progress: false

jobs:
  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m3-cp4c1-tb-r5-closeout
      commit_run_file: false
    secrets: inherit

  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/agent-m3-cp4c1-tb-r5-closeout.yml
    secrets: inherit

  apply:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 136bCrno7mRBKMK5jEY5a2HYDNo7Pjj_5
      patch_sha256: 286fd87ad85d98514d39b955247afc049c344c61a34db3a911af09b0edb0b72d
      base_sha: a9668812f7531836fc46a271f0e9943a367fdc04
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: "docs: close M3 CP4c-1 after TB-R5 acceptance"
      retention_days: 7
    secrets: inherit
