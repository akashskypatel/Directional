name: M3 CP4c0 TB-R9 Whole-Gate Reproof

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m3-cp4c0-tb-r9-reproof/run.txt

permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: m3-cp4c0-tb-r9-reproof-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/agent-m3-cp4c0-tb-r9-reproof.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m3-cp4c0-tb-r9-reproof
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  test-benchmark:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Initialize persistent activity log
        shell: bash
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/m3-cp4c0-tb-r9-activity.log"
          result="${RUNNER_TEMP}/m3-cp4c0-tb-r9-result"
          : > "$log"
          rm -rf "$result"; mkdir -p "$result"
          printf '%s\n' "workflow=$GITHUB_WORKFLOW" "run_id=$GITHUB_RUN_ID" "event=$GITHUB_EVENT_NAME" \
            "event_sha=$GITHUB_SHA" "ref=$GITHUB_REF" "repository=$GITHUB_REPOSITORY" \
            'turnBoundary=Test+Benchmark-artifact-only/TB-EXEC' 'configure=false' 'compile=false' \
            'relink=false' 'repair=false' 'generatedDiscovery=false' 'performanceBenchmark=false' \
            'fullSuiteJobTimeout=none' 'perIdentityStopBoundSeconds=60' \
            'packageArtifactId=9649395432' \
            'packageSha256=557207bf8f668884295258690e3bd31485cbd7709f0be47aa98daea0c53b3e2e' \
            'packageSource=7bbc0480d9ab5954329b940992ef41a9223102ed' \
            "started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" | tee -a "$log"

      - name: Checkout exact control source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          token: ${{ secrets.GH_TOKEN || github.token }}

      - name: Install GMP runtime dependency
        shell: bash
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/m3-cp4c0-tb-r9-activity.log"
          exec > >(tee -a "$log") 2>&1
          dpkg -s libgmp-dev >/dev/null 2>&1 || { sudo apt-get update; sudo apt-get install -y libgmp-dev; }
          dpkg-query -W -f='libgmp-dev=${Version}\n' libgmp-dev
          ldconfig -p | grep -E 'libgmp(xx)?\.so'

      - name: Materialize frozen TB-R9 plan with new package authority
        shell: bash
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/m3-cp4c0-tb-r9-activity.log"
          exec > >(tee -a "$log") 2>&1
          original="${RUNNER_TEMP}/m3-cp4c0-tb-r9-original.py"
          payload="${RUNNER_TEMP}/m3-cp4c0-tb-r9.py"
          git fetch --no-tags --depth=1 origin 43949227e550fde10c8792787697f98ba9089cfc
          git show 43949227e550fde10c8792787697f98ba9089cfc:.agents/Directional/turn-payloads/m3-cp4c0-tb-r9.py > "$original"
          test "$(git hash-object "$original")" = 'af9d1c0adb713b6b154d96d5a5fb2c825bbf5981'
          python3 - "$original" "$payload" <<'PY'
          from pathlib import Path
          import sys
          src, dst = map(Path, sys.argv[1:])
          text = src.read_text()
          replacements = {
              "A='9634245265'": "A='9649395432'",
              "H='4ef834465ee8db3110f40f7882cde4a39f94821b6bc0daba3ae0b0e04d7e5629'": "H='557207bf8f668884295258690e3bd31485cbd7709f0be47aa98daea0c53b3e2e'",
              "S='66325345567106fe7de8560ee2aee5f07ca665de'": "S='7bbc0480d9ab5954329b940992ef41a9223102ed'",
              "AH='4c7a5585fd0627a7e1aa41cf84181d063bf102c3ab94895169ae54dff27f9110'": "AH='f58cfdc0d1886af11328f9b7dfaab8be1bd92d0220549a97d5954944ff7ac68f'",
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f'expected exactly one frozen authority token: {old}')
              text = text.replace(old, new, 1)
          dst.write_text(text)
          PY
          python3 -m py_compile "$payload"
          grep -F "A='9649395432'" "$payload"
          grep -F "H='557207bf8f668884295258690e3bd31485cbd7709f0be47aa98daea0c53b3e2e'" "$payload"
          grep -F "S='7bbc0480d9ab5954329b940992ef41a9223102ed'" "$payload"
          grep -F "AH='f58cfdc0d1886af11328f9b7dfaab8be1bd92d0220549a97d5954944ff7ac68f'" "$payload"
          echo "frozen_plan_original_blob=af9d1c0adb713b6b154d96d5a5fb2c825bbf5981"
          echo "reparameterized_plan_sha256=$(sha256sum "$payload" | awk '{print $1}')"

      - name: Execute immutable artifact-only TB-R9 plan
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -uo pipefail
          log="${RUNNER_TEMP}/m3-cp4c0-tb-r9-activity.log"
          exec > >(tee -a "$log") 2>&1
          python3 "${RUNNER_TEMP}/m3-cp4c0-tb-r9.py"

      - name: Record final control status
        if: always()
        shell: bash
        run: |
          set +e
          log="${RUNNER_TEMP}/m3-cp4c0-tb-r9-activity.log"
          result="${RUNNER_TEMP}/m3-cp4c0-tb-r9-result"
          printf '%s\n' "final_job_status=${{ job.status }}" "finished_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" | tee -a "$log" | tee "$result/workflow-status.txt"

      - name: Upload TB-R9 result evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-cp4c0-tb-r9-reproof-result-${{ github.run_id }}
          path: ${{ runner.temp }}/m3-cp4c0-tb-r9-result
          if-no-files-found: error
          retention-days: 7

      - name: Upload TB-R9 diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-cp4c0-tb-r9-reproof-log-${{ github.run_id }}
          path: ${{ runner.temp }}/m3-cp4c0-tb-r9-activity.log
          if-no-files-found: error
          retention-days: 7
