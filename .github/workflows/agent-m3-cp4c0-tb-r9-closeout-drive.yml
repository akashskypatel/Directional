name: M3 CP4c0 TB-R9 Closeout Drive Apply

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m3-cp4c0-tb-r9-closeout-drive/run.txt

permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

concurrency:
  group: m3-cp4c0-tb-r9-closeout-drive-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/agent-m3-cp4c0-tb-r9-closeout-drive.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m3-cp4c0-tb-r9-closeout-drive
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  apply:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1vPUMV4eAuTt71x9s2TMt-hqbkif_zUhN
      patch_sha256: 04e3ffe106ed8541d4932777f86aaa1a80d81de813c0b2e1b91211f3d54e2780
      base_sha: 66325345567106fe7de8560ee2aee5f07ca665de
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: docs: close M3 CP4c-0 TB-R9
      retention_days: 7
    secrets: inherit
