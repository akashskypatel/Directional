name: Agent M4 CP SCALE DEFN Drive Caller Schema

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m4-cp-scale-defn-drive-schema/validate.txt

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: m4-cp-scale-defn-drive-schema
  cancel-in-progress: false

jobs:
  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m4-cp-scale-defn-drive-schema
      commit_run_file: false
    secrets: inherit

  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .agents/Directional/turn-payloads/m4-cp-scale-defn/drive-caller-draft.yml
      retention_days: 7
    secrets: inherit
