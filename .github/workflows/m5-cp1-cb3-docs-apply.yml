name: M5 CP1 CB3 Closeout Docs Patch Apply

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m5-cp1-cb3-docs-apply-20260920.txt

permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

concurrency:
  group: m5-cp1-cb3-docs-apply-${{ github.ref }}
  cancel-in-progress: false

jobs:
  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m5-cp1-cb3-docs-apply
      commit_run_file: false
      trim_stale_comments: false
    secrets: inherit

  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/m5-cp1-cb3-docs-apply.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  apply:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 12t_4fmEf3qMPfMLM1Q8z9Xg5KQDZ1zO4
      patch_sha256: fdf6910c32ec8670bb93ac1796664789c935d913faf3dfe3cd95051b76ed4f22
      base_sha: 540fdee1c31e431119c3c4d6eb68767bf4802206
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: 'docs(m5): close CB3 and hand off R3 artifact-only gate'
      retention_days: 7
    secrets: inherit
