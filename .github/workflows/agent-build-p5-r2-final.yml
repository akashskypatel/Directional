name: Agent Build Surface Cell P5 R2 Final

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .github/workflows/agent-build-p5-r2-final.yml
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: agent-surface-cell-p5-r2-final-${{ github.ref }}
  cancel-in-progress: true

env:
  ACTIVE_BRANCH: agent/surface_cell_quad/p5-recover-bridge-healing
  BUILD_DIR: build/agent-p5-r2-final-release
  PACKAGE_DIR: artifact
  LOG_DIR: /tmp/p5-r2-final-workflow-logs
  ACTIVITY_LOG: /tmp/p5-r2-final-workflow-logs/p5-r2-final-compile-activity.log

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Initialize persistent workflow log
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${LOG_DIR}"
          {
            echo "P5-R2 final directed wedge incidence compile-only build"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "event_sha=${GITHUB_SHA}"
            echo "started_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } | tee "${ACTIVITY_LOG}"

      - name: Record compile-only run start
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          message="P5-R2 final compile-only run ${GITHUB_RUN_ID} started for event commit ${GITHUB_SHA}. It normalizes the reviewed rollback block, compiles exactly four targets, and executes no project binary."
          echo "start_comment=${message}" | tee -a "${ACTIVITY_LOG}"
          gh api repos/${GITHUB_REPOSITORY}/issues/8/comments -f body="${message}"

      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: agent/surface_cell_quad/p5-recover-bridge-healing
          fetch-depth: 2
          submodules: false
          persist-credentials: true

      - name: Normalize source, compile, and package
        id: compile
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "${LOG_DIR}"
          exec > >(tee -a "${ACTIVITY_LOG}") 2>&1
          finish() {
            rc=$?
            trap - EXIT
            set +x
            {
              echo "compile_step_exit_code=${rc}"
              echo "compile_step_finished_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
              echo "final_git_status_begin"
              git status --short --branch || true
              echo "final_git_status_end"
              df -h . || true
              du -sh "${BUILD_DIR}" "${PACKAGE_DIR}" 2>/dev/null || true
            } | tee -a "${ACTIVITY_LOG}"
            exit "${rc}"
          }
          trap finish EXIT
          set -x

          event_sha=$(git rev-parse HEAD)
          remote_sha=$(git ls-remote origin "refs/heads/${ACTIVE_BRANCH}" | cut -f1)
          test "${event_sha}" = "${remote_sha}"
          test -z "$(git status --porcelain=v1)"

          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/geometry/SurfaceCellFeasibilityRepair.cpp')
          text = path.read_text(encoding='utf-8')
          start_marker = '  const SurfaceArrangementDiagnostics &d = complex.diagnostics;\n'
          end_marker = '  append_rollback_double(identity, d.supportedArea);\n'
          if text.count(start_marker) != 1 or text.count(end_marker) != 1:
              raise SystemExit('rollback diagnostics markers are not unique')
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          lines = [
              '  const SurfaceArrangementDiagnostics &d = complex.diagnostics;',
              '  const std::array<std::int64_t, 32> diagnosticsIdentity{{',
              '      d.plantedIntersections, d.uniqueIntersections, d.unsplitCrossings,',
              '      d.geometricTJunctions, d.incompleteArcChains,',
              '      d.hardBarrierCrossings, d.eulerCharacteristic,',
              '      d.sourceEulerCharacteristic, d.connectedComponentCount,',
              '      d.sourceConnectedComponentCount, d.boundaryLoopCount,',
              '      d.sourceBoundaryLoopCount, d.directedWedgeCount,',
              '      d.successorMissingCount, d.successorAmbiguityCount,',
              '      d.predecessorMultiplicityFailureCount, d.repeatedNodeCycleCount,',
              '      d.repeatedEdgeCycleCount, static_cast<int>(d.incidenceFailure),',
              '      d.incidenceFailureNode, d.incidenceFailureHalfedge,',
              '      d.incidenceFailureTwin, d.incidenceFailureNext,',
              '      static_cast<std::int64_t>(d.directedIncidenceHash),',
              '      d.incidenceValid ? 1 : 0, d.embeddingValid ? 1 : 0,',
              '      d.orientationValid ? 1 : 0, d.cellsDiskValid ? 1 : 0,',
              '      d.boundaryLoopsValid ? 1 : 0,',
              '      d.eulerCharacteristicValid ? 1 : 0,',
              '      d.topologyValid ? 1 : 0, d.peakSegmentsPerFace}};',
              '  for (const std::int64_t value : diagnosticsIdentity) {',
              '    append_rollback_word(identity, value);',
              '  }',
          ]
          replacement = '\n'.join(lines) + '\n'
          path.write_text(text[:start] + replacement + text[end:], encoding='utf-8')
          PY

          if test -n "$(git status --porcelain=v1)"; then
            git diff --check
            git diff --binary > /tmp/P5-R2-format-fix.patch
            format_sha=$(sha256sum /tmp/P5-R2-format-fix.patch | cut -d' ' -f1)
            printf '%s\n' "${format_sha}" > /tmp/format-fix-sha256.txt
            git config user.name directional-build-agent
            git config user.email directional-build-agent@users.noreply.github.com
            git add src/geometry/SurfaceCellFeasibilityRepair.cpp
            git commit -m 'P5-R2: normalize rollback identity formatting [skip ci]'
            git push origin "HEAD:${ACTIVE_BRANCH}"
          else
            printf '%s\n' already-formatted > /tmp/format-fix-sha256.txt
          fi

          source_sha=$(git rev-parse HEAD)
          test "${source_sha}" = "$(git ls-remote origin "refs/heads/${ACTIVE_BRANCH}" | cut -f1)"
          printf '%s\n' "${source_sha}" > /tmp/source-commit.txt
          printf '%s\n' "${event_sha}" > /tmp/workflow-event-commit.txt
          printf '%s\n' e4da79427d33a5fd7bf29b707ec0765974faf0bc67c2dc18e6f2e6e6dd9a8658 > /tmp/reviewed-patch-sha256.txt

          git submodule sync --recursive
          git submodule update --init --recursive --depth 1 --jobs 4
          git submodule status --recursive | tee /tmp/submodule-status.txt
          test "$(wc -l < /tmp/submodule-status.txt)" -eq 9
          git diff --check
          git status --porcelain=v1 > /tmp/source-status.txt
          test ! -s /tmp/source-status.txt

          rm -rf "${BUILD_DIR}" "${PACKAGE_DIR}"
          mkdir -p "${BUILD_DIR}" "${PACKAGE_DIR}/bin" "${PACKAGE_DIR}/lib" \
            "${PACKAGE_DIR}/source" "${PACKAGE_DIR}/logs"

          cmake -S . -B "${BUILD_DIR}" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_FLAGS_RELEASE='-O2 -DNDEBUG' \
            -DBUILD_SHARED_LIBS=OFF \
            -DDIRECTIONAL_BUILD_TESTS=ON \
            -DDIRECTIONAL_BUILD_BENCHMARKS=ON \
            -DDIRECTIONAL_BUILD_CLI=OFF \
            -DDIRECTIONAL_BUILD_GUI=OFF \
            -DDIRECTIONAL_ENABLE_GMP=OFF \
            -DDIRECTIONAL_ENABLE_PARDISO=OFF \
            -DDIRECTIONAL_ENABLE_CUDSS=OFF \
            -DDIRECTIONAL_ENABLE_SUITESPARSE=OFF \
            |& tee "${BUILD_DIR}/configure.log"

          cmake --build "${BUILD_DIR}" \
            --target directional_core directional_pipeline directional_phase1_tests directional_benchmarks \
            -j 4 |& tee "${BUILD_DIR}/build.log"

          test -f "${BUILD_DIR}/libdirectional_core.a"
          test -f "${BUILD_DIR}/libdirectional_pipeline.a"
          test -x "${BUILD_DIR}/directional_phase1_tests"
          test -x "${BUILD_DIR}/directional_benchmarks"
          fixture_root="${BUILD_DIR}/test-data/benchmarks/fixtures"
          find "${fixture_root}" -type f | sort | tee /tmp/fixture-files.txt
          test "$(wc -l < /tmp/fixture-files.txt)" -eq 26
          git status --porcelain=v1 > /tmp/source-status.txt
          test ! -s /tmp/source-status.txt

          cp "${BUILD_DIR}/directional_phase1_tests" "${PACKAGE_DIR}/bin/"
          cp "${BUILD_DIR}/directional_benchmarks" "${PACKAGE_DIR}/bin/"
          cp -a "${BUILD_DIR}/test-data" "${PACKAGE_DIR}/bin/"
          cp "${BUILD_DIR}/libdirectional_core.a" "${PACKAGE_DIR}/lib/"
          cp "${BUILD_DIR}/libdirectional_pipeline.a" "${PACKAGE_DIR}/lib/"
          git archive --format=tar.gz --output="${PACKAGE_DIR}/source/source.tar.gz" HEAD
          cp /tmp/source-commit.txt /tmp/workflow-event-commit.txt \
            /tmp/reviewed-patch-sha256.txt /tmp/format-fix-sha256.txt \
            /tmp/source-status.txt /tmp/submodule-status.txt \
            /tmp/fixture-files.txt "${PACKAGE_DIR}/"
          cp "${BUILD_DIR}/configure.log" "${BUILD_DIR}/build.log" \
            "${ACTIVITY_LOG}" "${PACKAGE_DIR}/logs/"
          find "${PACKAGE_DIR}" -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/files.sha256
          mv /tmp/files.sha256 "${PACKAGE_DIR}/files.sha256"
          sha256sum "${PACKAGE_DIR}/bin/directional_phase1_tests" \
            "${PACKAGE_DIR}/bin/directional_benchmarks" \
            "${PACKAGE_DIR}/lib/libdirectional_core.a" \
            "${PACKAGE_DIR}/lib/libdirectional_pipeline.a" \
            | tee "${PACKAGE_DIR}/built-targets.sha256"

      - name: Upload compiled checkpoint
        if: steps.compile.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: surface-cell-p5-r2-final-github-source-linux-release
          path: artifact
          if-no-files-found: error
          retention-days: 14
          compression-level: 6

      - name: Record compile-only result
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          COMPILE_OUTCOME: ${{ steps.compile.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${LOG_DIR}"
          source_sha=$(git rev-parse HEAD 2>/dev/null || printf '%s' unknown)
          message="P5-R2 final compile-only run ${GITHUB_RUN_ID} finished ${COMPILE_OUTCOME}. Event commit: ${GITHUB_SHA}; exact source head: ${source_sha}. No project binary executed."
          echo "result_comment=${message}" | tee -a "${ACTIVITY_LOG}"
          gh api repos/${GITHUB_REPOSITORY}/issues/8/comments -f body="${message}"

      - name: Always upload detailed workflow logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surface-cell-p5-r2-final-workflow-logs-${{ github.run_id }}
          path: /tmp/p5-r2-final-workflow-logs
          if-no-files-found: error
          retention-days: 30
