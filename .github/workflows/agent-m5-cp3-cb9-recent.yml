name: Agent M5 CP3 CB9 Recent Runs

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m5-cp3-cb9-recent/**

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: write

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/agent-m5-cp3-cb9-recent.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m5-cp3-cb9-recent
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  recent:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-recent-workflow-runs-reusable.yml
    with:
      per_page: 30
      max_pages: 1
      branch: agent/surface_cell_quad/p5-recover-bridge-healing
      event: push
    secrets: inherit
