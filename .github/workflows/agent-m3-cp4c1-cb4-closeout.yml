name: M3 CP4c1 CB4 Closeout

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m3-cp4c1-cb4/closeout.txt

permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

concurrency:
  group: m3-cp4c1-cb4-closeout
  cancel-in-progress: false

jobs:
  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m3-cp4c1-cb4-closeout
      commit_run_file: false
    secrets: inherit

  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/agent-m3-cp4c1-cb4-closeout.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  apply:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1FtnqcEhioly0ecl7CFAv1Twmx3OShC0I
      patch_sha256: 946eca7146253c1326717062cdd13b3b45ffbb8d037d0b12f45709ec6065f4e9
      base_sha: b1ce8ad65952bd2bd76238f6dfc55523f6a24747
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: "docs(M3-CP4c-1): close CB4 and hand off TB-R5"
      retention_days: 14
    secrets: inherit
