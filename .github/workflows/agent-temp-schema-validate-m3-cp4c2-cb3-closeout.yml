name: Temporary Schema Validate M3 CP4c2 CB3 Closeout Apply

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/schema-validate-m3-cp4c2-cb3-closeout-20260828.txt

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: temp-schema-validate-m3-cp4c2-cb3-closeout
  cancel-in-progress: false

jobs:
  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: schema-validate-m3-cp4c2-cb3-closeout
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  validate-bootstrap:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/agent-temp-schema-validate-m3-cp4c2-cb3-closeout.yml
      source_ref: ${{ github.sha }}
      retention_days: 7
    secrets: inherit

  validate-apply-draft:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .agents/Directional/turn-payloads/m3-cp4c2-cb3-closeout-drive-apply-caller.yml
      source_ref: ${{ github.sha }}
      retention_days: 7
    secrets: inherit
