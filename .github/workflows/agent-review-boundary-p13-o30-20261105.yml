name: Agent P13 O30 Review Boundary
on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/review-boundary/p13-o30-20261105.txt
permissions:
  actions: read
  contents: write
jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/agent-review-boundary-p13-o30-20261105.yml
      source_ref: ${{ github.sha }}
    secrets: inherit
  audit:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Initialize durable log
        shell: bash
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/p13-o30-boundary.log"
          : > "$log"
          printf 'run_id=%s\nevent_sha=%s\nrepository=%s\nstarted_utc=%s\n' "$GITHUB_RUN_ID" "$GITHUB_SHA" "$GITHUB_REPOSITORY" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" | tee -a "$log"
      - name: Checkout full authenticated history
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify review boundary against authentic ancestry
        shell: bash
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/p13-o30-boundary.log"
          exec > >(tee -a "$log") 2>&1
          trap 's=$?; echo "boundary_step_exit=$s finished_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"' EXIT
          echo "git_version=$(git --version)"
          echo "python_version=$(python3 --version)"
          echo "checkout_sha=$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git status -sb
          git merge-base --is-ancestor 92e2e9ce81f29fe6f39c02b87494b8666b4c7509 HEAD
          test -z "$(git diff --name-only 92e2e9ce81f29fe6f39c02b87494b8666b4c7509 HEAD -- src include tests benchmarks cmake CMakeLists.txt)"
          python3 .agents/Directional/tools/review_check.py boundary
          test -z "$(git status --porcelain)"
          echo 'REVIEW_BOUNDARY_PASS'
      - name: Upload diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p13-o30-review-boundary-log-${{ github.run_id }}
          path: ${{ runner.temp }}/p13-o30-boundary.log
          if-no-files-found: error
          retention-days: 7
  mailbox:
    if: ${{ always() }}
    needs: [audit]
    permissions:
      actions: read
      contents: write
    uses: ./.github/workflows/workflow-mailbox-publisher.yml
    with:
      mailbox_branch: workflow-mailbox
      workflow_key: p13-o30-review-boundary
      source_sha: ${{ github.sha }}
      source_ref: ${{ github.ref }}
      result: ${{ needs.audit.result }}
      summary: Full-history boundary for the completed P13 O30 Review.
