name: M1k Artifact Runtime Validation

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/Directional/connector-triggers/m1k-artifact-runtime-validation.txt

permissions:
  actions: read
  contents: read

concurrency:
  group: m1k-artifact-runtime-validation
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LOG_DIR: /tmp/m1k-runtime-validation-logs
      ACTIVITY_LOG: /tmp/m1k-runtime-validation-logs/activity.log
    steps:
      - name: Initialize persistent activity log
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$LOG_DIR"
          {
            echo "workflow=M1k Artifact Runtime Validation"
            echo "event_sha=$GITHUB_SHA"
            echo "repository=$GITHUB_REPOSITORY"
            echo "runner_os=$RUNNER_OS"
            echo "started_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } | tee "$ACTIVITY_LOG"

      - name: Checkout orchestration only
        uses: actions/checkout@v4
        with:
          ref: agent/surface_cell_quad/p5-recover-bridge-healing
          fetch-depth: 2
          submodules: false

      - name: Execute exact immutable M1k package
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          cmake --version | tee -a "$ACTIVITY_LOG"
          ninja --version | tee -a "$ACTIVITY_LOG"
          c++ --version | head -1 | tee -a "$ACTIVITY_LOG"
          bash .agents/Directional/turn-payloads/m1k-artifact-runtime-validation.sh

      - name: Upload M1k runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m1k-artifact-runtime-validation-evidence
          path: /tmp/m1k-artifact-runtime/evidence
          if-no-files-found: error
          retention-days: 14

      - name: Upload M1k runtime logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m1k-artifact-runtime-validation-logs
          path: /tmp/m1k-runtime-validation-logs
          if-no-files-found: error
          retention-days: 14
