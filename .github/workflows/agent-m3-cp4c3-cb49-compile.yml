name: M3 CP4c3 CB49 Compile

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m3-cp4c3-cb49-compile-20260908.txt

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: m3-cp4c3-cb49-compile
  cancel-in-progress: false

jobs:
  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m3-cp4c3-cb49-compile
      commit_run_file: false
    secrets: inherit

  changed-owner:
    uses: ./.github/workflows/agent-compile-reusable.yml
    with:
      source_sha: cf969597bda5c49e734b98db0c0165b421c4ee12
      targets: directional_surface_cell_producer_tests
      artifact_prefix: m3-cp4c3-cb49-owner
    secrets: inherit

  package:
    needs: changed-owner
    uses: ./.github/workflows/agent-compile-reusable.yml
    with:
      source_sha: cf969597bda5c49e734b98db0c0165b421c4ee12
      artifact_prefix: m3-cp4c3-cb49
    secrets: inherit
