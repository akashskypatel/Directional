name: M5 CP1 TB1 R1 Artifact-Only Test Benchmark

on:
  push:
    branches: [agent/surface_cell_quad/p5-recover-bridge-healing]
    paths: [.agents/connector-triggers/m5-cp1-tb1-r1-exec-20260920.txt]

permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: m5-cp1-tb1-r1-exec-${{ github.ref }}
  cancel-in-progress: false

jobs:
  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m5-cp1-tb1-r1-exec
      commit_run_file: false
      trim_stale_comments: false
    secrets: inherit

  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/m5-cp1-tb1-r1-exec.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  runtime:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
      CANDIDATE_ARTIFACT_ID: "10595705100"
      ROUTING_ARTIFACT_ID: "10592987234"
      EXPECTED_CANDIDATE_ZIP_SHA256: "fdc4046630c6f48b2bc76aad74ebc07b443a024fc9cfd76507bae515eb8668ea"
      EXPECTED_ROOT_MANIFEST_SHA256: "8330461b8c5e489059e2ec320cb2e2d5243d6ef36dc01b667b5cefc09f609a3d"
      EXPECTED_SOURCE_ARCHIVE_SHA256: "4f51257db12ae24363a45ddfa62778200e9ac0a8ef4ce2b585c8c606350d78b9"
      EXPECTED_SELECTOR430_SHA256: "1c4128500cb2f70f3bf00b85aadc44363ab89fdab906bf4aa7b140a4955a9db6"
      EXPECTED_SELECTOR427_SHA256: "f9c88380135a14d20492e215758cce35cab78ffe167b09fe5267d5ba2beae86f"
      EXPECTED_ROUTING_ZIP_SHA256: "352c8cfc9c9b89cf0d532c8e0836339a31ba35fd6e854a781721cbc76f02afce"
      EXPECTED_IDENTITY_MAP_SHA256: "7a92e7a3b8a69466423c4a0d2ad5ece2dcd4912f04eeb99e1f32fa70b4a5cf6c"
      EXPECTED_HARNESS_SHA256: "995d16b3dc67ab3e5675f2a1cf91f1ac99e926a9fc4ab977a534e35ee480f0a1"
      EXPECTED_SOURCE_COMMIT: b98f461b9a392cc182891a81c0a84b0b01dfbb45
      EXPECTED_SELECTOR_PATH: .agents/Directional/Architecture_M4_CP4_CB8_Required_Green_Selector_430.txt
    steps:
      - name: Initialize diagnostic log
        shell: bash
        run: |
          set -euo pipefail
          : > "${RUNNER_TEMP}/m5-cp1-tb1-r1-exec.log"
          printf 'workflow=%s\nrun_id=%s\nevent=%s\nevent_sha=%s\nrepository=%s\nstarted_at=%s\n' \
            "$GITHUB_WORKFLOW" "$GITHUB_RUN_ID" "$GITHUB_EVENT_NAME" "$GITHUB_SHA" "$GITHUB_REPOSITORY" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            | tee -a "${RUNNER_TEMP}/m5-cp1-tb1-r1-exec.log"

      - name: Execute immutable artifact-only gate
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          harness="${RUNNER_TEMP}/run-m5-cp1-tb1-r1.sh"
          printf '%s' '' | base64 -d | gzip -d > "$harness"
          actual_harness_sha="$(sha256sum "$harness" | awk '{print $1}')"
          if [[ "$actual_harness_sha" != "$EXPECTED_HARNESS_SHA256" ]]; then
            echo "harness SHA mismatch: ${actual_harness_sha}" | tee -a "${RUNNER_TEMP}/m5-cp1-tb1-r1-exec.log"
            echo 'harness_exit=2' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          chmod +x "$harness"
          set +e
          "$harness"
          status=$?
          set -e
          echo "harness_exit=${status}" >> "$GITHUB_OUTPUT"
          if [[ -d "${RUNNER_TEMP}/m5-cp1-tb1-r1-result" ]]; then
            printf 'decoded_harness_sha256=%s\n' "$actual_harness_sha" >> "${RUNNER_TEMP}/m5-cp1-tb1-r1-result/harness-authority.txt"
          fi
          exit 0

      - name: Record final diagnostic status
        if: always()
        shell: bash
        run: |
          printf 'gate_harness_exit=%s\njob_status_before_upload=%s\nfinished_step_at=%s\n' \
            "${{ steps.gate.outputs.harness_exit }}" "${{ job.status }}" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            | tee -a "${RUNNER_TEMP}/m5-cp1-tb1-r1-exec.log"

      - name: Upload result evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: directional-m5-cp1-tb1-r1-result-${{ github.run_id }}
          path: ${{ runner.temp }}/m5-cp1-tb1-r1-result
          if-no-files-found: error
          retention-days: 7

      - name: Upload diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: directional-m5-cp1-tb1-r1-log-${{ github.run_id }}
          path: ${{ runner.temp }}/m5-cp1-tb1-r1-exec.log
          if-no-files-found: error
          retention-days: 7

      - name: Fail closed on orchestration failure
        if: always()
        shell: bash
        run: test "${{ steps.gate.outputs.harness_exit }}" = "0"
