name: Agent M1 R-A REV-07-10 Source Snapshot

on:
  push:
    branches: [agent/surface_cell_quad/p5-recover-bridge-healing]
    paths: [.agents/connector-triggers/m1-ra-rev-07-10-source.txt]

permissions:
  contents: read

jobs:
  source-snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          submodules: false
      - name: Package exact source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mkdir -p "$RUNNER_TEMP/source"
          git archive --format=tar.gz -o "$RUNNER_TEMP/source/source-$GITHUB_SHA.tar.gz" "$GITHUB_SHA"
          git rev-parse HEAD > "$RUNNER_TEMP/source/source-commit.txt"
          printf '%s\n' 'runtimeExecution=false' 'purpose=source-snapshot-only' > "$RUNNER_TEMP/source/command-boundary.txt"
      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: m1-ra-rev-07-10-source-${{ github.run_id }}
          path: ${{ runner.temp }}/source
          if-no-files-found: error
          retention-days: 1
