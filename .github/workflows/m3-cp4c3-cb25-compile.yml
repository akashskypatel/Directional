name: M3 CP4c3 CB25 Compile

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m3-cp4c3-cb25-compile-preflight-20260904.txt
      - .agents/connector-triggers/m3-cp4c3-cb25-compile-package-20260904.txt

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: m3-cp4c3-cb25-compile-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/m3-cp4c3-cb25-compile.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m3-cp4c3-cb25-compile
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  preflight:
    needs: validate
    if: "${{ needs.validate.outputs.valid == 'true' && github.event.head_commit.message == 'chore: trigger CB25 compile preflight' }}"
    uses: ./.github/workflows/agent-compile-reusable.yml
    with:
      source_sha: e12396d471c0754b112a40272a7992020ff49ced
      targets: directional_surface_cell_producer_tests
      artifact_prefix: m3-cp4c3-cb25-preflight
    secrets: inherit

  package:
    needs: validate
    if: "${{ needs.validate.outputs.valid == 'true' && github.event.head_commit.message == 'chore: trigger CB25 compile package' }}"
    uses: ./.github/workflows/agent-compile-reusable.yml
    with:
      source_sha: e12396d471c0754b112a40272a7992020ff49ced
      targets: directional_core directional_pipeline directional_surface_cell_authority_kernel_tests directional_surface_cell_producer_tests directional_surface_cell_completion_tests directional_surface_cell_validation_tests directional_compiled_api_tests directional_benchmarks
      artifact_prefix: m3-cp4c3-cb25-package
    secrets: inherit
