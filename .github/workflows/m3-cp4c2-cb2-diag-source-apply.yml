name: M3 CP4c2 CB2 DIAG Source Apply

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m3-cp4c2-cb2-diag-source-apply/**

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

concurrency:
  group: m3-cp4c2-cb2-diag-source-apply-${{ github.ref }}
  cancel-in-progress: false

jobs:
  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m3-cp4c2-cb2-diag-source-apply
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/m3-cp4c2-cb2-diag-source-apply.yml
    secrets: inherit

  apply:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 18jXv4Eabagab92XaX1uL9vqmG85zeHIa
      patch_sha256: 377328dc7e82c5e60e12a1b9b0f566d1bd21d3db6b7a07cb6c1b431926afce9f
      base_sha: 7d93a21706f630fce55cee4ef1cbfdac24f7bd61
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: "M3-CP4c-2-CB2-DIAG: add independent cellularity diagnostics"
      retention_days: 14
    secrets: inherit
