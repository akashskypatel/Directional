name: Agent M3 CP4c3 TB24 EXEC

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m3-cp4c3-tb24-exec-20260904.txt

permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: write

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/agent-m3-cp4c3-tb24-exec.yml
      source_ref: ${{ github.sha }}
      retention_days: 14
    secrets: inherit

  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m3-cp4c3-tb24-exec
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  execute:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    env:
      ARTIFACT_ID: "9935929108"
      EXPECTED_ZIP_SHA256: "b5e11a2c97c110d2cf484d63bb3afe3b753e7f4769098ec927a5cf1692f5d881"
      EXPECTED_PROVIDER_DIGEST: "sha256:b5e11a2c97c110d2cf484d63bb3afe3b753e7f4769098ec927a5cf1692f5d881"
      EXPECTED_SOURCE_SHA: "9c72fea8b666534b9e52fa42bbe8cbf8ae68ffe5"
      EXPECTED_SELECTOR_397_SHA256: "d67e5fb72196313c54fbc21be0b446ab0fba3974c47c02e18c33dfe9b4853ee5"
      EXPECTED_SELECTOR_401_SHA256: "0d0857a97158dfd0763b536718c24ba257417866aad3d8e51d6f0093be5a5869"
      EXPECTED_DIRECTIONAL_BENCHMARKS_SHA256: "d5955517240f27c6c458384e5e897720598f6f890bf0df5178906e3248b43fb0"
      EXPECTED_COMPILED_API_SHA256: "57bbaa1632ea688b8b21cace5ed6a48dacb552bf04e00798427836baba206a58"
      EXPECTED_AUTHORITY_KERNEL_SHA256: "5efacc3ad52085a8ab76bad451bfc70c337e44a73a8f81a165f06ab1cd3041b3"
      EXPECTED_COMPLETION_SHA256: "1701820d85d91fe674cb3dd3496669f0a49ca43e6068a170fb0277227aba094a"
      EXPECTED_PRODUCER_SHA256: "f0fc4b097fafe6e79db6ec158b01c98177ff6761d1599cb999c03dc6fbf100cb"
      EXPECTED_VALIDATION_SHA256: "303af6ab231bf88b6b618df03315c9999a27595b8b55871922935f5098a4ca5f"
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Initialize TB24 diagnostic log
        shell: bash
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/m3-cp4c3-tb24-exec.log"
          : > "$log"
          printf '%s\n' \
            "workflow=${GITHUB_WORKFLOW}" \
            "run_id=${GITHUB_RUN_ID}" \
            "event=${GITHUB_EVENT_NAME}" \
            "event_sha=${GITHUB_SHA}" \
            "repository=${GITHUB_REPOSITORY}" \
            "started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" | tee -a "$log"

      - name: Execute immutable TB24 gate
        shell: bash
        run: |
          set -euo pipefail
          LOG="${RUNNER_TEMP}/m3-cp4c3-tb24-exec.log"
          exec > >(tee -a "$LOG") 2>&1
          ROOT="${RUNNER_TEMP}/m3-cp4c3-tb24"
          ZIP="${ROOT}/artifact-${ARTIFACT_ID}.zip"
          PKG="${ROOT}/package"
          SOURCE="${ROOT}/source"
          EXEC_VIEW="${ROOT}/execution-view"
          RUNTIME="${ROOT}/runtime"
          RESULT="${RUNNER_TEMP}/m3-cp4c3-tb24-result"
          mkdir -p "$ROOT" "$PKG" "$SOURCE" "$EXEC_VIEW/bin" "$RUNTIME" "$RESULT/raw" "$RESULT/resources"

          runtime_started=false
          runtime_completed=false
          preflight_completed=false
          execution_view_verified=false
          orchestration_failure=false
          benchmark_execution=false
          configure_execution=false
          compile_execution=false
          relink_execution=false
          generated_discovery=false
          package_repair=false
          mode_repair=false
          source_test_fixture_selector_mutation=false

          finish() {
            status=$?
            set +e
            printf '%s\n' \
              "script_exit=${status}" \
              "runtime_started=${runtime_started}" \
              "runtime_completed=${runtime_completed}" \
              "preflight_completed=${preflight_completed}" \
              "execution_view_verified=${execution_view_verified}" \
              "orchestration_failure=${orchestration_failure}" \
              "benchmark_execution=${benchmark_execution}" \
              "configure_execution=${configure_execution}" \
              "compile_execution=${compile_execution}" \
              "relink_execution=${relink_execution}" \
              "generated_discovery=${generated_discovery}" \
              "package_repair=${package_repair}" \
              "mode_repair=${mode_repair}" \
              "source_test_fixture_selector_mutation=${source_test_fixture_selector_mutation}" \
              "finished_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" | tee "${RESULT}/execution-boundary.txt"
          }
          trap finish EXIT

          fail_orchestration() {
            orchestration_failure=true
            echo "ORCHESTRATION_FAILURE: $*" >&2
            exit 90
          }

          census_tree() {
            local root="$1" out="$2"
            : > "$out"
            while IFS= read -r -d '' path; do
              rel="${path#"$root"/}"
              [[ "$path" == "$root" ]] && rel='.'
              mode="$(stat -c '%a' "$path")"
              type="$(stat -c '%F' "$path")"
              size="$(stat -c '%s' "$path")"
              digest='-'; target='-'
              [[ -f "$path" ]] && digest="$(sha256sum "$path" | awk '{print $1}')"
              [[ -L "$path" ]] && target="$(readlink "$path")"
              printf '%s\t%s\t%s\t%s\t%s\t%s\n' "$rel" "$type" "$mode" "$size" "$digest" "$target" >> "$out"
            done < <(find "$root" -mindepth 0 -print0 | LC_ALL=C sort -z)
          }

          artifact_json="${ROOT}/artifact.json"
          curl --fail-with-body --silent --show-error --location \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}" \
            -o "$artifact_json"
          [[ "$(jq -r '.id' "$artifact_json")" == "$ARTIFACT_ID" ]] || fail_orchestration 'artifact id mismatch'
          [[ "$(jq -r '.digest // empty' "$artifact_json")" == "$EXPECTED_PROVIDER_DIGEST" ]] || fail_orchestration 'provider digest mismatch'
          curl --fail-with-body --silent --show-error --location \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
            -o "$ZIP"
          [[ "$(sha256sum "$ZIP" | awk '{print $1}')" == "$EXPECTED_ZIP_SHA256" ]] || fail_orchestration 'outer package digest mismatch'
          printf '%s\n' \
            "artifact_id=$ARTIFACT_ID" \
            "artifact_name=$(jq -r '.name' "$artifact_json")" \
            "provider_digest=$(jq -r '.digest' "$artifact_json")" \
            "downloaded_zip_sha256=$(sha256sum "$ZIP" | awk '{print $1}')" > "${RESULT}/artifact-authority.txt"

          unzip -q "$ZIP" -d "$PKG"
          (cd "$PKG" && sha256sum -c SHA256SUMS) | tee "${RESULT}/package-manifest-check.txt"
          [[ "$(cat "$PKG/metadata/source-commit.txt")" == "$EXPECTED_SOURCE_SHA" ]] || fail_orchestration 'package source SHA mismatch'
          grep -Fxq 'runtimeExecution=false' "$PKG/metadata/command-boundary.txt" || fail_orchestration 'package runtime boundary missing'
          grep -Fxq 'turnBoundary=Code+Build-only' "$PKG/metadata/command-boundary.txt" || fail_orchestration 'package turn boundary missing'
          grep -Fxq 'exactArithmeticBackend=GMP' "$PKG/metadata/command-boundary.txt" || fail_orchestration 'GMP package boundary missing'
          cp "$PKG/metadata/command-boundary.txt" "${RESULT}/package-command-boundary.txt"
          cp "$PKG/metadata/gmp-evidence.txt" "${RESULT}/package-gmp-evidence.txt"

          declare -A expected_sha=(
            [directional_benchmarks]="$EXPECTED_DIRECTIONAL_BENCHMARKS_SHA256"
            [directional_compiled_api_tests]="$EXPECTED_COMPILED_API_SHA256"
            [directional_surface_cell_authority_kernel_tests]="$EXPECTED_AUTHORITY_KERNEL_SHA256"
            [directional_surface_cell_completion_tests]="$EXPECTED_COMPLETION_SHA256"
            [directional_surface_cell_producer_tests]="$EXPECTED_PRODUCER_SHA256"
            [directional_surface_cell_validation_tests]="$EXPECTED_VALIDATION_SHA256"
          )
          printf 'binary\tsha256\tmode\n' > "${RESULT}/runtime-executables.tsv"
          for binary in "${!expected_sha[@]}"; do
            path="$PKG/bin/$binary"
            [[ -f "$path" ]] || fail_orchestration "missing packaged executable $binary"
            mode="$(stat -c '%a' "$path")"
            case "$mode" in *1|*3|*5|*7) ;; *) fail_orchestration "missing executable mode: $binary mode=$mode" ;; esac
            actual="$(sha256sum "$path" | awk '{print $1}')"
            [[ "$actual" == "${expected_sha[$binary]}" ]] || fail_orchestration "binary digest mismatch: $binary"
            printf '%s\t%s\t%s\n' "$binary" "$actual" "$mode" >> "${RESULT}/runtime-executables.tsv"
          done

          source_tar="$PKG/source/source-${EXPECTED_SOURCE_SHA}.tar.gz"
          [[ -f "$source_tar" ]] || fail_orchestration 'packaged source archive missing'
          tar -xzf "$source_tar" -C "$SOURCE"
          selector397="$SOURCE/.agents/Directional/Architecture_M3_CP4c3_Required_Green_Selector_397.txt"
          selector401="$SOURCE/.agents/Directional/Architecture_M3_CP4c3_Required_Green_Selector_401.txt"
          [[ -f "$selector397" && -f "$selector401" ]] || fail_orchestration 'required selector missing from packaged source'
          [[ "$(sha256sum "$selector397" | awk '{print $1}')" == "$EXPECTED_SELECTOR_397_SHA256" ]] || fail_orchestration 'selector397 hash mismatch'
          [[ "$(sha256sum "$selector401" | awk '{print $1}')" == "$EXPECTED_SELECTOR_401_SHA256" ]] || fail_orchestration 'selector401 hash mismatch'
          [[ "$(wc -l < "$selector397" | tr -d ' ')" == 397 ]] || fail_orchestration 'selector397 count mismatch'
          [[ "$(wc -l < "$selector401" | tr -d ' ')" == 401 ]] || fail_orchestration 'selector401 count mismatch'
          head -n 397 "$selector401" > "${ROOT}/selector-prefix.txt"
          cmp -s "$selector397" "${ROOT}/selector-prefix.txt" || fail_orchestration 'selector397 prefix mismatch'
          printf '%s\n' \
            "selector397_sha256=$(sha256sum "$selector397" | awk '{print $1}')" \
            "selector397_count=397" \
            "selector401_sha256=$(sha256sum "$selector401" | awk '{print $1}')" \
            "selector401_count=401" \
            "selector397_exact_prefix_of_401=true" > "${RESULT}/selector-authority.txt"

          for binary in "${!expected_sha[@]}"; do ln "$PKG/bin/$binary" "$EXEC_VIEW/bin/$binary"; done
          cp -a "$SOURCE/test-data" "$EXEC_VIEW/test-data"
          known_fixture="$EXEC_VIEW/test-data/benchmarks/fixtures/milestone-g/mechanical_feature.obj"
          [[ -f "$known_fixture" ]] || fail_orchestration 'execution-view fixture tree missing'
          grep -Fq 'executableDirectory.parent_path() / "test-data"' "$SOURCE/tests/TestFixturePaths.h" || fail_orchestration 'sibling fixture rule drifted'
          grep -Fq 'return std::nullopt' "$SOURCE/tests/TestFixturePaths.h" || fail_orchestration 'fail-closed fixture rule missing'
          for binary in "${!expected_sha[@]}"; do
            [[ "$(stat -c '%d:%i' "$PKG/bin/$binary")" == "$(stat -c '%d:%i' "$EXEC_VIEW/bin/$binary")" ]] || fail_orchestration "execution view not package hardlink: $binary"
          done
          execution_view_verified=true
          printf '%s\n' \
            'resolved_rule=executableDirectory.parent_path()/test-data' \
            "resolved_test_data=$EXEC_VIEW/test-data" \
            "known_fixture=$known_fixture" \
            'execution_view_uses_package_hardlinks=true' > "${RESULT}/execution-view.txt"

          python3 - "$SOURCE" "${RESULT}/identity-map.tsv" <<'PY'
          import hashlib, pathlib, re, sys
          root=pathlib.Path(sys.argv[1]); out=pathlib.Path(sys.argv[2])
          selector=(root/'.agents/Directional/Architecture_M3_CP4c3_Required_Green_Selector_401.txt').read_text().splitlines()
          cm=(root/'cmake/DirectionalTests.cmake').read_text()
          targets={
            'directional_compiled_api_tests':['tests/CompiledLibraryTests.cpp'],
            'directional_surface_cell_producer_tests':[],
            'directional_surface_cell_authority_kernel_tests':['tests/FieldTransportAtlasTests.cpp','tests/SurfaceCellAuthorityKernelTests.cpp'],
            'directional_surface_cell_completion_tests':['tests/FlowRepStrandsPhase15Tests.cpp','tests/PatchDescriptorMilestoneETests.cpp','tests/PureQuadCompletionPhase18Tests.cpp','tests/SurfaceArrangementRowIdentityTests.cpp','tests/SurfaceComplexSimplificationPhase17Tests.cpp'],
            'directional_surface_cell_validation_tests':['tests/SourceAuthoritativeMeshValidatorPhase22Tests.cpp','tests/SurfaceMeshOptimizerPhase19Tests.cpp','tests/SurfaceMeshOptimizerPhase20Tests.cpp','tests/SurfaceMeshOptimizerPhase21Tests.cpp','tests/SurfaceMeshOptimizerPhase22Tests.cpp']}
          m=re.search(r'set\(DIRECTIONAL_SURFACE_CELL_PRODUCER_TEST_SOURCES(.*?)\)\n\nadd_executable',cm,re.S)
          if not m: raise SystemExit('producer source set not found')
          targets['directional_surface_cell_producer_tests'] += [x.strip() for x in m.group(1).splitlines() if x.strip().endswith('.cpp')]
          pattern=re.compile(r'\bTEST(?:_F|_P)?\s*\(\s*([A-Za-z0-9_]+)\s*,\s*([A-Za-z0-9_]+)\s*\)')
          owners={}
          for target,files in targets.items():
            for rel in files:
              for suite,name in pattern.findall((root/rel).read_text(errors='replace')): owners.setdefault(f'{suite}.{name}',[]).append((target,rel))
          rows=[]
          for ordinal,identity in enumerate(selector,1):
            found=owners.get(identity,[])
            if len(found)!=1: raise SystemExit(f'identity owner count {len(found)} for {ordinal}:{identity}')
            rows.append((ordinal,identity,*found[0]))
          out.write_text('ordinal\tidentity\tbinary\tsource\n'+''.join(f'{o}\t{i}\t{b}\t{s}\n' for o,i,b,s in rows))
          print('identity_count='+str(len(rows)))
          print('identity_map_sha256='+hashlib.sha256(out.read_bytes()).hexdigest())
          PY
          [[ "$(($(wc -l < "${RESULT}/identity-map.tsv") - 1))" == 401 ]] || fail_orchestration 'identity map count mismatch'
          sha256sum "${RESULT}/identity-map.tsv" > "${RESULT}/identity-map.sha256"

          {
            uname -a
            getconf GNU_LIBC_VERSION
            echo "cores=$(nproc)"
            lscpu
            free -b
          } > "${RESULT}/runtime-environment.txt"
          [[ -x /usr/bin/time ]] || fail_orchestration '/usr/bin/time unavailable'
          census_tree "$PKG" "${RESULT}/package-census-before.tsv"
          census_tree "$SOURCE" "${RESULT}/source-census-before.tsv"
          census_tree "$EXEC_VIEW" "${RESULT}/execution-view-before.tsv"
          package_before="$(sha256sum "${RESULT}/package-census-before.tsv" | awk '{print $1}')"
          source_before="$(sha256sum "${RESULT}/source-census-before.tsv" | awk '{print $1}')"
          exec_before="$(sha256sum "${RESULT}/execution-view-before.tsv" | awk '{print $1}')"
          printf '%s\n' "package_census_sha256=$package_before" "source_census_sha256=$source_before" "execution_view_census_sha256=$exec_before" > "${RESULT}/preflight-census-sha256.txt"
          preflight_completed=true

          printf 'ordinal\tidentity\tbinary\tbinary_sha256\texit\tselected\tresult\tclass\tmax_rss_kb\telapsed\traw_log\tresource_log\n' > "${RESULT}/ledger.tsv"
          runtime_started=true
          ordinal=0
          while IFS= read -r identity || [[ -n "$identity" ]]; do
            ordinal=$((ordinal+1))
            binary="$(awk -F '\t' -v o="$ordinal" 'NR>1 && $1==o {print $3; exit}' "${RESULT}/identity-map.tsv")"
            [[ -n "$binary" ]] || fail_orchestration "binary route missing for ordinal $ordinal"
            class=carried-cp4c3; (( ordinal<=365 )) && class=accepted-prefix; (( ordinal>=398 )) && class=new-cb27-witness
            raw="${RESULT}/raw/ordinal-$(printf '%03d' "$ordinal").log"
            resource="${RESULT}/resources/ordinal-$(printf '%03d' "$ordinal").time.txt"
            work="${RUNTIME}/ordinal-$(printf '%03d' "$ordinal")"; mkdir -p "$work"
            echo "TB24 ordinal=$ordinal identity=$identity owner=$binary class=$class"
            set +e
            (cd "$work" && /usr/bin/time -v -o "$resource" "$EXEC_VIEW/bin/$binary" --gtest_filter="$identity") > "$raw" 2>&1
            code=$?
            set -e
            cat "$raw"
            selected="$(grep -Ec '^\[ RUN      \] ' "$raw" || true)"
            [[ "$selected" == 1 ]] || fail_orchestration "non-single selection ordinal=$ordinal selected=$selected"
            result=RED; [[ "$code" == 0 ]] && result=PASS
            rss="$(sed -n 's/^[[:space:]]*Maximum resident set size (kbytes):[[:space:]]*//p' "$resource" | tail -1)"
            elapsed="$(sed -n 's/^[[:space:]]*Elapsed (wall clock) time (h:mm:ss or m:ss):[[:space:]]*//p' "$resource" | tail -1)"
            printf '%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\n' \
              "$ordinal" "$identity" "$binary" "${expected_sha[$binary]}" "$code" "$selected" "$result" "$class" "${rss:-unavailable}" "${elapsed:-unavailable}" "raw/$(basename "$raw")" "resources/$(basename "$resource")" >> "${RESULT}/ledger.tsv"
          done < "$selector401"
          [[ "$ordinal" == 401 ]] || fail_orchestration "incomplete ledger ordinal=$ordinal"
          runtime_completed=true
          sha256sum "${RESULT}/ledger.tsv" > "${RESULT}/ledger.sha256"

          census_tree "$PKG" "${RESULT}/package-census-after.tsv"
          census_tree "$SOURCE" "${RESULT}/source-census-after.tsv"
          census_tree "$EXEC_VIEW" "${RESULT}/execution-view-after.tsv"
          package_after="$(sha256sum "${RESULT}/package-census-after.tsv" | awk '{print $1}')"
          source_after="$(sha256sum "${RESULT}/source-census-after.tsv" | awk '{print $1}')"
          exec_after="$(sha256sum "${RESULT}/execution-view-after.tsv" | awk '{print $1}')"
          [[ "$package_after" == "$package_before" ]] || fail_orchestration 'package census changed'
          if [[ "$source_after" != "$source_before" ]]; then source_test_fixture_selector_mutation=true; fail_orchestration 'source census changed'; fi
          [[ "$exec_after" == "$exec_before" ]] || fail_orchestration 'execution view census changed'
          printf '%s\n' \
            'package_census_equal=true' \
            'source_census_equal=true' \
            'execution_view_census_equal=true' \
            "package_before_sha256=$package_before" \
            "package_after_sha256=$package_after" \
            "source_before_sha256=$source_before" \
            "source_after_sha256=$source_after" \
            "execution_view_before_sha256=$exec_before" \
            "execution_view_after_sha256=$exec_after" > "${RESULT}/postflight-immutability.txt"
          echo 'TB24_EXEC_COMPLETE: immutable artifact-only runtime completed; interpretation deferred.'

      - name: Record final TB24 status
        if: always()
        shell: bash
        run: |
          set +e
          log="${RUNNER_TEMP}/m3-cp4c3-tb24-exec.log"
          result="${RUNNER_TEMP}/m3-cp4c3-tb24-result"
          mkdir -p "$result"
          printf '%s\n' \
            "final_job_status=${{ job.status }}" \
            "event_sha=${GITHUB_SHA}" \
            'runtime_package_artifact_id=9935929108' \
            'semantic_source=9c72fea8b666534b9e52fa42bbe8cbf8ae68ffe5' \
            "finished_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" | tee -a "$log" | tee "${result}/workflow-status.txt"

      - name: Upload TB24 result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-cp4c3-tb24-result-${{ github.run_id }}
          path: ${{ runner.temp }}/m3-cp4c3-tb24-result
          if-no-files-found: error
          retention-days: 14

      - name: Upload TB24 diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-cp4c3-tb24-log-${{ github.run_id }}
          path: ${{ runner.temp }}/m3-cp4c3-tb24-exec.log
          if-no-files-found: error
          retention-days: 14
