name: M4 CP1 CB2 Stop Docs Apply

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m4-cp1-cb2-stop-apply-20260909.txt

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

concurrency:
  group: m4-cp1-cb2-stop-docs-apply-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/m4-cp1-cb2-stop-apply.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m4-cp1-cb2-stop-apply
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  apply:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1iOGL4dAYtVq5IWROSCbs8dbBfLi07Gf6
      patch_sha256: '5ce4b67725076cba6267150c524236c44ee7c331dbbdc1cd5fab500c483aa5a5'
      base_sha: 9c32b5bd932dd17c40a7fe12c2441547e1ecc6a5
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: 'docs: record M4-CP1-CB2 solver traceability stop'
      retention_days: 14
    secrets: inherit
