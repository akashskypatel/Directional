name: Agent CB35 Drive Apply

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/drive-apply/cb35-20260905.txt

permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

concurrency:
  group: agent-cb35-drive-apply-temp
  cancel-in-progress: false

jobs:
  validate-caller:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/agent-cb35-drive-apply-temp.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      commit_run_file: false
      label: m3-cp4c3-cb35-drive-apply
    secrets: inherit

  apply:
    needs: validate-caller
    if: ${{ needs.validate-caller.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1bBwC-YbXXDWPyNmj_aVphdx2NImJVGX_
      patch_sha256: 341655cf7ac5f5fc6c1e6c97ece0227216196d0a211422b0a052244b3b83289e
      base_sha: c12e459117eb9c54d6f279f565df1b02e04769f0
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: 'test: restore CP4c3 census witness authority for CB35'
    secrets: inherit
