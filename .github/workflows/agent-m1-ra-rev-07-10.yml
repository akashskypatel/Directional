name: Agent M1 R-A REV-07-10 Compile

on:
  push:
    branches: [agent/surface_cell_quad/p5-recover-bridge-healing]
    paths: [.agents/connector-triggers/m1-ra-rev-07-10.txt]

permissions:
  contents: write
  actions: write

concurrency:
  group: agent-m1-ra-rev-07-10
  cancel-in-progress: false

env:
  CCACHE_MAXSIZE: 256M

jobs:
  patch-audit-compile-package:
    runs-on: ubuntu-latest
    steps:
      - name: Initialize persistent activity log
        shell: bash
        run: |
          set -euo pipefail
          : > "$RUNNER_TEMP/activity.log"
          printf '%s\n' \
            'task=M1 R-A-REV-07-through-10 partial Code+Build' \
            "event_sha=$GITHUB_SHA" \
            "ref=$GITHUB_REF" \
            'runtimeExecution=false' | tee -a "$RUNNER_TEMP/activity.log"

      - name: Checkout exact trigger authority
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          submodules: recursive

      - name: Apply reviewed source patch and push exact source
        shell: bash
        run: |
          set -euo pipefail
          LOG="$RUNNER_TEMP/activity.log"
          exec > >(tee -a "$LOG") 2>&1
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          cat > "$RUNNER_TEMP/patch.b64" <<'B64'

B64
          base64 --decode "$RUNNER_TEMP/patch.b64" | gzip -d > "$RUNNER_TEMP/review.patch"
          cat > "$RUNNER_TEMP/audit.b64" <<'B64'

B64
          base64 --decode "$RUNNER_TEMP/audit.b64" | gzip -d > "$RUNNER_TEMP/source-audit.py"
          git apply --check "$RUNNER_TEMP/review.patch"
          git apply "$RUNNER_TEMP/review.patch"
          python3 "$RUNNER_TEMP/source-audit.py" | tee "$RUNNER_TEMP/source-audit.txt"
          git diff --check
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' \
            include/directional/geometry/SurfaceMeshOptimizer.h \
            include/directional/pipeline/RemeshPipeline.h \
            include/directional/validation/MeshValidator.h \
            src/geometry/PureQuadCompletion.cpp \
            src/geometry/SurfaceMeshOptimizer.cpp \
            src/pipeline/RemeshPipeline.cpp \
            tests/MilestoneFBenchmark.cpp \
            tests/PureQuadCompletionPhase18Tests.cpp \
            tests/SurfaceCellTransitionQuotientTests.cpp \
            tests/SurfaceMeshOptimizerPhase22Tests.cpp | sort)"
          printf 'changed_files=\n%s\n' "$changed"
          test "$changed" = "$expected"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $changed
          git commit -m "fix: close M1 R-A REV-07 through REV-10"
          SOURCE_SHA="$(git rev-parse HEAD)"
          echo "SOURCE_SHA=$SOURCE_SHA" >> "$GITHUB_ENV"
          echo "source_sha=$SOURCE_SHA"
          git push origin "HEAD:$GITHUB_REF"
          git status --porcelain=v1 | tee "$RUNNER_TEMP/source-status-preconfigure.txt"
          test ! -s "$RUNNER_TEMP/source-status-preconfigure.txt"

      - name: Install and configure ccache
        shell: bash
        run: |
          set -euo pipefail
          LOG="$RUNNER_TEMP/activity.log"
          exec > >(tee -a "$LOG") 2>&1
          sudo apt-get update
          sudo apt-get install -y ccache
          export CCACHE_DIR="$RUNNER_TEMP/ccache"
          mkdir -p "$CCACHE_DIR"
          ccache --set-config=max_size="$CCACHE_MAXSIZE"
          ccache --set-config=compression=true

      - name: Configure Release static PRE_TEST out of tree
        shell: bash
        run: |
          set -euo pipefail
          LOG="$RUNNER_TEMP/activity.log"
          exec > >(tee -a "$LOG") 2>&1
          export CCACHE_DIR="$RUNNER_TEMP/ccache"
          BUILD="$RUNNER_TEMP/build-m1-ra-rev-07-10"
          echo "BUILD_DIR=$BUILD" >> "$GITHUB_ENV"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git status --porcelain=v1 | tee "$RUNNER_TEMP/source-status-before-configure.txt"
          test ! -s "$RUNNER_TEMP/source-status-before-configure.txt"
          cmake -S . -B "$BUILD" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DBUILD_SHARED_LIBS=OFF \
            -DDIRECTIONAL_BUILD_CLI=OFF \
            -DDIRECTIONAL_BUILD_GUI=OFF \
            -DDIRECTIONAL_BUILD_TESTS=ON \
            -DDIRECTIONAL_BUILD_BENCHMARKS=ON \
            -DDIRECTIONAL_BUILD_HISTORICAL_TESTS=OFF \
            -DDIRECTIONAL_BUILD_LEGACY_INTEGRATION_TESTS=OFF \
            -DDIRECTIONAL_BUILD_OPTIONAL_GUIDANCE_TESTS=OFF \
            -DDIRECTIONAL_ENABLE_GMP=OFF \
            -DDIRECTIONAL_ENABLE_PARDISO=OFF \
            -DDIRECTIONAL_ENABLE_SUITESPARSE=OFF \
            -DDIRECTIONAL_ENABLE_CUDSS=OFF \
            -DCMAKE_GTEST_DISCOVER_TESTS_DISCOVERY_MODE=PRE_TEST
          git status --porcelain=v1 | tee "$RUNNER_TEMP/source-status-after-configure.txt"
          test ! -s "$RUNNER_TEMP/source-status-after-configure.txt"

      - name: Compile and link approved targets only
        shell: bash
        run: |
          set -uo pipefail
          LOG="$RUNNER_TEMP/activity.log"
          exec > >(tee -a "$LOG") 2>&1
          export CCACHE_DIR="$RUNNER_TEMP/ccache"
          set +e
          cmake --build "$BUILD_DIR" --target \
            directional_core \
            directional_pipeline \
            directional_surface_cell_authority_kernel_tests \
            directional_surface_cell_producer_tests \
            directional_surface_cell_completion_tests \
            directional_surface_cell_validation_tests \
            directional_compiled_api_tests \
            directional_benchmarks -- -j2
          rc=$?
          set -e
          echo "$rc" > "$RUNNER_TEMP/build-exit-code"
          echo "build_exit=$rc"
          ccache -s
          git status --porcelain=v1 | tee "$RUNNER_TEMP/source-status-after-build.txt"
          echo "runtimeExecution=false"
          echo "No generated Directional binary, discovery, test, benchmark, ctest, CLI, fuzzer, help/version command, or custom input was executed."
          exit 0

      - name: Propagate compile status
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f "$RUNNER_TEMP/build-exit-code" || { echo 'compile_status=missing'; exit 1; }
          rc="$(cat "$RUNNER_TEMP/build-exit-code")"
          echo "compile_status=$rc" | tee -a "$RUNNER_TEMP/activity.log"
          exit "$rc"

      - name: Package and self-verify compile evidence
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          LOG="$RUNNER_TEMP/activity.log"
          exec > >(tee -a "$LOG") 2>&1
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git status --porcelain=v1 | tee "$RUNNER_TEMP/source-status-final.txt"
          test ! -s "$RUNNER_TEMP/source-status-final.txt"
          OUT="$RUNNER_TEMP/result"
          mkdir -p "$OUT/metadata" "$OUT/source" "$OUT/bin" "$OUT/lib"
          git rev-parse HEAD > "$OUT/metadata/source-commit.txt"
          cp "$RUNNER_TEMP/source-audit.txt" "$OUT/metadata/source-audit.txt"
          cp "$RUNNER_TEMP/source-status-preconfigure.txt" "$OUT/metadata/source-status-preconfigure.txt"
          cp "$RUNNER_TEMP/source-status-before-configure.txt" "$OUT/metadata/source-status-before-configure.txt"
          cp "$RUNNER_TEMP/source-status-after-configure.txt" "$OUT/metadata/source-status-after-configure.txt"
          cp "$RUNNER_TEMP/source-status-after-build.txt" "$OUT/metadata/source-status-after-build.txt"
          cp "$RUNNER_TEMP/source-status-final.txt" "$OUT/metadata/source-status-final.txt"
          cp "$BUILD_DIR/CMakeCache.txt" "$OUT/metadata/CMakeCache.txt"
          cp "$RUNNER_TEMP/build-exit-code" "$OUT/metadata/build-exit-code.txt"
          git diff "$GITHUB_SHA" "$SOURCE_SHA" -- \
            include/directional/geometry/SurfaceMeshOptimizer.h \
            include/directional/pipeline/RemeshPipeline.h \
            include/directional/validation/MeshValidator.h \
            src/geometry/PureQuadCompletion.cpp \
            src/geometry/SurfaceMeshOptimizer.cpp \
            src/pipeline/RemeshPipeline.cpp \
            tests/MilestoneFBenchmark.cpp \
            tests/PureQuadCompletionPhase18Tests.cpp \
            tests/SurfaceCellTransitionQuotientTests.cpp \
            tests/SurfaceMeshOptimizerPhase22Tests.cpp > "$OUT/metadata/source.patch"
          git archive --format=tar.gz -o "$OUT/source/source-$SOURCE_SHA.tar.gz" "$SOURCE_SHA"
          cp "$BUILD_DIR/directional_surface_cell_authority_kernel_tests" "$OUT/bin/"
          cp "$BUILD_DIR/directional_surface_cell_producer_tests" "$OUT/bin/"
          cp "$BUILD_DIR/directional_surface_cell_completion_tests" "$OUT/bin/"
          cp "$BUILD_DIR/directional_surface_cell_validation_tests" "$OUT/bin/"
          cp "$BUILD_DIR/directional_compiled_api_tests" "$OUT/bin/"
          cp "$BUILD_DIR/directional_benchmarks" "$OUT/bin/"
          cp "$BUILD_DIR/libdirectional_core.a" "$OUT/lib/"
          cp "$BUILD_DIR/libdirectional_pipeline.a" "$OUT/lib/"
          printf '%s\n' \
            'runtimeExecution=false' \
            'turnBoundary=Code+Build-only' \
            'sourceAudit=R-A-REV-07-10-complete-affected-path-inventory' \
            'packageSelfVerification=true' \
            'manifestExcludesSelf=true' \
            'buildLocation=runner-temp-out-of-tree' \
            'generatedRuntimeExecution=none' > "$OUT/metadata/command-boundary.txt"
          (cd "$OUT" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          (cd "$OUT" && sha256sum -c SHA256SUMS)
          test "$(grep -c 'SHA256SUMS' "$OUT/SHA256SUMS" || true)" -eq 0
          echo "manifest_self_verification=pass"
          echo "source_status_clean=pass"

      - name: Upload compile result
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: m1-ra-rev-07-10-compile-result-${{ github.run_id }}
          path: ${{ runner.temp }}/result
          if-no-files-found: error
          retention-days: 7

      - name: Upload persistent activity log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m1-ra-rev-07-10-compile-log-${{ github.run_id }}
          path: ${{ runner.temp }}/activity.log
          if-no-files-found: error
          retention-days: 7
