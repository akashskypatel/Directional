name: M6 CP2 TB1 Verifier R2 Closeout Apply

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m6-cp2-tb1-r2-exec-closeout-apply.txt

permissions:
  actions: read
  contents: write
  id-token: write

concurrency:
  group: m6-cp2-tb1-r2-exec-closeout-apply
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/m6-cp2-tb1-r2-exec-closeout-apply.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  apply:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 19w4DSDCSDpyDCMintVl6kYCXcpAMtjts
      patch_sha256: a321c2105941c7437eca44dd2374e31e454349c8647aaf1e2b7c377731fb067c
      base_sha: 70ffc92809d9545870b05ac983d3e2f9c280a61d
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: "M6 CP2 TB1 verifier R2 EXEC closeout"
    secrets: inherit

  mailbox:
    if: ${{ always() }}
    needs: [apply]
    uses: ./.github/workflows/workflow-mailbox-publisher.yml
    with:
      workflow_key: m6-cp2-tb1-r2-exec-closeout-apply
      source_sha: ${{ github.sha }}
      source_ref: ${{ github.ref }}
      result: ${{ needs.apply.result }}
      summary: Apply durable M6-CP2-TB1-VERIFIER-R2-EXEC closeout records.
