name: Agent M4 CP3 CB4 R3 Compile

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m4-cp3-cb4-r3-compile.txt

permissions:
  contents: write
  actions: write
  issues: write
  pull-requests: write

concurrency:
  group: agent-m4-cp3-cb4-r3-compile
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/agent-m4-cp3-cb4-r3-compile.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m4-cp3-cb4-r3-compile
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  preflight:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-compile-reusable.yml
    with:
      source_sha: 7fdc3c001de9193f8f94591d3e74d1c94c260195
      targets: directional_surface_cell_producer_tests
      artifact_prefix: m4-cp3-cb4-r3-preflight
    secrets: inherit

  package:
    needs:
      - validate
      - preflight
    if: ${{ needs.validate.outputs.valid == 'true' && needs.preflight.result == 'success' }}
    uses: ./.github/workflows/agent-compile-reusable.yml
    with:
      source_sha: 7fdc3c001de9193f8f94591d3e74d1c94c260195
      targets: directional_core directional_pipeline directional_surface_cell_authority_kernel_tests directional_surface_cell_producer_tests directional_surface_cell_completion_tests directional_surface_cell_validation_tests directional_compiled_api_tests directional_benchmarks
      artifact_prefix: m4-cp3-cb4-r3-package
    secrets: inherit
