name: Agent M4 CP-COND TB4 Review Drive Apply

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m4-cp-cond-tb4-rev-drive-apply-20260913.txt

permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

concurrency:
  group: agent-m4-cp-cond-tb4-rev-drive-apply-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/agent-m4-cp-cond-tb4-rev-drive-apply.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m4-cp-cond-tb4-rev-drive-apply
      commit_run_file: false
    secrets: inherit

  apply-drive-patch:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 19dLIf-Jw_uC0TKht-yQeFRkZoaQ8Rn1q
      patch_sha256: 984248a5ec7329a80e2df2b9556c359402d8024e4f0a64c4e86f5f7045b78251
      base_sha: d309f3bc128583c5280db56a71f4cb18f8614acf
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: 'docs: finalize M4-CP-COND-TB4-REV push confirmation'
      retention_days: 14
    secrets: inherit
