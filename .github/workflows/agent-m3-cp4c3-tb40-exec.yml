name: Agent M3 CP4c3 TB40 EXEC
on:
  push:
    branches: [agent/surface_cell_quad/p5-recover-bridge-healing]
    paths: [.agents/connector-triggers/m3-cp4c3-tb40-exec/trigger.json]
permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: write
concurrency:
  group: agent-m3-cp4c3-tb40-exec
  cancel-in-progress: false
jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/agent-m3-cp4c3-tb40-exec.yml
      source_ref: ${{ github.sha }}
    secrets: inherit
  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m3-cp4c3-tb40-exec
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit
  tb40:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout control source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          path: control
          token: ${{ secrets.GH_TOKEN || github.token }}
      - name: Checkout exact CB45 semantic source
        uses: actions/checkout@v4
        with:
          ref: 0f09439893182235c382492583b82aa35f25045c
          fetch-depth: 1
          path: semantic
          token: ${{ secrets.GH_TOKEN || github.token }}
      - name: Verify frozen checkout authority
        shell: bash
        run: |
          set -euo pipefail
          cd semantic
          test "$(git rev-parse HEAD)" = 0f09439893182235c382492583b82aa35f25045c
          test "$(sha256sum .agents/Directional/tools/m3_cp4c3_artifact_only_harness.sh|awk '{print $1}')" = aaadab351c0ba28a39c87aff1948f83ab0c4c71520662177e5cdf6fd08b30ed3
          test "$(sha256sum .agents/Directional/Architecture_M3_CP4c3_Required_Green_Selector_409.txt|awk '{print $1}')" = eea6d8c2bbc8e9247deb4bfbbe6763042c76002d1894dd62e35f80262403b53e
          test "$(sha256sum .agents/Directional/Architecture_M3_CP4c3_Required_Green_Selector_408.txt|awk '{print $1}')" = 2a742ba92dba744425fccaf81d5cc7a57885cbff37c779d525218fcd70500af6
          test "$(sha256sum tests/FieldAlignedCurveNetworkTests.cpp|awk '{print $1}')" = 7f683267354783068443ffe02f3798723b524633bfb4fc70bca717ce4de80b4d
          test -z "$(git status --short)"
      - name: Run explicit no-runtime package preflight
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
          ARTIFACT_ID: '10057456162'
          EXPECTED_ARTIFACT_NAME: m3-cp4c3-cb45-result-34229976475
          EXPECTED_PROVIDER_DIGEST: sha256:c9cd0397d22b7cc0c343838a90fdcfe649137fa37a985453778c04731049b99e
          EXPECTED_ZIP_SHA256: c9cd0397d22b7cc0c343838a90fdcfe649137fa37a985453778c04731049b99e
          EXPECTED_SOURCE_SHA: 0f09439893182235c382492583b82aa35f25045c
          SELECTOR_RELATIVE_PATH: .agents/Directional/Architecture_M3_CP4c3_Required_Green_Selector_409.txt
          EXPECTED_SELECTOR_COUNT: '409'
          EXPECTED_SELECTOR_SHA256: eea6d8c2bbc8e9247deb4bfbbe6763042c76002d1894dd62e35f80262403b53e
          ACCEPTED_PREFIX_COUNT: '365'
          TURN_ID: M3-CP4c-3-TB40-PREFLIGHT
        shell: bash
        run: |
          set -euo pipefail
          cd semantic
          bash .agents/Directional/tools/m3_cp4c3_artifact_only_harness.sh --preflight-only
          root="${RUNNER_TEMP}/M3-CP4c-3-TB40-PREFLIGHT"; pkg="$root/package"; src="$root/source"; exe="$root/execution-view"
          test "$(sha256sum "$pkg/source/source-0f09439893182235c382492583b82aa35f25045c.tar.gz"|awk '{print $1}')" = 7d1cb457d1101e6addbadd732d783efdae956f61b9732b492c1b9063828a6472
          test "$(sha256sum "$src/.agents/Directional/Architecture_M3_CP4c3_Required_Green_Selector_408.txt"|awk '{print $1}')" = 2a742ba92dba744425fccaf81d5cc7a57885cbff37c779d525218fcd70500af6
          test "$(sha256sum "$src/tests/FieldAlignedCurveNetworkTests.cpp"|awk '{print $1}')" = 7f683267354783068443ffe02f3798723b524633bfb4fc70bca717ce4de80b4d
          test "$(sha256sum "$src/.agents/Directional/tools/m3_cp4c3_artifact_only_harness.sh"|awk '{print $1}')" = aaadab351c0ba28a39c87aff1948f83ab0c4c71520662177e5cdf6fd08b30ed3
          test -f "$src/benchmarks/fixtures/milestone-g/bunny_1k_random.obj"
          test -f "$exe/test-data/benchmarks/fixtures/milestone-g/bunny_1k_random.obj"
          grep -Fxq runtime_started=false "${RUNNER_TEMP}/M3-CP4c-3-TB40-PREFLIGHT-result/execution-boundary.txt"
          grep -Fxq runtime_completed=false "${RUNNER_TEMP}/M3-CP4c-3-TB40-PREFLIGHT-result/execution-boundary.txt"
          grep -Fxq orchestration_failure=false "${RUNNER_TEMP}/M3-CP4c-3-TB40-PREFLIGHT-result/execution-boundary.txt"
      - name: Execute immutable artifact-only selector409 harness
        id: execute
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
          TURN_ID: M3-CP4c-3-TB40-EXEC
          ARTIFACT_ID: '10057456162'
          EXPECTED_ARTIFACT_NAME: m3-cp4c3-cb45-result-34229976475
          EXPECTED_PROVIDER_DIGEST: sha256:c9cd0397d22b7cc0c343838a90fdcfe649137fa37a985453778c04731049b99e
          EXPECTED_ZIP_SHA256: c9cd0397d22b7cc0c343838a90fdcfe649137fa37a985453778c04731049b99e
          EXPECTED_SOURCE_SHA: 0f09439893182235c382492583b82aa35f25045c
          SELECTOR_RELATIVE_PATH: .agents/Directional/Architecture_M3_CP4c3_Required_Green_Selector_409.txt
          EXPECTED_SELECTOR_COUNT: '409'
          EXPECTED_SELECTOR_SHA256: eea6d8c2bbc8e9247deb4bfbbe6763042c76002d1894dd62e35f80262403b53e
          ACCEPTED_PREFIX_COUNT: '365'
        shell: bash
        run: |
          set +e
          cd semantic
          bash .agents/Directional/tools/m3_cp4c3_artifact_only_harness.sh --execute
          status=$?
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Build TB40 machine-readable verification evidence
        if: always()
        env:
          HARNESS_EXIT: ${{ steps.execute.outputs.exit_code }}
          TURN_ID: M3-CP4c-3-TB40-EXEC
          EXPECTED_SOURCE_SHA: 0f09439893182235c382492583b82aa35f25045c
          EXPECTED_ARTIFACT_ID: '10057456162'
          EXPECTED_SOURCE_ARCHIVE_SHA256: 7d1cb457d1101e6addbadd732d783efdae956f61b9732b492c1b9063828a6472
          EXPECTED_SELECTOR_SHA256: eea6d8c2bbc8e9247deb4bfbbe6763042c76002d1894dd62e35f80262403b53e
          EXPECTED_SELECTOR408_SHA256: 2a742ba92dba744425fccaf81d5cc7a57885cbff37c779d525218fcd70500af6
          EXPECTED_HARNESS_SHA256: aaadab351c0ba28a39c87aff1948f83ab0c4c71520662177e5cdf6fd08b30ed3
          EXPECTED_TEST_SOURCE_SHA256: 7f683267354783068443ffe02f3798723b524633bfb4fc70bca717ce4de80b4d
        shell: bash
        run: |
          set -euo pipefail
          result="${RUNNER_TEMP}/M3-CP4c-3-TB40-EXEC-result"; pre="${RUNNER_TEMP}/M3-CP4c-3-TB40-PREFLIGHT-result"
          mkdir -p "$result"
          if [[ -d "$pre" ]]; then mkdir -p "$result/preflight"; cp -a "$pre/." "$result/preflight/"; fi
          python3 control/.agents/connector-triggers/m3-cp4c3-tb40-exec/verifier.py "$result" "${HARNESS_EXIT:-unavailable}"
      - name: Upload TB40 result artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-cp4c3-tb40-result-${{ github.run_id }}
          path: ${{ runner.temp }}/M3-CP4c-3-TB40-EXEC-result
          if-no-files-found: error
          retention-days: 7
      - name: Upload TB40 persistent log artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-cp4c3-tb40-log-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/M3-CP4c-3-TB40-PREFLIGHT.log
            ${{ runner.temp }}/M3-CP4c-3-TB40-EXEC.log
          if-no-files-found: error
          retention-days: 7
      - name: Fail only on orchestration harness failure
        if: always()
        env:
          HARNESS_EXIT: ${{ steps.execute.outputs.exit_code }}
        run: test "${HARNESS_EXIT:-unavailable}" = 0
