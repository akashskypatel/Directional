    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1HkGdyE76w4WFzYrHAjJDV1k-K6VhGPef
      patch_sha256: '8f729f359ef62824545fe388a497e2fa07375663f0cfa03a937096c186e4b1dc'
