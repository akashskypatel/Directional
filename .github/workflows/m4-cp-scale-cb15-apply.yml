name: M4 CP SCALE CB15 Apply

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m4-cp-scale-cb15-apply-20260917.txt

permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

concurrency:
  group: m4-cp-scale-cb15-apply
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/m4-cp-scale-cb15-apply.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m4-cp-scale-cb15-apply
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  apply:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 12YiYCjUACCZFjihn1sxwjot53sB02dhh
      patch_sha256: 'de0b65e78ebc5fb7010dd74b5058ffba3a6e7de50b3e24ad61f4c972deef22b5'
      base_sha: e9669561f3b807751d7c2badb3065732a1e69aca
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: 'code: add CB15 cycle-order diagnostics'
      retention_days: 14
    secrets: inherit
