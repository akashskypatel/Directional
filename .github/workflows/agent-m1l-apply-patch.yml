name: Agent M1l Apply Source Patch

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m1l-apply.txt

permissions:
  contents: write

concurrency:
  group: agent-m1l-apply-${{ github.ref }}
  cancel-in-progress: false

env:
  BASE_SOURCE_SHA: 5e7313b469da64f3a7a87862c65d4ca1a8a972fb
  PATCH_FILE: .agents/Directional/turn-payloads/m1l-cell-topology-region.patch
  EXPECTED_PATCH_SHA256: 1314c912cbd441cf421a2a1ed489777b5209ccf6194f0fb54ecc8a7da2f73258

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Initialize persistent log
        shell: bash
        run: |
          set -euo pipefail
          log_dir="$RUNNER_TEMP/m1l-apply-logs"
          activity_log="$log_dir/activity.log"
          mkdir -p "$log_dir"
          printf '%s\n' \
            "run_id=$GITHUB_RUN_ID" \
            "event_sha=$GITHUB_SHA" \
            "ref=$GITHUB_REF" \
            "repository=$GITHUB_REPOSITORY" \
            "started_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            > "$activity_log"

      - name: Checkout exact event source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Verify and apply M1l compile correction
        shell: bash
        run: |
          set -Eeuo pipefail
          log_dir="$RUNNER_TEMP/m1l-apply-logs"
          activity_log="$log_dir/activity.log"
          exec > >(tee -a "$activity_log") 2>&1
          actual_patch_sha=$(sha256sum "$PATCH_FILE" | awk '{print $1}')
          printf 'patch_sha256=%s\n' "$actual_patch_sha"
          test "$actual_patch_sha" = "$EXPECTED_PATCH_SHA256"

          if grep -Eq '^(---|\+\+\+) [ab]/\.github/workflows/' "$PATCH_FILE"; then
            echo 'Patch modifies .github/workflows/**, which is forbidden.' >&2
            exit 2
          fi

          git diff --quiet "$BASE_SOURCE_SHA" -- tests/SurfaceCellsPhase10Tests.cpp

          git apply --recount --check "$PATCH_FILE"
          git apply --recount --index "$PATCH_FILE"
          git diff --check --cached

          actual_paths=$(git diff --cached --name-only | LC_ALL=C sort)
          expected_paths='tests/SurfaceCellsPhase10Tests.cpp'
          test "$actual_paths" = "$expected_paths"

          printf '%s\n' '--- staged diff stat ---'
          git diff --cached --stat
          printf '%s\n' '--- staged changed paths ---'
          printf '%s\n' "$actual_paths"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test(surface-cell): adapt cell region compatibility assertion'
          implementation_sha=$(git rev-parse HEAD)
          git push origin "HEAD:$GITHUB_REF_NAME"
          printf 'implementation_sha=%s\n' "$implementation_sha"
          printf 'finished_utc=%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)"

      - name: Always upload detailed workflow logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m1l-apply-patch-logs-${{ github.run_id }}
          path: ${{ runner.temp }}/m1l-apply-logs
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
