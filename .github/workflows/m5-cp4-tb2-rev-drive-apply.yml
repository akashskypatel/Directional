name: M5 CP4 TB2 Final Review Docs Apply

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m5-cp4-tb2-rev-drive-apply-20260924.txt

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

concurrency:
  group: m5-cp4-tb2-rev-drive-apply-${{ github.ref }}
  cancel-in-progress: false

jobs:
  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m5-cp4-tb2-rev-drive-apply
      commit_run_file: false
      trim_stale_comments: false
    secrets: inherit

  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/m5-cp4-tb2-rev-drive-apply.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  apply:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1aYJwnlTDSjpmAfSUPOCzod56Zx-fwiLC
      patch_sha256: 9284aa406448e63858db37e5a0f1baa70a4f5f263c2a25d5ca7e71189e5e5f3b
      base_sha: d535b6bdd1f165079dfc2583916ab7372bf75d99
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: M5-CP4-TB2-REV close out final M5 review
    secrets: inherit
