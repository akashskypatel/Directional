name: M3 CP4c0b CB1 S1 Apply

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m3-cp4c0b-cb1-s1-apply/run.txt

permissions:
  actions: read
  contents: write
  id-token: write
  issues: write
  pull-requests: write

concurrency:
  group: m3-cp4c0b-cb1-s1-apply-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/agent-m3-cp4c0b-cb1-s1-apply.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m3-cp4c0b-cb1-s1-apply
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  apply:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1rp0dZu9HbcQTWmkVOLfNcnaUAj4F7dLQ
      patch_sha256: b3220b4516b961cb91511617d930fd7bdda91d89deceb98cf814907e1ddf7cde
      base_sha: d8a331182f1aa3aeb74d3f2ec78352b677417860
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: 'test: add CP4c0b S1 non-gating contact census'
      retention_days: 7
    secrets: inherit
