name: M3 CP4c2 TB X2 REV Orchestration Tracker Apply

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m3-cp4c2-tb-x2-rev-orchestration-apply/**

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

concurrency:
  group: m3-cp4c2-tb-x2-rev-orchestration-apply-${{ github.ref }}
  cancel-in-progress: false

jobs:
  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m3-cp4c2-tb-x2-rev-orchestration-apply
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/m3-cp4c2-tb-x2-rev-orchestration-apply.yml
    secrets: inherit

  apply:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1bc874NdKQBpmE4qSN_EfKfdQeWRVbDIf
      patch_sha256: 6074d65b68de2f966cfaae219b5209378ca110ba14dbce0d3b23bedb1033c182
      base_sha: 36c5ddb62d89824b9ec500bd6f33694dc8bd06a0
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: "M3-CP4c-2-TB-X2-REV: record resolved closeout orchestration candidate"
    secrets: inherit
