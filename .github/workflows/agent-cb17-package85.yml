name: M3 CP4c3 CB17 Package 85

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/cb17-package85/**

permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: m3-cp4c3-cb17-package85
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/agent-cb17-package85.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m3-cp4c3-cb17-package85
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  package:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Initialize persistent activity log
        shell: bash
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/m3-cp4c3-cb17-package85.log"
          : > "$log"
          {
            echo "workflow=${GITHUB_WORKFLOW}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "event=${GITHUB_EVENT_NAME}"
            echo "event_sha=${GITHUB_SHA}"
            echo "source_sha=1e671ef79a4cf3fbbcfc8664c9d792ace26b58e4"
            echo "compile_artifact_id=9872340053"
            echo "runtimeExecution=false"
            echo "started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } | tee -a "$log"

      - name: Download and verify exact compile artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/m3-cp4c3-cb17-package85.log"
          exec > >(tee -a "$log") 2>&1
          work="${RUNNER_TEMP}/m3-cp4c3-cb17-package85"
          mkdir -p "$work/raw"
          artifact_digest="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/9872340053" --jq '.digest')"
          test "$artifact_digest" = "sha256:3a814357edf9b1f2424f4047b6c84b1e37ed54dc1751ab6a1fa3b125af206274"
          echo "compile_artifact_digest=$artifact_digest" | tee -a "$log"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/9872340053/zip" > "$work/raw.zip"
          unzip -q "$work/raw.zip" -d "$work/raw"
          test "$(cat "$work/raw/metadata/source-commit.txt")" = "1e671ef79a4cf3fbbcfc8664c9d792ace26b58e4"
          grep -qx 'runtimeExecution=false' "$work/raw/metadata/command-boundary.txt"
          grep -qx 'exactArithmeticBackend=GMP' "$work/raw/metadata/command-boundary.txt"
          grep -q 'libgmpxx.so' "$work/raw/metadata/gmp-evidence.txt"
          grep -q 'libgmp.so' "$work/raw/metadata/gmp-evidence.txt"
          test "$(cat "$work/raw/metadata/preflight-exit-code.txt")" = 0
          test "$(cat "$work/raw/metadata/build-exit-code.txt")" = 0
          test ! -s "$work/raw/metadata/source-status-final.txt"
          (cd "$work/raw" && sha256sum -c SHA256SUMS)

      - name: Build and verify mode-preserving package 85
        shell: bash
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/m3-cp4c3-cb17-package85.log"
          exec > >(tee -a "$log") 2>&1
          work="${RUNNER_TEMP}/m3-cp4c3-cb17-package85"
          pkg="$work/package85"
          mkdir -p "$pkg" "$work/source-tree" "$pkg/test-data/benchmarks"
          cp -a "$work/raw/bin" "$work/raw/lib" "$work/raw/metadata" "$work/raw/source" "$pkg/"
          source_archive="$(find "$work/raw/source" -maxdepth 1 -type f -name 'source-*.tar.gz' -print -quit)"
          test -n "$source_archive"
          tar -xzf "$source_archive" -C "$work/source-tree" \
            benchmarks/fixtures \
            .agents/Directional/Architecture_M3_CP4c3_Required_Green_Selector_373.txt \
            .agents/Directional/Architecture_M3_CP4c3_Required_Green_Selector_374.txt \
            .agents/Directional/Architecture_M3_CP4c3_Required_Green_Selector_375.txt \
            .agents/Directional/Architecture_M3_CP4c3_Required_Green_Selector_376.txt \
            .agents/Directional/Architecture_M3_CP4c3_Required_Green_Selector_377.txt \
            .agents/Directional/Architecture_M3_CP4c3_Required_Green_Selector_378.txt \
            .agents/Directional/Architecture_M3_CP4c3_Required_Green_Selector_379.txt \
            .agents/Directional/Architecture_M3_CP4c3_Required_Green_Selector_380.txt \
            .agents/Directional/Architecture_M3_CP4c3_Required_Green_Selector_381.txt
          echo "b47c269851fad1384b5dc9baaf674b3d4ad80ec6c2b40f7f8eda2055c6f44834  $work/source-tree/.agents/Directional/Architecture_M3_CP4c3_Required_Green_Selector_373.txt" | sha256sum -c -
          echo "d496ce96b3776269cda8086a0a2173ce9a1f9967d81b2a80866266155c503c4f  $work/source-tree/.agents/Directional/Architecture_M3_CP4c3_Required_Green_Selector_374.txt" | sha256sum -c -
          echo "aa7b22bb265f321fad6f85128e572e0251dc5f60d68856ca7ec4323006a8f3a0  $work/source-tree/.agents/Directional/Architecture_M3_CP4c3_Required_Green_Selector_375.txt" | sha256sum -c -
          echo "6ab2d9fad0327e00bb2f782741afffe8a0ae08c08df8adbdf9accc6234bfa5e8  $work/source-tree/.agents/Directional/Architecture_M3_CP4c3_Required_Green_Selector_376.txt" | sha256sum -c -
          echo "7255ac86e525e245c0c24231b70c9494349a4c1cc1dfcfeee9817cc6426cbec1  $work/source-tree/.agents/Directional/Architecture_M3_CP4c3_Required_Green_Selector_377.txt" | sha256sum -c -
          echo "86259d919b387ba4a610b42c4dd1a190ae340f693437b5a769cd50ca396440b8  $work/source-tree/.agents/Directional/Architecture_M3_CP4c3_Required_Green_Selector_378.txt" | sha256sum -c -
          echo "ef51298f32dd095b469e97e3a86daf2727282bdd283c1e6b777a5705842594b7  $work/source-tree/.agents/Directional/Architecture_M3_CP4c3_Required_Green_Selector_379.txt" | sha256sum -c -
          echo "1a95d32852507441c10c0c81154a595ebc367fe4137143ec9290d85d852a0e4e  $work/source-tree/.agents/Directional/Architecture_M3_CP4c3_Required_Green_Selector_380.txt" | sha256sum -c -
          echo "af667aae37dc6c2342c8f084b4c7ff97719798d76bce5cbb34163afecdd38d90  $work/source-tree/.agents/Directional/Architecture_M3_CP4c3_Required_Green_Selector_381.txt" | sha256sum -c -
          for n in 373 374 375 376 377 378 379 380 381; do
            test "$(wc -l < "$work/source-tree/.agents/Directional/Architecture_M3_CP4c3_Required_Green_Selector_${n}.txt" | tr -d ' ')" = "$n"
            test "$(sort "$work/source-tree/.agents/Directional/Architecture_M3_CP4c3_Required_Green_Selector_${n}.txt" | uniq | wc -l | tr -d ' ')" = "$n"
          done
          for pair in '373 374' '374 375' '375 376' '376 377' '377 378' '378 379' '379 380' '380 381'; do
            set -- $pair
            cmp -s "$work/source-tree/.agents/Directional/Architecture_M3_CP4c3_Required_Green_Selector_$1.txt" <(head -n "$1" "$work/source-tree/.agents/Directional/Architecture_M3_CP4c3_Required_Green_Selector_$2.txt")
          done
          cp -a "$work/source-tree/benchmarks/fixtures" "$pkg/test-data/benchmarks/"
          fixture_count="$(find "$pkg/test-data/benchmarks/fixtures" -type f | wc -l | tr -d ' ')"
          test "$fixture_count" = 27
          cat > "$pkg/metadata/fixture-package-contract.txt" <<'META'
          package=85
          source_commit=1e671ef79a4cf3fbbcfc8664c9d792ace26b58e4
          fixture_count=27
          fixture_authority=package-relative
          selector=381
          selector_sha256=af667aae37dc6c2342c8f084b4c7ff97719798d76bce5cbb34163afecdd38d90
          frozen_selector_380_sha256=1a95d32852507441c10c0c81154a595ebc367fe4137143ec9290d85d852a0e4e
          non_gating_diagnostic_identity=GlobalTopologyPlan.EdgeTraceSecondaryRankUnavailableIsTypedAndObservable
          runtimeExecution=false
          packageRepair=false
          META
          cat > "$pkg/metadata/package-envelope.txt" <<'META'
          runtimeExecution=false
          turnBoundary=Code+Build-only
          exactArithmeticBackend=GMP
          modePreservingEnvelope=true
          semanticContracts=compiled-not-executed
          META
          rm -f "$pkg/SHA256SUMS"
          (cd "$pkg" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          (cd "$pkg" && sha256sum -c SHA256SUMS)
          for exe in "$pkg"/bin/directional_*; do test -x "$exe"; done
          test "$(find "$pkg/bin" -maxdepth 1 -type f -name 'directional_*' | wc -l | tr -d ' ')" = 6
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner -czf "$work/package85.tar.gz" -C "$work" package85
          sha256sum "$work/package85.tar.gz" > "$work/package85.sha256"
          sha256sum "$source_archive" > "$work/source-archive.sha256"
          cat > "$work/package85-boundary.txt" <<'META'
          runtimeExecution=false
          packageRepair=false
          No Directional binary was executed while packaging.
          META
          mkdir -p "$work/verify"
          tar -xzf "$work/package85.tar.gz" -C "$work/verify"
          (cd "$work/verify/package85" && sha256sum -c SHA256SUMS)
          for exe in "$work/verify/package85"/bin/directional_*; do test -x "$exe"; done
          echo "fixture_count=$fixture_count"
          cat "$work/package85.sha256"
          cat "$work/source-archive.sha256"

      - name: Upload package 85
        uses: actions/upload-artifact@v4
        with:
          name: m3-cp4c3-package85-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/m3-cp4c3-cb17-package85/package85.tar.gz
            ${{ runner.temp }}/m3-cp4c3-cb17-package85/package85.sha256
            ${{ runner.temp }}/m3-cp4c3-cb17-package85/source-archive.sha256
            ${{ runner.temp }}/m3-cp4c3-cb17-package85/package85-boundary.txt
          if-no-files-found: error
          retention-days: 14

      - name: Upload persistent activity log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-cp4c3-package85-log-${{ github.run_id }}
          path: ${{ runner.temp }}/m3-cp4c3-cb17-package85.log
          if-no-files-found: error
          retention-days: 14
