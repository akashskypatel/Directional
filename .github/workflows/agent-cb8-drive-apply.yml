name: Agent M3 CP4c-0 CB8 Drive Apply

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/google-drive/M3-CP4c-0-CB8.txt

permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

jobs:
  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      commit_run_file: false
      label: m3-cp4c0-cb8-drive-apply
      trim_stale_comments: true
    secrets: inherit

  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/agent-cb8-drive-apply.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  apply:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1R2EzIWqfSdHhJd7jUbzVebGvRd4U7hqc
      patch_sha256: 3b19aa80fcc3d06e1cf4cbf59d34e53a29a409557249094c941a1da0d8639eaf
      base_sha: 334abf964375d176974d06d734221beabcea0830
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: 'M3-CP4c-0-CB8: implement grazing edge transit'
    secrets: inherit
