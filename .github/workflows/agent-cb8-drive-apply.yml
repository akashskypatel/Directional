name: Agent M3 CP4c-0 CB8 Closeout Drive Apply

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/google-drive/M3-CP4c-0-CB8.txt

permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

jobs:
  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      commit_run_file: false
      label: m3-cp4c0-cb8-closeout-drive-apply
      trim_stale_comments: true
    secrets: inherit

  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/agent-cb8-drive-apply.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  apply:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1PP3VOCwloArjAuLPtil31gEQNXkwyqpc
      patch_sha256: a1585447ade1e88d54dab2a552d6384a030ca8c4ba91a169d9054814bc2c1722
      base_sha: 8abb7a37267ac20c6576160fd0984208af6914fa
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: 'docs: close M3-CP4c-0-CB8 build turn'
    secrets: inherit
