name: M3 CP4c0 TB-R9 Reproof Closeout

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m3-cp4c0-tb-r9-reproof-closeout/run.txt

permissions:
  actions: read
  contents: write
  id-token: write
  issues: write
  pull-requests: write

concurrency:
  group: m3-cp4c0-tb-r9-reproof-closeout-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/agent-m3-cp4c0-tb-r9-reproof-closeout.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m3-cp4c0-tb-r9-reproof-closeout
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  apply:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1xh6NwaAUBoYoFVY3i3c_vFvozsDVlIHH
      patch_sha256: 05a939b6bba47db2ed06e5475b99ffe6aa2aca217df33163ba3154d57192155e
      base_sha: 7bbc0480d9ab5954329b940992ef41a9223102ed
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: 'docs: accept complete TB-R9 reproof and close CP4c-0'
      retention_days: 7
    secrets: inherit
