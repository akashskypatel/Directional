name: Agent M3 CP4c3 CB29 Docs Apply

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/cb29-docs-apply/trigger-20260904.txt

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

concurrency:
  group: agent-m3-cp4c3-cb29-docs-apply-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/agent-m3-cp4c3-cb29-docs-apply.yml
      source_ref: ${{ github.sha }}
      retention_days: 14
    secrets: inherit

  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m3-cp4c3-cb29-docs-apply
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  apply:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1DjHQG68-grYdiWBvpsQuvbJfcxl0ym-2
      patch_sha256: '37d3c991f4e076ff348f213852fd7833614fb8e80f745279600dfad7760514aa'
      base_sha: fe02f930a1c33b7174e77870025ceefb44edd05e
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: 'docs: close CB29 orchestration correction'
      retention_days: 14
    secrets: inherit
