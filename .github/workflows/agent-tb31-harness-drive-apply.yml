name: Agent TB31 Harness Drive Apply

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/drive-apply/m3-cp4c3-tb31-harness-*.json

permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

concurrency:
  group: agent-tb31-harness-drive-apply-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/agent-tb31-harness-drive-apply.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  observe:
    if: ${{ github.event_name == 'push' }}
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: tb31-harness-drive-apply
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  apply:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 197RFLEqj6iSOXwQ_B9SF_Squh87-EQt4
      patch_sha256: ae1fc9eb50ab4d4cb6066d9fd2231b611b41a23c67818bf88b1f2a50588a179e
      base_sha: d526179843f607687fa90b5595122b06725790fa
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: "test: stage TB31 artifact-only execution harness"
      retention_days: 7
    secrets: inherit
