name: Agent CB28 Drive Apply Caller

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/cb28-drive-apply/**

permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/agent-cb28-drive-apply-caller.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  observe:
    if: ${{ github.event_name == 'push' }}
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: cb28-drive-apply
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  apply:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1QquvIKLeM2TUUEw1g10WuUKrNjFJIqnO
      patch_sha256: be9bdfcf751f713b4e4a01235d77586ecd8c9d2aeab08f1d397a488c1b9239b6
      base_sha: 8a8b9af7b3d3d51bba8b710f841a867c77840440
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: M3-CP4c-3-CB28 fix conflict census construction
      retention_days: 7
    secrets: inherit
