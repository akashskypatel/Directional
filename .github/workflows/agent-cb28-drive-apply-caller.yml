name: Agent CB28 Drive Apply Caller

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/cb28-drive-apply/**

permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/agent-cb28-drive-apply-caller.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  observe:
    if: ${{ github.event_name == 'push' }}
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: cb28-drive-apply
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  apply:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1mLu_BrDxNXA81hT4X_XkQLDX4PrIF6u1
      patch_sha256: 58e2edf75788bc2d44254a3e8c74fbfc98b1cdb182d4e525d9e7439fc6c4d190
      base_sha: 793b1f2fac99904625b8aebb0738c3ddb7593111
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: docs: close CB28 and stage TB25 execution plan
      retention_days: 7
    secrets: inherit
