name: M5 CP3 CB16 Apply

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m5-cp3-cb16-apply-20260923.txt

permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

concurrency:
  group: m5-cp3-cb16-apply
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/m5-cp3-cb16-apply.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m5-cp3-cb16-apply
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  apply:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1GZ-fouy1HmxcA_utbT-RKO4hMxY4dGDT
      patch_sha256: d0cce7aac3424396c541acbc6baaa815f7783557133d1f17f7dbc0d00e686e7a
      base_sha: c56769e634273ccc872fab4da385bd15f450308c
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: 'M5-CP3-CB16: correct periodic occurrence branch gauge authority'
    secrets: inherit
