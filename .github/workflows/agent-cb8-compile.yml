name: Agent M3 CP4c-0 CB8 Compile

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/compile/M3-CP4c-0-CB8.txt

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write

jobs:
  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      commit_run_file: false
      label: m3-cp4c0-cb8-compile
      trim_stale_comments: true
    secrets: inherit

  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/agent-cb8-compile.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  preflight:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-compile-reusable.yml
    with:
      source_sha: 19ba8e9c5e58f9c33c14b309841165d3f0401db5
      targets: directional_surface_cell_producer_tests
      artifact_prefix: m3-cp4c0-cb8-preflight
    secrets: inherit

  package:
    needs: preflight
    uses: ./.github/workflows/agent-compile-reusable.yml
    with:
      source_sha: 19ba8e9c5e58f9c33c14b309841165d3f0401db5
      targets: directional_surface_cell_producer_tests directional_core directional_pipeline directional_surface_cell_authority_kernel_tests directional_surface_cell_completion_tests directional_surface_cell_validation_tests directional_compiled_api_tests directional_benchmarks
      artifact_prefix: m3-cp4c0-cb8
    secrets: inherit
