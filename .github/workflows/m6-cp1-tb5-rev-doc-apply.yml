      workflow_path: .github/workflows/m6-cp1-tb5-rev-doc-apply.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  apply:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1NK43jS3NAEn4voKxfDMqH3-PZQTGNOwc
      patch_sha256: 'bfee1c3d21f35672e091bf91dffefb7d07dda38bada739d55e077ffa9537da6e'
      base_sha: c54d9a87c35ef69e9ca365004480341edb12057e
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: 'docs(agent): close M6-CP1-TB5 review'
    secrets: inherit
