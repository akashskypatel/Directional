name: M3 CP4c3 TB30 Artifact-Only EXEC

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m3-cp4c3-tb30-exec-20260905.txt

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: read

concurrency:
  group: m3-cp4c3-tb30-exec-${{ github.ref }}
  cancel-in-progress: false

jobs:
  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m3-cp4c3-tb30-exec
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/agent-m3-cp4c3-tb30-exec.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  execute:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Initialize TB30 diagnostic log
        shell: bash
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/m3-cp4c3-tb30-exec-wrapper.log"
          : > "$log"
          {
            echo "workflow=${GITHUB_WORKFLOW}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "event=${GITHUB_EVENT_NAME}"
            echo "event_sha=${GITHUB_SHA}"
            echo "ref=${GITHUB_REF}"
            echo "repository=${GITHUB_REPOSITORY}"
            echo "turn=M3-CP4c-3-TB30-EXEC"
            echo "runtime_boundary=artifact-only"
            echo "started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } | tee -a "$log"

      - name: Checkout exact control source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          submodules: false
          lfs: false
          token: ${{ secrets.GH_TOKEN || github.token }}

      - name: Materialize frozen TB30 harness
        shell: bash
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/m3-cp4c3-tb30-exec-wrapper.log"
          exec > >(tee -a "$log") 2>&1
          src='.agents/Directional/tools/m3_cp4c3_tb28_r3_harness.sh'
          materializer='.agents/Directional/turn-payloads/m3_cp4c3_tb30_materializer.py'
          out="${RUNNER_TEMP}/m3_cp4c3_tb30_harness.sh"
          test -f "$src"
          test -f "$materializer"
          python3 "$materializer" "$src" "$out"
          bash -n "$out"
          grep -Fq 'ARTIFACT_ID=9980764888' "$out"
          grep -Fq 'Architecture_M3_CP4c3_Required_Green_Selector_408.txt' "$out"
          grep -Fq 'total=408' "$out"
          sha256sum "$out" | tee "${RUNNER_TEMP}/m3-cp4c3-tb30-harness.sha256"

      - name: Execute frozen TB30 artifact-only gate
        id: gate
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
        shell: bash
        run: |
          set +e
          log="${RUNNER_TEMP}/m3-cp4c3-tb30-exec-wrapper.log"
          harness="${RUNNER_TEMP}/m3_cp4c3_tb30_harness.sh"
          bash "$harness" --execute
          code=$?
          echo "harness_exit=${code}" | tee -a "$log"
          echo "exit_code=${code}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Record final control source status
        if: always()
        shell: bash
        run: |
          set +e
          log="${RUNNER_TEMP}/m3-cp4c3-tb30-exec-wrapper.log"
          {
            echo "final_control_sha=$(git rev-parse HEAD 2>/dev/null || echo unavailable)"
            git status --short 2>&1 || true
            echo "finished_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } | tee -a "$log"

      - name: Upload TB30 result artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-cp4c3-tb30-exec-result-${{ github.run_id }}
          path: ${{ runner.temp }}/m3-cp4c3-tb30-result
          if-no-files-found: error
          retention-days: 14

      - name: Upload TB30 diagnostic log artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-cp4c3-tb30-exec-log-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/m3-cp4c3-tb30.log
            ${{ runner.temp }}/m3-cp4c3-tb30-exec-wrapper.log
            ${{ runner.temp }}/m3-cp4c3-tb30-harness.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Propagate orchestration failure
        if: always()
        env:
          HARNESS_EXIT: ${{ steps.gate.outputs.exit_code }}
        shell: bash
        run: |
          if [[ -z "${HARNESS_EXIT}" ]]; then
            echo 'TB30 harness did not report an exit code.' >&2
            exit 91
          fi
          if [[ "${HARNESS_EXIT}" != '0' ]]; then
            echo "TB30 harness failed with orchestration exit ${HARNESS_EXIT}." >&2
            exit "${HARNESS_EXIT}"
          fi
