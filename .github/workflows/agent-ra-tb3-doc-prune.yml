name: Agent R-A Retry 3 Documentation Prune

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/ra-tb3-doc-prune.txt

permissions:
  contents: write

jobs:
  prune:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/surface_cell_quad/p5-recover-bridge-healing
          fetch-depth: 0
      - name: Prune stale durable state
        shell: bash
        run: |
          set -euo pipefail
          BASE=d756b98f721d533cb447723a1cce8ba124c97c10
          git merge-base --is-ancestor "$BASE" HEAD
          git diff --exit-code "$BASE"..HEAD -- src include tests CMakeLists.txt cmake .agents/Directional/R_A_Closure_Inventory.py
          printf '%s\n' \
            'Authorized scope: REORIENTATION current M1 sections; CHANGELOG retry-3 entry.' \
            'Obsolete standalone early M1 Code+Build report was deleted separately after reference audit.' \
            'Durable destinations: CHANGELOG, current R-A T+B report, active Code+Build plan.' \
            > "$RUNNER_TEMP/at-risk-inventory.txt"
          python3 .agents/Directional/turn-payloads/ra_tb3_doc_prune.py
          git diff --check
          git diff --name-only | sort > "$RUNNER_TEMP/changed-files.txt"
          printf '%s\n' .agents/Directional/CHANGELOG.md .agents/Directional/REORIENTATION_PLAN.md | sort > "$RUNNER_TEMP/expected-files.txt"
          diff -u "$RUNNER_TEMP/expected-files.txt" "$RUNNER_TEMP/changed-files.txt"
          grep -q '86 passed / 6 failed' .agents/Directional/REORIENTATION_PLAN.md
          grep -q 'R-A-TB3-CB-01' .agents/Directional/REORIENTATION_PLAN.md
          git config user.name 'Directional Agent'
          git config user.email 'directional-agent@users.noreply.github.com'
          git add -f .agents/Directional/CHANGELOG.md .agents/Directional/REORIENTATION_PLAN.md
          git commit -m 'docs: prune stale M1 R-A evidence state'
          git push origin HEAD:agent/surface_cell_quad/p5-recover-bridge-healing
          git status --porcelain=v1 | tee "$RUNNER_TEMP/source-status-final.txt"
          test ! -s "$RUNNER_TEMP/source-status-final.txt"
      - name: Upload prune evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ra-tb3-doc-prune-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/at-risk-inventory.txt
            ${{ runner.temp }}/changed-files.txt
            ${{ runner.temp }}/source-status-final.txt
          if-no-files-found: warn
          retention-days: 7
