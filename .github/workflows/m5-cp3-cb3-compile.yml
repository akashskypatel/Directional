name: M5 CP3 CB3 Compile

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m5-cp3-cb3-compile.txt

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: write

concurrency:
  group: m5-cp3-cb3-compile-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/m5-cp3-cb3-compile.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m5-cp3-cb3-compile
      commit_run_file: false
    secrets: inherit

  compile:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-compile-reusable.yml
    with:
      source_sha: 279efa03471f1e0d6c32f57c8b395dd1cb1a93f5
      artifact_prefix: m5-cp3-cb3
    secrets: inherit
