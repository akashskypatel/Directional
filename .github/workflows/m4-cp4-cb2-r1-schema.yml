name: M4 CP4 CB2 R1 Caller Schema Validation

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m4-cp4-cb2-r1-schema-20260919.txt

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: m4-cp4-cb2-r1-schema-${{ github.ref }}
  cancel-in-progress: false

jobs:
  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m4-cp4-cb2-r1-schema
      commit_run_file: false
    secrets: inherit

  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/m4-cp4-tb1-r1-exec.yml
      source_ref: ${{ github.sha }}
    secrets: inherit
