name: M6 CP1 TB3 Review Documentation Patch Apply

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m6-cp1-tb3-rev-docs-apply.txt

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

concurrency:
  group: m6-cp1-tb3-rev-docs-apply-${{ github.ref }}
  cancel-in-progress: false

jobs:
  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m6-cp1-tb3-rev-docs-apply
      commit_run_file: false
      trim_stale_comments: false
    secrets: inherit

  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/m6-cp1-tb3-rev-docs-apply.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  apply:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 115xKgEWHMXcmm6EB4JHTpRKzjsB6ttP6
      patch_sha256: 17f14654fb397a35e90ff65e42dab0e390b30f2411cde314837caa281840d58a
      base_sha: 7fbce1c2fd6c85834643a9d3489e38b78ae0ef79
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: "docs: adjudicate M6-CP1-TB3 review"
    secrets: inherit
