name: Agent Schema Validate M3 CP4c Historical Consolidation 6

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/schema-validate-m3-cp4c-hist-consolidation-6.txt

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: agent-schema-validate-m3-cp4c-hist-consolidation-6
  cancel-in-progress: false

jobs:
  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: schema-validate-m3-cp4c-hist-consolidation-6
      commit_run_file: false
    secrets: inherit

  validate-self:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/agent-temp-schema-validate-m3-cp4c-hist-consolidation-6.yml
      source_ref: ${{ github.sha }}
      retention_days: 7
    secrets: inherit

  validate-draft:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .agents/Directional/turn-payloads/m3-cp4c-hist-consolidation-6-drive-apply-caller.yml
      source_ref: ${{ github.sha }}
      retention_days: 7
    secrets: inherit
