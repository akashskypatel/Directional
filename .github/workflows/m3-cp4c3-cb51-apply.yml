name: M3 CP4c3 CB51 Apply

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/cb51-apply/cb51-apply-20260909.txt

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

concurrency:
  group: m3-cp4c3-cb51-apply
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/m3-cp4c3-cb51-apply.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m3-cp4c3-cb51-apply
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  apply:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1uDTu86UXyd8JcacsM5tYmLuOFk59fcmg
      patch_sha256: 4dfbca6a34267aede4cd4242f4cab690df26403796682a631fe0a2330c5080a5
      base_sha: e44236cbfbe9be5c6614b1e89f4845c052aaecb5
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: "M3-CP4c-3-CB51: publish producer frontier evidence and correct terminal-slit oracle"
      retention_days: 14
    secrets: inherit
