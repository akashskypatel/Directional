name: Agent CP4c3 TB2 Docs Apply

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/cp4c3-tb2-docs-apply/run.txt

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

concurrency:
  group: agent-cp4c3-tb2-docs-apply
  cancel-in-progress: false

jobs:
  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: cp4c3-tb2-docs-apply
      commit_run_file: false
    secrets: inherit

  validate_caller:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/agent-cp4c3-tb2-docs-apply-temp.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  apply:
    needs: validate_caller
    if: ${{ needs.validate_caller.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1MMA0Rh63WkLLo4OYohfJ2Fik1VeRegvd
      patch_sha256: '43846f92854c8ca18abc5fba93f47a15998a778d8a97978bd981c80d82291ede'
      base_sha: eba4588debf1a426849829d90e2a7b7138dbb1a9
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: 'docs: close M3-CP4c-3-TB2 blocked harness attempt'
    secrets: inherit
