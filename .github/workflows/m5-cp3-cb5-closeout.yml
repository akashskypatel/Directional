  apply:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1va5bdXdlrqRLoIX5F7F4kkhZOqILFcaY
      patch_sha256: 0c056adfd2b95dac2eecee9589729d2fccfd6fd4c0c2df5284147eb1dfdd0669
