name: M3 CP4c2 CB2 DIAG Source Snapshot

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m3-cp4c2-cb2-diag-source-snapshot/**

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: m3-cp4c2-cb2-diag-source-snapshot-${{ github.ref }}
  cancel-in-progress: false

jobs:
  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m3-cp4c2-cb2-diag-source-snapshot
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/m3-cp4c2-cb2-diag-source-snapshot.yml
    secrets: inherit

  snapshot:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-source-snapshot.yml
    with:
      source_ref: 7d93a21706f630fce55cee4ef1cbfdac24f7bd61
      artifact_prefix: directional-source-snapshot
      retention_days: 7
    secrets: inherit
