name: M3 CP4c2 R10 Artifact-Only Execution

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m3-cp4c2-r10-exec/**

permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: m3-cp4c2-r10-exec-${{ github.ref }}
  cancel-in-progress: false

jobs:
  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m3-cp4c2-r10-exec
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  execute:
    runs-on: ubuntu-24.04
    steps:
      - name: Initialize diagnostic and result paths
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/m3-cp4c2-r10-result"
          log="${RUNNER_TEMP}/m3-cp4c2-r10.log"
          : > "$log"
          {
            echo "workflow=${GITHUB_WORKFLOW}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "event=${GITHUB_EVENT_NAME}"
            echo "event_sha=${GITHUB_SHA}"
            echo "repository=${GITHUB_REPOSITORY}"
            echo "turn=M3-CP4c-2-TB-X2-R10-EXEC"
            echo "artifact_id=9736088354"
            echo "semantic_source=57444781af7bdc460e38cc68930a9a8c8199eeea"
            echo "benchmarkExecution=false"
            echo "started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } | tee -a "$log"
          printf '%s\n' 'execution_not_started=true' > "${RUNNER_TEMP}/m3-cp4c2-r10-result/orchestration-state.txt"

      - name: Checkout exact control source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Verify frozen execution payload
        shell: bash
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/m3-cp4c2-r10.log"
          exec > >(tee -a "$log") 2>&1
          payload=".agents/Directional/turn-payloads/M3-CP4c-2-R10-exec.py"
          test -f "$payload"
          test "$(git hash-object "$payload")" = "f3acec0ede3ab43c65f207d6529bca34068fc4ea"
          python3 -m py_compile "$payload"
          git status --short

      - name: Execute frozen artifact-only R10 plan
        id: execute
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -o pipefail
          rm -f "${RUNNER_TEMP}/m3-cp4c2-r10-result/orchestration-state.txt"
          python3 .agents/Directional/turn-payloads/M3-CP4c-2-R10-exec.py

      - name: Record final source status
        if: always()
        shell: bash
        run: |
          set +e
          log="${RUNNER_TEMP}/m3-cp4c2-r10.log"
          {
            echo "payload_outcome=${{ steps.execute.outcome }}"
            echo "final_source_status_begin"
            git status --short
            echo "final_source_status_end"
            echo "finished_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } | tee -a "$log"

      - name: Upload R10 result artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-cp4c2-r10-result-${{ github.run_id }}
          path: ${{ runner.temp }}/m3-cp4c2-r10-result
          if-no-files-found: error
          retention-days: 14

      - name: Upload R10 diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-cp4c2-r10-log-${{ github.run_id }}
          path: ${{ runner.temp }}/m3-cp4c2-r10.log
          if-no-files-found: error
          retention-days: 14

      - name: Fail invalid R10 execution
        if: always() && steps.execute.outcome != 'success'
        shell: bash
        run: |
          echo "R10 execution was invalid or orchestration failed; inspect result and diagnostic artifacts." >&2
          exit 1
