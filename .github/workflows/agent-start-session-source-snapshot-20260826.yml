name: Agent Start Session Exact Source Snapshot 20260826

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/source-snapshot/start-session-20260826.txt

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  validate-caller:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/agent-start-session-source-snapshot-20260826.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  snapshot:
    needs: validate-caller
    if: ${{ needs.validate-caller.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-source-snapshot.yml
    with:
      source_ref: 63a2bd3dfc94e2a718d1909da0ce70741aacf7c0
      artifact_name: directional-source-snapshot-63a2bd3d-20260826
    secrets: inherit

  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: start-session-source-snapshot-20260826
      commit_run_file: false
      trim_stale_comments: false
    secrets: inherit
