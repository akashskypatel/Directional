name: m1i-runtime-closeout

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - '.agents/connector-triggers/m1i-runtime-closeout'

permissions:
  contents: write

concurrency:
  group: m1i-runtime-closeout-${{ github.ref }}
  cancel-in-progress: false

jobs:
  closeout:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Initialize persistent activity log
        shell: bash
        run: |
          set -Eeuo pipefail
          LOG="$RUNNER_TEMP/m1i-runtime-closeout.log"
          {
            echo "timestamp=$(date -u +%FT%TZ)"
            echo "repository=$GITHUB_REPOSITORY"
            echo "event=$GITHUB_EVENT_NAME"
            echo "ref=$GITHUB_REF"
            echo "event_sha=$GITHUB_SHA"
            uname -a
            git --version
            python3 --version
          } > "$LOG"

      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: agent/surface_cell_quad/p5-recover-bridge-healing
          fetch-depth: 80
          submodules: false

      - name: Apply surgical durable status updates
        shell: bash
        run: |
          set -Eeuo pipefail
          LOG="$RUNNER_TEMP/m1i-runtime-closeout.log"
          exec > >(tee -a "$LOG") 2>&1
          trap 'rc=$?; echo "apply_final_rc=$rc"; git status --short || true; exit $rc' EXIT
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 .agents/Directional/turn-payloads/m1i-runtime-closeout.py
          git diff --check
          mapfile -t changed < <(git diff --name-only | LC_ALL=C sort)
          printf 'changed files:\n%s\n' "${changed[*]}"
          expected=(
            .agents/Directional/Future_Chat_Session_Handoff.md
            .agents/Directional/REORIENTATION_PLAN.md
            .agents/Directional/Regression_Root_Cause_Tracker.md
            MILESTONE_G_TODO.md
            TODO
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | LC_ALL=C sort)
          test "${#changed[@]}" -eq "${#expected_sorted[@]}"
          for i in "${!expected_sorted[@]}"; do
            test "${changed[$i]}" = "${expected_sorted[$i]}"
          done
          git diff --stat

      - name: Commit and push durable closeout
        shell: bash
        run: |
          set -Eeuo pipefail
          LOG="$RUNNER_TEMP/m1i-runtime-closeout.log"
          exec > >(tee -a "$LOG") 2>&1
          git config user.name 'OpenAI Directional Agent'
          git config user.email 'directional-agent@users.noreply.github.com'
          git add -f -- \
            .agents/Directional/Future_Chat_Session_Handoff.md \
            .agents/Directional/REORIENTATION_PLAN.md \
            .agents/Directional/Regression_Root_Cause_Tracker.md
          git add -- MILESTONE_G_TODO.md TODO
          git diff --cached --check
          mapfile -t staged < <(git diff --cached --name-only | LC_ALL=C sort)
          test "${#staged[@]}" -eq 5
          git diff --cached --name-status
          git commit -m 'docs: accept M1i runtime and select M1j'
          git push origin HEAD:agent/surface_cell_quad/p5-recover-bridge-healing
          echo "pushed_commit=$(git rev-parse HEAD)"

      - name: Upload dedicated diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m1i-runtime-closeout-logs
          path: ${{ runner.temp }}/m1i-runtime-closeout.log
          if-no-files-found: error
          retention-days: 14
