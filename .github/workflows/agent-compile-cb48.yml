name: Agent Compile CB48

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/compile-cb48-20260908.txt

permissions:
  contents: write
  actions: write
  issues: write
  pull-requests: write

concurrency:
  group: agent-compile-cb48
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/agent-compile-cb48.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: cb48-compile
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  owner_compile:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-compile-reusable.yml
    with:
      source_sha: 531b517fb129425f113b5f811215f1d2b1939ee2
      targets: directional_surface_cell_producer_tests
      artifact_prefix: m3-cp4c3-cb48-owner
    secrets: inherit

  package_compile:
    needs: owner_compile
    uses: ./.github/workflows/agent-compile-reusable.yml
    with:
      source_sha: 531b517fb129425f113b5f811215f1d2b1939ee2
      targets: directional_core directional_pipeline directional_surface_cell_authority_kernel_tests directional_surface_cell_producer_tests directional_surface_cell_completion_tests directional_surface_cell_validation_tests directional_compiled_api_tests directional_benchmarks
      artifact_prefix: m3-cp4c3-cb48-package108
    secrets: inherit
