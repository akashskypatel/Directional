name: Agent Source Snapshot CP-SCALE-TB1 20260914

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/source-snapshot/p5-cp-scale-tb1-20260914.txt

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: agent-source-snapshot-cp-scale-tb1-20260914
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/agent-source-snapshot-p5-cp-scale-tb1-20260914.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: source-snapshot-cp-scale-tb1-20260914
      commit_run_file: false
      trim_stale_comments: false
    secrets: inherit

  snapshot:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-source-snapshot.yml
    with:
      source_ref: 92648ae72307810f6fd8412c5fbca9fec30c4e83
      artifact_prefix: agent-source-snapshot-cp-scale-tb1-20260914
      retention_days: 7
    secrets: inherit
