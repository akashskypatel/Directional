name: M3 CP4c3 CB44 Code Patch Apply

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m3-cp4c3-cb44-code-apply/trigger.json

permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

concurrency:
  group: m3-cp4c3-cb44-code-apply
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/agent-m3-cp4c3-cb44-code-apply.yml
      source_ref: ${{ github.sha }}
      retention_days: 1
    secrets: inherit

  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m3-cp4c3-cb44-code-apply
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  apply:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1pjz3fC1PA2pNQhLqvKPBA6fbNPwZn0in
      patch_sha256: aeae17b6c2b1a4ce5d5df07f20bad85624fe0ed453e72983a872f335fe75508f
      base_sha: 952186cbf14e8c826b0ad3b489a8d8be52232b04
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: "fix: restore reduced Euler certificate and publish split census"
      retention_days: 7
    secrets: inherit
