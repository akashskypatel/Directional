name: M5 CP3 TB1 R11 R1 Docs Apply

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m5-cp3-tb1-r11-r1-docs-apply.txt

permissions:
  actions: read
  contents: write
  id-token: write
  issues: write
  pull-requests: write

concurrency:
  group: m5-cp3-tb1-r11-r1-docs-apply-${{ github.ref }}
  cancel-in-progress: false

jobs:
  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m5-cp3-tb1-r11-r1-docs-apply
      commit_run_file: false
      trim_stale_comments: false
    secrets: inherit

  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/m5-cp3-tb1-r11-r1-docs-apply.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  apply:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1-n47jUt29kDeBKW7W1nJ80IbpIPl51Rv
      patch_sha256: ee4067c4a0503ce6e9feb43b45ddf858a38c47c0ae1651b413adc685cd71bf3e
      base_sha: 750a11cf0edeaee1e7f7246c52145f7117b935a8
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: "docs: record M5-CP3-TB1-R11-R1 semantic red"
      retention_days: 7
    secrets: inherit
