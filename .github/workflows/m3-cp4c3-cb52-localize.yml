name: M3 CP4c3 CB52 Localize

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/cb52-localize/cb52-localize-20260909.txt

permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: m3-cp4c3-cb52-localize
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/m3-cp4c3-cb52-localize.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m3-cp4c3-cb52-localize
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  localize:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Initialize diagnostic log
        shell: bash
        run: |
          set -euo pipefail
          : > "$RUNNER_TEMP/cb52-localize.log"
          printf '%s\n' 'turn=M3-CP4c-3-CB52' 'runtimeExecution=false' | tee -a "$RUNNER_TEMP/cb52-localize.log"

      - name: Checkout control source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          submodules: false
          lfs: false

      - name: Localize pre-trap bootstrap
        env:
          GH_TOKEN: ${{ github.token }}
          TURN_ID: M3-CP4c-3-TB46
          ARTIFACT_ID: '10112532452'
          EXPECTED_ARTIFACT_NAME: m3-cp4c3-cb51-package111-result-34372482691
          EXPECTED_PROVIDER_DIGEST: sha256:62ae325186ef31d2936e1a797c55cef43f8aef62449b33a26e29cb1ecd9185da
          EXPECTED_ZIP_SHA256: 62ae325186ef31d2936e1a797c55cef43f8aef62449b33a26e29cb1ecd9185da
          EXPECTED_SOURCE_SHA: 4f0663ef3468996abce6f59109f1c67f5be5f604
          SELECTOR_RELATIVE_PATH: .agents/Directional/Architecture_M3_CP4c3_Required_Green_Selector_409.txt
          EXPECTED_SELECTOR_COUNT: '409'
          EXPECTED_SELECTOR_SHA256: eea6d8c2bbc8e9247deb4bfbbe6763042c76002d1894dd62e35f80262403b53e
          ACCEPTED_PREFIX_COUNT: '365'
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/cb52-localize.log"
          exec > >(tee -a "$log") 2>&1
          required=(GITHUB_REPOSITORY GITHUB_RUN_ID GH_TOKEN TURN_ID ARTIFACT_ID EXPECTED_ARTIFACT_NAME EXPECTED_PROVIDER_DIGEST EXPECTED_ZIP_SHA256 EXPECTED_SOURCE_SHA SELECTOR_RELATIVE_PATH EXPECTED_SELECTOR_COUNT EXPECTED_SELECTOR_SHA256 ACCEPTED_PREFIX_COUNT RUNNER_TEMP)
          for name in "${required[@]}"; do
            if [[ -v "$name" && -n "${!name}" ]]; then echo "presence_${name}=yes"; else echo "presence_${name}=no"; exit 70; fi
          done
          [[ -d "$RUNNER_TEMP" && -w "$RUNNER_TEMP" ]] || { echo 'runner_temp_writable=no'; exit 71; }
          echo 'runner_temp_writable=yes'
          echo 'before_safe_turn_id=yes'
          SAFE_TURN_ID="$(printf '%s' "$TURN_ID" | tr -c 'A-Za-z0-9._-' '-')"
          echo 'after_safe_turn_id=yes'
          ROOT="${RUNNER_TEMP}/${SAFE_TURN_ID}"
          PKG="${ROOT}/package"; SOURCE="${ROOT}/source"; EXEC_VIEW="${ROOT}/execution-view"
          RESULT="${RUNNER_TEMP}/${SAFE_TURN_ID}-result"; LOG="${RUNNER_TEMP}/${SAFE_TURN_ID}.log"
          ZIP="${ROOT}/artifact-${ARTIFACT_ID}.zip"; RUNTIME="${ROOT}/runtime"
          echo 'before_mkdir=yes'
          mkdir -p "$ROOT" "$PKG" "$SOURCE" "$EXEC_VIEW/bin" "$RESULT/raw" "$RESULT/resources" "$RESULT/failure-details" "$RUNTIME"
          echo 'after_mkdir=yes'
          : > "$LOG"
          echo 'after_log_create=yes'
          bash -n .agents/Directional/tools/m3_cp4c3_artifact_only_harness.sh
          echo 'bash_n=yes'

      - name: Upload diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-cp4c3-cb52-localize-log-${{ github.run_id }}
          path: ${{ runner.temp }}/cb52-localize.log
          if-no-files-found: error
          retention-days: 7
