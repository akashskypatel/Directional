name: M6 DEFN R2 Drive Patch Apply

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/drive-patch/m6-defn-r2-apply.txt

permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

concurrency:
  group: m6-defn-r2-drive-apply
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/agent-m6-defn-r2-drive-apply.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m6-defn-r2-drive-apply
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  apply:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1AP62lxj_v7u5_uEFOrDHTLUzBJHJQx5k
      patch_sha256: b9dc7890e36be199f1a65a530330f045626ebc98e42ef0dce7c9c83a791a9d4c
      base_sha: 342a306ebd3ba68cb6e1135cf9e25726bd8ad461
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: "M6-DEFN-R2: freeze seam-incident authority amendments"
    secrets: inherit
