name: M6 CP1 CB8 A6 Compile

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m6-cp1-cb8-a6-compile.txt

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: m6-cp1-cb8-a6-compile-${{ github.ref }}
  cancel-in-progress: false

jobs:
  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m6-cp1-cb8-a6-compile
      commit_run_file: false
      trim_stale_comments: false
    secrets: inherit

  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/m6-cp1-cb8-a6-compile.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  compile:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-compile-reusable.yml
    with:
      source_sha: 2b182f1ca2ea61edd3304030c3cac3def45b69fb
      artifact_prefix: m6-cp1-cb8-a6
    secrets: inherit
