name: Agent R-A T+B Retry Closeout 2

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/ra-tb-retry-closeout-2.txt

permissions:
  contents: write

jobs:
  closeout:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact control-plane head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 30
          submodules: false

      - name: Apply durable T+B closeout payload
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git status --porcelain=v1 | tee "$RUNNER_TEMP/status-before.txt"
          test ! -s "$RUNNER_TEMP/status-before.txt"
          python3 .agents/Directional/turn-payloads/ra-tb-retry-closeout/closeout.py
          for path in \
            .agents/Directional/Architecture_M1_RA_Closeout_Artifact_Only_Test_Benchmark_Report.md \
            .agents/Directional/Architecture_M1_Single_Authority_Cutover_Code_Build_Plan.md \
            .agents/Directional/CHANGELOG.md \
            .agents/Directional/Future_Chat_Session_Handoff.md \
            TODO.md; do
            sed -i 's/[[:space:]]\+$//' "$path"
          done
          git diff --check
          changed="$(git status --porcelain=v1 | sed -E 's/^.. //' | sort)"
          expected="$(printf '%s\n' \
            .agents/Directional/Architecture_M1_RA_Closeout_Artifact_Only_Test_Benchmark_Report.md \
            .agents/Directional/Architecture_M1_Single_Authority_Cutover_Code_Build_Plan.md \
            .agents/Directional/CHANGELOG.md \
            .agents/Directional/Future_Chat_Session_Handoff.md \
            TODO.md | sort)"
          printf 'changed_files=\n%s\n' "$changed"
          test "$changed" = "$expected"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add TODO.md
          git add -f \
            .agents/Directional/Architecture_M1_RA_Closeout_Artifact_Only_Test_Benchmark_Report.md \
            .agents/Directional/Architecture_M1_Single_Authority_Cutover_Code_Build_Plan.md \
            .agents/Directional/CHANGELOG.md \
            .agents/Directional/Future_Chat_Session_Handoff.md
          git commit -m 'docs: record R-A artifact T+B retry 2 failure'
          git push origin "HEAD:${GITHUB_REF_NAME}"
          git status --porcelain=v1 | tee "$RUNNER_TEMP/status-after.txt"
          test ! -s "$RUNNER_TEMP/status-after.txt"
          echo 'runtimeExecution=false'
          echo 'Documentation-only closeout; no generated Directional binary executed.'
