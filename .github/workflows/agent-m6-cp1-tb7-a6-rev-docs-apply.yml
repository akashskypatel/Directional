name: M6 CP1 TB7 A6 Review Docs Apply

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m6-cp1-tb7-a6-rev-docs-apply-20261003.txt

permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

concurrency:
  group: m6-cp1-tb7-a6-rev-docs-apply-${{ github.ref }}
  cancel-in-progress: false

jobs:
  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m6-cp1-tb7-a6-rev-docs-apply
      commit_run_file: false
      trim_stale_comments: false
    secrets: inherit

  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/agent-m6-cp1-tb7-a6-rev-docs-apply.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  apply:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1Q_5r0r2j5XpeCI0YDtnlnbMLl1UCXh0-
      patch_sha256: e134ae5544bc5e8e52d99ccf61245a9347518b0989e1aa3b66646d0503ed9760
      base_sha: ea826744832357d7234ebc9d34c3d23cb9865207
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: Review M6-CP1-TB7-A6 and freeze CB8-A6 recovery
    secrets: inherit
