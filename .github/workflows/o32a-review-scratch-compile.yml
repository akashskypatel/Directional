name: O32a Scratch Review Compile

on:
  push:
    branches:
      - scratch/p13-o32a-seed-review-20261105
    paths:
      - .github/workflows/o32a-review-scratch-compile.yml
      - tests/SurfaceCellREPackageTests.cpp

permissions:
  actions: write
  contents: write

jobs:
  compile:
    uses: ./.github/workflows/agent-compile-reusable.yml
    with:
      source_sha: ${{ github.sha }}
      targets: directional_surface_cell_producer_tests
      artifact_prefix: o32a-scratch-control-compile
    secrets: inherit

  mailbox:
    if: ${{ always() }}
    needs: [compile]
    permissions:
      actions: read
      contents: write
    uses: ./.github/workflows/workflow-mailbox-publisher.yml
    with:
      mailbox_branch: workflow-mailbox
      workflow_key: o32a-scratch-control-compile
      source_sha: ${{ github.sha }}
      source_ref: ${{ github.ref }}
      result: ${{ needs.compile.result }}
      summary: Temporary O32a scratch-control compile.
