name: M3 CP4ab CB R7 Apply Schema Validation

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/workflow-schema/m3-cp4ab-cb-r7-apply-20260823.txt

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: m3-cp4ab-cb-r7-apply-schema
  cancel-in-progress: false

jobs:
  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m3-cp4ab-cb-r7-apply-schema
      commit_run_file: false
    secrets: inherit

  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .agents/Directional/turn-payloads/m3-cp4ab-cb-r7-apply.yml
      source_ref: ${{ github.sha }}
      retention_days: 7
    secrets: inherit
