name: Agent P13 A3 Review Boundary Verification

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/review-boundary/p13-a3-20261108.txt

permissions:
  actions: read
  contents: write

concurrency:
  group: directional-p13-a3-review-boundary-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/directional-review-boundary-verify.yml
      source_ref: ${{ github.sha }}

  review:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Initialize diagnostic log
        shell: bash
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/review-boundary.log"
          : > "$log"
          {
            echo "run_id=${GITHUB_RUN_ID}"
            echo "event_sha=${GITHUB_SHA}"
            echo "ref=${GITHUB_REF}"
            echo "started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } | tee -a "$log"
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Execute exact review boundary and ancestry checks
        shell: bash
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/review-boundary.log"
          exec > >(tee -a "$log") 2>&1
          trap 'rc=$?; echo "review_job_exit=${rc}"; echo "finished_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"; git status -sb || true' EXIT
          echo "git_version=$(git --version)"
          echo "python_version=$(python3 --version)"
          echo "head_sha=$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          echo "remote_branch_sha=$(git rev-parse 'refs/remotes/origin/agent/surface_cell_quad/p5-recover-bridge-healing')"
          test "$(git rev-parse 'refs/remotes/origin/agent/surface_cell_quad/p5-recover-bridge-healing')" = "${GITHUB_SHA}"
          git merge-base --is-ancestor 8b7299b43 HEAD
          git status --porcelain
          test -z "$(git status --porcelain)"
          python3 .agents/Directional/tools/review_check.py boundary
          python3 .agents/Directional/tools/review_check.py ledgers --base 8b7299b43
          git checkout -B agent/surface_cell_quad/p5-recover-bridge-healing "${GITHUB_SHA}"
          git branch --set-upstream-to=origin/agent/surface_cell_quad/p5-recover-bridge-healing
          git status -sb
          test "$(git rev-list --left-right --count HEAD...@{upstream})" = "0$(printf '\t')0"
          echo 'ALL REVIEW BOUNDARY CHECKS PASSED'
      - name: Upload review-boundary log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: directional-p13-a3-review-boundary-${{ github.run_id }}
          path: ${{ runner.temp }}/review-boundary.log
          if-no-files-found: error
          retention-days: 14

  mailbox:
    if: ${{ always() }}
    needs: [validate, review]
    permissions:
      actions: read
      contents: write
    uses: ./.github/workflows/workflow-mailbox-publisher.yml
    with:
      mailbox_branch: workflow-mailbox
      workflow_key: p13-a3-review-boundary
      source_sha: ${{ github.sha }}
      source_ref: ${{ github.ref }}
      result: ${{ needs.review.result }}
      summary: Full-history source-only Review boundary and ledger verification.
