name: M5 CP3 CB6 Drive Apply

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m5-cp3-cb6-drive-apply.txt

permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

concurrency:
  group: m5-cp3-cb6-drive-apply-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/m5-cp3-cb6-drive-apply.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m5-cp3-cb6-drive-apply
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  apply:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1HLlzVs9_Ol2avBXcoWwfeMPvl-8jem-f
      patch_sha256: 'ec37451a776bda8e1c18c36e4b18e1ae2fec363d7ff6e48fca57d461306565c2'
      base_sha: 80db2992c747e32eaf3e743ea4b63afa5e0c746c
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: 'M5-CP3-CB6: correct carrier distinctness and atlas oracle'
    secrets: inherit
