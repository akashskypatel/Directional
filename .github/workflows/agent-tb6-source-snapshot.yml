name: Agent TB6 Source Snapshot

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/tb6-source-snapshot.txt

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: agent-tb6-source-snapshot-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/agent-tb6-source-snapshot.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: tb6-source-snapshot
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  snapshot:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-source-snapshot.yml
    with:
      source_ref: 76344df49e37aa91236a6bebdece3ebd37b8b817
      artifact_prefix: m4-cp-scale-tb6-source
    secrets: inherit
