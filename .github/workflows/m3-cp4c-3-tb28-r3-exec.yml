name: M3 CP4c-3 TB28 R3 EXEC

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m3-cp4c-3-tb28-r3-exec.txt

permissions:
  contents: write
  actions: read
  issues: write
  pull-requests: write

concurrency:
  group: m3-cp4c-3-tb28-r3-exec
  cancel-in-progress: false

jobs:
  validate-caller:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/m3-cp4c-3-tb28-r3-exec.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m3-cp4c-3-tb28-r3-exec
      commit_run_file: false
    secrets: inherit

  execute:
    needs: validate-caller
    if: ${{ needs.validate-caller.outputs.valid == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Initialize diagnostic log
        shell: bash
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/m3-cp4c3-tb28-r3.log"
          : > "$log"
          {
            echo "workflow=${GITHUB_WORKFLOW}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "event=${GITHUB_EVENT_NAME}"
            echo "event_sha=${GITHUB_SHA}"
            echo "ref=${GITHUB_REF}"
            echo "repository=${GITHUB_REPOSITORY}"
            echo "turn=M3-CP4c-3-TB28-R3-EXEC"
            echo "runtimeExecution=artifact-only"
            echo "started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } | tee -a "$log"

      - name: Checkout exact harness source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          submodules: false
          lfs: false
          token: ${{ secrets.GH_TOKEN || github.token }}

      - name: Verify frozen execution contract
        shell: bash
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/m3-cp4c3-tb28-r3.log"
          exec > >(tee -a "$log") 2>&1
          echo "checked_out_sha=$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -f .agents/Directional/Architecture_M3_CP4c3_TB28_R3_Artifact_Only_Test_Benchmark_Plan.md
          test -x .agents/Directional/tools/m3_cp4c3_tb28_r3_harness.sh
          grep -Fq 'ARTIFACT_ID=9975737868' .agents/Directional/tools/m3_cp4c3_tb28_r3_harness.sh
          grep -Fq "EXPECTED_SOURCE_SHA='098ac7d93ea203222dd0ac50cdb68667744f0fd4'" .agents/Directional/tools/m3_cp4c3_tb28_r3_harness.sh
          grep -Fq "EXPECTED_407='9e5b7c62901b694399b215bc02a5ade09f3466795b20181c42a039a32f9718ae'" .agents/Directional/tools/m3_cp4c3_tb28_r3_harness.sh
          git status --short

      - name: Execute immutable selector407 control
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
        shell: bash
        run: |
          set -euo pipefail
          .agents/Directional/tools/m3_cp4c3_tb28_r3_harness.sh --execute

      - name: Record final source status
        if: always()
        shell: bash
        run: |
          set +e
          log="${RUNNER_TEMP}/m3-cp4c3-tb28-r3.log"
          {
            echo "final_job_status=${{ job.status }}"
            echo "final_sha=$(git rev-parse HEAD 2>/dev/null || echo unavailable)"
            git status --short 2>&1 || true
            echo "finished_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } | tee -a "$log"

      - name: Upload execution result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-cp4c3-tb28-r3-exec-result-${{ github.run_id }}
          path: ${{ runner.temp }}/m3-cp4c3-tb28-r3-result
          if-no-files-found: error
          retention-days: 14

      - name: Upload diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-cp4c3-tb28-r3-exec-log-${{ github.run_id }}
          path: ${{ runner.temp }}/m3-cp4c3-tb28-r3.log
          if-no-files-found: error
          retention-days: 14
