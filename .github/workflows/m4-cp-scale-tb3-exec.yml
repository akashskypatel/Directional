name: M4 CP SCALE TB3 EXEC

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m4-cp-scale-tb3-exec-20260915.txt

permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: m4-cp-scale-tb3-exec
  cancel-in-progress: false

jobs:
  validate-caller:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/m4-cp-scale-tb3-exec.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m4-cp-scale-tb3-exec
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  tb3-exec:
    needs: validate-caller
    if: ${{ needs.validate-caller.outputs.valid == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Initialize diagnostic log
        shell: bash
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/m4-cp-scale-tb3-exec.log"
          : > "$log"
          {
            echo "workflow=${GITHUB_WORKFLOW}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "event=${GITHUB_EVENT_NAME}"
            echo "event_sha=${GITHUB_SHA}"
            echo "ref=${GITHUB_REF}"
            echo "repository=${GITHUB_REPOSITORY}"
            echo "turn=M4-CP-SCALE-TB3-EXEC"
            echo "started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } | tee -a "$log"

      - name: Checkout orchestration source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 4
          submodules: false
          lfs: false
          token: ${{ secrets.GH_TOKEN || github.token }}

      - name: Verify frozen execution boundary
        shell: bash
        env:
          ORCHESTRATION_BASE: de7c573955578fb8ec599233870e83cda0e910dd
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/m4-cp-scale-tb3-exec.log"
          exec > >(tee -a "$log") 2>&1
          trap 'status=$?; echo "verify_boundary_exit=${status}"' EXIT
          echo "git_version=$(git --version)"
          echo "gh_version=$(gh --version | head -n 1)"
          echo "orchestration_base=${ORCHESTRATION_BASE}"
          echo "event_sha=${GITHUB_SHA}"
          git cat-file -e "${ORCHESTRATION_BASE}^{commit}"
          changed="$(git diff --name-only "${ORCHESTRATION_BASE}" "${GITHUB_SHA}" | LC_ALL=C sort)"
          printf 'changed_since_orchestration_base=\n%s\n' "$changed"
          expected=$(printf '%s\n' \
            '.agents/connector-triggers/m4-cp-scale-tb3-exec-20260915.txt' \
            '.github/workflows/m4-cp-scale-tb3-exec.yml' | LC_ALL=C sort)
          test "$changed" = "$expected"
          test -f .agents/Directional/turn-payloads/m4-cp-scale-tb3-exec.sh
          test -f .agents/Directional/Architecture_M4_CP_SCALE_TB3_EXEC_Test_Benchmark_Plan.md
          git status --short

      - name: Execute frozen artifact-only TB3 payload
        id: execute
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
        run: |
          set -o pipefail
          log="${RUNNER_TEMP}/m4-cp-scale-tb3-exec.log"
          set +e
          bash .agents/Directional/turn-payloads/m4-cp-scale-tb3-exec.sh 2>&1 | tee -a "$log"
          rc=${PIPESTATUS[0]}
          set -e
          echo "payload_exit=${rc}" | tee -a "$log"
          echo "payload_exit=${rc}" >> "$GITHUB_OUTPUT"
          exit "$rc"

      - name: Upload TB3 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m4-cp-scale-tb3-exec-result-${{ github.run_id }}
          path: ${{ runner.temp }}/tb3-publish
          if-no-files-found: error
          retention-days: 14

      - name: Record final TB3 status
        if: always()
        shell: bash
        run: |
          set +e
          log="${RUNNER_TEMP}/m4-cp-scale-tb3-exec.log"
          {
            echo "payload_outcome=${{ steps.execute.outcome }}"
            echo "payload_exit=${{ steps.execute.outputs.payload_exit }}"
            echo "final_job_status=${{ job.status }}"
            echo "runtimeExecution=true"
            echo "finished_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } | tee -a "$log"

      - name: Upload diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m4-cp-scale-tb3-exec-log-${{ github.run_id }}
          path: ${{ runner.temp }}/m4-cp-scale-tb3-exec.log
          if-no-files-found: error
          retention-days: 14

      - name: Fail when frozen payload failed
        if: always() && steps.execute.outputs.payload_exit != '0'
        shell: bash
        run: |
          echo "TB3 frozen payload failed with exit ${{ steps.execute.outputs.payload_exit }}" >&2
          exit 1
