name: M3 CP4c3 TB23 R1 EXEC

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m3-cp4c3-tb23-r1/**

permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: m3-cp4c3-tb23-r1-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/m3-cp4c3-tb23-r1-exec.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m3-cp4c3-tb23-r1
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  execute:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Initialize diagnostic log
        shell: bash
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/m3-cp4c3-tb23-r1-bootstrap.log"
          : > "$log"
          printf '%s\n' \
            "workflow=${GITHUB_WORKFLOW}" \
            "run_id=${GITHUB_RUN_ID}" \
            "event=${GITHUB_EVENT_NAME}" \
            "event_sha=${GITHUB_SHA}" \
            "ref=${GITHUB_REF}" \
            "repository=${GITHUB_REPOSITORY}" \
            'turnBoundary=Test+Benchmark-artifact-only' \
            'compileExecution=false' \
            'benchmarkExecution=false' \
            "started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" | tee -a "$log"

      - name: Fetch exact frozen TB23-R1 harness
        shell: bash
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/m3-cp4c3-tb23-r1-bootstrap.log"
          exec > >(tee -a "$log") 2>&1
          harness="${RUNNER_TEMP}/m3_cp4c3_tb23_r1_harness.sh"
          url="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}/.agents/Directional/tools/m3_cp4c3_tb23_r1_harness.sh"
          curl --fail --silent --show-error "$url" -o "$harness"
          bash -n "$harness"
          printf '%s  %s\n' 'fdc335ddffe1fbaeb45783a24bfaf45b17ba0843a65df8b22950b29980cc16d7' "$harness" | sha256sum -c -

      - name: Execute frozen artifact-only TB23-R1 plan
        id: execution
        shell: bash
        run: |
          set +e
          bash "${RUNNER_TEMP}/m3_cp4c3_tb23_r1_harness.sh" --execute
          status=$?
          echo "exit_code=${status}" >> "$GITHUB_OUTPUT"
          echo "tb23_r1_exit=${status}" | tee -a "${RUNNER_TEMP}/m3-cp4c3-tb23-r1-bootstrap.log"
          exit 0

      - name: Upload TB23-R1 result evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-cp4c3-tb23-r1-result-${{ github.run_id }}
          path: ${{ runner.temp }}/m3-cp4c3-tb23-r1-result
          if-no-files-found: error
          retention-days: 14

      - name: Consolidate diagnostic log
        if: always()
        shell: bash
        run: |
          set +e
          bootstrap="${RUNNER_TEMP}/m3-cp4c3-tb23-r1-bootstrap.log"
          harness="${RUNNER_TEMP}/m3-cp4c3-tb23-r1.log"
          final="${RUNNER_TEMP}/m3-cp4c3-tb23-r1-final.log"
          cat "$bootstrap" > "$final"
          if [[ -f "$harness" ]]; then
            printf '\n===== harness log =====\n' >> "$final"
            cat "$harness" >> "$final"
          fi
          printf '%s\n' \
            "execution_step_exit=${{ steps.execution.outputs.exit_code }}" \
            "job_status=${{ job.status }}" \
            "finished_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$final"

      - name: Upload TB23-R1 diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-cp4c3-tb23-r1-log-${{ github.run_id }}
          path: ${{ runner.temp }}/m3-cp4c3-tb23-r1-final.log
          if-no-files-found: error
          retention-days: 14

      - name: Enforce TB23-R1 orchestration boundary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          status='${{ steps.execution.outputs.exit_code }}'
          result="${RUNNER_TEMP}/m3-cp4c3-tb23-r1-result"
          boundary="$result/execution-boundary.txt"
          test "$status" = '0'
          test -f "$boundary"
          grep -Fxq 'mode=--execute' "$boundary"
          grep -Fxq 'runtime_started=true' "$boundary"
          grep -Fxq 'runtime_completed=true' "$boundary"
          grep -Fxq 'preflight_completed=true' "$boundary"
          grep -Fxq 'execution_view_verified=true' "$boundary"
          grep -Fxq 'orchestration_failure=false' "$boundary"
          grep -Fxq 'benchmark_execution=false' "$boundary"
          grep -Fxq 'configure_execution=false' "$boundary"
          grep -Fxq 'compile_execution=false' "$boundary"
          grep -Fxq 'relink_execution=false' "$boundary"
          grep -Fxq 'generated_discovery=false' "$boundary"
          grep -Fxq 'package_repair=false' "$boundary"
          grep -Fxq 'mode_repair=false' "$boundary"
          grep -Fxq 'source_test_fixture_selector_mutation=false' "$boundary"
          grep -Fxq 'resolved_rule=sibling' "$result/execution-view.txt"
          grep -Fxq 'package_census_equal=true' "$result/package-immutability.txt"
          grep -Fxq 'source_census_equal=true' "$result/source-immutability.txt"
          grep -Fxq 'execution_view_census_equal=true' "$result/execution-view-immutability.txt"
          test "$(wc -l < "$result/ledger.tsv")" -eq 398
          grep -Fxq 'total=397' "$result/semantic-summary.txt"
