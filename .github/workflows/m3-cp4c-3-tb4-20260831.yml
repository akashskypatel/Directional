name: M3 CP4c3 TB4 Artifact Gate

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m3-cp4c-3-tb4-20260831.txt

permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: m3-cp4c-3-tb4-20260831
  cancel-in-progress: false

jobs:
  validate-caller:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/m3-cp4c-3-tb4-20260831.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m3-cp4c-3-tb4-20260831
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  gate:
    needs: validate-caller
    if: ${{ needs.validate-caller.outputs.valid == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Initialize diagnostic log
        shell: bash
        run: |
          set -euo pipefail
          : > "${RUNNER_TEMP}/cp4c3-tb4.log"
          printf '%s\n' "workflow=$GITHUB_WORKFLOW" "run_id=$GITHUB_RUN_ID" "event_sha=$GITHUB_SHA" "started_at=$(date -u +%FT%TZ)" | tee -a "${RUNNER_TEMP}/cp4c3-tb4.log"

      - name: Checkout exact orchestration control
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          submodules: false
          lfs: false

      - name: Execute immutable package 73 gate and diagnostics
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_ARTIFACT_ID: '9773591345'
          PACKAGE_OUTER_SHA256: '8f3a8f0d6a3ad0931db89cb3e94c33d1d7e8a0d9e1aba27a6ad2690ec9c402a0'
          PACKAGE_TAR_SHA256: 'fc939abc4110f4a658d80932b395f59c9fd7cecbbcde7caac0ba7b6a41d1aca1'
          SOURCE_SHA: '2d22ef293363058cfdca96d01158a93d2c0200f8'
          SOURCE_ARCHIVE_SHA256: '36451a2473a8858225cf9eabb181a58a5397f400f7f0a99995a1b8da37a2cb4f'
          SELECTOR_SHA256: 'b47c269851fad1384b5dc9baaf674b3d4ad80ec6c2b40f7f8eda2055c6f44834'
          PREFIX355: 'e9d88f1196e412e06424294d6be22b32f01c9671ec5e4de119abd3f2fb5afeaa'
          PREFIX357: 'b896d0db7f26aeb0f3513418405efdeccbcf84fb6dc971500c6ddac9e364dc70'
          PREFIX361: '61918d9fbd7bf757437886f0e86776b60665c58e4d7283b81d42caca03c0288b'
          PREFIX365: '6b5b6555d39c250c24cbf3faeafdeca93b4b11379118a29583253e6cfc14b8a1'
          PREFIX367: 'ef9d082f56f5c8de83124cf2e6257d098408cc597d9147b967cf9c84da4916bf'
          PREFIX370: '9160ea619afb9e10cbad30012d0bd354c263a2b749e690c271f653db3bf83525'
          HASH_BENCHMARKS: '2984e9072707e87b6fc1409cb16ebe1d4df560205632575a5c32590e03e357ea'
          HASH_COMPILED_API: '03dd6824089c575be2c695367f8b2ff091162acf79e79f0f9681a11d7aa113fe'
          HASH_AUTHORITY: '579cbb7798bf8e0da3ccb41bb3fe2cab9cbd0e3e4f38728c26acad66b89be339'
          HASH_COMPLETION: '97e8a19bfc70a7f03448ac43b502f89f4fef29a91ce374ef3d5d498bab2df355'
          HASH_PRODUCER: '14b6f215810c55edcb6b4b4f1cd5c7e2d9692310df33ff566b16dadf01df4e1c'
          HASH_VALIDATION: 'b72601e42333a0727c0bbe90d7928b39410c0094ff2f0642d98b7b9ef5159efb'
        shell: bash
        run: bash .agents/Directional/turn-payloads/m3-cp4c-3-tb4-run.sh

      - name: Record final control source status
        if: always()
        shell: bash
        run: |
          set +e
          { echo "final_job_status=${{ job.status }}"; echo "final_control_sha=$(git rev-parse HEAD 2>/dev/null || echo unavailable)"; git status --short 2>&1 || true; echo "finished_at=$(date -u +%FT%TZ)"; } | tee -a "${RUNNER_TEMP}/cp4c3-tb4.log"

      - name: Upload gate result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-cp4c3-tb4-result-${{ github.run_id }}
          path: ${{ runner.temp }}/cp4c3-tb4-result
          if-no-files-found: error
          retention-days: 7

      - name: Upload diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-cp4c3-tb4-log-${{ github.run_id }}
          path: ${{ runner.temp }}/cp4c3-tb4.log
          if-no-files-found: error
          retention-days: 7
