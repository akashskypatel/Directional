name: M6 CP1 CB8 A6 Apply

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m6-cp1-cb8-a6-apply.txt

permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

concurrency:
  group: m6-cp1-cb8-a6-apply-${{ github.ref }}
  cancel-in-progress: false

jobs:
  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m6-cp1-cb8-a6-apply
      commit_run_file: false
      trim_stale_comments: false
    secrets: inherit

  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/m6-cp1-cb8-a6-apply.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  apply:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1eWgeYYMNw2DmzFnxmHKZW2BFRJLvjtb3
      patch_sha256: b666f5f230c140e40c0487887a7b1e1b99b1fdbc1859bad19fe0b3859476e01f
      base_sha: 8d800223c981e2e5e9daea0fa99763cc2e70d311
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: "M6-CP1-CB8-A6: recover hard-rail placement transport"
    secrets: inherit
