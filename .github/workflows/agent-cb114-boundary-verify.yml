name: Agent CB114 Full-History Boundary Verification

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/cb114-boundary-verify-20261109.txt

permissions:
  actions: read
  contents: write

concurrency:
  group: agent-cb114-boundary-verify-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/agent-cb114-boundary-verify.yml
      source_ref: ${{ github.sha }}

  boundary:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Initialize persistent log
        shell: bash
        run: |
          set -euo pipefail
          : > "${RUNNER_TEMP}/cb114-boundary.log"
          {
            echo "repository=${GITHUB_REPOSITORY}"
            echo "event_sha=${GITHUB_SHA}"
            echo "ref=${GITHUB_REF}"
            echo "started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } | tee -a "${RUNNER_TEMP}/cb114-boundary.log"
      - name: Checkout exact full-history source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          submodules: false
          persist-credentials: false
      - name: Verify genuine history and boundary
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee -a "${RUNNER_TEMP}/cb114-boundary.log") 2>&1
          trap 'rc=$?; echo "boundary_exit=${rc}"; echo "finished_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"' EXIT
          echo "checked_out_sha=$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo "shallow=$(git rev-parse --is-shallow-repository)"
          test "$(git rev-parse --is-shallow-repository)" = false
          git cat-file -t 8b7299b43
          git merge-base --is-ancestor 8b7299b43 HEAD
          git status --porcelain
          python3 .agents/Directional/tools/review_check.py boundary
          echo 'CB114_BOUNDARY_VERIFIED=true'
      - name: Upload boundary result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cb114-boundary-result-${{ github.run_id }}
          path: ${{ runner.temp }}/cb114-boundary.log
          if-no-files-found: error
          retention-days: 14
      - name: Upload diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cb114-boundary-diagnostic-log-${{ github.run_id }}
          path: ${{ runner.temp }}/cb114-boundary.log
          if-no-files-found: error
          retention-days: 14

  mailbox:
    if: ${{ always() }}
    needs: [boundary]
    uses: ./.github/workflows/workflow-mailbox-publisher.yml
    with:
      mailbox_branch: workflow-mailbox
      workflow_key: cb114-boundary-verify
      source_sha: ${{ github.sha }}
      source_ref: ${{ github.ref }}
      result: ${{ needs.boundary.result }}
      summary: CB114 exact full-history read-only selector boundary verification.
