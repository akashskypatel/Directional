name: M5 CP2 TB1 Artifact-Only Test Benchmark

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m5-cp2-tb1-exec-20260920.txt

permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: m5-cp2-tb1-exec-${{ github.ref }}
  cancel-in-progress: false

jobs:
  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m5-cp2-tb1-exec
      commit_run_file: false
      trim_stale_comments: false
    secrets: inherit

  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/m5-cp2-tb1-exec.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  runtime:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
      TURN_ID: M5-CP2-TB1-EXEC
      HARNESS_PATH: .agents/Directional/turn-payloads/m5-cp2-tb1-exec-harness.sh
      EXPECTED_HARNESS_SHA256: '33a94854058f52c07d084591c22d1c277deb9e5bbf190a1669c629114917a8a7'
    steps:
      - name: Initialize diagnostic log
        shell: bash
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/m5-cp2-tb1-executor.log"
          : > "$log"
          {
            echo "turn=${TURN_ID}"
            echo "workflow=${GITHUB_WORKFLOW}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "event=${GITHUB_EVENT_NAME}"
            echo "event_sha=${GITHUB_SHA}"
            echo "ref=${GITHUB_REF}"
            echo "repository=${GITHUB_REPOSITORY}"
            echo "runtimeExecution=true"
            echo "artifactOnly=true"
            echo "compileExecution=false"
            echo "benchmarkExecution=false"
            echo "started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } | tee -a "$log"

      - name: Checkout exact orchestration source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          submodules: false
          lfs: false
          token: ${{ secrets.GH_TOKEN || github.token }}

      - name: Verify frozen harness
        shell: bash
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/m5-cp2-tb1-executor.log"
          exec > >(tee -a "$log") 2>&1
          actual="$(sha256sum "$HARNESS_PATH" | awk '{print $1}')"
          echo "harness_path=${HARNESS_PATH}"
          echo "harness_expected_sha256=${EXPECTED_HARNESS_SHA256}"
          echo "harness_actual_sha256=${actual}"
          test "$actual" = "$EXPECTED_HARNESS_SHA256"
          bash -n "$HARNESS_PATH"

      - name: Execute immutable artifact-only gate
        id: execute
        shell: bash
        run: |
          set +e
          log="${RUNNER_TEMP}/m5-cp2-tb1-executor.log"
          echo "command=bash ${HARNESS_PATH} --execute" | tee -a "$log"
          bash "$HARNESS_PATH" --execute
          code=$?
          echo "harness_exit=${code}" | tee -a "$log"
          echo "exit_code=${code}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload Test and Benchmark result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: directional-m5-cp2-tb1-result-${{ github.run_id }}
          path: ${{ runner.temp }}/M5-CP2-TB1-EXEC-result
          if-no-files-found: error
          retention-days: 14

      - name: Record final executor status
        if: always()
        shell: bash
        run: |
          set +e
          log="${RUNNER_TEMP}/m5-cp2-tb1-executor.log"
          {
            echo "harness_exit=${{ steps.execute.outputs.exit_code }}"
            echo "final_job_status=${{ job.status }}"
            echo "final_sha=$(git rev-parse HEAD 2>/dev/null || echo unavailable)"
            git status --short 2>&1 || true
            echo "finished_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } | tee -a "$log"

      - name: Upload executor diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: directional-m5-cp2-tb1-log-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/m5-cp2-tb1-executor.log
            ${{ runner.temp }}/M5-CP2-TB1-EXEC.log
          if-no-files-found: error
          retention-days: 14

      - name: Propagate harness status
        if: always()
        shell: bash
        run: |
          code="${{ steps.execute.outputs.exit_code }}"
          test -n "$code"
          exit "$code"
