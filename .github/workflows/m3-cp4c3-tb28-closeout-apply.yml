name: M3 CP4c3 TB28 Closeout Apply

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/tb28/tb28-closeout-apply-20260905.txt

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

concurrency:
  group: m3-cp4c3-tb28-closeout-apply
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/m3-cp4c3-tb28-closeout-apply.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: tb28-closeout-apply
      commit_run_file: false
    secrets: inherit

  apply:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1I2kNHTdlmB4V05Jj69j7ThL48YFh3b-t
      patch_sha256: 32e26cd92f3186a46ef131d5137cefdba7f1d6e65393c1e7425f5625a817a484
      base_sha: b15313921cdd9f4140563efa19a8286b03f6fc76
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: 'docs: close M3-CP4c-3-TB28 and route independent review'
    secrets: inherit
