name: M4 CP SCALE TB12 R4 Closeout Drive Apply

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/tb12-r4-closeout-drive-apply.txt

permissions:
  actions: read
  contents: write
  id-token: write
  issues: write
  pull-requests: write

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/m4-cp-scale-tb12-r4-closeout-drive-apply.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: tb12-r4-closeout-drive-apply
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  apply:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1Q59j-d9qXeZ9AYLHnG5o5zf-yfo46jTT
      patch_sha256: eeaf266b96dfb6a56843d0b2da05f80767df00ca4dc1f64ebde4b6085a8ce1f3
      base_sha: 32e0f6fd3bf2bbf1fdf9c807b926bc57f197765d
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: M4-CP-SCALE-TB12-R4-EXEC closeout
      retention_days: 7
    secrets: inherit
