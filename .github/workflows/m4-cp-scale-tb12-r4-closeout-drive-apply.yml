name: M4 CP SCALE TB12 R4 Closeout Drive Apply

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/tb12-r4-closeout-drive-apply.txt

permissions:
  actions: read
  contents: write
  id-token: write
  issues: write
  pull-requests: write

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/m4-cp-scale-tb12-r4-closeout-drive-apply.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: tb12-r4-closeout-drive-apply
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  apply:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1hXXBjMD_vsnEa50Ne5ZA3kVbyMtVF7fL
      patch_sha256: e64b751141d079ff4c8e58eed0566812da949416357dd02eaaecfee9db50e0cb
      base_sha: e10ce9004b0fb69fae2827eaff4b10e22dcf90ee
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: M4-CP-SCALE-TB12-R4-EXEC closeout
      retention_days: 7
    secrets: inherit
