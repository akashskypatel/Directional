name: M5 CP3 CB4 Compile

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m5-cp3-cb4-compile-20260921.txt

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: m5-cp3-cb4-compile
  cancel-in-progress: false

jobs:
  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m5-cp3-cb4-compile
      commit_run_file: false
      trim_stale_comments: false
    secrets: inherit

  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/m5-cp3-cb4-compile.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  compile:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-compile-reusable.yml
    with:
      source_sha: 6dd0e5179686a4ea2ca4aacda0577855948864df
      artifact_prefix: m5-cp3-cb4
    secrets: inherit
