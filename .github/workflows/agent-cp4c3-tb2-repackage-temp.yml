name: Agent CP4c3 TB2 Fixture Package Regeneration

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/cp4c3-tb2-repackage/run.txt

permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: agent-cp4c3-tb2-repackage-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate_caller:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/agent-cp4c3-tb2-repackage-temp.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: cp4c3-tb2-repackage
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  repackage:
    needs: validate_caller
    if: ${{ needs.validate_caller.outputs.valid == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Initialize diagnostic log
        shell: bash
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/cp4c3-tb2-repackage.log"
          : > "$log"
          {
            echo "workflow=${GITHUB_WORKFLOW}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "event_sha=${GITHUB_SHA}"
            echo "source_package_artifact=9742715856"
            echo "semantic_source=005512f20ed56edc793f4d6505f3d2b4c2999c71"
            echo "runtimeExecution=false"
            echo "started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } | tee -a "$log"

      - name: Regenerate portable fixture package from immutable package 69
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_PACKAGE69_SHA256: 2accc6d7cbbd48531919518ceb93a9d8f837b1c5683769a88ef915e4f092efc5
        shell: bash
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/cp4c3-tb2-repackage.log"
          exec > >(tee -a "$log") 2>&1
          in_zip="${RUNNER_TEMP}/package69.zip"
          in_dir="${RUNNER_TEMP}/package69"
          src_dir="${RUNNER_TEMP}/package69-source"
          out="${RUNNER_TEMP}/package70"
          rm -rf "$in_dir" "$src_dir" "$out"
          mkdir -p "$in_dir" "$src_dir" "$out"

          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/9742715856/zip" > "$in_zip"
          echo "package69_sha256=$(sha256sum "$in_zip" | awk '{print $1}')"
          echo "${EXPECTED_PACKAGE69_SHA256}  ${in_zip}" | sha256sum -c -
          unzip -q "$in_zip" -d "$in_dir"
          (cd "$in_dir" && sha256sum -c SHA256SUMS)
          test "$(cat "$in_dir/metadata/source-commit.txt")" = "005512f20ed56edc793f4d6505f3d2b4c2999c71"
          grep -Fx 'runtimeExecution=false' "$in_dir/metadata/command-boundary.txt"
          grep -Fx 'exactArithmeticBackend=GMP' "$in_dir/metadata/command-boundary.txt"

          sha256sum "$in_dir"/bin/* | sed "s#${in_dir}/##" > "${RUNNER_TEMP}/binaries-before.sha256"
          cp -a "$in_dir"/. "$out"/
          rm -f "$out/SHA256SUMS"

          source_archive="$(find "$in_dir/source" -maxdepth 1 -type f -name 'source-*.tar.gz' -print -quit)"
          test -n "$source_archive"
          tar -xzf "$source_archive" -C "$src_dir"
          test -f "$src_dir/benchmarks/fixtures/milestone_g_manifest.json"
          mkdir -p "$out/test-data/benchmarks"
          cp -a "$src_dir/benchmarks/fixtures" "$out/test-data/benchmarks/"
          test -f "$out/test-data/benchmarks/fixtures/milestone_g_manifest.json"

          cat >> "$out/metadata/command-boundary.txt" <<EOF
          regeneratedPackage=true
          regenerationKind=orchestration-fixture-packaging-only
          parentPackageArtifact=9742715856
          parentPackageSha256=${EXPECTED_PACKAGE69_SHA256}
          fixturePayloadPackaged=true
          fixturePayloadSource=embedded-source-archive
          semanticBinariesUnchanged=true
          runtimeExecution=false
          EOF

          sha256sum "$out"/bin/* | sed "s#${out}/##" > "${RUNNER_TEMP}/binaries-after.sha256"
          diff -u "${RUNNER_TEMP}/binaries-before.sha256" "${RUNNER_TEMP}/binaries-after.sha256"
          (cd "$out" && find . -type f ! -name SHA256SUMS -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > SHA256SUMS)
          (cd "$out" && sha256sum -c SHA256SUMS)
          test "$(grep -c 'SHA256SUMS' "$out/SHA256SUMS" || true)" -eq 0
          echo "package70_file_count=$(find "$out" -type f | wc -l | tr -d ' ')"
          echo "package70_manifest_entries=$(wc -l < "$out/SHA256SUMS" | tr -d ' ')"
          echo "portable_fixture_root=$out/test-data"
          echo "semantic_binaries_unchanged=pass"

      - name: Upload regenerated package 70
        uses: actions/upload-artifact@v4
        with:
          name: m3-cp4c3-tb2-package70-${{ github.run_id }}
          path: ${{ runner.temp }}/package70
          if-no-files-found: error
          retention-days: 7

      - name: Record final status
        if: always()
        shell: bash
        run: |
          set +e
          log="${RUNNER_TEMP}/cp4c3-tb2-repackage.log"
          {
            echo "final_job_status=${{ job.status }}"
            echo "runtimeExecution=false"
            echo "finished_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } | tee -a "$log"

      - name: Upload diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-cp4c3-tb2-package70-log-${{ github.run_id }}
          path: ${{ runner.temp }}/cp4c3-tb2-repackage.log
          if-no-files-found: error
          retention-days: 7
