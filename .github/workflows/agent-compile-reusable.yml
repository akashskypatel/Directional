name: Agent Reusable Compile

on:
  workflow_call:
    inputs:
      source_sha:
        required: true
        type: string
      targets:
        required: false
        type: string
        default: directional_core directional_pipeline directional_surface_cell_authority_kernel_tests directional_surface_cell_producer_tests directional_surface_cell_completion_tests directional_surface_cell_validation_tests directional_compiled_api_tests directional_benchmarks
      artifact_prefix:
        required: false
        type: string
        default: agent-compile
      cache_epoch:
        required: false
        type: string
        default: v1

jobs:
  compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CCACHE_MAXSIZE: 256M
      CCACHE_COMPRESS: "true"
      CCACHE_NOHASHDIR: "true"

    steps:
      - name: Initialize persistent activity log
        shell: bash
        run: |
          set -euo pipefail
          : > "$RUNNER_TEMP/activity.log"
          printf '%s\n' \
            "workflow=$GITHUB_WORKFLOW" \
            "run_id=$GITHUB_RUN_ID" \
            "event=$GITHUB_EVENT_NAME" \
            "ref=$GITHUB_REF" \
            "requested_source_sha=${{ inputs.source_sha }}" \
            "targets=${{ inputs.targets }}" \
            'turnBoundary=Code+Build-only' \
            'runtimeExecution=false' | tee -a "$RUNNER_TEMP/activity.log"

      - name: Checkout exact source and shallow submodules
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 1
          submodules: recursive

      - name: Verify source and configure ccache
        id: toolchain
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee -a "$RUNNER_TEMP/activity.log") 2>&1
          test "$(git rev-parse HEAD)" = "${{ inputs.source_sha }}"
          command -v ccache >/dev/null 2>&1 || {
            sudo apt-get update
            sudo apt-get install -y ccache
          }
          cmake --version
          ninja --version
          c++ --version
          ccache --version
          compiler_version="$(c++ -dumpfullversion -dumpversion)"
          cache_prefix="directional-ccache-${RUNNER_OS}-gcc-${compiler_version}-release-${{ inputs.cache_epoch }}-"
          legacy_prefix="m1-ra-${RUNNER_OS}-gcc-${compiler_version}-release-ccache-v3-"
          echo "cache_prefix=$cache_prefix" >> "$GITHUB_OUTPUT"
          echo "legacy_prefix=$legacy_prefix" >> "$GITHUB_OUTPUT"
          echo "BUILD_DIR=$RUNNER_TEMP/directional-build" >> "$GITHUB_ENV"
          echo "CCACHE_DIR=$RUNNER_TEMP/directional-ccache" >> "$GITHUB_ENV"
          echo "CCACHE_BASEDIR=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/directional-ccache"
          CCACHE_DIR="$RUNNER_TEMP/directional-ccache" ccache --set-config=max_size="$CCACHE_MAXSIZE"
          CCACHE_DIR="$RUNNER_TEMP/directional-ccache" ccache --set-config=compression=true
          CCACHE_DIR="$RUNNER_TEMP/directional-ccache" ccache --zero-stats
          git status --porcelain=v1 | tee "$RUNNER_TEMP/source-status-preconfigure.txt"
          test ! -s "$RUNNER_TEMP/source-status-preconfigure.txt"

      - name: Restore compiler cache
        id: cache_restore
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/directional-ccache
          key: ${{ steps.toolchain.outputs.cache_prefix }}${{ github.run_id }}
          restore-keys: |
            ${{ steps.toolchain.outputs.cache_prefix }}
            ${{ steps.toolchain.outputs.legacy_prefix }}

      - name: Record cache restore
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "cache_key=${{ steps.toolchain.outputs.cache_prefix }}${{ github.run_id }}"
            echo "cache_hit=${{ steps.cache_restore.outputs.cache-hit }}"
            echo "cache_max_size=$CCACHE_MAXSIZE"
          } | tee -a "$RUNNER_TEMP/activity.log" "$RUNNER_TEMP/cache-restore.txt"
          ccache --set-config=max_size="$CCACHE_MAXSIZE"
          ccache --set-config=compression=true
          ccache --zero-stats

      - name: Configure Release static PRE_TEST out of tree
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee -a "$RUNNER_TEMP/activity.log") 2>&1
          git status --porcelain=v1 | tee "$RUNNER_TEMP/source-status-before-configure.txt"
          test ! -s "$RUNNER_TEMP/source-status-before-configure.txt"
          rm -rf "$BUILD_DIR"
          cmake -S . -B "$BUILD_DIR" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DBUILD_SHARED_LIBS=OFF \
            -DDIRECTIONAL_BUILD_CLI=OFF \
            -DDIRECTIONAL_BUILD_GUI=OFF \
            -DDIRECTIONAL_BUILD_TESTS=ON \
            -DDIRECTIONAL_BUILD_BENCHMARKS=ON \
            -DDIRECTIONAL_BUILD_HISTORICAL_TESTS=OFF \
            -DDIRECTIONAL_BUILD_LEGACY_INTEGRATION_TESTS=OFF \
            -DDIRECTIONAL_BUILD_OPTIONAL_GUIDANCE_TESTS=OFF \
            -DDIRECTIONAL_ENABLE_GMP=OFF \
            -DDIRECTIONAL_ENABLE_PARDISO=OFF \
            -DDIRECTIONAL_ENABLE_SUITESPARSE=OFF \
            -DDIRECTIONAL_ENABLE_CUDSS=OFF \
            -DCMAKE_GTEST_DISCOVER_TESTS_DISCOVERY_MODE=PRE_TEST \
            2>&1 | tee "$RUNNER_TEMP/configure.log"
          git status --porcelain=v1 | tee "$RUNNER_TEMP/source-status-after-configure.txt"
          test ! -s "$RUNNER_TEMP/source-status-after-configure.txt"

      - name: Compile and link approved targets only
        id: build
        shell: bash
        run: |
          set -uo pipefail
          exec > >(tee -a "$RUNNER_TEMP/activity.log") 2>&1
          read -r -a TARGETS <<< "${{ inputs.targets }}"
          set +e
          cmake --build "$BUILD_DIR" --target "${TARGETS[@]}" -- -j2 2>&1 | tee "$RUNNER_TEMP/build.log"
          rc=${PIPESTATUS[0]}
          set -e
          echo "$rc" > "$RUNNER_TEMP/build-exit-code"
          echo "compile_exit=$rc" >> "$GITHUB_OUTPUT"
          echo "build_exit=$rc"
          git status --porcelain=v1 | tee "$RUNNER_TEMP/source-status-after-build.txt"
          ccache --show-stats | tee "$RUNNER_TEMP/ccache-stats.txt"
          echo 'runtimeExecution=false'
          echo 'No generated Directional binary, test, benchmark, discovery command, ctest, CLI, fuzzer, help/version command, or custom input was executed.'
          exit 0

      - name: Save compiler cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/directional-ccache
          key: ${{ steps.toolchain.outputs.cache_prefix }}${{ github.run_id }}

      - name: Prune stale compiler caches
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          CACHE_PREFIX: ${{ steps.toolchain.outputs.cache_prefix }}
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/cache-prune.txt"
          : > "$OUT"
          gh api --method GET "repos/$GITHUB_REPOSITORY/actions/caches" -f ref="$GITHUB_REF" -f per_page=100 > "$RUNNER_TEMP/caches.json"
          current_ids="$(jq -r --arg p "$CACHE_PREFIX" '[.actions_caches[] | select(.key | startswith($p))] | sort_by(.created_at) | reverse | .[2:][]?.id' "$RUNNER_TEMP/caches.json")"
          legacy_ids="$(jq -r '.actions_caches[] | select(.key | startswith("m1-ra-")) | .id' "$RUNNER_TEMP/caches.json")"
          for cache_id in $legacy_ids $current_ids; do
            test -n "$cache_id" || continue
            cache_key="$(jq -r --argjson id "$cache_id" '.actions_caches[] | select(.id == $id) | .key' "$RUNNER_TEMP/caches.json")"
            echo "prune_cache_id=$cache_id key=$cache_key" | tee -a "$OUT" "$RUNNER_TEMP/activity.log"
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/caches/$cache_id"
          done
          echo "cache_keep=2 prefix=$CACHE_PREFIX pruning=complete" | tee -a "$OUT" "$RUNNER_TEMP/activity.log"

      - name: Package compile evidence
        if: steps.build.outputs.compile_exit == '0'
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee -a "$RUNNER_TEMP/activity.log") 2>&1
          SOURCE_SHA="$(git rev-parse HEAD)"
          test "$SOURCE_SHA" = "${{ inputs.source_sha }}"
          git status --porcelain=v1 | tee "$RUNNER_TEMP/source-status-final.txt"
          test ! -s "$RUNNER_TEMP/source-status-final.txt"
          OUT="$RUNNER_TEMP/result"
          rm -rf "$OUT"
          mkdir -p "$OUT/metadata" "$OUT/source" "$OUT/bin" "$OUT/lib"
          echo "$SOURCE_SHA" > "$OUT/metadata/source-commit.txt"
          git submodule status --recursive > "$OUT/metadata/dependency-revisions.txt"
          git archive --format=tar.gz -o "$OUT/source/source-$SOURCE_SHA.tar.gz" "$SOURCE_SHA"
          cp "$RUNNER_TEMP"/source-status-*.txt "$OUT/metadata/"
          cp "$RUNNER_TEMP/configure.log" "$OUT/metadata/configure.log"
          cp "$RUNNER_TEMP/build.log" "$OUT/metadata/build.log"
          cp "$RUNNER_TEMP/build-exit-code" "$OUT/metadata/build-exit-code.txt"
          cp "$RUNNER_TEMP/ccache-stats.txt" "$OUT/metadata/ccache-stats.txt"
          cp "$RUNNER_TEMP/cache-restore.txt" "$OUT/metadata/cache-restore.txt"
          cp "$RUNNER_TEMP/cache-prune.txt" "$OUT/metadata/cache-prune.txt"
          cp "$BUILD_DIR/CMakeCache.txt" "$OUT/metadata/CMakeCache.txt"
          printf '%s\n' \
            'runtimeExecution=false' \
            'turnBoundary=Code+Build-only' \
            'cachePolicy=compiler-cache-only-bounded-lineage' \
            'cacheMaxSize=256M' \
            "cachePrefix=${{ steps.toolchain.outputs.cache_prefix }}" \
            'cacheKeep=2' \
            'semanticContracts=compiled-not-executed' \
            'manifestExcludesSelf=true' \
            'buildLocation=runner-temp-out-of-tree' > "$OUT/metadata/command-boundary.txt"
          echo "${{ inputs.targets }}" | tr ' ' '\n' > "$OUT/metadata/compiled-targets.txt"
          copy_if_exists() { test ! -f "$1" || cp "$1" "$2/"; }
          copy_if_exists "$BUILD_DIR/directional_surface_cell_authority_kernel_tests" "$OUT/bin"
          copy_if_exists "$BUILD_DIR/directional_surface_cell_producer_tests" "$OUT/bin"
          copy_if_exists "$BUILD_DIR/directional_surface_cell_completion_tests" "$OUT/bin"
          copy_if_exists "$BUILD_DIR/directional_surface_cell_validation_tests" "$OUT/bin"
          copy_if_exists "$BUILD_DIR/directional_compiled_api_tests" "$OUT/bin"
          copy_if_exists "$BUILD_DIR/directional_benchmarks" "$OUT/bin"
          copy_if_exists "$BUILD_DIR/libdirectional_core.a" "$OUT/lib"
          copy_if_exists "$BUILD_DIR/libdirectional_pipeline.a" "$OUT/lib"
          (cd "$OUT" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          (cd "$OUT" && sha256sum -c SHA256SUMS)
          test "$(grep -c 'SHA256SUMS' "$OUT/SHA256SUMS" || true)" -eq 0
          echo 'manifest_self_verification=pass'
          echo 'source_status_clean=pass'

      - name: Upload compile result
        if: steps.build.outputs.compile_exit == '0'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact_prefix }}-result-${{ github.run_id }}
          path: ${{ runner.temp }}/result
          if-no-files-found: error
          retention-days: 7

      - name: Upload persistent activity log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact_prefix }}-log-${{ github.run_id }}
          path: ${{ runner.temp }}/activity.log
          if-no-files-found: error
          retention-days: 7

      - name: Propagate compile status
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f "$RUNNER_TEMP/build-exit-code" || { echo 'compile_status=missing'; exit 1; }
          rc="$(cat "$RUNNER_TEMP/build-exit-code")"
          echo "compile_status=$rc" | tee -a "$RUNNER_TEMP/activity.log"
          exit "$rc"
