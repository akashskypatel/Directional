name: Agent Reusable Compile

on:
  workflow_call:
    inputs:
      source_sha:
        required: true
        type: string
      targets:
        required: false
        type: string
        default: directional_core directional_pipeline
      artifact_prefix:
        required: false
        type: string
        default: agent-compile
      cache_epoch:
        required: false
        type: string
        default: v1

jobs:
  compile:
    runs-on: ubuntu-24.04
    steps:
      - name: Validate reusable invocation
        run: |
          echo "source_sha=${{ inputs.source_sha }}"
          echo "targets=${{ inputs.targets }}"
          echo "artifact_prefix=${{ inputs.artifact_prefix }}"
          echo "cache_epoch=${{ inputs.cache_epoch }}"
