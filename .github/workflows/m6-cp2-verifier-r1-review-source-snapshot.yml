name: M6 CP2 Verifier R1 Review Source Snapshot

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m6-cp2-verifier-r1-review-snapshot/**

permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: write

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/m6-cp2-verifier-r1-review-source-snapshot.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  snapshot:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-source-snapshot.yml
    with:
      source_ref: 9c8478aec40bf07144ca7372c2aa58293cd42f5e
      artifact_prefix: m6-cp2-verifier-r1-review-source
    secrets: inherit
