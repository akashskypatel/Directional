name: Agent M1 R-A REV-18-21 Doc Closeout

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m1-ra-rev-18-21-doc-closeout.txt

permissions:
  contents: write

concurrency:
  group: agent-m1-ra-rev-18-21-doc-closeout-${{ github.ref }}
  cancel-in-progress: false

jobs:
  closeout:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Initialize persistent activity log
        shell: bash
        run: |
          set -euo pipefail
          : > "$RUNNER_TEMP/activity.log"
          printf '%s\n' \
            'task=R-A-REV-18 through R-A-REV-21 durable closeout' \
            "event_sha=$GITHUB_SHA" \
            "ref=$GITHUB_REF" \
            'controlPlaneOnly=true' \
            'runtimeExecution=false' | tee -a "$RUNNER_TEMP/activity.log"

      - name: Checkout exact trigger authority
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          submodules: false

      - name: Update durable status documents
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee -a "$RUNNER_TEMP/activity.log") 2>&1
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 - <<'PY'
          from pathlib import Path

          SOURCE = '0580c5c8d7e4b12a41eefb0197f3660a0c7a8fca'
          RESULT = '9153147035'
          RESULT_SHA = 'bbc07fad9a767dc77aff290c540659b4140aab414ddf1148dec1b637fc32af38'
          LOG = '9153147459'
          LOG_SHA = 'ad5984db04ab98a4bbcd058d58c83e1cdef2383890b8bcfab1c209e487b3889b'
          RUN = '31625763711'
          JOB = '94211611771'

          def replace_once(path, old, new):
              p = Path(path)
              body = p.read_text(encoding='utf-8')
              count = body.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one replacement target, found {count}: {old[:120]}')
              p.write_text(body.replace(old, new, 1), encoding='utf-8')

          # TODO: close only the bounded CB findings; overall R-A remains open.
          todo = Path('TODO.md')
          body = todo.read_text(encoding='utf-8')
          body = body.replace(
              '  - Current closure-review boundary: exact implementation/test source `1352f3d18eb3821ecda9d74ea5e439adb5bcb875` at branch authority `356a0bc2733af41e15fad056161e526865c147c5`.',
              f'  - Current partial Code + Build source: `{SOURCE}`; overall R-A remains open pending focused artifact-only runtime verification and the complete retained REV-01-through-REV-21 inventory.'
          )
          body = body.replace(
              '  - [ ] R-A-REV-18: publish one global aggregate source-authority product; validate every globally remapped lineage; rebuild/remove vertex identity caches and regenerate face cycles after remap.',
              f'  - [x] R-A-REV-18 Code + Build: global aggregate source authority, final global lineage validation, rebuilt vertex authority/stitch identities, and regenerated face cycles compile at `{SOURCE}`; runtime verification remains pending.'
          )
          body = body.replace(
              '  - [ ] R-A-REV-19: make aggregate semantic publication transactional; clear every context payload/flag on rejection; validate the actual final merged product; expand REV-16 and second-component-failure counterfactuals.',
              f'  - [x] R-A-REV-19 Code + Build: disconnected aggregation stages semantic publication transactionally, rolls rejected output back to zero consumable context, and validates the actual merged product against global source authority at `{SOURCE}`; runtime verification remains pending.'
          )
          body = body.replace(
              '  - [x] R-A-REV-20 bounded remediation: the named SurfaceCells optimizer/verifier raw mirrors and point-cloud/legacy feature-interval/basic-validator compatibility paths are removed and missing-authority contracts compile at `1352f3d18eb3821ecda9d74ea5e439adb5bcb875`; retain as progress, not independent R-A acceptance.',
              f'  - [x] R-A-REV-20 Code + Build: the named SurfaceCells optimizer/verifier raw mirrors and point-cloud/legacy feature-interval/basic-validator compatibility paths remain absent under the REV-18-through-REV-21 static audit at `{SOURCE}`; retain as progress, not independent R-A acceptance.'
          )
          body = body.replace(
              '  - [ ] R-A-REV-21: bind every affected `SourceTopologyRegions` product to the exact supplied source-face topology; reject a foreign same-face-count authority before completion, optimization, validation, or publication; compile consistent-permutation positive and wrong-topology zero-publication negatives.',
              f'  - [x] R-A-REV-21 Code + Build: affected source-authority consumers bind `SourceTopologyRegions` to the exact supplied source-face topology and same-extent foreign authority fails closed; positive/negative contract sources compile at `{SOURCE}`; runtime verification remains pending.'
          )
          needle = '  - [ ] Re-run the complete R-A closure inventory and mark R-A complete only when every retained REV-01-through-REV-21 gate is statically clean.'
          if needle not in body:
              raise SystemExit('TODO: complete R-A inventory task missing')
          body = body.replace(
              needle,
              f'  - [ ] Run the mandatory focused artifact-only Test + Benchmark cadence gate on exact partial package `{RESULT}` / `{LOG}` from source `{SOURCE}`; no rebuild.\n' + needle,
              1
          )
          todo.write_text(body, encoding='utf-8')

          # Active plan: prepend the completed partial CB checkpoint while preserving review history.
          plan = Path('.agents/Directional/Architecture_M1_Single_Authority_Cutover_Code_Build_Plan.md')
          body = plan.read_text(encoding='utf-8')
          old_status = '**Current status:** independent closure review rejects overall R-A at branch boundary `356a0bc2733af41e15fad056161e526865c147c5`; the bounded REV-17/REV-20 remediation is retained as compile-valid progress, REV-18/REV-19 remain unimplemented, and R-A-REV-21 is open before the complete R-A inventory, R-B through R-G, and one fresh full package'
          new_status = f'**Current status:** overall R-A remains open; R-A-REV-18 through R-A-REV-21 are Code + Build complete / compile-valid at `{SOURCE}`, with a focused artifact-only runtime cadence gate next before the complete R-A inventory, R-B through R-G, and one fresh full package'
          if old_status not in body:
              raise SystemExit('plan: current status target missing')
          body = body.replace(old_status, new_status, 1)
          body = body.replace('**Latest review-remediation implementation/compile source:** `1352f3d18eb3821ecda9d74ea5e439adb5bcb875`', f'**Latest review-remediation implementation/compile source:** `{SOURCE}`', 1)
          marker = '## 0B. 2026-08-12 independent R-A closure review after REV-17/REV-20 partial remediation — rejected\n'
          checkpoint = f'''## 0C. 2026-08-12 R-A-REV-18 through R-A-REV-21 partial Code + Build checkpoint\n\nExact compile-valid source: `{SOURCE}`. Overall R-A remains open; this checkpoint is implementation/build evidence, not independent or runtime acceptance.\n\n- **REV-18:** disconnected aggregation constructs and publishes one checked global `SourceTopologyRegions`, remaps final lineage through that owner, rebuilds global stitch/authoritative identities, and regenerates canonical face-cycle hashes after remap.\n- **REV-19:** aggregate semantic/context publication is staged transactionally; rejected multi-component output exposes no consumable aggregate context; the actual final merged product is source-authoritatively validated against the global owner before commit.\n- **REV-20:** the previously removed raw optimizer/verifier mirrors and legacy compatibility branches remain absent under the widened static inventory.\n- **REV-21:** affected source-authority boundaries use exact source-face topology binding rather than face-count completeness; same-extent foreign topology fails closed and consistent topology bindings compile.\n- Static source audit closed REV-18-through-REV-21 at the Code + Build source/contract boundary. Contract sources were compiled, not executed.\n- Compile-only run/job `{RUN} / {JOB}` completed Release/static/Ninja/PRE_TEST **118/118** with build exit `0`. Result artifact `{RESULT}`, SHA-256 `{RESULT_SHA}`; log artifact `{LOG}`, SHA-256 `{LOG_SHA}`.\n- Package verification: **26** regular files including `SHA256SUMS`, self-excluding manifest **25/25**, five empty source-status snapshots, exact source `{SOURCE}`, `semanticContracts=compiled-not-executed`, and `runtimeExecution=false`.\n- Reusable compiler cache restored compatible key `directional-ccache-Linux-gcc-13.3.0-release-v1-31625171464`; ccache recorded **89/108 hits (82.41%)**. Final branch cache inventory retains two current compatible caches and zero legacy `m1-ra-*` caches.\n- The first compile attempt exposed one real source error (`SurfaceCellRailKind::Feature` instead of `HardFeature`); commit `c936d56d3ad72afbc806ab7bcaf1b10ef38bae10` corrected only that enum reference, without a compatibility fallback. No generated runtime executed in either compile attempt.\n\nThe mandatory next cadence is focused artifact-only Test + Benchmark verification of this exact partial package with no rebuild. The retained full-M1 artifact-only acceptance plan remains dormant until a fresh complete R-A-through-R-G package exists.\n\n'''
          if marker not in body:
              raise SystemExit('plan: 0B marker missing')
          body = body.replace(marker, checkpoint + marker, 1)
          body = body.replace('**Status:** open; intentionally not implemented in the REV-17/REV-20 partial Code + Build turn.', f'**Code + Build status:** complete / compile-valid at `{SOURCE}`; focused artifact-only runtime verification is pending.', 1)
          body = body.replace('**Status:** open; intentionally not implemented in the REV-17/REV-20 partial Code + Build turn.', f'**Code + Build status:** complete / compile-valid at `{SOURCE}`; focused artifact-only runtime verification is pending.', 1)
          body = body.replace('**Current review status:** bounded compatibility-path removal is complete / compile-valid at `1352f3d18eb3821ecda9d74ea5e439adb5bcb875` and retained as progress; independent closure is deferred because the strict completeness predicate remains extent-only under R-A-REV-21.', f'**Code + Build status:** complete / compile-valid at `{SOURCE}`; the named compatibility paths remain absent and REV-21 now enforces exact source-topology binding. Independent R-A acceptance remains pending.', 1)
          body = body.replace('**Status:** open; discovered by the complete R-A inventory of source `1352f3d18eb3821ecda9d74ea5e439adb5bcb875`.', f'**Code + Build status:** complete / compile-valid at `{SOURCE}`; focused artifact-only runtime verification is pending.', 1)
          old_sequence = '''1. Implement REV-18, REV-19, and REV-21 without restoring a raw mirror, compatibility identity, fixture exception, proxy oracle, or extent-only authority bypass.\n2. Rerun the complete R-A closure inventory. R-A may close only if every retained REV-01-through-REV-21 gate is statically clean and all required semantic contract sources compile.\n3. Complete R-B through R-G in the same vertical cutover.\n4. Produce one fresh full R-A-through-R-G Release/static/Ninja/PRE_TEST package with clean provenance and a verified self-excluding manifest.\n5. Execute no generated Directional binary, discovery, test, benchmark, `ctest`, CLI, fuzzer, or custom input in the Code + Build turn.'''
          new_sequence = f'''1. Preserve exact partial Code + Build source `{SOURCE}` and artifacts `{RESULT} / {LOG}`; run the focused artifact-only runtime cadence gate with no rebuild.\n2. If that exact package passes, return to Code + Build and rerun the complete retained REV-01-through-REV-21 R-A closure inventory. R-A may close only if every gate is statically clean and the required semantic contracts have passed their cadence evidence.\n3. Complete R-B through R-G in the same vertical cutover under the active plan.\n4. Produce one fresh full R-A-through-R-G Release/static/Ninja/PRE_TEST package with clean provenance and a verified self-excluding manifest.\n5. Execute no generated Directional binary, discovery, test, benchmark, `ctest`, CLI, fuzzer, or custom input in any Code + Build turn.'''
          if old_sequence not in body:
              raise SystemExit('plan: required sequence target missing')
          body = body.replace(old_sequence, new_sequence, 1)
          plan.write_text(body, encoding='utf-8')

          # Handoff: replace next action and live closure state, not durable policy.
          handoff = Path('.agents/Directional/Future_Chat_Session_Handoff.md')
          body = handoff.read_text(encoding='utf-8')
          start = body.index('## Mandatory next turn\n')
          end = body.index('\n## Current authority\n', start)
          next_turn = f'''## Mandatory next turn\n\nRun a **targeted artifact-only Test + Benchmark verification of the exact R-A-REV-18-through-R-A-REV-21 partial Code + Build package**. This is the mandatory cadence gate before another Code + Build slice; it is not the retained full-M1 acceptance plan.\n\nRepository: akashskypatel/Directional  \nBranch: agent/surface_cell_quad/p5-recover-bridge-healing  \nPR: #8 remains open, draft, and unmerged  \nExact compile-valid source: `{SOURCE}`  \nCompile run/job: `{RUN} / {JOB}`  \nResult artifact: `{RESULT}`, SHA-256 `{RESULT_SHA}`  \nLog artifact: `{LOG}`, SHA-256 `{LOG_SHA}`\n\nThe next turn must:\n\n1. download and verify the exact result artifact without rebuilding or changing implementation/test/build source;\n2. verify exact source `{SOURCE}`, the self-excluding **25/25** manifest, command boundary, dependency revisions, and all five empty source-status snapshots before executing any packaged binary;\n3. execute focused semantic contracts for REV-18 global aggregate ownership/cache rebuild, REV-19 transactional rollback/final merged oracle, REV-20 strict compatibility-path absence/missing authority, and REV-21 same-extent foreign-topology rejection plus consistent-topology positives;\n4. include adjacent retained completion/optimizer/pipeline authority contracts needed to detect regressions from these changes, following `tests/TESTING_STRATEGY.md` and the unit-testing module;\n5. classify every failure from runtime evidence; do not rebuild, weaken validation, restore raw mirrors/aliases/fallbacks, or alter fixtures to synthesize green output;\n6. if the exact package passes, return to the M1 Code + Build plan to rerun the complete retained R-A inventory before any R-A completion claim.\n\nDo not activate the retained full `Architecture_M1_Single_Authority_Cutover_Artifact_Only_Test_Benchmark_Plan.md`; it remains dormant until one fresh full R-A-through-R-G package exists. Do not implement M3, M4, M7, or Pipeline A during this verification.\n'''
          body = body[:start] + next_turn + body[end:]
          status_start = body.index('### R-A closure status\n')
          status_end = body.index('\n## Standing product and regression state\n', status_start)
          status = f'''### R-A closure status\n\nIndependent review decision/planning commit remains `49b94da971ff544ac77f9dd2fa394791a1b67435`; that review rejected source `1352f3d18eb3821ecda9d74ea5e439adb5bcb875`. Latest partial Code + Build source is `{SOURCE}`.\n\n- Overall R-A is **not complete** and has not been independently re-accepted.\n- R-A-REV-17 remains retained compile-valid owner-certificate/canonical-cache progress within the newer source.\n- R-A-REV-18 is **Code + Build complete / compile-valid**: global aggregate authority is published and post-remap identities/face cycles are rebuilt.\n- R-A-REV-19 is **Code + Build complete / compile-valid**: aggregate publication is staged transactionally and the actual final merged product receives source-authoritative validation.\n- R-A-REV-20 remains **Code + Build complete / compile-valid**: the named raw/legacy optimizer/verifier compatibility paths remain absent.\n- R-A-REV-21 is **Code + Build complete / compile-valid**: affected boundaries require exact source-face topology binding rather than same-extent completeness.\n- REV-14-through-REV-16 remain historical bounded progress until the complete R-A inventory and later acceptance close the combined gate.\n\nPartial Code + Build evidence: run/job `{RUN} / {JOB}`, Release/static/Ninja/PRE_TEST **118/118**, result/log artifacts `{RESULT} / {LOG}`, self-excluding manifest **25/25**, five empty source-status snapshots, and `runtimeExecution=false`. This is not an R-A or M1 acceptance candidate.\n\nThe reusable compile workflow is mandatory for future builds. Final cache inventory is bounded to two current `directional-ccache-*` entries and zero legacy `m1-ra-*` entries; the successful compile recorded **82.41%** ccache hits.\n\nM1l `bd140cff4572412e6f4ecd70a6ce0fe85310932c` remains immutable runtime authority. No runtime result or regression total changed; totals remain **34 events / 14 categories / 20 recurrences**.\n'''
          body = body[:status_start] + status + body[status_end:]
          handoff.write_text(body, encoding='utf-8')

          # Changelog: prepend durable implementation/build and workflow/cache history.
          changelog = Path('.agents/Directional/CHANGELOG.md')
          body = changelog.read_text(encoding='utf-8')
          marker = '## [Unreleased]\n'
          entry = f'''## [Unreleased]\n\n### Added — durable reusable compile/cache workflow\n\n- Added `.github/workflows/agent-compile-reusable.yml` as the mandatory implementation for every build/compile task. It owns exact-source checkout, Release/static/Ninja/PRE_TEST configuration, compile-only boundaries, ccache restore/save/prune, evidence packaging, and compile-status propagation.\n- Rewrote `GitHub_Workflow_Policy.md` to require that reusable workflow and condensed the control-plane policy. Compiler cache compatibility is keyed by OS/compiler/build mode/explicit epoch, capped at 256 MiB, bounded to two current entries, and never caches opaque build trees or immutable result/source artifacts.\n- Migrated cache state from the stale `m1-ra-*` lineage shown at turn start. Final inventory contains exactly two current compatible `directional-ccache-*` entries and no legacy `m1-ra-*` entries.\n\n### Fixed — R-A-REV-18 through R-A-REV-21 partial remediation\n\n- Closed REV-18 at the Code + Build boundary: disconnected aggregation constructs one checked global `SourceTopologyRegions`, remaps final lineage through it, and rebuilds stitch/authoritative vertex identity plus canonical face-cycle hashes after remap.\n- Closed REV-19 at the Code + Build boundary: aggregate semantic/context publication is staged until all components/remaps/final merged validation succeed; rejection exposes no consumable aggregate context; the real merged product is source-authoritatively validated before publication.\n- Revalidated REV-20 under the widened static inventory: displaced optimizer/verifier raw authority mirrors and legacy point-cloud/feature-interval/basic-validator branches remain absent.\n- Closed REV-21 at the Code + Build boundary: `SourceTopologyRegions::matches_source_faces` binds affected source-authority consumers to exact checked source-face topology and rejects same-extent foreign topology before semantic use.\n- Added compile-contract source for global-owner/cache rebuild, stale-cache rejection, second-component rollback, final merged provenance tamper, same-extent foreign topology, optimizer fail-closed authority, and stitch-publication rejection.\n\n### Validation — R-A-REV-18 through R-A-REV-21\n\n- Exact compile-valid partial source: `{SOURCE}`. Product/test remediation was committed as `48acbda7d8b06c6a0009fa485d6859aed3a4ea50` across 14 files; compile follow-up `c936d56d3ad72afbc806ab7bcaf1b10ef38bae10` corrected one stale rail-kind enumerator only.\n- Static source audit reported `R-A REV-18-21 source audit: closed at static/compile-contract source boundary`; REV-20 raw mirrors remained absent and REV-21 extent-only affected consumers were removed.\n- Compile-only run/job `{RUN} / {JOB}` completed Release/static/Ninja/PRE_TEST **118/118**, build exit `0`. Result artifact `{RESULT}`, SHA-256 `{RESULT_SHA}`; log artifact `{LOG}`, SHA-256 `{LOG_SHA}`.\n- Independent artifact inspection verified exact source `{SOURCE}`, **26** regular files including `SHA256SUMS`, self-excluding manifest **25/25**, zero manifest self references, five empty source-status snapshots, `semanticContracts=compiled-not-executed`, and `runtimeExecution=false`.\n- Compatible ccache restore used prior key `directional-ccache-Linux-gcc-13.3.0-release-v1-31625171464`; final compile recorded **89/108 hits (82.41%)** and the reusable workflow pruned the lineage to the newest two entries.\n- No generated Directional binary, discovery, test, benchmark, `ctest`, CLI, fuzzer, help/version command, or custom input executed. M1l remains immutable runtime authority; this partial package is not an R-A or M1 acceptance candidate.\n\n### Operational notes — R-A-REV-18 through R-A-REV-21\n\n- Initial reusable compile run/job `31625171464 / 94209595688` exposed a genuine compile defect: aggregate authority rebuild referred to nonexistent `SurfaceCellRailKind::Feature`. The bounded correction changed it to `HardFeature` without adding an alias/fallback, then the final run above compiled successfully. The failed compile also executed no generated runtime and contributed reusable compiler entries to the bounded cache.\n\n'''
          if marker not in body:
              raise SystemExit('changelog: Unreleased marker missing')
          body = body.replace(marker, entry, 1)
          changelog.write_text(body, encoding='utf-8')
          PY

          git diff --check
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' \
            .agents/Directional/Architecture_M1_Single_Authority_Cutover_Code_Build_Plan.md \
            .agents/Directional/CHANGELOG.md \
            .agents/Directional/Future_Chat_Session_Handoff.md \
            TODO.md | sort)"
          printf 'changed_documents=\n%s\n' "$changed"
          test "$changed" = "$expected"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add TODO.md
          git add -f \
            .agents/Directional/Architecture_M1_Single_Authority_Cutover_Code_Build_Plan.md \
            .agents/Directional/CHANGELOG.md \
            .agents/Directional/Future_Chat_Session_Handoff.md
          git commit -m "docs: record REV-18 through REV-21 partial checkpoint"
          DOC_SHA="$(git rev-parse HEAD)"
          echo "doc_sha=$DOC_SHA"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          git status --porcelain=v1 | tee "$RUNNER_TEMP/source-status-final.txt"
          test ! -s "$RUNNER_TEMP/source-status-final.txt"
          echo 'runtimeExecution=false'

      - name: Upload persistent activity log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m1-ra-rev-18-21-doc-closeout-log-${{ github.run_id }}
          path: ${{ runner.temp }}/activity.log
          if-no-files-found: error
          retention-days: 7
