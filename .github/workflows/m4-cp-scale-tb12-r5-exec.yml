name: M4 CP SCALE TB12 R5 Artifact-Only Runtime

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m4-cp-scale-tb12-r5/execute.txt

permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: m4-cp-scale-tb12-r5-exec
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/m4-cp-scale-tb12-r5-exec.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m4-cp-scale-tb12-r5-exec
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  execute:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Initialize diagnostic log
        shell: bash
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/m4-cp-scale-tb12-r5-workflow.log"
          : > "$log"
          printf '%s\n' "workflow=$GITHUB_WORKFLOW" "run_id=$GITHUB_RUN_ID" "event=$GITHUB_EVENT_NAME" "event_sha=$GITHUB_SHA" "ref=$GITHUB_REF" 'runtimeBoundary=Test+Benchmark-artifact-only' "started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" | tee -a "$log"
      - name: Checkout exact orchestration source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          submodules: false
      - name: Execute immutable TB12 R5 harness
        id: harness
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_ARTIFACT_ID: '10532133889'
          CANDIDATE_PROVIDER_SHA256: '4793e0155349a7f6c1e1a7833f5474d468cae89fcdd40916ec3eca192ff09c3a'
          SEMANTIC_SOURCE_SHA: '079933f2ec31a9323218e73c7ae0d3ea1d11103c'
          SOURCE_ARCHIVE_SHA256: '2d08714f478e0ac93946b02b3f62ca16c099666b3bf3a6f5c40de9e98fb296ea'
          PACKAGE_MANIFEST_SHA256: '44fd665474f12d79b916eacb77df9dfc07cf7478503e82a8c1ac7f80c64da5bd'
          SELECTOR_SHA256: '41f4d559211375c11c8d1f8c9ccde2581db75819d9409366e8f2695b008b5114'
          PREFIX425_SHA256: 'e0e0f394faae536ac257ec5409653a34755a8afe0ca437562eb44c9895790e0b'
          GENUS_OBJ_SHA256: 'c6bacd981fb0559dc3e290ee1367b9e369f4657b189ce288ce732461d8caeab3'
          GENUS_RAWFIELD_SHA256: '7bd71837954ded74461a46d65761b953cbc186978639d41567ad4a4aac4af70e'
          GENUS_META_SHA256: '22600270cc11b7b421007e10a3861124c4238bc0e5353b2637a9c70005bf1b76'
        run: |
          set -uo pipefail
          log="${RUNNER_TEMP}/m4-cp-scale-tb12-r5-workflow.log"
          set +e
          bash .agents/Directional/turn-payloads/m4-cp-scale-tb12-r5-harness.sh > >(tee -a "$log") 2> >(tee -a "$log" >&2)
          rc=$?
          set -e
          echo "harness_exit=$rc" | tee -a "$log"
          echo "exit=$rc" >> "$GITHUB_OUTPUT"
          exit "$rc"
      - name: Upload TB12 R5 result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m4-cp-scale-tb12-r5-result-${{ github.run_id }}
          path: ${{ runner.temp }}/tb12-r5-result
          if-no-files-found: error
          retention-days: 14
      - name: Record final source status
        if: always()
        shell: bash
        run: |
          set +e
          log="${RUNNER_TEMP}/m4-cp-scale-tb12-r5-workflow.log"
          printf '%s\n' "final_job_status=${{ job.status }}" "harness_exit=${{ steps.harness.outputs.exit }}" "final_sha=$(git rev-parse HEAD 2>/dev/null || echo unavailable)" "finished_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" | tee -a "$log"
          git status --short 2>&1 | tee -a "$log" || true
      - name: Upload workflow diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m4-cp-scale-tb12-r5-log-${{ github.run_id }}
          path: ${{ runner.temp }}/m4-cp-scale-tb12-r5-workflow.log
          if-no-files-found: error
          retention-days: 14
