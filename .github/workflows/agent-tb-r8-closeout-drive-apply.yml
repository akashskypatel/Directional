name: Agent TB-R8 Closeout Drive Apply

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/google-drive/M3-CP4c-0-TB-R8-closeout.txt

permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

concurrency:
  group: agent-tb-r8-closeout-drive-apply-${{ github.ref }}
  cancel-in-progress: false

jobs:
  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m3-cp4c0-tb-r8-closeout-drive
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/agent-tb-r8-closeout-drive-apply.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  apply:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1E9_Pm9yQqv0xKy1M5op2zsuRv4-lUerm
      patch_sha256: 7f683e0bb1e923dca3725d282e4b8ce374c0d460583b443af1c95e3fb9b130dd
      base_sha: df7bb83249baf9a79f7316b026f368801b029b6a
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: "docs: close interrupted M3 CP4c-0 TB-R8"
    secrets: inherit
