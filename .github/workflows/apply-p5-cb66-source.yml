# Temporary source-transfer workflow. This file is created and removed directly
# through the GitHub connector; it never edits or deletes workflow files.
name: Apply P5 CB66 Source Patch

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - '.agents/Directional/p5-cb66-source-patch/APPLY_READY'

concurrency:
  group: apply-p5-cb66-source-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  apply-source:
    runs-on: ubuntu-24.04
    steps:
      - name: Record source transfer start
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          EVENT_SHA: ${{ github.sha }}
        shell: bash
        run: |
          gh api repos/${{ github.repository }}/issues/8/comments \
            -f body="P5-CB59 through P5-CB66 source transfer run ${RUN_ID} started for staging commit ${EVENT_SHA}. This run applies source and regression changes only; it executes no compiled binary, test, benchmark, custom mesh, help/list command, or discovery command."

      - name: Checkout exact working branch
        uses: actions/checkout@v4
        with:
          ref: agent/surface_cell_quad/p5-recover-bridge-healing
          fetch-depth: 1
          submodules: false

      - name: Assemble exact staged source patch
        shell: bash
        run: |
          set -euo pipefail
          encoded=.agents/Directional/p5-cb66-source-patch/p5-cb66.patch.gz.b64
          tr -d '\r\n' < "${encoded}" > /tmp/p5-cb66.patch.gz.b64
          echo "f40e6f7a43ac84aea00a9da3c10ac6954cecc73011bfb96ea88c5ef14573b879  /tmp/p5-cb66.patch.gz.b64" | sha256sum -c -
          base64 --decode /tmp/p5-cb66.patch.gz.b64 | gzip -dc > /tmp/p5-cb66.patch
          echo "9ac9833637c558da79daf52df676ec63793ef8ef17000b380156f8ad57a19ff9  /tmp/p5-cb66.patch" | sha256sum -c -
          test "$(wc -c < /tmp/p5-cb66.patch)" = "45388"

      - name: Verify and apply source patch
        shell: bash
        run: |
          set -euo pipefail
          git apply --check /tmp/p5-cb66.patch
          git apply /tmp/p5-cb66.patch
          git diff --check
          cat > /tmp/expected-files.txt <<'EOF'
          include/directional/geometry/PatchDescriptor.h
          include/directional/geometry/SurfaceCellFeasibilityRepair.h
          include/directional/pipeline/RemeshPipeline.h
          src/bench/DirectionalBenchmark.cpp
          src/geometry/PatchDescriptor.cpp
          src/geometry/SurfaceCellFeasibilityRepair.cpp
          src/geometry/SurfaceComplexSimplification.cpp
          src/pipeline/RemeshPipeline.cpp
          tests/MilestoneDClosureTests.cpp
          tests/MilestoneGP26Tests.cpp
          tests/MilestoneGP27Tests.cpp
          tests/PatchDescriptorMilestoneETests.cpp
          EOF
          sed -i 's/^          //' /tmp/expected-files.txt
          git diff --name-only | sort > /tmp/actual-files.txt
          sort -o /tmp/expected-files.txt /tmp/expected-files.txt
          diff -u /tmp/expected-files.txt /tmp/actual-files.txt

      - name: Commit exact source checkpoint
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "directional-agent"
          git config user.email "directional-agent@users.noreply.github.com"
          git add \
            include/directional/geometry/PatchDescriptor.h \
            include/directional/geometry/SurfaceCellFeasibilityRepair.h \
            include/directional/pipeline/RemeshPipeline.h \
            src/bench/DirectionalBenchmark.cpp \
            src/geometry/PatchDescriptor.cpp \
            src/geometry/SurfaceCellFeasibilityRepair.cpp \
            src/geometry/SurfaceComplexSimplification.cpp \
            src/pipeline/RemeshPipeline.cpp \
            tests/MilestoneDClosureTests.cpp \
            tests/MilestoneGP26Tests.cpp \
            tests/MilestoneGP27Tests.cpp \
            tests/PatchDescriptorMilestoneETests.cpp
          git commit -m "fix(surface-cells): restore rollback integrity [skip ci]"
          git push origin HEAD:agent/surface_cell_quad/p5-recover-bridge-healing

      - name: Record source transfer result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          EVENT_SHA: ${{ github.sha }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          gh api repos/${{ github.repository }}/issues/8/comments \
            -f body="P5-CB59 through P5-CB66 source transfer run ${RUN_ID} finished ${JOB_STATUS} for staging commit ${EVENT_SHA}. No compiled binary, test, benchmark, custom mesh, help/list command, or discovery command was executed."
