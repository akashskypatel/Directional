name: m1i-closeout-heading-fix

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - '.agents/connector-triggers/m1i-closeout-heading-fix'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: agent/surface_cell_quad/p5-recover-bridge-healing
          fetch-depth: 100
          submodules: false
      - name: Apply closeout heading cleanup
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 .agents/Directional/turn-payloads/m1i-code-build-closeout.py
          git diff --check
          mapfile -t changed < <(git diff --name-only | LC_ALL=C sort)
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 2
          test "${changed[0]}" = '.agents/Directional/Future_Chat_Session_Handoff.md'
          test "${changed[1]}" = 'TODO'
      - name: Commit and push heading cleanup
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'OpenAI Directional Agent'
          git config user.email 'directional-agent@users.noreply.github.com'
          git add -f -- .agents/Directional/Future_Chat_Session_Handoff.md
          git add -- TODO
          git diff --cached --check
          git commit -m 'docs: fix M1i closeout headings'
          git push origin HEAD:agent/surface_cell_quad/p5-recover-bridge-healing
