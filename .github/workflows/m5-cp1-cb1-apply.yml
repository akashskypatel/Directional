name: M5 CP1 CB1 Apply

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m5-cp1-cb1-apply-20260919.txt

permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

concurrency:
  group: m5-cp1-cb1-apply
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/m5-cp1-cb1-apply.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m5-cp1-cb1-apply
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  apply:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1vVkP3t5tijJaBbyM1ZfrzuwkVn9h5KpS
      patch_sha256: 0fc7a92f00e7f0437b00bf24af6030105655dce1b3661edf8d3cda4425cfb031
      base_sha: 95c2a97be5b364146c9981d6a01d17048e2afb87
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: "M5 CP1: canonical periodic relation certificates"
    secrets: inherit
