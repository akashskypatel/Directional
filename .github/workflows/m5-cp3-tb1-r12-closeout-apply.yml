name: M5 CP3 TB1 R12 Closeout Apply

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m5-cp3-tb1-r12-closeout-apply.txt

permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

concurrency:
  group: m5-cp3-tb1-r12-closeout-apply-${{ github.ref }}
  cancel-in-progress: false

jobs:
  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m5-cp3-tb1-r12-closeout-apply
      commit_run_file: false
      trim_stale_comments: false
    secrets: inherit

  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/m5-cp3-tb1-r12-closeout-apply.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  apply:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1Ck2a5nrGwV_Xfxk0Kg_isifuBlxdfNrS
      patch_sha256: 8d91de923214b37f1c5e7a65623dc6ec3681ad5dfcd4b291d7f888ecae861f22
      base_sha: dd553b74b7a82bc05d21e58a00d98db7b6eda9a5
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: "M5-CP3-TB1-R12: finalize artifact-only execution"
      retention_days: 14
    secrets: inherit
