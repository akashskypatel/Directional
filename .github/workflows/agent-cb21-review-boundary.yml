name: CB21 Independent Review Boundary

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/review-boundary/cb21-rp01-20261021.txt

permissions:
  contents: write
  actions: read

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/agent-cb21-review-boundary.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  review:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Initialize review log
        shell: bash
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/cb21-review-boundary.log"
          : > "$log"
          {
            echo "run_id=${GITHUB_RUN_ID}"
            echo "event_sha=${GITHUB_SHA}"
            echo "started=$(date -u +%FT%TZ)"
          } | tee -a "$log"
      - name: Checkout repository history
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          submodules: false
          lfs: false
      - name: Check independent review boundary and history
        shell: bash
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/cb21-review-boundary.log"
          {
            echo "checked_out=$(git rev-parse HEAD)"
            git status -sb
            python3 .agents/Directional/tools/review_check.py boundary
            python3 .agents/Directional/tools/review_check.py ledgers --base 8b7299b43
            echo "review_checks=passed"
          } 2>&1 | tee -a "$log"
      - name: Finalize evidence
        if: always()
        shell: bash
        run: |
          set +e
          {
            echo "final_job_status=${{ job.status }}"
            echo "final_sha=$(git rev-parse HEAD 2>/dev/null || echo unavailable)"
            git status -sb
            echo "finished=$(date -u +%FT%TZ)"
          } | tee -a "${RUNNER_TEMP}/cb21-review-boundary.log"
      - name: Upload review log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cb21-review-boundary-log-${{ github.run_id }}
          path: ${{ runner.temp }}/cb21-review-boundary.log
          if-no-files-found: error
          retention-days: 7

  mailbox:
    if: ${{ always() }}
    needs: [review]
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/workflow-mailbox-publisher.yml
    with:
      mailbox_branch: workflow-mailbox
      workflow_key: cb21-rp01-review-boundary
      source_sha: ${{ github.sha }}
      source_ref: ${{ github.ref }}
      result: ${{ needs.review.result }}
      summary: Independent review boundary and committed-ledger verification.
