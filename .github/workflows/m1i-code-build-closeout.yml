name: m1i-code-build-closeout

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - '.agents/connector-triggers/m1i-code-build-closeout'

permissions:
  contents: write

jobs:
  closeout:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: agent/surface_cell_quad/p5-recover-bridge-healing
          fetch-depth: 100
          submodules: false
      - name: Apply surgical live-document closeout
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 .agents/Directional/turn-payloads/m1i-code-build-closeout.py
          git diff --check
          mapfile -t changed < <(git diff --name-only | LC_ALL=C sort)
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 5
          test "${changed[0]}" = '.agents/Directional/Future_Chat_Session_Handoff.md'
          test "${changed[1]}" = '.agents/Directional/REORIENTATION_PLAN.md'
          test "${changed[2]}" = '.agents/Directional/Regression_Root_Cause_Tracker.md'
          test "${changed[3]}" = 'MILESTONE_G_TODO.md'
          test "${changed[4]}" = 'TODO'
      - name: Commit and push live closeout
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'OpenAI Directional Agent'
          git config user.email 'directional-agent@users.noreply.github.com'
          git add -f -- .agents/Directional/Future_Chat_Session_Handoff.md .agents/Directional/REORIENTATION_PLAN.md .agents/Directional/Regression_Root_Cause_Tracker.md
          git add -- MILESTONE_G_TODO.md TODO
          git diff --cached --check
          git commit -m 'docs: hand off M1i immutable runtime validation'
          git push origin HEAD:agent/surface_cell_quad/p5-recover-bridge-healing
