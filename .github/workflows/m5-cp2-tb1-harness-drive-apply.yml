      label: m5-cp2-tb1-harness-drive-apply
      commit_run_file: false
      trim_stale_comments: false
    secrets: inherit

  apply:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1kW4yKN5QEY1I06gTNOoFGl9RC1XFX0Vt
      patch_sha256: '21e44985e9ea4a936223c71d52ead62f56b3bdc15ad7e908a98fe0ca15d6f277'
      base_sha: 3d4c46de3dfd5aeb254d7692d308b22587b17b7d
