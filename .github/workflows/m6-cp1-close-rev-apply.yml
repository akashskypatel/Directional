name: M6 CP1 Close Review Apply

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m6-cp1-close-rev-apply.txt

permissions:
  actions: read
  contents: write
  id-token: write

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/m6-cp1-close-rev-apply.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  apply:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 18B7t5N6n7a7bJiuri_hAB1bOgLlxq2c4
      patch_sha256: fe877985d8f934955607a3f05fe8b18166113f2696846fbe1d9dfc96dabf7800
      base_sha: 910eb6b10ba21237d70ff4b87a2ad291e7bc530a
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: "docs: close M6 CP1 and define CP2"
    secrets: inherit

  mailbox:
    if: ${{ always() }}
    needs: [apply]
    permissions:
      actions: read
      contents: write
    uses: ./.github/workflows/workflow-mailbox-publisher.yml
    with:
      workflow_key: m6-cp1-close-rev-apply
      source_sha: ${{ github.sha }}
      source_ref: ${{ github.ref }}
      result: ${{ needs.apply.result }}
      summary: M6 CP1 close Review documentation patch apply.
