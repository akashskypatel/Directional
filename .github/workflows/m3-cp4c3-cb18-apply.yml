name: M3 CP4c3 CB18 Apply

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m3-cp4c3-cb18-apply-20260903.txt

permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

concurrency:
  group: m3-cp4c3-cb18-apply
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/m3-cp4c3-cb18-apply.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m3-cp4c3-cb18-apply
      commit_run_file: false
    secrets: inherit

  apply:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1FiMBR704ydqN5SXSAYhxu2orNF7g2mPI
      patch_sha256: fb8247cade473e227128963d5d47b14dd8972da7e8e7c7f11f26ebe084e908e4
      base_sha: a01016ca59314232526c8b1222c96235856ace6d
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: "M3 CP4c-3 CB18: close out build package and hand off TB16"
      retention_days: 14
    secrets: inherit
