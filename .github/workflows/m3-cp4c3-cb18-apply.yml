name: M3 CP4c3 CB18 Apply

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m3-cp4c3-cb18-apply-20260903.txt

permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

concurrency:
  group: m3-cp4c3-cb18-apply
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/m3-cp4c3-cb18-apply.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m3-cp4c3-cb18-apply
      commit_run_file: false
    secrets: inherit

  apply:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1wiDvf3dEXB5CR-lZM1nIYU5mMnvNANqD
      patch_sha256: 7f55a0df53a4e1a620547fb856849587b2816b9db732894b212260288ed54208
      base_sha: 7426df924be2c87648b1e70e0069bb6363f38466
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: "M3 CP4c-3 CB18: correct edge-locus segment endpoint rank"
      retention_days: 14
    secrets: inherit
