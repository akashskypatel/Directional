name: M4 CP3 R1 Delete Accidental Unused Branch

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m4-cp3-r1-delete-unused-branch/trigger.txt

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: m4-cp3-r1-delete-unused-branch
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/m4-cp3-r1-delete-unused-branch.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m4-cp3-r1-delete-unused-branch
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  delete-branch:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Delete accidental unused branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/unused"
          echo 'runtimeExecution=false'
          echo 'deleted_ref=refs/heads/unused'
