name: M3 CP4c3 CB4-PKG Source Snapshot

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/cp4c3-cb4pkg-source-snapshot-20260831t1520.txt

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: m3-cp4c3-cb4pkg-source-snapshot
  cancel-in-progress: false

jobs:
  validate-caller:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/agent-cp4c3-cb4pkg-source-snapshot-20260831t1520.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: cp4c3-cb4pkg-source-snapshot
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  snapshot:
    needs: validate-caller
    if: ${{ needs.validate-caller.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-source-snapshot.yml
    with:
      source_ref: c7a1e2b59321b7b91a3e1e840dc9103b25fcfef7
      artifact_prefix: m3-cp4c3-cb4pkg-source
      retention_days: 7
    secrets: inherit
