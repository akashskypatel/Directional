name: M5 CP3 CB2 Compile Fix Apply

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m5-cp3-cb2-compile-fix-apply.txt

permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

concurrency:
  group: m5-cp3-cb2-compile-fix-apply
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/m5-cp3-cb2-compile-fix-apply.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m5-cp3-cb2-compile-fix-apply
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  apply:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1nFwR4jf8vx2_aZOIyUmnvs1pU5M9xp2X
      patch_sha256: 311c5706dbe04d043c79c8b9db3f2bec949b114bbbdb7a2789cb3a71a2fa69be
      base_sha: 01aab63466f3a38095a0cee83caa93db25197905
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: "M5 CP3: fix aggregate EXPECT_NE compile error"
    secrets: inherit
