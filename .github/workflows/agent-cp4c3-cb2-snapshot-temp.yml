name: Agent CP4c3 CB2 Exact Source Snapshot

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/cp4c3-cb2-snapshot/run.txt

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: agent-cp4c3-cb2-source-snapshot
  cancel-in-progress: false

jobs:
  validate_caller:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/agent-cp4c3-cb2-snapshot-temp.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  snapshot:
    needs: validate_caller
    if: ${{ needs.validate_caller.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-source-snapshot.yml
    with:
      source_ref: d260f6a9c0bc60946b1c4d30ed77f9e838552ab6
      artifact_prefix: agent-source-snapshot-cp4c3-cb2
      retention_days: 7
    secrets: inherit
