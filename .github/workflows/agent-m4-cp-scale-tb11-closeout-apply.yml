name: M4 CP SCALE TB11 Closeout Patch Apply

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m4-cp-scale-tb11/closeout-apply.txt

permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

concurrency:
  group: m4-cp-scale-tb11-closeout-apply-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/agent-m4-cp-scale-tb11-closeout-apply.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m4-cp-scale-tb11-closeout-apply
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  apply:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1F69JT-RB5qjShHdqkax0v29OU6qWKJ2c
      patch_sha256: ddcfdea028ecf8ac731e530d3c236eda6187bd5f354b812b295d090c45cd00af
      base_sha: bb7512c377752e9ab181bb0380e3e491e6b0f615
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: "docs: record M4 CP SCALE TB11 execution evidence"
      retention_days: 14
    secrets: inherit
