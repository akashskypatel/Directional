name: Agent TB35 Artifact-Only EXEC

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/tb35-exec.txt

permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: agent-tb35-exec
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/agent-tb35-exec-temp.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: tb35-exec
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  execute:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    steps:
      - name: Initialize persistent TB35 log
        shell: bash
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/M3-CP4c-3-TB35-EXEC-workflow.log"
          : > "$log"
          {
            echo "workflow=${GITHUB_WORKFLOW}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "event=${GITHUB_EVENT_NAME}"
            echo "event_sha=${GITHUB_SHA}"
            echo "ref=${GITHUB_REF}"
            echo "repository=${GITHUB_REPOSITORY}"
            echo "runner_os=${RUNNER_OS}"
            echo "turn=M3-CP4c-3-TB35-EXEC"
            echo "artifact_id=10003613409"
            echo "expected_source=23a753a83f0eda0447172ce96bcd3180bf95ae8a"
            echo "runtime_boundary=Test+Benchmark-artifact-only"
            echo "benchmark_execution=prohibited"
            echo "started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            uname -a
            python3 --version
            unzip -v | head -n 1
            tar --version | head -n 1
          } | tee -a "$log"

      - name: Materialize and verify packaged harness
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_ARTIFACT_NAME: m3-cp4c3-cb40-result-34080675952
          EXPECTED_PROVIDER_DIGEST: sha256:bb5ee6afc1601d8d339d4fbdba32596e7b9a72b747f1510e4221b54d0776b94f
          EXPECTED_ZIP_SHA256: bb5ee6afc1601d8d339d4fbdba32596e7b9a72b747f1510e4221b54d0776b94f
          EXPECTED_SOURCE_ARCHIVE_SHA256: 56dc4a0ba09797bb08374abc15d4eaf472d19bcd8bcfa5d2ca3db361182257b4
          EXPECTED_HARNESS_SHA256: aaadab351c0ba28a39c87aff1948f83ab0c4c71520662177e5cdf6fd08b30ed3
          EXPECTED_SELECTOR_SHA256: eea6d8c2bbc8e9247deb4bfbbe6763042c76002d1894dd62e35f80262403b53e
          EXPECTED_SELECTOR_PREFIX_SHA256: 2a742ba92dba744425fccaf81d5cc7a57885cbff37c779d525218fcd70500af6
        shell: bash
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/M3-CP4c-3-TB35-EXEC-workflow.log"
          exec > >(tee -a "$log") 2>&1
          trap 'status=$?; echo "bootstrap_exit=${status}"' EXIT
          root="${RUNNER_TEMP}/tb35-bootstrap"
          pkg="${root}/package"
          source="${root}/source"
          zip="${root}/artifact-10003613409.zip"
          rm -rf "$root"
          mkdir -p "$pkg" "$source"
          artifact_json="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/10003613409")"
          provider_digest="$(printf '%s' "$artifact_json" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("digest", ""))')"
          artifact_name="$(printf '%s' "$artifact_json" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("name", ""))')"
          test "$provider_digest" = "$EXPECTED_PROVIDER_DIGEST"
          test "$artifact_name" = "$EXPECTED_ARTIFACT_NAME"
          curl -L --fail --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/10003613409/zip" \
            -o "$zip"
          printf '%s  %s\n' "$EXPECTED_ZIP_SHA256" "$zip" | sha256sum -c -
          unzip -q "$zip" -d "$pkg"
          (cd "$pkg" && sha256sum -c SHA256SUMS)
          source_archive="$pkg/source/source-23a753a83f0eda0447172ce96bcd3180bf95ae8a.tar.gz"
          printf '%s  %s\n' "$EXPECTED_SOURCE_ARCHIVE_SHA256" "$source_archive" | sha256sum -c -
          tar -xzf "$source_archive" -C "$source"
          harness="$source/.agents/Directional/tools/m3_cp4c3_artifact_only_harness.sh"
          selector="$source/.agents/Directional/Architecture_M3_CP4c3_Required_Green_Selector_409.txt"
          printf '%s  %s\n' "$EXPECTED_HARNESS_SHA256" "$harness" | sha256sum -c -
          test "$(grep -cve '^[[:space:]]*$' "$selector")" = '409'
          printf '%s  %s\n' "$EXPECTED_SELECTOR_SHA256" "$selector" | sha256sum -c -
          test "$(head -n 408 "$selector" | sha256sum | awk '{print $1}')" = "$EXPECTED_SELECTOR_PREFIX_SHA256"
          echo "packaged_harness=$harness"
          echo "packaged_harness_sha256=$(sha256sum "$harness" | awk '{print $1}')"
          echo "packaged_selector_sha256=$(sha256sum "$selector" | awk '{print $1}')"
          echo "packaged_selector_408_prefix_sha256=$(head -n 408 "$selector" | sha256sum | awk '{print $1}')"

      - name: Execute immutable selector 409 through packaged harness
        env:
          GH_TOKEN: ${{ github.token }}
          TURN_ID: M3-CP4c-3-TB35-EXEC
          ARTIFACT_ID: "10003613409"
          EXPECTED_ARTIFACT_NAME: m3-cp4c3-cb40-result-34080675952
          EXPECTED_PROVIDER_DIGEST: sha256:bb5ee6afc1601d8d339d4fbdba32596e7b9a72b747f1510e4221b54d0776b94f
          EXPECTED_ZIP_SHA256: bb5ee6afc1601d8d339d4fbdba32596e7b9a72b747f1510e4221b54d0776b94f
          EXPECTED_SOURCE_SHA: 23a753a83f0eda0447172ce96bcd3180bf95ae8a
          SELECTOR_RELATIVE_PATH: .agents/Directional/Architecture_M3_CP4c3_Required_Green_Selector_409.txt
          EXPECTED_SELECTOR_COUNT: "409"
          EXPECTED_SELECTOR_SHA256: eea6d8c2bbc8e9247deb4bfbbe6763042c76002d1894dd62e35f80262403b53e
          ACCEPTED_PREFIX_COUNT: "365"
        shell: bash
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/M3-CP4c-3-TB35-EXEC-workflow.log"
          exec > >(tee -a "$log") 2>&1
          trap 'status=$?; echo "harness_exit=${status}"' EXIT
          cd "${RUNNER_TEMP}/tb35-bootstrap/source"
          bash .agents/Directional/tools/m3_cp4c3_artifact_only_harness.sh --execute

      - name: Record final workflow source status
        if: always()
        shell: bash
        run: |
          set +e
          log="${RUNNER_TEMP}/M3-CP4c-3-TB35-EXEC-workflow.log"
          {
            echo "final_job_status=${{ job.status }}"
            echo "event_sha=${GITHUB_SHA}"
            echo "runtime_source_sha=23a753a83f0eda0447172ce96bcd3180bf95ae8a"
            echo "configure_execution=false"
            echo "compile_execution=false"
            echo "relink_execution=false"
            echo "benchmark_execution=false"
            echo "package_repair=false"
            echo "finished_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } | tee -a "$log"

      - name: Upload TB35 result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-cp4c3-tb35-exec-result-${{ github.run_id }}
          path: ${{ runner.temp }}/M3-CP4c-3-TB35-EXEC-result
          if-no-files-found: error
          retention-days: 14

      - name: Upload persistent TB35 workflow log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-cp4c3-tb35-exec-log-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/M3-CP4c-3-TB35-EXEC.log
            ${{ runner.temp }}/M3-CP4c-3-TB35-EXEC-workflow.log
          if-no-files-found: error
          retention-days: 14
