name: g4-sheet-coverage-code-build

on:
  push:
    paths:
      - '.github/agent-triggers/g4-sheet-coverage-code-build'

permissions:
  contents: write
  actions: read

concurrency:
  group: g4-sheet-coverage-code-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  code-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      LOG_DIR: /tmp/g4-sheet-coverage-logs
    steps:
      - name: Initialize unconditional activity log
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$LOG_DIR"
          {
            echo "turn=G4 torus complete phase-front sheet coverage Code+Build compile-fix iteration"
            echo "event_sha=$GITHUB_SHA"
            echo "event_ref=$GITHUB_REF"
            echo "implementation_commit=856554ce648e5df09ac50f5c94e3e8f098181524"
            echo "prior_compile_failure=GoogleTest EXPECT_GT macro parsed std::pair commas as arguments"
            echo "runtimeExecution=false"
            echo "reviewPolicy=never"
            echo "allowed=surgical test compile fix, configure, compile/link seven approved targets, package/checksum"
            echo "prohibited=tests, benchmarks, generated Directional binaries, ctest/discovery, CLI, GUI, help/list/custom-input execution"
          } | tee "$LOG_DIR/activity.log"

      - name: Checkout exact working branch
        uses: actions/checkout@v4
        with:
          ref: agent/surface_cell_quad/p5-recover-bridge-healing
          fetch-depth: 20
          submodules: false

      - name: Apply surgical test compile fix and commit source
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee -a "$LOG_DIR/activity.log") 2>&1
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo "checkout_sha=$(git rev-parse HEAD)"
          git status --short

          payload=.agents/Directional/turn-payloads/g4-sheet-coverage-compile-fix.patch
          test -f "$payload"
          PAYLOAD_BLOB=$(git hash-object "$payload")
          PAYLOAD_SHA256=$(sha256sum "$payload" | awk '{print $1}')
          HEADER_BLOB=$(git hash-object include/directional/geometry/SurfaceCellTracing.h)
          SOURCE_BLOB=$(git hash-object src/geometry/SurfaceCellTracing.cpp)
          TEST_BLOB=$(git hash-object tests/SurfaceCellsPhase10Tests.cpp)
          echo "compile_fix_payload_blob=$PAYLOAD_BLOB"
          echo "compile_fix_payload_sha256=$PAYLOAD_SHA256"
          echo "input_tracing_header_blob=$HEADER_BLOB"
          echo "input_tracing_source_blob=$SOURCE_BLOB"
          echo "input_phase10_tests_blob=$TEST_BLOB"
          test "$PAYLOAD_BLOB" = "fa0e9bc4ad751cfab5448bfae65c225137fd4a19"
          test "$HEADER_BLOB" = "6ebe8f3324be580fc4838b97e5fb449572709236"
          test "$SOURCE_BLOB" = "6b32b48141c16e2d51f1932462566083a7bc3355"
          test "$TEST_BLOB" = "5102d8749580d8a866b57674cb05b8f46993644f"
          if grep -q '^+++ b/.github/workflows/' "$payload"; then
            echo "payload attempts to modify workflow files" >&2
            exit 1
          fi
          echo "COMPILE_FIX_SHA256=$PAYLOAD_SHA256" >> "$GITHUB_ENV"

          git apply --check "$payload"
          git apply "$payload"
          mapfile -t changed < <(git diff --name-only | sort)
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = "tests/SurfaceCellsPhase10Tests.cpp"

          git config user.name 'directional-agent'
          git config user.email 'directional-agent@users.noreply.github.com'
          git add tests/SurfaceCellsPhase10Tests.cpp
          git commit -m 'fix(tests): parenthesize sheet map keys'
          FINAL_SOURCE_COMMIT=$(git rev-parse HEAD)
          echo "FINAL_SOURCE_COMMIT=$FINAL_SOURCE_COMMIT" >> "$GITHUB_ENV"
          echo "final_source_commit=$FINAL_SOURCE_COMMIT"
          echo "final_tracing_header_blob=$(git hash-object include/directional/geometry/SurfaceCellTracing.h)"
          echo "final_tracing_source_blob=$(git hash-object src/geometry/SurfaceCellTracing.cpp)"
          echo "final_phase10_tests_blob=$(git hash-object tests/SurfaceCellsPhase10Tests.cpp)"

          git rm "$payload"
          git commit -m 'chore(agent): remove G4 sheet-coverage compile-fix payload'
          CLEANUP_COMMIT=$(git rev-parse HEAD)
          echo "CLEANUP_COMMIT=$CLEANUP_COMMIT" >> "$GITHUB_ENV"
          echo "cleanup_commit=$CLEANUP_COMMIT"
          git push origin HEAD:agent/surface_cell_quad/p5-recover-bridge-healing
          git status --short

      - name: Install compile prerequisites
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee -a "$LOG_DIR/activity.log") 2>&1
          sudo apt-get update
          sudo apt-get install -y ninja-build libgmp-dev xz-utils

      - name: Fetch shallow submodules
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee -a "$LOG_DIR/activity.log") 2>&1
          git submodule update --init --depth 1
          git submodule status

      - name: Configure Release static compile-only build
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee -a "$LOG_DIR/activity.log") 2>&1
          {
            echo "implementation_commit=856554ce648e5df09ac50f5c94e3e8f098181524"
            echo "final_source_commit=$FINAL_SOURCE_COMMIT"
            echo "cleanup_commit=$CLEANUP_COMMIT"
            echo "compile_head=$(git rev-parse HEAD)"
            cmake --version
            c++ --version
            ninja --version
          } | tee "$LOG_DIR/toolchain.txt"
          cmake -S . -B agent-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DCMAKE_GTEST_DISCOVER_TESTS_DISCOVERY_MODE=PRE_TEST \
            -DBUILD_SHARED_LIBS=OFF \
            -DBUILD_TUTORIALS=OFF \
            -DBUILD_PYTHON=OFF \
            -DDIRECTIONAL_BUILD_CLI=OFF \
            -DDIRECTIONAL_BUILD_GUI=OFF \
            -DDIRECTIONAL_BUILD_BENCHMARKS=ON \
            -DDIRECTIONAL_BUILD_TESTS=ON \
            -DDIRECTIONAL_BUILD_HISTORICAL_TESTS=OFF \
            -DDIRECTIONAL_BUILD_LEGACY_INTEGRATION_TESTS=OFF \
            -DDIRECTIONAL_BUILD_OPTIONAL_GUIDANCE_TESTS=OFF \
            -DDIRECTIONAL_ENABLE_GMP=ON \
            -DDIRECTIONAL_ENABLE_PARDISO=OFF \
            -DDIRECTIONAL_ENABLE_CUDSS=OFF \
            -DDIRECTIONAL_ENABLE_SUITESPARSE=OFF \
            2>&1 | tee "$LOG_DIR/configure.log"

      - name: Compile seven approved targets only
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee -a "$LOG_DIR/activity.log") 2>&1
          cmake --build agent-build --parallel 2 --target \
            directional_core \
            directional_pipeline \
            directional_compiled_api_tests \
            directional_surface_cell_producer_tests \
            directional_surface_cell_completion_tests \
            directional_surface_cell_validation_tests \
            directional_benchmarks \
            2>&1 | tee "$LOG_DIR/build.log"
          echo "compile_only_gate=passed" | tee -a "$LOG_DIR/activity.log"
          echo "final_source_status_begin" | tee -a "$LOG_DIR/activity.log"
          git status --short | tee -a "$LOG_DIR/activity.log"
          echo "final_source_status_end" | tee -a "$LOG_DIR/activity.log"

      - name: Package immutable compile artifact
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee -a "$LOG_DIR/activity.log") 2>&1
          root="$GITHUB_WORKSPACE/g4-sheet-coverage-artifact"
          rm -rf "$root"
          mkdir -p "$root"/{bin,lib,test-data/benchmarks,logs,metadata,source}
          cp agent-build/directional_benchmarks "$root/bin/"
          cp agent-build/directional_compiled_api_tests "$root/bin/"
          cp agent-build/directional_surface_cell_producer_tests "$root/bin/"
          cp agent-build/directional_surface_cell_completion_tests "$root/bin/"
          cp agent-build/directional_surface_cell_validation_tests "$root/bin/"
          cp agent-build/libdirectional_core.a "$root/lib/"
          cp agent-build/libdirectional_pipeline.a "$root/lib/"
          cp -a benchmarks/fixtures "$root/test-data/benchmarks/"
          cp "$LOG_DIR/activity.log" "$LOG_DIR/configure.log" \
             "$LOG_DIR/build.log" "$LOG_DIR/toolchain.txt" "$root/logs/"
          cp agent-build/compile_commands.json "$root/source/"

          git show 856554ce648e5df09ac50f5c94e3e8f098181524 --format=fuller --stat --patch -- \
            include/directional/geometry/SurfaceCellTracing.h \
            src/geometry/SurfaceCellTracing.cpp \
            tests/SurfaceCellsPhase10Tests.cpp > "$root/source/g4-sheet-coverage.patch"
          git show "$FINAL_SOURCE_COMMIT" --format=fuller --stat --patch -- \
            tests/SurfaceCellsPhase10Tests.cpp >> "$root/source/g4-sheet-coverage.patch"
          tar --exclude=.git --exclude=external --exclude=agent-build \
              --exclude=g4-sheet-coverage-artifact \
              -cJf "$root/source/directional-g4-sheet-coverage-source-no-deps.tar.xz" .

          cat > "$root/metadata/source-authority.json" <<EOF
          {
            "eventCommit": "$GITHUB_SHA",
            "implementationCommit": "856554ce648e5df09ac50f5c94e3e8f098181524",
            "finalCompileSourceCommit": "$FINAL_SOURCE_COMMIT",
            "cleanupCommit": "$CLEANUP_COMMIT",
            "implementationPatchBlob": "5980a71a0d38068fb2bb2dc86d16b4448e95b561",
            "implementationPatchSha256": "00aadd3db37cb6db4e61309a56ae8cd7d68559e65938056994f908bb600df384",
            "compileFixPatchBlob": "fa0e9bc4ad751cfab5448bfae65c225137fd4a19",
            "compileFixPatchSha256": "$COMPILE_FIX_SHA256",
            "runtimeExecution": false,
            "reviewPolicy": "never"
          }
          EOF
          cat > "$root/metadata/build-authority.json" <<'EOF'
          {"configuration":"Release","generator":"Ninja","buildSharedLibs":false,"gtestDiscoveryMode":"PRE_TEST","approvedTargets":7,"runtimeExecution":false}
          EOF
          cat > "$root/metadata/command-boundary.txt" <<'EOF'
          G4 Code + Build only.
          Executed: surgical test compile fix, configure, compile/link seven approved targets, package/checksum.
          Not executed: generated Directional binaries, tests, benchmarks, ctest/discovery, CLI, GUI, help/list/custom-input commands.
          EOF
          git ls-tree -r "$FINAL_SOURCE_COMMIT" -- \
            include/directional/geometry/SurfaceCellTracing.h \
            src/geometry/SurfaceCellTracing.cpp \
            src/pipeline/RemeshPipeline.cpp \
            tests/SurfaceCellsPhase10Tests.cpp > "$root/metadata/final-blobs.txt"
          git submodule status > "$root/metadata/submodules.txt"
          find benchmarks/fixtures -type f | sort > "$root/metadata/fixture-files.txt"
          (cd "$root" && find . -type f ! -name SHA256SUMS -print0 | sort -z | \
            xargs -0 sha256sum > SHA256SUMS)
          sha256sum "$root/SHA256SUMS" | tee "$LOG_DIR/artifact-checksum.txt"

      - name: Upload immutable compile artifact
        uses: actions/upload-artifact@v4
        with:
          name: g4-sheet-coverage-code-build
          path: g4-sheet-coverage-artifact
          if-no-files-found: error
          retention-days: 14

      - name: Upload detailed activity log always
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g4-sheet-coverage-code-build-logs
          path: /tmp/g4-sheet-coverage-logs
          if-no-files-found: error
          retention-days: 14
