name: Agent M4 CP-SCALE TB2 EXEC
on:
  push:
    branches: [agent/surface_cell_quad/p5-recover-bridge-healing]
    paths: [.agents/connector-triggers/tb-exec/p5-cp-scale-tb2-exec-20260914.txt]
permissions:
  contents: write
  actions: read
  issues: write
  pull-requests: write
concurrency:
  group: agent-m4-cp-scale-tb2-exec
  cancel-in-progress: false
jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/agent-tb2-exec-p5-cp-scale-20260914.yml
      source_ref: ${{ github.sha }}
    secrets: inherit
  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: cp-scale-tb2-exec
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit
  execute:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Initialize diagnostic log
        shell: bash
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/m4-cp-scale-tb2-exec.log"; : > "$log"
          printf '%s\n' "workflow=${GITHUB_WORKFLOW}" "run_id=${GITHUB_RUN_ID}" "event=${GITHUB_EVENT_NAME}" "event_sha=${GITHUB_SHA}" "ref=${GITHUB_REF}" "repository=${GITHUB_REPOSITORY}" "turn=M4-CP-SCALE-TB2-EXEC" "artifact_id=10367451675" 'runtimeExecution=artifact-only' "started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" | tee -a "$log"
      - name: Checkout exact orchestration commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          token: ${{ github.token }}
      - name: Execute immutable TB2 gate
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set +e
          bash .agents/Directional/turn-payloads/m4-cp-scale-tb2-exec.sh 2>&1 | tee -a "${RUNNER_TEMP}/m4-cp-scale-tb2-exec.log"
          rc=${PIPESTATUS[0]}; echo "mechanical_exit=${rc}" | tee -a "${RUNNER_TEMP}/m4-cp-scale-tb2-exec.log"; echo "exit_code=${rc}" >> "$GITHUB_OUTPUT"; exit 0
      - name: Record final source status
        if: always()
        shell: bash
        run: |
          set +e
          { echo "final_job_status=${{ job.status }}"; echo "gate_exit=${{ steps.gate.outputs.exit_code }}"; echo "final_sha=$(git rev-parse HEAD 2>/dev/null || echo unavailable)"; git status --short 2>&1 || true; echo "finished_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"; } | tee -a "${RUNNER_TEMP}/m4-cp-scale-tb2-exec.log"
      - name: Upload TB2 result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m4-cp-scale-tb2-exec-result-${{ github.run_id }}
          path: ${{ runner.temp }}/tb2-publish
          if-no-files-found: error
          retention-days: 14
      - name: Upload TB2 diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m4-cp-scale-tb2-exec-log-${{ github.run_id }}
          path: ${{ runner.temp }}/m4-cp-scale-tb2-exec.log
          if-no-files-found: error
          retention-days: 14
      - name: Fail on mechanical red
        if: always() && steps.gate.outputs.exit_code != '0'
        shell: bash
        run: |
          echo "TB2 mechanical gate failed with exit=${{ steps.gate.outputs.exit_code }}" >&2
          exit 1
