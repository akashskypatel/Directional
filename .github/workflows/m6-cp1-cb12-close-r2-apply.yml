name: M6 CP1 CB12 Close R2 Patch Apply

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m6-cp1-cb12-close-r2-apply.txt

permissions:
  actions: read
  contents: write
  id-token: write

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/m6-cp1-cb12-close-r2-apply.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  apply:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1r4tealeL_C2woLsPM47-i9MkHklVqBiD
      patch_sha256: 10c92a36802eee214369638f6ec5e9de7a0aadc92ac4019f166ac17b05263fc1
      base_sha: 7ca534c223d603e117c7eeba322f88609c04cbb6
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: "docs: close M6-CP1-CB12-CLOSE-R2"
    secrets: inherit

  mailbox:
    if: ${{ always() }}
    needs: [apply]
    permissions:
      actions: read
      contents: write
    uses: ./.github/workflows/workflow-mailbox-publisher.yml
    with:
      workflow_key: m6-cp1-cb12-close-r2-apply
      source_sha: ${{ github.sha }}
      source_ref: ${{ github.ref }}
      result: ${{ needs.apply.result }}
      summary: M6-CP1-CB12-CLOSE-R2 closeout documentation patch application.
