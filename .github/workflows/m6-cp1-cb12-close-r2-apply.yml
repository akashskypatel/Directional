name: M6 CP1 CB12 Close R2 Patch Apply

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m6-cp1-cb12-close-r2-apply.txt

permissions:
  actions: read
  contents: write
  id-token: write

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/m6-cp1-cb12-close-r2-apply.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  apply:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1Zyk_jYMdU3Q1_0meqw_IKT6XH9o78c_a
      patch_sha256: 694f89a68c4a0610d9061764d920db09554748d32d6b32c551a61d9de4133840
      base_sha: 272efc96a9d9e0fb809bf8547955846587ac00a3
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: "M6-CP1-CB12-CLOSE-R2: recover A7 wedge oracle"
    secrets: inherit

  mailbox:
    if: ${{ always() }}
    needs: [apply]
    permissions:
      actions: read
      contents: write
    uses: ./.github/workflows/workflow-mailbox-publisher.yml
    with:
      workflow_key: m6-cp1-cb12-close-r2-apply
      source_sha: ${{ github.sha }}
      source_ref: ${{ github.ref }}
      result: ${{ needs.apply.result }}
      summary: M6-CP1-CB12-CLOSE-R2 Google Drive patch application.
