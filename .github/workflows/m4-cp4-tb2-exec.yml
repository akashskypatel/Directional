name: M4 CP4 TB2 Artifact Gate

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m4-cp4-tb2/validate-caller.txt
      - .agents/connector-triggers/m4-cp4-tb2/execute.txt

permissions:
  actions: read
  contents: write
  id-token: write
  issues: write
  pull-requests: write

concurrency:
  group: m4-cp4-tb2-exec-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/m4-cp4-tb2-exec.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m4-cp4-tb2-exec
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  execute:
    needs: validate
    if: "${{ startsWith(github.event.head_commit.message, 'M4-CP4-TB2-EXEC: execute artifact gate') && needs.validate.outputs.valid == 'true' }}"
    runs-on: ubuntu-24.04
    steps:
      - name: Initialize persistent activity log
        shell: bash
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/m4-cp4-tb2-exec.log"
          : > "$log"
          {
            echo "workflow=${GITHUB_WORKFLOW}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "event=${GITHUB_EVENT_NAME}"
            echo "event_sha=${GITHUB_SHA}"
            echo "ref=${GITHUB_REF}"
            echo "repository=${GITHUB_REPOSITORY}"
            echo "runner_os=${RUNNER_OS}"
            echo "runtimeExecution=true"
            echo "compileExecution=false"
            echo "started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } | tee -a "$log"

      - name: Authenticate to Google Drive
        id: auth
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ secrets.GOOGLE_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GOOGLE_PROVIDER }}
          service_account: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/drive.readonly
          create_credentials_file: false

      - name: Download and verify frozen TB2 harness
        id: harness
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          FILE_ID: 19RUc7p4fbHk2oDGSZIUsmNo2ui9_-qr8
          EXPECTED_HARNESS_SHA256: ff9c1e0e6dc184e09803062694ac666f3f7e62963284c173f4381ad1a5755846
        shell: bash
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/m4-cp4-tb2-exec.log"
          exec > >(tee -a "$log") 2>&1
          harness="${RUNNER_TEMP}/m4-cp4-tb2-exec-harness.sh"
          curl --fail-with-body --silent --show-error --location \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            "https://www.googleapis.com/drive/v3/files/${FILE_ID}?alt=media&supportsAllDrives=true" \
            -o "$harness"
          actual="$(sha256sum "$harness" | awk '{print $1}')"
          test "$actual" = "$EXPECTED_HARNESS_SHA256"
          printf '%s\n' "harness_file_id=${FILE_ID}" "harness_sha256=${actual}"
          echo "path=$harness" >> "$GITHUB_OUTPUT"

      - name: Execute immutable composite artifact gate
        id: gate
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
          TB2_LOG: ${{ runner.temp }}/m4-cp4-tb2-exec.log
          HARNESS_PATH: ${{ steps.harness.outputs.path }}
        shell: bash
        run: |
          set -uo pipefail
          log="${RUNNER_TEMP}/m4-cp4-tb2-exec.log"
          set +e
          bash "$HARNESS_PATH"
          status=$?
          set -e
          echo "$status" > "${RUNNER_TEMP}/m4-cp4-tb2-exec.exit"
          echo "gate_exit=${status}" | tee -a "$log"
          exit "$status"

      - name: Upload TB2 result evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m4-cp4-tb2-result-${{ github.run_id }}
          path: ${{ runner.temp }}/M4-CP4-TB2-EXEC-result
          if-no-files-found: error
          retention-days: 14

      - name: Record final execution status
        if: always()
        shell: bash
        run: |
          set +e
          log="${RUNNER_TEMP}/m4-cp4-tb2-exec.log"
          {
            echo "gate_step_outcome=${{ steps.gate.outcome }}"
            echo "gate_exit=$(cat "${RUNNER_TEMP}/m4-cp4-tb2-exec.exit" 2>/dev/null || echo unavailable)"
            echo "final_job_status=${{ job.status }}"
            echo "finished_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } | tee -a "$log"

      - name: Upload persistent activity log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m4-cp4-tb2-log-${{ github.run_id }}
          path: ${{ runner.temp }}/m4-cp4-tb2-exec.log
          if-no-files-found: error
          retention-days: 14

      - name: Propagate orchestration status
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          status="$(cat "${RUNNER_TEMP}/m4-cp4-tb2-exec.exit" 2>/dev/null || echo 90)"
          if [[ "$status" -ne 0 ]]; then
            echo "artifact gate orchestration failed with exit $status" >&2
            exit "$status"
          fi
