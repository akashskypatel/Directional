name: Agent M4 CP3 CB4 R2 Review Apply

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m4-cp3-cb4-r2-review-apply.txt

permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

concurrency:
  group: agent-m4-cp3-cb4-r2-review-apply
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/agent-m4-cp3-cb4-r2-review-apply.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m4-cp3-cb4-r2-review-apply
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  apply:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1cXkwzmFA3vHueFSJb617fV58tjDUYjB5
      patch_sha256: 'a375d78b6e066f75ac77edef87c8237e46367820b8f8dade5a0e5cc4a6ae736f'
      base_sha: 9329d6610ffbfbb9fe3f638a2aae7ce3be368fa7
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: 'docs: review M4-CP3 CB4-R2 stop guard and freeze R3'
    secrets: inherit
