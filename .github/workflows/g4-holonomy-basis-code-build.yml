name: g4-holonomy-basis-code-build

on:
  push:
    paths:
      - '.github/agent-triggers/g4-holonomy-basis-code-build'

permissions:
  contents: write
  actions: read

jobs:
  code-build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact working branch
        uses: actions/checkout@v4
        with:
          ref: agent/surface_cell_quad/p5-recover-bridge-healing
          fetch-depth: 12
          submodules: false

      - name: Initialize unconditional activity log
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p agent-build-logs
          {
            echo "turn=G4 holonomy basis Code+Build compile-fix iteration"
            echo "event_sha=$GITHUB_SHA"
            echo "checkout_sha=$(git rev-parse HEAD)"
            echo "primary_implementation_commit=aa0f115c19fc8a5afd8487ebb561e2de2b8551ba"
            echo "prior_compile_failure=missing std::vector<uint64_t> hash overload"
            echo "runtimeExecution=false"
            echo "reviewPolicy=never"
            echo "allowed=compile-fix transform, configure, compile/link approved targets, package"
            echo "prohibited=tests, benchmarks, generated Directional executables, ctest, CLI, GUI"
          } | tee agent-build-logs/activity.log

      - name: Apply surgical compile fix and commit source
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee -a agent-build-logs/activity.log) 2>&1
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          payload=.agents/Directional/turn-payloads/g4-holonomy-basis-compile-fix.py
          test -f "$payload"
          test "$(git hash-object src/pipeline/RemeshPipeline.cpp)" = \
            "54c95f63ca68f1448e322d964c5617af2c1d7aa3"
          PAYLOAD_SHA256=$(sha256sum "$payload" | awk '{print $1}')
          echo "payload_sha256=$PAYLOAD_SHA256"
          echo "PAYLOAD_SHA256=$PAYLOAD_SHA256" >> "$GITHUB_ENV"

          python3 "$payload"
          git diff --check
          mapfile -t changed < <(git diff --name-only | grep -v '^.agents/Directional/turn-payloads/g4-holonomy-basis-compile-fix.py$' | sort)
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = "src/pipeline/RemeshPipeline.cpp"

          git config user.name 'directional-agent'
          git config user.email 'directional-agent@users.noreply.github.com'
          git add src/pipeline/RemeshPipeline.cpp
          git commit -m 'fix(surface-cells): hash periodic topology signatures'
          SOURCE_COMMIT=$(git rev-parse HEAD)
          echo "SOURCE_COMMIT=$SOURCE_COMMIT" >> "$GITHUB_ENV"
          echo "source_commit=$SOURCE_COMMIT"
          echo "pipeline_blob=$(git hash-object src/pipeline/RemeshPipeline.cpp)"

          git rm "$payload"
          git commit -m 'chore(agent): remove G4 compile-fix payload'
          CLEANUP_COMMIT=$(git rev-parse HEAD)
          echo "CLEANUP_COMMIT=$CLEANUP_COMMIT" >> "$GITHUB_ENV"
          echo "cleanup_commit=$CLEANUP_COMMIT"
          git push origin HEAD:agent/surface_cell_quad/p5-recover-bridge-healing

      - name: Install compile prerequisites
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee -a agent-build-logs/activity.log) 2>&1
          sudo apt-get update
          sudo apt-get install -y ninja-build libgmp-dev xz-utils

      - name: Fetch shallow submodules
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee -a agent-build-logs/activity.log) 2>&1
          git submodule update --init --depth 1

      - name: Configure Release static compile-only build
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee -a agent-build-logs/activity.log) 2>&1
          {
            echo "primary_implementation_commit=aa0f115c19fc8a5afd8487ebb561e2de2b8551ba"
            echo "source_commit=$SOURCE_COMMIT"
            echo "cleanup_commit=$CLEANUP_COMMIT"
            cmake --version
            c++ --version
            ninja --version
          } | tee agent-build-logs/toolchain.txt
          cmake -S . -B agent-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DCMAKE_GTEST_DISCOVER_TESTS_DISCOVERY_MODE=PRE_TEST \
            -DBUILD_SHARED_LIBS=OFF \
            -DBUILD_TUTORIALS=OFF \
            -DBUILD_PYTHON=OFF \
            -DDIRECTIONAL_BUILD_CLI=OFF \
            -DDIRECTIONAL_BUILD_GUI=OFF \
            -DDIRECTIONAL_BUILD_BENCHMARKS=ON \
            -DDIRECTIONAL_BUILD_TESTS=ON \
            -DDIRECTIONAL_BUILD_HISTORICAL_TESTS=OFF \
            -DDIRECTIONAL_BUILD_LEGACY_INTEGRATION_TESTS=OFF \
            -DDIRECTIONAL_BUILD_OPTIONAL_GUIDANCE_TESTS=OFF \
            -DDIRECTIONAL_ENABLE_GMP=ON \
            -DDIRECTIONAL_ENABLE_PARDISO=OFF \
            -DDIRECTIONAL_ENABLE_CUDSS=OFF \
            -DDIRECTIONAL_ENABLE_SUITESPARSE=OFF \
            2>&1 | tee agent-build-logs/configure.log

      - name: Compile seven approved targets only
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee -a agent-build-logs/activity.log) 2>&1
          cmake --build agent-build --parallel 2 --target \
            directional_core \
            directional_pipeline \
            directional_compiled_api_tests \
            directional_surface_cell_producer_tests \
            directional_surface_cell_completion_tests \
            directional_surface_cell_validation_tests \
            directional_benchmarks \
            2>&1 | tee agent-build-logs/build.log
          echo "compile_only_gate=passed" | tee -a agent-build-logs/activity.log

      - name: Package immutable compile artifact
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee -a agent-build-logs/activity.log) 2>&1
          root="$GITHUB_WORKSPACE/g4-holonomy-basis-artifact"
          rm -rf "$root"
          mkdir -p "$root"/{bin,lib,test-data/benchmarks,logs,metadata,source}
          cp agent-build/directional_benchmarks "$root/bin/"
          cp agent-build/directional_compiled_api_tests "$root/bin/"
          cp agent-build/directional_surface_cell_producer_tests "$root/bin/"
          cp agent-build/directional_surface_cell_completion_tests "$root/bin/"
          cp agent-build/directional_surface_cell_validation_tests "$root/bin/"
          cp agent-build/libdirectional_core.a "$root/lib/"
          cp agent-build/libdirectional_pipeline.a "$root/lib/"
          cp -a benchmarks/fixtures "$root/test-data/benchmarks/"
          cp agent-build-logs/activity.log agent-build-logs/configure.log \
             agent-build-logs/build.log agent-build-logs/toolchain.txt "$root/logs/"
          cp agent-build/compile_commands.json "$root/source/"

          git show aa0f115c19fc8a5afd8487ebb561e2de2b8551ba --format=fuller --stat --patch -- \
            include/directional/geometry/SurfaceCellTracing.h \
            include/directional/diagnostics/RemeshDiagnostics.h \
            src/geometry/SurfaceCellTracing.cpp \
            src/pipeline/RemeshPipeline.cpp \
            src/bench/DirectionalBenchmark.cpp \
            tests/SurfaceCellsPhase10Tests.cpp > "$root/source/g4-holonomy-basis.patch"
          git show "$SOURCE_COMMIT" --format=fuller --stat --patch -- \
            src/pipeline/RemeshPipeline.cpp >> "$root/source/g4-holonomy-basis.patch"
          tar --exclude=.git --exclude=external --exclude=agent-build \
              --exclude=g4-holonomy-basis-artifact \
              -cJf "$root/source/directional-g4-holonomy-basis-source-no-deps.tar.xz" .

          cat > "$root/metadata/source-authority.json" <<EOF
          {
            "eventCommit": "$GITHUB_SHA",
            "primaryImplementationCommit": "aa0f115c19fc8a5afd8487ebb561e2de2b8551ba",
            "sourceCommit": "$SOURCE_COMMIT",
            "cleanupCommit": "$CLEANUP_COMMIT",
            "compileFixTransformSha256": "$PAYLOAD_SHA256",
            "runtimeExecution": false,
            "reviewPolicy": "never"
          }
          EOF
          cat > "$root/metadata/build-authority.json" <<'EOF'
          {"configuration":"Release","generator":"Ninja","buildSharedLibs":false,"gtestDiscoveryMode":"PRE_TEST","approvedTargets":7,"runtimeExecution":false}
          EOF
          cat > "$root/metadata/command-boundary.txt" <<'EOF'
          G4 Code + Build only.
          Executed: surgical compile fix, configure, compile/link seven approved targets, package/checksum.
          Not executed: generated Directional binaries, tests, benchmarks, ctest/discovery, CLI, GUI, help/list commands.
          EOF
          git ls-tree -r "$SOURCE_COMMIT" -- \
            include/directional/geometry/SurfaceCellTracing.h \
            src/geometry/SurfaceCellTracing.cpp \
            include/directional/diagnostics/RemeshDiagnostics.h \
            src/pipeline/RemeshPipeline.cpp \
            src/bench/DirectionalBenchmark.cpp \
            tests/SurfaceCellsPhase10Tests.cpp > "$root/metadata/final-blobs.txt"
          find benchmarks/fixtures -type f | sort > "$root/metadata/fixture-files.txt"
          (cd "$root" && find . -type f ! -name SHA256SUMS -print0 | sort -z | \
            xargs -0 sha256sum > SHA256SUMS)
          sha256sum "$root/SHA256SUMS" | tee agent-build-logs/artifact-checksum.txt

      - name: Upload immutable compile artifact
        uses: actions/upload-artifact@v4
        with:
          name: g4-holonomy-basis-code-build
          path: g4-holonomy-basis-artifact
          if-no-files-found: error
          retention-days: 14

      - name: Upload detailed activity log always
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g4-holonomy-basis-code-build-logs
          path: agent-build-logs
          if-no-files-found: warn
          retention-days: 14
