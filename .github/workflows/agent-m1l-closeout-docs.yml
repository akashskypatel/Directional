name: Agent M1l Closeout Documentation

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m1l-closeout-docs.txt

permissions:
  contents: write

concurrency:
  group: agent-m1l-closeout-docs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact event source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Apply bounded closeout documentation updates
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 .agents/Directional/turn-payloads/m1l-closeout-docs.py
          git add TODO.md
          git add -f \
            .agents/Directional/CHANGELOG.md \
            .agents/Directional/Future_Chat_Session_Handoff.md \
            .agents/Directional/REORIENTATION_PLAN.md \
            .agents/Directional/Regression_Root_Cause_Tracker.md
          git diff --check --cached

          actual_paths=$(git diff --cached --name-only | LC_ALL=C sort)
          expected_paths=$(printf '%s\n' \
            .agents/Directional/CHANGELOG.md \
            .agents/Directional/Future_Chat_Session_Handoff.md \
            .agents/Directional/REORIENTATION_PLAN.md \
            .agents/Directional/Regression_Root_Cause_Tracker.md \
            TODO.md | LC_ALL=C sort)
          test "$actual_paths" = "$expected_paths"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs(surface-cell): close out M1l Code Build'
          git push origin "HEAD:$GITHUB_REF_NAME"
