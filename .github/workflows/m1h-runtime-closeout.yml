name: m1h-runtime-closeout

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - '.agents/connector-triggers/m1h-runtime-closeout'

permissions:
  contents: write

jobs:
  closeout:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: agent/surface_cell_quad/p5-recover-bridge-healing
          fetch-depth: 100
          submodules: false
      - name: Apply surgical tracker formatting fix
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 .agents/Directional/turn-payloads/m1h-runtime-closeout-fix.py
          git diff --check
          mapfile -t changed < <(git diff --name-only | LC_ALL=C sort)
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = '.agents/Directional/Regression_Root_Cause_Tracker.md'
      - name: Commit and push formatting fix
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'OpenAI Directional Agent'
          git config user.email 'directional-agent@users.noreply.github.com'
          git add -f -- .agents/Directional/Regression_Root_Cause_Tracker.md
          git diff --cached --check
          git commit -m 'docs: fix M1h regression tracker heading'
          git push origin HEAD:agent/surface_cell_quad/p5-recover-bridge-healing
