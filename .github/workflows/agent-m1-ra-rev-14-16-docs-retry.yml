name: Agent M1 R-A REV-14-16 Durable Records Retry

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m1-ra-rev-14-16-docs-retry.txt

permissions:
  contents: write

jobs:
  sync-records:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact trigger authority
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2

      - name: Reuse durable-record transform and force-stage tracked ignored files
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          sed -n "/python3 - <<'PY'/,/^          PY$/p" .github/workflows/agent-m1-ra-rev-14-16-docs.yml \
            | sed '1d;$d;s/^          //' > "$RUNNER_TEMP/sync-records.py"
          python3 "$RUNNER_TEMP/sync-records.py"
          git diff --check
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' \
            .agents/Directional/Architecture_M1_Single_Authority_Cutover_Code_Build_Plan.md \
            .agents/Directional/CHANGELOG.md \
            .agents/Directional/Future_Chat_Session_Handoff.md \
            TODO.md | sort)"
          printf 'changed_files=\n%s\n' "$changed"
          test "$changed" = "$expected"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f -- .agents/Directional/Architecture_M1_Single_Authority_Cutover_Code_Build_Plan.md .agents/Directional/CHANGELOG.md .agents/Directional/Future_Chat_Session_Handoff.md TODO.md
          git commit -m "docs: record R-A REV-14 through REV-16 closure"
          git push origin "HEAD:${GITHUB_REF_NAME}"
