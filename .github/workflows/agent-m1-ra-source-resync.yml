name: Agent M1 R-A Source Resync

on:
  push:
    branches: [agent/surface_cell_quad/p5-recover-bridge-healing]
    paths: [.agents/connector-triggers/m1-ra-source-resync.txt]

permissions: {contents: read}
concurrency: {group: agent-m1-ra-source-resync, cancel-in-progress: false}

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Initialize persistent activity log
        shell: bash
        run: |
          set -euo pipefail
          LOG="$RUNNER_TEMP/activity.log"; : > "$LOG"
          { echo "task=M1 R-A source resync"; echo "ref=$GITHUB_REF"; echo "sha=$GITHUB_SHA"; date -u +"utc=%Y-%m-%dT%H:%M:%SZ"; } | tee -a "$LOG"
      - name: Checkout exact triggering commit
        uses: actions/checkout@v4
        with: {fetch-depth: 1, submodules: false}
      - name: Archive exact tracked source
        shell: bash
        run: |
          set -euo pipefail
          LOG="$RUNNER_TEMP/activity.log"; exec > >(tee -a "$LOG") 2>&1
          trap 'rc=$?; echo "exit_code=$rc"; echo "final_head=$(git rev-parse HEAD 2>/dev/null || true)"; git status --short 2>/dev/null || true; exit $rc' EXIT
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo "$GITHUB_SHA" > "$RUNNER_TEMP/source-commit.txt"
          git archive --format=tar HEAD -o "$RUNNER_TEMP/source.tar"
          sha256sum "$RUNNER_TEMP/source.tar" "$RUNNER_TEMP/source-commit.txt" | tee "$RUNNER_TEMP/SHA256SUMS"
      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with: {name: "m1-ra-source-resync-${{ github.run_id }}", path: "${{ runner.temp }}/source.tar\n${{ runner.temp }}/source-commit.txt\n${{ runner.temp }}/SHA256SUMS", if-no-files-found: error, retention-days: 7}
      - name: Upload persistent activity log
        if: always()
        uses: actions/upload-artifact@v4
        with: {name: "m1-ra-source-resync-log-${{ github.run_id }}", path: "${{ runner.temp }}/activity.log", if-no-files-found: error, retention-days: 7}
