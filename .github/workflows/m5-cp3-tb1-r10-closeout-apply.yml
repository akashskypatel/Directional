name: M5 CP3 TB1 R10 Closeout Apply

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m5-cp3-tb1-r10-closeout-apply.txt

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

concurrency:
  group: m5-cp3-tb1-r10-closeout-apply
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/m5-cp3-tb1-r10-closeout-apply.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m5-cp3-tb1-r10-closeout-apply
      commit_run_file: false
      trim_stale_comments: false
    secrets: inherit

  apply:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1NLE3Lf6jyEybUSx4mhmbkJRO4loQevOO
      patch_sha256: 3bc27582bb7887d315c0018e046b86397c956ad5e914d3be1844d739723a21c5
      base_sha: 62ecfaa72f72cd74d5525f4d79a16cbdf3364cec
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: M5-CP3-TB1-R10-EXEC closeout documentation
    secrets: inherit
