name: M3 CP4c3 TB5 Closeout Docs Apply

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m3-cp4c3-tb5-closeout-docs-20260831.txt

permissions:
  actions: read
  contents: write
  id-token: write
  issues: write
  pull-requests: write

jobs:
  validate-caller:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/m3-cp4c3-tb5-closeout-docs-apply.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m3-cp4c3-tb5-closeout-docs
      trim_stale_comments: false
      commit_run_file: false
    secrets: inherit

  apply:
    needs: validate-caller
    if: ${{ needs.validate-caller.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1LuHLKuiD9vzvU2xNcNGV5L93DFB7Vrk0
      patch_sha256: 0d65b33d4376c726622f2a0c3f1129376920f0f5792a9f38da1e2153b977d1df
      base_sha: 5b383837b2fdef732f00c357e7ccd8c901a696ae
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: docs: close M3-CP4c-3-TB5 and freeze review plan
    secrets: inherit

  cleanup-accidental-branch:
    needs: apply
    runs-on: ubuntu-24.04
    steps:
      - name: Remove accidental temporary branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/tmp-do-not-create"
