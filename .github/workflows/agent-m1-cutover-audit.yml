name: Agent M1 Cutover Source Audit

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m1-cutover-audit.txt

permissions:
  contents: read

concurrency:
  group: agent-m1-cutover-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Initialize persistent activity log
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p "$RUNNER_TEMP/m1-audit"
          LOG="$RUNNER_TEMP/m1-audit/activity.log"
          {
            echo "M1 source audit start: $(date -u +%FT%TZ)"
            echo "event=${GITHUB_EVENT_NAME}"
            echo "ref=${GITHUB_REF}"
            echo "trigger_sha=${GITHUB_SHA}"
            echo "runner=${RUNNER_OS}/${RUNNER_ARCH}"
          } | tee "$LOG"

      - name: Checkout exact trigger commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          submodules: false

      - name: Audit M1 authority source
        shell: bash
        run: |
          set -uo pipefail
          LOG="$RUNNER_TEMP/m1-audit/activity.log"
          exec > >(tee -a "$LOG") 2>&1
          echo "checkout_sha=$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA" || exit 91
          echo "--- workflow inventory ---"
          find .github/workflows -maxdepth 1 -type f -print | sort
          echo "--- trigger inventory ---"
          find .agents/connector-triggers -maxdepth 1 -type f -print 2>/dev/null | sort || true
          echo "--- cutover banned-symbol audit ---"
          patterns=(
            LegacyAuthorityAdapters
            to_legacy_index
            legacy_phase_front_
            transitionSourceEdge
            transitionSourceEdges
            transitionSourceTopology
            sourceRouteEdges
            sourceRouteTopology
            sourceTopologyRegionByFace
            'struct SourceChartId'
            'struct SurfaceCellSourceChart'
          )
          for p in "${patterns[@]}"; do
            echo "### PATTERN: $p"
            git grep -n -F -- "$p" -- include src tests CMakeLists.txt cmake || true
          done
          echo "--- related authority/product definitions ---"
          git grep -n -E -- \
            'SurfaceTopologyRegion|SourceTopologyRegions|SurfaceIsolationSeamTransportCertificate|SurfacePeriodicHolonomy|SurfacePhaseFrontResult|SurfacePhaseFrontCell|SurfaceFrontEdge|SourceChartId|SurfacePointSourceSupport|LegacyAuthorityAdapters' \
            -- include/directional src/authority src/geometry src/pipeline src/validation tests || true
          echo "--- domain-error terminology ---"
          git grep -n -E -- 'NegativeLegacyValue|OutOfRangeLegacyValue|legacyValue' -- include src tests || true
          echo "M1 source audit end: $(date -u +%FT%TZ)"

      - name: Export exact audited source
        shell: bash
        run: |
          set -Eeuo pipefail
          LOG="$RUNNER_TEMP/m1-audit/activity.log"
          exec > >(tee -a "$LOG") 2>&1
          git archive --format=tar.gz --output="$RUNNER_TEMP/m1-audit/source.tar.gz" "$GITHUB_SHA"
          sha256sum "$RUNNER_TEMP/m1-audit/source.tar.gz" | tee "$RUNNER_TEMP/m1-audit/source.sha256"

      - name: Upload persistent audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m1-cutover-source-audit-${{ github.run_id }}
          path: ${{ runner.temp }}/m1-audit
          if-no-files-found: error
          retention-days: 7
