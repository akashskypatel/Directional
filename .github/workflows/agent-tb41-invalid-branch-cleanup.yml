name: Agent TB41 Invalid Branch Cleanup

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/tb41-invalid-branch-cleanup/trigger.json

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: agent-tb41-invalid-branch-cleanup
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/agent-tb41-invalid-branch-cleanup.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: tb41-invalid-branch-cleanup
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  cleanup:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Initialize diagnostic log
        shell: bash
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/tb41-invalid-branch-cleanup.log"
          : > "$log"
          printf '%s\n' "run_id=${GITHUB_RUN_ID}" "event_sha=${GITHUB_SHA}" "runtimeExecution=false" | tee -a "$log"
      - name: Delete accidental branch ref
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
        shell: bash
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/tb41-invalid-branch-cleanup.log"
          exec > >(tee -a "$log") 2>&1
          gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/_invalid_should_not_use"
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/_invalid_should_not_use" >/dev/null 2>&1; then
            echo 'accidental branch still exists' >&2
            exit 2
          fi
          echo 'accidental_branch_deleted=true'
      - name: Upload diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tb41-invalid-branch-cleanup-log-${{ github.run_id }}
          path: ${{ runner.temp }}/tb41-invalid-branch-cleanup.log
          if-no-files-found: error
          retention-days: 7
