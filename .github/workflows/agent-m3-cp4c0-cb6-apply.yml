name: Agent M3 CP4c0 CB6 Patch Apply

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m3-cp4c0-cb6-apply.txt

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

concurrency:
  group: agent-m3-cp4c0-cb6-apply
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/agent-m3-cp4c0-cb6-apply.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m3-cp4c0-cb6-apply
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  apply:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1wDBy3O8f6lLLE3Byh7sMfYrJqQKMd5Lm
      patch_sha256: 2491cca9dd8ae240e2d2a83acff59eccca3f9f8182d741c2886ccab86f7352ea
      base_sha: 048104e567e0b708b0241f85bcfb755c7b35c2fb
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: "test: add M3 CP4c-0 CB6 diagnostics"
    secrets: inherit
