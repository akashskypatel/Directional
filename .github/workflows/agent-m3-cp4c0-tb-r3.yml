name: M3 CP4c0 TB-R3 Artifact-Only Test Benchmark
on:
  push:
    branches: [agent/surface_cell_quad/p5-recover-bridge-healing]
    paths: [.agents/connector-triggers/m3-cp4c0-tb-r3.txt]
permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: write
concurrency:
  group: m3-cp4c0-tb-r3-${{ github.ref }}
  cancel-in-progress: false
env:
  PACKAGE_ARTIFACT_ID: "9589508430"
  PACKAGE_SHA256: 7bb4bd1a40af68ffd1e2ce06001490d61504e6ed0300505646c0abce97693015
  EVIDENCE_SOURCE_SHA: b135e219ee9269a73eaee32992d80c3921318011
  SELECTOR_SHA256: d588cae09067de6914aa1cb917716b11bae01e9f3b45910dbe0faa7d0c7a8116
  PREFIX316_SHA256: 601ce2b6a4aa2b0cda971e06e9378ebccba5fa75a9b416407447f7ed3600193c
  PREFIX328_SHA256: cf93622ea8807b26037d2fb6305adf721a23724bc519886c455e98c49c5f3600
  SELECTOR_PATH: .agents/Directional/Architecture_M3_CP4c0_Required_Green_Selector.txt
  RUNNER_PATH: .agents/Directional/turn-payloads/m3-cp4c0-tb-r3/execute.sh
  SUPPLEMENTAL_1: ResolvedBranchCorrection.NetworkDiagnosticsContainNoControlCharactersForAnyCode
  SUPPLEMENTAL_2: ResolvedBranchCorrection.TracingPathNeverPublishesSeedIdentityAsFailureLocus
jobs:
  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m3-cp4c0-tb-r3
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/agent-m3-cp4c0-tb-r3.yml
      source_ref: ${{ github.sha }}
    secrets: inherit
  test-benchmark:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Initialize persistent diagnostic log
        shell: bash
        run: |
          set -euo pipefail
          : > "${RUNNER_TEMP}/m3-cp4c0-tb-r3.log"
          printf '%s\n' "workflow=$GITHUB_WORKFLOW" "run_id=$GITHUB_RUN_ID" \
            "event=$GITHUB_EVENT_NAME" "event_sha=$GITHUB_SHA" "ref=$GITHUB_REF" \
            "evidence_source=$EVIDENCE_SOURCE_SHA" "package_artifact=$PACKAGE_ARTIFACT_ID" \
            'turnBoundary=artifact-only-Test+Benchmark' 'configure=false' 'compile=false' \
            'relink=false' 'repair=false' 'generatedDiscovery=false' 'performanceBenchmark=false' | \
            tee -a "${RUNNER_TEMP}/m3-cp4c0-tb-r3.log"
      - name: Checkout exact control and fixture source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          token: ${{ secrets.GH_TOKEN || github.token }}
      - name: Execute frozen TB-R3 plan
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
        shell: bash
        run: bash "$RUNNER_PATH"
      - name: Upload TB-R3 result evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-cp4c0-tb-r3-results-${{ github.run_id }}
          path: ${{ runner.temp }}/m3-cp4c0-tb-r3/results
          if-no-files-found: error
          retention-days: 14
      - name: Record final TB-R3 status
        if: always()
        shell: bash
        run: |
          set +e
          { echo "final_job_status=${{ job.status }}"; echo "event_sha=$GITHUB_SHA"; \
            echo "evidence_source=$EVIDENCE_SOURCE_SHA"; echo "package_artifact=$PACKAGE_ARTIFACT_ID"; \
            echo "finished_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"; } | \
            tee -a "${RUNNER_TEMP}/m3-cp4c0-tb-r3.log"
      - name: Upload TB-R3 diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-cp4c0-tb-r3-log-${{ github.run_id }}
          path: ${{ runner.temp }}/m3-cp4c0-tb-r3.log
          if-no-files-found: error
          retention-days: 14
      - name: Fail closed on red gate, supplemental checks, or Q8
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          summary="${RUNNER_TEMP}/m3-cp4c0-tb-r3/results/summary.env"
          test -f "$summary"
          source "$summary"
          test "$gate" = PASS
          test "$supplemental_gate" = PASS
          test "$q8" = PASS
