name: M4 CP SCALE TB13 REV Apply

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m4-cp-scale-tb13-rev-apply-20260918.txt

permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

concurrency:
  group: m4-cp-scale-tb13-rev-apply
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/m4-cp-scale-tb13-rev-apply.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m4-cp-scale-tb13-rev-apply
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  apply:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1rc4jT1x1IqjKWD9Hy3Zn-gz2VlUgQEph
      patch_sha256: 15fa259555cfd4320400fdb9fe57b457ad8a85d5e6ad813ad9da0f60d07a1b6d
      base_sha: e0b07852dca535628fa59c13ef670578d8a0a459
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: "M4-CP-SCALE-TB13-REV: promote selector427 and close CP-SCALE"
      retention_days: 14
    secrets: inherit
