name: M6 CP1 TB8 A6 Review Closeout Apply

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m6-cp1-tb8-a6-rev-closeout.txt

permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

concurrency:
  group: m6-cp1-tb8-a6-rev-closeout-${{ github.ref }}
  cancel-in-progress: false

jobs:
  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m6-cp1-tb8-a6-rev-closeout
      commit_run_file: false
      trim_stale_comments: false
    secrets: inherit

  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/m6-cp1-tb8-a6-rev-closeout.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  apply:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1WN1y2VHtNJ55Jin1eVbWBilygkrkczCe
      patch_sha256: 9064dbda78263b939fabf946c98a658c831b7291821a9315aa0755aec5207ac0
      base_sha: c13d157f0175c1f3d99266dd78c645aea37310d8
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: "M6-CP1-TB8-A6-REV: accept recovery and promote runtime"
    secrets: inherit
