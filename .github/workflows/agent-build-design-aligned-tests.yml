name: Agent Gate 1 Uniform Phase-Front Code Build

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/g1-uniform-phase-front-cb-20260806-1043.txt

permissions:
  contents: write

concurrency:
  group: gate1-uniform-phase-front-cb-20260806-1043
  cancel-in-progress: false

env:
  BRANCH: agent/surface_cell_quad/p5-recover-bridge-healing
  LOG_DIR: /tmp/g1-phase-front-build-logs
  LOG: /tmp/g1-phase-front-build-logs/activity.log
  TRIGGER: .agents/connector-triggers/g1-uniform-phase-front-cb-20260806-1043.txt
  BUILD_SCRIPT_PAYLOAD: .agents/Directional/turn-payloads/g1-build.sh.gz.b64
  PATCH_PAYLOAD: .agents/Directional/turn-payloads/g1-uniform-phase-front.patch.gz.b64

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Initialize persistent activity log
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$LOG_DIR"
          {
            echo 'Gate 1 uniform phase-front compile-only Code + Build turn'
            echo "run_id=$GITHUB_RUN_ID"
            echo "run_attempt=$GITHUB_RUN_ATTEMPT"
            echo "event_name=$GITHUB_EVENT_NAME"
            echo "event_sha=$GITHUB_SHA"
            echo "ref=$GITHUB_REF"
            echo "repository=$GITHUB_REPOSITORY"
            echo "actor=$GITHUB_ACTOR"
            echo "runner_os=$RUNNER_OS"
            echo "runner_arch=$RUNNER_ARCH"
            echo "started_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } | tee "$LOG"

      - name: Checkout exact event commit and recursive submodules
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 50
          submodules: recursive
          persist-credentials: true

      - name: Verify authority and execute compile-only payload
        shell: bash
        run: |
          set -Eeuo pipefail
          exec > >(tee -a "$LOG") 2>&1
          finish() {
            rc=$?
            trap - EXIT
            set +x
            echo "task_exit_code=$rc"
            echo "task_finished_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git status --short --branch || true
            git submodule status --recursive || true
            df -h . || true
            free -h || true
            du -sh build/agent-g1-release artifact 2>/dev/null || true
            exit "$rc"
          }
          trap finish EXIT
          set -x

          test "$GITHUB_REF_NAME" = "$BRANCH"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -f "$TRIGGER"
          test -f "$BUILD_SCRIPT_PAYLOAD"
          test -f "$PATCH_PAYLOAD"
          test -z "$(git status --porcelain=v1)"

          printf '%s\n' '--- trigger marker ---'
          cat "$TRIGGER"
          printf '%s\n' '--- tool versions ---'
          git --version
          cmake --version
          ninja --version
          c++ --version
          python3 --version

          printf '%s  %s\n' "$(sha256sum "$BUILD_SCRIPT_PAYLOAD" | cut -d' ' -f1)" "$BUILD_SCRIPT_PAYLOAD"
          printf '%s  %s\n' "$(sha256sum "$PATCH_PAYLOAD" | cut -d' ' -f1)" "$PATCH_PAYLOAD"

          base64 --decode "$BUILD_SCRIPT_PAYLOAD" | gzip --decompress > /tmp/g1-build.sh
          chmod +x /tmp/g1-build.sh
          /tmp/g1-build.sh

      - name: Append final workflow status
        if: always()
        shell: bash
        run: |
          mkdir -p "$LOG_DIR"
          {
            echo "job_status=${{ job.status }}"
            echo "footer_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git status --short --branch 2>/dev/null || true
            df -h . || true
            free -h || true
          } | tee -a "$LOG"

      - name: Upload compile artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: surface-cell-g1-uniform-phase-front-linux-release
          path: artifact
          if-no-files-found: error
          retention-days: 30
          compression-level: 6

      - name: Always upload detailed workflow logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surface-cell-g1-uniform-phase-front-build-logs-${{ github.run_id }}
          path: /tmp/g1-phase-front-build-logs
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
