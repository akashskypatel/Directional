name: M3 CP4c3 TB44 Drive Bootstrap

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m3-cp4c3-tb44-drive-bootstrap-20260908.txt

permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

concurrency:
  group: m3-cp4c3-tb44-drive-bootstrap
  cancel-in-progress: false

jobs:
  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m3-cp4c3-tb44-drive-bootstrap
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  bootstrap:
    runs-on: ubuntu-24.04
    steps:
      - name: Initialize diagnostic log
        shell: bash
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/tb44-drive-bootstrap.log"
          : > "$log"
          printf '%s\n' \
            "workflow=${GITHUB_WORKFLOW}" \
            "run_id=${GITHUB_RUN_ID}" \
            "event=${GITHUB_EVENT_NAME}" \
            "event_sha=${GITHUB_SHA}" \
            "runtimeExecution=false" \
            "started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" | tee -a "$log"

      - name: Authenticate to Google Drive
        id: auth
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ secrets.GOOGLE_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GOOGLE_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/drive
          create_credentials_file: false

      - name: Create service-account staging file
        id: create
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        shell: bash
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/tb44-drive-bootstrap.log"
          exec > >(tee -a "$log") 2>&1
          meta="${RUNNER_TEMP}/drive-file.json"
          perm="${RUNNER_TEMP}/drive-permission.json"
          curl --fail-with-body --silent --show-error --location \
            --request POST \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H 'Content-Type: application/json' \
            'https://www.googleapis.com/drive/v3/files?fields=id,name,capabilities&supportsAllDrives=true' \
            --data '{"name":"Directional__M3-CP4c-3-TB44-EXEC-CLOSEOUT__service-account-staging.patch","mimeType":"text/x-diff"}' \
            -o "$meta"
          file_id="$(jq -r '.id // empty' "$meta")"
          test -n "$file_id"
          curl --fail-with-body --silent --show-error --location \
            --request POST \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H 'Content-Type: application/json' \
            "https://www.googleapis.com/drive/v3/files/${file_id}/permissions?fields=id,type,role&supportsAllDrives=true" \
            --data '{"type":"anyone","role":"writer"}' \
            -o "$perm"
          permission_id="$(jq -r '.id // empty' "$perm")"
          test -n "$permission_id"
          echo "file_id=${file_id}" >> "$GITHUB_OUTPUT"
          echo "permission_id=${permission_id}" >> "$GITHUB_OUTPUT"
          echo "staging_file_created=yes"
          echo "temporary_public_writer_permission=yes"

      - name: Write bootstrap result
        if: always()
        env:
          FILE_ID: ${{ steps.create.outputs.file_id }}
          PERMISSION_ID: ${{ steps.create.outputs.permission_id }}
        shell: bash
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP}/tb44-drive-bootstrap-result"
          mkdir -p "$out"
          printf '%s\n' \
            "event_sha=${GITHUB_SHA}" \
            "file_id=${FILE_ID:-unavailable}" \
            "permission_id=${PERMISSION_ID:-unavailable}" \
            "temporary_public_writer_permission=yes" \
            "runtimeExecution=false" \
            "job_status=${{ job.status }}" \
            "finished_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" > "${out}/result.env"
          cat "${out}/result.env" | tee -a "${RUNNER_TEMP}/tb44-drive-bootstrap.log"

      - name: Upload bootstrap result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-cp4c3-tb44-drive-bootstrap-result-${{ github.run_id }}
          path: ${{ runner.temp }}/tb44-drive-bootstrap-result
          if-no-files-found: error
          retention-days: 7

      - name: Upload diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-cp4c3-tb44-drive-bootstrap-log-${{ github.run_id }}
          path: ${{ runner.temp }}/tb44-drive-bootstrap.log
          if-no-files-found: error
          retention-days: 7
