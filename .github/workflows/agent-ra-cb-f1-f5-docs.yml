name: Agent RA-CB-F1-F5 Docs

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/ra-cb-f1-f5-docs-20260812.txt

permissions:
  contents: write

concurrency:
  group: agent-ra-cb-f1-f5-docs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  closeout:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Initialize persistent activity log
        shell: bash
        run: |
          set -euo pipefail
          : > "$RUNNER_TEMP/activity.log"
          printf '%s\n' \
            "workflow=$GITHUB_WORKFLOW" \
            "run_id=$GITHUB_RUN_ID" \
            "event=$GITHUB_EVENT_NAME" \
            "ref=$GITHUB_REF" \
            'turnBoundary=Code+Build-documentation-closeout' \
            'runtimeExecution=false' \
            'task=close RA-CB-F1 through RA-CB-F5 at Code+Build boundary' \
            | tee -a "$RUNNER_TEMP/activity.log"

      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/surface_cell_quad/p5-recover-bridge-healing
          fetch-depth: 0

      - name: Update durable closeout state
        shell: bash
        env:
          COMPILED_SOURCE_SHA: 555109796188b318c788ef5777f622705ee0aa94
        run: |
          set -euo pipefail
          exec > >(tee -a "$RUNNER_TEMP/activity.log") 2>&1
          trap 'rc=$?; echo "exit_code=$rc"; git status --porcelain=v1 || true; exit $rc' EXIT

          git merge-base --is-ancestor "$COMPILED_SOURCE_SHA" HEAD
          git diff --exit-code "$COMPILED_SOURCE_SHA"..HEAD -- \
            src include tests CMakeLists.txt cmake

          python3 - <<'PY'
          from pathlib import Path

          todo = Path('TODO.md')
          lines = todo.read_text().splitlines()
          out = []
          found = {'f1': 0, 'step3': 0, 'f3': 0, 'f4': 0, 'f5': 0}
          for line in lines:
              if line.startswith('  - [ ] **RA-CB-F1 —'):
                  found['f1'] += 1
                  out.append('  - [x] **RA-CB-F1 — isolated retained source-authority lifetime contract.** Code + Build complete at implementation `38d8d7d3e97f3b496e63979cb1348ed2cda304bc`: `PostMoveSingleComponentOptimizerUsesRetainedSourceAuthority` now drives `remesh_from_raw_cross_field` on one connected mesh, requires exact `matches_source_faces`, and rejects `MissingSourceAuthority` without depending on aggregate merge success. The R-A probe is repointed to this contract.')
                  out.append('  - [x] **RA-CB-F2 — carry exact completion/stitch discrimination reasons into attempt 3.** The artifact-only execution plan now records `CoincidentPositionsOnDistinctTypedSheetsDoNotMerge` as successful non-merge discrimination (`success=true`, two connected components, `mergedBoundaryVertices=0`), requires `InvalidTypedStitchAuthority` for `WrongOwnerSheetCertificatePublishesNothing`, requires `IncompatibleTypedStitchAuthority` for `SameExactBoundaryKeyRejectsIncompatibleTypedLineage`, and includes the new same-region/sheet distinct-support negative with the same exact incompatibility reason.')
              elif line.startswith('  - [ ] **Step 3 retry attempt 3 —'):
                  found['step3'] += 1
                  out.append('  - [ ] **Step 3 retry attempt 3 — immutable artifact-only R-A Test + Benchmark** against fresh package `9167759672 / 9167759825` from exact source `555109796188b318c788ef5777f622705ee0aa94` (compile run/job `31665352874 / 94338607395`). No rebuild, source/test/fixture mutation, or package repair. Zero-selected discovery is orchestration failure. Execute the amended per-contract completion/stitch reason capture and the newly compiled RA-CB-F1/F3/F4/F5 contracts. R-A remains open until this gate passes organically.')
              elif line.startswith('  - [ ] **RA-CB-F3 —'):
                  found['f3'] += 1
                  out.append('  - [x] **RA-CB-F3 — same region/sheet still rejects genuinely different completed supports.** Added compiled negative `SameRegionSheetDifferentCompletedSupportsRejectTypedStitchCompatibility`: both patches complete under the same typed region/sheet, their completed lineage support differs, and stitching must fail with `IncompatibleTypedStitchAuthority` and publish no mesh. Runtime execution remains pending by turn policy.')
              elif line.startswith('  - [ ] **RA-CB-F4 —'):
                  found['f4'] += 1
                  out.append('  - [x] **RA-CB-F4 — anti-stale boundary identity contract made falsifiable.** `DisconnectedAggregationDoesNotPublishStalePreRemapIdentityCaches` now requires boundary-cache cardinality, each identity to be valid, and each boundary identity to equal the matching lineage canonical; the preserved-cardinality stale-token fixture also requires rebuild count `0`. The missing-cardinality positive requires the exact completed-patch rebuild count rather than merely `> 0`.')
              elif line.startswith('  - [ ] **RA-CB-F5 —'):
                  found['f5'] += 1
                  out.append('  - [x] **RA-CB-F5 — component feature-edge remap is conserved and typed.** Global hard/soft requests are canonicalized, assigned only to a unique component that owns the actual source edge, and accounted as requested/remapped/unassigned. Cross-component/stale/non-edge requests can no longer disappear silently; unassigned hard requests fail closed at `component-feature-remap` with `UnassignedUserHardFeatureEdge`, while unassigned soft requests remain explicitly typed and counted. Compiled contracts require hard/soft conservation and no cross-component leakage.')
              else:
                  out.append(line)
          if found != {'f1': 1, 'step3': 1, 'f3': 1, 'f4': 1, 'f5': 1}:
              raise SystemExit(f'unexpected TODO match counts: {found}')
          todo.write_text('\n'.join(out) + '\n')

          handoff = Path('.agents/Directional/Future_Chat_Session_Handoff.md')
          text = handoff.read_text()
          replacements = {
              'Implementation commit: `a6723f34707701fc1174c0889028327ff8666c9a`': 'Implementation commit: `38d8d7d3e97f3b496e63979cb1348ed2cda304bc`',
              'Exact compile/evidence source: `f6514a0f8496bd18aacfceb419e2e5ae5b3b6fae`': 'Exact compile/evidence source: `555109796188b318c788ef5777f622705ee0aa94`',
              'Compile run/job: `31662246531 / 94329268203`': 'Compile run/job: `31665352874 / 94338607395`',
              'Compile result artifact: `9166639250`, SHA-256 `ae09e4cca21232316e31cc7f40aa341fc28edb440bb5cf622554f476cc9815c4`': 'Compile result artifact: `9167759672`, SHA-256 `96401aac27a3a231533a785d107cb023cf50a304d06e821585e7c44597c6beb6`',
              'Compile log artifact: `9166639427`, SHA-256 `5cd2f9f0aaab8ad143243ae273a6a7a10129ae9efd68d0aff45f7d38c1188d1c`': 'Compile log artifact: `9167759825`, SHA-256 `ed859f380103b183fda2241c71ff877fa0bbc3dc0c808f5c4f5f57290daadda8`',
              'The regenerated R-A inventory is **19 paths / 54 probes / 226 matches**, raw projection **22 allowed / 0 unexpected**, face-count **2 / 0**, pipeline `stitchIdentity` assignments **2 / 0**, classifier self-test **4/4**, final static **PASS**.': 'The regenerated R-A inventory is **19 paths / 59 probes / 245 matches**, raw projection **22 allowed / 0 unexpected**, face-count **2 / 0**, pipeline `stitchIdentity` assignments **2 / 0**, classifier self-test **4/4**, final static **PASS**.',
              '- Overall R-A remains **open / runtime-pending** for fresh candidate `f6514a0f8496bd18aacfceb419e2e5ae5b3b6fae`. Compile success is not semantic acceptance.': '- Overall R-A remains **open / runtime-pending** for fresh candidate `555109796188b318c788ef5777f622705ee0aa94`. Compile success is not semantic acceptance.',
              '- Fresh source/static evidence is **19 paths / 54 probes / 226 matches**, final static **PASS**. Fresh compile run/job `31662246531 / 94329268203` produced artifacts `9166639250 / 9166639427` with **118/118**, manifest **25/25**, five empty source-status snapshots, and no generated runtime execution.': '- Fresh source/static evidence is **19 paths / 59 probes / 245 matches**, final static **PASS**. Fresh compile run/job `31665352874 / 94338607395` produced artifacts `9167759672 / 9167759825` with **118/118**, manifest **25/25**, five empty source-status snapshots, and no generated runtime execution.',
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f'handoff replacement count != 1: {old[:60]}')
              text = text.replace(old, new, 1)

          old_review = '**Independent re-evaluation of CB-00 through CB-04 against retry-2 runtime evidence (head `9f27a7d`; implementation `a6723f34`, byte-identical to compile-pinned `f6514a0f` on all source/test/audit paths): CB-01, CB-03, CB-04 runtime-confirmed; CB-00 vindicated; CB-02 correctly deferred.** The 61/87 → 76/88 improvement carries no weakened strict check. **Land RA-CB-F1 before attempt 3** — `PostMoveAggregateOptimizerUsesRetainedSourceAuthority` failed in retry 2 *even though CB-01 is correct*, because it gates on aggregate success and asserts on the merge-built global owner rather than the per-component copy it is named for; it is a probe-pinned contract now reporting an unrelated blocker. **Carry RA-CB-F2 into attempt 3**: record per-contract rejection reasons for the three faces-only completion negatives. **RA-CB-F3/F4/F5 must land before R-A closes** — chart-closure discrimination through the production path, a boundary-identity anti-stale assertion that an empty identity cannot satisfy, and conservation for component feature-edge remap, which currently drops unmatched user hard/soft edges silently.'
          new_review = '**RA-CB-F1 through RA-CB-F5 are Code + Build complete at implementation `38d8d7d3e97f3b496e63979cb1348ed2cda304bc`.** The post-move lifetime contract is isolated from aggregate success; the retry plan carries exact completion/stitch discrimination reasons; a same-region/sheet different-support negative remains fail-closed; boundary-cache anti-stale coverage now proves valid canonical publication and exact rebuild accounting; component hard/soft edge transport is conserved with typed unassigned diagnostics and hard-edge fail-closed behavior. These semantic contracts are compiled, not executed.'
          if text.count(old_review) != 1:
              raise SystemExit('old RA-CB review paragraph not found exactly once')
          text = text.replace(old_review, new_review, 1)

          old_section = '- Section 0J is Code + Build complete: aggregate identity rebuild now reports exact sub-invariants and reconstructs missing/stale boundary-node caches from remapped completion-owned lineage; component hard/soft feature options are remapped from original-global to compact-local ownership with cross-component edges discarded; final-oracle counterfactual expectations remain unchanged.'
          new_section = '- Section 0J plus RA-CB-F1 through RA-CB-F5 are Code + Build complete: aggregate identity rebuild remains canonical/fail-closed; retained source-authority lifetime is isolated from aggregate success; completion/stitch discrimination is explicitly reason-captured; anti-stale boundary-cache publication is falsifiable; and component hard/soft feature transport is conserved with typed unassigned accounting.'
          if text.count(old_section) != 1:
              raise SystemExit('section 0J status line not found exactly once')
          text = text.replace(old_section, new_section, 1)

          old_runtime = '- Actual aggregate/final-oracle reachability and closure of the prior 12 semantic failures are intentionally unclaimed until the immutable Test + Benchmark retry executes this exact package.'
          new_runtime = '- Actual runtime acceptance of the RA-CB-F1/F3/F4/F5 semantic contracts, amended reason capture, aggregate/final-oracle reachability, and closure of prior retry-2 failures are intentionally unclaimed until immutable Test + Benchmark retry attempt 3 executes this exact package.'
          if text.count(old_runtime) != 1:
              raise SystemExit('runtime-pending line not found exactly once')
          text = text.replace(old_runtime, new_runtime, 1)
          handoff.write_text(text)

          changelog = Path('.agents/Directional/CHANGELOG.md')
          text = changelog.read_text()
          marker = '## [Unreleased]\n'
          if text.count(marker) != 1:
              raise SystemExit('unreleased changelog marker not unique')
          entry = '''## [Unreleased]\n\n### Fixed — RA-CB-F1 through RA-CB-F5 independent-review remediation\n\n- Replaced the aggregate-coupled post-move source-authority probe with a single-connected-mesh contract that isolates the retained typed owner and rejects `MissingSourceAuthority` without requiring aggregate success.\n- Strengthened aggregate boundary-cache coverage so every published boundary identity must be valid and equal to completion-owned canonical lineage; exact rebuild accounting now distinguishes missing-cardinality reconstruction from canonical refresh.\n- Added a same-region/sheet, genuinely different completed-support stitch negative requiring `IncompatibleTypedStitchAuthority`; amended the artifact-only retry plan to retain exact per-contract completion/stitch discrimination outcomes.\n- Replaced silent component feature-edge dropping with canonical request accounting across actual component source edges. Hard/soft requests publish requested/remapped/unassigned counts and a typed first unassigned issue; an unassigned hard request fails closed before component execution while soft unassigned requests remain explicitly accounted.\n\n### Validation — RA-CB-F1 through RA-CB-F5 Code + Build\n\n- Implementation commit `38d8d7d3e97f3b496e63979cb1348ed2cda304bc`; exact clean compile source `555109796188b318c788ef5777f622705ee0aa94`. Regenerated R-A inventory: **19 paths / 59 probes / 245 matches**, raw projection **22/0**, face-count **2/0**, pipeline `stitchIdentity` assignments **2/0**, classifier self-test **4/4**, final static **PASS**.\n- Compile run/job `31665352874 / 94338607395` completed Release/static/Ninja/PRE_TEST **118/118**, build exit `0`. Result artifact `9167759672` SHA-256 `96401aac27a3a231533a785d107cb023cf50a304d06e821585e7c44597c6beb6`; log artifact `9167759825` SHA-256 `ed859f380103b183fda2241c71ff877fa0bbc3dc0c808f5c4f5f57290daadda8`. The package contains **26** files with recursive self-excluding manifest **25/25**, five empty source-status snapshots, and `runtimeExecution=false`.\n- No generated Directional binary, test, benchmark, discovery command, `ctest`, CLI, fuzzer, help/version command, or custom input executed. R-A remains open; the mandatory next cadence is immutable artifact-only retry attempt 3 against this package.\n'''
          text = text.replace(marker, entry, 1)
          changelog.write_text(text)
          PY

          git diff --check
          git diff --name-only | sort > "$RUNNER_TEMP/changed-files.txt"
          cat > "$RUNNER_TEMP/expected-files.txt" <<'EOF'
          .agents/Directional/CHANGELOG.md
          .agents/Directional/Future_Chat_Session_Handoff.md
          TODO.md
          EOF
          sort -o "$RUNNER_TEMP/expected-files.txt" "$RUNNER_TEMP/expected-files.txt"
          diff -u "$RUNNER_TEMP/expected-files.txt" "$RUNNER_TEMP/changed-files.txt"

          git config user.name 'Directional Agent'
          git config user.email 'directional-agent@users.noreply.github.com'
          git add TODO.md
          git add -f .agents/Directional/CHANGELOG.md \
            .agents/Directional/Future_Chat_Session_Handoff.md
          git commit -m 'docs: close RA-CB-F1 through RA-CB-F5'
          DOC_SHA="$(git rev-parse HEAD)"
          printf '%s\n' \
            "documentation_commit=$DOC_SHA" \
            "compiled_source=$COMPILED_SOURCE_SHA" \
            'runtimeExecution=false' \
            > "$RUNNER_TEMP/result.txt"
          git push origin HEAD:agent/surface_cell_quad/p5-recover-bridge-healing
          git status --porcelain=v1 | tee "$RUNNER_TEMP/source-status-final.txt"
          test ! -s "$RUNNER_TEMP/source-status-final.txt"

      - name: Upload closeout result
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ra-cb-f1-f5-docs-result-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/result.txt
            ${{ runner.temp }}/changed-files.txt
            ${{ runner.temp }}/source-status-final.txt
          if-no-files-found: error
          retention-days: 7

      - name: Upload persistent activity log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ra-cb-f1-f5-docs-log-${{ github.run_id }}
          path: ${{ runner.temp }}/activity.log
          if-no-files-found: error
          retention-days: 7
