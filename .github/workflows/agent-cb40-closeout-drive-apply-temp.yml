name: Agent CB40 Closeout Drive Apply Temp

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/cb40-closeout-drive-apply.txt

permissions:
  actions: read
  contents: write
  id-token: write
  issues: write
  pull-requests: write

concurrency:
  group: agent-cb40-closeout-drive-apply-temp
  cancel-in-progress: false

jobs:
  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: cb40-closeout-drive-apply
      commit_run_file: false
    secrets: inherit

  validate-caller:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/agent-cb40-closeout-drive-apply-temp.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  apply:
    needs: validate-caller
    if: ${{ needs.validate-caller.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1kmliuEb8xlgRMzn-G_6bYnbH-wA7wigO
      patch_sha256: a638030b620df4009f7e6efd669787a8dd9b67e24be247a4f05c782898af52c1
      base_sha: 23a753a83f0eda0447172ce96bcd3180bf95ae8a
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: "docs: close out M3-CP4c-3-CB40"
      retention_days: 14
    secrets: inherit
