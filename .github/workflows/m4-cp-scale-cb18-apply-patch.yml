name: M4 CP SCALE CB18 Apply Patch

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m4-cp-scale-cb18/apply-patch-20260918T0455Z.txt

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

concurrency:
  group: m4-cp-scale-cb18-apply-patch
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/m4-cp-scale-cb18-apply-patch.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m4-cp-scale-cb18-apply-patch
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  apply:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1fK7IuGrNV4is70fCcDLj3yvHCfH7sEHW
      patch_sha256: aec7d3d7764f5916ee8f47ae471970643ca30eb18a65f3a2b5a920448839a389
      base_sha: a4c29483b5f564f01245ca83dec0924f12c83352
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: "M4-CP-SCALE-CB18: bind separating hard-feature singularity ownership"
    secrets: inherit
