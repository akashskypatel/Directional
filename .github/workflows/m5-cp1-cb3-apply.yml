name: M5 CP1 CB3 Drive Patch Apply

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m5-cp1-cb3-apply-20260920.txt

permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

concurrency:
  group: m5-cp1-cb3-drive-apply-${{ github.ref }}
  cancel-in-progress: false

jobs:
  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m5-cp1-cb3-drive-apply
      commit_run_file: false
      trim_stale_comments: false
    secrets: inherit

  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/m5-cp1-cb3-apply.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  apply:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1s2w189bvC7NLou2nvp5QDJLhGjSwwRmB
      patch_sha256: 8060e01de16d44726dc520f60523733ff3bd749e219b7960f63a2afa2c6ea519
      base_sha: 9d4e04c9713f8accc74681873ca390d0cdfba6f2
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: 'test(surface-cells): correct M5 CP1 relation permutation witness'
      retention_days: 7
    secrets: inherit
