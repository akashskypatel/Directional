name: M3 CP4c-3 CB33 Drive Apply

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m3-cp4c-3-cb33-drive-apply.txt

permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

concurrency:
  group: m3-cp4c-3-cb33-drive-apply
  cancel-in-progress: false

jobs:
  validate-caller:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/m3-cp4c-3-cb33-drive-apply.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m3-cp4c-3-cb33-drive-apply
      commit_run_file: false
    secrets: inherit

  apply:
    needs: validate-caller
    if: ${{ needs.validate-caller.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1cxPOIfcnxW3fc_ckO6a5R30WDlHOwdzW
      patch_sha256: 136ed1d51febd36ecbcd37eb935a7721ee8ce19f47fd96b18ab6bdc273ff8d04
      base_sha: b580e2038707f1685876019b0828f0535c17be33
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: "orchestration: repair TB28-R3 identity routing and selection proof"
      retention_days: 14
    secrets: inherit
