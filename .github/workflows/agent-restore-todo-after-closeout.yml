name: Agent Restore TODO After Closeout

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/restore-todo-after-closeout.txt

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 20
          submodules: false
      - name: Restore exact durable TODO content
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin 8b059a7f940de611d6b163b1bd055ed59d0668b2
          git show 8b059a7f940de611d6b163b1bd055ed59d0668b2:TODO.md > "$RUNNER_TEMP/TODO.expected"
          cp "$RUNNER_TEMP/TODO.expected" TODO.md
          cmp TODO.md "$RUNNER_TEMP/TODO.expected"
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add TODO.md
          git commit -m 'fix: restore durable TODO after connector write error'
          git push origin "HEAD:${GITHUB_REF_NAME}"
          git status --porcelain=v1 | tee "$RUNNER_TEMP/status.txt"
          test ! -s "$RUNNER_TEMP/status.txt"
          echo 'runtimeExecution=false'
