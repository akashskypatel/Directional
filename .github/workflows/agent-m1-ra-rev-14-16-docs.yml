name: Agent M1 R-A REV-14-16 Durable Records

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m1-ra-rev-14-16-docs.txt

permissions:
  contents: write

jobs:
  sync-records:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact trigger authority
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2

      - name: Apply and publish durable records
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 - <<'PY'
          from pathlib import Path
          import re

          source = "cb848e4dde30bcbe19dcd5d07a408edb2a47dd6e"
          run = "31602025466"
          job = "94131563590"
          result_artifact = "9143819164"
          log_artifact = "9143819888"
          result_sha = "e3213d8ed94121e734b69ed17f64501a3a059b64ccfa3cbb6be48a1a98c83e13"
          log_sha = "c2d0cbc28a296590f22a343aed9173a3e363e1cdb5a53ee198ae4a8dc5e44aa6"

          todo = Path("TODO.md")
          text = todo.read_text()
          start = text.index("- [ ] **Complete the M1 single-authority cutover.**")
          end = text.index("- [ ] **Produce one fresh full R-A-through-R-G Code + Build package.**")
          replacement = f'''- [ ] **Complete the M1 single-authority cutover.**
            - Latest complete-gate review: PR #8 through branch head `344f996622606121a9567beaf1dad4001a5374f3`; latest review-remediation compile source `{source}`. R-A is **not complete** until the complete closure inventory below is rerun and clean. Historical REV-01-through-16 checkpoints and exact artifacts remain in `CHANGELOG.md`.
            - [x] R-A-REV-14: collision publication now emits one canonical post-intersection typed authority; derived authoritative identity and face-lineage ownership are recomputed from that final authority, with overlapping-compatible publication and disjoint-rejection contracts compiled.
            - [x] R-A-REV-15: component region/sheet/chart/support remap now uses independent domains and owner relations derived from published source topology/chart authority; sparse, out-of-domain, wrong-owner, and wrong-face authority fails closed before publication.
            - [x] R-A-REV-16: the production counterfactual seam mutates raw projection labels before real aggregation, compares full semantic/hash/downstream validation output, and pairs zero-publication malformed-authority coverage with a repository-wide classified read/write/remap-domain audit.
            - Partial Code + Build checkpoint: source `{source}`; run/job `{run} / {job}`; result/log artifacts `{result_artifact} / {log_artifact}`; Release/static/Ninja/PRE_TEST **118/118**; independently verified self-excluding manifest **21/21** and five empty source-status snapshots; semantic contracts compiled but not executed; no generated Directional runtime executed.
            - [ ] Re-run the complete R-A closure inventory and mark R-A complete only when every gate item is statically clean.
            - [ ] Complete R-B row-independent face/support/chart identity.
            - [ ] Complete R-C immutable published products and typed certificate construction.
            - [ ] Complete R-D checked ingress and delete compatibility/numeric read-back bridges.
            - [ ] Complete R-E typed semantic owners and lookups.
            - [ ] Complete R-F intent-complete compiled contracts.
            - [ ] Complete R-G expanded failing source audit.
          '''
          # normalize accidental indentation from Python source
          replacement = "\n".join(line[10:] if line.startswith("          ") else line for line in replacement.splitlines()) + "\n"
          todo.write_text(text[:start] + replacement + text[end:])

          handoff = Path(".agents/Directional/Future_Chat_Session_Handoff.md")
          text = handoff.read_text()
          old_start = text.index("The complete R-A closure review through branch head `344f996622606121a9567beaf1dad4001a5374f3`")
          old_end = text.index("Do not validate, relabel, repair, or reuse any historical/partial package", old_start)
          next_block = f'''R-A-REV-01 through R-A-REV-16 are compile-closed for their reviewed paths at latest review-remediation source `{source}`, but R-A itself remains open. The next turn must:

          1. rerun the **complete R-A source inventory** across occurrence/materializer, completion/assembly and post-intersection collision publication, patch/lineage, arrangement ownership/chart transitions, public optimizer/verifier APIs, source-authoritative validation, rail consumers, generic validation boundaries, top-level component aggregation, independent remap domains/owner relations, pre-aggregation raw counterfactual behavior, and fail-closed zero-publication paths, and call R-A complete only if every closure item is statically clean;
          2. complete R-B through R-G in the same vertical cutover;
          3. produce one fresh full Release/static/Ninja/PRE_TEST package using the independently verified out-of-tree, clean-provenance, self-excluding-manifest rules;
          4. execute no generated Directional binary, discovery, test, benchmark, `ctest`, CLI, fuzzer, or custom input; activate the artifact-only plan only after that fresh full package exists.

          '''
          next_block = "\n".join(line[10:] if line.startswith("          ") else line for line in next_block.splitlines()) + "\n"
          text = text[:old_start] + next_block + text[old_end:]

          status_start = text.index("### R-A closure status")
          status_end = text.index("## Standing product and regression state", status_start)
          status = f'''### R-A closure status

          Review boundary that introduced REV-14 through REV-16: PR #8 through `344f996622606121a9567beaf1dad4001a5374f3`. Latest review-remediation implementation/compile source: `{source}`. R-A-REV-14 through R-A-REV-16 are compile-closed for their reviewed paths:

          - `R-A-REV-14`: exact-key collision publication uses the final intersected typed certificate as the single authority; the derived authoritative identity and canonical face-owner cycles are regenerated from that result. Overlapping-compatible and disjoint-incompatible contracts are compile-visible.
          - `R-A-REV-15`: component aggregation builds independent region/sheet/chart/support remap domains from published source authority, validates ownership and face relations before staging output, and rejects invalid authority with zero publication.
          - `R-A-REV-16`: a narrow production-owned pre-aggregation counterfactual exposes raw-label tamper to the real consumer and compares complete semantic/hash/downstream authority-validation output; malformed typed authority rejects before publication; the repository-wide audit classifies affected raw component/sheet reads and checks the remap/collision/counterfactual bodies.

          Compile-only run/job `{run} / {job}` completed Release/static/Ninja/PRE_TEST **118/118** from exact source `{source}`. Result artifact `{result_artifact}` has outer SHA-256 `{result_sha}`; log artifact `{log_artifact}` has outer SHA-256 `{log_sha}`. Independent inspection verified exact packaged source, a self-excluding manifest **21/21**, all five source-status snapshots empty, `semanticContracts=compiled-not-executed`, and `runtimeExecution=false`.

          Initial run/job `31601748377 / 94130625219` stopped before source application/audit/compile because the temporary final transfer chunks lacked a trailing newline and failed the pinned transfer digest. Log artifact `9143393404`, SHA-256 `7da2e3c7ab3222349084926aad29e1233506f3d401d4987a51a4fea9647d070f`. This was orchestration-only; no product patch or generated runtime executed.

          This remains a partial review-remediation checkpoint only. R-A is not complete until the complete closure inventory is rerun; R-B through R-G remain open; artifact `{result_artifact}` is not an M1 acceptance candidate; M1l remains immutable runtime authority; no runtime/regression total changed.

          '''
          status = "\n".join(line[10:] if line.startswith("          ") else line for line in status.splitlines()) + "\n"
          handoff.write_text(text[:status_start] + status + text[status_end:])

          plan = Path(".agents/Directional/Architecture_M1_Single_Authority_Cutover_Code_Build_Plan.md")
          text = plan.read_text()
          text = text.replace(
              "**Current status:** complete R-A closure review rejected at branch head `344f996622606121a9567beaf1dad4001a5374f3`; R-A-REV-14 through R-A-REV-16 are open, followed by R-B through R-G and one fresh full self-verifying package",
              "**Current status:** R-A-REV-14 through R-A-REV-16 are compile-closed for reviewed paths at `cb848e4dde30bcbe19dcd5d07a408edb2a47dd6e`; R-A remains open pending the complete inventory, followed by R-B through R-G and one fresh full self-verifying package"
          )
          text = text.replace(
              "**Latest review-remediation implementation/compile source:** `78056ba849fafad27eb55e8008fbc20a56300868`",
              f"**Latest review-remediation implementation/compile source:** `{source}`"
          )
          marker = "## 0A. 2026-08-12 complete R-A closure review — rejected"
          checkpoint = f'''## 0AA. 2026-08-12 R-A-REV-14-through-16 review-remediation checkpoint

          This checkpoint closes REV-14 through REV-16 only for the reviewed Code + Build source/contract boundary. It does **not** close R-A, R-B through R-G, M1, or activate artifact-only runtime acceptance.

          - Exact implementation/test source: `{source}` (`7 files changed, 911 insertions, 241 deletions`).
          - REV-14: collision publication uses the canonical post-intersection typed certificate and regenerates derived identity/face ownership from that result; overlapping-compatible and disjoint-incompatible contracts are compile-visible.
          - REV-15: component remap domains and owner relations derive from published `SourceTopologyRegions`/chart authority rather than candidate maxima; invalid region/sheet/chart/support authority fails before publication.
          - REV-16: the production-owned counterfactual mutator runs before real aggregation; baseline versus raw-tampered semantic/hash/downstream validation output is compared; malformed typed authority has a zero-publication negative; the repository-wide audit classifies affected raw reads/writes and requires these semantic bodies.
          - Audit output: `R-A-REV-14 source/contract audit: closed`, `R-A-REV-15 source/contract audit: closed`, `R-A-REV-16 counterfactual/read-write audit: closed`.
          - Compile-only run/job `{run} / {job}` completed Release/static/Ninja/PRE_TEST **118/118**, build exit `0`.
          - Result artifact `{result_artifact}`, outer SHA-256 `{result_sha}`; log artifact `{log_artifact}`, outer SHA-256 `{log_sha}`.
          - Independent package inspection verified exact source `{source}`, **22** regular files including `SHA256SUMS`, self-excluding manifest **21/21**, zero manifest self-references, all five source-status snapshots empty, and the explicit Code + Build/no-runtime command boundary.
          - No generated Directional binary, discovery, test, benchmark, `ctest`, CLI, fuzzer, help/version command, or custom input executed. New semantic contracts were compiled only.
          - Initial run/job `31601748377 / 94130625219` failed before source application because temporary transfer chunk newlines caused the pinned digest check to fail; log artifact `9143393404`, SHA-256 `7da2e3c7ab3222349084926aad29e1233506f3d401d4987a51a4fea9647d070f`. This was orchestration-only.

          **Decision:** rerun the complete R-A closure inventory next. Mark R-A complete only if every retained closure item is statically clean; then continue R-B through R-G and produce the single fresh full package required for M1 acceptance.

          '''
          checkpoint = "\n".join(line[10:] if line.startswith("          ") else line for line in checkpoint.splitlines()) + "\n"
          text = text.replace(marker, checkpoint + marker, 1)
          plan.write_text(text)

          changelog = Path(".agents/Directional/CHANGELOG.md")
          text = changelog.read_text()
          entry = f'''### Fixed — R-A-REV-14 through R-A-REV-16 partial remediation

          - Closed `R-A-REV-14` for reviewed completion/assembly paths: collision publication now has one canonical post-intersection typed authority; derived `authoritativeIdentity` and canonical face-owner cycles are regenerated from that final authority. Compile-visible contracts cover overlapping-but-nonidentical compatible intersection publication and disjoint rejection.
          - Closed `R-A-REV-15` for reviewed component aggregation paths: region/sheet/chart/support remap domains and owner relations are built from published source topology/chart authority; sparse, out-of-domain, wrong-owner, and wrong-face typed authority rejects before output publication.
          - Closed `R-A-REV-16` at the Code + Build contract boundary: a production-owned pre-aggregation counterfactual exposes raw projection tamper to the real aggregation consumer and compares complete semantic/hash/downstream authority-validation output; malformed typed authority has a fail-closed zero-publication contract; the replacement audit classifies repository-wide affected reads/writes and checks the remap/collision/counterfactual bodies.

          ### Validation — R-A-REV-14 through R-A-REV-16

          - Exact review-remediation source: `{source}` (`7 files changed, 911 insertions, 241 deletions`).
          - Compile-only run/job `{run} / {job}` completed Release/static/Ninja/PRE_TEST **118/118** with build exit `0`. Result artifact `{result_artifact}`, outer SHA-256 `{result_sha}`; log artifact `{log_artifact}`, outer SHA-256 `{log_sha}`.
          - Audit reported `R-A-REV-14 source/contract audit: closed`, `R-A-REV-15 source/contract audit: closed`, and `R-A-REV-16 counterfactual/read-write audit: closed`.
          - Independent result inspection verified exact source `{source}`, **22** regular files including `SHA256SUMS`, a self-excluding recursive manifest **21/21**, zero manifest self references, all five source-status snapshots empty, `semanticContracts=compiled-not-executed`, and `runtimeExecution=false`.
          - No generated Directional binary, discovery, test, benchmark, `ctest`, CLI, fuzzer, help/version command, or custom input executed. M1l `bd140cff4572412e6f4ecd70a6ce0fe85310932c` remains immutable runtime authority and regression totals remain **34 events / 14 categories / 20 recurrences**.

          ### Operational notes — R-A-REV-14 through R-A-REV-16

          - Initial run/job `31601748377 / 94130625219` stopped before source application, audit, or compile because the connector-created final source/audit transfer chunks lacked a trailing newline and therefore failed the pinned concatenated-payload digest. Log artifact `9143393404`, SHA-256 `7da2e3c7ab3222349084926aad29e1233506f3d401d4987a51a4fea9647d070f`. The transfer chunks were corrected and the successful retry above followed. This was orchestration-only: no product patch or generated runtime executed and no regression event was assigned.

          '''
          entry = "\n".join(line[10:] if line.startswith("          ") else line for line in entry.splitlines()) + "\n"
          text = text.replace("## [Unreleased]\n", "## [Unreleased]\n\n" + entry, 1)
          changelog.write_text(text)
          PY

          git diff --check
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' \
            .agents/Directional/Architecture_M1_Single_Authority_Cutover_Code_Build_Plan.md \
            .agents/Directional/CHANGELOG.md \
            .agents/Directional/Future_Chat_Session_Handoff.md \
            TODO.md | sort)"
          printf 'changed_files=\n%s\n' "$changed"
          test "$changed" = "$expected"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- .agents/Directional/Architecture_M1_Single_Authority_Cutover_Code_Build_Plan.md .agents/Directional/CHANGELOG.md .agents/Directional/Future_Chat_Session_Handoff.md TODO.md
          git commit -m "docs: record R-A REV-14 through REV-16 closure"
          git push origin "HEAD:${GITHUB_REF_NAME}"
