name: Agent Reusable Artifact-Only Test Benchmark

on:
  workflow_call:
    inputs:
      executor_sha:
        description: Exact commit containing the immutable artifact-only harness and selector/routing authority.
        required: true
        type: string
      semantic_source_sha:
        description: Exact semantic source commit represented by the immutable package under test.
        required: true
        type: string
      turn_id:
        description: Exact Test + Benchmark turn identifier.
        required: true
        type: string
      harness_path:
        description: Repository-relative artifact-only harness path under .agents/Directional/tools/.
        required: true
        type: string
      harness_sha256:
        description: Expected lowercase SHA-256 of the harness bytes.
        required: true
        type: string
      environment_json:
        description: Compact JSON object of additional non-secret harness environment values.
        required: false
        type: string
        default: "{}"
      artifact_prefix:
        description: Prefix for result/log artifacts.
        required: true
        type: string
      retention_days:
        description: Artifact retention period in days.
        required: false
        type: number
        default: 7
    secrets:
      GH_TOKEN:
        required: false

permissions:
  actions: read
  contents: read

jobs:
  runtime:
    runs-on: ubuntu-24.04
    steps:
      - name: Initialize diagnostic log
        shell: bash
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/agent-test-benchmark-reusable.log"
          : > "$log"
          {
            echo "workflow=${GITHUB_WORKFLOW}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "event=${GITHUB_EVENT_NAME}"
            echo "event_sha=${GITHUB_SHA}"
            echo "executor_sha=${{ inputs.executor_sha }}"
            echo "semantic_source_sha=${{ inputs.semantic_source_sha }}"
            echo "turn_id=${{ inputs.turn_id }}"
            echo "harness_path=${{ inputs.harness_path }}"
            echo "runtimeExecution=true"
            echo "started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } | tee -a "$log"

      - name: Checkout exact executor authority
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.executor_sha }}
          fetch-depth: 1
          token: ${{ secrets.GH_TOKEN || github.token }}

      - name: Validate artifact-only harness contract
        id: validate
        env:
          EXECUTOR_SHA: ${{ inputs.executor_sha }}
          SEMANTIC_SOURCE_SHA: ${{ inputs.semantic_source_sha }}
          TURN_ID: ${{ inputs.turn_id }}
          HARNESS_PATH: ${{ inputs.harness_path }}
          HARNESS_SHA256: ${{ inputs.harness_sha256 }}
          ENVIRONMENT_JSON: ${{ inputs.environment_json }}
          ARTIFACT_PREFIX: ${{ inputs.artifact_prefix }}
        shell: bash
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/agent-test-benchmark-reusable.log"
          exec > >(tee -a "$log") 2>&1
          python3 - <<'PY'
          import hashlib, json, os, pathlib, re, subprocess, sys

          sha40 = re.compile(r"[0-9a-f]{40}\Z")
          sha256 = re.compile(r"[0-9a-f]{64}\Z")
          safe_id = re.compile(r"[A-Za-z0-9._-]{1,160}\Z")
          safe_env = re.compile(r"[A-Z][A-Z0-9_]{0,79}\Z")

          executor_sha = os.environ["EXECUTOR_SHA"]
          semantic_source_sha = os.environ["SEMANTIC_SOURCE_SHA"]
          turn_id = os.environ["TURN_ID"]
          harness_path = os.environ["HARNESS_PATH"]
          harness_sha256 = os.environ["HARNESS_SHA256"]
          artifact_prefix = os.environ["ARTIFACT_PREFIX"]

          for label, value in (("executor_sha", executor_sha), ("semantic_source_sha", semantic_source_sha)):
              if not sha40.fullmatch(value):
                  raise SystemExit(f"{label} must be exactly 40 lowercase hex characters")
          if not sha256.fullmatch(harness_sha256):
              raise SystemExit("harness_sha256 must be exactly 64 lowercase hex characters")
          if not safe_id.fullmatch(turn_id):
              raise SystemExit("turn_id contains unsupported characters")
          if not safe_id.fullmatch(artifact_prefix):
              raise SystemExit("artifact_prefix contains unsupported characters")
          if not re.fullmatch(r"\.agents/Directional/tools/[A-Za-z0-9._-]+\.sh", harness_path):
              raise SystemExit("harness_path must be a simple .agents/Directional/tools/*.sh path")

          workspace = pathlib.Path(os.environ["GITHUB_WORKSPACE"]).resolve()
          candidate = workspace / harness_path
          if candidate.is_symlink():
              raise SystemExit("harness_path must not be a symlink")
          harness = candidate.resolve()
          if workspace not in harness.parents or not harness.is_file():
              raise SystemExit("harness_path is missing or escapes the repository workspace")
          actual = hashlib.sha256(harness.read_bytes()).hexdigest()
          if actual != harness_sha256:
              raise SystemExit(f"harness SHA-256 mismatch: expected={harness_sha256} actual={actual}")
          subprocess.run(["bash", "-n", str(harness)], check=True)

          try:
              env_obj = json.loads(os.environ.get("ENVIRONMENT_JSON", "{}"))
          except json.JSONDecodeError as exc:
              raise SystemExit(f"environment_json is invalid JSON: {exc}")
          if not isinstance(env_obj, dict):
              raise SystemExit("environment_json must be a JSON object")
          if len(env_obj) > 64:
              raise SystemExit("environment_json has too many keys")

          blocked_exact = {
              "BASH_ENV", "ENV", "GITHUB_ENV", "GITHUB_OUTPUT", "GITHUB_PATH",
              "GH_TOKEN", "HOME", "IFS", "NODE_OPTIONS", "PATH", "PROMPT_COMMAND",
              "RUNNER_TEMP", "SHELL", "TURN_ID",
          }
          blocked_prefixes = ("ACTIONS_", "DYLD_", "GIT_", "GITHUB_", "LD_", "RUNNER_")
          for key, value in env_obj.items():
              if not isinstance(key, str) or not safe_env.fullmatch(key):
                  raise SystemExit(f"unsupported environment key: {key!r}")
              if key in blocked_exact or key.startswith(blocked_prefixes):
                  raise SystemExit(f"reserved environment key is forbidden: {key}")
              upper = key.upper()
              if any(word in upper for word in ("TOKEN", "SECRET", "PASSWORD", "CREDENTIAL", "PRIVATE_KEY")):
                  raise SystemExit(f"secret-bearing environment key is forbidden: {key}")
              if isinstance(value, bool):
                  text = "true" if value else "false"
              elif isinstance(value, (str, int, float)) and not isinstance(value, bool):
                  text = str(value)
              else:
                  raise SystemExit(f"environment value for {key} must be scalar")
              if "\x00" in text:
                  raise SystemExit(f"environment value for {key} contains NUL")
              if len(text) > 8192:
                  raise SystemExit(f"environment value for {key} is too large")

          checked_out = subprocess.check_output(["git", "rev-parse", "HEAD"], cwd=workspace, text=True).strip()
          if checked_out != executor_sha:
              raise SystemExit(f"executor checkout mismatch: expected={executor_sha} actual={checked_out}")
          print(f"executor_sha={executor_sha}")
          print(f"semantic_source_sha={semantic_source_sha}")
          print(f"turn_id={turn_id}")
          print(f"harness_sha256={actual}")
          print(f"environment_keys={','.join(sorted(env_obj))}")
          PY
          safe_turn_id="$(printf '%s' "$TURN_ID" | tr -c 'A-Za-z0-9._-' '-')"
          echo "safe_turn_id=${safe_turn_id}" >> "$GITHUB_OUTPUT"
          echo "harness_sha256=${HARNESS_SHA256}" >> "$GITHUB_OUTPUT"

      - name: Execute immutable artifact-only gate
        id: gate
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
          TURN_ID: ${{ inputs.turn_id }}
          HARNESS_PATH: ${{ inputs.harness_path }}
          ENVIRONMENT_JSON: ${{ inputs.environment_json }}
        shell: bash
        run: |
          set +e
          python3 - "$HARNESS_PATH" "$ENVIRONMENT_JSON" <<'PY'
          import json, os, subprocess, sys

          harness = sys.argv[1]
          env_obj = json.loads(sys.argv[2])
          env = os.environ.copy()
          for key, value in env_obj.items():
              if isinstance(value, bool):
                  env[key] = "true" if value else "false"
              else:
                  env[key] = str(value)
          result = subprocess.run(["bash", harness, "--execute"], env=env)
          raise SystemExit(result.returncode)
          PY
          status=$?
          set -e
          echo "harness_exit=${status}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Record final reusable status
        if: always()
        shell: bash
        run: |
          set +e
          log="${RUNNER_TEMP}/agent-test-benchmark-reusable.log"
          {
            echo "harness_exit=${{ steps.gate.outputs.harness_exit }}"
            echo "final_job_status=${{ job.status }}"
            echo "finished_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } | tee -a "$log"

      - name: Upload result evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact_prefix }}-result-${{ github.run_id }}
          path: ${{ runner.temp }}/${{ steps.validate.outputs.safe_turn_id }}-result
          if-no-files-found: error
          retention-days: ${{ inputs.retention_days }}

      - name: Upload harness diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact_prefix }}-log-${{ github.run_id }}
          path: ${{ runner.temp }}/${{ steps.validate.outputs.safe_turn_id }}.log
          if-no-files-found: error
          retention-days: ${{ inputs.retention_days }}

      - name: Upload reusable wrapper diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-test-benchmark-reusable-log-${{ github.run_id }}
          path: ${{ runner.temp }}/agent-test-benchmark-reusable.log
          if-no-files-found: error
          retention-days: ${{ inputs.retention_days }}

      - name: Propagate harness status
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.gate.outputs.harness_exit }}" = "0"
