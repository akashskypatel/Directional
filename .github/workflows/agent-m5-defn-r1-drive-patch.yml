name: M5 DEFN R1 Drive Patch Apply

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/drive-patch/M5-DEFN-R1-20260923T221408Z.txt

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

concurrency:
  group: m5-defn-r1-drive-patch
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/agent-m5-defn-r1-drive-patch.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m5-defn-r1-drive-patch
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  apply:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1LU_5CxPtKbsjVouOqNglzfNT5dqcBj-c
      patch_sha256: 3db03145f010d4b6db48d1673413300418811e42d70d4e3d0c2881c226101c91
      base_sha: 56a6e667c731bc78163b751554d5b8f4148f430f
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: M5-DEFN-R1 freeze G4-B004 focused isolation witness
      retention_days: 7
    secrets: inherit
