      workflow_path: .github/workflows/m5-cp4-cb2-drive-apply.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  apply:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1-JLcFljPdoB-A0FsCz1sB-ng1V71pLrF
      patch_sha256: a2bf7d90210339343c548e2adcae255cb48219c3579a52f0028928a6a664efe5
