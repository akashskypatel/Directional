      pr_number: 8
      label: m4-cp-scale-cb14-roadmap-fix
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  apply:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1nkDiwqjjOuvGgbEaPGRueAhtv10-whxd
      patch_sha256: '4c0edb1275eaf95db1497dda27f869d8abe7eeff0fb03b7c0fa2a19458162c94'
      base_sha: 8d5c7500e9a696500d370d2193180bd016bd0f73
