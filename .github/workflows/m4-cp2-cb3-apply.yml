name: M4 CP2 CB3 Apply

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m4-cp2-cb3-apply-20260910-a.txt

permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

concurrency:
  group: m4-cp2-cb3-apply
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/m4-cp2-cb3-apply.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m4-cp2-cb3-apply
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  apply:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1NLuSAGP56c6-pXKLcObHFWD-_3TMADN3
      patch_sha256: addc70501711abeb752d1eca2352dd402ea18f4fd838d7148eb4ecd7158c47ca
      base_sha: 52ebea42ec92bd7ca89e76ab89ac45178cc0176f
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: "M4-CP2-CB3: correct TB2 execution-view census orchestration"
    secrets: inherit
