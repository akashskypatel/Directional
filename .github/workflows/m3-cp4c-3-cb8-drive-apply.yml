      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m3-cp4c-3-cb8-drive-apply-20260831.txt

permissions:
  actions: write
  contents: write
  id-token: write
  issues: write
  pull-requests: write

concurrency:
  group: m3-cp4c-3-cb8-drive-apply
  cancel-in-progress: false

jobs:
  validate-caller:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/m3-cp4c-3-cb8-drive-apply.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m3-cp4c-3-cb8-drive-apply
      commit_run_file: false
    secrets: inherit

  apply:
    needs: validate-caller
    if: ${{ needs.validate-caller.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1JshaUJlmGjMM-uA1mOYAdFNvNJS1d9Jb
      patch_sha256: 6e4f5a3ed9fb9188a9731a62216780245d7fe895500e3a3ec22f476c2878a467
      base_sha: 0d943f95b42e49813060399e83a1e4180e8348f6
