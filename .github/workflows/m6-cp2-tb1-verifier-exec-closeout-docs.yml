name: M6 CP2 TB1 Verifier EXEC Closeout Docs

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m6-cp2-tb1-verifier-exec-closeout-docs.txt

permissions:
  actions: read
  contents: write
  id-token: write

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/m6-cp2-tb1-verifier-exec-closeout-docs.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  apply:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1NpSDi74SOzlo38GpecuY2vlnB3PRYQRg
      patch_sha256: b88ea93dc85bb6fe5a9604c15fb63062079169c44e5acbe83b86f7775be5d133
      base_sha: 57c21ac18bfbe4f1d759a04cc504b833b5ec4a8a
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: "docs: close M6 CP2 TB1 verifier EXEC evidence"
      retention_days: 7
    secrets: inherit

  mailbox:
    if: ${{ always() }}
    needs: [validate, apply]
    permissions:
      actions: read
      contents: write
    uses: ./.github/workflows/workflow-mailbox-publisher.yml
    with:
      workflow_key: m6-cp2-tb1-verifier-exec-closeout-docs
      source_sha: 57c21ac18bfbe4f1d759a04cc504b833b5ec4a8a
      source_ref: refs/heads/agent/surface_cell_quad/p5-recover-bridge-healing
      result: ${{ needs.apply.result }}
      summary: M6-CP2-TB1-VERIFIER-EXEC durable evidence and routing documentation closeout.
