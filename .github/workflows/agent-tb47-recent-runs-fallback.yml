name: Agent TB47 Recent Runs Fallback

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/tb47-recent-runs/**

permissions:
  actions: read
  contents: write

concurrency:
  group: agent-tb47-recent-runs-fallback-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    permissions:
      contents: read
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/agent-tb47-recent-runs-fallback.yml
      source_ref: ${{ github.sha }}

  inventory:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/agent-recent-workflow-runs-reusable.yml
    with:
      per_page: 100
      max_pages: 2
      branch: agent/surface_cell_quad/p5-recover-bridge-healing
    secrets: inherit

  mailbox:
    if: ${{ always() }}
    needs: [validate, inventory]
    permissions:
      actions: read
      contents: write
    uses: ./.github/workflows/workflow-mailbox-publisher.yml
    with:
      mailbox_branch: workflow-mailbox
      workflow_key: m6-cp3-tb47-run-discovery-20261027
      source_sha: ${{ github.sha }}
      source_ref: ${{ github.ref }}
      result: ${{ needs.inventory.result }}
      summary: TB47 one-time fallback discovery of original artifact-only dispatch
