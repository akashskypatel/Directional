name: Agent M3 CP4c 3 CB21 Apply Caller

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m3-cp4c-3-cb21-apply.txt

permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

concurrency:
  group: agent-m3-cp4c-3-cb21-apply
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/agent-m3-cp4c-3-cb21-apply-caller.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m3-cp4c-3-cb21-apply
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  apply:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1KnfdRCjVz71KbCLcBBLrTjj0HsIGOSLE
      patch_sha256: '27c2ae25721bc553ac8615fe33d2af7a9da6f0a847579984b3f6f48751600bc8'
      base_sha: b76d878f4ca689f72db9cfcd329965402151c89d
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: 'fix: correct CB21 compile errors'
    secrets: inherit
