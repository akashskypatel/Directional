name: Agent Compile Cache Bootstrap

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/compile-cache-bootstrap.txt

permissions:
  contents: read
  actions: write

concurrency:
  group: agent-compile-cache-bootstrap-${{ github.ref }}
  cancel-in-progress: false

jobs:
  compile:
    uses: ./.github/workflows/agent-compile-reusable.yml
    with:
      source_sha: c45a634f0a9f003ba31bd92097c52d3bb4c4e7b3
      artifact_prefix: compile-cache-bootstrap
      cache_epoch: v1
