name: Agent CB12 Closeout Drive Patch Apply

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/cb12-closeout-drive-apply/trigger.txt

permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

concurrency:
  group: agent-cb12-closeout-drive-apply-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/agent-cb12-closeout-drive-apply.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: cb12-closeout-drive-apply
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  apply:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1OUG2yHHQiVaXaRZ41h8OahTpeUCmlCuC
      patch_sha256: 0b6bf1a2a4d309b8b7d08f474d21a0591000820e06a4968d2a6e0ac8db0431f2
      base_sha: e15e83c79a1e1962c0ed8d31ea85187ab6600e47
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: "M4-CP-SCALE-CB12: close out publication turn"
      retention_days: 14
    secrets: inherit
