name: M5 CP3 CB10 Closeout Apply

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m5-cp3-cb10-closeout-apply/**

permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/m5-cp3-cb10-closeout-apply.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m5-cp3-cb10-closeout-apply
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  apply:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1G2-WjffAGhE4Gp23bfVxzV-2VLLPThGD
      patch_sha256: fd17a0dd7cfb55a101d591176276f6c327a1bb32165a06053c95156185dbaf50
      base_sha: d1a5e55a997b00c42cfac41e3be0196890c1a9cd
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: "docs: close M5-CP3-CB10 and freeze R9"
    secrets: inherit
