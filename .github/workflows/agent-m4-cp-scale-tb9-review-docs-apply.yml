name: M4 CP SCALE TB9 Review Documentation Apply

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m4-cp-scale-tb9-review/docs-apply.txt

permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

concurrency:
  group: agent-m4-cp-scale-tb9-review-docs-apply-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/agent-m4-cp-scale-tb9-review-docs-apply.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m4-cp-scale-tb9-review-docs-apply
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  apply:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1ixfbg7KnGEJH8-QQZKycSyA8Pmd3wdYB
      patch_sha256: bb449714681f38f6ab6d4fb7107df0696b3a9272e25d3e47a990680ae3ad288e
      base_sha: 13ae14416d96bd78342fd872b285cb49c9572361
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: 'docs: close M4 CP SCALE TB9 review'
      retention_days: 14
    secrets: inherit
