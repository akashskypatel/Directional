name: Agent M1 R-A Review Closure Records

on:
  push:
    branches: [agent/surface_cell_quad/p5-recover-bridge-healing]
    paths: [.agents/connector-triggers/m1-ra-rev-closure.txt]

permissions:
  contents: write

concurrency:
  group: agent-m1-ra-rev-closure-records
  cancel-in-progress: false

jobs:
  patch-records:
    runs-on: ubuntu-latest
    steps:
      - name: Initialize activity log
        shell: bash
        run: |
          set -euo pipefail
          : > "$RUNNER_TEMP/activity.log"
          echo "task=R-A review-closure durable records" | tee -a "$RUNNER_TEMP/activity.log"
          echo "event_sha=$GITHUB_SHA" | tee -a "$RUNNER_TEMP/activity.log"

      - name: Checkout exact trigger
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2

      - name: Patch retained records and push
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee -a "$RUNNER_TEMP/activity.log") 2>&1
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 .agents/Directional/turn-payloads/m1-ra-rev-closure.py
          git diff --check
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' .agents/Directional/Architecture_M1_Single_Authority_Cutover_Code_Build_Plan.md .agents/Directional/CHANGELOG.md | sort)"
          printf 'changed_files=\n%s\n' "$changed"
          test "$changed" = "$expected"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f .agents/Directional/Architecture_M1_Single_Authority_Cutover_Code_Build_Plan.md .agents/Directional/CHANGELOG.md
          git commit -m "docs: record M1 R-A review closure"
          git push origin "HEAD:$GITHUB_REF"
          echo "records_commit=$(git rev-parse HEAD)"
          test -z "$(git status --porcelain=v1)"

      - name: Upload activity log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m1-ra-rev-closure-records-log-${{ github.run_id }}
          path: ${{ runner.temp }}/activity.log
          if-no-files-found: error
          retention-days: 7
