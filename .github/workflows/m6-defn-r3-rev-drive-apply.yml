name: M6 DEFN R3 REV Drive Apply

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/drive-apply/M6-DEFN-R3-REV.txt

permissions:
  contents: write
  id-token: write

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/m6-defn-r3-rev-drive-apply.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  apply:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: "199GwFf58uesJcThtf4hFC7pBfd-Ldq-h"
      patch_sha256: "f06f58245e0b1274c4c492d2c90ad437fee2d4380fa1ea84075abb67aa86a118"
      base_sha: "dba4fbba516f3b309103c4b6529ad6194b9caa52"
      target_branch: "agent/surface_cell_quad/p5-recover-bridge-healing"
      commit_message: "M6-DEFN-R3-REV: accept A6 definition with review amendments"
      retention_days: 7
    secrets: inherit
