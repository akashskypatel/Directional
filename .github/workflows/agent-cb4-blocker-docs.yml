name: M6 CP1 CB4 Blocker Docs Apply

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/cb4-blocker-docs/trigger.txt

permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

concurrency:
  group: m6-cp1-cb4-blocker-docs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m6-cp1-cb4-blocker-docs
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/agent-cb4-blocker-docs.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  stage:
    needs: validate
    runs-on: ubuntu-24.04
    outputs:
      file_id: ${{ steps.stage.outputs.file_id }}
    steps:
      - name: Initialize diagnostic log
        shell: bash
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/m6-cp1-cb4-blocker-docs-stage.log"
          : > "$log"
          printf '%s\n' "run_id=$GITHUB_RUN_ID" "event_sha=$GITHUB_SHA" \
            "ref=$GITHUB_REF" 'runtimeExecution=false' \
            "started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" | tee -a "$log"

      - name: Checkout exact trigger source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Authenticate to Google Drive
        id: auth
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ secrets.GOOGLE_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GOOGLE_PROVIDER }}
          service_account: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/drive
          create_credentials_file: false

      - name: Replace staged Drive file with exact patch bytes
        id: stage
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          PAYLOAD: .agents/Directional/turn-payloads/M6-CP1-CB4-blocker-docs.patch
          EXPECTED_SHA256: 59ade733604f1b1caf24798e51c32042496c80251d2120ac710929ef18cb1d94
          FILE_ID: 18yj8nuE0Cgc5TeY9KgJfvaRRjM9MnYct
        shell: bash
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/m6-cp1-cb4-blocker-docs-stage.log"
          exec > >(tee -a "$log") 2>&1
          actual="$(sha256sum "$PAYLOAD" | awk '{print $1}')"
          test "$actual" = "$EXPECTED_SHA256"

          metadata="${RUNNER_TEMP}/drive-metadata.json"
          curl --fail-with-body --silent --show-error --location \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            "https://www.googleapis.com/drive/v3/files/${FILE_ID}?supportsAllDrives=true&fields=id,name,mimeType,capabilities(canEdit)" \
            -o "$metadata"
          cat "$metadata"
          test "$(jq -r '.capabilities.canEdit // false' "$metadata")" = true

          curl --fail-with-body --silent --show-error --location --request PATCH \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H 'Content-Type: text/plain' \
            --data-binary "@${PAYLOAD}" \
            "https://www.googleapis.com/upload/drive/v3/files/${FILE_ID}?uploadType=media&supportsAllDrives=true" \
            -o "${RUNNER_TEMP}/drive-update.json"
          cat "${RUNNER_TEMP}/drive-update.json"

          check="${RUNNER_TEMP}/drive-patch-check"
          curl --fail-with-body --silent --show-error --location \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            "https://www.googleapis.com/drive/v3/files/${FILE_ID}?alt=media&supportsAllDrives=true" \
            -o "$check"
          test "$(sha256sum "$check" | awk '{print $1}')" = "$EXPECTED_SHA256"
          echo "file_id=$FILE_ID" >> "$GITHUB_OUTPUT"
          echo "patch_sha256=$actual"
          echo 'runtimeExecution=false'

      - name: Upload diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m6-cp1-cb4-blocker-docs-stage-log-${{ github.run_id }}
          path: ${{ runner.temp }}/m6-cp1-cb4-blocker-docs-stage.log
          if-no-files-found: error
          retention-days: 7

  apply:
    needs: stage
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: ${{ needs.stage.outputs.file_id }}
      patch_sha256: 59ade733604f1b1caf24798e51c32042496c80251d2120ac710929ef18cb1d94
      base_sha: efa0cd2c40ba0ea91f0af4761cfcd44a4db13a31
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: 'M6-CP1-CB4: record blocker in handoff and TODO'
      retention_days: 7
    secrets: inherit
