name: M6 CP1 CB4 Blocker Docs Apply

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/cb4-blocker-docs/trigger.txt

permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

concurrency:
  group: m6-cp1-cb4-blocker-docs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m6-cp1-cb4-blocker-docs
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/agent-cb4-blocker-docs.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  upload:
    needs: validate
    runs-on: ubuntu-24.04
    outputs:
      file_id: ${{ steps.upload.outputs.file_id }}
    steps:
      - name: Initialize diagnostic log
        shell: bash
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/m6-cp1-cb4-blocker-docs-upload.log"
          : > "$log"
          printf '%s\n' "run_id=$GITHUB_RUN_ID" "event_sha=$GITHUB_SHA" \
            "ref=$GITHUB_REF" 'runtimeExecution=false' \
            "started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" | tee -a "$log"

      - name: Checkout exact trigger source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Authenticate to Google Drive
        id: auth
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ secrets.GOOGLE_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GOOGLE_PROVIDER }}
          service_account: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/drive
          create_credentials_file: false

      - name: Verify and upload raw patch
        id: upload
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          PAYLOAD: .agents/Directional/turn-payloads/M6-CP1-CB4-blocker-docs.patch
          EXPECTED_SHA256: 59ade733604f1b1caf24798e51c32042496c80251d2120ac710929ef18cb1d94
          PARENT_ID: 1I_-EViWSpaxg69pbglfPPVnFRYb1s5O0
        shell: bash
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/m6-cp1-cb4-blocker-docs-upload.log"
          exec > >(tee -a "$log") 2>&1
          actual="$(sha256sum "$PAYLOAD" | awk '{print $1}')"
          test "$actual" = "$EXPECTED_SHA256"
          metadata="$(jq -nc --arg name 'M6-CP1-CB4-blocker-docs-exact.patch' --arg parent "$PARENT_ID" '{name:$name,parents:[$parent]}')"
          response="${RUNNER_TEMP}/drive-upload.json"
          curl --fail-with-body --silent --show-error --location \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -F "metadata=${metadata};type=application/json;charset=UTF-8" \
            -F "file=@${PAYLOAD};type=text/plain" \
            'https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&supportsAllDrives=true&fields=id,name,size' \
            -o "$response"
          cat "$response"
          file_id="$(jq -r '.id // empty' "$response")"
          test -n "$file_id"
          echo "file_id=$file_id" >> "$GITHUB_OUTPUT"
          echo "patch_sha256=$actual"
          echo 'runtimeExecution=false'

      - name: Upload diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m6-cp1-cb4-blocker-docs-upload-log-${{ github.run_id }}
          path: ${{ runner.temp }}/m6-cp1-cb4-blocker-docs-upload.log
          if-no-files-found: error
          retention-days: 7

  apply:
    needs: upload
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: ${{ needs.upload.outputs.file_id }}
      patch_sha256: 59ade733604f1b1caf24798e51c32042496c80251d2120ac710929ef18cb1d94
      base_sha: efa0cd2c40ba0ea91f0af4761cfcd44a4db13a31
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: 'M6-CP1-CB4: record blocker in handoff and TODO'
      retention_days: 7
    secrets: inherit
