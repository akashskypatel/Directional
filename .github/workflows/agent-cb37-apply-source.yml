name: Agent CB37 Apply Source Patch

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/cb37-apply-source.txt

permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

concurrency:
  group: agent-cb37-apply-source
  cancel-in-progress: false

jobs:
  validate-caller:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/agent-cb37-apply-source.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      commit_run_file: false
      label: cb37-apply-source
      trim_stale_comments: false
    secrets: inherit

  apply:
    needs: validate-caller
    if: ${{ needs.validate-caller.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1Uw1fQEnGF1ACDFmhR2jmPaY1w4rv9BoM
      patch_sha256: 04b40b2a44762182320c1ce77fc923b812e5a5e8a4a0c4a63ef320856f656ae4
      base_sha: 0be969170ae2f361725c27322e9d22e8eb788038
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: "M3-CP4c-3-CB37: retire shared-orbit rejection and persist frontier evidence"
    secrets: inherit
