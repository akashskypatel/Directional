name: M3 CP4c3 CB1 Compile Fix Apply

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m3-cp4c3-cb1-fix-apply.txt

permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

concurrency:
  group: m3-cp4c3-cb1-fix-apply
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/m3-cp4c3-cb1-fix-apply.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m3-cp4c3-cb1-fix-apply
      commit_run_file: false
    secrets: inherit

  apply:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1zjO0Ik6oAVyn9DpcvuR3EZkQNQeS0BTj
      patch_sha256: 305a0ecc59cdd431d783653b6fc47da42cff1e1640e78244726353c0047220f0
      base_sha: 4a18798493575b5a12679f69568d2737c41ccf7a
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: 'M3-CP4c-3-CB1: fix cycle-basis diagnostics initialization'
    secrets: inherit
