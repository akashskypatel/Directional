name: m1h-code-build-closeout

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - '.agents/connector-triggers/m1h-code-build-closeout'

permissions:
  contents: write

concurrency:
  group: m1h-code-build-closeout
  cancel-in-progress: false

jobs:
  closeout:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      LOG_DIR: /tmp/m1h-code-build-closeout
    steps:
      - name: Initialize persistent activity log
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$LOG_DIR"
          printf '%s\n' \
            'turn=M1h Code+Build documentation closeout' \
            "run_id=$GITHUB_RUN_ID" \
            "event_sha=$GITHUB_SHA" \
            'source_edit=false' 'test_edit=false' 'build_edit=false' \
            "started_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)" | tee "$LOG_DIR/activity.log"

      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: agent/surface_cell_quad/p5-recover-bridge-healing
          fetch-depth: 1

      - name: Update live authority documents
        shell: bash
        run: |
          set -Eeuo pipefail
          exec > >(tee -a "$LOG_DIR/activity.log") 2>&1
          trap 'rc=$?; echo "step=docs exit_code=$rc"; exit $rc' EXIT
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 .agents/Directional/turn-payloads/m1h-code-build-closeout.py
          git diff --check
          test -z "$(git status --short -- src include tests cmake CMakeLists.txt 2>/dev/null || true)"
          mapfile -t changed < <(git diff --name-only | LC_ALL=C sort)
          printf '%s\n' "${changed[@]}" | tee "$LOG_DIR/changed-doc-paths.txt"
          test "${#changed[@]}" -eq 5
          test "${changed[0]}" = '.agents/Directional/Future_Chat_Session_Handoff.md'
          test "${changed[1]}" = '.agents/Directional/REORIENTATION_PLAN.md'
          test "${changed[2]}" = '.agents/Directional/Regression_Root_Cause_Tracker.md'
          test "${changed[3]}" = 'MILESTONE_G_TODO.md'
          test "${changed[4]}" = 'TODO'
          git diff -- TODO MILESTONE_G_TODO.md .agents/Directional/Future_Chat_Session_Handoff.md .agents/Directional/REORIENTATION_PLAN.md .agents/Directional/Regression_Root_Cause_Tracker.md > "$LOG_DIR/docs.patch"

      - name: Commit and push documentation closeout
        shell: bash
        run: |
          set -Eeuo pipefail
          exec > >(tee -a "$LOG_DIR/activity.log") 2>&1
          trap 'rc=$?; echo "step=commit exit_code=$rc"; exit $rc' EXIT
          git config user.name 'OpenAI Directional Agent'
          git config user.email 'directional-agent@users.noreply.github.com'
          git add -u -- TODO MILESTONE_G_TODO.md .agents/Directional/Future_Chat_Session_Handoff.md .agents/Directional/REORIENTATION_PLAN.md .agents/Directional/Regression_Root_Cause_Tracker.md
          git diff --cached --check
          git commit -m 'docs: hand off M1h immutable runtime validation'
          git push origin HEAD:agent/surface_cell_quad/p5-recover-bridge-healing
          echo "committed=$(git rev-parse HEAD)" | tee -a "$LOG_DIR/activity.log"
          echo "finished_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)" | tee -a "$LOG_DIR/activity.log"

      - name: Upload detailed activity log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m1h-code-build-closeout-logs
          path: /tmp/m1h-code-build-closeout
          if-no-files-found: error
          retention-days: 14
          compression-level: 6
