      - .agents/connector-triggers/m3-cp4c2-tb-x2-rev-closeout-apply/**

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

concurrency:
  group: m3-cp4c2-tb-x2-rev-closeout-apply-${{ github.ref }}
  cancel-in-progress: false

jobs:
