    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m3-cp4c2-tb-x2-rev-closeout-apply
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/m3-cp4c2-tb-x2-rev-closeout-apply.yml
    secrets: inherit

  apply:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1Ijc-i-ESEccNbIs7RLcy7wETMCXhmGza
      patch_sha256: 8ef9d9fd1f491812174d681c3636c9ef6cef061b98a4192f20a6e4cc61679452
      base_sha: 661a4501ea0b3b3de39c5a8747044a252e370709
