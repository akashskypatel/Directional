name: M5 CP3 CB11 Drive Patch Apply

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m5-cp3-cb11-drive-apply.txt

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

concurrency:
  group: m5-cp3-cb11-drive-apply
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/m5-cp3-cb11-drive-apply.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m5-cp3-cb11-drive-apply
      commit_run_file: false
    secrets: inherit

  apply:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1PXb4iT1pW_40pdMxXW3jz__HXdxNJfEQ
      patch_sha256: 7cbd3551db9d73169c12e8f26f599a7a364d1e9de96942d0fa59df6f4a7fd5f1
      base_sha: 5e446cb3e91ef1190321c09745262944db2765b0
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: M5-CP3-CB11 rotation-aware periodic pairing
    secrets: inherit
