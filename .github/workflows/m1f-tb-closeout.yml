name: m1f-tb-closeout

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - '.agents/connector-triggers/m1f-tb-closeout'

permissions:
  contents: write

concurrency:
  group: m1f-tb-closeout
  cancel-in-progress: false

jobs:
  closeout:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: agent/surface_cell_quad/p5-recover-bridge-healing
          fetch-depth: 1

      - name: Apply narrow durable status updates and stale evidence cleanup
        shell: bash
        run: |
          set -Eeuo pipefail
          # Temporary updater ordering fixes. Preserve exact old semantic blocks until
          # their guarded replacements run; only then rewrite remaining stale paths.
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.agents/connector-tasks/m1f_tb_closeout.py')
          s = p.read_text()
          old = "t = t.replace(M1F_CB_REPORT, M1F_REPORT).replace(M1F_TB_PLAN, M1G_PLAN)"
          if s.count(old) != 2:
              raise SystemExit(f'unexpected updater ordering target count: {s.count(old)}')
          s = s.replace(old, "t = t.replace(M1F_TB_PLAN, M1G_PLAN)", 1)
          s = s.replace(old, "t = t.replace(M1F_CB_REPORT, M1F_REPORT)", 1)
          p.write_text(s)
          PY
          python3 .agents/connector-tasks/m1f_tb_closeout.py
          git diff --check
          echo 'changed paths:'
          git status --short
          mapfile -t changed < <(git diff --name-only | LC_ALL=C sort)
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 9
          printf '%s\n' "${changed[@]}" | grep -Fx '.agents/connector-tasks/m1f_tb_closeout.py'
          printf '%s\n' "${changed[@]}" | grep -Fx '.agents/Directional/Future_Chat_Session_Handoff.md'
          printf '%s\n' "${changed[@]}" | grep -Fx '.agents/Directional/REORIENTATION_PLAN.md'
          printf '%s\n' "${changed[@]}" | grep -Fx '.agents/Directional/Regression_Root_Cause_Tracker.md'
          printf '%s\n' "${changed[@]}" | grep -Fx 'TODO'
          printf '%s\n' "${changed[@]}" | grep -Fx 'MILESTONE_G_TODO.md'
          printf '%s\n' "${changed[@]}" | grep -Fx '.agents/Directional/Architecture_M1e_Segment_Route_Transport_Consumer_Artifact_Only_Test_Benchmark_Report.md'
          printf '%s\n' "${changed[@]}" | grep -Fx '.agents/Directional/Architecture_M1f_Vertex_Continuation_Route_Transport_Consumer_Code_Build_Report.md'
          printf '%s\n' "${changed[@]}" | grep -Fx '.agents/Directional/Architecture_M1f_Vertex_Continuation_Route_Transport_Consumer_Artifact_Only_Test_Benchmark_Plan.md'

      - name: Commit and push closeout state
        shell: bash
        run: |
          set -Eeuo pipefail
          git checkout -- .agents/connector-tasks/m1f_tb_closeout.py
          git config user.name directional-agent
          git config user.email directional-agent@users.noreply.github.com
          git add TODO MILESTONE_G_TODO.md
          git add -f .agents/Directional/Future_Chat_Session_Handoff.md \
            .agents/Directional/REORIENTATION_PLAN.md \
            .agents/Directional/Regression_Root_Cause_Tracker.md
          git add -u .agents/Directional
          git diff --cached --check
          git commit -m 'docs: accept immutable M1f and route to M1g'
          git push origin HEAD:agent/surface_cell_quad/p5-recover-bridge-healing
