name: Agent M3 CP4c3 CB19 Drive Patch Apply

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m3-cp4c3-cb19-drive-apply.txt

permissions:
  contents: write
  id-token: write
  actions: read
  issues: write
  pull-requests: write

jobs:
  workflow-schema-validation:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/agent-m3-cp4c3-cb19-drive-apply.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  apply-patch:
    needs: workflow-schema-validation
    if: needs.workflow-schema-validation.outputs.valid == 'true'
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1JRyH-TnXAWgYG-DDMpTkRWrQ_4HlzUXk
      patch_sha256: 15ac5c71b4eab448ba1de2f8e0f9d58b4afbae787c8c07b03236afe2784b70df
      base_sha: d098e45c841cfac2c2b47796560797f54ad71e89
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: "M3-CP4c-3-CB19: match trace provenance enum underlying type"
    secrets: inherit

  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m3-cp4c3-cb19-drive-apply-r2
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit
