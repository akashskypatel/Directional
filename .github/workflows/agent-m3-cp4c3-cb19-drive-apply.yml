name: Agent M3 CP4c3 CB19 Drive Patch Apply

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m3-cp4c3-cb19-drive-apply.txt

permissions:
  contents: write
  id-token: write
  actions: read
  issues: write
  pull-requests: write

jobs:
  workflow-schema-validation:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/agent-m3-cp4c3-cb19-drive-apply.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  apply-patch:
    needs: workflow-schema-validation
    if: needs.workflow-schema-validation.outputs.valid == 'true'
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1n9dJcEjm4gN_ayukBN5P8O8KfTOHkxbF
      patch_sha256: 78a27896d27f510bb8da27c3dd5323477cc6a27fc9a9a25798b19a9947395f90
      base_sha: 1a4d1c26b276868030b6392dd854c10fab8b334a
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: "docs: close M3-CP4c-3-CB19 and hand off TB17"
    secrets: inherit

  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m3-cp4c3-cb19-closeout-docs
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit
