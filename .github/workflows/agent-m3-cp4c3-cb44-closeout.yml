name: M3 CP4c3 CB44 Closeout Drive Apply

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m3-cp4c3-cb44-closeout/trigger.json

permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

concurrency:
  group: m3-cp4c3-cb44-closeout-caller
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/agent-m3-cp4c3-cb44-closeout.yml
      source_ref: ${{ github.sha }}
      retention_days: 1
    secrets: inherit

  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m3-cp4c3-cb44-closeout
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  apply:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1M0sVfWirr7U6j4LCQ1-55MppbmblxOk3
      patch_sha256: a9039344d55a4023c3db150623b3e6389649f5dd20ad5307c84319137d3a87ac
      base_sha: 8756cfe983bf7e05209f560d59a522a6b5b0674a
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: "docs: close CB44 and freeze TB39 plan"
      retention_days: 1
    secrets: inherit
