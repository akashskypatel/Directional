name: M4 CP2 TB2 R1 REV Apply

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m4-cp2-tb2-r1-rev-apply-20260910-a.txt

permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

concurrency:
  group: m4-cp2-tb2-r1-rev-apply
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/m4-cp2-tb2-r1-rev-apply.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m4-cp2-tb2-r1-rev-apply
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  apply:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 16gqv2_RsbvEqNgfjHz88wzeyn6VjHYE8
      patch_sha256: bc9c1f0934639001051c3f076ce4501812e32e685d663b74970ca31c0f23328d
      base_sha: 6eac077bedb9fcc9507a45b31d6c5919d199d5df
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: "M4-CP2-TB2-R1-REV: promote package117 and close CP2"
    secrets: inherit
