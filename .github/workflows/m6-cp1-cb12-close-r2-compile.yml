name: M6 CP1 CB12 Close R2 Compile

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m6-cp1-cb12-close-r2-compile.txt

permissions:
  actions: write
  contents: write

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/m6-cp1-cb12-close-r2-compile.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  compile:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-compile-reusable.yml
    with:
      source_sha: 3f40f04a0e9d382b2ec82cf37a03c18ad405eb05
      artifact_prefix: m6-cp1-cb12-close-r2
    secrets: inherit

  mailbox:
    if: ${{ always() }}
    needs: [compile]
    permissions:
      actions: read
      contents: write
    uses: ./.github/workflows/workflow-mailbox-publisher.yml
    with:
      workflow_key: m6-cp1-cb12-close-r2-compile
      source_sha: 3f40f04a0e9d382b2ec82cf37a03c18ad405eb05
      source_ref: refs/heads/agent/surface_cell_quad/p5-recover-bridge-healing
      result: ${{ needs.compile.result }}
      summary: M6-CP1-CB12-CLOSE-R2 compile and package evidence.
