name: Agent CB35 R1 Full History Review Boundary

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/review-boundary/cb35-r1.txt

permissions:
  actions: read
  contents: write

concurrency:
  group: cb35-r1-review-boundary-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/agent-cb35-r1-review-boundary.yml
      source_ref: ${{ github.sha }}

  verify:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Initialize persistent verification log
        shell: bash
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/cb35-r1-review-boundary.log"
          : > "$log"
          {
            echo "run_id=${GITHUB_RUN_ID}"
            echo "event_sha=${GITHUB_SHA}"
            echo "ref=${GITHUB_REF}"
            echo "started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } | tee -a "$log"

      - name: Checkout authentic full Git history
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          submodules: false

      - name: Run authoritative review boundary
        shell: bash
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/cb35-r1-review-boundary.log"
          exec > >(tee -a "$log") 2>&1
          trap 'status=$?; echo "boundary_step_exit=${status}"' EXIT
          echo "checkout_sha=$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          echo "rewrite_base_type=$(git cat-file -t 8b7299b43764a6ba3444e5bc774a2f1b65e99731)"
          git merge-base --is-ancestor 8b7299b43764a6ba3444e5bc774a2f1b65e99731 HEAD
          git status --porcelain
          python3 .agents/Directional/tools/review_check.py boundary
          git status --porcelain
          echo "boundary_result=PASS"
          echo "origin_branch_sha=$(git ls-remote origin refs/heads/agent/surface_cell_quad/p5-recover-bridge-healing | cut -f1)"

      - name: Upload independent boundary report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cb35-r1-review-boundary-${{ github.run_id }}
          path: ${{ runner.temp }}/cb35-r1-review-boundary.log
          if-no-files-found: error
          retention-days: 7

  mailbox:
    if: ${{ always() }}
    needs: [verify]
    uses: ./.github/workflows/workflow-mailbox-publisher.yml
    with:
      mailbox_branch: workflow-mailbox
      workflow_key: m6-cp3-cb35-r1-review-boundary
      source_sha: ${{ github.sha }}
      source_ref: ${{ github.ref }}
      result: ${{ needs.verify.result }}
      summary: Full-history read-only review boundary verification.
