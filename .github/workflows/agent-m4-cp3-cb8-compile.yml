name: M4 CP3 CB8 Compile

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m4-cp3-cb8-compile.txt

permissions:
  contents: write
  actions: write
  issues: write
  pull-requests: write

concurrency:
  group: m4-cp3-cb8-compile-${{ github.ref }}
  cancel-in-progress: false

jobs:
  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m4-cp3-cb8-compile
      commit_run_file: false
    secrets: inherit

  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/agent-m4-cp3-cb8-compile.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  owner-compile:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-compile-reusable.yml
    with:
      source_sha: 6934d9edfb56b44f956fbc64a89a501aaed042af
      targets: directional_surface_cell_producer_tests
      artifact_prefix: m4-cp3-cb8-owner
    secrets: inherit

  package-compile:
    needs: [validate, owner-compile]
    if: ${{ needs.validate.outputs.valid == 'true' && needs.owner-compile.result == 'success' }}
    uses: ./.github/workflows/agent-compile-reusable.yml
    with:
      source_sha: 6934d9edfb56b44f956fbc64a89a501aaed042af
      targets: directional_core directional_pipeline directional_surface_cell_authority_kernel_tests directional_surface_cell_producer_tests directional_surface_cell_completion_tests directional_surface_cell_validation_tests directional_compiled_api_tests directional_benchmarks
      artifact_prefix: m4-cp3-cb8-package
    secrets: inherit
