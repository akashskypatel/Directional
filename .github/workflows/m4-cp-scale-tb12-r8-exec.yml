name: M4 CP SCALE TB12 R8 EXEC

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m4-cp-scale-tb12-r8-exec-20260918.txt

permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: m4-cp-scale-tb12-r8-exec
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/m4-cp-scale-tb12-r8-exec.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m4-cp-scale-tb12-r8-exec
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  execute:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Initialize persistent diagnostic log
        shell: bash
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/M4-CP-SCALE-TB12-R8-EXEC.workflow.log"
          : > "$log"
          printf '%s\n' \
            "workflow=${GITHUB_WORKFLOW}" \
            "run_id=${GITHUB_RUN_ID}" \
            "event=${GITHUB_EVENT_NAME}" \
            "event_sha=${GITHUB_SHA}" \
            "ref=${GITHUB_REF}" \
            "repository=${GITHUB_REPOSITORY}" \
            "turnBoundary=Test+Benchmark-artifact-only" \
            "runtimeExecution=true" \
            "frozenHarnessTurn=M4-CP-SCALE-TB12-R8-EXEC" \
            "frozenHarnessSha256=917294ec05e5ad1ec6be990150b9a45931538209489830c4cd03610e1c0f3f9e" \
            "started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" | tee -a "$log"

      - name: Checkout exact control source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          submodules: false
          lfs: false

      - name: Verify frozen R8 harness
        shell: bash
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/M4-CP-SCALE-TB12-R8-EXEC.workflow.log"
          harness="${GITHUB_WORKSPACE}/.agents/Directional/turn-payloads/m4-cp-scale-tb12-r8-exec-harness.sh"
          expected_sha='917294ec05e5ad1ec6be990150b9a45931538209489830c4cd03610e1c0f3f9e'
          expected_bytes=18479
          actual_sha="$(sha256sum "$harness" | awk '{print $1}')"
          actual_bytes="$(wc -c < "$harness" | tr -d ' ')"
          printf '%s\n' "harness_sha256=$actual_sha" "harness_bytes=$actual_bytes" | tee -a "$log"
          test "$actual_sha" = "$expected_sha"
          test "$actual_bytes" = "$expected_bytes"
          bash -n "$harness"
          bash -uc 'f(){ local stem dir work; stem="$(printf "%03d" 7)-A0-$(printf "%03d" 2)"; dir="/tmp/result/raw/$stem"; work="/tmp/runtime/$stem"; test "$stem" = "007-A0-002"; test "$dir" = "/tmp/result/raw/007-A0-002"; test "$work" = "/tmp/runtime/007-A0-002"; }; f'
          echo 'harness_non_directional_preflight=PASS' | tee -a "$log"

      - name: Execute frozen R8 artifact-only plan
        id: execute
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -o pipefail
          log="${RUNNER_TEMP}/M4-CP-SCALE-TB12-R8-EXEC.workflow.log"
          harness="${GITHUB_WORKSPACE}/.agents/Directional/turn-payloads/m4-cp-scale-tb12-r8-exec-harness.sh"
          set +e
          bash "$harness" 2>&1 | tee -a "$log"
          status=${PIPESTATUS[0]}
          set -e
          echo "harness_exit=${status}" | tee -a "$log"
          exit "$status"

      - name: Upload R8 result evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m4-cp-scale-tb12-r8-result-${{ github.run_id }}
          path: ${{ runner.temp }}/M4-CP-SCALE-TB12-R8-EXEC-result
          if-no-files-found: error
          retention-days: 14

      - name: Record final workflow status
        if: always()
        shell: bash
        run: |
          set +e
          log="${RUNNER_TEMP}/M4-CP-SCALE-TB12-R8-EXEC.workflow.log"
          printf '%s\n' \
            "final_job_status=${{ job.status }}" \
            "final_control_sha=$(git rev-parse HEAD 2>/dev/null || echo unavailable)" \
            "finished_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" | tee -a "$log"
          git status --short 2>&1 | tee -a "$log" || true

      - name: Upload persistent diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m4-cp-scale-tb12-r8-log-${{ github.run_id }}
          path: ${{ runner.temp }}/M4-CP-SCALE-TB12-R8-EXEC.workflow.log
          if-no-files-found: error
          retention-days: 14
