name: Agent M3 CP4c-0b CB2 Patch Apply

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m3-cp4c0b-cb2-apply/run.txt

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

concurrency:
  group: agent-m3-cp4c0b-cb2-apply
  cancel-in-progress: false

jobs:
  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m3-cp4c0b-cb2-apply
      commit_run_file: false
    secrets: inherit

  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/agent-m3-cp4c0b-cb2-apply.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  apply:
    needs: validate
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1OL72pzYZvpBrBqn0lngRqZgKztV1jTN5
      patch_sha256: c297a55afb1b04c9fb2b854b91f8aa4883c6ec8a3e33a22d5655998115713be9
      base_sha: 48352cb2cb88a16d4a66104eadcc9b700f3e449f
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: "test: correct CP4c-0b torus rail-authority contract"
    secrets: inherit
