name: Agent M3 CP4c-0b CB2 Patch Apply

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m3-cp4c0b-cb2-apply/run.txt

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

concurrency:
  group: agent-m3-cp4c0b-cb2-apply
  cancel-in-progress: false

jobs:
  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m3-cp4c0b-cb2-apply
      commit_run_file: false
    secrets: inherit

  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/agent-m3-cp4c0b-cb2-apply.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  apply:
    needs: validate
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1Cuwtna6Rb7exbtwJE_p6NAc2zHdzmeWx
      patch_sha256: fdbb1c979af2f9fb54da9b23fdb8c38522f451b11ddcf4e2079ba539e20fa269
      base_sha: b2629040450c12507367c232f68a4d972b46450f
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: "docs: close CP4c-0b CB2 build turn"
    secrets: inherit
