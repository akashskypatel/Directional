name: M5 CP2 CB1 Drive Patch Apply

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m5-cp2-cb1-drive-apply-20260920.txt

permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

concurrency:
  group: m5-cp2-cb1-drive-apply
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/m5-cp2-cb1-drive-apply.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m5-cp2-cb1-drive-apply
      commit_run_file: false
      trim_stale_comments: false
    secrets: inherit

  apply:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1LrnpqrOGnVbwmfi1BybXWEbtJgJnAWnN
      patch_sha256: 7f615cafedfce24bba44ab7de979c80341bef2228fe57767f7dfe9c8da3a0434
      base_sha: 91a2627a6b5fc605240a9bf54a82f72d9029b2f7
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: "M5-CP2-CB1: implement typed relation failure matrix"
    secrets: inherit
