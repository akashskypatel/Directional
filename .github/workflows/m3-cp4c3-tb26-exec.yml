    branches: [agent/surface_cell_quad/p5-recover-bridge-healing]
    paths: [.agents/connector-triggers/m3-cp4c3-tb26-exec-20260904.txt]
permissions: {actions: read, contents: write, issues: write, pull-requests: write}
concurrency: {group: m3-cp4c3-tb26-exec, cancel-in-progress: false}
jobs:
  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
