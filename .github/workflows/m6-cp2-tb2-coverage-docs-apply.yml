name: M6 CP2 TB2 Coverage Docs Apply

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m6-cp2-tb2-coverage-docs-apply.txt

permissions:
  actions: read
  contents: write
  id-token: write

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/m6-cp2-tb2-coverage-docs-apply.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  apply:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1KpxLc9pdmHM1-_M5I965Z7yfZ0UiALAW
      patch_sha256: '85105038e231ffa65028bb88e857920a74589c253cabcf7deba27e9f05f06249'
      base_sha: 2599f3f8230c140d8d3c73865cdfff06624c5dfa
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: M6 CP2 TB2 coverage execution closeout docs
    secrets: inherit

  mailbox:
    if: ${{ always() }}
    needs: [validate, apply]
    uses: ./.github/workflows/workflow-mailbox-publisher.yml
    with:
      workflow_key: m6-cp2-tb2-coverage-docs-apply
      source_sha: ${{ github.sha }}
      source_ref: ${{ github.ref }}
      result: ${{ needs.apply.result }}
      summary: M6 CP2 TB2 coverage execution documentation closeout.
