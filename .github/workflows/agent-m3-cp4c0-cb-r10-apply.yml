name: M3 CP4c0 CB-R10 Apply GMP Portability Fix

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m3-cp4c0-cb-r10-apply/run.txt

permissions:
  actions: read
  contents: write
  id-token: write
  issues: write
  pull-requests: write

concurrency:
  group: m3-cp4c0-cb-r10-apply-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/agent-m3-cp4c0-cb-r10-apply.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m3-cp4c0-cb-r10-apply
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  apply:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 12fPnYe49D1cLwy9BcW1iTeVczzDBGwyb
      patch_sha256: a8445a3ba1cd79c0e44f8462918ba61fbc42cd21dcc7f7313ff89ce5a6c315f3
      base_sha: eac5c736bf54fb5b2e1065e0071fb63d7fdc9f3f
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: 'test: make lossy vertex-sector witness GMP-independent'
      retention_days: 7
    secrets: inherit
