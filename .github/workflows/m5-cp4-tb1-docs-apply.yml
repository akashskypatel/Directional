name: M5 CP4 TB1 Documentation Apply

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m5-cp4-tb1-docs-apply-20260924.txt

permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

concurrency:
  group: m5-cp4-tb1-docs-apply-${{ github.ref }}
  cancel-in-progress: false

jobs:
  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m5-cp4-tb1-docs-apply
      commit_run_file: false
      trim_stale_comments: false
    secrets: inherit

  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/m5-cp4-tb1-docs-apply.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  apply:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1y2MvWRaHWNcBg3c_xU7bcJsesTUSH0YI
      patch_sha256: 2dcdd5116514aefebfd92dc4dc1fbd47a0370dc2c440d561eb114eca562b558b
      base_sha: 96f43297e63d98ba6991a866344c518233583908
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: "docs: record M5-CP4-TB1 execution"
      retention_days: 7
    secrets: inherit
