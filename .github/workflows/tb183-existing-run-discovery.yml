name: TB183 existing-run discovery

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/tb183-existing-run-discovery.txt

permissions:
  actions: read
  contents: write

concurrency:
  group: tb183-existing-run-discovery
  cancel-in-progress: false

jobs:
  validate:
    permissions:
      contents: read
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/tb183-existing-run-discovery.yml
      source_ref: ${{ github.sha }}
  collect:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-recent-workflow-runs-reusable.yml
    with:
      per_page: 30
      max_pages: 1
      branch: agent/surface_cell_quad/p5-recover-bridge-healing
      event: push
      created: '>=2026-11-25T02:47:00Z'
      retention_days: 7
  mailbox:
    if: ${{ always() }}
    needs: [collect]
    uses: ./.github/workflows/workflow-mailbox-publisher.yml
    with:
      mailbox_branch: workflow-mailbox
      workflow_key: m6-cp3-tb183-existing-run-discovery
      source_sha: ${{ github.sha }}
      source_ref: ${{ github.ref }}
      result: ${{ needs.collect.result }}
      summary: Read-only bounded discovery of the existing TB183 dispatcher run.
