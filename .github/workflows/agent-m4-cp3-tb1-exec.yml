name: M4 CP3 TB1 Artifact Execution

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m4-cp3-tb1-exec-20260910.txt

permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: agent-m4-cp3-tb1-exec-${{ github.ref }}
  cancel-in-progress: false

jobs:
  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m4-cp3-tb1-exec
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/agent-m4-cp3-tb1-exec.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  execute:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    steps:
      - name: Initialize persistent activity log
        shell: bash
        run: |
          set -euo pipefail
          : > "$RUNNER_TEMP/m4-cp3-tb1-exec.log"
          printf '%s\n' \
            "workflow=$GITHUB_WORKFLOW" \
            "run_id=$GITHUB_RUN_ID" \
            "event=$GITHUB_EVENT_NAME" \
            "event_sha=$GITHUB_SHA" \
            'turnBoundary=TB-EXEC' \
            'artifactOnly=true' \
            'package118=10182447649' \
            'compiledSource=c8d8fc8ae92c067fce04a365bc8dd3b21ddad8dc' \
            | tee -a "$RUNNER_TEMP/m4-cp3-tb1-exec.log"

      - name: Checkout orchestration harness only
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          submodules: false

      - name: Execute frozen artifact-only TB1 plan
        id: tb
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          bash .agents/Directional/turn-payloads/m4_cp3_tb1_exec_harness.sh

      - name: Upload TB1 raw result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m4-cp3-tb1-exec-result-${{ github.run_id }}
          path: ${{ runner.temp }}/m4-cp3-tb1-exec/result
          if-no-files-found: error
          retention-days: 7

      - name: Upload TB1 diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m4-cp3-tb1-exec-log-${{ github.run_id }}
          path: ${{ runner.temp }}/m4-cp3-tb1-exec.log
          if-no-files-found: error
          retention-days: 7

      - name: Propagate TB1 result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          code_file="$RUNNER_TEMP/m4-cp3-tb1-exec/result/harness-exit-code.txt"
          test -f "$code_file" || { echo 'TB1 harness exit code missing' >&2; exit 3; }
          code="$(cat "$code_file")"
          echo "tb1_harness_exit=$code" | tee -a "$RUNNER_TEMP/m4-cp3-tb1-exec.log"
          exit "$code"
