name: Agent TB7 Drive Patch Apply

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/tb7-drive-apply/**

permissions:
  contents: write
  id-token: write
  actions: read
  issues: write
  pull-requests: write

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/agent-tb7-drive-apply-temp.yml
    secrets: inherit

  apply:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1B7Wd-iZkIH3YHt68VDChCafBihHcj9jt
      patch_sha256: 2f3d35e6c7360b71fb3e4665d8b79c12ba3011d4045ebd9f9969307167a002ce
      base_sha: c87d30c6193793d0ef0fdf1fc783b2cc7a32ef62
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: "M3-CP4c-3-TB7: stage artifact-only runtime payloads"
      retention_days: 7
    secrets: inherit

  observe:
    needs: [validate, apply]
    if: ${{ always() }}
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: M3-CP4c-3-TB7-drive-apply
      trim_stale_comments: true
    secrets: inherit
