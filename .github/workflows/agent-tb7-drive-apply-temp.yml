name: Agent TB7 Drive Patch Apply

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/tb7-drive-apply/**

permissions:
  contents: write
  id-token: write
  actions: read
  issues: write
  pull-requests: write

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/agent-tb7-drive-apply-temp.yml
    secrets: inherit

  apply:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1TZJhOd2bX1RvBZc6IbrUNXtWEou9f1sw
      patch_sha256: 8f596e96a884c31578d661ebd8e69f14a4b71c5378a56c0590f50a2d51b25a8a
      base_sha: 5672defdd1f0b918d9c39fa9b510c2c30ae2e7ac
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: "M3-CP4c-3-TB7: close out artifact-only semantic evidence"
      retention_days: 7
    secrets: inherit

  observe:
    needs: [validate, apply]
    if: ${{ always() }}
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: M3-CP4c-3-TB7-closeout-drive-apply
      trim_stale_comments: true
    secrets: inherit
