name: Agent M3 CP4c3 TB14 Retry Validator

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/workflow-validation/m3-cp4c3-tb14-retry.txt

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: agent-m3-cp4c3-tb14-retry-validator
  cancel-in-progress: false

jobs:
  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m3-cp4c3-tb14-retry-validator
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  validate-self:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/agent-m3-cp4c3-tb14-retry-validator.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  validate-runtime-draft:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .agents/Directional/turn-payloads/agent-m3-cp4c3-tb14-retry.yml
      source_ref: ${{ github.sha }}
    secrets: inherit
