name: Agent M3 CP4c3 TB25 R1 Docs Apply

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/tb25-r1-docs-apply/trigger-20260904-r2.txt

permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

concurrency:
  group: agent-m3-cp4c3-tb25-r1-docs-apply-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/agent-m3-cp4c3-tb25-r1-docs-apply.yml
      source_ref: ${{ github.sha }}
      retention_days: 14
    secrets: inherit

  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m3-cp4c3-tb25-r1-docs-apply-r2
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  apply:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1D1pNGZavHx_IU72wL6vepG_8Ui52BsFJ
      patch_sha256: 'eb166cb91280228423aab6374d0e1accf62ef7106c02751eeff116bc7a6b0175'
      base_sha: c7a80be2581c72b808365b0c508fbc877d7abdf8
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: 'M3-CP4c-3-TB25-R1: preserve discriminator contract and cleanup references'
      retention_days: 14
    secrets: inherit
