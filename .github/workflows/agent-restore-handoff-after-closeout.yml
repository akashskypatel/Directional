name: Agent Restore Handoff After Closeout

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/restore-handoff-after-closeout.txt

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 20
          submodules: false
      - name: Restore exact durable handoff content
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin 9724510e71209d89756ed38efcbd420e68e31be1
          git show 9724510e71209d89756ed38efcbd420e68e31be1:.agents/Directional/Future_Chat_Session_Handoff.md > "$RUNNER_TEMP/handoff.expected"
          cp "$RUNNER_TEMP/handoff.expected" .agents/Directional/Future_Chat_Session_Handoff.md
          cmp .agents/Directional/Future_Chat_Session_Handoff.md "$RUNNER_TEMP/handoff.expected"
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f .agents/Directional/Future_Chat_Session_Handoff.md
          git commit -m 'fix: restore durable handoff after connector write error'
          git push origin "HEAD:${GITHUB_REF_NAME}"
          git status --porcelain=v1 | tee "$RUNNER_TEMP/status.txt"
          test ! -s "$RUNNER_TEMP/status.txt"
          echo 'runtimeExecution=false'
