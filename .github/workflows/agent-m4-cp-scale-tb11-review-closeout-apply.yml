name: M4 CP SCALE TB11 Review Closeout Patch Apply

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m4-cp-scale-tb11-review/closeout-apply.txt

permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

concurrency:
  group: m4-cp-scale-tb11-review-closeout-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/agent-m4-cp-scale-tb11-review-closeout-apply.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m4-cp-scale-tb11-review-closeout
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  apply:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1981vfETBWsIRvirPIanhu0vfC41j98qK
      patch_sha256: 'a1dfe43ac276b7637011960013a9f785e9ffbdbab78f58a054837902ebc89f9a'
      base_sha: 4e1b01058b887f6ace739b3460bc934a750bfa89
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: "docs: record M4 CP SCALE TB11 Review"
      retention_days: 14
    secrets: inherit
