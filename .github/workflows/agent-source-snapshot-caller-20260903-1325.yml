  snapshot:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-source-snapshot.yml
    with:
      source_ref: e5f10cc40381392425ca9c1ef3e7eea67d2bcc16
      artifact_prefix: agent-source-snapshot-e5f10cc4
    secrets: inherit
