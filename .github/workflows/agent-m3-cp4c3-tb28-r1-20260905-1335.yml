name: M3 CP4c3 TB28 R2 Artifact Only

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/tb28/tb28-r2-20260905-1342.txt

permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: write

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/agent-m3-cp4c3-tb28-r1-20260905-1335.yml
    secrets: inherit

  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m3-cp4c3-tb28-r2
      trim_stale_comments: true
    secrets: inherit

  execute:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Execute immutable TB28 artifact-only gate
        id: gate
        shell: bash
        run: |
          set -uo pipefail

          ARTIFACT_ID=9975737868
          EXPECTED_ARTIFACT_NAME='m3-cp4c3-cb32-compile-result-33987769718'
          EXPECTED_PROVIDER_DIGEST='sha256:16190a2da150d1e170dbbaa8df8d51437aabdb77e6a54aeab547e0dc0c4d84ec'
          EXPECTED_ZIP_SHA='16190a2da150d1e170dbbaa8df8d51437aabdb77e6a54aeab547e0dc0c4d84ec'
          EXPECTED_SOURCE_SHA='098ac7d93ea203222dd0ac50cdb68667744f0fd4'
          EXPECTED_365='6b5b6555d39c250c24cbf3faeafdeca93b4b11379118a29583253e6cfc14b8a1'
          EXPECTED_397='d67e5fb72196313c54fbc21be0b446ab0fba3974c47c02e18c33dfe9b4853ee5'
          EXPECTED_401='0d0857a97158dfd0763b536718c24ba257417866aad3d8e51d6f0093be5a5869'
          EXPECTED_403='60ff6daa0e1dc71fe9c856ee9559d665628b756ed634f70ffce5881ec2514007'
          EXPECTED_405='615370b65e590dadb59d7a233c6ce74b7dc8cb46a1f40fd3ea5a44257583aae7'
          EXPECTED_406='efd8f9c764316c87c12ce6400d9a0160a682ca185dec1340fa04b7130df80ac0'
          EXPECTED_407='9e5b7c62901b694399b215bc02a5ade09f3466795b20181c42a039a32f9718ae'

          ROOT="${RUNNER_TEMP}/m3-cp4c3-tb28-r2"
          PKG="${ROOT}/package"
          SOURCE="${ROOT}/source"
          EXEC_VIEW="${ROOT}/execution-view"
          RESULT="${RUNNER_TEMP}/m3-cp4c3-tb28-r2-result"
          LOG="${RUNNER_TEMP}/m3-cp4c3-tb28-r2.log"
          ZIP="${ROOT}/artifact-${ARTIFACT_ID}.zip"
          RUNTIME="${ROOT}/runtime"
          mkdir -p "$ROOT" "$PKG" "$SOURCE" "$EXEC_VIEW/bin" "$RESULT/raw" "$RESULT/resource" "$RUNTIME"
          : > "$LOG"
          exec > >(tee -a "$LOG") 2>&1

          runtime_started=false
          runtime_completed=false
          preflight_completed=false
          execution_view_verified=false
          orchestration_failure=false
          benchmark_execution=false
          configure_execution=false
          compile_execution=false
          relink_execution=false
          generated_discovery=false
          package_repair=false
          mode_repair=false
          source_test_fixture_selector_mutation=false
          gate_status=0

          finish() {
            status=$?
            set +e
            {
              echo "script_exit=${status}"
              echo "runtime_started=${runtime_started}"
              echo "runtime_completed=${runtime_completed}"
              echo "preflight_completed=${preflight_completed}"
              echo "execution_view_verified=${execution_view_verified}"
              echo "orchestration_failure=${orchestration_failure}"
              echo "benchmark_execution=${benchmark_execution}"
              echo "configure_execution=${configure_execution}"
              echo "compile_execution=${compile_execution}"
              echo "relink_execution=${relink_execution}"
              echo "generated_discovery=${generated_discovery}"
              echo "package_repair=${package_repair}"
              echo "mode_repair=${mode_repair}"
              echo "source_test_fixture_selector_mutation=${source_test_fixture_selector_mutation}"
            } > "${RESULT}/execution-boundary.txt"
            cat "${RESULT}/execution-boundary.txt"
            echo "finished_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" | tee -a "$LOG"
            echo "gate_status=${status}" >> "$GITHUB_OUTPUT"
          }
          trap finish EXIT

          fail_orchestration() {
            orchestration_failure=true
            echo "ORCHESTRATION_FAILURE: $*" >&2
            exit 90
          }

          census_tree() {
            local root="$1" out="$2"
            : > "$out"
            while IFS= read -r -d '' path; do
              rel="${path#"$root"/}"
              [[ "$path" == "$root" ]] && rel='.'
              mode="$(stat -c '%a' "$path")"
              type="$(stat -c '%F' "$path")"
              size="$(stat -c '%s' "$path")"
              digest='-'
              target='-'
              if [[ -f "$path" ]]; then digest="$(sha256sum "$path" | awk '{print $1}')"; fi
              if [[ -L "$path" ]]; then target="$(readlink "$path")"; fi
              printf '%s\t%s\t%s\t%s\t%s\t%s\n' "$rel" "$type" "$mode" "$size" "$digest" "$target" >> "$out"
            done < <(find "$root" -mindepth 0 -print0 | LC_ALL=C sort -z)
          }

          census_sha() {
            sha256sum "$1" | awk '{print $1}'
          }

          {
            echo "turn=M3-CP4c-3-TB28"
            echo "workflow=${GITHUB_WORKFLOW}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "event=${GITHUB_EVENT_NAME}"
            echo "event_sha=${GITHUB_SHA}"
            echo "repository=${GITHUB_REPOSITORY}"
            echo "runner_os=${RUNNER_OS}"
            echo "artifact_id=${ARTIFACT_ID}"
            echo "expected_source_sha=${EXPECTED_SOURCE_SHA}"
            echo "started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            uname -a
            unzip -v | sed -n '1,2p'
            tar --version | sed -n '1p'
            python3 --version
            command -v /usr/bin/time
            command -v timeout
          } | tee "${RESULT}/environment.txt"

          artifact_json="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}")" \
            || fail_orchestration 'artifact metadata query failed'
          provider_digest="$(printf '%s' "$artifact_json" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("digest", ""))')"
          artifact_name="$(printf '%s' "$artifact_json" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("name", ""))')"
          [[ "$provider_digest" == "$EXPECTED_PROVIDER_DIGEST" ]] || fail_orchestration "provider digest mismatch: $provider_digest"
          [[ "$artifact_name" == "$EXPECTED_ARTIFACT_NAME" ]] || fail_orchestration "artifact name mismatch: $artifact_name"
          curl -L --fail --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
            -o "$ZIP" || fail_orchestration 'artifact download failed'
          zip_sha="$(sha256sum "$ZIP" | awk '{print $1}')"
          [[ "$zip_sha" == "$EXPECTED_ZIP_SHA" ]] || fail_orchestration "downloaded ZIP digest mismatch: $zip_sha"
          printf 'artifact_id=%s\nartifact_name=%s\nprovider_digest=%s\ndownloaded_zip_sha256=%s\n' \
            "$ARTIFACT_ID" "$artifact_name" "$provider_digest" "$zip_sha" \
            | tee "${RESULT}/artifact-authority.txt"

          unzip -q "$ZIP" -d "$PKG" || fail_orchestration 'artifact unzip failed'
          (cd "$PKG" && sha256sum -c SHA256SUMS) > "${RESULT}/sha256sums-check.txt" 2>&1 \
            || { cat "${RESULT}/sha256sums-check.txt"; fail_orchestration 'internal SHA256SUMS verification failed'; }
          cat "${RESULT}/sha256sums-check.txt"
          [[ "$(find "$PKG" -type f | wc -l)" -eq 29 ]] || fail_orchestration 'unexpected package file count'
          [[ "$(grep -Ec '^[0-9a-f]{64}  ' "$PKG/SHA256SUMS")" -eq 28 ]] || fail_orchestration 'unexpected SHA256SUMS entry count'
          [[ "$(cat "$PKG/metadata/source-commit.txt")" == "$EXPECTED_SOURCE_SHA" ]] || fail_orchestration 'source commit mismatch'
          [[ "$(cat "$PKG/metadata/build-exit-code.txt")" == '0' ]] || fail_orchestration 'build exit nonzero'
          [[ "$(cat "$PKG/metadata/preflight-exit-code.txt")" == '0' ]] || fail_orchestration 'compile preflight exit nonzero'
          for token in 'runtimeExecution=false' 'turnBoundary=Code+Build-only' 'exactArithmeticBackend=GMP' 'preflightCompile=true'; do
            grep -Fxq "$token" "$PKG/metadata/command-boundary.txt" || fail_orchestration "missing command boundary: $token"
          done

          cat > "${ROOT}/expected-targets.txt" <<'TARGETS'
          directional_core
          directional_pipeline
          directional_surface_cell_authority_kernel_tests
          directional_surface_cell_producer_tests
          directional_surface_cell_completion_tests
          directional_surface_cell_validation_tests
          directional_compiled_api_tests
          directional_benchmarks
          TARGETS
          cmp -s "${ROOT}/expected-targets.txt" "$PKG/metadata/compiled-targets.txt" || fail_orchestration 'compiled targets mismatch'

          required_executables=(
            directional_benchmarks
            directional_compiled_api_tests
            directional_surface_cell_producer_tests
            directional_surface_cell_authority_kernel_tests
            directional_surface_cell_completion_tests
            directional_surface_cell_validation_tests
          )
          for exe in "${required_executables[@]}"; do
            [[ -f "$PKG/bin/$exe" && -x "$PKG/bin/$exe" ]] || fail_orchestration "required executable mode absent: $exe"
            stat -c '%n mode=%a size=%s' "$PKG/bin/$exe"
          done | tee "${RESULT}/executable-modes.txt"

          census_tree "$PKG" "${RESULT}/package-census-before.tsv"
          package_census_before_sha="$(census_sha "${RESULT}/package-census-before.tsv")"
          printf '%s  package-census-before.tsv\n' "$package_census_before_sha" | tee "${RESULT}/package-census-before.sha256"

          source_archive="$PKG/source/source-${EXPECTED_SOURCE_SHA}.tar.gz"
          [[ -f "$source_archive" ]] || fail_orchestration 'source archive absent'
          tar -tzf "$source_archive" > "${RESULT}/source-archive-list.txt" || fail_orchestration "failed to list source archive"
          sed -n '1,25p' "${RESULT}/source-archive-list.txt" | tee "${RESULT}/source-archive-root.txt"
          tar -xzf "$source_archive" -C "$SOURCE" || fail_orchestration 'source archive extraction failed'
          [[ -f "$SOURCE/benchmarks/fixtures/milestone-g/mechanical_feature.obj" ]] || fail_orchestration 'mechanical fixture missing'
          [[ -f "$SOURCE/benchmarks/fixtures/milestone-g/sphere_prescribed.obj" ]] || fail_orchestration 'sphere fixture missing'

          census_tree "$SOURCE" "${RESULT}/source-census-before.tsv"
          source_census_before_sha="$(census_sha "${RESULT}/source-census-before.tsv")"
          printf '%s  source-census-before.tsv\n' "$source_census_before_sha" | tee "${RESULT}/source-census-before.sha256"

          mkdir -p "$EXEC_VIEW/bin" "$EXEC_VIEW/test-data/benchmarks"
          for exe in "${required_executables[@]}"; do
            ln "$PKG/bin/$exe" "$EXEC_VIEW/bin/$exe" || fail_orchestration "cannot hard-link packaged binary into execution view: $exe"
            [[ "$(sha256sum "$PKG/bin/$exe" | awk '{print $1}')" == "$(sha256sum "$EXEC_VIEW/bin/$exe" | awk '{print $1}')" ]] \
              || fail_orchestration "staged binary digest mismatch: $exe"
          done
          cp -a "$SOURCE/benchmarks/fixtures" "$EXEC_VIEW/test-data/benchmarks/" \
            || fail_orchestration 'fixture copy failed'

          probe_executable="$(realpath -e "$EXEC_VIEW/bin/directional_surface_cell_producer_tests")"
          executable_directory="$(dirname "$probe_executable")"
          sibling_candidate="$(dirname "$executable_directory")/test-data"
          legacy_candidate="$executable_directory/test-data"
          resolved_test_data=''
          resolved_rule=''
          if [[ -d "$sibling_candidate/benchmarks/fixtures" ]]; then
            resolved_test_data="$sibling_candidate"
            resolved_rule='sibling'
          elif [[ -d "$legacy_candidate/benchmarks/fixtures" ]]; then
            resolved_test_data="$legacy_candidate"
            resolved_rule='legacy'
          else
            fail_orchestration "consumer-resolution preflight found no fixture tree"
          fi
          [[ "$resolved_rule" == 'sibling' ]] || fail_orchestration "unexpected consumer resolution rule: $resolved_rule"
          [[ -f "$resolved_test_data/benchmarks/fixtures/milestone-g/mechanical_feature.obj" ]] || fail_orchestration 'consumer-resolved mechanical fixture absent'
          [[ -f "$resolved_test_data/benchmarks/fixtures/milestone-g/sphere_prescribed.obj" ]] || fail_orchestration 'consumer-resolved sphere fixture absent'
          execution_view_verified=true
          {
            echo "binary_stage=hardlink"
            echo "fixture_stage=copy-from-immutable-packaged-source"
            echo "probe_executable=$probe_executable"
            echo "candidate_1_sibling=$sibling_candidate"
            echo "candidate_2_legacy=$legacy_candidate"
            echo "resolved_rule=$resolved_rule"
            echo "resolved_test_data=$resolved_test_data"
          } | tee "${RESULT}/execution-view.txt"

          grep -Fq 'executableDirectory.parent_path() / "test-data"' "$SOURCE/tests/TestFixturePaths.h" || fail_orchestration 'sibling candidate rule drifted'
          grep -Fq 'executableDirectory / "test-data"' "$SOURCE/tests/TestFixturePaths.h" || fail_orchestration 'legacy candidate rule drifted'

          (
            cd "$SOURCE"
            python3 .agents/Directional/tools/selector_probe.py hash 365
            python3 .agents/Directional/tools/selector_probe.py hash 397
            python3 .agents/Directional/tools/selector_probe.py hash 401
            python3 .agents/Directional/tools/selector_probe.py hash 403
            python3 .agents/Directional/tools/selector_probe.py hash 405
            python3 .agents/Directional/tools/selector_probe.py hash 406
            python3 .agents/Directional/tools/selector_probe.py hash 407
            python3 .agents/Directional/tools/selector_probe.py prefix 365 397
            python3 .agents/Directional/tools/selector_probe.py prefix 397 401
            python3 .agents/Directional/tools/selector_probe.py prefix 401 403
            python3 .agents/Directional/tools/selector_probe.py prefix 403 405
            python3 .agents/Directional/tools/selector_probe.py prefix 405 406
            python3 .agents/Directional/tools/selector_probe.py prefix 406 407
          ) | tee "${RESULT}/selector-probe.txt" || fail_orchestration 'selector probe failed'
          for hash in "$EXPECTED_365" "$EXPECTED_397" "$EXPECTED_401" "$EXPECTED_403" "$EXPECTED_405" "$EXPECTED_406" "$EXPECTED_407"; do
            grep -Fq "$hash" "${RESULT}/selector-probe.txt" || fail_orchestration "selector hash missing: $hash"
          done
          [[ "$(grep -Fc 'exact prefix' "${RESULT}/selector-probe.txt")" -eq 6 ]] || fail_orchestration 'selector prefix proof missing'

          python3 - "$SOURCE" "${RESULT}/identity-map.tsv" <<'PY'
          import hashlib
          import pathlib
          import re
          import sys

          root = pathlib.Path(sys.argv[1])
          out = pathlib.Path(sys.argv[2])
          selector_path = root / '.agents/Directional/Architecture_M3_CP4c3_Required_Green_Selector_407.txt'
          selector = [line for line in selector_path.read_text().splitlines() if line.strip()]
          if len(selector) != 407:
              raise SystemExit(f'selector count {len(selector)} != 407')
          targets = {
              'directional_compiled_api_tests': ['tests/CompiledLibraryTests.cpp'],
              'directional_surface_cell_producer_tests': [],
              'directional_surface_cell_authority_kernel_tests': [
                  'tests/FieldTransportAtlasTests.cpp',
                  'tests/SurfaceCellAuthorityKernelTests.cpp',
              ],
              'directional_surface_cell_completion_tests': [
                  'tests/FlowRepStrandsPhase15Tests.cpp',
                  'tests/PatchDescriptorMilestoneETests.cpp',
                  'tests/PureQuadCompletionPhase18Tests.cpp',
                  'tests/SurfaceArrangementRowIdentityTests.cpp',
                  'tests/SurfaceComplexSimplificationPhase17Tests.cpp',
              ],
              'directional_surface_cell_validation_tests': [
                  'tests/SourceAuthoritativeMeshValidatorPhase22Tests.cpp',
                  'tests/SurfaceMeshOptimizerPhase19Tests.cpp',
                  'tests/SurfaceMeshOptimizerPhase20Tests.cpp',
                  'tests/SurfaceMeshOptimizerPhase21Tests.cpp',
                  'tests/SurfaceMeshOptimizerPhase22Tests.cpp',
              ],
          }
          cm = (root / 'cmake/DirectionalTests.cmake').read_text()
          m = re.search(r'set\(DIRECTIONAL_SURFACE_CELL_PRODUCER_TEST_SOURCES(.*?)\)\n\nadd_executable', cm, re.S)
          if not m:
              raise SystemExit('producer source set not found')
          for line in m.group(1).splitlines():
              source = line.strip()
              if source.endswith('.cpp'):
                  targets['directional_surface_cell_producer_tests'].append(source)
          pattern = re.compile(r'\bTEST(?:_F|_P)?\s*\(\s*([A-Za-z0-9_]+)\s*,\s*([A-Za-z0-9_]+)\s*\)')
          owners = {}
          for target, files in targets.items():
              for relative in files:
                  for suite, name in pattern.findall((root / relative).read_text(errors='replace')):
                      owners.setdefault(f'{suite}.{name}', []).append((target, relative))
          rows = []
          for ordinal, identity in enumerate(selector, 1):
              found = owners.get(identity, [])
              if len(found) != 1:
                  raise SystemExit(f'identity owner count {len(found)} for {ordinal}:{identity}')
              rows.append((ordinal, identity, *found[0]))
          out.write_text(
              'ordinal\tidentity\tbinary\tsource\n'
              + ''.join(f'{ordinal}\t{identity}\t{binary}\t{source}\n' for ordinal, identity, binary, source in rows)
          )
          print(f'identity_count={len(rows)}')
          print('identity_map_sha256=' + hashlib.sha256(out.read_bytes()).hexdigest())
          PY
          [[ "$(($(wc -l < "${RESULT}/identity-map.tsv") - 1))" -eq 407 ]] || fail_orchestration 'identity map count mismatch'
          sha256sum "${RESULT}/identity-map.tsv" | tee "${RESULT}/identity-map.sha256"

          census_tree "$EXEC_VIEW" "${RESULT}/execution-view-before.tsv"
          sha256sum "${RESULT}/execution-view-before.tsv" | tee "${RESULT}/execution-view-before.sha256"
          preflight_completed=true

          {
            echo "configure_execution=false"
            echo "compile_execution=false"
            echo "relink_execution=false"
            echo "package_repair=false"
            echo "mode_repair=false"
            echo "generated_discovery=false"
            echo "source_test_fixture_selector_mutation=false"
            echo "benchmark_execution=false"
          } > "${RESULT}/mutation-flags-before-runtime.txt"

          echo -e 'ordinal\tidentity\tbinary\texit\tselected\tresult\telapsed_seconds\tpeak_rss_kib\traw_log' > "${RESULT}/ledger.tsv"
          runtime_started=true
          selector="$SOURCE/.agents/Directional/Architecture_M3_CP4c3_Required_Green_Selector_407.txt"
          ordinal=0
          while IFS= read -r identity || [[ -n "$identity" ]]; do
            [[ -n "$identity" ]] || continue
            ordinal=$((ordinal + 1))
            map_line="$(awk -F '\t' -v o="$ordinal" 'NR>1 && $1==o {print; exit}' "${RESULT}/identity-map.tsv")"
            binary="$(printf '%s\n' "$map_line" | cut -f3)"
            [[ -n "$binary" ]] || fail_orchestration "owner missing for ordinal $ordinal"
            raw="${RESULT}/raw/ordinal-$(printf '%03d' "$ordinal").log"
            resource="${RESULT}/resource/ordinal-$(printf '%03d' "$ordinal").tsv"
            work="${RUNTIME}/ordinal-$(printf '%03d' "$ordinal")"
            mkdir -p "$work"
            echo "TB28_R2 ordinal=$ordinal identity=$identity owner=$binary"
            set +e
            (
              cd "$work"
              /usr/bin/time -f '%e\t%M' -o "$resource" \
                timeout --signal=TERM --kill-after=5s 180s "$EXEC_VIEW/bin/$binary" --gtest_filter="$identity"
            ) >"$raw" 2>&1
            code=$?
            set -e
            cat "$raw"
            run_marker_count="$(grep -Fc '[ RUN      ]' "$raw" || true)"
            selected=0
            if grep -Fq "[==========] Running 1 test" "$raw" && [[ "$run_marker_count" -eq 1 ]]; then
              selected=1
            fi
            [[ "$selected" -eq 1 ]] || fail_orchestration "zero/non-single selection at ordinal $ordinal"
            result=RED
            [[ "$code" -eq 0 ]] && result=PASS
            elapsed=NA
            rss=NA
            if [[ -s "$resource" ]]; then
              IFS=$'\t' read -r elapsed rss < <(tail -n 1 "$resource")
            fi
            printf '%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\n' \
              "$ordinal" "$identity" "$binary" "$code" "$selected" "$result" "$elapsed" "$rss" "raw/$(basename "$raw")" \
              >> "${RESULT}/ledger.tsv"
          done < "$selector"
          [[ "$ordinal" -eq 407 ]] || fail_orchestration "runtime row count mismatch: $ordinal"
          runtime_completed=true

          python3 - "${RESULT}/ledger.tsv" "${RESULT}/semantic-summary.txt" "${RESULT}/resource-summary.txt" <<'PY'
          import csv
          import hashlib
          import pathlib
          import sys

          ledger = pathlib.Path(sys.argv[1])
          summary = pathlib.Path(sys.argv[2])
          resource_summary = pathlib.Path(sys.argv[3])
          rows = list(csv.DictReader(ledger.open(), delimiter='\t'))
          if len(rows) != 407:
              raise SystemExit(f'incomplete ledger: {len(rows)}')
          ordinals = [int(r['ordinal']) for r in rows]
          if ordinals != list(range(1, 408)):
              raise SystemExit('ledger ordinal sequence invalid')
          identities = [r['identity'] for r in rows]
          if len(set(identities)) != 407:
              raise SystemExit('ledger identities are not unique')
          if any(r['selected'] != '1' for r in rows):
              raise SystemExit('completed ledger contains non-single-selected row')
          red = [int(r['ordinal']) for r in rows if r['result'] == 'RED']
          passed = sum(r['result'] == 'PASS' for r in rows)
          accepted_red = [int(r['ordinal']) for r in rows if int(r['ordinal']) <= 365 and r['result'] == 'RED']
          accepted = 365 - len(accepted_red)
          results = {int(r['ordinal']): r['result'] for r in rows}
          prior_red = [366,367,368,369,370,374,398]
          prior_set = set(prior_red)
          current_set = set(red)
          text = (
              'total=407\n'
              f'pass={passed}\n'
              f'red={len(red)}\n'
              f'red_ordinals={red}\n'
              f'accepted_prefix_pass={accepted}/365\n'
              f'accepted_prefix_red_ordinals={accepted_red}\n'
              f'prior_tb27_red_ordinals={prior_red}\n'
              f'prior_tb27_red_still_red={sorted(prior_set & current_set)}\n'
              f'new_red_vs_tb27={sorted(current_set - prior_set)}\n'
              f'cleared_red_vs_tb27={sorted(prior_set - current_set)}\n'
              f'ordinals_404_406_407={{404: {results.get(404)!r}, 406: {results.get(406)!r}, 407: {results.get(407)!r}}}\n'
              f'ledger_sha256={hashlib.sha256(ledger.read_bytes()).hexdigest()}\n'
          )
          summary.write_text(text)
          print(text, end='')
          timed = []
          for r in rows:
              try:
                  timed.append((float(r['elapsed_seconds']), int(r['peak_rss_kib']), int(r['ordinal']), r['identity']))
              except Exception:
                  pass
          longest = max(timed, default=None)
          peak = max(timed, key=lambda x: x[1], default=None)
          rtext = ''
          if longest:
              rtext += f'longest_ordinal={longest[2]}\nlongest_identity={longest[3]}\nlongest_seconds={longest[0]}\n'
          if peak:
              rtext += f'peak_rss_ordinal={peak[2]}\npeak_rss_identity={peak[3]}\npeak_rss_kib={peak[1]}\n'
          resource_summary.write_text(rtext)
          print(rtext, end='')
          PY
          sha256sum "${RESULT}/ledger.tsv" | tee "${RESULT}/ledger.sha256"

          cp "${RESULT}/raw/ordinal-404.log" "${RESULT}/ordinal-404-publication.log"
          cp "${RESULT}/raw/ordinal-406.log" "${RESULT}/ordinal-406-publication.log"
          cp "${RESULT}/raw/ordinal-407.log" "${RESULT}/ordinal-407-publication.log"
          grep -H -E '^m3Cp4c3' "${RESULT}"/raw/*.log > "${RESULT}/all-m3cp4c3-publication.txt" || true

          census_tree "$PKG" "${RESULT}/package-census-after.tsv"
          census_tree "$SOURCE" "${RESULT}/source-census-after.tsv"
          census_tree "$EXEC_VIEW" "${RESULT}/execution-view-after.tsv"
          package_census_after_sha="$(census_sha "${RESULT}/package-census-after.tsv")"
          source_census_after_sha="$(census_sha "${RESULT}/source-census-after.tsv")"
          [[ "$package_census_after_sha" == "$package_census_before_sha" ]] || fail_orchestration 'immutable package byte/mode census changed'
          [[ "$source_census_after_sha" == "$source_census_before_sha" ]] || {
            source_test_fixture_selector_mutation=true
            fail_orchestration 'immutable packaged source byte/mode census changed'
          }
          cmp -s "${RESULT}/execution-view-before.tsv" "${RESULT}/execution-view-after.tsv" || fail_orchestration 'execution view byte/mode census changed'
          {
            echo "package_census_equal=true"
            echo "package_census_sha256=$package_census_after_sha"
            echo "source_census_equal=true"
            echo "source_census_sha256=$source_census_after_sha"
            echo "execution_view_census_equal=true"
          } | tee "${RESULT}/postflight-immutability.txt"

          {
            echo "configure_execution=false"
            echo "compile_execution=false"
            echo "relink_execution=false"
            echo "package_repair=false"
            echo "mode_repair=false"
            echo "generated_discovery=false"
            echo "source_test_fixture_selector_mutation=false"
            echo "benchmark_execution=false"
          } > "${RESULT}/mutation-flags-after-runtime.txt"

          echo 'TB28_R2_COMPLETE: immutable selector407 execution complete; semantic disposition deferred to evidence review.'
          exit 0

      - name: Upload TB28 result evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-cp4c3-tb28-r2-result-${{ github.run_id }}
          path: ${{ runner.temp }}/m3-cp4c3-tb28-r2-result
          if-no-files-found: error
          retention-days: 30

      - name: Upload TB28 diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-cp4c3-tb28-r2-log-${{ github.run_id }}
          path: ${{ runner.temp }}/m3-cp4c3-tb28-r2.log
          if-no-files-found: error
          retention-days: 30

      - name: Fail on orchestration error
        if: always()
        env:
          GATE_STATUS: ${{ steps.gate.outputs.gate_status }}
        shell: bash
        run: |
          set -euo pipefail
          status="${GATE_STATUS:-99}"
          if [[ "$status" != "0" ]]; then
            echo "TB28 gate orchestration failed with status $status" >&2
            exit "$status"
          fi
