name: Agent Start Session Snapshot 20260829

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/start-session-snapshot-20260829-1339.txt

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: agent-start-session-snapshot-20260829
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/agent-start-session-snapshot-20260829.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  snapshot:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-source-snapshot.yml
    with:
      source_ref: 4ff78842b633ff9d550762fb6c61e6d24193f6c0
      artifact_prefix: agent-start-session-source
      retention_days: 7
    secrets: inherit
