name: Agent M4 CP3 TB2 PLAN Apply

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m4-cp3-tb2-plan-apply.txt

permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

concurrency:
  group: agent-m4-cp3-tb2-plan-apply
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/agent-m4-cp3-tb2-plan-apply.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m4-cp3-tb2-plan-apply
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  apply:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1DPz-6wEonhoiAkdEzDQoTK418OYawZbV
      patch_sha256: 'b06e0deca839b00bb954d336e74b0b81f84494210dab04f13f67b8688ddb40af'
      base_sha: 0eb2c573e0a0843141420fb46c6c71892cafd209
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: 'docs: freeze M4-CP3 TB2 row400 recovery plan'
    secrets: inherit
