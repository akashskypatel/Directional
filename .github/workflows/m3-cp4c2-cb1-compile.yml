name: M3 CP4c2 CB1 Compile

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m3-cp4c2-cb1-compile/**

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write

jobs:
  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m3-cp4c2-cb1-compile
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/m3-cp4c2-cb1-compile.yml
    secrets: inherit

  changed-owner:
    needs: validate
    uses: ./.github/workflows/agent-compile-reusable.yml
    with:
      source_sha: 8cf1ab3127748a32cb3cd13d5f79913774431d0e
      targets: directional_surface_cell_producer_tests
      artifact_prefix: m3-cp4c2-cb1-precompile
    secrets: inherit

  package:
    needs: changed-owner
    uses: ./.github/workflows/agent-compile-reusable.yml
    with:
      source_sha: 8cf1ab3127748a32cb3cd13d5f79913774431d0e
      targets: directional_core directional_pipeline directional_surface_cell_authority_kernel_tests directional_surface_cell_producer_tests directional_surface_cell_completion_tests directional_surface_cell_validation_tests directional_compiled_api_tests directional_benchmarks
      artifact_prefix: m3-cp4c2-cb1-package
    secrets: inherit
