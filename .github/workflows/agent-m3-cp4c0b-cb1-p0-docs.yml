name: M3 CP4c0b CB1 P0 Docs Apply

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m3-cp4c0b-cb1-p0-docs/run.txt

permissions:
  actions: read
  contents: write
  id-token: write
  issues: write
  pull-requests: write

concurrency:
  group: m3-cp4c0b-cb1-p0-docs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/agent-m3-cp4c0b-cb1-p0-docs.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m3-cp4c0b-cb1-p0-docs
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  apply:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1jhiXyMOg2wQknrH9m1uiiYYyGIqcXzTT
      patch_sha256: 80abc9f4ac123977c86b44b39558b7f1ab3383ffb05919a5d1b6fbe29ac1ee33
      base_sha: cf2c68a59f2030b41d5f9601d6956ece9eb8a459
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: 'docs: stop CP4c0b CB1 at P0.3 and require GMP'
      retention_days: 7
    secrets: inherit
