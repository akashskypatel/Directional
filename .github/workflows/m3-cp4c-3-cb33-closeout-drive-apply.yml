name: M3 CP4c-3 CB33 Closeout Drive Apply

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m3-cp4c-3-cb33-closeout-drive-apply.txt

permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

concurrency:
  group: m3-cp4c-3-cb33-closeout-drive-apply
  cancel-in-progress: false

jobs:
  validate-caller:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/m3-cp4c-3-cb33-closeout-drive-apply.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m3-cp4c-3-cb33-closeout-drive-apply
      commit_run_file: false
    secrets: inherit

  apply:
    needs: validate-caller
    if: ${{ needs.validate-caller.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 189a9aydEuw6SmiNoGOeXrkSxut7_HkhA
      patch_sha256: d9c21ef82b86df3d578e8b41e1f8468ce652219d9b819858e2bb7918a5c93464
      base_sha: b580e2038707f1685876019b0828f0535c17be33
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: "docs: close out CB33 orchestration correction"
      retention_days: 14
    secrets: inherit
