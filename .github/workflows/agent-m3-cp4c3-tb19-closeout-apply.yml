name: Agent M3 CP4c3 TB19 Closeout Apply

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/tb/m3-cp4c3-tb19-closeout-apply.txt

permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

concurrency:
  group: agent-m3-cp4c3-tb19-closeout-apply
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/agent-m3-cp4c3-tb19-closeout-apply.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m3-cp4c3-tb19-closeout-apply
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  apply:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1L-jZdw8br2e4zi_NK1G8cDZ4uUlPJFNo
      patch_sha256: '98210f77b2791c8d0c2a6c9bba3986fd8d15e5b320f6b201a5606ab4b9107785'
      base_sha: 8c8bc7934b8152bfc759459be845f68fa1232137
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: 'docs: close out M3-CP4c-3-TB19 and route to review'
    secrets: inherit
