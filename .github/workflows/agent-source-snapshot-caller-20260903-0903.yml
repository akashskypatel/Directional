name: Agent Source Snapshot Caller 20260903 0903

on:
  push:
    paths:
      - ".agents/connector-triggers/source-snapshot/session-20260903-0903.txt"

permissions:
  contents: read
  actions: read
  issues: write
  pull-requests: write

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/agent-source-snapshot-caller-20260903-0903.yml
      source_ref: ${{ github.sha }}
      retention_days: 1
    secrets: inherit

  snapshot:
    needs: validate
    uses: ./.github/workflows/agent-source-snapshot.yml
    with:
      source_ref: ae30c183c0b876a093cd1bbbd673f8e6cbd52f67
      retention_days: 1
    secrets: inherit
