name: M6 CP1 TB12 Close R1 Docs Apply

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m6-cp1-tb12-close-r1-apply.txt

permissions:
  actions: read
  contents: write
  id-token: write

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/m6-cp1-tb12-close-r1-apply.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  apply:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1a_5GnZPXLUGpTpls2vVQummMXI3yYhl5
      patch_sha256: 9d91dc7332783795549dca9a05d944a00adb9ebc861d643c73ddbd1b361d50b1
      base_sha: 1c859f112919e89a7ee71952d5dbae840f33389e
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: "docs: close M6-CP1-TB12-CLOSE-R1-EXEC"
    secrets: inherit

  mailbox:
    if: ${{ always() }}
    needs: [apply]
    permissions:
      actions: read
      contents: write
    uses: ./.github/workflows/workflow-mailbox-publisher.yml
    with:
      workflow_key: m6-cp1-tb12-close-r1-apply
      source_sha: ${{ github.sha }}
      source_ref: ${{ github.ref }}
      result: ${{ needs.apply.result }}
      summary: "Apply M6-CP1-TB12-CLOSE-R1-EXEC closeout documentation patch."
