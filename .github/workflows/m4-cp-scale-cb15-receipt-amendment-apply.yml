name: M4 CP SCALE CB15 Receipt Amendment Apply

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m4-cp-scale-cb15-receipt-amendment-apply-20260917.txt

permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

concurrency:
  group: m4-cp-scale-cb15-receipt-amendment-apply
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/m4-cp-scale-cb15-receipt-amendment-apply.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m4-cp-scale-cb15-receipt-amendment-apply
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  apply:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1jIEIDp5Y4TE0IuYzUCMNEu-UBb29dxvo
      patch_sha256: '7c51e5c697944dd371227e16258c3b8c41a8600a8f7b5475b47374daa6a04be6'
      base_sha: d1bd3c9634df9c59df127de93efb3af54f404711
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: 'test: expose CB15 cycle-order diagnostics in S5 receipt'
      retention_days: 14
    secrets: inherit
