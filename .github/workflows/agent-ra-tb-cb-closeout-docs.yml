name: Agent R-A T+B CB Durable Closeout

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/ra-tb-cb-closeout-docs.txt

permissions:
  contents: write

jobs:
  closeout:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact documentation head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 20
          submodules: false

      - name: Update durable R-A closeout state
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git status --porcelain=v1 | tee "$RUNNER_TEMP/status-before.txt"
          test ! -s "$RUNNER_TEMP/status-before.txt"
          python3 .agents/Directional/turn-payloads/ra-tb-cb-closeout/closeout.py

          changed="$(git status --porcelain=v1 | sed -E 's/^.. //' | sort)"
          expected="$(printf '%s\n' \
            .agents/Directional/Architecture_M1_Single_Authority_Cutover_Code_Build_Plan.md \
            .agents/Directional/CHANGELOG.md \
            .agents/Directional/Future_Chat_Session_Handoff.md \
            TODO.md | sort)"
          printf 'changed_documents=\n%s\n' "$changed" | tee "$RUNNER_TEMP/changed-documents.txt"
          test "$changed" = "$expected"
          grep -q '92bf0ae2b10856162f175d02aeac318e126f9d22' TODO.md
          grep -q 'immutable artifact-only R-A Test + Benchmark retry' .agents/Directional/Future_Chat_Session_Handoff.md
          grep -q '50 probes / 206 matches' .agents/Directional/Architecture_M1_Single_Authority_Cutover_Code_Build_Plan.md
          grep -q 'R-A-TB-CB-00 through R-A-TB-CB-04 runtime-gate remediation' .agents/Directional/CHANGELOG.md

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add TODO.md
          git add -f \
            .agents/Directional/Architecture_M1_Single_Authority_Cutover_Code_Build_Plan.md \
            .agents/Directional/CHANGELOG.md \
            .agents/Directional/Future_Chat_Session_Handoff.md
          git commit -m 'docs: record R-A T+B CB-00-04 compile closure'
          git push origin "HEAD:${GITHUB_REF_NAME}"
          git status --porcelain=v1 | tee "$RUNNER_TEMP/status-after.txt"
          test ! -s "$RUNNER_TEMP/status-after.txt"
          echo 'runtimeExecution=false'

      - name: Upload documentation activity evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ra-tb-cb-closeout-docs-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/status-before.txt
            ${{ runner.temp }}/status-after.txt
            ${{ runner.temp }}/changed-documents.txt
          if-no-files-found: warn
          retention-days: 7
