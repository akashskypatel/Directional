name: M5 CP3 CB3 Closeout Docs

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m5-cp3-cb3-closeout-docs.txt

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

concurrency:
  group: m5-cp3-cb3-closeout-docs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/m5-cp3-cb3-closeout-docs.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m5-cp3-cb3-closeout-docs
      commit_run_file: false
    secrets: inherit

  apply:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 13VnVQuGNRqBOxOUN5Ux_4GMHy9VnBtUc
      patch_sha256: c2a8e1517711511efee391239eefdd14dab1576ae091d2e9e5ebfd36664b90f2
      base_sha: 9edd3551ef030226d28eb8cdde0eb8d11fd8884b
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: M5-CP3-CB3 durable closeout and R2 plan
    secrets: inherit
