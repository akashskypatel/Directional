name: Agent CP4c2 CB1 Drive Apply

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/cp4c2-cb1-drive-apply/**

permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

jobs:
  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: cp4c2-cb1-drive-apply
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/agent-cp4c2-cb1-drive-apply.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  apply:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1LdxOHGRgJF54A1dXRfTPniqWZnFh3z84
      patch_sha256: e73496a759d27e627306656a6017dd30fd9e7f6b498e7c66d067994fa50c3cb2
      base_sha: 93d9d49f052fa481bd3a8ad8c9bf31eccda7705c
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: 'M3-CP4c-2-CB1: close runtime-free build turn'
      retention_days: 14
    secrets: inherit
