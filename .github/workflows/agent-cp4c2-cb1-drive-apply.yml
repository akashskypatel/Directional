name: Agent CP4c2 CB1 Drive Apply

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/cp4c2-cb1-drive-apply/**

permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

jobs:
  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: cp4c2-cb1-drive-apply
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/agent-cp4c2-cb1-drive-apply.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  apply:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1vve3wotop_70OwHiJBeLrGMsN9GnRYm7
      patch_sha256: 71ca44d90231be3c278c238d6a73d9ba5ae9890afb025b79bacfe6be052713b0
      base_sha: da2d913772f3c1206a170e03625be2e8a4c7cbd6
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: 'M3-CP4c-2-CB1: add certified surface cut graph authority'
      retention_days: 14
    secrets: inherit
