name: O32a Review Read-Only Boundary

on:
  push:
    branches:
      - scratch/p13-o32a-seed-review-20261105
    paths:
      - .github/workflows/o32a-review-boundary.yml

permissions:
  contents: read

jobs:
  boundary:
    runs-on: ubuntu-24.04
    steps:
      - name: Initialize persistent log
        run: |
          printf 'workflow=%s\nevent_sha=%s\nstarted_at=%s\n' "$GITHUB_WORKFLOW" "$GITHUB_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > "$RUNNER_TEMP/o32a-review-boundary.log"
      - uses: actions/checkout@v4
        with:
          ref: agent/surface_cell_quad/p5-recover-bridge-healing
          fetch-depth: 0
          persist-credentials: false
      - name: Check exact review boundary
        shell: bash
        run: |
          set -o pipefail
          {
            echo "source_branch=$(git branch --show-current)"
            echo "source_sha=$(git rev-parse HEAD)"
            echo '=== review_check.py boundary ==='
            python3 .agents/Directional/tools/review_check.py boundary
            status=$?
            echo "boundary_exit=$status"
            echo '=== source snapshot product drift ==='
            git diff --name-only 86e75845f6545cf1fb2535bc9d8ac5cbf2a6bd9e HEAD -- src include tests benchmarks cmake CMakeLists.txt
            echo '=== git status ==='
            git status -sb
            echo "check_finished_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            exit "$status"
          } 2>&1 | tee -a "$RUNNER_TEMP/o32a-review-boundary.log"
      - name: Upload read-only boundary report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: o32a-review-boundary-log-${{ github.run_id }}
          path: ${{ runner.temp }}/o32a-review-boundary.log
          if-no-files-found: error
  mailbox:
    if: always()
    needs: [boundary]
    permissions:
      actions: read
      contents: write
    uses: ./.github/workflows/workflow-mailbox-publisher.yml
    with:
      mailbox_branch: workflow-mailbox
      workflow_key: o32a-review-boundary
      source_sha: ${{ github.sha }}
      source_ref: ${{ github.ref }}
      result: ${{ needs.boundary.result }}
      summary: Read-only O32a working-branch Review boundary check.
# continuation8 audit: final post-fan-scope revision read-only boundary
