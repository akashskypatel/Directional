name: Agent M4 CP SCALE CB6 Drive Apply

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m4-cp-scale-cb6-drive-apply/trigger.txt

permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

concurrency:
  group: agent-m4-cp-scale-cb6-drive-apply
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/agent-m4-cp-scale-cb6-drive-apply.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m4-cp-scale-cb6-drive-apply
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  apply:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1yUWZtbU7bA_JaJn9_LeMx_4HOlKfUAWD
      patch_sha256: 'e0953dca1c312dc7cb92413c609d573557789427b5cc31bb03e7b36fa60d1241'
      base_sha: 53f8cbe4ca4db48471f4983a07aa0927d22baadb
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: 'test: publish CP-SCALE selector424'
    secrets: inherit
