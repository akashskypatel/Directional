name: M3 CP4c2 TB X2 R2 Closeout Apply

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m3-cp4c2-tb-x2-r2-closeout-apply/**

permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

concurrency:
  group: m3-cp4c2-tb-x2-r2-closeout-apply
  cancel-in-progress: false

jobs:
  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m3-cp4c2-tb-x2-r2-closeout-apply
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/m3-cp4c2-tb-x2-r2-closeout-apply.yml
    secrets: inherit

  apply:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1LDUxy5sNhb9tPkLekRzuppNbLlzgEy6s
      patch_sha256: b84670c629e5cdf64b2cd0d9ce9840b9f6f096260783ea1db2b661d88406d3b8
      base_sha: 410ace0522804f9d4eb622ff9b488235ce2699f7
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: "M3-CP4c-2-TB-X2-R2: record control stop and review plan"
      retention_days: 14
    secrets: inherit
