name: M6 CP1 TB3 Documentation Patch Apply

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m6-cp1-tb3-docs-apply.txt

permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

concurrency:
  group: m6-cp1-tb3-docs-apply-${{ github.ref }}
  cancel-in-progress: false

jobs:
  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m6-cp1-tb3-docs-apply
      commit_run_file: false
      trim_stale_comments: false
    secrets: inherit

  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/m6-cp1-tb3-docs-apply.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  apply:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1In0hZVogXJMy6Nys2KL_ahYzSR0NtIgN
      patch_sha256: 6896a25d4c0b9e8782e0034d87ffd81ef2087cb4f0e9a2ed8690dda4f748bc36
      base_sha: 39080dbe7ff8821b2bc36f743e15c25e09bfbc1e
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: "docs: record M6-CP1-TB3 execution evidence"
      retention_days: 7
    secrets: inherit
