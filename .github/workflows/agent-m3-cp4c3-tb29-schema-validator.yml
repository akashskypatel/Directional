name: M3 CP4c3 TB29 Workflow Draft Validator

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/workflow-schema-validator/m3-cp4c3-tb29-20260905.txt

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: m3-cp4c3-tb29-schema-${{ github.ref }}
  cancel-in-progress: false

jobs:
  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m3-cp4c3-tb29-schema
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  self-validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/agent-m3-cp4c3-tb29-schema-validator.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  validate-draft:
    needs: self-validate
    if: ${{ needs.self-validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .agents/Directional/turn-payloads/m3-cp4c3-tb29-exec-draft.yml
      source_ref: ${{ github.sha }}
    secrets: inherit
