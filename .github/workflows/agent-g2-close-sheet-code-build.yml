name: Agent G2 Close Sheet Code Build

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/g2-close-sheet-code-build-20260807.txt

permissions:
  contents: write

concurrency:
  group: agent-g2-close-sheet-code-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      WORK_BRANCH: agent/surface_cell_quad/p5-recover-bridge-healing
      PAYLOAD: .agents/Directional/turn-payloads/g2-close-sheet-authoritative-producer.patch
      PATCH_SHA256: 7b99d8a7ff227c2e4f07a1498805eb7fd34b542b772d3bd0c1bb1e455e31fa8c
    steps:
      - name: Initialize activity log
        shell: bash
        run: |
          set -euo pipefail
          LOG_FILE="$RUNNER_TEMP/g2-close-sheet-code-build.log"
          echo "LOG_FILE=$LOG_FILE" >> "$GITHUB_ENV"
          {
            echo "task=G2 close-sheet Code + Build"
            echo "event_sha=$GITHUB_SHA"
            echo "ref=$GITHUB_REF"
            date -u +"utc=%Y-%m-%dT%H:%M:%SZ"
          } > "$LOG_FILE"

      - name: Checkout bounded source
        uses: actions/checkout@v4
        with:
          ref: agent/surface_cell_quad/p5-recover-bridge-healing
          fetch-depth: 1
          submodules: false

      - name: Verify and apply exact patch
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee -a "$LOG_FILE") 2>&1
          echo "checkout_sha=$(git rev-parse HEAD)"
          test "$(git hash-object src/geometry/SurfaceCellTracing.cpp)" = "c9877d8ffa8aa5fbb59c83a1ab4b94eed5421431"
          test "$(git hash-object src/pipeline/RemeshPipeline.cpp)" = "533648a1b1fd008286f3ef3292813817ad1f1146"
          test "$(git hash-object tests/SurfaceCellsPhase10Tests.cpp)" = "b726b85d189c5018d53c8561888dcda0ab55fa58"
          test -f "$PAYLOAD"
          base64 -d "$PAYLOAD" > /tmp/g2-close-sheet.patch.xz
          xz -dc /tmp/g2-close-sheet.patch.xz > /tmp/g2-close-sheet.patch
          echo "$PATCH_SHA256  /tmp/g2-close-sheet.patch" | sha256sum -c -
          git apply --check /tmp/g2-close-sheet.patch
          git apply /tmp/g2-close-sheet.patch
          mapfile -t changed < <(git diff --name-only | sort)
          expected=(src/geometry/SurfaceCellTracing.cpp src/pipeline/RemeshPipeline.cpp tests/SurfaceCellsPhase10Tests.cpp)
          test "${#changed[@]}" -eq "${#expected[@]}"
          for i in "${!expected[@]}"; do test "${changed[$i]}" = "${expected[$i]}"; done
          test "$(git hash-object src/geometry/SurfaceCellTracing.cpp)" = "a60d9502cb425303648685468d3307a773259416"
          test "$(git hash-object src/pipeline/RemeshPipeline.cpp)" = "55af3205fd7cdb8f21357ac69516ffa29cf8a6d3"
          test "$(git hash-object tests/SurfaceCellsPhase10Tests.cpp)" = "7151077d7d4e0a10dad388dd008479f96fc1aae8"
          git diff --check
          git config user.name directional-agent
          git config user.email directional-agent@users.noreply.github.com
          git add -- "${expected[@]}"
          git commit -m "feat(surface-cells): isolate authoritative close sheets"
          SOURCE_COMMIT=$(git rev-parse HEAD)
          echo "SOURCE_COMMIT=$SOURCE_COMMIT" >> "$GITHUB_ENV"
          git push origin HEAD:"$WORK_BRANCH"
          test -z "$(git status --porcelain)"
          echo "source_commit=$SOURCE_COMMIT"

      - name: Install compile dependencies
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee -a "$LOG_FILE") 2>&1
          sudo apt-get update
          sudo apt-get install -y ninja-build libgmp-dev xz-utils

      - name: Initialize shallow submodules
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee -a "$LOG_FILE") 2>&1
          git submodule update --init --depth 1
          git submodule status

      - name: Configure compile-only build
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee -a "$LOG_FILE") 2>&1
          mkdir -p agent-build-logs
          {
            echo "source_commit=$SOURCE_COMMIT"
            cmake --version
            c++ --version
            ninja --version
          } | tee agent-build-logs/toolchain.txt
          cmake -S . -B agent-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DCMAKE_GTEST_DISCOVER_TESTS_DISCOVERY_MODE=PRE_TEST \
            -DBUILD_SHARED_LIBS=OFF \
            -DBUILD_TUTORIALS=OFF \
            -DBUILD_PYTHON=OFF \
            -DDIRECTIONAL_BUILD_CLI=OFF \
            -DDIRECTIONAL_BUILD_GUI=OFF \
            -DDIRECTIONAL_BUILD_BENCHMARKS=ON \
            -DDIRECTIONAL_BUILD_TESTS=ON \
            -DDIRECTIONAL_BUILD_HISTORICAL_TESTS=OFF \
            -DDIRECTIONAL_BUILD_LEGACY_INTEGRATION_TESTS=OFF \
            -DDIRECTIONAL_BUILD_OPTIONAL_GUIDANCE_TESTS=OFF \
            -DDIRECTIONAL_ENABLE_GMP=ON \
            -DDIRECTIONAL_ENABLE_PARDISO=OFF \
            -DDIRECTIONAL_ENABLE_CUDSS=OFF \
            -DDIRECTIONAL_ENABLE_SUITESPARSE=OFF \
            2>&1 | tee agent-build-logs/configure.log

      - name: Compile approved targets only
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee -a "$LOG_FILE") 2>&1
          cmake --build agent-build --parallel 2 --target \
            directional_core \
            directional_pipeline \
            directional_compiled_api_tests \
            directional_surface_cell_producer_tests \
            directional_surface_cell_completion_tests \
            directional_surface_cell_validation_tests \
            directional_benchmarks \
            2>&1 | tee agent-build-logs/build.log
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Package immutable build artifact
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee -a "$LOG_FILE") 2>&1
          root="$GITHUB_WORKSPACE/g2-close-sheet-code-build-artifact"
          rm -rf "$root"
          mkdir -p "$root"/{bin,lib,test-data/benchmarks,logs,metadata,source}
          cp agent-build/directional_benchmarks "$root/bin/"
          cp agent-build/directional_compiled_api_tests "$root/bin/"
          cp agent-build/directional_surface_cell_producer_tests "$root/bin/"
          cp agent-build/directional_surface_cell_completion_tests "$root/bin/"
          cp agent-build/directional_surface_cell_validation_tests "$root/bin/"
          cp agent-build/libdirectional_core.a "$root/lib/"
          cp agent-build/libdirectional_pipeline.a "$root/lib/"
          cp -a benchmarks/fixtures "$root/test-data/benchmarks/"
          cp agent-build-logs/configure.log agent-build-logs/build.log agent-build-logs/toolchain.txt "$root/logs/"
          cp agent-build/compile_commands.json "$root/source/"
          cp /tmp/g2-close-sheet.patch "$root/source/g2-close-sheet-authoritative-producer.patch"
          tar --exclude=.git --exclude=external --exclude=agent-build --exclude=g2-close-sheet-code-build-artifact \
              -cJf "$root/source/directional-g2-close-sheet-source-no-deps.tar.xz" .
          cat > "$root/metadata/source-authority.json" <<EOF
          {
            "sourceCommit": "$SOURCE_COMMIT",
            "patchSha256": "$PATCH_SHA256",
            "changedFileBlobs": {
              "src/geometry/SurfaceCellTracing.cpp": "a60d9502cb425303648685468d3307a773259416",
              "src/pipeline/RemeshPipeline.cpp": "55af3205fd7cdb8f21357ac69516ffa29cf8a6d3",
              "tests/SurfaceCellsPhase10Tests.cpp": "7151077d7d4e0a10dad388dd008479f96fc1aae8"
            }
          }
          EOF
          cat > "$root/metadata/command-boundary.txt" <<'EOF'
          Code + Build turn only.
          Allowed: exact patch verification/application, configure, compile/link approved targets, packaging/checksums.
          Prohibited and not executed: generated project binaries, tests, benchmarks, ctest discovery, CLI, GUI, help, list.
          EOF
          cat > "$root/metadata/build-authority.json" <<'EOF'
          {"configuration":"Release","generator":"Ninja","buildSharedLibs":false,"gtestDiscoveryMode":"PRE_TEST","approvedTargets":7,"runtimeExecution":false}
          EOF
          cat > "$root/README.md" <<EOF
          # Gate 2 Close-Sheet Code + Build Artifact

          Source commit: $SOURCE_COMMIT
          Compile-only artifact; no generated project binary was executed.
          EOF
          (cd "$root" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          test "$(wc -l < "$root/SHA256SUMS")" -ge 40
          echo "artifact_files=$(wc -l < "$root/SHA256SUMS")"

      - name: Record final repository state
        if: always()
        shell: bash
        run: |
          set +e
          {
            echo "final_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "final_head=$(git rev-parse HEAD 2>/dev/null)"
            git status --short 2>&1
          } | tee -a "$LOG_FILE"

      - name: Upload detailed activity log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g2-close-sheet-code-build-logs
          path: ${{ env.LOG_FILE }}
          if-no-files-found: error
          retention-days: 14

      - name: Upload build artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: g2-close-sheet-code-build
          path: g2-close-sheet-code-build-artifact
          if-no-files-found: error
          retention-days: 14
          compression-level: 6
