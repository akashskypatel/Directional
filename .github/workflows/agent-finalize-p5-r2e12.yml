name: Agent Finalize Surface Cell P5 R2E12

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .github/workflows/agent-finalize-p5-r2e12.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: surface-cell-p5-r2e12-finalize-${{ github.ref }}
  cancel-in-progress: false

env:
  BRANCH: agent/surface_cell_quad/p5-recover-bridge-healing
  SOURCE_COMMIT: 556efab8c26e012a6019e0b0a10fb847fc8e2ace
  PAYLOAD: .agents/Directional/patches/P5-R2E12-final-docs.tar.gz.b64
  PAYLOAD_B64_SHA256: dfc5623ad26d04c58309a771f997a157c8c531727172576f82034247e9f1749f
  PAYLOAD_SHA256: 4377f48f28823255898ffb52785b0f9a73ba97369719f77d02aea10d18f7b8be
  LOG_DIR: /tmp/p5-r2e12-finalize-logs
  LOG: /tmp/p5-r2e12-finalize-logs/activity.log

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - name: Initialize persistent activity log
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$LOG_DIR"
          {
            echo 'P5-R2E12 documentation finalization'
            echo "run_id=$GITHUB_RUN_ID"
            echo "event_sha=$GITHUB_SHA"
            echo "started_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } | tee "$LOG"

      - name: Checkout exact event commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 8
          submodules: false
          persist-credentials: true

      - name: Publish current authority and clean bounded files
        shell: bash
        run: |
          set -Eeuo pipefail
          exec > >(tee -a "$LOG") 2>&1
          finish() {
            rc=$?
            trap - EXIT
            set +x
            echo "exit_code=$rc"
            echo "finished_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git status --short --branch || true
            exit "$rc"
          }
          trap finish EXIT
          set -x

          event_sha=$(git rev-parse HEAD)
          test "$event_sha" = "$GITHUB_SHA"
          test "$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)" = "$event_sha"
          test -z "$(git status --porcelain=v1)"
          git merge-base --is-ancestor "$SOURCE_COMMIT" "$event_sha"
          git diff --name-only "$SOURCE_COMMIT" "$event_sha" | sort > /tmp/pre-finalize-changed.txt
          diff -u <(printf '%s\n' \
            .agents/Directional/patches/P5-R2E12-final-docs.tar.gz.b64 \
            .github/workflows/agent-finalize-p5-r2e12.yml | sort) /tmp/pre-finalize-changed.txt
          test "$(sha256sum "$PAYLOAD" | awk '{print $1}')" = "$PAYLOAD_B64_SHA256"

          base64 -d "$PAYLOAD" > /tmp/p5-r2e12-final-docs.tar.gz
          test "$(sha256sum /tmp/p5-r2e12-final-docs.tar.gz | awk '{print $1}')" = "$PAYLOAD_SHA256"
          rm -rf /tmp/p5-r2e12-final-docs
          mkdir -p /tmp/p5-r2e12-final-docs
          tar -xzf /tmp/p5-r2e12-final-docs.tar.gz -C /tmp/p5-r2e12-final-docs
          tar -tzf /tmp/p5-r2e12-final-docs.tar.gz | sort | tee /tmp/payload-files.txt
          ! grep -Eq '^\./(src|include|tests|benchmarks/fixtures|CMakeLists\.txt|\.github)/' /tmp/payload-files.txt

          python3 - <<'PY'
          from pathlib import Path
          marker = '## Mandatory turn hygiene and instruction preservation'
          old = Path('.agents/Directional/Future_Chat_Session_Handoff.md').read_text()
          new = Path('/tmp/p5-r2e12-final-docs/.agents/Directional/Future_Chat_Session_Handoff.md').read_text()
          assert marker in old and marker in new
          assert old[old.index(marker):] == new[new.index(marker):]
          PY

          cp /tmp/p5-r2e12-final-docs/TODO TODO
          cp /tmp/p5-r2e12-final-docs/MILESTONE_G_TODO.md MILESTONE_G_TODO.md
          cp /tmp/p5-r2e12-final-docs/.agents/Directional/Future_Chat_Session_Handoff.md .agents/Directional/
          cp /tmp/p5-r2e12-final-docs/.agents/Directional/Milestone_G_P5_R2E12_Code_Build_Report.md .agents/Directional/
          cp /tmp/p5-r2e12-final-docs/.agents/Directional/Milestone_G_P5_TB40_Artifact_Only_R2E12_Test_Benchmark_Plan.md .agents/Directional/
          cp /tmp/p5-r2e12-final-docs/benchmark-results/p5-r2e12-summary.json benchmark-results/

          git rm -f \
            .github/workflows/agent-finalize-p5-r2e12.yml \
            "$PAYLOAD" \
            .agents/Directional/Milestone_G_P5_TB39_Artifact_Only_R2E11_Test_Benchmark_Report.md \
            .agents/Directional/Milestone_G_P5_R2E12_Normalized_Authoritative_Exterior_Pair_Code_Build_Plan.md \
            benchmark-results/p5-tb39-summary.json
          git add TODO MILESTONE_G_TODO.md
          git add -f .agents/Directional benchmark-results/p5-r2e12-summary.json
          git diff --cached --check
          git diff --cached --name-only | sort | tee /tmp/changed.txt
          diff -u <(printf '%s\n' \
            .agents/Directional/Future_Chat_Session_Handoff.md \
            .agents/Directional/Milestone_G_P5_R2E12_Code_Build_Report.md \
            .agents/Directional/Milestone_G_P5_R2E12_Normalized_Authoritative_Exterior_Pair_Code_Build_Plan.md \
            .agents/Directional/Milestone_G_P5_TB39_Artifact_Only_R2E11_Test_Benchmark_Report.md \
            .agents/Directional/Milestone_G_P5_TB40_Artifact_Only_R2E12_Test_Benchmark_Plan.md \
            .agents/Directional/patches/P5-R2E12-final-docs.tar.gz.b64 \
            .github/workflows/agent-finalize-p5-r2e12.yml \
            MILESTONE_G_TODO.md \
            TODO \
            benchmark-results/p5-r2e12-summary.json \
            benchmark-results/p5-tb39-summary.json | sort) /tmp/changed.txt

          git config user.name directional-doc-agent
          git config user.email directional-doc-agent@users.noreply.github.com
          git commit -m 'P5-R2E12: record compile authority and TB40 plan [skip ci]'
          git push origin "HEAD:$BRANCH"

          final_sha=$(git rev-parse HEAD)
          test "$(git rev-parse HEAD^)" = "$event_sha"
          test "$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)" = "$final_sha"
          test ! -e "$PAYLOAD"
          test ! -e .github/workflows/agent-finalize-p5-r2e12.yml
          test -f .github/workflows/agent-source-snapshot.yml
          test -f .agents/Directional/Milestone_G_P5_R2E12_Code_Build_Report.md
          test -f .agents/Directional/Milestone_G_P5_TB40_Artifact_Only_R2E12_Test_Benchmark_Plan.md
          test -f benchmark-results/p5-r2e12-summary.json
          test ! -e .agents/Directional/Milestone_G_P5_TB39_Artifact_Only_R2E11_Test_Benchmark_Report.md
          test ! -e .agents/Directional/Milestone_G_P5_R2E12_Normalized_Authoritative_Exterior_Pair_Code_Build_Plan.md
          test ! -e benchmark-results/p5-tb39-summary.json

      - name: Always upload detailed workflow logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surface-cell-p5-r2e12-finalization-logs-${{ github.run_id }}
          path: /tmp/p5-r2e12-finalize-logs
          if-no-files-found: error
          retention-days: 30
