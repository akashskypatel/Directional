name: M6 CP1 TB3 Artifact-Only Test Benchmark

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m6-cp1-tb3-exec.txt

permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: m6-cp1-tb3-exec-${{ github.ref }}
  cancel-in-progress: false

jobs:
  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m6-cp1-tb3-exec
      commit_run_file: false
      trim_stale_comments: false
    secrets: inherit

  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/m6-cp1-tb3-exec.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  runtime:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
      TURN_ID: M6-CP1-TB3-EXEC
    steps:
      - name: Checkout orchestration source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          token: ${{ secrets.GH_TOKEN || github.token }}

      - name: Execute immutable artifact-only gate
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          CANDIDATE_ID=10840014758
          SOURCE_SHA=660015f2f15359fd426e2c855aea9f4201c70216
          ZIP_SHA=b1117c6efe2cdc8a04e46647fd1bb5af79094234a03348df8ffd6e6ae5ed5c66
          SOURCE_ARCHIVE_SHA=90c6305132ceca1bcd5f12dfd03a7a3b818fe3e9462128dedb5c3f5788f67ecc
          SELECTOR_SHA=d4a0d1b731cfd99e832f3c983e5741ab18cb27a314f380184c5ff84bd88d6414
          ROUTING_SHA=9c88a5ed3de0419c313aa0a36c0e2cf63e7edcdc17c06d9b74311f371c6c5707
          ROOT="${RUNNER_TEMP}/M6-CP1-TB3-EXEC"
          PKG="${ROOT}/package"
          SRC="${ROOT}/source"
          EXEC="${ROOT}/execution-view"
          RUN="${ROOT}/runtime"
          RESULT="${RUNNER_TEMP}/M6-CP1-TB3-EXEC-result"
          LOG="${RUNNER_TEMP}/M6-CP1-TB3-EXEC.log"
          ZIP="${ROOT}/candidate.zip"
          mkdir -p "$PKG" "$SRC" "$EXEC/bin" "$RUN" "$RESULT/raw/focused" "$RESULT/raw/selector" "$RESULT/resources/focused" "$RESULT/resources/selector"
          : > "$LOG"
          exec > >(tee -a "$LOG") 2>&1
          runtime_started=false
          runtime_completed=false
          orchestration_failure=false
          selection_integrity=true
          focused_executed=0
          selector_executed=0
          fail() { orchestration_failure=true; echo "ORCHESTRATION_FAILURE: $*" >&2; exit 90; }
          sha() { sha256sum "$1" | awk '{print $1}'; }
          census() {
            python3 - "$1" "$2" <<'PY'
          import hashlib,os,pathlib,stat,sys
          root=pathlib.Path(sys.argv[1]).resolve(); out=pathlib.Path(sys.argv[2]); rows=[]
          for p in [root,*sorted(root.rglob('*'), key=lambda q:q.relative_to(root).as_posix())]:
              rel='.' if p==root else p.relative_to(root).as_posix(); st=p.lstat(); mode=format(stat.S_IMODE(st.st_mode),'o')
              if stat.S_ISREG(st.st_mode):
                  h=hashlib.sha256()
                  with p.open('rb') as f:
                      for chunk in iter(lambda:f.read(1024*1024),b''): h.update(chunk)
                  kind,digest,target='file',h.hexdigest(),'-'
              elif stat.S_ISDIR(st.st_mode): kind,digest,target='directory','-','-'
              elif stat.S_ISLNK(st.st_mode): kind,digest,target='symlink','-',os.readlink(p)
              else: kind,digest,target='other','-','-'
              rows.append(f'{rel}\t{kind}\t{mode}\t{st.st_size}\t{digest}\t{target}\n')
          out.write_text(''.join(rows))
          PY
          }
          boundary() {
            cat > "$RESULT/execution-boundary.txt" <<EOF_BOUNDARY
          turn_id=${TURN_ID}
          runtime_started=${runtime_started}
          runtime_completed=${runtime_completed}
          orchestration_failure=${orchestration_failure}
          selection_integrity=${selection_integrity}
          focused_executed=${focused_executed}
          selector_executed=${selector_executed}
          total_executed=$((focused_executed + selector_executed))
          benchmark_execution=false
          configure_execution=false
          compile_execution=false
          relink_execution=false
          generated_discovery=false
          package_repair=false
          mode_repair=false
          source_test_fixture_selector_mutation=false
          retry_after_runtime_start=false
          EOF_BOUNDARY
          }
          trap 's=$?; set +e; boundary; echo "script_exit=$s" >> "$RESULT/execution-boundary.txt"; echo "finished_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$LOG"' EXIT

          {
            echo "turn_id=${TURN_ID}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "event=${GITHUB_EVENT_NAME}"
            echo "event_sha=${GITHUB_SHA}"
            echo "candidate_artifact_id=${CANDIDATE_ID}"
            echo "expected_source_sha=${SOURCE_SHA}"
            echo "started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > "$RESULT/environment.txt"

          artifact_json="$(curl --fail --silent --show-error -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${CANDIDATE_ID}")"
          provider="$(printf '%s' "$artifact_json" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("digest",""))')"
          [[ "$provider" == "sha256:$ZIP_SHA" ]] || fail "provider digest mismatch: $provider"
          curl -L --fail --silent --show-error -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${CANDIDATE_ID}/zip" -o "$ZIP"
          [[ "$(sha "$ZIP")" == "$ZIP_SHA" ]] || fail "downloaded artifact digest mismatch"
          printf 'artifact_id=%s\nprovider_digest=%s\ndownloaded_zip_sha256=%s\n' "$CANDIDATE_ID" "$provider" "$(sha "$ZIP")" > "$RESULT/candidate-artifact-authority.txt"

          unzip -q "$ZIP" -d "$PKG"
          [[ -f "$PKG/SHA256SUMS" ]] || fail "missing package manifest"
          (cd "$PKG" && sha256sum -c SHA256SUMS) | tee "$RESULT/package-manifest-before.txt"
          [[ "$(grep -c ': OK$' "$RESULT/package-manifest-before.txt")" -eq 28 ]] || fail "package manifest not 28/28"
          [[ "$(cat "$PKG/metadata/source-commit.txt")" == "$SOURCE_SHA" ]] || fail "source SHA mismatch"
          [[ "$(cat "$PKG/metadata/build-exit-code.txt")" == 0 ]] || fail "build receipt nonzero"
          [[ "$(cat "$PKG/metadata/preflight-exit-code.txt")" == 0 ]] || fail "preflight receipt nonzero"
          for f in "$PKG"/metadata/source-status-*.txt; do [[ ! -s "$f" ]] || fail "unclean source receipt: $(basename "$f")"; done
          for t in runtimeExecution=false turnBoundary=Code+Build-only exactArithmeticBackend=GMP preflightCompile=true; do grep -Fxq "$t" "$PKG/metadata/command-boundary.txt" || fail "missing boundary token: $t"; done
          grep -Fq 'DIRECTIONAL_ENABLE_GMP:BOOL=ON' "$PKG/metadata/CMakeCache.txt" || fail "GMP CMake disabled"
          grep -Fq 'libgmpxx.so' "$PKG/metadata/gmp-evidence.txt" || fail "gmpxx link evidence missing"
          grep -Fq 'libgmp.so' "$PKG/metadata/gmp-evidence.txt" || fail "gmp link evidence missing"

          source_archive="$PKG/source/source-${SOURCE_SHA}.tar.gz"
          [[ -f "$source_archive" && "$(sha "$source_archive")" == "$SOURCE_ARCHIVE_SHA" ]] || fail "source archive mismatch"
          tar -xzf "$source_archive" -C "$SRC"
          selector="$SRC/.agents/Directional/Architecture_M5_CP4_CB2_Required_Green_Selector_449.txt"
          routing="$SRC/.agents/Directional/Architecture_M5_CP4_CB2_Selector_449_Static_Routing_Receipt.tsv"
          [[ "$(sha "$selector")" == "$SELECTOR_SHA" ]] || fail "selector449 digest mismatch"
          [[ "$(sha "$routing")" == "$ROUTING_SHA" ]] || fail "routing449 digest mismatch"
          python3 - "$selector" "$routing" "$RESULT/selector-routing-authority.txt" <<'PY'
          import collections,hashlib,pathlib,sys
          s=pathlib.Path(sys.argv[1]); r=pathlib.Path(sys.argv[2]); out=pathlib.Path(sys.argv[3])
          data=s.read_bytes(); lines=data.splitlines(keepends=True)
          if b'\r' in data or len(lines)!=449 or any(not x.endswith(b'\n') for x in lines): raise SystemExit('selector byte/row contract mismatch')
          ids=[x.decode().rstrip('\n') for x in lines]
          rows=[]
          for line in r.read_text().splitlines():
              p=line.split('\t')
              if len(p)!=3: raise SystemExit('routing row shape mismatch')
              rows.append((int(p[0]),p[1],p[2]))
          if len(rows)!=449 or [x[0] for x in rows]!=list(range(1,450)) or [x[1] for x in rows]!=ids: raise SystemExit('routing sequence mismatch')
          c=collections.Counter(x[2] for x in rows)
          expected={'directional_surface_cell_authority_kernel_tests':32,'directional_surface_cell_producer_tests':301,'directional_surface_cell_completion_tests':75,'directional_surface_cell_validation_tests':41}
          if c!=expected: raise SystemExit(f'owner census mismatch: {dict(c)}')
          out.write_text('selector_rows=449\nselector_sha256='+hashlib.sha256(data).hexdigest()+'\nrouting_rows=449\nrouting_sha256='+hashlib.sha256(r.read_bytes()).hexdigest()+'\nrouting_sequence_equals_selector=true\nowner_census='+repr(dict(c))+'\n')
          PY

          required=(directional_surface_cell_authority_kernel_tests directional_surface_cell_producer_tests directional_surface_cell_completion_tests directional_surface_cell_validation_tests)
          printf 'binary\tsha256\tmode\tsize\n' > "$RESULT/owner-executables.tsv"
          for exe in "${required[@]}"; do
            p="$PKG/bin/$exe"; [[ -f "$p" && -x "$p" ]] || fail "missing/non-executable owner binary: $exe"
            printf '%s\t%s\t%s\t%s\n' "$exe" "$(sha "$p")" "$(stat -c '%a' "$p")" "$(stat -c '%s' "$p")" >> "$RESULT/owner-executables.tsv"
          done

          cp -a "$PKG/bin/." "$EXEC/bin/"
          mkdir -p "$EXEC/test-data/benchmarks"
          cp -a "$SRC/benchmarks/fixtures" "$EXEC/test-data/benchmarks/"
          [[ -f "$EXEC/test-data/benchmarks/fixtures/milestone-g/mechanical_feature.obj" ]] || fail "execution fixture tree incomplete"
          census "$PKG" "$RESULT/package-census-before.tsv"
          census "$SRC" "$RESULT/source-census-before.tsv"
          census "$EXEC" "$RESULT/execution-view-before.tsv"

          focused="$RESULT/focused-routing.tsv"
          cat > "$focused" <<'EOF_FOCUSED'
          ordinal	identity	binary
          1	M6CP1.SurfaceOccurrenceComplexPublishesFourSemanticCornersPerCell	directional_surface_cell_producer_tests
          2	M6CP1.SourceFaceRowPermutationPreservesOccurrenceIdentity	directional_surface_cell_producer_tests
          3	M6CP1.SurfaceOccurrenceComplexRejectsMalformedMissingAndDuplicateRelationEndpoints	directional_surface_cell_producer_tests
          4	M6CP1.CoincidentUnrelatedOccurrencesRemainDistinct	directional_surface_cell_producer_tests
          5	SurfaceCellTransitionQuotient.MultiIsolationMaterializationRetainsAllLocalSheets	directional_surface_cell_producer_tests
          6	M5CP3.ProducedTorusPeriodicPairStorageSwapPreservesSemanticDirection	directional_surface_cell_producer_tests
          EOF_FOCUSED

          run_one() {
            phase="$1"; ord="$2"; identity="$3"; binary="$4"; ledger="$5"
            raw="$RESULT/raw/${phase}/ordinal-$(printf '%03d' "$ord").log"
            tm="$RESULT/resources/${phase}/ordinal-$(printf '%03d' "$ord").time.txt"
            work="$RUN/${phase}/ordinal-$(printf '%03d' "$ord")"; mkdir -p "$work"
            set +e
            (cd "$work" && /usr/bin/time -v -o "$tm" env GTEST_FAIL_IF_NO_TEST_SELECTED=1 GTEST_COLOR=no "$EXEC/bin/$binary" --gtest_filter="$identity") >"$raw" 2>&1
            code=$?
            set -e
            selected="$(grep -Ec '^\[ RUN      \] ' "$raw" || true)"
            skipped="$(grep -Ec '^\[  SKIPPED \] ' "$raw" || true)"
            passed="$(grep -Ec '^\[       OK \] ' "$raw" || true)"
            [[ "$selected" -eq 1 ]] || { selection_integrity=false; fail "exact-one selection failed for $identity: $selected"; }
            [[ "$skipped" -eq 0 ]] || { selection_integrity=false; fail "skip observed for $identity"; }
            result=RED; [[ "$code" -eq 0 && "$passed" -eq 1 ]] && result=PASS
            printf '%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\n' "$ord" "$identity" "$binary" "$code" "$selected" "$skipped" "$passed" "$result" "$(sha "$raw")" >> "$ledger"
          }

          runtime_started=true
          fl="$RESULT/focused-ledger.tsv"; printf 'ordinal\tidentity\tbinary\texit\tselected\tskipped\tpassed\tresult\traw_sha256\n' > "$fl"
          while IFS=$'\t' read -r ord id bin; do [[ "$ord" == ordinal ]] && continue; run_one focused "$ord" "$id" "$bin" "$fl"; focused_executed=$((focused_executed+1)); done < "$focused"
          [[ "$focused_executed" -eq 6 ]] || fail "focused count mismatch"
          sl="$RESULT/selector-ledger.tsv"; printf 'ordinal\tidentity\tbinary\texit\tselected\tskipped\tpassed\tresult\traw_sha256\n' > "$sl"
          while IFS=$'\t' read -r ord id bin; do run_one selector "$ord" "$id" "$bin" "$sl"; selector_executed=$((selector_executed+1)); done < "$routing"
          [[ "$selector_executed" -eq 449 ]] || fail "selector count mismatch"
          runtime_completed=true

          python3 - "$fl" "$sl" "$RESULT/semantic-summary.txt" "$RESULT/recovery-observations.txt" <<'PY'
          import csv,pathlib,sys
          f=list(csv.DictReader(open(sys.argv[1]),delimiter='\t')); s=list(csv.DictReader(open(sys.argv[2]),delimiter='\t'))
          if len(f)!=6 or len(s)!=449: raise SystemExit('ledger size mismatch')
          def stats(rows):
              red=[int(x['ordinal']) for x in rows if x['result']!='PASS']; return len(rows)-len(red),red
          fp,fr=stats(f); sp,sr=stats(s)
          pathlib.Path(sys.argv[3]).write_text(f'focused_total=6\nfocused_pass={fp}\nfocused_red={len(fr)}\nfocused_red_ordinals={fr}\nselector_total=449\nselector_pass={sp}\nselector_red={len(sr)}\nselector_red_ordinals={sr}\ntotal_processes=455\ntotal_pass={fp+sp}\ntotal_red={len(fr)+len(sr)}\nbenchmark_execution=0\n')
          pathlib.Path(sys.argv[4]).write_text(f'row140_identity={s[139]["identity"]}\nrow140_result={s[139]["result"]}\nmulti_isolation_identity={f[4]["identity"]}\nmulti_isolation_result={f[4]["result"]}\npair_swap_identity={f[5]["identity"]}\npair_swap_result={f[5]["result"]}\n')
          PY
          grep -Rho 'OccurrenceInvalidCornerAuthority' "$RESULT/raw" | wc -l | tr -d ' ' | awk '{print "occurrence_invalid_corner_authority_mentions="$1}' >> "$RESULT/recovery-observations.txt"

          census "$PKG" "$RESULT/package-census-after.tsv"
          census "$SRC" "$RESULT/source-census-after.tsv"
          census "$EXEC" "$RESULT/execution-view-after.tsv"
          cmp -s "$RESULT/package-census-before.tsv" "$RESULT/package-census-after.tsv" || fail "package census changed"
          cmp -s "$RESULT/source-census-before.tsv" "$RESULT/source-census-after.tsv" || fail "source census changed"
          cmp -s "$RESULT/execution-view-before.tsv" "$RESULT/execution-view-after.tsv" || fail "execution-view census changed"
          [[ "$(sha "$ZIP")" == "$ZIP_SHA" && "$(sha "$source_archive")" == "$SOURCE_ARCHIVE_SHA" && "$(sha "$selector")" == "$SELECTOR_SHA" && "$(sha "$routing")" == "$ROUTING_SHA" ]] || fail "immutable authority changed"
          (cd "$PKG" && sha256sum -c SHA256SUMS) | tee "$RESULT/package-manifest-after.txt"
          [[ "$(grep -c ': OK$' "$RESULT/package-manifest-after.txt")" -eq 28 ]] || fail "postflight manifest not 28/28"
          printf 'package_census_equal=true\nsource_census_equal=true\nexecution_view_census_equal=true\ncandidate_zip_unchanged=true\nsource_archive_unchanged=true\nselector_unchanged=true\nrouting_unchanged=true\nmanifest_after=28/28\n' > "$RESULT/immutability.txt"
          [[ $((focused_executed+selector_executed)) -eq 455 ]] || fail "aggregate count mismatch"
          boundary
          echo 'script_exit=0' >> "$RESULT/execution-boundary.txt"
          (cd "$RESULT" && find . -type f ! -name SHA256SUMS -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > SHA256SUMS && sha256sum -c SHA256SUMS >/dev/null)
          echo "M6-CP1-TB3-EXEC complete: 455 fresh exact-filter processes; semantic interpretation deferred to Review."

      - name: Upload result evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: directional-m6-cp1-tb3-result-${{ github.run_id }}
          path: ${{ runner.temp }}/M6-CP1-TB3-EXEC-result
          if-no-files-found: error
          retention-days: 7

      - name: Upload diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: directional-m6-cp1-tb3-log-${{ github.run_id }}
          path: ${{ runner.temp }}/M6-CP1-TB3-EXEC.log
          if-no-files-found: error
          retention-days: 7

      - name: Record final checkout status
        if: always()
        shell: bash
        run: |
          set +e
          echo "final_job_status=${{ job.status }}"
          echo "final_sha=$(git rev-parse HEAD 2>/dev/null || echo unavailable)"
          git status --short 2>&1 || true

      - name: Fail closed on orchestration failure
        if: always()
        shell: bash
        run: test "${{ steps.gate.outcome }}" = "success"
