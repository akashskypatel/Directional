name: M4 DEFN Drive Schema Validate

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m4-defn-drive-schema/m4-defn-drive-schema-20260909.txt

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: m4-defn-drive-schema-${{ github.ref }}
  cancel-in-progress: false

jobs:
  self-validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/m4-defn-drive-schema.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m4-defn-drive-schema
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  validate-target:
    needs: self-validate
    if: ${{ needs.self-validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .agents/Directional/turn-payloads/m4-defn-drive-apply.yml
      source_ref: ${{ github.sha }}
    secrets: inherit
