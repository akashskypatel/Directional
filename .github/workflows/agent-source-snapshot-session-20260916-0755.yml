name: Agent Source Snapshot Session 20260916 0755

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/source-snapshot/session-20260916-0755.txt

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: agent-source-snapshot-session-20260916-0755
  cancel-in-progress: false

jobs:
  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: source-snapshot-session-20260916-0755
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/agent-source-snapshot-session-20260916-0755.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  snapshot:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-source-snapshot.yml
    with:
      source_ref: 4107d693675f207c4501576f6546e997edcdf1a5
      artifact_prefix: agent-source-snapshot-4107d693
      retention_days: 7
    secrets: inherit
