name: Trigger P5 Materialization

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .github/workflows/agent-trigger-materialize-p5.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    steps:
      - name: Dispatch materialization workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run agent-materialize-p5.yml --ref agent/surface_cell_quad/p5-recover-bridge-healing
