name: Agent CB14 Closeout Drive Apply

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/cb14-closeout-drive-apply/**

permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

concurrency:
  group: agent-cb14-closeout-drive-apply-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/agent-cb14-closeout-drive-apply.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: cb14-closeout-drive-apply
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  apply:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1syZDRzxxqSzpfKEMPmdTJxH0ZL71FcRN
      patch_sha256: f92fd0edea28dee3688cb4c49e20ba74091693d1d55bd8dd3dd24d621a76ea3f
      base_sha: 234c79edee400e630f085030eebc93f13f0dfd17
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: 'docs: close out M3-CP4c-3-CB14'
      retention_days: 14
    secrets: inherit
