      file_id: 1DIHflVYOBbJOqviCHbAoWtoDeBARm4lR
      patch_sha256: 2fa8575e486fc20fb26b866fd20a40149c2d78b80610f01e520fcc437367d4df
      base_sha: 7e5d30854e0d776bae5bad282c5aad1a45bbae45
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: 'docs: close out M3 CP4c-1 TB-R4 semantic red'
      retention_days: 14
    secrets: inherit
