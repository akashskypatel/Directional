name: M6 CP3 TB1 Entry Exec Closeout Docs
on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m6-cp3-tb1-entry-exec-closeout-docs.txt
permissions:
  actions: read
  contents: write
  id-token: write
jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/m6-cp3-tb1-entry-exec-closeout-docs.yml
      source_ref: ${{ github.sha }}
    secrets: inherit
  apply:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 13D1U8cZcYZwIeeheP6smFcmU7jjpq_NF
      patch_sha256: '564e2db9c839540d9b69fa53175b2ef181fd8fd903eac80f01e47dd5d5713744'
      base_sha: d4afd48a97d3f686ccec34e92d6cde940d95fd50
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: 'M6-CP3-TB1-ENTRY-EXEC: record artifact-only RED evidence'
      retention_days: 14
    secrets: inherit
  mailbox:
    if: ${{ always() }}
    needs: [validate, apply]
    permissions:
      actions: read
      contents: write
    uses: ./.github/workflows/workflow-mailbox-publisher.yml
    with:
      workflow_key: m6-cp3-tb1-entry-exec-closeout-docs
      source_sha: ${{ github.sha }}
      source_ref: ${{ github.ref }}
      result: ${{ needs.apply.result }}
      summary: M6-CP3-TB1-ENTRY-EXEC durable RED evidence closeout.
