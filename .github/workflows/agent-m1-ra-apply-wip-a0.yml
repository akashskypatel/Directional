name: Agent M1 R-A Apply WIP

on:
  push:
    branches: [agent/surface_cell_quad/p5-recover-bridge-healing]
    paths: [.agents/connector-triggers/m1-ra-wip-a17.txt]

permissions: {contents: write}
concurrency: {group: agent-m1-ra-apply-wip, cancel-in-progress: false}

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Initialize activity log
        shell: bash
        run: |
          set -euo pipefail
          LOG="$RUNNER_TEMP/activity.log"; : > "$LOG"
          { echo "task=M1 R-A WIP A17 materializer contract cutover"; echo "ref=$GITHUB_REF"; echo "sha=$GITHUB_SHA"; date -u +"utc=%Y-%m-%dT%H:%M:%SZ"; } | tee -a "$LOG"
      - name: Checkout triggering commit
        uses: actions/checkout@v4
        with: {fetch-depth: 1}
      - name: Apply and push bounded source patch
        shell: bash
        run: |
          set -euo pipefail
          LOG="$RUNNER_TEMP/activity.log"; exec > >(tee -a "$LOG") 2>&1
          trap 'rc=$?; echo "exit_code=$rc"; echo "final_head=$(git rev-parse HEAD 2>/dev/null || true)"; git status --short 2>/dev/null || true; exit $rc' EXIT
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          PATCH="$RUNNER_TEMP/a17.patch"; base64 -d .agents/Directional/turn-payloads/m1-ra-wip-a17.patch.gz.b64 | gzip -dc > "$PATCH"
          echo "patch_sha256=$(sha256sum "$PATCH" | awk '{print $1}')"
          test "$(sha256sum "$PATCH" | awk '{print $1}')" = "b3560dbc4c1dff31c6750bb20a59830f36875d2d54e5c186e86b35af858fc3d3"
          ! grep -E '^diff --git a/\.github/workflows/' "$PATCH"
          git apply --check "$PATCH"; git apply "$PATCH"; git diff --check
          git add include/directional/pipeline/RemeshPipeline.h tests/SurfaceCellTransitionQuotientTests.cpp tests/SurfaceCellsPhase10Tests.cpp
          test "$(git diff --cached --name-only | wc -l)" -eq 3
          git config user.name directional-agent; git config user.email directional-agent@users.noreply.github.com
          git commit -m "wip(m1): remove raw labels from phase-front materializer contract"
          git push origin HEAD:agent/surface_cell_quad/p5-recover-bridge-healing
          echo "pushed_head=$(git rev-parse HEAD)"
      - name: Upload activity log
        if: always()
        uses: actions/upload-artifact@v4
        with: {name: "m1-ra-wip-a17-log-${{ github.run_id }}", path: "${{ runner.temp }}/activity.log", if-no-files-found: error, retention-days: 7}
