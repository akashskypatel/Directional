name: Agent M1 R-A Apply WIP

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m1-ra-wip-a6.txt

permissions:
  contents: write

concurrency:
  group: agent-m1-ra-apply-wip
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Initialize activity log
        shell: bash
        run: |
          set -euo pipefail
          LOG="$RUNNER_TEMP/activity.log"
          : > "$LOG"
          {
            echo "task=M1 R-A WIP A6 completion typed source authority"
            echo "event=$GITHUB_EVENT_NAME"
            echo "ref=$GITHUB_REF"
            echo "sha=$GITHUB_SHA"
            echo "runner=$RUNNER_OS"
            date -u +"utc=%Y-%m-%dT%H:%M:%SZ"
          } | tee -a "$LOG"

      - name: Checkout triggering commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Apply and push bounded source patch
        shell: bash
        run: |
          set -euo pipefail
          LOG="$RUNNER_TEMP/activity.log"
          exec > >(tee -a "$LOG") 2>&1
          trap 'rc=$?; echo "exit_code=$rc"; echo "final_head=$(git rev-parse HEAD 2>/dev/null || true)"; echo "status_begin"; git status --short 2>/dev/null || true; echo "status_end"; exit $rc' EXIT

          test "$GITHUB_REF_NAME" = "agent/surface_cell_quad/p5-recover-bridge-healing"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git --version

          PATCH="$RUNNER_TEMP/m1-ra-wip-a6.patch"
          base64 -d .agents/Directional/turn-payloads/m1-ra-wip-a6.patch.gz.b64 | gzip -dc > "$PATCH"
          echo "patch_sha256=$(sha256sum "$PATCH" | awk '{print $1}')"
          test "$(sha256sum "$PATCH" | awk '{print $1}')" = "e520564e5dad823826082d99f9873d9667d33c59cd5890a58517c923b2f844f6"
          if grep -E '^diff --git a/\.github/workflows/' "$PATCH"; then
            echo "workflow path found in patch" >&2
            exit 1
          fi

          git apply --check "$PATCH"
          git apply "$PATCH"
          git diff --check
          git add include/directional/geometry/PatchDescriptor.h include/directional/geometry/PureQuadCompletion.h src/geometry/PatchDescriptor.cpp src/geometry/PureQuadCompletion.cpp src/pipeline/RemeshPipeline.cpp
          echo "staged_paths_begin"
          git diff --cached --name-only
          echo "staged_paths_end"
          test "$(git diff --cached --name-only | wc -l)" -eq 5

          git config user.name "directional-agent"
          git config user.email "directional-agent@users.noreply.github.com"
          git commit -m "wip(m1): route pure-quad completion through typed source authority"
          git push origin HEAD:agent/surface_cell_quad/p5-recover-bridge-healing
          echo "pushed_head=$(git rev-parse HEAD)"

      - name: Upload activity log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m1-ra-wip-a6-log-${{ github.run_id }}
          path: ${{ runner.temp }}/activity.log
          if-no-files-found: error
          retention-days: 7
