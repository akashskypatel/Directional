name: Agent M1 R-A Apply WIP A0

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m1-ra-wip-a0.txt

permissions:
  contents: write

concurrency:
  group: agent-m1-ra-apply-wip-a0
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Initialize activity log
        shell: bash
        run: |
          set -euo pipefail
          LOG="$RUNNER_TEMP/activity.log"
          : > "$LOG"
          {
            echo "task=M1 R-A WIP A0 source patch"
            echo "event=$GITHUB_EVENT_NAME"
            echo "ref=$GITHUB_REF"
            echo "sha=$GITHUB_SHA"
            echo "runner=$RUNNER_OS"
            date -u +"utc=%Y-%m-%dT%H:%M:%SZ"
          } | tee -a "$LOG"

      - name: Checkout triggering commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Apply and push bounded source patch
        shell: bash
        run: |
          set -euo pipefail
          LOG="$RUNNER_TEMP/activity.log"
          exec > >(tee -a "$LOG") 2>&1
          trap 'rc=$?; echo "exit_code=$rc"; echo "final_head=$(git rev-parse HEAD 2>/dev/null || true)"; echo "status_begin"; git status --short 2>/dev/null || true; echo "status_end"; exit $rc' EXIT

          test "$GITHUB_REF_NAME" = "agent/surface_cell_quad/p5-recover-bridge-healing"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git --version

          PATCH="$RUNNER_TEMP/m1-ra-wip-a0.patch"
          cat \
            .agents/Directional/turn-payloads/m1-ra-wip-a0.part.00 \
            .agents/Directional/turn-payloads/m1-ra-wip-a0.part.01 \
            .agents/Directional/turn-payloads/m1-ra-wip-a0.part.02 \
            .agents/Directional/turn-payloads/m1-ra-wip-a0.part.03 \
            .agents/Directional/turn-payloads/m1-ra-wip-a0.part.04 \
            > "$PATCH"
          echo "patch_sha256=$(sha256sum "$PATCH" | awk '{print $1}')"
          test "$(sha256sum "$PATCH" | awk '{print $1}')" = "07d8c087373bb8f9181ce1c946a32c2122875b27b7e810854ec595de2ec44d43"
          if grep -E '^diff --git a/\.github/workflows/' "$PATCH"; then
            echo "workflow path found in patch" >&2
            exit 1
          fi

          git apply --check "$PATCH"
          git apply "$PATCH"
          git diff --check
          git add \
            include/directional/geometry/SourceTopologyRegions.h \
            include/directional/geometry/SurfaceCellTracing.h \
            src/geometry/SurfaceCellTracing.cpp
          echo "staged_paths_begin"
          git diff --cached --name-only
          echo "staged_paths_end"
          test "$(git diff --cached --name-only | wc -l)" -eq 3

          git config user.name "directional-agent"
          git config user.email "directional-agent@users.noreply.github.com"
          git commit -m "wip(m1): introduce checked source topology authority product"
          git push origin HEAD:agent/surface_cell_quad/p5-recover-bridge-healing
          echo "pushed_head=$(git rev-parse HEAD)"

      - name: Upload activity log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m1-ra-wip-a0-log-${{ github.run_id }}
          path: ${{ runner.temp }}/activity.log
          if-no-files-found: error
          retention-days: 7
