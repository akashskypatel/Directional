name: Agent M1 R-A Apply WIP

on:
  push:
    branches: [agent/surface_cell_quad/p5-recover-bridge-healing]
    paths: [.agents/connector-triggers/m1-ra-wip-a35.txt]

permissions: {contents: write}
concurrency: {group: agent-m1-ra-apply-wip, cancel-in-progress: false}

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Initialize activity log
        shell: bash
        run: |
          set -euo pipefail
          LOG="$RUNNER_TEMP/activity.log"; : > "$LOG"
          { echo "task=M1 R-A Phase21/22 compile repair A35"; echo "ref=$GITHUB_REF"; echo "sha=$GITHUB_SHA"; date -u +"utc=%Y-%m-%dT%H:%M:%SZ"; } | tee -a "$LOG"
      - name: Checkout triggering commit
        uses: actions/checkout@v4
        with: {fetch-depth: 1}
      - name: Apply and push bounded test repair
        shell: bash
        run: |
          set -euo pipefail
          LOG="$RUNNER_TEMP/activity.log"; exec > >(tee -a "$LOG") 2>&1
          trap 'rc=$?; echo "exit_code=$rc"; echo "final_head=$(git rev-parse HEAD 2>/dev/null || true)"; git status --short 2>/dev/null || true; exit $rc' EXIT
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{label}: expected one match, found {count}")
              return text.replace(old, new, 1)

          def replace_exact(text, old, new, expected, label):
              count = text.count(old)
              if count != expected:
                  raise RuntimeError(f"{label}: expected {expected} matches, found {count}")
              return text.replace(old, new)

          helper = '''const directional::geometry::SourceTopologyRegions *test_source_authority(
              const Eigen::MatrixXi &faces, const std::vector<int> &components,
              const std::vector<int> &sheets) {
            directional::geometry::SurfaceCellTracingOptions tracing;
            tracing.sourceFaceComponents = components;
            tracing.sourceFaceSheets = sheets;
            auto authority = directional::geometry::surface_cell_tracing_detail::
                build_source_topology_regions(faces, tracing);
            if (!authority.has_value()) {
              throw std::runtime_error("Failed to construct typed test source authority.");
            }
            static std::vector<std::unique_ptr<directional::geometry::SourceTopologyRegions>>
                arena;
            arena.push_back(std::make_unique<directional::geometry::SourceTopologyRegions>(
                std::move(*authority)));
            return arena.back().get();
          }

          '''

          p21 = Path("tests/SurfaceMeshOptimizerPhase21Tests.cpp")
          text = p21.read_text()
          text = replace_once(
              text,
              "#include <directional/geometry/SurfaceMeshOptimizer.h>\n",
              "#include <directional/geometry/SurfaceMeshOptimizer.h>\n#include <directional/geometry/SurfaceCellTracing.h>\n",
              "phase21 tracing include")
          text = replace_once(text, "#include <cmath>\n", "#include <cmath>\n#include <memory>\n", "phase21 memory include")
          text = replace_once(text, "namespace {\n\n", "namespace {\n\n" + helper, "phase21 authority helper")
          text = replace_once(
              text,
              "  constraints.sourceFaceComponent.assign(\n      static_cast<std::size_t>(sourceFaces.rows()), 0);\n  constraints.sourceFaceSheet.assign(\n      static_cast<std::size_t>(sourceFaces.rows()), 0);\n",
              "  const std::vector<int> sourceComponents(\n      static_cast<std::size_t>(sourceFaces.rows()), 0);\n  const std::vector<int> sourceSheets(\n      static_cast<std::size_t>(sourceFaces.rows()), 0);\n  constraints.sourceAuthority =\n      test_source_authority(sourceFaces, sourceComponents, sourceSheets);\n",
              "phase21 default authority")
          text = replace_once(
              text,
              "  constraints.sourceFaceComponent = {0, 0, 1, 1};\n  constraints.sourceFaceSheet = {0, 0, 1, 1};\n",
              "  constraints.sourceAuthority =\n      test_source_authority(sourceFaces, {0, 0, 1, 1}, {0, 0, 1, 1});\n",
              "phase21 close-sheet component authority")
          text = replace_exact(
              text,
              "  constraints.sourceFaceComponent = {0, 0, 0, 0};\n  constraints.sourceFaceSheet = {0, 0, 1, 1};\n",
              "  constraints.sourceAuthority =\n      test_source_authority(sourceFaces, {0, 0, 0, 0}, {0, 0, 1, 1});\n",
              2,
              "phase21 close-sheet authority")
          p21.write_text(text)

          p22 = Path("tests/SurfaceMeshOptimizerPhase22Tests.cpp")
          text = p22.read_text()
          text = replace_once(
              text,
              "#include <directional/geometry/SurfaceMeshOptimizer.h>\n",
              "#include <directional/geometry/SurfaceMeshOptimizer.h>\n#include <directional/geometry/SurfaceCellTracing.h>\n",
              "phase22 tracing include")
          text = replace_once(text, "#include <cstdint>\n", "#include <cstdint>\n#include <memory>\n", "phase22 memory include")
          text = replace_once(text, "namespace {\n\n", "namespace {\n\n" + helper, "phase22 authority helper")
          text = replace_once(
              text,
              "  options.sourceFaceComponents = &components;\n  options.sourceFaceSheets = &sheets;\n",
              "  options.sourceAuthority =\n      test_source_authority(sourceFaces, components, sheets);\n",
              "phase22 validator options authority")
          text = replace_once(
              text,
              "  constraints.sourceFaceComponent.assign(\n      static_cast<std::size_t>(sourceFaces.rows()), 0);\n  constraints.sourceFaceSheet.assign(\n      static_cast<std::size_t>(sourceFaces.rows()), 0);\n",
              "  const std::vector<int> sourceComponents(\n      static_cast<std::size_t>(sourceFaces.rows()), 0);\n  const std::vector<int> sourceSheets(\n      static_cast<std::size_t>(sourceFaces.rows()), 0);\n  constraints.sourceAuthority =\n      test_source_authority(sourceFaces, sourceComponents, sourceSheets);\n",
              "phase22 final constraints authority")
          text = replace_exact(
              text,
              "  directional::geometry::SourceChartTransitionGraph graph(\n      sourceFaces, components, sheets, hardEdges);\n",
              "  const auto *sourceAuthority =\n      test_source_authority(sourceFaces, components, sheets);\n  directional::geometry::SourceChartTransitionGraph graph(\n      sourceFaces, *sourceAuthority, hardEdges);\n",
              2,
              "phase22 chart graph authority")
          text = replace_once(
              text,
              "  constraints.sourceFaceComponent = fixture.components;\n  constraints.sourceFaceSheet = fixture.sheets;\n",
              "  constraints.sourceAuthority = test_source_authority(\n      fixture.sourceFaces, fixture.components, fixture.sheets);\n",
              "phase22 hard rail constraints authority")
          text = replace_once(
              text,
              "      SourcePointLabelSupport support(\n          &fixture.sourceFaces, &fixture.components, &fixture.sheets,\n          &fixture.hardEdges);\n",
              "      SourcePointLabelSupport support(\n          &fixture.sourceFaces,\n          test_source_authority(fixture.sourceFaces, fixture.components,\n                                fixture.sheets),\n          &fixture.hardEdges);\n",
              "phase22 label support authority")
          text = replace_once(
              text,
              "  SurfaceOptimizationConstraints boundaryConstraints;\n  boundaryConstraints.sourceFaceSheet = sheets;\n",
              "  SurfaceOptimizationConstraints boundaryConstraints;\n  boundaryConstraints.sourceAuthority =\n      test_source_authority(sourceFaces, components, sheets);\n",
              "phase22 boundary rail authority")
          text = replace_once(
              text,
              "  SurfaceOptimizationConstraints featureConstraints;\n  featureConstraints.sourceFaceSheet = sheets;\n",
              "  SurfaceOptimizationConstraints featureConstraints;\n  featureConstraints.sourceAuthority =\n      test_source_authority(sourceFaces, components, sheets);\n",
              "phase22 feature rail authority")
          text = replace_once(
              text,
              "  constraints.sourceFaceComponent = {0, 0, 1, 1};\n  constraints.sourceFaceSheet = {0, 0, 0, 0};\n\n  directional::geometry::SurfaceProjectionBvh bvh(vertices, sourceFaces);\n  directional::geometry::SurfaceProjectionOptions projectionOptions;\n  projectionOptions.faceComponents = &constraints.sourceFaceComponent;\n  projectionOptions.faceSheets = &constraints.sourceFaceSheet;\n",
              "  const std::vector<int> sourceComponents = {0, 0, 1, 1};\n  const std::vector<int> sourceSheets = {0, 0, 0, 0};\n  constraints.sourceAuthority =\n      test_source_authority(sourceFaces, sourceComponents, sourceSheets);\n\n  directional::geometry::SurfaceProjectionBvh bvh(vertices, sourceFaces);\n  directional::geometry::SurfaceProjectionOptions projectionOptions;\n  projectionOptions.faceComponents = &sourceComponents;\n  projectionOptions.faceSheets = &sourceSheets;\n",
              "phase22 orientation projection authority")
          text = replace_once(
              text,
              "  constraints.sourceFaceComponent = {7, 7, 7};\n  constraints.sourceFaceSheet = {0, 1, 1};\n",
              "  constraints.sourceAuthority =\n      test_source_authority(constraints.sourceFaces, {7, 7, 7}, {0, 1, 1});\n",
              "phase22 m1b default authority")
          text = replace_once(
              text,
              "  constraints.sourceFaceSheet = {0, 0, 1};\n",
              "  constraints.sourceAuthority =\n      test_source_authority(constraints.sourceFaces, {7, 7, 7}, {0, 0, 1});\n",
              "phase22 m1b same-sheet authority")
          text = replace_once(
              text,
              "  componentMismatch.sourceFaceComponent[1] = 8;\n",
              "  componentMismatch.sourceAuthority = test_source_authority(\n      componentMismatch.sourceFaces, {7, 8, 7}, {0, 1, 1});\n",
              "phase22 component mismatch authority")
          text = replace_once(
              text,
              "  sheetMismatch.sourceFaceSheet[1] = 2;\n",
              "  sheetMismatch.sourceAuthority = test_source_authority(\n      sheetMismatch.sourceFaces, {7, 7, 7}, {0, 2, 1});\n",
              "phase22 sheet mismatch authority")
          p22.write_text(text)
          PY
          git diff --check
          git add tests/SurfaceMeshOptimizerPhase21Tests.cpp tests/SurfaceMeshOptimizerPhase22Tests.cpp
          test "$(git diff --cached --name-only | wc -l)" -eq 2
          git config user.name directional-agent
          git config user.email directional-agent@users.noreply.github.com
          git commit -m "fix(m1): migrate remaining optimizer validation tests to source authority"
          git push origin HEAD:agent/surface_cell_quad/p5-recover-bridge-healing
          echo "pushed_head=$(git rev-parse HEAD)"
      - name: Upload activity log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "m1-ra-wip-a35-log-${{ github.run_id }}"
          path: "${{ runner.temp }}/activity.log"
          if-no-files-found: error
          retention-days: 7
