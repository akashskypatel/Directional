name: Agent CP4c3 TB2 Re-execution R3

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/cp4c3-tb2-exec-r3/run.txt

permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: agent-cp4c3-tb2-exec-r3-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate_caller:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/agent-cp4c3-tb2-exec-r3-temp.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: cp4c3-tb2-exec-r3
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  execute:
    needs: validate_caller
    if: ${{ needs.validate_caller.outputs.valid == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Initialize persistent log
        shell: bash
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/cp4c3-tb2-exec-r3.log"
          : > "$log"
          printf '%s\n' \
            "workflow=${GITHUB_WORKFLOW}" \
            "run_id=${GITHUB_RUN_ID}" \
            "event_sha=${GITHUB_SHA}" \
            "semantic_source=005512f20ed56edc793f4d6505f3d2b4c2999c71" \
            "package70_artifact=9744461475" \
            "selector_count=373" \
            "execution_mode=artifact-only-fresh-process" \
            "target_mapping=selector-ordinal-ranges" \
            "repository_mapping_dependency=false" \
            "benchmarkExecution=false" \
            "started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" | tee -a "$log"

      - name: Checkout orchestration control only
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          token: ${{ secrets.GH_TOKEN || github.token }}

      - name: Immutable package and derived-mapping preflight
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_PACKAGE70_SHA256: 4265079b78af1a95300eebdaa5f2b2643030aa1ad2f51b70f904d88b16de7fe5
          EXPECTED_SOURCE_ARCHIVE_SHA256: c7cd8b4bbba2d3b374da7c7f18e27c0e688ffe7679c261b644c6fffbf34426b1
          EXPECTED_SELECTOR373_SHA256: b47c269851fad1384b5dc9baaf674b3d4ad80ec6c2b40f7f8eda2055c6f44834
        shell: bash
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/cp4c3-tb2-exec-r3.log"
          exec > >(tee -a "$log") 2>&1
          zip="${RUNNER_TEMP}/package70.zip"
          pkg="${RUNNER_TEMP}/package70"
          src="${RUNNER_TEMP}/package70-source"
          out="${RUNNER_TEMP}/tb2-r3-result"
          mapping="${RUNNER_TEMP}/selector-targets.tsv"
          rm -rf "$pkg" "$src" "$out" "$mapping"
          mkdir -p "$pkg" "$src" "$out/logs"
          trap 'rc=$?; printf "%s\n" status=ORCHESTRATION_RED gate_exit=3 phase=preflight "preflight_exit=$rc" > "$out/status.txt"; echo 3 > "$RUNNER_TEMP/gate-exit-code"; exit "$rc"' ERR

          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/9744461475/zip" > "$zip"
          echo "${EXPECTED_PACKAGE70_SHA256}  ${zip}" | sha256sum -c -
          unzip -q "$zip" -d "$pkg"
          (cd "$pkg" && sha256sum -c SHA256SUMS)
          test "$(wc -l < "$pkg/SHA256SUMS" | tr -d ' ')" = 55
          test "$(cat "$pkg/metadata/source-commit.txt")" = 005512f20ed56edc793f4d6505f3d2b4c2999c71
          grep -Fx runtimeExecution=false "$pkg/metadata/command-boundary.txt"
          grep -Fx exactArithmeticBackend=GMP "$pkg/metadata/command-boundary.txt"
          grep -Fx semanticBinariesUnchanged=true "$pkg/metadata/command-boundary.txt"
          grep -q libgmpxx "$pkg/metadata/gmp-evidence.txt"
          grep -q libgmp "$pkg/metadata/gmp-evidence.txt"
          for status_file in "$pkg"/metadata/source-status-*.txt; do test ! -s "$status_file"; done

          archive="$(find "$pkg/source" -maxdepth 1 -type f -name 'source-*.tar.gz' -print -quit)"
          test -n "$archive"
          echo "${EXPECTED_SOURCE_ARCHIVE_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "$archive" -C "$src"
          selector="$src/.agents/Directional/Architecture_M3_CP4c3_Required_Green_Selector_373.txt"
          echo "${EXPECTED_SELECTOR373_SHA256}  ${selector}" | sha256sum -c -
          test "$(wc -l < "$selector" | tr -d ' ')" = 373
          test "$(sort -u "$selector" | wc -l | tr -d ' ')" = 373

          awk '
            NR <= 32  { target="directional_surface_cell_producer_tests" }
            NR >= 33  && NR <= 40  { target="directional_surface_cell_completion_tests" }
            NR >= 41  && NR <= 46  { target="directional_surface_cell_producer_tests" }
            NR >= 47  && NR <= 57  { target="directional_surface_cell_completion_tests" }
            NR >= 58  && NR <= 96  { target="directional_surface_cell_producer_tests" }
            NR == 97  { target="directional_surface_cell_completion_tests" }
            NR >= 98  && NR <= 111 { target="directional_surface_cell_producer_tests" }
            NR >= 112 && NR <= 126 { target="directional_surface_cell_completion_tests" }
            NR >= 127 && NR <= 152 { target="directional_surface_cell_validation_tests" }
            NR >= 153 && NR <= 182 { target="directional_surface_cell_authority_kernel_tests" }
            NR >= 183 && NR <= 296 { target="directional_surface_cell_producer_tests" }
            NR >= 297 && NR <= 315 { target="directional_surface_cell_validation_tests" }
            NR >= 316 && NR <= 373 { target="directional_surface_cell_producer_tests" }
            { print NR "\t" target "\t" $0 }
          ' "$selector" > "$mapping"
          test "$(wc -l < "$mapping" | tr -d ' ')" = 373
          test "$(awk -F '\t' '$2=="directional_surface_cell_producer_tests"{n++} END{print n+0}' "$mapping")" = 263
          test "$(awk -F '\t' '$2=="directional_surface_cell_completion_tests"{n++} END{print n+0}' "$mapping")" = 35
          test "$(awk -F '\t' '$2=="directional_surface_cell_validation_tests"{n++} END{print n+0}' "$mapping")" = 45
          test "$(awk -F '\t' '$2=="directional_surface_cell_authority_kernel_tests"{n++} END{print n+0}' "$mapping")" = 30
          awk -F '\t' 'BEGIN{ok=1} $1!=NR || $2!~/^directional_surface_cell_(producer|authority_kernel|completion|validation)_tests$/ {ok=0} END{exit ok?0:1}' "$mapping"
          cut -f3- "$mapping" | awk '{print}' > "${RUNNER_TEMP}/mapping-identities.txt"
          awk '{print}' "$selector" > "${RUNNER_TEMP}/selector-identities.txt"
          cmp -s "${RUNNER_TEMP}/selector-identities.txt" "${RUNNER_TEMP}/mapping-identities.txt"

          test -f "$pkg/test-data/benchmarks/fixtures/milestone_g_manifest.json"
          test -f "$pkg/test-data/benchmarks/fixtures/milestone-g/mechanical_feature.obj"
          test -f "$pkg/test-data/benchmarks/fixtures/milestone-g/sphere_prescribed.obj"
          for exe in producer authority_kernel completion validation; do
            test "$(stat -c %a "$pkg/bin/directional_surface_cell_${exe}_tests")" = 755
          done

          sha256sum "$zip" > "$out/package70-before.sha256"
          sha256sum "$archive" > "$out/source-archive-before.sha256"
          sha256sum "$selector" > "$out/selector373-before.sha256"
          sha256sum "$mapping" > "$out/derived-mapping-before.sha256"
          cp "$mapping" "$out/derived-mapping.tsv"
          cp "$pkg/metadata/command-boundary.txt" "$out/command-boundary.txt"
          printf '%s\n' \
            preflight=PASS \
            package70_sha256=${EXPECTED_PACKAGE70_SHA256} \
            source_archive_sha256=${EXPECTED_SOURCE_ARCHIVE_SHA256} \
            selector373_sha256=${EXPECTED_SELECTOR373_SHA256} \
            "derived_mapping_sha256=$(sha256sum "$mapping" | awk '{print $1}')" \
            target_mapping_source=selector-ordinal-ranges \
            producer_identities=263 \
            completion_identities=35 \
            validation_identities=45 \
            authority_kernel_identities=30 \
            fixture_root=${pkg}/test-data \
            known_fixture_exists=true \
            package_manifest_entries=55 \
            runtimeExecution_before=false | tee "$out/preflight.txt"
          touch "$RUNNER_TEMP/preflight-pass"

      - name: Execute selector 373 one identity per fresh process
        shell: bash
        run: |
          set -u -o pipefail
          log="${RUNNER_TEMP}/cp4c3-tb2-exec-r3.log"
          pkg="${RUNNER_TEMP}/package70"
          out="${RUNNER_TEMP}/tb2-r3-result"
          mapping="${RUNNER_TEMP}/selector-targets.tsv"
          result="$out/result.tsv"
          : > "$result"
          gate_exit=0
          status=GREEN
          first_red_ordinal=0
          first_red_identity=""
          first_red_selected=0
          first_red_exit=0

          while IFS=$'\t' read -r ordinal target identity; do
            test_log="$(printf '%s/logs/%03d.log' "$out" "$ordinal")"
            echo "[$ordinal/373] $identity ($target)" | tee -a "$log"
            (cd "$pkg" && "$pkg/bin/$target" "--gtest_filter=$identity") >"$test_log" 2>&1
            rc=$?
            selected="$(grep -c '^\[ RUN      \]' "$test_log" || true)"
            printf '%s\t%s\t%s\t%s\t%s\n' "$ordinal" "$target" "$identity" "$rc" "$selected" >> "$result"
            if [[ "$selected" != 1 ]]; then
              status=ORCHESTRATION_RED
              gate_exit=3
              first_red_ordinal="$ordinal"
              first_red_identity="$identity"
              first_red_selected="$selected"
              first_red_exit="$rc"
              break
            fi
            if [[ "$rc" != 0 ]]; then
              status=SEMANTIC_RED
              gate_exit=2
              first_red_ordinal="$ordinal"
              first_red_identity="$identity"
              first_red_selected="$selected"
              first_red_exit="$rc"
              break
            fi
          done < "$mapping"

          executed="$(wc -l < "$result" | tr -d ' ')"
          passed="$(awk -F '\t' '$4==0 && $5==1{n++} END{print n+0}' "$result")"
          if [[ "$gate_exit" == 0 && "$executed" != 373 ]]; then
            status=ORCHESTRATION_RED
            gate_exit=3
          fi
          if [[ "$gate_exit" == 0 && "$passed" != 373 ]]; then
            status=ORCHESTRATION_RED
            gate_exit=3
          fi
          printf '%s\n' \
            "status=$status" \
            "gate_exit=$gate_exit" \
            "executed=$executed" \
            "passed=$passed" \
            "first_red_ordinal=$first_red_ordinal" \
            "first_red_identity=$first_red_identity" \
            "first_red_selected=$first_red_selected" \
            "first_red_exit=$first_red_exit" \
            "finished_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" | tee "$out/status.txt" | tee -a "$log"
          echo "$gate_exit" > "$RUNNER_TEMP/gate-exit-code"
          exit 0

      - name: Immutable postflight
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/cp4c3-tb2-exec-r3.log"
          out="${RUNNER_TEMP}/tb2-r3-result"
          if [[ ! -f "$RUNNER_TEMP/preflight-pass" ]]; then
            printf '%s\n' postflight=SKIPPED reason=preflight-did-not-complete | tee "$out/postflight.txt" | tee -a "$log"
            exit 0
          fi
          pkg="${RUNNER_TEMP}/package70"
          src="${RUNNER_TEMP}/package70-source"
          zip="${RUNNER_TEMP}/package70.zip"
          mapping="${RUNNER_TEMP}/selector-targets.tsv"
          archive="$(find "$pkg/source" -maxdepth 1 -type f -name 'source-*.tar.gz' -print -quit)"
          selector="$src/.agents/Directional/Architecture_M3_CP4c3_Required_Green_Selector_373.txt"
          trap 'rc=$?; echo 3 > "$RUNNER_TEMP/gate-exit-code"; printf "%s\n" postflight=FAIL "postflight_exit=$rc" | tee -a "$log"; exit "$rc"' ERR
          (cd "$pkg" && sha256sum -c SHA256SUMS)
          sha256sum "$zip" > "$out/package70-after.sha256"
          sha256sum "$archive" > "$out/source-archive-after.sha256"
          sha256sum "$selector" > "$out/selector373-after.sha256"
          sha256sum "$mapping" > "$out/derived-mapping-after.sha256"
          diff -u "$out/package70-before.sha256" "$out/package70-after.sha256"
          diff -u "$out/source-archive-before.sha256" "$out/source-archive-after.sha256"
          diff -u "$out/selector373-before.sha256" "$out/selector373-after.sha256"
          diff -u "$out/derived-mapping-before.sha256" "$out/derived-mapping-after.sha256"
          for exe in producer authority_kernel completion validation; do
            test "$(stat -c %a "$pkg/bin/directional_surface_cell_${exe}_tests")" = 755
          done
          printf '%s\n' \
            postflight=PASS \
            packageMutation=false \
            sourceMutation=false \
            selectorMutation=false \
            derivedMappingMutation=false \
            compileExecution=false \
            relinkExecution=false \
            repairExecution=false \
            generatedDiscovery=false \
            benchmarkExecution=false | tee "$out/postflight.txt" | tee -a "$log"

      - name: Upload TB2 re-execution result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-cp4c3-tb2-r3-result-${{ github.run_id }}
          path: ${{ runner.temp }}/tb2-r3-result
          if-no-files-found: error
          retention-days: 7

      - name: Upload persistent diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-cp4c3-tb2-r3-log-${{ github.run_id }}
          path: ${{ runner.temp }}/cp4c3-tb2-exec-r3.log
          if-no-files-found: error
          retention-days: 7

      - name: Propagate gate status
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f "$RUNNER_TEMP/gate-exit-code" || exit 4
          exit "$(cat "$RUNNER_TEMP/gate-exit-code")"
