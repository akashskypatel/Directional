      - .agents/connector-triggers/m3-cp4c3-tb24-docs-apply-20260904.txt

permissions:
  actions: read
  contents: write
  id-token: write
  issues: write
  pull-requests: write

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/agent-m3-cp4c3-tb24-docs-apply.yml
      source_ref: ${{ github.sha }}
      retention_days: 14
    secrets: inherit

  observe:
