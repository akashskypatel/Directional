name: Agent M4 CP3 TB5 Review Final Fix Apply

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/drive-apply/m4-cp3-tb5-review-final-fix/**

permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

concurrency:
  group: agent-m4-cp3-tb5-review-final-fix-apply-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/agent-m4-cp3-tb5-review-final-fix-apply.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m4-cp3-tb5-review-final-fix-apply
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  apply:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1ueZB0sjSIabFt6o_uKE7L1Q8mSjFtzG_
      patch_sha256: '4e70d9c43f0cfe47440e05bbf76bfa336e8df734321e7db5932d13429bc05154'
      base_sha: 5465c449cc07080599b110b05566c9c6a2f15b28
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: 'docs: reconcile M4-CP3-TB5 orientation currency'
      retention_days: 7
    secrets: inherit
