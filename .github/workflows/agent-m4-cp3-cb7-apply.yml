name: Agent M4 CP3 CB7 Apply

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/drive-apply/m4-cp3-cb7/**

permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

concurrency:
  group: agent-m4-cp3-cb7-apply-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/agent-m4-cp3-cb7-apply.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m4-cp3-cb7-apply
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  apply:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1v1m7f7tZDet3hWoxdrk6b__9vxdTaDyG
      patch_sha256: e2a6ca286b22d378f70280dd45a96ec995ee54836ee958edda711770f275c7fe
      base_sha: 18ef11691bf4cf15e8aedcf22a57dd2372673f9c
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: 'test: constrain CP3 torus hard-rail authority'
      retention_days: 7
    secrets: inherit
