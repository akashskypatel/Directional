name: Agent M4 CP3 CB7 Apply

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/drive-apply/m4-cp3-cb7/**

permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

concurrency:
  group: agent-m4-cp3-cb7-apply-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/agent-m4-cp3-cb7-apply.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m4-cp3-cb7-apply
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  apply:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 176mE92ixMjcu-PA0iRzO7RV3s5aRjknL
      patch_sha256: 0ec47443d6ac1609696525910238ac0eb39fbc257f8c090b699c58625ceb8a0d
      base_sha: 6623e008cfaf093687a14f977252258ee2624097
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: 'docs: close M4-CP3-CB7 and freeze TB5 gate'
      retention_days: 7
    secrets: inherit
