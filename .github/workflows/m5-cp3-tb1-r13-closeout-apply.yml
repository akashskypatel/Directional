name: M5 CP3 TB1 R13 Closeout Apply

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m5-cp3-tb1-r13-closeout-apply.txt

permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

concurrency:
  group: m5-cp3-tb1-r13-closeout-apply-${{ github.ref }}
  cancel-in-progress: false

jobs:
  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m5-cp3-tb1-r13-closeout-apply
      commit_run_file: false
      trim_stale_comments: false
    secrets: inherit

  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/m5-cp3-tb1-r13-closeout-apply.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  apply:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1zBTciKIDyvIGrkIFWLzANEgMclLbB3ck
      patch_sha256: 1399ac86baebabcbfc8834f14b950567724b96e4ebbfa87e936eb6333a269cc2
      base_sha: c673cc36abff860be35360d2e948ab6e2080cf05
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: "docs: close out M5 CP3 TB1 R13 execution"
    secrets: inherit
