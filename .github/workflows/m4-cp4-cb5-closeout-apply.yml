name: M4 CP4 CB5 Closeout Apply

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m4-cp4-cb5/validate-closeout-apply-caller.txt
      - .agents/connector-triggers/m4-cp4-cb5/apply-closeout-docs.txt

permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

concurrency:
  group: m4-cp4-cb5-closeout-apply-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/m4-cp4-cb5-closeout-apply.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m4-cp4-cb5-closeout-apply
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  apply:
    needs: validate
    if: "${{ startsWith(github.event.head_commit.message, 'M4-CP4-CB5: apply closeout docs') && needs.validate.outputs.valid == 'true' }}"
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1sPioZ4Zs4jxD9FUpCMar_rQDNlyl1iLp
      patch_sha256: a34c38eff43b1ab598e16b7222c3b6cb697b1f5c75bcbd26f9bb07a0b4071339
      base_sha: d00ff2c7f48d8fd83bda068cd7f4d2cccf306027
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: 'M4-CP4-CB5: closeout documentation'
    secrets: inherit
