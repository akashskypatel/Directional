name: M4 CP4 CB5 Apply Closeout Docs

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m4-cp4-cb5/validate-closeout-apply-caller.txt
      - .agents/connector-triggers/m4-cp4-cb5/apply-closeout-docs.txt

permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

concurrency:
  group: m4-cp4-cb5-closeout-apply-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/m4-cp4-cb5-closeout-apply.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m4-cp4-cb5-closeout-apply
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  apply:
    needs: validate
    if: "${{ startsWith(github.event.head_commit.message, 'M4-CP4-CB5: apply closeout docs') && needs.validate.outputs.valid == 'true' }}"
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1ETbv4rEZtqszOibxzqXFTMM0xfinEPbW
      patch_sha256: 4d7f29bb1c14fa1d88239b1913016162dab597e7b472ba99c3d694275d765e47
      base_sha: 864656c4414c2e0b44924bfc58f0125719377bd4
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: 'M4-CP4-CB5: publish closeout and TB2 plan'
    secrets: inherit
