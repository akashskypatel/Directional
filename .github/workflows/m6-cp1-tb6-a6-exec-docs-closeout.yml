name: M6 CP1 TB6 A6 EXEC Docs Closeout

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m6-cp1-tb6-a6-exec-docs-closeout.txt

permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

concurrency:
  group: m6-cp1-tb6-a6-exec-docs-closeout
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/m6-cp1-tb6-a6-exec-docs-closeout.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m6-cp1-tb6-a6-exec-docs-closeout
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  apply:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1gFfyGKfORLKP-Ir5bIwPvttT_Ul2zbbT
      patch_sha256: 3371dc76afd28027c4c306b67e4ed4be03641ccbe37f530ac64deb6313c9f313
      base_sha: eb1ff6aa069fd4050c8a864b07d7d00a30188f8d
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: "docs: record TB6-A6 orchestration-invalid execution"
    secrets: inherit
