name: M3 CP4c3 CB4 Package Closeout Apply

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/cp4c3-cb4pkg-closeout-apply-20260831t1605.txt

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

concurrency:
  group: m3-cp4c3-cb4pkg-closeout-apply
  cancel-in-progress: false

jobs:
  validate-caller:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/agent-cp4c3-cb4pkg-closeout-apply-20260831t1605.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: cp4c3-cb4pkg-closeout-apply
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  apply:
    needs: validate-caller
    if: ${{ needs.validate-caller.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1xLb4-GwdGxQWEBO-Px2nh-xr6i6DhXFR
      patch_sha256: 'af80109093fb30349a62061ecec17ed77450865bb63cb96081c9621f7060db57'
      base_sha: 157bf5f9bf871e66d8c128c6a11a0b225f446fcf
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: 'docs: close M3-CP4c-3 CB4 package-only build'
      retention_days: 7
    secrets: inherit
