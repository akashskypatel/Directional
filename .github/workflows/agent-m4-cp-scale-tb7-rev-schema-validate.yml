name: M4 CP SCALE TB7 Review Caller Schema Validation

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m4-cp-scale-tb7-rev-schema-validate.txt

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: m4-cp-scale-tb7-rev-schema-validate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m4-cp-scale-tb7-rev-schema-validate
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  validate-self:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/agent-m4-cp-scale-tb7-rev-schema-validate.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  validate-drive-caller:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .agents/Directional/turn-payloads/m4-cp-scale-tb7-rev-drive-caller.yml
      source_ref: ${{ github.sha }}
    secrets: inherit
