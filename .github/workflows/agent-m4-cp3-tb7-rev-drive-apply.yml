name: Agent M4 CP3 TB7 REV Drive Apply

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/drive/m4-cp3-tb7-rev/**

permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

concurrency:
  group: agent-m4-cp3-tb7-rev-drive-apply-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/agent-m4-cp3-tb7-rev-drive-apply.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m4-cp3-tb7-rev-drive-apply
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  apply:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 110_f4PXdXbyF_lTR2uIavpG7Bpp8kZGe
      patch_sha256: 9376d15d54a57a8736002ffc5bd5d3e24d331a7f06c2630fbede6d9e34088328
      base_sha: 871f0b0f1fa72ee7a3fca79c570cdfe0cdc69bfc
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: "docs: adjudicate M4-CP3-TB7 and freeze CB10"
      retention_days: 7
    secrets: inherit
