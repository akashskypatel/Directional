name: M5 CP3 R15 Review Closeout Patch Apply

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m5-cp3-r15-review-closeout-apply.txt

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

concurrency:
  group: m5-cp3-r15-review-closeout-apply
  cancel-in-progress: false

jobs:
  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m5-cp3-r15-review-closeout-apply
      commit_run_file: false
      trim_stale_comments: false
    secrets: inherit

  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/m5-cp3-r15-review-closeout-apply.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  apply:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1_SYVQvfnDf5Mkd6TrToeMOOZgWWbEcWW
      patch_sha256: e30f2231cb047815fb542da0af4eda317e15d3a2e94050f49dcbaec2a43e39e1
      base_sha: 4ad8392a9487319916c91472c5e3b179fa77d038
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: "M5-CP3-TB1-R15-REV: adjudicate invalid gate and freeze CB18"
    secrets: inherit
