name: O32a isolated scratch producer probe
on:
  push:
    branches:
      - scratch/p13-o32a-seed-review-20261105
    paths:
      - .agents/connector-triggers/o32a-scratch-command.txt
permissions:
  actions: write
  contents: write
  id-token: write
concurrency:
  group: o32a-scratch-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    permissions:
      contents: read
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/o32a-scratch-workflow.yml
      source_ref: ${{ github.sha }}
  apply:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' && contains(github.event.head_commit.message, '[o32a-apply]') }}
    permissions:
      actions: read
      contents: write
      id-token: write
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1kucBxUvhEqvOVJUg4Ia04jDa1XKCU8Uo
      patch_sha256: 9a19f8386d3acb6a904e264f86fff4496f3dc4662bbd0da82e676a9e411427fe
      base_sha: 4e151e5c139d09ecabca663ea1125d0544c32abb
      target_branch: scratch/p13-o32a-seed-review-20261105
      commit_message: 'scratch: apply O32a seed producer instrumentation'
    secrets: inherit
  compile:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' && contains(github.event.head_commit.message, '[o32a-compile]') }}
    permissions:
      contents: read
      actions: write
    uses: ./.github/workflows/agent-compile-reusable.yml
    with:
      source_sha: ${{ github.sha }}
      targets: directional_surface_cell_producer_tests
      artifact_prefix: o32a-scratch-compile
  capture:
    needs: compile
    if: ${{ needs.compile.result == 'success' }}
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Initialize capture log
        shell: bash
        run: |
          set -euo pipefail
          : > "$RUNNER_TEMP/o32a-capture.log"
          echo "event_sha=$GITHUB_SHA run=$GITHUB_RUN_ID" | tee -a "$RUNNER_TEMP/o32a-capture.log"
      - name: Download compiled scratch producer test
        uses: actions/download-artifact@v4
        with:
          name: o32a-scratch-compile-result-${{ github.run_id }}
          path: ${{ runner.temp }}/package
      - name: Capture four Vase permutations
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee -a "$RUNNER_TEMP/o32a-capture.log") 2>&1
          cd "$RUNNER_TEMP/package"
          sha256sum -c SHA256SUMS
          test "$(cat metadata/source-commit.txt)" = "$GITHUB_SHA"
          test -s bin/directional_surface_cell_producer_tests
          chmod +x bin/directional_surface_cell_producer_tests
          mkdir -p "$RUNNER_TEMP/o32a-results"
          for seed in base 1 2 3; do
            set +e
            if [[ "$seed" == base ]]; then
              DIRECTIONAL_O32A_SCRATCH=1 timeout 240 bin/directional_surface_cell_producer_tests --gtest_filter='UniformPhaseFront/SurfaceCellDesignAcceptance.ProducesDirectSourceAuthoritativePureQuadOutput/Vase' > "$RUNNER_TEMP/o32a-results/$seed.log" 2>&1
            else
              DIRECTIONAL_O32A_SCRATCH=1 DIRECTIONAL_O32A_PERMUTATION="$seed" timeout 240 bin/directional_surface_cell_producer_tests --gtest_filter='UniformPhaseFront/SurfaceCellDesignAcceptance.ProducesDirectSourceAuthoritativePureQuadOutput/Vase' > "$RUNNER_TEMP/o32a-results/$seed.log" 2>&1
            fi
            rc=$?
            set -e
            echo "$seed exit=$rc" | tee -a "$RUNNER_TEMP/o32a-results/exits.txt"
            grep -q 'O32A_PHASE coverage size=' "$RUNNER_TEMP/o32a-results/$seed.log"
            grep -q 'O32A_SCRATCH_CAPTURE_COMPLETE' "$RUNNER_TEMP/o32a-results/$seed.log"
            grep -q 'O32A_SEED coverage' "$RUNNER_TEMP/o32a-results/$seed.log"
          done
          (cd "$RUNNER_TEMP/o32a-results" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          (cd "$RUNNER_TEMP/o32a-results" && sha256sum -c SHA256SUMS)
          echo 'STATUS=COMPLETE O32A scratch captures 4'
      - name: Upload scratch capture output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: o32a-scratch-captures-${{ github.run_id }}
          path: ${{ runner.temp }}/o32a-results
          if-no-files-found: warn
          retention-days: 7
      - name: Upload scratch activity log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: o32a-scratch-capture-log-${{ github.run_id }}
          path: ${{ runner.temp }}/o32a-capture.log
          if-no-files-found: error
          retention-days: 7
  mailbox:
    if: always()
    needs: [validate, apply, compile, capture]
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/workflow-mailbox-publisher.yml
    with:
      mailbox_branch: workflow-mailbox
      workflow_key: p13-o32a-disposable-scratch
      source_sha: ${{ github.sha }}
      source_ref: ${{ github.ref }}
      result: ${{ needs.validate.result != 'success' && 'failure' || (needs.apply.result == 'failure' || needs.compile.result == 'failure' || needs.capture.result == 'failure') && 'failure' || 'success' }}
      summary: Disposable O32a scratch probe; never production-gating evidence.
