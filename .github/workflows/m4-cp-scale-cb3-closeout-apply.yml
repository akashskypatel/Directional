name: M4 CP SCALE CB3 Closeout Apply

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m4-cp-scale-cb3-closeout-apply-20260914.txt

permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

concurrency:
  group: m4-cp-scale-cb3-closeout-apply
  cancel-in-progress: false

jobs:
  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m4-cp-scale-cb3-closeout-apply
      commit_run_file: false
    secrets: inherit

  validate-caller:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
