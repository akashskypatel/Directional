      workflow_path: .github/workflows/m4-cp-scale-cb3-closeout-apply.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  apply:
    needs: validate-caller
    if: ${{ needs.validate-caller.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 11p8h8e1Em3i3nuMCC6-WgUedjeH7d1Dv
      patch_sha256: 5c1bbee2ff9d8e8890129e701fc42cfb63d909bff7c325c166f1c011837e8344
      base_sha: ba6e204d9daef39bfc6c168b659fc1b94f2b5b9b
