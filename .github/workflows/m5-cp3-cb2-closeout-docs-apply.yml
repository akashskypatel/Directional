name: M5 CP3 CB2 Closeout Docs Apply

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m5-cp3-cb2-closeout-docs-apply.txt

permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

concurrency:
  group: m5-cp3-cb2-closeout-docs-apply
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/m5-cp3-cb2-closeout-docs-apply.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m5-cp3-cb2-closeout-docs-apply
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  apply:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1HCg2B_4UiMcfjp9Qkhpe_s00qqYZ8yq-
      patch_sha256: cf9ed643d069b9b464db36121e4dfa95f711a22499e0220e30332de82f355d65
      base_sha: ff18dec8f46222579214665c8a335ca172726009
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: "M5 CP3 CB2: close Code Build and plan TB1"
    secrets: inherit
