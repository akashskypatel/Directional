name: M5 CP4 CB2 Eight-Target GMP Compile

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m5-cp4-cb2-compile-20260924.txt

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: write

concurrency:
  group: m5-cp4-cb2-compile-${{ github.ref }}
  cancel-in-progress: false

jobs:
  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m5-cp4-cb2-compile
      commit_run_file: false
      trim_stale_comments: false
    secrets: inherit

  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/m5-cp4-cb2-compile.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  compile:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-compile-reusable.yml
    with:
      source_sha: e284fea7c101eb86650d1c87c92d0fefa66050e7
      artifact_prefix: directional-m5-cp4-cb2
    secrets: inherit
