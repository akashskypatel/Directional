name: Agent Source Snapshot CB48 62a4bf49

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/source-snapshot/cb48-62a4bf49-20260908.txt

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: agent-source-snapshot-cb48-62a4bf49
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/agent-source-snapshot-cb48-62a4bf49.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  snapshot:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-source-snapshot.yml
    with:
      source_ref: 62a4bf49d0d41f9ea4b1c2690ff938f10d167348
      artifact_prefix: agent-source-snapshot-cb48-62a4bf49
      retention_days: 7
    secrets: inherit
