name: M5 CP4 TB2 Final Review Static Validation

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m5-cp4-tb2-rev-static-20260924.txt

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: m5-cp4-tb2-rev-static-${{ github.ref }}
  cancel-in-progress: false

jobs:
  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m5-cp4-tb2-rev-static
      commit_run_file: false
      trim_stale_comments: false
    secrets: inherit

  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/m5-cp4-tb2-rev-static.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  static-review:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - name: Validate Review boundary and committed ledgers
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/M5-CP4-TB2-REV-static-validation.txt"
          exec > >(tee "$out") 2>&1
          echo "runtimeExecution=false"
          echo "event_sha=$GITHUB_SHA"
          python3 .agents/Directional/tools/review_check.py authority e284fea7c101eb86650d1c87c92d0fefa66050e7
          python3 .agents/Directional/tools/review_check.py boundary --expect-selector             449=d4a0d1b731cfd99e832f3c983e5741ab18cb27a314f380184c5ff84bd88d6414             448=70ff08601bf244fcb4883e5d0601d5e7a3a44f52a8e855544a065c6ca5c75789             430=1c4128500cb2f70f3bf00b85aadc44363ab89fdab906bf4aa7b140a4955a9db6
          python3 .agents/Directional/tools/review_check.py ledgers --base b1029e47787e2a1f7d55cb520d53f859798d2fe8
          python3 - <<'PY'
          import re, subprocess
          base='ced3698057d9667c9220b7be8033009ecf201cc8'
          paths=subprocess.check_output(['git','diff','--name-only',base,'HEAD'],text=True).splitlines()
          forbidden=[]
          for p in paths:
              if p == 'CMakeLists.txt' or any(p == x or p.startswith(x + '/') for x in ('src','include','tests','benchmarks','cmake')):
                  forbidden.append(p)
              if re.search(r'Required_Green_Selector_\d+\.txt$', p) or re.search(r'Selector_\d+_Static_Routing_Receipt\.tsv$', p):
                  forbidden.append(p)
          print(f'turn_changed_paths={len(paths)}')
          for p in paths:
              print(f'turn_path={p}')
          if forbidden:
              raise SystemExit('forbidden review-turn semantic mutations: ' + ', '.join(sorted(set(forbidden))))
          print('turn_semantic_boundary=PASS')
          PY

      - name: Upload static Review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m5-cp4-tb2-rev-static-${{ github.run_id }}
          path: ${{ runner.temp }}/M5-CP4-TB2-REV-static-validation.txt
          if-no-files-found: error
          retention-days: 7
