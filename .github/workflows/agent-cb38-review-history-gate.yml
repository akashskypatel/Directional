name: Agent CB38 Review History Gate
on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/review-history/cb38-rev-20261025.txt
permissions:
  contents: read
jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/agent-cb38-review-history-gate.yml
    secrets: inherit
  history:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout full authentic repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Execute independent history-sensitive read-only checks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/cb38-review-history"
          {
            python3 .agents/Directional/tools/review_check.py authority 41f39ba920eace2dad7b36d2b26c8073ce740239
            python3 .agents/Directional/tools/review_check.py boundary
            python3 .agents/Directional/tools/review_check.py ledgers --base 8b7299b43
            git status -sb
          } 2>&1 | tee "${RUNNER_TEMP}/cb38-review-history/checks.log"
      - name: Upload independent history evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cb38-review-history-${{ github.run_id }}
          path: ${{ runner.temp }}/cb38-review-history/checks.log
          if-no-files-found: warn
  mailbox:
    if: ${{ always() }}
    needs: [history]
    permissions:
      contents: write
    uses: ./.github/workflows/workflow-mailbox-publisher.yml
    with:
      mailbox_branch: workflow-mailbox
      workflow_key: m6-cp3-cb38-rev-real-history
      source_sha: ${{ github.sha }}
      source_ref: ${{ github.ref }}
      result: ${{ needs.history.result }}
      summary: Independent CB38-REV authentic Git-history gate.
