name: M5 CP3 TB2 Artifact-Only Execution

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m5-cp3-tb2-exec.txt

permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: m5-cp3-tb2-exec-${{ github.ref }}
  cancel-in-progress: false

jobs:
  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m5-cp3-tb2-exec
      commit_run_file: false
      trim_stale_comments: false
    secrets: inherit

  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/m5-cp3-tb2-exec.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  execute:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Initialize diagnostic log
        shell: bash
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/M5-CP3-TB2-EXEC.log"
          : > "$log"
          {
            echo "workflow=${GITHUB_WORKFLOW}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "event=${GITHUB_EVENT_NAME}"
            echo "event_sha=${GITHUB_SHA}"
            echo "repository=${GITHUB_REPOSITORY}"
            echo "runtime_source=immutable-artifact-10771899191"
            echo "started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } | tee -a "$log"

      - name: Checkout orchestration authority
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          submodules: false
          lfs: false
          token: ${{ secrets.GH_TOKEN || github.token }}

      - name: Validate harness syntax
        shell: bash
        run: |
          set -euo pipefail
          bash -n .agents/Directional/turn-payloads/m5-cp3-tb2-exec-harness.sh
          sha256sum .agents/Directional/turn-payloads/m5-cp3-tb2-exec-harness.sh | tee -a "${RUNNER_TEMP}/M5-CP3-TB2-EXEC.log"

      - name: Execute immutable selector448 gate
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
          TURN_ID: M5-CP3-TB2-EXEC
        shell: bash
        run: |
          set -o pipefail
          bash .agents/Directional/turn-payloads/m5-cp3-tb2-exec-harness.sh --execute
          status=$?
          echo "harness_exit=$status" | tee -a "${RUNNER_TEMP}/M5-CP3-TB2-EXEC.log"
          exit "$status"

      - name: Record final execution state
        if: always()
        shell: bash
        run: |
          set +e
          {
            echo "final_job_status=${{ job.status }}"
            echo "final_sha=$(git rev-parse HEAD 2>/dev/null || echo unavailable)"
            git status --short 2>&1 || true
            echo "finished_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } | tee -a "${RUNNER_TEMP}/M5-CP3-TB2-EXEC.log"

      - name: Upload execution result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: directional-m5-cp3-tb2-exec-result-${{ github.run_id }}
          path: ${{ runner.temp }}/M5-CP3-TB2-EXEC-result
          if-no-files-found: error
          retention-days: 14

      - name: Upload diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: directional-m5-cp3-tb2-exec-log-${{ github.run_id }}
          path: ${{ runner.temp }}/M5-CP3-TB2-EXEC.log
          if-no-files-found: error
          retention-days: 14
