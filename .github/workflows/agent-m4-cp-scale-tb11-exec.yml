name: M4 CP SCALE TB11 Artifact-Only Runtime

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m4-cp-scale-tb11/validate.txt
      - .agents/connector-triggers/m4-cp-scale-tb11/execute.txt

permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: m4-cp-scale-tb11-exec-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/agent-m4-cp-scale-tb11-exec.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m4-cp-scale-tb11-exec
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  execute:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' && contains(github.event.head_commit.message, 'execute M4-CP-SCALE-TB11-EXEC') }}
    runs-on: ubuntu-24.04
    steps:
      - name: Initialize diagnostic log
        shell: bash
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/m4-cp-scale-tb11-workflow.log"
          : > "$log"
          printf '%s\n' "workflow=$GITHUB_WORKFLOW" "run_id=$GITHUB_RUN_ID" "event=$GITHUB_EVENT_NAME" "event_sha=$GITHUB_SHA" "ref=$GITHUB_REF" 'runtimeBoundary=Test+Benchmark-artifact-only' "started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" | tee -a "$log"

      - name: Checkout exact orchestration source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          submodules: false
          lfs: false
          token: ${{ secrets.GH_TOKEN || github.token }}

      - name: Execute immutable TB11 harness
        id: harness
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
          CANDIDATE_ARTIFACT_ID: '10473134357'
          CANDIDATE_PROVIDER_SHA256: 'aa503e4be2aa1904172c9a3710f41e7cf0ccd352575b39078ece61b7d5d660b9'
          SEMANTIC_SOURCE_SHA: 'e15e83c79a1e1962c0ed8d31ea85187ab6600e47'
          SOURCE_ARCHIVE_SHA256: '190233bd050a2d1a6c042217f11294f38fc29fdc62d9c6b124a84fefb914d570'
          PACKAGE_MANIFEST_SHA256: '2dbacc439ed714d9c8dfd5c3be5e2d9942a0fe99737aa1f9a0281632d21cf0c8'
          SELECTOR_SHA256: '41f4d559211375c11c8d1f8c9ccde2581db75819d9409366e8f2695b008b5114'
          PREFIX425_SHA256: 'e0e0f394faae536ac257ec5409653a34755a8afe0ca437562eb44c9895790e0b'
        shell: bash
        run: |
          set -uo pipefail
          log="${RUNNER_TEMP}/m4-cp-scale-tb11-workflow.log"
          set +e
          bash .agents/Directional/turn-payloads/m4-cp-scale-tb11-exec.sh > >(tee -a "$log") 2> >(tee -a "$log" >&2)
          rc=$?
          set -e
          echo "harness_exit=$rc" | tee -a "$log"
          echo "exit=$rc" >> "$GITHUB_OUTPUT"
          exit "$rc"

      - name: Upload TB11 result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m4-cp-scale-tb11-result-${{ github.run_id }}
          path: ${{ runner.temp }}/tb11-result
          if-no-files-found: error
          retention-days: 14

      - name: Record final source status
        if: always()
        shell: bash
        run: |
          set +e
          log="${RUNNER_TEMP}/m4-cp-scale-tb11-workflow.log"
          printf '%s\n' "final_job_status=${{ job.status }}" "harness_exit=${{ steps.harness.outputs.exit || 'unavailable' }}" "final_sha=$(git rev-parse HEAD 2>/dev/null || echo unavailable)" "finished_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" | tee -a "$log"
          git status --short 2>&1 | tee -a "$log" || true

      - name: Upload workflow diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m4-cp-scale-tb11-log-${{ github.run_id }}
          path: ${{ runner.temp }}/m4-cp-scale-tb11-workflow.log
          if-no-files-found: error
          retention-days: 14
