name: M3 CP4c3 TB23 EXEC

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m3-cp4c3-tb23-exec/**

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: m3-cp4c3-tb23-exec-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/m3-cp4c3-tb23-exec.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m3-cp4c3-tb23-exec
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  execute:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Initialize diagnostic log
        shell: bash
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/m3-cp4c3-tb23-exec-bootstrap.log"
          : > "$log"
          {
            echo "workflow=${GITHUB_WORKFLOW}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "event=${GITHUB_EVENT_NAME}"
            echo "event_sha=${GITHUB_SHA}"
            echo "ref=${GITHUB_REF}"
            echo "repository=${GITHUB_REPOSITORY}"
            echo "runner_os=${RUNNER_OS}"
            echo "started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } | tee -a "$log"

      - name: Fetch exact execution harness
        shell: bash
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/m3-cp4c3-tb23-exec-bootstrap.log"
          exec > >(tee -a "$log") 2>&1
          url="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}/.agents/Directional/turn-payloads/m3-cp4c3-tb23-exec.sh"
          curl --fail --silent --show-error "$url" -o "${RUNNER_TEMP}/m3-cp4c3-tb23-exec.sh"
          sha256sum "${RUNNER_TEMP}/m3-cp4c3-tb23-exec.sh"

      - name: Execute frozen artifact-only TB23 plan
        id: execution
        shell: bash
        run: |
          set +e
          bash "${RUNNER_TEMP}/m3-cp4c3-tb23-exec.sh"
          status=$?
          echo "exit_code=${status}" >> "$GITHUB_OUTPUT"
          echo "tb23_exec_exit=${status}" | tee -a "${RUNNER_TEMP}/m3-cp4c3-tb23-exec-bootstrap.log"
          exit 0

      - name: Upload TB23 result evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-cp4c3-tb23-exec-result-${{ github.run_id }}
          path: ${{ runner.temp }}/m3-cp4c3-tb23-result
          if-no-files-found: error
          retention-days: 14

      - name: Consolidate diagnostic log
        if: always()
        shell: bash
        run: |
          set +e
          bootstrap="${RUNNER_TEMP}/m3-cp4c3-tb23-exec-bootstrap.log"
          execution="${RUNNER_TEMP}/m3-cp4c3-tb23-exec.log"
          final="${RUNNER_TEMP}/m3-cp4c3-tb23-exec-final.log"
          cat "$bootstrap" > "$final"
          if [[ -f "$execution" ]]; then
            printf '\n===== execution log =====\n' >> "$final"
            cat "$execution" >> "$final"
          fi
          {
            echo "execution_step_exit=${{ steps.execution.outputs.exit_code }}"
            echo "job_status=${{ job.status }}"
            echo "finished_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$final"

      - name: Upload TB23 diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-cp4c3-tb23-exec-log-${{ github.run_id }}
          path: ${{ runner.temp }}/m3-cp4c3-tb23-exec-final.log
          if-no-files-found: error
          retention-days: 14

      - name: Fail on orchestration failure
        if: always()
        shell: bash
        run: |
          status='${{ steps.execution.outputs.exit_code }}'
          if [[ -z "$status" || "$status" != '0' ]]; then
            echo "TB23-EXEC orchestration failed with exit=${status:-missing}" >&2
            exit 1
          fi
