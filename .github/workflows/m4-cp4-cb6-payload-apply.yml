name: M4 CP4 CB6 Payload Apply

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m4-cp4-cb6/apply-payload.txt

permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

concurrency:
  group: m4-cp4-cb6-payload-apply
  cancel-in-progress: false

jobs:
  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m4-cp4-cb6-payload-apply
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/m4-cp4-cb6-payload-apply.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  apply:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1ACkvF08QMN9Kl7fLcuxUmPZ8DTaXQA81
      patch_sha256: 041c320bdc4d24adc9460373b2dfa3901b621899a6641963ac50f366ce0b51fc
      base_sha: 355a1bbce47937844786be000fa4d66a418864b4
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: "M4-CP4-CB6: closeout control-plane correction"
      retention_days: 7
    secrets: inherit
