name: M3 CP4c2 TB X2 REV Recurrence Tracker Apply

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m3-cp4c2-tb-x2-rev-recurrence-apply/**

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

concurrency:
  group: m3-cp4c2-tb-x2-rev-recurrence-apply-${{ github.ref }}
  cancel-in-progress: false

jobs:
  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m3-cp4c2-tb-x2-rev-recurrence-apply
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/m3-cp4c2-tb-x2-rev-recurrence-apply.yml
    secrets: inherit

  apply:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 11iWm1p0I1he_PWv59f5yataJ2KyZtqXP
      patch_sha256: a774fafeb6177330b64c5e6fdbebf758a24cdc2c2317964897ccd8859992f882
      base_sha: 34b0f5d17e027b17ef5d0541f84046645ed354dd
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: "M3-CP4c-2-TB-X2-REV: record second resolved closeout placeholder recurrence"
    secrets: inherit
