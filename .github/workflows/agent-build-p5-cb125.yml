name: Agent Build Surface Cell P5 CB125

on:
  push:
    branches: [agent/surface_cell_quad/p5-recover-bridge-healing]
    paths: [.github/workflows/agent-build-p5-cb125.yml]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: agent-surface-cell-p5-cb125-${{ github.ref }}
  cancel-in-progress: true

env:
  ACTIVE_BRANCH: agent/surface_cell_quad/p5-recover-bridge-healing
  BUILD_DIR: build/agent-p5-cb125-release
  PACKAGE_DIR: artifact
  LOG_DIR: /tmp/p5-cb125-workflow-logs
  ACTIVITY_LOG: /tmp/p5-cb125-workflow-logs/p5-cb125-compile-activity.log
  PATCH_COMMENT_IDS: '5174252306,5174254958'
  PATCH_SHA256: 5657eb0b64aed76a5718d40a5db61e21d0c8fce60bb620e8abcf359062e873b9

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Initialize persistent workflow log
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${LOG_DIR}"
          {
            echo "P5-CB117 through P5-CB125 compile-only closeout"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "event_sha=${GITHUB_SHA}"
            echo "started_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } | tee "${ACTIVITY_LOG}"

      - name: Record compile-only run start
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          message="P5-CB117 through P5-CB125 compile-only run ${GITHUB_RUN_ID} started for event commit ${GITHUB_SHA}. The reviewed patch is applied transactionally and the exact pushed source is compiled. No test, benchmark, custom mesh, help/list, discovery, or compiled project binary command executes."
          echo "start_comment=${message}" | tee -a "${ACTIVITY_LOG}"
          gh api repos/${GITHUB_REPOSITORY}/issues/8/comments -f body="${message}"

      - name: Checkout exact working branch
        uses: actions/checkout@v4
        with:
          ref: agent/surface_cell_quad/p5-recover-bridge-healing
          fetch-depth: 2
          submodules: false
          persist-credentials: true

      - name: Apply reviewed patch, compile, and package
        id: compile
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "${LOG_DIR}"
          exec > >(tee -a "${ACTIVITY_LOG}") 2>&1
          finish() {
            rc=$?
            trap - EXIT
            set +x
            echo "compile_step_exit_code=${rc}" | tee -a "${ACTIVITY_LOG}"
            echo "compile_step_finished_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)" | tee -a "${ACTIVITY_LOG}"
            git status --short --branch | tee -a "${ACTIVITY_LOG}" || true
            exit "${rc}"
          }
          trap finish EXIT
          set -x

          initial_local_sha=$(git rev-parse HEAD)
          initial_remote_sha=$(git ls-remote origin "refs/heads/${ACTIVE_BRANCH}" | cut -f1)
          test "${initial_local_sha}" = "${initial_remote_sha}"
          git status --porcelain=v1 > /tmp/pre-patch-status.txt
          test ! -s /tmp/pre-patch-status.txt

          if ! grep -q 'enum class SurfaceCellIncidenceFailureKind' include/directional/geometry/SurfaceComplexSimplification.h; then
            IFS=',' read -ra ids <<< "${PATCH_COMMENT_IDS}"
            for id in "${ids[@]}"; do
              gh api "repos/${GITHUB_REPOSITORY}/issues/comments/${id}" --jq .body > "/tmp/p5-cb125-${id}.txt"
            done
            python3 - <<'PY'
          import base64, gzip, hashlib, os, pathlib, re
          ids = [v for v in os.environ['PATCH_COMMENT_IDS'].split(',') if v]
          parts = []
          for value in ids:
              body = pathlib.Path(f'/tmp/p5-cb125-{value}.txt').read_text()
              match = re.search(r'```text\s*([A-Za-z0-9+/=\s]+?)\s*```', body, re.DOTALL)
              if match is None:
                  raise SystemExit(f'missing patch payload {value}')
              parts.append(''.join(match.group(1).split()))
          patch = gzip.decompress(base64.b64decode(''.join(parts), validate=True))
          actual = hashlib.sha256(patch).hexdigest()
          if actual != os.environ['PATCH_SHA256']:
              raise SystemExit(f'patch sha mismatch: {actual}')
          pathlib.Path('/tmp/P5-CB117-CB125.patch').write_bytes(patch)
          print(f'patch_bytes={len(patch)} patch_sha256={actual}')
          PY
            git apply --check /tmp/P5-CB117-CB125.patch
            git apply /tmp/P5-CB117-CB125.patch
            git diff --check
            git config user.name directional-build-agent
            git config user.email directional-build-agent@users.noreply.github.com
            git add include src tests
            git commit -m 'P5-CB117-CB125: repair topology routes and completion output [skip ci]'
            git push origin "HEAD:${ACTIVE_BRANCH}"
          fi

          source_sha=$(git rev-parse HEAD)
          test "${source_sha}" = "$(git ls-remote origin refs/heads/${ACTIVE_BRANCH} | cut -f1)"
          printf '%s\n' "${source_sha}" > /tmp/source-commit.txt
          printf '%s\n' "${initial_local_sha}" > /tmp/workflow-event-commit.txt
          printf '%s\n' "${PATCH_SHA256}" > /tmp/reviewed-patch-sha256.txt

          git submodule sync --recursive
          git submodule update --init --recursive --depth 1 --jobs 4
          git submodule status --recursive | tee /tmp/submodule-status.txt
          git diff --check
          git status --porcelain=v1 > /tmp/source-status.txt
          test ! -s /tmp/source-status.txt

          rm -rf "${BUILD_DIR}" "${PACKAGE_DIR}"
          mkdir -p "${PACKAGE_DIR}/bin" "${PACKAGE_DIR}/lib" "${PACKAGE_DIR}/source" "${PACKAGE_DIR}/logs"
          cmake -S . -B "${BUILD_DIR}" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_FLAGS_RELEASE='-O2 -DNDEBUG' \
            -DBUILD_SHARED_LIBS=OFF -DDIRECTIONAL_BUILD_TESTS=ON \
            -DDIRECTIONAL_BUILD_BENCHMARKS=ON -DDIRECTIONAL_BUILD_CLI=OFF \
            -DDIRECTIONAL_BUILD_GUI=OFF -DDIRECTIONAL_ENABLE_GMP=OFF \
            -DDIRECTIONAL_ENABLE_PARDISO=OFF -DDIRECTIONAL_ENABLE_CUDSS=OFF \
            -DDIRECTIONAL_ENABLE_SUITESPARSE=OFF |& tee "${BUILD_DIR}/configure.log"
          cmake --build "${BUILD_DIR}" \
            --target directional_core directional_pipeline directional_phase1_tests directional_benchmarks \
            -j 4 |& tee "${BUILD_DIR}/build.log"

          test -f "${BUILD_DIR}/libdirectional_core.a"
          test -f "${BUILD_DIR}/libdirectional_pipeline.a"
          test -x "${BUILD_DIR}/directional_phase1_tests"
          test -x "${BUILD_DIR}/directional_benchmarks"
          fixture_root="${BUILD_DIR}/test-data/benchmarks/fixtures"
          find "${fixture_root}" -type f | sort | tee /tmp/fixture-files.txt
          test "$(wc -l < /tmp/fixture-files.txt)" -eq 26
          git status --porcelain=v1 > /tmp/source-status.txt
          test ! -s /tmp/source-status.txt

          cp "${BUILD_DIR}/directional_phase1_tests" "${PACKAGE_DIR}/bin/"
          cp "${BUILD_DIR}/directional_benchmarks" "${PACKAGE_DIR}/bin/"
          cp -a "${BUILD_DIR}/test-data" "${PACKAGE_DIR}/bin/"
          cp "${BUILD_DIR}/libdirectional_core.a" "${PACKAGE_DIR}/lib/"
          cp "${BUILD_DIR}/libdirectional_pipeline.a" "${PACKAGE_DIR}/lib/"
          git archive --format=tar.gz --output="${PACKAGE_DIR}/source/source.tar.gz" HEAD
          cp /tmp/source-commit.txt /tmp/workflow-event-commit.txt /tmp/reviewed-patch-sha256.txt \
             /tmp/source-status.txt /tmp/submodule-status.txt /tmp/fixture-files.txt "${PACKAGE_DIR}/"
          cp "${BUILD_DIR}/configure.log" "${BUILD_DIR}/build.log" "${ACTIVITY_LOG}" "${PACKAGE_DIR}/logs/"
          find "${PACKAGE_DIR}" -type f -print0 | sort -z | xargs -0 sha256sum > "${PACKAGE_DIR}/files.sha256"
          sha256sum "${PACKAGE_DIR}/bin/directional_phase1_tests" \
            "${PACKAGE_DIR}/bin/directional_benchmarks" \
            "${PACKAGE_DIR}/lib/libdirectional_core.a" \
            "${PACKAGE_DIR}/lib/libdirectional_pipeline.a" > "${PACKAGE_DIR}/built-targets.sha256"

      - name: Upload compiled checkpoint
        if: steps.compile.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: surface-cell-p5-cb125-github-source-linux-release
          path: artifact
          retention-days: 14

      - name: Record compile-only result
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          COMPILE_OUTCOME: ${{ steps.compile.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${LOG_DIR}"
          source_sha=$(git rev-parse HEAD 2>/dev/null || printf unknown)
          message="P5-CB117 through P5-CB125 compile-only run ${GITHUB_RUN_ID} finished ${COMPILE_OUTCOME}. Event commit: ${GITHUB_SHA}; exact source head: ${source_sha}. Detailed activity is retained in the workflow log artifact. No project binary executed."
          echo "result_comment=${message}" | tee -a "${ACTIVITY_LOG}"
          gh api repos/${GITHUB_REPOSITORY}/issues/8/comments -f body="${message}"

      - name: Always upload detailed workflow logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surface-cell-p5-cb125-workflow-logs-${{ github.run_id }}
          path: /tmp/p5-cb125-workflow-logs
          if-no-files-found: error
          retention-days: 30
