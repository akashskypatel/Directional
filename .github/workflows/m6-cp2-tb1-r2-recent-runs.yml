name: M6 CP2 TB1 R2 Recent Runs Fallback

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m6-cp2-tb1-r2-recent-runs.txt

permissions:
  actions: read
  contents: write

jobs:
  collect:
    uses: ./.github/workflows/agent-recent-workflow-runs-reusable.yml
    with:
      per_page: 20
      max_pages: 1
      branch: agent/surface_cell_quad/p5-recover-bridge-healing
      event: push
    secrets: inherit

  mailbox:
    if: ${{ always() }}
    needs: [collect]
    uses: ./.github/workflows/workflow-mailbox-publisher.yml
    with:
      workflow_key: m6-cp2-tb1-r2-recent-runs
      source_sha: ${{ github.sha }}
      source_ref: ${{ github.ref }}
      result: ${{ needs.collect.result }}
      summary: Fallback recent-run discovery for active M6 CP2 TB1 R2 execution.
