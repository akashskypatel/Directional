name: M4 CP4 TB2 R1 Validate Installed Caller

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m4-cp4-tb2-r1/validate-installed.txt

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: m4-cp4-tb2-r1-validate-installed
  cancel-in-progress: false

jobs:
  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m4-cp4-tb2-r1-validate-installed
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: ${{ contains(github.event.head_commit.message, 'validate self') && '.github/workflows/m4-cp4-tb2-r1-validate-installed.yml' || '.github/workflows/m4-cp4-tb2-r1-exec.yml' }}
      source_ref: ${{ github.sha }}
    secrets: inherit
