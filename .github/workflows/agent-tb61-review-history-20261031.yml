name: TB61 Full-History Review Validation

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/review-history/tb61-20261031.txt

permissions:
  actions: read
  contents: write

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/agent-tb61-review-history-20261031.yml
      source_ref: ${{ github.sha }}

  review:
    needs: [validate]
    if: ${{ needs.validate.outputs.valid == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout complete source history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false
          lfs: false
          persist-credentials: false
      - name: Execute full-history review checks
        shell: bash
        run: |
          set -u
          out="${RUNNER_TEMP}/tb61-review-history"
          mkdir -p "$out"
          git rev-parse HEAD > "$out/source-sha.txt"
          git rev-parse --is-shallow-repository > "$out/is-shallow.txt"
          git merge-base --is-ancestor 8b7299b43764a6ba3444e5bc774a2f1b65e99731 HEAD
          ancestor=$?
          timeout 240s python3 .agents/Directional/tools/review_check.py boundary > "$out/boundary.txt" 2>&1
          boundary=$?
          timeout 240s python3 .agents/Directional/tools/review_check.py ledgers --base b55f41686d2fba4149990de9be8cf2545f227136 > "$out/ledgers.txt" 2>&1
          ledgers=$?
          printf 'ancestor_exit=%s\nboundary_exit=%s\nledgers_exit=%s\n' "$ancestor" "$boundary" "$ledgers" | tee "$out/exit-status.txt"
          tail -n 12 "$out/boundary.txt" || true
          tail -n 12 "$out/ledgers.txt" || true
          test "$ancestor" -eq 0 && test "$boundary" -eq 0 && test "$ledgers" -eq 0
      - name: Upload exact review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tb61-full-history-review-${{ github.run_id }}
          path: ${{ runner.temp }}/tb61-review-history/
          if-no-files-found: error
          retention-days: 7

  mailbox:
    if: ${{ always() }}
    needs: [review]
    permissions:
      actions: read
      contents: write
    uses: ./.github/workflows/workflow-mailbox-publisher.yml
    with:
      mailbox_branch: workflow-mailbox
      workflow_key: tb61-full-history-review
      source_sha: ${{ github.sha }}
      source_ref: ${{ github.ref }}
      result: ${{ needs.review.result }}
      summary: Read-only full-history review_check boundary and ledgers.
