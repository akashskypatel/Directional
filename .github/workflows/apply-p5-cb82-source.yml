# Temporary source-transfer workflow. Created and removed directly through the
# GitHub connector; it never edits or deletes workflow files.
name: Apply P5 CB82 Source Patch

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - '.agents/Directional/p5-cb82-source-patch/APPLY_READY'

concurrency:
  group: apply-p5-cb82-source-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  apply-source:
    runs-on: ubuntu-24.04
    steps:
      - name: Record source transfer start
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          EVENT_SHA: ${{ github.sha }}
        shell: bash
        run: |
          gh api repos/${{ github.repository }}/issues/8/comments \
            -f body="P5-CB75 through P5-CB82 source transfer run ${RUN_ID} started for staging commit ${EVENT_SHA}. It executes no compiled binary, test, benchmark, custom mesh, help/list command, or discovery command."

      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: agent/surface_cell_quad/p5-recover-bridge-healing
          fetch-depth: 1
          submodules: false

      - name: Assemble and verify exact patch
        shell: bash
        run: |
          set -euo pipefail
          encoded=.agents/Directional/p5-cb82-source-patch/p5-cb82.patch.gz.b64
          tr -d '\r\n' < "${encoded}" > /tmp/p5-cb82.patch.gz.b64
          echo "7bf1275e4c402c1ee30d1574e364a2d8e0a3a86a59ed69c442075084c1b06426  /tmp/p5-cb82.patch.gz.b64" | sha256sum -c -
          base64 --decode /tmp/p5-cb82.patch.gz.b64 | gzip -dc > /tmp/p5-cb82.patch
          echo "d147677a2caa5b0d7280e753f5ff1742087e27011831c86a14f722ae4d79af91  /tmp/p5-cb82.patch" | sha256sum -c -
          test "$(wc -c < /tmp/p5-cb82.patch)" = "70104"

      - name: Apply and validate source patch
        shell: bash
        run: |
          set -euo pipefail
          git apply --check /tmp/p5-cb82.patch
          git apply /tmp/p5-cb82.patch
          git diff --check
          cat > /tmp/expected-files.txt <<'EOF'
          include/directional/geometry/PatchDescriptor.h
          include/directional/geometry/SurfaceArrangement.h
          include/directional/geometry/SurfaceCellFeasibilityRepair.h
          include/directional/geometry/SurfaceComplexSimplification.h
          include/directional/pipeline/RemeshPipeline.h
          src/bench/DirectionalBenchmark.cpp
          src/geometry/PatchDescriptor.cpp
          src/geometry/SurfaceArrangement.cpp
          src/geometry/SurfaceCellFeasibilityRepair.cpp
          src/geometry/SurfaceComplexSimplification.cpp
          src/pipeline/RemeshPipeline.cpp
          tests/MilestoneDClosureTests.cpp
          EOF
          sed -i 's/^          //' /tmp/expected-files.txt
          git diff --name-only | sort > /tmp/actual-files.txt
          sort -o /tmp/expected-files.txt /tmp/expected-files.txt
          diff -u /tmp/expected-files.txt /tmp/actual-files.txt

      - name: Commit source checkpoint
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "directional-agent"
          git config user.email "directional-agent@users.noreply.github.com"
          git add \
            include/directional/geometry/PatchDescriptor.h \
            include/directional/geometry/SurfaceArrangement.h \
            include/directional/geometry/SurfaceCellFeasibilityRepair.h \
            include/directional/geometry/SurfaceComplexSimplification.h \
            include/directional/pipeline/RemeshPipeline.h \
            src/bench/DirectionalBenchmark.cpp \
            src/geometry/PatchDescriptor.cpp \
            src/geometry/SurfaceArrangement.cpp \
            src/geometry/SurfaceCellFeasibilityRepair.cpp \
            src/geometry/SurfaceComplexSimplification.cpp \
            src/pipeline/RemeshPipeline.cpp \
            tests/MilestoneDClosureTests.cpp
          git commit -m "fix(surface-cells): preserve sheet identity and liveness [skip ci]"
          git push origin HEAD:agent/surface_cell_quad/p5-recover-bridge-healing

      - name: Record source transfer result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          EVENT_SHA: ${{ github.sha }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          gh api repos/${{ github.repository }}/issues/8/comments \
            -f body="P5-CB75 through P5-CB82 source transfer run ${RUN_ID} finished ${JOB_STATUS} for staging commit ${EVENT_SHA}. No compiled binary, test, benchmark, custom mesh, help/list command, or discovery command was executed."
