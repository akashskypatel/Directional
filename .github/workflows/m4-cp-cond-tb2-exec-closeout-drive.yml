name: M4 CP-COND TB2 EXEC Closeout Drive Apply

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m4-cp-cond-tb2-exec-closeout-drive/execute.txt

permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

concurrency:
  group: m4-cp-cond-tb2-exec-closeout-drive-${{ github.ref }}
  cancel-in-progress: false

jobs:
  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m4-cp-cond-tb2-exec-closeout-drive
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  apply-drive-patch:
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1zwwLbyooCbIJm-soc45ks32nN6-8Nb0E
      patch_sha256: dfed20d76c16669cd3fb89d13f0080d7a608e281c698fb42c52cee5b6255a060
      base_sha: 093ca0e86cbf8f936a13cc16186f906f33b0d381
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: "docs: close M4-CP-COND TB2 execution"
      retention_days: 14
    secrets: inherit
