name: M4 CP1 CB3 CMake Fix Apply

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m4-cp1-cb3-cmake-fix-apply-20260910.txt

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

concurrency:
  group: m4-cp1-cb3-cmake-fix-apply-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/m4-cp1-cb3-cmake-fix-apply.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m4-cp1-cb3-cmake-fix-apply
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  apply:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1ZWug_0K0rm6IYeeZQBfaVg3XWEcu2Juu
      patch_sha256: 'f15069f09c11079d8d3aebf52372cef894789835b562117fd88124d543b89d19'
      base_sha: ca85ec20bb77b3438c32a9d854e11b70c6a6c041
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: 'build: fix private LEMON include export boundary'
      retention_days: 14
    secrets: inherit
