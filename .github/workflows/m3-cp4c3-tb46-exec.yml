name: M3 CP4c3 TB46 Execute

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/tb46-exec/tb46-exec-20260909.txt

permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: m3-cp4c3-tb46-exec-caller
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/m3-cp4c3-tb46-exec.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m3-cp4c3-tb46-exec
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  execute:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Initialize persistent activity log
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/tb46-workflow.log"
          : > "$log"
          printf '%s\n' \
            "workflow=$GITHUB_WORKFLOW" \
            "run_id=$GITHUB_RUN_ID" \
            "event=$GITHUB_EVENT_NAME" \
            "event_sha=$GITHUB_SHA" \
            "ref=$GITHUB_REF" \
            'turn=M3-CP4c-3-TB46-EXEC' \
            'turnBoundary=Test+Benchmark-artifact-only' \
            'runtimeExecution=package-only' \
            | tee -a "$log"

      - name: Checkout exact control source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          submodules: false
          lfs: false

      - name: Verify frozen harness and execute immutable package
        id: run
        env:
          GH_TOKEN: ${{ github.token }}
          TURN_ID: M3-CP4c-3-TB46
          ARTIFACT_ID: '10112532452'
          EXPECTED_ARTIFACT_NAME: m3-cp4c3-cb51-package111-result-34372482691
          EXPECTED_PROVIDER_DIGEST: sha256:62ae325186ef31d2936e1a797c55cef43f8aef62449b33a26e29cb1ecd9185da
          EXPECTED_ZIP_SHA256: 62ae325186ef31d2936e1a797c55cef43f8aef62449b33a26e29cb1ecd9185da
          EXPECTED_SOURCE_SHA: 4f0663ef3468996abce6f59109f1c67f5be5f604
          SELECTOR_RELATIVE_PATH: .agents/Directional/Architecture_M3_CP4c3_Required_Green_Selector_409.txt
          EXPECTED_SELECTOR_COUNT: '409'
          EXPECTED_SELECTOR_SHA256: eea6d8c2bbc8e9247deb4bfbbe6763042c76002d1894dd62e35f80262403b53e
          ACCEPTED_PREFIX_COUNT: '365'
          EXPECTED_HARNESS_SHA256: aaadab351c0ba28a39c87eff1948f83ab0c4c71520662177e5cdf6fd08b30ed3
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/tb46-workflow.log"
          exec > >(tee -a "$log") 2>&1
          harness='.agents/Directional/tools/m3_cp4c3_artifact_only_harness.sh'
          actual_harness_sha="$(sha256sum "$harness" | awk '{print $1}')"
          echo "harness_sha256=$actual_harness_sha"
          test "$actual_harness_sha" = "$EXPECTED_HARNESS_SHA256"
          set +e
          bash "$harness" --execute
          rc=$?
          set -e
          echo "$rc" > "$RUNNER_TEMP/tb46-script-exit.txt"
          echo "script_exit=$rc" >> "$GITHUB_OUTPUT"
          echo "tb46_script_exit=$rc"
          exit 0

      - name: Upload immutable execution result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-cp4c3-tb46-result-${{ github.run_id }}
          path: ${{ runner.temp }}/M3-CP4c-3-TB46-result
          if-no-files-found: error
          retention-days: 7

      - name: Upload persistent diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-cp4c3-tb46-log-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/M3-CP4c-3-TB46.log
            ${{ runner.temp }}/tb46-workflow.log
            ${{ runner.temp }}/tb46-script-exit.txt
          if-no-files-found: error
          retention-days: 7

      - name: Propagate orchestration status
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f "$RUNNER_TEMP/tb46-script-exit.txt"
          rc="$(cat "$RUNNER_TEMP/tb46-script-exit.txt")"
          echo "tb46_script_exit=$rc" | tee -a "$RUNNER_TEMP/tb46-workflow.log"
          exit "$rc"
