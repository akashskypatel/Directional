name: Agent Drive Apply CB48 Closeout

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/drive-apply-cb48-closeout-20260908.txt

permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

concurrency:
  group: agent-drive-apply-cb48-closeout
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/agent-drive-apply-cb48-closeout.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: cb48-closeout-drive-apply
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  apply:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1hezzMl_3sDd-Dl8vQRg4qeiyIuO4y1jH
      patch_sha256: 52be401cf21b301e1af62bedb3fb1fa78f410e4fe0ca8dac7854112540a6db40
      base_sha: 531b517fb129425f113b5f811215f1d2b1939ee2
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: "docs: close M3-CP4c-3-CB48 and freeze TB43 plan"
      retention_days: 14
    secrets: inherit
