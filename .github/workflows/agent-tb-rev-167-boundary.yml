name: TB-REV-167 Read-Only History Boundary

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/tb-rev-167-boundary/trigger.txt

permissions:
  actions: read
  contents: write

jobs:
  boundary:
    runs-on: ubuntu-24.04
    steps:
      - name: Initialize read-only audit log
        shell: bash
        run: |
          set -euo pipefail
          : > "${RUNNER_TEMP}/tb-rev-167-boundary.log"
          printf '%s\\n' "run_id=${GITHUB_RUN_ID}" "event_sha=${GITHUB_SHA}" "source_ref=${GITHUB_REF}" "started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" | tee -a "${RUNNER_TEMP}/tb-rev-167-boundary.log"
      - name: Checkout full Git history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: false
          lfs: false
      - name: Execute read-only repository checks
        shell: bash
        run: |
          set +e
          log="${RUNNER_TEMP}/tb-rev-167-boundary.log"
          {
            printf '%s\\n' "git_version=$(git --version)" "head=$(git rev-parse HEAD)"
            git status -sb
            python3 .agents/Directional/tools/review_check.py authority b500c425063dbc5c09f13cd08b811cacba0e3afe
            authority_status=$?
            python3 .agents/Directional/tools/review_check.py boundary
            boundary_status=$?
            printf '%s\\n' "authority_exit=${authority_status}" "boundary_exit=${boundary_status}"
            git status -sb
            test "${authority_status}" -eq 0 && test "${boundary_status}" -eq 0
          } >> "$log" 2>&1
          result=$?
          cat "$log"
          exit "$result"
      - name: Upload read-only audit log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tb-rev-167-boundary-log-${{ github.run_id }}
          path: ${{ runner.temp }}/tb-rev-167-boundary.log
          if-no-files-found: error
          retention-days: 14

  mailbox:
    if: ${{ always() }}
    needs: [boundary]
    uses: ./.github/workflows/workflow-mailbox-publisher.yml
    with:
      mailbox_branch: workflow-mailbox
      workflow_key: tb-rev-167-boundary
      source_sha: ${{ github.sha }}
      source_ref: ${{ github.ref }}
      result: ${{ needs.boundary.result }}
      summary: Read-only TB-REV-167 Git-history authority and boundary check
