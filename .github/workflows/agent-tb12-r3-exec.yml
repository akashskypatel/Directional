name: M4 CP SCALE TB12 R3 EXEC

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/tb12-r3-exec/M4-CP-SCALE-TB12-R3-EXEC.txt

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: write

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/agent-tb12-r3-exec.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: tb12-r3-exec
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  execute:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact trigger commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          token: ${{ secrets.GH_TOKEN || github.token }}

      - name: Immutable artifact preflight and execution-view materialization
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
          TURN_ID: M4-CP-SCALE-TB12-R3-EXEC
          ARTIFACT_ID: '10523132151'
          EXPECTED_ARTIFACT_NAME: m4-cp-scale-cb16-result-35283852353
          EXPECTED_PROVIDER_DIGEST: sha256:2962e2c0e4ea6dc9294d159c19c78543ddf173b5ff342436c9e89e26b4410f73
          EXPECTED_ZIP_SHA256: 2962e2c0e4ea6dc9294d159c19c78543ddf173b5ff342436c9e89e26b4410f73
          EXPECTED_SOURCE_SHA: a8df4406ebd1a5252f0be20b1f1e65a2cb453ee9
          SELECTOR_RELATIVE_PATH: .agents/Directional/Architecture_M4_CP_SCALE_CB12_Required_Green_Selector_426.txt
          EXPECTED_SELECTOR_COUNT: '426'
          EXPECTED_SELECTOR_SHA256: 41f4d559211375c11c8d1f8c9ccde2581db75819d9409366e8f2695b008b5114
          ACCEPTED_PREFIX_COUNT: '425'
        shell: bash
        run: bash .agents/Directional/tools/m3_cp4c3_artifact_only_harness.sh --preflight-only

      - name: Execute frozen TB12-R3 gates
        id: execute_r3
        continue-on-error: true
        env:
          TURN_ID: M4-CP-SCALE-TB12-R3-EXEC
        shell: bash
        run: bash .agents/Directional/turn-payloads/m4-cp-scale-tb12-r3-exec.sh

      - name: Upload TB12-R3 result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m4-cp-scale-tb12-r3-result-${{ github.run_id }}
          path: ${{ runner.temp }}/M4-CP-SCALE-TB12-R3-EXEC-result
          if-no-files-found: error
          retention-days: 7

      - name: Upload TB12-R3 log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m4-cp-scale-tb12-r3-log-${{ github.run_id }}
          path: ${{ runner.temp }}/M4-CP-SCALE-TB12-R3-EXEC.log
          if-no-files-found: error
          retention-days: 7

      - name: Fail on orchestration error
        if: always() && steps.execute_r3.outcome == 'failure'
        shell: bash
        run: exit 1
