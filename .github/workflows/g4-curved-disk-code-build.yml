name: g4-curved-disk-code-build

on:
  push:
    paths:
      - '.github/agent-triggers/g4-curved-disk-code-build'

permissions:
  contents: write
  actions: read

concurrency:
  group: g4-curved-disk-code-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  code-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      LOG_DIR: /tmp/g4-curved-disk-logs
      PAYLOAD: .agents/Directional/turn-payloads/g4-curved-disk.patch.gz.b64
    steps:
      - name: Initialize unconditional activity log
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$LOG_DIR"
          {
            echo "turn=G4 curved bounded disk-sheet Code+Build"
            echo "event_sha=$GITHUB_SHA"
            echo "event_ref=$GITHUB_REF"
            echo "entering_runtime_source=a647215b4993338b054f04d4c8e54e7ef5370001"
            echo "payload_git_blob=2436d0fe3c1f8bad2e8614f118af70ecda2ac12d"
            echo "decoded_patch_sha256=ae0b6efe3db697b22c36e2a348cb7be6a058f9e29bde5ac36231db8439f3eb91"
            echo "runtimeExecution=false"
            echo "reviewPolicy=never"
            echo "allowed=apply bounded source/test patch; configure; compile/link seven approved targets; package/checksum"
            echo "prohibited=generated Directional binaries/tests/benchmarks/ctest/discovery/CLI/GUI/help/list/custom-input execution"
          } | tee "$LOG_DIR/activity.log"

      - name: Checkout exact working branch
        uses: actions/checkout@v4
        with:
          ref: agent/surface_cell_quad/p5-recover-bridge-healing
          fetch-depth: 40
          submodules: false

      - name: Verify and apply curved-disk patch
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee -a "$LOG_DIR/activity.log") 2>&1
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -f "$PAYLOAD"
          test "$(git hash-object "$PAYLOAD")" = "2436d0fe3c1f8bad2e8614f118af70ecda2ac12d"
          test "$(git hash-object include/directional/geometry/SurfaceCellTracing.h)" = "6ebe8f3324be580fc4838b97e5fb449572709236"
          test "$(git hash-object src/geometry/SurfaceCellTracing.cpp)" = "6b32b48141c16e2d51f1932462566083a7bc3355"
          test "$(git hash-object tests/SurfaceCellsPhase10Tests.cpp)" = "c038567898f0da7efd6519392c37cbace02b8c1c"
          base64 -d "$PAYLOAD" | gzip -dc > "$RUNNER_TEMP/g4-curved-disk.patch"
          test "$(sha256sum "$RUNNER_TEMP/g4-curved-disk.patch" | awk '{print $1}')" = "ae0b6efe3db697b22c36e2a348cb7be6a058f9e29bde5ac36231db8439f3eb91"
          if grep -q '^+++ b/.github/workflows/' "$RUNNER_TEMP/g4-curved-disk.patch"; then
            echo "patch attempts workflow modification" >&2; exit 1
          fi
          git apply --check "$RUNNER_TEMP/g4-curved-disk.patch"
          git apply "$RUNNER_TEMP/g4-curved-disk.patch"
          git diff --check
          mapfile -t changed < <(git diff --name-only | sort)
          printf 'changed=%s\n' "${changed[*]}"
          test "${#changed[@]}" -eq 3
          test "${changed[0]}" = "include/directional/geometry/SurfaceCellTracing.h"
          test "${changed[1]}" = "src/geometry/SurfaceCellTracing.cpp"
          test "${changed[2]}" = "tests/SurfaceCellsPhase10Tests.cpp"
          git config user.name 'directional-agent'
          git config user.email 'directional-agent@users.noreply.github.com'
          git add "${changed[@]}"
          git commit -m 'feat(surface-cells): add intrinsic curved disk phase front'
          IMPLEMENTATION_COMMIT=$(git rev-parse HEAD)
          echo "IMPLEMENTATION_COMMIT=$IMPLEMENTATION_COMMIT" >> "$GITHUB_ENV"
          echo "implementation_commit=$IMPLEMENTATION_COMMIT"
          echo "header_blob=$(git hash-object include/directional/geometry/SurfaceCellTracing.h)"
          echo "source_blob=$(git hash-object src/geometry/SurfaceCellTracing.cpp)"
          echo "test_blob=$(git hash-object tests/SurfaceCellsPhase10Tests.cpp)"
          git rm "$PAYLOAD"
          git commit -m 'chore(agent): remove G4 curved-disk payload'
          CLEANUP_COMMIT=$(git rev-parse HEAD)
          echo "CLEANUP_COMMIT=$CLEANUP_COMMIT" >> "$GITHUB_ENV"
          echo "cleanup_commit=$CLEANUP_COMMIT"
          git push origin HEAD:agent/surface_cell_quad/p5-recover-bridge-healing

      - name: Install compile prerequisites
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee -a "$LOG_DIR/activity.log") 2>&1
          sudo apt-get update
          sudo apt-get install -y ninja-build libgmp-dev xz-utils

      - name: Fetch shallow submodules
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee -a "$LOG_DIR/activity.log") 2>&1
          git submodule update --init --depth 1
          git submodule status | tee "$LOG_DIR/submodules.txt"

      - name: Configure Release static compile-only build
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee -a "$LOG_DIR/activity.log") 2>&1
          { cmake --version; c++ --version; ninja --version; echo "compile_head=$(git rev-parse HEAD)"; } | tee "$LOG_DIR/toolchain.txt"
          cmake -S . -B agent-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DCMAKE_GTEST_DISCOVER_TESTS_DISCOVERY_MODE=PRE_TEST \
            -DBUILD_SHARED_LIBS=OFF -DBUILD_TUTORIALS=OFF -DBUILD_PYTHON=OFF \
            -DDIRECTIONAL_BUILD_CLI=OFF -DDIRECTIONAL_BUILD_GUI=OFF \
            -DDIRECTIONAL_BUILD_BENCHMARKS=ON -DDIRECTIONAL_BUILD_TESTS=ON \
            -DDIRECTIONAL_BUILD_HISTORICAL_TESTS=OFF \
            -DDIRECTIONAL_BUILD_LEGACY_INTEGRATION_TESTS=OFF \
            -DDIRECTIONAL_BUILD_OPTIONAL_GUIDANCE_TESTS=OFF \
            -DDIRECTIONAL_ENABLE_GMP=ON -DDIRECTIONAL_ENABLE_PARDISO=OFF \
            -DDIRECTIONAL_ENABLE_CUDSS=OFF -DDIRECTIONAL_ENABLE_SUITESPARSE=OFF \
            2>&1 | tee "$LOG_DIR/configure.log"

      - name: Compile seven approved targets only
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee -a "$LOG_DIR/activity.log") 2>&1
          cmake --build agent-build --parallel 2 --target \
            directional_core directional_pipeline directional_compiled_api_tests \
            directional_surface_cell_producer_tests directional_surface_cell_completion_tests \
            directional_surface_cell_validation_tests directional_benchmarks \
            2>&1 | tee "$LOG_DIR/build.log"
          echo "compile_only_gate=passed" | tee -a "$LOG_DIR/activity.log"
          git status --short | tee -a "$LOG_DIR/activity.log"

      - name: Package immutable compile artifact
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee -a "$LOG_DIR/activity.log") 2>&1
          root="$GITHUB_WORKSPACE/g4-curved-disk-artifact"
          rm -rf "$root"; mkdir -p "$root"/{bin,lib,test-data/benchmarks,logs,metadata,source}
          cp agent-build/directional_benchmarks agent-build/directional_compiled_api_tests \
             agent-build/directional_surface_cell_producer_tests \
             agent-build/directional_surface_cell_completion_tests \
             agent-build/directional_surface_cell_validation_tests "$root/bin/"
          cp agent-build/libdirectional_core.a agent-build/libdirectional_pipeline.a "$root/lib/"
          cp -a benchmarks/fixtures "$root/test-data/benchmarks/"
          cp "$LOG_DIR/activity.log" "$LOG_DIR/configure.log" "$LOG_DIR/build.log" \
             "$LOG_DIR/toolchain.txt" "$LOG_DIR/submodules.txt" "$root/logs/"
          cp agent-build/compile_commands.json "$root/source/"
          git show "$IMPLEMENTATION_COMMIT" --format=fuller --stat --patch -- \
            include/directional/geometry/SurfaceCellTracing.h \
            src/geometry/SurfaceCellTracing.cpp tests/SurfaceCellsPhase10Tests.cpp \
            > "$root/source/g4-curved-disk.patch"
          tar --exclude=.git --exclude=external --exclude=agent-build \
              --exclude=g4-curved-disk-artifact -cJf \
              "$root/source/directional-g4-curved-disk-source-no-deps.tar.xz" .
          cat > "$root/metadata/source-authority.json" <<EOF
          {"eventCommit":"$GITHUB_SHA","implementationCommit":"$IMPLEMENTATION_COMMIT","cleanupCommit":"$CLEANUP_COMMIT","enteringRuntimeSource":"a647215b4993338b054f04d4c8e54e7ef5370001","payloadGitBlob":"2436d0fe3c1f8bad2e8614f118af70ecda2ac12d","decodedPatchSha256":"ae0b6efe3db697b22c36e2a348cb7be6a058f9e29bde5ac36231db8439f3eb91","runtimeExecution":false,"reviewPolicy":"never"}
          EOF
          cat > "$root/metadata/build-authority.json" <<'EOF'
          {"configuration":"Release","generator":"Ninja","buildSharedLibs":false,"gtestDiscoveryMode":"PRE_TEST","approvedTargets":7,"runtimeExecution":false}
          EOF
          cat > "$root/metadata/command-boundary.txt" <<'EOF'
          G4 Code + Build only.
          Executed: bounded source/test patch application, configure, compile/link seven approved targets, package/checksum.
          Not executed: generated Directional binaries, tests, benchmarks, ctest/discovery, CLI, GUI, help/list/custom-input commands.
          EOF
          git ls-tree -r "$IMPLEMENTATION_COMMIT" -- \
            include/directional/geometry/SurfaceCellTracing.h \
            src/geometry/SurfaceCellTracing.cpp src/pipeline/RemeshPipeline.cpp \
            tests/SurfaceCellsPhase10Tests.cpp > "$root/metadata/final-blobs.txt"
          git submodule status > "$root/metadata/submodules.txt"
          find benchmarks/fixtures -type f | sort > "$root/metadata/fixture-files.txt"
          (cd "$root" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          sha256sum "$root/SHA256SUMS" | tee "$LOG_DIR/artifact-checksum.txt"

      - name: Upload immutable compile artifact
        uses: actions/upload-artifact@v4
        with:
          name: g4-curved-disk-code-build
          path: g4-curved-disk-artifact
          if-no-files-found: error
          retention-days: 14

      - name: Upload detailed activity log always
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g4-curved-disk-code-build-logs
          path: /tmp/g4-curved-disk-logs
          if-no-files-found: error
          retention-days: 14
