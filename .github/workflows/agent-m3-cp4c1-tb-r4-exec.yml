name: M3 CP4c-1 TB-R4 Exec

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m3-cp4c1-tb-r4/run.txt

permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: m3-cp4c1-tb-r4-${{ github.ref }}
  cancel-in-progress: false

jobs:
  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m3-cp4c1-tb-r4
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/agent-m3-cp4c1-tb-r4-exec.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  execute:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Initialize persistent activity log
        shell: bash
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/m3-cp4c1-tb-r4-activity.log"
          : > "$log"
          echo "TB_LOG=$log" >> "$GITHUB_ENV"
          printf '%s\n' \
            "workflow=$GITHUB_WORKFLOW" \
            "run_id=$GITHUB_RUN_ID" \
            "event=$GITHUB_EVENT_NAME" \
            "event_sha=$GITHUB_SHA" \
            "ref=$GITHUB_REF" \
            "repository=$GITHUB_REPOSITORY" \
            'turn=M3-CP4c-1-TB-R4' \
            'artifactOnly=true' \
            'runtimeExecution=true' \
            'configure=false' \
            'compile=false' \
            'relink=false' \
            'repair=false' \
            'generatedDiscovery=false' \
            'repositoryTimeoutConfigured=false' \
            'packageArtifactId=9673249952' \
            'packageSha256=17a3f8da793fc20562e5ec2f0ab441d39f795dd146171e989fb952e6f942d2ea' \
            'semanticSource=66a065b5e07910568a317e24f0fc6b93d890d104' \
            "started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" | tee -a "$log"

      - name: Checkout exact control source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          token: ${{ github.token }}

      - name: Provide GMP runtime and verify execution payload
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee -a "$TB_LOG") 2>&1
          dpkg -s libgmp-dev >/dev/null 2>&1 || { sudo apt-get update; sudo apt-get install -y libgmp-dev; }
          dpkg-query -W -f='libgmp-dev=${Version}\n' libgmp-dev
          ldconfig -p | grep -E 'libgmp(xx)?\.so'
          payload="$GITHUB_WORKSPACE/.agents/Directional/turn-payloads/m3-cp4c1-tb-r4.py"
          test -f "$payload"
          python3 -m py_compile "$payload"
          test "$(sha256sum "$payload" | awk '{print $1}')" = "53a51a346538f81d0e9227bf47d1500176145448d28261404c9a23596f683e46"
          echo "payload_sha256=$(sha256sum "$payload" | awk '{print $1}')"

      - name: Execute immutable artifact-only TB-R4 plan
        id: gate
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -uo pipefail
          exec > >(tee -a "$TB_LOG") 2>&1
          python3 "$GITHUB_WORKSPACE/.agents/Directional/turn-payloads/m3-cp4c1-tb-r4.py"

      - name: Record final control status
        if: always()
        shell: bash
        run: |
          set +e
          exec > >(tee -a "$TB_LOG") 2>&1
          echo "gate_outcome=${{ steps.gate.outcome }}"
          echo "control_source_status_begin"
          git status --short
          echo "control_source_status_end"
          echo "final_sha=$GITHUB_SHA"
          echo "finished_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"

      - name: Upload TB-R4 result evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-cp4c1-tb-r4-result-${{ github.run_id }}
          path: ${{ runner.temp }}/m3-cp4c1-tb-r4-result
          if-no-files-found: error
          retention-days: 14

      - name: Upload persistent diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-cp4c1-tb-r4-log-${{ github.run_id }}
          path: ${{ env.TB_LOG }}
          if-no-files-found: error
          retention-days: 14

      - name: Propagate TB-R4 status
        if: always()
        shell: bash
        run: |
          test -f "$RUNNER_TEMP/m3-cp4c1-tb-r4-result/gate-exit-code.txt" || exit 2
          exit "$(cat "$RUNNER_TEMP/m3-cp4c1-tb-r4-result/gate-exit-code.txt")"
