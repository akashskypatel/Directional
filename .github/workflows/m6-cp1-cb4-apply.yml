name: M6 CP1 CB4 Apply

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m6-cp1-cb4-apply/trigger.txt

permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

concurrency:
  group: m6-cp1-cb4-apply-${{ github.ref }}
  cancel-in-progress: false

jobs:
  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m6-cp1-cb4-apply
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/m6-cp1-cb4-apply.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  apply:
    needs: validate
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1uEPJK6WmhDUElD3x8_296OPJQ-ImyUWd
      patch_sha256: 1be2b2b3785d46bdde23cd3d24af4346a649591a430595960e44a557b279235b
      base_sha: 05127e48cc424aad8c9406be860b3178701c723e
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: 'M6-CP1-CB4: complete seam incident authority'
      retention_days: 7
    secrets: inherit
