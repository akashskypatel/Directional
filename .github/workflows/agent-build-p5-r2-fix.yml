name: Agent Apply Surface Cell P5 R2 Compile Fix

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .github/workflows/agent-build-p5-r2-fix.yml
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: agent/surface_cell_quad/p5-recover-bridge-healing
          fetch-depth: 2
          persist-credentials: true

      - name: Apply marker-bounded rollback typing fix
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          event_sha=$(git rev-parse HEAD)
          remote_sha=$(git ls-remote origin refs/heads/agent/surface_cell_quad/p5-recover-bridge-healing | cut -f1)
          test "${event_sha}" = "${remote_sha}"
          test -z "$(git status --porcelain=v1)"

          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/geometry/SurfaceCellFeasibilityRepair.cpp')
          text = path.read_text(encoding='utf-8')
          start_marker = '  const SurfaceArrangementDiagnostics &d = complex.diagnostics;\n'
          end_marker = '  append_rollback_double(identity, d.supportedArea);\n'
          if text.count(start_marker) != 1 or text.count(end_marker) != 1:
              raise SystemExit('rollback diagnostics markers are not unique')
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          replacement = '''  const SurfaceArrangementDiagnostics &d = complex.diagnostics;
          const std::array<std::int64_t, 32> diagnosticsIdentity{{
              d.plantedIntersections, d.uniqueIntersections, d.unsplitCrossings,
              d.geometricTJunctions, d.incompleteArcChains,
              d.hardBarrierCrossings, d.eulerCharacteristic,
              d.sourceEulerCharacteristic, d.connectedComponentCount,
              d.sourceConnectedComponentCount, d.boundaryLoopCount,
              d.sourceBoundaryLoopCount, d.directedWedgeCount,
              d.successorMissingCount, d.successorAmbiguityCount,
              d.predecessorMultiplicityFailureCount, d.repeatedNodeCycleCount,
              d.repeatedEdgeCycleCount, static_cast<int>(d.incidenceFailure),
              d.incidenceFailureNode, d.incidenceFailureHalfedge,
              d.incidenceFailureTwin, d.incidenceFailureNext,
              static_cast<std::int64_t>(d.directedIncidenceHash),
              d.incidenceValid ? 1 : 0, d.embeddingValid ? 1 : 0,
              d.orientationValid ? 1 : 0, d.cellsDiskValid ? 1 : 0,
              d.boundaryLoopsValid ? 1 : 0,
              d.eulerCharacteristicValid ? 1 : 0,
              d.topologyValid ? 1 : 0, d.peakSegmentsPerFace}};
          for (const std::int64_t value : diagnosticsIdentity) {
            append_rollback_word(identity, value);
          }
          '''
          path.write_text(text[:start] + replacement + text[end:], encoding='utf-8')
          PY

          git diff --check
          git diff --binary > /tmp/P5-R2-compile-fix.patch
          fix_sha=$(sha256sum /tmp/P5-R2-compile-fix.patch | cut -d' ' -f1)
          git config user.name directional-build-agent
          git config user.email directional-build-agent@users.noreply.github.com
          git add src/geometry/SurfaceCellFeasibilityRepair.cpp
          git commit -m 'P5-R2: type diagnostics rollback identity [skip ci]'
          git push origin HEAD:agent/surface_cell_quad/p5-recover-bridge-healing
          source_sha=$(git rev-parse HEAD)
          message="P5-R2 rollback identity compile fix applied at ${source_sha}; patch SHA-256 ${fix_sha}. No project binary executed."
          gh api repos/${GITHUB_REPOSITORY}/issues/8/comments -f body="${message}"
