name: Directional TB39 Review Boundary

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/review-boundary-tb39.txt

permissions:
  actions: read
  contents: write

concurrency:
  group: directional-tb39-review-boundary
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/agent-tb39-review-boundary.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  verify:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run unchanged review boundary checker with full Git history
        shell: bash
        run: |
          set +e
          python3 .agents/Directional/tools/review_check.py boundary > review-boundary-tb39.log 2>&1
          rc=$?
          cat review-boundary-tb39.log
          printf 'exit_code=%s\n' "$rc" >> review-boundary-tb39.log
          exit "$rc"
      - name: Upload independent boundary evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: review-boundary-tb39-${{ github.run_id }}
          path: review-boundary-tb39.log
          if-no-files-found: error
          retention-days: 14

  mailbox:
    if: ${{ always() }}
    needs: [validate, verify]
    uses: ./.github/workflows/workflow-mailbox-publisher.yml
    with:
      mailbox_branch: workflow-mailbox
      workflow_key: directional-tb39-review-boundary
      source_sha: ${{ github.sha }}
      source_ref: ${{ github.ref }}
      result: ${{ needs.verify.result }}
      summary: Exact full-history static review boundary check; no Directional runtime.
