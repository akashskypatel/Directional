name: Agent M3 CP4c3 TB41 EXEC

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m3-cp4c3-tb41-exec/trigger.json

permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: agent-m3-cp4c3-tb41-exec
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/agent-m3-cp4c3-tb41-exec.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m3-cp4c3-tb41-exec
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  tb41:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Initialize TB41 diagnostic log
        shell: bash
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/M3-CP4c-3-TB41-workflow.log"
          : > "$log"
          {
            echo "workflow=${GITHUB_WORKFLOW}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "event=${GITHUB_EVENT_NAME}"
            echo "event_sha=${GITHUB_SHA}"
            echo "repository=${GITHUB_REPOSITORY}"
            echo "started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } | tee -a "$log"

      - name: Checkout control source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          path: control
          token: ${{ secrets.GH_TOKEN || github.token }}

      - name: Read immutable CB46 authority
        shell: bash
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/M3-CP4c-3-TB41-workflow.log"
          report="control/.agents/Directional/Architecture_M3_CP4c3_CB46_Code_Build_Report.md"
          test -f "$report"
          source_sha="$(sed -n 's/^\*\*Final semantic source:\*\* `\([0-9a-f]\{40\}\)`$/\1/p' "$report")"
          artifact_id="$(sed -n 's/^\*\*Immutable result artifact:\*\* `\([0-9]\+\)` \/ `.*$/\1/p' "$report")"
          artifact_name="$(sed -n 's/^\*\*Immutable result artifact:\*\* `[0-9]\+` \/ `\([^`]*\)`$/\1/p' "$report")"
          result_zip_sha="$(sed -n 's/^\*\*Result ZIP SHA-256:\*\* `\([0-9a-f]\{64\}\)`$/\1/p' "$report")"
          source_archive_sha="$(sed -n 's/^\*\*Packaged source archive SHA-256:\*\* `\([0-9a-f]\{64\}\)`$/\1/p' "$report")"
          test "$source_sha" = "4cdffe5514ab9f747da38e74c57663ee8806efa6"
          test "$artifact_id" = "10066942690"
          test "$artifact_name" = "directional-m3-cp4c3-cb46-result-34253044050"
          test "${#result_zip_sha}" -eq 64
          test "${#source_archive_sha}" -eq 64
          {
            echo "SOURCE_SHA=$source_sha"
            echo "ARTIFACT_ID=$artifact_id"
            echo "EXPECTED_ARTIFACT_NAME=$artifact_name"
            echo "RESULT_ZIP_SHA=$result_zip_sha"
            echo "SOURCE_ARCHIVE_SHA=$source_archive_sha"
          } >> "$GITHUB_ENV"
          {
            echo "source_sha=$source_sha"
            echo "artifact_id=$artifact_id"
            echo "artifact_name=$artifact_name"
            echo "result_zip_sha=$result_zip_sha"
            echo "source_archive_sha=$source_archive_sha"
          } | tee -a "$log"

      - name: Checkout exact CB46 semantic source
        uses: actions/checkout@v4
        with:
          ref: 4cdffe5514ab9f747da38e74c57663ee8806efa6
          fetch-depth: 1
          path: semantic
          token: ${{ secrets.GH_TOKEN || github.token }}

      - name: Verify frozen checkout and selector authority
        shell: bash
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/M3-CP4c-3-TB41-workflow.log"
          cd semantic
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          plan=".agents/Directional/Architecture_M3_CP4c3_TB41_Artifact_Only_Test_Benchmark_Plan.md"
          selector=".agents/Directional/Architecture_M3_CP4c3_Required_Green_Selector_409.txt"
          harness=".agents/Directional/tools/m3_cp4c3_artifact_only_harness.sh"
          test -f "$plan" -a -f "$selector" -a -f "$harness"
          selector_sha="$(awk '/selector409 bytes have SHA-256/{getline; gsub(/[`[:space:].]/, ""); print; exit}' "$plan")"
          test "${#selector_sha}" -eq 64
          actual_selector_sha="$(sha256sum "$selector" | awk '{print $1}')"
          test "$actual_selector_sha" = "$selector_sha"
          test "$(grep -cve '^[[:space:]]*$' "$selector")" -eq 409
          test -z "$(git status --short)"
          echo "EXPECTED_SELECTOR_SHA256=$selector_sha" >> "$GITHUB_ENV"
          {
            echo "selector409_sha256=$selector_sha"
            echo "harness_sha256=$(sha256sum "$harness" | awk '{print $1}')"
            echo "semantic_status=clean"
          } | tee -a "$log"

      - name: Run explicit no-runtime package preflight
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
        shell: bash
        run: |
          set -euo pipefail
          export EXPECTED_PROVIDER_DIGEST="sha256:${RESULT_ZIP_SHA}"
          export EXPECTED_ZIP_SHA256="$RESULT_ZIP_SHA"
          export EXPECTED_SOURCE_SHA="$SOURCE_SHA"
          export SELECTOR_RELATIVE_PATH=.agents/Directional/Architecture_M3_CP4c3_Required_Green_Selector_409.txt
          export EXPECTED_SELECTOR_COUNT=409
          export ACCEPTED_PREFIX_COUNT=365
          export TURN_ID=M3-CP4c-3-TB41-PREFLIGHT
          cd semantic
          bash .agents/Directional/tools/m3_cp4c3_artifact_only_harness.sh --preflight-only
          root="${RUNNER_TEMP}/M3-CP4c-3-TB41-PREFLIGHT"
          pkg="$root/package"
          src="$root/source"
          result="${RUNNER_TEMP}/M3-CP4c-3-TB41-PREFLIGHT-result"
          source_archive="$pkg/source/source-${SOURCE_SHA}.tar.gz"
          test "$(sha256sum "$source_archive" | awk '{print $1}')" = "$SOURCE_ARCHIVE_SHA"
          test -s "$pkg/metadata/gmp-evidence.txt"
          test ! -s "$pkg/metadata/source-status-final.txt"
          test "$(sha256sum "$src/.agents/Directional/tools/m3_cp4c3_artifact_only_harness.sh" | awk '{print $1}')" = \
               "$(sha256sum .agents/Directional/tools/m3_cp4c3_artifact_only_harness.sh | awk '{print $1}')"
          test "$(sha256sum "$src/.agents/Directional/Architecture_M3_CP4c3_Required_Green_Selector_409.txt" | awk '{print $1}')" = "$EXPECTED_SELECTOR_SHA256"
          ldd "$pkg/bin/directional_surface_cell_producer_tests" | tee "$result/gmp-runtime-deps.txt"
          grep -Fq 'libgmp.so' "$result/gmp-runtime-deps.txt"
          if grep -Fq 'not found' "$result/gmp-runtime-deps.txt"; then
            exit 1
          fi
          grep -Fxq runtime_started=false "$result/execution-boundary.txt"
          grep -Fxq runtime_completed=false "$result/execution-boundary.txt"
          grep -Fxq orchestration_failure=false "$result/execution-boundary.txt"

      - name: Execute immutable artifact-only selector409 harness
        id: execute
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
        shell: bash
        run: |
          set +e
          export EXPECTED_PROVIDER_DIGEST="sha256:${RESULT_ZIP_SHA}"
          export EXPECTED_ZIP_SHA256="$RESULT_ZIP_SHA"
          export EXPECTED_SOURCE_SHA="$SOURCE_SHA"
          export SELECTOR_RELATIVE_PATH=.agents/Directional/Architecture_M3_CP4c3_Required_Green_Selector_409.txt
          export EXPECTED_SELECTOR_COUNT=409
          export ACCEPTED_PREFIX_COUNT=365
          export TURN_ID=M3-CP4c-3-TB41-EXEC
          cd semantic
          bash .agents/Directional/tools/m3_cp4c3_artifact_only_harness.sh --execute
          status=$?
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Record workflow completion evidence
        if: always()
        env:
          HARNESS_EXIT: ${{ steps.execute.outputs.exit_code }}
        shell: bash
        run: |
          set +e
          log="${RUNNER_TEMP}/M3-CP4c-3-TB41-workflow.log"
          result="${RUNNER_TEMP}/M3-CP4c-3-TB41-EXEC-result"
          {
            echo "harness_exit=${HARNESS_EXIT:-unavailable}"
            echo "job_status=${{ job.status }}"
            echo "source_sha=${SOURCE_SHA:-unavailable}"
            echo "artifact_id=${ARTIFACT_ID:-unavailable}"
            echo "selector409_sha256=${EXPECTED_SELECTOR_SHA256:-unavailable}"
            echo "finished_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } | tee -a "$log"
          if [[ -d "$result" ]]; then
            cp "$log" "$result/workflow-evidence.log"
          fi

      - name: Upload TB41 result artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-cp4c3-tb41-result-${{ github.run_id }}
          path: ${{ runner.temp }}/M3-CP4c-3-TB41-EXEC-result
          if-no-files-found: error
          retention-days: 7

      - name: Upload TB41 persistent logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-cp4c3-tb41-log-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/M3-CP4c-3-TB41-workflow.log
            ${{ runner.temp }}/M3-CP4c-3-TB41-PREFLIGHT.log
            ${{ runner.temp }}/M3-CP4c-3-TB41-EXEC.log
          if-no-files-found: error
          retention-days: 7

      - name: Fail only on orchestration harness failure
        if: always()
        env:
          HARNESS_EXIT: ${{ steps.execute.outputs.exit_code }}
        shell: bash
        run: test "${HARNESS_EXIT:-unavailable}" = 0
