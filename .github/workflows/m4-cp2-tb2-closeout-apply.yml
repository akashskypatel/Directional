      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m4-cp2-tb2-closeout-apply-20260910-a.txt

permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

concurrency:
  group: m4-cp2-tb2-closeout-apply
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/m4-cp2-tb2-closeout-apply.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m4-cp2-tb2-closeout-apply
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  apply:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1bJA_qkc-qdsjfewQUHH6NUqbmvaudLIJ
      patch_sha256: 6711a14c37c44416c04e519a4e81985fe7eb5fa10fbc5cd864e921672b0b2897
      base_sha: a950a9cf1b6ef20131a1cb3ccb91e0d46d830aa2
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: "M4-CP2-TB2: close invalid orchestration attempt"
    secrets: inherit
