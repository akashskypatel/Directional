name: Agent TB34 Closeout Google Drive Patch Apply

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/tb34-closeout-drive-apply-20260906.txt

permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

concurrency:
  group: agent-tb34-closeout-drive-apply
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/agent-tb34-closeout-drive-apply.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: tb34-closeout-drive-apply
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  apply:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1TLDno6qbxHLhWRyCBTizZkUhaYqrodVU
      patch_sha256: 44fa6fc4c47c69043902f445e87b687d45fd257ee52785cf6d78b88f94e6f2e0
      base_sha: ac61ac58f8825dfb94ad5c8dee5df89d4677c70d
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: "docs: close TB34 EXEC and freeze independent review"
    secrets: inherit
