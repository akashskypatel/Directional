name: M4 CP-SCALE CB14 Drive Apply

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m4-cp-scale-cb14-drive-apply-20260917.txt

permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

concurrency:
  group: m4-cp-scale-cb14-drive-apply
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/m4-cp-scale-cb14-drive-apply.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m4-cp-scale-cb14-drive-apply
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  apply:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1o-6z3Za5OyDziYygmzwiHT9e4Dp4gEDq
      patch_sha256: '65370e7bae2cedb729bf9295db34929d8300129efae45aafc0f8ff0b1bf3c2bf'
      base_sha: f9182f39bc227cca89e96bc7df6f6dc4d430f1fd
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: 'fixtures: retain deterministic genus-two S5 authority'
      retention_days: 7
    secrets: inherit
