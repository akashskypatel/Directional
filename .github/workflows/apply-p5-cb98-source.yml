# Temporary source-transfer workflow. The workflow changes only the seven
# declared source/test files. Workflow files are managed by the connector.
name: Apply P5 CB98 Source Patch

on:
  push:
    branches:
      - agent/p5-cb98-source-sync
    paths:
      - '.agents/Directional/patches/P5_CB98_APPLY_READY'
  pull_request:
    branches:
      - agent/p5-cb98-source-sync
    types:
      - opened
      - synchronize

concurrency:
  group: apply-p5-cb98-source-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  apply-source:
    if: github.event_name == 'push' || github.event.pull_request.head.ref == 'agent/p5-cb98-source-sync-trigger'
    runs-on: ubuntu-24.04
    steps:
      - name: Record start
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          gh api repos/${{ github.repository }}/issues/8/comments \
            -f body="P5-CB98 three-way source transfer ${RUN_ID} started from ${EVENT_SHA}. It is restricted to seven source/test files; no workflow file will be modified, staged, committed, or pushed."

      - name: Checkout target branch with history
        uses: actions/checkout@v4
        with:
          ref: agent/surface_cell_quad/p5-recover-bridge-healing
          fetch-depth: 0
          submodules: false

      - name: Reconstruct and verify patch
        run: |
          set -euo pipefail
          root=.agents/Directional/patches
          cat \
            "${root}/p5-cb98-remaining.patch.gz.b64.part00" \
            "${root}/p5-cb98-remaining.patch.gz.b64.part01" \
            "${root}/p5-cb98-remaining.patch.gz.b64.part02" \
            "${root}/p5-cb98-remaining.patch.gz.b64.part03" \
            | tr -d '\r\n' > /tmp/p5-cb98.patch.gz.b64
          echo 'f41c94c0de85a1ab37a2b6cb8bfaa062623df482289c2f06eaf93bf2225512fb  /tmp/p5-cb98.patch.gz.b64' | sha256sum -c -
          base64 -d /tmp/p5-cb98.patch.gz.b64 > /tmp/p5-cb98.patch.gz
          echo 'ea4d16a2cef572c1ee8e245b88c51cdfe8ce780effa7b612cd5db2ad373da2e8  /tmp/p5-cb98.patch.gz' | sha256sum -c -
          gzip -dc /tmp/p5-cb98.patch.gz > /tmp/p5-cb98.patch
          echo 'cbea5cf99ac2bf089a73ae0f698e1e92e613ab6218995fa62769d8dc3af737d8  /tmp/p5-cb98.patch' | sha256sum -c -
          test "$(wc -c < /tmp/p5-cb98.patch)" = 106126

      - name: Verify exact non-workflow scope
        run: |
          set -euo pipefail
          printf '%s\n' \
            src/bench/DirectionalBenchmark.cpp \
            src/geometry/PatchDescriptor.cpp \
            src/geometry/SurfaceArrangement.cpp \
            src/geometry/SurfaceComplexSimplification.cpp \
            src/pipeline/RemeshPipeline.cpp \
            tests/PatchDescriptorMilestoneETests.cpp \
            tests/SurfaceCellPipelinePhase20Tests.cpp \
            | sort > /tmp/expected-files.txt
          git apply --numstat /tmp/p5-cb98.patch | cut -f3- | sort -u > /tmp/patch-files.txt
          diff -u /tmp/expected-files.txt /tmp/patch-files.txt
          test -z "$(grep -E '(^|/)\.github/workflows/' /tmp/patch-files.txt || true)"
          test -z "$(grep -E '^(diff --git|--- |\+\+\+ )' /tmp/p5-cb98.patch | grep -F '.github/workflows/' || true)"

      - name: Apply patch with three-way merge
        run: |
          set -euo pipefail
          git apply --3way /tmp/p5-cb98.patch
          test -z "$(git diff --name-only --diff-filter=U)"
          git diff --check
          git diff --name-only | sort -u > /tmp/actual-files.txt
          diff -u /tmp/expected-files.txt /tmp/actual-files.txt
          test -z "$(git diff --name-only -- .github/workflows)"

      - name: Commit and push source files only
        run: |
          set -euo pipefail
          git config user.name directional-agent
          git config user.email directional-agent@users.noreply.github.com
          xargs -d '\n' git add -- < /tmp/expected-files.txt
          git diff --cached --name-only | sort -u > /tmp/staged-files.txt
          diff -u /tmp/expected-files.txt /tmp/staged-files.txt
          test -z "$(git diff --cached --name-only -- .github/workflows)"
          git commit -m 'fix(surface-cells): apply P5-CB98 remaining source patch [skip ci]'
          git push origin HEAD:agent/surface_cell_quad/p5-recover-bridge-healing

      - name: Record result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          EVENT_SHA: ${{ github.sha }}
          JOB_STATUS: ${{ job.status }}
        run: |
          gh api repos/${{ github.repository }}/issues/8/comments \
            -f body="P5-CB98 three-way source transfer ${RUN_ID} finished ${JOB_STATUS} from ${EVENT_SHA}. No workflow file was modified, staged, committed, or pushed by the workflow."
