name: M3 CP4c3 TB13 Artifact Only

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m3-cp4c3-tb13-20260902.txt

permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: directional-m3-cp4c3-tb13
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/m3-cp4c3-tb13.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m3-cp4c3-tb13
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  tb13:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Initialize diagnostic log
        shell: bash
        run: |
          set -euo pipefail
          : > "${RUNNER_TEMP}/tb13.log"
          printf '%s\n' "workflow=$GITHUB_WORKFLOW" "run_id=$GITHUB_RUN_ID" "event_sha=$GITHUB_SHA" \
            "repository=$GITHUB_REPOSITORY" "started_at=$(date -u +%FT%TZ)" | tee -a "${RUNNER_TEMP}/tb13.log"

      - name: Checkout exact orchestration control
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          token: ${{ secrets.GH_TOKEN || github.token }}

      - name: Verify and execute TB13 control
        env:
          TOKEN: ${{ secrets.GH_TOKEN || github.token }}
        shell: bash
        run: |
          set -euo pipefail
          script=.agents/Directional/turn-payloads/m3-cp4c3-tb13.sh
          helper=.agents/Directional/turn-payloads/m3-cp4c3-tb13.py
          test "$(sha256sum "$script" | cut -d' ' -f1)" = accb9704242254172f37bfa21e5bc456bdbe3dd27b3ba3ebeda379ed9b34198a
          test "$(sha256sum "$helper" | cut -d' ' -f1)" = f0ed8bd2b62aaca603dfdc81a83fa348fb3c11bc415fc1c499629a1dd402331a
          bash "$script"

      - name: Record final status
        if: always()
        shell: bash
        run: |
          printf '%s\n' "final_job_status=${{ job.status }}" "finished_at=$(date -u +%FT%TZ)" | tee -a "${RUNNER_TEMP}/tb13.log"

      - name: Upload TB13 result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-cp4c3-tb13-result-${{ github.run_id }}
          path: ${{ runner.temp }}/tb13-result
          if-no-files-found: warn
          retention-days: 14

      - name: Upload TB13 log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-cp4c3-tb13-log-${{ github.run_id }}
          path: ${{ runner.temp }}/tb13.log
          if-no-files-found: error
          retention-days: 14
