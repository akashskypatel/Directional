name: M3 CP4c0b CB1 S1 Compile

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m3-cp4c0b-cb1-s1-compile/run.txt

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: m3-cp4c0b-cb1-s1-compile-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/agent-m3-cp4c0b-cb1-s1-compile.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m3-cp4c0b-cb1-s1-compile
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  precompile:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-compile-reusable.yml
    with:
      source_sha: 4bb467806df99c70889394a323c17c13bc185ca3
      targets: directional_surface_cell_producer_tests
      artifact_prefix: m3-cp4c0b-cb1-s1-precompile
    secrets: inherit

  package:
    needs:
      - validate
      - precompile
    if: ${{ needs.validate.outputs.valid == 'true' && needs.precompile.result == 'success' }}
    uses: ./.github/workflows/agent-compile-reusable.yml
    with:
      source_sha: 4bb467806df99c70889394a323c17c13bc185ca3
      targets: directional_core directional_pipeline directional_surface_cell_authority_kernel_tests directional_surface_cell_producer_tests directional_surface_cell_completion_tests directional_surface_cell_validation_tests directional_compiled_api_tests directional_benchmarks
      artifact_prefix: m3-cp4c0b-cb1-s1-package
    secrets: inherit
