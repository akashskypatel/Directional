name: Agent CB36 Drive Apply

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/drive-apply/m3-cp4c3-cb36-*.json

permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

concurrency:
  group: agent-cb36-drive-apply-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/agent-cb36-drive-apply.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  observe:
    if: ${{ github.event_name == 'push' }}
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: cb36-drive-apply
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  apply:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1tPsZd4UV2jaHL-H_2F29Gaj8JeQ89buP
      patch_sha256: f584881b6621afe26b03566077adfb5ed28ac3e52bb90745d1af158b2b7d88f2
      base_sha: 4320323bf340f5d60bcef1c629e6d7ad6dc01634
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: "fix: apply separating-arc guard to topology plan"
      retention_days: 7
    secrets: inherit
