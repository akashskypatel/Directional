name: Agent Build Surface Cell P5 R2E4

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .github/workflows/agent-build-p5-r2e4.yml

permissions:
  contents: write

concurrency:
  group: agent-surface-cell-p5-r2e4-${{ github.ref }}
  cancel-in-progress: true

env:
  ACTIVE_BRANCH: agent/surface_cell_quad/p5-recover-bridge-healing
  BUILD_DIR: build/agent-p5-r2e4-release
  PACKAGE_DIR: artifact
  LOG_DIR: /tmp/p5-r2e4-workflow-logs
  ACTIVITY_LOG: /tmp/p5-r2e4-workflow-logs/p5-r2e4-compile-activity.log
  PATCH_B64: .agents/Directional/patches/P5-R2E4.patch.gz.b64
  EXPECTED_BLOBS: .agents/Directional/patches/P5-R2E4.expected-blobs.tsv
  REVIEWED_PATCH_SHA256: 33ee4e40c7e5146abd732796b771d74ed28b7808bae6b0ed14bd327fd902aa01

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Initialize persistent workflow log
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${LOG_DIR}"
          {
            echo "P5-R2E4 authoritative boundary-node rotational-system compile-only build"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "event_sha=${GITHUB_SHA}"
            echo "started_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } | tee "${ACTIVITY_LOG}"

      - name: Checkout exact event commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 4
          submodules: false
          persist-credentials: true

      - name: Apply reviewed R2E4 patch, compile, and package
        id: compile
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "${LOG_DIR}"
          exec > >(tee -a "${ACTIVITY_LOG}") 2>&1
          PS4='+ ${BASH_SOURCE}:${LINENO}: '
          finish() {
            rc=$?
            trap - EXIT
            set +x
            {
              echo "compile_step_exit_code=${rc}"
              echo "compile_step_finished_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
              echo "final_git_status_begin"
              git status --short --branch || true
              echo "final_git_status_end"
              df -h . || true
              du -sh "${BUILD_DIR}" "${PACKAGE_DIR}" 2>/dev/null || true
            } | tee -a "${ACTIVITY_LOG}"
            exit "${rc}"
          }
          trap finish EXIT
          set -x

          event_sha=$(git rev-parse HEAD)
          test "${event_sha}" = "${GITHUB_SHA}"
          remote_sha=$(git ls-remote origin "refs/heads/${ACTIVE_BRANCH}" | cut -f1)
          test "${event_sha}" = "${remote_sha}"
          test -z "$(git status --porcelain=v1)"
          test -f "${PATCH_B64}"
          test -f "${EXPECTED_BLOBS}"

          base64 -d "${PATCH_B64}" | gzip -d > /tmp/P5-R2E4.patch
          echo "${REVIEWED_PATCH_SHA256}  /tmp/P5-R2E4.patch" | sha256sum -c -
          ! grep -Eq '^diff --git a/\.github/workflows/' /tmp/P5-R2E4.patch

          while IFS=$'\t' read -r expected path; do
            test "$(git hash-object "${path}")" = "${expected}"
          done < "${EXPECTED_BLOBS}"
          git apply --check /tmp/P5-R2E4.patch
          git apply /tmp/P5-R2E4.patch

          test "$(git hash-object include/directional/geometry/SurfaceArrangement.h)" = b6e0ae132615d19402e1199a7730d567937ab9b4
          test "$(git hash-object src/geometry/SurfaceArrangement.cpp)" = d2024dcdfd1779da86ce23f1facae928f0e6bea2
          test "$(git hash-object tests/MilestoneDClosureTests.cpp)" = 35306a0d115f2733af9306a6a80c0c47ebec03f8
          test "$(git hash-object tests/SurfaceArrangementPhase16Tests.cpp)" = a566bac293fa2bb7274b88123bdc06c065bbd730

          git rm "${PATCH_B64}" "${EXPECTED_BLOBS}"
          git add include/directional/geometry/SurfaceArrangement.h \
            src/geometry/SurfaceArrangement.cpp \
            tests/MilestoneDClosureTests.cpp \
            tests/SurfaceArrangementPhase16Tests.cpp
          git diff --cached --check
          git config user.name directional-build-agent
          git config user.email directional-build-agent@users.noreply.github.com
          git commit -m 'P5-R2E4: construct authoritative boundary rotations [skip ci]'
          git push origin "HEAD:${ACTIVE_BRANCH}"

          source_sha=$(git rev-parse HEAD)
          test "${source_sha}" = "$(git ls-remote origin "refs/heads/${ACTIVE_BRANCH}" | cut -f1)"
          test "$(git rev-parse HEAD^)" = "${event_sha}"
          git diff --binary "${event_sha}" "${source_sha}" -- \
            include/directional/geometry/SurfaceArrangement.h \
            src/geometry/SurfaceArrangement.cpp \
            tests/MilestoneDClosureTests.cpp \
            tests/SurfaceArrangementPhase16Tests.cpp > /tmp/applied-source.diff
          applied_diff_sha=$(sha256sum /tmp/applied-source.diff | cut -d' ' -f1)
          test "${applied_diff_sha}" = "${REVIEWED_PATCH_SHA256}"

          printf '%s\n' "${source_sha}" > /tmp/source-commit.txt
          printf '%s\n' "${event_sha}" > /tmp/workflow-event-commit.txt
          printf '%s\n' "${REVIEWED_PATCH_SHA256}" > /tmp/reviewed-patch-sha256.txt
          printf '%s\n' "${applied_diff_sha}" > /tmp/applied-source-diff-sha256.txt

          git submodule sync --recursive
          git submodule update --init --recursive --depth 1 --jobs 4
          git submodule status --recursive | tee /tmp/submodule-status.txt
          test "$(wc -l < /tmp/submodule-status.txt)" -eq 9
          git diff --check
          git status --porcelain=v1 > /tmp/source-status.txt
          test ! -s /tmp/source-status.txt

          find .github/workflows -maxdepth 1 -type f -printf '%P\n' | sort > /tmp/exact-source-workflows.txt
          test "$(wc -l < /tmp/exact-source-workflows.txt)" -eq 2
          grep -Fx 'agent-source-snapshot.yml' /tmp/exact-source-workflows.txt
          grep -Fx 'agent-build-p5-r2e4.yml' /tmp/exact-source-workflows.txt
          find .agents/Directional/patches -type f 2>/dev/null | sort > /tmp/exact-source-payloads.txt || true
          test ! -s /tmp/exact-source-payloads.txt

          rm -rf "${BUILD_DIR}" "${PACKAGE_DIR}" /tmp/p5-r2e4-source-copy
          mkdir -p "${BUILD_DIR}" "${PACKAGE_DIR}/bin" "${PACKAGE_DIR}/lib" \
            "${PACKAGE_DIR}/source" "${PACKAGE_DIR}/logs"
          cmake -S . -B "${BUILD_DIR}" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_FLAGS_RELEASE='-O2 -DNDEBUG' \
            -DBUILD_SHARED_LIBS=OFF \
            -DDIRECTIONAL_BUILD_TESTS=ON \
            -DDIRECTIONAL_BUILD_BENCHMARKS=ON \
            -DDIRECTIONAL_BUILD_CLI=OFF \
            -DDIRECTIONAL_BUILD_GUI=OFF \
            -DDIRECTIONAL_ENABLE_GMP=OFF \
            -DDIRECTIONAL_ENABLE_PARDISO=OFF \
            -DDIRECTIONAL_ENABLE_CUDSS=OFF \
            -DDIRECTIONAL_ENABLE_SUITESPARSE=OFF \
            |& tee "${BUILD_DIR}/configure.log"
          cmake --build "${BUILD_DIR}" \
            --target directional_core directional_pipeline directional_phase1_tests directional_benchmarks \
            -j 4 |& tee "${BUILD_DIR}/build.log"

          test -f "${BUILD_DIR}/libdirectional_core.a"
          test -f "${BUILD_DIR}/libdirectional_pipeline.a"
          test -x "${BUILD_DIR}/directional_phase1_tests"
          test -x "${BUILD_DIR}/directional_benchmarks"
          fixture_root="${BUILD_DIR}/test-data/benchmarks/fixtures"
          find "${fixture_root}" -type f | sort | tee /tmp/fixture-files.txt
          test "$(wc -l < /tmp/fixture-files.txt)" -eq 26
          git status --porcelain=v1 > /tmp/source-status.txt
          test ! -s /tmp/source-status.txt

          cp "${BUILD_DIR}/directional_phase1_tests" "${PACKAGE_DIR}/bin/"
          cp "${BUILD_DIR}/directional_benchmarks" "${PACKAGE_DIR}/bin/"
          cp -a "${BUILD_DIR}/test-data" "${PACKAGE_DIR}/bin/"
          cp "${BUILD_DIR}/libdirectional_core.a" "${PACKAGE_DIR}/lib/"
          cp "${BUILD_DIR}/libdirectional_pipeline.a" "${PACKAGE_DIR}/lib/"

          git archive --format=tar.gz --output="${PACKAGE_DIR}/source/exact-source.tar.gz" HEAD
          mkdir -p /tmp/p5-r2e4-source-copy
          git archive --format=tar HEAD | tar -xf - -C /tmp/p5-r2e4-source-copy
          rm -f /tmp/p5-r2e4-source-copy/.github/workflows/agent-build-p5-r2e4.yml
          find /tmp/p5-r2e4-source-copy/.github/workflows -maxdepth 1 -type f -printf '%P\n' | sort > /tmp/source-workflows.txt
          test "$(wc -l < /tmp/source-workflows.txt)" -eq 1
          grep -Fx 'agent-source-snapshot.yml' /tmp/source-workflows.txt
          find /tmp/p5-r2e4-source-copy/.agents/Directional/patches -type f 2>/dev/null | sort > /tmp/source-payloads.txt || true
          test ! -s /tmp/source-payloads.txt
          printf '%s\n' '.github/workflows/agent-build-p5-r2e4.yml' > /tmp/source-exclusions.txt
          tar -C /tmp/p5-r2e4-source-copy -czf "${PACKAGE_DIR}/source/source.tar.gz" .

          cp /tmp/source-commit.txt /tmp/workflow-event-commit.txt \
            /tmp/reviewed-patch-sha256.txt /tmp/applied-source-diff-sha256.txt \
            /tmp/source-status.txt /tmp/submodule-status.txt /tmp/fixture-files.txt \
            /tmp/exact-source-workflows.txt /tmp/exact-source-payloads.txt \
            /tmp/source-workflows.txt /tmp/source-payloads.txt /tmp/source-exclusions.txt \
            "${PACKAGE_DIR}/"
          cp "${BUILD_DIR}/configure.log" "${BUILD_DIR}/build.log" "${ACTIVITY_LOG}" "${PACKAGE_DIR}/logs/"

          sha256sum "${PACKAGE_DIR}/bin/directional_phase1_tests" \
            "${PACKAGE_DIR}/bin/directional_benchmarks" \
            "${PACKAGE_DIR}/lib/libdirectional_core.a" \
            "${PACKAGE_DIR}/lib/libdirectional_pipeline.a" \
            | tee "${PACKAGE_DIR}/built-targets.sha256"
          find "${PACKAGE_DIR}" -type f ! -name files.sha256 -print0 | sort -z | xargs -0 sha256sum > /tmp/files.sha256
          mv /tmp/files.sha256 "${PACKAGE_DIR}/files.sha256"
          sha256sum -c "${PACKAGE_DIR}/files.sha256"

      - name: Upload compiled checkpoint
        if: steps.compile.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: surface-cell-p5-r2e4-github-source-linux-release
          path: artifact
          if-no-files-found: error
          retention-days: 14
          compression-level: 6

      - name: Always upload detailed workflow logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surface-cell-p5-r2e4-workflow-logs-${{ github.run_id }}
          path: /tmp/p5-r2e4-workflow-logs
          if-no-files-found: error
          retention-days: 30
