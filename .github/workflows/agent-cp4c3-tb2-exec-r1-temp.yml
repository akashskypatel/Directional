name: Agent CP4c3 TB2 Re-execution

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/cp4c3-tb2-exec-r1/run.txt

permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: agent-cp4c3-tb2-exec-r1-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate_caller:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/agent-cp4c3-tb2-exec-r1-temp.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: cp4c3-tb2-exec-r1
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  execute:
    needs: validate_caller
    if: ${{ needs.validate_caller.outputs.valid == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Initialize persistent log
        shell: bash
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/cp4c3-tb2-exec-r1.log"
          : > "$log"
          {
            echo "workflow=${GITHUB_WORKFLOW}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "event_sha=${GITHUB_SHA}"
            echo "semantic_source=005512f20ed56edc793f4d6505f3d2b4c2999c71"
            echo "package70_artifact=9744461475"
            echo "selector_count=373"
            echo "execution_mode=artifact-only-fresh-process"
            echo "repository_checkout_for_semantic_source=false"
            echo "benchmarkExecution=false"
            echo "started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } | tee -a "$log"

      - name: Checkout orchestration control only
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          token: ${{ secrets.GH_TOKEN || github.token }}

      - name: Immutable package and fixture-root preflight
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_PACKAGE70_SHA256: 4265079b78af1a95300eebdaa5f2b2643030aa1ad2f51b70f904d88b16de7fe5
          EXPECTED_SOURCE_ARCHIVE_SHA256: c7cd8b4bbba2d3b374da7c7f18e27c0e688ffe7679c261b644c6fffbf34426b1
          EXPECTED_SELECTOR373_SHA256: b47c269851fad1384b5dc9baaf674b3d4ad80ec6c2b40f7f8eda2055c6f44834
          EXPECTED_MAPPING_SHA256: f73ea05bb146a7e4a71329b5bd4344898c7fc643094be4858ea8a17ab075d740
        shell: bash
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/cp4c3-tb2-exec-r1.log"
          exec > >(tee -a "$log") 2>&1
          zip="${RUNNER_TEMP}/package70.zip"
          pkg="${RUNNER_TEMP}/package70"
          src="${RUNNER_TEMP}/package70-source"
          out="${RUNNER_TEMP}/tb2-r1-result"
          rm -rf "$pkg" "$src" "$out"
          mkdir -p "$pkg" "$src" "$out/logs"

          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/9744461475/zip" > "$zip"
          echo "${EXPECTED_PACKAGE70_SHA256}  ${zip}" | sha256sum -c -
          unzip -q "$zip" -d "$pkg"
          (cd "$pkg" && sha256sum -c SHA256SUMS)
          test "$(wc -l < "$pkg/SHA256SUMS" | tr -d ' ')" = 55
          test "$(cat "$pkg/metadata/source-commit.txt")" = 005512f20ed56edc793f4d6505f3d2b4c2999c71
          grep -Fx runtimeExecution=false "$pkg/metadata/command-boundary.txt"
          grep -Fx exactArithmeticBackend=GMP "$pkg/metadata/command-boundary.txt"
          grep -Fx semanticBinariesUnchanged=true "$pkg/metadata/command-boundary.txt"
          grep -q libgmpxx "$pkg/metadata/gmp-evidence.txt"
          grep -q libgmp "$pkg/metadata/gmp-evidence.txt"
          for status in "$pkg"/metadata/source-status-*.txt; do test ! -s "$status"; done

          archive="$(find "$pkg/source" -maxdepth 1 -type f -name 'source-*.tar.gz' -print -quit)"
          test -n "$archive"
          echo "${EXPECTED_SOURCE_ARCHIVE_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "$archive" -C "$src"
          selector="$src/.agents/Directional/Architecture_M3_CP4c3_Required_Green_Selector_373.txt"
          echo "${EXPECTED_SELECTOR373_SHA256}  ${selector}" | sha256sum -c -
          test "$(wc -l < "$selector" | tr -d ' ')" = 373
          test "$(sort -u "$selector" | wc -l | tr -d ' ')" = 373

          mapping="${GITHUB_WORKSPACE}/.agents/connector-triggers/cp4c3-tb2-exec-r1/mapping.tsv"
          echo "${EXPECTED_MAPPING_SHA256}  ${mapping}" | sha256sum -c -
          test "$(wc -l < "$mapping" | tr -d ' ')" = 373
          cut -f3- "$mapping" > "${RUNNER_TEMP}/mapping-identities.txt"
          cmp -s "$selector" "${RUNNER_TEMP}/mapping-identities.txt"

          test -f "$pkg/test-data/benchmarks/fixtures/milestone_g_manifest.json"
          test "$(stat -c %a "$pkg/bin/directional_surface_cell_producer_tests")" = 755
          test "$(stat -c %a "$pkg/bin/directional_surface_cell_authority_kernel_tests")" = 755
          test "$(stat -c %a "$pkg/bin/directional_surface_cell_completion_tests")" = 755
          test "$(stat -c %a "$pkg/bin/directional_surface_cell_validation_tests")" = 755

          sha256sum "$zip" > "$out/package70-before.sha256"
          sha256sum "$archive" > "$out/source-archive-before.sha256"
          sha256sum "$selector" > "$out/selector373-before.sha256"
          cp "$mapping" "$out/mapping.tsv"
          cp "$pkg/metadata/command-boundary.txt" "$out/command-boundary.txt"
          {
            echo preflight=PASS
            echo package70_sha256=${EXPECTED_PACKAGE70_SHA256}
            echo source_archive_sha256=${EXPECTED_SOURCE_ARCHIVE_SHA256}
            echo selector373_sha256=${EXPECTED_SELECTOR373_SHA256}
            echo mapping_sha256=${EXPECTED_MAPPING_SHA256}
            echo fixture_root=${pkg}/test-data
            echo known_fixture_exists=true
            echo package_manifest_entries=55
            echo runtimeExecution_before=false
          } | tee "$out/preflight.txt"

      - name: Execute selector 373 one identity per fresh process
        id: gate
        shell: bash
        run: |
          set -u -o pipefail
          log="${RUNNER_TEMP}/cp4c3-tb2-exec-r1.log"
          pkg="${RUNNER_TEMP}/package70"
          src="${RUNNER_TEMP}/package70-source"
          out="${RUNNER_TEMP}/tb2-r1-result"
          mapping="${GITHUB_WORKSPACE}/.agents/connector-triggers/cp4c3-tb2-exec-r1/mapping.tsv"
          result="$out/result.tsv"
          : > "$result"
          gate_exit=0
          status=GREEN
          first_red_ordinal=0
          first_red_identity=""
          first_red_selected=0
          first_red_exit=0
          while IFS=$'\t' read -r ordinal target identity; do
            test_log="$(printf '%s/logs/%03d.log' "$out" "$ordinal")"
            echo "[$ordinal/373] $identity ($target)" | tee -a "$log"
            (cd "$src" && "$pkg/bin/$target" "--gtest_filter=$identity") >"$test_log" 2>&1
            rc=$?
            selected="$(grep -c '^\[ RUN      \]' "$test_log" || true)"
            printf '%s\t%s\t%s\t%s\t%s\n' "$ordinal" "$target" "$identity" "$rc" "$selected" >> "$result"
            if [[ "$selected" != 1 ]]; then
              status=ORCHESTRATION_RED
              gate_exit=3
              first_red_ordinal="$ordinal"
              first_red_identity="$identity"
              first_red_selected="$selected"
              first_red_exit="$rc"
              break
            fi
            if [[ "$rc" != 0 ]]; then
              status=SEMANTIC_RED
              gate_exit=2
              first_red_ordinal="$ordinal"
              first_red_identity="$identity"
              first_red_selected="$selected"
              first_red_exit="$rc"
              break
            fi
          done < "$mapping"
          executed="$(wc -l < "$result" | tr -d ' ')"
          passed="$(awk -F '\t' '$4==0 && $5==1{n++} END{print n+0}' "$result")"
          {
            echo "status=$status"
            echo "gate_exit=$gate_exit"
            echo "executed=$executed"
            echo "passed=$passed"
            echo "first_red_ordinal=$first_red_ordinal"
            echo "first_red_identity=$first_red_identity"
            echo "first_red_selected=$first_red_selected"
            echo "first_red_exit=$first_red_exit"
            echo "finished_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } | tee "$out/status.txt" | tee -a "$log"
          echo "$gate_exit" > "$RUNNER_TEMP/gate-exit-code"
          exit 0

      - name: Immutable postflight
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/cp4c3-tb2-exec-r1.log"
          exec > >(tee -a "$log") 2>&1
          pkg="${RUNNER_TEMP}/package70"
          src="${RUNNER_TEMP}/package70-source"
          out="${RUNNER_TEMP}/tb2-r1-result"
          zip="${RUNNER_TEMP}/package70.zip"
          archive="$(find "$pkg/source" -maxdepth 1 -type f -name 'source-*.tar.gz' -print -quit)"
          selector="$src/.agents/Directional/Architecture_M3_CP4c3_Required_Green_Selector_373.txt"
          (cd "$pkg" && sha256sum -c SHA256SUMS)
          sha256sum "$zip" > "$out/package70-after.sha256"
          sha256sum "$archive" > "$out/source-archive-after.sha256"
          sha256sum "$selector" > "$out/selector373-after.sha256"
          diff -u "$out/package70-before.sha256" "$out/package70-after.sha256"
          diff -u "$out/source-archive-before.sha256" "$out/source-archive-after.sha256"
          diff -u "$out/selector373-before.sha256" "$out/selector373-after.sha256"
          test "$(stat -c %a "$pkg/bin/directional_surface_cell_producer_tests")" = 755
          {
            echo postflight=PASS
            echo packageMutation=false
            echo sourceMutation=false
            echo selectorMutation=false
            echo compileExecution=false
            echo relinkExecution=false
            echo repairExecution=false
            echo generatedDiscovery=false
            echo benchmarkExecution=false
          } | tee "$out/postflight.txt"

      - name: Upload TB2 re-execution result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-cp4c3-tb2-r1-result-${{ github.run_id }}
          path: ${{ runner.temp }}/tb2-r1-result
          if-no-files-found: error
          retention-days: 7

      - name: Upload persistent diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-cp4c3-tb2-r1-log-${{ github.run_id }}
          path: ${{ runner.temp }}/cp4c3-tb2-exec-r1.log
          if-no-files-found: error
          retention-days: 7

      - name: Propagate gate status
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f "$RUNNER_TEMP/gate-exit-code" || exit 4
          exit "$(cat "$RUNNER_TEMP/gate-exit-code")"
