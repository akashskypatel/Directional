name: Agent CB53 Drive Apply

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/drive-apply/cb53-20260909-1148.txt

permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

concurrency:
  group: directional-cb53-drive-apply
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/agent-cb53-drive-apply.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: cb53-drive-apply
      commit_run_file: false
      trim_stale_comments: false
    secrets: inherit

  apply:
    needs: validate
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 11X28q5wSmWn9cC2e4XrxEkKcCThS-YP9
      patch_sha256: c84b5d727d8e8cb0a31a0655fdc6d9ca20a105bbbfbdd223624d22c8fc767658
      base_sha: 2e273f5704c803291882cdf2731f63e406e1c86b
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: "test: correct independent fragment owner upper bound"
      retention_days: 14
    secrets: inherit
