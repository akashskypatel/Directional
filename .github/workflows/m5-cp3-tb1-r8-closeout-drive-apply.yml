    branches: [agent/surface_cell_quad/p5-recover-bridge-healing]
    paths: [.agents/connector-triggers/m5-cp3-tb1-r8-closeout-drive-apply.txt]

permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/m5-cp3-tb1-r8-closeout-drive-apply.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m5-cp3-tb1-r8-closeout-drive-apply
      commit_run_file: false
      trim_stale_comments: false
    secrets: inherit

  apply:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1H_jn_uc3p8w69yHuNgoxhBv8v6o1zlzB
      patch_sha256: 3fbf47ef30b950e28ca0efe584baa06efa8284160990e480b4ebc12f338d1cdb
      base_sha: da565dc038a28a1823974361d61d4ff03050ab19
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: "M5-CP3-TB1-R8-EXEC: record artifact-only runtime evidence"
    secrets: inherit
