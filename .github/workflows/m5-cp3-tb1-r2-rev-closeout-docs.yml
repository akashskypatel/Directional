name: M5 CP3 TB1 R2 Review Closeout Docs

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m5-cp3-tb1-r2-rev-closeout-docs.txt

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

concurrency:
  group: m5-cp3-tb1-r2-rev-closeout-docs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/m5-cp3-tb1-r2-rev-closeout-docs.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m5-cp3-tb1-r2-rev-closeout-docs
      commit_run_file: false
    secrets: inherit

  apply:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1F6U99M0bgGG82B2J64NOh_xPBTrhF4dl
      patch_sha256: aa54ccee4da8ce3ee8ac8a7cc4fe810ea9b6ef8998fa9987f351b2e5eecbcbfe
      base_sha: 13b8af14057f54b40e5a47f9528bf02a7f27de2f
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: M5-CP3-TB1-R2-REV independent review and CB4 freeze
    secrets: inherit
