name: Agent R-A T+B Evidence Closeout

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/ra-tb-closeout-docs-20260812-v2.txt

permissions:
  contents: write

concurrency:
  group: agent-ra-tb-closeout-docs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  closeout:
    runs-on: ubuntu-24.04
    steps:
      - name: Initialize persistent activity log
        shell: bash
        run: |
          set -euo pipefail
          : > "$RUNNER_TEMP/activity.log"
          printf '%s\n' \
            'task=R-A artifact-only T+B failed-gate durable closeout' \
            "event_sha=$GITHUB_SHA" \
            "ref=$GITHUB_REF" \
            'turn=Test+Benchmark' \
            'generatedRuntimeExecution=false' \
            'implementationMutation=false' \
            'testMutation=false' | tee -a "$RUNNER_TEMP/activity.log"

      - name: Checkout exact documentation authority
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 40
          submodules: false

      - name: Record authoritative result and next Code Build plan
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee -a "$RUNNER_TEMP/activity.log") 2>&1
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git status --porcelain=v1 | tee "$RUNNER_TEMP/source-status-before.txt"
          test ! -s "$RUNNER_TEMP/source-status-before.txt"
          python3 .agents/Directional/turn-payloads/ra-tb-closeout-docs/closeout.py

          changed="$(git status --porcelain=v1 | sed -E 's/^.. //' | sort)"
          expected="$(printf '%s\n' \
            .agents/Directional/Architecture_M1_RA_Closeout_Artifact_Only_Test_Benchmark_Report.md \
            .agents/Directional/Architecture_M1_Single_Authority_Cutover_Code_Build_Plan.md \
            .agents/Directional/CHANGELOG.md \
            .agents/Directional/Future_Chat_Session_Handoff.md \
            .agents/Directional/Regression_Root_Cause_Tracker.md \
            TODO.md | sort)"
          printf 'changed_documents=\n%s\n' "$changed" | tee "$RUNNER_TEMP/changed-status.txt"
          test "$changed" = "$expected"
          grep -q 'R-A NOT CLOSED' .agents/Directional/Architecture_M1_RA_Closeout_Artifact_Only_Test_Benchmark_Report.md
          grep -q '61 passed / 26 failed' TODO.md
          grep -q 'R-A-TB-CB-01' .agents/Directional/Architecture_M1_Single_Authority_Cutover_Code_Build_Plan.md
          grep -q 'Code + Build R-A runtime-remediation turn' .agents/Directional/Future_Chat_Session_Handoff.md
          grep -q 'No stable regression event or recurrence is assigned' .agents/Directional/Regression_Root_Cause_Tracker.md

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add TODO.md
          git add -f \
            .agents/Directional/Architecture_M1_RA_Closeout_Artifact_Only_Test_Benchmark_Report.md \
            .agents/Directional/Architecture_M1_Single_Authority_Cutover_Code_Build_Plan.md \
            .agents/Directional/CHANGELOG.md \
            .agents/Directional/Future_Chat_Session_Handoff.md \
            .agents/Directional/Regression_Root_Cause_Tracker.md
          git commit -m 'docs: record failed R-A artifact-only closeout gate'
          CLOSEOUT_SHA="$(git rev-parse HEAD)"
          printf 'closeout_sha=%s\n' "$CLOSEOUT_SHA" | tee "$RUNNER_TEMP/closeout-result.txt"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          git status --porcelain=v1 | tee "$RUNNER_TEMP/source-status-final.txt"
          test ! -s "$RUNNER_TEMP/source-status-final.txt"
          echo 'generatedRuntimeExecution=false'

      - name: Upload closeout result
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ra-tb-closeout-docs-result-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/closeout-result.txt
            ${{ runner.temp }}/changed-status.txt
            ${{ runner.temp }}/source-status-before.txt
            ${{ runner.temp }}/source-status-final.txt
          if-no-files-found: error
          retention-days: 7

      - name: Upload persistent activity log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ra-tb-closeout-docs-log-${{ github.run_id }}
          path: ${{ runner.temp }}/activity.log
          if-no-files-found: error
          retention-days: 7
