          new_note = f'''Current R-A candidate runtime note: artifact-only run/job `{RUN} / {JOB}` executed the closeout gate for `{SOURCE}` with immutable package/static preflight and postflight clean, but the candidate failed **26 of 87 unique selected contracts**. The primary production blocker maps to `RP-01`: aggregate SurfaceCells optimization requires exact typed source authority but its pipeline wiring can leave `constraints.sourceAuthority` unset when `phaseFrontProduct` is absent, producing premature `optimization / MissingSourceAuthority`. Fixture/oracle reachability and stale raw-label expectations map to `RP-02`; positive completion `IncompatibleTypedStitchAuthority` failures remain under R-A remediation and also touch `RP-05`. **No stable regression event or recurrence is assigned**: `{SOURCE}` has never been runtime accepted, and this gate does not establish loss of accepted M1l behavior. Historical totals remain 34 / 14 / 20. The existing `INCOMPLETE_TRANSACTIONAL_ROLLBACK` category is not incremented because no accepted rollback behavior was shown lost.'''
          if old_note not in text:
              raise SystemExit('tracker current-note anchor not found')
          text = text.replace(old_note, new_note, 1)
          tracker.write_text(text, encoding='utf-8')
          PY

          git status --porcelain=v1 | tee "$RUNNER_TEMP/changed-status.txt"
          changed="$(git status --porcelain=v1 | sed -E 's/^.. //' | sort)"
          expected="$(printf '%s\n' \
            .agents/Directional/Architecture_M1_RA_Closeout_Artifact_Only_Test_Benchmark_Report.md \
            .agents/Directional/Architecture_M1_Single_Authority_Cutover_Code_Build_Plan.md \
            .agents/Directional/CHANGELOG.md \
            .agents/Directional/Future_Chat_Session_Handoff.md \
            .agents/Directional/Regression_Root_Cause_Tracker.md \
            TODO.md | sort)"
          test "$changed" = "$expected"
          grep -q 'R-A NOT CLOSED' .agents/Directional/Architecture_M1_RA_Closeout_Artifact_Only_Test_Benchmark_Report.md
          grep -q '61 passed / 26 failed' TODO.md
          grep -q 'R-A-TB-CB-01' .agents/Directional/Architecture_M1_Single_Authority_Cutover_Code_Build_Plan.md
          grep -q 'Code + Build R-A runtime-remediation turn' .agents/Directional/Future_Chat_Session_Handoff.md
          grep -q 'No stable regression event or recurrence is assigned' .agents/Directional/Regression_Root_Cause_Tracker.md

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add TODO.md
          git add -f \
            .agents/Directional/Architecture_M1_RA_Closeout_Artifact_Only_Test_Benchmark_Report.md \
            .agents/Directional/Architecture_M1_Single_Authority_Cutover_Code_Build_Plan.md \
            .agents/Directional/CHANGELOG.md \
            .agents/Directional/Future_Chat_Session_Handoff.md \
            .agents/Directional/Regression_Root_Cause_Tracker.md
          git commit -m 'docs: record failed R-A artifact-only closeout gate'
          CLOSEOUT_SHA="$(git rev-parse HEAD)"
          printf 'closeout_sha=%s\n' "$CLOSEOUT_SHA" | tee "$RUNNER_TEMP/closeout-result.txt"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          git status --porcelain=v1 | tee "$RUNNER_TEMP/source-status-final.txt"
          test ! -s "$RUNNER_TEMP/source-status-final.txt"
          echo 'generatedRuntimeExecution=false'

      - name: Upload closeout result
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ra-tb-closeout-docs-result-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/closeout-result.txt
            ${{ runner.temp }}/changed-status.txt
            ${{ runner.temp }}/source-status-before.txt
            ${{ runner.temp }}/source-status-final.txt
          if-no-files-found: error
          retention-days: 7

      - name: Upload persistent activity log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ra-tb-closeout-docs-log-${{ github.run_id }}
          path: ${{ runner.temp }}/activity.log
          if-no-files-found: error
          retention-days: 7
