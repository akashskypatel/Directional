name: Agent M1 R-A Cleanup

on:
  push:
    branches: [agent/surface_cell_quad/p5-recover-bridge-healing]
    paths: [.agents/connector-triggers/m1-ra-cleanup.txt]

permissions: {contents: write}
concurrency: {group: agent-m1-ra-cleanup, cancel-in-progress: false}

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Initialize activity log
        shell: bash
        run: |
          set -euo pipefail
          LOG="$RUNNER_TEMP/activity.log"; : > "$LOG"
          { echo "task=M1 R-A repository temporary-state cleanup"; echo "sha=$GITHUB_SHA"; date -u +"utc=%Y-%m-%dT%H:%M:%SZ"; } | tee -a "$LOG"
      - name: Checkout triggering commit
        uses: actions/checkout@v4
        with: {fetch-depth: 1}
      - name: Remove retired R-A triggers and payloads
        shell: bash
        run: |
          set -euo pipefail
          LOG="$RUNNER_TEMP/activity.log"; exec > >(tee -a "$LOG") 2>&1
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git rm -f --ignore-unmatch .agents/connector-triggers/m1-ra-*.txt
          git reset HEAD -- .agents/connector-triggers/m1-ra-cleanup.txt
          git checkout -- .agents/connector-triggers/m1-ra-cleanup.txt
          git rm -f --ignore-unmatch .agents/Directional/turn-payloads/m1-ra-*
          git diff --cached --check
          echo "cleanup_files=$(git diff --cached --name-only | wc -l)"
          git diff --cached --name-status
          git config user.name directional-agent
          git config user.email directional-agent@users.noreply.github.com
          if ! git diff --cached --quiet; then
            git commit -m "chore(agent): retire M1 R-A temporary triggers and payloads"
            git push origin HEAD:agent/surface_cell_quad/p5-recover-bridge-healing
          fi
          echo "pushed_head=$(git rev-parse HEAD)"
      - name: Upload activity log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "m1-ra-cleanup-log-${{ github.run_id }}"
          path: "${{ runner.temp }}/activity.log"
          if-no-files-found: error
          retention-days: 7
