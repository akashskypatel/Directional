name: M3 CP4c0 CB-R11 Apply

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m3-cp4c0-cb-r11-apply/run.txt

permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

concurrency:
  group: m3-cp4c0-cb-r11-apply-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/agent-m3-cp4c0-cb-r11-apply.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m3-cp4c0-cb-r11-apply
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  apply:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1B5zIi7PTcLHhQyKi2Anuts2LzgK6InDZ
      patch_sha256: e537dfb994b02afdd2bc9a58d90f06b46c891aa36d32eb9996a35cfc2dfa6fc6
      base_sha: 191d960545aa62cbd34f3a327dec9da9b2bbeafc
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: 'test: fix nondegenerate exact magnitude positive control'
      retention_days: 7
    secrets: inherit
