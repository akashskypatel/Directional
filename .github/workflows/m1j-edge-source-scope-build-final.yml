name: m1j-edge-source-scope-build-final

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - '.agents/connector-triggers/m1j-edge-source-scope-build-final'

permissions:
  contents: read

concurrency:
  group: m1j-edge-source-scope-build-final
  cancel-in-progress: false

env:
  IMPLEMENTATION: d5f681173600dc32dc7617de6105d9e584e593be
  SOURCE_PARENT: 391271e253557b5c6b267befb3f2f33330c090c9
  ACCEPTED_M1I: b037157921094604f1b0c17f9c8b7076c7604b3b
  ACCEPTED_M1I_RESULT_ARTIFACT: '9072101943'
  LOG_DIR: /tmp/m1j-edge-source-scope-build-final-logs
  ACTIVITY_LOG: /tmp/m1j-edge-source-scope-build-final-logs/activity.log

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Initialize persistent activity log
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$LOG_DIR"
          printf '%s\n' \
            'turn=M1j Phase-Front Edge Source-Scope Consumer Code+Build authoritative packaging retry' \
            "run_id=$GITHUB_RUN_ID" "run_attempt=$GITHUB_RUN_ATTEMPT" \
            "event_sha=$GITHUB_SHA" "implementation=$IMPLEMENTATION" \
            "source_parent=$SOURCE_PARENT" \
            'runtimeExecution=false' 'testExecution=false' 'benchmarkExecution=false' \
            'ctestExecution=false' 'cliExecution=false' 'fuzzerExecution=false' \
            'customInputExecution=false' \
            'prohibited=generated Directional binary execution; discovery/list; tests; benchmarks; ctest; CLI/GUI/help/version; fuzzers; custom input' \
            "started_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)" | tee "$ACTIVITY_LOG"

      - name: Checkout exact implementation
        uses: actions/checkout@v4
        with:
          ref: ${{ env.IMPLEMENTATION }}
          fetch-depth: 1
          submodules: false

      - name: Verify exact source authority
        shell: bash
        run: |
          set -Eeuo pipefail
          exec > >(tee -a "$ACTIVITY_LOG") 2>&1
          trap 'rc=$?; echo "step=source-authority exit_code=$rc"; git status --short --branch || true; exit $rc' EXIT
          test "$(git rev-parse HEAD)" = "$IMPLEMENTATION"
          test -z "$(git status --porcelain=v1)"
          test "$(git rev-parse 'HEAD:include/directional/geometry/SurfaceCellTracing.h')" = '9098daea41e3ca3f75eca4a1683d5c4674c97319'
          test "$(git rev-parse 'HEAD:src/geometry/SurfaceCellTracing.cpp')" = '5d5404a98caf69abb962d477dde2f0e2b68aebf0'
          test "$(git rev-parse 'HEAD:src/pipeline/RemeshPipeline.cpp')" = '8761e60166f5c1711a4f8ee15f54c864a55497bb'
          test "$(git rev-parse 'HEAD:tests/SurfaceCellsPhase10Tests.cpp')" = '512edcb333f1f9770cc980d335cbb060a24e36dc'
          test "$(git rev-parse 'HEAD:tests/TestFixturePaths.h')" = '4a981f772ee70780d0011696010a0e1b8bef6972'
          grep -F 'relation.sourceComponent != legacy_phase_front_source_component(first) ||' src/pipeline/RemeshPipeline.cpp >/dev/null
          grep -F 'std::optional<authority::SourceComponentId> sourceComponent;' include/directional/geometry/SurfaceCellTracing.h >/dev/null
          grep -F 'std::optional<authority::IsolationSheetId> sourceSheet;' include/directional/geometry/SurfaceCellTracing.h >/dev/null

      - name: Install compile prerequisites
        shell: bash
        run: |
          set -Eeuo pipefail
          exec > >(tee -a "$ACTIVITY_LOG") 2>&1
          trap 'rc=$?; echo "step=install-prerequisites exit_code=$rc"; exit $rc' EXIT
          sudo apt-get update
          sudo apt-get install -y ninja-build libgmp-dev xz-utils time

      - name: Fetch shallow submodules
        shell: bash
        run: |
          set -Eeuo pipefail
          exec > >(tee -a "$ACTIVITY_LOG") 2>&1
          trap 'rc=$?; echo "step=submodules exit_code=$rc"; exit $rc' EXIT
          git submodule sync --recursive
          git -c protocol.version=2 submodule update --init --recursive --depth 1 --recommend-shallow
          git submodule status --recursive | tee "$LOG_DIR/submodules.txt"

      - name: Record toolchain
        shell: bash
        run: |
          set -Eeuo pipefail
          exec > >(tee -a "$ACTIVITY_LOG") 2>&1
          git --version
          cmake --version
          ninja --version
          c++ --version | head -n 1

      - name: Configure Release static compile-only build
        shell: bash
        run: |
          set -Eeuo pipefail
          exec > >(tee -a "$ACTIVITY_LOG") 2>&1
          trap 'rc=$?; echo "step=configure exit_code=$rc"; exit $rc' EXIT
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DDIRECTIONAL_ENABLE_GMP=ON \
            -DDIRECTIONAL_ENABLE_PARDISO=OFF \
            -DDIRECTIONAL_ENABLE_CUDSS=OFF \
            -DDIRECTIONAL_ENABLE_SUITESPARSE=OFF \
            -DDIRECTIONAL_BUILD_TESTS=ON \
            -DDIRECTIONAL_BUILD_BENCHMARKS=ON \
            -DDIRECTIONAL_BUILD_CLI=OFF \
            -DDIRECTIONAL_BUILD_GUI=OFF \
            -DBUILD_PYTHON=OFF \
            -DBUILD_TUTORIALS=OFF \
            -DCMAKE_GTEST_DISCOVER_TESTS_DISCOVERY_MODE=PRE_TEST \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON 2>&1 | tee "$LOG_DIR/configure.log"

      - name: Compile approved targets only
        shell: bash
        run: |
          set -Eeuo pipefail
          exec > >(tee -a "$ACTIVITY_LOG") 2>&1
          trap 'rc=$?; echo "step=compile exit_code=$rc"; exit $rc' EXIT
          /usr/bin/time -v -o "$LOG_DIR/build-resources.txt" \
            cmake --build build --parallel 2 --target \
              directional_core directional_pipeline directional_compiled_api_tests \
              directional_surface_cell_producer_tests directional_surface_cell_oracle_tests \
              directional_surface_cell_authority_kernel_tests directional_surface_cell_completion_tests \
              directional_surface_cell_validation_tests directional_benchmarks 2>&1 | tee "$LOG_DIR/build.log"

      - name: Assemble immutable compile package
        id: package
        shell: bash
        run: |
          set -Eeuo pipefail
          exec > >(tee -a "$ACTIVITY_LOG") 2>&1
          trap 'rc=$?; echo "step=package-assembly exit_code=$rc"; exit $rc' EXIT
          test "$(git rev-parse HEAD)" = "$IMPLEMENTATION"
          test -z "$(git status --porcelain=v1)"
          pkg="$RUNNER_TEMP/m1j-edge-source-scope-code-build-result"
          mkdir -p "$pkg/bin" "$pkg/lib" "$pkg/logs" "$pkg/metadata" "$pkg/source" "$pkg/test-data/benchmarks"
          for exe in directional_compiled_api_tests directional_surface_cell_producer_tests directional_surface_cell_oracle_tests directional_surface_cell_authority_kernel_tests directional_surface_cell_completion_tests directional_surface_cell_validation_tests directional_benchmarks; do
            test -x "build/$exe"
            cp "build/$exe" "$pkg/bin/$exe"
          done
          cp build/libdirectional_core.a build/libdirectional_pipeline.a "$pkg/lib/"
          cp -a benchmarks/fixtures "$pkg/test-data/benchmarks/fixtures"
          cp "$LOG_DIR"/* "$pkg/logs/"
          cp build/compile_commands.json "$pkg/source/compile_commands.json"
          git archive --format=tar "$IMPLEMENTATION" | xz -T0 -6 > "$pkg/source/directional-m1j-edge-source-scope-source-no-deps.tar.xz"
          python3 - <<'PY' > "$pkg/metadata/focused-test-counts.txt"
          from pathlib import Path
          import re
          p10 = Path('tests/SurfaceCellsPhase10Tests.cpp').read_text()
          quotient = Path('tests/SurfaceCellTransitionQuotientTests.cpp').read_text()
          optimizer = Path('tests/SurfaceMeshOptimizerPhase22Tests.cpp').read_text()
          authority = Path('tests/SurfaceCellAuthorityKernelTests.cpp').read_text()
          oracle = Path('tests/SurfaceCellProductOracleTests.cpp').read_text()
          suites = {
              'M1j': (p10, 'SurfaceCellPhaseFrontEdgeSourceScopeAuthorityMigration', 6),
              'M1i': (p10, 'SurfaceCellPhaseFrontCellSourceScopeAuthorityMigration', 6),
              'M1h': (p10, 'SurfaceCellPhaseFrontFieldChartAuthorityMigration', 6),
              'M1g': (p10, 'SurfaceCellPeriodicHolonomyRouteTransportAuthorityMigration', 6),
              'M1f': (p10, 'SurfaceCellVertexContinuationRouteTransportAuthorityMigration', 6),
              'M1e': (p10, 'SurfaceCellSegmentRouteTransportAuthorityMigration', 6),
              'M1c': (p10, 'SurfaceCellFieldTransitionAuthorityMigration', 6),
              'M1d': (quotient, 'SurfaceCellPhaseFrontRouteAuthorityMigration', 6),
              'M1b': (optimizer, 'SurfaceOptimizationRailAuthorityMigration', 6),
          }
          for label, (text, suite, expected) in suites.items():
              names = [n.strip() for n in re.findall(r'TEST\(\s*' + re.escape(suite) + r'\s*,\s*([^)]+)\)', text)]
              assert len(names) == expected and len(set(names)) == expected, (label, names)
              print(f'{label}={len(names)}')
              Path(f'/tmp/{label}-tests.txt').write_text('\n'.join(f'{suite}.{name}' for name in names) + '\n')
          all_authority = re.findall(r'TEST\(\s*([^,]+),\s*([^)]+)\)', authority)
          all_oracle = re.findall(r'TEST\(\s*([^,]+),\s*([^)]+)\)', oracle)
          assert len(all_authority) == 14 and len(set(all_authority)) == 14
          assert len(all_oracle) == 29 and len(set(all_oracle)) == 29
          print('M1a=14')
          print('T1=29')
          Path('/tmp/M1a-tests.txt').write_text('\n'.join(f'{a.strip()}.{b.strip()}' for a, b in all_authority) + '\n')
          Path('/tmp/T1-tests.txt').write_text('\n'.join(f'{a.strip()}.{b.strip()}' for a, b in all_oracle) + '\n')
          PY
          for label in M1j M1i M1h M1g M1f M1e M1d M1c M1b; do cp "/tmp/$label-tests.txt" "$pkg/metadata/${label,,}-focused-test-names.txt"; done
          cp /tmp/M1a-tests.txt "$pkg/metadata/m1a-test-names.txt"
          cp /tmp/T1-tests.txt "$pkg/metadata/t1-oracle-test-names.txt"
          printf '%s\n' \
            'UniformPhaseFront/SurfaceCellDesignAcceptance.ProducesDirectSourceAuthoritativePureQuadOutput/Plane' \
            'UniformPhaseFront/SurfaceCellDesignAcceptance.ProducesDirectSourceAuthoritativePureQuadOutput/MultiFaceSeam' \
            'UniformPhaseFront/SurfaceCellDesignAcceptance.ProducesDirectSourceAuthoritativePureQuadOutput/CloseSheets' \
            'UniformPhaseFront/SurfaceCellDesignAcceptance.ProducesDirectSourceAuthoritativePureQuadOutput/Cylinder' \
            > "$pkg/metadata/direct-product-test-names.txt"
          printf '%s\n' 'runtimeExecution=false' 'testExecution=false' 'benchmarkExecution=false' 'ctestExecution=false' 'cliExecution=false' 'fuzzerExecution=false' 'customInputExecution=false' > "$pkg/metadata/command-boundary.txt"
          cat > "$pkg/metadata/build-authority.json" <<EOF
          {
            "turn": "M1j Phase-Front Edge Source-Scope Consumer Code+Build",
            "implementationCommit": "$IMPLEMENTATION",
            "sourceParent": "$SOURCE_PARENT",
            "initialCompileAttemptImplementation": "274b7ab88b581aa63e2e99c3abca2bc89eb742e2",
            "acceptedM1iImplementation": "$ACCEPTED_M1I",
            "acceptedM1iResultArtifact": "$ACCEPTED_M1I_RESULT_ARTIFACT",
            "eventCommit": "$GITHUB_SHA",
            "runId": "$GITHUB_RUN_ID",
            "runAttempt": "$GITHUB_RUN_ATTEMPT",
            "configuration": "Release",
            "generator": "Ninja",
            "sharedLibraries": false,
            "gtestDiscoveryMode": "PRE_TEST",
            "runtimeExecution": false,
            "testExecution": false,
            "benchmarkExecution": false,
            "ctestExecution": false,
            "cliExecution": false,
            "fuzzerExecution": false,
            "customInputExecution": false
          }
          EOF
          git rev-parse "HEAD:include/directional/geometry/SurfaceCellTracing.h" > "$pkg/metadata/tracing-header-blob.txt"
          git rev-parse "HEAD:src/geometry/SurfaceCellTracing.cpp" > "$pkg/metadata/tracing-blob.txt"
          git rev-parse "HEAD:src/pipeline/RemeshPipeline.cpp" > "$pkg/metadata/pipeline-blob.txt"
          git rev-parse "HEAD:tests/SurfaceCellsPhase10Tests.cpp" > "$pkg/metadata/phase10-test-blob.txt"
          git rev-parse "HEAD:tests/TestFixturePaths.h" > "$pkg/metadata/fixture-paths-blob.txt"
          find "$pkg/test-data/benchmarks/fixtures" -type f -printf '%P\n' | LC_ALL=C sort > "$pkg/metadata/fixture-files.txt"
          test "$(wc -l < "$pkg/metadata/fixture-files.txt")" -eq 27
          (cd "$pkg" && sha256sum bin/* | LC_ALL=C sort) > "$pkg/metadata/executable-sha256.txt"
          (cd "$pkg" && sha256sum lib/* | LC_ALL=C sort) > "$pkg/metadata/library-sha256.txt"
          echo "pkg=$pkg" >> "$GITHUB_OUTPUT"

      - name: Finalize package manifest after all package writes
        shell: bash
        run: |
          set -Eeuo pipefail
          exec > >(tee -a "$ACTIVITY_LOG") 2>&1
          trap 'rc=$?; echo "step=finalize-package exit_code=$rc"; exit $rc' EXIT
          pkg='${{ steps.package.outputs.pkg }}'
          test "$(git rev-parse HEAD)" = "$IMPLEMENTATION"
          test -z "$(git status --porcelain=v1)"
          grep -Fx 'runtimeExecution=false' "$pkg/metadata/command-boundary.txt"
          grep -Fx 'testExecution=false' "$pkg/metadata/command-boundary.txt"
          grep -Fx 'benchmarkExecution=false' "$pkg/metadata/command-boundary.txt"
          printf '%s\n' "finished_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)" | tee -a "$ACTIVITY_LOG"
          cp "$ACTIVITY_LOG" "$pkg/logs/activity-final.log"
          find "$pkg" -type f ! -name SHA256SUMS -printf '%P\0' | LC_ALL=C sort -z | while IFS= read -r -d '' path; do
            (cd "$pkg" && sha256sum "$path")
          done > "$pkg/SHA256SUMS"
          (cd "$pkg" && sha256sum -c SHA256SUMS | tee "$LOG_DIR/package-manifest-check.txt")
          manifest_entries=$(wc -l < "$pkg/SHA256SUMS")
          manifest_ok=$(grep -c ': OK$' "$LOG_DIR/package-manifest-check.txt")
          regular_files=$(find "$pkg" -type f | wc -l)
          test "$manifest_entries" -eq "$manifest_ok"
          test "$regular_files" -eq $((manifest_entries + 1))
          sha256sum "$pkg/SHA256SUMS" | tee "$LOG_DIR/package-manifest-sha256.txt"
          printf '%s\n' \
            "regular_files=$regular_files" "manifest_entries=$manifest_entries" \
            "executables=$(find "$pkg/bin" -maxdepth 1 -type f | wc -l)" \
            "libraries=$(find "$pkg/lib" -maxdepth 1 -type f | wc -l)" \
            "fixtures=$(find "$pkg/test-data/benchmarks/fixtures" -type f | wc -l)" | tee "$LOG_DIR/package-cardinality.txt"

      - name: Upload authoritative immutable Code + Build result
        uses: actions/upload-artifact@v4
        with:
          name: m1j-edge-source-scope-code-build-result-final
          path: ${{ steps.package.outputs.pkg }}
          if-no-files-found: error
          retention-days: 14

      - name: Upload dedicated diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m1j-edge-source-scope-code-build-logs-authoritative
          path: ${{ env.LOG_DIR }}
          if-no-files-found: error
          retention-days: 14
