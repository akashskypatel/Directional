name: Agent CB42 Review Authentic History
on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/cb42-review-authentic-history.txt
permissions:
  actions: read
  contents: write
concurrency:
  group: cb42-review-authentic-history
  cancel-in-progress: false
jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/agent-cb42-review-authentic-history.yml
      source_ref: ${{ github.sha }}
  audit:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Initialize audit log
        shell: bash
        run: |
          : > "${RUNNER_TEMP}/cb42-review-authentic-history.log"
          echo "event_sha=${GITHUB_SHA}" | tee -a "${RUNNER_TEMP}/cb42-review-authentic-history.log"
      - name: Checkout original Git history
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Run read-only authority boundary and ledger gates
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee -a "${RUNNER_TEMP}/cb42-review-authentic-history.log") 2>&1
          echo "checkout_sha=$(git rev-parse HEAD)"
          python3 .agents/Directional/tools/review_check.py authority 8dc8cdeae6f6ac05c28aaa4504ca2c42c3177ded
          python3 .agents/Directional/tools/review_check.py boundary
          python3 .agents/Directional/tools/review_check.py ledgers --base 8b7299b43
          remote_sha="$(git ls-remote origin refs/heads/agent/surface_cell_quad/p5-recover-bridge-healing | cut -f1)"
          echo "remote_sha=${remote_sha}"
          echo "checked_sha=$(git rev-parse HEAD)"
          git status -sb
          test "$(git rev-parse HEAD)" = "${remote_sha}"
          test -z "$(git status --porcelain)"
          echo "all_gates_pass=true"
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cb42-review-authentic-history-${{ github.run_id }}
          path: ${{ runner.temp }}/cb42-review-authentic-history.log
          if-no-files-found: error
          retention-days: 14
  mailbox:
    if: ${{ always() }}
    needs: [audit]
    permissions:
      actions: read
      contents: write
    uses: ./.github/workflows/workflow-mailbox-publisher.yml
    with:
      mailbox_branch: workflow-mailbox
      workflow_key: cb42-review-authentic-history
      source_sha: ${{ github.sha }}
      source_ref: ${{ github.ref }}
      result: ${{ needs.audit.result }}
      summary: CB42 read-only full history authority and boundary check.
