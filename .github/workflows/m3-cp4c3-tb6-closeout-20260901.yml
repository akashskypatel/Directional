name: M3 CP4c3 TB6 Closeout Patch Apply

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m3-cp4c3-tb6-closeout-20260901.txt

permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

concurrency:
  group: m3-cp4c3-tb6-closeout-patch-apply
  cancel-in-progress: false

jobs:
  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m3-cp4c3-tb6-closeout
      commit_run_file: false
    secrets: inherit

  validate-caller:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/m3-cp4c3-tb6-closeout-20260901.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  apply-closeout:
    needs: validate-caller
    if: ${{ needs.validate-caller.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1NDvgCfWYCKsskJSFoKu-6MqsULWEsPF-
      patch_sha256: 'c946b2b5832fd538b39427e86560dc7ed6a983889528027eb0a0ff256b0504b2'
      base_sha: 32527741f6a14afa88994d501a920f8be5013cbc
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: 'docs: close out M3-CP4c-3-TB6'
      retention_days: 14
    secrets: inherit
