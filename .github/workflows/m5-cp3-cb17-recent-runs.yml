name: M5 CP3 CB17 Recent Runs Recovery

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m5-cp3-cb17-recent-runs.txt

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: write

jobs:
  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m5-cp3-cb17-recent-runs
      commit_run_file: false
    secrets: inherit

  collect:
    uses: ./.github/workflows/agent-recent-workflow-runs-reusable.yml
    with:
      per_page: 30
      max_pages: 1
      branch: agent/surface_cell_quad/p5-recover-bridge-healing
      event: push
      retention_days: 7
    secrets: inherit
