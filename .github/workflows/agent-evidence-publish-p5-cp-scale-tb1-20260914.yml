name: Agent Evidence Publish CP-SCALE-TB1 20260914

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/evidence-publish/p5-cp-scale-tb1-20260914.txt

permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

concurrency:
  group: agent-evidence-publish-cp-scale-tb1-20260914
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/agent-evidence-publish-p5-cp-scale-tb1-20260914.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: evidence-publish-cp-scale-tb1-20260914
      commit_run_file: false
      trim_stale_comments: false
    secrets: inherit

  publish:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Initialize publication log
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/evidence-publication.log"
          : > "$log"
          printf '%s\n' \
            "workflow=$GITHUB_WORKFLOW" \
            "run_id=$GITHUB_RUN_ID" \
            "event_sha=$GITHUB_SHA" \
            "source_evidence_sha256=712bf4983695a58d1d0859e041895209c9935eb7e8f4bdc2835c01737173e3da" \
            "source_drive_file_id=1Sjrw23e5LK0SiGXTdsXMY4B_9sMJ2UQU" \
            'runtimeExecution=false' | tee -a "$log"

      - name: Authenticate to Google Drive
        id: auth
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ secrets.GOOGLE_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GOOGLE_PROVIDER }}
          service_account: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/drive.readonly
          create_credentials_file: false

      - name: Download and verify exact evidence archive
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          FILE_ID: 1Sjrw23e5LK0SiGXTdsXMY4B_9sMJ2UQU
          EXPECTED_SHA256: 712bf4983695a58d1d0859e041895209c9935eb7e8f4bdc2835c01737173e3da
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/evidence-publication.log"
          exec > >(tee -a "$log") 2>&1
          archive="$RUNNER_TEMP/Directional__M4-CP-SCALE-TB1-EXEC__evidence.zip"
          curl --fail-with-body --silent --show-error --location --max-time 120 \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            "https://www.googleapis.com/drive/v3/files/${FILE_ID}?alt=media&supportsAllDrives=true" \
            -o "$archive"
          actual="$(sha256sum "$archive" | awk '{print $1}')"
          test "$actual" = "$EXPECTED_SHA256"
          result="$RUNNER_TEMP/result"
          mkdir -p "$result"
          cp "$archive" "$result/"
          unzip -q "$archive" -d "$result/extracted"
          (cd "$result/extracted/evidence" && sha256sum -c SHA256SUMS)
          printf '%s\n' \
            "source_evidence_sha256=$actual" \
            "source_drive_file_id=$FILE_ID" \
            'internal_manifest_verified=true' \
            'runtimeExecution=false' > "$result/publication.env"
          echo "source_evidence_sha256=$actual"
          echo 'internal_manifest_verified=true'
          echo 'runtimeExecution=false'

      - name: Upload immutable TB1 evidence result
        uses: actions/upload-artifact@v4
        with:
          name: m4-cp-scale-tb1-exec-result-${{ github.run_id }}
          path: ${{ runner.temp }}/result
          if-no-files-found: error
          retention-days: 14

      - name: Upload publication log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m4-cp-scale-tb1-exec-log-${{ github.run_id }}
          path: ${{ runner.temp }}/evidence-publication.log
          if-no-files-found: error
          retention-days: 14
