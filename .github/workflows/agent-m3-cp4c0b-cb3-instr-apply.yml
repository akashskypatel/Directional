name: Agent M3 CP4c0b CB3 Instrumentation Apply

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m3-cp4c0b-cb3-instr-apply/run.txt

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

concurrency:
  group: agent-m3-cp4c0b-cb3-instr-apply-${{ github.ref }}
  cancel-in-progress: false

jobs:
  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m3-cp4c0b-cb3-instr-apply
      commit_run_file: false
    secrets: inherit

  apply:
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1uNp6dJ0AfjRLAlwnLlGOfLg82LX3tFko
      patch_sha256: 5350cfeaeaaf5e4a6a7f26a6d7c3745867347c23116a2ef594e9fdc26f07f5e5
      base_sha: 7fa64825cbf61c3e787075e9e5f5a44c96787426
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: "test(M3-CP4c-0b): add T5 non-gating observability"
      retention_days: 7
    secrets: inherit
