name: M6 DEFN R5 Drive Patch Apply

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m6-defn-r5-drive-apply/**

permissions:
  actions: read
  contents: write
  id-token: write

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/agent-m6-defn-r5-drive-apply.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  apply:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1yM7W6oWmvXsVrlSw-5IpC_psFxSYylj1
      patch_sha256: 53937c775ce273e60d1cbc4eecacbf0508c4d7e04bbf0dafeb9c84fc329b8903
      base_sha: 612d914d37112cbbc32b974ec30e922805c47062
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: "docs: complete M6-DEFN-R5"
    secrets: inherit

  mailbox:
    if: ${{ always() }}
    needs: [apply]
    permissions:
      actions: read
      contents: write
    uses: ./.github/workflows/workflow-mailbox-publisher.yml
    with:
      workflow_key: m6-defn-r5-drive-apply
      source_sha: ${{ github.sha }}
      source_ref: ${{ github.ref }}
      result: ${{ needs.apply.result }}
      summary: M6-DEFN-R5 documentation patch application.
