name: M6 CP1 CB5 Docs Apply

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m6-cp1-cb5-docs-apply.txt

permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

concurrency:
  group: m6-cp1-cb5-docs-apply
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/m6-cp1-cb5-docs-apply.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m6-cp1-cb5-docs-apply
      commit_run_file: false
    secrets: inherit

  apply:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1Q9Hp1xEoldIGpX_QBQTtLvhyKvKGNNlG
      patch_sha256: d044e769eb7cd048e1254c42dd8f01a44421d28c8b5eb41aed514be6a41cda93
      base_sha: 28275f1004caf9659e2bf17be1bb8d6a0c3e6460
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: "docs(agent): close M6-CP1-CB5"
    secrets: inherit
