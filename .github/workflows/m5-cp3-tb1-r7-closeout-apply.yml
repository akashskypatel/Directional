name: M5 CP3 TB1 R7 Closeout Patch Apply

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m5-cp3-tb1-r7-closeout-apply.txt

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

concurrency:
  group: m5-cp3-tb1-r7-closeout-apply-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/m5-cp3-tb1-r7-closeout-apply.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m5-cp3-tb1-r7-closeout-apply
      commit_run_file: false
    secrets: inherit

  apply:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 10Xp6b-QhWV1E7ucII1Wmrx450RyS4Zbr
      patch_sha256: bc1ba5da632a7b08f670aad51b9b2f08fb2aea74e6a0ec2e172388ab2428fd5d
      base_sha: f7aae58d69e1c3da3af437314f068486d254cf41
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: M5-CP3-TB1-R7 durable closeout
    secrets: inherit
