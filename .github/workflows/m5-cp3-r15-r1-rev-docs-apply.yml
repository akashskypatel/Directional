name: M5 CP3 R15 R1 Review Docs Apply

on:
  push:
    branches: [agent/surface_cell_quad/p5-recover-bridge-healing]
    paths: [.agents/connector-triggers/m5-cp3-r15-r1-rev-docs-apply.txt]

permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

concurrency:
  group: m5-cp3-r15-r1-rev-docs-apply-${{ github.ref }}
  cancel-in-progress: false

jobs:
  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m5-cp3-r15-r1-rev-docs-apply
      commit_run_file: false
      trim_stale_comments: false
    secrets: inherit

  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/m5-cp3-r15-r1-rev-docs-apply.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  apply:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1ikmFj6wJAhMSRVfT25Dt1XdLSFEgXXky
      patch_sha256: e5737c1c945f7ff6532b327a870e5498d43f3244dd7a728cd394eb6ae025696a
      base_sha: 5c745f486d32434986b70440d538d3f5125616e8
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: "M5-CP3-TB1-R15-R1-REV: adjudicate storage-canonical test authority"
    secrets: inherit
