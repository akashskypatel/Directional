name: M6 CP1 TB6 A6 Artifact Only Executor

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m6-cp1-tb6-a6-exec-20260928.txt

permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: m6-cp1-tb6-a6-exec
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/m6-cp1-tb6-a6-executor.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m6-cp1-tb6-a6-exec
      commit_run_file: false
      trim_stale_comments: false
    secrets: inherit

  runtime:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    runs-on: ubuntu-24.04
    env:
      TURN_ID: M6-CP1-TB6-A6-EXEC
      GH_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
      HARNESS_PATH: .agents/Directional/turn-payloads/m6_cp1_tb6_a6_artifact_only_harness.sh
      EXPECTED_HARNESS_SHA256: be46ef1448e4210f0339478ebe8b06cbcb620ab03d892b0e3d414cf6b54656db
    steps:
      - name: Initialize diagnostic log
        shell: bash
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/M6-CP1-TB6-A6-EXEC-workflow.log"
          : > "$log"
          {
            echo "workflow=${GITHUB_WORKFLOW}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "event=${GITHUB_EVENT_NAME}"
            echo "event_sha=${GITHUB_SHA}"
            echo "repository=${GITHUB_REPOSITORY}"
            echo "started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } | tee -a "$log"

      - name: Checkout exact orchestration authority
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          submodules: false
          lfs: false
          token: ${{ secrets.GH_TOKEN || github.token }}

      - name: Verify frozen harness
        shell: bash
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/M6-CP1-TB6-A6-EXEC-workflow.log"
          exec > >(tee -a "$log") 2>&1
          test -f "$HARNESS_PATH"
          actual="$(sha256sum "$HARNESS_PATH" | awk '{print $1}')"
          echo "harness_sha256=${actual}"
          test "$actual" = "$EXPECTED_HARNESS_SHA256"
          bash -n "$HARNESS_PATH"

      - name: Execute immutable artifact-only gate
        id: execute
        shell: bash
        run: |
          set +e
          log="${RUNNER_TEMP}/M6-CP1-TB6-A6-EXEC-workflow.log"
          bash "$HARNESS_PATH" --execute
          status=$?
          echo "harness_exit=${status}" | tee -a "$log"
          echo "status=${status}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload TB6-A6 result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m6-cp1-tb6-a6-result-${{ github.run_id }}
          path: ${{ runner.temp }}/M6-CP1-TB6-A6-EXEC-result
          if-no-files-found: error
          retention-days: 14

      - name: Record final workflow status
        if: always()
        shell: bash
        run: |
          set +e
          log="${RUNNER_TEMP}/M6-CP1-TB6-A6-EXEC-workflow.log"
          {
            echo "harness_exit=${{ steps.execute.outputs.status }}"
            echo "final_sha=$(git rev-parse HEAD 2>/dev/null || echo unavailable)"
            git status --short 2>&1 || true
            echo "finished_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } | tee -a "$log"

      - name: Upload TB6-A6 diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m6-cp1-tb6-a6-log-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/M6-CP1-TB6-A6-EXEC-workflow.log
            ${{ runner.temp }}/M6-CP1-TB6-A6-EXEC.log
          if-no-files-found: error
          retention-days: 14

      - name: Fail on orchestration failure
        if: always() && steps.execute.outputs.status != '0'
        shell: bash
        run: |
          echo "artifact-only harness failed with exit=${{ steps.execute.outputs.status }}" >&2
          exit 1
