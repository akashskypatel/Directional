name: M3 CP4c2 R4 EXEC Schema Validate

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m3-cp4c2-r4-exec-schema-validate/run.txt

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: m3-cp4c2-r4-exec-schema-validate
  cancel-in-progress: false

jobs:
  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m3-cp4c2-r4-exec-schema-validate
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .agents/Directional/turn-payloads/m3-cp4c2-tb-x2-r4-exec-caller.yml
      source_ref: ${{ github.sha }}
    secrets: inherit
