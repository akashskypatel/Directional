name: M6 CP1 TB12 Close R1 Artifact-Only Execute

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m6-cp1-tb12-close-r1-exec.txt

permissions:
  actions: read
  contents: write

concurrency:
  group: m6-cp1-tb12-close-r1-exec-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/m6-cp1-tb12-close-r1-exec.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  runtime:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    runs-on: ubuntu-24.04
    env:
      TURN_ID: M6-CP1-TB12-CLOSE-R1-EXEC
      CANDIDATE_ARTIFACT_ID: "11330703256"
      EXPECTED_OUTER_SHA256: "0c50b034e80595514f4891d964360151339a31fe5d870aa83eade85587721524"
      EXPECTED_SOURCE_SHA: "3f40f04a0e9d382b2ec82cf37a03c18ad405eb05"
      EXPECTED_MANIFEST_SHA256: "cb17574a31fe6afcbf56325022f452fd649fad4b58d0996727cada9fe92b199b"
      EXPECTED_SOURCE_ARCHIVE_SHA256: "80d5a02e2394f00051e6c537715df9efbe8d0aaf8acc69bb68ca11bb8026deca"
      FOCUSED_SHA256: "1e815443a03c7ef4a1b095e6ea973efa9c74bb0eae4e2f872510c97d057ea1d6"
      FOCUSED28_SHA256: "9154a986ce005c53f99faad3551989b05516abe9e4fd02dce585a645d70a011d"
      SELECTOR_SHA256: "d4a0d1b731cfd99e832f3c983e5741ab18cb27a314f380184c5ff84bd88d6414"
      ROUTING_SHA256: "9c88a5ed3de0419c313aa0a36c0e2cf63e7edcdc17c06d9b74311f371c6c5707"
    steps:
      - name: Initialize diagnostic log
        shell: bash
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/m6-cp1-tb12-close-r1-exec.log"
          : > "$log"
          printf '%s\n'             "workflow=$GITHUB_WORKFLOW"             "run_id=$GITHUB_RUN_ID"             "event=$GITHUB_EVENT_NAME"             "event_sha=$GITHUB_SHA"             "ref=$GITHUB_REF"             "repository=$GITHUB_REPOSITORY"             "candidate_artifact_id=$CANDIDATE_ARTIFACT_ID"             "expected_source_sha=$EXPECTED_SOURCE_SHA"             "runtimeExecution=artifact-only"             "started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" | tee -a "$log"

      - name: Checkout exact control source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Execute immutable artifact-only gate
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          LOG="${RUNNER_TEMP}/m6-cp1-tb12-close-r1-exec.log"
          exec > >(tee -a "$LOG") 2>&1

          ROOT="${RUNNER_TEMP}/m6-cp1-tb12-close-r1"
          ZIP="$ROOT/candidate.zip"
          PKG="$ROOT/package"
          SRC="$ROOT/source"
          EXEC="$ROOT/execution-view"
          OUT="${RUNNER_TEMP}/M6-CP1-TB12-CLOSE-R1-EXEC-result"
          rm -rf "$ROOT" "$OUT"
          mkdir -p "$PKG" "$SRC" "$EXEC/bin" "$EXEC/test-data" "$OUT/raw/focused" "$OUT/raw/selector"

          census() {
            local root="$1" out="$2"
            (
              cd "$root"
              printf '.\tdirectory\t%s\t%s\t-\n' "$(stat -c %a .)" "$(stat -c %s .)"
              find . -mindepth 1 -print0 | LC_ALL=C sort -z | while IFS= read -r -d '' p; do
                rel="${p#./}"
                if [[ -L "$p" ]]; then
                  printf '%s\tsymlink\t%s\t%s\t%s\n' "$rel" "$(stat -c %a "$p")" "$(stat -c %s "$p")" "$(readlink "$p")"
                elif [[ -d "$p" ]]; then
                  printf '%s\tdirectory\t%s\t%s\t-\n' "$rel" "$(stat -c %a "$p")" "$(stat -c %s "$p")"
                elif [[ -f "$p" ]]; then
                  printf '%s\tfile\t%s\t%s\t%s\n' "$rel" "$(stat -c %a "$p")" "$(stat -c %s "$p")" "$(sha256sum "$p" | awk '{print $1}')"
                fi
              done
            ) > "$out"
          }

          curl --fail-with-body --silent --show-error --location             -H "Authorization: Bearer $GH_TOKEN"             -H "Accept: application/vnd.github+json"             "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$CANDIDATE_ARTIFACT_ID/zip"             -o "$ZIP"
          actual_outer="$(sha256sum "$ZIP" | awk '{print $1}')"
          test "$actual_outer" = "$EXPECTED_OUTER_SHA256"
          printf '%s\n'             "artifact_id=$CANDIDATE_ARTIFACT_ID"             "provider_digest=sha256:$EXPECTED_OUTER_SHA256"             "downloaded_zip_sha256=$actual_outer" > "$OUT/candidate-artifact-authority.txt"

          unzip -q "$ZIP" -d "$PKG"
          test "$(sha256sum "$PKG/SHA256SUMS" | awk '{print $1}')" = "$EXPECTED_MANIFEST_SHA256"
          (cd "$PKG" && sha256sum -c SHA256SUMS) | tee "$OUT/candidate-manifest-check.txt"
          test "$(grep -c ': OK$' "$OUT/candidate-manifest-check.txt")" -eq 28
          test "$(cat "$PKG/metadata/source-commit.txt")" = "$EXPECTED_SOURCE_SHA"
          src_archive="$PKG/source/source-$EXPECTED_SOURCE_SHA.tar.gz"
          test "$(sha256sum "$src_archive" | awk '{print $1}')" = "$EXPECTED_SOURCE_ARCHIVE_SHA256"
          for f in "$PKG"/metadata/source-status-*.txt; do test ! -s "$f"; done
          grep -q '^runtimeExecution=false$' "$PKG/metadata/command-boundary.txt"
          grep -q '^exactArithmeticBackend=GMP$' "$PKG/metadata/command-boundary.txt"
          grep -qi gmpxx "$PKG/metadata/gmp-evidence.txt"
          grep -qi 'libgmp\.so' "$PKG/metadata/gmp-evidence.txt"
          census "$PKG" "$OUT/package-census-before.tsv"

          tar -xzf "$src_archive" -C "$SRC"
          focused="$SRC/.agents/Directional/Architecture_M6_CP1_Required_Green_Focused_30.txt"
          focused28="$SRC/.agents/Directional/Architecture_M6_CP1_Required_Green_Focused_28.txt"
          selector="$SRC/.agents/Directional/Architecture_M5_CP4_CB2_Required_Green_Selector_449.txt"
          routing="$SRC/.agents/Directional/Architecture_M5_CP4_CB2_Selector_449_Static_Routing_Receipt.tsv"
          test "$(sha256sum "$focused" | awk '{print $1}')" = "$FOCUSED_SHA256"
          test "$(sha256sum "$focused28" | awk '{print $1}')" = "$FOCUSED28_SHA256"
          test "$(sha256sum "$selector" | awk '{print $1}')" = "$SELECTOR_SHA256"
          test "$(sha256sum "$routing" | awk '{print $1}')" = "$ROUTING_SHA256"
          test "$(wc -l < "$focused" | tr -d ' ')" = 30
          test "$(wc -l < "$focused28" | tr -d ' ')" = 28
          test "$(wc -l < "$selector" | tr -d ' ')" = 449
          cmp -s "$focused28" <(head -n 28 "$focused")
          printf '%s\n'             "focused30_rows=30"             "focused30_sha256=$FOCUSED_SHA256"             "focused28_prefix=true"             "focused28_sha256=$FOCUSED28_SHA256"             "selector449_rows=449"             "selector449_sha256=$SELECTOR_SHA256"             "routing449_sha256=$ROUTING_SHA256" > "$OUT/gate-authority.txt"

          cp -a "$PKG/bin/." "$EXEC/bin/"
          cp -a "$SRC/benchmarks" "$EXEC/test-data/benchmarks"
          for owner in directional_surface_cell_authority_kernel_tests directional_surface_cell_producer_tests directional_surface_cell_completion_tests directional_surface_cell_validation_tests; do
            test -x "$EXEC/bin/$owner"
          done
          {
            echo -e 'binary\tsha256\tmode\tsize'
            for owner in directional_surface_cell_authority_kernel_tests directional_surface_cell_producer_tests directional_surface_cell_completion_tests directional_surface_cell_validation_tests; do
              p="$EXEC/bin/$owner"
              printf '%s\t%s\t%s\t%s\n' "$owner" "$(sha256sum "$p" | awk '{print $1}')" "$(stat -c %a "$p")" "$(stat -c %s "$p")"
            done
          } > "$OUT/owner-executables.tsv"
          census "$EXEC" "$OUT/execution-view-before.tsv"

          printf 'ordinal\tidentity\tbinary\texit\tselected\tskipped\tpassed\tresult\traw_sha256\n' > "$OUT/focused-ledger.tsv"
          printf 'ordinal\tidentity\tbinary\texit\tselected\tskipped\tpassed\tresult\traw_sha256\n' > "$OUT/selector-ledger.tsv"
          printf 'phase\tordinal\tidentity\tbinary\texit\traw_sha256\n' > "$OUT/red-ledger.tsv"
          orchestration_failure=false
          focused_pass=0
          focused_red=0
          selector_pass=0
          selector_red=0
          focused_executed=0
          selector_executed=0
          runtime_started=true

          run_one() {
            local phase="$1" ordinal="$2" identity="$3" owner="$4" ledger="$5" raw="$6"
            echo "$TURN_ID phase=$phase ordinal=$ordinal identity=$identity owner=$owner"
            set +e
            (
              cd "$EXEC"
              "./bin/$owner" --gtest_filter="$identity" --gtest_color=no
            ) > >(tee "$raw") 2>&1
            rc=$?
            set -e
            selected="$(sed -nE 's/^\[==========\] Running ([0-9]+) test.*/\1/p' "$raw" | tail -n 1)"
            selected="${selected:-0}"
            skipped="$(grep -c '^\[  SKIPPED \]' "$raw" || true)"
            passed="$(sed -nE 's/^\[  PASSED  \] ([0-9]+) test.*/\1/p' "$raw" | tail -n 1)"
            passed="${passed:-0}"
            if [[ "$selected" != 1 || "$skipped" != 0 ]]; then
              echo "selection integrity failure phase=$phase ordinal=$ordinal identity=$identity selected=$selected skipped=$skipped" >&2
              orchestration_failure=true
              return 20
            fi
            result=RED
            if [[ "$rc" -eq 0 && "$passed" -eq 1 ]]; then result=PASS; fi
            raw_sha="$(sha256sum "$raw" | awk '{print $1}')"
            printf '%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\n'               "$ordinal" "$identity" "$owner" "$rc" "$selected" "$skipped" "$passed" "$result" "$raw_sha" >> "$ledger"
            if [[ "$result" == RED ]]; then
              printf '%s\t%s\t%s\t%s\t%s\t%s\n' "$phase" "$ordinal" "$identity" "$owner" "$rc" "$raw_sha" >> "$OUT/red-ledger.tsv"
            fi
            return 0
          }

          ordinal=0
          while IFS= read -r identity; do
            ordinal=$((ordinal+1))
            focused_executed=$ordinal
            raw="$(printf '%s/raw/focused/ordinal-%03d.log' "$OUT" "$ordinal")"
            run_one focused "$ordinal" "$identity" directional_surface_cell_producer_tests "$OUT/focused-ledger.tsv" "$raw" || exit $?
            if tail -n 1 "$OUT/focused-ledger.tsv" | grep -q $'\tPASS\t'; then focused_pass=$((focused_pass+1)); else focused_red=$((focused_red+1)); fi
          done < "$focused"

          mapfile -t selector_ids < "$selector"
          expected_ordinal=0
          while IFS=$'\t' read -r routed_ordinal identity owner extra; do
            [[ "$routed_ordinal" == "ordinal" ]] && continue
            expected_ordinal=$((expected_ordinal+1))
            test "$routed_ordinal" = "$expected_ordinal"
            test -z "${extra:-}"
            test "$identity" = "${selector_ids[$((expected_ordinal-1))]}"
            test -x "$EXEC/bin/$owner"
            selector_executed=$expected_ordinal
            raw="$(printf '%s/raw/selector/ordinal-%03d.log' "$OUT" "$expected_ordinal")"
            run_one selector "$expected_ordinal" "$identity" "$owner" "$OUT/selector-ledger.tsv" "$raw" || exit $?
            if tail -n 1 "$OUT/selector-ledger.tsv" | grep -q $'\tPASS\t'; then selector_pass=$((selector_pass+1)); else selector_red=$((selector_red+1)); fi
          done < "$routing"
          test "$expected_ordinal" = 449

          census "$PKG" "$OUT/package-census-after.tsv"
          census "$EXEC" "$OUT/execution-view-after.tsv"
          cmp -s "$OUT/package-census-before.tsv" "$OUT/package-census-after.tsv"
          cmp -s "$OUT/execution-view-before.tsv" "$OUT/execution-view-after.tsv"
          (cd "$PKG" && sha256sum -c SHA256SUMS) | tee "$OUT/candidate-manifest-check-after.txt"
          test "$(grep -c ': OK$' "$OUT/candidate-manifest-check-after.txt")" -eq 28
          test "$(sha256sum "$focused" | awk '{print $1}')" = "$FOCUSED_SHA256"
          test "$(sha256sum "$focused28" | awk '{print $1}')" = "$FOCUSED28_SHA256"
          test "$(sha256sum "$selector" | awk '{print $1}')" = "$SELECTOR_SHA256"
          test "$(sha256sum "$routing" | awk '{print $1}')" = "$ROUTING_SHA256"

          printf '%s\n'             "package_census_equal=true"             "execution_view_census_equal=true"             "focused30_unchanged=true"             "focused28_unchanged=true"             "selector449_unchanged=true"             "routing449_unchanged=true"             "manifest_after=28/28" > "$OUT/immutability.txt"
          printf '%s\n'             "turn_id=$TURN_ID"             "runtime_started=true"             "runtime_completed=true"             "preflight_completed=true"             "orchestration_failure=false"             "selection_integrity=true"             "focused_executed=$focused_executed"             "selector_executed=$selector_executed"             "total_executed=$((focused_executed+selector_executed))"             "focused_pass=$focused_pass"             "focused_red=$focused_red"             "selector_pass=$selector_pass"             "selector_red=$selector_red"             "total_pass=$((focused_pass+selector_pass))"             "total_red=$((focused_red+selector_red))"             "benchmark_execution=false"             "configure_execution=false"             "compile_execution=false"             "relink_execution=false"             "generated_discovery=false"             "package_repair=false"             "mode_repair=false"             "source_test_fixture_selector_mutation=false"             "retry_after_runtime_start=false"             "script_exit=0" > "$OUT/execution-boundary.txt"
          printf '%s\n'             "turn_id=$TURN_ID"             "workflow=$GITHUB_WORKFLOW"             "run_id=$GITHUB_RUN_ID"             "event=$GITHUB_EVENT_NAME"             "event_sha=$GITHUB_SHA"             "repository=$GITHUB_REPOSITORY"             "runner_os=$RUNNER_OS"             "candidate_artifact_id=$CANDIDATE_ARTIFACT_ID"             "expected_source_sha=$EXPECTED_SOURCE_SHA"             "finished_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" > "$OUT/environment.txt"
          sha256sum "$OUT/focused-ledger.tsv" > "$OUT/focused-ledger.sha256"
          sha256sum "$OUT/selector-ledger.tsv" > "$OUT/selector-ledger.sha256"
          sha256sum "$OUT/red-ledger.tsv" > "$OUT/red-ledger.sha256"
          (cd "$OUT" && find . -type f ! -name SHA256SUMS -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > SHA256SUMS)
          (cd "$OUT" && sha256sum -c SHA256SUMS)
          echo "result_manifest_rows=$(wc -l < "$OUT/SHA256SUMS" | tr -d ' ')"
          echo "focused=$focused_pass/30 selector=$selector_pass/449 total=$((focused_pass+selector_pass))/479 red=$((focused_red+selector_red))"
          echo "harness_exit=0" >> "$GITHUB_OUTPUT"

      - name: Upload result evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: directional-m6-cp1-tb12-close-r1-result-${{ github.run_id }}
          path: ${{ runner.temp }}/M6-CP1-TB12-CLOSE-R1-EXEC-result
          if-no-files-found: error
          retention-days: 14

      - name: Upload diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: directional-m6-cp1-tb12-close-r1-log-${{ github.run_id }}
          path: ${{ runner.temp }}/m6-cp1-tb12-close-r1-exec.log
          if-no-files-found: error
          retention-days: 14

  mailbox:
    if: ${{ always() }}
    needs: [runtime]
    permissions:
      actions: read
      contents: write
    uses: ./.github/workflows/workflow-mailbox-publisher.yml
    with:
      workflow_key: m6-cp1-tb12-close-r1-exec
      source_sha: 3f40f04a0e9d382b2ec82cf37a03c18ad405eb05
      source_ref: refs/heads/agent/surface_cell_quad/p5-recover-bridge-healing
      result: ${{ needs.runtime.result }}
      summary: "Execute immutable M6-CP1 TB12 R1 close gate: focused30 plus selector449, 479 fresh exact-filter processes."
