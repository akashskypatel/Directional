name: Agent Drive Patch CB45 20260908

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/drive-patch/cb45-source-apply-20260908.txt

permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

concurrency:
  group: agent-drive-patch-cb45-20260908
  cancel-in-progress: false

jobs:
  validate-caller:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/agent-drive-patch-cb45-20260908.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: cb45-drive-patch-apply
      commit_run_file: false
      trim_stale_comments: false
    secrets: inherit

  apply:
    needs: validate-caller
    if: ${{ needs.validate-caller.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1YGIFvPRdK9uEANpi35C7wRyXU31GzgTn
      patch_sha256: 09f6c778f45874e555f9c5e60a917471bcfb9d970d515a4850152f6bd69bc78b
      base_sha: 512ba0388f83a6c5f111f034a11ad03b456483a5
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: 'M3-CP4c-3-CB45: bind regions to actual embedded faces'
    secrets: inherit
