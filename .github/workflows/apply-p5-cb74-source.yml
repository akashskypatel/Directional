# Temporary source-transfer workflow. Created and removed directly through the
# GitHub connector. It changes source/test files only and never edits workflows.
name: Apply P5 CB74 Source Patch

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - '.agents/Directional/p5-cb74-source-patch/APPLY_READY'

concurrency:
  group: apply-p5-cb74-source-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  apply-source:
    runs-on: ubuntu-24.04
    steps:
      - name: Record source transfer start
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          EVENT_SHA: ${{ github.sha }}
        shell: bash
        run: |
          gh api repos/${{ github.repository }}/issues/8/comments \
            -f body="P5-CB67 through P5-CB74 source transfer run ${RUN_ID} started for staging commit ${EVENT_SHA}. It executes no compiled binary, test, benchmark, custom mesh, help/list command, or discovery command."

      - name: Checkout exact working branch
        uses: actions/checkout@v4
        with:
          ref: agent/surface_cell_quad/p5-recover-bridge-healing
          fetch-depth: 1
          submodules: false

      - name: Assemble exact source patch
        shell: bash
        run: |
          set -euo pipefail
          patch_dir=.agents/Directional/p5-cb74-source-patch
          echo "29214e5c8f41ff49a61cad331838614a81a05bf4f5e6531b39b40b694fa3bf41  ${patch_dir}/part-00" | sha256sum -c -
          echo "9d8e1e258a3ba1de6a3d73ed1a63f2abad571e36ddb8c5b9e57566cb1a374e16  ${patch_dir}/part-01" | sha256sum -c -
          echo "1a2fe83d7873b42d7c1d90a3e463766bc27b26f1eea36e2ac1f28e15111871d1  ${patch_dir}/part-02" | sha256sum -c -
          cat "${patch_dir}"/part-00 "${patch_dir}"/part-01 "${patch_dir}"/part-02 \
            | tr -d '\r\n' | base64 --decode | gzip -dc > /tmp/p5-cb74.patch
          echo "f34a0391b07365089fc5b0a459200e6b54632ab90f7be3545aff27561169e0b8  /tmp/p5-cb74.patch" | sha256sum -c -
          test "$(wc -c < /tmp/p5-cb74.patch)" = "72430"

      - name: Verify and apply source patch
        shell: bash
        run: |
          set -euo pipefail
          git apply --check /tmp/p5-cb74.patch
          git apply /tmp/p5-cb74.patch
          git diff --check
          cat > /tmp/expected-files.txt <<'EOF'
          include/directional/geometry/PatchDescriptor.h
          include/directional/geometry/SurfaceCellFeasibilityRepair.h
          include/directional/geometry/SurfaceCellOwnership.h
          include/directional/geometry/SurfaceComplexSimplification.h
          include/directional/pipeline/RemeshPipeline.h
          src/bench/DirectionalBenchmark.cpp
          src/geometry/PatchDescriptor.cpp
          src/geometry/SurfaceArrangement.cpp
          src/geometry/SurfaceCellFeasibilityRepair.cpp
          src/geometry/SurfaceComplexSimplification.cpp
          src/pipeline/RemeshPipeline.cpp
          tests/MilestoneDClosureTests.cpp
          tests/MilestoneGP26Tests.cpp
          tests/MilestoneGP27Tests.cpp
          tests/PatchDescriptorMilestoneETests.cpp
          EOF
          sed -i 's/^          //' /tmp/expected-files.txt
          sort -o /tmp/expected-files.txt /tmp/expected-files.txt
          git diff --name-only | sort > /tmp/actual-files.txt
          diff -u /tmp/expected-files.txt /tmp/actual-files.txt

      - name: Commit exact source checkpoint
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "directional-agent"
          git config user.email "directional-agent@users.noreply.github.com"
          git add \
            include/directional/geometry/PatchDescriptor.h \
            include/directional/geometry/SurfaceCellFeasibilityRepair.h \
            include/directional/geometry/SurfaceCellOwnership.h \
            include/directional/geometry/SurfaceComplexSimplification.h \
            include/directional/pipeline/RemeshPipeline.h \
            src/bench/DirectionalBenchmark.cpp \
            src/geometry/PatchDescriptor.cpp \
            src/geometry/SurfaceArrangement.cpp \
            src/geometry/SurfaceCellFeasibilityRepair.cpp \
            src/geometry/SurfaceComplexSimplification.cpp \
            src/pipeline/RemeshPipeline.cpp \
            tests/MilestoneDClosureTests.cpp \
            tests/MilestoneGP26Tests.cpp \
            tests/MilestoneGP27Tests.cpp \
            tests/PatchDescriptorMilestoneETests.cpp
          git commit -m "fix(surface-cells): restore successful subdivision identity [skip ci]"
          git push origin HEAD:agent/surface_cell_quad/p5-recover-bridge-healing

      - name: Record source transfer result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          EVENT_SHA: ${{ github.sha }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          gh api repos/${{ github.repository }}/issues/8/comments \
            -f body="P5-CB67 through P5-CB74 source transfer run ${RUN_ID} finished ${JOB_STATUS} for staging commit ${EVENT_SHA}. No compiled binary, test, benchmark, custom mesh, help/list command, or discovery command was executed."
