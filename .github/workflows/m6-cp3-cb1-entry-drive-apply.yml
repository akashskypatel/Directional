name: M6 CP3 CB1 Entry Drive Apply

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m6-cp3-cb1-entry-drive-apply.txt

permissions:
  actions: read
  contents: write
  id-token: write

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/m6-cp3-cb1-entry-drive-apply.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  apply:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1p1ISqnbtoiTjS6cagz-usBt2u0T2khId
      patch_sha256: '23b52fc56808618e226feaf27508cf4059ba7fe2cbc36aff21b826fa19b139c1'
      base_sha: 836d8acf3565faa010d0161614d854ece6f8d1f3
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: 'M6-CP3-CB1-ENTRY: implement RA-30a entry contract'
      retention_days: 14
    secrets: inherit

  mailbox:
    if: ${{ always() }}
    needs: [validate, apply]
    permissions:
      actions: read
      contents: write
    uses: ./.github/workflows/workflow-mailbox-publisher.yml
    with:
      workflow_key: m6-cp3-cb1-entry-drive-apply
      source_sha: ${{ github.sha }}
      source_ref: ${{ github.ref }}
      result: ${{ needs.apply.result }}
      summary: M6-CP3-CB1-ENTRY Google Drive patch application.
