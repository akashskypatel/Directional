name: M4 CP3 CB4 REV Drive Apply

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m4-cp3-cb4-rev-drive-apply/trigger.txt

permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

concurrency:
  group: m4-cp3-cb4-rev-drive-apply
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/m4-cp3-cb4-rev-drive-apply.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m4-cp3-cb4-rev-drive-apply
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  apply:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1mDgEOajhzwcuQtQTtWpe716Bv7vQvxXm
      patch_sha256: 4fe70c72a4684fb3f522acd4196886b6b6886ca13758bddea7a92034c4aba118
      base_sha: 0ac90cd1c1c70d15f99393b4f9b84c4d3246ccc3
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: 'docs: review M4 CP3 exact arc-support authority'
      retention_days: 14
    secrets: inherit
