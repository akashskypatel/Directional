name: M4 CP4 CB5 Apply Test Authority Patch

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m4-cp4-cb5/validate-apply-caller.txt
      - .agents/connector-triggers/m4-cp4-cb5/apply-test-patch.txt

permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

concurrency:
  group: m4-cp4-cb5-apply-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/m4-cp4-cb5-apply.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m4-cp4-cb5-apply
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  apply:
    needs: validate
    if: "${{ startsWith(github.event.head_commit.message, 'M4-CP4-CB5: apply') && needs.validate.outputs.valid == 'true' }}"
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1MEbi57nBr8UZyuqcZEZWnjvYZN4kGZ4B
      patch_sha256: 0cd1643a4f0232ae9aeb2edc5f9749449ebc5d21164b1c60813a02117c2133dd
      base_sha: fc7da47e7bc7fd23f41351fa12302473764a53a6
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: 'M4-CP4-CB5: align M4 test authority'
    secrets: inherit
