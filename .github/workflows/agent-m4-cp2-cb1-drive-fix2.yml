name: M4 CP2 CB1 Compile Fix Apply

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m4-cp2-cb1-drive-fix2/trigger.txt

permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

concurrency:
  group: m4-cp2-cb1-drive-fix2-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/agent-m4-cp2-cb1-drive-fix2.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m4-cp2-cb1-drive-fix2
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  apply:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1omw9PqrBfWmEyKbinN6msgkfc2FK-3_h
      patch_sha256: 8da998611c060730e337c5baaaf3654e4121fc5b4cdfad320d69d8383eea60e2
      base_sha: 29c0b4ba428b0ed31e585314d194524fc6ff691d
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: 'fix: split heterogeneous CP2 validator auto declarations'
      retention_days: 14
    secrets: inherit
