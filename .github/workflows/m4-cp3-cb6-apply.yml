    secrets: inherit

  apply:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1q9B5Lrbgw6OlJEEOUGmKbuKIoOiUV_7_
      patch_sha256: '5550c64f70c028015d160b6dd2e0d5fa1a0e0bd9ed6d2356af0910f1c85d43bc'
      base_sha: 2a2036ebdeb7974f7f2bc6620525e49fb5de22fe
