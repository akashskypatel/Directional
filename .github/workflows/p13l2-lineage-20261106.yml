name: P13l2 retained lineage witness
on:
  push:
    branches: [agent/surface_cell_quad/p5-recover-bridge-healing]
    paths: [.agents/connector-triggers/p13l2-lineage-20261106.txt]
permissions:
  actions: read
  contents: write
concurrency:
  group: p13l2-lineage
  cancel-in-progress: false
jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/p13l2-lineage-20261106.yml
      source_ref: ${{ github.sha }}
  capture:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Initialize persistent log
        shell: bash
        run: |
          : > "$RUNNER_TEMP/p13l2-gdb.log"
          echo "event_sha=$GITHUB_SHA semantic_source=11c8172ad467c6dc865f2f3352e75b78f5469a2b" >> "$RUNNER_TEMP/p13l2-gdb.log"
      - uses: actions/checkout@v4
        with:
          ref: 11c8172ad467c6dc865f2f3352e75b78f5469a2b
          fetch-depth: 1
          submodules: false
      - name: Verify and unpack immutable compiled artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          exec > >(tee -a "$RUNNER_TEMP/p13l2-gdb.log") 2>&1
          trap 's=$?; echo "preflight_exit=$s"' EXIT
          test "$(git rev-parse HEAD)" = 11c8172ad467c6dc865f2f3352e75b78f5469a2b
          sudo apt-get update -qq
          sudo apt-get install -y -qq gdb libgmp10 libgmpxx4ldbl
          mkdir -p "$RUNNER_TEMP/compiled" "$RUNNER_TEMP/geometry"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/13460725846/zip" > "$RUNNER_TEMP/cb96.zip"
          unzip -q "$RUNNER_TEMP/cb96.zip" -d "$RUNNER_TEMP/compiled"
          (cd "$RUNNER_TEMP/compiled" && sha256sum -c SHA256SUMS)
          test "$(cat "$RUNNER_TEMP/compiled/metadata/source-commit.txt")" = 11c8172ad467c6dc865f2f3352e75b78f5469a2b
          mkdir -p "$RUNNER_TEMP/compiled/test-data"
          ln -s "$GITHUB_WORKSPACE/benchmarks" "$RUNNER_TEMP/compiled/test-data/benchmarks"
          test -d "$RUNNER_TEMP/compiled/test-data/benchmarks/fixtures"
          gdb --version | head -1
      - name: Dump immutable geometry at pre-validation boundary
        shell: bash
        run: |
          set -uo pipefail
          exec > >(tee -a "$RUNNER_TEMP/p13l2-gdb.log") 2>&1
          cat > "$RUNNER_TEMP/dump.gdb" <<'GDB'
          set pagination off
          set confirm off
          python
          import gdb,struct,os,pathlib
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'geometry'
          out.mkdir(exist_ok=True)
          inf=gdb.selected_inferior()
          targets_f=[55,15372,21286,21288,21290,21291,41744,41745,41746,41747,4304,4308]
          targets_v=[4618,35159,35160,35161,28576,53049,53051,112,117,116,115,30037,30036,120,119]
          def rd(p,n):return bytes(inf.read_memory(p,n))
          def v3(p):return struct.unpack('<QQQ',rd(p,24))
          class Capture(gdb.Breakpoint):
              def stop(self):
                  try:
                      rsi=int(gdb.parse_and_eval('$rsi'))
                      rdx=int(gdb.parse_and_eval('$rdx'))
                      vp,vr,vc=struct.unpack('<Qqq',rd(rsi,24))
                      qp,qr,qc=struct.unpack('<Qqq',rd(rdx,24))
                      if (vr,vc,qr,qc)!=(67961,3,67750,4):return False
                      self.enabled=False
                      pid=inf.pid
                      lines=pathlib.Path('/proc/'+str(pid)+'/maps').read_text().splitlines()
                      stacks=[x for x in lines if '[stack]' in x]
                      if len(stacks)!=1:raise RuntimeError('Cannot uniquely locate main stack: '+repr(stacks))
                      start,end=(int(x,16) for x in stacks[0].split()[0].split('-'))
                      stack=rd(start,end-start)
                      print('P13L2_STACK '+str((hex(start),hex(end),len(stack))),flush=True)
                      facehits=[];vertexhits=[];other=[]
                      for off in range(0,len(stack)-24,8):
                          a,b,c=struct.unpack_from('<QQQ',stack,off)
                          if not (a>0x10000 and a<=b<=c and c-b<200000000):continue
                          n=b-a
                          if n==67750*40:
                              try:
                                  sample=[struct.unpack('<ii',rd(a+q*40,8)) for q in (0,55,15372,21286,41746,67749)]
                                  if all(row==idx and 0<=patch<200000 for (row,patch),idx in zip(sample,(0,55,15372,21286,41746,67749))):
                                      facehits.append((off,a,b,c))
                                      fname='quad_lineage_'+str(len(facehits))+'.tsv'
                                      with (out/fname).open('w') as o:
                                          o.write('face\toutputQuad\tsourcePatch\tbackend\toperationLocalQuad\tcompletionVariant\tboundaryOnly\tstitchCycleHash\tauthoritativeCycleHash\n')
                                          for q in targets_f:
                                              t=rd(a+q*40,40)
                                              x=struct.unpack('<iiiii',t[:20])
                                              cycle,auth=struct.unpack_from('<QQ',t,24)
                                              o.write(str(q)+'\t'+'\t'.join(map(str,x))+'\t'+str(t[20])+'\t'+str(cycle)+'\t'+str(auth)+'\n')
                              except Exception as exc:
                                  other.append('face_candidate_rejected '+repr(exc))
                          if n>0 and n%67961==0 and 128<=n//67961<=4096:
                              stride=n//67961
                              try:
                                  selected=(0,1,17,35160,53049,67960)
                                  rows=[struct.unpack('<ii',rd(a+v*stride,8)) for v in selected]
                                  if all(row==v and kind in (0,1) for (row,kind),v in zip(rows,selected)):
                                      vertexhits.append((off,a,b,c,stride))
                                      d=out/('vertex_lineage_'+str(len(vertexhits)))
                                      d.mkdir(exist_ok=True)
                                      for v in targets_v:
                                          (d/('v'+str(v)+'.bin')).write_bytes(rd(a+v*stride,stride))
                                      (d/'layout.txt').write_text('stride='+str(stride)+'\n'+ 'stack_offset='+str(off)+'\n')
                              except Exception as exc:
                                  other.append('vertex_candidate_rejected '+repr(exc))
                      (out/'scan_summary.txt').write_text('face_vectors='+repr(facehits)+'\nvertex_vectors='+repr(vertexhits)+'\nerrors='+repr(other[:20])+'\n')
                      print('P13L2_LINEAGE_SCAN face='+str(len(facehits))+' vertex='+str(len(vertexhits)),flush=True)
                  except Exception as exc:
                      (out/'scan_error.txt').write_text(repr(exc))
                      print('P13L2_LINEAGE_ERROR '+repr(exc),flush=True)
                  return False
          Capture('directional::validation::validate_source_authoritative_surface_mesh')
          end
          run
          GDB
          set +e
          timeout 470s gdb -q -batch -x "$RUNNER_TEMP/dump.gdb" --args "$RUNNER_TEMP/compiled/bin/directional_surface_cell_producer_tests" '--gtest_filter=UniformPhaseFront/SurfaceCellDesignAcceptance.ProducesDirectSourceAuthoritativePureQuadOutput/Vase' > "$RUNNER_TEMP/test.log" 2>&1
          rc=$?
          set -e
          echo "scratch_runtime_exit=$rc"
          grep 'P13L2_LINEAGE' "$RUNNER_TEMP/test.log" || true
          tail -15 "$RUNNER_TEMP/test.log"
          cp "$RUNNER_TEMP/test.log" "$RUNNER_TEMP/geometry/test.log"
          test -s "$RUNNER_TEMP/geometry/scan_summary.txt"
      - name: Write evidence manifest
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/geometry"
          echo 'semantic_source=11c8172ad467c6dc865f2f3352e75b78f5469a2b' > "$RUNNER_TEMP/geometry/source.txt"
          (cd "$RUNNER_TEMP/geometry" && find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p13l2-lineage-data-${{ github.run_id }}
          path: ${{ runner.temp }}/geometry
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p13l2-lineage-log-${{ github.run_id }}
          path: ${{ runner.temp }}/p13l2-gdb.log
          if-no-files-found: error
  mailbox:
    if: ${{ always() }}
    needs: [capture]
    permissions:
      actions: read
      contents: write
    uses: ./.github/workflows/workflow-mailbox-publisher.yml
    with:
      mailbox_branch: workflow-mailbox
      workflow_key: p13l2-lineage
      source_sha: 11c8172ad467c6dc865f2f3352e75b78f5469a2b
      source_ref: refs/heads/agent/surface_cell_quad/p5-recover-bridge-healing
      result: ${{ needs.capture.result }}
      summary: No-build GDB retained quad and vertex lineage scan at immutable CB96 validator entry.