name: M3 CP4c2 TB X2 R2 Artifact Only Diagnostics

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m3-cp4c2-tb-x2-r2-exec/**

permissions:
  contents: write
  actions: read
  issues: write
  pull-requests: write

concurrency:
  group: m3-cp4c2-tb-x2-r2-exec
  cancel-in-progress: false

jobs:
  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m3-cp4c2-tb-x2-r2-exec
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/m3-cp4c2-tb-x2-r2-exec.yml
    secrets: inherit

  execute:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Initialize diagnostic log
        shell: bash
        run: |
          set -euo pipefail
          : > "${RUNNER_TEMP}/m3-cp4c2-tb-x2-r2.log"
          printf 'workflow=%s\nrun_id=%s\nevent_sha=%s\nworkspace=%s\nstarted_at=%s\n' \
            "$GITHUB_WORKFLOW" "$GITHUB_RUN_ID" "$GITHUB_SHA" "$GITHUB_WORKSPACE" \
            "$(date -u +%Y-%m-%dT%H:%M:%SZ)" | tee -a "${RUNNER_TEMP}/m3-cp4c2-tb-x2-r2.log"

      - name: Verify immutable package and execute D1 then D2
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -uo pipefail
          log="${RUNNER_TEMP}/m3-cp4c2-tb-x2-r2.log"
          out="${RUNNER_TEMP}/m3-cp4c2-tb-x2-r2-result"
          pkg="${RUNNER_TEMP}/package"
          zip="${RUNNER_TEMP}/package.zip"
          mkdir -p "$out" "$pkg"
          exec > >(tee -a "$log") 2>&1
          fail=0
          check() { "$@" || { echo "CHECK_FAILED: $*"; fail=1; }; }
          echo 'runtimeExecution=true' > "$out/boundary.txt"
          echo 'rebuild=false' >> "$out/boundary.txt"
          echo 'relink=false' >> "$out/boundary.txt"
          echo 'fixtureMutation=false' >> "$out/boundary.txt"
          echo 'generatedDiscovery=false' >> "$out/boundary.txt"
          echo 'benchmarkExecution=false' >> "$out/boundary.txt"

          curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/artifacts/9702321260/zip" -o "$zip" || fail=1
          check test "$(sha256sum "$zip" | awk '{print $1}')" = "05237f108a65c73df81b6b125d6fcecad10ad9b5af4104ecce3c6bb9f6642035"
          check unzip -q "$zip" -d "$pkg"
          cd "$pkg" || fail=1
          check sha256sum -c SHA256SUMS
          check test "$(cat metadata/source-commit.txt)" = "232ac459b13657529e064272a75c5583770a5963"
          check test "$(cat metadata/preflight-exit-code.txt)" = 0
          check test "$(cat metadata/build-exit-code.txt)" = 0
          for f in metadata/source-status-*.txt; do check test ! -s "$f"; done
          check grep -Fxq 'runtimeExecution=false' metadata/command-boundary.txt
          check grep -Fxq 'turnBoundary=Code+Build-only' metadata/command-boundary.txt
          check grep -Fxq 'exactArithmeticBackend=GMP' metadata/command-boundary.txt
          check grep -q 'gmpxx' metadata/gmp-evidence.txt
          check grep -q 'libgmp.so' metadata/gmp-evidence.txt
          cat > "$out/expected-targets.txt" <<'EOF'
          directional_core
          directional_pipeline
          directional_surface_cell_authority_kernel_tests
          directional_surface_cell_producer_tests
          directional_surface_cell_completion_tests
          directional_surface_cell_validation_tests
          directional_compiled_api_tests
          directional_benchmarks
          EOF
          check diff -u "$out/expected-targets.txt" metadata/compiled-targets.txt
          srcarc="source/source-232ac459b13657529e064272a75c5583770a5963.tar.gz"
          check test "$(sha256sum "$srcarc" | awk '{print $1}')" = "986db8b91d06eab4284f3a0e49c1d8c9ad2676df61fdfdd4a94e56ba34a5644f"
          compiled_root="$(sed -n 's/^Directional_SOURCE_DIR:STATIC=//p' metadata/CMakeCache.txt)"
          check test "$compiled_root" = "$GITHUB_WORKSPACE"
          check test -z "$(find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 -print -quit)"
          check tar -xzf "$srcarc" -C "$GITHUB_WORKSPACE"
          sel="$GITHUB_WORKSPACE/.agents/Directional/Architecture_M3_CP4c1_Required_Green_Selector.txt"
          s357="$GITHUB_WORKSPACE/.agents/Directional/Architecture_M3_CP4c2_Required_Green_Selector_357.txt"
          s358="$GITHUB_WORKSPACE/.agents/Directional/Architecture_M3_CP4c2_Required_Green_Selector_358.txt"
          check test "$(head -n 316 "$sel" | sha256sum | awk '{print $1}')" = "601ce2b6a4aa2b0cda971e06e9378ebccba5fa75a9b416407447f7ed3600193c"
          check test "$(head -n 346 "$sel" | sha256sum | awk '{print $1}')" = "20d3b0b1400d5cab6af4a339a858c56fb7fd0359fb995a395dad215b20f3e46a"
          check test "$(head -n 353 "$sel" | sha256sum | awk '{print $1}')" = "51ff96d72e1c2c88e9407e99737e42ec9093ea238aaf8b1e45ff2559f71ac6a5"
          check test "$(sha256sum "$sel" | awk '{print $1}')" = "e9d88f1196e412e06424294d6be22b32f01c9671ec5e4de119abd3f2fb5afeaa"
          check test "$(sha256sum "$s357" | awk '{print $1}')" = "b896d0db7f26aeb0f3513418405efdeccbcf84fb6dc971500c6ddac9e364dc70"
          check test "$(sha256sum "$s358" | awk '{print $1}')" = "6eda3aad83de81fc55d5cd446f80704d604a842f10995789b483291bb64fbe62"
          find "$pkg" -type f -print0 | sort -z | xargs -0 sha256sum > "$out/package-pre.sha256"
          find "$GITHUB_WORKSPACE" -type f -print0 | sort -z | xargs -0 sha256sum > "$out/source-pre.sha256"
          if (( fail != 0 )); then echo preflight_failed > "$out/status.txt"; exit 2; fi

          cmd1=(./bin/directional_surface_cell_producer_tests --gtest_filter=GlobalTopologyPlan.Cp4c2IndependentNetworkOnlyCellularityOracleIsObservable)
          printf '%q ' "${cmd1[@]}" > "$out/d1.command.txt"; echo >> "$out/d1.command.txt"
          date -u +%Y-%m-%dT%H:%M:%SZ > "$out/d1.started-at.txt"
          echo "D1_COMMAND=$(cat "$out/d1.command.txt")"
          set +e; timeout 900s "${cmd1[@]}" > >(tee "$out/d1.stdout") 2> >(tee "$out/d1.stderr" >&2); d1=$?; set -e
          echo "$d1" > "$out/d1.exit-code.txt"
          date -u +%Y-%m-%dT%H:%M:%SZ > "$out/d1.finished-at.txt"
          grep -cF '[ RUN      ] GlobalTopologyPlan.Cp4c2IndependentNetworkOnlyCellularityOracleIsObservable' "$out/d1.stdout" > "$out/d1.selected-count.txt" || true
          grep -c '^m3Cp4c2Y1;' "$out/d1.stdout" > "$out/d1.publication-count.txt" || true
          check test "$d1" = 0
          check test "$(grep -cF '[ RUN      ] GlobalTopologyPlan.Cp4c2IndependentNetworkOnlyCellularityOracleIsObservable' "$out/d1.stdout")" = 1
          check test "$(grep -c '^m3Cp4c2Y1;' "$out/d1.stdout")" = 3
          check test "$(grep -c 'oracleKind=independent-network-complement-arrangement;surfaceCutGraphCalls=0' "$out/d1.stdout")" = 3
          torus="$(grep '^m3Cp4c2Y1;witness=torus;' "$out/d1.stdout" || true)"
          check test -n "$torus"
          [[ "$torus" == *';networkV=48;'* && "$torus" == *';networkE=48;'* && "$torus" == *';sourceChi=0;'* && "$torus" == *';networkOnlyCellular=false;'* ]] || { echo 'TORUS_CONTROL_FAILED'; fail=1; }

          if (( fail == 0 )); then
            cmd2=(./bin/directional_surface_cell_producer_tests --gtest_filter=GlobalTopologyPlan.Cp4c2CutGraphFailureLocalizationIsObservable)
            printf '%q ' "${cmd2[@]}" > "$out/d2.command.txt"; echo >> "$out/d2.command.txt"
            date -u +%Y-%m-%dT%H:%M:%SZ > "$out/d2.started-at.txt"
            echo "D2_COMMAND=$(cat "$out/d2.command.txt")"
            set +e; timeout 900s "${cmd2[@]}" > >(tee "$out/d2.stdout") 2> >(tee "$out/d2.stderr" >&2); d2=$?; set -e
            echo "$d2" > "$out/d2.exit-code.txt"
            date -u +%Y-%m-%dT%H:%M:%SZ > "$out/d2.finished-at.txt"
            grep -cF '[ RUN      ] GlobalTopologyPlan.Cp4c2CutGraphFailureLocalizationIsObservable' "$out/d2.stdout" > "$out/d2.selected-count.txt" || true
            grep -c '^m3Cp4c2Y2;' "$out/d2.stdout" > "$out/d2.publication-count.txt" || true
            check test "$d2" = 0
            check test "$(grep -cF '[ RUN      ] GlobalTopologyPlan.Cp4c2CutGraphFailureLocalizationIsObservable' "$out/d2.stdout")" = 1
            check test "$(grep -c '^m3Cp4c2Y2;' "$out/d2.stdout")" = 1
            y2="$(grep '^m3Cp4c2Y2;' "$out/d2.stdout" || true)"
            for token in ';producerRederivationSite=' ';localizedSite=' ';localizationConsistent=true' ';oracleV=' ';oracleE=' ';oracleF=' ';oracleChi=' ';producerReDerivationV=' ';producerReDerivationE=' ';producerReDerivationF=' ';producerReDerivationChi='; do [[ "$y2" == *"$token"* ]] || { echo "Y2_TOKEN_MISSING=$token"; fail=1; }; done
          else
            echo 'D2_SKIPPED_DUE_TO_D1_STOP' > "$out/d2.status.txt"
          fi

          find "$pkg" -type f -print0 | sort -z | xargs -0 sha256sum > "$out/package-post.sha256"
          find "$GITHUB_WORKSPACE" -type f -print0 | sort -z | xargs -0 sha256sum > "$out/source-post.sha256"
          check cmp -s "$out/package-pre.sha256" "$out/package-post.sha256"
          check cmp -s "$out/source-pre.sha256" "$out/source-post.sha256"
          if (( fail == 0 )); then echo success > "$out/status.txt"; else echo failed > "$out/status.txt"; fi
          echo "finished_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" | tee -a "$log"

      - name: Upload R2 diagnostic result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-cp4c2-tb-x2-r2-result-${{ github.run_id }}
          path: ${{ runner.temp }}/m3-cp4c2-tb-x2-r2-result
          if-no-files-found: error
          retention-days: 7

      - name: Upload R2 diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-cp4c2-tb-x2-r2-log-${{ github.run_id }}
          path: ${{ runner.temp }}/m3-cp4c2-tb-x2-r2.log
          if-no-files-found: error
          retention-days: 7

      - name: Fail when R2 execution invalid
        if: always()
        shell: bash
        run: |
          test -f "${RUNNER_TEMP}/m3-cp4c2-tb-x2-r2-result/status.txt"
          test "$(cat "${RUNNER_TEMP}/m3-cp4c2-tb-x2-r2-result/status.txt")" = success
