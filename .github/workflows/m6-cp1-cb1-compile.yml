name: M6 CP1 CB1 Compile

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m6-cp1-cb1-compile-20260924.txt

permissions:
  contents: write
  actions: write
  issues: write
  pull-requests: write

concurrency:
  group: m6-cp1-cb1-compile
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/m6-cp1-cb1-compile.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m6-cp1-cb1-compile-r3
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  compile:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-compile-reusable.yml
    with:
      source_sha: ee8b8ac20571df5773f5f94bf9b382161f37a893
      artifact_prefix: m6-cp1-cb1-compile-r3
    secrets: inherit
