name: M4 CP4 TB3 Review Apply

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m4-cp4-tb3-rev-apply-20260919.txt

permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

concurrency:
  group: m4-cp4-tb3-rev-apply-${{ github.ref }}
  cancel-in-progress: false

jobs:
  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m4-cp4-tb3-rev-apply
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/m4-cp4-tb3-rev-apply.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  apply:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1BMcVjPnO7YBNW8BQXEGfqf0EQ_LZImgx
      patch_sha256: af806896d95c5dba716e9c264e3ea908d62de103063b4db2ca6b35d9bcaf6ac5
      base_sha: 31659ccbff8a592ad9a261fffdb7b8e3d7e401ca
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: "docs(m4-cp4): accept selector430 and close M4"
    secrets: inherit
