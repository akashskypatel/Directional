name: M5 CP3 CB16 Compile R1

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m5-cp3-cb16-compile-r1-20260923.txt

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: m5-cp3-cb16-compile-r1
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/m5-cp3-cb16-compile-r1.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m5-cp3-cb16-compile-r1
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  compile:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-compile-reusable.yml
    with:
      source_sha: 6bad9eb5626e77a234ffb2c14f621195105e4ba1
      targets: >-
        directional_core
        directional_pipeline
        directional_surface_cell_authority_kernel_tests
        directional_surface_cell_producer_tests
        directional_surface_cell_completion_tests
        directional_surface_cell_validation_tests
        directional_compiled_api_tests
        directional_benchmarks
      artifact_prefix: m5-cp3-cb16-r1
    secrets: inherit
