name: Agent M3 CP4c3 TB25 R1

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/tb25-r1/trigger-20260904.txt

permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: agent-m3-cp4c3-tb25-r1-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/agent-m3-cp4c3-tb25-r1.yml
      source_ref: ${{ github.sha }}
      retention_days: 14
    secrets: inherit

  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m3-cp4c3-tb25-r1
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  execute:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    env:
      ARTIFACT_ID: "9950303110"
      EXPECTED_ZIP_SHA256: "84c9cd0bdf5d8bef2288e1ca57d52bcec8d1503f368d82101ae10cfa14c49189"
      EXPECTED_PROVIDER_DIGEST: "sha256:84c9cd0bdf5d8bef2288e1ca57d52bcec8d1503f368d82101ae10cfa14c49189"
      EXPECTED_SOURCE_SHA: "3d7f7f9a3afad3ed37fc615a206801cf6310f4ac"
      EXPECTED_SELECTOR_365_SHA256: "6b5b6555d39c250c24cbf3faeafdeca93b4b11379118a29583253e6cfc14b8a1"
      EXPECTED_SELECTOR_401_SHA256: "0d0857a97158dfd0763b536718c24ba257417866aad3d8e51d6f0093be5a5869"
      EXPECTED_SELECTOR_403_SHA256: "60ff6daa0e1dc71fe9c856ee9559d665628b756ed634f70ffce5881ec2514007"
      EXPECTED_DIRECTIONAL_BENCHMARKS_SHA256: "c419eeebaa5d35632d2492d2ac00a9256b57dfe058299baf9ebd7cbfe2d0aae8"
      EXPECTED_COMPILED_API_SHA256: "7684471d50069bfb366921eced5d50c13c600bbf445ee847d710d406b7e2b233"
      EXPECTED_AUTHORITY_KERNEL_SHA256: "5efacc3ad52085a8ab76bad451bfc70c337e44a73a8f81a165f06ab1cd3041b3"
      EXPECTED_COMPLETION_SHA256: "1701820d85d91fe674cb3dd3496669f0a49ca43e6068a170fb0277227aba094a"
      EXPECTED_PRODUCER_SHA256: "4a940c0806374588314232dd0156cd38cab3b814d00a346b1f6f43a48bc725d1"
      EXPECTED_VALIDATION_SHA256: "303af6ab231bf88b6b618df03315c9999a27595b8b55871922935f5098a4ca5f"
      PROOF_ARTIFACT_ID: "9953038617"
      EXPECTED_PROOF_ZIP_SHA256: "f1216938b3d543d4d3fcb498279b1ce432feac008ec240afbf9ae18b1fbe31cf"
      EXPECTED_PROOF_PROVIDER_DIGEST: "sha256:f1216938b3d543d4d3fcb498279b1ce432feac008ec240afbf9ae18b1fbe31cf"
      EXPECTED_HARNESS_SHA256: "13ec524fa0fe609949b147ab36bf710392244b8202684ece2eea10eb5c83e0e9"
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Initialize TB25-R1 diagnostic log
        shell: bash
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/m3-cp4c3-tb25-exec.log"
          : > "$log"
          printf '%s\n' \
            "workflow=${GITHUB_WORKFLOW}" \
            "run_id=${GITHUB_RUN_ID}" \
            "event=${GITHUB_EVENT_NAME}" \
            "event_sha=${GITHUB_SHA}" \
            "repository=${GITHUB_REPOSITORY}" \
            "started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" | tee -a "$log"

      - name: Verify immutable harness and accepted prefix before runtime
        shell: bash
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/m3-cp4c3-tb25-exec.log"
          exec > >(tee -a "$log") 2>&1
          root="${RUNNER_TEMP}/tb25-r1-preflight"; mkdir -p "$root/proof" "$root/pkg" "$root/source"
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts"
          auth=(-H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28')
          curl --fail-with-body --silent --show-error --location "${auth[@]}" "$api/$PROOF_ARTIFACT_ID" -o "$root/proof.json"
          test "$(jq -r '.digest' "$root/proof.json")" = "$EXPECTED_PROOF_PROVIDER_DIGEST"
          curl --fail-with-body --silent --show-error --location "${auth[@]}" "$api/$PROOF_ARTIFACT_ID/zip" -o "$root/proof.zip"
          test "$(sha256sum "$root/proof.zip" | awk '{print $1}')" = "$EXPECTED_PROOF_ZIP_SHA256"
          unzip -q "$root/proof.zip" -d "$root/proof"
          harness="$root/proof/m3-cp4c3-tb25-harness.sh"
          test "$(sha256sum "$harness" | awk '{print $1}')" = "$EXPECTED_HARNESS_SHA256"
          bash -n "$harness"

          curl --fail-with-body --silent --show-error --location "${auth[@]}" "$api/$ARTIFACT_ID" -o "$root/product.json"
          test "$(jq -r '.digest' "$root/product.json")" = "$EXPECTED_PROVIDER_DIGEST"
          curl --fail-with-body --silent --show-error --location "${auth[@]}" "$api/$ARTIFACT_ID/zip" -o "$root/product.zip"
          test "$(sha256sum "$root/product.zip" | awk '{print $1}')" = "$EXPECTED_ZIP_SHA256"
          unzip -q "$root/product.zip" -d "$root/pkg"
          (cd "$root/pkg" && sha256sum -c SHA256SUMS)
          test "$(cat "$root/pkg/metadata/source-commit.txt")" = "$EXPECTED_SOURCE_SHA"
          grep -Fxq 'runtimeExecution=false' "$root/pkg/metadata/command-boundary.txt"
          grep -Fxq 'exactArithmeticBackend=GMP' "$root/pkg/metadata/command-boundary.txt"
          tar -xzf "$root/pkg/source/source-${EXPECTED_SOURCE_SHA}.tar.gz" -C "$root/source"
          s365="$root/source/.agents/Directional/Architecture_M3_CP4c2_Required_Green_Selector_365.txt"
          s401="$root/source/.agents/Directional/Architecture_M3_CP4c3_Required_Green_Selector_401.txt"
          s403="$root/source/.agents/Directional/Architecture_M3_CP4c3_Required_Green_Selector_403.txt"
          test "$(sha256sum "$s365" | awk '{print $1}')" = "$EXPECTED_SELECTOR_365_SHA256"
          test "$(sha256sum "$s401" | awk '{print $1}')" = "$EXPECTED_SELECTOR_401_SHA256"
          test "$(sha256sum "$s403" | awk '{print $1}')" = "$EXPECTED_SELECTOR_403_SHA256"
          test "$(wc -l < "$s365" | tr -d ' ')" = 365
          test "$(wc -l < "$s401" | tr -d ' ')" = 401
          test "$(wc -l < "$s403" | tr -d ' ')" = 403
          head -n 365 "$s403" | cmp -s "$s365" -
          head -n 401 "$s403" | cmp -s "$s401" -
          mkdir -p "${RUNNER_TEMP}/m3-cp4c3-tb25-result"
          printf '%s\n' \
            "proof_artifact_id=$PROOF_ARTIFACT_ID" \
            "proof_zip_sha256=$EXPECTED_PROOF_ZIP_SHA256" \
            "harness_sha256=$EXPECTED_HARNESS_SHA256" \
            'harness_bash_n=true' \
            "product_artifact_id=$ARTIFACT_ID" \
            "product_zip_sha256=$EXPECTED_ZIP_SHA256" \
            'selector365_exact_prefix_of_403=true' \
            'selector401_exact_prefix_of_403=true' \
            'runtime_started=false' > "${RUNNER_TEMP}/m3-cp4c3-tb25-result/pre-runtime-authority.txt"
          cp "$harness" "${RUNNER_TEMP}/m3-cp4c3-tb25-harness.sh"

      - name: Execute immutable TB25-R1 gate
        shell: bash
        run: bash "${RUNNER_TEMP}/m3-cp4c3-tb25-harness.sh"

      - name: Record TB25-R1 ledger and focus evidence
        if: always()
        shell: bash
        run: |
          set +e
          r="${RUNNER_TEMP}/m3-cp4c3-tb25-result"; mkdir -p "$r"
          python3 - "$r" <<'PY'
          import csv,hashlib,pathlib,sys
          r=pathlib.Path(sys.argv[1]); p=r/'ledger.tsv'
          if not p.is_file():
              (r/'ledger-summary.txt').write_text('ledger_available=false\n')
              raise SystemExit
          rows=list(csv.DictReader(p.open(),delimiter='\t'))
          red=[int(x['ordinal']) for x in rows if x['result']=='RED']; accepted=[x for x in red if x<=365]
          im=r/'identity-map.tsv'
          (r/'ledger-summary.txt').write_text(
              f"total={len(rows)}\npass={sum(x['result']=='PASS' for x in rows)}\nred={len(red)}\n"
              f"red_ordinals={red}\naccepted_prefix_pass={365-len(accepted)}/365\n"
              f"accepted_red_ordinals={accepted}\naccepted_green_loss={str(bool(accepted)).lower()}\n"
              f"ledger_sha256={hashlib.sha256(p.read_bytes()).hexdigest()}\n"
              f"identity_map_sha256={hashlib.sha256(im.read_bytes()).hexdigest() if im.is_file() else 'unavailable'}\n")
          focus=[366,367,368,369,370,371,372,374,384,385,389,390,391,392,393,397,398,399,400,401,402,403]
          by={int(x['ordinal']):x for x in rows}
          with (r/'focus-ledger.tsv').open('w') as f:
              f.write('\t'.join(rows[0].keys())+'\n')
              for o in focus:
                  if o in by: f.write('\t'.join(by[o].values())+'\n')
          with (r/'focus-raw.log').open('w') as f:
              for o in focus:
                  q=r/'raw'/f'ordinal-{o:03d}.log'
                  f.write(f'===== ORDINAL {o} =====\n'+(q.read_text(errors='replace') if q.is_file() else '[unavailable]\n'))
          PY

      - name: Record final TB25-R1 status
        if: always()
        shell: bash
        run: |
          set +e
          l="${RUNNER_TEMP}/m3-cp4c3-tb25-exec.log"; r="${RUNNER_TEMP}/m3-cp4c3-tb25-result"; mkdir -p "$r"
          printf '%s\n' \
            "final_job_status=${{ job.status }}" \
            "event_sha=${GITHUB_SHA}" \
            'runtime_package_artifact_id=9950303110' \
            'semantic_source=3d7f7f9a3afad3ed37fc615a206801cf6310f4ac' \
            "finished_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" | tee -a "$l" | tee "$r/workflow-status.txt"

      - name: Upload TB25-R1 result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-cp4c3-tb25-r1-result-${{ github.run_id }}
          path: ${{ runner.temp }}/m3-cp4c3-tb25-result
          if-no-files-found: error
          retention-days: 14

      - name: Upload TB25-R1 diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-cp4c3-tb25-r1-log-${{ github.run_id }}
          path: ${{ runner.temp }}/m3-cp4c3-tb25-exec.log
          if-no-files-found: error
          retention-days: 14
