name: M5 CP3 CB13 R11 R1 Static Validation

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m5-cp3-cb13-r11-r1-static-validation.txt

permissions:
  contents: read

concurrency:
  group: m5-cp3-cb13-r11-r1-static-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-self:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/m5-cp3-cb13-r11-r1-static-validation.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  validate-retry:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/m5-cp3-tb1-r11-r1-exec.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  static:
    needs:
      - validate-self
      - validate-retry
    if: ${{ needs.validate-self.outputs.valid == 'true' && needs.validate-retry.outputs.valid == 'true' }}
    runs-on: ubuntu-24.04
    env:
      TURN_ID: M5-CP3-CB13
      RETRY_WORKFLOW: .github/workflows/m5-cp3-tb1-r11-r1-exec.yml
      DRIVER_TEMPLATE: .agents/Directional/turn-payloads/m5_cp3_tb1_r11_r1_exec.py.in
      PLAN_FILE: .agents/Directional/Architecture_M5_CP3_TB1_R11_R1_Artifact_Only_Test_Benchmark_Plan.md
      INVALID_REPORT: .agents/Directional/Architecture_M5_CP3_TB1_R11_Invalid_Attempt_Report.md
    steps:
      - name: Initialize persistent diagnostic log
        shell: bash
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/${TURN_ID}.log"
          : > "$log"
          {
            echo "workflow=$GITHUB_WORKFLOW"
            echo "run_id=$GITHUB_RUN_ID"
            echo "event=$GITHUB_EVENT_NAME"
            echo "event_sha=$GITHUB_SHA"
            echo "ref=$GITHUB_REF"
            echo "repository=$GITHUB_REPOSITORY"
            echo "runner_os=$RUNNER_OS"
            echo "turn_boundary=Code+Build-control-plane-only"
            echo "directional_runtime_execution=false"
            echo "started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } | tee -a "$log"

      - name: Checkout exact control-plane authority
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          submodules: false
          lfs: false

      - name: Verify retry authority and corrected finalizer
        id: verify
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/${TURN_ID}.log"
          out="${RUNNER_TEMP}/${TURN_ID}-result"
          mkdir -p "$out"
          exec > >(tee -a "$log") 2>&1
          trap 'status=$?; echo "verification_exit=$status" | tee -a "$log"; echo "verification_exit=$status" > "$out/verification-exit.txt"' EXIT

          test -f "$RETRY_WORKFLOW"
          test -f "$DRIVER_TEMPLATE"
          test -f "$PLAN_FILE"
          test -f "$INVALID_REPORT"
          test -f .agents/Directional/tools/write_orchestration_payload.py

          python3 - "$RETRY_WORKFLOW" "$DRIVER_TEMPLATE" "$PLAN_FILE" "$INVALID_REPORT" "$out/static-proof.json" <<'PY'
          import ast
          import hashlib
          import json
          import pathlib
          import re
          import sys

          workflow_path, driver_path, plan_path, invalid_path, out_path = map(pathlib.Path, sys.argv[1:])
          workflow = workflow_path.read_text(encoding="utf-8")
          driver = driver_path.read_text(encoding="utf-8")
          plan = plan_path.read_text(encoding="utf-8")
          invalid = invalid_path.read_text(encoding="utf-8")

          if re.search(r"(?<![0-9a-f])[0-9a-f]{64}(?![0-9a-f])", workflow):
              raise SystemExit("retry workflow contains raw SHA-256 literal")
          if "SHA256SUMS.new" in workflow:
              raise SystemExit("retry workflow retains in-tree temporary manifest")
          required = [
              'manifest_tmp="${RUNNER_TEMP}/${TURN_ID}-SHA256SUMS.final"',
              'cp "$authority" "$result/driver-authority.txt"',
              'find . -type f ! -name SHA256SUMS -print0',
              '| xargs -0 sha256sum > "$manifest_tmp"',
              'mv "$manifest_tmp" SHA256SUMS',
              'sha256sum -c SHA256SUMS',
              'manifest_rows="$(grep -cve \'^$\' SHA256SUMS)"',
              'actual_non_manifest="$(find . -type f ! -name SHA256SUMS | wc -l | tr -d \' \')"',
              'test "$manifest_rows" = "$actual_non_manifest"',
              'final manifest temporary path must be outside result tree',
          ]
          for token in required:
              if token not in workflow:
                  raise SystemExit(f"retry workflow missing token: {token}")

          copy_i = workflow.index('cp "$authority" "$result/driver-authority.txt"')
          find_i = workflow.index('find . -type f ! -name SHA256SUMS -print0')
          move_i = workflow.index('mv "$manifest_tmp" SHA256SUMS')
          verify_i = workflow.index('sha256sum -c SHA256SUMS')
          count_i = workflow.index('test "$manifest_rows" = "$actual_non_manifest"')
          if not (copy_i < find_i < move_i < verify_i < count_i):
              raise SystemExit("retry finalizer ordering invalid")

          keys = [
              "CANDIDATE_SHA256",
              "ROOT_MANIFEST_SHA256",
              "SOURCE_ARCHIVE_SHA256",
              "ROUTING_SHA256",
              "IDENTITY_MAP_SHA256",
              "SELECTOR_SHA256",
              "PREFIX427_SHA256",
          ]
          hashes = {}
          for key in keys:
              matches = re.findall(rf"^{key}=([0-9a-f]{{64}})$", plan, re.M)
              if len(matches) != 1:
                  raise SystemExit(f"plan authority count for {key}: {len(matches)}")
              hashes[key] = matches[0]

          m = re.search(r"Driver authority records template SHA-256\s*\n`([0-9a-f]{64})`", invalid)
          if not m:
              raise SystemExit("historical R11 template hash not found")
          historical_template_sha = m.group(1)

          if driver.count("TURN='M5-CP3-TB1-R11-R1-EXEC'") != 1:
              raise SystemExit("retry driver turn authority mismatch")
          restored = driver.replace(
              "TURN='M5-CP3-TB1-R11-R1-EXEC'",
              "TURN='M5-CP3-TB1-R11-EXEC'",
              1,
          )
          restored_sha = hashlib.sha256(restored.encode("utf-8")).hexdigest()
          if restored_sha != historical_template_sha:
              raise SystemExit(
                  f"retry driver differs beyond turn id: restored={restored_sha} historical={historical_template_sha}"
              )

          tree = ast.parse(driver)
          assignments = {}
          for node in tree.body:
              if isinstance(node, ast.Assign) and len(node.targets) == 1 and isinstance(node.targets[0], ast.Name):
                  name = node.targets[0].id
                  if name in {"MECHANISM", "FOCUSED", "PRODUCED", "CANDIDATE", "ROUTING", "SOURCE_SHA"}:
                      assignments[name] = ast.literal_eval(node.value)
          if len(assignments.get("MECHANISM", [])) != 9:
              raise SystemExit("mechanism plan count drift")
          if len(assignments.get("FOCUSED", [])) != 1:
              raise SystemExit("focused plan count drift")
          if len(assignments.get("PRODUCED", [])) != 6:
              raise SystemExit("produced plan count drift")
          if assignments.get("CANDIDATE") != 10713410215:
              raise SystemExit("candidate artifact drift")
          if assignments.get("ROUTING") != 10592987234:
              raise SystemExit("routing artifact drift")
          if assignments.get("SOURCE_SHA") != "8ff6fdc720b3e8da5c4f5765850f8fe69d4b2188":
              raise SystemExit("semantic source drift")

          proof = {
              "workflow_raw_sha256_literals": 0,
              "in_tree_manifest_temp": False,
              "copy_before_manifest_generation": True,
              "manifest_verification_fail_closed": True,
              "manifest_row_file_count_equality_present": True,
              "retry_driver_only_turn_id_changed_from_r11": True,
              "mechanism_count": 9,
              "focused_count": 1,
              "produced_count": 6,
              "selector_count": 430,
              "planned_processes": 446,
              "benchmark_count": 0,
              "candidate_artifact": 10713410215,
              "routing_artifact": 10592987234,
              "semantic_source": assignments["SOURCE_SHA"],
              "historical_r11_template_sha256": historical_template_sha,
              "authority_hash_keys": keys,
              "directional_runtime_execution": False,
          }
          out_path.write_text(json.dumps(proof, indent=2) + "\n", encoding="utf-8")
          PY

          env_file="${RUNNER_TEMP}/m5-cp3-cb13-r11-r1-sha.env"
          python3 - "$PLAN_FILE" "$env_file" <<'PY'
          import pathlib, re, sys
          plan = pathlib.Path(sys.argv[1]).read_text(encoding="utf-8")
          keys = [
              "CANDIDATE_SHA256",
              "ROOT_MANIFEST_SHA256",
              "SOURCE_ARCHIVE_SHA256",
              "ROUTING_SHA256",
              "IDENTITY_MAP_SHA256",
              "SELECTOR_SHA256",
              "PREFIX427_SHA256",
          ]
          rows = []
          for key in keys:
              match = re.search(rf"^{key}=([0-9a-f]{{64}})$", plan, re.M)
              if not match:
                  raise SystemExit(f"missing or invalid {key}")
              rows.append(f"{key}={match.group(1)}")
          pathlib.Path(sys.argv[2]).write_text("\n".join(rows) + "\n", encoding="utf-8")
          PY
          source "$env_file"
          rendered="${RUNNER_TEMP}/m5_cp3_tb1_r11_r1_exec.py"
          python3 .agents/Directional/tools/write_orchestration_payload.py             --template "$DRIVER_TEMPLATE"             --output "$rendered"             --sha256 "candidate=$CANDIDATE_SHA256"             --sha256 "root_manifest=$ROOT_MANIFEST_SHA256"             --sha256 "source_archive=$SOURCE_ARCHIVE_SHA256"             --sha256 "routing=$ROUTING_SHA256"             --sha256 "identity_map=$IDENTITY_MAP_SHA256"             --sha256 "selector=$SELECTOR_SHA256"             --sha256 "prefix427=$PREFIX427_SHA256"
          python3 - "$rendered" <<'PY'
          import pathlib, sys
          path = pathlib.Path(sys.argv[1])
          compile(path.read_text(encoding="utf-8"), str(path), "exec")
          PY

          synth="${RUNNER_TEMP}/m5-cp3-cb13-synthetic-result"
          authority="${RUNNER_TEMP}/m5-cp3-cb13-driver-authority.txt"
          manifest_tmp="${RUNNER_TEMP}/m5-cp3-cb13-SHA256SUMS.final"
          rm -rf "$synth"
          mkdir -p "$synth/nested"
          printf 'alpha\n' > "$synth/alpha.txt"
          printf 'beta\n' > "$synth/nested/beta.txt"
          printf 'driver-authority\n' > "$authority"
          cp "$authority" "$synth/driver-authority.txt"

          case "$manifest_tmp" in
            "$synth"/*)
              echo "synthetic manifest temp unexpectedly inside result" >&2
              exit 93
              ;;
          esac
          rm -f "$manifest_tmp"
          (
            set -euo pipefail
            cd "$synth"
            find . -type f ! -name SHA256SUMS -print0               | LC_ALL=C sort -z               | xargs -0 sha256sum > "$manifest_tmp"
            mv "$manifest_tmp" SHA256SUMS
            sha256sum -c SHA256SUMS
            manifest_rows="$(grep -cve '^$' SHA256SUMS)"
            actual_non_manifest="$(find . -type f ! -name SHA256SUMS | wc -l | tr -d ' ')"
            test "$manifest_rows" = "$actual_non_manifest"
            test "$manifest_rows" = "3"
            if grep -Fq "m5-cp3-cb13-SHA256SUMS.final" SHA256SUMS; then
              echo "external temporary manifest leaked into final manifest" >&2
              exit 94
            fi
          )

          printf 'tamper\n' >> "$synth/nested/beta.txt"
          if (cd "$synth" && sha256sum -c SHA256SUMS >/dev/null 2>&1); then
            echo "checksum mismatch did not fail closed" >&2
            exit 95
          fi

          printf 'late\n' > "$synth/late.txt"
          manifest_rows="$(grep -cve '^$' "$synth/SHA256SUMS")"
          actual_non_manifest="$(find "$synth" -type f ! -name SHA256SUMS | wc -l | tr -d ' ')"
          if [ "$manifest_rows" = "$actual_non_manifest" ]; then
            echo "synthetic count mismatch was not detected" >&2
            exit 96
          fi

          {
            echo "retry_workflow_schema_valid=${{ needs.validate-retry.outputs.valid }}"
            echo "self_workflow_schema_valid=${{ needs.validate-self.outputs.valid }}"
            echo "retry_driver_materialization=PASS"
            echo "synthetic_manifest_baseline=3/3"
            echo "synthetic_checksum_mismatch=DETECTED"
            echo "synthetic_count_mismatch=DETECTED"
            echo "directional_runtime_execution=false"
            echo "benchmark_execution=0"
            echo "configure_execution=0"
            echo "compile_execution=0"
            echo "relink_execution=0"
            echo "generated_discovery=0"
            echo "package_repair=0"
            echo "mode_repair=0"
          } > "$out/verification-summary.txt"
          cat "$out/static-proof.json"
          cat "$out/verification-summary.txt"
          git status --short

      - name: Upload CB13 static result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: directional-m5-cp3-cb13-static-result-${{ github.run_id }}
          path: ${{ runner.temp }}/M5-CP3-CB13-result
          if-no-files-found: error
          retention-days: 7

      - name: Record final static status
        if: always()
        shell: bash
        run: |
          set +e
          log="${RUNNER_TEMP}/${TURN_ID}.log"
          {
            echo "verify_outcome=${{ steps.verify.outcome }}"
            echo "final_job_status=${{ job.status }}"
            echo "finished_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } | tee -a "$log"

      - name: Upload diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: directional-m5-cp3-cb13-static-log-${{ github.run_id }}
          path: ${{ runner.temp }}/M5-CP3-CB13.log
          if-no-files-found: error
          retention-days: 7

      - name: Fail closed when CB13 verification failed
        if: always()
        shell: bash
        run: test "${{ steps.verify.outcome }}" = "success"
