name: M3 CP4c0 TB-R6 Artifact-Only Gate

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m3-cp4c0-tb-r6/run.txt

permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: m3-cp4c0-tb-r6-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/agent-m3-cp4c0-tb-r6.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m3-cp4c0-tb-r6
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  test-benchmark:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Initialize persistent activity log
        shell: bash
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/m3-cp4c0-tb-r6-activity.log"
          : > "$log"
          printf '%s\n' "workflow=$GITHUB_WORKFLOW" "run_id=$GITHUB_RUN_ID" "event=$GITHUB_EVENT_NAME" \
            "event_sha=$GITHUB_SHA" "ref=$GITHUB_REF" "repository=$GITHUB_REPOSITORY" \
            'turnBoundary=Test+Benchmark-artifact-only' 'configure=false' 'compile=false' 'relink=false' \
            'repair=false' 'generatedDiscovery=false' 'performanceBenchmark=false' \
            "started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" | tee -a "$log"

      - name: Checkout exact control source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          token: ${{ secrets.GH_TOKEN || github.token }}

      - name: Verify and stage immutable TB-R6 control payload
        shell: bash
        run: |
          set -euo pipefail
          p1='.agents/Directional/turn-payloads/m3-cp4c0-tb-r6-part1.py'
          p2='.agents/Directional/turn-payloads/m3-cp4c0-tb-r6-part2.py'
          test "$(sha256sum "$p1" | awk '{print $1}')" = '1fa8abf6fc2f328781fd76894bdc74bf5242f2aa670289a0affd8ad7fdaeaa3b'
          test "$(sha256sum "$p2" | awk '{print $1}')" = '6bd49f4c69a0584cae48f21f62047655ed8ec9edf956524e75c112d69dd37bb6'
          cat "$p1" "$p2" > "${RUNNER_TEMP}/m3-cp4c0-tb-r6.py"
          test "$(sha256sum "${RUNNER_TEMP}/m3-cp4c0-tb-r6.py" | awk '{print $1}')" = 'bb8dd60d8c1f54b8948cdd752268f1f0a6e15595411fff4e5912e7d4ca3b7b10'
          python3 -m py_compile "${RUNNER_TEMP}/m3-cp4c0-tb-r6.py"

      - name: Execute immutable artifact-only TB-R6 gate
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -uo pipefail
          log="${RUNNER_TEMP}/m3-cp4c0-tb-r6-activity.log"
          exec > >(tee -a "$log") 2>&1
          python3 "${RUNNER_TEMP}/m3-cp4c0-tb-r6.py"

      - name: Record final control status
        if: always()
        shell: bash
        run: |
          set +e
          printf '%s\n' "final_job_status=${{ job.status }}" "finished_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            | tee -a "${RUNNER_TEMP}/m3-cp4c0-tb-r6-activity.log"

      - name: Upload TB-R6 result evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-cp4c0-tb-r6-result-${{ github.run_id }}
          path: ${{ runner.temp }}/m3-cp4c0-tb-r6-result
          if-no-files-found: error
          retention-days: 7

      - name: Upload TB-R6 diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-cp4c0-tb-r6-log-${{ github.run_id }}
          path: ${{ runner.temp }}/m3-cp4c0-tb-r6-activity.log
          if-no-files-found: error
          retention-days: 7
