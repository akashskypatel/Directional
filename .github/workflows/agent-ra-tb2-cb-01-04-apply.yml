name: Agent R-A TB2 CB01-04 Apply

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/ra-tb2-cb-01-04-apply-20260812.txt

permissions:
  contents: write

concurrency:
  group: agent-ra-tb2-cb-01-04-apply-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Initialize persistent activity log
        shell: bash
        run: |
          set -euo pipefail
          : > "$RUNNER_TEMP/activity.log"
          printf '%s\n' \
            "workflow=$GITHUB_WORKFLOW" \
            "run_id=$GITHUB_RUN_ID" \
            "event=$GITHUB_EVENT_NAME" \
            "ref=$GITHUB_REF" \
            'turnBoundary=Code+Build-only' \
            'runtimeExecution=false' \
            'task=apply R-A-TB2-CB-01 through R-A-TB2-CB-04 source/test/static-audit patch' \
            | tee -a "$RUNNER_TEMP/activity.log"

      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/surface_cell_quad/p5-recover-bridge-healing
          fetch-depth: 0

      - name: Verify base and apply patch
        shell: bash
        env:
          BASE_SHA: 477e518a14232dd99f2136e0763114062194f336
          PATCH_SHA256: ef95732543af60c3bc2c9e97db6d0d1e97a48f716fedfe76c70b851b9101ef1b
        run: |
          set -euo pipefail
          exec > >(tee -a "$RUNNER_TEMP/activity.log") 2>&1
          trap 'rc=$?; echo "exit_code=$rc"; git status --porcelain=v1 || true; exit $rc' EXIT
          git merge-base --is-ancestor "$BASE_SHA" HEAD
          git diff --exit-code "$BASE_SHA"..HEAD -- \
            include/directional/diagnostics/RemeshDiagnostics.h \
            src/pipeline/RemeshPipeline.cpp \
            tests/SurfaceCellsPhase10Tests.cpp \
            .agents/Directional/R_A_Closure_Inventory.py \
            .agents/Directional/R_A_Closure_Inventory_Report.md
          base64 -d .agents/Directional/turn-payloads/ra-tb2-cb-01-04/patch.gz.b64 \
            > "$RUNNER_TEMP/patch.gz"
          gzip -dc "$RUNNER_TEMP/patch.gz" > "$RUNNER_TEMP/patch.diff"
          echo "$PATCH_SHA256  $RUNNER_TEMP/patch.diff" | sha256sum -c -
          if grep -Eq '^diff --git a/\.github/workflows/' "$RUNNER_TEMP/patch.diff"; then
            echo 'patch_contains_workflow_change=true'
            exit 1
          fi
          git apply --check "$RUNNER_TEMP/patch.diff"
          git apply "$RUNNER_TEMP/patch.diff"
          git diff --check
          python3 -m py_compile .agents/Directional/R_A_Closure_Inventory.py
          TERM=dumb python3 .agents/Directional/R_A_Closure_Inventory.py \
            --root . --output "$RUNNER_TEMP/inventory.md"
          cmp "$RUNNER_TEMP/inventory.md" \
            .agents/Directional/R_A_Closure_Inventory_Report.md
          git diff --name-only | sort > "$RUNNER_TEMP/changed-files.txt"
          cat > "$RUNNER_TEMP/expected-files.txt" <<'EOF'
          .agents/Directional/R_A_Closure_Inventory.py
          .agents/Directional/R_A_Closure_Inventory_Report.md
          include/directional/diagnostics/RemeshDiagnostics.h
          src/pipeline/RemeshPipeline.cpp
          tests/SurfaceCellsPhase10Tests.cpp
          EOF
          sort -o "$RUNNER_TEMP/expected-files.txt" "$RUNNER_TEMP/expected-files.txt"
          diff -u "$RUNNER_TEMP/expected-files.txt" "$RUNNER_TEMP/changed-files.txt"
          git status --porcelain=v1
          git diff --stat
          tail -24 "$RUNNER_TEMP/inventory.md"
          git config user.name 'Directional Agent'
          git config user.email 'directional-agent@users.noreply.github.com'
          git add \
            include/directional/diagnostics/RemeshDiagnostics.h \
            src/pipeline/RemeshPipeline.cpp \
            tests/SurfaceCellsPhase10Tests.cpp
          git add -f \
            .agents/Directional/R_A_Closure_Inventory.py \
            .agents/Directional/R_A_Closure_Inventory_Report.md
          git commit -m 'fix: remediate R-A retry2 aggregate authority blockers'
          SOURCE_SHA="$(git rev-parse HEAD)"
          echo "implementation_commit=$SOURCE_SHA" | tee "$RUNNER_TEMP/result.txt"
          echo 'runtimeExecution=false' | tee -a "$RUNNER_TEMP/result.txt"
          echo 'staticInventory=PASS' | tee -a "$RUNNER_TEMP/result.txt"
          git push origin HEAD:agent/surface_cell_quad/p5-recover-bridge-healing
          git status --porcelain=v1 | tee "$RUNNER_TEMP/source-status-final.txt"
          test ! -s "$RUNNER_TEMP/source-status-final.txt"

      - name: Upload apply result
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ra-tb2-cb-01-04-apply-result-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/result.txt
            ${{ runner.temp }}/changed-files.txt
            ${{ runner.temp }}/inventory.md
            ${{ runner.temp }}/source-status-final.txt
          if-no-files-found: error
          retention-days: 7

      - name: Upload persistent activity log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ra-tb2-cb-01-04-apply-log-${{ github.run_id }}
          path: ${{ runner.temp }}/activity.log
          if-no-files-found: error
          retention-days: 7
