name: M5 CP4 TB2 Closeout Docs Apply

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m5-cp4-tb2-docs-apply-20260924.txt

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

concurrency:
  group: m5-cp4-tb2-docs-apply-${{ github.ref }}
  cancel-in-progress: false

jobs:
  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m5-cp4-tb2-docs-apply
      commit_run_file: false
      trim_stale_comments: false
    secrets: inherit

  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/m5-cp4-tb2-docs-apply.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  apply:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1EibRwD5xmW_ocIKWsLYTE8IW8NJf7N4D
      patch_sha256: d527dda2702a7417c9c2de564cdefaeb30adb8197f573a8ac9bd41f135aaf092
      base_sha: 81b8e5d375a035b824df2cefb15e8f777db7b088
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: M5-CP4-TB2-EXEC closeout evidence
    secrets: inherit
