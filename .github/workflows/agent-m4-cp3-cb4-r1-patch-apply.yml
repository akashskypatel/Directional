name: Agent M4 CP3 CB4 R1 Patch Apply

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m4-cp3-cb4-r1-patch-apply.txt

permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

concurrency:
  group: agent-m4-cp3-cb4-r1-patch-apply
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/agent-m4-cp3-cb4-r1-patch-apply.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m4-cp3-cb4-r1-patch-apply
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  apply:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1X6JkAKwfgAq4SECzIm_e8bf2euMZZ3x1
      patch_sha256: 480214646c9cc7182440ad84ff49057e0955869ed47e96c3cc94c18de75b617f
      base_sha: c7ed09b42d4a7cd3a5a8b4ea5eacce6683eaa9c8
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: "M4-CP3-CB4-R1: publish exact A2b support and bind production A3"
    secrets: inherit
