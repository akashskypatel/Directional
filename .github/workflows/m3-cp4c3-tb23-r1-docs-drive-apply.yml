name: M3 CP4c3 TB23 R1 Docs Drive Apply

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m3-cp4c3-tb23-r1-docs-drive-apply/**

permissions:
  actions: read
  contents: write
  id-token: write
  issues: write
  pull-requests: write

concurrency:
  group: m3-cp4c3-tb23-r1-docs-drive-apply-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/m3-cp4c3-tb23-r1-docs-drive-apply.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m3-cp4c3-tb23-r1-docs-drive-apply
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  apply:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1GngfRtwfDhmcefjDmAzktMJz9R9l4VDJ
      patch_sha256: ee8034b8e9f0b6bd8980835ed15d3a7a40ea6231c623540d50f55f6fe1b34a03
      base_sha: b9d11255e5a644e2ac51442f6443be5e7998b6de
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: "docs: close TB23-R1 semantic red and route review"
    secrets: inherit
