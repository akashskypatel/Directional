name: Agent M4 CP-COND CB5 Drive Apply

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m4-cp-cond-cb5-drive-apply-20260913.txt

permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

concurrency:
  group: agent-m4-cp-cond-cb5-drive-apply-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/agent-m4-cp-cond-cb5-drive-apply.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m4-cp-cond-cb5-drive-apply
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  apply-drive-patch:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1GpMnIhO6cqWLDMM-GuKEdx54NmmT3TPS
      patch_sha256: '2ee65f4c80ca1789795a5ecdef1ecd9accb6575d14fdffe86929e8ad96dbef6a'
      base_sha: 26a3b6ccce5c6318644522c15969f0a4e5ac9919
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: 'test: prove independent CP-COND boundary truncation authority'
      retention_days: 14
    secrets: inherit
