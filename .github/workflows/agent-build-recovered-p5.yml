name: Agent P5 CB86-CB87 source edit

on:
  push:
    branches: [agent/surface_cell_quad/p5-recover-bridge-healing]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: agent-p5-cb86-cb87-${{ github.ref }}
  cancel-in-progress: true

jobs:
  edit:
    runs-on: ubuntu-latest
    steps:
      - name: Record source-edit start
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          gh api repos/${{ github.repository }}/issues/8/comments \
            -f body="P5-CB86/87 source-edit run ${RUN_ID} started for ${EVENT_SHA}. No project binary, test, benchmark, help/list, discovery, or custom mesh command executes."
      - uses: actions/checkout@v4
        with:
          ref: agent/surface_cell_quad/p5-recover-bridge-healing
          fetch-depth: 1
      - name: Apply source changes only
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_one(text, old, new, label):
              count = text.count(old)
              if count == 0 and new in text:
                  return text
              if count != 1:
                  raise RuntimeError(f"{label}: expected one old or existing new block, found {count}")
              return text.replace(old, new, 1)

          path = Path('src/geometry/SurfaceArrangement.cpp')
          text = path.read_text()
          old = "  for (SurfaceArrangementHalfedge &halfedge : complex.halfedges) {\n    std::sort("
          new = """  // Restore authoritative rail lineage by immutable source-arc identity
  // before primary provenance selection; never infer it from geometry.
  std::map<int, const SurfaceArrangementArc *> railArcs;
  for (const SurfaceArrangementArc &arc : inputArcs) {
    if (arc.id >= 0 && arc.railId >= 0) railArcs.emplace(arc.id, &arc);
  }
  const auto restoreRail = [&](SurfaceArrangementProvenance &p) {
    if (p.railId >= 0 || p.sourceArc < 0) return;
    const auto found = railArcs.find(p.sourceArc);
    if (found == railArcs.end()) return;
    const SurfaceArrangementArc &arc = *found->second;
    p.railId = arc.railId;
    p.curveId = arc.curveId;
    p.hardFeature = p.hardFeature || arc.hardFeature;
    p.featureClass = arc.featureClass;
    if (p.sourceComponent < 0) p.sourceComponent = arc.sourceComponent;
    if (p.sourceSheet < 0) p.sourceSheet = arc.sourceSheet;
    const double range = arc.railT1 - arc.railT0;
    p.railT0 = arc.railT0 + p.sourceT0 * range;
    p.railT1 = arc.railT0 + p.sourceT1 * range;
  };
  for (SurfaceArrangementNode &node : complex.nodes) {
    for (SurfaceArrangementNodeOccurrence &p : node.occurrences) {
      if (p.railId >= 0 || p.sourceArc < 0) continue;
      const auto found = railArcs.find(p.sourceArc);
      if (found == railArcs.end()) continue;
      const SurfaceArrangementArc &arc = *found->second;
      p.railId = arc.railId;
      p.curveId = arc.curveId;
      if (p.sourceComponent < 0) p.sourceComponent = arc.sourceComponent;
      if (p.sourceSheet < 0) p.sourceSheet = arc.sourceSheet;
      const double range = arc.railT1 - arc.railT0;
      p.railT0 = arc.railT0 + p.sourceT0 * range;
      p.railT1 = arc.railT0 + p.sourceT1 * range;
    }
  }
  for (SurfaceArrangementHalfedge &halfedge : complex.halfedges) {
    for (SurfaceArrangementProvenance &p : halfedge.provenance) restoreRail(p);
    std::sort("""
          path.write_text(replace_one(text, old, new, 'rail lineage'))

          path = Path('tests/PatchDescriptorMilestoneETests.cpp')
          text = path.read_text()
          old = """  // Keep edge 0 valid so the transaction appends a tentative node first.
  // Then remove common face support from edge 2's endpoint pair so its
  // midpoint embedding fails after mutation has begun.
  auto &badFrom =
      fixture.complex.nodes[static_cast<std::size_t>(badEdge.from)];
  auto &badTo =
      fixture.complex.nodes[static_cast<std::size_t>(badEdge.to)];
  badFrom.occurrences.clear();
  badTo.occurrences.clear();
  badFrom.sourceFace = badEdge.sourceFace;
  badTo.sourceFace =
      (badEdge.sourceFace + 1) % static_cast<int>(fixture.F.rows());
  badFrom.barycentric = Eigen::RowVector3d(0.2, 0.7, 0.1);
  badTo.barycentric = Eigen::RowVector3d(0.2, 0.1, 0.7);
"""
          new = """  // Preserve one exact common chart and scope, but make the finite
  // endpoint coordinates interpolate to a zero-sum barycentric midpoint.
  auto &badFrom =
      fixture.complex.nodes[static_cast<std::size_t>(badEdge.from)];
  auto &badTo =
      fixture.complex.nodes[static_cast<std::size_t>(badEdge.to)];
  badFrom.occurrences.clear();
  badTo.occurrences.clear();
  badFrom.sourceFace = badEdge.sourceFace;
  badTo.sourceFace = badEdge.sourceFace;
  badFrom.sourceComponent = badEdge.sourceComponent;
  badTo.sourceComponent = badEdge.sourceComponent;
  badFrom.sourceSheet = badEdge.sourceSheet;
  badTo.sourceSheet = badEdge.sourceSheet;
  badFrom.barycentric = Eigen::RowVector3d(1.0, 0.0, 0.0);
  badTo.barycentric = Eigen::RowVector3d(-1.0, 0.0, 0.0);
"""
          text = replace_one(text, old, new, 'invalid midpoint fixture')
          marker = "TEST(PatchDescriptorMilestoneE,\n     FailedSubdivisionReturnsBitExactCommittedComplex) {"
          extra = """TEST(PatchDescriptorMilestoneE,
     SubdivisionWithoutCommonSourceChartFailsBeforeMutation) {
  Fixture fixture = make_authoritative_patch({1, 1, 1, 1});
  const auto &badEdge = fixture.complex.halfedges[2];
  auto &a = fixture.complex.nodes[static_cast<std::size_t>(badEdge.from)];
  auto &b = fixture.complex.nodes[static_cast<std::size_t>(badEdge.to)];
  a.occurrences.clear();
  b.occurrences.clear();
  a.sourceFace = badEdge.sourceFace;
  b.sourceFace = (badEdge.sourceFace + 1) % fixture.F.rows();
  const std::uint64_t before =
      directional::geometry::surface_simplification_detail::
          complex_structural_hash(fixture.complex);
  const auto result = directional::geometry::subdivide_surface_cell_complex_edges(
      fixture.complex, {{2, 1}});
  ASSERT_FALSE(result.success);
  EXPECT_EQ("MissingCommonSourceChart", result.failure);
  EXPECT_TRUE(result.rollbackEquivalent);
  EXPECT_EQ(before, directional::geometry::surface_simplification_detail::
                        complex_structural_hash(result.complex));
}

"""
          if 'SubdivisionWithoutCommonSourceChartFailsBeforeMutation' not in text:
              text = replace_one(text, marker, extra + marker, 'missing chart test')
          path.write_text(text)

          path = Path('tests/MilestoneDClosureTests.cpp')
          text = path.read_text()
          old = """  for (const auto &[edge, metadata] : desired) {
    for (int face = 0; face < mesh.faces.rows(); ++face) {
      int localA = -1;
      int localB = -1;
      for (int corner = 0; corner < 3; ++corner) {
        if (mesh.faces(face, corner) == edge.first) localA = corner;
        if (mesh.faces(face, corner) == edge.second) localB = corner;
      }
      if (localA < 0 || localB < 0) continue;
      Eigen::RowVector3d a = Eigen::RowVector3d::Zero();
      Eigen::RowVector3d b = Eigen::RowVector3d::Zero();
      a[localA] = 1.0;
      b[localB] = 1.0;
      arcs.push_back(arc(id++, face, a, b, metadata.first, metadata.second));
    }
  }
"""
          new = """  for (const auto &[edge, metadata] : desired) {
    // Represent each source edge once instead of duplicating coincident arcs
    // independently in every incident triangle chart.
    int face = -1, localA = -1, localB = -1;
    for (int candidate = 0; candidate < mesh.faces.rows() && face < 0;
         ++candidate) {
      int a = -1, b = -1;
      for (int corner = 0; corner < 3; ++corner) {
        if (mesh.faces(candidate, corner) == edge.first) a = corner;
        if (mesh.faces(candidate, corner) == edge.second) b = corner;
      }
      if (a >= 0 && b >= 0) { face = candidate; localA = a; localB = b; }
    }
    if (face < 0) continue;
    Eigen::RowVector3d a = Eigen::RowVector3d::Zero();
    Eigen::RowVector3d b = Eigen::RowVector3d::Zero();
    a[localA] = 1.0;
    b[localB] = 1.0;
    arcs.push_back(arc(id++, face, a, b, metadata.first, metadata.second));
  }
"""
          text = replace_one(text, old, new, 'cylinder canonical arcs')
          old = """  ASSERT_TRUE(complex.diagnostics.topologyValid);
  ASSERT_EQ(complex.diagnostics.eulerCharacteristic, 0);
  ASSERT_EQ(complex.diagnostics.boundaryLoopCount, 2);
"""
          new = """  ASSERT_TRUE(directional::geometry::surface_simplification_detail::
                  validate_complex_incidence(complex));
  ASSERT_TRUE(complex.diagnostics.incidenceValid);
  ASSERT_TRUE(complex.diagnostics.embeddingValid);
  ASSERT_TRUE(complex.diagnostics.orientationValid);
  ASSERT_TRUE(complex.diagnostics.cellsDiskValid);
  ASSERT_TRUE(complex.diagnostics.topologyValid);
  ASSERT_EQ(complex.diagnostics.eulerCharacteristic, 0);
  ASSERT_EQ(complex.diagnostics.connectedComponentCount, 1);
  ASSERT_EQ(complex.diagnostics.boundaryLoopCount, 2);
"""
          path.write_text(replace_one(text, old, new, 'cylinder invariants'))
          PY
          if ! git diff --quiet; then
            git config user.name directional-agent
            git config user.email directional-agent@users.noreply.github.com
            git add src/geometry/SurfaceArrangement.cpp tests/PatchDescriptorMilestoneETests.cpp tests/MilestoneDClosureTests.cpp
            git commit -m 'fix(surface-cells): preserve rail lineage and repair fixtures'
            git push origin HEAD:agent/surface_cell_quad/p5-recover-bridge-healing
          fi
      - name: Record source-edit result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          JOB_STATUS: ${{ job.status }}
        run: |
          gh api repos/${{ github.repository }}/issues/8/comments \
            -f body="P5-CB86/87 source-edit run ${RUN_ID} finished ${JOB_STATUS}. No project binary, test, benchmark, help/list, discovery, or custom mesh command executed."
