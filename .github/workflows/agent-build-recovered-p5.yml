# One-shot route-complete structural-repair materialization and compile-only validation.
# This workflow never executes tests, benchmarks, or custom mesh binaries.
name: Agent Build Surface Cell P5 Route Complete

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
  workflow_dispatch:

concurrency:
  group: agent-surface-cell-p5-route-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  materialize-and-build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact working branch
        uses: actions/checkout@v4
        with:
          ref: agent/surface_cell_quad/p5-recover-bridge-healing
          fetch-depth: 2
          submodules: false

      - name: Materialize route-complete checkpoint
        id: source
        shell: bash
        run: |
          set -euo pipefail
          payload=.agents/Directional/p5-route-complete.patch.gz.b64
          tr -d '\r\n' < "${payload}" | base64 --decode | gzip --decompress > /tmp/p5-route-complete.patch
          echo 'dfcb96def9f0703727296b8f6185be5796b616fa5cd2dbb5dd482b02cdf5a7c1  /tmp/p5-route-complete.patch' | sha256sum --check -
          git apply --check /tmp/p5-route-complete.patch
          git apply /tmp/p5-route-complete.patch
          git rm "${payload}"
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add include/directional/diagnostics/RemeshDiagnostics.h \
                  include/directional/geometry/PatchDescriptor.h \
                  include/directional/pipeline/RemeshPipeline.h \
                  src/bench/DirectionalBenchmark.cpp \
                  src/geometry/PatchDescriptor.cpp \
                  src/pipeline/RemeshPipeline.cpp \
                  tests/PatchDescriptorMilestoneETests.cpp
          git diff --cached --check
          git commit -m 'fix(surface-cells): repair complete boundary routes [skip ci]'
          source_sha=$(git rev-parse HEAD)
          git push origin HEAD:agent/surface_cell_quad/p5-recover-bridge-healing
          echo "source_sha=${source_sha}" >> "${GITHUB_OUTPUT}"
          echo "${source_sha}" > /tmp/source-commit.txt

      - name: Record compile-only run start
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
        shell: bash
        run: |
          gh api repos/${{ github.repository }}/issues/8/comments \
            -f body="P5 route-complete compile-only run ${RUN_ID} started for exact source ${SOURCE_SHA}. It compiles and packages only; no tests, benchmarks, or custom meshes execute."

      - name: Fetch required submodules shallowly
        shell: bash
        run: |
          set -euo pipefail
          git submodule sync --recursive
          git submodule update --init --recursive --depth 1

      - name: Verify exact clean source
        env:
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${SOURCE_SHA}"
          test "${SOURCE_SHA}" = "$(git ls-remote origin refs/heads/agent/surface_cell_quad/p5-recover-bridge-healing | cut -f1)"
          git diff --check
          if git ls-files '.agents/Directional/p5-route-complete.patch.gz.b64' | grep -q .; then exit 1; fi
          git status --porcelain=v1 > /tmp/source-status.txt
          test ! -s /tmp/source-status.txt

      - name: Configure clean optimized static build
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build/agent-p5-route-release
          mkdir -p build/agent-p5-route-release
          cmake -S . -B build/agent-p5-route-release -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_FLAGS_RELEASE='-O2 -DNDEBUG' \
            -DBUILD_SHARED_LIBS=OFF \
            -DDIRECTIONAL_BUILD_TESTS=ON \
            -DDIRECTIONAL_BUILD_BENCHMARKS=ON \
            -DDIRECTIONAL_BUILD_CLI=OFF \
            -DDIRECTIONAL_BUILD_GUI=OFF \
            -DDIRECTIONAL_ENABLE_GMP=OFF \
            -DDIRECTIONAL_ENABLE_PARDISO=OFF \
            -DDIRECTIONAL_ENABLE_CUDSS=OFF \
            -DDIRECTIONAL_ENABLE_SUITESPARSE=OFF \
            2>&1 | tee build/agent-p5-route-release/configure.log

      - name: Compile required targets only
        shell: bash
        run: |
          set -euo pipefail
          cmake --build build/agent-p5-route-release \
            --target directional_core directional_pipeline directional_phase1_tests directional_benchmarks \
            -j 4 2>&1 | tee build/agent-p5-route-release/build.log

      - name: Package exact compiled checkpoint
        shell: bash
        run: |
          set -euo pipefail
          git status --porcelain=v1 > /tmp/source-status.txt
          test ! -s /tmp/source-status.txt
          mkdir -p artifact/bin artifact/lib artifact/source artifact/logs
          cp build/agent-p5-route-release/directional_phase1_tests artifact/bin/
          cp build/agent-p5-route-release/directional_benchmarks artifact/bin/
          cp build/agent-p5-route-release/libdirectional_core.a artifact/lib/
          cp build/agent-p5-route-release/libdirectional_pipeline.a artifact/lib/
          git archive --format=tar.gz --output=artifact/source/source.tar.gz HEAD
          cp /tmp/source-commit.txt artifact/source-commit.txt
          cp /tmp/source-status.txt artifact/source-status.txt
          git submodule status --recursive > artifact/submodule-status.txt
          cp build/agent-p5-route-release/configure.log artifact/logs/
          cp build/agent-p5-route-release/build.log artifact/logs/
          find artifact -type f -print0 | sort -z | xargs -0 sha256sum > artifact/files.sha256

      - name: Upload compiled checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: surface-cell-p5-route-complete-linux-release
          path: artifact
          if-no-files-found: error
          retention-days: 7

      - name: Record compile-only result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          gh api repos/${{ github.repository }}/issues/8/comments \
            -f body="P5 route-complete compile-only run ${RUN_ID} finished ${JOB_STATUS} for exact source ${SOURCE_SHA}. No tests, benchmarks, or custom meshes were executed."
