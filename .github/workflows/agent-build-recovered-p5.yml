# Compile-only workflow for the P5 CB58 memory-bounded global ownership frontier.
# It never executes tests, benchmarks, help/list commands, or custom meshes.
name: Agent Build Surface Cell P5 CB58 Memory Frontier

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths-ignore:
      - TODO
      - MILESTONE_G_TODO.md
      - '.agents/Directional/*.md'
      - 'benchmark-results/*.json'
  workflow_dispatch:

concurrency:
  group: agent-surface-cell-p5-cb58-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Record compile-only run start
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          EVENT_SHA: ${{ github.sha }}
        shell: bash
        run: |
          gh api repos/${{ github.repository }}/issues/8/comments \
            -f body="P5-CB51 through P5-CB58 memory-frontier compile-only run ${RUN_ID} started for event commit ${EVENT_SHA}. No tests, benchmarks, help/list commands, or custom meshes execute."

      - name: Checkout exact working branch
        uses: actions/checkout@v4
        with:
          ref: agent/surface_cell_quad/p5-recover-bridge-healing
          fetch-depth: 1
          submodules: false

      - name: Verify exact remote source
        shell: bash
        run: |
          set -euo pipefail
          local_sha=$(git rev-parse HEAD)
          remote_sha=$(git ls-remote origin refs/heads/agent/surface_cell_quad/p5-recover-bridge-healing | cut -f1)
          test "${local_sha}" = "${remote_sha}"
          echo "${local_sha}" > /tmp/source-commit.txt

      - name: Fetch required submodules shallowly
        shell: bash
        run: |
          set -euo pipefail
          git submodule sync --recursive
          git submodule update --init --recursive --depth 1

      - name: Verify clean checkpoint
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git status --porcelain=v1 > /tmp/source-status.txt
          test ! -s /tmp/source-status.txt

      - name: Configure clean optimized static build
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build/agent-p5-cb58-release
          mkdir -p build/agent-p5-cb58-release
          cmake -S . -B build/agent-p5-cb58-release -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_FLAGS_RELEASE='-O2 -DNDEBUG' \
            -DBUILD_SHARED_LIBS=OFF \
            -DDIRECTIONAL_BUILD_TESTS=ON \
            -DDIRECTIONAL_BUILD_BENCHMARKS=ON \
            -DDIRECTIONAL_BUILD_CLI=OFF \
            -DDIRECTIONAL_BUILD_GUI=OFF \
            -DDIRECTIONAL_ENABLE_GMP=OFF \
            -DDIRECTIONAL_ENABLE_PARDISO=OFF \
            -DDIRECTIONAL_ENABLE_CUDSS=OFF \
            -DDIRECTIONAL_ENABLE_SUITESPARSE=OFF \
            2>&1 | tee build/agent-p5-cb58-release/configure.log

      - name: Compile required targets only
        shell: bash
        run: |
          set -euo pipefail
          cmake --build build/agent-p5-cb58-release \
            --target directional_core directional_pipeline directional_phase1_tests directional_benchmarks \
            -j 4 2>&1 | tee build/agent-p5-cb58-release/build.log

      - name: Package exact compiled checkpoint
        shell: bash
        run: |
          set -euo pipefail
          git status --porcelain=v1 > /tmp/source-status.txt
          test ! -s /tmp/source-status.txt
          fixture_root=build/agent-p5-cb58-release/test-data/benchmarks/fixtures
          test -f "${fixture_root}/manifest.example.json"
          test -f "${fixture_root}/milestone_g_manifest.json"
          test -f "${fixture_root}/repo_regressions.json"
          test -f "${fixture_root}/milestone-g/bunny_1k_random.obj"
          mkdir -p artifact/bin artifact/lib artifact/source artifact/logs
          cp build/agent-p5-cb58-release/directional_phase1_tests artifact/bin/
          cp build/agent-p5-cb58-release/directional_benchmarks artifact/bin/
          cp -a build/agent-p5-cb58-release/test-data artifact/bin/
          cp build/agent-p5-cb58-release/libdirectional_core.a artifact/lib/
          cp build/agent-p5-cb58-release/libdirectional_pipeline.a artifact/lib/
          git archive --format=tar.gz --output=artifact/source/source.tar.gz HEAD
          cp /tmp/source-commit.txt artifact/source-commit.txt
          cp /tmp/source-status.txt artifact/source-status.txt
          git submodule status --recursive > artifact/submodule-status.txt
          cp build/agent-p5-cb58-release/configure.log artifact/logs/
          cp build/agent-p5-cb58-release/build.log artifact/logs/
          find artifact -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/files.sha256
          mv /tmp/files.sha256 artifact/files.sha256

      - name: Upload compiled checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: surface-cell-p5-cb58-memory-frontier-linux-release
          path: artifact
          if-no-files-found: error
          retention-days: 7

      - name: Record compile-only result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          EVENT_SHA: ${{ github.sha }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          gh api repos/${{ github.repository }}/issues/8/comments \
            -f body="P5-CB51 through P5-CB58 memory-frontier compile-only run ${RUN_ID} finished ${JOB_STATUS} for event commit ${EVENT_SHA}. No tests, benchmarks, help/list commands, or custom meshes were executed."
