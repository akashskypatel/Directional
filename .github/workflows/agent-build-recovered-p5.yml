name: Agent Build Surface Cell P5

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths-ignore:
      - TODO
      - MILESTONE_G_TODO.md
      - .agents/Directional/Milestone_G_P5_Duplicate_Stitched_Quad_Code_Build_Plan.md
  pull_request:
    branches:
      - surface_cell_quad
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact working branch
        uses: actions/checkout@v4
        with:
          ref: agent/surface_cell_quad/p5-recover-bridge-healing
          fetch-depth: 1
          submodules: false

      - name: Verify exact remote working-branch commit
        shell: bash
        run: |
          set -euo pipefail
          local_sha=$(git rev-parse HEAD)
          remote_sha=$(git ls-remote origin refs/heads/agent/surface_cell_quad/p5-recover-bridge-healing | cut -f1)
          test "${local_sha}" = "${remote_sha}"
          echo "${local_sha}" > /tmp/source-commit.txt

      - name: Fetch required submodules shallowly
        shell: bash
        run: |
          set -euo pipefail
          git submodule sync --recursive
          git submodule update --init --recursive --depth 1

      - name: Verify direct source checkpoint
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test -f TODO
          test -f MILESTONE_G_TODO.md
          test -f .agents/Directional/Surface_Cell_Backend_Remediation_Plan.md
          test -f benchmarks/fixtures/milestone-g/bunny_1k_random.obj
          if git ls-files '.agents/Directional/wip/*' | grep -q .; then
            echo 'Encoded WIP checkpoints remain tracked' >&2
            exit 1
          fi
          if git ls-files '.github/build-overlays/*' | grep -q .; then
            echo 'Build overlay patches remain tracked' >&2
            exit 1
          fi

      - name: Configure optimized static build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/agent-p5-release
          cmake -S . -B build/agent-p5-release -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_FLAGS_RELEASE='-O2 -DNDEBUG' \
            -DBUILD_SHARED_LIBS=OFF \
            -DDIRECTIONAL_BUILD_TESTS=ON \
            -DDIRECTIONAL_BUILD_BENCHMARKS=ON \
            -DDIRECTIONAL_BUILD_CLI=OFF \
            -DDIRECTIONAL_BUILD_GUI=OFF \
            -DDIRECTIONAL_ENABLE_GMP=OFF \
            -DDIRECTIONAL_ENABLE_PARDISO=OFF \
            -DDIRECTIONAL_ENABLE_CUDSS=OFF \
            -DDIRECTIONAL_ENABLE_SUITESPARSE=OFF \
            2>&1 | tee build/agent-p5-release/configure.log

      - name: Compile library tests and benchmarks
        shell: bash
        run: |
          set -euo pipefail
          cmake --build build/agent-p5-release \
            --target directional_core directional_pipeline \
                     directional_phase1_tests directional_benchmarks \
            -j 4 \
            2>&1 | tee build/agent-p5-release/build.log

      - name: Package compiled artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact/bin artifact/lib artifact/source artifact/logs
          cp -v build/agent-p5-release/directional_phase1_tests artifact/bin/
          cp -v build/agent-p5-release/directional_benchmarks artifact/bin/
          cp -v build/agent-p5-release/libdirectional_core.a artifact/lib/
          cp -v build/agent-p5-release/libdirectional_pipeline.a artifact/lib/
          git archive --format=tar.gz --output=artifact/source/source.tar.gz HEAD
          cp /tmp/source-commit.txt artifact/source-commit.txt
          git status --short > artifact/source-status.txt
          git submodule status --recursive > artifact/submodule-status.txt
          cp build/agent-p5-release/configure.log artifact/logs/
          cp build/agent-p5-release/build.log artifact/logs/
          find artifact -type f -print0 | sort -z | xargs -0 sha256sum > artifact/files.sha256

      - name: Upload compiled artifacts
        uses: actions/upload-artifact@v4
        with:
          name: surface-cell-p5-branch-linux-release
          path: artifact
          if-no-files-found: error
          retention-days: 7
