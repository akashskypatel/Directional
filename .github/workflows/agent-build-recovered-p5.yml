# One-shot source synchronization for P5-CB98.
# The workflow may modify only the seven declared source/test files.
name: Agent Apply Surface Cell P5 CB98 Source Patch

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/Directional/patches/P5_CB98_APPLY_READY
      - .github/workflows/agent-build-recovered-p5.yml
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: agent-p5-cb98-source-sync-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: agent/surface_cell_quad/p5-recover-bridge-healing
          fetch-depth: 0
          persist-credentials: true

      - name: Verify, apply, commit, and push source patch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          report_failure() {
            status=$?
            gh api repos/${{ github.repository }}/issues/8/comments \
              -f body="P5-CB98 source synchronization workflow ${RUN_ID} failed for ${EVENT_SHA}. No workflow file was modified, staged, committed, or pushed by the workflow." >/dev/null 2>&1 || true
            exit "${status}"
          }
          trap report_failure ERR

          gh api repos/${{ github.repository }}/issues/8/comments \
            -f body="P5-CB98 source synchronization workflow ${RUN_ID} started for ${EVENT_SHA}. It is restricted to seven declared source/test files and will not modify, stage, commit, or push any workflow file."

          test "$(git rev-parse HEAD)" = "${EVENT_SHA}"
          remote_sha=$(git ls-remote origin refs/heads/agent/surface_cell_quad/p5-recover-bridge-healing | cut -f1)
          test "${remote_sha}" = "${EVENT_SHA}"
          test -z "$(git status --porcelain=v1)"

          root=.agents/Directional/patches
          encoded=/tmp/p5-cb98.patch.gz.b64
          compressed=/tmp/p5-cb98.patch.gz
          patch=/tmp/p5-cb98.patch
          expected=/tmp/p5-cb98.expected
          actual=/tmp/p5-cb98.actual

          cat \
            "${root}/p5-cb98-remaining.patch.gz.b64.part00" \
            "${root}/p5-cb98-remaining.patch.gz.b64.part01" \
            "${root}/p5-cb98-remaining.patch.gz.b64.part02" \
            "${root}/p5-cb98-remaining.patch.gz.b64.part03" \
            > "${encoded}"

          printf '%s  %s\n' \
            f41c94c0de85a1ab37a2b6cb8bfaa062623df482289c2f06eaf93bf2225512fb \
            "${encoded}" | sha256sum --check
          base64 --decode "${encoded}" > "${compressed}"
          printf '%s  %s\n' \
            ea4d16a2cef572c1ee8e245b88c51cdfe8ce780effa7b612cd5db2ad373da2e8 \
            "${compressed}" | sha256sum --check
          gzip --decompress --stdout "${compressed}" > "${patch}"
          test "$(wc -c < "${patch}")" -eq 106126
          printf '%s  %s\n' \
            cbea5cf99ac2bf089a73ae0f698e1e92e613ab6218995fa62769d8dc3af737d8 \
            "${patch}" | sha256sum --check

          printf '%s\n' \
            src/bench/DirectionalBenchmark.cpp \
            src/geometry/PatchDescriptor.cpp \
            src/geometry/SurfaceArrangement.cpp \
            src/geometry/SurfaceComplexSimplification.cpp \
            src/pipeline/RemeshPipeline.cpp \
            tests/PatchDescriptorMilestoneETests.cpp \
            tests/SurfaceCellPipelinePhase20Tests.cpp \
            > "${expected}"

          git apply --numstat "${patch}" | cut -f3- | sort -u > "${actual}"
          diff -u "${expected}" "${actual}"
          ! grep -Eq '(^|/)\.github/workflows/' "${actual}"
          ! grep -E '^(diff --git|--- |\+\+\+ )' "${patch}" | grep -F '.github/workflows/'

          git apply --check "${patch}"
          git apply "${patch}"
          git diff --check
          git diff --name-only | sort -u > "${actual}"
          diff -u "${expected}" "${actual}"
          test -z "$(git diff --name-only -- .github/workflows)"

          git config user.name directional-agent
          git config user.email directional-agent@users.noreply.github.com
          xargs -d '\n' git add -- < "${expected}"
          git diff --cached --name-only | sort -u > "${actual}"
          diff -u "${expected}" "${actual}"
          test -z "$(git diff --cached --name-only -- .github/workflows)"

          git commit -m 'fix(surface-cells): apply P5-CB98 remaining source patch'
          applied_sha=$(git rev-parse HEAD)
          git push origin HEAD:refs/heads/agent/surface_cell_quad/p5-recover-bridge-healing

          trap - ERR
          gh api repos/${{ github.repository }}/issues/8/comments \
            -f body="P5-CB98 source synchronization workflow ${RUN_ID} finished success. Event commit: ${EVENT_SHA}. Applied source commit: ${applied_sha}. No workflow file was modified, staged, committed, or pushed by the workflow."
