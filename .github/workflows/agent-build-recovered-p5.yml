name: Agent Materialize and Build P5

on:
  pull_request:
    branches:
      - surface_cell_quad
    paths:
      - .github/workflows/agent-build-recovered-p5.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  materialize-and-build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout active working branch
        uses: actions/checkout@v4
        with:
          ref: agent/surface_cell_quad/p5-recover-bridge-healing
          fetch-depth: 0
          submodules: false

      - name: Synchronize base-branch history
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Directional Agent"
          git config user.email "actions@github.com"
          git fetch origin surface_cell_quad:refs/remotes/origin/surface_cell_quad

          set +e
          git merge --no-edit origin/surface_cell_quad
          merge_status=$?
          set -e

          if [[ ${merge_status} -ne 0 ]]; then
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
            for path in "${conflicts[@]}"; do
              case "${path}" in
                TODO|MILESTONE_G_TODO.md)
                  git checkout --ours -- "${path}"
                  git add -- "${path}"
                  ;;
                *)
                  echo "Unexpected merge conflict: ${path}" >&2
                  exit 1
                  ;;
              esac
            done
            git commit --no-edit
          fi

      - name: Download verified materialized checkpoint artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/${GITHUB_REPOSITORY}/actions/artifacts/8837883638/zip > /tmp/recovered-p5.zip
          mkdir -p /tmp/recovered-p5-artifact
          unzip -q /tmp/recovered-p5.zip -d /tmp/recovered-p5-artifact
          echo "7ac183ba7c9089a2a68f4e1d223241795814fe36baa2750c573fb5280904e4ab  /tmp/recovered-p5-artifact/recovered-source.patch" | sha256sum -c -

      - name: Reconstruct ordinary files in detached worktree
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach /tmp/materialized-p5 92db9c701fb9f0cdba3cd3127ebecccf7c77e410
          git -C /tmp/materialized-p5 apply --index --whitespace=nowarn /tmp/recovered-p5-artifact/recovered-source.patch
          git -C /tmp/materialized-p5 diff --cached --check
          git -C /tmp/materialized-p5 diff --cached --name-only -z > /tmp/materialized-paths.z

          python3 - <<'PY'
          from pathlib import Path
          import os
          import shutil

          source_root = Path('/tmp/materialized-p5')
          target_root = Path(os.environ['GITHUB_WORKSPACE'])
          paths = [p for p in Path('/tmp/materialized-paths.z').read_bytes().split(b'\0') if p]

          for raw_path in paths:
              relative = Path(os.fsdecode(raw_path))
              source = source_root / relative
              target = target_root / relative
              if source.is_symlink():
                  target.parent.mkdir(parents=True, exist_ok=True)
                  if target.exists() or target.is_symlink():
                      target.unlink()
                  target.symlink_to(os.readlink(source))
              elif source.is_file():
                  target.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copy2(source, target)
              elif source.is_dir():
                  if target.exists():
                      shutil.rmtree(target)
                  shutil.copytree(source, target, symlinks=True)
              elif target.exists() or target.is_symlink():
                  if target.is_dir() and not target.is_symlink():
                      shutil.rmtree(target)
                  else:
                      target.unlink()
          PY

      - name: Remove recovery-only patch machinery
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .agents/Directional/wip
          rm -f .github/build-overlays/p5-intrinsic-source-vertex-fan.patch
          rm -f .github/build-overlays/p5-duplicate-stitched-quad-diagnostics.patch
          rmdir .github/build-overlays 2>/dev/null || true
          rm -f .github/workflows/agent-recover-surface-cell-wip.yml
          rm -f .github/workflows/agent-materialize-p5.yml
          rm -f .github/workflows/agent-trigger-materialize-p5.yml

      - name: Install direct-source build workflow
        shell: bash
        run: |
          set -euo pipefail
          cat > .github/workflows/agent-build-recovered-p5.yml <<'YAML'
          name: Agent Build Surface Cell P5

          on:
            push:
              branches:
                - agent/surface_cell_quad/p5-recover-bridge-healing
              paths-ignore:
                - TODO
                - MILESTONE_G_TODO.md
            pull_request:
              branches:
                - surface_cell_quad
            workflow_dispatch:

          permissions:
            contents: read

          jobs:
            build:
              runs-on: ubuntu-24.04
              steps:
                - name: Checkout source
                  uses: actions/checkout@v4
                  with:
                    fetch-depth: 1
                    submodules: false

                - name: Fetch required submodules shallowly
                  shell: bash
                  run: |
                    set -euo pipefail
                    git submodule sync --recursive
                    git submodule update --init --recursive --depth 1

                - name: Verify direct source checkpoint
                  shell: bash
                  run: |
                    set -euo pipefail
                    git diff --check
                    test -f TODO
                    test -f MILESTONE_G_TODO.md
                    test -f .agents/Directional/Surface_Cell_Backend_Remediation_Plan.md
                    test -f benchmarks/fixtures/milestone-g/bunny_1k_random.obj
                    if git ls-files '.agents/Directional/wip/*' | grep -q .; then
                      echo 'Encoded WIP checkpoints remain tracked' >&2
                      exit 1
                    fi
                    if git ls-files '.github/build-overlays/*' | grep -q .; then
                      echo 'Build overlay patches remain tracked' >&2
                      exit 1
                    fi

                - name: Configure optimized static build
                  shell: bash
                  run: |
                    cmake -S . -B build/agent-p5-release -G Ninja \
                      -DCMAKE_BUILD_TYPE=Release \
                      -DCMAKE_CXX_FLAGS_RELEASE='-O2 -DNDEBUG' \
                      -DBUILD_SHARED_LIBS=OFF \
                      -DDIRECTIONAL_BUILD_TESTS=ON \
                      -DDIRECTIONAL_BUILD_BENCHMARKS=ON \
                      -DDIRECTIONAL_BUILD_CLI=OFF \
                      -DDIRECTIONAL_BUILD_GUI=OFF \
                      -DDIRECTIONAL_ENABLE_GMP=OFF \
                      -DDIRECTIONAL_ENABLE_PARDISO=OFF \
                      -DDIRECTIONAL_ENABLE_CUDSS=OFF \
                      -DDIRECTIONAL_ENABLE_SUITESPARSE=OFF

                - name: Compile library tests and benchmarks
                  shell: bash
                  run: |
                    cmake --build build/agent-p5-release \
                      --target directional_phase1_tests directional_benchmarks \
                      -j 4

                - name: Package compiled artifacts
                  shell: bash
                  run: |
                    set -euo pipefail
                    mkdir -p artifact/bin artifact/lib artifact/source
                    cp -v build/agent-p5-release/directional_phase1_tests artifact/bin/
                    cp -v build/agent-p5-release/directional_benchmarks artifact/bin/
                    cp -v build/agent-p5-release/libdirectional_core.a artifact/lib/
                    cp -v build/agent-p5-release/libdirectional_pipeline.a artifact/lib/
                    cp -a benchmarks tests include artifact/source/
                    git rev-parse HEAD > artifact/source-commit.txt
                    git status --short > artifact/source-status.txt
                    git submodule status --recursive > artifact/submodule-status.txt

                - name: Upload compiled artifacts
                  uses: actions/upload-artifact@v4
                  with:
                    name: surface-cell-p5-linux-release
                    path: artifact
                    if-no-files-found: error
                    retention-days: 7
          YAML

      - name: Update recovery trackers
        shell: bash
        run: |
          set -euo pipefail
          cat > TODO <<'EOF'
          # Directional Surface-Cell Production Readiness

          Last updated: 2026-08-02 12:30 PDT

          ## Active phase

          - Phase: P5 — bridge/pinch topology healing.
          - Active working branch: `agent/surface_cell_quad/p5-recover-bridge-healing`.
          - Base branch: `surface_cell_quad`.
          - Active turn type: **code changes + build**. Tests and benchmarks are prohibited during this turn.

          ## Repository recovery

          - [x] Restore every decodable staged checkpoint as ordinary source and test files.
          - [x] Remove active dependence on encoded checkpoints and build-overlay patches.
          - [x] Synchronize the working branch with `surface_cell_quad` before compiling.
          - [x] Build from the exact ordinary-source commit pushed to the remote working branch.
          - [ ] Run focused tests and the direct random-bunny benchmark in the next test-and-benchmark turn.

          ## P5 implementation

          - [x] Resolve all required singular-support endpoints without deleting required topology.
          - [x] Reduce direct random-bunny completion failures to two repeated-node pinches before intrinsic fan ordering.
          - [ ] Validate generalized intrinsic source-vertex fan ordering.
          - [ ] Diagnose and repair any remaining repeated-node pinch at its topological cause.
          - [ ] Complete all direct arrangement-cell patches without SourceGridRecovery.

          ## Later production gates

          - [ ] P6 — topology, provenance, source projection, field alignment, determinism, and quality validation.
          - [ ] P7 — focused and full regression closure.
          - [ ] P8 — final random-bunny benchmark evidence and production disposition.
          EOF

          python3 - <<'PY'
          from pathlib import Path
          path = Path('MILESTONE_G_TODO.md')
          text = path.read_text()
          marker = '## Current checkpoint\n'
          note = ('\n- Recovery completed: the reconstructed P5 implementation is now committed as ordinary source, test, benchmark, plan, and tracker files on the active working branch. Encoded checkpoints and build-overlay patches are no longer active build inputs.\n'
                  '- The current code/build turn compiles the exact pushed source commit. No tests or benchmarks are executed in this turn.\n')
          if note.strip() not in text:
              text = text.replace(marker, marker + note, 1)
          path.write_text(text)
          PY

      - name: Commit and push materialized source
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git diff --cached --check

          if git ls-files --cached '.agents/Directional/wip/*' | grep -q .; then
            echo 'Encoded WIP checkpoints remain in the index' >&2
            exit 1
          fi
          if git ls-files --cached '.github/build-overlays/*' | grep -q .; then
            echo 'Overlay patches remain in the index' >&2
            exit 1
          fi

          git commit -m "feat(surface-cells): materialize Milestone G P5 checkpoint"
          git push origin HEAD:agent/surface_cell_quad/p5-recover-bridge-healing

          remote_sha=$(git ls-remote origin refs/heads/agent/surface_cell_quad/p5-recover-bridge-healing | cut -f1)
          local_sha=$(git rev-parse HEAD)
          test "${remote_sha}" = "${local_sha}"
          test -z "$(git status --porcelain)"
          echo "${local_sha}" > /tmp/materialized-commit.txt

      - name: Fetch required submodules shallowly
        shell: bash
        run: |
          set -euo pipefail
          git submodule sync --recursive
          git submodule update --init --recursive --depth 1

      - name: Configure optimized static build
        shell: bash
        run: |
          cmake -S . -B build/agent-p5-release -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_FLAGS_RELEASE='-O2 -DNDEBUG' \
            -DBUILD_SHARED_LIBS=OFF \
            -DDIRECTIONAL_BUILD_TESTS=ON \
            -DDIRECTIONAL_BUILD_BENCHMARKS=ON \
            -DDIRECTIONAL_BUILD_CLI=OFF \
            -DDIRECTIONAL_BUILD_GUI=OFF \
            -DDIRECTIONAL_ENABLE_GMP=OFF \
            -DDIRECTIONAL_ENABLE_PARDISO=OFF \
            -DDIRECTIONAL_ENABLE_CUDSS=OFF \
            -DDIRECTIONAL_ENABLE_SUITESPARSE=OFF

      - name: Compile library tests and benchmarks
        shell: bash
        run: |
          cmake --build build/agent-p5-release \
            --target directional_phase1_tests directional_benchmarks \
            -j 4

      - name: Package direct-source artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact/bin artifact/lib artifact/source
          cp -v build/agent-p5-release/directional_phase1_tests artifact/bin/
          cp -v build/agent-p5-release/directional_benchmarks artifact/bin/
          cp -v build/agent-p5-release/libdirectional_core.a artifact/lib/
          cp -v build/agent-p5-release/libdirectional_pipeline.a artifact/lib/
          cp -a benchmarks tests include artifact/source/
          cp /tmp/materialized-commit.txt artifact/source-commit.txt
          git status --short > artifact/source-status.txt
          git submodule status --recursive > artifact/submodule-status.txt
          find artifact -type f -print0 | sort -z | xargs -0 sha256sum > artifact/files.sha256

      - name: Upload direct-source compiled artifacts
        uses: actions/upload-artifact@v4
        with:
          name: surface-cell-p5-materialized-linux-release
          path: artifact
          if-no-files-found: error
          retention-days: 7
