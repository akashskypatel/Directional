# One-shot P5 same-corner source materialization and compile-only validation.
# This workflow never executes a test, benchmark, or custom mesh binary.
name: Agent Build Surface Cell P5 Same Corner

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
  workflow_dispatch:

concurrency:
  group: agent-surface-cell-p5-same-corner-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  apply-and-build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact working branch
        uses: actions/checkout@v4
        with:
          ref: agent/surface_cell_quad/p5-recover-bridge-healing
          fetch-depth: 2
          submodules: false

      - name: Materialize exact same-corner source checkpoint
        id: source
        shell: bash
        run: |
          set -euo pipefail
          payload=.agents/Directional/p5-same-corner-code.patch.gz.b64
          workflow=.github/workflows/agent-build-recovered-p5.yml
          cat "${payload}" "${payload}.part1" "${payload}.part2" \
              "${payload}.part3" "${payload}.part4" "${payload}.part5" \
            | tr -d '\r\n' \
            | base64 --decode \
            | gzip --decompress > /tmp/p5-same-corner.patch
          echo '5a94c30107e5b35131d008bdf3f3b58f74b419307b310d1257ab1767134c30c6  /tmp/p5-same-corner.patch' | sha256sum --check -
          git apply --check /tmp/p5-same-corner.patch
          git apply /tmp/p5-same-corner.patch
          git rm "${payload}" "${payload}.part1" "${payload}.part2" \
                 "${payload}.part3" "${payload}.part4" "${payload}.part5"
          git fetch --depth=1 origin a9845cccf29c5013afaba42d198011171c3afa9e
          git checkout a9845cccf29c5013afaba42d198011171c3afa9e -- "${workflow}"
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add include/directional/diagnostics/RemeshDiagnostics.h \
                  include/directional/geometry/PatchDescriptor.h \
                  include/directional/geometry/PureQuadCompletion.h \
                  include/directional/geometry/SurfaceCellOwnership.h \
                  include/directional/pipeline/RemeshPipeline.h \
                  src/bench/DirectionalBenchmark.cpp \
                  src/geometry/PatchDescriptor.cpp \
                  src/geometry/PureQuadCompletion.cpp \
                  src/pipeline/RemeshPipeline.cpp \
                  tests/PatchDescriptorMilestoneETests.cpp \
                  tests/PureQuadCompletionPhase18Tests.cpp \
                  "${workflow}"
          git diff --cached --check
          git commit -m 'feat(surface-cells): repair same-corner boundary claims'
          source_sha=$(git rev-parse HEAD)
          git push origin HEAD:agent/surface_cell_quad/p5-recover-bridge-healing
          echo "source_sha=${source_sha}" >> "${GITHUB_OUTPUT}"
          echo "${source_sha}" > /tmp/source-commit.txt

      - name: Record compile-only run start on draft PR
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
        shell: bash
        run: |
          gh api repos/${{ github.repository }}/issues/8/comments \
            -f body="P5 same-corner compile-only run ${RUN_ID} started for exact source ${SOURCE_SHA}. This workflow compiles and packages only; it executes no tests, benchmarks, or custom meshes."

      - name: Fetch required submodules shallowly
        shell: bash
        run: |
          set -euo pipefail
          git submodule sync --recursive
          git submodule update --init --recursive --depth 1

      - name: Verify exact committed source checkpoint
        env:
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${SOURCE_SHA}"
          remote_sha=$(git ls-remote origin refs/heads/agent/surface_cell_quad/p5-recover-bridge-healing | cut -f1)
          test "${SOURCE_SHA}" = "${remote_sha}"
          git diff --check
          test -f TODO
          test -f MILESTONE_G_TODO.md
          test -f .agents/Directional/Milestone_G_P5_Assembly_Conflict_Code_Build_Plan.md
          test -f benchmarks/fixtures/milestone-g/bunny_1k_random.obj
          if git ls-files '.agents/Directional/*patch.gz.b64*' | grep -q .; then
            echo 'Transient encoded patch remains tracked' >&2
            exit 1
          fi
          if git ls-files '.agents/Directional/wip/*' | grep -q .; then
            echo 'Encoded WIP checkpoints remain tracked' >&2
            exit 1
          fi
          git status --porcelain=v1 > /tmp/source-status.txt
          test ! -s /tmp/source-status.txt

      - name: Configure clean optimized static build
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build/agent-p5-same-corner-release
          mkdir -p build/agent-p5-same-corner-release
          cmake -S . -B build/agent-p5-same-corner-release -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_FLAGS_RELEASE='-O2 -DNDEBUG' \
            -DBUILD_SHARED_LIBS=OFF \
            -DDIRECTIONAL_BUILD_TESTS=ON \
            -DDIRECTIONAL_BUILD_BENCHMARKS=ON \
            -DDIRECTIONAL_BUILD_CLI=OFF \
            -DDIRECTIONAL_BUILD_GUI=OFF \
            -DDIRECTIONAL_ENABLE_GMP=OFF \
            -DDIRECTIONAL_ENABLE_PARDISO=OFF \
            -DDIRECTIONAL_ENABLE_CUDSS=OFF \
            -DDIRECTIONAL_ENABLE_SUITESPARSE=OFF \
            2>&1 | tee build/agent-p5-same-corner-release/configure.log

      - name: Compile required targets only
        shell: bash
        run: |
          set -euo pipefail
          cmake --build build/agent-p5-same-corner-release \
            --target directional_core directional_pipeline \
                     directional_phase1_tests directional_benchmarks \
            -j 4 \
            2>&1 | tee build/agent-p5-same-corner-release/build.log

      - name: Package exact compiled checkpoint
        shell: bash
        run: |
          set -euo pipefail
          git status --porcelain=v1 > /tmp/source-status.txt
          if [[ -s /tmp/source-status.txt ]]; then
            echo 'Source checkpoint is not clean before packaging:' >&2
            cat /tmp/source-status.txt >&2
            exit 1
          fi
          mkdir -p artifact/bin artifact/lib artifact/source artifact/logs
          cp -v build/agent-p5-same-corner-release/directional_phase1_tests artifact/bin/
          cp -v build/agent-p5-same-corner-release/directional_benchmarks artifact/bin/
          cp -v build/agent-p5-same-corner-release/libdirectional_core.a artifact/lib/
          cp -v build/agent-p5-same-corner-release/libdirectional_pipeline.a artifact/lib/
          git archive --format=tar.gz --output=artifact/source/source.tar.gz HEAD
          cp /tmp/source-commit.txt artifact/source-commit.txt
          cp /tmp/source-status.txt artifact/source-status.txt
          git submodule status --recursive > artifact/submodule-status.txt
          cp build/agent-p5-same-corner-release/configure.log artifact/logs/
          cp build/agent-p5-same-corner-release/build.log artifact/logs/
          find artifact -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/files.sha256
          mv /tmp/files.sha256 artifact/files.sha256

      - name: Upload compiled checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: surface-cell-p5-same-corner-linux-release
          path: artifact
          if-no-files-found: error
          retention-days: 7

      - name: Record compile-only result on draft PR
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          gh api repos/${{ github.repository }}/issues/8/comments \
            -f body="P5 same-corner compile-only run ${RUN_ID} finished with status ${JOB_STATUS} for exact source ${SOURCE_SHA}. No tests, benchmarks, or custom meshes were executed."
