name: M4 CP SCALE CB13 Drive Apply

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m4-cp-scale-cb13-drive-apply.txt

permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

concurrency:
  group: m4-cp-scale-cb13-drive-apply-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/m4-cp-scale-cb13-drive-apply.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m4-cp-scale-cb13-drive-apply
      commit_run_file: false
    secrets: inherit

  apply:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1_tOmPeXhIz-2sqzOZhmoW1QWlj6pfNV5
      patch_sha256: 40fedd0b995b7c64d9d166cb5db9296fc0ff6d81b96ab4217cf74a3cc833705a
      base_sha: 8e73d23074e925e2d69e6f2154266a8b26e1bd3d
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: 'test: add M4-CP-SCALE S5 genus-two witness'
    secrets: inherit
