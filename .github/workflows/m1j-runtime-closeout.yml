name: m1j-runtime-closeout

on:
  push:
    paths:
      - '.agents/connector-triggers/m1j-runtime-closeout'

permissions:
  contents: write

concurrency:
  group: m1j-runtime-closeout-${{ github.ref }}
  cancel-in-progress: false

jobs:
  closeout:
    runs-on: ubuntu-24.04
    steps:
      - name: Initialize persistent activity log
        shell: bash
        run: |
          set -Eeuo pipefail
          LOG="$RUNNER_TEMP/m1j-runtime-closeout.log"
          printf '%s\n' \
            'turn=M1j immutable Test+Benchmark durable closeout' \
            "event_sha=$GITHUB_SHA" \
            'sourceEdit=false' 'testEdit=false' 'buildEdit=false' \
            "started_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)" > "$LOG"
          echo "LOG=$LOG" >> "$GITHUB_ENV"

      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/surface_cell_quad/p5-recover-bridge-healing
          fetch-depth: 50

      - name: Apply surgical durable updates
        shell: bash
        run: |
          set -Eeuo pipefail
          exec > >(tee -a "$LOG") 2>&1
          trap 'rc=$?; echo "step=durable-update exit_code=$rc"; git status --short --branch || true; exit $rc' EXIT
          test -f .agents/Directional/turn-payloads/m1j-runtime-closeout.py
          sed -i 's/Code_Build_Plan\.md`\.  /Code_Build_Plan.md`./' .agents/Directional/turn-payloads/m1j-runtime-closeout.py
          python3 .agents/Directional/turn-payloads/m1j-runtime-closeout.py
          git diff --check
          changed=$(git diff --name-only | LC_ALL=C sort)
          printf '%s\n' "$changed"
          expected=$(printf '%s\n' \
            .agents/Directional/Future_Chat_Session_Handoff.md \
            .agents/Directional/REORIENTATION_PLAN.md \
            .agents/Directional/Regression_Root_Cause_Tracker.md \
            .agents/Directional/turn-payloads/m1j-runtime-closeout.py \
            MILESTONE_G_TODO.md \
            TODO | LC_ALL=C sort)
          test "$changed" = "$expected"
          git diff --stat
          git diff -- .agents/Directional/Future_Chat_Session_Handoff.md | head -n 160
          git diff -- TODO | head -n 100
          grep -F 'M1a through M1j are immutable accepted' .agents/Directional/Future_Chat_Session_Handoff.md >/dev/null
          grep -F 'M1k Phase-Front Edge Topology-Region Consumer — Code + Build only' .agents/Directional/Future_Chat_Session_Handoff.md >/dev/null
          grep -F 'M1a through M1j immutable accepted; M1k edge topology-region consumer selected for Code + Build' TODO >/dev/null
          grep -F 'M1j phase-front edge source-scope consumer [accepted]' .agents/Directional/REORIENTATION_PLAN.md >/dev/null
          grep -F 'M1k phase-front edge topology-region consumer [selected; Code + Build next]' .agents/Directional/REORIENTATION_PLAN.md >/dev/null
          grep -F 'M1j edge source-scope migration is immutable accepted' .agents/Directional/Regression_Root_Cause_Tracker.md >/dev/null
          grep -F 'M1a through M1j architecture slices are immutable accepted' MILESTONE_G_TODO.md >/dev/null

      - name: Commit and push durable closeout
        shell: bash
        run: |
          set -Eeuo pipefail
          exec > >(tee -a "$LOG") 2>&1
          trap 'rc=$?; echo "step=commit-push exit_code=$rc"; git status --short --branch || true; exit $rc' EXIT
          git config user.name 'OpenAI Directional Agent'
          git config user.email 'directional-agent@users.noreply.github.com'
          git add -f .agents/Directional/Future_Chat_Session_Handoff.md .agents/Directional/REORIENTATION_PLAN.md .agents/Directional/Regression_Root_Cause_Tracker.md
          git add MILESTONE_G_TODO.md TODO
          git commit -m 'docs: close M1j immutable acceptance and select M1k'
          commit=$(git rev-parse HEAD)
          git push origin HEAD:agent/surface_cell_quad/p5-recover-bridge-healing
          echo "closeout_commit=$commit"
          echo "finished_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"

      - name: Upload dedicated diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m1j-runtime-closeout-logs
          path: ${{ env.LOG }}
          if-no-files-found: error
          retention-days: 14
