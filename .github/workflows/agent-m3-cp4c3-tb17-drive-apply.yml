name: Agent M3 CP4c3 TB17 Drive Patch Apply

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/google-drive/m3-cp4c3-tb17-closeout.txt

permissions:
  contents: write
  id-token: write
  actions: read
  issues: write
  pull-requests: write

jobs:
  workflow-schema-validation:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/agent-m3-cp4c3-tb17-drive-apply.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  apply-patch:
    needs: workflow-schema-validation
    if: needs.workflow-schema-validation.outputs.valid == 'true'
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1vDE3gMCGGG5HXEBFov70_PXVaRlad0H6
      patch_sha256: a59a04452b113ac8fb7670c35f2a100560194dc3c8920ee84b2caa711693519f
      base_sha: d35d04a377af92433b9bb1b690021d1cb5a083ea
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: "docs: close M3-CP4c-3-TB17 and hand off review"
    secrets: inherit

  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m3-cp4c3-tb17-closeout-docs
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit
