name: Agent CB23 Compile

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/cb23-compile.txt

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: write

concurrency:
  group: agent-cb23-compile-${{ github.ref }}
  cancel-in-progress: false

jobs:
  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: M3-CP4c-3-CB23-compile
      commit_run_file: false
    secrets: inherit

  preflight:
    uses: ./.github/workflows/agent-compile-reusable.yml
    with:
      source_sha: fa5646106ccaa23770b84a935c6d1d6007928640
      targets: directional_core directional_pipeline directional_surface_cell_producer_tests
      artifact_prefix: cb23-preflight-compile
    secrets: inherit

  package:
    needs: preflight
    uses: ./.github/workflows/agent-compile-reusable.yml
    with:
      source_sha: fa5646106ccaa23770b84a935c6d1d6007928640
      targets: directional_core directional_pipeline directional_surface_cell_authority_kernel_tests directional_surface_cell_producer_tests directional_surface_cell_completion_tests directional_surface_cell_validation_tests directional_compiled_api_tests directional_benchmarks
      artifact_prefix: cb23-package-compile
    secrets: inherit
