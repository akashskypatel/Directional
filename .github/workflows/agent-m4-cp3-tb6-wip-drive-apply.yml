name: M4 CP3 TB6 WIP Drive Apply

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m4-cp3-tb6-wip-drive-apply.txt

permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

concurrency:
  group: m4-cp3-tb6-wip-drive-apply-${{ github.ref }}
  cancel-in-progress: false

jobs:
  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m4-cp3-tb6-wip-drive-apply
      commit_run_file: false
    secrets: inherit

  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/agent-m4-cp3-tb6-wip-drive-apply.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  apply:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1cNupCeELj9ihRCXPJSod7PIovFz1IsWW
      patch_sha256: 'de676e99d29a8fc7685efa59c54a38583152cb2544193c5be0bbc3cdc30492af'
      base_sha: 9345897a73d44ed584bd0e0ae73b4e571ad435b4
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: 'test: stage M4-CP3-TB6 artifact-only workflow'
    secrets: inherit
