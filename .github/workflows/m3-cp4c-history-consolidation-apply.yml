name: M3 CP4c Historical Consolidation Apply

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m3-cp4c-history-consolidation/apply-20260830.txt

permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

concurrency:
  group: m3-cp4c-history-consolidation-apply
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/m3-cp4c-history-consolidation-apply.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m3-cp4c-history-consolidation-apply
      commit_run_file: false
    secrets: inherit

  apply:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 19Zs3VcJhMU4IgoOsAkXzrdx6FhSkWhbd
      patch_sha256: 695ecfa547692b5027b3381286fe37fa2032432505dbf99cda0d48eb9d036284
      base_sha: b8bfaa0a878db78181ce060b77aa569505058eb3
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: 'docs: consolidate historical M3 CP4c records'
    secrets: inherit
