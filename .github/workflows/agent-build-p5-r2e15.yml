name: Agent Build Surface Cell P5 R2E15

on:
  push:
    branches: [agent/surface_cell_quad/p5-recover-bridge-healing]
    paths: [.github/workflows/agent-build-p5-r2e15.yml]

permissions:
  contents: write

concurrency:
  group: surface-cell-p5-r2e15-${{ github.ref }}
  cancel-in-progress: false

env:
  BRANCH: agent/surface_cell_quad/p5-recover-bridge-healing
  BASE_COMMIT: ccba8f95d4dc88d9b6e1eff7706ef2fa13bef677
  PATCH_B64_SHA256: b37484a949340e63d26a4da55f3b13683bcda6c02e68f0ab6d16b3bbf0e4dabe
  PATCH_SHA256: b500beffbcb7a414fff2f265a730916a6a600d90d2ee797a72348f1480fad3e0
  SOURCE_PRE: bea11b3b24149c552e3569669d170419532f527e
  SOURCE_POST: bc14dff449151f7925cb39e03cdc9d089f161558
  HEADER_BLOB: b9ed2d969b7de2d4df9639d53ff2e9b35e3475d8
  PHASE16_BLOB: de5b7c4f3d7c53f8488bc7de5d883ac72429e894
  MILESTONED_BLOB: 1625b8139a9da8e2a6cfddd1bb026ae69ba47ed2
  LOG_DIR: /tmp/p5-r2e15-logs
  LOG: /tmp/p5-r2e15-logs/activity.log

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Initialize persistent activity log
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$LOG_DIR"
          {
            echo 'P5-R2E15 compile-only build'
            echo "run_id=$GITHUB_RUN_ID"
            echo "event_sha=$GITHUB_SHA"
            echo "ref=$GITHUB_REF"
            echo "started_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } | tee "$LOG"

      - name: Checkout exact event commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 40
          submodules: false
          persist-credentials: true

      - name: Apply patch and push exact source commit
        shell: bash
        run: |
          set -Eeuo pipefail
          exec > >(tee -a "$LOG") 2>&1
          finish() {
            rc=$?
            trap - EXIT
            set +x
            echo "apply_exit_code=$rc"
            echo "apply_finished_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git status --short --branch || true
            exit "$rc"
          }
          trap finish EXIT
          set -x

          event_sha=$(git rev-parse HEAD)
          test "$event_sha" = "$GITHUB_SHA"
          test "$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)" = "$event_sha"
          test -z "$(git status --porcelain=v1)"
          git merge-base --is-ancestor "$BASE_COMMIT" "$event_sha"

          git diff --name-only "$BASE_COMMIT" "$event_sha" | sort > /tmp/turn-files.txt
          diff -u <(printf '%s\n' \
            .agents/Directional/patches/P5-R2E15.patch.b64.part00 \
            .agents/Directional/patches/P5-R2E15.patch.b64.part01 \
            .agents/Directional/patches/P5-R2E15.patch.b64.part02 \
            .github/workflows/agent-build-p5-r2e15.yml | sort) /tmp/turn-files.txt

          git --version
          cmake --version
          ninja --version
          c++ --version
          test "$(git hash-object src/geometry/SurfaceArrangement.cpp)" = "$SOURCE_PRE"
          test "$(git hash-object include/directional/geometry/SurfaceArrangement.h)" = "$HEADER_BLOB"
          test "$(git hash-object tests/SurfaceArrangementPhase16Tests.cpp)" = "$PHASE16_BLOB"
          test "$(git hash-object tests/MilestoneDClosureTests.cpp)" = "$MILESTONED_BLOB"

          cat .agents/Directional/patches/P5-R2E15.patch.b64.part{00,01,02} > /tmp/p5-r2e15.patch.b64
          test "$(sha256sum /tmp/p5-r2e15.patch.b64 | awk '{print $1}')" = "$PATCH_B64_SHA256"
          base64 -d /tmp/p5-r2e15.patch.b64 > /tmp/p5-r2e15.patch
          test "$(sha256sum /tmp/p5-r2e15.patch | awk '{print $1}')" = "$PATCH_SHA256"
          ! grep -Eq '^\+\+\+ b/(\.github|benchmarks/fixtures|include|tests)/' /tmp/p5-r2e15.patch
          git apply --check /tmp/p5-r2e15.patch
          git apply /tmp/p5-r2e15.patch
          git diff --check

          git diff --name-only | sort > /tmp/applied-files.txt
          diff -u <(printf '%s\n' src/geometry/SurfaceArrangement.cpp) /tmp/applied-files.txt
          test "$(git hash-object src/geometry/SurfaceArrangement.cpp)" = "$SOURCE_POST"
          test "$(git hash-object include/directional/geometry/SurfaceArrangement.h)" = "$HEADER_BLOB"
          test "$(git hash-object tests/SurfaceArrangementPhase16Tests.cpp)" = "$PHASE16_BLOB"
          test "$(git hash-object tests/MilestoneDClosureTests.cpp)" = "$MILESTONED_BLOB"

          git rm -f .agents/Directional/patches/P5-R2E15.patch.b64.part{00,01,02}
          git add src/geometry/SurfaceArrangement.cpp
          git diff --cached --check
          git config user.name directional-build-agent
          git config user.email directional-build-agent@users.noreply.github.com
          git commit -m 'P5-R2E15: use lifted chart interval authority [skip ci]'
          git push origin "HEAD:$BRANCH"

          source_sha=$(git rev-parse HEAD)
          test "$(git rev-parse HEAD^)" = "$event_sha"
          test "$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)" = "$source_sha"
          test -z "$(git status --porcelain=v1)"
          printf '%s\n' "$source_sha" > /tmp/SOURCE_COMMIT
          printf '%s\n' "$event_sha" > /tmp/WORKFLOW_EVENT_COMMIT
          echo "source_sha=$source_sha"

      - name: Initialize recursive submodules
        shell: bash
        run: |
          set -Eeuo pipefail
          exec > >(tee -a "$LOG") 2>&1
          set -x
          test "$(git rev-parse HEAD)" = "$(cat /tmp/SOURCE_COMMIT)"
          git submodule sync --recursive
          git submodule update --init --recursive --depth 1 --jobs 4
          git submodule status --recursive | tee /tmp/submodules.txt
          test "$(git submodule status --recursive | wc -l)" -eq 9
          git status --porcelain=v1 > /tmp/source-status.txt
          test ! -s /tmp/source-status.txt

      - name: Build exact approved targets and package authority
        shell: bash
        run: |
          set -Eeuo pipefail
          exec > >(tee -a "$LOG") 2>&1
          finish() {
            rc=$?
            trap - EXIT
            set +x
            echo "build_exit_code=$rc"
            echo "build_finished_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git status --short --branch || true
            df -h . || true
            du -sh build/agent-p5-r2e15-release artifact 2>/dev/null || true
            exit "$rc"
          }
          trap finish EXIT
          set -x

          rm -rf build/agent-p5-r2e15-release artifact
          mkdir -p build/agent-p5-r2e15-release artifact/{bin,lib,logs,metadata,source}
          cmake -S . -B build/agent-p5-r2e15-release -G Ninja \
            -DCMAKE_BUILD_TYPE=Release '-DCMAKE_CXX_FLAGS_RELEASE=-O2 -DNDEBUG' \
            -DBUILD_SHARED_LIBS=OFF -DDIRECTIONAL_BUILD_TESTS=ON \
            -DDIRECTIONAL_BUILD_BENCHMARKS=ON -DDIRECTIONAL_BUILD_CLI=OFF \
            -DDIRECTIONAL_BUILD_GUI=OFF -DDIRECTIONAL_ENABLE_GMP=OFF \
            -DDIRECTIONAL_ENABLE_PARDISO=OFF -DDIRECTIONAL_ENABLE_CUDSS=OFF \
            -DDIRECTIONAL_ENABLE_SUITESPARSE=OFF \
            2>&1 | tee build/agent-p5-r2e15-release/configure.log

          cmake --build build/agent-p5-r2e15-release --target \
            directional_core directional_pipeline directional_phase1_tests directional_benchmarks \
            -j 4 2>&1 | tee build/agent-p5-r2e15-release/build.log

          source_sha=$(cat /tmp/SOURCE_COMMIT)
          event_sha=$(cat /tmp/WORKFLOW_EVENT_COMMIT)
          test_bin=$(find build/agent-p5-r2e15-release -type f -name directional_phase1_tests -perm -111 | head -1)
          bench_bin=$(find build/agent-p5-r2e15-release -type f -name directional_benchmarks -perm -111 | head -1)
          test -n "$test_bin"; test -n "$bench_bin"
          cp "$test_bin" "$bench_bin" artifact/bin/
          find build/agent-p5-r2e15-release -maxdepth 3 -type f \( -name libdirectional_core.a -o -name libdirectional_pipeline.a \) -exec cp {} artifact/lib/ \;
          test -f artifact/lib/libdirectional_core.a
          test -f artifact/lib/libdirectional_pipeline.a

          cp build/agent-p5-r2e15-release/{configure.log,build.log} "$LOG" artifact/logs/
          cp /tmp/{submodules.txt,source-status.txt} artifact/metadata/
          printf '%s\n' "$source_sha" > artifact/SOURCE_COMMIT
          printf '%s\n' "$event_sha" > artifact/WORKFLOW_EVENT_COMMIT
          printf '%s\n' "$SOURCE_POST" > artifact/metadata/source-arrangement-blob.txt
          printf '%s\n' "$HEADER_BLOB" > artifact/metadata/header-blob.txt
          printf '%s\n' "$PHASE16_BLOB" > artifact/metadata/phase16-test-blob.txt
          printf '%s\n' "$MILESTONED_BLOB" > artifact/metadata/milestone-d-test-blob.txt
          printf '%s\n' "$PATCH_SHA256" > artifact/metadata/patch-sha256.txt
          printf '%s\n' 'No test, benchmark, custom input, help/list/discovery command, CLI, GUI, or generated project binary was executed.' > artifact/metadata/EXECUTION_POLICY.txt

          tar --exclude=.git --exclude=external --exclude=build/agent-p5-r2e15-release --exclude=artifact \
            -czf "artifact/source/directional-source-$source_sha.tar.gz" .
          sha256sum artifact/bin/* artifact/lib/* > artifact/metadata/target-sha256.txt
          cat > artifact/metadata/build-summary.json <<JSON
          {"turn":"P5-R2E15","workflow_run":"$GITHUB_RUN_ID","workflow_event_commit":"$event_sha","source_commit":"$source_sha","configuration":"Release -O2 -DNDEBUG","targets":["directional_core","directional_pipeline","directional_phase1_tests","directional_benchmarks"],"tests_executed":false,"benchmarks_executed":false,"project_binary_executed":false}
          JSON
          find artifact -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > artifact/SHA256SUMS
          sha256sum -c artifact/SHA256SUMS

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: surface-cell-p5-r2e15-github-source-linux-release
          path: artifact
          if-no-files-found: error
          retention-days: 30
          compression-level: 6

      - name: Always upload detailed logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surface-cell-p5-r2e15-workflow-logs-${{ github.run_id }}
          path: /tmp/p5-r2e15-logs
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
