name: M3 CP4c3 CB30 Closeout Docs Apply

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m3-cp4c3-cb30-closeout-docs-20260904.txt

permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

concurrency:
  group: m3-cp4c3-cb30-closeout-docs-apply
  cancel-in-progress: false

jobs:
  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m3-cp4c3-cb30-closeout-docs-apply
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/m3-cp4c3-cb30-closeout-docs-apply.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  apply:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1C-dCg7TMCjI5mfiGlcxeAh0cTzBoWFRv
      patch_sha256: 'def6daa58dc383d16fffda2a5176272e410999e48fd9753969ce4499ba432081'
      base_sha: 47221e7dbda938ec71c51d9af0ec579dc21d3590
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: 'docs(agent): close M3-CP4c-3-CB30 and plan TB26'
      retention_days: 14
    secrets: inherit
