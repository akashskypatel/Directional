name: O32a isolated capture from verified compiled artifact
on:
  push:
    branches:
      - scratch/p13-o32a-seed-review-20261105
    paths:
      - .agents/connector-triggers/o32a-capture-only.txt
permissions:
  contents: read
  actions: read
concurrency:
  group: o32a-capture-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    permissions:
      contents: read
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/o32a-capture-only.yml
      source_ref: ${{ github.sha }}
  capture:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    permissions:
      contents: read
      actions: read
    steps:
      - name: Initialize capture log
        shell: bash
        run: |
          set -euo pipefail
          : > "$RUNNER_TEMP/o32a-capture.log"
          echo "event_sha=$GITHUB_SHA source_sha=59f605752369908cdc0fb0388485892742caf462 compile_run=42007963779 capture_run=$GITHUB_RUN_ID" | tee -a "$RUNNER_TEMP/o32a-capture.log"
      - name: Download immutable compile package
        uses: actions/download-artifact@v4
        with:
          run-id: 42007963779
          github-token: ${{ github.token }}
          name: o32a-scratch-compile-result-42007963779
          path: ${{ runner.temp }}/package
      - name: Verify exact package and populate packaged fixtures
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee -a "$RUNNER_TEMP/o32a-capture.log") 2>&1
          cd "$RUNNER_TEMP/package"
          sha256sum -c SHA256SUMS
          test "$(cat metadata/source-commit.txt)" = "59f605752369908cdc0fb0388485892742caf462"
          test "$(cat metadata/build-exit-code.txt)" = "0"
          test -s bin/directional_surface_cell_producer_tests
          test -s source/source-59f605752369908cdc0fb0388485892742caf462.tar.gz
          mkdir -p test-data
          tar -xzf "source/source-59f605752369908cdc0fb0388485892742caf462.tar.gz" -C test-data benchmarks/fixtures
          test -s test-data/benchmarks/fixtures/milestone_g_manifest.json
          test -s test-data/benchmarks/fixtures/milestone-g/vase.off
          echo "FIXTURES_OK source=59f605752369908cdc0fb0388485892742caf462" 
      - name: Collect source-row Vase captures
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee -a "$RUNNER_TEMP/o32a-capture.log") 2>&1
          cd "$RUNNER_TEMP/package"
          chmod +x bin/directional_surface_cell_producer_tests
          mkdir -p "$RUNNER_TEMP/o32a-results"
          for seed in base 1 2 3; do
            set +e
            if [[ "$seed" == base ]]; then
              DIRECTIONAL_O32A_SCRATCH=1 timeout 210 bin/directional_surface_cell_producer_tests --gtest_filter='UniformPhaseFront/SurfaceCellDesignAcceptance.ProducesDirectSourceAuthoritativePureQuadOutput/Vase' > "$RUNNER_TEMP/o32a-results/$seed.log" 2>&1
            else
              DIRECTIONAL_O32A_SCRATCH=1 DIRECTIONAL_O32A_PERMUTATION="$seed" timeout 210 bin/directional_surface_cell_producer_tests --gtest_filter='UniformPhaseFront/SurfaceCellDesignAcceptance.ProducesDirectSourceAuthoritativePureQuadOutput/Vase' > "$RUNNER_TEMP/o32a-results/$seed.log" 2>&1
            fi
            rc=$?
            set -e
            echo "$seed exit=$rc" | tee -a "$RUNNER_TEMP/o32a-results/exits.txt"
            if [ "$rc" -eq 124 ]; then
              echo "STATUS=ERROR reason=capture-timeout permutation=$seed"
              exit 1
            fi
            for phase in rails relief_roots relief_regions separatrices coverage; do
              grep -q "^O32A_PHASE $phase size=" "$RUNNER_TEMP/o32a-results/$seed.log"
            done
            grep -q "^O32A_SEED coverage" "$RUNNER_TEMP/o32a-results/$seed.log"
            grep -q "^O32A_INPUT roots=" "$RUNNER_TEMP/o32a-results/$seed.log"
            if grep -q "^O32A_INVALID_FACE" "$RUNNER_TEMP/o32a-results/$seed.log"; then
              echo "STATUS=ERROR reason=invalid-source-face permutation=$seed"
              exit 1
            fi
            echo "CAPTURED seed=$seed coverage=$(grep '^O32A_PHASE coverage size=' "$RUNNER_TEMP/o32a-results/$seed.log" | tail -1)"
          done
          (cd "$RUNNER_TEMP/o32a-results" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          (cd "$RUNNER_TEMP/o32a-results" && sha256sum -c SHA256SUMS)
          echo "STATUS=COMPLETE source=59f605752369908cdc0fb0388485892742caf462 permutations=4"
      - name: Upload four Vase captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: o32a-fixtured-captures-${{ github.run_id }}
          path: ${{ runner.temp }}/o32a-results
          if-no-files-found: warn
          retention-days: 7
      - name: Upload capture diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: o32a-fixtured-capture-log-${{ github.run_id }}
          path: ${{ runner.temp }}/o32a-capture.log
          if-no-files-found: error
          retention-days: 7
  mailbox:
    if: always()
    needs: [validate, capture]
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/workflow-mailbox-publisher.yml
    with:
      mailbox_branch: workflow-mailbox
      workflow_key: p13-o32a-fixtured-capture
      source_sha: ${{ github.sha }}
      source_ref: ${{ github.ref }}
      result: ${{ needs.validate.result == 'success' && needs.capture.result == 'success' && 'success' || 'failure' }}
      summary: Scratch-only source-exact Vase seed producer capture, not acceptance.
