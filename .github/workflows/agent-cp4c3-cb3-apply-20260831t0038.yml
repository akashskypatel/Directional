name: M3 CP4c3 CB3 Patch Apply

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/cp4c3-cb3-apply-20260831t0038.txt

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

concurrency:
  group: m3-cp4c3-cb3-apply-20260831t0038
  cancel-in-progress: false

jobs:
  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: cp4c3-cb3-apply
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  validate-caller:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/agent-cp4c3-cb3-apply-20260831t0038.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  apply:
    needs: validate-caller
    if: ${{ needs.validate-caller.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1UJ79riPJ6NRCk6sxQbppilalrUc9Ad7O
      patch_sha256: 5d48bf3b48e8c25e3c7c1107fb7e64f1b1b2a96aa2421134bab59d27c0346993
      base_sha: 9951886c540d219b936abd13a14cf82fd6229760
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: "M3-CP4c-3 CB3: absorb slit-bound singularity ports"
      retention_days: 7
    secrets: inherit
