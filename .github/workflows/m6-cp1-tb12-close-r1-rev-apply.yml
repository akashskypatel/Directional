name: M6 CP1 TB12 Close R1 Review Docs Apply

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m6-cp1-tb12-close-r1-rev-apply.txt

permissions:
  actions: read
  contents: write
  id-token: write

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/m6-cp1-tb12-close-r1-rev-apply.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  apply:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1Ls8qnLKim6fsRFMabox3SSulpGmut9EJ
      patch_sha256: fae2495d472c201c4edb2d438f5320f16d4607ed21a0bfac5884712077638daa
      base_sha: f6ffca2a1b6492e0685d0d93f82db996576cb7cc
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: "docs: complete M6-CP1-TB12-CLOSE-R1-REV"
    secrets: inherit

  mailbox:
    if: ${{ always() }}
    needs: [apply]
    permissions:
      actions: read
      contents: write
    uses: ./.github/workflows/workflow-mailbox-publisher.yml
    with:
      workflow_key: m6-cp1-tb12-close-r1-rev-apply
      source_sha: ${{ github.sha }}
      source_ref: ${{ github.ref }}
      result: ${{ needs.apply.result }}
      summary: "Apply M6-CP1-TB12-CLOSE-R1-REV review documentation and consolidation patch."
