name: M4 CP SCALE TB12 R6 Closeout Patch Validation

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m4-cp-scale-tb12-r6-closeout-patch-validation-20260918.txt

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: m4-cp-scale-tb12-r6-closeout-patch-validation
  cancel-in-progress: false

jobs:
  validate-self:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/m4-cp-scale-tb12-r6-closeout-patch-validation.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m4-cp-scale-tb12-r6-closeout-patch-validation
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  validate-draft:
    needs: validate-self
    if: ${{ needs.validate-self.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .agents/Directional/turn-payloads/m4-cp-scale-tb12-r6-closeout-patch-apply.yml
      source_ref: ${{ github.sha }}
    secrets: inherit
