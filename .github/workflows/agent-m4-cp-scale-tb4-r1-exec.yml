name: Agent M4 CP SCALE TB4 R1 EXEC

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m4-cp-scale-tb4-r1-exec.txt

permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: agent-m4-cp-scale-tb4-r1-exec-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/agent-m4-cp-scale-tb4-r1-exec.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m4-cp-scale-tb4-r1-exec
      commit_run_file: false
    secrets: inherit

  execute:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Initialize persistent activity log
        shell: bash
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/m4-cp-scale-tb4-r1-exec.log"
          : > "$log"
          printf '%s\n' \
            "workflow=${GITHUB_WORKFLOW}" \
            "run_id=${GITHUB_RUN_ID}" \
            "event=${GITHUB_EVENT_NAME}" \
            "event_sha=${GITHUB_SHA}" \
            "ref=${GITHUB_REF}" \
            'turnBoundary=Test+Benchmark-EXEC-only' \
            'runtimeExecution=true' \
            'candidateArtifact=10378808176' \
            'semanticSource=905dabe390577d63ed6a9289e3f3d53aa4144936' | tee -a "$log"

      - name: Checkout exact control source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          token: ${{ secrets.GH_TOKEN || github.token }}

      - name: Verify control source and execute frozen artifact-only payload
        id: runtime
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -uo pipefail
          log="${RUNNER_TEMP}/m4-cp-scale-tb4-r1-exec.log"
          exec > >(tee -a "$log") 2>&1
          git status --porcelain=v1 | tee "${RUNNER_TEMP}/source-status-before-runtime.txt"
          test ! -s "${RUNNER_TEMP}/source-status-before-runtime.txt"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          driver=.agents/Directional/turn-payloads/m4_cp_scale_tb4_r1_exec.py
          lib=.agents/Directional/turn-payloads/m4_cp_scale_tb4_r1_exec_lib.py
          test -f "$driver"
          test -f "$lib"
          printf '%s  %s\n' 'a83ad830677f32aa0a882158c1e800762c65957ce5bb69645acbc511a8b37673' "$driver" | sha256sum -c -
          printf '%s  %s\n' '10fa3684a75968e5a14256c90f7e24fec486eb8d63553f9c6daee873ace20967' "$lib" | sha256sum -c -
          python3 -m py_compile "$driver" "$lib"
          set +e
          python3 "$driver"
          rc=$?
          set -e
          echo "$rc" > "${RUNNER_TEMP}/payload-exit-code.txt"
          echo "payload_exit=$rc"
          git status --porcelain=v1 | tee "${RUNNER_TEMP}/source-status-after-runtime.txt"
          test ! -s "${RUNNER_TEMP}/source-status-after-runtime.txt"
          exit 0

      - name: Upload TB4 R1 result evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m4-cp-scale-tb4-r1-exec-result-${{ github.run_id }}
          path: ${{ runner.temp }}/tb4-r1-publish
          if-no-files-found: error
          retention-days: 7

      - name: Record final diagnostic status
        if: always()
        shell: bash
        run: |
          set +e
          log="${RUNNER_TEMP}/m4-cp-scale-tb4-r1-exec.log"
          {
            echo "payload_exit=$(cat "${RUNNER_TEMP}/payload-exit-code.txt" 2>/dev/null || echo missing)"
            echo "final_job_status=${{ job.status }}"
            echo "finished_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git status --short 2>&1 || true
          } | tee -a "$log"

      - name: Upload persistent diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m4-cp-scale-tb4-r1-exec-log-${{ github.run_id }}
          path: ${{ runner.temp }}/m4-cp-scale-tb4-r1-exec.log
          if-no-files-found: error
          retention-days: 7

      - name: Propagate TB4 R1 mechanical status
        if: always()
        shell: bash
        run: |
          rc="$(cat "${RUNNER_TEMP}/payload-exit-code.txt" 2>/dev/null || echo 98)"
          exit "$rc"
