name: Agent M3 CP4c3 CB29 Harness Proof

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/cb29-harness-proof/trigger-20260904.txt

permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: agent-m3-cp4c3-cb29-harness-proof-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/agent-m3-cp4c3-cb29-harness-proof.yml
      source_ref: ${{ github.sha }}
      retention_days: 14
    secrets: inherit

  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m3-cp4c3-cb29-harness-proof
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  prove:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    env:
      ARTIFACT_ID: "9950303110"
      EXPECTED_ZIP_SHA256: "84c9cd0bdf5d8bef2288e1ca57d52bcec8d1503f368d82101ae10cfa14c49189"
      EXPECTED_PROVIDER_DIGEST: "sha256:84c9cd0bdf5d8bef2288e1ca57d52bcec8d1503f368d82101ae10cfa14c49189"
      EXPECTED_SOURCE_SHA: "3d7f7f9a3afad3ed37fc615a206801cf6310f4ac"
      EXPECTED_SELECTOR_365_SHA256: "6b5b6555d39c250c24cbf3faeafdeca93b4b11379118a29583253e6cfc14b8a1"
      EXPECTED_SELECTOR_401_SHA256: "0d0857a97158dfd0763b536718c24ba257417866aad3d8e51d6f0093be5a5869"
      EXPECTED_SELECTOR_403_SHA256: "60ff6daa0e1dc71fe9c856ee9559d665628b756ed634f70ffce5881ec2514007"
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Initialize CB29 proof log
        shell: bash
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/m3-cp4c3-cb29-harness-proof.log"
          : > "$log"
          printf '%s\n' \
            "workflow=${GITHUB_WORKFLOW}" \
            "run_id=${GITHUB_RUN_ID}" \
            "event_sha=${GITHUB_SHA}" \
            "runtimeExecution=false" \
            "started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" | tee -a "$log"

      - name: Checkout orchestration history only
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false
          lfs: false

      - name: Materialize directly verifiable TB25 harness
        shell: bash
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/m3-cp4c3-cb29-harness-proof.log"
          exec > >(tee -a "$log") 2>&1
          old="${RUNNER_TEMP}/tb24-formal.yml"
          new="${RUNNER_TEMP}/m3-cp4c3-tb25-harness.sh"
          git show 0624b916dfa16aa47751bd4f40b75bcf5bd76b5a:.github/workflows/agent-m3-cp4c3-tb24-exec.yml > "$old"
          test "$(git hash-object "$old")" = 44b1ad0e7934be2662c1ea326f70baa3537a5977
          python3 - "$old" "$new" <<'PY'
          import pathlib, sys
          s = pathlib.Path(sys.argv[1]).read_text()
          a = s.index('      - name: Execute immutable TB24 gate\n')
          a = s.index('        run: |\n', a) + len('        run: |\n')
          b = s.index('\n      - name: Record final TB24 status', a)
          lines = []
          for line in s[a:b].splitlines():
              if not line:
                  lines.append('')
              elif line.startswith('          '):
                  lines.append(line[10:])
              else:
                  raise SystemExit(f'bad harness indent:{line!r}')
          t = '\n'.join(lines) + '\n'
          t = t.replace('397', '__LOW__').replace('401', '__HIGH__')
          t = t.replace('__LOW__', '401').replace('__HIGH__', '403')
          t = t.replace('m3-cp4c3-tb24', 'm3-cp4c3-tb25')
          t = t.replace('TB24', 'TB25')
          t = t.replace('ordinal>=398', 'ordinal>=402')
          t = t.replace('new-cb27-witness', 'new-cb28-witness')
          pathlib.Path(sys.argv[2]).write_text('#!/usr/bin/env bash\n' + t)
          PY
          chmod 700 "$new"
          bash -n "$new"
          grep -Fq 'Architecture_M3_CP4c3_Required_Green_Selector_403.txt' "$new"
          grep -Fq 'selector401_exact_prefix_of_403=true' "$new"
          grep -Fq 'ordinal>=402' "$new"
          grep -Fq 'new-cb28-witness' "$new"
          ! grep -Fq '9935929108' "$new"
          ! grep -Fq '9c72fea8b666534b9e52fa42bbe8cbf8ae68ffe5' "$new"
          ! grep -Fq 'selector injection point missing' "$new"
          printf '%s\n' \
            'historical_formal_run=33891467611' \
            'historical_workflow_commit=0624b916dfa16aa47751bd4f40b75bcf5bd76b5a' \
            'historical_workflow_blob=44b1ad0e7934be2662c1ea326f70baa3537a5977' \
            "historical_yaml_sha256=$(sha256sum "$old" | awk '{print $1}')" \
            "materialized_harness_sha256=$(sha256sum "$new" | awk '{print $1}')" \
            'selector365_check=separate-pre-runtime-authority-step' \
            'directional_runtime_invocations=0' > "${RUNNER_TEMP}/harness-proof.txt"

      - name: Verify immutable package selector authority without runtime
        shell: bash
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/m3-cp4c3-cb29-harness-proof.log"
          exec > >(tee -a "$log") 2>&1
          root="${RUNNER_TEMP}/cb29-package-proof"
          zip="${root}/artifact-${ARTIFACT_ID}.zip"
          pkg="${root}/package"
          src="${root}/source"
          mkdir -p "$pkg" "$src"
          curl --fail-with-body --silent --show-error --location \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}" \
            -o "${root}/artifact.json"
          test "$(jq -r '.digest' "${root}/artifact.json")" = "$EXPECTED_PROVIDER_DIGEST"
          curl --fail-with-body --silent --show-error --location \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
            -o "$zip"
          test "$(sha256sum "$zip" | awk '{print $1}')" = "$EXPECTED_ZIP_SHA256"
          unzip -q "$zip" -d "$pkg"
          (cd "$pkg" && sha256sum -c SHA256SUMS)
          test "$(cat "$pkg/metadata/source-commit.txt")" = "$EXPECTED_SOURCE_SHA"
          grep -Fxq 'runtimeExecution=false' "$pkg/metadata/command-boundary.txt"
          grep -Fxq 'exactArithmeticBackend=GMP' "$pkg/metadata/command-boundary.txt"
          tar -xzf "$pkg/source/source-${EXPECTED_SOURCE_SHA}.tar.gz" -C "$src"
          s365="$src/.agents/Directional/Architecture_M3_CP4c2_Required_Green_Selector_365.txt"
          s401="$src/.agents/Directional/Architecture_M3_CP4c3_Required_Green_Selector_401.txt"
          s403="$src/.agents/Directional/Architecture_M3_CP4c3_Required_Green_Selector_403.txt"
          test "$(sha256sum "$s365" | awk '{print $1}')" = "$EXPECTED_SELECTOR_365_SHA256"
          test "$(sha256sum "$s401" | awk '{print $1}')" = "$EXPECTED_SELECTOR_401_SHA256"
          test "$(sha256sum "$s403" | awk '{print $1}')" = "$EXPECTED_SELECTOR_403_SHA256"
          test "$(wc -l < "$s365" | tr -d ' ')" = 365
          test "$(wc -l < "$s401" | tr -d ' ')" = 401
          test "$(wc -l < "$s403" | tr -d ' ')" = 403
          head -n 365 "$s403" > "${root}/prefix365.txt"; cmp -s "$s365" "${root}/prefix365.txt"
          head -n 401 "$s403" > "${root}/prefix401.txt"; cmp -s "$s401" "${root}/prefix401.txt"
          printf '%s\n' \
            'package_authority_valid=true' \
            'selector365_exact_prefix_of_403=true' \
            'selector401_exact_prefix_of_403=true' \
            'pre_runtime_harness_valid=true' \
            'runtime_started=false' \
            'directional_runtime_invocations=0' > "${RUNNER_TEMP}/pre-runtime-proof.txt"

      - name: Upload CB29 proof result
        uses: actions/upload-artifact@v4
        with:
          name: m3-cp4c3-cb29-harness-proof-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/m3-cp4c3-tb25-harness.sh
            ${{ runner.temp }}/harness-proof.txt
            ${{ runner.temp }}/pre-runtime-proof.txt
          if-no-files-found: error
          retention-days: 14

      - name: Upload CB29 proof log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-cp4c3-cb29-harness-proof-log-${{ github.run_id }}
          path: ${{ runner.temp }}/m3-cp4c3-cb29-harness-proof.log
          if-no-files-found: error
          retention-days: 14
