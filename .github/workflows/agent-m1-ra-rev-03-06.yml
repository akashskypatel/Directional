name: Agent M1 R-A REV-03-06 Compile

on:
  push:
    branches: [agent/surface_cell_quad/p5-recover-bridge-healing]
    paths: [.agents/connector-triggers/m1-ra-rev-03-06.txt]

permissions:
  contents: write
  actions: write

env:
  CCACHE_MAXSIZE: 256M

concurrency:
  group: agent-m1-ra-rev-03-06
  cancel-in-progress: false

jobs:
  patch-audit-compile-package:
    runs-on: ubuntu-latest
    steps:
      - name: Initialize persistent activity log
        shell: bash
        run: |
          set -euo pipefail
          LOG="$RUNNER_TEMP/activity.log"
          : > "$LOG"
          {
            echo "task=M1 R-A-REV-03-through-06 partial Code+Build"
            echo "event_sha=$GITHUB_SHA"
            echo "ref=$GITHUB_REF"
            date -u +"utc=%Y-%m-%dT%H:%M:%SZ"
          } | tee -a "$LOG"

      - name: Checkout exact trigger authority
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          submodules: recursive

      - name: Apply reviewed source patch and push exact source
        shell: bash
        run: |
          set -euo pipefail
          LOG="$RUNNER_TEMP/activity.log"
          exec > >(tee -a "$LOG") 2>&1
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          base64 --decode .agents/Directional/turn-payloads/m1-ra-rev-03-06.patch.gz.b64 | gzip -d > "$RUNNER_TEMP/m1-ra-rev-03-06.patch"
          git apply --check "$RUNNER_TEMP/m1-ra-rev-03-06.patch"
          git apply "$RUNNER_TEMP/m1-ra-rev-03-06.patch"
          python3 .agents/Directional/turn-payloads/m1-ra-rev-03-06-audit.py | tee "$RUNNER_TEMP/source-audit.txt"
          git diff --check
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' \
            include/directional/geometry/PureQuadCompletion.h \
            src/geometry/PureQuadCompletion.cpp \
            src/geometry/SurfaceMeshOptimizer.cpp \
            src/geometry/SurfaceOptimizationRailConstraints.cpp \
            src/pipeline/RemeshPipeline.cpp \
            src/validation/SourceAuthoritativeMeshValidator.cpp \
            tests/PureQuadCompletionPhase18Tests.cpp \
            tests/SurfaceCellTransitionQuotientTests.cpp \
            tests/SurfaceMeshOptimizerPhase22Tests.cpp | sort)"
          printf 'changed_files=\n%s\n' "$changed"
          test "$changed" = "$expected"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            include/directional/geometry/PureQuadCompletion.h \
            src/geometry/PureQuadCompletion.cpp \
            src/geometry/SurfaceMeshOptimizer.cpp \
            src/geometry/SurfaceOptimizationRailConstraints.cpp \
            src/pipeline/RemeshPipeline.cpp \
            src/validation/SourceAuthoritativeMeshValidator.cpp \
            tests/PureQuadCompletionPhase18Tests.cpp \
            tests/SurfaceCellTransitionQuotientTests.cpp \
            tests/SurfaceMeshOptimizerPhase22Tests.cpp
          git commit -m "fix: close M1 R-A REV-03 through REV-05"
          SOURCE_SHA="$(git rev-parse HEAD)"
          echo "SOURCE_SHA=$SOURCE_SHA" >> "$GITHUB_ENV"
          echo "source_sha=$SOURCE_SHA"
          git push origin "HEAD:$GITHUB_REF"
          git status --porcelain=v1 | tee "$RUNNER_TEMP/source-status-preconfigure.txt"
          test ! -s "$RUNNER_TEMP/source-status-preconfigure.txt"

      - name: Install and configure ccache
        shell: bash
        run: |
          set -euo pipefail
          LOG="$RUNNER_TEMP/activity.log"
          exec > >(tee -a "$LOG") 2>&1
          sudo apt-get update
          sudo apt-get install -y ccache
          export CCACHE_DIR="$RUNNER_TEMP/ccache"
          mkdir -p "$CCACHE_DIR"
          ccache --set-config=max_size="$CCACHE_MAXSIZE"
          ccache --set-config=compression=true

      - name: Compute cache key
        id: cache-key
        shell: bash
        run: |
          set -euo pipefail
          compiler="$(c++ -dumpfullversion -dumpversion)"
          prefix="m1-ra-${RUNNER_OS}-gcc-${compiler}-release-ccache-v3-"
          echo "prefix=$prefix" >> "$GITHUB_OUTPUT"
          echo "key=${prefix}${GITHUB_RUN_ID}" >> "$GITHUB_OUTPUT"

      - name: Restore compatible compiler cache
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/ccache
          key: ${{ steps.cache-key.outputs.key }}
          restore-keys: |
            ${{ steps.cache-key.outputs.prefix }}

      - name: Configure Release static PRE_TEST out of tree
        shell: bash
        run: |
          set -euo pipefail
          LOG="$RUNNER_TEMP/activity.log"
          exec > >(tee -a "$LOG") 2>&1
          export CCACHE_DIR="$RUNNER_TEMP/ccache"
          BUILD="$RUNNER_TEMP/build-m1-ra-rev-03-06"
          echo "BUILD_DIR=$BUILD" >> "$GITHUB_ENV"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git status --porcelain=v1 | tee "$RUNNER_TEMP/source-status-before-configure.txt"
          test ! -s "$RUNNER_TEMP/source-status-before-configure.txt"
          echo "cache_hit=${{ steps.cache.outputs.cache-hit }}"
          echo "cache_matched_key=${{ steps.cache.outputs.cache-matched-key }}"
          ccache -s
          cmake -S . -B "$BUILD" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DBUILD_SHARED_LIBS=OFF \
            -DDIRECTIONAL_BUILD_CLI=OFF \
            -DDIRECTIONAL_BUILD_GUI=OFF \
            -DDIRECTIONAL_BUILD_TESTS=ON \
            -DDIRECTIONAL_BUILD_BENCHMARKS=ON \
            -DDIRECTIONAL_BUILD_HISTORICAL_TESTS=OFF \
            -DDIRECTIONAL_BUILD_LEGACY_INTEGRATION_TESTS=OFF \
            -DDIRECTIONAL_BUILD_OPTIONAL_GUIDANCE_TESTS=OFF \
            -DDIRECTIONAL_ENABLE_GMP=OFF \
            -DDIRECTIONAL_ENABLE_PARDISO=OFF \
            -DDIRECTIONAL_ENABLE_SUITESPARSE=OFF \
            -DDIRECTIONAL_ENABLE_CUDSS=OFF \
            -DCMAKE_GTEST_DISCOVER_TESTS_DISCOVERY_MODE=PRE_TEST
          git status --porcelain=v1 | tee "$RUNNER_TEMP/source-status-after-configure.txt"
          test ! -s "$RUNNER_TEMP/source-status-after-configure.txt"

      - name: Compile and link approved targets only
        shell: bash
        run: |
          set -uo pipefail
          LOG="$RUNNER_TEMP/activity.log"
          exec > >(tee -a "$LOG") 2>&1
          export CCACHE_DIR="$RUNNER_TEMP/ccache"
          set +e
          cmake --build "$BUILD_DIR" --target \
            directional_core \
            directional_pipeline \
            directional_surface_cell_authority_kernel_tests \
            directional_surface_cell_producer_tests \
            directional_surface_cell_completion_tests \
            directional_surface_cell_validation_tests \
            directional_compiled_api_tests \
            directional_benchmarks -- -j2
          rc=$?
          set -e
          echo "$rc" > "$RUNNER_TEMP/build-exit-code"
          echo "build_exit=$rc"
          ccache -s
          git status --porcelain=v1 | tee "$RUNNER_TEMP/source-status-after-build.txt"
          echo "runtimeExecution=false"
          echo "No generated Directional binary, discovery, test, benchmark, ctest, CLI, fuzzer, help/version command, or custom input was executed."
          exit 0

      - name: Save compiler cache
        if: always() && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/ccache
          key: ${{ steps.cache-key.outputs.key }}

      - name: Prune stale compatible caches
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          CACHE_PREFIX: ${{ steps.cache-key.outputs.prefix }}
        shell: bash
        run: |
          set -euo pipefail
          LOG="$RUNNER_TEMP/activity.log"
          exec > >(tee -a "$LOG") 2>&1
          list="$RUNNER_TEMP/cache-list.tsv"
          gh api --paginate "/repos/$GITHUB_REPOSITORY/actions/caches?per_page=100" --jq '.actions_caches[] | [.id, .key, .last_accessed_at] | @tsv' > "$list"
          mapfile -t stale < <(awk -F '\t' -v p="$CACHE_PREFIX" 'substr($2,1,length(p))==p {print $3"\t"$1"\t"$2}' "$list" | sort -r | tail -n +2)
          for entry in "${stale[@]}"; do
            IFS=$'\t' read -r accessed id key <<< "$entry"
            echo "prune_cache id=$id key=$key last_accessed=$accessed"
            gh api --method DELETE "/repos/$GITHUB_REPOSITORY/actions/caches/$id"
          done
          echo "cache_pruned=${#stale[@]}"
          echo "cache_storage_cap_per_entry=$CCACHE_MAXSIZE"

      - name: Propagate compile status
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          LOG="$RUNNER_TEMP/activity.log"
          exec > >(tee -a "$LOG") 2>&1
          test -f "$RUNNER_TEMP/build-exit-code" || { echo "compile_status=missing"; exit 1; }
          rc="$(cat "$RUNNER_TEMP/build-exit-code")"
          echo "compile_status=$rc"
          exit "$rc"

      - name: Package and self-verify compile evidence
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          LOG="$RUNNER_TEMP/activity.log"
          exec > >(tee -a "$LOG") 2>&1
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git status --porcelain=v1 | tee "$RUNNER_TEMP/source-status-final.txt"
          test ! -s "$RUNNER_TEMP/source-status-final.txt"

          OUT="$RUNNER_TEMP/result"
          mkdir -p "$OUT/metadata" "$OUT/source" "$OUT/bin" "$OUT/lib" "$OUT/fixtures"
          git rev-parse HEAD > "$OUT/metadata/source-commit.txt"
          cp "$RUNNER_TEMP/source-status-preconfigure.txt" "$OUT/metadata/source-status-preconfigure.txt"
          cp "$RUNNER_TEMP/source-status-before-configure.txt" "$OUT/metadata/source-status-before-configure.txt"
          cp "$RUNNER_TEMP/source-status-after-configure.txt" "$OUT/metadata/source-status-after-configure.txt"
          cp "$RUNNER_TEMP/source-status-after-build.txt" "$OUT/metadata/source-status-after-build.txt"
          cp "$RUNNER_TEMP/source-status-final.txt" "$OUT/metadata/source-status-final.txt"
          cp "$RUNNER_TEMP/source-audit.txt" "$OUT/metadata/source-audit.txt"
          cp "$BUILD_DIR/CMakeCache.txt" "$OUT/metadata/CMakeCache.txt"
          git diff "$GITHUB_SHA" "$SOURCE_SHA" -- \
            include/directional/geometry/PureQuadCompletion.h \
            src/geometry/PureQuadCompletion.cpp \
            src/geometry/SurfaceMeshOptimizer.cpp \
            src/geometry/SurfaceOptimizationRailConstraints.cpp \
            src/pipeline/RemeshPipeline.cpp \
            src/validation/SourceAuthoritativeMeshValidator.cpp \
            tests/PureQuadCompletionPhase18Tests.cpp \
            tests/SurfaceCellTransitionQuotientTests.cpp \
            tests/SurfaceMeshOptimizerPhase22Tests.cpp \
            > "$OUT/metadata/source.patch"
          git archive --format=tar.gz -o "$OUT/source/source-$SOURCE_SHA.tar.gz" "$SOURCE_SHA"

          cp "$BUILD_DIR/directional_surface_cell_authority_kernel_tests" "$OUT/bin/"
          cp "$BUILD_DIR/directional_surface_cell_producer_tests" "$OUT/bin/"
          cp "$BUILD_DIR/directional_surface_cell_completion_tests" "$OUT/bin/"
          cp "$BUILD_DIR/directional_surface_cell_validation_tests" "$OUT/bin/"
          cp "$BUILD_DIR/directional_compiled_api_tests" "$OUT/bin/"
          cp "$BUILD_DIR/directional_benchmarks" "$OUT/bin/"
          cp "$BUILD_DIR/libdirectional_core.a" "$OUT/lib/"
          cp "$BUILD_DIR/libdirectional_pipeline.a" "$OUT/lib/"

          git ls-files -z -- '*.obj' '*.off' '*.ply' '*.mesh' '*.msh' '*.json' '*.csv' '*.txt' > "$RUNNER_TEMP/fixture-paths.z"
          tr '\0' '\n' < "$RUNNER_TEMP/fixture-paths.z" > "$OUT/metadata/fixture-paths.txt"
          if test -s "$RUNNER_TEMP/fixture-paths.z"; then
            tar --null -T "$RUNNER_TEMP/fixture-paths.z" -czf "$OUT/fixtures/tracked-fixtures.tar.gz"
          else
            tar -czf "$OUT/fixtures/tracked-fixtures.tar.gz" --files-from /dev/null
          fi

          printf '%s\n' \
            'runtimeExecution=false' \
            'turnBoundary=Code+Build-only' \
            'sourceAudit=R-A-REV-03-05-focused' \
            'packageSelfVerification=true' \
            'manifestExcludesSelf=true' \
            'buildLocation=runner-temp-out-of-tree' \
            'generatedRuntimeExecution=none' \
            > "$OUT/metadata/command-boundary.txt"
          printf '%s\n' \
            directional_core \
            directional_pipeline \
            directional_surface_cell_authority_kernel_tests \
            directional_surface_cell_producer_tests \
            directional_surface_cell_completion_tests \
            directional_surface_cell_validation_tests \
            directional_compiled_api_tests \
            directional_benchmarks \
            > "$OUT/metadata/compiled-targets.txt"

          (cd "$OUT" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          (cd "$OUT" && sha256sum -c SHA256SUMS)
          test "$(grep -c 'SHA256SUMS' "$OUT/SHA256SUMS" || true)" -eq 0
          echo "manifest_self_verification=pass"
          echo "source_status_clean=pass"
          find "$OUT/bin" "$OUT/lib" -maxdepth 1 -type f -printf '%p\n' | sort

      - name: Upload compile result
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: m1-ra-rev-03-06-compile-result-${{ github.run_id }}
          path: ${{ runner.temp }}/result
          if-no-files-found: error
          retention-days: 7

      - name: Upload persistent activity log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m1-ra-rev-03-06-compile-log-${{ github.run_id }}
          path: ${{ runner.temp }}/activity.log
          if-no-files-found: error
          retention-days: 7
