name: Agent Review History Audit
on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/review-history/**
permissions:
  contents: read
  actions: read
concurrency:
  group: agent-review-history-audit-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/agent-review-history-audit.yml
      source_ref: ${{ github.sha }}
  history:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    runs-on: ubuntu-24.04
    outputs:
      audited_sha: ${{ steps.audit.outputs.audited_sha }}
    steps:
      - name: Initialize audit activity log
        shell: bash
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/agent-review-history-audit.log"
          : > "$log"
          {
            echo "workflow=${GITHUB_WORKFLOW}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "event=${GITHUB_EVENT_NAME}"
            echo "event_sha=${GITHUB_SHA}"
            echo "ref=${GITHUB_REF}"
            echo "started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } | tee -a "$log"
      - name: Checkout authentic Git history
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          submodules: false
          persist-credentials: false
      - name: Run read-only history and boundary audit
        id: audit
        shell: bash
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/agent-review-history-audit.log"
          exec > >(tee -a "$log") 2>&1
          trap 'rc=$?; echo "audit_exit=$rc"; echo "finished_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"; git status -sb || true' EXIT
          sha="$(git rev-parse HEAD)"
          test "$sha" = "$GITHUB_SHA"
          echo "audited_sha=$sha" >> "$GITHUB_OUTPUT"
          echo "audited_sha=$sha"
          echo "git_version=$(git --version)"
          echo "python_version=$(python3 --version)"
          echo "rewrite_base=$(git rev-parse 8b7299b43)"
          echo "origin_ref=$(git rev-parse origin/${GITHUB_REF_NAME})"
          test "$sha" = "$(git rev-parse origin/${GITHUB_REF_NAME})"
          python3 .agents/Directional/tools/review_check.py boundary
          python3 .agents/Directional/tools/review_check.py ledgers --base 8b7299b43
          git status --porcelain
          test -z "$(git status --porcelain)"
          echo 'review_history_audit=PASS'
      - name: Upload diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-review-history-audit-log-${{ github.run_id }}
          path: ${{ runner.temp }}/agent-review-history-audit.log
          if-no-files-found: error
          retention-days: 7
  mailbox:
    if: ${{ always() }}
    needs: [history]
    permissions:
      actions: read
      contents: write
    uses: ./.github/workflows/workflow-mailbox-publisher.yml
    with:
      mailbox_branch: workflow-mailbox
      workflow_key: review-history-audit
      source_sha: ${{ needs.history.outputs.audited_sha || github.sha }}
      source_ref: ${{ github.ref }}
      result: ${{ needs.history.result }}
      summary: Read-only Git history and review boundary audit.
