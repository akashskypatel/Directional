name: Agent M1 R-A Apply A35 Phase22

on:
  push:
    branches: [agent/surface_cell_quad/p5-recover-bridge-healing]
    paths: [.agents/connector-triggers/m1-ra-wip-a35-phase22.txt]

permissions: {contents: write}
concurrency: {group: agent-m1-ra-apply-wip, cancel-in-progress: false}

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Initialize activity log
        shell: bash
        run: |
          set -euo pipefail
          LOG="$RUNNER_TEMP/activity.log"; : > "$LOG"
          { echo "task=M1 R-A Phase22 compile repair A35"; echo "sha=$GITHUB_SHA"; date -u +"utc=%Y-%m-%dT%H:%M:%SZ"; } | tee -a "$LOG"
      - name: Checkout triggering commit
        uses: actions/checkout@v4
        with: {fetch-depth: 1}
      - name: Apply and push Phase22 repair
        shell: bash
        run: |
          set -euo pipefail
          LOG="$RUNNER_TEMP/activity.log"; exec > >(tee -a "$LOG") 2>&1
          trap 'rc=$?; echo "exit_code=$rc"; echo "final_head=$(git rev-parse HEAD 2>/dev/null || true)"; git status --short 2>/dev/null || true; exit $rc' EXIT
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 - <<'PY'
          from pathlib import Path
          def one(t,o,n,l):
              c=t.count(o)
              if c!=1: raise RuntimeError(f"{l}: expected 1, found {c}")
              return t.replace(o,n,1)
          def exact(t,o,n,c,l):
              found=t.count(o)
              if found!=c: raise RuntimeError(f"{l}: expected {c}, found {found}")
              return t.replace(o,n)
          helper='''const directional::geometry::SourceTopologyRegions *test_source_authority(
              const Eigen::MatrixXi &faces, const std::vector<int> &components,
              const std::vector<int> &sheets) {
            directional::geometry::SurfaceCellTracingOptions tracing;
            tracing.sourceFaceComponents = components;
            tracing.sourceFaceSheets = sheets;
            auto authority = directional::geometry::surface_cell_tracing_detail::
                build_source_topology_regions(faces, tracing);
            if (!authority.has_value()) throw std::runtime_error("Failed to construct typed test source authority.");
            static std::vector<std::unique_ptr<directional::geometry::SourceTopologyRegions>> arena;
            arena.push_back(std::make_unique<directional::geometry::SourceTopologyRegions>(std::move(*authority)));
            return arena.back().get();
          }

          '''
          p=Path("tests/SurfaceMeshOptimizerPhase22Tests.cpp"); t=p.read_text()
          t=one(t,"#include <directional/geometry/SurfaceMeshOptimizer.h>\n","#include <directional/geometry/SurfaceMeshOptimizer.h>\n#include <directional/geometry/SurfaceCellTracing.h>\n","tracing include")
          t=one(t,"#include <cstdint>\n","#include <cstdint>\n#include <memory>\n","memory include")
          t=one(t,"namespace {\n\nusing directional::geometry::SurfaceOptimizationConstraints;\n","namespace {\n\n"+helper+"using directional::geometry::SurfaceOptimizationConstraints;\n","authority helper")
          t=one(t,"  options.sourceFaceComponents = &components;\n  options.sourceFaceSheets = &sheets;\n","  options.sourceAuthority =\n      test_source_authority(sourceFaces, components, sheets);\n","validator options")
          t=one(t,"  constraints.sourceFaceComponent.assign(\n      static_cast<std::size_t>(sourceFaces.rows()), 0);\n  constraints.sourceFaceSheet.assign(\n      static_cast<std::size_t>(sourceFaces.rows()), 0);\n","  const std::vector<int> sourceComponents(static_cast<std::size_t>(sourceFaces.rows()), 0);\n  const std::vector<int> sourceSheets(static_cast<std::size_t>(sourceFaces.rows()), 0);\n  constraints.sourceAuthority = test_source_authority(sourceFaces, sourceComponents, sourceSheets);\n","final constraints")
          t=exact(t,"  directional::geometry::SourceChartTransitionGraph graph(\n      sourceFaces, components, sheets, hardEdges);\n","  const auto *sourceAuthority = test_source_authority(sourceFaces, components, sheets);\n  directional::geometry::SourceChartTransitionGraph graph(\n      sourceFaces, *sourceAuthority, hardEdges);\n",2,"chart graph")
          t=one(t,"  constraints.sourceFaceComponent = fixture.components;\n  constraints.sourceFaceSheet = fixture.sheets;\n","  constraints.sourceAuthority = test_source_authority(\n      fixture.sourceFaces, fixture.components, fixture.sheets);\n","hard rail constraints")
          t=one(t,"      SourcePointLabelSupport support(\n          &fixture.sourceFaces, &fixture.components, &fixture.sheets,\n          &fixture.hardEdges);\n","      SourcePointLabelSupport support(\n          &fixture.sourceFaces, test_source_authority(fixture.sourceFaces, fixture.components, fixture.sheets),\n          &fixture.hardEdges);\n","label support")
          t=one(t,"  SurfaceOptimizationConstraints boundaryConstraints;\n  boundaryConstraints.sourceFaceSheet = sheets;\n","  SurfaceOptimizationConstraints boundaryConstraints;\n  boundaryConstraints.sourceAuthority = test_source_authority(sourceFaces, components, sheets);\n","boundary authority")
          t=one(t,"  SurfaceOptimizationConstraints featureConstraints;\n  featureConstraints.sourceFaceSheet = sheets;\n","  SurfaceOptimizationConstraints featureConstraints;\n  featureConstraints.sourceAuthority = test_source_authority(sourceFaces, components, sheets);\n","feature authority")
          t=one(t,"  constraints.sourceFaceComponent = {0, 0, 1, 1};\n  constraints.sourceFaceSheet = {0, 0, 0, 0};\n\n  directional::geometry::SurfaceProjectionBvh bvh(vertices, sourceFaces);\n  directional::geometry::SurfaceProjectionOptions projectionOptions;\n  projectionOptions.faceComponents = &constraints.sourceFaceComponent;\n  projectionOptions.faceSheets = &constraints.sourceFaceSheet;\n","  const std::vector<int> sourceComponents = {0, 0, 1, 1};\n  const std::vector<int> sourceSheets = {0, 0, 0, 0};\n  constraints.sourceAuthority = test_source_authority(sourceFaces, sourceComponents, sourceSheets);\n\n  directional::geometry::SurfaceProjectionBvh bvh(vertices, sourceFaces);\n  directional::geometry::SurfaceProjectionOptions projectionOptions;\n  projectionOptions.faceComponents = &sourceComponents;\n  projectionOptions.faceSheets = &sourceSheets;\n","orientation authority")
          t=one(t,"  constraints.sourceFaceComponent = {7, 7, 7};\n  constraints.sourceFaceSheet = {0, 1, 1};\n","  constraints.sourceAuthority = test_source_authority(constraints.sourceFaces, {7, 7, 7}, {0, 1, 1});\n","m1b default")
          t=one(t,"  constraints.sourceFaceSheet = {0, 0, 1};\n","  constraints.sourceAuthority = test_source_authority(constraints.sourceFaces, {7, 7, 7}, {0, 0, 1});\n","m1b same sheet")
          t=one(t,"  componentMismatch.sourceFaceComponent[1] = 8;\n","  componentMismatch.sourceAuthority = test_source_authority(componentMismatch.sourceFaces, {7, 8, 7}, {0, 1, 1});\n","component mismatch")
          t=one(t,"  sheetMismatch.sourceFaceSheet[1] = 2;\n","  sheetMismatch.sourceAuthority = test_source_authority(sheetMismatch.sourceFaces, {7, 7, 7}, {0, 2, 1});\n","sheet mismatch")
          p.write_text(t)
          PY
          git diff --check
          git add tests/SurfaceMeshOptimizerPhase22Tests.cpp
          test "$(git diff --cached --name-only | wc -l)" -eq 1
          git config user.name directional-agent
          git config user.email directional-agent@users.noreply.github.com
          git commit -m "fix(m1): migrate Phase22 validation tests to source authority"
          git push origin HEAD:agent/surface_cell_quad/p5-recover-bridge-healing
          echo "pushed_head=$(git rev-parse HEAD)"
      - name: Upload activity log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "m1-ra-wip-a35-phase22-log-${{ github.run_id }}"
          path: "${{ runner.temp }}/activity.log"
          if-no-files-found: error
          retention-days: 7
