name: Agent M3 CP4c3 TB39 EXEC
on:
  push:
    branches: [agent/surface_cell_quad/p5-recover-bridge-healing]
    paths: [.agents/connector-triggers/m3-cp4c3-tb39-exec/trigger.json]
permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: write
concurrency:
  group: agent-m3-cp4c3-tb39-exec
  cancel-in-progress: false
jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/agent-m3-cp4c3-tb39-exec.yml
      source_ref: ${{ github.sha }}
    secrets: inherit
  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m3-cp4c3-tb39-exec
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit
  tb39:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout control source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          path: control
          token: ${{ secrets.GH_TOKEN || github.token }}
      - name: Checkout exact CB44 semantic source
        uses: actions/checkout@v4
        with:
          ref: 8756cfe983bf7e05209f560d59a522a6b5b0674a
          fetch-depth: 1
          path: semantic
          token: ${{ secrets.GH_TOKEN || github.token }}
      - name: Verify frozen checkout authority
        shell: bash
        run: |
          set -euo pipefail
          cd semantic
          test "$(git rev-parse HEAD)" = 8756cfe983bf7e05209f560d59a522a6b5b0674a
          test "$(sha256sum .agents/Directional/tools/m3_cp4c3_artifact_only_harness.sh|awk '{print $1}')" = aaadab351c0ba28a39c87aff1948f83ab0c4c71520662177e5cdf6fd08b30ed3
          test "$(sha256sum .agents/Directional/Architecture_M3_CP4c3_Required_Green_Selector_409.txt|awk '{print $1}')" = eea6d8c2bbc8e9247deb4bfbbe6763042c76002d1894dd62e35f80262403b53e
          test "$(sha256sum .agents/Directional/Architecture_M3_CP4c3_Required_Green_Selector_408.txt|awk '{print $1}')" = 2a742ba92dba744425fccaf81d5cc7a57885cbff37c779d525218fcd70500af6
          test "$(sha256sum tests/FieldAlignedCurveNetworkTests.cpp|awk '{print $1}')" = 913752b8e869b310e2bcb4d0b81a06c4231acdf0470db4427952958de7b3583b
          test -z "$(git status --short)"
      - name: Run explicit no-runtime package preflight
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
          ARTIFACT_ID: '10036808934'
          EXPECTED_ARTIFACT_NAME: m3-cp4c3-cb44-result-34174521296
          EXPECTED_PROVIDER_DIGEST: sha256:8944f1d16c1cab8884e7c39da236df7a3ec5846ae1fc085b8272440c8941b519
          EXPECTED_ZIP_SHA256: 8944f1d16c1cab8884e7c39da236df7a3ec5846ae1fc085b8272440c8941b519
          EXPECTED_SOURCE_SHA: 8756cfe983bf7e05209f560d59a522a6b5b0674a
          SELECTOR_RELATIVE_PATH: .agents/Directional/Architecture_M3_CP4c3_Required_Green_Selector_409.txt
          EXPECTED_SELECTOR_COUNT: '409'
          EXPECTED_SELECTOR_SHA256: eea6d8c2bbc8e9247deb4bfbbe6763042c76002d1894dd62e35f80262403b53e
          ACCEPTED_PREFIX_COUNT: '365'
          TURN_ID: M3-CP4c-3-TB39-PREFLIGHT
        shell: bash
        run: |
          set -euo pipefail
          cd semantic
          bash .agents/Directional/tools/m3_cp4c3_artifact_only_harness.sh --preflight-only
          root="${RUNNER_TEMP}/M3-CP4c-3-TB39-PREFLIGHT"; pkg="$root/package"; src="$root/source"; exe="$root/execution-view"
          test "$(sha256sum "$pkg/source/source-8756cfe983bf7e05209f560d59a522a6b5b0674a.tar.gz"|awk '{print $1}')" = 5ec4b65a576b081b91f2f487fce9eea9b2188f72bbc969ec124135e8d986cf20
          test "$(sha256sum "$src/.agents/Directional/Architecture_M3_CP4c3_Required_Green_Selector_408.txt"|awk '{print $1}')" = 2a742ba92dba744425fccaf81d5cc7a57885cbff37c779d525218fcd70500af6
          test "$(sha256sum "$src/tests/FieldAlignedCurveNetworkTests.cpp"|awk '{print $1}')" = 913752b8e869b310e2bcb4d0b81a06c4231acdf0470db4427952958de7b3583b
          test "$(sha256sum "$src/.agents/Directional/tools/m3_cp4c3_artifact_only_harness.sh"|awk '{print $1}')" = aaadab351c0ba28a39c87aff1948f83ab0c4c71520662177e5cdf6fd08b30ed3
          test -f "$src/benchmarks/fixtures/milestone-g/bunny_1k_random.obj"
          test -f "$exe/test-data/benchmarks/fixtures/milestone-g/bunny_1k_random.obj"
          grep -Fxq runtime_started=false "${RUNNER_TEMP}/M3-CP4c-3-TB39-PREFLIGHT-result/execution-boundary.txt"
          grep -Fxq runtime_completed=false "${RUNNER_TEMP}/M3-CP4c-3-TB39-PREFLIGHT-result/execution-boundary.txt"
          grep -Fxq orchestration_failure=false "${RUNNER_TEMP}/M3-CP4c-3-TB39-PREFLIGHT-result/execution-boundary.txt"
      - name: Execute immutable artifact-only selector409 harness
        id: execute
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
          TURN_ID: M3-CP4c-3-TB39-EXEC
          ARTIFACT_ID: '10036808934'
          EXPECTED_ARTIFACT_NAME: m3-cp4c3-cb44-result-34174521296
          EXPECTED_PROVIDER_DIGEST: sha256:8944f1d16c1cab8884e7c39da236df7a3ec5846ae1fc085b8272440c8941b519
          EXPECTED_ZIP_SHA256: 8944f1d16c1cab8884e7c39da236df7a3ec5846ae1fc085b8272440c8941b519
          EXPECTED_SOURCE_SHA: 8756cfe983bf7e05209f560d59a522a6b5b0674a
          SELECTOR_RELATIVE_PATH: .agents/Directional/Architecture_M3_CP4c3_Required_Green_Selector_409.txt
          EXPECTED_SELECTOR_COUNT: '409'
          EXPECTED_SELECTOR_SHA256: eea6d8c2bbc8e9247deb4bfbbe6763042c76002d1894dd62e35f80262403b53e
          ACCEPTED_PREFIX_COUNT: '365'
        shell: bash
        run: |
          set +e; cd semantic
          bash .agents/Directional/tools/m3_cp4c3_artifact_only_harness.sh --execute
          status=$?; echo "exit_code=$status" >> "$GITHUB_OUTPUT"; exit 0
      - name: Build TB39 machine-readable verification evidence
        if: always()
        env:
          HARNESS_EXIT: ${{ steps.execute.outputs.exit_code }}
          TURN_ID: M3-CP4c-3-TB39-EXEC
          EXPECTED_SOURCE_SHA: 8756cfe983bf7e05209f560d59a522a6b5b0674a
          EXPECTED_ARTIFACT_ID: '10036808934'
          EXPECTED_SOURCE_ARCHIVE_SHA256: 5ec4b65a576b081b91f2f487fce9eea9b2188f72bbc969ec124135e8d986cf20
          EXPECTED_SELECTOR_SHA256: eea6d8c2bbc8e9247deb4bfbbe6763042c76002d1894dd62e35f80262403b53e
          EXPECTED_SELECTOR408_SHA256: 2a742ba92dba744425fccaf81d5cc7a57885cbff37c779d525218fcd70500af6
          EXPECTED_HARNESS_SHA256: aaadab351c0ba28a39c87aff1948f83ab0c4c71520662177e5cdf6fd08b30ed3
          EXPECTED_TEST_SOURCE_SHA256: 913752b8e869b310e2bcb4d0b81a06c4231acdf0470db4427952958de7b3583b
        shell: bash
        run: |
          set -euo pipefail
          result="${RUNNER_TEMP}/M3-CP4c-3-TB39-EXEC-result"; pre="${RUNNER_TEMP}/M3-CP4c-3-TB39-PREFLIGHT-result"
          mkdir -p "$result"
          if [[ -d "$pre" ]]; then mkdir -p "$result/preflight"; cp -a "$pre/." "$result/preflight/"; fi
          python3 control/.agents/connector-triggers/m3-cp4c3-tb39-exec/verifier.py "$result" "${HARNESS_EXIT:-unavailable}"
      - name: Upload TB39 result artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-cp4c3-tb39-result-${{ github.run_id }}
          path: ${{ runner.temp }}/M3-CP4c-3-TB39-EXEC-result
          if-no-files-found: error
          retention-days: 7
      - name: Upload TB39 persistent log artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-cp4c3-tb39-log-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/M3-CP4c-3-TB39-PREFLIGHT.log
            ${{ runner.temp }}/M3-CP4c-3-TB39-EXEC.log
          if-no-files-found: error
          retention-days: 7
      - name: Fail only on orchestration harness failure
        if: always()
        env:
          HARNESS_EXIT: ${{ steps.execute.outputs.exit_code }}
        run: test "${HARNESS_EXIT:-unavailable}" = 0
