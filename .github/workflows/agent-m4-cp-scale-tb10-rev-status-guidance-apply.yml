name: M4 CP SCALE TB10 Review STATUS Guidance Apply

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m4-cp-scale-tb10-rev/status-guidance-apply.txt

permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

concurrency:
  group: m4-cp-scale-tb10-rev-status-guidance-apply
  cancel-in-progress: false

jobs:
  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m4-cp-scale-tb10-rev-status-guidance-apply
      commit_run_file: false
    secrets: inherit

  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/agent-m4-cp-scale-tb10-rev-status-guidance-apply.yml
    secrets: inherit

  apply:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1TV-Ny_6E_TH666n4sBo3hZ9CfaMXFmqe
      patch_sha256: 'c89bd965571a3f2b8df7e91e03a79d4b01caa7e9997aeab2729a237ba9cb1e98'
      base_sha: 65309de6e3e0bf485fa62135415944ce2ccbadf8
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: 'docs: update STATUS beacon lifecycle guidance'
      retention_days: 14
    secrets: inherit
