name: M3 CP4c3 TB31 Artifact-Only EXEC

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/tb31-exec/m3-cp4c3-tb31-exec-*.json

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: m3-cp4c3-tb31-exec-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/agent-tb31-exec.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  observe:
    if: ${{ github.event_name == 'push' }}
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: tb31-exec
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  execute:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Initialize persistent wrapper log
        shell: bash
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/m3-cp4c3-tb31-exec-wrapper.log"
          : > "$log"
          printf '%s\n' \
            "workflow=$GITHUB_WORKFLOW" \
            "run_id=$GITHUB_RUN_ID" \
            "event=$GITHUB_EVENT_NAME" \
            "event_sha=$GITHUB_SHA" \
            "ref=$GITHUB_REF" \
            "repository=$GITHUB_REPOSITORY" \
            'turn=M3-CP4c-3-TB31-EXEC' \
            'artifact_id=9982174864' \
            'expected_source_sha=90bf8430f54c8b81fb90a6bda820cf8edebce6e9' \
            'runtimeBoundary=artifact-only' \
            "started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" | tee -a "$log"

      - name: Checkout exact control source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          submodules: false
          lfs: false

      - name: Verify and execute immutable artifact-only harness
        id: execute
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set +e
          wrapper="${RUNNER_TEMP}/m3-cp4c3-tb31-exec-wrapper.log"
          harness=".agents/Directional/turn-payloads/m3_cp4c3_tb31_exec_harness.sh"
          expected_harness_sha='1f4ed91cb8ac055632b574a6b08a4aa0fb45b9e07c125b9f08f30d7baaef47bb'
          actual_harness_sha="$(sha256sum "$harness" | awk '{print $1}')"
          printf '%s\n' "harness=$harness" "expected_harness_sha256=$expected_harness_sha" "actual_harness_sha256=$actual_harness_sha" | tee -a "$wrapper"
          if [[ "$actual_harness_sha" != "$expected_harness_sha" ]]; then
            echo 'harness digest mismatch' | tee -a "$wrapper" >&2
            status=91
          else
            chmod_state="$(stat -c '%a' "$harness")"
            echo "harness_mode=$chmod_state" | tee -a "$wrapper"
            if [[ "$chmod_state" != 755 ]]; then
              echo 'harness executable mode mismatch; no repair authorized' | tee -a "$wrapper" >&2
              status=92
            else
              "$harness" --execute
              status=$?
            fi
          fi
          echo "harness_exit=$status" | tee -a "$wrapper"
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload TB31 result evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-cp4c3-tb31-result-${{ github.run_id }}
          path: ${{ runner.temp }}/m3-cp4c3-tb31-result
          if-no-files-found: error
          retention-days: 14

      - name: Upload TB31 diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-cp4c3-tb31-log-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/m3-cp4c3-tb31.log
            ${{ runner.temp }}/m3-cp4c3-tb31-exec-wrapper.log
          if-no-files-found: error
          retention-days: 14

      - name: Propagate harness status
        if: always()
        env:
          HARNESS_EXIT: ${{ steps.execute.outputs.exit_code }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$HARNESS_EXIT"
          if [[ "$HARNESS_EXIT" != 0 ]]; then
            echo "TB31 artifact-only harness failed with exit ${HARNESS_EXIT}" >&2
            exit "$HARNESS_EXIT"
          fi
          echo 'TB31 artifact-only harness completed without orchestration failure.'
