name: M5 CP3 CB8 Closeout Patch Apply

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m5-cp3-cb8-closeout-apply.txt

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

concurrency:
  group: m5-cp3-cb8-closeout-apply-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/m5-cp3-cb8-closeout-apply.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m5-cp3-cb8-closeout-apply
      commit_run_file: false
    secrets: inherit

  apply:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1jMSh2ebm4B2O56Ye8DPN9bl7Nn4O7qHf
      patch_sha256: c17564f34974448639ce7992904f9dd984852af40f35cc31b77e457a1b095d3e
      base_sha: a2c41bd7b962b9ffe08f31903dcd283b7ea7a79c
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: M5-CP3-CB8 durable closeout
    secrets: inherit
