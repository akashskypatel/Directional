name: Agent Build Surface Cell P5 R1D

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .github/workflows/agent-build-p5-r1d.yml
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: agent-surface-cell-p5-r1d-${{ github.ref }}
  cancel-in-progress: true

env:
  ACTIVE_BRANCH: agent/surface_cell_quad/p5-recover-bridge-healing
  BUILD_DIR: build/agent-p5-r1d-release
  PACKAGE_DIR: artifact
  LOG_DIR: /tmp/p5-r1d-workflow-logs
  ACTIVITY_LOG: /tmp/p5-r1d-workflow-logs/p5-r1d-compile-activity.log

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Initialize persistent workflow log
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${LOG_DIR}"
          {
            echo "P5-R1D adjacent local-sheet exact-adjacency compile-only build"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "run_attempt=${GITHUB_RUN_ATTEMPT}"
            echo "event_sha=${GITHUB_SHA}"
            echo "started_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } | tee "${ACTIVITY_LOG}"

      - name: Record compile-only run start
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          message="P5-R1D compile-only run ${GITHUB_RUN_ID} started for event commit ${GITHUB_SHA}. Exact manifold adjacency is corrected across local-sheet labels; exactly four targets are compiled and no project binary executes."
          echo "start_comment=${message}" | tee -a "${ACTIVITY_LOG}"
          gh api repos/${GITHUB_REPOSITORY}/issues/8/comments -f body="${message}"

      - name: Checkout exact working branch
        uses: actions/checkout@v4
        with:
          ref: agent/surface_cell_quad/p5-recover-bridge-healing
          fetch-depth: 2
          submodules: false
          persist-credentials: true

      - name: Apply exact R1D correction, compile, and package
        id: compile
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "${LOG_DIR}"
          exec > >(tee -a "${ACTIVITY_LOG}") 2>&1
          PS4='+ ${BASH_SOURCE}:${LINENO}: '
          finish() {
            rc=$?
            trap - EXIT
            set +x
            {
              echo "compile_step_exit_code=${rc}"
              echo "compile_step_finished_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
              echo "final_git_status_begin"
              git status --short --branch || true
              echo "final_git_status_end"
              df -h . || true
              du -sh "${BUILD_DIR}" "${PACKAGE_DIR}" 2>/dev/null || true
            } | tee -a "${ACTIVITY_LOG}"
            exit "${rc}"
          }
          trap finish EXIT
          set -x

          event_sha=$(git rev-parse HEAD)
          remote_sha=$(git ls-remote origin "refs/heads/${ACTIVE_BRANCH}" | cut -f1)
          test "${event_sha}" = "${remote_sha}"
          git status --porcelain=v1 > /tmp/pre-transform-status.txt
          test ! -s /tmp/pre-transform-status.txt

          if ! grep -Fq 'Exact manifold adjacency may cross local-sheet labels' include/directional/geometry/SourceChartTransitions.h; then
            python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one replacement site, found {count}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'include/directional/geometry/SourceChartTransitions.h',
              '''/** Exact per-face projection chart. Intrinsic connectivity never crosses a
           * component, local-sheet, hard-rail, boundary, or nonmanifold barrier. */''',
              '''/** Exact per-face projection chart. Local-sheet remains authoritative
           * provenance. Exact manifold adjacency may cross local-sheet labels, while
           * component, hard-rail, boundary, and nonmanifold barriers remain authoritative. */''')

          replace_once(
              'include/directional/geometry/SourceChartTransitions.h',
              ''' * Connectivity is derived only from exact source topology, component/sheet
           * labels, and hard-edge barriers. World-space proximity and source-triangle
           * pairing never participate. A transition is admitted only across a manifold
           * source edge whose two charts have the same component and local-sheet labels.
           */''',
              ''' * Connectivity is derived only from exact source topology, source-component
           * labels, and hard-edge barriers. World-space proximity and source-triangle
           * pairing never participate. Local-sheet labels remain in chart identity,
           * provenance, and hashes, but do not split an otherwise admissible exact
           * manifold transition within one source component.
           */''')

          replace_once(
              'include/directional/geometry/SourceChartTransitions.h',
              '''      if ((*components_)[static_cast<std::size_t>(firstFace)] !=
                  (*components_)[static_cast<std::size_t>(secondFace)] ||
              (*sheets_)[static_cast<std::size_t>(firstFace)] !=
                  (*sheets_)[static_cast<std::size_t>(secondFace)]) {
            continue;
          }
          unite(firstFace, secondFace);''',
              '''      if ((*components_)[static_cast<std::size_t>(firstFace)] !=
              (*components_)[static_cast<std::size_t>(secondFace)]) {
            continue;
          }
          // Exact manifold topology, not a local projection-chart label, owns
          // intrinsic adjacency. Local-sheet labels remain attached to each chart
          // and still constrain non-topological capture and projection consumers.
          unite(firstFace, secondFace);''')

          marker = '''TEST(SourceChartTransitionsR1, HardRailSplitsAdjacentProjectionCharts) {
          '''
          inserted = '''TEST(SourceChartTransitionsR1,
               ExactManifoldAdjacencyCrossesLocalSheetLabels) {
            Eigen::MatrixXi faces(2, 3);
            faces << 0, 1, 2,
                     2, 1, 3;
            const std::vector<int> components = {0, 0};
            const std::vector<int> sheets = {4, 9};
            const directional::geometry::SourceChartTransitionGraph graph(
                faces, components, sheets);

            ASSERT_TRUE(graph.available());
            ASSERT_EQ(2U, graph.transitions().size());
            EXPECT_EQ(graph.chart_component(0), graph.chart_component(1));

            directional::geometry::SurfacePoint point;
            point.face = 0;
            point.component = 0;
            point.sheet = 4;
            point.barycentric << 0.0, 0.25, 0.75;
            directional::geometry::SurfacePoint rebound;
            ASSERT_TRUE(graph.rebind(point, 1, rebound));
            EXPECT_EQ(1, rebound.face);
            EXPECT_EQ(0, rebound.component);
            EXPECT_EQ(9, rebound.sheet);
            EXPECT_NEAR(0.75, rebound.barycentric(0), 1.0e-12);
            EXPECT_NEAR(0.25, rebound.barycentric(1), 1.0e-12);
            EXPECT_NEAR(0.0, rebound.barycentric(2), 1.0e-12);
            EXPECT_EQ(graph.resolve_entity(point).canonical,
                      graph.resolve_entity(rebound).canonical);
          }

          TEST(SourceChartTransitionsR1,
               SourceVertexFanCrossesAdjacentLocalSheetLabels) {
            Eigen::MatrixXi faces(2, 3);
            faces << 0, 1, 2,
                     2, 1, 3;
            const std::vector<int> components = {0, 0};
            const std::vector<int> sheets = {2, 6};
            const directional::geometry::SourceChartTransitionGraph graph(
                faces, components, sheets);

            directional::geometry::SurfacePoint point;
            point.face = 0;
            point.component = 0;
            point.sheet = 2;
            point.barycentric << 0.0, 1.0, 0.0;
            directional::geometry::SurfacePoint rebound;
            ASSERT_TRUE(graph.rebind(point, 1, rebound));
            EXPECT_EQ(6, rebound.sheet);
            EXPECT_EQ(graph.resolve_entity(point).canonical,
                      graph.resolve_entity(rebound).canonical);
          }

          TEST(SourceChartTransitionsR1,
               ComponentMismatchBlocksExactManifoldAdjacency) {
            Eigen::MatrixXi faces(2, 3);
            faces << 0, 1, 2,
                     2, 1, 3;
            const std::vector<int> components = {0, 1};
            const std::vector<int> sheets = {4, 9};
            const directional::geometry::SourceChartTransitionGraph graph(
                faces, components, sheets);

            ASSERT_TRUE(graph.available());
            EXPECT_TRUE(graph.transitions().empty());
            EXPECT_NE(graph.chart_component(0), graph.chart_component(1));
            directional::geometry::SurfacePoint point;
            point.face = 0;
            point.component = 0;
            point.sheet = 4;
            point.barycentric << 0.0, 0.5, 0.5;
            directional::geometry::SurfacePoint rebound;
            EXPECT_FALSE(graph.rebind(point, 1, rebound));
          }

          TEST(SourceChartTransitionsR1,
               NonManifoldSharedEdgeDoesNotCreateTransition) {
            Eigen::MatrixXi faces(3, 3);
            faces << 0, 1, 2,
                     2, 1, 3,
                     1, 2, 4;
            const std::vector<int> components = {0, 0, 0};
            const std::vector<int> sheets = {0, 1, 2};
            const directional::geometry::SourceChartTransitionGraph graph(
                faces, components, sheets);

            ASSERT_TRUE(graph.available());
            EXPECT_TRUE(graph.transitions().empty());
            EXPECT_NE(graph.chart_component(0), graph.chart_component(1));
            EXPECT_NE(graph.chart_component(1), graph.chart_component(2));
          }

          ''' + marker
          replace_once('tests/SurfaceArrangementPhase16Tests.cpp', marker, inserted)

          replace_once(
              'tests/SurfaceArrangementPhase16Tests.cpp',
              '  const std::vector<int> sheets = {7, 7};\n',
              '  const std::vector<int> sheets = {7, 11};\n')
          replace_once(
              'tests/SurfaceArrangementPhase16Tests.cpp',
              '  const std::vector<int> reorderedSheets = {7, 7};\n',
              '  const std::vector<int> reorderedSheets = {11, 7};\n')
          replace_once(
              'tests/SurfaceArrangementPhase16Tests.cpp',
              '  const std::vector<int> sheets = {5, 5};\n',
              '  const std::vector<int> sheets = {5, 9};\n')
          PY

            git diff --check
            test -n "$(git status --porcelain=v1)"
            git diff --binary > /tmp/P5-R1D-applied.patch
            sha256sum /tmp/P5-R1D-applied.patch | tee /tmp/reviewed-patch-sha256.txt

            git config user.name directional-build-agent
            git config user.email directional-build-agent@users.noreply.github.com
            git add include tests
            git commit -m 'P5-R1D: admit exact adjacency across local sheets [skip ci]'
            git push origin "HEAD:${ACTIVE_BRANCH}"
          else
            echo "reviewed P5-R1D correction already present"
            printf '%s\n' already-present > /tmp/reviewed-patch-sha256.txt
          fi

          source_sha=$(git rev-parse HEAD)
          remote_sha=$(git ls-remote origin "refs/heads/${ACTIVE_BRANCH}" | cut -f1)
          test "${source_sha}" = "${remote_sha}"
          printf '%s\n' "${source_sha}" > /tmp/source-commit.txt
          printf '%s\n' "${event_sha}" > /tmp/workflow-event-commit.txt

          git submodule sync --recursive
          git submodule update --init --recursive --depth 1 --jobs 4
          git submodule status --recursive | tee /tmp/submodule-status.txt
          test "$(wc -l < /tmp/submodule-status.txt)" -eq 9
          git diff --check
          git status --porcelain=v1 > /tmp/source-status.txt
          test ! -s /tmp/source-status.txt

          rm -rf "${BUILD_DIR}" "${PACKAGE_DIR}"
          mkdir -p "${BUILD_DIR}" "${PACKAGE_DIR}/bin" "${PACKAGE_DIR}/lib" \
            "${PACKAGE_DIR}/source" "${PACKAGE_DIR}/logs"

          cmake -S . -B "${BUILD_DIR}" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_FLAGS_RELEASE='-O2 -DNDEBUG' \
            -DBUILD_SHARED_LIBS=OFF \
            -DDIRECTIONAL_BUILD_TESTS=ON \
            -DDIRECTIONAL_BUILD_BENCHMARKS=ON \
            -DDIRECTIONAL_BUILD_CLI=OFF \
            -DDIRECTIONAL_BUILD_GUI=OFF \
            -DDIRECTIONAL_ENABLE_GMP=OFF \
            -DDIRECTIONAL_ENABLE_PARDISO=OFF \
            -DDIRECTIONAL_ENABLE_CUDSS=OFF \
            -DDIRECTIONAL_ENABLE_SUITESPARSE=OFF \
            |& tee "${BUILD_DIR}/configure.log"

          cmake --build "${BUILD_DIR}" \
            --target directional_core directional_pipeline directional_phase1_tests directional_benchmarks \
            -j 4 |& tee "${BUILD_DIR}/build.log"

          test -f "${BUILD_DIR}/libdirectional_core.a"
          test -f "${BUILD_DIR}/libdirectional_pipeline.a"
          test -x "${BUILD_DIR}/directional_phase1_tests"
          test -x "${BUILD_DIR}/directional_benchmarks"

          fixture_root="${BUILD_DIR}/test-data/benchmarks/fixtures"
          find "${fixture_root}" -type f | sort | tee /tmp/fixture-files.txt
          test "$(wc -l < /tmp/fixture-files.txt)" -eq 26
          git status --porcelain=v1 > /tmp/source-status.txt
          test ! -s /tmp/source-status.txt

          cp "${BUILD_DIR}/directional_phase1_tests" "${PACKAGE_DIR}/bin/"
          cp "${BUILD_DIR}/directional_benchmarks" "${PACKAGE_DIR}/bin/"
          cp -a "${BUILD_DIR}/test-data" "${PACKAGE_DIR}/bin/"
          cp "${BUILD_DIR}/libdirectional_core.a" "${PACKAGE_DIR}/lib/"
          cp "${BUILD_DIR}/libdirectional_pipeline.a" "${PACKAGE_DIR}/lib/"
          git archive --format=tar.gz --output="${PACKAGE_DIR}/source/source.tar.gz" HEAD
          cp /tmp/source-commit.txt /tmp/workflow-event-commit.txt \
            /tmp/reviewed-patch-sha256.txt /tmp/source-status.txt \
            /tmp/submodule-status.txt /tmp/fixture-files.txt "${PACKAGE_DIR}/"
          cp "${BUILD_DIR}/configure.log" "${BUILD_DIR}/build.log" \
            "${ACTIVITY_LOG}" "${PACKAGE_DIR}/logs/"
          find "${PACKAGE_DIR}" -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/files.sha256
          mv /tmp/files.sha256 "${PACKAGE_DIR}/files.sha256"
          sha256sum "${PACKAGE_DIR}/bin/directional_phase1_tests" \
            "${PACKAGE_DIR}/bin/directional_benchmarks" \
            "${PACKAGE_DIR}/lib/libdirectional_core.a" \
            "${PACKAGE_DIR}/lib/libdirectional_pipeline.a" \
            | tee "${PACKAGE_DIR}/built-targets.sha256"

      - name: Upload compiled checkpoint
        if: steps.compile.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: surface-cell-p5-r1d-github-source-linux-release
          path: artifact
          if-no-files-found: error
          retention-days: 14
          compression-level: 6

      - name: Record compile-only result
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          COMPILE_OUTCOME: ${{ steps.compile.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${LOG_DIR}"
          source_sha=$(git rev-parse HEAD 2>/dev/null || printf '%s' unknown)
          message="P5-R1D compile-only run ${GITHUB_RUN_ID} finished ${COMPILE_OUTCOME}. Event commit: ${GITHUB_SHA}; exact source head: ${source_sha}. Detailed activity is retained in the workflow log artifact. No project binary executed."
          echo "result_comment=${message}" | tee -a "${ACTIVITY_LOG}"
          gh api repos/${GITHUB_REPOSITORY}/issues/8/comments -f body="${message}"

      - name: Always upload detailed workflow logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surface-cell-p5-r1d-workflow-logs-${{ github.run_id }}
          path: /tmp/p5-r1d-workflow-logs
          if-no-files-found: error
          retention-days: 30
