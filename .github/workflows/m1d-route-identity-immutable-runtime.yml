name: m1d-route-identity-immutable-runtime

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - '.agents/connector-triggers/m1d-route-identity-immutable-runtime'

permissions:
  contents: read
  actions: read

jobs:
  runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - case_name: BunnyRandom
            guard_seconds: 90
          - case_name: Vase
            guard_seconds: 60
    env:
      ARTIFACT_ID: '9046308272'
      BUILD_RUN_ID: '31342400614'
      EXPECTED_ARTIFACT_SHA: '6a9dd880e2e7548b8afc88da48e7ed49935e6ce672ba1af208eee8f84678152c'
      EXPECTED_MANIFEST_SHA: 'e9859b25bd6d3a721484abdae679fcf898a85e1903b176192696d4b6b9e7eef0'
      EXPECTED_PRODUCER_SHA: '0809eccc8625f588d077ab0598d47c9a75b051c58e8375af866a01ff9f2327b7'
      EXPECTED_IMPLEMENTATION: '9446fc82d98d336d3bd59c190dd2bbbe94bd2e25'
      EXPECTED_BUILD_EVENT: '98a21f3d843533dcc44cb296711268e0ebb26fb6'
      CASE_NAME: ${{ matrix.case_name }}
      GUARD_SECONDS: ${{ matrix.guard_seconds }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Run immutable preflight runtime and postflight
        shell: bash
        run: |
          set -Eeuo pipefail
          root="$RUNNER_TEMP/m1d-runtime-$CASE_NAME"
          pkg="$root/package"
          evidence="$root/evidence"
          mkdir -p "$pkg" "$evidence"
          api="https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID"
          curl --fail-with-body -sS -L \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$api" > "$evidence/artifact-metadata.json"
          python3 - "$evidence/artifact-metadata.json" <<'PY'
          import json, os, sys
          data = json.load(open(sys.argv[1]))
          assert data['id'] == int(os.environ['ARTIFACT_ID'])
          assert data['digest'] == 'sha256:' + os.environ['EXPECTED_ARTIFACT_SHA']
          assert data['workflow_run']['id'] == int(os.environ['BUILD_RUN_ID'])
          assert not data['expired']
          PY
          curl --fail-with-body -sS -L \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$api/zip" -o "$root/artifact.zip"
          actual_zip="$(sha256sum "$root/artifact.zip" | awk '{print $1}')"
          test "$actual_zip" = "$EXPECTED_ARTIFACT_SHA"
          echo "artifact_sha256=$actual_zip" > "$evidence/preflight.txt"
          python3 - "$root/artifact.zip" <<'PY'
          import pathlib, sys, zipfile
          with zipfile.ZipFile(sys.argv[1]) as z:
              names = z.namelist()
              assert len(names) == 60, len(names)
              for name in names:
                  p = pathlib.PurePosixPath(name)
                  assert not p.is_absolute()
                  assert '..' not in p.parts
              z.extractall(pathlib.Path(sys.argv[1]).parent / 'package')
          PY
          cd "$pkg"
          manifest_sha="$(sha256sum SHA256SUMS | awk '{print $1}')"
          test "$manifest_sha" = "$EXPECTED_MANIFEST_SHA"
          test "$(wc -l < SHA256SUMS)" -eq 59
          sha256sum -c SHA256SUMS > "$evidence/manifest-preflight.txt"
          test "$(find . -type f | wc -l)" -eq 60
          python3 - metadata/build-authority.json <<'PY'
          import json, os, sys
          data = json.load(open(sys.argv[1]))
          assert data['implementationCommit'] == os.environ['EXPECTED_IMPLEMENTATION']
          assert data['buildEventCommit'] == os.environ['EXPECTED_BUILD_EVENT']
          assert data['workflowRun'] == os.environ['BUILD_RUN_ID']
          assert data['runtimeExecution'] is False
          assert data['m1dFocusedStaticTestCount'] == 6
          assert data['expectedProducerDiscoveryCount'] == 178
          assert data['expectedRequiredGreenSegmentCount'] == 163
          PY
          producer_sha="$(sha256sum bin/directional_surface_cell_producer_tests | awk '{print $1}')"
          test "$producer_sha" = "$EXPECTED_PRODUCER_SHA"
          echo "manifest_sha256=$manifest_sha" >> "$evidence/preflight.txt"
          echo "producer_sha256=$producer_sha" >> "$evidence/preflight.txt"
          chmod +x bin/directional_surface_cell_producer_tests
          ln -s ../test-data bin/test-data
          filter="UniformPhaseFront/SurfaceCellDesignAcceptance.ProducesDirectSourceAuthoritativePureQuadOutput/$CASE_NAME"
          start="$(date +%s.%N)"
          set +e
          (
            cd bin
            /usr/bin/time -v -o "$evidence/runtime-resources.txt" \
              timeout "$GUARD_SECONDS" ./directional_surface_cell_producer_tests \
              --gtest_filter="$filter" > "$evidence/runtime.log" 2>&1
          )
          runtime_rc=$?
          set -e
          end="$(date +%s.%N)"
          elapsed="$(python3 - <<PY
          print(f'{float("$end")-float("$start"):.3f}')
          PY
          )"
          selected="$(python3 - "$evidence/runtime.log" <<'PY'
          import pathlib, re, sys
          text = pathlib.Path(sys.argv[1]).read_text(errors='replace')
          m = re.search(r'Running (\d+) test(?:s)? from', text)
          print(m.group(1) if m else 'NA')
          PY
          )"
          {
            echo "case=$CASE_NAME"
            echo "filter=$filter"
            echo "selected=$selected"
            echo "runtime_rc=$runtime_rc"
            echo "elapsed_s=$elapsed"
            echo "guard_seconds=$GUARD_SECONDS"
          } > "$evidence/runtime-meta.txt"
          test "$selected" = "1"
          sha256sum -c SHA256SUMS > "$evidence/manifest-postflight.txt"
          post_manifest_sha="$(sha256sum SHA256SUMS | awk '{print $1}')"
          post_producer_sha="$(sha256sum bin/directional_surface_cell_producer_tests | awk '{print $1}')"
          post_zip_sha="$(sha256sum "$root/artifact.zip" | awk '{print $1}')"
          test "$post_manifest_sha" = "$EXPECTED_MANIFEST_SHA"
          test "$post_producer_sha" = "$EXPECTED_PRODUCER_SHA"
          test "$post_zip_sha" = "$EXPECTED_ARTIFACT_SHA"
          test "$(find . -type f | wc -l)" -eq 60
          {
            echo "artifact_sha256=$post_zip_sha"
            echo "manifest_sha256=$post_manifest_sha"
            echo "producer_sha256=$post_producer_sha"
            echo "regular_files=$(find . -type f | wc -l)"
          } > "$evidence/postflight.txt"
          echo "EVIDENCE_DIR=$evidence" >> "$GITHUB_ENV"

      - name: Upload runtime evidence
        uses: actions/upload-artifact@v4
        with:
          name: m1d-${{ matrix.case_name }}-runtime-evidence
          path: ${{ env.EVIDENCE_DIR }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 6
