name: M4 CP-SCALE TB12 R1 Review Docs Apply

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m4-cp-scale-tb12-r1-rev-docs-apply-20260917.txt

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

concurrency:
  group: m4-cp-scale-tb12-r1-rev-docs-apply
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/m4-cp-scale-tb12-r1-rev-docs-apply.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m4-cp-scale-tb12-r1-rev-docs-apply
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  apply:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1gZpoaWu7yw2fyktc9RUPHG_Red7-6i1e
      patch_sha256: '752f1b1beef20a1d0d3e0c3f9dc2b5470ebba8e7548a3ad0f33c73b558e6c8b6'
      base_sha: fa02f69c7c2466667a0c6921442c8def810a76e2
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: 'docs: close M4 CP-SCALE TB12-R1 Review and hand off CB15'
      retention_days: 14
    secrets: inherit
