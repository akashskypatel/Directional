name: M6 CP1 TB8 A6 Closeout Docs Apply

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m6-cp1-tb8-a6-closeout-docs.txt

permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

concurrency:
  group: m6-cp1-tb8-a6-closeout-docs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m6-cp1-tb8-a6-closeout-docs
      commit_run_file: false
      trim_stale_comments: false
    secrets: inherit

  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/m6-cp1-tb8-a6-closeout-docs.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  apply:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1s7zXSRG3FGyC_LyUdZ7CITtUtyKkGsBS
      patch_sha256: 608d87d3f4cf1669e76cf13e8f891767e953a0642bc4fd4b5c901f0ee4c0f74e
      base_sha: b4c28656b7892ff6b7c80897a7616c29bb4de7e9
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: "M6-CP1-TB8-A6-EXEC: close artifact-only runtime"
    secrets: inherit
