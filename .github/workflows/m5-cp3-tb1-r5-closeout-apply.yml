name: M5 CP3 TB1 R5 Closeout Apply

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m5-cp3-tb1-r5-closeout-apply.txt

permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

concurrency:
  group: m5-cp3-tb1-r5-closeout-apply-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/m5-cp3-tb1-r5-closeout-apply.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m5-cp3-tb1-r5-closeout-apply
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  apply:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1YCUEG3qtqSQc8JYkiDMhon2Gk2GSoURq
      patch_sha256: '305cc10316830dbed451179c83b5df75032ab7968c55d324cf95fed7628427c4'
      base_sha: 887603366c101821a3b81096f804ac148ef429b3
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: 'docs: record M5-CP3-TB1-R5 execution'
    secrets: inherit
