    secrets: inherit

  apply:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1K8aesRPjfQepL5jfxlLDbzBs9obMzWRy
      patch_sha256: dde844153f1d4f5d6871f38b993f47f8b4678e9cc94ab5ecb75ecfa9f04bdb31
