name: M3 CP4c-1 CB3 Apply Selector Patch

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m3-cp4c1-cb3/apply-selector.txt

permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

concurrency:
  group: m3-cp4c1-cb3-apply-selector-${{ github.ref }}
  cancel-in-progress: false

jobs:
  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m3-cp4c1-cb3-apply-selector
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/agent-m3-cp4c1-cb3-apply-selector.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  apply:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1c4Kn7Y9W1S2leJL9GLYgRH6tUTTGH5b1
      patch_sha256: 9644f2a7eca6c03a5a48531237c89594ede69c8a9aba794bcf9e6285b8fb471f
      base_sha: b12fee5d962d64f3db7acb9c62a28f9b285fa8ab
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: 'test-gate: freeze M3 CP4c-1 cumulative 355 selector'
    secrets: inherit
