name: Agent M4 CP3 CB4 R4 Patch Apply

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m4-cp3-cb4-r4-apply.txt

permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

concurrency:
  group: agent-m4-cp3-cb4-r4-apply-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/agent-m4-cp3-cb4-r4-apply.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m4-cp3-cb4-r4-apply
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  apply:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1HoQdtDO-beu0CKTTRotGtqoyEi-WZ6by
      patch_sha256: c299652699fde4ed65352dc139fc945b7e4b6a557287acf1434cf33e81c129f4
      base_sha: 4defb0cc7992c669f146f6927e58a393baae8fec
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: "build: update mandatory packaged-test identity for M4-CP3-CB4-R4"
    secrets: inherit
