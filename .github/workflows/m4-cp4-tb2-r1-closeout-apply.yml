name: M4 CP4 TB2 R1 Closeout Apply

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m4-cp4-tb2-r1/apply-closeout.txt

permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

concurrency:
  group: m4-cp4-tb2-r1-closeout-apply
  cancel-in-progress: false

jobs:
  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m4-cp4-tb2-r1-closeout-apply
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/m4-cp4-tb2-r1-closeout-apply.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  apply:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1OIWZqZMjafysgUQSIpyxmPYvQzRrVcU3
      patch_sha256: a1dc9f6956ae527faa52e9a1b5233482cd5e173f78c45e2e0b898eeb6eeb8ade
      base_sha: 42dea9844fc09d298ba6fa7c1c1b7eb7a7df28fa
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: "M4-CP4-TB2-R1-EXEC: closeout orchestration-invalid attempt"
      retention_days: 7
    secrets: inherit
