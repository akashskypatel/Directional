name: M4 CP-COND CB2 Compile

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/cb/m4-cp-cond-cb2/compile.txt

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: m4-cp-cond-cb2-${{ github.ref }}
  cancel-in-progress: false

jobs:
  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m4-cp-cond-cb2
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  compile:
    uses: ./.github/workflows/agent-compile-reusable.yml
    with:
      source_sha: b576d061e23873b7b4193b158138d2097c75a728
      targets: directional_core directional_pipeline directional_surface_cell_authority_kernel_tests directional_surface_cell_producer_tests directional_surface_cell_completion_tests directional_surface_cell_validation_tests directional_compiled_api_tests
      artifact_prefix: m4-cp-cond-cb2
    secrets: inherit
