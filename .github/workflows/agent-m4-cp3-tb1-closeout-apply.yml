      workflow_path: .github/workflows/agent-m4-cp3-tb1-closeout-apply.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  apply:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1pityYXnRnx-GTYB1H0HNbeC9R_ViuV-d
      patch_sha256: d262bab18d798afd9a6ff9b2fdf291d0288e486b810b014f6cb76caf8fb33a18
