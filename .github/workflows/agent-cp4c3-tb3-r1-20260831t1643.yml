name: M3 CP4c3 TB3 R1 Artifact Gate

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/cp4c3-tb3-r1-20260831t1643.txt

permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: m3-cp4c3-tb3-r1
  cancel-in-progress: false

jobs:
  validate-caller:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/agent-cp4c3-tb3-r1-20260831t1643.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: cp4c3-tb3-r1
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  gate:
    needs: validate-caller
    if: ${{ needs.validate-caller.outputs.valid == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Initialize diagnostic log
        shell: bash
        run: |
          set -euo pipefail
          : > "${RUNNER_TEMP}/cp4c3-tb3-r1.log"
          printf '%s\n' "workflow=$GITHUB_WORKFLOW" "run_id=$GITHUB_RUN_ID" "event_sha=$GITHUB_SHA" "started_at=$(date -u +%FT%TZ)" | tee -a "${RUNNER_TEMP}/cp4c3-tb3-r1.log"

      - name: Checkout exact orchestration control
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          submodules: false
          lfs: false

      - name: Execute immutable package 72 gate
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_ARTIFACT_ID: '9765247195'
          PACKAGE_OUTER_SHA256: '41ebe4dec4a3eb5c8194900a3f27a0377c3271212edd10fb952c48f55a6a2e6d'
          PACKAGE_TAR_SHA256: '20630897aa432572d0929022abef3861fff80c2b5792c223071990dd2e3c6a73'
          SOURCE_SHA: '93ed2ff50ddad96c9a6aa93f327b3e4d9d93a9b4'
          SOURCE_ARCHIVE_SHA256: 'fb3080e58f41f7c55790f8a77ad9989ce4a91e212ae323ab71afc9bc061812fb'
          SELECTOR_SHA256: 'b47c269851fad1384b5dc9baaf674b3d4ad80ec6c2b40f7f8eda2055c6f44834'
          PREFIX355: 'e9d88f1196e412e06424294d6be22b32f01c9671ec5e4de119abd3f2fb5afeaa'
          PREFIX357: 'b896d0db7f26aeb0f3513418405efdeccbcf84fb6dc971500c6ddac9e364dc70'
          PREFIX361: '61918d9fbd7bf757437886f0e86776b60665c58e4d7283b81d42caca03c0288b'
          PREFIX365: '6b5b6555d39c250c24cbf3faeafdeca93b4b11379118a29583253e6cfc14b8a1'
          PREFIX367: 'ef9d082f56f5c8de83124cf2e6257d098408cc597d9147b967cf9c84da4916bf'
          PREFIX370: '9160ea619afb9e10cbad30012d0bd354c263a2b749e690c271f653db3bf83525'
          HASH_BENCHMARKS: '971426cf6846af474df1652d4a64a4bacebcc090bf0c91ed1366ffbcf8720431'
          HASH_COMPILED_API: '9eee80431354ba7f6a8122f0755cce40a367219e4596f15be6ea5b891880c07b'
          HASH_AUTHORITY: '319338df85e52036a2a38cf8a515236c13f3d18b205c3f830b3f58a46970be67'
          HASH_COMPLETION: 'e895a6bf556a73fd213070095ec44a22a755d22a970208e929f45386cec15ea3'
          HASH_PRODUCER: '23acd5a3bba6355d1a35ab62c9fa817e410be10ee095bedcaada7995ddacf575'
          HASH_VALIDATION: 'e8a9bc573c964d09ca24e8691ef4fe1eef93b270451e6f581aae474f820b98f7'
        shell: bash
        run: |
          set -o pipefail
          bash .agents/Directional/turn-payloads/cp4c3-tb3-r1-run.sh

      - name: Record final control source status
        if: always()
        shell: bash
        run: |
          set +e
          { echo "final_job_status=${{ job.status }}"; echo "final_control_sha=$(git rev-parse HEAD 2>/dev/null || echo unavailable)"; git status --short 2>&1 || true; echo "finished_at=$(date -u +%FT%TZ)"; } | tee -a "${RUNNER_TEMP}/cp4c3-tb3-r1.log"

      - name: Upload gate result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-cp4c3-tb3-r1-result-${{ github.run_id }}
          path: ${{ runner.temp }}/cp4c3-tb3-r1-result
          if-no-files-found: error
          retention-days: 7

      - name: Upload diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-cp4c3-tb3-r1-log-${{ github.run_id }}
          path: ${{ runner.temp }}/cp4c3-tb3-r1.log
          if-no-files-found: error
          retention-days: 7
