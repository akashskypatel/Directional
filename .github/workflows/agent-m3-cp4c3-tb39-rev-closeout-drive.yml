name: M3 CP4c3 TB39 REV Closeout Drive Apply

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m3-cp4c3-tb39-rev-closeout/trigger.json

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

concurrency:
  group: m3-cp4c3-tb39-rev-closeout-drive
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/agent-m3-cp4c3-tb39-rev-closeout-drive.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m3-cp4c3-tb39-rev-closeout-drive
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  apply:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1oYYfUX-LIda5jEv5jrWl1f6z4AqaqE8j
      patch_sha256: 9573694a7d9171a772793515bd3bb26e047c9abe3b8c29c04dcb4ab5d8a7d04a
      base_sha: 7253a1b93fa4d09f74846850502e31020799ff0a
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: "docs: adjudicate TB39 and hand off DEFN-R7"
      retention_days: 14
    secrets: inherit
