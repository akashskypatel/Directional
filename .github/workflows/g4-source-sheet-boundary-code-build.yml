name: g4-source-sheet-boundary-code-build

on:
  push:
    paths:
      - '.github/agent-triggers/g4-source-sheet-boundary-code-build'

permissions:
  contents: write
  actions: read

concurrency:
  group: g4-source-sheet-boundary-code-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  code-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      LOG_DIR: /tmp/g4-source-sheet-boundary-logs
    steps:
      - name: Initialize unconditional activity log
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$LOG_DIR"
          {
            echo "turn=G4 source-sheet boundary authority Code+Build"
            echo "event_sha=$GITHUB_SHA"
            echo "event_ref=$GITHUB_REF"
            echo "entering_runtime_artifact=9016834575"
            echo "runtimeExecution=false"
            echo "reviewPolicy=never"
            echo "transport=six verified raw unified-patch parts"
            echo "allowed=apply verified boundary-authority patch, configure, compile/link seven approved targets, package/checksum"
            echo "prohibited=tests, benchmarks, generated Directional binaries, ctest/discovery, CLI, GUI, help/list/custom-input execution"
          } | tee "$LOG_DIR/activity.log"

      - name: Checkout exact working branch
        uses: actions/checkout@v4
        with:
          ref: agent/surface_cell_quad/p5-recover-bridge-healing
          fetch-depth: 50
          submodules: false

      - name: Verify and apply source-sheet boundary patch
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee -a "$LOG_DIR/activity.log") 2>&1
          echo "checkout_sha=$(git rev-parse HEAD)"
          git status --short

          raw_parts=(
            .agents/Directional/turn-payloads/g4-source-sheet-boundary.raw.part01.patch
            .agents/Directional/turn-payloads/g4-source-sheet-boundary.raw.part02.patch
            .agents/Directional/turn-payloads/g4-source-sheet-boundary.raw.part03.patch
            .agents/Directional/turn-payloads/g4-source-sheet-boundary.raw.part04.patch
            .agents/Directional/turn-payloads/g4-source-sheet-boundary.raw.part05.patch
            .agents/Directional/turn-payloads/g4-source-sheet-boundary.raw.part06.patch
          )
          for part in "${raw_parts[@]}"; do test -f "$part"; done
          test "$(git hash-object "${raw_parts[0]}")" = "5740d314c16d253c4e1d3f3c60808b97d76c103f"
          test "$(git hash-object "${raw_parts[1]}")" = "b6c8db4d63b9c8799bd7aff4d60edfcf4ac79c2a"
          test "$(git hash-object "${raw_parts[2]}")" = "74cc12adcd6b864b172c441e496363822aa27f6c"
          test "$(git hash-object "${raw_parts[3]}")" = "221a07748efb846e4012488b5f28884efb58553b"
          test "$(git hash-object "${raw_parts[4]}")" = "59e3060c9b2300e7ea430334350d189ba9262aa0"
          test "$(git hash-object "${raw_parts[5]}")" = "208573561765a7a75542995d574e2da11d273599"
          test "$(sha256sum "${raw_parts[0]}" | awk '{print $1}')" = "e60ca85cca6e8d727c4e841aef3700de9f29cab826ac77615a41f984c691425f"
          test "$(sha256sum "${raw_parts[1]}" | awk '{print $1}')" = "f471c4ac850a81055a0e5b9c273fc7f8012c7c9d35b2b1b44b3fd59324aa4921"
          test "$(sha256sum "${raw_parts[2]}" | awk '{print $1}')" = "356af28859d2034850d154016c06b0bd51428507261d9cb863fd8399d8727907"
          test "$(sha256sum "${raw_parts[3]}" | awk '{print $1}')" = "fe28b9011eb509fc299daf74dc28415db370d0e248a44ddf43b367c59c0a059f"
          test "$(sha256sum "${raw_parts[4]}" | awk '{print $1}')" = "96cebc5893849f40a498b989356688ddd4cd29bda5dd406f9ca6b0c6f194152e"
          test "$(sha256sum "${raw_parts[5]}" | awk '{print $1}')" = "d558c3bd241dd9366f0211de109fa13f1d4dc23f8925fab93cd40df5c6cd830c"

          INPUT_HEADER_BLOB=$(git hash-object include/directional/geometry/SurfaceCellTracing.h)
          INPUT_SOURCE_BLOB=$(git hash-object src/geometry/SurfaceCellTracing.cpp)
          INPUT_TEST_BLOB=$(git hash-object tests/SurfaceCellsPhase10Tests.cpp)
          echo "input_header_blob=$INPUT_HEADER_BLOB"
          echo "input_source_blob=$INPUT_SOURCE_BLOB"
          echo "input_test_blob=$INPUT_TEST_BLOB"
          test "$INPUT_HEADER_BLOB" = "998d8bc46faf6d590cb1674c4f5b2e290f94c48e"
          test "$INPUT_SOURCE_BLOB" = "3363e20c33a6850c192249877e7cb4488fc36597"
          test "$INPUT_TEST_BLOB" = "fe7ce43466cc3bc852b36c0ea8b8de6aac0c5b64"

          cat "${raw_parts[@]}" > /tmp/g4-source-sheet-boundary.patch
          PATCH_SHA256=$(sha256sum /tmp/g4-source-sheet-boundary.patch | awk '{print $1}')
          echo "decoded_patch_sha256=$PATCH_SHA256"
          test "$PATCH_SHA256" = "c96b3d73f16f4b9391505380bc3f2cf9ec95ff5783fe843b556e95a534a6e75b"
          if grep -q '^+++ b/.github/workflows/' /tmp/g4-source-sheet-boundary.patch; then
            echo "patch attempts to modify workflow files" >&2
            exit 1
          fi

          git apply --check /tmp/g4-source-sheet-boundary.patch
          git apply /tmp/g4-source-sheet-boundary.patch
          git diff --check
          mapfile -t changed < <(git diff --name-only | sort)
          printf 'changed=%s\n' "${changed[*]}"
          test "${#changed[@]}" -eq 3
          test "${changed[0]}" = "include/directional/geometry/SurfaceCellTracing.h"
          test "${changed[1]}" = "src/geometry/SurfaceCellTracing.cpp"
          test "${changed[2]}" = "tests/SurfaceCellsPhase10Tests.cpp"
          test "$(git hash-object include/directional/geometry/SurfaceCellTracing.h)" = "ddb8e211f073d15fcfcc6782f964f88c4dedfc5e"
          test "$(git hash-object src/geometry/SurfaceCellTracing.cpp)" = "14cf7f3a3301e9e3f10ec48a480d3f6e5efee7ed"
          test "$(git hash-object tests/SurfaceCellsPhase10Tests.cpp)" = "31322acea5227a8e3692887fad1ec4a9e6d8c101"

          git config user.name 'directional-agent'
          git config user.email 'directional-agent@users.noreply.github.com'
          git add include/directional/geometry/SurfaceCellTracing.h \
                  src/geometry/SurfaceCellTracing.cpp \
                  tests/SurfaceCellsPhase10Tests.cpp
          git commit -m 'fix(surface-cells): honor source-sheet boundary authority'
          IMPLEMENTATION_COMMIT=$(git rev-parse HEAD)
          echo "IMPLEMENTATION_COMMIT=$IMPLEMENTATION_COMMIT" >> "$GITHUB_ENV"
          echo "PATCH_SHA256=$PATCH_SHA256" >> "$GITHUB_ENV"
          echo "implementation_commit=$IMPLEMENTATION_COMMIT"

          git rm \
            .agents/Directional/turn-payloads/g4-source-sheet-boundary.patch.gz.b64 \
            .agents/Directional/turn-payloads/g4-source-sheet-boundary.patch.gz.b64.part01 \
            .agents/Directional/turn-payloads/g4-source-sheet-boundary.patch.gz.b64.part02 \
            .agents/Directional/turn-payloads/g4-source-sheet-boundary.patch.gz.b64.part03 \
            .agents/Directional/turn-payloads/g4-source-sheet-boundary.patch.gz.b64.part04 \
            "${raw_parts[@]}"
          git commit -m 'chore(agent): remove G4 source-sheet boundary payloads'
          CLEANUP_COMMIT=$(git rev-parse HEAD)
          echo "CLEANUP_COMMIT=$CLEANUP_COMMIT" >> "$GITHUB_ENV"
          echo "cleanup_commit=$CLEANUP_COMMIT"
          git push origin HEAD:agent/surface_cell_quad/p5-recover-bridge-healing
          git status --short

      - name: Install compile prerequisites
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee -a "$LOG_DIR/activity.log") 2>&1
          sudo apt-get update
          sudo apt-get install -y ninja-build libgmp-dev xz-utils

      - name: Fetch shallow submodules
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee -a "$LOG_DIR/activity.log") 2>&1
          git submodule update --init --depth 1
          git submodule status | tee "$LOG_DIR/submodules.txt"

      - name: Configure Release static compile-only build
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee -a "$LOG_DIR/activity.log") 2>&1
          {
            echo "implementation_commit=$IMPLEMENTATION_COMMIT"
            echo "cleanup_commit=$CLEANUP_COMMIT"
            echo "compile_head=$(git rev-parse HEAD)"
            cmake --version
            c++ --version
            ninja --version
          } | tee "$LOG_DIR/toolchain.txt"
          cmake -S . -B agent-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DCMAKE_GTEST_DISCOVER_TESTS_DISCOVERY_MODE=PRE_TEST \
            -DBUILD_SHARED_LIBS=OFF \
            -DBUILD_TUTORIALS=OFF \
            -DBUILD_PYTHON=OFF \
            -DDIRECTIONAL_BUILD_CLI=OFF \
            -DDIRECTIONAL_BUILD_GUI=OFF \
            -DDIRECTIONAL_BUILD_BENCHMARKS=ON \
            -DDIRECTIONAL_BUILD_TESTS=ON \
            -DDIRECTIONAL_BUILD_HISTORICAL_TESTS=OFF \
            -DDIRECTIONAL_BUILD_LEGACY_INTEGRATION_TESTS=OFF \
            -DDIRECTIONAL_BUILD_OPTIONAL_GUIDANCE_TESTS=OFF \
            -DDIRECTIONAL_ENABLE_GMP=ON \
            -DDIRECTIONAL_ENABLE_PARDISO=OFF \
            -DDIRECTIONAL_ENABLE_CUDSS=OFF \
            -DDIRECTIONAL_ENABLE_SUITESPARSE=OFF \
            2>&1 | tee "$LOG_DIR/configure.log"

      - name: Compile seven approved targets only
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee -a "$LOG_DIR/activity.log") 2>&1
          cmake --build agent-build --parallel 2 --target \
            directional_core \
            directional_pipeline \
            directional_compiled_api_tests \
            directional_surface_cell_producer_tests \
            directional_surface_cell_completion_tests \
            directional_surface_cell_validation_tests \
            directional_benchmarks \
            2>&1 | tee "$LOG_DIR/build.log"
          echo "compile_only_gate=passed" | tee -a "$LOG_DIR/activity.log"
          echo "final_source_status_begin" | tee -a "$LOG_DIR/activity.log"
          git status --short | tee -a "$LOG_DIR/activity.log"
          echo "final_source_status_end" | tee -a "$LOG_DIR/activity.log"

      - name: Package immutable compile artifact
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee -a "$LOG_DIR/activity.log") 2>&1
          root="$GITHUB_WORKSPACE/g4-source-sheet-boundary-artifact"
          rm -rf "$root"
          mkdir -p "$root"/{bin,lib,test-data/benchmarks,logs,metadata,source}
          cp agent-build/directional_benchmarks "$root/bin/"
          cp agent-build/directional_compiled_api_tests "$root/bin/"
          cp agent-build/directional_surface_cell_producer_tests "$root/bin/"
          cp agent-build/directional_surface_cell_completion_tests "$root/bin/"
          cp agent-build/directional_surface_cell_validation_tests "$root/bin/"
          cp agent-build/libdirectional_core.a "$root/lib/"
          cp agent-build/libdirectional_pipeline.a "$root/lib/"
          cp -a benchmarks/fixtures "$root/test-data/benchmarks/"
          cp "$LOG_DIR/activity.log" "$LOG_DIR/configure.log" \
             "$LOG_DIR/build.log" "$LOG_DIR/toolchain.txt" \
             "$LOG_DIR/submodules.txt" "$root/logs/"
          cp agent-build/compile_commands.json "$root/source/"

          git show "$IMPLEMENTATION_COMMIT" --format=fuller --stat --patch -- \
            include/directional/geometry/SurfaceCellTracing.h \
            src/geometry/SurfaceCellTracing.cpp \
            tests/SurfaceCellsPhase10Tests.cpp > "$root/source/g4-source-sheet-boundary.patch"
          tar --exclude=.git --exclude=external --exclude=agent-build \
              --exclude=g4-source-sheet-boundary-artifact \
              -cJf "$root/source/directional-g4-source-sheet-boundary-source-no-deps.tar.xz" .

          cat > "$root/metadata/source-authority.json" <<EOF
          {
            "eventCommit": "$GITHUB_SHA",
            "implementationCommit": "$IMPLEMENTATION_COMMIT",
            "cleanupCommit": "$CLEANUP_COMMIT",
            "enteringRuntimeArtifact": 9016834575,
            "rawPatchPartGitBlobs": [
              "5740d314c16d253c4e1d3f3c60808b97d76c103f",
              "b6c8db4d63b9c8799bd7aff4d60edfcf4ac79c2a",
              "74cc12adcd6b864b172c441e496363822aa27f6c",
              "221a07748efb846e4012488b5f28884efb58553b",
              "59e3060c9b2300e7ea430334350d189ba9262aa0",
              "208573561765a7a75542995d574e2da11d273599"
            ],
            "decodedPatchSha256": "$PATCH_SHA256",
            "runtimeExecution": false,
            "reviewPolicy": "never"
          }
          EOF
          cat > "$root/metadata/build-authority.json" <<'EOF'
          {"configuration":"Release","generator":"Ninja","buildSharedLibs":false,"gtestDiscoveryMode":"PRE_TEST","approvedTargets":7,"runtimeExecution":false}
          EOF
          cat > "$root/metadata/command-boundary.txt" <<'EOF'
          G4 Code + Build only.
          Executed: verified source/test patch application, configure, compile/link seven approved targets, package/checksum.
          Not executed: generated Directional binaries, tests, benchmarks, ctest/discovery, CLI, GUI, help/list/custom-input commands.
          EOF
          git ls-tree -r "$IMPLEMENTATION_COMMIT" -- \
            include/directional/geometry/SurfaceCellTracing.h \
            src/geometry/SurfaceCellTracing.cpp \
            src/pipeline/RemeshPipeline.cpp \
            tests/SurfaceCellsPhase10Tests.cpp > "$root/metadata/final-blobs.txt"
          git submodule status > "$root/metadata/submodules.txt"
          find benchmarks/fixtures -type f | sort > "$root/metadata/fixture-files.txt"
          (cd "$root" && find . -type f ! -name SHA256SUMS -print0 | sort -z | \
            xargs -0 sha256sum > SHA256SUMS)
          sha256sum "$root/SHA256SUMS" | tee "$LOG_DIR/artifact-checksum.txt"

      - name: Upload immutable compile artifact
        uses: actions/upload-artifact@v4
        with:
          name: g4-source-sheet-boundary-code-build
          path: g4-source-sheet-boundary-artifact
          if-no-files-found: error
          retention-days: 14

      - name: Upload detailed activity log always
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g4-source-sheet-boundary-code-build-logs
          path: /tmp/g4-source-sheet-boundary-logs
          if-no-files-found: error
          retention-days: 14
