name: M5 CP1 CB2 Closeout Patch Apply

on:
  push:
    branches: [agent/surface_cell_quad/p5-recover-bridge-healing]
    paths: [.agents/connector-triggers/m5-cp1-cb2-closeout-apply-20260920.txt]

permissions:
  actions: read
  contents: write
  id-token: write
  issues: write
  pull-requests: write

jobs:
  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m5-cp1-cb2-closeout-apply
      commit_run_file: false
      trim_stale_comments: false
    secrets: inherit

  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/m5-cp1-cb2-closeout-apply.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  apply:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: "17C9wpgdJsYKe5SfIS2iE13q3ZH34FTTu"
      patch_sha256: "1889b931c5d4ca861a9ec067e75847559acd712e40795993b9c49f53cd42a9ba"
      base_sha: "8a0c9a13ad9e0587ea34931769740b33339bd791"
      target_branch: "agent/surface_cell_quad/p5-recover-bridge-healing"
      commit_message: "docs(m5-cp1): close CB2 and freeze R2 execution plan"
      retention_days: 7
    secrets: inherit
