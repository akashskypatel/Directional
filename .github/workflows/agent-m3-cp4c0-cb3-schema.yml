name: Agent M3 CP4c0 CB3 Schema Validation

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m3-cp4c0-cb3-schema/run.txt

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: agent-m3-cp4c0-cb3-schema-${{ github.ref }}
  cancel-in-progress: false

jobs:
  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m3-cp4c0-cb3-schema
      commit_run_file: false
      trim_stale_comments: false
    secrets: inherit

  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .agents/Directional/turn-payloads/m3-cp4c0-cb3/apply-workflow.yml
      source_ref: ${{ github.sha }}
    secrets: inherit
