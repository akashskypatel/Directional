name: M5 CP3 TB1 R8 Review Drive Apply

on:
  push:
    branches: [agent/surface_cell_quad/p5-recover-bridge-healing]
    paths: [.agents/connector-triggers/m5-cp3-tb1-r8-review-drive-apply.txt]

permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/m5-cp3-tb1-r8-review-drive-apply.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m5-cp3-tb1-r8-review-drive-apply
      commit_run_file: false
      trim_stale_comments: false
    secrets: inherit

  apply:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1QFzR7Dvs8VAJDce2foo9oNtpbmYxLvum
      patch_sha256: '0d02af877416902c86a03123b26a0271c98936aba7188469108ab8e2c7aa2b10'
      base_sha: dcdfefbbd3bd21d9a208eaf5751fee8e5407d7ef
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: "M5-CP3-TB1-R8-REV: publish review adjudication and CB10 plan"
    secrets: inherit
