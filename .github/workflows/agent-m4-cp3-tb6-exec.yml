name: Agent M4 CP3 TB6 EXEC

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/tb/m4-cp3-tb6/**

permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: agent-m4-cp3-tb6-exec-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/agent-m4-cp3-tb6-exec.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m4-cp3-tb6-exec
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  execute:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      TURN_ID: M4-CP3-TB6-EXEC
      ARTIFACT_ID: '10303165017'
      EXPECTED_ARTIFACT_NAME: m4-cp3-cb8-package-result-34709028122
      EXPECTED_PROVIDER_DIGEST: sha256:d601e5efc4d6a3cafc34d4a5ead0a5a44040e3026d31b3f75afad59c71b68112
      EXPECTED_ZIP_SHA256: d601e5efc4d6a3cafc34d4a5ead0a5a44040e3026d31b3f75afad59c71b68112
    steps:
      - name: Initialize diagnostic log
        shell: bash
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/m4-cp3-tb6-exec-workflow.log"
          : > "$log"
          {
            echo "workflow=${GITHUB_WORKFLOW}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "event=${GITHUB_EVENT_NAME}"
            echo "event_sha=${GITHUB_SHA}"
            echo "repository=${GITHUB_REPOSITORY}"
            echo "runner_os=${RUNNER_OS}"
            echo "turn_id=${TURN_ID}"
            echo "artifact_id=${ARTIFACT_ID}"
            echo "started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } | tee -a "$log"

      - name: Checkout exact execution control source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          submodules: false
          lfs: false

      - name: Materialize frozen TB6 harness
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          base="${RUNNER_TEMP}/m4-cp3-tb5-reviewed-harness.sh"
          out="${RUNNER_TEMP}/m4-cp3-tb6-exec-harness.sh"
          curl -L --fail --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github.raw+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            'https://api.github.com/repos/akashskypatel/Directional/contents/.agents/Directional/turn-payloads/m4-cp3-tb5-exec-harness.sh?ref=4e86a7ff59a79f24d77099274d11e17a81681db9' \
            -o "$base"
          test "$(sha256sum "$base" | awk '{print $1}')" = 'ca01dd830cd8c8c867334e2ec8aa1748309ad8b360260b2a02ddf3d5da6d976d'
          python3 - "$base" "$out" <<'PY'
          import pathlib, sys
          src = pathlib.Path(sys.argv[1]).read_text()
          replacements = {
              'TB5': 'TB6',
              'dbcc2f1fe07b611ce7360cd00e31ae4e6cd157c8': '6934d9edfb56b44f956fbc64a89a501aaed042af',
              'ca16770d8ceff1da119687284eb7c01b31af9ce237be01753ed4c962305ff18d': '7b906b0ad1560d3cb158178ae224d2d391e8fee66d7268f78ba2ed172a0ec5eb',
              '43e8e4c35712c8b69d4906288390745f2bdb507160cf52c31ad8f7545faa91ed': 'c7e6173bdbd757ae80022be0d0fc3c07b011d83091f8d6e5261efe35295eac54',
              "[[ \"$(cat \"$PKG/metadata/preflight-target.txt\")\" == 'directional_surface_cell_producer_tests' ]] || fail_orchestration 'preflight target mismatch'": "[[ \"$(cat \"$PKG/metadata/preflight-target.txt\")\" == 'directional_core' ]] || fail_orchestration 'preflight target mismatch'",
          }
          for old, new in replacements.items():
              if old not in src:
                  raise SystemExit(f'missing frozen replacement token: {old}')
              src = src.replace(old, new)
          anchor = "for token in 'libgmpxx.so' 'libgmp.so'; do\n  grep -Fq \"$token\" \"$PKG/metadata/gmp-evidence.txt\" || fail_orchestration \"missing GMP evidence: $token\"\ndone\n"
          if src.count(anchor) != 1:
              raise SystemExit('GMP preflight anchor drift')
          extra = anchor + (
              "for status_file in \"$PKG\"/metadata/source-status-*.txt; do\n"
              "  [[ -f \"$status_file\" ]] || fail_orchestration 'source-status snapshot set absent'\n"
              "  [[ ! -s \"$status_file\" ]] || fail_orchestration \"non-empty source-status snapshot: $(basename \"$status_file\")\"\n"
              "done\n"
              "for exe in directional_benchmarks directional_compiled_api_tests; do\n"
              "  [[ -f \"$PKG/bin/$exe\" && -x \"$PKG/bin/$exe\" ]] || fail_orchestration \"required packaged executable absent or non-executable: $exe\"\n"
              "done\n"
              "for archive in libdirectional_core.a libdirectional_pipeline.a; do\n"
              "  [[ -f \"$PKG/lib/$archive\" ]] || fail_orchestration \"required packaged archive absent: $archive\"\n"
              "done\n"
          )
          src = src.replace(anchor, extra, 1)
          pathlib.Path(sys.argv[2]).write_text(src)
          PY
          chmod +x "$out"
          {
            echo "frozen_tb5_harness_sha256=ca01dd830cd8c8c867334e2ec8aa1748309ad8b360260b2a02ddf3d5da6d976d"
            echo "tb6_harness_sha256=$(sha256sum "$out" | awk '{print $1}')"
          } | tee -a "${RUNNER_TEMP}/m4-cp3-tb6-exec-workflow.log"

      - name: Execute frozen artifact-only TB6 gate
        id: exec
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set +e
          harness="${RUNNER_TEMP}/m4-cp3-tb6-exec-harness.sh"
          test -f "$harness" || exit 91
          "$harness"
          status=$?
          echo "exit_code=${status}" >> "$GITHUB_OUTPUT"
          echo "harness_exit=${status}" | tee -a "${RUNNER_TEMP}/m4-cp3-tb6-exec-workflow.log"
          exit 0

      - name: Upload TB6 result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m4-cp3-tb6-result-${{ github.run_id }}
          path: ${{ runner.temp }}/M4-CP3-TB6-EXEC-result
          if-no-files-found: error
          retention-days: 7

      - name: Upload TB6 diagnostic log
        if: always()
        shell: bash
        run: |
          set +e
          cp "${RUNNER_TEMP}/M4-CP3-TB6-EXEC.log" "${RUNNER_TEMP}/m4-cp3-tb6-harness.log" 2>/dev/null || true
          {
            echo "harness_exit=${{ steps.exec.outputs.exit_code }}"
            echo "final_job_status=${{ job.status }}"
            echo "finished_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } | tee -a "${RUNNER_TEMP}/m4-cp3-tb6-exec-workflow.log"

      - name: Upload workflow and harness logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m4-cp3-tb6-log-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/m4-cp3-tb6-exec-workflow.log
            ${{ runner.temp }}/m4-cp3-tb6-harness.log
          if-no-files-found: warn
          retention-days: 7

      - name: Propagate TB6 execution status
        if: always()
        shell: bash
        run: |
          code='${{ steps.exec.outputs.exit_code }}'
          test -n "$code" || exit 92
          exit "$code"
