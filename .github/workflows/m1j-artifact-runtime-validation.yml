name: m1j-artifact-runtime-validation

on:
  push:
    paths:
      - '.agents/connector-triggers/m1j-artifact-runtime-validation'

permissions:
  contents: read
  actions: read

concurrency:
  group: m1j-artifact-runtime-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    env:
      RESULT_ARTIFACT_ID: '9076217893'
      RESULT_ZIP_SHA256: 'a428735f68793e7f4721094b11400c6b4d1276dbea4e6eeb1496fd0ce13f178c'
      MANIFEST_SHA256: '2134a0102a38b75d16c859be8fd862ab037c312609ab9bbae19499c9f875da59'
      PRODUCER_SHA256: '04d5d4d59c3e7e9d15cc3e57b0887086939735867aeb1a122a4b3b82be826e40'
      IMPLEMENTATION: 'd5f681173600dc32dc7617de6105d9e584e593be'
      LOG_DIR: /tmp/m1j-validation-logs
      EVIDENCE_DIR: /tmp/m1j-validation-evidence
      PKG_DIR: /tmp/m1j-validation-package
      WORK_DIR: /tmp/m1j-validation-work

    steps:
      - name: Initialize persistent activity log
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$LOG_DIR" "$EVIDENCE_DIR" "$WORK_DIR"
          printf '%s\n' \
            'turn=M1j immutable Artifact-Only Test+Benchmark validation' \
            "event_sha=$GITHUB_SHA" "implementation=$IMPLEMENTATION" "artifact_id=$RESULT_ARTIFACT_ID" \
            'configure=false' 'compile=false' 'relink=false' 'regenerate=false' \
            'sourceEdit=false' 'testEdit=false' 'fixtureEdit=false' 'packageRepair=false' \
            'fixtureSymlink=false' \
            "started_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)" | tee "$LOG_DIR/activity.log"

      - name: Exact artifact preflight and validation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          exec > >(tee -a "$LOG_DIR/activity.log") 2>&1
          trap 'rc=$?; echo "step=artifact-validation exit_code=$rc"; echo "finished_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"; exit $rc' EXIT
          zip=/tmp/m1j-result.zip
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${RESULT_ARTIFACT_ID}/zip"
          curl --fail --silent --show-error --location \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "$api" -o "$zip"
          test "$(sha256sum "$zip" | awk '{print $1}')" = "$RESULT_ZIP_SHA256"
          zipinfo -1 "$zip" | while IFS= read -r p; do case "$p" in /*|../*|*/../*|*/..) echo "unsafe archive member: $p"; exit 91;; esac; done
          rm -rf "$PKG_DIR"; mkdir -p "$PKG_DIR"
          unzip -q "$zip" -d "$PKG_DIR"
          test "$(sha256sum "$PKG_DIR/SHA256SUMS" | awk '{print $1}')" = "$MANIFEST_SHA256"
          (cd "$PKG_DIR" && sha256sum -c SHA256SUMS) > "$EVIDENCE_DIR/preflight-manifest-check.txt"
          test "$(wc -l < "$PKG_DIR/SHA256SUMS")" -eq 67
          test "$(find "$PKG_DIR" -type f | wc -l)" -eq 68
          test "$(find "$PKG_DIR/bin" -maxdepth 1 -type f | wc -l)" -eq 7
          test "$(find "$PKG_DIR/lib" -maxdepth 1 -type f | wc -l)" -eq 2
          test "$(find "$PKG_DIR/test-data/benchmarks/fixtures" -type f | wc -l)" -eq 27
          test "$(find "$PKG_DIR" -type l | wc -l)" -eq 0
          test ! -e "$PKG_DIR/bin/test-data"
          test "$(sha256sum "$PKG_DIR/bin/directional_surface_cell_producer_tests" | awk '{print $1}')" = "$PRODUCER_SHA256"
          grep -F "\"implementationCommit\": \"$IMPLEMENTATION\"" "$PKG_DIR/metadata/build-authority.json" >/dev/null
          for key in runtimeExecution testExecution benchmarkExecution ctestExecution cliExecution fuzzerExecution customInputExecution; do grep -F "\"${key}\": false" "$PKG_DIR/metadata/build-authority.json" >/dev/null; done
          printf '%s\n' \
            "result_zip_sha=$RESULT_ZIP_SHA256" "manifest_sha=$MANIFEST_SHA256" 'manifest_verified=67/67' \
            'regular_files=68' 'executables=7' 'libraries=2' 'fixtures=27' "producer_sha=$PRODUCER_SHA256" \
            'fixtureSymlink=false' > "$EVIDENCE_DIR/preflight-summary.txt"

          producer="$PKG_DIR/bin/directional_surface_cell_producer_tests"
          validation="$PKG_DIR/bin/directional_surface_cell_validation_tests"
          m1a="$PKG_DIR/bin/directional_surface_cell_authority_kernel_tests"
          t1="$PKG_DIR/bin/directional_surface_cell_oracle_tests"

          for spec in producer:214 validation:77 m1a:14 t1:29; do
            label=${spec%%:*}; expected=${spec##*:}; exe="$producer"
            [ "$label" = validation ] && exe="$validation"
            [ "$label" = m1a ] && exe="$m1a"
            [ "$label" = t1 ] && exe="$t1"
            (cd "$WORK_DIR" && "$exe" --gtest_list_tests) > "$LOG_DIR/${label}-list.txt" 2>&1
            count=$(grep -c '^  [^ ]' "$LOG_DIR/${label}-list.txt")
            echo "$label=$count" | tee -a "$EVIDENCE_DIR/discovery-summary.txt"
            test "$count" -eq "$expected"
          done

          : > "$EVIDENCE_DIR/focused-summary.txt"
          for label in m1j m1i m1h m1g m1f m1e m1d m1c m1b; do
            exe="$producer"; [ "$label" = m1b ] && exe="$validation"
            idx=0; passed=0
            while IFS= read -r testname; do
              [ -z "$testname" ] && continue
              idx=$((idx+1)); out="$LOG_DIR/${label}-focused-${idx}.log"
              set +e; (cd "$WORK_DIR" && "$exe" --gtest_filter="$testname") > "$out" 2>&1; rc=$?; set -e
              selected=$(grep -E '^\[==========\] Running [0-9]+ test' "$out" | head -1 | sed -E 's/.*Running ([0-9]+) test.*/\1/')
              green=$(grep -E '^\[  PASSED  \] [0-9]+ test' "$out" | tail -1 | sed -E 's/.*\] ([0-9]+) test.*/\1/')
              test "$rc" -eq 0; test "$selected" = 1; test "$green" = 1
              passed=$((passed+1))
            done < "$PKG_DIR/metadata/${label}-focused-test-names.txt"
            echo "$label=$passed/$idx" | tee -a "$EVIDENCE_DIR/focused-summary.txt"
            test "$idx" -eq 6; test "$passed" -eq 6
          done

          route_tests=(
            SurfaceCellTransitionQuotient.ExactHardRailCounterpartsStitchAcrossTopologyRegions
            SurfaceCellTransitionQuotient.ArtificialInteriorBoundaryIsRejected
            SurfaceCellTransitionQuotient.ComponentBoundaryAndEulerFactsAreComputedFromIncidence
          )
          transition_tests=(
            SurfaceCellsPhase10.NonReciprocalSourceAdjacentIsolationSeamFailsClosed
            SurfaceCellsPhase10.CurvedBoundedDiskInvalidReciprocalTransportFailsClosed
            SurfaceCellsPhase10.PeriodicPhaseFrontMalformedHolonomyFailsClosedWithTypedReason
          )
          for kind in route transition; do
            idx=0
            if [ "$kind" = route ]; then tests=("${route_tests[@]}"); else tests=("${transition_tests[@]}"); fi
            for testname in "${tests[@]}"; do
              idx=$((idx+1)); out="$LOG_DIR/${kind}-counterexample-${idx}.log"
              (cd "$WORK_DIR" && "$producer" --gtest_filter="$testname") > "$out" 2>&1
              grep -F '[  PASSED  ] 1 test.' "$out" >/dev/null
            done
            echo "$kind-counterexamples=$idx/$idx" | tee -a "$EVIDENCE_DIR/focused-summary.txt"
          done

          exclusions="$EVIDENCE_DIR/required-green-exclusions.txt"
          cp "$PKG_DIR/metadata/direct-product-test-names.txt" "$exclusions"
          printf '%s\n' \
            SurfaceCellTransitionQuotient.MultiIsolationMaterializationRetainsAllLocalSheets \
            SurfaceCellTransitionQuotient.FullPeriodicRotationAndTranslationMaterialize \
            SurfaceCellTransitionQuotient.TamperedFullPeriodicTransformIsRejected \
            SurfaceCellTransitionQuotient.MultiplePeriodicRelationsSurviveRelationReorderingByExplicitOwner \
            SurfaceCellTransitionQuotient.SwappedPeriodicRelationOwnersAreRejected \
            SurfaceCellTransitionQuotient.MissingPeriodicRelationOwnerIsRejected \
            SurfaceCellTransitionQuotient.QuotientLineageRetainsScalarPointAndCompleteSortedAuthority \
            SurfaceCellsPhase10.ExactCommittedTorusDoesNotTreatIsolationSeamAsBoundedDiskBoundary \
            SurfaceCellsPhase10.StrictValidatorOverheadStaysBelowFivePercent \
            UniformPhaseFront/SurfaceCellDesignAcceptance.ProducesDirectSourceAuthoritativePureQuadOutput/BunnyRandom \
            UniformPhaseFront/SurfaceCellDesignAcceptance.ProducesDirectSourceAuthoritativePureQuadOutput/Vase >> "$exclusions"
          test "$(wc -l < "$exclusions")" -eq 15
          neg=$(paste -sd: "$exclusions")
          filter="*-${neg}"
          test "$(printf '%s' "$filter" | tr -cd '-' | wc -c)" -eq 1
          (cd "$WORK_DIR" && /usr/bin/time -v -o "$LOG_DIR/required-green.resources.txt" "$producer" --gtest_filter="$filter") > "$LOG_DIR/required-green.log" 2>&1
          selected=$(grep -E '^\[==========\] Running [0-9]+ test' "$LOG_DIR/required-green.log" | head -1 | sed -E 's/.*Running ([0-9]+) test.*/\1/')
          green=$(grep -E '^\[  PASSED  \] [0-9]+ test' "$LOG_DIR/required-green.log" | tail -1 | sed -E 's/.*\] ([0-9]+) test.*/\1/')
          test "$selected" = 199; test "$green" = 199
          echo "required-green=$green/$selected" | tee "$EVIDENCE_DIR/required-green-summary.txt"
          grep -E 'Elapsed \(wall clock\)|Maximum resident set size' "$LOG_DIR/required-green.resources.txt" >> "$EVIDENCE_DIR/required-green-summary.txt"

          for spec in validation:77 m1a:14 t1:29; do
            label=${spec%%:*}; expected=${spec##*:}; exe="$validation"
            [ "$label" = m1a ] && exe="$m1a"; [ "$label" = t1 ] && exe="$t1"
            (cd "$WORK_DIR" && "$exe") > "$LOG_DIR/${label}-aggregate.log" 2>&1
            selected=$(grep -E '^\[==========\] Running [0-9]+ test' "$LOG_DIR/${label}-aggregate.log" | head -1 | sed -E 's/.*Running ([0-9]+) test.*/\1/')
            green=$(grep -E '^\[  PASSED  \] [0-9]+ test' "$LOG_DIR/${label}-aggregate.log" | tail -1 | sed -E 's/.*\] ([0-9]+) test.*/\1/')
            test "$selected" = "$expected"; test "$green" = "$expected"
            echo "$label=$green/$selected" | tee -a "$EVIDENCE_DIR/independent-targets-summary.txt"
          done

          idx=0
          while IFS= read -r testname; do
            idx=$((idx+1)); out="$LOG_DIR/direct-${idx}.log"; res="$LOG_DIR/direct-${idx}.resources.txt"
            (cd "$WORK_DIR" && /usr/bin/time -v -o "$res" "$producer" --gtest_filter="$testname") > "$out" 2>&1
            grep -F '[  PASSED  ] 1 test.' "$out" >/dev/null
            test "$(find "$PKG_DIR" -type l | wc -l)" -eq 0
            printf '%d|%s|' "$idx" "$testname" >> "$EVIDENCE_DIR/direct-products-summary.txt"
            grep -E 'Elapsed \(wall clock\)|Maximum resident set size' "$res" | tr '\n' ' ' >> "$EVIDENCE_DIR/direct-products-summary.txt"
            printf '\n' >> "$EVIDENCE_DIR/direct-products-summary.txt"
          done < "$PKG_DIR/metadata/direct-product-test-names.txt"
          test "$idx" -eq 4

          reds=(
            SurfaceCellTransitionQuotient.MultiIsolationMaterializationRetainsAllLocalSheets
            SurfaceCellTransitionQuotient.FullPeriodicRotationAndTranslationMaterialize
            SurfaceCellTransitionQuotient.TamperedFullPeriodicTransformIsRejected
            SurfaceCellTransitionQuotient.MultiplePeriodicRelationsSurviveRelationReorderingByExplicitOwner
            SurfaceCellTransitionQuotient.SwappedPeriodicRelationOwnersAreRejected
            SurfaceCellTransitionQuotient.MissingPeriodicRelationOwnerIsRejected
            SurfaceCellTransitionQuotient.QuotientLineageRetainsScalarPointAndCompleteSortedAuthority
            SurfaceCellsPhase10.ExactCommittedTorusDoesNotTreatIsolationSeamAsBoundedDiskBoundary
          )
          idx=0
          for testname in "${reds[@]}"; do
            idx=$((idx+1)); out="$LOG_DIR/red-${idx}.log"
            set +e; (cd "$WORK_DIR" && "$producer" --gtest_filter="$testname") > "$out" 2>&1; rc=$?; set -e
            test "$rc" -eq 1; grep -F '[  FAILED  ] 1 test' "$out" >/dev/null
            case "$idx" in
              2|3) grep -F 'PeriodicHolonomyMismatch' "$out" >/dev/null; sig=PeriodicHolonomyMismatch ;;
              4|5|6) grep -F 'InvalidHardRailPairing' "$out" >/dev/null; sig=InvalidHardRailPairing ;;
              8) grep -F 'NotProductionReady:tracing producer=tracing/phase-front/InvalidHardRailPairing' "$out" >/dev/null; sig=NotProductionReady:tracing/InvalidHardRailPairing ;;
              *) sig=existing-assertion-red ;;
            esac
            echo "$idx|$testname|rc=$rc|$sig" | tee -a "$EVIDENCE_DIR/historical-red-summary.txt"
          done

          strict='SurfaceCellsPhase10.StrictValidatorOverheadStaysBelowFivePercent'
          : > "$EVIDENCE_DIR/strict-timing-summary.txt"
          for i in $(seq 1 10); do
            out="$LOG_DIR/strict-${i}.log"; res="$LOG_DIR/strict-${i}.resources.txt"
            set +e; (cd "$WORK_DIR" && /usr/bin/time -v -o "$res" "$producer" --gtest_filter="$strict") > "$out" 2>&1; rc=$?; set -e
            grep -F '[ RUN      ] SurfaceCellsPhase10.StrictValidatorOverheadStaysBelowFivePercent' "$out" >/dev/null
            line=$(grep -F 'actual:' "$out" | head -1 || true)
            wall=$(grep 'Elapsed (wall clock) time' "$res" | sed 's/.*: //' || true)
            rss=$(grep 'Maximum resident set size' "$res" | sed 's/.*: //' || true)
            echo "$i|rc=$rc|$line|wall=$wall|rss_kib=$rss" | tee -a "$EVIDENCE_DIR/strict-timing-summary.txt"
          done

          test "$(sha256sum "$zip" | awk '{print $1}')" = "$RESULT_ZIP_SHA256"
          test "$(sha256sum "$PKG_DIR/SHA256SUMS" | awk '{print $1}')" = "$MANIFEST_SHA256"
          (cd "$PKG_DIR" && sha256sum -c SHA256SUMS) > "$EVIDENCE_DIR/postflight-manifest-check.txt"
          test "$(wc -l < "$PKG_DIR/SHA256SUMS")" -eq 67
          test "$(find "$PKG_DIR" -type f | wc -l)" -eq 68
          test "$(find "$PKG_DIR/bin" -maxdepth 1 -type f | wc -l)" -eq 7
          test "$(find "$PKG_DIR/lib" -maxdepth 1 -type f | wc -l)" -eq 2
          test "$(find "$PKG_DIR/test-data/benchmarks/fixtures" -type f | wc -l)" -eq 27
          test "$(find "$PKG_DIR" -type l | wc -l)" -eq 0
          test ! -e "$PKG_DIR/bin/test-data"
          test "$(sha256sum "$producer" | awk '{print $1}')" = "$PRODUCER_SHA256"
          printf '%s\n' "$RESULT_ZIP_SHA256" "$MANIFEST_SHA256" '67/67' '68 regular files' '7 executables' '2 libraries' '27 fixtures' "$PRODUCER_SHA256" 'fixtureSymlink=false' > "$EVIDENCE_DIR/postflight-summary.txt"

      - name: Upload immutable validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m1j-artifact-runtime-validation-evidence
          path: /tmp/m1j-validation-evidence
          if-no-files-found: error
          retention-days: 14

      - name: Upload dedicated diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m1j-artifact-runtime-validation-logs
          path: /tmp/m1j-validation-logs
          if-no-files-found: error
          retention-days: 14
