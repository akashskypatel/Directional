name: M3 CP4c3 TB23 Closeout Apply

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m3-cp4c3-tb23-closeout-apply/**

permissions:
  contents: write
  id-token: write
  actions: read

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/m3-cp4c3-tb23-closeout-apply.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  apply:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1xzbm-3yOcuXPANMHugWaLjlYrUtaSiH2
      patch_sha256: 884480e07b1da1a2b35bee018cdbdef3dbd999c656d9e395267848601e697b09
      base_sha: cfbc42c9a352fd3829ed6750ebfb60eb449d6527
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: 'docs: close M3-CP4c-3-TB23-EXEC as orchestration-invalid'
      retention_days: 14
    secrets: inherit
