name: Apply P5 CB50 exact source patch

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .github/workflows/apply-p5-cb50-patch.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout staging commit
        uses: actions/checkout@v4
        with:
          ref: agent/surface_cell_quad/p5-recover-bridge-healing
          fetch-depth: 2

      - name: Reconstruct and apply exact patch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PATCH_B64_SHA256: 89836d76191f54b54afdcf6012c63d894917f99c3221f5b1247d227717f8be32
          PATCH_SHA256: fa9c2ab888051123f372dbcca29de605881199ebf47380fc6483ada3b61d12c7
        run: |
          set -euo pipefail
          : > /tmp/p5-cb50.patch.gz.b64
          for blob in \
            27904cfde57b96caa1a0b730f6bc1253b82b90a3 \
            5db820ba5199369a789c9254e6d6835f99688331 \
            45bb8d45aeb3ba8d5cc3fb6cd0bd61664527ee4d \
            d25731f80d1439e1481bf3a0258b3c9377a74725
          do
            curl -fsSL \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/blobs/${blob}" \
              | jq -r .content \
              | tr -d '\n' \
              | base64 --decode >> /tmp/p5-cb50.patch.gz.b64
          done
          echo "${PATCH_B64_SHA256}  /tmp/p5-cb50.patch.gz.b64" | sha256sum -c -
          base64 --decode /tmp/p5-cb50.patch.gz.b64 | gzip -dc > /tmp/p5-cb50.patch
          echo "${PATCH_SHA256}  /tmp/p5-cb50.patch" | sha256sum -c -
          git apply --check --whitespace=error /tmp/p5-cb50.patch
          git apply --index --whitespace=error /tmp/p5-cb50.patch
          git rm .github/workflows/apply-p5-cb50-patch.yml
          git diff --cached --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "feat(surface-cells): add global ownership frontier"
          git push origin HEAD:agent/surface_cell_quad/p5-recover-bridge-healing
