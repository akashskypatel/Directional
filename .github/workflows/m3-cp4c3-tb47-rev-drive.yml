name: M3 CP4c3 TB47 Review Drive Apply

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/tb47-rev-drive/tb47-rev-drive-20260909.txt

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: m3-cp4c3-tb47-rev-drive-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/m3-cp4c3-tb47-rev-drive.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m3-cp4c3-tb47-rev-drive
      commit_run_file: false
      trim_stale_comments: false
    secrets: inherit

  apply:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1orRA4KdDy6a0Lv7vyya1lJu0Ajf4K0d3
      patch_sha256: 660573c207962223a26cdd0f3127034e92540ae90b11cdf80580c8ccf981edb7
      base_sha: cf6513d6adbcc480185208cde66136f17283eaf3
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: 'docs: review TB47 and freeze CB54'
    secrets: inherit
