name: M6-CB63 Compile Schema Preflight
on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .github/workflows/agent-compile-reusable.yml
permissions:
  contents: read
jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/agent-compile-reusable.yml
      source_ref: ${{ github.sha }}
  mailbox:
    needs: [validate]
    if: ${{ always() }}
    permissions:
      actions: read
      contents: write
    uses: ./.github/workflows/workflow-mailbox-publisher.yml
    with:
      mailbox_branch: workflow-mailbox
      workflow_key: m6-cb63-compile-schema-preflight
      source_sha: ${{ github.sha }}
      source_ref: ${{ github.ref }}
      result: ${{ needs.validate.result }}
      summary: M6-CB63 reusable compile workflow YAML schema preflight.
