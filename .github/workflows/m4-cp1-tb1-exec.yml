name: M4 CP1 TB1 Artifact-Only Execution

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m4-cp1-tb1-exec-20260910.txt

permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: m4-cp1-tb1-exec-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/m4-cp1-tb1-exec.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m4-cp1-tb1-exec
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  tb1:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    env:
      ARTIFACT_ID: "10142108806"
      EXPECTED_ARTIFACT_NAME: m4-cp1-cb3-package114-result-34452123494
      EXPECTED_ARTIFACT_SHA256: "9a87181f771a1814fa854bc2056050b05880b6ec8dfe4ef9c9346102ee26fa36"
      EXPECTED_SOURCE_SHA: 680f9f1573d3c7e56a273366436463e40e196131
      EXPECTED_BINARY_SHA256: "5b1064e6025b052aed7aeee66b8e1c3f6218bc73791d55fed4675484f4ea2afd"
      EXPECTED_CORE_SHA256: "0325a5d45181014ff45783596c8d952a14f86d383b46d9f6ba43ccfc92315c4b"
      EXPECTED_SELECTOR_SHA256: "6d00cafa939a0e89c4816a6b0e8fec83232c0e7a94a468ae547b1667171e7d8b"
      EXPECTED_SELECTOR_PREFIX_SHA256: "6b5b6555d39c250c24cbf3faeafdeca93b4b11379118a29583253e6cfc14b8a1"
      SELECTOR_PATH: .agents/Directional/Architecture_M4_CP1_Required_Green_Selector_373.txt
      GH_TOKEN: ${{ secrets.GH_TOKEN || github.token }}

    steps:
      - name: Initialize persistent activity log
        shell: bash
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/m4-cp1-tb1-exec.log"
          : > "$log"
          {
            echo "workflow=${GITHUB_WORKFLOW}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "event=${GITHUB_EVENT_NAME}"
            echo "event_sha=${GITHUB_SHA}"
            echo "ref=${GITHUB_REF}"
            echo "repository=${GITHUB_REPOSITORY}"
            echo "turn=M4-CP1-TB1-EXEC"
            echo "artifact_id=${ARTIFACT_ID}"
            echo "semantic_source=${EXPECTED_SOURCE_SHA}"
            echo "started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "runner_os=${RUNNER_OS}"
            uname -a
            gh --version | head -n 1
            unzip -v | head -n 2
            sha256sum --version | head -n 1
            /usr/bin/time --version | head -n 1
          } | tee -a "$log"

      - name: Checkout control authority only
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          submodules: false
          persist-credentials: false

      - name: Verify immutable package and execute TB1
        id: execute
        shell: bash
        run: |
          set -u
          log="${RUNNER_TEMP}/m4-cp1-tb1-exec.log"
          result_dir="${RUNNER_TEMP}/m4-cp1-tb1-result"
          package_dir="${RUNNER_TEMP}/m4-cp1-package114"
          archive="${RUNNER_TEMP}/m4-cp1-package114.zip"
          mkdir -p "$result_dir" "$package_dir"
          exec > >(tee -a "$log") 2>&1

          status="PASS"
          runtime_execution="false"
          preflight_ok="true"
          postflight_ok="not-run"
          semantic_ok="not-run"
          repeat_ok="not-run"

          record_failure() {
            local kind="$1"
            local message="$2"
            echo "FAIL[${kind}]: ${message}"
            printf '%s\t%s\n' "$kind" "$message" >> "${result_dir}/failures.tsv"
            if [[ "$kind" == "preflight" || "$kind" == "postflight" || "$kind" == "orchestration" ]]; then
              if [[ "$status" == "PASS" ]]; then
                status="ORCHESTRATION_EVIDENCE_STOP"
              fi
            else
              status="SEMANTIC_RED"
            fi
          }

          echo "=== immutable preflight ==="
          {
            echo "artifact_id=${ARTIFACT_ID}"
            echo "expected_artifact_name=${EXPECTED_ARTIFACT_NAME}"
            echo "expected_provider_sha256=${EXPECTED_ARTIFACT_SHA256}"
            echo "expected_source_sha=${EXPECTED_SOURCE_SHA}"
          } > "${result_dir}/preflight.txt"

          artifact_json="${result_dir}/artifact-metadata.json"
          if ! gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}" > "$artifact_json"; then
            record_failure preflight "artifact metadata API request failed"
            preflight_ok="false"
          fi

          if [[ "$preflight_ok" == "true" ]]; then
            actual_id="$(jq -r '.id' "$artifact_json")"
            actual_name="$(jq -r '.name' "$artifact_json")"
            actual_digest="$(jq -r '.digest' "$artifact_json")"
            actual_expired="$(jq -r '.expired' "$artifact_json")"
            {
              echo "actual_artifact_id=${actual_id}"
              echo "actual_artifact_name=${actual_name}"
              echo "actual_provider_digest=${actual_digest}"
              echo "actual_expired=${actual_expired}"
            } | tee -a "${result_dir}/preflight.txt"

            [[ "$actual_id" == "$ARTIFACT_ID" ]] || { record_failure preflight "artifact ID mismatch"; preflight_ok="false"; }
            [[ "$actual_name" == "$EXPECTED_ARTIFACT_NAME" ]] || { record_failure preflight "artifact name mismatch"; preflight_ok="false"; }
            [[ "$actual_digest" == "sha256:${EXPECTED_ARTIFACT_SHA256}" ]] || { record_failure preflight "provider artifact digest mismatch"; preflight_ok="false"; }
            [[ "$actual_expired" == "false" ]] || { record_failure preflight "artifact is expired"; preflight_ok="false"; }
          fi

          if [[ "$preflight_ok" == "true" ]]; then
            if ! gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" > "$archive"; then
              record_failure preflight "artifact download failed"
              preflight_ok="false"
            fi
          fi

          if [[ "$preflight_ok" == "true" ]]; then
            archive_hash="$(sha256sum "$archive" | awk '{print $1}')"
            echo "downloaded_archive_sha256=${archive_hash}" | tee -a "${result_dir}/preflight.txt"
            [[ "$archive_hash" == "$EXPECTED_ARTIFACT_SHA256" ]] || { record_failure preflight "downloaded artifact SHA-256 mismatch"; preflight_ok="false"; }
          fi

          if [[ "$preflight_ok" == "true" ]]; then
            if ! unzip -q "$archive" -d "$package_dir"; then
              record_failure preflight "ordinary unzip extraction failed"
              preflight_ok="false"
            fi
          fi

          binary="${package_dir}/bin/directional_surface_cell_producer_tests"
          core="${package_dir}/lib/libdirectional_core.a"
          selector="${GITHUB_WORKSPACE}/${SELECTOR_PATH}"

          if [[ "$preflight_ok" == "true" ]]; then
            [[ -x "$binary" ]] || { record_failure preflight "archived executable mode was not preserved; package is not repaired"; preflight_ok="false"; }
            [[ -f "$core" ]] || { record_failure preflight "packaged directional_core archive missing"; preflight_ok="false"; }
            [[ -f "${package_dir}/SHA256SUMS" ]] || { record_failure preflight "package SHA256SUMS missing"; preflight_ok="false"; }
          fi

          if [[ "$preflight_ok" == "true" ]]; then
            (
              cd "$package_dir"
              sha256sum -c SHA256SUMS
            ) | tee "${result_dir}/sha256sums-preflight.txt"
            checks_status=${PIPESTATUS[0]}
            [[ "$checks_status" -eq 0 ]] || { record_failure preflight "package SHA256SUMS preflight failed"; preflight_ok="false"; }
          fi

          if [[ "$preflight_ok" == "true" ]]; then
            source_text="$(cat "${package_dir}/metadata/source-commit.txt")"
            [[ "$source_text" == "$EXPECTED_SOURCE_SHA" ]] || { record_failure preflight "metadata/source-commit.txt mismatch"; preflight_ok="false"; }

            for expected in \
              "runtimeExecution=false" \
              "turnBoundary=Code+Build-only" \
              "exactArithmeticBackend=GMP" \
              "semanticContracts=compiled-not-executed"; do
              grep -Fxq "$expected" "${package_dir}/metadata/command-boundary.txt" || { record_failure preflight "missing command-boundary field: ${expected}"; preflight_ok="false"; }
            done

            grep -q '^GMPXX_LIBRARIES:.*libgmpxx' "${package_dir}/metadata/gmp-evidence.txt" || { record_failure preflight "GMPXX discovery evidence missing"; preflight_ok="false"; }
            grep -q '^GMP_LIBRARIES:.*libgmp' "${package_dir}/metadata/gmp-evidence.txt" || { record_failure preflight "GMP discovery evidence missing"; preflight_ok="false"; }
            grep -q 'libgmpxx\.so' "${package_dir}/metadata/gmp-evidence.txt" || { record_failure preflight "GMPXX link evidence missing"; preflight_ok="false"; }
            grep -q 'libgmp\.so' "${package_dir}/metadata/gmp-evidence.txt" || { record_failure preflight "GMP link evidence missing"; preflight_ok="false"; }

            binary_hash="$(sha256sum "$binary" | awk '{print $1}')"
            core_hash="$(sha256sum "$core" | awk '{print $1}')"
            echo "binary_sha256=${binary_hash}" | tee -a "${result_dir}/preflight.txt"
            echo "core_sha256=${core_hash}" | tee -a "${result_dir}/preflight.txt"
            [[ "$binary_hash" == "$EXPECTED_BINARY_SHA256" ]] || { record_failure preflight "test binary SHA-256 mismatch"; preflight_ok="false"; }
            [[ "$core_hash" == "$EXPECTED_CORE_SHA256" ]] || { record_failure preflight "directional_core SHA-256 mismatch"; preflight_ok="false"; }
          fi

          if [[ "$preflight_ok" == "true" ]]; then
            [[ -f "$selector" ]] || { record_failure preflight "selector file missing from control authority"; preflight_ok="false"; }
          fi

          if [[ "$preflight_ok" == "true" ]]; then
            selector_rows="$(wc -l < "$selector" | tr -d ' ')"
            selector_hash="$(sha256sum "$selector" | awk '{print $1}')"
            selector_prefix_hash="$(head -n 365 "$selector" | sha256sum | awk '{print $1}')"
            {
              echo "selector_rows=${selector_rows}"
              echo "selector_sha256=${selector_hash}"
              echo "selector_prefix365_sha256=${selector_prefix_hash}"
            } | tee -a "${result_dir}/preflight.txt"
            [[ "$selector_rows" == "373" ]] || { record_failure preflight "selector row count is not 373"; preflight_ok="false"; }
            [[ "$selector_hash" == "$EXPECTED_SELECTOR_SHA256" ]] || { record_failure preflight "selector full SHA-256 mismatch"; preflight_ok="false"; }
            [[ "$selector_prefix_hash" == "$EXPECTED_SELECTOR_PREFIX_SHA256" ]] || { record_failure preflight "selector first-365 SHA-256 mismatch"; preflight_ok="false"; }
            if LC_ALL=C grep -q $'\r' "$selector"; then
              record_failure preflight "selector contains CR bytes; LF authority violated"
              preflight_ok="false"
            fi
          fi

          if [[ "$preflight_ok" == "true" ]]; then
            command -v /usr/bin/time >/dev/null 2>&1 || { record_failure orchestration "/usr/bin/time unavailable"; preflight_ok="false"; }
            ldconfig -p | grep -q 'libgmpxx\.so' || { record_failure orchestration "runtime libgmpxx unavailable"; preflight_ok="false"; }
            ldconfig -p | grep -q 'libgmp\.so' || { record_failure orchestration "runtime libgmp unavailable"; preflight_ok="false"; }
          fi

          echo "preflight_ok=${preflight_ok}" | tee -a "${result_dir}/preflight.txt"

          focused_filter='GlobalConformityPlan.MultiPieceCompactOrdinalsAndReverseIncidenceSymmetry:GlobalConformityExactSolver.PreservesSameRowBidirectedMultiplicityPositivityAndParity:GlobalConformityPlan.ExactBinary64IngressCanonicalizesSignedZeroAndSubnormal:GlobalConformityExactSolver.HugeExactCapRadixAndLexObjectiveNeverNarrow:GlobalConformityExactSolver.FixedM2RefinementMatchesSeparateTinyExhaustiveOracle:GlobalConformityExactSolver.GenuinelyBidirectedLoopPermutationAndReversalAreDeterministic:GlobalConformityPlan.IndependentValidatorRejectsTamperMatrix:GlobalConformityExactSolver.ExactValuesExceedLibSatsumaAndBlossomScalarWidths'

          write_verdicts() {
            local names_file="$1"
            local output_file="$2"
            local verdict_file="$3"
            : > "$verdict_file"
            while IFS= read -r name || [[ -n "$name" ]]; do
              [[ -n "$name" ]] || continue
              if grep -Fq "[       OK ] ${name}" "$output_file"; then
                verdict="PASS"
              elif grep -Fq "[  SKIPPED ] ${name}" "$output_file"; then
                verdict="SKIP"
              elif grep -Fq "[  FAILED  ] ${name}" "$output_file"; then
                verdict="RED"
              else
                verdict="MISSING"
              fi
              printf '%s\t%s\n' "$name" "$verdict" >> "$verdict_file"
            done < "$names_file"
          }

          run_gtest() {
            local label="$1"
            local filter="$2"
            local expected_count="$3"
            local names_file="$4"
            local output_file="${result_dir}/${label}.txt"
            local time_file="${result_dir}/${label}-time.txt"
            local meta_file="${result_dir}/${label}-meta.txt"
            local verdict_file="${result_dir}/${label}-verdicts.tsv"

            echo "=== ${label} ==="
            start_epoch="$(date +%s)"
            set +e
            /usr/bin/time -v -o "$time_file" "$binary" --gtest_color=no --gtest_filter="$filter" 2>&1 | tee "$output_file"
            command_status=${PIPESTATUS[0]}
            set -e
            end_epoch="$(date +%s)"

            selected="$(sed -nE 's/^\[==========\] Running ([0-9]+) tests?.*/\1/p' "$output_file" | head -n 1)"
            executed="$(sed -nE 's/^\[==========\] ([0-9]+) tests? from .* ran\..*/\1/p' "$output_file" | tail -n 1)"
            selected="${selected:-0}"
            executed="${executed:-0}"
            write_verdicts "$names_file" "$output_file" "$verdict_file"
            pass_count="$(awk -F '\t' '$2=="PASS"{c++} END{print c+0}' "$verdict_file")"
            red_count="$(awk -F '\t' '$2=="RED"{c++} END{print c+0}' "$verdict_file")"
            skip_count="$(awk -F '\t' '$2=="SKIP"{c++} END{print c+0}' "$verdict_file")"
            missing_count="$(awk -F '\t' '$2=="MISSING"{c++} END{print c+0}' "$verdict_file")"
            {
              echo "label=${label}"
              echo "exit_code=${command_status}"
              echo "selected=${selected}"
              echo "executed=${executed}"
              echo "expected=${expected_count}"
              echo "pass=${pass_count}"
              echo "red=${red_count}"
              echo "skip=${skip_count}"
              echo "missing=${missing_count}"
              echo "elapsed_seconds=$((end_epoch-start_epoch))"
            } | tee "$meta_file"

            if [[ "$selected" != "$expected_count" || "$executed" != "$expected_count" ]]; then
              record_failure semantic "${label}: expected ${expected_count} selected/executed, got ${selected}/${executed}"
            fi
            if [[ "$command_status" -ne 0 || "$red_count" -ne 0 || "$skip_count" -ne 0 || "$missing_count" -ne 0 || "$pass_count" -ne "$expected_count" ]]; then
              record_failure semantic "${label}: exit=${command_status} pass/red/skip/missing=${pass_count}/${red_count}/${skip_count}/${missing_count}"
            fi
          }

          if [[ "$preflight_ok" == "true" ]]; then
            runtime_execution="true"
            semantic_ok="true"

            focused_names="${result_dir}/focused-identities.txt"
            printf '%s\n' \
              'GlobalConformityPlan.MultiPieceCompactOrdinalsAndReverseIncidenceSymmetry' \
              'GlobalConformityExactSolver.PreservesSameRowBidirectedMultiplicityPositivityAndParity' \
              'GlobalConformityPlan.ExactBinary64IngressCanonicalizesSignedZeroAndSubnormal' \
              'GlobalConformityExactSolver.HugeExactCapRadixAndLexObjectiveNeverNarrow' \
              'GlobalConformityExactSolver.FixedM2RefinementMatchesSeparateTinyExhaustiveOracle' \
              'GlobalConformityExactSolver.GenuinelyBidirectedLoopPermutationAndReversalAreDeterministic' \
              'GlobalConformityPlan.IndependentValidatorRejectsTamperMatrix' \
              'GlobalConformityExactSolver.ExactValuesExceedLibSatsumaAndBlossomScalarWidths' > "$focused_names"

            run_gtest "focused-run1" "$focused_filter" "8" "$focused_names"
            run_gtest "focused-run2" "$focused_filter" "8" "$focused_names"

            if cmp -s "${result_dir}/focused-run1-verdicts.tsv" "${result_dir}/focused-run2-verdicts.tsv"; then
              repeat_ok="true"
              echo "focused_repeat_verdict_vector=identical" | tee "${result_dir}/repeat.txt"
            else
              repeat_ok="false"
              record_failure semantic "focused repeat verdict vector differs"
              diff -u "${result_dir}/focused-run1-verdicts.tsv" "${result_dir}/focused-run2-verdicts.tsv" | tee "${result_dir}/repeat-diff.txt" || true
            fi

            for focused_meta in "${result_dir}/focused-run1-meta.txt" "${result_dir}/focused-run2-meta.txt"; do
              grep -Fxq 'pass=8' "$focused_meta" || semantic_ok="false"
              grep -Fxq 'red=0' "$focused_meta" || semantic_ok="false"
              grep -Fxq 'skip=0' "$focused_meta" || semantic_ok="false"
              grep -Fxq 'missing=0' "$focused_meta" || semantic_ok="false"
            done
            [[ "$repeat_ok" == "true" ]] || semantic_ok="false"

            selector_filter="$(paste -sd: "$selector")"
            run_gtest "selector373" "$selector_filter" "373" "$selector"

            first365_pass="$(head -n 365 "${result_dir}/selector373-verdicts.tsv" | awk -F '\t' '$2=="PASS"{c++} END{print c+0}')"
            cp1_pass="$(tail -n 8 "${result_dir}/selector373-verdicts.tsv" | awk -F '\t' '$2=="PASS"{c++} END{print c+0}')"
            {
              echo "accepted_prefix365_pass=${first365_pass}"
              echo "cp1_rows366_373_pass=${cp1_pass}"
            } | tee "${result_dir}/selector-partitions.txt"
            if [[ "$first365_pass" != "365" ]]; then
              record_failure semantic "accepted predecessor rows 1-365 are not all PASS (${first365_pass}/365)"
              semantic_ok="false"
            fi
            if [[ "$cp1_pass" != "8" ]]; then
              record_failure semantic "CP1 rows 366-373 are not all PASS (${cp1_pass}/8)"
              semantic_ok="false"
            fi

            grep -Fxq 'pass=373' "${result_dir}/selector373-meta.txt" || semantic_ok="false"
            grep -Fxq 'red=0' "${result_dir}/selector373-meta.txt" || semantic_ok="false"
            grep -Fxq 'skip=0' "${result_dir}/selector373-meta.txt" || semantic_ok="false"
            grep -Fxq 'missing=0' "${result_dir}/selector373-meta.txt" || semantic_ok="false"

            echo "=== immutable postflight ==="
            postflight_ok="true"
            (
              cd "$package_dir"
              sha256sum -c SHA256SUMS
            ) | tee "${result_dir}/sha256sums-postflight.txt"
            post_checks=${PIPESTATUS[0]}
            if [[ "$post_checks" -ne 0 ]]; then
              record_failure postflight "package SHA256SUMS changed after execution"
              postflight_ok="false"
            fi

            binary_post_hash="$(sha256sum "$binary" | awk '{print $1}')"
            selector_post_hash="$(sha256sum "$selector" | awk '{print $1}')"
            selector_prefix_post_hash="$(head -n 365 "$selector" | sha256sum | awk '{print $1}')"
            {
              echo "binary_post_sha256=${binary_post_hash}"
              echo "selector_post_sha256=${selector_post_hash}"
              echo "selector_prefix365_post_sha256=${selector_prefix_post_hash}"
            } | tee "${result_dir}/postflight.txt"
            [[ "$binary_post_hash" == "$EXPECTED_BINARY_SHA256" ]] || { record_failure postflight "test binary postflight SHA-256 mismatch"; postflight_ok="false"; }
            [[ "$selector_post_hash" == "$EXPECTED_SELECTOR_SHA256" ]] || { record_failure postflight "selector postflight SHA-256 mismatch"; postflight_ok="false"; }
            [[ "$selector_prefix_post_hash" == "$EXPECTED_SELECTOR_PREFIX_SHA256" ]] || { record_failure postflight "selector prefix postflight SHA-256 mismatch"; postflight_ok="false"; }

            if [[ "$semantic_ok" != "true" && "$status" == "PASS" ]]; then
              status="SEMANTIC_RED"
            fi
          fi

          {
            echo "turn=M4-CP1-TB1-EXEC"
            echo "status=${status}"
            echo "runtimeExecution=${runtime_execution}"
            echo "preflight_ok=${preflight_ok}"
            echo "postflight_ok=${postflight_ok}"
            echo "semantic_ok=${semantic_ok}"
            echo "repeat_ok=${repeat_ok}"
            echo "artifact_id=${ARTIFACT_ID}"
            echo "provider_artifact_sha256=${EXPECTED_ARTIFACT_SHA256}"
            echo "source_sha=${EXPECTED_SOURCE_SHA}"
            echo "binary_sha256=${EXPECTED_BINARY_SHA256}"
            echo "selector_sha256=${EXPECTED_SELECTOR_SHA256}"
            echo "selector_prefix365_sha256=${EXPECTED_SELECTOR_PREFIX_SHA256}"
            echo "finished_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } | tee "${result_dir}/summary.txt"

          {
            echo "status=${status}"
            echo "runtime_execution=${runtime_execution}"
            echo "preflight_ok=${preflight_ok}"
            echo "postflight_ok=${postflight_ok}"
            echo "semantic_ok=${semantic_ok}"
            echo "repeat_ok=${repeat_ok}"
          } >> "$GITHUB_OUTPUT"

          exit 0

      - name: Upload TB1 result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m4-cp1-tb1-result-${{ github.run_id }}
          path: ${{ runner.temp }}/m4-cp1-tb1-result
          if-no-files-found: error
          retention-days: 7

      - name: Upload TB1 diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m4-cp1-tb1-log-${{ github.run_id }}
          path: ${{ runner.temp }}/m4-cp1-tb1-exec.log
          if-no-files-found: error
          retention-days: 7

      - name: Propagate TB1 status
        if: always()
        env:
          TB_STATUS: ${{ steps.execute.outputs.status }}
        shell: bash
        run: |
          set -euo pipefail
          echo "tb1_status=${TB_STATUS:-missing}"
          if [[ "${TB_STATUS:-missing}" != "PASS" ]]; then
            exit 1
          fi
