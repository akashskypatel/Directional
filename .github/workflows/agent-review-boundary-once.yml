name: Directional Review Boundary Once

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .github/workflows/agent-review-boundary-once.yml

permissions:
  actions: read
  contents: read

jobs:
  validate:
    permissions:
      contents: read
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/agent-review-boundary-once.yml
      source_ref: ${{ github.sha }}

  verify:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - name: Initialize persistent review log
        shell: bash
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/directional-review-boundary.log"
          : > "$log"
          {
            echo "workflow=${GITHUB_WORKFLOW}"
            echo "event_sha=${GITHUB_SHA}"
            echo "ref=${GITHUB_REF}"
            echo "repo=${GITHUB_REPOSITORY}"
            echo "start=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } | tee -a "$log"
      - name: Checkout full Git history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: false
      - name: Run review authority and boundary checks
        shell: bash
        run: |
          set -Eeuo pipefail
          log="${RUNNER_TEMP}/directional-review-boundary.log"
          exec > >(tee -a "$log") 2>&1
          trap 'code=$?; echo "review_check_exit=${code}"; echo "finished_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"; git status -sb || true' EXIT
          echo "python=$(python3 --version) git=$(git --version)"
          echo "actual_commit=$(git rev-parse HEAD)"
          git status -sb
          python3 .agents/Directional/tools/review_check.py authority 47a874ee8baa86284eeee11b4a28f9cca06d73f9
          python3 .agents/Directional/tools/review_check.py boundary
          git status -sb
      - name: Retain review log on all outcomes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: directional-review-boundary-log-${{ github.run_id }}
          path: ${{ runner.temp }}/directional-review-boundary.log
          if-no-files-found: error
          retention-days: 14

  mailbox:
    if: ${{ always() }}
    needs: [validate, verify]
    permissions:
      actions: read
      contents: write
    uses: ./.github/workflows/workflow-mailbox-publisher.yml
    with:
      workflow_key: m6-cp3-tb-rev157-boundary
      source_sha: ${{ github.sha }}
      source_ref: ${{ github.ref }}
      result: ${{ needs.verify.result }}
      summary: Independent TB-REV-157 full-Git authority and boundary checks; no build or tests
