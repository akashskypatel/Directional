name: Agent Source Snapshot TB34 REV 20260907

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/source-snapshot/tb34-rev-20260907.txt

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: agent-source-snapshot-tb34-rev-20260907
  cancel-in-progress: false

jobs:
  validate-caller:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/agent-source-snapshot-tb34-rev-20260907.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  snapshot:
    needs: validate-caller
    if: ${{ needs.validate-caller.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-source-snapshot.yml
    with:
      source_ref: 512ba0388f83a6c5f111f034a11ad03b456483a5
      artifact_prefix: agent-source-snapshot-tb34-rev-20260907
    secrets: inherit
