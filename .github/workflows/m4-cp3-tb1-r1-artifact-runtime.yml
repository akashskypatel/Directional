name: M4 CP3 TB1 R1 Artifact Runtime

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m4-cp3-tb1-r1-exec/trigger.txt

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: m4-cp3-tb1-r1-artifact-runtime
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/m4-cp3-tb1-r1-artifact-runtime.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m4-cp3-tb1-r1-exec
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  execute:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    runs-on: ubuntu-24.04
    env:
      ARTIFACT_ID: '10185370005'
      EXPECTED_ZIP_SHA256: 9fdfe9a1c8f92d52669a82da0ddfca75d58fd8dc7317d5100faff5a85c820fc8
      EXPECTED_SOURCE_SHA: fd532c2f768d0ff6493260deb670cb34b6757712
      EXPECTED_SELECTOR394_SHA256: 6c27b3a0fc7259c5817bc9bbf41d5e2a23b7dd20f41fb75db8789abeb2cfba68
      EXPECTED_SELECTOR382_PREFIX_SHA256: 1d59b1f709e51854f8ceaee1a161687ff882a128dabdc79882712c97a15ca84f
      PER_PROCESS_TIMEOUT_SECONDS: '180'
      PAYLOAD_BLOB_SHA: bb068598a182e70f530288e7299491f3ca626cab
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Fetch exact temporary runtime payload
        shell: bash
        run: |
          set -euo pipefail
          payload_json="$RUNNER_TEMP/tb-payload.json"
          gh api --method GET "repos/$GITHUB_REPOSITORY/contents/.agents/Directional/turn-payloads/m4-cp3-tb1-r1/tb_exec.sh?ref=$GITHUB_SHA" > "$payload_json"
          test "$(jq -r .sha "$payload_json")" = "$PAYLOAD_BLOB_SHA"
          jq -r .content "$payload_json" | tr -d '\n' | base64 --decode > "$RUNNER_TEMP/tb_exec.sh"
          bash -n "$RUNNER_TEMP/tb_exec.sh"

      - name: Execute immutable package119 evidence matrix
        shell: bash
        run: bash "$RUNNER_TEMP/tb_exec.sh"

      - name: Upload raw TB evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m4-cp3-tb1-r1-raw-${{ github.run_id }}
          path: ${{ runner.temp }}/m4-cp3-tb1-r1-evidence
          if-no-files-found: error
          retention-days: 30
