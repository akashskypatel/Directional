name: M4 CP3 TB1 R1 Artifact Runtime

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m4-cp3-tb1-r1-exec/trigger.txt

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: m4-cp3-tb1-r1-artifact-runtime
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/m4-cp3-tb1-r1-artifact-runtime.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m4-cp3-tb1-r1-exec
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  execute:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    runs-on: ubuntu-24.04
    env:
      PAYLOAD_BLOB_SHA: 3e46bba9a2ac22ac75fc7b22b63d7be87d982d5d
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Fetch exact temporary runtime payload
        shell: bash
        run: |
          set -euo pipefail
          payload_json="$RUNNER_TEMP/tb-payload.json"
          gh api --method GET "repos/$GITHUB_REPOSITORY/contents/.agents/Directional/turn-payloads/m4-cp3-tb1-r1/tb_exec_r3.sh?ref=$GITHUB_SHA" > "$payload_json"
          test "$(jq -r .sha "$payload_json")" = "$PAYLOAD_BLOB_SHA"
          jq -r .content "$payload_json" | tr -d '\n' | base64 --decode > "$RUNNER_TEMP/tb_exec.sh"
          bash -n "$RUNNER_TEMP/tb_exec.sh"

      - name: Execute immutable package119 evidence matrix
        id: tb
        continue-on-error: true
        shell: bash
        run: bash "$RUNNER_TEMP/tb_exec.sh"

      - name: Upload raw TB evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m4-cp3-tb1-r1-result-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/m4-cp3-tb1-r1-exec/result
            ${{ runner.temp }}/tb-r1-orchestration-retry.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload TB diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m4-cp3-tb1-r1-log-${{ github.run_id }}
          path: ${{ runner.temp }}/m4-cp3-tb1-r1-exec.log
          if-no-files-found: error
          retention-days: 30

      - name: Propagate TB result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          code_file="$RUNNER_TEMP/m4-cp3-tb1-r1-exec/result/harness-exit-code.txt"
          test -f "$code_file" || { echo 'TB1-R1 harness exit code missing' >&2; exit 3; }
          exit "$(cat "$code_file")"
