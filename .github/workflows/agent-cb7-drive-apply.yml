name: Agent CB7 Drive Apply

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/cb7-drive-apply/**

permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

jobs:
  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: cb7-drive-apply
    secrets: inherit

  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/agent-cb7-drive-apply.yml
    secrets: inherit

  apply:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 160J5jl6CWJngS4fF9Meyxc2U23vRTPUV
      patch_sha256: 616f2a84afaafd13671f6f2d14c41dfa1ebd74f252082f3ca5c4e3646b5e6757
      base_sha: b14939c2052475172c8a907de045806caa69b82f
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: "docs: close M4-CP-SCALE-CB7"
    secrets: inherit
