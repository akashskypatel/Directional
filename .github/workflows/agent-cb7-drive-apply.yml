name: Agent CB7 Drive Apply

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/cb7-drive-apply/**

permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

jobs:
  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: cb7-drive-apply
    secrets: inherit

  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/agent-cb7-drive-apply.yml
    secrets: inherit

  apply:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1Bsf8p2y5SIivG_XHI1QmAuR4tQq6eBXy
      patch_sha256: a82ef09229d05d589412b1b47fc58c4ed50cc740d24974f2f3427d81990637ec
      base_sha: 4eb4d14fd8af4830afdd212ade0842706c1817f0
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: "fix: restore NetworkNodeId test alias"
    secrets: inherit
