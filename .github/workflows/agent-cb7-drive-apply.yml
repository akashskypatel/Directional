name: Agent CB7 Drive Apply

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/cb7-drive-apply/**

permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

jobs:
  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: cb7-drive-apply
    secrets: inherit

  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/agent-cb7-drive-apply.yml
    secrets: inherit

  apply:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1v4fy177GkGpQJhD1zlfK3ZvWaBDL2o6b
      patch_sha256: 4e31c84bade3cb4c7ecab1d973b80f73810ac354ccb6647587d4524606654259
      base_sha: 9ae9a485843022d74d203ffcfbc2f458f7604993
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: "feat: publish exact trace limit-cycle termination"
    secrets: inherit
