name: Agent CB16 Drive Patch Apply

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/cb16-drive-apply/**

permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/agent-cb16-drive-apply.yml
    secrets: inherit

  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: cb16-drive-apply
      trim_stale_comments: true
    secrets: inherit

  apply:
    needs: validate
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1MC1CevQo4W7I9oq-a0ZLiiE483IaKwQd
      patch_sha256: 9cb4ba2528b2298ba062f248432b7d95ddf456344e94ff44009ce40cb47d103f
      base_sha: 256b8157de71624fd14fd677d358df44d576a658
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: "M4-CP-SCALE-CB16: support multi-component cycle rows"
      retention_days: 14
    secrets: inherit
