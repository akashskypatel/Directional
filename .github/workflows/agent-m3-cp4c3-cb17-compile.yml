name: Agent M3 CP4c3 CB17 Compile

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/compile/m3-cp4c3-cb17.txt

permissions:
  contents: read
  actions: write
  issues: write
  pull-requests: write

concurrency:
  group: agent-m3-cp4c3-cb17-compile
  cancel-in-progress: false

jobs:
  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m3-cp4c3-cb17-compile
      trim_stale_comments: false
    secrets: inherit

  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/agent-m3-cp4c3-cb17-compile.yml
    secrets: inherit

  compile:
    needs: validate
    uses: ./.github/workflows/agent-compile-reusable.yml
    with:
      source_sha: 5dcaa8be0c9677454f8d5144987eb599f544c0b9
      targets: directional_core directional_pipeline directional_surface_cell_authority_kernel_tests directional_surface_cell_producer_tests directional_surface_cell_completion_tests directional_surface_cell_validation_tests directional_compiled_api_tests directional_benchmarks
      artifact_prefix: m3-cp4c3-cb17-compile
    secrets: inherit
