name: M6 CP2 CB1 Verifier R1 Drive Apply

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m6-cp2-cb1-verifier-r1-drive-apply.txt

permissions:
  actions: read
  contents: write
  id-token: write

concurrency:
  group: m6-cp2-cb1-verifier-r1-drive-apply-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/m6-cp2-cb1-verifier-r1-drive-apply.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  apply:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1GOMfsfdF1SamD-pZ9bwtwKhEG9jvzvBG
      patch_sha256: 6d0c4c4083e095c1f87dab341657b42b4d14413459fe1f37c6cf128a6d4dda20
      base_sha: 09ab05dfb34fc4a1f6ae052ef78f2a3ceaae0739
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: "M6 CP2: add independent surface product verifier"
    secrets: inherit

  mailbox:
    if: ${{ always() }}
    needs: [validate, apply]
    permissions:
      actions: read
      contents: write
    uses: ./.github/workflows/workflow-mailbox-publisher.yml
    with:
      workflow_key: m6-cp2-cb1-verifier-r1-drive-apply
      source_sha: ${{ github.sha }}
      source_ref: ${{ github.ref }}
      result: ${{ needs.apply.result }}
      summary: M6-CP2-CB1-VERIFIER-R1 Google Drive patch application.
