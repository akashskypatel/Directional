name: M4 CP4 TB2 R2 Validate Installed Caller

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m4-cp4-tb2-r2/validate-installed.txt

permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: m4-cp4-tb2-r2-validate-installed
  cancel-in-progress: false

jobs:
  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m4-cp4-tb2-r2-validate-installed
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: ${{ contains(github.event.head_commit.message, 'validate self') && '.github/workflows/m4-cp4-tb2-r2-validate-installed.yml' || '.github/workflows/m4-cp4-tb2-r1-exec.yml' }}
      source_ref: ${{ github.sha }}
    secrets: inherit

  static-check:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' && !contains(github.event.head_commit.message, 'validate self') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout exact control authority
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          submodules: false
          lfs: false

      - name: Verify installed caller permission ceiling and frozen control boundary
        shell: bash
        run: |
          set -euo pipefail
          caller='.github/workflows/m4-cp4-tb2-r1-exec.yml'
          draft='.agents/Directional/turn-payloads/m4-cp4-tb2-r1-caller-draft.yml'
          observer='.github/workflows/agent-run-observer-reusable.yml'
          harness='.agents/Directional/turn-payloads/m4-cp4-tb2-r1-harness.sh'
          out="${RUNNER_TEMP}/m4-cp4-tb2-r2-static"
          mkdir -p "$out"
          python3 - "$caller" "$draft" "$observer" "$harness" "$out/receipt.json" <<'PY'
          import hashlib, json, pathlib, re, sys
          caller_path, draft_path, observer_path, harness_path, receipt_path = map(pathlib.Path, sys.argv[1:])
          caller = caller_path.read_text()
          draft = draft_path.read_text()
          observer = observer_path.read_text()
          harness = harness_path.read_text()

          if caller_path.read_bytes() != draft_path.read_bytes():
              raise SystemExit('installed caller differs from durable corrected draft')

          m = re.search(r'^permissions:\n((?:  [^\n]+\n)+)\nconcurrency:', caller, re.M)
          if not m:
              raise SystemExit('caller top-level permissions block not found')
          perms = {}
          for line in m.group(1).splitlines():
              key, value = line.strip().split(':', 1)
              perms[key.strip()] = value.strip()
          expected = {'actions':'read','contents':'write','issues':'write','pull-requests':'write'}
          if perms != expected:
              raise SystemExit(f'unexpected caller permissions: {perms}')

          b = re.search(r'^  branch-file:\n(?P<body>.*?)(?=^  [A-Za-z0-9_-]+:\n|\Z)', observer, re.M | re.S)
          if not b:
              raise SystemExit('observer branch-file job not found')
          p = re.search(r'^    permissions:\n(?P<body>(?:      [^\n]+\n)+)', b.group('body'), re.M)
          if not p or 'contents: write' not in p.group('body'):
              raise SystemExit('observer branch-file contents: write ceiling not found')
          if 'commit_run_file: false' not in caller:
              raise SystemExit('caller unexpectedly enables branch-file reporting')
          if re.search(r'^ +timeout-minutes *:', caller, re.M) or re.search(r'^ +timeout-minutes *:', harness, re.M):
              raise SystemExit('full-gate timeout-minutes field found')
          if re.search(r'(^|[\s;|&])timeout([\s]|$)', harness):
              raise SystemExit('shell timeout/watchdog token found in harness')

          def sha(path):
              return hashlib.sha256(path.read_bytes()).hexdigest()
          caller_sha = sha(caller_path)
          harness_sha = sha(harness_path)
          if caller_sha != '488326cd8cbf1ee4078796b8ecd7031f578b87272eb62df5fa2d7d42fd42d719':
              raise SystemExit(f'unexpected caller sha256: {caller_sha}')
          if harness_sha != '1dcdd6c6e638b0951af0af38ce2b0e34fafcc877843104e617caf175cf36aeba':
              raise SystemExit(f'unexpected harness sha256: {harness_sha}')

          receipt = {
              'caller_path': str(caller_path),
              'draft_path': str(draft_path),
              'caller_sha256': caller_sha,
              'harness_path': str(harness_path),
              'harness_sha256': harness_sha,
              'caller_permissions': perms,
              'observer_branch_file_contents': 'write',
              'commit_run_file': False,
              'full_gate_timeout_watchdog': False,
              'installed_equals_durable_draft': True,
              'static_permission_ceiling_valid': True,
          }
          receipt_path.write_text(json.dumps(receipt, indent=2, sort_keys=True) + '\n')
          print(json.dumps(receipt, sort_keys=True))
          PY

      - name: Upload R2 static verification receipt
        uses: actions/upload-artifact@v4
        with:
          name: m4-cp4-tb2-r2-static-verification-${{ github.run_id }}
          path: ${{ runner.temp }}/m4-cp4-tb2-r2-static
          if-no-files-found: error
          retention-days: 7
