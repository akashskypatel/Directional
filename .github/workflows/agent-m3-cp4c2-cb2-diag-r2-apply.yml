name: Agent M3 CP4c-2 CB2 DIAG R2 Apply

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m3-cp4c2-cb2-diag-r2-apply/run.txt

permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

concurrency:
  group: agent-m3-cp4c2-cb2-diag-r2-apply-${{ github.ref }}
  cancel-in-progress: false

jobs:
  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m3-cp4c2-cb2-diag-r2-apply
      commit_run_file: false
      trim_stale_comments: false
    secrets: inherit

  apply:
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1s9lmmxiCg5ApON_lLaqhC_3MCjooLhn8
      patch_sha256: d5d03900f3ec4d63b14de993b5b382a3a0461899ce2ed4860fce42bc14322903
      base_sha: 0cd1cf2f70544fcad46cac3618821d5d04d4bcad
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: 'docs(M3-CP4c-2): close CB2-DIAG-R2 and plan R4'
      retention_days: 7
    secrets: inherit
