name: M4 CP SCALE TB7 ORIENTATION Scope Correction

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m4-cp-scale-tb7-closeout-drive.txt

permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

concurrency:
  group: m4-cp-scale-tb7-orientation-scope-fix-${{ github.ref }}
  cancel-in-progress: false

jobs:
  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m4-cp-scale-tb7-orientation-scope-fix
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  apply:
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: "1AQDOHQNbYdsfll5s9JGXLXN9GWK0UCUV"
      patch_sha256: "9279485e387b5eb58e4a6378e200b5f11272739b1d9b0917f9a0972d0f530cc9"
      base_sha: "d5af1a6ef1fbe82170ccc40f6e0a8262d0dc0250"
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: "docs: restore Review-only ORIENTATION boundary after TB7 EXEC"
      retention_days: 7
    secrets: inherit
