name: Agent M4 CP SCALE TB5 Payload Drive Apply

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m4-cp-scale-tb5-payload-drive-apply/trigger.txt

permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

concurrency:
  group: agent-m4-cp-scale-tb5-payload-drive-apply
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/agent-m4-cp-scale-tb5-payload-drive-apply.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m4-cp-scale-tb5-payload-drive-apply
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  apply:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1MZhpnQxsxpIdahOgxMU4PsB8Ngiq-_hz
      patch_sha256: '40d4ad55f2005326431ba456043901bf7d06ab1bf9e6de59bcb894f0a1021bcc'
      base_sha: a9455979cc66312650771d531f08012d4de218cc
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: 'test: stage M4-CP-SCALE-TB5 artifact-only harness'
    secrets: inherit
