name: M3 CP4c0 TB-R11 CAND-02 Verification

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m3-cp4c0-tb-r11/run.txt

permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: m3-cp4c0-tb-r11-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/agent-m3-cp4c0-tb-r11.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m3-cp4c0-tb-r11
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  test-benchmark:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Initialize persistent activity log
        shell: bash
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/m3-cp4c0-tb-r11-activity.log"
          out="${RUNNER_TEMP}/m3-cp4c0-tb-r11-result"
          : > "$log"
          rm -rf "$out"; mkdir -p "$out"
          printf '%s\n' \
            "workflow=$GITHUB_WORKFLOW" "run_id=$GITHUB_RUN_ID" "event=$GITHUB_EVENT_NAME" \
            "event_sha=$GITHUB_SHA" "ref=$GITHUB_REF" "repository=$GITHUB_REPOSITORY" \
            'turnBoundary=Test+Benchmark-artifact-only/focused-CAND02-fixture' \
            'packageArtifactId=9648550565' \
            'packageSha256=1f0275e96fa75b7fc6fb447eaffb79b414c94230823da7897a4f2d91df33615c' \
            'packageSource=267272d22f7de67ce7d8e368a53cc78a37ca3e8f' \
            'configure=false' 'compile=false' 'relink=false' 'repair=false' \
            'generatedDiscovery=false' 'performanceBenchmark=false' \
            'focusedTimeoutSeconds=60' \
            "started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" | tee -a "$log"

      - name: Checkout exact control source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          token: ${{ secrets.GH_TOKEN || github.token }}

      - name: Install GMP runtime dependency
        shell: bash
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/m3-cp4c0-tb-r11-activity.log"
          exec > >(tee -a "$log") 2>&1
          dpkg -s libgmp-dev >/dev/null 2>&1 || { sudo apt-get update; sudo apt-get install -y libgmp-dev; }
          dpkg-query -W -f='libgmp-dev=${Version}\n' libgmp-dev
          ldconfig -p | grep -E 'libgmp(xx)?\.so'

      - name: Verify immutable CB-R11 package
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/m3-cp4c0-tb-r11-activity.log"
          exec > >(tee -a "$log") 2>&1
          out="${RUNNER_TEMP}/m3-cp4c0-tb-r11-result"
          pkg="${RUNNER_TEMP}/cb-r11-package"
          zip="${RUNNER_TEMP}/cb-r11-package.zip"
          rm -rf "$pkg"; mkdir -p "$pkg"
          gh api --method GET repos/${GITHUB_REPOSITORY}/actions/artifacts/9648550565/zip > "$zip"
          actual="$(sha256sum "$zip" | awk '{print $1}')"
          test "$actual" = '1f0275e96fa75b7fc6fb447eaffb79b414c94230823da7897a4f2d91df33615c'
          unzip -q "$zip" -d "$pkg"
          (cd "$pkg" && sha256sum -c SHA256SUMS)
          test "$(cat "$pkg/metadata/source-commit.txt")" = '267272d22f7de67ce7d8e368a53cc78a37ca3e8f'
          test "$(cat "$pkg/metadata/build-exit-code.txt")" = '0'
          test "$(cat "$pkg/metadata/preflight-exit-code.txt")" = '0'
          grep -q '^runtimeExecution=false$' "$pkg/metadata/command-boundary.txt"
          grep -q '^turnBoundary=Code+Build-only$' "$pkg/metadata/command-boundary.txt"
          grep -q '^exactArithmeticBackend=GMP$' "$pkg/metadata/command-boundary.txt"
          grep -qi 'gmpxx' "$pkg/metadata/gmp-evidence.txt"
          grep -qi 'libgmp' "$pkg/metadata/gmp-evidence.txt"
          test -x "$pkg/bin/directional_surface_cell_producer_tests"
          test ! -s "$pkg/metadata/source-status-preconfigure.txt"
          test ! -s "$pkg/metadata/source-status-before-configure.txt"
          test ! -s "$pkg/metadata/source-status-after-configure.txt"
          test ! -s "$pkg/metadata/source-status-after-build.txt"
          test ! -s "$pkg/metadata/source-status-final.txt"
          find "$pkg" -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > "$out/package-preflight.sha256"
          printf '%s\n' "package_zip_sha256=$actual" 'archiveExtraction=unzip/no-repair' 'packagePreflight=PASS' | tee -a "$log"

      - name: Execute focused CAND-02 regression
        shell: bash
        run: |
          set -uo pipefail
          log="${RUNNER_TEMP}/m3-cp4c0-tb-r11-activity.log"
          exec > >(tee -a "$log") 2>&1
          out="${RUNNER_TEMP}/m3-cp4c0-tb-r11-result"
          pkg="${RUNNER_TEMP}/cb-r11-package"
          json="$out/focused-test.json"
          txt="$out/focused-test.log"
          identity='ResolvedBranchCorrection.ExactContinuationMagnitudePolicyFailsClosedWithoutTolerance'
          start_ns="$(date +%s%N)"
          set +e
          timeout 60s "$pkg/bin/directional_surface_cell_producer_tests" \
            --gtest_color=no \
            --gtest_filter="$identity" \
            --gtest_output="json:$json" 2>&1 | tee "$txt"
          rc=${PIPESTATUS[0]}
          set -e
          end_ns="$(date +%s%N)"
          elapsed_ms=$(( (end_ns - start_ns) / 1000000 ))
          selected=0; failures=0; errors=0
          if test -f "$json"; then
            selected="$(jq -r '.tests // 0' "$json")"
            failures="$(jq -r '.failures // 0' "$json")"
            errors="$(jq -r '.errors // 0' "$json")"
          fi
          if test "$rc" -eq 124; then
            status=ORCHESTRATION_RED_TIMEOUT
          elif test "$selected" -ne 1; then
            status=ORCHESTRATION_RED_SELECTION
          elif test "$rc" -eq 0 && test "$failures" -eq 0 && test "$errors" -eq 0; then
            status=PASS
          else
            status=RED
          fi
          printf '%s\n' \
            'turn=M3-CP4c-0-TB-R11' \
            "identity=$identity" \
            'target=directional_surface_cell_producer_tests' \
            "status=$status" "exit=$rc" "selected=$selected" \
            "failures=$failures" "errors=$errors" "elapsed_ms=$elapsed_ms" \
            'focusedTimeoutSeconds=60' 'configure=false' 'compile=false' 'relink=false' \
            'repair=false' 'generatedDiscovery=false' 'performanceBenchmark=false' \
            > "$out/result.env"
          cat "$out/result.env"
          test "$status" = PASS

      - name: Verify immutable postflight
        if: always()
        shell: bash
        run: |
          set +e
          log="${RUNNER_TEMP}/m3-cp4c0-tb-r11-activity.log"
          out="${RUNNER_TEMP}/m3-cp4c0-tb-r11-result"
          pkg="${RUNNER_TEMP}/cb-r11-package"
          if test -d "$pkg"; then
            find "$pkg" -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > "$out/package-postflight.sha256"
            if test -f "$out/package-preflight.sha256" && cmp -s "$out/package-preflight.sha256" "$out/package-postflight.sha256"; then
              echo 'postflight=PASS' | tee -a "$log" "$out/postflight.env"
            else
              echo 'postflight=RED' | tee -a "$log" "$out/postflight.env"
            fi
          else
            echo 'postflight=ORCHESTRATION_RED_PACKAGE_MISSING' | tee -a "$log" "$out/postflight.env"
          fi
          printf '%s\n' "final_job_status=${{ job.status }}" "finished_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" | tee -a "$log"

      - name: Upload TB-R11 result evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-cp4c0-tb-r11-result-${{ github.run_id }}
          path: ${{ runner.temp }}/m3-cp4c0-tb-r11-result
          if-no-files-found: error
          retention-days: 7

      - name: Upload TB-R11 diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-cp4c0-tb-r11-log-${{ github.run_id }}
          path: ${{ runner.temp }}/m3-cp4c0-tb-r11-activity.log
          if-no-files-found: error
          retention-days: 7
