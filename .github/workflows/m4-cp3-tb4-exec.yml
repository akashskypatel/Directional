name: M4 CP3 TB4 Artifact-Only EXEC

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m4-cp3-tb4-exec/run.txt

permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: m4-cp3-tb4-exec-${{ github.ref }}
  cancel-in-progress: false

jobs:
  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m4-cp3-tb4-exec
      commit_run_file: false
    secrets: inherit

  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/m4-cp3-tb4-exec.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  execute:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Initialize persistent activity log
        shell: bash
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/m4-cp3-tb4-exec-workflow.log"
          : > "$log"
          printf '%s\n' \
            "workflow=${GITHUB_WORKFLOW}" \
            "run_id=${GITHUB_RUN_ID}" \
            "event=${GITHUB_EVENT_NAME}" \
            "event_sha=${GITHUB_SHA}" \
            "ref=${GITHUB_REF}" \
            "repository=${GITHUB_REPOSITORY}" \
            'turn=M4-CP3-TB4-EXEC' \
            'turnBoundary=Test+Benchmark-artifact-only' \
            'packageArtifact=10292005428' \
            'expectedProcesses=821' \
            "started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" | tee -a "$log"

      - name: Checkout exact orchestration source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          submodules: false
          lfs: false

      - name: Verify immutable execution payload
        shell: bash
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/m4-cp3-tb4-exec-workflow.log"
          exec > >(tee -a "$log") 2>&1
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -f .agents/Directional/turn-payloads/m4-cp3-tb4-exec-harness.sh
          bash -n .agents/Directional/turn-payloads/m4-cp3-tb4-exec-harness.sh
          sha256sum .agents/Directional/turn-payloads/m4-cp3-tb4-exec-harness.sh
          git status --short

      - name: Execute frozen TB4 gate
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          TURN_ID: M4-CP3-TB4-EXEC
          ARTIFACT_ID: '10292005428'
          EXPECTED_ARTIFACT_NAME: m4-cp3-cb6-result-34673625938
          EXPECTED_PROVIDER_DIGEST: sha256:7723188540182f9515b95efd83c13dd1dbc6f0813532a98cd8df0778a12a882f
          EXPECTED_ZIP_SHA256: 7723188540182f9515b95efd83c13dd1dbc6f0813532a98cd8df0778a12a882f
        shell: bash
        run: |
          set +e
          workflow_log="${RUNNER_TEMP}/m4-cp3-tb4-exec-workflow.log"
          bash .agents/Directional/turn-payloads/m4-cp3-tb4-exec-harness.sh
          status=$?
          set -e
          echo "gate_exit=${status}" | tee -a "$workflow_log"
          echo "status=${status}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Record final workflow status
        if: always()
        shell: bash
        run: |
          set +e
          log="${RUNNER_TEMP}/m4-cp3-tb4-exec-workflow.log"
          {
            echo "gate_exit=${{ steps.gate.outputs.status }}"
            echo "job_status=${{ job.status }}"
            echo "final_sha=$(git rev-parse HEAD 2>/dev/null || echo unavailable)"
            git status --short 2>&1 || true
            echo "finished_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } | tee -a "$log"

      - name: Upload TB4 result artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m4-cp3-tb4-exec-result-${{ github.run_id }}
          path: ${{ runner.temp }}/M4-CP3-TB4-EXEC-result
          if-no-files-found: error
          retention-days: 7

      - name: Upload TB4 diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m4-cp3-tb4-exec-log-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/m4-cp3-tb4-exec-workflow.log
            ${{ runner.temp }}/M4-CP3-TB4-EXEC-harness.log
          if-no-files-found: error
          retention-days: 7

      - name: Propagate frozen gate exit
        if: always()
        env:
          GATE_EXIT: ${{ steps.gate.outputs.status }}
        shell: bash
        run: |
          set -euo pipefail
          case "${GATE_EXIT:-90}" in
            0) exit 0 ;;
            1) echo 'TB4 semantic RED; see immutable result artifact.' >&2; exit 1 ;;
            *) echo "TB4 orchestration RED; gate_exit=${GATE_EXIT:-missing}" >&2; exit "${GATE_EXIT:-90}" ;;
          esac
