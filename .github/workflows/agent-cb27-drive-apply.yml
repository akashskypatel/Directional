name: Agent CB27 Drive Apply

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/cb27-drive-apply/**

permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

concurrency:
  group: cb27-drive-apply-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/agent-cb27-drive-apply.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: cb27-drive-apply
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  apply:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1WgLUllNGtG3WwMUMA4c3tR4FF6pzAC7I
      patch_sha256: '0847019b429edcb47e16ae86a7241bbaa7617d719de14f21fa8bc64fe177127d'
      base_sha: 2c27cfe16d2888a8b600b434c7559b7207386b45
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: 'docs: close out M3-CP4c-3-CB27 and freeze TB24 execution plan'
      retention_days: 14
    secrets: inherit
