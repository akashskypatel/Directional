name: Agent M3 CP4c3 TB25 EXEC

on:
  push:
    branches: [agent/surface_cell_quad/p5-recover-bridge-healing]
    paths: [.agents/connector-triggers/tb25-exec/trigger-20260904.txt]

permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: agent-m3-cp4c3-tb25-exec-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/agent-m3-cp4c3-tb25-exec.yml
      source_ref: ${{ github.sha }}
      retention_days: 14
    secrets: inherit
  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m3-cp4c3-tb25-exec
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit
  execute:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    env:
      ARTIFACT_ID: "9950303110"
      EXPECTED_ZIP_SHA256: "84c9cd0bdf5d8bef2288e1ca57d52bcec8d1503f368d82101ae10cfa14c49189"
      EXPECTED_PROVIDER_DIGEST: "sha256:84c9cd0bdf5d8bef2288e1ca57d52bcec8d1503f368d82101ae10cfa14c49189"
      EXPECTED_SOURCE_SHA: "3d7f7f9a3afad3ed37fc615a206801cf6310f4ac"
      EXPECTED_SELECTOR_365_SHA256: "6b5b6555d39c250c24cbf3faeafdeca93b4b11379118a29583253e6cfc14b8a1"
      EXPECTED_SELECTOR_401_SHA256: "0d0857a97158dfd0763b536718c24ba257417866aad3d8e51d6f0093be5a5869"
      EXPECTED_SELECTOR_403_SHA256: "60ff6daa0e1dc71fe9c856ee9559d665628b756ed634f70ffce5881ec2514007"
      EXPECTED_DIRECTIONAL_BENCHMARKS_SHA256: "c419eeebaa5d35632d2492d2ac00a9256b57dfe058299baf9ebd7cbfe2d0aae8"
      EXPECTED_COMPILED_API_SHA256: "7684471d50069bfb366921eced5d50c13c600bbf445ee847d710d406b7e2b233"
      EXPECTED_AUTHORITY_KERNEL_SHA256: "5efacc3ad52085a8ab76bad451bfc70c337e44a73a8f81a165f06ab1cd3041b3"
      EXPECTED_COMPLETION_SHA256: "1701820d85d91fe674cb3dd3496669f0a49ca43e6068a170fb0277227aba094a"
      EXPECTED_PRODUCER_SHA256: "4a940c0806374588314232dd0156cd38cab3b814d00a346b1f6f43a48bc725d1"
      EXPECTED_VALIDATION_SHA256: "303af6ab231bf88b6b618df03315c9999a27595b8b55871922935f5098a4ca5f"
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Initialize TB25 diagnostic log
        shell: bash
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/m3-cp4c3-tb25-exec.log"; : > "$log"
          printf '%s\n' "workflow=${GITHUB_WORKFLOW}" "run_id=${GITHUB_RUN_ID}" "event=${GITHUB_EVENT_NAME}" "event_sha=${GITHUB_SHA}" "repository=${GITHUB_REPOSITORY}" "started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" | tee -a "$log"
      - name: Checkout orchestration history only
        uses: actions/checkout@v4
        with: {fetch-depth: 0, submodules: false, lfs: false}
      - name: Materialize proven TB25 artifact-only harness
        shell: bash
        run: |
          set -euo pipefail
          old="${RUNNER_TEMP}/tb24-formal.yml"; new="${RUNNER_TEMP}/m3-cp4c3-tb25-harness.sh"; prov="${RUNNER_TEMP}/tb25-harness-provenance.txt"
          git show 0624b916dfa16aa47751bd4f40b75bcf5bd76b5a:.github/workflows/agent-m3-cp4c3-tb24-exec.yml > "$old"
          test "$(git hash-object "$old")" = 44b1ad0e7934be2662c1ea326f70baa3537a5977
          python3 - "$old" "$new" <<'PY'
          import pathlib,sys
          s=pathlib.Path(sys.argv[1]).read_text(); a=s.index('      - name: Execute immutable TB24 gate\n'); a=s.index('        run: |\n',a)+len('        run: |\n'); b=s.index('\n      - name: Record final TB24 status',a)
          L=[]
          for x in s[a:b].splitlines():
              if not x:L.append('')
              elif x.startswith('          '):L.append(x[10:])
              else:raise SystemExit(f'bad harness indent:{x!r}')
          t='\n'.join(L)+'\n'; t=t.replace('397','__L__').replace('401','__H__').replace('__L__','401').replace('__H__','403'); t=t.replace('m3-cp4c3-tb24','m3-cp4c3-tb25').replace('TB24','TB25').replace('ordinal>=398','ordinal>=402').replace('new-cb27-witness','new-cb28-witness')
          n='            "selector401_exact_prefix_of_403=true" > "${RESULT}/selector-authority.txt"\n'
          e='''          selector365="$SOURCE/.agents/Directional/Architecture_M3_CP4c2_Required_Green_Selector_365.txt"\n          [[ -f "$selector365" ]] || fail_orchestration 'accepted selector365 missing'\n          [[ "$(sha256sum "$selector365" | awk '{print $1}')" == "$EXPECTED_SELECTOR_365_SHA256" ]] || fail_orchestration 'selector365 hash mismatch'\n          [[ "$(wc -l < "$selector365" | tr -d ' ')" == 365 ]] || fail_orchestration 'selector365 count mismatch'\n          head -n 365 "$selector403" > "${ROOT}/selector-365-prefix.txt"\n          cmp -s "$selector365" "${ROOT}/selector-365-prefix.txt" || fail_orchestration 'selector365 prefix mismatch'\n          printf '%s\\n' "selector365_sha256=$EXPECTED_SELECTOR_365_SHA256" 'selector365_count=365' 'selector365_exact_prefix_of_403=true' >> "${RESULT}/selector-authority.txt"\n'''
          if n not in t:raise SystemExit('selector injection point missing')
          pathlib.Path(sys.argv[2]).write_text('#!/usr/bin/env bash\n'+t.replace(n,n+e,1))
          PY
          chmod 700 "$new"
          printf '%s\n' 'historical_formal_run=33891467611' 'historical_workflow_commit=0624b916dfa16aa47751bd4f40b75bcf5bd76b5a' 'historical_workflow_blob=44b1ad0e7934be2662c1ea326f70baa3537a5977' "historical_yaml_sha256=$(sha256sum "$old"|awk '{print $1}')" "transformed_harness_sha256=$(sha256sum "$new"|awk '{print $1}')" 'transform=397->401,401->403,TB24->TB25,398-threshold->402,accepted365-prefix-check' > "$prov"
          grep -Fq 'Architecture_M3_CP4c3_Required_Green_Selector_403.txt' "$new"; grep -Fq 'selector365_exact_prefix_of_403=true' "$new"; ! grep -Fq '9935929108' "$new"; ! grep -Fq '9c72fea8b666534b9e52fa42bbe8cbf8ae68ffe5' "$new"
      - name: Execute immutable TB25 gate
        shell: bash
        run: bash "${RUNNER_TEMP}/m3-cp4c3-tb25-harness.sh"
      - name: Record TB25 ledger and focus summary
        if: always()
        shell: bash
        run: |
          set +e; r="${RUNNER_TEMP}/m3-cp4c3-tb25-result"; mkdir -p "$r"; cp "${RUNNER_TEMP}/tb25-harness-provenance.txt" "$r/harness-provenance.txt" 2>/dev/null || true
          python3 - "$r" <<'PY'
          import csv,hashlib,pathlib,sys
          r=pathlib.Path(sys.argv[1]); p=r/'ledger.tsv'
          if not p.is_file():(r/'ledger-summary.txt').write_text('ledger_available=false\n');raise SystemExit
          a=list(csv.DictReader(p.open(),delimiter='\t')); red=[int(x['ordinal']) for x in a if x['result']=='RED']; ar=[x for x in red if x<=365]; im=r/'identity-map.tsv'
          (r/'ledger-summary.txt').write_text(f"total={len(a)}\npass={sum(x['result']=='PASS' for x in a)}\nred={len(red)}\nred_ordinals={red}\naccepted_prefix_pass={365-len(ar)}/365\naccepted_red_ordinals={ar}\naccepted_green_loss={str(bool(ar)).lower()}\nledger_sha256={hashlib.sha256(p.read_bytes()).hexdigest()}\nidentity_map_sha256={hashlib.sha256(im.read_bytes()).hexdigest() if im.is_file() else 'unavailable'}\n")
          focus=[366,367,368,369,370,371,372,374,384,385,389,390,391,392,393,397,398,399,400,401,402,403]; d={int(x['ordinal']):x for x in a}
          with (r/'focus-ledger.tsv').open('w') as f:
              f.write('\t'.join(a[0].keys())+'\n');[f.write('\t'.join(d[o].values())+'\n') for o in focus if o in d]
          with (r/'focus-raw.log').open('w') as f:
              for o in focus:
                  q=r/'raw'/f'ordinal-{o:03d}.log'; f.write(f'===== ORDINAL {o} =====\n'+(q.read_text(errors='replace') if q.is_file() else '[unavailable]\n'))
          PY
      - name: Record final TB25 status
        if: always()
        shell: bash
        run: |
          set +e; l="${RUNNER_TEMP}/m3-cp4c3-tb25-exec.log"; r="${RUNNER_TEMP}/m3-cp4c3-tb25-result"; mkdir -p "$r"
          printf '%s\n' "final_job_status=${{ job.status }}" "event_sha=${GITHUB_SHA}" 'runtime_package_artifact_id=9950303110' 'semantic_source=3d7f7f9a3afad3ed37fc615a206801cf6310f4ac' "finished_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" | tee -a "$l" | tee "$r/workflow-status.txt"
      - name: Upload TB25 result
        if: always()
        uses: actions/upload-artifact@v4
        with: {name: "m3-cp4c3-tb25-result-${{ github.run_id }}", path: "${{ runner.temp }}/m3-cp4c3-tb25-result", if-no-files-found: error, retention-days: 14}
      - name: Upload TB25 diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with: {name: "m3-cp4c3-tb25-log-${{ github.run_id }}", path: "${{ runner.temp }}/m3-cp4c3-tb25-exec.log", if-no-files-found: error, retention-days: 14}
