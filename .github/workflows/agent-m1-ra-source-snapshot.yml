name: Agent M1 R-A Source Snapshot

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m1-ra-source-snapshot-20260811.txt

permissions:
  contents: read

concurrency:
  group: agent-m1-ra-source-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Initialize detailed activity log
        shell: bash
        run: |
          set -euo pipefail
          LOG="$RUNNER_TEMP/m1-ra-source-snapshot.log"
          : > "$LOG"
          {
            echo "workflow=agent-m1-ra-source-snapshot"
            echo "event=${GITHUB_EVENT_NAME}"
            echo "ref=${GITHUB_REF}"
            echo "sha=${GITHUB_SHA}"
            echo "runner_os=${RUNNER_OS}"
            date -u +"utc=%Y-%m-%dT%H:%M:%SZ"
          } | tee -a "$LOG"

      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          submodules: false

      - name: Verify and package source
        shell: bash
        run: |
          set -euo pipefail
          LOG="$RUNNER_TEMP/m1-ra-source-snapshot.log"
          trap 'rc=$?; { echo "exit_code=$rc"; git status --short || true; } | tee -a "$LOG"; exit $rc' EXIT
          {
            echo "git_head=$(git rev-parse HEAD)"
            echo "git_status_begin"
            git status --short
            echo "git_status_end"
            git --version
            python3 --version
            tar --version | head -n 1
          } 2>&1 | tee -a "$LOG"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          tar --exclude=.git -czf "$RUNNER_TEMP/directional-m1-ra-source.tgz" .
          sha256sum "$RUNNER_TEMP/directional-m1-ra-source.tgz" | tee "$RUNNER_TEMP/source.sha256" | tee -a "$LOG"
          printf '%s\n' "$GITHUB_SHA" > "$RUNNER_TEMP/source-commit.txt"
          echo "runtimeExecution=false" | tee "$RUNNER_TEMP/command-boundary.txt" | tee -a "$LOG"

      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: m1-ra-source-snapshot-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/directional-m1-ra-source.tgz
            ${{ runner.temp }}/source.sha256
            ${{ runner.temp }}/source-commit.txt
            ${{ runner.temp }}/command-boundary.txt
          if-no-files-found: error
          retention-days: 7

      - name: Upload detailed log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m1-ra-source-snapshot-log-${{ github.run_id }}
          path: ${{ runner.temp }}/m1-ra-source-snapshot.log
          if-no-files-found: error
          retention-days: 7
