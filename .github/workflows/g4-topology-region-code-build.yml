name: g4-topology-region-code-build

on:
  push:
    paths:
      - '.github/agent-triggers/g4-topology-region-code-build'

permissions:
  contents: write
  actions: read

concurrency:
  group: g4-topology-region-code-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  code-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      LOG_DIR: /tmp/g4-topology-region-logs
    steps:
      - name: Initialize unconditional activity log
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$LOG_DIR"
          {
            echo "turn=G4 source-topology-region / isolation-sheet decoupling Code+Build"
            echo "event_sha=$GITHUB_SHA"
            echo "event_ref=$GITHUB_REF"
            echo "entering_runtime_artifact=9021175280"
            echo "runtimeExecution=false"
            echo "reviewPolicy=never"
            echo "transport=six verified raw unified-patch parts"
            echo "allowed=apply verified topology-region patch, configure, compile/link seven approved targets, package/checksum"
            echo "prohibited=tests, benchmarks, generated Directional binaries, ctest/discovery, CLI, GUI, help/list/custom-input execution"
          } | tee "$LOG_DIR/activity.log"

      - name: Checkout exact working branch
        uses: actions/checkout@v4
        with:
          ref: agent/surface_cell_quad/p5-recover-bridge-healing
          fetch-depth: 50
          submodules: false

      - name: Verify and apply topology-region patch
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee -a "$LOG_DIR/activity.log") 2>&1
          echo "checkout_sha=$(git rev-parse HEAD)"
          git status --short

          raw_parts=(
            .agents/Directional/turn-payloads/g4-topology-region.raw.part01.patch
            .agents/Directional/turn-payloads/g4-topology-region.raw.part02.patch
            .agents/Directional/turn-payloads/g4-topology-region.raw.part03.patch
            .agents/Directional/turn-payloads/g4-topology-region.raw.part04.patch
            .agents/Directional/turn-payloads/g4-topology-region.raw.part05.patch
            .agents/Directional/turn-payloads/g4-topology-region.raw.part06.patch
          )
          expected_blobs=(
            7b448ca4c1a72057744a6ab1f484103a5d4ce4b8
            edc1a76d23e885d22dce0578619b768377def86b
            501245894bd1be62aaf0c428b8c51e860e761e14
            b6bc2a144756818c527e79de5c8e7f6d07990643
            ace1166cdbfc786c33252aebb05f5ca8b2d48d83
            8b2b2fb714416c0e78045ae37231534cd766db42
          )
          expected_sha256=(
            bdcee5815e16b958827e658c065d3d446526021d09061dede2ac31fa721c9e77
            2c68ba213a405477a31fc7b10937ccd98bc1d7ad8cd551dceb8ce65a76d57ed5
            e13ae0f512b57681c66ff0367cdf1c14601b9945181ba7b1625db16ad74079d1
            2bd77f27c454c96b2c230a879c5776145ba3d35f9de0612928acf017a8a765c8
            b11c36cff10653877e82fa02076890d4cd1a8f011c885741a14be1f42efbf433
            5983ee813fab28e12dc2a3c7da3d229e0a1be0e0ec069bea953497689963f8b5
          )
          for i in "${!raw_parts[@]}"; do
            part="${raw_parts[$i]}"
            test -f "$part"
            actual_blob=$(git hash-object "$part")
            actual_sha=$(sha256sum "$part" | awk '{print $1}')
            echo "part[$i]=$part blob=$actual_blob sha256=$actual_sha"
            test "$actual_blob" = "${expected_blobs[$i]}"
            test "$actual_sha" = "${expected_sha256[$i]}"
          done

          check_blob() {
            local path="$1" expected="$2"
            local actual
            actual=$(git hash-object "$path")
            echo "input_blob $path=$actual"
            test "$actual" = "$expected"
          }
          check_blob include/directional/geometry/SurfaceCellTracing.h 0c1daa94300121df40c923716314ae6b242c7e8c
          check_blob src/geometry/SurfaceCellTracing.cpp c834e8c81db04c39af9ecf1f45044ea107de3291
          check_blob include/directional/diagnostics/RemeshDiagnostics.h 9597c49693a1146e5dac2ac90270348b55a0c91d
          check_blob src/pipeline/RemeshPipeline.cpp 945bbc58bc56cb9838532889c616520cb234aaa3
          check_blob src/bench/DirectionalBenchmark.cpp fd74cd39fff73bee7b4db578eb08382bd6ef50cf
          check_blob tests/SurfaceCellsPhase10Tests.cpp 981b0f6e6fc935c1bfe3d1f6871736035d6bdfcb

          cat "${raw_parts[@]}" > /tmp/g4-topology-region.patch
          PATCH_SHA256=$(sha256sum /tmp/g4-topology-region.patch | awk '{print $1}')
          echo "patch_sha256=$PATCH_SHA256"
          test "$PATCH_SHA256" = "1c3488b672e25c698451df46081fa951d8c4d883136ff30f88cece0dcadd194b"
          if grep -q '^+++ b/.github/workflows/' /tmp/g4-topology-region.patch; then
            echo "patch attempts to modify workflow files" >&2
            exit 1
          fi

          git apply --check /tmp/g4-topology-region.patch
          git apply /tmp/g4-topology-region.patch
          git diff --check
          mapfile -t changed < <(git diff --name-only | sort)
          printf 'changed=%s\n' "${changed[*]}"
          test "${#changed[@]}" -eq 6
          expected_changed=(
            include/directional/diagnostics/RemeshDiagnostics.h
            include/directional/geometry/SurfaceCellTracing.h
            src/bench/DirectionalBenchmark.cpp
            src/geometry/SurfaceCellTracing.cpp
            src/pipeline/RemeshPipeline.cpp
            tests/SurfaceCellsPhase10Tests.cpp
          )
          for i in "${!expected_changed[@]}"; do test "${changed[$i]}" = "${expected_changed[$i]}"; done

          check_output_blob() {
            local path="$1" expected="$2"
            local actual
            actual=$(git hash-object "$path")
            echo "output_blob $path=$actual"
            test "$actual" = "$expected"
          }
          check_output_blob include/directional/geometry/SurfaceCellTracing.h e966a9ab9dc33f23de9cecb3fd9b61ddd75fde7f
          check_output_blob src/geometry/SurfaceCellTracing.cpp b3f0ea3b82cf64f3a2ba312f9622172c64bc3e83
          check_output_blob include/directional/diagnostics/RemeshDiagnostics.h ba33d8396bd26f8190f8d552aafd9c950e9a3842
          check_output_blob src/pipeline/RemeshPipeline.cpp 97a20e41338b616d6bb5cafaa5f3d3851c52c583
          check_output_blob src/bench/DirectionalBenchmark.cpp ba3eb47bfe9f3f78ce1dcbab32bfb3a773658cfc
          check_output_blob tests/SurfaceCellsPhase10Tests.cpp 441ba7fe2066355ce2a2239380f45029ea139346

          git config user.name 'directional-agent'
          git config user.email 'directional-agent@users.noreply.github.com'
          git add \
            include/directional/geometry/SurfaceCellTracing.h \
            src/geometry/SurfaceCellTracing.cpp \
            include/directional/diagnostics/RemeshDiagnostics.h \
            src/pipeline/RemeshPipeline.cpp \
            src/bench/DirectionalBenchmark.cpp \
            tests/SurfaceCellsPhase10Tests.cpp
          git commit -m 'feat(surface-cells): decouple topology regions from isolation sheets'
          IMPLEMENTATION_COMMIT=$(git rev-parse HEAD)
          echo "IMPLEMENTATION_COMMIT=$IMPLEMENTATION_COMMIT" >> "$GITHUB_ENV"
          echo "PATCH_SHA256=$PATCH_SHA256" >> "$GITHUB_ENV"
          echo "implementation_commit=$IMPLEMENTATION_COMMIT"

          git rm "${raw_parts[@]}"
          git commit -m 'chore(agent): remove G4 topology-region payloads'
          CLEANUP_COMMIT=$(git rev-parse HEAD)
          echo "CLEANUP_COMMIT=$CLEANUP_COMMIT" >> "$GITHUB_ENV"
          echo "cleanup_commit=$CLEANUP_COMMIT"
          git push origin HEAD:agent/surface_cell_quad/p5-recover-bridge-healing
          git status --short

      - name: Install compile prerequisites
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee -a "$LOG_DIR/activity.log") 2>&1
          sudo apt-get update
          sudo apt-get install -y ninja-build libgmp-dev xz-utils

      - name: Fetch shallow submodules
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee -a "$LOG_DIR/activity.log") 2>&1
          git submodule update --init --depth 1
          git submodule status | tee "$LOG_DIR/submodules.txt"

      - name: Configure Release static compile-only build
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee -a "$LOG_DIR/activity.log") 2>&1
          {
            echo "implementation_commit=$IMPLEMENTATION_COMMIT"
            echo "cleanup_commit=$CLEANUP_COMMIT"
            echo "compile_head=$(git rev-parse HEAD)"
            cmake --version
            c++ --version
            ninja --version
          } | tee "$LOG_DIR/toolchain.txt"
          cmake -S . -B agent-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DCMAKE_GTEST_DISCOVER_TESTS_DISCOVERY_MODE=PRE_TEST \
            -DBUILD_SHARED_LIBS=OFF \
            -DBUILD_TUTORIALS=OFF \
            -DBUILD_PYTHON=OFF \
            -DDIRECTIONAL_BUILD_CLI=OFF \
            -DDIRECTIONAL_BUILD_GUI=OFF \
            -DDIRECTIONAL_BUILD_BENCHMARKS=ON \
            -DDIRECTIONAL_BUILD_TESTS=ON \
            -DDIRECTIONAL_BUILD_HISTORICAL_TESTS=OFF \
            -DDIRECTIONAL_BUILD_LEGACY_INTEGRATION_TESTS=OFF \
            -DDIRECTIONAL_BUILD_OPTIONAL_GUIDANCE_TESTS=OFF \
            -DDIRECTIONAL_ENABLE_GMP=ON \
            -DDIRECTIONAL_ENABLE_PARDISO=OFF \
            -DDIRECTIONAL_ENABLE_CUDSS=OFF \
            -DDIRECTIONAL_ENABLE_SUITESPARSE=OFF \
            2>&1 | tee "$LOG_DIR/configure.log"

      - name: Compile seven approved targets only
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee -a "$LOG_DIR/activity.log") 2>&1
          cmake --build agent-build --parallel 2 --target \
            directional_core \
            directional_pipeline \
            directional_compiled_api_tests \
            directional_surface_cell_producer_tests \
            directional_surface_cell_completion_tests \
            directional_surface_cell_validation_tests \
            directional_benchmarks \
            2>&1 | tee "$LOG_DIR/build.log"
          echo "compile_only_gate=passed" | tee -a "$LOG_DIR/activity.log"
          echo "final_source_status_begin" | tee -a "$LOG_DIR/activity.log"
          git status --short | tee -a "$LOG_DIR/activity.log"
          echo "final_source_status_end" | tee -a "$LOG_DIR/activity.log"

      - name: Package immutable compile artifact
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee -a "$LOG_DIR/activity.log") 2>&1
          root="$GITHUB_WORKSPACE/g4-topology-region-artifact"
          rm -rf "$root"
          mkdir -p "$root"/{bin,lib,test-data/benchmarks,logs,metadata,source}
          cp agent-build/directional_benchmarks "$root/bin/"
          cp agent-build/directional_compiled_api_tests "$root/bin/"
          cp agent-build/directional_surface_cell_producer_tests "$root/bin/"
          cp agent-build/directional_surface_cell_completion_tests "$root/bin/"
          cp agent-build/directional_surface_cell_validation_tests "$root/bin/"
          cp agent-build/libdirectional_core.a "$root/lib/"
          cp agent-build/libdirectional_pipeline.a "$root/lib/"
          cp -a benchmarks/fixtures "$root/test-data/benchmarks/"
          cp "$LOG_DIR/activity.log" "$LOG_DIR/configure.log" \
             "$LOG_DIR/build.log" "$LOG_DIR/toolchain.txt" \
             "$LOG_DIR/submodules.txt" "$root/logs/"
          cp agent-build/compile_commands.json "$root/source/"

          git show "$IMPLEMENTATION_COMMIT" --format=fuller --stat --patch -- \
            include/directional/geometry/SurfaceCellTracing.h \
            src/geometry/SurfaceCellTracing.cpp \
            include/directional/diagnostics/RemeshDiagnostics.h \
            src/pipeline/RemeshPipeline.cpp \
            src/bench/DirectionalBenchmark.cpp \
            tests/SurfaceCellsPhase10Tests.cpp > "$root/source/g4-topology-region.patch"
          tar --exclude=.git --exclude=external --exclude=agent-build \
              --exclude=g4-topology-region-artifact \
              -cJf "$root/source/directional-g4-topology-region-source-no-deps.tar.xz" .

          cat > "$root/metadata/source-authority.json" <<EOF
          {
            "eventCommit": "$GITHUB_SHA",
            "implementationCommit": "$IMPLEMENTATION_COMMIT",
            "cleanupCommit": "$CLEANUP_COMMIT",
            "enteringRuntimeArtifact": 9021175280,
            "rawPatchPartGitBlobs": [
              "7b448ca4c1a72057744a6ab1f484103a5d4ce4b8",
              "edc1a76d23e885d22dce0578619b768377def86b",
              "501245894bd1be62aaf0c428b8c51e860e761e14",
              "b6bc2a144756818c527e79de5c8e7f6d07990643",
              "ace1166cdbfc786c33252aebb05f5ca8b2d48d83",
              "8b2b2fb714416c0e78045ae37231534cd766db42"
            ],
            "decodedPatchSha256": "$PATCH_SHA256",
            "runtimeExecution": false,
            "reviewPolicy": "never"
          }
          EOF
          cat > "$root/metadata/build-authority.json" <<'EOF'
          {"configuration":"Release","generator":"Ninja","buildSharedLibs":false,"gtestDiscoveryMode":"PRE_TEST","approvedTargets":7,"runtimeExecution":false}
          EOF
          cat > "$root/metadata/command-boundary.txt" <<'EOF'
          G4 Code + Build only.
          Executed: verified source/test/diagnostic patch application, configure, compile/link seven approved targets, package/checksum.
          Not executed: generated Directional binaries, tests, benchmarks, ctest/discovery, CLI, GUI, help/list/custom-input commands.
          EOF
          git ls-tree -r "$IMPLEMENTATION_COMMIT" -- \
            include/directional/geometry/SurfaceCellTracing.h \
            src/geometry/SurfaceCellTracing.cpp \
            include/directional/diagnostics/RemeshDiagnostics.h \
            src/pipeline/RemeshPipeline.cpp \
            src/bench/DirectionalBenchmark.cpp \
            tests/SurfaceCellsPhase10Tests.cpp > "$root/metadata/final-blobs.txt"
          git submodule status > "$root/metadata/submodules.txt"
          find benchmarks/fixtures -type f | sort > "$root/metadata/fixture-files.txt"
          (cd "$root" && find . -type f ! -name SHA256SUMS -print0 | sort -z | \
            xargs -0 sha256sum > SHA256SUMS)
          sha256sum "$root/SHA256SUMS" | tee "$LOG_DIR/artifact-checksum.txt"

      - name: Upload immutable compile artifact
        uses: actions/upload-artifact@v4
        with:
          name: g4-topology-region-code-build
          path: g4-topology-region-artifact
          if-no-files-found: error
          retention-days: 14

      - name: Upload detailed activity log always
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g4-topology-region-code-build-logs
          path: /tmp/g4-topology-region-logs
          if-no-files-found: error
          retention-days: 14
