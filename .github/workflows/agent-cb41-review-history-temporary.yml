name: Agent CB41 Review Authentic History (temporary)

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/cb41-review-boundary/**

permissions:
  contents: write
  actions: read

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/agent-cb41-review-history-temporary.yml
      source_ref: ${{ github.sha }}

  boundary:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Initialize persistent diagnostic log
        shell: bash
        run: |
          set -euo pipefail
          : > "${RUNNER_TEMP}/cb41-review-history.log"
          printf 'event_sha=%s\nref=%s\nrun_id=%s\n' "${GITHUB_SHA}" "${GITHUB_REF}" "${GITHUB_RUN_ID}" | tee -a "${RUNNER_TEMP}/cb41-review-history.log"

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify authentic history and review-only boundary
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee -a "${RUNNER_TEMP}/cb41-review-history.log") 2>&1
          trap 'rc=$?; echo "history_check_exit=${rc}"; git status --short || true' EXIT
          printf 'checked_out_sha=%s\n' "$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          echo 'real_history=git_remote_checkout_fetch_depth_0'
          python3 .agents/Directional/tools/review_check.py boundary
          python3 .agents/Directional/tools/review_check.py authority 53830149ea16473d0321e53da2587695916fd9cb
          git diff --check
          git fetch --quiet origin "${GITHUB_REF_NAME}"
          test "$(git rev-parse HEAD)" = "$(git rev-parse FETCH_HEAD)"
          git status -sb
          echo 'head_matches_origin=true'
          echo 'runtimeExecution=false'

      - name: Upload review history diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cb41-review-history-${{ github.run_id }}
          path: ${{ runner.temp }}/cb41-review-history.log
          if-no-files-found: error
          retention-days: 14

  mailbox:
    if: ${{ always() }}
    needs: [boundary]
    permissions:
      actions: read
      contents: write
    uses: ./.github/workflows/workflow-mailbox-publisher.yml
    with:
      mailbox_branch: workflow-mailbox
      workflow_key: m6-cp3-cb41-rev-authentic-history
      source_sha: ${{ github.sha }}
      source_ref: ${{ github.ref }}
      result: ${{ needs.boundary.result }}
      summary: CB41 independent review authentic Git-history boundary and source-authority verification
