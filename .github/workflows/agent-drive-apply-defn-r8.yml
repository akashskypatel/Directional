    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/drive-apply-defn-r8-20260908.txt

permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

concurrency:
  group: agent-drive-apply-defn-r8
  cancel-in-progress: false

jobs:
  validate-caller:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/agent-drive-apply-defn-r8.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: defn-r8-drive-apply
      trim_stale_comments: false
    secrets: inherit

  apply:
    needs: validate-caller
    if: ${{ needs.validate-caller.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 126h89roy2YIH3vjv5ND-Ofh_XvHI5RiB
      patch_sha256: 4518e2dc68009711d3ee7cdc9931013b4c0ae6a644bbce98579d5868b46183b8
      base_sha: b664f13776b6cb79a6cd605936836e69d9fc471e
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: "docs: freeze CP4c-3 DEFN-R8 Part XII and CB48 plan"
    secrets: inherit
