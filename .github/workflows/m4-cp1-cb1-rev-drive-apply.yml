name: M4 CP1 CB1 REV Drive Apply

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m4-cp1-cb1-rev-drive-apply-20260909.txt

permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

concurrency:
  group: m4-cp1-cb1-rev-drive-apply
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/m4-cp1-cb1-rev-drive-apply.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m4-cp1-cb1-rev-drive-apply
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  apply-drive-patch:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1uPvSaRUeYg8G2z0K88KdjFINeIJe47QY
      patch_sha256: 41b47f4bca2ff79519c0091d0936f73f75d575b0a0ef0677eadc7c8b176a8156
      base_sha: 61e5b4394a9e91407a2b084a773c4cafaa8d6b6a
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: "docs: close M4-CP1-CB1 independent review"
    secrets: inherit
