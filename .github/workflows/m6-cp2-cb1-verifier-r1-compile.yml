name: M6 CP2 CB1 Verifier R1 Compile

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m6-cp2-cb1-verifier-r1-compile.txt

permissions:
  actions: write
  contents: write

concurrency:
  group: m6-cp2-cb1-verifier-r1-compile-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/m6-cp2-cb1-verifier-r1-compile.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  compile:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-compile-reusable.yml
    with:
      source_sha: 265c8fbb19a66c5c3344a525fdbd43932c3ef829
      targets: directional_core directional_pipeline directional_surface_cell_authority_kernel_tests directional_surface_cell_producer_tests directional_surface_cell_completion_tests directional_surface_cell_validation_tests directional_compiled_api_tests directional_benchmarks
      artifact_prefix: m6-cp2-cb1-verifier-r1-compile
    secrets: inherit

  mailbox:
    if: ${{ always() }}
    needs: [validate, compile]
    permissions:
      actions: read
      contents: write
    uses: ./.github/workflows/workflow-mailbox-publisher.yml
    with:
      workflow_key: m6-cp2-cb1-verifier-r1-compile
      source_sha: 265c8fbb19a66c5c3344a525fdbd43932c3ef829
      source_ref: refs/heads/agent/surface_cell_quad/p5-recover-bridge-healing
      result: ${{ needs.compile.result }}
      summary: M6-CP2-CB1-VERIFIER-R1 eight-target GMP/GMPXX compile/package.
