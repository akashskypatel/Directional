name: Agent CB40 REV Read-Only Git History Check

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/cb40-rev-history-20261026.txt

permissions:
  contents: write
  actions: read

concurrency:
  group: agent-cb40-rev-history-check
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/agent-cb40-rev-history-check.yml
      source_ref: ${{ github.sha }}

  history:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout full authentic history, without submodules
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false
          lfs: false
          persist-credentials: false
      - name: Execute read-only review boundary and ledgers checks
        id: gate
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p "${RUNNER_TEMP}/cb40-rev-history"
          {
            echo "event_sha=${GITHUB_SHA}"
            echo "checked_out_sha=$(git rev-parse HEAD)"
            echo "head_status=$(git status -sb)"
            echo "checkout_status=$(git status --porcelain)"
            echo "rewrite_base=$(git rev-parse 8b7299b43^{commit})"
            echo "compile_source=$(git rev-parse 0d227875d8f031a467e661be2da4dd901846797c^{commit})"
          } | tee "${RUNNER_TEMP}/cb40-rev-history/metadata.txt"
          set +e
          python3 .agents/Directional/tools/review_check.py authority 0d227875d8f031a467e661be2da4dd901846797c > "${RUNNER_TEMP}/cb40-rev-history/authority.log" 2>&1
          authority_rc=$?
          python3 .agents/Directional/tools/review_check.py boundary > "${RUNNER_TEMP}/cb40-rev-history/boundary.log" 2>&1
          boundary_rc=$?
          python3 .agents/Directional/tools/review_check.py ledgers --base 8b7299b43 > "${RUNNER_TEMP}/cb40-rev-history/ledgers.log" 2>&1
          ledgers_rc=$?
          set -e
          {
            echo "runtimeExecution=false"
            echo "authority_exit=${authority_rc}"
            echo "boundary_exit=${boundary_rc}"
            echo "ledgers_exit=${ledgers_rc}"
          } | tee "${RUNNER_TEMP}/cb40-rev-history/result.env"
          test "$authority_rc" -eq 0 && test "$boundary_rc" -eq 0 && test "$ledgers_rc" -eq 0
      - name: Upload immutable read-only evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cb40-rev-history-check-${{ github.run_id }}
          path: ${{ runner.temp }}/cb40-rev-history
          if-no-files-found: error
          retention-days: 14

  mailbox:
    if: ${{ always() }}
    needs: [validate, history]
    uses: ./.github/workflows/workflow-mailbox-publisher.yml
    with:
      mailbox_branch: workflow-mailbox
      workflow_key: m6-cp3-cb40-rev-history-20261026
      source_sha: ${{ github.sha }}
      source_ref: ${{ github.ref }}
      result: ${{ needs.history.result }}
      summary: Read-only CB40-REV full-history authority boundary ledger checks