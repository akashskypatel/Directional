name: M4 CP2 TB1 REV Closeout Apply

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m4-cp2-tb1-rev-closeout-apply/trigger.txt

permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

concurrency:
  group: m4-cp2-tb1-rev-closeout-apply
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/agent-m4-cp2-tb1-rev-closeout-apply.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m4-cp2-tb1-rev-closeout-apply
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  apply:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1IgEPfoxv_k406twT40Lfp3wRIVcN0nm1
      patch_sha256: 82763729d282393b9b9e86f1c1a6d4877f38f26dcc38111e6fb11edbf5ad797b
      base_sha: c2827fb05b0eec071d5061f69c591f4f39fcff78
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: "docs: review M4-CP2 TB1 and plan corrective CB2"
      retention_days: 14
    secrets: inherit
