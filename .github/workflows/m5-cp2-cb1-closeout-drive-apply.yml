      label: m5-cp2-cb1-closeout-drive-apply
      commit_run_file: false
      trim_stale_comments: false
    secrets: inherit

  apply:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1P1_jXB7aNRmpnH_BEv8SjDUXDq6zKKbS
      patch_sha256: 9f8f4fbdf40482ab38e638328f4bfd82e7768b63e137d9b74af435e878ee722f
