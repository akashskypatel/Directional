name: m1j-payload-cleanup

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - '.agents/connector-triggers/m1j-payload-cleanup'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Initialize persistent activity log
        shell: bash
        run: |
          set -Eeuo pipefail
          LOG="$RUNNER_TEMP/m1j-payload-cleanup.log"
          printf '%s\n' "event_sha=$GITHUB_SHA" 'scope=remove consumed M1j turn payloads only' > "$LOG"
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/surface_cell_quad/p5-recover-bridge-healing
          fetch-depth: 20
          submodules: false
      - name: Remove consumed payloads and push
        shell: bash
        run: |
          set -Eeuo pipefail
          LOG="$RUNNER_TEMP/m1j-payload-cleanup.log"
          exec > >(tee -a "$LOG") 2>&1
          trap 'rc=$?; echo "final_rc=$rc"; git status --short || true; exit $rc' EXIT
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -f .agents/Directional/turn-payloads/m1j-code-build-closeout.py
          test -f .agents/Directional/turn-payloads/m1j-edge-source-scope.py
          rm -f .agents/Directional/turn-payloads/m1j-code-build-closeout.py .agents/Directional/turn-payloads/m1j-edge-source-scope.py
          git config user.name 'OpenAI Directional Agent'
          git config user.email 'directional-agent@users.noreply.github.com'
          git add -f -u -- .agents/Directional/turn-payloads/m1j-code-build-closeout.py .agents/Directional/turn-payloads/m1j-edge-source-scope.py
          git diff --cached --check
          test "$(git diff --cached --name-only | wc -l)" -eq 2
          git commit -m 'chore: remove consumed M1j turn payloads'
          git push origin HEAD:agent/surface_cell_quad/p5-recover-bridge-healing
      - name: Upload dedicated diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m1j-payload-cleanup-logs
          path: ${{ runner.temp }}/m1j-payload-cleanup.log
          if-no-files-found: error
          retention-days: 14
