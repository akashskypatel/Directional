name: Agent M4 CP SCALE TB4 Closeout Apply

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m4-cp-scale-tb4-closeout-apply.txt

permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

concurrency:
  group: agent-m4-cp-scale-tb4-closeout-apply
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/agent-m4-cp-scale-tb4-closeout-apply.yml
    secrets: inherit

  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m4-cp-scale-tb4-closeout-apply
      commit_run_file: false
    secrets: inherit

  apply:
    needs: validate
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1Smju783B59QanjqNB1VrkPYVhs0h9YSd
      patch_sha256: f44a5abd54d54b7d2f83aa8042531b6bbd41c708554c6de5e15814c3036bf674
      base_sha: 1f9f345a0fc609bdbc4757e5153ee91c9889324a
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: "docs: close out M4 CP SCALE TB4 orchestration failure"
      retention_days: 7
    secrets: inherit
