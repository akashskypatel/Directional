name: P5 TB27 Exact Source Snapshot

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/p5-tb27-source-snapshot-20260904.txt
      - .github/workflows/p5-tb27-source-snapshot.yml

permissions:
  contents: write
  actions: read
  issues: write
  pull-requests: write

jobs:
  validate-caller:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/p5-tb27-source-snapshot.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  snapshot:
    needs: validate-caller
    if: ${{ needs.validate-caller.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-source-snapshot.yml
    with:
      source_ref: 359bdea948f20458740ac0479062f90b43cb7bb8
    secrets: inherit
