name: Agent D7 Review History Verification

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/d7-review/20261108.txt

permissions:
  contents: read
  actions: read

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/agent-d7-review-authority.yml
      source_ref: ${{ github.sha }}

  review:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout complete authoritative history
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify D7 review boundary and append-only history
        shell: bash
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/d7-review-history.log"
          : > "$log"
          exec > >(tee -a "$log") 2>&1
          trap 'rc=$?; echo "review_gate_exit=${rc}"; echo "finished_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"' EXIT
          echo "event_sha=${GITHUB_SHA}"
          echo "checkout_sha=$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor aa55054543e8a5d1b309cc9d46f0ff543117b05c HEAD
          git merge-base --is-ancestor 3fb96ef304b12441b05aa9159ee1888a0c45729c HEAD
          git diff --name-only 3fb96ef304b12441b05aa9159ee1888a0c45729c HEAD -- src include tests benchmarks CMakeLists.txt cmake > "${RUNNER_TEMP}/d7-code-drift.txt"
          test ! -s "${RUNNER_TEMP}/d7-code-drift.txt"
          python3 .agents/Directional/tools/review_check.py boundary
          python3 .agents/Directional/tools/review_check.py ledgers --base 8b7299b43
          echo 'D7_REVIEW_GATE_PASSED'
          git status -sb

      - name: Upload verification receipt
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: agent-d7-review-history-result-${{ github.run_id }}
          path: ${{ runner.temp }}/d7-review-history.log
          if-no-files-found: error
          retention-days: 14

      - name: Upload diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-d7-review-history-log-${{ github.run_id }}
          path: ${{ runner.temp }}/d7-review-history.log
          if-no-files-found: error
          retention-days: 14

  mailbox:
    if: ${{ always() }}
    needs: [review]
    permissions:
      actions: read
      contents: write
    uses: ./.github/workflows/workflow-mailbox-publisher.yml
    with:
      mailbox_branch: workflow-mailbox
      workflow_key: m6-cp3-d7-review-history
      source_sha: ${{ github.sha }}
      source_ref: ${{ github.ref }}
      result: ${{ needs.review.result }}
      summary: D7 review-only authentic-history boundary and ledger verification.
