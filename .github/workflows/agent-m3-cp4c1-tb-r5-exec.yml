name: M3 CP4c-1 TB-R5 Artifact-Only

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m3-cp4c1-tb-r5/run.txt

permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: m3-cp4c1-tb-r5-${{ github.ref }}
  cancel-in-progress: false

jobs:
  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m3-cp4c1-tb-r5
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/agent-m3-cp4c1-tb-r5-exec.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  execute:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Initialize persistent activity log
        shell: bash
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/m3-cp4c1-tb-r5-activity.log"
          : > "$log"
          echo "TB_LOG=$log" >> "$GITHUB_ENV"
          printf '%s\n' \
            "workflow=$GITHUB_WORKFLOW" "run_id=$GITHUB_RUN_ID" \
            "event=$GITHUB_EVENT_NAME" "event_sha=$GITHUB_SHA" \
            "ref=$GITHUB_REF" "repository=$GITHUB_REPOSITORY" \
            'turn=M3-CP4c-1-TB-R5' 'artifactOnly=true' 'runtimeExecution=true' \
            'configure=false' 'compile=false' 'relink=false' 'repair=false' \
            'generatedDiscovery=false' 'repositoryTimeoutConfigured=false' \
            'packageArtifactId=9675666067' \
            'semanticSource=b1ce8ad65952bd2bd76238f6dfc55523f6a24747' \
            "started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" | tee -a "$log"

      - name: Checkout exact control source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Verify runtime dependency and payload authority
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee -a "$TB_LOG") 2>&1
          dpkg -s libgmp-dev >/dev/null 2>&1 || { sudo apt-get update; sudo apt-get install -y libgmp-dev; }
          dpkg-query -W -f='libgmp-dev=${Version}\n' libgmp-dev
          ldconfig -p | grep -E 'libgmp(xx)?\.so'
          root="$GITHUB_WORKSPACE/.agents/Directional/turn-payloads"
          test "$(sha256sum "$root/m3_cp4c1_tb_r5_lib.py" | awk '{print $1}')" = "94c27a1701b257a71d4b4aa2bbca7fa4dcf24005bf58b769e68c91465eba39c8"
          test "$(sha256sum "$root/m3_cp4c1_tb_r5.py" | awk '{print $1}')" = "2cb7a21ce2a9e5e2e9752d2e4902dceee494e5b5efdf5541e883793ee9421e1f"
          python3 -m py_compile "$root/m3_cp4c1_tb_r5_lib.py" "$root/m3_cp4c1_tb_r5.py"

      - name: Execute immutable artifact-only TB-R5 plan
        id: gate
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONPATH: ${{ github.workspace }}/.agents/Directional/turn-payloads
        shell: bash
        run: |
          set -uo pipefail
          exec > >(tee -a "$TB_LOG") 2>&1
          python3 "$GITHUB_WORKSPACE/.agents/Directional/turn-payloads/m3_cp4c1_tb_r5.py"

      - name: Record final control status
        if: always()
        shell: bash
        run: |
          set +e
          exec > >(tee -a "$TB_LOG") 2>&1
          echo "gate_outcome=${{ steps.gate.outcome }}"
          echo control_source_status_begin
          git status --short
          echo control_source_status_end
          echo "final_sha=$GITHUB_SHA"
          echo "finished_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"

      - name: Upload TB-R5 result evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-cp4c1-tb-r5-result-${{ github.run_id }}
          path: ${{ runner.temp }}/m3-cp4c1-tb-r5-result
          if-no-files-found: error
          retention-days: 14

      - name: Upload persistent diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-cp4c1-tb-r5-log-${{ github.run_id }}
          path: ${{ env.TB_LOG }}
          if-no-files-found: error
          retention-days: 14

      - name: Propagate TB-R5 status
        if: always()
        shell: bash
        run: |
          test -f "$RUNNER_TEMP/m3-cp4c1-tb-r5-result/gate-exit-code.txt" || exit 2
          exit "$(cat "$RUNNER_TEMP/m3-cp4c1-tb-r5-result/gate-exit-code.txt")"
