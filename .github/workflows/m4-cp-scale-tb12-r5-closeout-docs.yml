      workflow_path: .github/workflows/m4-cp-scale-tb12-r5-closeout-docs.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m4-cp-scale-tb12-r5-closeout-docs
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  apply:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1sd7nVr0S4KHkRvxi9N9qrXbWELffEyBw
      patch_sha256: 1d43ab1810bcfccf5befa53a3ce9986632cf360eeb7b7770fa6287e6f7d6f8b0
      base_sha: 0326b6de0053175b138e370e306f66fcee67b998
