name: M3 CP4c0 R11 Closeout Docs Apply

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m3-cp4c0-r11-closeout/run.txt

permissions:
  actions: read
  contents: write
  id-token: write
  issues: write
  pull-requests: write

concurrency:
  group: m3-cp4c0-r11-closeout-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/agent-m3-cp4c0-r11-closeout-apply.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m3-cp4c0-r11-closeout
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  apply:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1EhkPwSaT8xCnnpXD0L_tee1CyGxG1CAz
      patch_sha256: 0dbddddcf12ac50e201b7695692e7f8d56bdcd8c5eabae728d13e2450ce079f6
      base_sha: 267272d22f7de67ce7d8e368a53cc78a37ca3e8f
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: 'docs: close CB-R11 and focused TB-R11 CAND-02 correction'
      retention_days: 7
    secrets: inherit
