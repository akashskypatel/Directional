name: M3 CP4c3 TB5 Artifact Only

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m3-cp4c3-tb5-20260831.txt

permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: m3-cp4c3-tb5-artifact-only
  cancel-in-progress: false

jobs:
  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m3-cp4c3-tb5
      commit_run_file: false
    secrets: inherit

  validate-caller:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/m3-cp4c3-tb5-artifact-only.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  tb5:
    needs: validate-caller
    if: ${{ needs.validate-caller.outputs.valid == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Initialize artifact-only TB5 log
        shell: bash
        run: |
          set -euo pipefail
          work="${RUNNER_TEMP}/m3-cp4c3-tb5"
          mkdir -p "$work/result" "$work/runtime-work"
          log="$work/result/tb5.log"
          : > "$log"
          {
            echo "workflow=${GITHUB_WORKFLOW}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "event=${GITHUB_EVENT_NAME}"
            echo "event_sha=${GITHUB_SHA}"
            echo "evidence_source=49536cf7b4b261bd52f36a91c861b6459db356a4"
            echo "package_artifact_id=9778267541"
            echo "benchmarkExecution=false"
            echo "configureExecution=false"
            echo "compileExecution=false"
            echo "relinkExecution=false"
            echo "packageRepair=false"
            echo "generatedDiscovery=false"
            echo "started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } | tee -a "$log"

      - name: Immutable package 74 preflight
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          work="${RUNNER_TEMP}/m3-cp4c3-tb5"
          log="$work/result/tb5.log"
          exec > >(tee -a "$log") 2>&1
          raw="$work/raw"
          pkg="$work/package74"
          src="$work/source"
          mkdir -p "$raw" "$pkg" "$src"

          echo '== PRE-RUNTIME IMMUTABLE PREFLIGHT =='
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/9778267541/zip" > "$raw/package74.zip"
          echo "bad0ade74ff8e47c9937013c0fcc3f1084272c66eda35a2db60800ff7b6b767d  $raw/package74.zip" | sha256sum -c -
          unzip -q "$raw/package74.zip" -d "$raw/outer"
          echo "c8d5167652ea95504252f5adb4d1dc5d9f463a4dfacfb7e5e11bd086fe935d8e  $raw/outer/package74.tar.gz" | sha256sum -c -
          tar -xzf "$raw/outer/package74.tar.gz" -C "$pkg"
          pkg="$pkg/package74"

          test "$(find "$pkg" -type f | wc -l | tr -d ' ')" = 58
          test "$(awk 'END{print NR}' "$pkg/SHA256SUMS")" = 57
          grep -qx 'manifestExcludesSelf=true' "$pkg/metadata/command-boundary.txt"
          (cd "$pkg" && sha256sum -c SHA256SUMS)
          test "$(cat "$pkg/metadata/source-commit.txt")" = "49536cf7b4b261bd52f36a91c861b6459db356a4"
          echo "5afa250d0dd8e003b91e7e5f887e3eed8658f16faa6754722bf8a2dd37a1c931  $pkg/source/source-49536cf7b4b261bd52f36a91c861b6459db356a4.tar.gz" | sha256sum -c -
          for f in "$pkg"/metadata/source-status-*.txt; do test ! -s "$f"; done
          grep -qx 'runtimeExecution=false' "$pkg/metadata/command-boundary.txt"
          grep -qx 'exactArithmeticBackend=GMP' "$pkg/metadata/command-boundary.txt"
          grep -qx 'packageRepair=false' "$pkg/metadata/fixture-package-contract.txt"
          grep -q 'libgmpxx.so' "$pkg/metadata/gmp-evidence.txt"
          grep -q 'libgmp.so' "$pkg/metadata/gmp-evidence.txt"
          test "$(find "$pkg/test-data/benchmarks/fixtures" -type f | wc -l | tr -d ' ')" = 27
          test "$(find "$pkg/bin" -maxdepth 1 -type f -name 'directional_*' | wc -l | tr -d ' ')" = 6
          for exe in "$pkg"/bin/directional_*; do
            test "$(stat -c '%a' "$exe")" = 755
          done

          tar -xzf "$pkg/source/source-49536cf7b4b261bd52f36a91c861b6459db356a4.tar.gz" -C "$src"
          sel_dir="$src/.agents/Directional"
          declare -A expected_hash=(
            [357]=b896d0db7f26aeb0f3513418405efdeccbcf84fb6dc971500c6ddac9e364dc70
            [358]=6eda3aad83de81fc55d5cd446f80704d604a842f10995789b483291bb64fbe62
            [361]=61918d9fbd7bf757437886f0e86776b60665c58e4d7283b81d42caca03c0288b
            [365]=6b5b6555d39c250c24cbf3faeafdeca93b4b11379118a29583253e6cfc14b8a1
            [367]=ef9d082f56f5c8de83124cf2e6257d098408cc597d9147b967cf9c84da4916bf
            [370]=9160ea619afb9e10cbad30012d0bd354c263a2b749e690c271f653db3bf83525
            [373]=b47c269851fad1384b5dc9baaf674b3d4ad80ec6c2b40f7f8eda2055c6f44834
          )
          selector_path() {
            case "$1" in
              357|358|361|365) echo "$sel_dir/Architecture_M3_CP4c2_Required_Green_Selector_$1.txt" ;;
              *) echo "$sel_dir/Architecture_M3_CP4c3_Required_Green_Selector_$1.txt" ;;
            esac
          }
          for n in 357 358 361 365 367 370 373; do
            p="$(selector_path "$n")"
            actual="$(sha256sum "$p" | awk '{print $1}')"
            test "$actual" = "${expected_hash[$n]}"
            test "$(awk 'END{print NR}' "$p")" = "$n"
            test "$(sort "$p" | uniq | wc -l | tr -d ' ')" = "$n"
            printf '%s %s\n' "$n" "$actual" | tee -a "$work/result/selector-hashes.txt"
          done
          selector="$(selector_path 373)"
          for n in 357 361 365 367 370; do
            p="$(selector_path "$n")"
            head -n "$n" "$selector" > "$work/prefix-$n.txt"
            cmp -s "$p" "$work/prefix-$n.txt"
          done
          # Selector 358 is a retained historical fork, not a byte prefix: its
          # former RotationSystem identity was later relocated while 361 restored
          # the cumulative prefix. Preserve its exact hash and require every 358
          # identity to remain present exactly once in selector 373.
          p358="$(selector_path 358)"
          test -z "$(comm -23 <(LC_ALL=C sort "$p358") <(LC_ALL=C sort "$selector"))"
          echo '358 lineage=historical-set-subset-not-byte-prefix' | tee -a "$work/result/selector-hashes.txt"

          python3 - "$src" "$selector" "$work/result/mapping.tsv" <<'PY'
          from pathlib import Path
          import re, sys
          root = Path(sys.argv[1]); selector = Path(sys.argv[2]); out = Path(sys.argv[3])
          targets = {
            'directional_surface_cell_producer_tests': [
              'tests/AdaptiveFeatureMapPhase11Tests.cpp','tests/AdaptiveTargetSizePhase12Tests.cpp',
              'tests/BoundedMeshPreconditionerTests.cpp','tests/CrossFieldTransferTests.cpp',
              'tests/FieldAlignedCurveNetworkTests.cpp','tests/RegularizedCurvaturePhase1Tests.cpp',
              'tests/SourceGridRecoveryAuthorityTests.cpp','tests/SurfaceCellDesignAcceptanceTests.cpp',
              'tests/SurfaceCellREPackageTests.cpp','tests/SurfaceCellTransitionQuotientTests.cpp',
              'tests/SurfaceCellsPhase10Tests.cpp'],
            'directional_surface_cell_authority_kernel_tests': [
              'tests/FieldTransportAtlasTests.cpp','tests/SurfaceCellAuthorityKernelTests.cpp'],
            'directional_surface_cell_completion_tests': [
              'tests/FlowRepStrandsPhase15Tests.cpp','tests/PatchDescriptorMilestoneETests.cpp',
              'tests/PureQuadCompletionPhase18Tests.cpp','tests/SurfaceArrangementRowIdentityTests.cpp',
              'tests/SurfaceComplexSimplificationPhase17Tests.cpp'],
            'directional_surface_cell_validation_tests': [
              'tests/SourceAuthoritativeMeshValidatorPhase22Tests.cpp',
              'tests/SurfaceMeshOptimizerPhase19Tests.cpp','tests/SurfaceMeshOptimizerPhase20Tests.cpp',
              'tests/SurfaceMeshOptimizerPhase21Tests.cpp','tests/SurfaceMeshOptimizerPhase22Tests.cpp'],
          }
          id_targets = {}
          rx = re.compile(r'\b(?:TEST|TEST_F|TEST_P)\s*\(\s*([A-Za-z_][A-Za-z0-9_:]*)\s*,\s*([A-Za-z_][A-Za-z0-9_]*)\s*\)')
          for target, files in targets.items():
              for rel in files:
                  text = (root / rel).read_text(encoding='utf-8', errors='strict')
                  for suite, test in rx.findall(text):
                      id_targets.setdefault(f'{suite}.{test}', set()).add(target)
          identities = selector.read_text(encoding='utf-8').splitlines()
          if len(identities) != 373 or len(set(identities)) != 373:
              raise SystemExit('selector cardinality/uniqueness invalid')
          rows=[]
          for ordinal, ident in enumerate(identities, 1):
              owners = sorted(id_targets.get(ident, ()))
              if len(owners) != 1:
                  raise SystemExit(f'static mapping count {len(owners)} for {ordinal}:{ident}: {owners}')
              rows.append(f'{ordinal}\t{ident}\t{owners[0]}')
          out.write_text('\n'.join(rows) + '\n', encoding='utf-8')
          PY
          test "$(wc -l < "$work/result/mapping.tsv" | tr -d ' ')" = 373
          while IFS=$'\t' read -r ordinal identity target; do
            test -x "$pkg/bin/$target"
          done < "$work/result/mapping.tsv"

          census="$work/result/preflight-census.tsv"
          : > "$census"
          while IFS= read -r -d '' file; do
            rel="${file#$pkg/}"
            printf '%s\t%s\t%s\t%s\n' "$rel" "$(stat -c '%a' "$file")" "$(stat -c '%s' "$file")" "$(sha256sum "$file" | awk '{print $1}')" >> "$census"
          done < <(find "$pkg" -type f -print0 | sort -z)
          test "$(wc -l < "$census" | tr -d ' ')" = 58
          cp "$census" "$work/preflight-census.reference.tsv"
          echo 'preflight=PASS' | tee "$work/result/preflight.txt"

      - name: Run ordered semantic gate and AP6 report-only diagnostics
        shell: bash
        run: |
          set -euo pipefail
          work="${RUNNER_TEMP}/m3-cp4c3-tb5"
          log="$work/result/tb5.log"
          exec > >(tee -a "$log") 2>&1
          pkg="$work/package74/package74"
          mapping="$work/result/mapping.tsv"
          rows="$work/result/execution.tsv"
          printf 'phase\tordinal\tidentity\ttarget\texit_code\trun_count\tstatus\n' > "$rows"
          gate_verdict=GREEN
          gate_passed=0
          first_red_ordinal=''
          first_red_identity=''
          first_red_target=''
          first_red_exit=''

          echo '== ORDERED SEMANTIC GATE =='
          while IFS=$'\t' read -r ordinal identity target; do
            out="$work/result/gate-$(printf '%03d' "$ordinal").log"
            echo "gate ordinal=$ordinal identity=$identity target=$target"
            set +e
            (cd "$work/runtime-work" && "$pkg/bin/$target" --gtest_filter="$identity" --gtest_color=no) >"$out" 2>&1
            rc=$?
            set -e
            cat "$out"
            run_count="$(grep -c '\[ RUN      \]' "$out" || true)"
            if [[ "$run_count" != 1 ]]; then
              printf 'gate\t%s\t%s\t%s\t%s\t%s\tORCHESTRATION_FAILURE\n' "$ordinal" "$identity" "$target" "$rc" "$run_count" >> "$rows"
              echo "orchestration failure: exact filter selected $run_count tests" >&2
              exit 2
            fi
            if [[ "$rc" -eq 0 ]]; then
              gate_passed=$ordinal
              printf 'gate\t%s\t%s\t%s\t%s\t%s\tPASS\n' "$ordinal" "$identity" "$target" "$rc" "$run_count" >> "$rows"
            else
              gate_verdict=RED
              first_red_ordinal="$ordinal"
              first_red_identity="$identity"
              first_red_target="$target"
              first_red_exit="$rc"
              printf 'gate\t%s\t%s\t%s\t%s\t%s\tRED\n' "$ordinal" "$identity" "$target" "$rc" "$run_count" >> "$rows"
              break
            fi
          done < "$mapping"

          {
            echo "gate_verdict=$gate_verdict"
            echo "gate_passed=$gate_passed"
            echo "first_red_ordinal=$first_red_ordinal"
            echo "first_red_identity=$first_red_identity"
            echo "first_red_target=$first_red_target"
            echo "first_red_exit=$first_red_exit"
          } | tee "$work/result/gate-verdict.txt"

          echo '== AP6 REPORT-ONLY 367-373 / ZERO GATE CREDIT =='
          report_pass=0
          report_red=0
          for ordinal in 367 368 369 370 371 372 373; do
            line="$(sed -n "${ordinal}p" "$mapping")"
            IFS=$'\t' read -r mapped identity target <<< "$line"
            test "$mapped" = "$ordinal"
            out="$work/result/report-only-$(printf '%03d' "$ordinal").log"
            set +e
            (cd "$work/runtime-work" && "$pkg/bin/$target" --gtest_filter="$identity" --gtest_color=no) >"$out" 2>&1
            rc=$?
            set -e
            cat "$out"
            run_count="$(grep -c '\[ RUN      \]' "$out" || true)"
            if [[ "$run_count" != 1 ]]; then
              printf 'report-only\t%s\t%s\t%s\t%s\t%s\tORCHESTRATION_FAILURE\n' "$ordinal" "$identity" "$target" "$rc" "$run_count" >> "$rows"
              echo "report-only orchestration failure: exact filter selected $run_count tests" >&2
              exit 3
            fi
            if [[ "$rc" -eq 0 ]]; then
              report_pass=$((report_pass + 1))
              status=PASS
            else
              report_red=$((report_red + 1))
              status=RED
            fi
            printf 'report-only\t%s\t%s\t%s\t%s\t%s\t%s\n' "$ordinal" "$identity" "$target" "$rc" "$run_count" "$status" >> "$rows"
          done
          printf 'report_only_pass=%s\nreport_only_red=%s\nreport_only_gate_credit=0\n' "$report_pass" "$report_red" | tee "$work/result/report-only-verdict.txt"

      - name: Immutable postflight
        shell: bash
        run: |
          set -euo pipefail
          work="${RUNNER_TEMP}/m3-cp4c3-tb5"
          log="$work/result/tb5.log"
          exec > >(tee -a "$log") 2>&1
          pkg="$work/package74/package74"
          src="$work/source"
          echo '== IMMUTABLE POSTFLIGHT =='
          (cd "$pkg" && sha256sum -c SHA256SUMS)
          echo "5afa250d0dd8e003b91e7e5f887e3eed8658f16faa6754722bf8a2dd37a1c931  $pkg/source/source-49536cf7b4b261bd52f36a91c861b6459db356a4.tar.gz" | sha256sum -c -
          for exe in "$pkg"/bin/directional_*; do test "$(stat -c '%a' "$exe")" = 755; done
          test "$(sha256sum "$src/.agents/Directional/Architecture_M3_CP4c3_Required_Green_Selector_373.txt" | awk '{print $1}')" = b47c269851fad1384b5dc9baaf674b3d4ad80ec6c2b40f7f8eda2055c6f44834
          census="$work/result/postflight-census.tsv"
          : > "$census"
          while IFS= read -r -d '' file; do
            rel="${file#$pkg/}"
            printf '%s\t%s\t%s\t%s\n' "$rel" "$(stat -c '%a' "$file")" "$(stat -c '%s' "$file")" "$(sha256sum "$file" | awk '{print $1}')" >> "$census"
          done < <(find "$pkg" -type f -print0 | sort -z)
          cmp -s "$work/preflight-census.reference.tsv" "$census"
          {
            echo 'postflight=PASS'
            echo 'configureExecution=false'
            echo 'compileExecution=false'
            echo 'relinkExecution=false'
            echo 'packageRepair=false'
            echo 'generatedDiscovery=false'
            echo 'productMutation=false'
            echo 'testMutation=false'
            echo 'fixtureMutation=false'
            echo 'selectorMutation=false'
            echo 'benchmarkExecution=false'
            echo "finished_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } | tee "$work/result/postflight.txt"

      - name: Upload TB5 result and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-cp4c3-tb5-result-${{ github.run_id }}
          path: ${{ runner.temp }}/m3-cp4c3-tb5/result
          if-no-files-found: error
          retention-days: 14
