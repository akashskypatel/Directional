name: M3 CP4c3 CB7 Package 75

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m3-cp4c3-cb7-package75-20260901.txt

permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: m3-cp4c3-cb7-package75
  cancel-in-progress: false

jobs:
  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m3-cp4c3-cb7-package75
      commit_run_file: false
    secrets: inherit

  validate-caller:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/m3-cp4c3-cb7-package75.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  package:
    needs: validate-caller
    if: ${{ needs.validate-caller.outputs.valid == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Initialize persistent activity log
        shell: bash
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/m3-cp4c3-cb7-package75.log"
          : > "$log"
          {
            echo "workflow=${GITHUB_WORKFLOW}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "event=${GITHUB_EVENT_NAME}"
            echo "event_sha=${GITHUB_SHA}"
            echo "source_sha=e926ada023bc51220628be550bbe9a87f98d7067"
            echo "compile_artifact_id=9781459057"
            echo "runtimeExecution=false"
            echo "started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } | tee -a "$log"

      - name: Download and verify exact compile artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/m3-cp4c3-cb7-package75.log"
          exec > >(tee -a "$log") 2>&1
          work="${RUNNER_TEMP}/m3-cp4c3-cb7-package75"
          mkdir -p "$work/raw"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/9781459057/zip" > "$work/raw.zip"
          echo "e66ff9cbb04a586a8862ceb40ee9e0651741a4588ab8fcd8caf2fc2a8c1fcbba  $work/raw.zip" | sha256sum -c -
          unzip -q "$work/raw.zip" -d "$work/raw"
          test "$(cat "$work/raw/metadata/source-commit.txt")" = "e926ada023bc51220628be550bbe9a87f98d7067"
          grep -qx 'runtimeExecution=false' "$work/raw/metadata/command-boundary.txt"
          grep -qx 'exactArithmeticBackend=GMP' "$work/raw/metadata/command-boundary.txt"
          grep -q 'libgmpxx.so' "$work/raw/metadata/gmp-evidence.txt"
          grep -q 'libgmp.so' "$work/raw/metadata/gmp-evidence.txt"
          (cd "$work/raw" && sha256sum -c SHA256SUMS)

      - name: Build and verify mode-preserving package 75
        shell: bash
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/m3-cp4c3-cb7-package75.log"
          exec > >(tee -a "$log") 2>&1
          work="${RUNNER_TEMP}/m3-cp4c3-cb7-package75"
          pkg="$work/package75"
          mkdir -p "$pkg"
          cp -a "$work/raw/bin" "$work/raw/lib" "$work/raw/metadata" "$work/raw/source" "$pkg/"
          mkdir -p "$work/source-tree" "$pkg/test-data/benchmarks"
          tar -xzf "$work/raw/source/source-e926ada023bc51220628be550bbe9a87f98d7067.tar.gz" -C "$work/source-tree" benchmarks/fixtures
          cp -a "$work/source-tree/benchmarks/fixtures" "$pkg/test-data/benchmarks/"
          fixture_count="$(find "$pkg/test-data/benchmarks/fixtures" -type f | wc -l | tr -d ' ')"
          test "$fixture_count" = 27
          cat > "$pkg/metadata/fixture-package-contract.txt" <<'EOF'
          package=75
          source_commit=e926ada023bc51220628be550bbe9a87f98d7067
          fixture_count=27
          fixture_authority=package-relative
          runtimeExecution=false
          packageRepair=false
          EOF
          cat > "$pkg/metadata/package-envelope.txt" <<'EOF'
          runtimeExecution=false
          turnBoundary=Code+Build-only
          exactArithmeticBackend=GMP
          modePreservingEnvelope=true
          semanticContracts=compiled-not-executed
          EOF
          rm -f "$pkg/SHA256SUMS"
          (cd "$pkg" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          (cd "$pkg" && sha256sum -c SHA256SUMS)
          for exe in "$pkg"/bin/directional_*; do test -x "$exe"; done
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner -czf "$work/package75.tar.gz" -C "$work" package75
          sha256sum "$work/package75.tar.gz" > "$work/package75.sha256"
          sha256sum "$work/raw/source/source-e926ada023bc51220628be550bbe9a87f98d7067.tar.gz" > "$work/source-archive.sha256"
          cat > "$work/package75-boundary.txt" <<'EOF'
          runtimeExecution=false
          No Directional binary was executed while packaging.
          EOF
          mkdir -p "$work/verify"
          tar -xzf "$work/package75.tar.gz" -C "$work/verify"
          (cd "$work/verify/package75" && sha256sum -c SHA256SUMS)
          for exe in "$work/verify/package75"/bin/directional_*; do test -x "$exe"; done
          echo "fixture_count=$fixture_count"
          cat "$work/package75.sha256"
          cat "$work/source-archive.sha256"

      - name: Upload package 75
        uses: actions/upload-artifact@v4
        with:
          name: m3-cp4c3-package75-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/m3-cp4c3-cb7-package75/package75.tar.gz
            ${{ runner.temp }}/m3-cp4c3-cb7-package75/package75.sha256
            ${{ runner.temp }}/m3-cp4c3-cb7-package75/source-archive.sha256
            ${{ runner.temp }}/m3-cp4c3-cb7-package75/package75-boundary.txt
          if-no-files-found: error
          retention-days: 14

      - name: Upload persistent activity log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-cp4c3-package75-log-${{ github.run_id }}
          path: ${{ runner.temp }}/m3-cp4c3-cb7-package75.log
          if-no-files-found: error
          retention-days: 14
