name: Agent Source Snapshot M3 CP4c3 TB5 REV 20260831

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/source-snapshot/m3cp4c3-tb5rev-20260831.txt

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: agent-source-snapshot-m3cp4c3-tb5rev-20260831
  cancel-in-progress: false

jobs:
  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: source-snapshot-m3cp4c3-tb5rev-20260831
      commit_run_file: false
    secrets: inherit

  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/agent-source-snapshot-m3cp4c3-tb5rev-20260831.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  snapshot:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-source-snapshot.yml
    with:
      source_ref: 5ac1d0ba8b965ed14318f5883d88ec84ca2d9c7a
      artifact_prefix: agent-source-snapshot-m3cp4c3-tb5rev
    secrets: inherit
