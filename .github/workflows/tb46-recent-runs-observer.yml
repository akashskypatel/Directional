name: TB46 One-Time Workflow Run Inventory
on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/recent-runs-tb46/**
permissions:
  actions: read
  contents: write
jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/tb46-recent-runs-observer.yml
      source_ref: ${{ github.sha }}
  inventory:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/agent-recent-workflow-runs-reusable.yml
    with:
      per_page: 100
      max_pages: 1
      branch: agent/surface_cell_quad/p5-recover-bridge-healing
      event: push
      retention_days: 7
  mailbox:
    if: ${{ always() }}
    needs: [inventory]
    permissions:
      actions: read
      contents: write
    uses: ./.github/workflows/workflow-mailbox-publisher.yml
    with:
      mailbox_branch: workflow-mailbox
      workflow_key: tb46-run-inventory
      source_sha: ${{ github.sha }}
      source_ref: ${{ github.ref }}
      result: ${{ needs.inventory.result }}
      summary: One-time read-only discovery of TB46 dispatcher run.
