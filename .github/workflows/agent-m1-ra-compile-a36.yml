name: Agent M1 R-A Compile A36

on:
  push:
    branches: [agent/surface_cell_quad/p5-recover-bridge-healing]
    paths: [.agents/connector-triggers/m1-ra-compile-a36.txt]

permissions:
  contents: read
  actions: write

env:
  SOURCE_SHA: bebac907de814b07a55a770add4c897ab6d22ffd
  CCACHE_MAXSIZE: 256M

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Initialize persistent activity log
        shell: bash
        run: |
          set -euo pipefail
          LOG="$RUNNER_TEMP/activity.log"; : > "$LOG"
          { echo "task=M1 R-A exact compile A36"; echo "event_sha=$GITHUB_SHA"; echo "source_sha=$SOURCE_SHA"; date -u +"utc=%Y-%m-%dT%H:%M:%SZ"; } | tee -a "$LOG"
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 1
          submodules: recursive
      - name: Install and configure ccache
        shell: bash
        run: |
          set -euo pipefail
          LOG="$RUNNER_TEMP/activity.log"; exec > >(tee -a "$LOG") 2>&1
          sudo apt-get update
          sudo apt-get install -y ccache
          export CCACHE_DIR="$RUNNER_TEMP/ccache"
          mkdir -p "$CCACHE_DIR"
          ccache --set-config=max_size="$CCACHE_MAXSIZE"
          ccache --set-config=compression=true
      - name: Compute cache key
        id: cache-key
        shell: bash
        run: |
          set -euo pipefail
          compiler="$(c++ -dumpfullversion -dumpversion)"
          prefix="m1-ra-${RUNNER_OS}-gcc-${compiler}-release-ccache-v2-"
          echo "prefix=$prefix" >> "$GITHUB_OUTPUT"
          echo "key=${prefix}${GITHUB_RUN_ID}" >> "$GITHUB_OUTPUT"
      - name: Restore compatible partial build cache
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/ccache
          key: ${{ steps.cache-key.outputs.key }}
          restore-keys: |
            ${{ steps.cache-key.outputs.prefix }}
      - name: Configure
        shell: bash
        run: |
          set -euo pipefail
          LOG="$RUNNER_TEMP/activity.log"; exec > >(tee -a "$LOG") 2>&1
          export CCACHE_DIR="$RUNNER_TEMP/ccache"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          echo "cache_hit=${{ steps.cache.outputs.cache-hit }}"
          echo "cache_matched_key=${{ steps.cache.outputs.cache-matched-key }}"
          ccache -s
          cmake -S . -B build-m1-ra -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DBUILD_SHARED_LIBS=OFF \
            -DDIRECTIONAL_BUILD_CLI=OFF \
            -DDIRECTIONAL_BUILD_GUI=OFF \
            -DDIRECTIONAL_BUILD_TESTS=ON \
            -DDIRECTIONAL_BUILD_BENCHMARKS=ON \
            -DDIRECTIONAL_BUILD_HISTORICAL_TESTS=OFF \
            -DDIRECTIONAL_BUILD_LEGACY_INTEGRATION_TESTS=OFF \
            -DDIRECTIONAL_BUILD_OPTIONAL_GUIDANCE_TESTS=OFF \
            -DDIRECTIONAL_ENABLE_GMP=OFF \
            -DDIRECTIONAL_ENABLE_PARDISO=OFF \
            -DDIRECTIONAL_ENABLE_SUITESPARSE=OFF \
            -DDIRECTIONAL_ENABLE_CUDSS=OFF \
            -DCMAKE_GTEST_DISCOVER_TESTS_DISCOVERY_MODE=PRE_TEST
      - name: Compile and link affected targets only
        shell: bash
        run: |
          set -uo pipefail
          LOG="$RUNNER_TEMP/activity.log"; exec > >(tee -a "$LOG") 2>&1
          export CCACHE_DIR="$RUNNER_TEMP/ccache"
          set +e
          cmake --build build-m1-ra --target directional_core directional_pipeline directional_surface_cell_authority_kernel_tests directional_surface_cell_producer_tests directional_surface_cell_completion_tests directional_surface_cell_validation_tests directional_compiled_api_tests directional_benchmarks -- -j2
          rc=$?
          set -e
          echo "$rc" > "$RUNNER_TEMP/build-exit-code"
          echo "build_exit=$rc"
          ccache -s
          echo "No generated Directional binary, test, benchmark, discovery/listing, ctest, CLI/help/version, fuzzer, or custom input was executed."
          exit 0
      - name: Save partial compiler cache
        if: always() && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/ccache
          key: ${{ steps.cache-key.outputs.key }}
      - name: Prune stale compatible caches
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          CACHE_PREFIX: ${{ steps.cache-key.outputs.prefix }}
        shell: bash
        run: |
          set -euo pipefail
          LOG="$RUNNER_TEMP/activity.log"; exec > >(tee -a "$LOG") 2>&1
          list="$RUNNER_TEMP/cache-list.tsv"
          gh api --paginate "/repos/$GITHUB_REPOSITORY/actions/caches?per_page=100" --jq '.actions_caches[] | [.id, .key, .last_accessed_at] | @tsv' > "$list"
          mapfile -t stale < <(awk -F '\t' -v p="$CACHE_PREFIX" 'substr($2,1,length(p))==p {print $3"\t"$1"\t"$2}' "$list" | sort -r | tail -n +2)
          for entry in "${stale[@]}"; do IFS=$'\t' read -r accessed id key <<< "$entry"; gh api --method DELETE "/repos/$GITHUB_REPOSITORY/actions/caches/$id"; done
          echo "cache_pruned=${#stale[@]}"
          echo "cache_storage_cap_per_entry=$CCACHE_MAXSIZE"
      - name: Propagate compile status
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          LOG="$RUNNER_TEMP/activity.log"; exec > >(tee -a "$LOG") 2>&1
          test -f "$RUNNER_TEMP/build-exit-code" || { echo "compile_status=missing"; exit 1; }
          rc="$(cat "$RUNNER_TEMP/build-exit-code")"; echo "compile_status=$rc"; exit "$rc"
      - name: Package compile evidence
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/result"; mkdir -p "$OUT/metadata"
          git rev-parse HEAD > "$OUT/metadata/source-commit.txt"
          git status --porcelain=v1 > "$OUT/metadata/source-status.txt"
          cp build-m1-ra/CMakeCache.txt "$OUT/metadata/CMakeCache.txt"
          printf 'runtimeExecution=false\ncompilerCache=ccache\ncompilerCacheMaxSize=%s\n' "$CCACHE_MAXSIZE" > "$OUT/metadata/command-boundary.txt"
          (cd "$OUT" && find . -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
      - name: Upload compile result
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: m1-ra-compile-result-${{ github.run_id }}
          path: ${{ runner.temp }}/result
          if-no-files-found: error
          retention-days: 7
      - name: Upload persistent activity log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m1-ra-compile-log-${{ github.run_id }}
          path: ${{ runner.temp }}/activity.log
          if-no-files-found: error
          retention-days: 7
