name: Agent M4 CP SCALE CB5 Drive Apply

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m4-cp-scale-cb5-drive-apply/trigger.txt

permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

concurrency:
  group: agent-m4-cp-scale-cb5-drive-apply-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/agent-m4-cp-scale-cb5-drive-apply.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m4-cp-scale-cb5-drive-apply
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  apply:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1yQoJAi68dRUEs5_xV9TEgkiApmNqSgiY
      patch_sha256: "37afcb0d6ed739df618ed31778802bc216667b664d1c6dcffa0573a7b9b02388"
      base_sha: 6103a19473cccd2cccedb023c633bfcfe10ece29
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: "docs: close M4 CP SCALE CB5"
      retention_days: 7
    secrets: inherit
