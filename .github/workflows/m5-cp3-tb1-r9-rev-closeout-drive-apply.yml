name: M5 CP3 TB1 R9 Review Closeout Drive Apply

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m5-cp3-tb1-r9-rev-closeout-drive-apply/**

permissions:
  actions: read
  contents: write
  id-token: write
  issues: write
  pull-requests: write

concurrency:
  group: m5-cp3-tb1-r9-rev-closeout-drive-apply-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/m5-cp3-tb1-r9-rev-closeout-drive-apply.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m5-cp3-tb1-r9-rev-closeout-drive-apply
      commit_run_file: false
      trim_stale_comments: false
    secrets: inherit

  apply:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1wmW1kut6b3WTa6hWenoC1XV0Vetx44r-
      patch_sha256: 2c58f87c9a0b93ebc7d5e99a479344bbc1cb5f327aabdb0c13d2ef99d1a3e132
      base_sha: 74358463bd5182b17ccc5f6bb13e2b5653ab00b8
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: "docs: record M5-CP3-TB1-R9 review"
    secrets: inherit
