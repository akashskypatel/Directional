name: M3 CP4c3 CB15 Prepackage Compile

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/cb15-precompile/**

permissions:
  contents: read
  actions: write

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/agent-cb15-precompile.yml
      source_ref: ${{ github.sha }}

  compile:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-compile-reusable.yml
    with:
      source_sha: ab0501de362c3518f1f040015f19b64c179aa007
      targets: directional_core
      artifact_prefix: m3-cp4c3-cb15-precompile
