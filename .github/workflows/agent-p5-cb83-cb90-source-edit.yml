name: Agent P5 CB83-CB90 source edit

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .github/workflows/agent-p5-cb83-cb90-source-edit.yml

permissions:
  contents: write

jobs:
  edit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/surface_cell_quad/p5-recover-bridge-healing
          fetch-depth: 1
          submodules: false

      - name: Apply P5-CB83 through P5-CB90 source changes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{label}: expected one match, found {count}")
              return text.replace(old, new, 1)

          flow_path = Path("src/geometry/FlowRepStrands.cpp")
          flow = flow_path.read_text()
          flow = replace_once(
              flow,
              """  for (const OpenEndpoint &endpoint : openEndpoints) {
              FlowRepArc &source =
                  result.arcs[static_cast<std::size_t>(endpoint.arcId)];""",
              """  for (const OpenEndpoint &endpoint : openEndpoints) {
              const int sourceArcId = endpoint.arcId;
              FlowRepArc &source =
                  result.arcs[static_cast<std::size_t>(sourceArcId)];""",
              "FlowRep source identity")
          flow = replace_once(
              flow,
              """    ++result.resolvedEndpoints;
              record_diagnostic(
                  endpoint, source, family, sign, &trace,
                  hasTerminalTraceArc ? &terminalTraceArc : nullptr,
                  hasLastRepresentableTraceArc ? &lastRepresentableTraceArc : nullptr,
                  terminalFeatureRailOwnership, supportTraceId,
                  hasCommittedNetworkIntersection ? &committedNetworkIntersection
                                                  : nullptr,
                  skippedDegenerateSegments,
                  reachedIntrinsicNode ? FlowRepEndpointResolution::IntrinsicNode
                                       : FlowRepEndpointResolution::SegmentIntersection);""",
              """    ++result.resolvedEndpoints;
              // Appending generated connector arcs can reallocate result.arcs. Reacquire
              // the source by stable arc identity before recording committed evidence.
              const FlowRepArc &committedSource =
                  result.arcs[static_cast<std::size_t>(sourceArcId)];
              record_diagnostic(
                  endpoint, committedSource, family, sign, &trace,
                  hasTerminalTraceArc ? &terminalTraceArc : nullptr,
                  hasLastRepresentableTraceArc ? &lastRepresentableTraceArc : nullptr,
                  terminalFeatureRailOwnership, supportTraceId,
                  hasCommittedNetworkIntersection ? &committedNetworkIntersection
                                                  : nullptr,
                  skippedDegenerateSegments,
                  reachedIntrinsicNode ? FlowRepEndpointResolution::IntrinsicNode
                                       : FlowRepEndpointResolution::SegmentIntersection);""",
              "FlowRep committed diagnostic")
          flow_path.write_text(flow)

          repair_path = Path("src/geometry/SurfaceCellFeasibilityRepair.cpp")
          repair = repair_path.read_text()
          insertion_anchor = """  if (insertionCount.empty()) {
            result.complex = std::move(input);
            result.success = true;
            result.rollbackEquivalent = true;
            result.rollbackIdentityHashAfter = result.rollbackIdentityHashBefore;
            return result;
          }

          SurfaceCellComplex rebuilt;"""
          authoritative_scope = """  if (insertionCount.empty()) {
            result.complex = std::move(input);
            result.success = true;
            result.rollbackEquivalent = true;
            result.rollbackIdentityHashAfter = result.rollbackIdentityHashBefore;
            return result;
          }

          // A parity transaction must inherit one exact source chart scope from
          // each committed input cell. Derive it before moving or mutating any
          // ownership data. Frequency voting can select a scope absent from one
          // boundary edge and only discover the contradiction after rebuilding.
          using SourceScope = std::pair<int, int>;
          std::vector<SourceScope> authoritativeCellScopes(
              input.cells.size(), SourceScope{-1, -1});
          for (int cellIndex = 0; cellIndex < static_cast<int>(input.cells.size());
               ++cellIndex) {
            const SurfaceArrangementCell &cell =
                input.cells[static_cast<std::size_t>(cellIndex)];
            std::set<SourceScope> sharedScopes;
            bool firstBoundaryEdge = true;
            for (const int halfedgeId : cell.halfedges) {
              if (halfedgeId < 0 ||
                  halfedgeId >= static_cast<int>(input.halfedges.size())) {
                return returnCommittedFailure("InvalidCellHalfedge");
              }
              const SurfaceArrangementHalfedge &edge =
                  input.halfedges[static_cast<std::size_t>(halfedgeId)];
              std::set<SourceScope> edgeScopes;
              if (edge.sourceComponent >= 0 && edge.sourceSheet >= 0) {
                edgeScopes.emplace(edge.sourceComponent, edge.sourceSheet);
              }
              for (const SurfaceArrangementProvenance &entry : edge.provenance) {
                if (entry.sourceComponent >= 0 && entry.sourceSheet >= 0) {
                  edgeScopes.emplace(entry.sourceComponent, entry.sourceSheet);
                }
              }
              if (edgeScopes.empty()) {
                return returnCommittedFailure("MissingCellSourceScope");
              }
              if (firstBoundaryEdge) {
                sharedScopes = std::move(edgeScopes);
                firstBoundaryEdge = false;
              } else {
                std::set<SourceScope> intersection;
                std::set_intersection(
                    sharedScopes.begin(), sharedScopes.end(), edgeScopes.begin(),
                    edgeScopes.end(),
                    std::inserter(intersection, intersection.end()));
                sharedScopes = std::move(intersection);
              }
              if (sharedScopes.empty()) {
                return returnCommittedFailure("MixedCellSourceScope");
              }
            }
            if (firstBoundaryEdge || sharedScopes.empty()) {
              return returnCommittedFailure("MissingCellSourceScope");
            }
            authoritativeCellScopes[static_cast<std::size_t>(cellIndex)] =
                *sharedScopes.begin();
          }

          SurfaceCellComplex rebuilt;"""
          repair = replace_once(repair, insertion_anchor, authoritative_scope,
                                "authoritative parity scope precomputation")
          scope_pattern = re.compile(
              r"    std::map<std::pair<int, int>, int> scopeFrequency;\n"
              r".*?"
              r"    const auto selectedScope = std::max_element\(\n"
              r".*?"
              r"        \}\)->first;\n",
              re.DOTALL)
          scope_matches = list(scope_pattern.finditer(repair))
          if len(scope_matches) != 1:
              raise RuntimeError(
                  f"parity frequency scope: expected one match, found {len(scope_matches)}")
          repair = scope_pattern.sub(
              """    const SourceScope selectedScope =
                  authoritativeCellScopes[static_cast<std::size_t>(cellIndex)];
""",
              repair,
              count=1)
          repair_path.write_text(repair)

          descriptor_path = Path("src/geometry/PatchDescriptor.cpp")
          descriptor = descriptor_path.read_text()
          start = descriptor.find("bool exact_surface_point_equal(")
          end = descriptor.find("struct CachedCompletionProduct {", start)
          if start < 0 or end < 0:
              raise RuntimeError("completion dependency block markers not found")
          semantic_block = r'''using PatchCompletionDependencyIdentity = std::vector<std::int64_t>;

void append_completion_dependency_word(
    PatchCompletionDependencyIdentity &identity, const std::int64_t value) {
  identity.push_back(value);
}

void append_completion_dependency_values(
    PatchCompletionDependencyIdentity &identity,
    const std::vector<int> &values) {
  identity.push_back(static_cast<std::int64_t>(values.size()));
  for (const int value : values) {
    identity.push_back(value);
  }
}

void append_completion_dependency_set(
    PatchCompletionDependencyIdentity &identity,
    const std::set<int> &values) {
  identity.push_back(static_cast<std::int64_t>(values.size()));
  for (const int value : values) {
    identity.push_back(value);
  }
}

int completion_dependency_label(const std::vector<int> &values,
                                const std::size_t index) {
  return index < values.size() ? values[index] : -1;
}

void append_completion_dependency_point(
    PatchCompletionDependencyIdentity &identity, const PureQuadPatch &patch,
    const std::size_t index) {
  if (index >= patch.boundaryProvenance.size()) {
    identity.insert(identity.end(), {-1, -1, -1, -1, -1, -1, -1});
    return;
  }
  const SurfacePoint &point = patch.boundaryProvenance[index];
  identity.push_back(point.face);
  identity.push_back(point.component);
  identity.push_back(point.sheet);
  for (int coordinate = 0; coordinate < 3; ++coordinate) {
    identity.push_back(quantized_parameter(point.barycentric(coordinate)));
  }
  identity.push_back(completion_dependency_label(patch.boundaryRailIds, index));
  identity.push_back(completion_dependency_label(patch.boundaryCurveIds, index));
  identity.push_back(
      completion_dependency_label(patch.boundaryComponents, index));
  identity.push_back(completion_dependency_label(patch.boundarySheets, index));
}

PatchCompletionDependencyIdentity completion_dependency_side_record(
    const PatchDescriptor &descriptor, const std::vector<std::size_t> &offsets,
    const int sideIndex, const bool reversed) {
  PatchCompletionDependencyIdentity record;
  const PatchSideDescriptor &side =
      descriptor.sides[static_cast<std::size_t>(sideIndex)];
  const PureQuadPatch &patch = descriptor.patch;
  const int count =
      patch.sideEdgeCounts[static_cast<std::size_t>(sideIndex)];
  record.push_back(side.family);
  record.push_back(static_cast<std::int64_t>(side.halfedges.size()));
  record.push_back(static_cast<std::int64_t>(side.boundaryVertices.size()));
  record.push_back(side.subdivisionCount);
  record.push_back(side.hardFeature ? 1 : 0);
  record.push_back(count);
  int turn = sideIndex < static_cast<int>(patch.turns.size())
                 ? patch.turns[static_cast<std::size_t>(sideIndex)]
                 : 0;
  record.push_back(reversed ? -turn : turn);
  append_completion_dependency_set(record, side.railIds);
  append_completion_dependency_set(record, side.curveIds);
  record.push_back(count);
  for (int local = 0; local < count; ++local) {
    const int orientedLocal = reversed ? count - local - 1 : local;
    PatchCompletionDependencyIdentity point;
    append_completion_dependency_point(
        point, patch,
        offsets[static_cast<std::size_t>(sideIndex)] +
            static_cast<std::size_t>(orientedLocal));
    record.push_back(static_cast<std::int64_t>(point.size()));
    record.insert(record.end(), point.begin(), point.end());
  }
  return record;
}

PatchCompletionDependencyIdentity canonical_completion_boundary_dependency(
    const PatchDescriptor &descriptor) {
  const PureQuadPatch &patch = descriptor.patch;
  const int sideCount = static_cast<int>(descriptor.sides.size());
  const bool metadataShapeValid =
      sideCount > 0 &&
      patch.sideEdgeCounts.size() == descriptor.sides.size();
  std::vector<std::size_t> offsets(
      static_cast<std::size_t>(std::max(sideCount, 0)) + 1U, 0U);
  bool metadataValid = metadataShapeValid;
  if (metadataValid) {
    for (int side = 0; side < sideCount; ++side) {
      const int count = patch.sideEdgeCounts[static_cast<std::size_t>(side)];
      if (count < 0) {
        metadataValid = false;
        break;
      }
      offsets[static_cast<std::size_t>(side + 1)] =
          offsets[static_cast<std::size_t>(side)] +
          static_cast<std::size_t>(count);
    }
    metadataValid =
        metadataValid && offsets.back() == patch.boundaryProvenance.size();
  }

  if (!metadataValid) {
    PatchCompletionDependencyIdentity fallback;
    fallback.push_back(-1);
    fallback.push_back(
        static_cast<std::int64_t>(patch.boundaryProvenance.size()));
    for (std::size_t index = 0; index < patch.boundaryProvenance.size();
         ++index) {
      append_completion_dependency_point(fallback, patch, index);
    }
    append_completion_dependency_values(fallback, patch.sideEdgeCounts);
    append_completion_dependency_values(fallback, patch.turns);
    return fallback;
  }

  PatchCompletionDependencyIdentity canonical;
  bool initialized = false;
  for (const bool reversed : {false, true}) {
    for (int startSide = 0; startSide < sideCount; ++startSide) {
      PatchCompletionDependencyIdentity candidate;
      candidate.push_back(sideCount);
      for (int step = 0; step < sideCount; ++step) {
        const int sideIndex =
            reversed ? (startSide - step + sideCount) % sideCount
                     : (startSide + step) % sideCount;
        PatchCompletionDependencyIdentity record =
            completion_dependency_side_record(descriptor, offsets, sideIndex,
                                              reversed);
        candidate.push_back(static_cast<std::int64_t>(record.size()));
        candidate.insert(candidate.end(), record.begin(), record.end());
      }
      if (!initialized || candidate < canonical) {
        canonical = std::move(candidate);
        initialized = true;
      }
    }
  }
  return canonical;
}

PatchCompletionDependencyIdentity exact_patch_dependency_identity(
    const PatchDescriptor &descriptor) {
  PatchCompletionDependencyIdentity identity;
  const PureQuadPatch &patch = descriptor.patch;
  identity.insert(identity.end(),
                  {descriptor.feasibility.admissible ? 1 : 0,
                   static_cast<int>(descriptor.feasibility.reason),
                   descriptor.feasibility.expectedInteriorValence,
                   descriptor.boundaryCycleValid ? 1 : 0,
                   descriptor.featureConstraintsValid ? 1 : 0});

  std::vector<std::pair<int, int>> singularities;
  const std::size_t singularityCount = std::max(
      descriptor.singularSourceVertices.size(),
      descriptor.singularNumerators.size());
  singularities.reserve(singularityCount);
  for (std::size_t index = 0; index < singularityCount; ++index) {
    singularities.emplace_back(
        index < descriptor.singularSourceVertices.size()
            ? descriptor.singularSourceVertices[index]
            : -1,
        index < descriptor.singularNumerators.size()
            ? descriptor.singularNumerators[index]
            : 0);
  }
  std::sort(singularities.begin(), singularities.end());
  identity.push_back(static_cast<std::int64_t>(singularities.size()));
  for (const auto &[sourceVertex, numerator] : singularities) {
    identity.push_back(sourceVertex);
    identity.push_back(numerator);
  }

  PatchCompletionDependencyIdentity boundary =
      canonical_completion_boundary_dependency(descriptor);
  identity.push_back(static_cast<std::int64_t>(boundary.size()));
  identity.insert(identity.end(), boundary.begin(), boundary.end());

  std::vector<int> sourceFaces = patch.sourceFaces;
  std::sort(sourceFaces.begin(), sourceFaces.end());
  sourceFaces.erase(std::unique(sourceFaces.begin(), sourceFaces.end()),
                    sourceFaces.end());
  append_completion_dependency_values(identity, sourceFaces);
  identity.insert(identity.end(),
                  {patch.boundaryLoopCount,
                   patch.diskTopology ? 1 : 0,
                   patch.hardFeatureCrossing ? 1 : 0,
                   patch.singularityCount,
                   patch.singularIndexNumerator,
                   patch.unmatchedInteriorSingularity ? 1 : 0,
                   patch.simple ? 1 : 0});
  return identity;
}

bool exact_patch_dependency_equal(const PatchDescriptor &lhs,
                                  const PatchDescriptor &rhs) {
  return exact_patch_dependency_identity(lhs) ==
         exact_patch_dependency_identity(rhs);
}

std::uint64_t exact_patch_dependency_hash(const PatchDescriptor &descriptor) {
  std::uint64_t seed = 1469598103934665603ULL;
  for (const std::int64_t value :
       exact_patch_dependency_identity(descriptor)) {
    seed ^= static_cast<std::uint64_t>(value);
    seed *= 1099511628211ULL;
  }
  return seed;
}

'''
          descriptor = descriptor[:start] + semantic_block + descriptor[end:]
          descriptor_path.write_text(descriptor)

          test_path = Path("tests/FlowRepStrandsPhase15Tests.cpp")
          tests = test_path.read_text()
          test_name = "TEST(FlowRepStrandsPhase15,\n     EndpointCompletionExtendsToRetainedSameSheetNetwork)"
          test_start = tests.find(test_name)
          if test_start < 0:
              raise RuntimeError("FlowRep endpoint regression test not found")
          result_call = tests.find(
              "  const auto result = directional::geometry::complete_flow_rep_endpoints(",
              test_start)
          if result_call < 0:
              raise RuntimeError("FlowRep endpoint result call not found")
          tests = (tests[:result_call] +
                   "  // Force the first generated connector insertion to reallocate.\n"
                   "  // Diagnostics must reacquire the source arc by stable identity.\n"
                   "  arcs.shrink_to_fit();\n\n" +
                   tests[result_call:])
          test_path.write_text(tests)

          workflow_path = Path(".github/workflows/agent-build-recovered-p5.yml")
          workflow = workflow_path.read_text()
          workflow = workflow.replace(
              "P5-CB75 through P5-CB82",
              "P5-CB83 through P5-CB90")
          workflow = workflow.replace(
              "p5-cb82-mixed-sheet-liveness",
              "p5-cb90-parity-flowrep-reuse-rail")
          workflow_path.write_text(workflow)
          PY

      - name: Commit source changes
        shell: bash
        run: |
          git config user.name "directional-agent"
          git config user.email "directional-agent@users.noreply.github.com"
          git add \
            src/geometry/FlowRepStrands.cpp \
            src/geometry/SurfaceCellFeasibilityRepair.cpp \
            src/geometry/PatchDescriptor.cpp \
            tests/FlowRepStrandsPhase15Tests.cpp \
            .github/workflows/agent-build-recovered-p5.yml
          git commit -m "fix(surface-cells): harden FlowRep parity and completion reuse"
          git push origin HEAD:agent/surface_cell_quad/p5-recover-bridge-healing
