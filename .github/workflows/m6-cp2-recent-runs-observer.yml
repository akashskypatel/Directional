name: M6 CP2 Recent Runs Observer

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m6-cp2-recent-runs-observer.txt

permissions:
  actions: read
  contents: write

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/m6-cp2-recent-runs-observer.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  collect:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-recent-workflow-runs-reusable.yml
    with:
      per_page: 50
      max_pages: 1
      branch: agent/surface_cell_quad/p5-recover-bridge-healing
      event: push
      created: ">=2026-10-05T18:00:00Z"
    secrets: inherit

  mailbox:
    if: ${{ always() }}
    needs: [validate, collect]
    permissions:
      actions: read
      contents: write
    uses: ./.github/workflows/workflow-mailbox-publisher.yml
    with:
      workflow_key: m6-cp2-recent-runs-observer
      source_sha: ${{ github.sha }}
      source_ref: ${{ github.ref }}
      result: ${{ needs.collect.result }}
      summary: M6 CP2 recent workflow run inventory.
