name: M3 CP4c0b TB S1 Closeout Apply

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m3-cp4c0b-tb-s1-closeout/run.txt

permissions:
  actions: read
  contents: write
  id-token: write
  issues: write
  pull-requests: write

concurrency:
  group: m3-cp4c0b-tb-s1-closeout-${{ github.ref }}
  cancel-in-progress: false

jobs:
  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      report_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_run_file: false
      label: m3-cp4c0b-tb-s1-closeout
      trim_stale_comments: true
    secrets: inherit

  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/agent-m3-cp4c0b-tb-s1-closeout.yml
      retention_days: 7
    secrets: inherit

  apply:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1pGwa4Eghwb6CtOZvSplTNbvR0tMPgjfK
      patch_sha256: f835ece011f78f3356a3655c4ea309fb0f6cd1816c2e61db2e9ee6b078fe6631
      base_sha: 77832e1b789eb5735c0b393f21476fbd7e73676b
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: "docs: close M3 CP4c0b TB S1 execution"
      retention_days: 7
    secrets: inherit
