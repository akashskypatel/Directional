name: M3 CP4c-3 CB33 Harness Preflight

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m3-cp4c-3-cb33-preflight.txt

permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: m3-cp4c-3-cb33-preflight
  cancel-in-progress: false

jobs:
  validate-caller:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/m3-cp4c-3-cb33-preflight.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m3-cp4c-3-cb33-preflight
      commit_run_file: false
    secrets: inherit

  preflight:
    needs: validate-caller
    if: ${{ needs.validate-caller.outputs.valid == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Initialize diagnostic log
        shell: bash
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/m3-cp4c-3-cb33-preflight-caller.log"
          : > "$log"
          printf '%s\n' \
            "workflow=${GITHUB_WORKFLOW}" \
            "run_id=${GITHUB_RUN_ID}" \
            "event=${GITHUB_EVENT_NAME}" \
            "event_sha=${GITHUB_SHA}" \
            "ref=${GITHUB_REF}" \
            "repository=${GITHUB_REPOSITORY}" \
            'turn=M3-CP4c-3-CB33' \
            'runtimeExecution=false' \
            "started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" | tee -a "$log"

      - name: Checkout exact control source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Run artifact-only harness preflight
        id: preflight
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/m3-cp4c-3-cb33-preflight-caller.log"
          harness='.agents/Directional/tools/m3_cp4c3_tb28_r3_harness.sh'
          test -x "$harness"
          echo "control_sha=$(git rev-parse HEAD)" | tee -a "$log"
          echo "harness_sha256=$(sha256sum "$harness" | awk '{print $1}')" | tee -a "$log"
          git status --short | tee -a "$log"
          set +e
          "$harness" --preflight-only
          status=$?
          set -e
          echo "harness_preflight_exit=${status}" | tee -a "$log"
          test "$status" -eq 0
          boundary="${RUNNER_TEMP}/m3-cp4c3-tb28-r3-result/execution-boundary.txt"
          test -f "$boundary"
          grep -Fxq 'script_exit=0' "$boundary"
          grep -Fxq 'mode=--preflight-only' "$boundary"
          grep -Fxq 'runtime_started=false' "$boundary"
          grep -Fxq 'runtime_completed=false' "$boundary"
          grep -Fxq 'preflight_completed=true' "$boundary"
          grep -Fxq 'execution_view_verified=true' "$boundary"
          grep -Fxq 'orchestration_failure=false' "$boundary"
          grep -Fxq 'configure_execution=false' "$boundary"
          grep -Fxq 'compile_execution=false' "$boundary"
          grep -Fxq 'relink_execution=false' "$boundary"
          grep -Fxq 'generated_discovery=false' "$boundary"
          grep -Fxq 'package_repair=false' "$boundary"
          grep -Fxq 'mode_repair=false' "$boundary"
          grep -Fxq 'source_test_fixture_selector_mutation=false' "$boundary"
          grep -Fxq 'benchmark_execution=false' "$boundary"
          result="${RUNNER_TEMP}/m3-cp4c3-tb28-r3-result"
          test "$(($(wc -l < "$result/identity-map.tsv") - 1))" -eq 407
          test "$(($(wc -l < "$result/runtime-executables.tsv") - 1))" -eq 6
          grep -Fxq 'package_census_equal=true' "$result/package-immutability.txt"
          grep -Fxq 'source_census_equal=true' "$result/source-immutability.txt"
          grep -Fxq 'execution_view_census_equal=true' "$result/execution-view-immutability.txt"
          echo 'cb33_preflight_verified=true' | tee -a "$log"

      - name: Record final source status
        if: always()
        shell: bash
        run: |
          set +e
          log="${RUNNER_TEMP}/m3-cp4c-3-cb33-preflight-caller.log"
          {
            echo "final_job_status=${{ job.status }}"
            echo "final_sha=$(git rev-parse HEAD 2>/dev/null || echo unavailable)"
            git status --short 2>&1 || true
            echo "finished_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } | tee -a "$log"

      - name: Upload preflight result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-cp4c-3-cb33-preflight-result-${{ github.run_id }}
          path: ${{ runner.temp }}/m3-cp4c3-tb28-r3-result
          if-no-files-found: error
          retention-days: 14

      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-cp4c-3-cb33-preflight-log-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/m3-cp4c-3-cb33-preflight-caller.log
            ${{ runner.temp }}/m3-cp4c3-tb28-r3.log
          if-no-files-found: error
          retention-days: 14
