name: m1i-artifact-only-heavy

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - '.agents/connector-triggers/m1i-artifact-only-heavy'

permissions:
  contents: read
  actions: read

concurrency:
  group: m1i-artifact-only-heavy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  heavy:
    strategy:
      fail-fast: false
      matrix:
        case: [bunny, vase]
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      CASE: ${{ matrix.case }}
      RESULT_ARTIFACT_ID: '9072101943'
      RESULT_SHA256: 'e30860e5ec411dc4dc446d0a4dc65ce6f15c5784a6f5daca138ab44d7196bf25'
      MANIFEST_SHA256: 'f5614100e1638990d46c7c8fa3d7c720c837dfae1ae515387977d4c0b9e9cac3'
      IMPLEMENTATION: 'b037157921094604f1b0c17f9c8b7076c7604b3b'
      SOURCE_PARENT: '48614f383111c96fce1e69871b66199d94033d11'
      PRODUCER_SHA256: '51f8af77c71b7607889a2379910892027464517b557c713c34411469ee7c5a5d'
    steps:
      - name: Initialize persistent activity log
        shell: bash
        run: |
          set -Eeuo pipefail
          ROOT="$RUNNER_TEMP/m1i-heavy-$CASE"
          mkdir -p "$ROOT/evidence"
          LOG="$ROOT/activity.log"
          {
            echo "timestamp=$(date -u +%FT%TZ)"
            echo "repository=$GITHUB_REPOSITORY"
            echo "event=$GITHUB_EVENT_NAME"
            echo "ref=$GITHUB_REF"
            echo "event_sha=$GITHUB_SHA"
            echo "case=$CASE"
            echo "runner_os=$RUNNER_OS"
            uname -a
            python3 --version
            unzip -v | head -2
            sha256sum --version | head -1
          } > "$LOG"

      - name: Exact artifact preflight, bounded runtime, and postflight
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          ROOT="$RUNNER_TEMP/m1i-heavy-$CASE"
          LOG="$ROOT/activity.log"
          EVIDENCE="$ROOT/evidence"
          exec > >(tee -a "$LOG") 2>&1
          trap 'rc=$?; echo "final_rc=$rc"; echo "final_timestamp=$(date -u +%FT%TZ)"; df -h . || true; exit $rc' EXIT

          ZIP="$ROOT/result.zip"
          PKG="$ROOT/package-$(python3 - <<'PY'
import secrets
print(secrets.token_hex(6))
PY
)"
          RUN_CWD="$ROOT/runtime-cwd"
          mkdir -p "$PKG" "$RUN_CWD"

          echo '=== download exact immutable result artifact ==='
          curl --fail --location --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$RESULT_ARTIFACT_ID/zip" \
            -o "$ZIP"
          actual_zip=$(sha256sum "$ZIP" | awk '{print $1}')
          echo "result_zip_sha256=$actual_zip" | tee "$EVIDENCE/preflight.txt"
          test "$actual_zip" = "$RESULT_SHA256"

          echo '=== reject unsafe archive members ==='
          python3 - "$ZIP" <<'PY'
import pathlib, sys, zipfile
with zipfile.ZipFile(sys.argv[1]) as z:
    for info in z.infolist():
        p = pathlib.PurePosixPath(info.filename)
        if p.is_absolute() or '..' in p.parts:
            raise SystemExit(f'unsafe archive member: {info.filename}')
print('archive_paths_safe=true')
PY

          unzip -q "$ZIP" -d "$PKG"
          cd "$PKG"

          echo '=== immutable package preflight ==='
          manifest_sha=$(sha256sum SHA256SUMS | awk '{print $1}')
          echo "manifest_sha256=$manifest_sha" | tee -a "$EVIDENCE/preflight.txt"
          test "$manifest_sha" = "$MANIFEST_SHA256"
          sha256sum -c SHA256SUMS | tee "$EVIDENCE/preflight-manifest.txt"
          test "$(wc -l < "$EVIDENCE/preflight-manifest.txt")" -eq 72
          test "$(grep -c ': OK$' "$EVIDENCE/preflight-manifest.txt")" -eq 72

          regular=$(find . -type f | wc -l)
          executables=$(find bin -maxdepth 1 -type f -perm -111 | wc -l)
          libraries=$(find lib -maxdepth 1 -type f | wc -l)
          fixtures=$(find test-data -type f | wc -l)
          symlinks=$(find . -type l | wc -l)
          printf 'regular_files=%s\nexecutables=%s\nlibraries=%s\nfixtures=%s\nsymlinks=%s\n' \
            "$regular" "$executables" "$libraries" "$fixtures" "$symlinks" | tee -a "$EVIDENCE/preflight.txt"
          test "$regular" -eq 73
          test "$executables" -eq 7
          test "$libraries" -eq 2
          test "$fixtures" -eq 27
          test "$symlinks" -eq 0
          test ! -e bin/test-data
          test ! -L bin/test-data

          jq -e \
            --arg impl "$IMPLEMENTATION" \
            --arg parent "$SOURCE_PARENT" \
            '.implementationCommit == $impl and
             .sourceParent == $parent and
             .runId == "31411770135" and
             .configuration == "Release" and
             .generator == "Ninja" and
             .sharedLibraries == false and
             .gtestDiscoveryMode == "PRE_TEST" and
             .runtimeExecution == false and
             .testExecution == false and
             .benchmarkExecution == false and
             .ctestExecution == false and
             .cliExecution == false and
             .fuzzerExecution == false and
             .customInputExecution == false' metadata/build-authority.json >/dev/null

          test "$(cat metadata/tracing-header-blob.txt)" = '4036b16a3dc7e20369a9cd65a4422c61be58afb4'
          test "$(cat metadata/tracing-blob.txt)" = '33a41e70e240f198eaa49184c3a87773986b84cb'
          test "$(cat metadata/pipeline-blob.txt)" = '601d02b7560e489246e30e1fa572f8ac2d6d1250'
          test "$(cat metadata/phase10-test-blob.txt)" = 'f63396f54e70d3c106cd2acbc4758e9d4fb1dda0'
          test "$(cat metadata/fixture-paths-blob.txt)" = '4a981f772ee70780d0011696010a0e1b8bef6972'
          producer_sha=$(sha256sum bin/directional_surface_cell_producer_tests | awk '{print $1}')
          echo "producer_sha256=$producer_sha" | tee -a "$EVIDENCE/preflight.txt"
          test "$producer_sha" = "$PRODUCER_SHA256"
          echo 'fixtureSymlink=false' | tee -a "$EVIDENCE/preflight.txt"

          echo '=== bounded runtime ==='
          PROD="$PKG/bin/directional_surface_cell_producer_tests"
          if [ "$CASE" = bunny ]; then
            TEST='UniformPhaseFront/SurfaceCellDesignAcceptance.ProducesDirectSourceAuthoritativePureQuadOutput/BunnyRandom'
            LIMIT=120
          else
            TEST='UniformPhaseFront/SurfaceCellDesignAcceptance.ProducesDirectSourceAuthoritativePureQuadOutput/Vase'
            LIMIT=60
          fi
          set +e
          (cd "$RUN_CWD" && /usr/bin/time -f 'WALL=%e RSS_KB=%M RC=%x' -o "$EVIDENCE/runtime.time" \
            timeout "${LIMIT}s" "$PROD" --gtest_filter="$TEST" > "$EVIDENCE/runtime.out" 2>&1)
          runtime_rc=$?
          set -e
          echo "runtime_rc=$runtime_rc" | tee "$EVIDENCE/runtime-summary.txt"
          cat "$EVIDENCE/runtime.time" | tee -a "$EVIDENCE/runtime-summary.txt" || true
          grep -F '[==========] Running 1 test from 1 test suite.' "$EVIDENCE/runtime.out" >/dev/null

          if [ "$CASE" = bunny ]; then
            test "$runtime_rc" -eq 1
            grep -F 'TerminalFailureObserved:NotProductionReady:completion' "$EVIDENCE/runtime.out" >/dev/null
            grep -F 'terminal=NotProductionReady:completion traceSegments=170831 arrangementCells=0 completedQuads=0' "$EVIDENCE/runtime.out" >/dev/null
            oracle_line=$(grep -n -F 'Value of: independentOracle.ok()' "$EVIDENCE/runtime.out" | head -1 | cut -d: -f1)
            success_line=$(grep -n -F 'Value of: result.success' "$EVIDENCE/runtime.out" | head -1 | cut -d: -f1)
            test -n "$oracle_line"
            test -n "$success_line"
            test "$oracle_line" -lt "$success_line"
            echo 'classification=known-red NotProductionReady:completion; independent oracle precedes product-success assertion' | tee -a "$EVIDENCE/runtime-summary.txt"
          else
            test "$runtime_rc" -eq 124
            grep -F '[ RUN      ] UniformPhaseFront/SurfaceCellDesignAcceptance.ProducesDirectSourceAuthoritativePureQuadOutput/Vase' "$EVIDENCE/runtime.out" >/dev/null
            echo 'classification=bounded safety-only timeout at 60s; no correctness/nontermination inference' | tee -a "$EVIDENCE/runtime-summary.txt"
          fi

          echo '=== exact postflight ==='
          actual_zip_after=$(sha256sum "$ZIP" | awk '{print $1}')
          manifest_sha_after=$(sha256sum SHA256SUMS | awk '{print $1}')
          producer_sha_after=$(sha256sum bin/directional_surface_cell_producer_tests | awk '{print $1}')
          printf 'result_zip_sha256=%s\nmanifest_sha256=%s\nproducer_sha256=%s\n' \
            "$actual_zip_after" "$manifest_sha_after" "$producer_sha_after" | tee "$EVIDENCE/postflight.txt"
          test "$actual_zip_after" = "$RESULT_SHA256"
          test "$manifest_sha_after" = "$MANIFEST_SHA256"
          sha256sum -c SHA256SUMS | tee "$EVIDENCE/postflight-manifest.txt"
          test "$(wc -l < "$EVIDENCE/postflight-manifest.txt")" -eq 72
          test "$(grep -c ': OK$' "$EVIDENCE/postflight-manifest.txt")" -eq 72
          test "$(find . -type f | wc -l)" -eq 73
          test "$(find bin -maxdepth 1 -type f -perm -111 | wc -l)" -eq 7
          test "$(find lib -maxdepth 1 -type f | wc -l)" -eq 2
          test "$(find test-data -type f | wc -l)" -eq 27
          test "$(find . -type l | wc -l)" -eq 0
          test ! -e bin/test-data
          test ! -L bin/test-data
          test "$producer_sha_after" = "$PRODUCER_SHA256"
          echo 'fixtureSymlink=false' | tee -a "$EVIDENCE/postflight.txt"
          echo 'heavy_artifact_only_validation=complete' | tee -a "$EVIDENCE/runtime-summary.txt"

      - name: Upload heavy evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m1i-heavy-${{ matrix.case }}-evidence
          path: ${{ runner.temp }}/m1i-heavy-${{ matrix.case }}/evidence
          if-no-files-found: error
          retention-days: 14

      - name: Upload dedicated diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m1i-heavy-${{ matrix.case }}-logs
          path: ${{ runner.temp }}/m1i-heavy-${{ matrix.case }}/activity.log
          if-no-files-found: error
          retention-days: 14
