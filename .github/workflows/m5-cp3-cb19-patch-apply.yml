name: M5 CP3 CB19 Patch Apply

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m5-cp3-cb19-patch-apply/trigger.txt

permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

concurrency:
  group: m5-cp3-cb19-patch-apply-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/m5-cp3-cb19-patch-apply.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m5-cp3-cb19-patch-apply
      commit_run_file: false
    secrets: inherit

  apply:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1JMKjNQM4R11gBbsJk--hI8oufa36sR7a
      patch_sha256: 2efa14019320f0bc18caf939aeef6bb3899365933c4194717f0e0abad09f211c
      base_sha: 8d524eb057101903deb82fb9cf2b767a6b80a1a7
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: 'test: resolve produced periodic semantics'
    secrets: inherit
