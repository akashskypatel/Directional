name: Agent M3 CP4c-0b CB1 S2-S6 Package Compile

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m3-cp4c0b-cb1-s2s6-package/run.txt

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: agent-m3-cp4c0b-cb1-s2s6-package
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/agent-m3-cp4c0b-cb1-s2s6-package.yml
    secrets: inherit

  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m3-cp4c0b-cb1-s2s6-package
      commit_run_file: false
    secrets: inherit

  package:
    needs: validate
    uses: ./.github/workflows/agent-compile-reusable.yml
    with:
      source_sha: 737f93be10a73db950e2a7f823b96ffb0d59cf4d
      targets: directional_core directional_pipeline directional_surface_cell_authority_kernel_tests directional_surface_cell_producer_tests directional_surface_cell_completion_tests directional_surface_cell_validation_tests directional_compiled_api_tests directional_benchmarks
      artifact_prefix: m3-cp4c0b-cb1-s2s6-package
    secrets: inherit
