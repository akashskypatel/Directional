name: t1-independent-test-oracle-foundation-code-build

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - '.agents/connector-triggers/t1-independent-test-oracle-foundation-code-build'

permissions:
  contents: read
  actions: read

concurrency:
  group: t1-independent-test-oracle-foundation-code-build-${{ github.ref }}
  cancel-in-progress: false

env:
  LOG_DIR: /tmp/t1-independent-test-oracle-foundation-code-build-logs
  ACTIVITY_LOG: /tmp/t1-independent-test-oracle-foundation-code-build-logs/activity.log
  IMPLEMENTATION_COMMIT: 6d1922dd57db76dcc4c19056fdd3573a713dde61
  ENTERING_BRANCH_HEAD: ccda7a0c55e38dc0ca7c5c9fa6b5e86bc82bbae8
  ENTERING_RUNTIME_ARTIFACT: '9031804178'

jobs:
  code-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Initialize unconditional activity log
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$LOG_DIR"
          finish() {
            rc=$?
            trap - EXIT
            {
              echo "step=initialize"
              echo "exit_code=$rc"
              echo "finished_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            } >> "$ACTIVITY_LOG"
            exit "$rc"
          }
          trap finish EXIT
          {
            echo "turn=T1 independent test-oracle foundation Code+Build"
            echo "run_id=$GITHUB_RUN_ID"
            echo "run_attempt=$GITHUB_RUN_ATTEMPT"
            echo "event=$GITHUB_EVENT_NAME"
            echo "event_sha=$GITHUB_SHA"
            echo "event_ref=$GITHUB_REF"
            echo "repository=$GITHUB_REPOSITORY"
            echo "runner_os=$RUNNER_OS"
            echo "runner_temp=$RUNNER_TEMP"
            echo "implementation_commit=$IMPLEMENTATION_COMMIT"
            echo "entering_branch_head=$ENTERING_BRANCH_HEAD"
            echo "entering_runtime_artifact=$ENTERING_RUNTIME_ARTIFACT"
            echo "runtimeExecution=false"
            echo "reviewPolicy=never"
            echo "allowed=verify exact source, configure, compile/link eight approved targets, static manifest, package/checksum"
            echo "prohibited=tests, benchmarks, generated Directional binaries, ctest/discovery, CLI, GUI, help/list/version/custom-input execution"
            echo "started_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } | tee "$ACTIVITY_LOG"

      - name: Checkout exact working branch
        uses: actions/checkout@v4
        with:
          ref: agent/surface_cell_quad/p5-recover-bridge-healing
          fetch-depth: 50
          submodules: false

      - name: Verify exact implementation and allowlist
        shell: bash
        run: |
          set -Eeuo pipefail
          exec > >(tee -a "$ACTIVITY_LOG") 2>&1
          finish() {
            rc=$?
            trap - EXIT
            echo "step=verify-source exit_code=$rc finished_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            exit "$rc"
          }
          trap finish EXIT

          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$IMPLEMENTATION_COMMIT" "$GITHUB_SHA"
          test -z "$(git status --porcelain=v1)"

          mapfile -t changed < <(
            git diff --name-only "$ENTERING_BRANCH_HEAD" "$IMPLEMENTATION_COMMIT" |
              LC_ALL=C sort
          )
          expected_changed=(
            .agents/Directional/Test_Architecture_T1_Independent_Oracle_Foundation_Code_Build_Report.md
            TODO
            cmake/DirectionalTests.cmake
            tests/SurfaceCellDesignAcceptanceTests.cpp
            tests/SurfaceCellProductOracleTests.cpp
            tests/support/SurfaceCellProductOracle.cpp
            tests/support/SurfaceCellProductOracle.h
          )
          printf 'implementation_changed=%s\n' "${changed[*]}"
          test "${#changed[@]}" -eq "${#expected_changed[@]}"
          for i in "${!expected_changed[@]}"; do
            test "${changed[$i]}" = "${expected_changed[$i]}"
          done

          mapfile -t event_overlay < <(
            git diff --name-only "$IMPLEMENTATION_COMMIT" "$GITHUB_SHA" |
              LC_ALL=C sort
          )
          expected_overlay=(
            .agents/connector-triggers/t1-independent-test-oracle-foundation-code-build
            .github/workflows/t1-independent-test-oracle-foundation-code-build.yml
          )
          printf 'event_overlay=%s\n' "${event_overlay[*]}"
          test "${#event_overlay[@]}" -eq "${#expected_overlay[@]}"
          for i in "${!expected_overlay[@]}"; do
            test "${event_overlay[$i]}" = "${expected_overlay[$i]}"
          done

          check_blob() {
            local path="$1" expected="$2"
            local actual
            actual=$(git hash-object "$path")
            echo "source_blob $path=$actual"
            test "$actual" = "$expected"
          }
          check_blob cmake/DirectionalTests.cmake 1a951f040e9a9d90ae45bcfd0891ef1ca1758eb1
          check_blob tests/SurfaceCellDesignAcceptanceTests.cpp 0cef4afa8d12606bab11e2f2aba2313df1f99e47
          check_blob tests/SurfaceCellProductOracleTests.cpp 28932c8c2dbe844b62f8fe848e6ebb9ef67550de
          check_blob tests/support/SurfaceCellProductOracle.cpp e3b04f4c45ab9acaa078c29defb868326db504dd
          check_blob tests/support/SurfaceCellProductOracle.h 6d3130238bb283e56e42cdf2f4864f5cb8f567d1
          check_blob .agents/Directional/Test_Architecture_T1_Independent_Oracle_Foundation_Code_Build_Report.md 0584f1232ca16c2be819686d75a4ea86999f485b
          check_blob TODO 92d02d9cf8a27e1ddbe68fb3aa6ebfe41692f864

          git diff --exit-code "$IMPLEMENTATION_COMMIT" -- \
            cmake/DirectionalTests.cmake \
            tests/SurfaceCellDesignAcceptanceTests.cpp \
            tests/SurfaceCellProductOracleTests.cpp \
            tests/support/SurfaceCellProductOracle.cpp \
            tests/support/SurfaceCellProductOracle.h
          ! grep -REn \
            'SourceAuthoritativeMeshValidator|evaluate_benchmark_quality|benchmark_output_(semantic|structural)_hash' \
            tests/support/SurfaceCellProductOracle.cpp \
            tests/support/SurfaceCellProductOracle.h \
            tests/SurfaceCellProductOracleTests.cpp
          test "$(grep -c 'ASSERT_TRUE(result.success)' tests/SurfaceCellDesignAcceptanceTests.cpp)" -eq 1
          test "$(grep -c 'inspect_surface_cell_product' tests/SurfaceCellDesignAcceptanceTests.cpp)" -eq 1
          test "$(grep -c '^TEST(' tests/SurfaceCellProductOracleTests.cpp)" -eq 29
          echo "BUILD_COMMIT=$GITHUB_SHA" >> "$GITHUB_ENV"

      - name: Install compile prerequisites
        shell: bash
        run: |
          set -Eeuo pipefail
          exec > >(tee -a "$ACTIVITY_LOG") 2>&1
          finish() {
            rc=$?
            trap - EXIT
            echo "step=install-prerequisites exit_code=$rc finished_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            exit "$rc"
          }
          trap finish EXIT
          sudo apt-get update
          sudo apt-get install -y ninja-build libgmp-dev xz-utils time

      - name: Fetch shallow submodules
        shell: bash
        run: |
          set -Eeuo pipefail
          exec > >(tee -a "$ACTIVITY_LOG") 2>&1
          finish() {
            rc=$?
            trap - EXIT
            echo "step=fetch-submodules exit_code=$rc finished_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            exit "$rc"
          }
          trap finish EXIT
          git submodule update --init --depth 1
          git submodule status | tee "$LOG_DIR/submodules.txt"

      - name: Configure Release static compile-only build
        shell: bash
        run: |
          set -Eeuo pipefail
          exec > >(tee -a "$ACTIVITY_LOG") 2>&1
          finish() {
            rc=$?
            trap - EXIT
            echo "step=configure exit_code=$rc finished_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            exit "$rc"
          }
          trap finish EXIT
          {
            echo "implementation_commit=$IMPLEMENTATION_COMMIT"
            echo "build_commit=$BUILD_COMMIT"
            echo "compile_head=$(git rev-parse HEAD)"
            git --version
            bash --version | head -n 1
            cmake --version
            c++ --version
            ninja --version
          } | tee "$LOG_DIR/toolchain.txt"
          test "$(git rev-parse HEAD)" = "$BUILD_COMMIT"
          cmake -S . -B agent-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DCMAKE_GTEST_DISCOVER_TESTS_DISCOVERY_MODE=PRE_TEST \
            -DBUILD_SHARED_LIBS=OFF \
            -DBUILD_TUTORIALS=OFF \
            -DBUILD_PYTHON=OFF \
            -DDIRECTIONAL_BUILD_CLI=OFF \
            -DDIRECTIONAL_BUILD_GUI=OFF \
            -DDIRECTIONAL_BUILD_BENCHMARKS=ON \
            -DDIRECTIONAL_BUILD_TESTS=ON \
            -DDIRECTIONAL_BUILD_HISTORICAL_TESTS=OFF \
            -DDIRECTIONAL_BUILD_LEGACY_INTEGRATION_TESTS=OFF \
            -DDIRECTIONAL_BUILD_OPTIONAL_GUIDANCE_TESTS=OFF \
            -DDIRECTIONAL_ENABLE_GMP=ON \
            -DDIRECTIONAL_ENABLE_PARDISO=OFF \
            -DDIRECTIONAL_ENABLE_CUDSS=OFF \
            -DDIRECTIONAL_ENABLE_SUITESPARSE=OFF \
            2>&1 | tee "$LOG_DIR/configure.log"

      - name: Compile eight approved targets only
        shell: bash
        run: |
          set -Eeuo pipefail
          exec > >(tee -a "$ACTIVITY_LOG") 2>&1
          finish() {
            rc=$?
            trap - EXIT
            {
              echo "step=compile exit_code=$rc finished_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
              echo "git_status_begin"
              git status --short --branch || true
              echo "git_status_end"
              echo "disk_usage_begin"
              df -h . || true
              echo "disk_usage_end"
            } >> "$ACTIVITY_LOG"
            exit "$rc"
          }
          trap finish EXIT
          test "$(git rev-parse HEAD)" = "$BUILD_COMMIT"
          /usr/bin/time -v -o "$LOG_DIR/build-resources.txt" \
            cmake --build agent-build --parallel 2 --target \
              directional_core \
              directional_pipeline \
              directional_compiled_api_tests \
              directional_surface_cell_producer_tests \
              directional_surface_cell_oracle_tests \
              directional_surface_cell_completion_tests \
              directional_surface_cell_validation_tests \
              directional_benchmarks \
            2>&1 | tee "$LOG_DIR/build.log"
          cat "$LOG_DIR/build-resources.txt"
          echo "compile_only_gate=passed"
          echo "approved_target_count=8"
          echo "runtimeExecution=false"

      - name: Package immutable compile artifact
        shell: bash
        run: |
          set -Eeuo pipefail
          exec > >(tee -a "$ACTIVITY_LOG") 2>&1
          finish() {
            rc=$?
            trap - EXIT
            echo "step=package exit_code=$rc finished_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            exit "$rc"
          }
          trap finish EXIT
          artifact_root="$GITHUB_WORKSPACE/t1-independent-test-oracle-foundation-code-build-artifact"
          rm -rf "$artifact_root"
          mkdir -p "$artifact_root"/{bin,lib,test-data/benchmarks,logs,metadata,source}

          cp agent-build/directional_benchmarks "$artifact_root/bin/"
          cp agent-build/directional_compiled_api_tests "$artifact_root/bin/"
          cp agent-build/directional_surface_cell_producer_tests "$artifact_root/bin/"
          cp agent-build/directional_surface_cell_oracle_tests "$artifact_root/bin/"
          cp agent-build/directional_surface_cell_completion_tests "$artifact_root/bin/"
          cp agent-build/directional_surface_cell_validation_tests "$artifact_root/bin/"
          cp agent-build/libdirectional_core.a "$artifact_root/lib/"
          cp agent-build/libdirectional_pipeline.a "$artifact_root/lib/"
          test "$(find "$artifact_root/bin" -maxdepth 1 -type f | wc -l)" -eq 6
          test "$(find "$artifact_root/lib" -maxdepth 1 -type f | wc -l)" -eq 2

          test "$(find benchmarks/fixtures -type f | wc -l)" -eq 27
          cp -a benchmarks/fixtures "$artifact_root/test-data/benchmarks/"
          cp "$ACTIVITY_LOG" "$LOG_DIR/configure.log" "$LOG_DIR/build.log" \
            "$LOG_DIR/build-resources.txt" "$LOG_DIR/toolchain.txt" \
            "$LOG_DIR/submodules.txt" "$artifact_root/logs/"
          cp agent-build/compile_commands.json "$artifact_root/source/"

          changed_paths=(
            .agents/Directional/Test_Architecture_T1_Independent_Oracle_Foundation_Code_Build_Report.md
            TODO
            cmake/DirectionalTests.cmake
            tests/SurfaceCellDesignAcceptanceTests.cpp
            tests/SurfaceCellProductOracleTests.cpp
            tests/support/SurfaceCellProductOracle.cpp
            tests/support/SurfaceCellProductOracle.h
          )
          git diff --full-index --binary "$ENTERING_BRANCH_HEAD" \
            "$IMPLEMENTATION_COMMIT" -- "${changed_paths[@]}" > \
            "$artifact_root/source/t1-independent-test-oracle-foundation.patch"
          git archive --format=tar "$IMPLEMENTATION_COMMIT" | xz -T0 > \
            "$artifact_root/source/directional-t1-independent-test-oracle-foundation-source-no-deps.tar.xz"

          cat > "$artifact_root/metadata/oracle-test-names.txt" <<'EOF'
          target=directional_surface_cell_oracle_tests
          labels=contract-required;oracle-mutation
          expected_test_count=29
          Oracle.SurfaceCellProductOraclePositive.AcceptsIndependentMinimalDisk
          Oracle.SurfaceCellProductOracleSchema.RejectsEmptyOutput
          Oracle.SurfaceCellProductOracleSchema.RejectsInvalidVertexShape
          Oracle.SurfaceCellProductOracleSchema.RejectsInvalidSourceIndexDomain
          Oracle.SurfaceCellProductOracleSchema.RejectsNonFiniteVertex
          Oracle.SurfaceCellProductOracleSchema.RejectsOutOfRangeOutputIndex
          Oracle.SurfaceCellProductOracleSchema.RejectsNonQuadFaceDegree
          Oracle.SurfaceCellProductOracleSchema.RejectsDegreeMetadataMismatch
          Oracle.SurfaceCellProductOracleFaces.RejectsRepeatedCorner
          Oracle.SurfaceCellProductOracleFaces.RejectsScaleRelativeZeroArea
          Oracle.SurfaceCellProductOracleFaces.RejectsCyclicOrReversedDuplicateFace
          Oracle.SurfaceCellProductOracleIncidence.RejectsEdgeWithMoreThanTwoFaces
          Oracle.SurfaceCellProductOracleIncidence.RejectsEqualSharedEdgeDirection
          Oracle.SurfaceCellProductOracleIncidence.RejectsBrokenBoundaryCycle
          Oracle.SurfaceCellProductOracleTopology.RejectsChangedComponentAndEulerStructure
          Oracle.SurfaceCellProductOracleLineage.RejectsMissingVertexProvenance
          Oracle.SurfaceCellProductOracleLineage.RejectsOutOfDomainVertexProvenance
          Oracle.SurfaceCellProductOracleLineage.RejectsMissingVertexLineage
          Oracle.SurfaceCellProductOracleLineage.RejectsDuplicateVertexLineage
          Oracle.SurfaceCellProductOracleLineage.RejectsOutOfDomainSourceFace
          Oracle.SurfaceCellProductOracleLineage.RejectsMissingFaceLineage
          Oracle.SurfaceCellProductOracleLineage.RejectsDuplicateFaceLineage
          Oracle.SurfaceCellProductOracleLineage.RejectsInvalidFaceSourceDomain
          Oracle.SurfaceCellProductOracleDisposition.RejectsBackendCorruption
          Oracle.SurfaceCellProductOracleDisposition.RejectsFallbackCorruption
          Oracle.SurfaceCellProductOracleDisposition.RejectsRecoveryCorruption
          Oracle.SurfaceCellProductOracleDisposition.RejectsOutputOriginCorruption
          Oracle.SurfaceCellProductOracleDisposition.RejectsTerminalFailureCorruption
          Oracle.SurfaceCellProductOracleCanonicalization.PreservesInputOutputRowCycleAndReversalSemantics
          EOF
          sed -i 's/^          //' "$artifact_root/metadata/oracle-test-names.txt"
          test "$(tail -n +4 "$artifact_root/metadata/oracle-test-names.txt" | wc -l)" -eq 29

          cat > "$artifact_root/metadata/source-authority.json" <<EOF
          {
            "eventCommit": "$GITHUB_SHA",
            "implementationCommit": "$IMPLEMENTATION_COMMIT",
            "buildCommit": "$BUILD_COMMIT",
            "enteringRuntimeArtifact": $ENTERING_RUNTIME_ARTIFACT,
            "enteringBranchHead": "$ENTERING_BRANCH_HEAD",
            "runtimeExecution": false,
            "reviewPolicy": "never"
          }
          EOF
          cat > "$artifact_root/metadata/build-authority.json" <<'EOF'
          {
            "configuration": "Release",
            "generator": "Ninja",
            "buildSharedLibs": false,
            "gtestDiscoveryMode": "PRE_TEST",
            "approvedTargets": [
              "directional_core",
              "directional_pipeline",
              "directional_compiled_api_tests",
              "directional_surface_cell_producer_tests",
              "directional_surface_cell_oracle_tests",
              "directional_surface_cell_completion_tests",
              "directional_surface_cell_validation_tests",
              "directional_benchmarks"
            ],
            "runtimeExecution": false
          }
          EOF
          cat > "$artifact_root/metadata/command-boundary.txt" <<'EOF'
          T1 independent test-oracle foundation Code + Build only.
          Executed: exact source verification, static authority inspection, Release/static/Ninja PRE_TEST configuration, compile/link eight approved targets, static test-name manifest, package/checksum.
          Not executed: generated Directional binaries, test discovery, tests, benchmarks, fuzzers, ctest, CLI, GUI, help/list/version/custom-input commands.
          EOF
          sed -i 's/^          //' "$artifact_root/metadata/command-boundary.txt"

          git ls-tree -r "$IMPLEMENTATION_COMMIT" -- \
            cmake/DirectionalTests.cmake \
            tests/SurfaceCellDesignAcceptanceTests.cpp \
            tests/SurfaceCellProductOracleTests.cpp \
            tests/support/SurfaceCellProductOracle.cpp \
            tests/support/SurfaceCellProductOracle.h > \
            "$artifact_root/metadata/final-blobs.txt"
          git submodule status > "$artifact_root/metadata/submodules.txt"
          find benchmarks/fixtures -type f | LC_ALL=C sort > \
            "$artifact_root/metadata/fixture-files.txt"
          test "$(wc -l < "$artifact_root/metadata/fixture-files.txt")" -eq 27
          (cd "$artifact_root" && \
            find . -type f ! -name SHA256SUMS -print0 | LC_ALL=C sort -z | \
              xargs -0 sha256sum > SHA256SUMS)
          sha256sum "$artifact_root/SHA256SUMS" | tee "$LOG_DIR/artifact-checksum.txt"
          echo "manifest_entries=$(wc -l < "$artifact_root/SHA256SUMS")"

      - name: Upload immutable compile artifact
        id: compile_upload
        uses: actions/upload-artifact@v4
        with:
          name: t1-independent-test-oracle-foundation-code-build
          path: t1-independent-test-oracle-foundation-code-build-artifact
          if-no-files-found: error
          retention-days: 14

      - name: Record compile artifact identity
        shell: bash
        run: |
          set -Eeuo pipefail
          exec > >(tee -a "$ACTIVITY_LOG") 2>&1
          finish() {
            rc=$?
            trap - EXIT
            echo "step=record-artifact exit_code=$rc finished_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            exit "$rc"
          }
          trap finish EXIT
          echo "artifact_id=${{ steps.compile_upload.outputs.artifact-id }}"
          echo "artifact_url=${{ steps.compile_upload.outputs.artifact-url }}"
          echo "artifact_digest=${{ steps.compile_upload.outputs.artifact-digest }}"
          echo "runtimeExecution=false"

      - name: Upload detailed activity log always
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t1-independent-test-oracle-foundation-code-build-logs
          path: /tmp/t1-independent-test-oracle-foundation-code-build-logs
          if-no-files-found: error
          retention-days: 14
