name: M6 DEFN R1 Drive Patch Apply

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m6-defn-r1-drive-apply-20260925.txt

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

concurrency:
  group: m6-defn-r1-drive-patch-apply
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/m6-defn-r1-drive-patch-apply.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m6-defn-r1-drive-patch
      commit_run_file: false
    secrets: inherit

  apply:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1-Tlf6cSDCMZ0krhapVghLwIMBN2gvd3I
      patch_sha256: cefe02ad248617411f47aa42db124f4861bab5bc91b8bc10895a1552cb145e44
      base_sha: 63330339b116c8a6a56740de5b1160e8b4195992
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: "docs: freeze M6 DEFN R1 occurrence sheet authority"
    secrets: inherit
