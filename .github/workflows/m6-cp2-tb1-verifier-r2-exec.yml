name: M6 CP2 TB1 Verifier R2 Artifact-Only Test Benchmark

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m6-cp2-tb1-verifier-r2-exec.txt

permissions:
  actions: read
  contents: write

concurrency:
  group: m6-cp2-tb1-verifier-r2-exec-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/m6-cp2-tb1-verifier-r2-exec.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  runtime:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
      TURN_ID: M6-CP2-TB1-VERIFIER-R2-EXEC
      HARNESS_PATH: .agents/Directional/turn-payloads/m6-cp2-tb1-verifier-r2-exec-artifact-only-harness.sh
      EXPECTED_HARNESS_BLOB: 9549bed29b88410ee50fd42adcd5052847880ed4
    steps:
      - name: Checkout canonical executor source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          token: ${{ secrets.GH_TOKEN || github.token }}

      - name: Verify canonical harness
        shell: bash
        run: |
          set -euo pipefail
          test -f "$HARNESS_PATH"
          actual="$(git hash-object "$HARNESS_PATH")"
          test "$actual" = "$EXPECTED_HARNESS_BLOB"
          bash -n "$HARNESS_PATH"

      - name: Execute immutable artifact-only gate
        id: gate
        shell: bash
        run: |
          set +e
          bash "$HARNESS_PATH" --execute
          status=$?
          set -e
          echo "harness_exit=${status}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload result evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m6-cp2-tb1-verifier-r2-exec-result-${{ github.run_id }}
          path: ${{ runner.temp }}/${{ env.TURN_ID }}-result
          if-no-files-found: error
          retention-days: 7

      - name: Upload diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m6-cp2-tb1-verifier-r2-exec-log-${{ github.run_id }}
          path: ${{ runner.temp }}/${{ env.TURN_ID }}.log
          if-no-files-found: error
          retention-days: 7

      - name: Fail closed on orchestration failure
        if: always()
        shell: bash
        run: test "${{ steps.gate.outputs.harness_exit }}" = "0"

  mailbox:
    if: ${{ always() }}
    needs: [validate, runtime]
    permissions:
      actions: read
      contents: write
    uses: ./.github/workflows/workflow-mailbox-publisher.yml
    with:
      workflow_key: m6-cp2-tb1-verifier-r2-exec
      source_sha: c64baacd6c767c4ba053b6963651c0aa6eceed20
      source_ref: refs/heads/agent/surface_cell_quad/p5-recover-bridge-healing
      result: ${{ needs.runtime.result }}
      summary: M6-CP2-TB1-VERIFIER-R2-EXEC immutable 491-process artifact-only gate.
