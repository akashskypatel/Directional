name: Agent P5 CB90 source apply

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/Directional/p5-cb90-source-patch/APPLY_READY

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Record source apply start
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          gh api repos/${{ github.repository }}/issues/8/comments \
            -f body="P5-CB86 through P5-CB90 source-apply run ${RUN_ID} started for staging commit ${EVENT_SHA}. Source and regression edits only; no project binary, test, benchmark, help/list, discovery, or custom mesh command."

      - uses: actions/checkout@v4
        with:
          ref: agent/surface_cell_quad/p5-recover-bridge-healing
          fetch-depth: 1
          submodules: false

      - name: Decode and verify source patch
        shell: bash
        run: |
          set -euo pipefail
          encoded=.agents/Directional/p5-cb90-source-patch/p5-cb90.patch.gz.b64
          tr -d '\r\n' < "${encoded}" > /tmp/p5-cb90.patch.gz.b64
          echo "505c94d9d8129240bb5c821157080c972a50c75cb686497e18d117cd7b719357  /tmp/p5-cb90.patch.gz.b64" | sha256sum -c -
          base64 --decode /tmp/p5-cb90.patch.gz.b64 | gzip -dc > /tmp/p5-cb90.patch
          echo "05fe987687450ce19fb598cb856bdff2e942c46a6b9927a14b2a6a45a2a513f3  /tmp/p5-cb90.patch" | sha256sum -c -
          test "$(wc -c < /tmp/p5-cb90.patch)" = "45218"

      - name: Apply source patch
        shell: bash
        run: |
          set -euo pipefail
          git apply --check /tmp/p5-cb90.patch
          git apply /tmp/p5-cb90.patch
          git diff --check

      - name: Commit source checkpoint
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "directional-agent"
          git config user.email "directional-agent@users.noreply.github.com"
          git add \
            include/directional/diagnostics/RemeshDiagnostics.h \
            include/directional/pipeline/RemeshPipeline.h \
            src/bench/DirectionalBenchmark.cpp \
            src/geometry/SurfaceArrangement.cpp \
            src/pipeline/RemeshPipeline.cpp \
            tests/MilestoneDClosureTests.cpp \
            tests/PatchDescriptorMilestoneETests.cpp \
            tests/SurfaceCellPipelinePhase20Tests.cpp
          git commit -m "fix(surface-cells): complete P5 CB90 source checkpoint"
          git push origin HEAD:agent/surface_cell_quad/p5-recover-bridge-healing

      - name: Record source apply result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          JOB_STATUS: ${{ job.status }}
        run: |
          gh api repos/${{ github.repository }}/issues/8/comments \
            -f body="P5-CB86 through P5-CB90 source-apply run ${RUN_ID} finished ${JOB_STATUS}. No project binary, test, benchmark, help/list, discovery, or custom mesh command executed."
