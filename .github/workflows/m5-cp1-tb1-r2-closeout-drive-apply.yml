      workflow_path: .github/workflows/m5-cp1-tb1-r2-closeout-drive-apply.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  apply:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 146hZoSQ9ZSpoJQ3nSLZvphBYLp832jUK
      patch_sha256: '29e5fa4ed729f1afdcc2ec048887d71f68cc3d695f93282cf538fb467e477f2a'
      base_sha: cd57e1184184bef5aeaefac9778bab67b50b641d
