name: M3 CP4c2 CB5 Workflow Draft Validation

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/cb5-schema-validate.txt

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: m3-cp4c2-cb5-workflow-draft-validation
  cancel-in-progress: false

jobs:
  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m3-cp4c2-cb5-schema-validate
      commit_run_file: false
    secrets: inherit

  validate-draft:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .agents/Directional/turn-payloads/cb5-workflow-draft.yml
      source_ref: ${{ github.sha }}
    secrets: inherit
