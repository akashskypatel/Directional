name: P13l2 frozen side ABI and subdivision witness
on:
  push:
    branches: [agent/surface_cell_quad/p5-recover-bridge-healing]
    paths: [.agents/connector-triggers/p13l2-side-abi-20261106.txt]
permissions:
  actions: read
  contents: write
concurrency:
  group: p13l2-side-abi
  cancel-in-progress: false
jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/p13l2-side-abi-20261106.yml
      source_ref: ${{ github.sha }}
  capture:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Initialize persistent log
        shell: bash
        run: |
          : > "$RUNNER_TEMP/p13l2-gdb.log"
          echo "event_sha=$GITHUB_SHA semantic_source=11c8172ad467c6dc865f2f3352e75b78f5469a2b" >> "$RUNNER_TEMP/p13l2-gdb.log"
      - uses: actions/checkout@v4
        with:
          ref: 11c8172ad467c6dc865f2f3352e75b78f5469a2b
          fetch-depth: 1
          submodules: false
      - name: Verify and unpack immutable compiled artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          exec > >(tee -a "$RUNNER_TEMP/p13l2-gdb.log") 2>&1
          trap 's=$?; echo "preflight_exit=$s"' EXIT
          test "$(git rev-parse HEAD)" = 11c8172ad467c6dc865f2f3352e75b78f5469a2b
          sudo apt-get update -qq
          sudo apt-get install -y -qq gdb libgmp10 libgmpxx4ldbl
          mkdir -p "$RUNNER_TEMP/compiled" "$RUNNER_TEMP/geometry"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/13460725846/zip" > "$RUNNER_TEMP/cb96.zip"
          unzip -q "$RUNNER_TEMP/cb96.zip" -d "$RUNNER_TEMP/compiled"
          (cd "$RUNNER_TEMP/compiled" && sha256sum -c SHA256SUMS)
          test "$(cat "$RUNNER_TEMP/compiled/metadata/source-commit.txt")" = 11c8172ad467c6dc865f2f3352e75b78f5469a2b
          mkdir -p "$RUNNER_TEMP/compiled/test-data"
          ln -s "$GITHUB_WORKSPACE/benchmarks" "$RUNNER_TEMP/compiled/test-data/benchmarks"
          test -d "$RUNNER_TEMP/compiled/test-data/benchmarks/fixtures"
          gdb --version | head -1
      - name: Dump immutable geometry at pre-validation boundary
        shell: bash
        run: |
          set -uo pipefail
          exec > >(tee -a "$RUNNER_TEMP/p13l2-gdb.log") 2>&1
          cat > "$RUNNER_TEMP/dump.gdb" <<'GDB'
          set pagination off
          set confirm off
          python
          import gdb,struct,os,pathlib,json
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'geometry'
          out.mkdir(exist_ok=True)
          inf=gdb.selected_inferior()
          target=[54,118,4955,4957,4977,23301,23302,25721]
          def rd(p,n):return bytes(inf.read_memory(p,n))
          def vec(p):return struct.unpack('<QQQ',rd(p,24))
          def vecbytes(p,limit):
           a,b,c=vec(p);n=b-a
           if a==b==c==0:return b''
           if not (a>0x10000 and a<=b<=c and n<=limit):raise ValueError('invalid vector '+repr((hex(p),hex(a),hex(b),hex(c))))
           return rd(a,n)
          def ints(raw):
           if len(raw)%4:raise ValueError('not int vector')
           return list(struct.unpack('<'+'i'*(len(raw)//4),raw)) if raw else []
          class Capture(gdb.Breakpoint):
           def stop(self):
            try:
             addr=int(gdb.parse_and_eval('$rsi'))
             begin,end,cap=vec(addr)
             size=end-begin
             if not (begin>0x10000 and begin<=end<=cap and size>200000 and size<160000000):return False
             blob=rd(begin,size)
             (out/'abi_header.json').write_text(json.dumps({'patches_register':'rsi','rsi':hex(addr),'rdi':hex(int(gdb.parse_and_eval('$rdi'))),'rdx':hex(int(gdb.parse_and_eval('$rdx'))),'vector_begin':hex(begin),'vector_end':hex(end),'vector_capacity':hex(cap),'vector_bytes':size}))
             possibles=[]
             for stride in range(800,2201,8):
              if size%stride:continue
              n=size//stride
              if not (500<n<150000):continue
              idx=[0,1,2,3,5,10,min(n-1,1000),min(n-1,10000),n-1]
              vals=[struct.unpack_from('<i',blob,k*stride)[0] for k in idx]
              if sum(0<=v<500000 for v in vals)>=8 and len(set(vals))>=5:
               possibles.append((stride,n,idx,vals))
             (out/'stride_candidates.json').write_text(json.dumps(possibles))
             if not possibles:return False
             candidates=[]
             for stride,n,_,_ in possibles:
              pids=[struct.unpack_from('<i',blob,k*stride)[0] for k in range(n)]
              if len(set(pids))!=n:continue
              hit={str(v):pids.index(v) for v in target if v in pids}
              if len(hit)>=5:candidates.append((stride,n,hit))
             if not candidates:return False
             stride,n,hit=sorted(candidates,key=lambda row:(-len(row[2]),row[0]))[0]
             res={'source':'11c8172ad467c6dc865f2f3352e75b78f5469a2b','stride':stride,'patch_count':n,'found_patch_indices':hit,'patches':{}}
             for patch,index in hit.items():
              rec=begin+index*stride
              options=[]
              for off in range(120,stride-72,8):
               try:
                side=ints(vecbytes(rec+off,512))
                if not(2<=len(side)<=32 and all(0<x<10000 for x in side)):continue
                vlen=len(vecbytes(rec+off+24,928*10000))
                qlen=len(vecbytes(rec+off+48,40*10000))
                if vlen%928 or qlen%40 or not(4<=vlen//928<10000 and 1<=qlen//40<10000):continue
                boundary=ints(vecbytes(rec+off-80,4*10000))
                identities=vecbytes(rec+off-56,224*10000)
                if len(identities)!=len(boundary)*224:continue
                if len(boundary)!=sum(side):continue
                nodes=[]
                for k,v in enumerate(boundary):
                 item=identities[k*224:(k+1)*224]
                 valid=item[0]
                 if valid not in (0,1):raise ValueError('invalid boundary identity flag')
                 a,b,c=struct.unpack_from('<QQQ',item,8)
                 if a==b==c==0:keys=[]
                 else:
                  if not(a>0x10000 and a<=b<=c and b-a<=256 and (b-a)%8==0):raise ValueError('invalid canonical values')
                  keys=list(struct.unpack('<'+'q'*((b-a)//8),rd(a,b-a)))
                 nodes.append({'local_vertex':v,'identity_values':keys,'valid':bool(valid)})
                options.append({'offset':off,'source_side_edge_counts':side,'boundary_nodes':nodes,'lineage_vertex_count':vlen//928,'lineage_quad_count':qlen//40})
               except Exception:continue
              res['patches'][patch]={'index':index,'candidates':options}
             (out/'side_schedule.json').write_text(json.dumps(res,indent=2,sort_keys=True))
             print('P13L2_SIDE_SCHEDULE patch_count='+str(n)+' recovered='+str(len(hit))+' signatures='+str([len(v['candidates']) for v in res['patches'].values()]),flush=True)
             self.enabled=False
            except Exception as e:
             (out/'diagnostic_error.txt').write_text(repr(e))
             print('P13L2_SIDE_SCHEDULE_ERROR '+repr(e),flush=True)
            return False
          Capture('directional::geometry::stitch_pure_quad_patches')
          end
          run
          GDB
          set +e
          timeout 470s gdb -q -batch -x "$RUNNER_TEMP/dump.gdb" --args "$RUNNER_TEMP/compiled/bin/directional_surface_cell_producer_tests" '--gtest_filter=UniformPhaseFront/SurfaceCellDesignAcceptance.ProducesDirectSourceAuthoritativePureQuadOutput/Vase' > "$RUNNER_TEMP/test.log" 2>&1
          rc=$?
          set -e
          echo "scratch_runtime_exit=$rc"
          grep 'P13L2_SIDE_SCHEDULE' "$RUNNER_TEMP/test.log" || true
          tail -15 "$RUNNER_TEMP/test.log"
          cp "$RUNNER_TEMP/test.log" "$RUNNER_TEMP/geometry/test.log"
          test -s "$RUNNER_TEMP/geometry/side_schedule.json"
      - name: Write evidence manifest
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/geometry"
          echo 'semantic_source=11c8172ad467c6dc865f2f3352e75b78f5469a2b' > "$RUNNER_TEMP/geometry/source.txt"
          (cd "$RUNNER_TEMP/geometry" && find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p13l2-side-abi-data-${{ github.run_id }}
          path: ${{ runner.temp }}/geometry
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p13l2-side-abi-log-${{ github.run_id }}
          path: ${{ runner.temp }}/p13l2-gdb.log
          if-no-files-found: error
  mailbox:
    if: ${{ always() }}
    needs: [capture]
    permissions:
      actions: read
      contents: write
    uses: ./.github/workflows/workflow-mailbox-publisher.yml
    with:
      mailbox_branch: workflow-mailbox
      workflow_key: p13l2-side-abi
      source_sha: 11c8172ad467c6dc865f2f3352e75b78f5469a2b
      source_ref: refs/heads/agent/surface_cell_quad/p5-recover-bridge-healing
      result: ${{ needs.capture.result }}
      summary: No-build original patch side subdivisions and boundary-node identity at stitch entry.