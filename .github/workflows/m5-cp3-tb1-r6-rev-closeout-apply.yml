name: M5 CP3 TB1 R6 Review Closeout Drive Patch Apply

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m5-cp3-tb1-r6-rev-closeout-apply-20260921.txt

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

concurrency:
  group: m5-cp3-tb1-r6-rev-closeout-apply-${{ github.ref }}
  cancel-in-progress: false

jobs:
  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m5-cp3-tb1-r6-rev-closeout-apply
      commit_run_file: false
      trim_stale_comments: false
    secrets: inherit

  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/m5-cp3-tb1-r6-rev-closeout-apply.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  apply:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1K6HOSqYnOzXaa-DKhJwxdbIKG4i9cOK0
      patch_sha256: 883c1213616a2956b07d184900536528442a641d83bce7d4ea8a0b6c9fb886be
      base_sha: 5461c0d4bacf038591f6f28bbaba61dbb7054f5b
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: M5-CP3-TB1-R6 Review closeout and CB8 handoff
      retention_days: 7
    secrets: inherit
