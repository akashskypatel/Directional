name: P13l2 strict validation witness
on:
  push:
    branches: [agent/surface_cell_quad/p5-recover-bridge-healing]
    paths: [.agents/connector-triggers/p13l2-strict-witness-20261106.txt]
permissions:
  actions: read
  contents: write
concurrency:
  group: p13l2-strict-witness
  cancel-in-progress: false
jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/p13l2-strict-witness-20261106.yml
      source_ref: ${{ github.sha }}
  capture:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Initialize persistent log
        shell: bash
        run: |
          : > "$RUNNER_TEMP/p13l2-gdb.log"
          echo "event_sha=$GITHUB_SHA semantic_source=11c8172ad467c6dc865f2f3352e75b78f5469a2b" >> "$RUNNER_TEMP/p13l2-gdb.log"
      - uses: actions/checkout@v4
        with:
          ref: 11c8172ad467c6dc865f2f3352e75b78f5469a2b
          fetch-depth: 1
          submodules: false
      - name: Verify and unpack immutable compiled artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          exec > >(tee -a "$RUNNER_TEMP/p13l2-gdb.log") 2>&1
          trap 's=$?; echo "preflight_exit=$s"' EXIT
          test "$(git rev-parse HEAD)" = 11c8172ad467c6dc865f2f3352e75b78f5469a2b
          sudo apt-get update -qq
          sudo apt-get install -y -qq gdb libgmp10 libgmpxx4ldbl
          mkdir -p "$RUNNER_TEMP/compiled" "$RUNNER_TEMP/geometry"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/13460725846/zip" > "$RUNNER_TEMP/cb96.zip"
          unzip -q "$RUNNER_TEMP/cb96.zip" -d "$RUNNER_TEMP/compiled"
          (cd "$RUNNER_TEMP/compiled" && sha256sum -c SHA256SUMS)
          test "$(cat "$RUNNER_TEMP/compiled/metadata/source-commit.txt")" = 11c8172ad467c6dc865f2f3352e75b78f5469a2b
          mkdir -p "$RUNNER_TEMP/compiled/test-data"
          ln -s "$GITHUB_WORKSPACE/benchmarks" "$RUNNER_TEMP/compiled/test-data/benchmarks"
          test -d "$RUNNER_TEMP/compiled/test-data/benchmarks/fixtures"
          gdb --version | head -1
      - name: Dump immutable geometry at pre-validation boundary
        shell: bash
        run: |
          set -uo pipefail
          exec > >(tee -a "$RUNNER_TEMP/p13l2-gdb.log") 2>&1
          cat > "$RUNNER_TEMP/dump.gdb" <<'GDB'
          set pagination off
          set confirm off
          python
          import gdb,struct,os,pathlib
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'geometry'
          out.mkdir(exist_ok=True)
          inf=gdb.selected_inferior()
          def rd(p,n): return bytes(inf.read_memory(p,n))
          def u64(p): return struct.unpack('<Q',rd(p,8))[0]
          def vec(p): return struct.unpack('<QQQ',rd(p,24))
          def write_vect(outname,ptr,max_bytes):
              if ptr<0x10000:return 0
              a,b,c=vec(ptr)
              n=b-a
              if not (a>0x10000 and a<=b<=c and 0<=n<=max_bytes): return 0
              (out/outname).write_bytes(rd(a,n))
              return n
          class CaptureExit(gdb.FinishBreakpoint):
              def __init__(self,result,options):
                  super().__init__(gdb.newest_frame(),internal=True)
                  self.result=result;self.options=options
              def stop(self):
                  try:
                      a,b,c=vec(self.result+8)
                      n=b-a
                      print('P13L2_RETURN_VECTOR '+str((hex(self.result),hex(a),hex(b),n)),flush=True)
                      if not (a>0x10000 and 0<n<=100000 and n%20==0):return False
                      raw=rd(a,n)
                      rows=[struct.unpack_from('<iiiii',raw,i) for i in range(0,n,20)]
                      (out/'strict_issues.tsv').write_text('ordinal\tcode\tvertex\tedgeFirst\tedgeSecond\tface\n'+''.join(f'{i}\t'+ '\t'.join(map(str,row))+'\n' for i,row in enumerate(rows)))
                      print('P13L2_ISSUES '+repr(rows),flush=True)
                      pvec=u64(self.options+32)
                      cvec=u64(self.options+40)
                      qvec=u64(self.options+48)
                      plen=write_vect('source_provenance.bin',pvec,12000000)
                      clen=write_vect('chart_structs.bin',cvec,12000000)
                      qlen=write_vect('quad_source_faces.bin',qvec,1000000)
                      (out/'vector_sizes.txt').write_text(f'provenance_bytes={plen}\nchart_struct_bytes={clen}\nquad_source_face_bytes={qlen}\n')
                      print('P13L2_SOURCE_BYTES '+str((plen,clen,qlen)),flush=True)
                      if clen>0 and clen%67961==0:
                          stride=clen//67961
                          print('P13L2_CHART_STRIDE '+str(stride),flush=True)
                          rawcharts=(out/'chart_structs.bin').read_bytes()
                          for idx in sorted({v for _,v,e1,e2,face in rows for v in (v,e1,e2) if 0<=v<67961}):
                              offset=idx*stride
                              (out/f'chart_{idx}.hex').write_text(rawcharts[offset:offset+stride].hex()+'\n')
                              if stride>=32:
                                  first,last,capacity=struct.unpack_from('<QQQ',rawcharts,offset+8)
                                  if first>0x10000 and first<=last<=capacity and (last-first)<=65536:
                                      (out/f'chart_{idx}.bin').write_bytes(rd(first,last-first))
                      if plen>0 and plen%67961==0:
                          print('P13L2_PROVENANCE_STRIDE '+str(plen//67961),flush=True)
                      self.enabled=False
                  except Exception as e:
                      print('P13L2_RETURN_ERROR '+repr(e),flush=True)
                  return False
          class Capture(gdb.Breakpoint):
              def stop(self):
                  try:
                      rdi=int(gdb.parse_and_eval('$rdi'))
                      rsi=int(gdb.parse_and_eval('$rsi'))
                      rdx=int(gdb.parse_and_eval('$rdx'))
                      rcx=int(gdb.parse_and_eval('$rcx'))
                      vp,vr,vc=struct.unpack('<Qqq',rd(rsi,24))
                      qp,qr,qc=struct.unpack('<Qqq',rd(rdx,24))
                      if vr==67961 and vc==3 and qr==67750 and qc==4:
                          print('P13L2_ENTRY sret='+hex(rdi)+' options='+hex(rcx),flush=True)
                          CaptureExit(rdi,rcx)
                          self.enabled=False
                  except Exception as e:
                      print('P13L2_ENTRY_ERROR '+repr(e),flush=True)
                  return False
          Capture('directional::validation::validate_source_authoritative_surface_mesh')
          end
          run
          GDB
          set +e
          timeout 470s gdb -q -batch -x "$RUNNER_TEMP/dump.gdb" --args "$RUNNER_TEMP/compiled/bin/directional_surface_cell_producer_tests" '--gtest_filter=UniformPhaseFront/SurfaceCellDesignAcceptance.ProducesDirectSourceAuthoritativePureQuadOutput/Vase' > "$RUNNER_TEMP/test.log" 2>&1
          rc=$?
          set -e
          echo "scratch_runtime_exit=$rc"
          grep 'P13L2_ISSUES' "$RUNNER_TEMP/test.log" || true
          tail -15 "$RUNNER_TEMP/test.log"
          cp "$RUNNER_TEMP/test.log" "$RUNNER_TEMP/geometry/test.log"
          test -s "$RUNNER_TEMP/geometry/strict_issues.tsv"
          test -s "$RUNNER_TEMP/geometry/vector_sizes.txt"
      - name: Write evidence manifest
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/geometry"
          echo 'semantic_source=11c8172ad467c6dc865f2f3352e75b78f5469a2b' > "$RUNNER_TEMP/geometry/source.txt"
          (cd "$RUNNER_TEMP/geometry" && find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p13l2-strict-issues-${{ github.run_id }}
          path: ${{ runner.temp }}/geometry
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p13l2-strict-witness-log-${{ github.run_id }}
          path: ${{ runner.temp }}/p13l2-gdb.log
          if-no-files-found: error
  mailbox:
    if: ${{ always() }}
    needs: [capture]
    permissions:
      actions: read
      contents: write
    uses: ./.github/workflows/workflow-mailbox-publisher.yml
    with:
      mailbox_branch: workflow-mailbox
      workflow_key: p13l2-strict-witness
      source_sha: 11c8172ad467c6dc865f2f3352e75b78f5469a2b
      source_ref: refs/heads/agent/surface_cell_quad/p5-recover-bridge-healing
      result: ${{ needs.capture.result }}
      summary: No-build GDB exact strict issue tuples from immutable CB96 Vase.