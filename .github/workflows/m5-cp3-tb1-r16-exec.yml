name: M5 CP3 TB1 R16 Artifact-Only Test Benchmark

on:
  push:
    branches: [agent/surface_cell_quad/p5-recover-bridge-healing]
    paths: [.agents/connector-triggers/m5-cp3-tb1-r16-exec.txt]

permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: m5-cp3-tb1-r16-exec-${{ github.ref }}
  cancel-in-progress: false

jobs:
  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m5-cp3-tb1-r16-exec
      commit_run_file: false
      trim_stale_comments: false
    secrets: inherit

  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/m5-cp3-tb1-r16-exec.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  runtime:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
      TURN_ID: M5-CP3-TB1-R16-EXEC
      FROZEN_HARNESS_PATH: .agents/Directional/tools/m5_cp3_tb1_r15_r1_artifact_only_harness.sh
      EXPECTED_FROZEN_HARNESS_SHA256: 7867e779ee1d276617cbf7c0e1a9910dbd5b7388a5fe6bde7aac32a47efb81b7
      EXPECTED_R16_HARNESS_SHA256: 5d383089aa12f9e78367ec5c673c7fda3b79040da4a42d3234c7dcc5a4ca6cdf
    steps:
      - name: Checkout canonical executor source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          token: ${{ secrets.GH_TOKEN || github.token }}

      - name: Materialize R16 harness from frozen parser
        shell: bash
        run: |
          set -euo pipefail
          test -f "$FROZEN_HARNESS_PATH"
          frozen_sha="$(sha256sum "$FROZEN_HARNESS_PATH" | awk '{print $1}')"
          test "$frozen_sha" = "$EXPECTED_FROZEN_HARNESS_SHA256"
          harness="$RUNNER_TEMP/m5_cp3_tb1_r16_artifact_only_harness.sh"
          cp "$FROZEN_HARNESS_PATH" "$harness"
          python3 - "$harness" <<'PY'
          from pathlib import Path
          import sys
          p = Path(sys.argv[1])
          s = p.read_text()
          replacements = {
              "CANDIDATE_ARTIFACT_ID=10742798135":
                  "CANDIDATE_ARTIFACT_ID=10763242885",
              "EXPECTED_SOURCE_SHA='1a36f6483738e1047b5d8ddbefb48cc5ab6fd4a3'":
                  "EXPECTED_SOURCE_SHA='a8b33cb7145d5a99d47eaf5f70bb12f1c71238d1'",
              "EXPECTED_CANDIDATE_ZIP_SHA256='eb1e2be55150022cdba05acf6b38433eb16352e4b3b6a561742e62de26cfd866'":
                  "EXPECTED_CANDIDATE_ZIP_SHA256='abe4c381511d3b4025f22612978388bb554bd686b86b6f9dc406538998e990aa'",
              "EXPECTED_ROOT_MANIFEST_SHA256='a6c288ff4ef5afff8122f9dae0e330fe1cab4928b7bd5b5604b7d2fd5e32b951'":
                  "EXPECTED_ROOT_MANIFEST_SHA256='cda95dd99d7c201fb4fc1f5021f24c6e720e82dc737a89418245e687bf010c25'",
              "EXPECTED_SOURCE_ARCHIVE_SHA256='e6bed804841ecf590ccd1c372c906e19b927e5cf0d253d0d361993fa92ce68e0'":
                  "EXPECTED_SOURCE_ARCHIVE_SHA256='54962d495891b35dd800fbede63ddc7d622c28091b42a0faeb8e8b3597726d91'",
          }
          for old, new in replacements.items():
              if s.count(old) != 1:
                  raise SystemExit(f"authority replacement count mismatch: {old!r}")
              s = s.replace(old, new)
          p.write_text(s)
          PY
          actual="$(sha256sum "$harness" | awk '{print $1}')"
          test "$actual" = "$EXPECTED_R16_HARNESS_SHA256"
          bash -n "$harness"
          diff -u "$FROZEN_HARNESS_PATH" "$harness" || test "$?" = 1
          echo "R16_HARNESS=$harness" >> "$GITHUB_ENV"

      - name: Execute immutable artifact-only gate
        id: gate
        shell: bash
        run: |
          set +e
          bash "$R16_HARNESS" --execute
          status=$?
          set -e
          echo "harness_exit=${status}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload result evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: directional-m5-cp3-tb1-r16-result-${{ github.run_id }}
          path: ${{ runner.temp }}/M5-CP3-TB1-R16-EXEC-result
          if-no-files-found: error
          retention-days: 7

      - name: Upload diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: directional-m5-cp3-tb1-r16-log-${{ github.run_id }}
          path: ${{ runner.temp }}/M5-CP3-TB1-R16-EXEC.log
          if-no-files-found: error
          retention-days: 7

      - name: Fail closed on orchestration failure
        if: always()
        shell: bash
        run: test "${{ steps.gate.outputs.harness_exit }}" = "0"
