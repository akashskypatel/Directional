name: TB18 Independent Review History Gate

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/review-history/tb18rev-20261020.txt

permissions:
  contents: read
  actions: read

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/agent-tb18rev-history-gate.yml
      source_ref: ${{ github.sha }}

  history:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Initialize persistent diagnostic log
        shell: bash
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/tb18rev-history.log"
          : > "$log"
          { echo "event_sha=${GITHUB_SHA}"; echo "source_ref=${GITHUB_REF}"; echo "repository=${GITHUB_REPOSITORY}"; echo "started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"; } | tee -a "$log"
      - name: Checkout actual complete repository history
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          submodules: false
          persist-credentials: false
      - name: Verify review history and non-mutation
        id: audit
        shell: bash
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/tb18rev-history.log"
          exec > >(tee -a "$log") 2>&1
          echo "head=$(git rev-parse HEAD)"
          git status -sb
          git rev-parse --is-shallow-repository
          git log -1 --format='%H %s'
          python3 .agents/Directional/tools/review_check.py authority 3bd24682c5e18eece541ab4d1f38f781a2230e41
          python3 .agents/Directional/tools/review_check.py boundary
          python3 .agents/Directional/tools/review_check.py ledgers
          echo 'review_exit=0'
      - name: Report final source status
        if: always()
        shell: bash
        run: |
          set +e
          { echo "job_status=${{ job.status }}"; echo "final_sha=$(git rev-parse HEAD 2>/dev/null || echo unavailable)"; git status --short 2>&1 || true; echo "ended_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"; } | tee -a "${RUNNER_TEMP}/tb18rev-history.log"
      - name: Upload review history log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tb18rev-history-gate-log-${{ github.run_id }}
          path: ${{ runner.temp }}/tb18rev-history.log
          if-no-files-found: error
          retention-days: 14

  mailbox:
    if: ${{ always() }}
    needs: [validate, history]
    permissions:
      actions: read
      contents: write
    uses: ./.github/workflows/workflow-mailbox-publisher.yml
    with:
      mailbox_branch: workflow-mailbox
      workflow_key: tb18rev-history-gate
      source_sha: ${{ github.sha }}
      source_ref: ${{ github.ref }}
      result: ${{ needs.history.result }}
      summary: TB18 independent review read-only full-history gates.
