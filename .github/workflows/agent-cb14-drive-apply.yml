name: Agent CB14 Drive Apply

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/cb14-drive-apply/**

permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

concurrency:
  group: agent-cb14-drive-apply-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/agent-cb14-drive-apply.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: cb14-drive-apply
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  apply:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1myHurRvJBoUoIo7htaxP4sm_SrO_DsTx
      patch_sha256: b93677c03695d4d241487c5dd5820303a17ea085f76fe1e33b53b3b0c81ced9a
      base_sha: 1959eb0ab7c293ac943d8bd647d458ea22f362dd
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: 'diagnostics: discriminate rotation ray-order collision'
      retention_days: 14
    secrets: inherit
