name: Agent CB14 Drive Apply

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/cb14-drive-apply/**

permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

concurrency:
  group: agent-cb14-drive-apply-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/agent-cb14-drive-apply.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: cb14-drive-apply
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  apply:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1tAFks0plqMdSXuo3obYE6D_NBZCelxUu
      patch_sha256: b1a1b2cdf234e2696a3c9f82a00c69b2787e9def36c5666f9dfa6e4a54370a45
      base_sha: 1d684f954deb48a8a2490b2a7453e143a134d0e9
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: 'tests: complete CB14 diagnostic witness and selector'
      retention_days: 14
    secrets: inherit
