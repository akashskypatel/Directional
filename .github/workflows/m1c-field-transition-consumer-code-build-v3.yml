name: m1c-field-transition-consumer-code-build-v3

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - '.agents/connector-triggers/m1c-field-transition-consumer-code-build-v2'

permissions:
  contents: write
  actions: read

concurrency:
  group: m1c-field-transition-consumer-code-build-v3
  cancel-in-progress: false

jobs:
  code-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Initialize unconditional activity log
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p /tmp/m1c-field-transition-consumer-code-build-v3-logs
          {
            echo "turn=M1c Field-Transition Consumer Code+Build"
            echo "workflow_revision=v3-minimal-wrapper"
            echo "run_id=$GITHUB_RUN_ID"
            echo "run_attempt=$GITHUB_RUN_ATTEMPT"
            echo "event=$GITHUB_EVENT_NAME"
            echo "event_sha=$GITHUB_SHA"
            echo "event_ref=$GITHUB_REF"
            echo "repository=$GITHUB_REPOSITORY"
            echo "runtimeExecution=false"
            echo "reviewPolicy=never"
            echo "started_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } | tee /tmp/m1c-field-transition-consumer-code-build-v3-logs/activity.log

      - name: Checkout exact working branch
        uses: actions/checkout@v4
        with:
          ref: agent/surface_cell_quad/p5-recover-bridge-healing
          fetch-depth: 180
          submodules: false

      - name: Apply M1c and compile approved targets only
        shell: bash
        run: bash .agents/connector-scripts/m1c-field-transition-consumer-code-build.sh

      - name: Upload immutable compile artifact
        uses: actions/upload-artifact@v4
        with:
          name: m1c-field-transition-consumer-code-build-v3
          path: /tmp/m1c-field-transition-consumer-code-build-v3
          if-no-files-found: error
          retention-days: 14

      - name: Upload detailed activity log always
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m1c-field-transition-consumer-code-build-v3-logs
          path: /tmp/m1c-field-transition-consumer-code-build-v3-logs
          if-no-files-found: error
          retention-days: 14
