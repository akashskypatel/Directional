name: M6 CP2 TB2 Recent Runs Fallback

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m6-cp2-tb2-recent-runs.txt

permissions:
  actions: read
  contents: write

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/m6-cp2-tb2-recent-runs.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  collect:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-recent-workflow-runs-reusable.yml
    with:
      per_page: 50
      max_pages: 1
      branch: agent/surface_cell_quad/p5-recover-bridge-healing
      event: push
    secrets: inherit

  mailbox:
    if: ${{ always() }}
    needs: [validate, collect]
    uses: ./.github/workflows/workflow-mailbox-publisher.yml
    with:
      workflow_key: m6-cp2-tb2-recent-runs
      source_sha: ${{ github.sha }}
      source_ref: ${{ github.ref }}
      result: ${{ needs.collect.result }}
      summary: Fallback recent-run inventory for M6-CP2-TB2-COVERAGE-EXEC.
