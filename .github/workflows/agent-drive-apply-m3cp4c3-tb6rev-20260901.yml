    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1rKeYcj9UnFN0fG6alyl2qkzzKc1EPbrU
      patch_sha256: f39d83d9e25212b9ee9850186cf5c94f4a5e5ac9de5f2153e8c3954b6c70c0b7
