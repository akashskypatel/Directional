name: TB47 Review Run Inventory

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/tb47-rev-inventory/tb47-rev-inventory-20260909.txt

permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: tb47-rev-run-inventory-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/tb47-rev-run-inventory.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: tb47-rev-run-inventory
      commit_run_file: false
      trim_stale_comments: false
    secrets: inherit

  collect:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-recent-workflow-runs-reusable.yml
    with:
      per_page: 100
      max_pages: 1
      branch: agent/surface_cell_quad/p5-recover-bridge-healing
      event: push
      retention_days: 7
    secrets: inherit
