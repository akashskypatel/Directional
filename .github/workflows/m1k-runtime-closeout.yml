name: M1k Runtime Durable Closeout

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/Directional/connector-triggers/m1k-runtime-closeout.txt

permissions:
  contents: write

concurrency:
  group: m1k-runtime-durable-closeout
  cancel-in-progress: false

jobs:
  closeout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/surface_cell_quad/p5-recover-bridge-healing
          fetch-depth: 2
          submodules: false

      - name: Apply surgical M1k durable status updates
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p m1k-runtime-closeout-logs
          exec > >(tee -a m1k-runtime-closeout-logs/activity.log) 2>&1
          python .agents/Directional/turn-payloads/m1k-runtime-closeout.py
          git diff --check
          printf '[m1k-closeout] changed paths:\n'
          git diff --name-only
          expected=$(printf '%s\n' \
            TODO \
            MILESTONE_G_TODO.md \
            .agents/Directional/Future_Chat_Session_Handoff.md \
            .agents/Directional/Regression_Root_Cause_Tracker.md \
            .agents/Directional/REORIENTATION_PLAN.md | sort)
          actual=$(git diff --name-only | sort)
          if [[ "$actual" != "$expected" ]]; then
            echo 'unexpected durable-document scope'
            exit 41
          fi
          git config user.name 'OpenAI Agent'
          git config user.email 'noreply@openai.com'
          git add TODO MILESTONE_G_TODO.md
          git add -f \
            .agents/Directional/Future_Chat_Session_Handoff.md \
            .agents/Directional/Regression_Root_Cause_Tracker.md \
            .agents/Directional/REORIENTATION_PLAN.md
          git commit -m 'docs: hand off M1l cell topology-region migration'
          git push origin HEAD:agent/surface_cell_quad/p5-recover-bridge-healing

      - name: Upload closeout logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m1k-runtime-closeout-logs
          path: m1k-runtime-closeout-logs
          if-no-files-found: warn
          retention-days: 14
