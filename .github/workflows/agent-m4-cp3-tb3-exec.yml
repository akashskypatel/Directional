name: Agent M4 CP3 TB3 EXEC

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m4-cp3-tb3-exec.txt

permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: agent-m4-cp3-tb3-exec
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/agent-m4-cp3-tb3-exec.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m4-cp3-tb3-exec
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  execute:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    steps:
      - name: Initialize persistent diagnostic log
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/m4-cp3-tb3-exec"
          evid="$root/evidence"
          mkdir -p "$evid/raw"
          log="$root/activity.log"
          : > "$log"
          {
            echo "workflow=$GITHUB_WORKFLOW"
            echo "run_id=$GITHUB_RUN_ID"
            echo "event=$GITHUB_EVENT_NAME"
            echo "event_sha=$GITHUB_SHA"
            echo "ref=$GITHUB_REF"
            echo "candidate=cb5-selector408"
            echo "artifact_id=10290933668"
            echo "source_sha=4dfd0d9a681be0eec8b9fc6a7ea2bea5c419223e"
            echo "turnBoundary=Test+Benchmark/TB3-EXEC"
            echo "executionMode=artifact-only"
            echo "compile=false"
            echo "benchmark=false"
            echo "planned_processes=821"
            echo "started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } | tee -a "$log"
          {
            echo "TB_ROOT=$root"
            echo "TB_EVID=$evid"
            echo "TB_LOG=$log"
            echo "TB_PKG=$root/package"
            echo "TB_SRC=$root/source"
            echo "TB_VIEW=$root/execution-view"
          } >> "$GITHUB_ENV"

      - name: Immutable artifact and selector preflight
        id: preflight
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee -a "$TB_LOG") 2>&1
          trap 'rc=$?; echo "$rc" > "$TB_EVID/preflight-exit-code.txt"; exit "$rc"' EXIT
          zip="$TB_ROOT/package.zip"
          meta="$TB_EVID/artifact-provider.json"
          curl -fsS -H "Accept: application/vnd.github+json" -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/10290933668" > "$meta"
          provider_digest="$(jq -r '.digest' "$meta")"
          provider_size="$(jq -r '.size_in_bytes' "$meta")"
          test "$provider_digest" = "sha256:3c73ce15c626b9811a0122cccaaa9615f76f1a6b5d6e93692a05fef524a36571"
          test "$provider_size" = "31376159"
          curl -fL -H "Accept: application/vnd.github+json" -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/10290933668/zip" -o "$zip"
          downloaded_digest="$(sha256sum "$zip" | awk '{print $1}')"
          downloaded_size="$(stat -c %s "$zip")"
          test "$downloaded_digest" = "3c73ce15c626b9811a0122cccaaa9615f76f1a6b5d6e93692a05fef524a36571"
          test "$downloaded_size" = "31376159"
          printf 'provider_digest=%s\nprovider_size=%s\ndownloaded_digest=%s\ndownloaded_size=%s\n' \
            "$provider_digest" "$provider_size" "$downloaded_digest" "$downloaded_size" > "$TB_EVID/artifact-identity.txt"

          mkdir -p "$TB_PKG" "$TB_SRC"
          unzip -q "$zip" -d "$TB_PKG"
          test "$(sha256sum "$TB_PKG/SHA256SUMS" | awk '{print $1}')" = "4f571387dc6ae86ac46161b3072c08e7d5ed7529a677506fe6355b71978bd831"
          (cd "$TB_PKG" && sha256sum -c SHA256SUMS) | tee "$TB_EVID/manifest-pre.txt"
          test "$(wc -l < "$TB_PKG/SHA256SUMS")" -eq 28
          find "$TB_PKG" -type f ! -name SHA256SUMS -printf './%P\n' | sort > "$TB_EVID/package-paths.txt"
          awk '{print $2}' "$TB_PKG/SHA256SUMS" | sort > "$TB_EVID/manifest-paths.txt"
          cmp "$TB_EVID/package-paths.txt" "$TB_EVID/manifest-paths.txt"
          test "$(cat "$TB_PKG/metadata/source-commit.txt")" = "4dfd0d9a681be0eec8b9fc6a7ea2bea5c419223e"
          test "$(cat "$TB_PKG/metadata/preflight-exit-code.txt")" = 0
          test "$(cat "$TB_PKG/metadata/build-exit-code.txt")" = 0
          for v in runtimeExecution=false turnBoundary=Code+Build-only exactArithmeticBackend=GMP \
            preflightCompile=true semanticContracts=compiled-not-executed manifestExcludesSelf=true buildLocation=runner-temp-out-of-tree; do
            grep -Fxq "$v" "$TB_PKG/metadata/command-boundary.txt"
          done
          grep -qi gmpxx "$TB_PKG/metadata/gmp-evidence.txt"
          grep -qi gmp "$TB_PKG/metadata/gmp-evidence.txt"
          for f in "$TB_PKG"/metadata/source-status-*.txt; do test ! -s "$f"; done
          test "$(sha256sum "$TB_PKG/source/source-4dfd0d9a681be0eec8b9fc6a7ea2bea5c419223e.tar.gz" | awk '{print $1}')" = \
            "f8c3db60c74a7c415fd362e3b9c72d1b9e5f0edd9a49bf86cfce53cb0d474415"
          test "$(sha256sum "$TB_PKG/bin/directional_surface_cell_authority_kernel_tests" | awk '{print $1}')" = "44d53573fddb3f3669186bdc9f44cc818e50c73eb0f79db6b1e78a4ee8c65fa1"
          test "$(sha256sum "$TB_PKG/bin/directional_surface_cell_producer_tests" | awk '{print $1}')" = "c9c41272f9b44138737026047f925418fe038a1efa9b948c1a61426320eae321"
          test "$(sha256sum "$TB_PKG/bin/directional_surface_cell_completion_tests" | awk '{print $1}')" = "db96315f58a49ff1716ae6fdd886d8c8689ae540887b2f356eab7f1abda5fd2c"
          test "$(sha256sum "$TB_PKG/bin/directional_surface_cell_validation_tests" | awk '{print $1}')" = "13acb528538504aa390d4efc73357023a84972b60946d3f8c0a56f300b43bf4f"
          for b in directional_surface_cell_authority_kernel_tests directional_surface_cell_producer_tests \
            directional_surface_cell_completion_tests directional_surface_cell_validation_tests; do
            test "$(stat -c %a "$TB_PKG/bin/$b")" = 755
          done

          census() {
            local base="$1" out="$2"
            find "$base" -type f -print0 | sort -z | while IFS= read -r -d '' f; do
              rel="${f#"$base"/}"
              printf '%s\t%s\t%s\t%s\n' "$rel" "$(stat -c %s "$f")" "$(stat -c %a "$f")" "$(sha256sum "$f" | awk '{print $1}')"
            done > "$out"
          }
          census "$TB_PKG" "$TB_EVID/package-census-pre.tsv"
          tar -xzf "$TB_PKG/source/source-4dfd0d9a681be0eec8b9fc6a7ea2bea5c419223e.tar.gz" -C "$TB_SRC"
          census "$TB_SRC" "$TB_EVID/source-census-pre.tsv"

          sel403="$TB_SRC/.agents/Directional/Architecture_M4_CP3_CB4_R3_Required_Green_Selector_403.txt"
          sel408="$TB_SRC/.agents/Directional/Architecture_M4_CP3_CB5_Required_Green_Selector_408.txt"
          test "$(wc -l < "$sel403")" -eq 403
          test "$(sha256sum "$sel403" | awk '{print $1}')" = "c3f509afc823cd73761bdebea0d072d497acf5587a013cb52b795f273af70cb7"
          test "$(wc -l < "$sel408")" -eq 408
          test "$(sha256sum "$sel408" | awk '{print $1}')" = "c689c0cd8a51f9a8bd8c9ed3a2e8b603728d5a0359ee2732f776a422744b0484"
          cmp <(head -n 403 "$sel408") "$sel403"
          expected_appended="$TB_EVID/expected-appended.txt"
          printf '%s\n' \
            'SurfaceCellAuthorityContractCutover.ProductionA4PublishesAcceptedA2bA3ConformityReceipt' \
            'SurfaceCellAuthorityContractCutover.FixedConformityPlanTargetPerturbationPreservesSharedBoundaryIntervals' \
            'SurfaceCellAuthorityContractCutover.ExactSharedBoundaryIntervalRejectsMissingOrTamperedIdentityWithoutFallback' \
            'SurfaceCellAuthorityContractCutover.A3SharedBoundaryCutoverPreservesA4LocalFamilyAndAdvanceSign' \
            'RemeshPipeline.ExactA3ToA4TorusProductionPathPublishesTypedSharedBoundaryIdentity' > "$expected_appended"
          sed -n '404,408p' "$sel408" > "$TB_EVID/appended-actual.txt"
          cmp "$expected_appended" "$TB_EVID/appended-actual.txt"

          python3 - "$TB_SRC" "$sel408" "$TB_EVID" <<'PY'
          import collections, hashlib, pathlib, re, sys
          root, selector, evid = map(pathlib.Path, sys.argv[1:])
          cmake = (root / "cmake/DirectionalTests.cmake").read_text()
          def body(rx):
              m = re.search(rx, cmake, re.S); assert m, rx; return m.group(1)
          owners = {
              "producer": re.findall(r"(?:tests|src/bench)/[A-Za-z0-9_./-]+\.cpp", body(r"set\(DIRECTIONAL_SURFACE_CELL_PRODUCER_TEST_SOURCES\s*(.*?)\)")),
              "authority-kernel": re.findall(r"tests/[A-Za-z0-9_./-]+\.cpp", body(r"add_executable\(\s*directional_surface_cell_authority_kernel_tests\s*(.*?)\)")),
              "completion": re.findall(r"tests/[A-Za-z0-9_./-]+\.cpp", body(r"add_executable\(\s*directional_surface_cell_completion_tests\s*(.*?)\)")),
              "validation": re.findall(r"tests/[A-Za-z0-9_./-]+\.cpp", body(r"add_executable\(\s*directional_surface_cell_validation_tests\s*(.*?)\)")),
          }
          bins = {k: "directional_surface_cell_" + ("authority_kernel" if k=="authority-kernel" else k) + "_tests" for k in owners}
          pat = re.compile(r"\b(?:TEST|TEST_F|TEST_P)\s*\(\s*([A-Za-z_][A-Za-z0-9_]*)\s*,\s*([A-Za-z_][A-Za-z0-9_]*)\s*\)")
          defs = collections.defaultdict(list)
          for owner, paths in owners.items():
              for rel in paths:
                  p = root / rel
                  if not p.exists(): continue
                  text = p.read_text(); digest = hashlib.sha256(p.read_bytes()).hexdigest()
                  for m in pat.finditer(text):
                      defs[f"{m.group(1)}.{m.group(2)}"].append((owner,bins[owner],rel,text.count("\n",0,m.start())+1,digest))
          rows = selector.read_text().splitlines(); assert len(rows)==408
          mapped=[]
          for i, ident in enumerate(rows,1):
              assert len(defs[ident])==1,(i,ident,defs[ident]); mapped.append((i,ident,*defs[ident][0]))
          full=collections.Counter(r[2] for r in mapped); prefix=collections.Counter(r[2] for r in mapped[:403])
          assert full=={"authority-kernel":30,"producer":262,"completion":75,"validation":41},full
          assert prefix=={"authority-kernel":30,"producer":257,"completion":75,"validation":41},prefix
          assert all(r[2]=="producer" for r in mapped[403:])
          with (evid/"owner-map.tsv").open("w") as f:
              for row in mapped: f.write("\t".join(map(str,row))+"\n")
          (evid/"owner-totals.txt").write_text(f"selector408={dict(full)}\nselector403={dict(prefix)}\n")
          expected={
            404:"SurfaceCellAuthorityContractCutover.ProductionA4PublishesAcceptedA2bA3ConformityReceipt",
            405:"SurfaceCellAuthorityContractCutover.FixedConformityPlanTargetPerturbationPreservesSharedBoundaryIntervals",
            406:"SurfaceCellAuthorityContractCutover.ExactSharedBoundaryIntervalRejectsMissingOrTamperedIdentityWithoutFallback",
            407:"SurfaceCellAuthorityContractCutover.A3SharedBoundaryCutoverPreservesA4LocalFamilyAndAdvanceSign",
            408:"RemeshPipeline.ExactA3ToA4TorusProductionPathPublishesTypedSharedBoundaryIdentity",
          }
          for n, name in expected.items(): assert rows[n-1]==name
          torus=(root/"tests/FieldAlignedCurveNetworkTests.cpp").read_text()
          name=expected[408].split('.',1)[1]
          assert torus.count(name)==1
          start=torus.index(name); end=torus.find("\nTEST(",start+len(name)); block=torus[start:end if end!=-1 else None]
          required=["InvalidHardRailPairing","sharedBoundaryInterval","conformityPlanReceipt","semantic_digest"]
          assert all(x in block for x in required), [x for x in required if x not in block]
          (evid/"row408-static-proof.txt").write_text("identity="+expected[408]+"\nowner=producer\nchecks=typed-shared-boundary,receipt,accepted-a2b-a3,not-InvalidHardRailPairing\n")
          PY

          mkdir -p "$TB_VIEW/bin" "$TB_VIEW/test-data/benchmarks"
          for b in directional_surface_cell_authority_kernel_tests directional_surface_cell_producer_tests \
            directional_surface_cell_completion_tests directional_surface_cell_validation_tests; do
            cp -a "$TB_PKG/bin/$b" "$TB_VIEW/bin/"
          done
          cp -a "$TB_SRC/benchmarks/fixtures" "$TB_VIEW/test-data/benchmarks/fixtures"
          census "$TB_VIEW" "$TB_EVID/execution-view-census-pre.tsv"
          echo "preflight=PASS" | tee "$TB_EVID/preflight-summary.txt"

      - name: Execute frozen TB3 matrix
        id: runtime
        if: ${{ steps.preflight.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          exec > >(tee -a "$TB_LOG") 2>&1
          map="$TB_EVID/owner-map.tsv"
          ledger="$TB_EVID/process-ledger.tsv"
          printf 'phase\tordinal\tidentity\towner\tcommand\texit\telapsed_ms\ttimeout\trun_count\tok_count\tskip_count\tverdict\n' > "$ledger"
          run_phase() {
            local phase="$1" first="$2" last="$3" dir="$TB_EVID/raw/$1"
            mkdir -p "$dir"
            for ((i=first; i<=last; ++i)); do
              IFS=$'\t' read -r ord ident owner bin src line digest < <(awk -F '\t' -v n="$i" '$1==n{print; exit}' "$map")
              raw="$dir/$(printf '%03d' "$ord").log"; cmd="$TB_VIEW/bin/$bin --gtest_filter=$ident"
              start="$(date +%s%N)"; set +e
              GTEST_FAIL_IF_NO_TEST_SELECTED=1 "$TB_VIEW/bin/$bin" "--gtest_filter=$ident" 2>&1 | tee "$raw" -a "$TB_LOG"
              rc=${PIPESTATUS[0]}; set +e; end="$(date +%s%N)"; ms=$(( (end-start)/1000000 ))
              run_count="$(grep -Fc "[ RUN      ] $ident" "$raw" || true)"; total_run="$(grep -Fc "[ RUN      ]" "$raw" || true)"
              ok_count="$(grep -Fc "[       OK ] $ident" "$raw" || true)"; skip_count="$(grep -Fc "[  SKIPPED ]" "$raw" || true)"
              verdict=PASS
              if [[ "$rc" -ne 0 || "$run_count" -ne 1 || "$total_run" -ne 1 || "$ok_count" -ne 1 || "$skip_count" -ne 0 ]]; then verdict=RED; fi
              printf '%s\t%s\t%s\t%s\t%s\t%s\t%s\tfalse\t%s\t%s\t%s\t%s\n' "$phase" "$ord" "$ident" "$bin" "$cmd" "$rc" "$ms" "$run_count" "$ok_count" "$skip_count" "$verdict" >> "$ledger"
              echo "tb_process phase=$phase ordinal=$ord verdict=$verdict exit=$rc elapsed_ms=$ms"
              if [[ "$verdict" != PASS ]]; then
                echo "blocker=semantic-or-selection-failure phase=$phase ordinal=$ord identity=$ident" | tee "$TB_EVID/blocker.txt"; return 1
              fi
            done
          }
          set +e
          run_phase focused-A 404 408; rc=$?
          if [[ "$rc" -eq 0 ]]; then run_phase focused-B 404 408; rc=$?; fi
          if [[ "$rc" -eq 0 ]]; then
            awk -F '\t' '$1=="focused-A"{print $2"\t"$3"\t"$12}' "$ledger" > "$TB_EVID/focused-A.tsv"
            awk -F '\t' '$1=="focused-B"{print $2"\t"$3"\t"$12}' "$ledger" > "$TB_EVID/focused-B.tsv"
            cmp "$TB_EVID/focused-A.tsv" "$TB_EVID/focused-B.tsv" || rc=1
          fi
          if [[ "$rc" -eq 0 ]]; then run_phase selector403 1 403; rc=$?; fi
          if [[ "$rc" -eq 0 ]]; then run_phase selector408 1 408; rc=$?; fi
          set +e
          python3 - "$ledger" "$TB_EVID/runtime-totals.txt" <<'PY'
          import collections,pathlib,sys
          ledger,out=map(pathlib.Path,sys.argv[1:]); rows=[x.split("\t") for x in ledger.read_text().splitlines()[1:]]
          lines=[]
          for phase in ("focused-A","focused-B","selector403","selector408"):
              part=[r for r in rows if r[0]==phase]; v=collections.Counter(r[11] for r in part); o=collections.Counter(r[3] for r in part)
              lines.append(f"{phase}: processes={len(part)} verdicts={dict(v)} owners={dict(o)}")
          out.write_text("\n".join(lines)+"\n")
          PY
          if [[ "$rc" -eq 0 ]]; then
            awk -F '\t' '$1=="selector403"{print $2"\t"$3"\t"$12}' "$ledger" > "$TB_EVID/selector403-verdicts.tsv"
            awk -F '\t' '$1=="selector408" && $2<=403{print $2"\t"$3"\t"$12}' "$ledger" > "$TB_EVID/selector408-prefix-verdicts.tsv"
            cmp "$TB_EVID/selector403-verdicts.tsv" "$TB_EVID/selector408-prefix-verdicts.tsv" || rc=1
          fi
          echo "$rc" > "$TB_EVID/runtime-exit-code.txt"
          exit "$rc"

      - name: Immutable postflight
        id: postflight
        if: ${{ always() && steps.preflight.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee -a "$TB_LOG") 2>&1
          census() {
            local base="$1" out="$2"
            find "$base" -type f -print0 | sort -z | while IFS= read -r -d '' f; do
              rel="${f#"$base"/}"; printf '%s\t%s\t%s\t%s\n' "$rel" "$(stat -c %s "$f")" "$(stat -c %a "$f")" "$(sha256sum "$f" | awk '{print $1}')"
            done > "$out"
          }
          census "$TB_PKG" "$TB_EVID/package-census-post.tsv"; census "$TB_SRC" "$TB_EVID/source-census-post.tsv"; census "$TB_VIEW" "$TB_EVID/execution-view-census-post.tsv"
          cmp "$TB_EVID/package-census-pre.tsv" "$TB_EVID/package-census-post.tsv"
          cmp "$TB_EVID/source-census-pre.tsv" "$TB_EVID/source-census-post.tsv"
          cmp "$TB_EVID/execution-view-census-pre.tsv" "$TB_EVID/execution-view-census-post.tsv"
          (cd "$TB_PKG" && sha256sum -c SHA256SUMS) | tee "$TB_EVID/manifest-post.txt"
          test "$(sha256sum "$TB_SRC/.agents/Directional/Architecture_M4_CP3_CB4_R3_Required_Green_Selector_403.txt" | awk '{print $1}')" = "c3f509afc823cd73761bdebea0d072d497acf5587a013cb52b795f273af70cb7"
          test "$(sha256sum "$TB_SRC/.agents/Directional/Architecture_M4_CP3_CB5_Required_Green_Selector_408.txt" | awk '{print $1}')" = "c689c0cd8a51f9a8bd8c9ed3a2e8b603728d5a0359ee2732f776a422744b0484"
          printf '%s\n' 'package_immutable=PASS' 'source_immutable=PASS' 'execution_view_immutable=PASS' 'manifest_post=28/28' \
            'selector403_immutable=PASS' 'selector408_immutable=PASS' 'configure=false' 'compile=false' 'relink=false' 'generated_discovery=false' 'package_repair=false' > "$TB_EVID/postflight-summary.txt"

      - name: Write terminal evidence summary
        if: always()
        env:
          PREFLIGHT_OUTCOME: ${{ steps.preflight.outcome }}
          RUNTIME_OUTCOME: ${{ steps.runtime.outcome }}
          POSTFLIGHT_OUTCOME: ${{ steps.postflight.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          { echo "preflight_outcome=$PREFLIGHT_OUTCOME"; echo "runtime_outcome=$RUNTIME_OUTCOME"; echo "postflight_outcome=$POSTFLIGHT_OUTCOME"; echo "expected_processes=821";
            if [[ -f "$TB_EVID/process-ledger.tsv" ]]; then echo "observed_processes=$(( $(wc -l < "$TB_EVID/process-ledger.tsv") - 1 ))"; else echo "observed_processes=0"; fi
            echo "finished_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"; } | tee "$TB_EVID/terminal-summary.txt" -a "$TB_LOG"
          cp "$TB_LOG" "$TB_EVID/activity-copy.log"

      - name: Upload TB3 result evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m4-cp3-tb3-exec-result-${{ github.run_id }}
          path: ${{ runner.temp }}/m4-cp3-tb3-exec/evidence
          if-no-files-found: error
          retention-days: 7

      - name: Upload TB3 diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m4-cp3-tb3-exec-log-${{ github.run_id }}
          path: ${{ runner.temp }}/m4-cp3-tb3-exec/activity.log
          if-no-files-found: error
          retention-days: 7

      - name: Propagate TB3 status
        if: always()
        env:
          PREFLIGHT_OUTCOME: ${{ steps.preflight.outcome }}
          RUNTIME_OUTCOME: ${{ steps.runtime.outcome }}
          POSTFLIGHT_OUTCOME: ${{ steps.postflight.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          test "$PREFLIGHT_OUTCOME" = success
          test "$RUNTIME_OUTCOME" = success
          test "$POSTFLIGHT_OUTCOME" = success
