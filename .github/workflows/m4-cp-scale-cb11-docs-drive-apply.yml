name: M4 CP SCALE CB11 Docs Drive Apply

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m4-cp-scale-cb11-docs-drive-apply.txt

permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

concurrency:
  group: m4-cp-scale-cb11-docs-drive-apply
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/m4-cp-scale-cb11-docs-drive-apply.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m4-cp-scale-cb11-docs-drive-apply
      commit_run_file: false
    secrets: inherit

  apply:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1PYQuDSTHUr4sFGuK7o-0U2XBM1ICN9_j
      patch_sha256: 1c6d63989991e20f64bc3ec9eb80009f746310f8db277d67052e7ce727bfa5c1
      base_sha: 9257fbf93796dfa5a13a6a15a2cc02106a1be1c3
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: "docs(m4): close CB11 and authorize TB10 execution"
    secrets: inherit
