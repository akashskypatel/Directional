name: Agent M3 CP4c0 CB7 Drive Apply

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m3-cp4c0-cb7-drive-apply.txt

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

concurrency:
  group: agent-m3-cp4c0-cb7-drive-apply
  cancel-in-progress: false

jobs:
  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m3-cp4c0-cb7-drive-apply
      commit_run_file: false
    secrets: inherit

  validate-caller:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/agent-m3-cp4c0-cb7-drive-apply.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  apply-patch:
    needs: validate-caller
    if: ${{ needs.validate-caller.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1i4yODW71ZI72IjDzqpVcYyHsNkmJIXci
      patch_sha256: b08c1dcc0df0219b976324117f2a10d467c25d6f91ba0979a9c97d9a61b90dfd
      base_sha: 077462da156c3e2dfbbc6867fc10d3e4442d853c
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: "docs: close M3 CP4c0 CB7 and freeze TB-R7"
    secrets: inherit
