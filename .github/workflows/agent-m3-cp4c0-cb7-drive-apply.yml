name: Agent M3 CP4c0 CB7 Drive Apply

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m3-cp4c0-cb7-drive-apply.txt

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

concurrency:
  group: agent-m3-cp4c0-cb7-drive-apply
  cancel-in-progress: false

jobs:
  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m3-cp4c0-cb7-drive-apply
      commit_run_file: false
    secrets: inherit

  validate-caller:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/agent-m3-cp4c0-cb7-drive-apply.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  apply-patch:
    needs: validate-caller
    if: ${{ needs.validate-caller.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1G3DcXU4cMtOaNUZ4yUa-5RAhrfIkBscz
      patch_sha256: 5ed3a4b1f564a51b517772b95b83b1e67a2cf800d361b46d77a332b23c1ad187
      base_sha: 6341b13c708f98208eece40dcccea5806a97b0c7
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: "test(M3): fix CP4c0 CB7 DomainResult access"
    secrets: inherit
