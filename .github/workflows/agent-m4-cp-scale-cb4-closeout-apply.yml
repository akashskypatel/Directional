name: Agent M4 CP SCALE CB4 Closeout Apply

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m4-cp-scale-cb4-closeout-apply/trigger.txt

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: agent-m4-cp-scale-cb4-closeout-apply-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/agent-m4-cp-scale-cb4-closeout-apply.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m4-cp-scale-cb4-closeout-apply
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  apply:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    runs-on: ubuntu-24.04
    outputs:
      closeout_sha: ${{ steps.apply_patch.outputs.closeout_sha }}
    steps:
      - name: Initialize persistent diagnostic log
        shell: bash
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/m4-cp-scale-cb4-closeout-apply.log"
          : > "$log"
          {
            echo "workflow=${GITHUB_WORKFLOW}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "event=${GITHUB_EVENT_NAME}"
            echo "event_sha=${GITHUB_SHA}"
            echo "ref=${GITHUB_REF}"
            echo "repository=${GITHUB_REPOSITORY}"
            echo "turn=M4-CP-SCALE-CB4"
            echo "turnBoundary=Code+Build-closeout-only"
            echo "runtimeExecution=false"
            echo "started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } | tee -a "$log"

      - name: Checkout exact trigger source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 8
          submodules: false
          lfs: false
          token: ${{ github.token }}

      - name: Verify payload and apply exact closeout patch
        id: apply_patch
        env:
          BASE_COMMIT: b347fbdb923b9dfff69c7467aa33fc5cfac31878
          PATCH_SHA256: 7cb96140381252494790f96feed4ec225191603c47e6e43340ee563540d6120c
          ENCODED_SHA256: 9dd32d5b5bc4d340bad74648d0789b906194efecad8e568a91c3d0f5e39f979c
          PAYLOAD: .agents/Directional/turn-payloads/m4-cp-scale-cb4-closeout.patch.gz.b64
          META: .agents/Directional/turn-payloads/m4-cp-scale-cb4-closeout.patch.meta.json
        shell: bash
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/m4-cp-scale-cb4-closeout-apply.log"
          exec > >(tee -a "$log") 2>&1
          trap 'status=$?; echo "apply_patch_exit=${status}"' EXIT

          echo "git_version=$(git --version)"
          echo "python_version=$(python3 --version 2>&1)"
          echo "base_commit=${BASE_COMMIT}"
          echo "trigger_sha=${GITHUB_SHA}"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$BASE_COMMIT" HEAD

          test "$(git rev-parse HEAD:TODO.md)" = c91fa51bccd267382e81f32a446879ad881b7441
          test "$(git rev-parse HEAD:.agents/Directional/Future_Chat_Session_Handoff.md)" = d31eca2915d8f55fc6fa0e4c4dc4e3159a2ba4a9
          test "$(git rev-parse HEAD:.agents/Directional/M4_Consolidated_Record.md)" = 2e21188145b8d5dd13272e8be47c1462f63d0eba
          test "$(git rev-parse HEAD:.agents/Directional/CHANGELOG.md)" = 34d27466d74055626c9a525d8bc59828a31a1ce8
          if git cat-file -e 'HEAD:.agents/Directional/Architecture_M4_CP_SCALE_TB4_EXEC_Test_Benchmark_Plan.md' 2>/dev/null; then
            echo 'TB4 plan unexpectedly already exists' >&2
            exit 2
          fi

          test -f "$PAYLOAD"
          test -f "$META"
          test "$(sha256sum "$PAYLOAD" | awk '{print $1}')" = "$ENCODED_SHA256"
          test "$(jq -r .base_commit "$META")" = "$BASE_COMMIT"
          test "$(jq -r .patch_sha256 "$META")" = "$PATCH_SHA256"
          test "$(jq -r .encoded_sha256 "$META")" = "$ENCODED_SHA256"
          test "$(jq -r .encoding "$META")" = 'gzip+base64'
          test "$(jq -r .fragment_count "$META")" = '1'

          decoded="${RUNNER_TEMP}/m4-cp-scale-cb4-closeout.patch.gz"
          patch="${RUNNER_TEMP}/m4-cp-scale-cb4-closeout.patch"
          base64 --decode "$PAYLOAD" > "$decoded"
          gzip -dc "$decoded" > "$patch"
          test "$(sha256sum "$patch" | awk '{print $1}')" = "$PATCH_SHA256"
          git apply --check "$patch"
          git apply "$patch"
          git diff --check

          cat > "${RUNNER_TEMP}/expected-paths.txt" <<'EOF'
          .agents/Directional/Architecture_M4_CP_SCALE_TB4_EXEC_Test_Benchmark_Plan.md
          .agents/Directional/CHANGELOG.md
          .agents/Directional/Future_Chat_Session_Handoff.md
          .agents/Directional/M4_Consolidated_Record.md
          TODO.md
          EOF
          git diff --name-only | LC_ALL=C sort > "${RUNNER_TEMP}/actual-paths.txt"
          diff -u "${RUNNER_TEMP}/expected-paths.txt" "${RUNNER_TEMP}/actual-paths.txt"

          test "$(sha256sum TODO.md | awk '{print $1}')" = 066daa4a710d7c0c791a6912484b1e3ccad725d1b66473bc5128e72436bce5e2
          test "$(sha256sum .agents/Directional/Future_Chat_Session_Handoff.md | awk '{print $1}')" = 2ab783b791b7359e7b7ea749618bc916af997801a36a8454fccac8d68575ce52
          test "$(sha256sum .agents/Directional/M4_Consolidated_Record.md | awk '{print $1}')" = 3acf03b43a8ac814a0a57fa4b6f426bc4b13564635336a762d818a4979010f29
          test "$(sha256sum .agents/Directional/CHANGELOG.md | awk '{print $1}')" = 7cf5112ea22cd433e63cd879b18cb6e7c2e13f9292677522b3adc62fef8028cf
          test "$(sha256sum .agents/Directional/Architecture_M4_CP_SCALE_TB4_EXEC_Test_Benchmark_Plan.md | awk '{print $1}')" = bfa944cb23e8c6d9012727386ec2fb159f91af89036c26802e0706a2069d418e

          test -z "$(git diff --name-only -- .github/workflows)"
          git status --short
          git add -- \
            TODO.md \
            .agents/Directional/Future_Chat_Session_Handoff.md \
            .agents/Directional/M4_Consolidated_Record.md \
            .agents/Directional/CHANGELOG.md \
            .agents/Directional/Architecture_M4_CP_SCALE_TB4_EXEC_Test_Benchmark_Plan.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: close M4 CP SCALE CB4"
          closeout_sha="$(git rev-parse HEAD)"

          remote_sha="$(git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | cut -f1)"
          echo "remote_sha_before_push=${remote_sha}"
          test -n "$remote_sha"
          test "$remote_sha" = "$GITHUB_SHA"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          echo "closeout_sha=${closeout_sha}" >> "$GITHUB_OUTPUT"
          echo "closeout_sha=${closeout_sha}"
          echo 'runtimeExecution=false'

      - name: Write closeout result metadata
        if: always()
        env:
          CLOSEOUT_SHA: ${{ steps.apply_patch.outputs.closeout_sha }}
        shell: bash
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/m4-cp-scale-cb4-closeout-apply.log"
          out="${RUNNER_TEMP}/m4-cp-scale-cb4-closeout-result"
          mkdir -p "$out"
          {
            echo "turn=M4-CP-SCALE-CB4"
            echo "base_commit=b347fbdb923b9dfff69c7467aa33fc5cfac31878"
            echo "trigger_sha=${GITHUB_SHA}"
            echo "closeout_sha=${CLOSEOUT_SHA:-unavailable}"
            echo "patch_sha256=7cb96140381252494790f96feed4ec225191603c47e6e43340ee563540d6120c"
            echo "encoded_sha256=9dd32d5b5bc4d340bad74648d0789b906194efecad8e568a91c3d0f5e39f979c"
            echo "runtimeExecution=false"
            echo "job_status=${{ job.status }}"
          } > "$out/closeout-result.txt"
          cp "${RUNNER_TEMP}/expected-paths.txt" "$out/expected-paths.txt" 2>/dev/null || true
          cp "${RUNNER_TEMP}/actual-paths.txt" "$out/actual-paths.txt" 2>/dev/null || true
          cat "$out/closeout-result.txt" | tee -a "$log"

      - name: Upload closeout result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m4-cp-scale-cb4-closeout-result-${{ github.run_id }}
          path: ${{ runner.temp }}/m4-cp-scale-cb4-closeout-result
          if-no-files-found: error
          retention-days: 7

      - name: Record final source status
        if: always()
        shell: bash
        run: |
          set +e
          log="${RUNNER_TEMP}/m4-cp-scale-cb4-closeout-apply.log"
          {
            echo "final_job_status=${{ job.status }}"
            echo "final_sha=$(git rev-parse HEAD 2>/dev/null || echo unavailable)"
            git status --short 2>&1 || true
            echo "runtimeExecution=false"
            echo "finished_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } | tee -a "$log"

      - name: Upload diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m4-cp-scale-cb4-closeout-log-${{ github.run_id }}
          path: ${{ runner.temp }}/m4-cp-scale-cb4-closeout-apply.log
          if-no-files-found: error
          retention-days: 7
