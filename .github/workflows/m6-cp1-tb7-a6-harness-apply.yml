      source_ref: ${{ github.sha }}
    secrets: inherit

  apply:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1YsZ1ohNHlryQ78xRQ84r-tc-ay4RdTEG
      patch_sha256: 6b1d8e7d016bf8cf465a40b1a0c892c843d9ba280ad595fa93c9ded9d5d6759b
