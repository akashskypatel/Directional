name: M5 CP3 CB15 Source Apply

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m5-cp3-cb15-source-apply.txt

permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

concurrency:
  group: m5-cp3-cb15-source-apply-${{ github.ref }}
  cancel-in-progress: false

jobs:
  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m5-cp3-cb15-source-apply
      commit_run_file: false
      trim_stale_comments: false
    secrets: inherit

  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/m5-cp3-cb15-source-apply.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  apply:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 15nXEreUmuqvVi-sUDuuMcl0mJasCD_PM
      patch_sha256: 7a418678efb7a4e9fe491c843423b241cea0bd33059b98c0e23215dfd89cbf55
      base_sha: 5708be8fc7a44ca39963d84bc35df04df1e8cdca
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: "M5 CP3 CB15 semantic periodic direction diagnostics"
    secrets: inherit
