name: M6 CP2 CB1 Verifier R3 Drive Apply

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m6-cp2-cb1-verifier-r3-drive-apply.txt

permissions:
  actions: read
  contents: write
  id-token: write

concurrency:
  group: m6-cp2-cb1-verifier-r3-drive-apply
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/m6-cp2-cb1-verifier-r3-drive-apply.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  apply:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1u1VZZVK_yXXhoTGMUc9BUvefl3fUjzyR
      patch_sha256: ff363f0ea6daa9cfe12c90cbc03f901e9084164d336aae9be01bf4bc932c7c97
      base_sha: 8cb9903dc4491351e79891aace27e838cce7844e
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: "M6 CP2 verifier R3 exact three-hop binding"
    secrets: inherit

  mailbox:
    if: ${{ always() }}
    needs: [apply]
    uses: ./.github/workflows/workflow-mailbox-publisher.yml
    with:
      workflow_key: m6-cp2-cb1-verifier-r3-drive-apply
      source_sha: ${{ github.sha }}
      source_ref: ${{ github.ref }}
      result: ${{ needs.apply.result }}
      summary: Apply the verified M6 CP2 verifier R3 preservation patch from Google Drive.
