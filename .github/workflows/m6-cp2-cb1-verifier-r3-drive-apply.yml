name: M6 CP2 CB1 Verifier R3 Drive Apply

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m6-cp2-cb1-verifier-r3-closeout-apply.txt

permissions:
  actions: read
  contents: write
  id-token: write

concurrency:
  group: m6-cp2-cb1-verifier-r3-drive-apply
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/m6-cp2-cb1-verifier-r3-drive-apply.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  apply:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1TbGXNHNIty1voWnMbgCGlKNHxWV-SMu6
      patch_sha256: e458c016ecea5a6d73893c501af73753a7ef0c005b43fdaca3ad600673a98b4c
      base_sha: c64baacd6c767c4ba053b6963651c0aa6eceed20
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: "docs(agent): close M6 CP2 verifier R3"
    secrets: inherit

  mailbox:
    if: ${{ always() }}
    needs: [apply]
    uses: ./.github/workflows/workflow-mailbox-publisher.yml
    with:
      workflow_key: m6-cp2-cb1-verifier-r3-drive-apply
      source_sha: ${{ github.sha }}
      source_ref: ${{ github.ref }}
      result: ${{ needs.apply.result }}
      summary: Apply durable M6 CP2 verifier R3 closeout documentation from Google Drive.
