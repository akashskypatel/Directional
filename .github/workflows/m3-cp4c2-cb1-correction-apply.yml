name: M3 CP4c2 CB1 Correction Apply

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m3-cp4c2-cb1-correction-apply/**

permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

jobs:
  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m3-cp4c2-cb1-correction-apply
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/m3-cp4c2-cb1-correction-apply.yml
    secrets: inherit

  apply:
    needs: validate
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 19eUFieM9mp7xNGCkDAHrHVNUnPhoFnzO
      patch_sha256: e54fdc67e548328287614a46c86458180a3d1e6701a52d16754b9c1550c952b1
      base_sha: 906a76c686b6d5ce27e4c58611a1b5d5d3a8b2c0
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: "M3-CP4c-2-CB1: add falsifiable complement measurement and conditional gates"
      retention_days: 7
    secrets: inherit
