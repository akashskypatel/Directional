name: Agent TB7 Workflow Draft Validator

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/tb7-workflow-validation/**

permissions:
  contents: write
  actions: read
  issues: write
  pull-requests: write

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .agents/Directional/turn-payloads/m3-cp4c3-tb7-20260901.yml
    secrets: inherit

  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: M3-CP4c-3-TB7-workflow-validation
      trim_stale_comments: true
    secrets: inherit
