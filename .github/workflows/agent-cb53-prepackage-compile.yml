name: Agent CB53 Prepackage Compile

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/compile/cb53-prepackage-20260909.txt

permissions:
  contents: write
  actions: write
  issues: write
  pull-requests: write

concurrency:
  group: directional-cb53-prepackage-compile
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/agent-cb53-prepackage-compile.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: cb53-prepackage-compile
      commit_run_file: false
      trim_stale_comments: false
    secrets: inherit

  compile:
    needs: validate
    uses: ./.github/workflows/agent-compile-reusable.yml
    with:
      source_sha: c772b53f1c42e117a948f14f77a33ab3dd2619a2
      targets: directional_surface_cell_producer_tests
      artifact_prefix: m3-cp4c3-cb53-prepackage
    secrets: inherit
