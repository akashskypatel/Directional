name: m1h-field-chart-test-authority-remediation-code-build

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - '.agents/connector-triggers/m1h-field-chart-test-authority-remediation-code-build'

permissions:
  contents: write
  actions: read

concurrency:
  group: m1h-field-chart-test-authority-remediation-code-build
  cancel-in-progress: false

env:
  LOG_DIR: /tmp/m1h-field-chart-test-authority-remediation-code-build-logs
  ACTIVITY_LOG: /tmp/m1h-field-chart-test-authority-remediation-code-build-logs/activity.log
  BRANCH: agent/surface_cell_quad/p5-recover-bridge-healing
  BASE_M1H: de4e2ba7c19d2e49931655dc22d758f50656d054
  ACCEPTED_M1G: ee1abbd91d8ab39b84b107bba73ebf7aa0acceb2

jobs:
  code-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Initialize persistent activity log
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$LOG_DIR"
          printf '%s\n' \
            'turn=M1h Phase-Front Field-Chart Test-Authority Remediation Code+Build' \
            "run_id=$GITHUB_RUN_ID" \
            "run_attempt=$GITHUB_RUN_ATTEMPT" \
            "event_sha=$GITHUB_SHA" \
            "ref=$GITHUB_REF" \
            "base_m1h=$BASE_M1H" \
            "accepted_m1g=$ACCEPTED_M1G" \
            'runtimeExecution=false' \
            'testExecution=false' \
            'benchmarkExecution=false' \
            'ctestExecution=false' \
            'cliExecution=false' \
            'fuzzerExecution=false' \
            'customInputExecution=false' \
            'prohibited=generated Directional binary execution; discovery; tests; benchmarks; ctest; CLI/GUI/help/version; fuzzers; custom input' \
            "started_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)" | tee "$ACTIVITY_LOG"

      - name: Checkout exact triggering branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.BRANCH }}
          fetch-depth: 500
          submodules: false

      - name: Apply surgical test-authority repair and push exact implementation
        id: source
        shell: bash
        run: |
          set -Eeuo pipefail
          exec > >(tee -a "$ACTIVITY_LOG") 2>&1
          trap 'rc=$?; echo "step=test-authority-edit exit_code=$rc"; git status --short --branch || true; exit $rc' EXIT
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$BASE_M1H" HEAD
          for path in \
            include/directional/geometry/SurfaceCellTracing.h \
            src/geometry/SurfaceCellTracing.cpp \
            src/pipeline/RemeshPipeline.cpp \
            tests/SurfaceCellsPhase10Tests.cpp \
            tests/TestFixturePaths.h; do
            test "$(git rev-parse "HEAD:$path")" = "$(git rev-parse "$BASE_M1H:$path")"
          done
          python3 .agents/Directional/turn-payloads/m1h-field-chart-test-authority-remediation.py
          git diff --check
          mapfile -t changed < <(git diff --name-only | LC_ALL=C sort)
          printf '%s\n' "${changed[@]}" | tee "$LOG_DIR/changed-source-paths.txt"
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = 'tests/SurfaceCellsPhase10Tests.cpp'
          python3 - <<'PY' | tee "$LOG_DIR/static-contracts.txt"
          from pathlib import Path
          import re
          tests = Path('tests/SurfaceCellsPhase10Tests.cpp').read_text()
          fixture = Path('tests/TestFixturePaths.h').read_text()
          suite = 'SurfaceCellPhaseFrontFieldChartAuthorityMigration'
          names = [n.strip() for n in re.findall(r'TEST\(\s*' + re.escape(suite) + r'\s*,\s*([^)]+)\)', tests)]
          assert len(names) == 6 and len(set(names)) == 6, names
          assert 'MultipleOrientationChartsPreserveEstablishedNumbering' in names
          assert 'EXPECT_EQ((std::set<std::size_t>{0U, 1U, 2U}), typedCharts);' not in tests
          assert 'EXPECT_EQ((std::set<int>{0, 1, 2}), producerCompatibilityCharts);' in tests
          assert 'expectedChartByFace[3] = 1;' in tests
          assert 'expectedChartByFace[10] = 2;' in tests
          assert 'EXPECT_GE(typedOccurrenceCharts.size(), 2U)' in tests
          assert 'std::set<std::size_t>{0U, 2U}' not in tests
          assert 'std::set<int>{0, 2}' not in tests
          assert 'executableDirectory.parent_path() / "test-data"' in fixture
          print('M1h focused contracts=6')
          print('producer chart domain oracle={0,1,2}')
          print('lattice occurrence coverage is checked per source face, not equated to producer-domain coverage')
          print('production delta=none')
          PY
          parent=$(git rev-parse HEAD)
          git config user.name 'OpenAI Directional Agent'
          git config user.email 'directional-agent@users.noreply.github.com'
          git add -- tests/SurfaceCellsPhase10Tests.cpp
          git diff --cached --check
          git commit -m 'test: repair phase-front field-chart authority witness'
          implementation=$(git rev-parse HEAD)
          git push origin "HEAD:$BRANCH"
          remote=$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)
          test "$remote" = "$implementation"
          for path in \
            include/directional/geometry/SurfaceCellTracing.h \
            src/geometry/SurfaceCellTracing.cpp \
            src/pipeline/RemeshPipeline.cpp \
            tests/TestFixturePaths.h; do
            test "$(git rev-parse "$implementation:$path")" = "$(git rev-parse "$BASE_M1H:$path")"
          done
          printf '%s\n' "source_parent=$parent" "implementation_commit=$implementation" > "$LOG_DIR/source-authority.txt"
          echo "implementation=$implementation" >> "$GITHUB_OUTPUT"
          echo "source_parent=$parent" >> "$GITHUB_OUTPUT"
          echo "implementation_commit=$implementation"

      - name: Install compile prerequisites
        shell: bash
        run: |
          set -Eeuo pipefail
          exec > >(tee -a "$ACTIVITY_LOG") 2>&1
          sudo apt-get update
          sudo apt-get install -y ninja-build libgmp-dev xz-utils time

      - name: Fetch shallow submodules
        shell: bash
        run: |
          set -Eeuo pipefail
          exec > >(tee -a "$ACTIVITY_LOG") 2>&1
          git submodule sync --recursive
          git -c protocol.version=2 submodule update --init --recursive --depth 1 --recommend-shallow
          git submodule status --recursive | tee "$LOG_DIR/submodules.txt"

      - name: Record toolchain and exact source authority
        shell: bash
        run: |
          set -Eeuo pipefail
          exec > >(tee -a "$ACTIVITY_LOG") 2>&1
          test "$(git rev-parse HEAD)" = '${{ steps.source.outputs.implementation }}'
          test -z "$(git status --porcelain=v1)"
          git --version
          cmake --version
          ninja --version
          c++ --version | head -n 1
          git diff --check '${{ steps.source.outputs.source_parent }}' '${{ steps.source.outputs.implementation }}'
          mapfile -t committed < <(git diff --name-only '${{ steps.source.outputs.source_parent }}' '${{ steps.source.outputs.implementation }}')
          test "${#committed[@]}" -eq 1
          test "${committed[0]}" = 'tests/SurfaceCellsPhase10Tests.cpp'

      - name: Configure Release static compile-only build
        shell: bash
        run: |
          set -Eeuo pipefail
          exec > >(tee -a "$ACTIVITY_LOG") 2>&1
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DDIRECTIONAL_ENABLE_GMP=ON \
            -DDIRECTIONAL_ENABLE_PARDISO=OFF \
            -DDIRECTIONAL_ENABLE_CUDSS=OFF \
            -DDIRECTIONAL_ENABLE_SUITESPARSE=OFF \
            -DDIRECTIONAL_BUILD_TESTS=ON \
            -DDIRECTIONAL_BUILD_BENCHMARKS=ON \
            -DDIRECTIONAL_BUILD_CLI=OFF \
            -DDIRECTIONAL_BUILD_GUI=OFF \
            -DBUILD_PYTHON=OFF \
            -DBUILD_TUTORIALS=OFF \
            -DCMAKE_GTEST_DISCOVER_TESTS_DISCOVERY_MODE=PRE_TEST \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON 2>&1 | tee "$LOG_DIR/configure.log"

      - name: Compile approved targets only
        shell: bash
        run: |
          set -Eeuo pipefail
          exec > >(tee -a "$ACTIVITY_LOG") 2>&1
          /usr/bin/time -v -o "$LOG_DIR/build-resources.txt" \
            cmake --build build --parallel 2 --target \
              directional_core \
              directional_pipeline \
              directional_compiled_api_tests \
              directional_surface_cell_producer_tests \
              directional_surface_cell_oracle_tests \
              directional_surface_cell_authority_kernel_tests \
              directional_surface_cell_completion_tests \
              directional_surface_cell_validation_tests \
              directional_benchmarks 2>&1 | tee "$LOG_DIR/build.log"

      - name: Package immutable compile artifact
        id: package
        shell: bash
        run: |
          set -Eeuo pipefail
          exec > >(tee -a "$ACTIVITY_LOG") 2>&1
          implementation='${{ steps.source.outputs.implementation }}'
          source_parent='${{ steps.source.outputs.source_parent }}'
          test "$(git rev-parse HEAD)" = "$implementation"
          pkg="$RUNNER_TEMP/m1h-field-chart-test-authority-remediation-code-build-result"
          mkdir -p "$pkg/bin" "$pkg/lib" "$pkg/logs" "$pkg/metadata" "$pkg/source" "$pkg/test-data/benchmarks"
          for exe in directional_compiled_api_tests directional_surface_cell_producer_tests directional_surface_cell_oracle_tests directional_surface_cell_authority_kernel_tests directional_surface_cell_completion_tests directional_surface_cell_validation_tests directional_benchmarks; do
            test -x "build/$exe"
            cp "build/$exe" "$pkg/bin/$exe"
          done
          cp build/libdirectional_core.a build/libdirectional_pipeline.a "$pkg/lib/"
          cp -a benchmarks/fixtures "$pkg/test-data/benchmarks/fixtures"
          cp "$LOG_DIR"/* "$pkg/logs/"
          cp build/compile_commands.json "$pkg/source/compile_commands.json"
          git diff --binary "$source_parent" "$implementation" -- tests/SurfaceCellsPhase10Tests.cpp \
            > "$pkg/source/m1h-field-chart-test-authority-remediation.patch"
          git archive --format=tar "$implementation" | xz -T0 -6 \
            > "$pkg/source/directional-m1h-test-authority-remediation-source-no-deps.tar.xz"
          python3 - <<'PY' > "$pkg/metadata/focused-test-counts.txt"
          from pathlib import Path
          import re
          p10 = Path('tests/SurfaceCellsPhase10Tests.cpp').read_text()
          quotient = Path('tests/SurfaceCellTransitionQuotientTests.cpp').read_text()
          optimizer = Path('tests/SurfaceMeshOptimizerPhase22Tests.cpp').read_text()
          authority = Path('tests/SurfaceCellAuthorityKernelTests.cpp').read_text()
          oracle = Path('tests/SurfaceCellProductOracleTests.cpp').read_text()
          suites = {
              'M1h': (p10, 'SurfaceCellPhaseFrontFieldChartAuthorityMigration', 6),
              'M1g': (p10, 'SurfaceCellPeriodicHolonomyRouteTransportAuthorityMigration', 6),
              'M1f': (p10, 'SurfaceCellVertexContinuationRouteTransportAuthorityMigration', 6),
              'M1e': (p10, 'SurfaceCellSegmentRouteTransportAuthorityMigration', 6),
              'M1c': (p10, 'SurfaceCellFieldTransitionAuthorityMigration', 6),
              'M1d': (quotient, 'SurfaceCellPhaseFrontRouteAuthorityMigration', 6),
              'M1b': (optimizer, 'SurfaceOptimizationRailAuthorityMigration', 6),
          }
          for label, (text, suite, expected) in suites.items():
              names = [n.strip() for n in re.findall(r'TEST\(\s*' + re.escape(suite) + r'\s*,\s*([^)]+)\)', text)]
              assert len(names) == expected and len(set(names)) == expected, (label, names)
              print(f'{label}={len(names)}')
              Path(f'/tmp/{label}-tests.txt').write_text('\n'.join(f'{suite}.{name}' for name in names) + '\n')
          all_authority = re.findall(r'TEST\(\s*([^,]+),\s*([^)]+)\)', authority)
          all_oracle = re.findall(r'TEST\(\s*([^,]+),\s*([^)]+)\)', oracle)
          assert len(all_authority) == 14 and len(set(all_authority)) == 14
          assert len(all_oracle) == 29 and len(set(all_oracle)) == 29
          print('M1a=14')
          print('T1=29')
          Path('/tmp/M1a-tests.txt').write_text('\n'.join(f'{a.strip()}.{b.strip()}' for a, b in all_authority) + '\n')
          Path('/tmp/T1-tests.txt').write_text('\n'.join(f'{a.strip()}.{b.strip()}' for a, b in all_oracle) + '\n')
          PY
          for label in M1h M1g M1f M1e M1d M1c M1b; do
            cp "/tmp/$label-tests.txt" "$pkg/metadata/${label,,}-focused-test-names.txt"
          done
          cp /tmp/M1a-tests.txt "$pkg/metadata/m1a-test-names.txt"
          cp /tmp/T1-tests.txt "$pkg/metadata/t1-oracle-test-names.txt"
          printf '%s\n' \
            'UniformPhaseFront/SurfaceCellDesignAcceptance.ProducesDirectSourceAuthoritativePureQuadOutput/Plane' \
            'UniformPhaseFront/SurfaceCellDesignAcceptance.ProducesDirectSourceAuthoritativePureQuadOutput/MultiFaceSeam' \
            'UniformPhaseFront/SurfaceCellDesignAcceptance.ProducesDirectSourceAuthoritativePureQuadOutput/CloseSheets' \
            'UniformPhaseFront/SurfaceCellDesignAcceptance.ProducesDirectSourceAuthoritativePureQuadOutput/Cylinder' \
            > "$pkg/metadata/direct-product-test-names.txt"
          printf '%s\n' \
            'runtimeExecution=false' \
            'testExecution=false' \
            'benchmarkExecution=false' \
            'ctestExecution=false' \
            'cliExecution=false' \
            'fuzzerExecution=false' \
            'customInputExecution=false' \
            > "$pkg/metadata/command-boundary.txt"
          cat > "$pkg/metadata/build-authority.json" <<EOF
          {
            "turn": "M1h Phase-Front Field-Chart Test-Authority Remediation Code+Build",
            "implementationCommit": "$implementation",
            "sourceParent": "$source_parent",
            "baseM1hProductionImplementation": "$BASE_M1H",
            "acceptedM1gImplementation": "$ACCEPTED_M1G",
            "eventCommit": "$GITHUB_SHA",
            "runId": "$GITHUB_RUN_ID",
            "runAttempt": "$GITHUB_RUN_ATTEMPT",
            "configuration": "Release",
            "generator": "Ninja",
            "sharedLibraries": false,
            "gtestDiscoveryMode": "PRE_TEST",
            "productionSourceDelta": false,
            "runtimeExecution": false,
            "testExecution": false,
            "benchmarkExecution": false,
            "ctestExecution": false,
            "cliExecution": false,
            "fuzzerExecution": false,
            "customInputExecution": false
          }
          EOF
          for item in \
            'include/directional/geometry/SurfaceCellTracing.h:tracing-header-blob.txt' \
            'src/geometry/SurfaceCellTracing.cpp:tracing-blob.txt' \
            'src/pipeline/RemeshPipeline.cpp:pipeline-blob.txt' \
            'tests/SurfaceCellsPhase10Tests.cpp:phase10-test-blob.txt' \
            'tests/TestFixturePaths.h:fixture-paths-blob.txt' \
            '.agents/Directional/Future_Chat_Session_Handoff.md:handoff-blob.txt' \
            '.agents/Directional/GitHub_Workflow_Policy.md:workflow-policy-blob.txt' \
            '.agents/Directional/Architecture_M1h_Phase_Front_Field_Chart_Test_Authority_Remediation_Code_Build_Plan.md:m1h-remediation-plan-blob.txt' \
            '.agents/Directional/Architecture_M1h_Phase_Front_Field_Chart_Consumer_Artifact_Only_Test_Benchmark_Report.md:m1h-blocked-runtime-report-blob.txt'; do
            src=${item%%:*}
            out=${item##*:}
            git rev-parse "$implementation:$src" > "$pkg/metadata/$out"
          done
          find "$pkg/test-data/benchmarks/fixtures" -type f | LC_ALL=C sort > "$pkg/metadata/fixture-files.txt"
          test "$(wc -l < "$pkg/metadata/fixture-files.txt")" -eq 27
          find "$pkg/bin" -maxdepth 1 -type f | LC_ALL=C sort | xargs sha256sum > "$pkg/metadata/executable-sha256.txt"
          find "$pkg/lib" -maxdepth 1 -type f | LC_ALL=C sort | xargs sha256sum > "$pkg/metadata/library-sha256.txt"
          (cd "$pkg" && find . -type f ! -name SHA256SUMS -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > SHA256SUMS)
          sha256sum "$pkg/SHA256SUMS" | tee "$LOG_DIR/manifest-sha256.txt"
          find "$pkg" -type f | LC_ALL=C sort > "$LOG_DIR/package-files.txt"
          printf '%s\n' \
            "implementation_commit=$implementation" \
            "source_parent=$source_parent" \
            "package_dir=$pkg" \
            'productionSourceDelta=false' \
            'runtimeExecution=false' > "$LOG_DIR/result.txt"
          echo "package_dir=$pkg" >> "$GITHUB_OUTPUT"

      - name: Upload immutable build result
        uses: actions/upload-artifact@v4
        with:
          name: m1h-field-chart-test-authority-remediation-code-build-result
          path: ${{ steps.package.outputs.package_dir }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 6

      - name: Upload detailed activity log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m1h-field-chart-test-authority-remediation-code-build-logs
          path: /tmp/m1h-field-chart-test-authority-remediation-code-build-logs
          if-no-files-found: error
          retention-days: 14
          compression-level: 6
