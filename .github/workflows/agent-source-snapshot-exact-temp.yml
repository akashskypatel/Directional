name: Agent Exact Source Snapshot

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/source-snapshot-exact/**

permissions:
  contents: write
  actions: read
  issues: write
  pull-requests: write

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/agent-source-snapshot-exact-temp.yml
    secrets: inherit

  snapshot:
    needs: validate
    uses: ./.github/workflows/agent-source-snapshot.yml
    with:
      source_ref: 095461e2a749e39c4b344805748b1e3bd870a063
      artifact_prefix: source-snapshot-095461e2
    secrets: inherit
