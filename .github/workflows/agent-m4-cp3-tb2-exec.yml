name: Agent M4 CP3 TB2 EXEC

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m4-cp3-tb2-exec.txt

permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: agent-m4-cp3-tb2-exec
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/agent-m4-cp3-tb2-exec.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m4-cp3-tb2-exec
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  execute:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    steps:
      - name: Initialize persistent diagnostic log
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/m4-cp3-tb2-exec"
          evid="$root/evidence"
          mkdir -p "$evid/raw"
          log="$root/activity.log"
          : > "$log"
          {
            echo "workflow=$GITHUB_WORKFLOW"
            echo "run_id=$GITHUB_RUN_ID"
            echo "event=$GITHUB_EVENT_NAME"
            echo "event_sha=$GITHUB_SHA"
            echo "ref=$GITHUB_REF"
            echo "candidate=package120-selector403"
            echo "artifact_id=10280703200"
            echo "source_sha=3f909a5a2cfd305d423faf7a260bc465c7b06892"
            echo "turnBoundary=Test+Benchmark/TB-EXEC"
            echo "executionMode=artifact-only"
            echo "compile=false"
            echo "benchmark=false"
            echo "started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } | tee -a "$log"
          {
            echo "TB2_ROOT=$root"
            echo "TB2_EVID=$evid"
            echo "TB2_LOG=$log"
            echo "TB2_PKG=$root/package"
            echo "TB2_SRC=$root/source"
            echo "TB2_VIEW=$root/execution-view"
          } >> "$GITHUB_ENV"

      - name: Immutable artifact and selector preflight
        id: preflight
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee -a "$TB2_LOG") 2>&1
          trap 'rc=$?; echo "$rc" > "$TB2_EVID/preflight-exit-code.txt"; exit "$rc"' EXIT
          zip="$TB2_ROOT/package.zip"
          meta="$TB2_EVID/artifact-provider.json"
          curl -fsS \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/10280703200" > "$meta"
          provider_digest="$(jq -r '.digest' "$meta")"
          provider_size="$(jq -r '.size_in_bytes' "$meta")"
          test "$provider_digest" = "sha256:3f0ae49f1549ff2f5c4f821ee1db5bc0314405f8f726c04cecaaf5fa3cdf80a4"
          curl -fL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/10280703200/zip" \
            -o "$zip"
          downloaded_digest="$(sha256sum "$zip" | awk '{print $1}')"
          downloaded_size="$(stat -c %s "$zip")"
          test "$downloaded_digest" = "3f0ae49f1549ff2f5c4f821ee1db5bc0314405f8f726c04cecaaf5fa3cdf80a4"
          test "$downloaded_size" = "$provider_size"
          printf 'provider_digest=%s\nprovider_size=%s\ndownloaded_digest=%s\ndownloaded_size=%s\n' \
            "$provider_digest" "$provider_size" "$downloaded_digest" "$downloaded_size" \
            | tee "$TB2_EVID/artifact-identity.txt"

          mkdir -p "$TB2_PKG" "$TB2_SRC"
          unzip -q "$zip" -d "$TB2_PKG"
          (cd "$TB2_PKG" && sha256sum -c SHA256SUMS) | tee "$TB2_EVID/manifest-pre.txt"
          test "$(wc -l < "$TB2_PKG/SHA256SUMS")" -eq 28
          find "$TB2_PKG" -type f ! -name SHA256SUMS -printf './%P\n' | sort > "$TB2_EVID/package-paths.txt"
          awk '{print $2}' "$TB2_PKG/SHA256SUMS" | sort > "$TB2_EVID/manifest-paths.txt"
          cmp "$TB2_EVID/package-paths.txt" "$TB2_EVID/manifest-paths.txt"
          for b in \
            directional_surface_cell_authority_kernel_tests \
            directional_surface_cell_producer_tests \
            directional_surface_cell_completion_tests \
            directional_surface_cell_validation_tests; do
            test "$(stat -c %a "$TB2_PKG/bin/$b")" = 755
          done

          census() {
            local base="$1" out="$2"
            find "$base" -type f -print0 | sort -z | while IFS= read -r -d '' f; do
              rel="${f#"$base"/}"
              printf '%s\t%s\t%s\t%s\n' "$rel" "$(stat -c %s "$f")" \
                "$(stat -c %a "$f")" "$(sha256sum "$f" | awk '{print $1}')"
            done > "$out"
          }
          census "$TB2_PKG" "$TB2_EVID/package-census-pre.tsv"

          test "$(cat "$TB2_PKG/metadata/source-commit.txt")" = "3f909a5a2cfd305d423faf7a260bc465c7b06892"
          test "$(cat "$TB2_PKG/metadata/preflight-target.txt")" = "directional_surface_cell_producer_tests"
          test "$(cat "$TB2_PKG/metadata/preflight-exit-code.txt")" = 0
          test "$(cat "$TB2_PKG/metadata/build-exit-code.txt")" = 0
          for v in runtimeExecution=false turnBoundary=Code+Build-only exactArithmeticBackend=GMP \
            preflightCompile=true semanticContracts=compiled-not-executed \
            manifestExcludesSelf=true buildLocation=runner-temp-out-of-tree; do
            grep -Fxq "$v" "$TB2_PKG/metadata/command-boundary.txt"
          done
          grep -qi gmpxx "$TB2_PKG/metadata/gmp-evidence.txt"
          grep -qi gmp "$TB2_PKG/metadata/gmp-evidence.txt"
          for f in "$TB2_PKG"/metadata/source-status-*.txt; do test ! -s "$f"; done

          tar -xzf "$TB2_PKG/source/source-3f909a5a2cfd305d423faf7a260bc465c7b06892.tar.gz" -C "$TB2_SRC"
          census "$TB2_SRC" "$TB2_EVID/source-census-pre.tsv"
          sel="$TB2_SRC/.agents/Directional/Architecture_M4_CP3_CB4_R1_Required_Green_Selector_403.txt"
          old="$TB2_SRC/.agents/Directional/Architecture_M4_CP3_Required_Green_Selector_394.txt"
          test "$(wc -l < "$sel")" -eq 403
          test "$(sha256sum "$sel" | awk '{print $1}')" = "e8f4fe72cfbbd458289779125c7ff65d7344370df6a6fc98749b4ed9007de802"
          test "$(head -n 394 "$sel" | sha256sum | awk '{print $1}')" = "6c27b3a0fc7259c5817bc9bbf41d5e2a23b7dd20f41fb75db8789abeb2cfba68"
          test "$(head -n 382 "$sel" | sha256sum | awk '{print $1}')" = "1d59b1f709e51854f8ceaee1a161687ff882a128dabdc79882712c97a15ca84f"
          cmp <(head -n 394 "$sel") "$old"

          python3 - "$TB2_SRC" "$sel" "$TB2_EVID" <<'PY'
          import collections, hashlib, pathlib, re, sys
          root, selector, evid = map(pathlib.Path, sys.argv[1:])
          cmake = (root / "cmake/DirectionalTests.cmake").read_text()
          def body(rx):
              m = re.search(rx, cmake, re.S)
              assert m, rx
              return m.group(1)
          owners = {
              "producer": re.findall(r"(?:tests|src/bench)/[A-Za-z0-9_./-]+\.cpp",
                  body(r"set\(DIRECTIONAL_SURFACE_CELL_PRODUCER_TEST_SOURCES\s*(.*?)\)")),
              "authority-kernel": re.findall(r"tests/[A-Za-z0-9_./-]+\.cpp",
                  body(r"add_executable\(\s*directional_surface_cell_authority_kernel_tests\s*(.*?)\)")),
              "completion": re.findall(r"tests/[A-Za-z0-9_./-]+\.cpp",
                  body(r"add_executable\(\s*directional_surface_cell_completion_tests\s*(.*?)\)")),
              "validation": re.findall(r"tests/[A-Za-z0-9_./-]+\.cpp",
                  body(r"add_executable\(\s*directional_surface_cell_validation_tests\s*(.*?)\)")),
          }
          bins = {
              "producer": "directional_surface_cell_producer_tests",
              "authority-kernel": "directional_surface_cell_authority_kernel_tests",
              "completion": "directional_surface_cell_completion_tests",
              "validation": "directional_surface_cell_validation_tests",
          }
          pat = re.compile(r"\b(?:TEST|TEST_F|TEST_P)\s*\(\s*([A-Za-z_][A-Za-z0-9_]*)\s*,\s*([A-Za-z_][A-Za-z0-9_]*)\s*\)")
          defs = collections.defaultdict(list)
          for owner, paths in owners.items():
              for rel in paths:
                  p = root / rel
                  if not p.exists(): continue
                  text = p.read_text()
                  digest = hashlib.sha256(p.read_bytes()).hexdigest()
                  for m in pat.finditer(text):
                      ident = f"{m.group(1)}.{m.group(2)}"
                      line = text.count("\n", 0, m.start()) + 1
                      defs[ident].append((owner, bins[owner], rel, line, digest))
          rows = selector.read_text().splitlines()
          assert len(rows) == 403
          mapped = []
          for i, ident in enumerate(rows, 1):
              assert len(defs[ident]) == 1, (i, ident, defs[ident])
              mapped.append((i, ident, *defs[ident][0]))
          full = collections.Counter(r[2] for r in mapped)
          prefix = collections.Counter(r[2] for r in mapped[:394])
          assert full == {"authority-kernel":30, "producer":257, "completion":75, "validation":41}, full
          assert prefix == {"authority-kernel":30, "producer":248, "completion":75, "validation":41}, prefix
          with (evid / "owner-map.tsv").open("w") as f:
              for row in mapped:
                  f.write("\t".join(map(str, row)) + "\n")
          with (evid / "new-source-definitions.tsv").open("w") as f:
              for row in mapped[394:]:
                  f.write("\t".join(map(str, row)) + "\n")
          (evid / "owner-totals.txt").write_text(
              f"selector403={dict(full)}\nselector394={dict(prefix)}\n")
          PY

          mkdir -p "$TB2_VIEW/bin" "$TB2_VIEW/test-data/benchmarks"
          for b in \
            directional_surface_cell_authority_kernel_tests \
            directional_surface_cell_producer_tests \
            directional_surface_cell_completion_tests \
            directional_surface_cell_validation_tests; do
            cp -a "$TB2_PKG/bin/$b" "$TB2_VIEW/bin/"
          done
          cp -a "$TB2_SRC/benchmarks/fixtures" "$TB2_VIEW/test-data/benchmarks/fixtures"
          census "$TB2_VIEW" "$TB2_EVID/execution-view-census-pre.tsv"
          echo "preflight=PASS" | tee "$TB2_EVID/preflight-summary.txt"

      - name: Execute frozen TB2 matrix
        id: runtime
        if: ${{ steps.preflight.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          exec > >(tee -a "$TB2_LOG") 2>&1
          sel="$TB2_SRC/.agents/Directional/Architecture_M4_CP3_CB4_R1_Required_Green_Selector_403.txt"
          map="$TB2_EVID/owner-map.tsv"
          ledger="$TB2_EVID/process-ledger.tsv"
          printf 'phase\tordinal\tidentity\towner\tcommand\texit\telapsed_ms\ttimeout\trun_count\tok_count\tskip_count\tverdict\n' > "$ledger"
          status=0
          run_phase() {
            local phase="$1" first="$2" last="$3"
            local dir="$TB2_EVID/raw/$phase"
            mkdir -p "$dir"
            for ((i=first; i<=last; ++i)); do
              IFS=$'\t' read -r ord ident owner bin src line digest < <(awk -F '\t' -v n="$i" '$1==n{print; exit}' "$map")
              raw="$dir/$(printf '%03d' "$ord").log"
              cmd="$TB2_VIEW/bin/$bin --gtest_filter=$ident"
              start="$(date +%s%N)"
              set +e
              GTEST_FAIL_IF_NO_TEST_SELECTED=1 "$TB2_VIEW/bin/$bin" "--gtest_filter=$ident" 2>&1 \
                | tee "$raw" -a "$TB2_LOG"
              rc=${PIPESTATUS[0]}
              set -e
              end="$(date +%s%N)"
              ms=$(( (end-start)/1000000 ))
              run_count="$(grep -Fc "[ RUN      ] $ident" "$raw" || true)"
              total_run="$(grep -Fc "[ RUN      ]" "$raw" || true)"
              ok_count="$(grep -Fc "[       OK ] $ident" "$raw" || true)"
              skip_count="$(grep -Fc "[  SKIPPED ]" "$raw" || true)"
              verdict=PASS
              if [[ "$rc" -ne 0 || "$run_count" -ne 1 || "$total_run" -ne 1 || "$ok_count" -ne 1 || "$skip_count" -ne 0 ]]; then
                verdict=RED
                status=1
              fi
              printf '%s\t%s\t%s\t%s\t%s\t%s\t%s\tfalse\t%s\t%s\t%s\t%s\n' \
                "$phase" "$ord" "$ident" "$bin" "$cmd" "$rc" "$ms" \
                "$run_count" "$ok_count" "$skip_count" "$verdict" >> "$ledger"
              echo "tb2_process phase=$phase ordinal=$ord verdict=$verdict exit=$rc elapsed_ms=$ms"
              if [[ "$status" -ne 0 ]]; then
                echo "blocker=semantic-or-selection-failure phase=$phase ordinal=$ord identity=$ident" \
                  | tee "$TB2_EVID/blocker.txt"
                return 1
              fi
            done
            return 0
          }
          set +e
          run_phase focused-A 395 403
          rc=$?
          if [[ "$rc" -eq 0 ]]; then run_phase focused-B 395 403; rc=$?; fi
          if [[ "$rc" -eq 0 ]]; then
            cut -f2,3,12 "$ledger" | awk -F '\t' '$1>=395 && $1<=403' > "$TB2_EVID/focused-verdicts.tsv"
            awk -F '\t' '$1=="focused-A"{print $2"\t"$3"\t"$12}' "$ledger" > "$TB2_EVID/focused-A.tsv"
            awk -F '\t' '$1=="focused-B"{print $2"\t"$3"\t"$12}' "$ledger" > "$TB2_EVID/focused-B.tsv"
            cmp "$TB2_EVID/focused-A.tsv" "$TB2_EVID/focused-B.tsv" || rc=1
          fi
          if [[ "$rc" -eq 0 ]]; then run_phase prefix394 1 394; rc=$?; fi
          if [[ "$rc" -eq 0 ]]; then run_phase candidate403 1 403; rc=$?; fi
          set -e
          python3 - "$ledger" "$TB2_EVID/runtime-totals.txt" <<'PY'
          import collections, pathlib, sys
          ledger, out = map(pathlib.Path, sys.argv[1:])
          rows = [x.split("\t") for x in ledger.read_text().splitlines()[1:]]
          lines = []
          for phase in ("focused-A","focused-B","prefix394","candidate403"):
              part=[r for r in rows if r[0]==phase]
              v=collections.Counter(r[11] for r in part)
              o=collections.Counter(r[3] for r in part)
              lines.append(f"{phase}: processes={len(part)} verdicts={dict(v)} owners={dict(o)}")
          out.write_text("\n".join(lines)+"\n")
          PY
          echo "$rc" > "$TB2_EVID/runtime-exit-code.txt"
          exit "$rc"

      - name: Immutable postflight
        id: postflight
        if: ${{ always() && steps.preflight.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee -a "$TB2_LOG") 2>&1
          census() {
            local base="$1" out="$2"
            find "$base" -type f -print0 | sort -z | while IFS= read -r -d '' f; do
              rel="${f#"$base"/}"
              printf '%s\t%s\t%s\t%s\n' "$rel" "$(stat -c %s "$f")" \
                "$(stat -c %a "$f")" "$(sha256sum "$f" | awk '{print $1}')"
            done > "$out"
          }
          census "$TB2_PKG" "$TB2_EVID/package-census-post.tsv"
          census "$TB2_SRC" "$TB2_EVID/source-census-post.tsv"
          census "$TB2_VIEW" "$TB2_EVID/execution-view-census-post.tsv"
          cmp "$TB2_EVID/package-census-pre.tsv" "$TB2_EVID/package-census-post.tsv"
          cmp "$TB2_EVID/source-census-pre.tsv" "$TB2_EVID/source-census-post.tsv"
          cmp "$TB2_EVID/execution-view-census-pre.tsv" "$TB2_EVID/execution-view-census-post.tsv"
          (cd "$TB2_PKG" && sha256sum -c SHA256SUMS) | tee "$TB2_EVID/manifest-post.txt"
          test "$(wc -l < "$TB2_PKG/SHA256SUMS")" -eq 28
          printf '%s\n' \
            'package_immutable=PASS' \
            'source_immutable=PASS' \
            'execution_view_immutable=PASS' \
            'manifest_post=28/28' \
            'configure=false' \
            'compile=false' \
            'relink=false' \
            'generated_discovery=false' \
            'package_repair=false' > "$TB2_EVID/postflight-summary.txt"

      - name: Write terminal evidence summary
        if: always()
        env:
          PREFLIGHT_OUTCOME: ${{ steps.preflight.outcome }}
          RUNTIME_OUTCOME: ${{ steps.runtime.outcome }}
          POSTFLIGHT_OUTCOME: ${{ steps.postflight.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "preflight_outcome=$PREFLIGHT_OUTCOME"
            echo "runtime_outcome=$RUNTIME_OUTCOME"
            echo "postflight_outcome=$POSTFLIGHT_OUTCOME"
            echo "expected_processes=815"
            if [[ -f "$TB2_EVID/process-ledger.tsv" ]]; then
              echo "observed_processes=$(( $(wc -l < "$TB2_EVID/process-ledger.tsv") - 1 ))"
            else
              echo "observed_processes=0"
            fi
            echo "finished_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } | tee "$TB2_EVID/terminal-summary.txt" -a "$TB2_LOG"
          cp "$TB2_LOG" "$TB2_EVID/activity-copy.log"

      - name: Upload TB2 result evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m4-cp3-tb2-exec-result-${{ github.run_id }}
          path: ${{ runner.temp }}/m4-cp3-tb2-exec/evidence
          if-no-files-found: error
          retention-days: 7

      - name: Upload TB2 diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m4-cp3-tb2-exec-log-${{ github.run_id }}
          path: ${{ runner.temp }}/m4-cp3-tb2-exec/activity.log
          if-no-files-found: error
          retention-days: 7

      - name: Propagate TB2 status
        if: always()
        env:
          PREFLIGHT_OUTCOME: ${{ steps.preflight.outcome }}
          RUNTIME_OUTCOME: ${{ steps.runtime.outcome }}
          POSTFLIGHT_OUTCOME: ${{ steps.postflight.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          test "$PREFLIGHT_OUTCOME" = success
          test "$RUNTIME_OUTCOME" = success
          test "$POSTFLIGHT_OUTCOME" = success
