name: Agent M3 CP4c3 TB41 Closeout Drive Apply

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m3-cp4c3-tb41-closeout-drive/trigger.json

permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

concurrency:
  group: agent-m3-cp4c3-tb41-closeout-drive
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/agent-m3-cp4c3-tb41-closeout-drive.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m3-cp4c3-tb41-closeout-drive
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  apply:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1ZwOOyW9gwggG2Gfhljt7TbqRAlrzwOlI
      patch_sha256: 0ec405c313054032af69b60f66f7dcdb0ccc9a9526b67f09a3da0d653974abea
      base_sha: f953bf179009cc8786a902379e8588272ad924d6
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: "docs: close M3-CP4c-3-TB41-EXEC and freeze TB41-REV boundary"
      retention_days: 7
    secrets: inherit
