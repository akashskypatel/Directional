name: m1e-segment-route-transport-code-build-v4

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - '.agents/connector-triggers/m1e-segment-route-transport-code-build-v4'

permissions:
  contents: read
  actions: read

concurrency:
  group: m1e-segment-route-transport-code-build-v4
  cancel-in-progress: false

env:
  LOG_DIR: /tmp/m1e-segment-route-transport-code-build-v4-logs
  ACTIVITY_LOG: /tmp/m1e-segment-route-transport-code-build-v4-logs/activity.log
  M1E_BASE: '5df33fc11deaac697cb886d8defcaba622ec436f'
  IMPLEMENTATION_COMMIT: 'a0330d0107f7d7340e9f8644d26dd6c8b753ff10'
  ACCEPTED_M1D_IMPLEMENTATION: '9446fc82d98d336d3bd59c190dd2bbbe94bd2e25'
  EXPECTED_TRACING_BLOB: '34372a48412213d3b4db6d0bc3e653e7d3225ef0'
  EXPECTED_PHASE10_TEST_BLOB: 'f55d016db2c89710b79c711a0d5e780dcfb2bdfc'
  EXPECTED_M1D_PIPELINE_BLOB: '481f58169fe73844b12d9e70660d49fa3e13f845'
  EXPECTED_M1D_TEST_BLOB: 'dc82faf06898d8516ddd55b2ae56c2b240c761fb'

jobs:
  code-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Initialize persistent activity log
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$LOG_DIR"
          printf '%s\n' \
            'turn=M1e Segment Route Transport Consumer Code+Build' \
            "run_id=$GITHUB_RUN_ID" "run_attempt=$GITHUB_RUN_ATTEMPT" \
            "event=$GITHUB_EVENT_NAME" "event_sha=$GITHUB_SHA" \
            "ref=$GITHUB_REF" "repository=$GITHUB_REPOSITORY" \
            "runner_os=$RUNNER_OS" "runner_temp=$RUNNER_TEMP" \
            "implementation_commit=$IMPLEMENTATION_COMMIT" \
            "accepted_m1d_implementation=$ACCEPTED_M1D_IMPLEMENTATION" \
            'runtimeExecution=false' \
            'prohibited=generated Directional binary execution; discovery; tests; benchmarks; ctest; CLI/GUI/help/version; fuzzers; custom input' \
            "started_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)" | tee "$ACTIVITY_LOG"

      - name: Checkout exact event source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 320
          submodules: false

      - name: Verify exact source authority and turn boundary
        shell: bash
        run: |
          set -Eeuo pipefail
          exec > >(tee -a "$ACTIVITY_LOG") 2>&1
          finish() {
            rc=$?
            trap - EXIT
            printf '%s\n' "step=source-authority exit_code=$rc" \
              "finished_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git status --short --branch || true
            exit "$rc"
          }
          trap finish EXIT
          git --version
          bash --version | head -n 1
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$IMPLEMENTATION_COMMIT" HEAD
          git merge-base --is-ancestor "$ACCEPTED_M1D_IMPLEMENTATION" HEAD
          test -z "$(git status --porcelain=v1)"
          test "$(git rev-parse HEAD:src/geometry/SurfaceCellTracing.cpp)" = "$EXPECTED_TRACING_BLOB"
          test "$(git rev-parse HEAD:tests/SurfaceCellsPhase10Tests.cpp)" = "$EXPECTED_PHASE10_TEST_BLOB"
          test "$(git rev-parse HEAD:src/pipeline/RemeshPipeline.cpp)" = "$EXPECTED_M1D_PIPELINE_BLOB"
          test "$(git rev-parse HEAD:tests/SurfaceCellTransitionQuotientTests.cpp)" = "$EXPECTED_M1D_TEST_BLOB"
          mapfile -t product_changed < <(git diff --name-only "$M1E_BASE" "$IMPLEMENTATION_COMMIT" -- src/geometry/SurfaceCellTracing.cpp tests/SurfaceCellsPhase10Tests.cpp include/directional/geometry/SurfaceCellTracing.h src/pipeline/RemeshPipeline.cpp tests/SurfaceCellTransitionQuotientTests.cpp CMakeLists.txt cmake/DirectionalTests.cmake | LC_ALL=C sort)
          test "${#product_changed[@]}" -eq 2
          test "${product_changed[0]}" = 'src/geometry/SurfaceCellTracing.cpp'
          test "${product_changed[1]}" = 'tests/SurfaceCellsPhase10Tests.cpp'
          grep -q 'CanonicalRoute::from_observed_steps' src/geometry/SurfaceCellTracing.cpp
          grep -q 'typedRoute.oriented_steps()' src/geometry/SurfaceCellTracing.cpp
          grep -q 'routeTransport = compose(step.transport(), routeTransport)' src/geometry/SurfaceCellTracing.cpp
          test "$(grep -c '^TEST(SurfaceCellSegmentRouteTransportAuthorityMigration,' tests/SurfaceCellsPhase10Tests.cpp)" -eq 6
          git diff --check "$M1E_BASE" "$IMPLEMENTATION_COMMIT"

      - name: Install compile prerequisites
        shell: bash
        run: |
          set -Eeuo pipefail
          exec > >(tee -a "$ACTIVITY_LOG") 2>&1
          finish() {
            rc=$?
            trap - EXIT
            printf '%s\n' "step=install exit_code=$rc" \
              "finished_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            exit "$rc"
          }
          trap finish EXIT
          sudo apt-get update
          sudo apt-get install -y ninja-build libgmp-dev xz-utils time

      - name: Fetch shallow submodules
        shell: bash
        run: |
          set -Eeuo pipefail
          exec > >(tee -a "$ACTIVITY_LOG") 2>&1
          finish() {
            rc=$?
            trap - EXIT
            printf '%s\n' "step=submodules exit_code=$rc" \
              "finished_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            exit "$rc"
          }
          trap finish EXIT
          git submodule sync --recursive
          git -c protocol.version=2 submodule update --init --recursive --depth 1 --recommend-shallow
          git submodule status --recursive | tee "$LOG_DIR/submodules.txt"

      - name: Configure Release static compile-only build
        shell: bash
        run: |
          set -Eeuo pipefail
          exec > >(tee -a "$ACTIVITY_LOG") 2>&1
          finish() {
            rc=$?
            trap - EXIT
            printf '%s\n' "step=configure exit_code=$rc" \
              "finished_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            exit "$rc"
          }
          trap finish EXIT
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DDIRECTIONAL_ENABLE_GMP=ON \
            -DDIRECTIONAL_ENABLE_PARDISO=OFF \
            -DDIRECTIONAL_ENABLE_CUDSS=OFF \
            -DDIRECTIONAL_ENABLE_SUITESPARSE=OFF \
            -DDIRECTIONAL_BUILD_TESTS=ON \
            -DDIRECTIONAL_BUILD_BENCHMARKS=ON \
            -DDIRECTIONAL_BUILD_CLI=OFF \
            -DDIRECTIONAL_BUILD_GUI=OFF \
            -DBUILD_PYTHON=OFF \
            -DBUILD_TUTORIALS=OFF \
            -DCMAKE_GTEST_DISCOVER_TESTS_DISCOVERY_MODE=PRE_TEST \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON 2>&1 | tee "$LOG_DIR/configure.log"

      - name: Compile approved targets only
        shell: bash
        run: |
          set -Eeuo pipefail
          exec > >(tee -a "$ACTIVITY_LOG") 2>&1
          finish() {
            rc=$?
            trap - EXIT
            printf '%s\n' "step=build exit_code=$rc" \
              "finished_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            df -h . || true
            exit "$rc"
          }
          trap finish EXIT
          /usr/bin/time -v -o "$LOG_DIR/build-resources.txt" \
            cmake --build build --parallel 2 --target \
              directional_core \
              directional_pipeline \
              directional_compiled_api_tests \
              directional_surface_cell_producer_tests \
              directional_surface_cell_oracle_tests \
              directional_surface_cell_authority_kernel_tests \
              directional_surface_cell_completion_tests \
              directional_surface_cell_validation_tests \
              directional_benchmarks 2>&1 | tee "$LOG_DIR/build.log"

      - name: Package immutable compile artifact
        id: package
        shell: bash
        run: |
          set -Eeuo pipefail
          exec > >(tee -a "$ACTIVITY_LOG") 2>&1
          finish() {
            rc=$?
            trap - EXIT
            printf '%s\n' "step=package exit_code=$rc" \
              "finished_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git status --short --branch || true
            exit "$rc"
          }
          trap finish EXIT
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain=v1)"
          pkg="$RUNNER_TEMP/m1e-segment-route-transport-code-build-v4"
          mkdir -p "$pkg/bin" "$pkg/lib" "$pkg/logs" "$pkg/metadata" \
            "$pkg/source" "$pkg/test-data/benchmarks"
          for exe in directional_compiled_api_tests directional_surface_cell_producer_tests directional_surface_cell_oracle_tests directional_surface_cell_authority_kernel_tests directional_surface_cell_completion_tests directional_surface_cell_validation_tests directional_benchmarks; do
            test -x "build/$exe"
            cp "build/$exe" "$pkg/bin/$exe"
          done
          cp build/libdirectional_core.a build/libdirectional_pipeline.a "$pkg/lib/"
          cp -a benchmarks/fixtures "$pkg/test-data/benchmarks/fixtures"
          cp "$LOG_DIR"/* "$pkg/logs/"
          cp build/compile_commands.json "$pkg/source/compile_commands.json"
          git diff --binary "$M1E_BASE" "$IMPLEMENTATION_COMMIT" -- \
            src/geometry/SurfaceCellTracing.cpp \
            tests/SurfaceCellsPhase10Tests.cpp \
            > "$pkg/source/m1e-segment-route-transport-consumer.patch"
          git archive --format=tar "$IMPLEMENTATION_COMMIT" | \
            xz -T0 -6 > "$pkg/source/directional-m1e-segment-route-source-no-deps.tar.xz"
          python3 -c "import pathlib,re; t=pathlib.Path('tests/SurfaceCellsPhase10Tests.cpp').read_text(); n=[f'{a.strip()}.{b.strip()}' for a,b in re.findall(r'TEST\\(\\s*(SurfaceCellSegmentRouteTransportAuthorityMigration)\\s*,\\s*([^)]+)\\)',t)]; assert len(n)==6 and len(set(n))==6; print('\\n'.join(n))" > "$pkg/metadata/m1e-focused-test-names.txt"
          python3 -c "import pathlib,re; t=pathlib.Path('tests/SurfaceCellTransitionQuotientTests.cpp').read_text(); n=[f'{a.strip()}.{b.strip()}' for a,b in re.findall(r'TEST\\(\\s*(SurfaceCellPhaseFrontRouteAuthorityMigration)\\s*,\\s*([^)]+)\\)',t)]; assert len(n)==6 and len(set(n))==6; print('\\n'.join(n))" > "$pkg/metadata/m1d-focused-test-names.txt"
          python3 -c "import pathlib,re; t=pathlib.Path('tests/SurfaceCellsPhase10Tests.cpp').read_text(); n=[f'{a.strip()}.{b.strip()}' for a,b in re.findall(r'TEST\\(\\s*(SurfaceCellFieldTransitionAuthorityMigration)\\s*,\\s*([^)]+)\\)',t)]; assert len(n)==6 and len(set(n))==6; print('\\n'.join(n))" > "$pkg/metadata/m1c-focused-test-names.txt"
          python3 -c "import pathlib,re; t=pathlib.Path('tests/SurfaceMeshOptimizerPhase22Tests.cpp').read_text(); n=[f'{a.strip()}.{b.strip()}' for a,b in re.findall(r'TEST\\(\\s*(SurfaceOptimizationRailAuthorityMigration)\\s*,\\s*([^)]+)\\)',t)]; assert len(n)==6 and len(set(n))==6; print('\\n'.join(n))" > "$pkg/metadata/m1b-focused-test-names.txt"
          python3 -c "import pathlib,re; t=pathlib.Path('tests/SurfaceCellAuthorityKernelTests.cpp').read_text(); n=[f'{a.strip()}.{b.strip()}' for a,b in re.findall(r'TEST\\(\\s*([^,]+),\\s*([^)]+)\\)',t)]; assert len(n)==14 and len(set(n))==14; print('\\n'.join(n))" > "$pkg/metadata/authority-kernel-test-names.txt"
          python3 -c "import pathlib,re; t=pathlib.Path('tests/SurfaceCellProductOracleTests.cpp').read_text(); n=[f'{a.strip()}.{b.strip()}' for a,b in re.findall(r'TEST\\(\\s*([^,]+),\\s*([^)]+)\\)',t)]; assert len(n)==29 and len(set(n))==29; print('\\n'.join(n))" > "$pkg/metadata/oracle-test-names.txt"
          printf '%s\n' \
            SurfaceCellsPhase10.UniformPhaseFrontTraversesOrderedAuthoritativeSourceVertexFans \
            SurfaceCellsPhase10.UniformPhaseFrontVertexFanIsInvariantToFaceRowOrdering \
            > "$pkg/metadata/m1e-existing-vertex-fan-witnesses.txt"
          printf '%s\n' \
            SurfaceCellsPhase10.NonReciprocalSourceAdjacentIsolationSeamFailsClosed \
            SurfaceCellsPhase10.CurvedBoundedDiskInvalidReciprocalTransportFailsClosed \
            SurfaceCellsPhase10.PeriodicPhaseFrontMalformedHolonomyFailsClosedWithTypedReason \
            > "$pkg/metadata/m1c-transition-counterexamples.txt"
          printf '%s\n' \
            SurfaceCellTransitionQuotient.ExactHardRailCounterpartsStitchAcrossTopologyRegions \
            SurfaceCellTransitionQuotient.ArtificialInteriorBoundaryIsRejected \
            SurfaceCellTransitionQuotient.ComponentBoundaryAndEulerFactsAreComputedFromIncidence \
            > "$pkg/metadata/m1d-existing-route-counterexamples.txt"
          printf '%s\n' \
            SurfaceCellTransitionQuotient.MultiIsolationMaterializationRetainsAllLocalSheets \
            SurfaceCellTransitionQuotient.FullPeriodicRotationAndTranslationMaterialize \
            SurfaceCellTransitionQuotient.TamperedFullPeriodicTransformIsRejected \
            SurfaceCellTransitionQuotient.MultiplePeriodicRelationsSurviveRelationReorderingByExplicitOwner \
            SurfaceCellTransitionQuotient.SwappedPeriodicRelationOwnersAreRejected \
            SurfaceCellTransitionQuotient.MissingPeriodicRelationOwnerIsRejected \
            SurfaceCellTransitionQuotient.QuotientLineageRetainsScalarPointAndCompleteSortedAuthority \
            SurfaceCellsPhase10.StrictValidatorOverheadStaysBelowFivePercent \
            SurfaceCellsPhase10.ExactCommittedTorusDoesNotTreatIsolationSeamAsBoundedDiskBoundary \
            > "$pkg/metadata/known-red-producer-tests.txt"
          python3 -c "import json,os; print(json.dumps({'turn':'M1e Segment Route Transport Consumer Code+Build','baseCommit':os.environ['M1E_BASE'],'implementationCommit':os.environ['IMPLEMENTATION_COMMIT'],'buildEventCommit':os.environ['GITHUB_SHA'],'workflowRun':os.environ['GITHUB_RUN_ID'],'workflowAttempt':os.environ['GITHUB_RUN_ATTEMPT'],'configuration':'Release/static/Ninja','gtestDiscoveryMode':'PRE_TEST','runtimeExecution':False,'m1eFocusedStaticTestCount':6,'m1dFocusedStaticTestCount':6,'m1cFocusedStaticTestCount':6,'m1bFocusedStaticTestCount':6,'authorityKernelStaticTestCount':14,'oracleStaticTestCount':29,'previousProducerDiscoveryCount':178,'expectedProducerDiscoveryCount':184,'previousRequiredGreenSegmentCount':163,'expectedRequiredGreenSegmentCount':169,'knownRedProducerCount':9,'acceptedM1dArtifact':'9046308272'},sort_keys=True))" > "$pkg/metadata/build-authority.json"
          printf '%s\n' \
            runtimeExecution=false configured=true compiled=true \
            generatedDirectionalBinaryExecuted=false \
            gtestDiscoveryExecuted=false testExecuted=false \
            benchmarkExecuted=false ctestExecuted=false \
            cliGuiHelpVersionExecuted=false fuzzerExecuted=false \
            customInputExecuted=false \
            > "$pkg/metadata/command-boundary.txt"
          printf '%s\n' \
            "base_commit=$M1E_BASE" \
            "implementation_commit=$IMPLEMENTATION_COMMIT" \
            "build_event_commit=$GITHUB_SHA" \
            > "$pkg/metadata/source-blobs.txt"
          for path in src/geometry/SurfaceCellTracing.cpp tests/SurfaceCellsPhase10Tests.cpp src/pipeline/RemeshPipeline.cpp tests/SurfaceCellTransitionQuotientTests.cpp include/directional/geometry/SurfaceCellTracing.h include/directional/authority/CanonicalRoute.h include/directional/authority/AuthorityIds.h include/directional/authority/LegacyAuthorityAdapters.h include/directional/authority/GridAutomorphism.h tests/SurfaceMeshOptimizerPhase22Tests.cpp tests/SurfaceCellAuthorityKernelTests.cpp tests/SurfaceCellProductOracleTests.cpp tests/SurfaceCellDesignAcceptanceTests.cpp; do
            echo "$path=$(git rev-parse "$IMPLEMENTATION_COMMIT:$path")" >> "$pkg/metadata/source-blobs.txt"
          done
          git submodule status --recursive > "$pkg/metadata/submodules.txt"
          { cmake --version | head -n 1; ninja --version; c++ --version | head -n 1; uname -a; } > "$pkg/metadata/toolchain.txt"
          find benchmarks/fixtures -type f -printf '%P\n' | LC_ALL=C sort \
            > "$pkg/metadata/fixture-files.txt"
          printf '%s\n' \
            "patch_sha256=$(sha256sum "$pkg/source/m1e-segment-route-transport-consumer.patch" | awk '{print $1}')" \
            "source_archive_sha256=$(sha256sum "$pkg/source/directional-m1e-segment-route-source-no-deps.tar.xz" | awk '{print $1}')" \
            "compile_commands_sha256=$(sha256sum "$pkg/source/compile_commands.json" | awk '{print $1}')" \
            "m1e_focused_manifest_sha256=$(sha256sum "$pkg/metadata/m1e-focused-test-names.txt" | awk '{print $1}')" \
            "m1d_focused_manifest_sha256=$(sha256sum "$pkg/metadata/m1d-focused-test-names.txt" | awk '{print $1}')" \
            "m1c_focused_manifest_sha256=$(sha256sum "$pkg/metadata/m1c-focused-test-names.txt" | awk '{print $1}')" \
            "m1b_focused_manifest_sha256=$(sha256sum "$pkg/metadata/m1b-focused-test-names.txt" | awk '{print $1}')" \
            "authority_manifest_sha256=$(sha256sum "$pkg/metadata/authority-kernel-test-names.txt" | awk '{print $1}')" \
            "oracle_manifest_sha256=$(sha256sum "$pkg/metadata/oracle-test-names.txt" | awk '{print $1}')" \
            > "$pkg/metadata/package-content-hashes.txt"
          (cd "$pkg"; find . -type f ! -name SHA256SUMS -print0 | \
            LC_ALL=C sort -z | xargs -0 sha256sum > SHA256SUMS)
          echo "manifest_entries=$(wc -l < "$pkg/SHA256SUMS")"
          echo "manifest_sha256=$(sha256sum "$pkg/SHA256SUMS" | awk '{print $1}')"
          echo "PACKAGE_DIR=$pkg" >> "$GITHUB_ENV"

      - name: Upload immutable compile artifact
        uses: actions/upload-artifact@v4
        with:
          name: m1e-segment-route-transport-code-build-v4
          path: ${{ env.PACKAGE_DIR }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 6

      - name: Record final workflow state
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$LOG_DIR"
          printf '%s\n' "job_status=${{ job.status }}" \
            "finished_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)" | \
            tee -a "$ACTIVITY_LOG"

      - name: Always upload detailed workflow logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m1e-segment-route-transport-code-build-v4-logs
          path: /tmp/m1e-segment-route-transport-code-build-v4-logs
          if-no-files-found: error
          retention-days: 14
          compression-level: 6
