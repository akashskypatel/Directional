name: Agent R-A T+B CB-00-04

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/ra-tb-cb-00-04.txt

permissions:
  contents: write
  actions: write

concurrency:
  group: agent-ra-tb-cb-00-04-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    outputs:
      source_sha: ${{ steps.commit.outputs.source_sha }}
    steps:
      - name: Initialize persistent activity log
        shell: bash
        run: |
          set -euo pipefail
          : > "$RUNNER_TEMP/activity.log"
          printf '%s\n' \
            'task=R-A-TB-CB-00-through-CB-04' \
            "event_sha=$GITHUB_SHA" \
            "ref=$GITHUB_REF" \
            'turn=Code+Build-only' \
            'runtimeExecution=false' \
            'semanticContracts=compiled-not-executed' | tee -a "$RUNNER_TEMP/activity.log"

      - name: Checkout exact control-plane head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 50
          submodules: false

      - name: Apply pre-verified remediation patch and regenerate static inventory
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee -a "$RUNNER_TEMP/activity.log") 2>&1
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git status --porcelain=v1 | tee "$RUNNER_TEMP/source-status-before.txt"
          test ! -s "$RUNNER_TEMP/source-status-before.txt"

          check_hash() {
            local path="$1" expected="$2"
            local actual
            actual="$(git hash-object "$path")"
            printf 'pre_hash %s %s\n' "$path" "$actual"
            test "$actual" = "$expected"
          }
          check_hash src/geometry/PureQuadCompletion.cpp 3f9dd62d21c2c35c6f68356c6ef7f31b36290a7a
          check_hash src/pipeline/RemeshPipeline.cpp 056552bb35a5e7cfe20ef0f1530d30bddae02470
          check_hash tests/PureQuadCompletionPhase18Tests.cpp a90011c01eb5d88fc02c88cb97a67e64a898a0f1
          check_hash tests/SurfaceCellsPhase10Tests.cpp fbe516d7811fd92459d29909f2100c44c51f80b0
          check_hash tests/SurfaceMeshOptimizerPhase19Tests.cpp 25ff6e1cf43ccbab2d01249c1e505c827897566f
          check_hash tests/SurfaceMeshOptimizerPhase22Tests.cpp 8981f6ee02fd161ae6b89ada969526d81e01e771
          check_hash .agents/Directional/R_A_Closure_Inventory.py 8b4c46c8c9fa52e6be37dbcf4f7cf3637a94fe97
          check_hash .agents/Directional/R_A_Closure_Inventory_Report.md f39f251345ec88cdc26e5a40076a93d55e9804b7

          PAYLOAD_DIR=.agents/Directional/turn-payloads/ra-tb-cb-00-04
          test "$(sha256sum "$PAYLOAD_DIR/patch.part-00.b64" | awk '{print $1}')" = '983db80167a8c5a550b38f04d2bd4562bf2c00199f6eb9ce2d55ff901e623bf7'
          test "$(sha256sum "$PAYLOAD_DIR/patch.part-01.b64" | awk '{print $1}')" = '0266d0dbb54b2c857389b8be089f333a462c2440c75e933172c84ea85f3af975'
          test "$(sha256sum "$PAYLOAD_DIR/patch.part-02.b64" | awk '{print $1}')" = '7554d2359d0e4060d7aed71e282c6b86dcd246bab58aa725115c3326c09dc149'
          test "$(sha256sum "$PAYLOAD_DIR/patch.part-03.b64" | awk '{print $1}')" = '5d49fad7db44e9b0c189a4f40f094df5604346f86edc138845838c498155c34b'
          cat \
            "$PAYLOAD_DIR/patch.part-00.b64" \
            "$PAYLOAD_DIR/patch.part-01.b64" \
            "$PAYLOAD_DIR/patch.part-02.b64" \
            "$PAYLOAD_DIR/patch.part-03.b64" \
            | base64 -d | gzip -dc > "$RUNNER_TEMP/remediation.patch"
          test "$(sha256sum "$RUNNER_TEMP/remediation.patch" | awk '{print $1}')" = \
            '2d38d0b9b33146c98737c99c312354fadd55d2ed94aef3e09e318a3f0eadbcb4'
          git apply --check "$RUNNER_TEMP/remediation.patch"
          git apply "$RUNNER_TEMP/remediation.patch"

          check_post_hash() {
            local path="$1" expected="$2"
            local actual
            actual="$(git hash-object "$path")"
            printf 'post_hash %s %s\n' "$path" "$actual"
            test "$actual" = "$expected"
          }
          check_post_hash src/geometry/PureQuadCompletion.cpp 10ca5c2fad344897bbaf389c90c52b0995c444d2
          check_post_hash src/pipeline/RemeshPipeline.cpp fa0de6ce4cc69e98c4b6eb10014c359c0d340caa
          check_post_hash tests/PureQuadCompletionPhase18Tests.cpp 4a17f6e2b118bc3b8a7cbc87e0a2ba1d8e88e4b0
          check_post_hash tests/SurfaceCellsPhase10Tests.cpp 70066d32f5c66deca4d225bebc8d785b18fdaffa
          check_post_hash tests/SurfaceMeshOptimizerPhase19Tests.cpp cbf26fa129289fe0df1d6c7551acfcebd81141fe
          check_post_hash tests/SurfaceMeshOptimizerPhase22Tests.cpp 5b2e3a4e0fbfe8778dced3536a7d75af75b0f018
          check_post_hash .agents/Directional/R_A_Closure_Inventory.py a1718b07fbc38ce9bee6f1cc8f899b164dbce5da
          check_post_hash .agents/Directional/R_A_Closure_Inventory_Report.md d5cf5f730121e6f97e95ce59f70c38da39d8a948

          python3 .agents/Directional/R_A_Closure_Inventory.py --root . \
            > "$RUNNER_TEMP/R_A_Closure_Inventory_Report.generated.md"
          cmp .agents/Directional/R_A_Closure_Inventory_Report.md \
              "$RUNNER_TEMP/R_A_Closure_Inventory_Report.generated.md"
          grep -q 'Probe count: \*\*50\*\*' .agents/Directional/R_A_Closure_Inventory_Report.md
          grep -q 'Probe match count: \*\*206\*\*' .agents/Directional/R_A_Closure_Inventory_Report.md
          grep -q 'Final static inventory: \*\*PASS\*\*' .agents/Directional/R_A_Closure_Inventory_Report.md

          python3 - <<'PY'
          from pathlib import Path
          text = Path('src/pipeline/RemeshPipeline.cpp').read_text()
          marker = 'result.surfaceCellContext.traceNetwork = std::move(traceNetwork);'
          tail = text[text.index(marker):]
          assert 'phaseFrontProduct->sourceTopologyRegions' not in tail
          assert 'phaseFrontProduct = nullptr;' in tail
          assert tail.count('retainedSourceAuthority') >= 6
          PY

          changed="$(git status --porcelain=v1 | sed -E 's/^.. //' | sort)"
          expected="$(printf '%s\n' \
            .agents/Directional/R_A_Closure_Inventory.py \
            .agents/Directional/R_A_Closure_Inventory_Report.md \
            src/geometry/PureQuadCompletion.cpp \
            src/pipeline/RemeshPipeline.cpp \
            tests/PureQuadCompletionPhase18Tests.cpp \
            tests/SurfaceCellsPhase10Tests.cpp \
            tests/SurfaceMeshOptimizerPhase19Tests.cpp \
            tests/SurfaceMeshOptimizerPhase22Tests.cpp | sort)"
          printf 'changed_files=\n%s\n' "$changed"
          test "$changed" = "$expected"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/geometry/PureQuadCompletion.cpp \
            src/pipeline/RemeshPipeline.cpp \
            tests/PureQuadCompletionPhase18Tests.cpp \
            tests/SurfaceCellsPhase10Tests.cpp \
            tests/SurfaceMeshOptimizerPhase19Tests.cpp \
            tests/SurfaceMeshOptimizerPhase22Tests.cpp
          git add -f \
            .agents/Directional/R_A_Closure_Inventory.py \
            .agents/Directional/R_A_Closure_Inventory_Report.md
          git commit -m 'fix: remediate R-A artifact runtime blockers'
          SOURCE_SHA="$(git rev-parse HEAD)"
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "source_sha=$SOURCE_SHA" | tee "$RUNNER_TEMP/source-sha.txt"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          git status --porcelain=v1 | tee "$RUNNER_TEMP/source-status-after.txt"
          test ! -s "$RUNNER_TEMP/source-status-after.txt"
          echo 'runtimeExecution=false'
          echo 'No generated Directional binary, discovery, test, benchmark, ctest, CLI, fuzzer, help/version command, or custom input was executed in the apply job.'

      - name: Upload apply/static-audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ra-tb-cb-00-04-apply-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/activity.log
            ${{ runner.temp }}/source-status-before.txt
            ${{ runner.temp }}/source-status-after.txt
            ${{ runner.temp }}/source-sha.txt
            ${{ runner.temp }}/R_A_Closure_Inventory_Report.generated.md
          if-no-files-found: warn
          retention-days: 7

  compile:
    needs: apply
    uses: ./.github/workflows/agent-compile-reusable.yml
    with:
      source_sha: ${{ needs.apply.outputs.source_sha }}
      artifact_prefix: ra-tb-cb-00-04
      cache_epoch: v1
    secrets: inherit
