      pr_number: 8
      label: m4-cp-scale-defn-r1-drive-apply
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  apply:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1JrTKPi-wOs-G5ODTYz3BS6hI5dyLL2pj
      patch_sha256: b8f89ae1bb41121f17a47fd1eaff74b280513d2d8bca73bab8e167a6ef937df8
      base_sha: e00453cae28c583f333b23324ba9dbcf8d5688e2
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: 'docs(agent): freeze CP-SCALE source-boundary authority'
