name: M4 CP SCALE TB12 Docs Apply

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m4-cp-scale-tb12-docs-apply-20260917.txt

permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

concurrency:
  group: m4-cp-scale-tb12-docs-apply
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/m4-cp-scale-tb12-docs-apply.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m4-cp-scale-tb12-docs-apply
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  apply:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1_CUNwv6wx6RRO5AN9cTXeyCCBkw1Iwcl
      patch_sha256: a025b0303c7411e69c0a150670dbba638bbf70011c1d56225f22856c0595e100
      base_sha: 672ef174713a95ec3d0973832b05e54eb528dfdb
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: "docs: record TB12 orchestration failure and hand off CB14"
    secrets: inherit
