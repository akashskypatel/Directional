name: M4 CP SCALE CB18 Patch Apply

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m4-cp-scale-cb18-patch-apply.txt

permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

concurrency:
  group: m4-cp-scale-cb18-patch-apply-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/m4-cp-scale-cb18-patch-apply.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m4-cp-scale-cb18-patch-apply
      commit_run_file: false
      trim_stale_comments: false
    secrets: inherit

  apply:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1Lhl-pWvhGdinqRVEu-qhlGTEcwxA6Fak
      patch_sha256: 1926b311af46ca7205944744d10ca0947d4fe9301c5952cde1236ddf09a3a9c2
      base_sha: a4c29483b5f564f01245ca83dec0924f12c83352
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: "M4-CP-SCALE-CB18: bind separating-feature singularity ownership"
    secrets: inherit
