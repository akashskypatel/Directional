name: M4 CP3 CB2 Drive Apply

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m4-cp3-cb2-drive-apply-20260910.txt

permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

concurrency:
  group: agent-m4-cp3-cb2-drive-apply-${{ github.ref }}
  cancel-in-progress: false

jobs:
  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m4-cp3-cb2-drive-apply
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/agent-m4-cp3-cb2-drive-apply.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  apply:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1JpWjr-q5nxVheLbs1hQfh71lEeigAoLK
      patch_sha256: cbdf7a3eb93b4731d93ca30a762e9d587bf792e275306a076a7766bdee38815e
      base_sha: 0c95b7e142b0c127691882fcf72b9ec8baaa05f2
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: "M4-CP3-CB2: add family-free baseline parity A3"
      retention_days: 14
    secrets: inherit
