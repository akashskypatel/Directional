name: M4 CP3 CB2 Drive Apply

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m4-cp3-cb2-drive-apply-20260910.txt

permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

concurrency:
  group: agent-m4-cp3-cb2-drive-apply-${{ github.ref }}
  cancel-in-progress: false

jobs:
  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m4-cp3-cb2-drive-apply
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/agent-m4-cp3-cb2-drive-apply.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  apply:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 15W9V760mNjsVNB-ieZEWtTl9Wu34G2mc
      patch_sha256: a959dc8f7fe2583a81039f63acd962b2e4b02ca0d5c6364ffbd776448252ad31
      base_sha: c8d8fc8ae92c067fce04a365bc8dd3b21ddad8dc
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: "M4-CP3-CB2: close compile and issue TB1 plan"
      retention_days: 14
    secrets: inherit
