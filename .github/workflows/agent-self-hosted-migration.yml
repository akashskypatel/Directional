name: Agent Self-Hosted Runner Migration

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/self-hosted-migration.txt

permissions:
  contents: write

concurrency:
  group: agent-self-hosted-migration-${{ github.ref }}
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: self-hosted
    steps:
      - name: Checkout exact trigger source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          token: ${{ secrets.GH_TOKEN || github.token }}

      - name: Replace hosted runner labels
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 - <<'PY'
          from pathlib import Path
          targets = sorted(Path('.github/workflows').glob('*.yml')) + sorted(Path('.github/workflows').glob('*.yaml'))
          draft = Path('.agents/Directional/turn-payloads/agent-m3-cp4c0-tb-r5.yml')
          if draft.exists():
              targets.append(draft)
          changed = []
          for path in targets:
              text = path.read_text()
              updated = text.replace('runs-on: ubuntu-24.04', 'runs-on: self-hosted')
              updated = updated.replace('runs-on: ubuntu-latest', 'runs-on: self-hosted')
              updated = updated.replace('runs-on: windows-latest', 'runs-on: self-hosted')
              updated = updated.replace('runs-on: macos-latest', 'runs-on: self-hosted')
              if updated != text:
                  path.write_text(updated)
                  changed.append(str(path))
          print(f'changed_count={len(changed)}')
          for path in changed:
              print(f'changed={path}')
          hosted = []
          for path in targets:
              for no, line in enumerate(path.read_text().splitlines(), 1):
                  if 'runs-on:' in line and 'self-hosted' not in line:
                      hosted.append(f'{path}:{no}:{line.strip()}')
          if hosted:
              raise SystemExit('non-self-hosted runner entries remain: ' + '; '.join(hosted))
          PY
          git diff --check
          git diff -- .github/workflows .agents/Directional/turn-payloads/agent-m3-cp4c0-tb-r5.yml

      - name: Commit and push migration
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- .github/workflows .agents/Directional/turn-payloads/agent-m3-cp4c0-tb-r5.yml; then
            echo 'self_hosted_migration=no_changes_needed'
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows .agents/Directional/turn-payloads/agent-m3-cp4c0-tb-r5.yml
          git commit -m 'ci: move all workflows to self-hosted runner'
          git push origin "HEAD:${GITHUB_REF_NAME}"
          echo 'self_hosted_migration=push_succeeded'
