name: Agent M1 R-A REV-11-13 Source Snapshot

on:
  push:
    branches: [agent/surface_cell_quad/p5-recover-bridge-healing]
    paths: [.agents/connector-triggers/m1-ra-rev-11-13-source.txt]

permissions:
  contents: read

concurrency:
  group: agent-m1-ra-rev-11-13-source
  cancel-in-progress: false

jobs:
  source-snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Initialize persistent activity log
        shell: bash
        run: |
          set -euo pipefail
          : > "$RUNNER_TEMP/activity.log"
          printf '%s\n' \
            'task=M1 R-A-REV-11-through-13 source snapshot' \
            "event_sha=$GITHUB_SHA" \
            "ref=$GITHUB_REF" \
            'runtimeExecution=false' | tee -a "$RUNNER_TEMP/activity.log"

      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          submodules: false

      - name: Package exact source
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee -a "$RUNNER_TEMP/activity.log") 2>&1
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git status --porcelain=v1
          git archive --format=tar.gz -o "$RUNNER_TEMP/source-$GITHUB_SHA.tar.gz" "$GITHUB_SHA"
          sha256sum "$RUNNER_TEMP/source-$GITHUB_SHA.tar.gz" | tee "$RUNNER_TEMP/source.sha256"
          printf '%s\n' "$GITHUB_SHA" > "$RUNNER_TEMP/source-commit.txt"
          echo 'runtimeExecution=false'
          echo 'No generated Directional binary was executed.'

      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: m1-ra-rev-11-13-source-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/source-${{ github.sha }}.tar.gz
            ${{ runner.temp }}/source.sha256
            ${{ runner.temp }}/source-commit.txt
          if-no-files-found: error
          retention-days: 1

      - name: Upload persistent activity log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m1-ra-rev-11-13-source-log-${{ github.run_id }}
          path: ${{ runner.temp }}/activity.log
          if-no-files-found: error
          retention-days: 1
