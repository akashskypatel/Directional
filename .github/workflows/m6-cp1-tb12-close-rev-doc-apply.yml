name: M6 CP1 TB12 Close Review Docs Apply

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m6-cp1-tb12-close-rev-doc-apply.txt

permissions:
  actions: read
  contents: write
  id-token: write

concurrency:
  group: m6-cp1-tb12-close-rev-doc-apply-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/m6-cp1-tb12-close-rev-doc-apply.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  apply:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1wRmCIthHRMiAOyPSwd5p9tc8WV3c76Z2
      patch_sha256: 1e84784b93833d49d7e1bbe5358420194d037625050e31ef59dc0868b1c28f7f
      base_sha: 08f53f78fd1039f16c026322622516c626ccfe70
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: "M6-CP1-TB12-CLOSE-REV: publish review and RA-27 recovery"
    secrets: inherit

  mailbox:
    if: ${{ always() }}
    needs: [apply]
    permissions:
      actions: read
      contents: write
    uses: ./.github/workflows/workflow-mailbox-publisher.yml
    with:
      workflow_key: m6-cp1-tb12-close-rev-doc-apply
      source_sha: ${{ github.sha }}
      source_ref: ${{ github.ref }}
      result: ${{ needs.apply.result }}
      summary: "Apply verified M6-CP1-TB12-CLOSE-REV durable Review patch."
