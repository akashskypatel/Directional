name: M5 CP1 TB1 R1 Closeout Drive Apply

on:
  push:
    branches: [agent/surface_cell_quad/p5-recover-bridge-healing]
    paths: [.agents/connector-triggers/m5-cp1-tb1-r1-closeout-drive-20260920.txt]

permissions:
  actions: read
  contents: write
  id-token: write
  issues: write
  pull-requests: write

concurrency:
  group: m5-cp1-tb1-r1-closeout-drive-${{ github.ref }}
  cancel-in-progress: false

jobs:
  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m5-cp1-tb1-r1-closeout-drive
      commit_run_file: false
      trim_stale_comments: false
    secrets: inherit

  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/m5-cp1-tb1-r1-closeout-drive.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  apply:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: "1GzIpR978ukQJtTrXYS8pgy7W3tNQmK3L"
      patch_sha256: "95df8e46c7cabdf4a73cb4657bd545f3b6034a9f8264aca52619390eb2b92584"
      base_sha: "419d85151950e0ced5ead6eb349c7b1fbc7e8d67"
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: "docs(m5-cp1): close R1 execution and route orchestration correction"
      retention_days: 7
    secrets: inherit
