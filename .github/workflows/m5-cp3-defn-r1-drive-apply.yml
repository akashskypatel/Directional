name: M5 CP3 DEFN R1 Drive Patch Apply

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m5-cp3-defn-r1-drive-apply-20260923.txt

permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

concurrency:
  group: m5-cp3-defn-r1-drive-apply
  cancel-in-progress: false

jobs:
  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m5-cp3-defn-r1-drive-apply
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/m5-cp3-defn-r1-drive-apply.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  apply:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1cjDnLSjVV4ouC0Z2Fjs8r9uqSFSY39d6
      patch_sha256: 31c1c1c4761f67b27235bac23cdb3618ecdd22ccd408504f2436e7dc0db03f38
      base_sha: cda22bb588d23f8a9a9f2a14cfb7b9dfb06eb332
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: "M5-CP3-DEFN-R1: freeze nonzero-Z4 relation gauge definitions"
      retention_days: 7
    secrets: inherit
