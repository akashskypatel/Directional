name: Agent M4 CP3 CB4 R2 STOP-GUARD Apply

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m4-cp3-cb4-r2-stop-guard-apply.txt

permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

concurrency:
  group: agent-m4-cp3-cb4-r2-stop-guard-apply
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/agent-m4-cp3-cb4-r2-stop-guard-apply.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m4-cp3-cb4-r2-stop-guard-apply
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  apply:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1DCq8TZmI-bnHaC6HUrY3RQ88S_CLBbrO
      patch_sha256: '0244270dc619ffe8ea232382c5b51e0b1213515cfe1e53fc20acd214a51dc5e9'
      base_sha: fc5e59e3f52e30087b1a755e67701318d4a5b128
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: 'docs: record M4-CP3-CB4-R2 derivation STOP-GUARD'
    secrets: inherit
