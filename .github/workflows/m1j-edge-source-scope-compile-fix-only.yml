name: m1j-edge-source-scope-compile-fix-only

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - '.agents/connector-triggers/m1j-edge-source-scope-compile-fix-only'

permissions:
  contents: write

concurrency:
  group: m1j-edge-source-scope-compile-fix-only
  cancel-in-progress: false

jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Initialize persistent activity log
        shell: bash
        run: |
          set -Eeuo pipefail
          LOG="$RUNNER_TEMP/m1j-compile-fix-only.log"
          printf '%s\n' \
            'turn=M1j Code+Build compile remediation only' \
            "event_sha=$GITHUB_SHA" \
            'runtimeExecution=false' 'testExecution=false' 'benchmarkExecution=false' \
            'ctestExecution=false' 'cliExecution=false' 'fuzzerExecution=false' \
            'customInputExecution=false' > "$LOG"

      - name: Checkout triggering branch
        uses: actions/checkout@v4
        with:
          ref: agent/surface_cell_quad/p5-recover-bridge-healing
          fetch-depth: 50
          submodules: false

      - name: Apply one-line compatibility fix and push
        shell: bash
        run: |
          set -Eeuo pipefail
          LOG="$RUNNER_TEMP/m1j-compile-fix-only.log"
          exec > >(tee -a "$LOG") 2>&1
          trap 'rc=$?; echo "final_rc=$rc"; git status --short --branch || true; exit $rc' EXIT
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse 'HEAD:include/directional/geometry/SurfaceCellTracing.h')" = '9098daea41e3ca3f75eca4a1683d5c4674c97319'
          test "$(git rev-parse 'HEAD:src/geometry/SurfaceCellTracing.cpp')" = '5d5404a98caf69abb962d477dde2f0e2b68aebf0'
          test "$(git rev-parse 'HEAD:src/pipeline/RemeshPipeline.cpp')" = 'f48a103ce73e232bcd2df41d5062f8838130e43f'
          test "$(git rev-parse 'HEAD:tests/SurfaceCellsPhase10Tests.cpp')" = '512ed80e52c2b2ffdb66a8785354f02f49322603'
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/pipeline/RemeshPipeline.cpp')
          text = p.read_text()
          old = 'relation.sourceComponent != first.sourceComponent ||'
          new = 'relation.sourceComponent != legacy_phase_front_source_component(first) ||'
          assert text.count(old) == 1, text.count(old)
          p.write_text(text.replace(old, new))
          PY
          git diff --check
          test "$(git diff --name-only)" = 'src/pipeline/RemeshPipeline.cpp'
          git diff -- src/pipeline/RemeshPipeline.cpp
          git config user.name 'OpenAI Directional Agent'
          git config user.email 'directional-agent@users.noreply.github.com'
          git add src/pipeline/RemeshPipeline.cpp
          git commit -m 'fix: convert typed edge component at periodic boundary'
          corrected=$(git rev-parse HEAD)
          git push origin HEAD:agent/surface_cell_quad/p5-recover-bridge-healing
          echo "corrected_implementation=$corrected"

      - name: Upload dedicated diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m1j-edge-source-scope-compile-fix-only-logs
          path: ${{ runner.temp }}/m1j-compile-fix-only.log
          if-no-files-found: error
          retention-days: 14
