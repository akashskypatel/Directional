name: Agent M3 CP4c3 CB19 Compile

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m3-cp4c3-cb19-compile.txt

permissions:
  contents: write
  actions: write
  issues: write
  pull-requests: write

jobs:
  workflow-schema-validation:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/agent-m3-cp4c3-cb19-compile.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  compile:
    needs: workflow-schema-validation
    if: needs.workflow-schema-validation.outputs.valid == 'true'
    uses: ./.github/workflows/agent-compile-reusable.yml
    with:
      source_sha: bf971a6c9ad55e9c06c58f9fc73e9112808e5a1e
      artifact_prefix: m3-cp4c3-cb19-compile
    secrets: inherit

  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m3-cp4c3-cb19-compile-r3
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit
