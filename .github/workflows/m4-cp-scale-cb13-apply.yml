name: M4 CP SCALE CB13 Apply

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m4-cp-scale-cb13-apply-20260917.txt

permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

concurrency:
  group: m4-cp-scale-cb13-apply
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/m4-cp-scale-cb13-apply.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m4-cp-scale-cb13-apply
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  apply:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1pPu3TvsQs_NWU4XvlKnwxatXcJTxlhW1
      patch_sha256: 5fbe8bf4eb3e61c23bbd2e0b4f8b77465d38ba9032128c069facc4b4303a63d6
      base_sha: 8e73d23074e925e2d69e6f2154266a8b26e1bd3d
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: "test: add M4 CP-SCALE S5 genus-two produced witness"
    secrets: inherit
