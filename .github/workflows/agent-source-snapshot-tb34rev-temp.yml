name: Agent Source Snapshot TB34REV Temp

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/tb34rev-source-snapshot.txt

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: agent-source-snapshot-tb34rev-temp
  cancel-in-progress: false

jobs:
  validate-caller:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/agent-source-snapshot-tb34rev-temp.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  snapshot:
    needs: validate-caller
    if: ${{ needs.validate-caller.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-source-snapshot.yml
    with:
      source_ref: 48cfd3ba5e832d5bab58455fcc76a3f18b8aa42b
      artifact_prefix: m3-cp4c3-tb34rev-source
    secrets: inherit
