name: Agent CB2 Closeout Workflow Validation

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/cb2-closeout-workflow-validate-20260825.txt

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: agent-cb2-closeout-workflow-validate
  cancel-in-progress: false

jobs:
  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: cb2-closeout-workflow-validate
      commit_run_file: false
    secrets: inherit

  validate-caller:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/agent-cb2-closeout-workflow-validate.yml
    secrets: inherit

  validate-drive-reusable:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/agent-google-drive-reusable.yml
    secrets: inherit
