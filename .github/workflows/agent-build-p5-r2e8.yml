name: Agent Build Surface Cell P5 R2E8

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .github/workflows/agent-build-p5-r2e8.yml

permissions:
  contents: write

concurrency:
  group: agent-surface-cell-p5-r2e8-${{ github.ref }}
  cancel-in-progress: true

env:
  ACTIVE_BRANCH: agent/surface_cell_quad/p5-recover-bridge-healing
  BUILD_DIR: build/agent-p5-r2e8-release
  PACKAGE_DIR: artifact
  LOG_DIR: /tmp/p5-r2e8-workflow-logs
  ACTIVITY_LOG: /tmp/p5-r2e8-workflow-logs/p5-r2e8-compile-activity.log
  FIX_SCRIPT: .agents/Directional/patches/P5-R2E8.scope-fix.py
  RETRY_BUILD_SCRIPT_B64: .agents/Directional/patches/P5-R2E8.retry-build.sh.gz.b64
  FIX_SCRIPT_SHA256: 3f3f67028d0ba42483f079875bab4a51dfe3f91ee396398f0685030f0111bd43
  RETRY_BUILD_SCRIPT_B64_SHA256: 64ae3b747105d8f335f2e3c50f1a6dac6f423fd0ab2399570eae3fbb8f970552
  RETRY_BUILD_SCRIPT_SHA256: 6d53402f48a62fc03a9927bc66f8e9d459ac372020d1c74c0f15d06186482301
  PRE_FIX_SOURCE_BLOB: 7ad3f098cf951a0a6f1333b2b2f29578cfc8b2c1
  MILESTONE_D_BLOB: 54aa7eada44aec9afa08df71a425e7d325cf8388
  HEADER_BLOB: fe1cd8963299dc22510de47e640a8145a03c2820
  PHASE16_BLOB: 97cf0ecd2753fddb022744bd4d9059cafd844fb2

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: Initialize persistent workflow log
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${LOG_DIR}"
          {
            echo "P5-R2E8 corrected canonical boundary corner-sector compile-only build"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "event_sha=${GITHUB_SHA}"
            echo "started_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } | tee "${ACTIVITY_LOG}"

      - name: Checkout exact event commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 4
          submodules: false
          persist-credentials: true

      - name: Apply exact scope correction, compile, and package
        id: compile
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "${LOG_DIR}"
          exec > >(tee -a "${ACTIVITY_LOG}") 2>&1
          test -f "${RETRY_BUILD_SCRIPT_B64}"
          echo "${RETRY_BUILD_SCRIPT_B64_SHA256}  ${RETRY_BUILD_SCRIPT_B64}" | sha256sum -c -
          base64 -d "${RETRY_BUILD_SCRIPT_B64}" | gzip -d > /tmp/p5-r2e8-retry-build.sh
          echo "${RETRY_BUILD_SCRIPT_SHA256}  /tmp/p5-r2e8-retry-build.sh" | sha256sum -c -
          chmod +x /tmp/p5-r2e8-retry-build.sh
          /tmp/p5-r2e8-retry-build.sh

      - name: Upload compiled checkpoint
        if: steps.compile.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: surface-cell-p5-r2e8-github-source-linux-release
          path: artifact
          if-no-files-found: error
          retention-days: 14
          compression-level: 6

      - name: Always upload detailed workflow logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surface-cell-p5-r2e8-workflow-logs-${{ github.run_id }}
          path: /tmp/p5-r2e8-workflow-logs
          if-no-files-found: error
          retention-days: 30
