name: M3 CP4c3 CB6 Apply

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m3-cp4c3-cb6-apply-20260831.txt

permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

concurrency:
  group: m3-cp4c3-cb6-apply
  cancel-in-progress: false

jobs:
  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m3-cp4c3-cb6-apply
      commit_run_file: false
    secrets: inherit

  validate-caller:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/m3-cp4c3-cb6-apply.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  apply:
    needs: validate-caller
    if: ${{ needs.validate-caller.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1ikS8Q-ZsyCSfQ01dauKHGQLECyv3PtZS
      patch_sha256: 17b87ef26ef166a7819fba1104b8c2a32829ad25c3860d668bbfa3f442f2b7f5
      base_sha: ac8f6dd01defefc2135d674c9a9ce9351c08c764
