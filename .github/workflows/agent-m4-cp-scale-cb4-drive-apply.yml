name: Agent M4 CP SCALE CB4 Drive Apply

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m4-cp-scale-cb4-drive-apply/trigger.txt

permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

concurrency:
  group: agent-m4-cp-scale-cb4-drive-apply-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/agent-m4-cp-scale-cb4-drive-apply.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m4-cp-scale-cb4-drive-apply
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  apply:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1kZDHu_fEucdw1P-XnDZj8uIp0rMa0dUe
      patch_sha256: e48ae6eeca14866cb7edf2ddbbcba9584099fe56e89344a9fdc16b50fb7998fd
      base_sha: cce5ddc4cb7830251214845feb29589776b96d3d
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: 'test: repair M4 CP SCALE S2 field authority'
    secrets: inherit
