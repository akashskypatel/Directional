name: Agent Pinned Source Snapshot 20260907-1311

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/pinned-source-snapshot-20260907-1311.txt

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: agent-pinned-source-snapshot-20260907-1311
  cancel-in-progress: false

jobs:
  validate-caller:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/agent-source-snapshot-caller-20260907-1311.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  snapshot:
    needs: validate-caller
    uses: ./.github/workflows/agent-source-snapshot.yml
    with:
      source_ref: b7f7c651af597cae2d427157454c3c4d0bf78a69
      artifact_prefix: agent-source-snapshot-b7f7c651
      retention_days: 7
    secrets: inherit
