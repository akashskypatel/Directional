name: M6 CP3 TB1 Entry Review Closeout

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m6-cp3-tb1-entry-rev-closeout.txt

permissions:
  actions: read
  contents: write
  id-token: write

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/m6-cp3-tb1-entry-rev-closeout.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  apply:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 15w0G9VMw-AzouLDCRwofkEgHM4UMPY7G
      patch_sha256: '0c58d974405c1744520adc819a66e7e9ce4563203239b0e4c4e108cc2c03c412'
      base_sha: e1976187f5a6297dc34c08e4c6c1075f1e8a6903
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: 'M6-CP3-TB1-ENTRY-REV: adjudicate entry regressions and freeze RA-31'
      retention_days: 14
    secrets: inherit

  mailbox:
    if: ${{ always() }}
    needs: [validate, apply]
    permissions:
      actions: read
      contents: write
    uses: ./.github/workflows/workflow-mailbox-publisher.yml
    with:
      workflow_key: m6-cp3-tb1-entry-rev-closeout
      source_sha: ${{ github.sha }}
      source_ref: ${{ github.ref }}
      result: ${{ needs.apply.result }}
      summary: M6-CP3-TB1-ENTRY-REV durable Review closeout.
