name: M6 CP1 TB5 Artifact-Only Test Benchmark

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m6-cp1-tb5-exec-20260925.txt

permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: m6-cp1-tb5-exec
  cancel-in-progress: false

jobs:
  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m6-cp1-tb5-exec
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/m6-cp1-tb5-exec.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  runtime:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
      TURN_ID: M6-CP1-TB5-EXEC
      HARNESS_PATH: .agents/Directional/turn-payloads/m6_cp1_tb5_exec_harness.sh
      EXPECTED_HARNESS_SHA256: '47ade7da0ed832a534bd395ec75477154451d44a2f7617f7a76e5c4e2c1013d4'
    steps:
      - name: Checkout canonical executor source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          token: ${{ secrets.GH_TOKEN || github.token }}

      - name: Verify canonical harness
        shell: bash
        run: |
          set -euo pipefail
          test -f "$HARNESS_PATH"
          actual="$(sha256sum "$HARNESS_PATH" | awk '{print $1}')"
          test "$actual" = "$EXPECTED_HARNESS_SHA256"
          bash -n "$HARNESS_PATH"

      - name: Execute immutable artifact-only gate
        id: gate
        shell: bash
        run: |
          set +e
          bash "$HARNESS_PATH" --execute
          status=$?
          set -e
          echo "harness_exit=${status}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload result evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: directional-m6-cp1-tb5-result-${{ github.run_id }}
          path: ${{ runner.temp }}/M6-CP1-TB5-EXEC-result
          if-no-files-found: error
          retention-days: 7

      - name: Upload diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: directional-m6-cp1-tb5-log-${{ github.run_id }}
          path: ${{ runner.temp }}/M6-CP1-TB5-EXEC.log
          if-no-files-found: error
          retention-days: 7

      - name: Fail closed on orchestration failure
        if: always()
        shell: bash
        run: test "${{ steps.gate.outputs.harness_exit }}" = "0"
