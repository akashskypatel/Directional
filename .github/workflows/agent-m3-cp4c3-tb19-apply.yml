name: Agent M3 CP4c3 TB19 Apply

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/tb/m3-cp4c3-tb19-apply.txt

permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

concurrency:
  group: agent-m3-cp4c3-tb19-apply
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/agent-m3-cp4c3-tb19-apply.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m3-cp4c3-tb19-apply
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  apply:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1tvZ4etfHTyNvcQnHIs-j5DKrI8YtM7i2
      patch_sha256: '2f0131585f7ac054aff3aceaf9a0d2be938431ebf8d514f1a6a2c36053a4d653'
      base_sha: 8c8bc7934b8152bfc759459be845f68fa1232137
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: 'ci: stage TB19 artifact-only runner'
    secrets: inherit
