name: Agent Source Snapshot CP-SCALE-CB1 20260914

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/source-snapshot/p5-cp-scale-cb1-20260914.txt

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: agent-source-snapshot-cp-scale-cb1-20260914-${{ github.ref }}
  cancel-in-progress: false

jobs:
  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: source-snapshot-cp-scale-cb1-20260914
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/agent-source-snapshot-p5-cp-scale-cb1-20260914.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  snapshot:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-source-snapshot.yml
    with:
      source_ref: 0a2e2a23736ab2938ce8f8237147c2a0b9540848
      artifact_prefix: agent-source-snapshot-cp-scale-cb1-20260914
      retention_days: 7
    secrets: inherit
