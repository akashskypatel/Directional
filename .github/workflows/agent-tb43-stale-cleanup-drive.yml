name: Agent TB43 Stale Evidence Cleanup Apply

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/tb43-stale-cleanup-drive-20260908.txt

permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

concurrency:
  group: agent-tb43-stale-cleanup-drive
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/agent-tb43-stale-cleanup-drive.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: tb43-stale-cleanup-drive
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  apply:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 10XTdExQHqmNLCpaqgUL_pkM4arnNjXVy
      patch_sha256: 0fb8550e0ee767746bf4688a79a7448a88ba13b0451b489c3a2e5c1c7a66dda9
      base_sha: f604b3e10fe2ddadc58e2942ee9ad041fc44257c
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: "docs: retire stale CP4c3 evidence before TB43"
      retention_days: 14
    secrets: inherit
