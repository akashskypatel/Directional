name: M4 CP3 CB8 Compile Fix Drive Apply

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m4-cp3-cb8-fix-drive-apply.txt

permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

concurrency:
  group: m4-cp3-cb8-fix-drive-apply-${{ github.ref }}
  cancel-in-progress: false

jobs:
  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m4-cp3-cb8-fix-drive-apply
      commit_run_file: false
    secrets: inherit

  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/agent-m4-cp3-cb8-fix-drive-apply.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  apply:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1hrB2KD-x1-KVm6_wOFh7Bn_bGcMviGsc
      patch_sha256: 'bff785809a44102b22116d66b8b72ba6558ba80b56c68c7031dc60e88ea42be6'
      base_sha: 0d823b2c83816950f1c30abdd17bcf54845e420b
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: 'fix: M4-CP3-CB8 unwrap checked source vertex id'
    secrets: inherit
