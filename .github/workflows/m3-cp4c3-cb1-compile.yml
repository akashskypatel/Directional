name: M3 CP4c3 CB1 Compile

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m3-cp4c3-cb1-compile.txt

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: m3-cp4c3-cb1-compile
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/m3-cp4c3-cb1-compile.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m3-cp4c3-cb1-compile
      commit_run_file: false
    secrets: inherit

  authority:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact semantic source
        uses: actions/checkout@v4
        with:
          ref: 48dd011c4aa689a245b74527ed9df0900ada9bf3
          fetch-depth: 1
          submodules: false

      - name: Verify AK0 frozen selector authority
        shell: bash
        run: |
          set -euo pipefail
          f=.agents/Directional/Architecture_M3_CP4c3_Required_Green_Selector_367.txt
          test "$(sha256sum "$f" | awk '{print $1}')" = ef9d082f56f5c8de83124cf2e6257d098408cc597d9147b967cf9c84da4916bf
          test "$(head -n 355 "$f" | sha256sum | awk '{print $1}')" = e9d88f1196e412e06424294d6be22b32f01c9671ec5e4de119abd3f2fb5afeaa
          test "$(head -n 357 "$f" | sha256sum | awk '{print $1}')" = b896d0db7f26aeb0f3513418405efdeccbcf84fb6dc971500c6ddac9e364dc70
          test "$(head -n 361 "$f" | sha256sum | awk '{print $1}')" = 61918d9fbd7bf757437886f0e86776b60665c58e4d7283b81d42caca03c0288b
          test "$(head -n 365 "$f" | sha256sum | awk '{print $1}')" = 6b5b6555d39c250c24cbf3faeafdeca93b4b11379118a29583253e6cfc14b8a1
          test "$(wc -l < "$f" | tr -d ' ')" = 367
          test "$(sort -u "$f" | wc -l | tr -d ' ')" = 367
          test "$(sed -n '366p' "$f")" = GlobalTopologyPlan.MechanicalFeatureWitnessDerivesRegionsThroughProductionEntryPath
          test "$(sed -n '367p' "$f")" = GlobalTopologyPlan.RotationSystemAndFaceWalkAgreeOnProducedWitnesses
          printf '%s\n' \
            'selector367_sha256=ef9d082f56f5c8de83124cf2e6257d098408cc597d9147b967cf9c84da4916bf' \
            'prefix355_sha256=e9d88f1196e412e06424294d6be22b32f01c9671ec5e4de119abd3f2fb5afeaa' \
            'prefix357_sha256=b896d0db7f26aeb0f3513418405efdeccbcf84fb6dc971500c6ddac9e364dc70' \
            'prefix361_sha256=61918d9fbd7bf757437886f0e86776b60665c58e4d7283b81d42caca03c0288b' \
            'prefix365_sha256=6b5b6555d39c250c24cbf3faeafdeca93b4b11379118a29583253e6cfc14b8a1' \
            'selector_cardinality=367' \
            'selector_unique=367' \
            'selected_r2_branch=NONE' \
            'selected_gate=NONE' \
            'gate_execution_authorized=false' \
            'runtimeExecution=false'

  compile:
    needs:
      - validate
      - authority
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-compile-reusable.yml
    with:
      source_sha: 48dd011c4aa689a245b74527ed9df0900ada9bf3
      artifact_prefix: m3-cp4c3-cb1
    secrets: inherit
