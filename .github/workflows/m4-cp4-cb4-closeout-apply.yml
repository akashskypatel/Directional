name: M4 CP4 CB4 Closeout Apply

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m4-cp4-cb4/closeout-apply.txt

permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

concurrency:
  group: m4-cp4-cb4-closeout-apply
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/m4-cp4-cb4-closeout-apply.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m4-cp4-cb4-closeout-apply
      commit_run_file: false
      trim_stale_comments: false
    secrets: inherit

  apply:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 14gvINj16sccMpCFlw65mWJll-67l3ItR
      patch_sha256: 'db758207d94ed91a4ccebd5c06be3ce6bb1a7110affa3e051c571ae445e19d0b'
      base_sha: 73db3c97194b6c785122ba6c62ef6ff6bb17c276
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: 'M4-CP4-CB4: close out compile and freeze R3'
      retention_days: 14
    secrets: inherit
