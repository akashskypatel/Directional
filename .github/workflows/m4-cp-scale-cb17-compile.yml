name: M4 CP SCALE CB17 Compile

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/cb17-compile.txt

permissions:
  contents: write
  actions: write
  issues: write
  pull-requests: write

concurrency:
  group: m4-cp-scale-cb17-compile
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/m4-cp-scale-cb17-compile.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: M4-CP-SCALE-CB17-compile
      commit_run_file: false
    secrets: inherit

  preflight:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-compile-reusable.yml
    with:
      source_sha: 1b44d2b7b3173590db9837a1386eadbc9ac32981
      targets: directional_surface_cell_authority_kernel_tests
      artifact_prefix: m4-cp-scale-cb17-preflight
    secrets: inherit

  package:
    needs: [validate, preflight]
    if: ${{ needs.validate.outputs.valid == 'true' && needs.preflight.result == 'success' }}
    uses: ./.github/workflows/agent-compile-reusable.yml
    with:
      source_sha: 1b44d2b7b3173590db9837a1386eadbc9ac32981
      targets: directional_core directional_pipeline directional_surface_cell_authority_kernel_tests directional_surface_cell_producer_tests directional_surface_cell_completion_tests directional_surface_cell_validation_tests directional_compiled_api_tests directional_benchmarks
      artifact_prefix: m4-cp-scale-cb17-package
    secrets: inherit
