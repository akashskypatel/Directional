name: M3 CP4c3 Phase1 Artifact TB
on:
  push:
    branches: [agent/surface_cell_quad/p5-recover-bridge-healing]
    paths: [.agents/connector-triggers/m3-cp4c3-tb1-exec.txt]
permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: write
concurrency:
  group: m3-cp4c3-tb1
  cancel-in-progress: false
jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/m3-cp4c3-tb1.yml
      source_ref: ${{ github.sha }}
    secrets: inherit
  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with: {pr_number: 8, label: m3-cp4c3-tb1, commit_run_file: false}
    secrets: inherit
  artifact-only-test:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    runs-on: ubuntu-24.04
    env:
      AID: '9739919234'
      ASHA: 127c7b086a8849de7f0c14928f2c5d762c3bf71711821d0a1fabfefda889d11c
      SSHA: 48dd011c4aa689a245b74527ed9df0900ada9bf3
      STARSHA: f1fce7f720718c8ac974d0d5f77ca1fee424b10c710d2b505a1af162e4f937f
      SELSHA: ef9d082f56f5c8de83124cf2e6257d098408cc597d9147b967cf9c84da4916bf
      NGSHA: 537a8010033452a16be5f6a80926ea61c065f7f7f443b5b2950f73c8b8ffcd6a
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Initialize log
        shell: bash
        run: |
          set -euo pipefail
          L="${RUNNER_TEMP}/m3-cp4c3-tb1.log"; : > "$L"
          printf '%s\n' "workflow=$GITHUB_WORKFLOW" "run_id=$GITHUB_RUN_ID" "event_sha=$GITHUB_SHA" "artifact_id=$AID" 'runtimeExecution=true' 'configure=false' 'compile=false' 'relink=false' 'repair=false' 'generatedDiscovery=false' | tee -a "$L"
      - name: Preflight immutable package
        shell: bash
        run: |
          set -euo pipefail
          L="${RUNNER_TEMP}/m3-cp4c3-tb1.log"; exec > >(tee -a "$L") 2>&1; trap 'echo preflight_exit=$?' EXIT
          W="${RUNNER_TEMP}/m3-cp4c3-tb1"; P="$W/package"; R="$W/result"; rm -rf "$W"; mkdir -p "$P" "$R"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$AID/zip" > "$W/package.zip"
          test "$(sha256sum "$W/package.zip"|cut -d' ' -f1)" = "$ASHA"; unzip -q "$W/package.zip" -d "$P"; (cd "$P" && sha256sum -c SHA256SUMS)
          test "$(cat "$P/metadata/source-commit.txt")" = "$SSHA"; test "$(cat "$P/metadata/preflight-exit-code.txt")" = 0; test "$(cat "$P/metadata/build-exit-code.txt")" = 0
          for f in source-status-preconfigure.txt source-status-before-configure.txt source-status-after-configure.txt source-status-after-build.txt source-status-final.txt; do test ! -s "$P/metadata/$f"; done
          grep -Fxq runtimeExecution=false "$P/metadata/command-boundary.txt"; grep -Fxq turnBoundary=Code+Build-only "$P/metadata/command-boundary.txt"; grep -Fxq exactArithmeticBackend=GMP "$P/metadata/command-boundary.txt"
          T="$P/source/source-$SSHA.tar.gz"; test "$(sha256sum "$T"|cut -d' ' -f1)" = "$STARSHA"; tar -xzf "$T" -C "$GITHUB_WORKSPACE"
          S="$GITHUB_WORKSPACE/.agents/Directional/Architecture_M3_CP4c3_Required_Green_Selector_367.txt"; test "$(sha256sum "$S"|cut -d' ' -f1)" = "$SELSHA"; test "$(wc -l < "$S"|tr -d ' ')" = 367; test "$(sort -u "$S"|wc -l|tr -d ' ')" = 367
          test "$(head -n355 "$S"|sha256sum|cut -d' ' -f1)" = e9d88f1196e412e06424294d6be22b32f01c9671ec5e4de119abd3f2fb5afeaa
          test "$(head -n357 "$S"|sha256sum|cut -d' ' -f1)" = b896d0db7f26aeb0f3513418405efdeccbcf84fb6dc971500c6ddac9e364dc70
          test "$(head -n361 "$S"|sha256sum|cut -d' ' -f1)" = 61918d9fbd7bf757437886f0e86776b60665c58e4d7283b81d42caca03c0288b
          test "$(head -n365 "$S"|sha256sum|cut -d' ' -f1)" = 6b5b6555d39c250c24cbf3faeafdeca93b4b11379118a29583253e6cfc14b8a1
          test "$(sed -n 366p "$S")" = GlobalTopologyPlan.MechanicalFeatureWitnessDerivesRegionsThroughProductionEntryPath; test "$(sed -n 367p "$S")" = GlobalTopologyPlan.RotationSystemAndFaceWalkAgreeOnProducedWitnesses
          N="$W/non-gating.txt"; printf '%s\n' GlobalTopologyPlan.TorusWitnessStageReachabilityIsObservable GlobalTopologyPlan.MechanicalWitnessStageReachabilityIsObservable GlobalTopologyPlan.SpherePrescribedWitnessStageReachabilityIsObservable > "$N"; test "$(sha256sum "$N"|cut -d' ' -f1)" = "$NGSHA"
          for e in "$P"/bin/directional_*tests; do test -x "$e"; done; test -f "$GITHUB_WORKSPACE/benchmarks/fixtures/milestone-g/mechanical_feature.obj"; test -f "$GITHUB_WORKSPACE/benchmarks/fixtures/milestone-g/sphere_prescribed.obj"
          strings "$P/bin/directional_surface_cell_producer_tests" > "$W/producer.strings"; grep -Fq "$GITHUB_WORKSPACE" "$W/producer.strings"; ldd "$P/bin/directional_surface_cell_producer_tests"|tee "$R/ldd.txt"; grep -Fq libgmpxx "$R/ldd.txt"; grep -Fq libgmp "$R/ldd.txt"
          inv(){ while IFS= read -r -d '' f; do printf '%s ' "$(stat -c %a "$f")"; sha256sum "$f"; done < <(find "$1" -type f -print0|sort -z); }; inv "$P" > "$W/package.pre"; inv "$GITHUB_WORKSPACE" > "$W/source.pre"; printf 'preflight=PASS\nselectorCount=367\nnonGatingCount=3\n' > "$R/preflight.txt"
      - name: Execute selectors one identity per process
        shell: bash
        run: |
          set -euo pipefail
          L="${RUNNER_TEMP}/m3-cp4c3-tb1.log"; exec > >(tee -a "$L") 2>&1
          W="${RUNNER_TEMP}/m3-cp4c3-tb1"; P="$W/package"; R="$W/result"; S="$GITHUB_WORKSPACE/.agents/Directional/Architecture_M3_CP4c3_Required_Green_Selector_367.txt"; mkdir -p "$R/required" "$R/non-gating" "$W/strings"; : > "$R/required-ledger.tsv"; : > "$R/non-gating-ledger.tsv"
          for e in "$P"/bin/directional_*tests; do strings "$e" > "$W/strings/$(basename "$e")"; done
          owner(){ local i="$1" s="${1%%.*}" t="${1#*.}" o='' n=0; for e in "$P"/bin/directional_*tests; do q="$W/strings/$(basename "$e")"; if grep -Fxq "$s" "$q"&&grep -Fxq "$t" "$q"; then o="$e"; n=$((n+1)); fi; done; test "$n" = 1||return 1; printf %s "$o"; }
          one(){ local ledger="$1" n="$2" i="$3" dir="$4" e out ec a b ms sel st; e="$(owner "$i")"||return 70; out="$dir/$(printf %03d "$n").log"; a="$(date +%s%N)"; set +e; "$e" "--gtest_filter=$i" --gtest_color=no > "$out" 2>&1; ec=$?; set -e; b="$(date +%s%N)"; ms=$(((b-a)/1000000)); sel="$(grep -c '^\[ RUN      \]' "$out"||true)"; test "$sel" = 1||{ cat "$out" >&2; return 71; }; if test "$ec" = 0; then st=PASS; else st=RED; fi; printf '%s\t%s\t%s\t%s\t%s\t%s\t%s\n' "$n" "$i" "$(basename "$e")" "$sel" "$ec" "$ms" "$st" >> "$ledger"; cat "$out" >&2; printf %s "$st"; }
          rp=0; rr=0; re=0; fro=none; fri=none; n=0; while IFS= read -r i; do n=$((n+1)); st="$(one "$R/required-ledger.tsv" "$n" "$i" "$R/required")"||exit $?; re=$((re+1)); if test "$st" = PASS; then rp=$((rp+1)); else rr=$((rr+1)); fro=$n; fri=$i; break; fi; done < "$S"
          np=0; nr=0; ne=0; n=0; while IFS= read -r i; do n=$((n+1)); st="$(one "$R/non-gating-ledger.tsv" "$n" "$i" "$R/non-gating")"||exit $?; ne=$((ne+1)); if test "$st" = PASS; then np=$((np+1)); else nr=$((nr+1)); fi; done < "$W/non-gating.txt"
          grep -hE 'incompleteCycleBasisReason=|cycleBasisRegion\[|originatingRotationSystemReason=|rotationSystemReason=' "$R"/required/*.log "$R"/non-gating/*.log > "$R/ak-evidence.txt"||true; x="$(grep -hF 'C++ exception with description' "$R"/required/*.log "$R"/non-gating/*.log|wc -l)"
          printf '%s\n' executionValid=true "requiredExecuted=$re" "requiredPass=$rp" "requiredRed=$rr" "firstRedOrdinal=$fro" "firstRedIdentity=$fri" "nonGatingExecuted=$ne" "nonGatingPass=$np" "nonGatingRed=$nr" "escapingCppExceptions=$x" zeroSelected=0 configure=false compile=false relink=false repair=false generatedDiscovery=false benchmarkExecution=false mutationOccurred=false | tee "$R/summary.txt"
      - name: Immutable postflight
        shell: bash
        run: |
          set -euo pipefail
          L="${RUNNER_TEMP}/m3-cp4c3-tb1.log"; exec > >(tee -a "$L") 2>&1; trap 'echo postflight_exit=$?' EXIT
          W="${RUNNER_TEMP}/m3-cp4c3-tb1"; P="$W/package"; R="$W/result"; inv(){ while IFS= read -r -d '' f; do printf '%s ' "$(stat -c %a "$f")"; sha256sum "$f"; done < <(find "$1" -type f -print0|sort -z); }; inv "$P" > "$W/package.post"; inv "$GITHUB_WORKSPACE" > "$W/source.post"; cmp "$W/package.pre" "$W/package.post"; cmp "$W/source.pre" "$W/source.post"; (cd "$P"&&sha256sum -c SHA256SUMS); test "$(sha256sum "$GITHUB_WORKSPACE/.agents/Directional/Architecture_M3_CP4c3_Required_Green_Selector_367.txt"|cut -d' ' -f1)" = "$SELSHA"; printf 'postflight=PASS\npackageImmutable=true\nsourceImmutable=true\n' > "$R/postflight.txt"
      - name: Record final status
        if: always()
        shell: bash
        run: printf '%s\n' "final_job_status=${{ job.status }}" "finished_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" | tee -a "${RUNNER_TEMP}/m3-cp4c3-tb1.log"
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with: {name: 'm3-cp4c3-tb1-result-${{ github.run_id }}', path: '${{ runner.temp }}/m3-cp4c3-tb1/result', if-no-files-found: error, retention-days: 7}
      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with: {name: 'm3-cp4c3-tb1-log-${{ github.run_id }}', path: '${{ runner.temp }}/m3-cp4c3-tb1.log', if-no-files-found: error, retention-days: 7}
