name: Agent CP4c3 TB2 Final Docs Apply

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/cp4c3-tb2-final-docs-apply/run.txt

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

concurrency:
  group: agent-cp4c3-tb2-final-docs-apply
  cancel-in-progress: false

jobs:
  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: cp4c3-tb2-final-docs-apply
      commit_run_file: false
    secrets: inherit

  validate_caller:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/agent-cp4c3-tb2-final-docs-apply-temp.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  apply:
    needs: validate_caller
    if: ${{ needs.validate_caller.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1xrzpbyL1KQ_3VvL-Efg4ql7lXAAcHzps
      patch_sha256: 'c94877ca3673c8c52c9cc308fb30be298eaa41d0a6ca8f79f9db197ed88c2ac0'
      base_sha: fa273cc829644ea5d6b17a74d8c4df2c4e26ffe4
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: 'docs: close M3-CP4c-3-TB2 semantic first-red'
    secrets: inherit
