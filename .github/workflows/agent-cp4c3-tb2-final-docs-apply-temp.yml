name: Agent CP4c3 TB2 Final Cleanup

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/cp4c3-tb2-final-docs-apply/run.txt

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: agent-cp4c3-tb2-final-cleanup
  cancel-in-progress: false

jobs:
  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: cp4c3-tb2-final-cleanup
      commit_run_file: false
    secrets: inherit

  validate_caller:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/agent-cp4c3-tb2-final-docs-apply-temp.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  cleanup:
    needs: validate_caller
    if: ${{ needs.validate_caller.outputs.valid == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact control source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Retire TB2 temporary control state
        shell: bash
        run: |
          set -euo pipefail
          target='agent/surface_cell_quad/p5-recover-bridge-healing'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          rm -f \
            .github/workflows/agent-cp4c3-tb2-exec-r1-temp.yml \
            .github/workflows/agent-cp4c3-tb2-exec-r2-temp.yml \
            .github/workflows/agent-cp4c3-tb2-exec-r3-temp.yml \
            .github/workflows/agent-cp4c3-tb2-exec-r4-temp.yml \
            .github/workflows/agent-cp4c3-tb2-repackage-temp.yml \
            .github/workflows/agent-cp4c3-tb2-final-docs-apply-temp.yml
          rm -rf \
            .agents/connector-triggers/cp4c3-tb2-exec-r1 \
            .agents/connector-triggers/cp4c3-tb2-exec-r2 \
            .agents/connector-triggers/cp4c3-tb2-exec-r3 \
            .agents/connector-triggers/cp4c3-tb2-exec-r4 \
            .agents/connector-triggers/cp4c3-tb2-repackage \
            .agents/connector-triggers/cp4c3-tb2-final-docs-apply

          git add -A
          changed="$(git diff --cached --name-only)"
          test -n "$changed"
          bad="$(printf '%s\n' "$changed" | grep -Ev '^(\.github/workflows/agent-cp4c3-tb2-(exec-r[1-4]|repackage|final-docs-apply)-temp\.yml|\.agents/connector-triggers/cp4c3-tb2-(exec-r[1-4]|repackage|final-docs-apply)/)' || true)"
          test -z "$bad"
          git diff --cached --check
          git commit -m 'cleanup: retire M3-CP4c-3-TB2 temporary control state'
          git push origin "HEAD:${target}"

          for branch in \
            agent/surface_cell_quad/p5-recover-bridge-healing-final-docs \
            agent/surface_cell_quad/p5-recover-bridge-healing-final-docs-2; do
            if git ls-remote --exit-code --heads origin "refs/heads/${branch}" >/dev/null 2>&1; then
              git push origin --delete "$branch"
            fi
          done
