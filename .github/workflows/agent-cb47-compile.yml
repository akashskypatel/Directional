name: M3 CP4c3 CB47 Compile

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/cb47-compile/trigger.txt

permissions:
  contents: write
  actions: write
  issues: write
  pull-requests: write

concurrency:
  group: m3-cp4c3-cb47-compile
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/agent-cb47-compile.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m3-cp4c3-cb47-compile
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  changed-owner:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-compile-reusable.yml
    with:
      source_sha: 5dacce6019ea34316c48743f3033d2bb5c26281a
      targets: directional_surface_cell_producer_tests
      artifact_prefix: directional-m3-cp4c3-cb47-owner
    secrets: inherit

  package:
    needs:
      - validate
      - changed-owner
    if: ${{ needs.validate.outputs.valid == 'true' && needs.changed-owner.result == 'success' }}
    uses: ./.github/workflows/agent-compile-reusable.yml
    with:
      source_sha: 5dacce6019ea34316c48743f3033d2bb5c26281a
      targets: directional_core directional_pipeline directional_surface_cell_authority_kernel_tests directional_surface_cell_producer_tests directional_surface_cell_completion_tests directional_surface_cell_validation_tests directional_compiled_api_tests directional_benchmarks
      artifact_prefix: directional-m3-cp4c3-cb47
    secrets: inherit
