name: M5 CP1 TB1 R2 Artifact-Only Test Benchmark

on:
  push:
    branches: [agent/surface_cell_quad/p5-recover-bridge-healing]
    paths: [.agents/connector-triggers/m5-cp1-tb1-r2-exec-20260920.txt]

permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: m5-cp1-tb1-r2-exec-${{ github.ref }}
  cancel-in-progress: false

jobs:
  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m5-cp1-tb1-r2-exec
      commit_run_file: false
      trim_stale_comments: false
    secrets: inherit

  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/m5-cp1-tb1-r2-exec.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  runtime:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
      TURN_ID: M5-CP1-TB1-R2-EXEC
      HARNESS_PATH: .agents/Directional/tools/m5_cp1_tb1_r2_artifact_only_harness.sh
      EXPECTED_HARNESS_SHA256: b706d03adde7d7d3daacb6ac46c4cb35468a40e162d7fb9d1617d4e562d37302
    steps:
      - name: Checkout canonical executor source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          token: ${{ secrets.GH_TOKEN || github.token }}

      - name: Verify canonical harness
        shell: bash
        run: |
          set -euo pipefail
          test -f "$HARNESS_PATH"
          actual="$(sha256sum "$HARNESS_PATH" | awk '{print $1}')"
          test "$actual" = "$EXPECTED_HARNESS_SHA256"
          bash -n "$HARNESS_PATH"

      - name: Execute immutable artifact-only gate
        id: gate
        shell: bash
        run: |
          set +e
          bash "$HARNESS_PATH" --execute
          status=$?
          set -e
          echo "harness_exit=${status}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload result evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: directional-m5-cp1-tb1-r2-result-${{ github.run_id }}
          path: ${{ runner.temp }}/M5-CP1-TB1-R2-EXEC-result
          if-no-files-found: error
          retention-days: 7

      - name: Upload diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: directional-m5-cp1-tb1-r2-log-${{ github.run_id }}
          path: ${{ runner.temp }}/M5-CP1-TB1-R2-EXEC.log
          if-no-files-found: error
          retention-days: 7

      - name: Fail closed on orchestration failure
        if: always()
        shell: bash
        run: test "${{ steps.gate.outputs.harness_exit }}" = "0"
