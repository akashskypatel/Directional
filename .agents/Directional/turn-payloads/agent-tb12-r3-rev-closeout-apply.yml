name: M4 CP SCALE TB12 R3 REV Closeout Apply

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/tb12-r3-rev-closeout-apply/M4-CP-SCALE-TB12-R3-REV.txt

permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/agent-tb12-r3-rev-closeout-apply.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: tb12-r3-rev-closeout-apply
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  apply:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1pxxu3o4KQOGu6ljn8XqyUKeSCRbDJ3V4
      patch_sha256: 2a48d662dcf88739780dd404c6c1ea65fddf7bf632ae4c6a2c45b42e96d438db
      base_sha: 1b6c57cd42c0eb919f875973529c7ea5a6d239d4
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: "docs: close M4-CP-SCALE-TB12-R3-REV and freeze CB17"
    secrets: inherit
