name: Agent CB9 Closeout Drive Patch Apply

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/cb9-closeout-drive-apply/**

permissions:
  contents: write
  id-token: write
  actions: read
  issues: write
  pull-requests: write

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/agent-cb9-drive-apply-temp.yml

  apply:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1YWFw_UqLWThH9wsdieQzauxKYxY_U1oq
      patch_sha256: daffeaaa04adcd6332a6a7dc8b955d65c1e08217eb20361958849f11644a7bb7
      base_sha: e5d6ed76cfb4e0dc21e39aa8d3fc5de98fd5595a
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: "M3-CP4c-3-CB9: close out code-build evidence"
      retention_days: 7
    secrets: inherit

  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: M3-CP4c-3-CB9-closeout-drive-apply
      trim_stale_comments: true
    secrets: inherit
