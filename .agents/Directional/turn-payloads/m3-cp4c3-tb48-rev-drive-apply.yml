name: M3 CP4c3 TB48 REV Drive Apply

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/tb48-rev-drive/tb48-rev-drive-20260909.txt

permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

concurrency:
  group: m3-cp4c3-tb48-rev-drive-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/m3-cp4c3-tb48-rev-drive-apply.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m3-cp4c3-tb48-rev-drive
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  apply:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 12QD5MdKuuF1EQwp64NT-EcsAtHZ1ovRC
      patch_sha256: '4b45957d7024e07044408184082c285887e0b7721bfb98bd1eecbc652594402e'
      base_sha: 3686823b1a8376e170543e2e5bd2d74dcf66ec4d
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: 'M3-CP4c-3-TB48-REV: promote package113 and close M3'
      retention_days: 14
    secrets: inherit
