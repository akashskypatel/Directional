name: Temporary M3 CP4c2 CB3 Compile

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/compile-m3-cp4c2-cb3-20260828.txt

permissions:
  contents: write
  actions: write
  issues: write
  pull-requests: write

concurrency:
  group: temp-m3-cp4c2-cb3-compile
  cancel-in-progress: false

jobs:
  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: compile-m3-cp4c2-cb3
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  changed-owner:
    uses: ./.github/workflows/agent-compile-reusable.yml
    with:
      source_sha: 76d757aab0ce18df09ce2823302d2dc224965187
      targets: directional_surface_cell_producer_tests
      artifact_prefix: m3-cp4c2-cb3-changed-owner
    secrets: inherit

  full-package:
    needs: changed-owner
    uses: ./.github/workflows/agent-compile-reusable.yml
    with:
      source_sha: 76d757aab0ce18df09ce2823302d2dc224965187
      targets: directional_core directional_pipeline directional_surface_cell_authority_kernel_tests directional_surface_cell_producer_tests directional_surface_cell_completion_tests directional_surface_cell_validation_tests directional_compiled_api_tests directional_benchmarks
      artifact_prefix: m3-cp4c2-cb3-full-package
    secrets: inherit
