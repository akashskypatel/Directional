name: M3 CP4c1 CB4 Apply Test-Side Patch

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m3-cp4c1-cb4/apply.txt

permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

concurrency:
  group: m3-cp4c1-cb4-apply
  cancel-in-progress: false

jobs:
  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m3-cp4c1-cb4-apply
      commit_run_file: false
    secrets: inherit

  apply:
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1P_Vel2s9dTEKv0744cwMAArlz5fjL3ha
      patch_sha256: c0cc39370bf65df68f73fccc6e850737a4bc7572174ce0772df2ccbbe76be5e8
      base_sha: 2a3ecde39518d0b8fa822209d4cbf03a0689153b
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: 'test: correct CP4c-1 terminal-event witness contract'
      retention_days: 14
    secrets: inherit
