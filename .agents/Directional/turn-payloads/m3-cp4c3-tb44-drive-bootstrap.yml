name: M3 CP4c3 TB44 Drive Bootstrap Cleanup

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m3-cp4c3-tb44-drive-bootstrap-20260908.txt

permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

concurrency:
  group: m3-cp4c3-tb44-drive-bootstrap
  cancel-in-progress: false

jobs:
  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m3-cp4c3-tb44-drive-bootstrap-cleanup
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - name: Initialize diagnostic log
        shell: bash
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/tb44-drive-bootstrap-cleanup.log"
          : > "$log"
          printf '%s\n' \
            "workflow=${GITHUB_WORKFLOW}" \
            "run_id=${GITHUB_RUN_ID}" \
            "event=${GITHUB_EVENT_NAME}" \
            "event_sha=${GITHUB_SHA}" \
            "runtimeExecution=false" \
            "started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" | tee -a "$log"

      - name: Authenticate to Google Drive
        id: auth
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ secrets.GOOGLE_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GOOGLE_PROVIDER }}
          service_account: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/drive
          create_credentials_file: false

      - name: Delete service-account bootstrap staging file
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          FILE_ID: 1xoANjd-JPvwFN48tME7uOJcLOfeqGYlt
        shell: bash
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/tb44-drive-bootstrap-cleanup.log"
          exec > >(tee -a "$log") 2>&1
          code="$(curl --silent --show-error --location \
            --output "${RUNNER_TEMP}/delete-response.txt" \
            --write-out '%{http_code}' \
            --request DELETE \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            "https://www.googleapis.com/drive/v3/files/${FILE_ID}?supportsAllDrives=true")"
          echo "delete_http_status=${code}"
          test "$code" = "204"
          echo "service_account_staging_file_deleted=yes"

      - name: Write cleanup result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP}/tb44-drive-bootstrap-cleanup-result"
          mkdir -p "$out"
          printf '%s\n' \
            "event_sha=${GITHUB_SHA}" \
            "file_id=1xoANjd-JPvwFN48tME7uOJcLOfeqGYlt" \
            "runtimeExecution=false" \
            "job_status=${{ job.status }}" \
            "finished_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" > "${out}/result.env"
          cat "${out}/result.env" | tee -a "${RUNNER_TEMP}/tb44-drive-bootstrap-cleanup.log"

      - name: Upload cleanup result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-cp4c3-tb44-drive-bootstrap-cleanup-result-${{ github.run_id }}
          path: ${{ runner.temp }}/tb44-drive-bootstrap-cleanup-result
          if-no-files-found: error
          retention-days: 7

      - name: Upload diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-cp4c3-tb44-drive-bootstrap-cleanup-log-${{ github.run_id }}
          path: ${{ runner.temp }}/tb44-drive-bootstrap-cleanup.log
          if-no-files-found: error
          retention-days: 7
