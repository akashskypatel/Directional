name: M3 CP4c3 TB44 Artifact-Only EXEC

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m3-cp4c3-tb44-exec-20260908.txt

permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: m3-cp4c3-tb44-exec
  cancel-in-progress: false

jobs:
  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m3-cp4c3-tb44-exec
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  execute:
    runs-on: ubuntu-24.04
    steps:
      - name: Initialize persistent activity log
        shell: bash
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/m3-cp4c3-tb44-exec-workflow.log"
          : > "$log"
          {
            echo "workflow=${GITHUB_WORKFLOW}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "event=${GITHUB_EVENT_NAME}"
            echo "event_sha=${GITHUB_SHA}"
            echo "ref=${GITHUB_REF}"
            echo "repository=${GITHUB_REPOSITORY}"
            echo "turn=M3-CP4c-3-TB44-EXEC"
            echo "turnBoundary=Test+Benchmark-artifact-only"
            echo "immutable_artifact_id=10081938891"
            echo "immutable_source_sha=cf969597bda5c49e734b98db0c0165b421c4ee12"
            echo "benchmarkExecution=false"
            echo "outerGateTimeout=false"
            echo "started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } | tee -a "$log"

      - name: Checkout exact control source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          token: ${{ secrets.GH_TOKEN || github.token }}

      - name: Verify frozen execution authority
        shell: bash
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/m3-cp4c3-tb44-exec-workflow.log"
          exec > >(tee -a "$log") 2>&1
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain=v1)"
          harness='.agents/Directional/tools/m3_cp4c3_artifact_only_harness.sh'
          selector='.agents/Directional/Architecture_M3_CP4c3_Required_Green_Selector_409.txt'
          test -f "$harness"
          test -f "$selector"
          harness_sha="$(sha256sum "$harness" | awk '{print $1}')"
          selector_sha="$(sha256sum "$selector" | awk '{print $1}')"
          selector_count="$(grep -cve '^[[:space:]]*$' "$selector")"
          echo "harness_sha256=$harness_sha"
          echo "selector_sha256=$selector_sha"
          echo "selector_count=$selector_count"
          test "$harness_sha" = 'aaadab351c0ba28a39c87aff1948f83ab0c4c71520662177e5cdf6fd08b30ed3'
          test "$selector_sha" = 'eea6d8c2bbc8e9247deb4bfbbe6763042c76002d1894dd62e35f80262403b53e'
          test "$selector_count" -eq 409
          timeout --version | head -n 1
          unzip -v | head -n 2
          /usr/bin/time --version | head -n 1

      - name: Execute frozen selector409 harness
        id: gate
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
          TURN_ID: M3-CP4c-3-TB44-EXEC
          ARTIFACT_ID: "10081938891"
          EXPECTED_ARTIFACT_NAME: m3-cp4c3-cb49-result-34292599472
          EXPECTED_PROVIDER_DIGEST: sha256:285ee15784ea29468c367fa9e4778fd835f1e9582370fdcb26a5050a15c4d617
          EXPECTED_ZIP_SHA256: '285ee15784ea29468c367fa9e4778fd835f1e9582370fdcb26a5050a15c4d617'
          EXPECTED_SOURCE_SHA: cf969597bda5c49e734b98db0c0165b421c4ee12
          SELECTOR_RELATIVE_PATH: .agents/Directional/Architecture_M3_CP4c3_Required_Green_Selector_409.txt
          EXPECTED_SELECTOR_COUNT: "409"
          EXPECTED_SELECTOR_SHA256: 'eea6d8c2bbc8e9247deb4bfbbe6763042c76002d1894dd62e35f80262403b53e'
          ACCEPTED_PREFIX_COUNT: "365"
        shell: bash
        run: |
          set -uo pipefail
          workflow_log="${RUNNER_TEMP}/m3-cp4c3-tb44-exec-workflow.log"
          echo "gate_command=frozen-harness --execute" | tee -a "$workflow_log"
          echo "per_identity_timeout=timeout -k 5s 180s" | tee -a "$workflow_log"
          echo "outer_gate_timeout=none" | tee -a "$workflow_log"
          set +e
          bash .agents/Directional/tools/m3_cp4c3_artifact_only_harness.sh --execute
          rc=$?
          set -e
          echo "gate_exit=$rc" | tee -a "$workflow_log"
          echo "gate_exit=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Record required plan receipts
        if: always()
        shell: bash
        env:
          GATE_EXIT: ${{ steps.gate.outputs.gate_exit }}
        run: |
          set -uo pipefail
          workflow_log="${RUNNER_TEMP}/m3-cp4c3-tb44-exec-workflow.log"
          result="${RUNNER_TEMP}/M3-CP4c-3-TB44-EXEC-result"
          package="${RUNNER_TEMP}/M3-CP4c-3-TB44-EXEC/package"
          receipts="${RUNNER_TEMP}/m3-cp4c3-tb44-plan-receipts.txt"
          : > "$receipts"
          {
            echo "gate_exit=${GATE_EXIT:-missing}"
            echo "frozen_package_source_archive_sha256=7dead808562e8faf0a90e242532e2965bc9260f24505958eb5f242c19b1273ca"
            echo "source_archive_check_basis=exact-provider-zip-plus-verified-root-SHA256SUMS"
            if [[ -f "$package/source/source-cf969597bda5c49e734b98db0c0165b421c4ee12.tar.gz" ]]; then
              actual_source_archive_sha="$(sha256sum "$package/source/source-cf969597bda5c49e734b98db0c0165b421c4ee12.tar.gz" | awk '{print $1}')"
              echo "actual_source_archive_sha256=$actual_source_archive_sha"
              [[ "$actual_source_archive_sha" == '7dead808562e8faf0a90e242532e2965bc9260f24505958eb5f242c19b1273ca' ]] || echo "plan_receipt_error=source_archive_digest_mismatch"
            else
              echo "actual_source_archive_sha256=unavailable"
            fi
            if [[ -f "$result/execution-boundary.txt" ]]; then cat "$result/execution-boundary.txt"; fi
            if [[ -f "$result/semantic-summary.txt" ]]; then cat "$result/semantic-summary.txt"; fi
            echo "recorded_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } | tee "$receipts" -a "$workflow_log"
          if grep -q '^plan_receipt_error=' "$receipts"; then exit 91; fi

      - name: Upload artifact-only result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-cp4c3-tb44-result-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/M3-CP4c-3-TB44-EXEC-result
            ${{ runner.temp }}/m3-cp4c3-tb44-plan-receipts.txt
          if-no-files-found: error
          retention-days: 7

      - name: Upload persistent activity log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-cp4c3-tb44-log-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/m3-cp4c3-tb44-exec-workflow.log
            ${{ runner.temp }}/M3-CP4c-3-TB44-EXEC.log
          if-no-files-found: error
          retention-days: 7

      - name: Propagate artifact-only execution status
        if: always()
        shell: bash
        env:
          GATE_EXIT: ${{ steps.gate.outputs.gate_exit }}
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/m3-cp4c3-tb44-exec-workflow.log"
          rc="${GATE_EXIT:-}"
          test -n "$rc" || { echo 'gate_status=missing' | tee -a "$log"; exit 92; }
          echo "gate_status=$rc" | tee -a "$log"
          exit "$rc"

      - name: Record final source status
        if: always()
        shell: bash
        run: |
          set +e
          log="${RUNNER_TEMP}/m3-cp4c3-tb44-exec-workflow.log"
          {
            echo "final_job_status=${{ job.status }}"
            echo "final_control_sha=$(git rev-parse HEAD 2>/dev/null || echo unavailable)"
            git status --short 2>&1 || true
            echo "finished_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } | tee -a "$log"
