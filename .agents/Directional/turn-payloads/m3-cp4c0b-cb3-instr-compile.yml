name: Agent M3 CP4c0b CB3 Instrumentation Compile

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m3-cp4c0b-cb3-instr-compile/run.txt

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: write

concurrency:
  group: agent-m3-cp4c0b-cb3-instr-compile-${{ github.ref }}
  cancel-in-progress: false

jobs:
  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m3-cp4c0b-cb3-instr-compile
      commit_run_file: false
    secrets: inherit

  preflight-owner-target:
    uses: ./.github/workflows/agent-compile-reusable.yml
    with:
      source_sha: 93059089881c8715a168a61968a8d6874ee1a670
      targets: directional_surface_cell_producer_tests
      artifact_prefix: m3-cp4c0b-cb3-instr-preflight
    secrets: inherit

  package-eight-targets:
    needs: preflight-owner-target
    uses: ./.github/workflows/agent-compile-reusable.yml
    with:
      source_sha: 93059089881c8715a168a61968a8d6874ee1a670
      targets: directional_core directional_pipeline directional_surface_cell_authority_kernel_tests directional_surface_cell_producer_tests directional_surface_cell_completion_tests directional_surface_cell_validation_tests directional_compiled_api_tests directional_benchmarks
      artifact_prefix: m3-cp4c0b-cb3-instr-package
    secrets: inherit
