name: M3 CP4c3 CB12 Package 80

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m3-cp4c3-cb12-package80.txt

permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: m3-cp4c3-cb12-package80
  cancel-in-progress: false

jobs:
  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m3-cp4c3-cb12-package80
      commit_run_file: false
      trim_stale_comments: false
    secrets: inherit

  package:
    runs-on: ubuntu-24.04
    steps:
      - name: Initialize persistent activity log
        shell: bash
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/m3-cp4c3-cb12-package80.log"
          : > "$log"
          {
            echo "workflow=${GITHUB_WORKFLOW}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "event=${GITHUB_EVENT_NAME}"
            echo "event_sha=${GITHUB_SHA}"
            echo "source_sha=a3b6f1a41feaa8a115faf11de52f85ce4cc42a15"
            echo "compile_artifact_id=9828721201"
            echo "runtimeExecution=false"
            echo "started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } | tee -a "$log"

      - name: Download and verify exact compile artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/m3-cp4c3-cb12-package80.log"
          exec > >(tee -a "$log") 2>&1
          work="${RUNNER_TEMP}/m3-cp4c3-cb12-package80"
          mkdir -p "$work/raw"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/9828721201/zip" > "$work/raw.zip"
          echo "53b40433f2b63c551d07ee5fdf7dd9a67c278825b7c3f8b2a1aa0ca1b9194155  $work/raw.zip" | sha256sum -c -
          unzip -q "$work/raw.zip" -d "$work/raw"
          test "$(cat "$work/raw/metadata/source-commit.txt")" = "a3b6f1a41feaa8a115faf11de52f85ce4cc42a15"
          grep -qx 'runtimeExecution=false' "$work/raw/metadata/command-boundary.txt"
          grep -qx 'exactArithmeticBackend=GMP' "$work/raw/metadata/command-boundary.txt"
          grep -q 'libgmpxx.so' "$work/raw/metadata/gmp-evidence.txt"
          grep -q 'libgmp.so' "$work/raw/metadata/gmp-evidence.txt"
          test "$(cat "$work/raw/metadata/preflight-exit-code.txt")" = 0
          test "$(cat "$work/raw/metadata/build-exit-code.txt")" = 0
          test ! -s "$work/raw/metadata/source-status-final.txt"
          (cd "$work/raw" && sha256sum -c SHA256SUMS)

      - name: Build and verify mode-preserving package 80
        shell: bash
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/m3-cp4c3-cb12-package80.log"
          exec > >(tee -a "$log") 2>&1
          work="${RUNNER_TEMP}/m3-cp4c3-cb12-package80"
          pkg="$work/package80"
          mkdir -p "$pkg" "$work/source-tree" "$pkg/test-data/benchmarks"
          cp -a "$work/raw/bin" "$work/raw/lib" "$work/raw/metadata" "$work/raw/source" "$pkg/"
          source_archive="$(find "$work/raw/source" -maxdepth 1 -type f -name 'source-*.tar.gz' -print -quit)"
          test -n "$source_archive"
          tar -xzf "$source_archive" -C "$work/source-tree" \
            benchmarks/fixtures \
            .agents/Directional/Architecture_M3_CP4c3_Required_Green_Selector_373.txt \
            .agents/Directional/Architecture_M3_CP4c3_Required_Green_Selector_374.txt \
            .agents/Directional/Architecture_M3_CP4c3_Required_Green_Selector_375.txt \
            .agents/Directional/Architecture_M3_CP4c3_Required_Green_Selector_376.txt \
            .agents/Directional/Architecture_M3_CP4c3_Required_Green_Selector_377.txt
          echo "b47c269851fad1384b5dc9baaf674b3d4ad80ec6c2b40f7f8eda2055c6f44834  $work/source-tree/.agents/Directional/Architecture_M3_CP4c3_Required_Green_Selector_373.txt" | sha256sum -c -
          echo "d496ce96b3776269cda8086a0a2173ce9a1f9967d81b2a80866266155c503c4f  $work/source-tree/.agents/Directional/Architecture_M3_CP4c3_Required_Green_Selector_374.txt" | sha256sum -c -
          echo "aa7b22bb265f321fad6f85128e572e0251dc5f60d68856ca7ec4323006a8f3a0  $work/source-tree/.agents/Directional/Architecture_M3_CP4c3_Required_Green_Selector_375.txt" | sha256sum -c -
          echo "6ab2d9fad0327e00bb2f782741afffe8a0ae08c08df8adbdf9accc6234bfa5e8  $work/source-tree/.agents/Directional/Architecture_M3_CP4c3_Required_Green_Selector_376.txt" | sha256sum -c -
          echo "7255ac86e525e245c0c24231b70c9494349a4c1cc1dfcfeee9817cc6426cbec1  $work/source-tree/.agents/Directional/Architecture_M3_CP4c3_Required_Green_Selector_377.txt" | sha256sum -c -
          for n in 373 374 375 376 377; do
            test "$(wc -l < "$work/source-tree/.agents/Directional/Architecture_M3_CP4c3_Required_Green_Selector_${n}.txt" | tr -d ' ')" = "$n"
          done
          cmp -s "$work/source-tree/.agents/Directional/Architecture_M3_CP4c3_Required_Green_Selector_373.txt" <(head -n 373 "$work/source-tree/.agents/Directional/Architecture_M3_CP4c3_Required_Green_Selector_374.txt")
          cmp -s "$work/source-tree/.agents/Directional/Architecture_M3_CP4c3_Required_Green_Selector_374.txt" <(head -n 374 "$work/source-tree/.agents/Directional/Architecture_M3_CP4c3_Required_Green_Selector_375.txt")
          cmp -s "$work/source-tree/.agents/Directional/Architecture_M3_CP4c3_Required_Green_Selector_375.txt" <(head -n 375 "$work/source-tree/.agents/Directional/Architecture_M3_CP4c3_Required_Green_Selector_376.txt")
          cmp -s "$work/source-tree/.agents/Directional/Architecture_M3_CP4c3_Required_Green_Selector_376.txt" <(head -n 376 "$work/source-tree/.agents/Directional/Architecture_M3_CP4c3_Required_Green_Selector_377.txt")
          cp -a "$work/source-tree/benchmarks/fixtures" "$pkg/test-data/benchmarks/"
          fixture_count="$(find "$pkg/test-data/benchmarks/fixtures" -type f | wc -l | tr -d ' ')"
          test "$fixture_count" = 27
          cat > "$pkg/metadata/fixture-package-contract.txt" <<'META'
          package=80
          source_commit=a3b6f1a41feaa8a115faf11de52f85ce4cc42a15
          fixture_count=27
          fixture_authority=package-relative
          selector=377
          selector_sha256=7255ac86e525e245c0c24231b70c9494349a4c1cc1dfcfeee9817cc6426cbec1
          frozen_selector_374_sha256=d496ce96b3776269cda8086a0a2173ce9a1f9967d81b2a80866266155c503c4f
          frozen_selector_375_sha256=aa7b22bb265f321fad6f85128e572e0251dc5f60d68856ca7ec4323006a8f3a0
          frozen_selector_376_sha256=6ab2d9fad0327e00bb2f782741afffe8a0ae08c08df8adbdf9accc6234bfa5e8
          regression_identity_377=ResolvedBranchCorrection.BarrierAbsorbedMechanicalTerminationUsesNetworkNodeWithoutPort
          runtimeExecution=false
          packageRepair=false
          META
          cat > "$pkg/metadata/package-envelope.txt" <<'META'
          runtimeExecution=false
          turnBoundary=Code+Build-only
          exactArithmeticBackend=GMP
          modePreservingEnvelope=true
          semanticContracts=compiled-not-executed
          META
          rm -f "$pkg/SHA256SUMS"
          (cd "$pkg" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          (cd "$pkg" && sha256sum -c SHA256SUMS)
          for exe in "$pkg"/bin/directional_*; do test -x "$exe"; done
          test "$(find "$pkg/bin" -maxdepth 1 -type f -name 'directional_*' | wc -l | tr -d ' ')" = 6
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner -czf "$work/package80.tar.gz" -C "$work" package80
          sha256sum "$work/package80.tar.gz" > "$work/package80.sha256"
          sha256sum "$source_archive" > "$work/source-archive.sha256"
          cat > "$work/package80-boundary.txt" <<'META'
          runtimeExecution=false
          packageRepair=false
          No Directional binary was executed while packaging.
          META
          mkdir -p "$work/verify"
          tar -xzf "$work/package80.tar.gz" -C "$work/verify"
          (cd "$work/verify/package80" && sha256sum -c SHA256SUMS)
          for exe in "$work/verify/package80"/bin/directional_*; do test -x "$exe"; done
          echo "fixture_count=$fixture_count"
          cat "$work/package80.sha256"
          cat "$work/source-archive.sha256"

      - name: Upload package 80
        uses: actions/upload-artifact@v4
        with:
          name: m3-cp4c3-package80-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/m3-cp4c3-cb12-package80/package80.tar.gz
            ${{ runner.temp }}/m3-cp4c3-cb12-package80/package80.sha256
            ${{ runner.temp }}/m3-cp4c3-cb12-package80/source-archive.sha256
            ${{ runner.temp }}/m3-cp4c3-cb12-package80/package80-boundary.txt
          if-no-files-found: error
          retention-days: 14

      - name: Upload persistent activity log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-cp4c3-package80-log-${{ github.run_id }}
          path: ${{ runner.temp }}/m3-cp4c3-cb12-package80.log
          if-no-files-found: error
          retention-days: 14
