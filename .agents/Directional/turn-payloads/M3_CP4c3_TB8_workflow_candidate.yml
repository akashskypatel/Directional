name: M3 CP4c3 TB8 Artifact Only

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m3-cp4c3-tb8.txt

permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: m3-cp4c3-tb8-artifact-only
  cancel-in-progress: false

jobs:
  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m3-cp4c3-tb8
      commit_run_file: false
    secrets: inherit

  validate-caller:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/m3-cp4c3-tb8-20260901.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  tb8:
    needs: validate-caller
    if: ${{ needs.validate-caller.outputs.valid == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Initialize persistent TB8 log
        shell: bash
        run: |
          set -euo pipefail
          work="${RUNNER_TEMP}/m3-cp4c3-tb8"
          mkdir -p "$work/result"
          log="$work/tb8.log"
          : > "$log"
          {
            echo "workflow=${GITHUB_WORKFLOW}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "event=${GITHUB_EVENT_NAME}"
            echo "event_sha=${GITHUB_SHA}"
            echo "control_checkout_only=true"
            echo "semantic_source=e2b59295c9920db5685239c2da188858839fa94f"
            echo "package=78"
            echo "package_artifact_id=9819958467"
            echo "gate_selector=374"
            echo "diagnostic_selector=375"
            echo "benchmarkExecution=false"
            echo "configureExecution=false"
            echo "compileExecution=false"
            echo "relinkExecution=false"
            echo "packageRepair=false"
            echo "generatedDiscovery=false"
            echo "started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            uname -a
          } | tee -a "$log"

      - name: Checkout exact control scripts only
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Immutable package 78 preflight
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: bash .agents/Directional/turn-payloads/m3cp4c3-tb8-preflight.sh

      - name: Run ordered gate, zero-credit remainder, and diagnostic 375
        shell: bash
        run: bash .agents/Directional/turn-payloads/m3cp4c3-tb8-runtime.sh

      - name: Immutable postflight
        shell: bash
        run: bash .agents/Directional/turn-payloads/m3cp4c3-tb8-postflight.sh

      - name: Upload TB8 result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-cp4c3-tb8-result-${{ github.run_id }}
          path: ${{ runner.temp }}/m3-cp4c3-tb8/result
          if-no-files-found: error
          retention-days: 14

      - name: Upload persistent TB8 log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-cp4c3-tb8-log-${{ github.run_id }}
          path: ${{ runner.temp }}/m3-cp4c3-tb8/tb8.log
          if-no-files-found: error
          retention-days: 14
