name: M4 CP SCALE CB20 Docs Apply

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m4-cp-scale-cb20-docs-apply-20260918.txt

permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

concurrency:
  group: m4-cp-scale-cb20-docs-apply
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/m4-cp-scale-cb20-docs-apply.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m4-cp-scale-cb20-docs-apply
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  apply:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1188tjk6BwN7G5y2nk1OJIlBoWK-8ngqv
      patch_sha256: fcfa8d26472fdb2d2b62f5a67501f2caab4859a08f8a754f9db03336a4df9ab6
      base_sha: 081f5a17795bbe5533ebecffcf22ff2a7a20e2a5
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: "docs: close M4 CP SCALE CB20 and plan R7"
      retention_days: 14
    secrets: inherit
