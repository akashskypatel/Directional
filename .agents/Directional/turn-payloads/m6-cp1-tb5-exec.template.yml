name: M6 CP1 TB5 Artifact-Only Test Benchmark

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m6-cp1-tb5-exec/trigger.txt

permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: m6-cp1-tb5-exec-${{ github.ref }}
  cancel-in-progress: false

jobs:
  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m6-cp1-tb5-exec
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/m6-cp1-tb5-exec.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  execute:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    runs-on: ubuntu-24.04
    env:
      TURN_ID: M6-CP1-TB5-EXEC
      ARTIFACT_ID: '10879581622'
      EXPECTED_ARTIFACT_NAME: m6-cp1-cb5-result-36168827294
      EXPECTED_ZIP_SHA256: @@SHA256:candidate_zip@@
      EXPECTED_ROOT_MANIFEST_SHA256: @@SHA256:root_manifest@@
      EXPECTED_SOURCE_SHA: 82b86a285292379cfd92cdc4e10d74181b38f1e8
      EXPECTED_SOURCE_ARCHIVE_SHA256: @@SHA256:source_archive@@
      SELECTOR_RELATIVE_PATH: .agents/Directional/Architecture_M5_CP4_CB2_Required_Green_Selector_449.txt
      ROUTING_RELATIVE_PATH: .agents/Directional/Architecture_M5_CP4_CB2_Selector_449_Static_Routing_Receipt.tsv
      EXPECTED_SELECTOR_SHA256: @@SHA256:selector@@
      EXPECTED_ROUTING_SHA256: @@SHA256:routing@@
      EXPECTED_SELECTOR_COUNT: '449'
      EXPECTED_FOCUSED_COUNT: '7'
      EXPECTED_TOTAL_COUNT: '456'
    steps:
      - name: Initialize diagnostic log
        shell: bash
        run: |
          set -euo pipefail
          LOG="${RUNNER_TEMP}/${TURN_ID}.log"
          : > "$LOG"
          {
            echo "turn_id=${TURN_ID}"
            echo "workflow=${GITHUB_WORKFLOW}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "event=${GITHUB_EVENT_NAME}"
            echo "event_sha=${GITHUB_SHA}"
            echo "ref=${GITHUB_REF}"
            echo "repository=${GITHUB_REPOSITORY}"
            echo "runner_os=${RUNNER_OS}"
            echo "started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } | tee -a "$LOG"

      - name: Execute immutable artifact-only gate
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
        run: |
          set -euo pipefail
          LOG="${RUNNER_TEMP}/${TURN_ID}.log"
          exec > >(tee -a "$LOG") 2>&1

          ROOT="${RUNNER_TEMP}/${TURN_ID}"
          ZIP="${ROOT}/candidate-${ARTIFACT_ID}.zip"
          PKG="${ROOT}/package"
          SOURCE="${ROOT}/source"
          EXEC_VIEW="${ROOT}/execution-view"
          RUNTIME="${ROOT}/runtime"
          RESULT="${RUNNER_TEMP}/${TURN_ID}-result"
          mkdir -p "$PKG" "$SOURCE" "$EXEC_VIEW/bin" "$RUNTIME" \
            "$RESULT/raw/focused" "$RESULT/raw/selector" \
            "$RESULT/resources/focused" "$RESULT/resources/selector"

          runtime_started=false
          runtime_completed=false
          preflight_completed=false
          orchestration_failure=false
          selection_integrity=true
          benchmark_execution=false
          configure_execution=false
          compile_execution=false
          relink_execution=false
          generated_discovery=false
          package_repair=false
          mode_repair=false
          source_test_fixture_selector_mutation=false
          retry_after_runtime_start=false
          focused_executed=0
          selector_executed=0
          benchmark_process_count=0

          sha_file() { sha256sum "$1" | awk '{print $1}'; }
          fail_orchestration() {
            orchestration_failure=true
            echo "ORCHESTRATION_FAILURE: $*" >&2
            write_boundary
            exit 90
          }
          census_tree() {
            local root="$1" out="$2"
            python3 - "$root" "$out" <<'PY'
          import hashlib, os, pathlib, stat, sys
          root = pathlib.Path(sys.argv[1]).resolve()
          out = pathlib.Path(sys.argv[2])
          rows=[]
          for p in [root, *sorted(root.rglob('*'), key=lambda x: x.relative_to(root).as_posix())]:
              rel='.' if p == root else p.relative_to(root).as_posix()
              st=p.lstat(); mode=format(stat.S_IMODE(st.st_mode),'o')
              if stat.S_ISREG(st.st_mode):
                  h=hashlib.sha256()
                  with p.open('rb') as f:
                      for chunk in iter(lambda:f.read(1024*1024), b''): h.update(chunk)
                  kind,digest,target='file',h.hexdigest(),'-'
              elif stat.S_ISDIR(st.st_mode): kind,digest,target='directory','-','-'
              elif stat.S_ISLNK(st.st_mode): kind,digest,target='symlink','-',os.readlink(p)
              else: kind,digest,target='other','-','-'
              rows.append(f'{rel}\t{kind}\t{mode}\t{st.st_size}\t{digest}\t{target}\n')
          out.write_text(''.join(rows))
          PY
          }
          write_boundary() {
            cat > "${RESULT}/execution-boundary.txt" <<EOF
          turn_id=${TURN_ID}
          runtime_started=${runtime_started}
          runtime_completed=${runtime_completed}
          preflight_completed=${preflight_completed}
          orchestration_failure=${orchestration_failure}
          selection_integrity=${selection_integrity}
          focused_executed=${focused_executed}
          selector_executed=${selector_executed}
          total_executed=$((focused_executed + selector_executed))
          benchmark_process_count=${benchmark_process_count}
          benchmark_execution=${benchmark_execution}
          configure_execution=${configure_execution}
          compile_execution=${compile_execution}
          relink_execution=${relink_execution}
          generated_discovery=${generated_discovery}
          package_repair=${package_repair}
          mode_repair=${mode_repair}
          source_test_fixture_selector_mutation=${source_test_fixture_selector_mutation}
          retry_after_runtime_start=${retry_after_runtime_start}
          watchdog_enabled=false
          EOF
          }
          unexpected_exit() {
            local status=$?
            trap - EXIT
            if [[ "$status" -ne 0 && "$orchestration_failure" != true ]]; then
              orchestration_failure=true
              echo "ORCHESTRATION_FAILURE: unexpected shell exit status=${status}" >&2
              write_boundary || true
            fi
            exit "$status"
          }
          trap unexpected_exit EXIT

          echo "artifact_id=${ARTIFACT_ID}" | tee "${RESULT}/environment.txt"
          echo "expected_source_sha=${EXPECTED_SOURCE_SHA}" | tee -a "${RESULT}/environment.txt"
          echo "runner=$(uname -a)" | tee -a "${RESULT}/environment.txt"
          echo "python=$(python3 --version 2>&1)" | tee -a "${RESULT}/environment.txt"

          artifact_json="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}")"
          provider_digest="$(printf '%s' "$artifact_json" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("digest", ""))')"
          artifact_name="$(printf '%s' "$artifact_json" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("name", ""))')"
          [[ "$provider_digest" == "sha256:${EXPECTED_ZIP_SHA256}" ]] || fail_orchestration "provider digest mismatch: $provider_digest"
          [[ "$artifact_name" == "$EXPECTED_ARTIFACT_NAME" ]] || fail_orchestration "artifact name mismatch: $artifact_name"
          curl -L --fail --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" -o "$ZIP"
          [[ "$(sha_file "$ZIP")" == "$EXPECTED_ZIP_SHA256" ]] || fail_orchestration 'downloaded candidate ZIP digest mismatch'
          printf 'artifact_id=%s\nartifact_name=%s\nprovider_digest=%s\ndownloaded_zip_sha256=%s\n' \
            "$ARTIFACT_ID" "$artifact_name" "$provider_digest" "$(sha_file "$ZIP")" > "${RESULT}/artifact-authority.txt"

          # Ordinary unzip is mandatory here because it preserves archived executable mode bits.
          unzip -q "$ZIP" -d "$PKG"
          [[ -f "$PKG/SHA256SUMS" ]] || fail_orchestration 'candidate root SHA256SUMS absent'
          [[ "$(sha_file "$PKG/SHA256SUMS")" == "$EXPECTED_ROOT_MANIFEST_SHA256" ]] || fail_orchestration 'root manifest digest mismatch'
          (cd "$PKG" && sha256sum -c SHA256SUMS) | tee "${RESULT}/manifest-before.txt"
          [[ "$(grep -c ': OK$' "${RESULT}/manifest-before.txt")" -eq 28 ]] || fail_orchestration 'root manifest did not verify 28/28'
          [[ "$(cat "$PKG/metadata/source-commit.txt")" == "$EXPECTED_SOURCE_SHA" ]] || fail_orchestration 'candidate source commit mismatch'
          [[ "$(cat "$PKG/metadata/build-exit-code.txt")" == '0' ]] || fail_orchestration 'candidate build exit nonzero'
          [[ "$(cat "$PKG/metadata/preflight-exit-code.txt")" == '0' ]] || fail_orchestration 'candidate preflight exit nonzero'
          for receipt in "$PKG"/metadata/source-status-*.txt; do [[ ! -s "$receipt" ]] || fail_orchestration "dirty source receipt: $(basename "$receipt")"; done
          for token in 'runtimeExecution=false' 'turnBoundary=Code+Build-only' 'exactArithmeticBackend=GMP' 'preflightCompile=true'; do
            grep -Fxq "$token" "$PKG/metadata/command-boundary.txt" || fail_orchestration "missing command boundary token: $token"
          done
          grep -Fq 'DIRECTIONAL_ENABLE_GMP:BOOL=ON' "$PKG/metadata/CMakeCache.txt" || fail_orchestration 'GMP CMake option missing'
          grep -Fq 'libgmpxx.so' "$PKG/metadata/gmp-evidence.txt" || fail_orchestration 'GMPXX link evidence missing'
          grep -Fq 'libgmp.so' "$PKG/metadata/gmp-evidence.txt" || fail_orchestration 'GMP link evidence missing'

          source_archive="$PKG/source/source-${EXPECTED_SOURCE_SHA}.tar.gz"
          [[ -f "$source_archive" ]] || fail_orchestration 'packaged source archive absent'
          [[ "$(sha_file "$source_archive")" == "$EXPECTED_SOURCE_ARCHIVE_SHA256" ]] || fail_orchestration 'source archive digest mismatch'
          tar -xzf "$source_archive" -C "$SOURCE"
          selector="$SOURCE/$SELECTOR_RELATIVE_PATH"
          routing="$SOURCE/$ROUTING_RELATIVE_PATH"
          [[ -f "$selector" && -f "$routing" ]] || fail_orchestration 'selector or routing receipt absent from packaged source'
          [[ "$(wc -l < "$selector" | tr -d ' ')" -eq "$EXPECTED_SELECTOR_COUNT" ]] || fail_orchestration 'selector row count mismatch'
          [[ "$(wc -l < "$routing" | tr -d ' ')" -eq "$EXPECTED_SELECTOR_COUNT" ]] || fail_orchestration 'routing row count mismatch'
          [[ "$(sha_file "$selector")" == "$EXPECTED_SELECTOR_SHA256" ]] || fail_orchestration 'selector digest mismatch'
          [[ "$(sha_file "$routing")" == "$EXPECTED_ROUTING_SHA256" ]] || fail_orchestration 'routing digest mismatch'
          python3 - "$selector" "$routing" "${RESULT}/routing-summary.txt" <<'PY'
          import collections, pathlib, sys
          selector=[x for x in pathlib.Path(sys.argv[1]).read_text().splitlines() if x]
          rows=[]
          for line in pathlib.Path(sys.argv[2]).read_text().splitlines():
              o,i,b=line.split('\t')
              rows.append((int(o),i,b))
          if len(selector)!=449 or len(rows)!=449: raise SystemExit('449-row authority mismatch')
          if [o for o,_,_ in rows] != list(range(1,450)): raise SystemExit('routing ordinals drifted')
          if [i for _,i,_ in rows] != selector: raise SystemExit('selector/routing identity mismatch')
          counts=collections.Counter(b for _,_,b in rows)
          expected={
              'directional_surface_cell_authority_kernel_tests':32,
              'directional_surface_cell_producer_tests':301,
              'directional_surface_cell_completion_tests':75,
              'directional_surface_cell_validation_tests':41,
          }
          if counts != expected: raise SystemExit(f'owner census drifted: {counts}')
          pathlib.Path(sys.argv[3]).write_text('\n'.join(f'{k}={expected[k]}' for k in sorted(expected))+'\n')
          PY

          required_executables=(
            directional_surface_cell_authority_kernel_tests
            directional_surface_cell_producer_tests
            directional_surface_cell_completion_tests
            directional_surface_cell_validation_tests
          )
          printf 'binary\tsha256\tmode\tsize\n' > "${RESULT}/owner-executables.tsv"
          for exe in "${required_executables[@]}"; do
            p="$PKG/bin/$exe"
            [[ -f "$p" && -x "$p" ]] || fail_orchestration "required owner executable absent or non-executable: $exe"
            printf '%s\t%s\t%s\t%s\n' "$exe" "$(sha_file "$p")" "$(stat -c '%a' "$p")" "$(stat -c '%s' "$p")" >> "${RESULT}/owner-executables.tsv"
          done

          census_tree "$PKG" "${RESULT}/package-census-before.tsv"
          census_tree "$SOURCE" "${RESULT}/source-census-before.tsv"

          # Derived execution view only; immutable package/source remain untouched.
          cp -a "$PKG/bin/." "$EXEC_VIEW/bin/"
          mkdir -p "$EXEC_VIEW/test-data/benchmarks"
          cp -a "$SOURCE/benchmarks/fixtures" "$EXEC_VIEW/test-data/benchmarks/"
          for exe in "${required_executables[@]}"; do
            [[ "$(sha_file "$PKG/bin/$exe")" == "$(sha_file "$EXEC_VIEW/bin/$exe")" ]] || fail_orchestration "staged binary digest mismatch: $exe"
            [[ "$(stat -c '%a' "$PKG/bin/$exe")" == "$(stat -c '%a' "$EXEC_VIEW/bin/$exe")" ]] || fail_orchestration "staged binary mode mismatch: $exe"
          done
          probe="$(realpath -e "$EXEC_VIEW/bin/directional_surface_cell_producer_tests")"
          sibling_candidate="$(dirname "$(dirname "$probe")")/test-data"
          [[ -d "$sibling_candidate/benchmarks/fixtures" ]] || fail_orchestration 'consumer-resolvable sibling fixture root absent'
          [[ -f "$sibling_candidate/benchmarks/fixtures/milestone-g/mechanical_feature.obj" ]] || fail_orchestration 'known fixture absent from execution view'
          census_tree "$EXEC_VIEW" "${RESULT}/execution-view-before.tsv"
          preflight_completed=true

          focus=(
            'M6CP1.SurfaceOccurrenceComplexPublishesFourSemanticCornersPerCell'
            'M6CP1.SourceFaceRowPermutationPreservesOccurrenceIdentity'
            'M6CP1.SurfaceOccurrenceComplexRejectsMalformedMissingAndDuplicateRelationEndpoints'
            'M6CP1.CoincidentUnrelatedOccurrencesRemainDistinct'
            'SurfaceCellTransitionQuotient.MultiIsolationMaterializationRetainsAllLocalSheets'
            'M5CP3.ProducedTorusPeriodicPairStorageSwapPreservesSemanticDirection'
            'M6CP1.SeamEndpointOccurrencesPublishCompleteCornerWedgeSheetAuthority'
          )
          [[ "${#focus[@]}" -eq "$EXPECTED_FOCUSED_COUNT" ]] || fail_orchestration 'focused vector count mismatch'
          printf '%s\n' "${focus[@]}" > "${RESULT}/focused-identities.txt"

          run_identity() {
            local phase="$1" ordinal="$2" identity="$3" binary="$4" ledger="$5"
            local phase_dir="${phase,,}" stem="ordinal-$(printf '%03d' "$ordinal")"
            local raw="${RESULT}/raw/${phase_dir}/${stem}.log"
            local resource="${RESULT}/resources/${phase_dir}/${stem}.time.txt"
            local work="${RUNTIME}/${phase_dir}/${stem}"
            local code selected skipped result
            mkdir -p "$work"
            echo "${TURN_ID} phase=${phase} ordinal=${ordinal} identity=${identity} owner=${binary}"
            set +e
            (
              cd "$work"
              /usr/bin/time -v -o "$resource" env GTEST_FAIL_IF_NO_TEST_SELECTED=1 GTEST_COLOR=no \
                "$EXEC_VIEW/bin/$binary" --gtest_filter="$identity"
            ) >"$raw" 2>&1
            code=$?
            set -e
            cat "$raw"
            selected="$(grep -Ec '^\[ RUN      \] ' "$raw" || true)"
            skipped="$(grep -Ec '^\[  SKIPPED \] ' "$raw" || true)"
            if [[ "$selected" -ne 1 || "$skipped" -ne 0 ]]; then
              selection_integrity=false
              fail_orchestration "selection mismatch phase=$phase ordinal=$ordinal selected=$selected skipped=$skipped"
            fi
            result=RED
            [[ "$code" -eq 0 ]] && result=PASS
            printf '%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\n' \
              "$ordinal" "$identity" "$binary" "$code" "$selected" "$skipped" "$result" "raw/${phase_dir}/$(basename "$raw")" >> "$ledger"
          }

          focused_ledger="${RESULT}/focused-ledger.tsv"
          selector_ledger="${RESULT}/selector-ledger.tsv"
          printf 'ordinal\tidentity\tbinary\texit\tselected\tskipped\tresult\traw_log\n' > "$focused_ledger"
          printf 'ordinal\tidentity\tbinary\texit\tselected\tskipped\tresult\traw_log\n' > "$selector_ledger"

          runtime_started=true
          for idx in "${!focus[@]}"; do
            ordinal=$((idx+1))
            run_identity focused "$ordinal" "${focus[$idx]}" directional_surface_cell_producer_tests "$focused_ledger"
            focused_executed=$((focused_executed+1))
          done

          while IFS=$'\t' read -r ordinal identity binary; do
            [[ -n "$identity" ]] || continue
            run_identity selector "$ordinal" "$identity" "$binary" "$selector_ledger"
            selector_executed=$((selector_executed+1))
          done < "$routing"
          runtime_completed=true

          [[ "$focused_executed" -eq "$EXPECTED_FOCUSED_COUNT" ]] || fail_orchestration 'focused process count mismatch'
          [[ "$selector_executed" -eq "$EXPECTED_SELECTOR_COUNT" ]] || fail_orchestration 'selector process count mismatch'
          [[ "$((focused_executed + selector_executed))" -eq "$EXPECTED_TOTAL_COUNT" ]] || fail_orchestration 'total process count mismatch'

          python3 - "$focused_ledger" "$selector_ledger" "${RESULT}/semantic-summary.txt" <<'PY'
          import csv, pathlib, sys
          focused=list(csv.DictReader(open(sys.argv[1]), delimiter='\t'))
          selector=list(csv.DictReader(open(sys.argv[2]), delimiter='\t'))
          if len(focused)!=7 or [int(x['ordinal']) for x in focused] != list(range(1,8)): raise SystemExit('focused ledger shape invalid')
          if len(selector)!=449 or [int(x['ordinal']) for x in selector] != list(range(1,450)): raise SystemExit('selector ledger shape invalid')
          fp=[x for x in focused if x['result']=='PASS']; fr=[x for x in focused if x['result']!='PASS']
          sp=[x for x in selector if x['result']=='PASS']; sr=[x for x in selector if x['result']!='PASS']
          out=(
            f'focused_pass={len(fp)}/7\nfocused_red={len(fr)}\n'
            f'focused_red_ordinals={[int(x["ordinal"]) for x in fr]}\n'
            f'selector_pass={len(sp)}/449\nselector_red={len(sr)}\n'
            f'selector_red_ordinals={[int(x["ordinal"]) for x in sr]}\n'
            f'total_pass={len(fp)+len(sp)}/456\ntotal_red={len(fr)+len(sr)}\n'
          )
          pathlib.Path(sys.argv[3]).write_text(out)
          print(out, end='')
          PY

          census_tree "$PKG" "${RESULT}/package-census-after.tsv"
          census_tree "$SOURCE" "${RESULT}/source-census-after.tsv"
          census_tree "$EXEC_VIEW" "${RESULT}/execution-view-after.tsv"
          cmp -s "${RESULT}/package-census-before.tsv" "${RESULT}/package-census-after.tsv" || fail_orchestration 'immutable package byte/mode census changed'
          if ! cmp -s "${RESULT}/source-census-before.tsv" "${RESULT}/source-census-after.tsv"; then
            source_test_fixture_selector_mutation=true
            fail_orchestration 'immutable packaged source byte/mode census changed'
          fi
          cmp -s "${RESULT}/execution-view-before.tsv" "${RESULT}/execution-view-after.tsv" || fail_orchestration 'execution view byte/mode census changed'
          [[ "$(sha_file "$ZIP")" == "$EXPECTED_ZIP_SHA256" ]] || fail_orchestration 'candidate ZIP changed during runtime'
          [[ "$(sha_file "$source_archive")" == "$EXPECTED_SOURCE_ARCHIVE_SHA256" ]] || fail_orchestration 'source archive changed during runtime'
          [[ "$(sha_file "$selector")" == "$EXPECTED_SELECTOR_SHA256" ]] || fail_orchestration 'selector changed during runtime'
          [[ "$(sha_file "$routing")" == "$EXPECTED_ROUTING_SHA256" ]] || fail_orchestration 'routing changed during runtime'
          (cd "$PKG" && sha256sum -c SHA256SUMS) | tee "${RESULT}/manifest-after.txt"
          [[ "$(grep -c ': OK$' "${RESULT}/manifest-after.txt")" -eq 28 ]] || fail_orchestration 'postflight root manifest did not verify 28/28'
          printf 'package_census_equal=true\nsource_census_equal=true\nexecution_view_census_equal=true\n' > "${RESULT}/immutability.txt"

          write_boundary
          sha256sum "$focused_ledger" > "${RESULT}/focused-ledger.sha256"
          sha256sum "$selector_ledger" > "${RESULT}/selector-ledger.sha256"
          (
            cd "$RESULT"
            find . -type f ! -name SHA256SUMS -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > SHA256SUMS
          )
          evidence_count="$(wc -l < "${RESULT}/SHA256SUMS" | tr -d ' ')"
          echo "evidence_manifest_rows=${evidence_count}"
          echo "${TURN_ID}_COMPLETE: immutable 7+449 exact-filter gate executed; semantic interpretation deferred to mandatory Review."

      - name: Record final workflow status
        if: always()
        shell: bash
        run: |
          set +e
          LOG="${RUNNER_TEMP}/${TURN_ID}.log"
          {
            echo "final_job_status=${{ job.status }}"
            echo "finished_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } | tee -a "$LOG"

      - name: Upload result artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m6-cp1-tb5-result-${{ github.run_id }}
          path: ${{ runner.temp }}/M6-CP1-TB5-EXEC-result
          if-no-files-found: error
          retention-days: 7

      - name: Upload diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m6-cp1-tb5-log-${{ github.run_id }}
          path: ${{ runner.temp }}/M6-CP1-TB5-EXEC.log
          if-no-files-found: error
          retention-days: 7
