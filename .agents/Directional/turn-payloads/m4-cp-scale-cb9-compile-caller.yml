name: M4 CP SCALE CB9 Compile

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m4-cp-scale-cb9-compile.txt

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: m4-cp-scale-cb9-compile-${{ github.ref }}
  cancel-in-progress: false

jobs:
  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m4-cp-scale-cb9-compile
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  compile:
    uses: ./.github/workflows/agent-compile-reusable.yml
    with:
      source_sha: 939db1d0bcf7c0d3be8d0960b994c1d53d0a1edf
      targets: directional_surface_cell_authority_kernel_tests directional_surface_cell_producer_tests directional_surface_cell_completion_tests directional_surface_cell_validation_tests
      artifact_prefix: m4-cp-scale-cb9
    secrets: inherit
