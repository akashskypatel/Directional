    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m3-cp4c2-cb8-closeout-apply/**

permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

concurrency:
  group: m3-cp4c2-cb8-closeout-apply-${{ github.ref }}
  cancel-in-progress: false

jobs:
  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m3-cp4c2-cb8-closeout-apply
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  apply:
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1XJfPoyjHKQWyHjcfpZm1XZEglEd-VwiL
      patch_sha256: 967c9c176ab48b71c748770f178a42df5fbb97905367f58d1e49bc6b93fe0219
      base_sha: 5ea51806cddb55515b329ce0d3ba8d7b7bd6cf78
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: "docs: close M3-CP4c-2-CB8 and freeze R9 plan"
    secrets: inherit
