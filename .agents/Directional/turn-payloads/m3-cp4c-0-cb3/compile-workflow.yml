name: Agent M3 CP4c 0 CB3 Compile

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m3-cp4c-0-cb3-compile/run.txt

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: agent-m3-cp4c-0-cb3-compile-${{ github.ref }}
  cancel-in-progress: false

jobs:
  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m3-cp4c-0-cb3-compile
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  focus:
    uses: ./.github/workflows/agent-compile-reusable.yml
    with:
      source_sha: b135e219ee9269a73eaee32992d80c3921318011
      targets: directional_surface_cell_producer_tests
      artifact_prefix: m3-cp4c-0-cb3-focus
    secrets: inherit

  full:
    needs: focus
    uses: ./.github/workflows/agent-compile-reusable.yml
    with:
      source_sha: b135e219ee9269a73eaee32992d80c3921318011
      targets: directional_core directional_pipeline directional_surface_cell_authority_kernel_tests directional_surface_cell_producer_tests directional_surface_cell_completion_tests directional_surface_cell_validation_tests directional_compiled_api_tests directional_benchmarks
      artifact_prefix: m3-cp4c-0-cb3-authoritative
    secrets: inherit
