name: M4 CP2 TB1 Closeout Apply

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m4-cp2-tb1-closeout-apply/trigger.txt

permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

concurrency:
  group: m4-cp2-tb1-closeout-apply-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/agent-m4-cp2-tb1-closeout-apply.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m4-cp2-tb1-closeout-apply
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  apply:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1LSKbTNqJK6uDBDMCKEgWcYqdvEH8qjfp
      patch_sha256: 60a112d8ea7896162a9eb7538291cdeb7bf4022ff08c9f480a81a3d8b13b4b67
      base_sha: f25519542b7bb4202673fa1abe35a5b3359c5135
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: 'docs: record M4-CP2-TB1 execution evidence'
      retention_days: 14
    secrets: inherit
