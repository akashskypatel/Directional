name: M4 CP-COND CB1 Apply Compile

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m4-cp-cond-cb1-drive-apply.txt
      - .agents/connector-triggers/m4-cp-cond-cb1-compile.txt

permissions:
  actions: write
  contents: write
  id-token: write
  issues: write
  pull-requests: write

concurrency:
  group: m4-cp-cond-cb1-orchestration-${{ github.ref }}
  cancel-in-progress: false

jobs:
  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m4-cp-cond-cb1-orchestration
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  apply-drive-patch:
    if: "${{ github.event.head_commit.message == 'chore(agent): trigger M4-CP-COND-CB1 Drive apply' }}"
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1cfRK5mjj6PCkyEfbzYo9aJAQZPcVQUsk
      patch_sha256: dd641f1245c7aecb73f1db450460305677a52f3fc84e8d9e9995d6133513c780
      base_sha: a64e371bbd2e98b8df0d19f279c27c93a327c444
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: "M4-CP-COND-CB1: implement input conditioner seam"
      retention_days: 14
    secrets: inherit

  compile:
    if: "${{ github.event.head_commit.message == 'chore(agent): trigger M4-CP-COND-CB1 compile' }}"
    uses: ./.github/workflows/agent-compile-reusable.yml
    with:
      source_sha: ${{ github.event.before }}
      targets: directional_pipeline directional_surface_cell_producer_tests directional_compiled_api_tests
      artifact_prefix: m4-cp-cond-cb1
    secrets: inherit
