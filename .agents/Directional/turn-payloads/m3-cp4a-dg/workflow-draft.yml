      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m4-cp-cond-tb1-closeout-drive.txt

permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

concurrency:
  group: m4-cp-cond-tb1-closeout-drive-${{ github.ref }}
  cancel-in-progress: false

jobs:
