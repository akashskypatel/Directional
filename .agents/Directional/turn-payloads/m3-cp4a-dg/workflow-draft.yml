      pr_number: 8
      label: m4-cp-cond-tb1-closeout-drive
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  apply:
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1MzjMCNr00EtppjFeu9MUy0hQBzcFnNjL
      patch_sha256: c80d9d270c165fe9c5d217f56f9869c12dd091463a6788532f6a56ab6cd885cc
      base_sha: 4cb89adb72277e4307c16fa869e2bff1aeb1a590
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: "docs: close out M4-CP-COND-TB1-EXEC"
      retention_days: 7
    secrets: inherit
