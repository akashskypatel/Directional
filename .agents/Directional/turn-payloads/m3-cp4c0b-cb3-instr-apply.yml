name: Agent M3 CP4c0b CB3 Closeout Apply

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m3-cp4c0b-cb3-instr-apply/run.txt

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

concurrency:
  group: agent-m3-cp4c0b-cb3-instr-apply-${{ github.ref }}
  cancel-in-progress: false

jobs:
  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m3-cp4c0b-cb3-closeout-apply
      commit_run_file: false
    secrets: inherit

  apply:
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1uIfychmSQp1jGyMG3ULrBbKl4uqiEFn4
      patch_sha256: 7fae50c21de83bafe67c5a140ab9066588da55243b37d06a639cf2fd20a67960
      base_sha: eb627c822899f628ce732f0a756d77976af698c4
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: "docs(M3-CP4c-0b): close CB3 instrumentation build"
      retention_days: 7
    secrets: inherit
