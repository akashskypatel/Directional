name: M4 CP4 TB2 R1 Artifact-Only Execution

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m4-cp4-tb2-r1-exec-20260919.txt

permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: m4-cp4-tb2-r1-exec-agent-surface-cell-quad
  cancel-in-progress: false

jobs:
  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m4-cp4-tb2-r1-exec
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/m4-cp4-tb2-r1-exec.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  execute:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Initialize persistent activity log
        shell: bash
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/m4-cp4-tb2-r1.log"
          : > "$log"
          {
            echo "workflow=${GITHUB_WORKFLOW}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "event=${GITHUB_EVENT_NAME}"
            echo "event_sha=${GITHUB_SHA}"
            echo "ref=${GITHUB_REF}"
            echo "repository=${GITHUB_REPOSITORY}"
            echo "runtime_boundary=artifact-only"
            echo "started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } | tee -a "$log"

      - name: Checkout exact control authority
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          submodules: false
          lfs: false
          token: ${{ secrets.GH_TOKEN || github.token }}

      - name: Freeze and verify harness authority
        shell: bash
        env:
          EXPECTED_HARNESS_SHA256: '1dcdd6c6e638b0951af0af38ce2b0e34fafcc877843104e617caf175cf36aeba'
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/m4-cp4-tb2-r1.log"
          exec > >(tee -a "$log") 2>&1
          harness='.agents/Directional/turn-payloads/m4-cp4-tb2-r1-harness.sh'
          caller='.github/workflows/m4-cp4-tb2-r1-exec.yml'
          test -f "$harness"
          test -f "$caller"
          actual_harness_sha="$(sha256sum "$harness" | awk '{print $1}')"
          test "$actual_harness_sha" = "$EXPECTED_HARNESS_SHA256"
          bash -n "$harness"
          if grep -En '(^|[[:space:];|&])timeout([[:space:]]|$)|timeout-minutes' "$harness"; then
            echo 'full-gate timeout/watchdog token found in harness' >&2
            exit 2
          fi
          {
            printf 'event_sha=%s\n' "$GITHUB_SHA"
            printf 'harness_path=%s\n' "$harness"
            printf 'harness_bytes=%s\n' "$(wc -c < "$harness" | tr -d ' ')"
            printf 'harness_sha256=%s\n' "$actual_harness_sha"
            printf 'caller_path=%s\n' "$caller"
            printf 'caller_bytes=%s\n' "$(wc -c < "$caller" | tr -d ' ')"
            printf 'caller_sha256=%s\n' "$(sha256sum "$caller" | awk '{print $1}')"
            printf 'full_gate_timeout_watchdog=false\n'
          } | tee "${RUNNER_TEMP}/m4-cp4-tb2-r1-control-metadata.env"

      - name: Execute frozen immutable TB2 R1 harness
        id: harness
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
          TB2_LOG: ${{ runner.temp }}/m4-cp4-tb2-r1.log
        shell: bash
        run: |
          set +e
          bash .agents/Directional/turn-payloads/m4-cp4-tb2-r1-harness.sh
          rc=$?
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          exit "$rc"

      - name: Preserve control receipts and final source status
        if: always()
        shell: bash
        run: |
          set +e
          log="${RUNNER_TEMP}/m4-cp4-tb2-r1.log"
          out="${RUNNER_TEMP}/M4-CP4-TB2-R1-EXEC-result"
          mkdir -p "$out"
          cp "${RUNNER_TEMP}/m4-cp4-tb2-r1-control-metadata.env" "$out/control-metadata.env" 2>/dev/null || true
          {
            echo "harness_step_outcome=${{ steps.harness.outcome }}"
            echo "harness_exit_code=${{ steps.harness.outputs.exit_code }}"
            echo "final_control_sha=$(git rev-parse HEAD 2>/dev/null || echo unavailable)"
            echo "final_control_status_begin"
            git status --short 2>&1 || true
            echo "final_control_status_end"
            echo "finished_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } | tee -a "$log" > "$out/workflow-final-status.txt"

      - name: Upload TB2 R1 result evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m4-cp4-tb2-r1-result-${{ github.run_id }}
          path: ${{ runner.temp }}/M4-CP4-TB2-R1-EXEC-result
          if-no-files-found: error
          retention-days: 7

      - name: Upload TB2 R1 diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m4-cp4-tb2-r1-log-${{ github.run_id }}
          path: ${{ runner.temp }}/m4-cp4-tb2-r1.log
          if-no-files-found: error
          retention-days: 7

      - name: Propagate orchestration failure
        if: ${{ always() && steps.harness.outcome == 'failure' }}
        env:
          HARNESS_EXIT: ${{ steps.harness.outputs.exit_code }}
        shell: bash
        run: |
          echo "TB2 R1 harness failed with exit ${HARNESS_EXIT:-unknown}" >&2
          exit 1
