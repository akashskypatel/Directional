name: M3 CP4c0 TB-R5 Artifact-Only Gate

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m3-cp4c0-tb-r5/run.txt

permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: m3-cp4c0-tb-r5-${{ github.ref }}
  cancel-in-progress: false

jobs:
  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m3-cp4c0-tb-r5
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  test-benchmark:
    runs-on: ubuntu-24.04
    steps:
      - name: Initialize persistent activity log
        shell: bash
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/m3-cp4c0-tb-r5-activity.log"
          : > "$log"
          printf '%s\n' \
            "workflow=$GITHUB_WORKFLOW" "run_id=$GITHUB_RUN_ID" "event=$GITHUB_EVENT_NAME" \
            "event_sha=$GITHUB_SHA" "ref=$GITHUB_REF" "repository=$GITHUB_REPOSITORY" \
            'turnBoundary=Test+Benchmark-artifact-only' 'configure=false' 'compile=false' \
            'relink=false' 'repair=false' 'generatedDiscovery=false' 'performanceBenchmark=false' \
            "started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" | tee -a "$log"

      - name: Checkout exact control source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          token: ${{ secrets.GH_TOKEN || github.token }}

      - name: Verify and stage immutable TB-R5 control payload
        shell: bash
        run: |
          set -euo pipefail
          p1='.agents/Directional/turn-payloads/m3-cp4c0-tb-r5-part1.sh'
          p2='.agents/Directional/turn-payloads/m3-cp4c0-tb-r5-part2.sh'
          p3='.agents/Directional/turn-payloads/m3-cp4c0-tb-r5-part3.sh'
          test "$(sha256sum "$p1" | awk '{print $1}')" = '0c4249fceaf289abaa675b8fd14cfb9d26885c59847d1b184d1a2f72f76ae241'
          test "$(sha256sum "$p2" | awk '{print $1}')" = '0fbe8565deb6d05c0617e58c2b270958eac4dbe8c87d0701be3679ee4b1c15bd'
          test "$(sha256sum "$p3" | awk '{print $1}')" = '8d91d9a2717459abff6e3fd6793c45cb9dc00a679f6f211e5329fd43c469e49d'
          cat "$p1" "$p2" "$p3" > "${RUNNER_TEMP}/m3-cp4c0-tb-r5.sh"
          test "$(sha256sum "${RUNNER_TEMP}/m3-cp4c0-tb-r5.sh" | awk '{print $1}')" = '3e2f58bd79d12bb0abad572d0a52874c56e8688deb0b97f647f239c7bf6a4b05'
          chmod 700 "${RUNNER_TEMP}/m3-cp4c0-tb-r5.sh"

      - name: Execute immutable artifact-only TB-R5 gate
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: "${RUNNER_TEMP}/m3-cp4c0-tb-r5.sh"

      - name: Record final control status
        if: always()
        shell: bash
        run: |
          set +e
          printf '%s\n' "final_job_status=${{ job.status }}" \
            "finished_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            | tee -a "${RUNNER_TEMP}/m3-cp4c0-tb-r5-activity.log"

      - name: Upload TB-R5 result evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-cp4c0-tb-r5-result-${{ github.run_id }}
          path: ${{ runner.temp }}/m3-cp4c0-tb-r5-result
          if-no-files-found: error
          retention-days: 7

      - name: Upload TB-R5 diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-cp4c0-tb-r5-log-${{ github.run_id }}
          path: ${{ runner.temp }}/m3-cp4c0-tb-r5-activity.log
          if-no-files-found: error
          retention-days: 7
