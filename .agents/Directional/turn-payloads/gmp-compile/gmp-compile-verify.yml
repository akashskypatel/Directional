name: GMP Compile Verification

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/gmp-compile-verify-20260826.txt

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: gmp-compile-verify-20260826
  cancel-in-progress: false

jobs:
  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: gmp-compile-verify
      commit_run_file: false
    secrets: inherit

  compile:
    uses: ./.github/workflows/agent-compile-reusable.yml
    with:
      source_sha: ${{ github.sha }}
      artifact_prefix: gmp-compile-verify
    secrets: inherit
