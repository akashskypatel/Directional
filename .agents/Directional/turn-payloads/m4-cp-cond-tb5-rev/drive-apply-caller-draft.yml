name: Agent M4 CP-COND TB5 Review Closeout Apply

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m4-cp-cond-tb5-rev-drive-apply/run.txt

permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

concurrency:
  group: agent-m4-cp-cond-tb5-rev-drive-apply-${{ github.ref }}
  cancel-in-progress: false

jobs:
  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m4-cp-cond-tb5-rev-drive-apply
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  apply:
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 18yUAVHgMil0T0MYjX_tsVawdh935K-DL
      patch_sha256: '5eca77b9685260ca94b606b8d20d8df20ab1f59a38f8296ce1eeaa4639d3d19f'
      base_sha: c1fe3ede0c60226bc05b237cc673f30158448789
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: 'docs: accept TB5 and close CP-COND'
      retention_days: 14
    secrets: inherit
