name: M3 CP4c2 R7 EXEC Closeout Apply

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/r7-closeout-apply.txt

permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

concurrency:
  group: m3-cp4c2-r7-exec-closeout-apply
  cancel-in-progress: false

jobs:
  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m3-cp4c2-r7-closeout-apply
      commit_run_file: false
    secrets: inherit

  apply-drive-patch:
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1nbyacsa0PZUTb3IlPUfBAmXq3LxdXMvw
      patch_sha256: 3de8476188490ed55809a5f8baa6f7ed60e44ad297b8d23a0540967352ffb611
      base_sha: b60e785c459c04ac9a4c51afbd8d1f740c1cf22a
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: "docs(M3-CP4c-2): preserve R7 preflight hard-stop evidence"
      retention_days: 14
    secrets: inherit
