name: M3 CP4c2 TB X2 R4 EXEC

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m3-cp4c2-tb-x2-r4-exec/run.txt

permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: m3-cp4c2-tb-x2-r4-exec
  cancel-in-progress: false

jobs:
  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m3-cp4c2-r4-exec
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  runtime:
    runs-on: ubuntu-24.04
    steps:
      - name: Fetch exact R4 execution payload
        env:
          PAYLOAD_BLOB_SHA: d9e00bbf2cbb548a62eed3771d7e372b7e18cae9
        shell: bash
        run: |
          set -euo pipefail
          f="${RUNNER_TEMP}/m3-cp4c2-r4-exec.sh"
          url="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}/.agents/Directional/turn-payloads/m3-cp4c2-r4-exec.sh"
          curl -fsSL "$url" -o "$f"
          actual="$({ printf 'blob %s\0' "$(wc -c < "$f")"; cat "$f"; } | sha1sum | cut -d' ' -f1)"
          test "$actual" = "$PAYLOAD_BLOB_SHA"
          bash -n "$f"

      - name: Execute frozen R4 artifact-only plan
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: bash "${RUNNER_TEMP}/m3-cp4c2-r4-exec.sh"

      - name: Record final job context
        if: always()
        shell: bash
        run: |
          set +e
          log="${RUNNER_TEMP}/m3-cp4c2-r4-exec.log"
          out="${RUNNER_TEMP}/m3-cp4c2-r4-exec-result"
          mkdir -p "$out"; touch "$log"
          echo "final_job_context=${{ job.status }}" | tee -a "$log"
          test -f "$out/status.txt" || echo orchestration-failure > "$out/status.txt"

      - name: Upload R4 result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-cp4c2-tb-x2-r4-exec-result-${{ github.run_id }}
          path: ${{ runner.temp }}/m3-cp4c2-r4-exec-result
          if-no-files-found: error
          retention-days: 7

      - name: Upload R4 diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-cp4c2-tb-x2-r4-exec-log-${{ github.run_id }}
          path: ${{ runner.temp }}/m3-cp4c2-r4-exec.log
          if-no-files-found: error
          retention-days: 7

      - name: Enforce semantic result
        if: always()
        shell: bash
        run: |
          test "$(cat "${RUNNER_TEMP}/m3-cp4c2-r4-exec-result/status.txt" 2>/dev/null)" = semantic-pass
