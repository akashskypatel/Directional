name: M3 CP4c3 TB7 Artifact Only

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m3-cp4c3-tb7-20260901.txt

permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: m3-cp4c3-tb7-artifact-only
  cancel-in-progress: false

jobs:
  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m3-cp4c3-tb7
      commit_run_file: false
    secrets: inherit

  validate-caller:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/m3-cp4c3-tb7-20260901.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  tb7:
    needs: validate-caller
    if: ${{ needs.validate-caller.outputs.valid == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Initialize persistent TB7 log
        shell: bash
        run: |
          set -euo pipefail
          work="${RUNNER_TEMP}/m3-cp4c3-tb7"
          mkdir -p "$work/result"
          log="$work/tb7.log"
          : > "$log"
          {
            echo "workflow=${GITHUB_WORKFLOW}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "event=${GITHUB_EVENT_NAME}"
            echo "event_sha=${GITHUB_SHA}"
            echo "control_checkout_only=true"
            echo "semantic_source=e5d6ed76cfb4e0dc21e39aa8d3fc5de98fd5595a"
            echo "package_artifact_id=9811964367"
            echo "selector=374"
            echo "benchmarkExecution=false"
            echo "configureExecution=false"
            echo "compileExecution=false"
            echo "relinkExecution=false"
            echo "packageRepair=false"
            echo "generatedDiscovery=false"
            echo "started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            uname -a
          } | tee -a "$log"
      - name: Checkout exact control scripts only
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Immutable package 76 preflight
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: bash .agents/Directional/turn-payloads/m3cp4c3-tb7-preflight.sh
      - name: Run ordered gate and full zero-credit remainder
        shell: bash
        run: bash .agents/Directional/turn-payloads/m3cp4c3-tb7-runtime.sh
      - name: Immutable postflight
        shell: bash
        run: bash .agents/Directional/turn-payloads/m3cp4c3-tb7-postflight.sh
      - name: Upload TB7 result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-cp4c3-tb7-result-${{ github.run_id }}
          path: ${{ runner.temp }}/m3-cp4c3-tb7/result
          if-no-files-found: error
          retention-days: 14
      - name: Upload persistent TB7 log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-cp4c3-tb7-log-${{ github.run_id }}
          path: ${{ runner.temp }}/m3-cp4c3-tb7/tb7.log
          if-no-files-found: error
          retention-days: 14
