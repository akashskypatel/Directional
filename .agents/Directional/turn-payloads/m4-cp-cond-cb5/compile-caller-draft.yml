name: Agent M4 CP-COND CB5 Compile

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m4-cp-cond-cb5-compile-20260913.txt

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: agent-m4-cp-cond-cb5-compile-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/agent-m4-cp-cond-cb5-compile.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m4-cp-cond-cb5-compile
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  prepackage-compile:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-compile-reusable.yml
    with:
      source_sha: 07984711db59eaa228820e7d44e5552a652edadf
      targets: directional_surface_cell_producer_tests
      artifact_prefix: m4-cp-cond-cb5-prepackage
    secrets: inherit

  package-compile:
    needs:
      - validate
      - prepackage-compile
    if: ${{ needs.validate.outputs.valid == 'true' && needs.prepackage-compile.result == 'success' }}
    uses: ./.github/workflows/agent-compile-reusable.yml
    with:
      source_sha: 07984711db59eaa228820e7d44e5552a652edadf
      targets: directional_core directional_pipeline directional_surface_cell_authority_kernel_tests directional_surface_cell_producer_tests directional_surface_cell_completion_tests directional_surface_cell_validation_tests directional_benchmarks
      artifact_prefix: m4-cp-cond-cb5-package
    secrets: inherit
