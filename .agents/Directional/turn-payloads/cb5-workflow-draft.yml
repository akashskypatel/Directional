name: M3 CP4c2 CB5 Compile and Package

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/cb5-compile.txt

permissions:
  contents: write
  actions: write
  issues: write
  pull-requests: write

concurrency:
  group: m3-cp4c2-cb5-compile
  cancel-in-progress: false

jobs:
  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m3-cp4c2-cb5-compile
      commit_run_file: false
    secrets: inherit

  owner-compile:
    uses: ./.github/workflows/agent-compile-reusable.yml
    with:
      source_sha: 755485865a7cf9c485d754f22b82a41ee151824b
      targets: directional_surface_cell_producer_tests
      artifact_prefix: m3-cp4c2-cb5-owner-compile

  package-compile:
    needs: owner-compile
    uses: ./.github/workflows/agent-compile-reusable.yml
    with:
      source_sha: 755485865a7cf9c485d754f22b82a41ee151824b
      targets: directional_core directional_pipeline directional_surface_cell_authority_kernel_tests directional_surface_cell_producer_tests directional_surface_cell_completion_tests directional_surface_cell_validation_tests directional_compiled_api_tests directional_benchmarks
      artifact_prefix: m3-cp4c2-cb5-package
