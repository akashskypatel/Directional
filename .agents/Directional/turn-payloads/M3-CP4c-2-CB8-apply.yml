    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/m3-cp4c2-cb8-apply/**

permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

concurrency:
  group: m3-cp4c2-cb8-apply-${{ github.ref }}
  cancel-in-progress: false

jobs:
  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m3-cp4c2-cb8-apply
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  apply:
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1HqYzKI-usqNgNWMMe_A3sWzW-A4QvHOS
      patch_sha256: e127a2ebd8f90f98a9df97124c6d6c74a7fc064024ed9e29f021ff7cf3dc70e3
      base_sha: 666e8a3499cd69089ea0b963018236959aeca99c
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: "test: correct M3-CP4c-2 cut-graph witnesses"
    secrets: inherit
