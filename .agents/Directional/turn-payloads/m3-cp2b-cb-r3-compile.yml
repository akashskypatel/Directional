name: Agent M3 CP4c3 TB22 Closeout Apply

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/tb/m3-cp4c3-tb22-closeout-apply.txt

permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

concurrency:
  group: agent-m3-cp4c3-tb22-closeout-apply
  cancel-in-progress: false

jobs:
  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: m3-cp4c3-tb22-closeout-apply
      commit_run_file: false
      trim_stale_comments: false
    secrets: inherit

  validate:
    uses: ./.github/workflows/agent-workflow-schema-validator-reusable.yml
    with:
      workflow_path: .github/workflows/agent-m3-cp4c3-tb22-closeout-apply.yml
      source_ref: ${{ github.sha }}
    secrets: inherit

  apply:
    needs: validate
    if: ${{ needs.validate.outputs.valid == 'true' }}
    uses: ./.github/workflows/agent-google-drive-reusable.yml
    with:
      file_id: 1LBPCChAQzTa3lPzVhgUoD_t1eGDMllaX
      patch_sha256: '20786b75281762f3d11d0f43664c8f257f958d5bc24dde03077c76ddaa025e36'
      base_sha: 6364906df051b100c4296f0536b1bee606db8f08
      target_branch: agent/surface_cell_quad/p5-recover-bridge-healing
      commit_message: 'docs: close M3-CP4c-3-TB22 and route to independent review'
      retention_days: 14
    secrets: inherit
