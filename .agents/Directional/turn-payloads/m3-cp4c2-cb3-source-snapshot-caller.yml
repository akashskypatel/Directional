name: Temporary Source Snapshot M3 CP4c2 CB3

on:
  push:
    branches:
      - agent/surface_cell_quad/p5-recover-bridge-healing
    paths:
      - .agents/connector-triggers/source-snapshot-m3-cp4c2-cb3-20260828.txt

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: temp-source-snapshot-m3-cp4c2-cb3
  cancel-in-progress: false

jobs:
  observe:
    uses: ./.github/workflows/agent-run-observer-reusable.yml
    with:
      pr_number: 8
      label: source-snapshot-m3-cp4c2-cb3
      commit_run_file: false
      trim_stale_comments: true
    secrets: inherit

  snapshot:
    uses: ./.github/workflows/agent-source-snapshot.yml
    with:
      source_ref: 3703a398eebe9b67f6a18bbba2d441f927cbcec7
      artifact_prefix: agent-source-snapshot-m3-cp4c2-cb3
      retention_days: 7
    secrets: inherit
